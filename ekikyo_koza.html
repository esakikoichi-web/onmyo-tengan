もとより人為だが、煮炊きして物を成すにはこのような形でなければならない。これは人為ではなく自然である。井も同じである。器が卦より先にあっても、取るところは卦の象であり、卦もまた器を用いて義とする。</li><li>本田の講説：繋辞伝には、昔の聖人が物を発明する時に卦のシンボルが先にあったと書いてあるのに、程伝の初めに「この卦は鼎の形に基づいて作った」とあるので、ある人が噛み付いたのである。伊川は「卦と器の先後は事の本質に関わらない、どちらが先でもかまわん」と言う。</li></ul>\n<h3 id=\"g50-s1\">卦辞</h3>\n<div class=\"orig\">鼎、元吉、亨。</div>\n<div class=\"yomi\">鼎は元いに亨る。</div>\n<p>この卦が出たら願いごとは大いに通る。「吉」の字は誤って入ったと注にあるので省いて読む。</p>\n<p><span class=\"tag\">程伝</span>卦の才（働き）で言う。卦の才のようであれば元いに亨ることができる。ただ「元亨」と言うべきで、「吉」の字は衍字（余計な字）である。卦の才で元亨を招くことはできても、すぐさま「元吉」とは言えない。彖伝はただ「元亨」と言っており、「吉」の字が余計なことは明らかである。</p>\n<h3 id=\"g50-s2\">彖伝</h3>\n<div class=\"orig\">鼎、象也。以木巽火、亨飪也。聖人亨以享上帝、而大亨以養聖賢。巽而耳目聰明、柔進而上行、得中而應乎剛、是以元亨。</div>\n<div class=\"yomi\">鼎は象なり。木を以て火に巽（い）れて亨飪（ほうじん）するなり。聖人亨（に）て以て上帝に享（きょう）し、大いに亨て以て聖賢を養う。巽にして耳目聡明、柔進んで上り行き、中を得て剛に応ず。是を以て元いに亨る。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦が鼎であるのは鼎の象を取る。鼎という器は卦の象に法る。象があって器があり、卦はまた器を用いて義とする（本田によれば、先ほどと逆のことを言うのは、ある人の質問に多少遠慮したのであろう。先後どちらでもよいことになる）。鼎は大器であり重宝である。だからその制作・形作りの寸法は最も厳しい。「鼎」の名は「正」に通じ、古人は鼎を「方」と訓じた（本田は出典がどこかわからないと言う）。方は正である。形で言えば、耳は上で向かい合い、足は下で分かれて峙ち、周囲・内外・高低・厚薄すべて寸法があって至って正しい。至正であって初めて安らかでどっしりした象をなす。だから鼎は法象の器（皆が法りかたどるべき器）で、卦はその象を取ったのである。</li><li>上下二体で鼎の用を言う。「木を以て火に巽る」とは木を火に入れること、煮炊きするゆえんである。鼎は生きとし生けるものが頼る至って大切なものである。その用の大きさを極めれば、聖人は煮て上帝に供え、大いに煮て聖賢を養う。聖人とは古の聖王、「大いに」とはその広さを言う。</li><li>上に鼎の用を言い、ここでは卦の才で言う。人がよく卦の才のようであれば元亨を致せる。下体の巽は理に巽順すること、離は明で上にいて中が虚なので、耳目聡明の象である。離が上にある卦では、彖伝はみな「柔進んで上り行く」と言う。柔は下にあるべきものなのに尊位にいる、これが進んで上り行くことである。明で尊位にいて中道を得、剛（九二）に応じる。柔の君がよく剛陽の臣の道を用いるのである。五が中にいて剛に応じるのが中道を得ること。その才がこのようなので、元いに亨る。</li></ul>\n<h3 id=\"g50-s3\">大象</h3>\n<div class=\"orig\">木上有火、鼎。君子以正位凝命。</div>\n<div class=\"yomi\">木の上に火有るは鼎なり。君子以て位を正し、命を凝（かた）む。</div>\n<p>木の上に火があるのが鼎である。君子は鼎のどっしりとした正しい形にのっとって、自分の位にぴたりと座り、命令を安定させ重々しくする。</p>\n<p><span class=\"tag\">程伝</span>「木の上に火有り」とは、木を火に入れること、煮炊きの象である。だから鼎という。君子は鼎の象を観て、位を正し命を凝む。鼎は法象の器で、形は端正、体は安重である。その端正の象を取って、自分のいる位を正す。君子は身の処し方で必ず小さなことまで正す。「席正しからざれば坐せず」（『論語』郷党篇）、「跛（かたよ）る毋れ、倚る毋れ」（『礼記』曲礼。横座りするな、寄り掛かって立つな）がそれである。その安重の象を取って、命令を凝む、つまり安らかに重々しくする。「凝」とは聚止（緊め止まる）の意味で、安重のことである。今の世俗に「凝然」という語がある。命令について言うだけで、およそすべての動作がみな安重であるべきである。本田によれば、「凝然」は宋代の口語で、命令する時に副詞として用いたらしいが、用例は見つからない。</p>\n<h3 id=\"g50-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>鼎は権力の象徴。</b> 受講者が「鼎には聖賢を養う意味もあるんですね」と言うと、本田は、鼎は権力の象徴でもあり、王様が競って立派な鼎を持とうとした時期がある、鼎の胴体に法律の文章を彫り込んだ話も『左伝』にある、と答えた。</li><li><b>卦から作った器（繋辞伝）。</b> 受講者の問いに答えて本田は、繋辞伝によれば、牛馬に重い物を運ばせるのは随の卦、関所を作って乱暴する客を待ち受けるのは豫の卦、弓矢の発明は睽の卦、穴住まいを家に替えたのは大壮の卦、薪で包んで野に捨てた死者を棺桶で葬るのは大過の卦、縄の結び目の記録を文字に替えたのは夬の卦にかたどった、と説明した。</li><li><b>井と鼎の上爻。</b> 井と鼎はどちらも中身を上へ出すことが仕事で、上爻が最もよい。ただ井の上六は「元吉」、鼎の上九は「大吉」である。程伝は、井は水を上に出すことが用で、広く施して恒常の徳があるので元吉、鼎は煮炊きを功とし、上にいることを成徳とするので井とは異なり、剛柔が節度を得ているので大吉だ、と説く。受講者の問いに、本田は元吉の方が良いと答えた。</li><li><b>「仇」の意味。</b> 九二の「我が仇」について、「仇」は必ずしも悪意を持つ相手ではなく、対偶（相手）の意味である。</li></ul>\n<h3 id=\"g50-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>大いに願いが通る。正しい位に座り、言動を重々しく安定させよ。</li><li>古い悪いものを吐き出して新しくするのは良い（初六）。</li><li>才能があっても、付きまとう不正な相手を遠ざけ、行き先を慎め（九二）。</li><li>今は認められなくても、才を包んで道を守れば最後は君と和合して吉（九三）。</li><li>任に堪えない人物を用いれば、大事を覆して大恥をかく。大凶（九四）。</li><li>上九は剛柔の節度を得て大吉。</li></ul><h2 class=\"sec\" id=\"g50-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">鼎顛趾、利出否。得妾以其子、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">鼎、趾（あし）を顛（さかしま）にす。否（あし）きを出すに利あり。妾を得て其の子に以（およ）ぶ。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鼎顛趾、未悖也。利出否、以從貴也。」（鼎趾を顛にすとは、未だ悖らざるなり。否きを出すに利ありとは、以て貴に従うなり。）</div>\n<p>鼎が足を上にしてひっくり返った。腐った中身を出してしまうという良さがある。良き妾を得、その助けで主人にまで幸いが及ぶ。咎はない。</p>\n<p><span class=\"tag\">程伝</span>六は鼎の下にいて、趾（足）の象である。上は四に応じ、足が上に向かうのは顛る象である。鼎が覆れば中身をぶちまける。順道ではない。しかし顛すべき時もある。悪い物を傾け出して潔くし、新しい物を取るならよい。だから顛趾の利は否を出すことにある。否とは悪い物である。四は君に近い大臣の位で、初は下にいる者で四に応じる。上が下に求め、下が上に従うのである。上がよく下の善を用い、下がよく上の為を補えば、事の功を成す。かえって善道である。鼎の趾を顛にするように、まさに顛すべき時があり、必ずしも理に悖るとは言えない。「妾を得て其の子に以ぶ。咎无し」とは、初六は陰で卑しいので妾という。妾を得るとは良い人を得ることで、良い妾を得ればその主人を補助し咎をなくさせる。子とは主人のこと、「其の子に以ぶ」とは主人を咎のない状態にさせることである。初六は陰で下にいて、巽（へりくだる）で陽に従う、妾の象である。上の四に応じるのは顛覆のようだが、それに託してこの義を発した。初六は本来取るべき才徳がないので、妾を得ると言う。しかるべき人を得ればこのようになるという意味である。</p>\n<p><span class=\"tag\">象伝について程伝</span>鼎が覆って趾が上になるのは悖った道のようだが、必ずしも悖るのではない。否悪を傾け出すべき時があるからである。古いものを出して新しいものを入れ、悪しきを下して美しきを受ける、これが貴に従う義である。初六は四に応じ、貴人に従う者である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ひっくり返るような出来事だが、古く悪いものを一掃して新しくする好機。良い協力者を得れば、上の者にも福が及ぶ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">鼎有實、我仇有疾、不我能即、吉。</span></summary><div class=\"body\"><div class=\"yomi\">鼎に実有り。我が仇（あいて）疾（やまい）有り。我に即（つ）く能わず。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鼎有實、慎所之也。我仇有疾、終无尤也。」（鼎に実有りとは、之く所を慎むなり。我が仇疾い有りとは、終に尤（とが）无きなり。）</div>\n<p>鼎の中に中身がある。わたしの相手が病気をして、わたしに取り付くことができない。吉。</p>\n<p><span class=\"tag\">程伝</span>二は剛実で中にいる。鼎の中に実がある象である。鼎の実は上に出てこそ用となる。二は陽剛で用をなす才があり、五と相応じている。上に六五の君に従えば正を得て、その道は亨る。しかし初とは密接に比している。陰は陽に従うものである。二は中にいて中（五）に応じており、正を失うには至らない。自らを守っても、初は必ず求めてくる。だから戒めて、よく初を遠ざけて自分に就かせなければ吉だという。「仇」とは相対する者で、陰陽は相対するので初を指す。初に従えば正でなく義を害する。これが「疾い有り」である。二は正で自らを守り、初が自分に就けないようにすべきである。人がよく正で自らを守れば、不正は就くことができない。吉なるゆえんである。</p>\n<p><span class=\"tag\">象伝について程伝</span>鼎に実があるとは、人に才業があることである。趣くところを慎まなければ、不義に陥る。二が初に比さず、正応の五に従えば、之く所を慎んだのである。「我が仇疾い有り」とは、初は自分に比そうとするが、陰で陽位にいて不正、これが疾いである。二が正で自らを守れば、初は就けない。だから終に尤（咎）がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才能も実力もある時。言い寄る不正な相手には近づかず、行き先を慎めば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">鼎耳革、其行塞、雉膏不食。方雨虧悔、終吉。</span></summary><div class=\"body\"><div class=\"yomi\">鼎の耳革まる。其の行塞がる。雉の膏（あぶら）あれど食らわれず。方に雨ふらんとして悔いを虧（か）く。終に吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鼎耳革、失其義也。」（鼎の耳革まるとは、其の義を失すればなり。）</div>\n<p>鼎の耳が取れてしまった。持ち上げようとしても動かせない。鼎の中にキジの脂身があるが食べられない。しかしやがて君主と和合するであろう（「雨ふる」とは和合の意味）。役不足の悔いがあったが、ついには認められて吉。本田はこの辞はなかなか面白いと言う。</p>\n<p><span class=\"tag\">程伝</span>鼎の耳は六五で、鼎の主である。三は陽で巽の上にいて、剛でよく巽（謙遜）、その才は務めを果たすに足る。しかし五と正応でなく、居場所を共にしない。五は中だが正でなく（陰が陽位）、三は正だが中でない。同じでないのは、まだ君に得られない者である。君に得られなければ、その道はどうして行われよう。革は変革、異なることで、三と五が異なって合わない。「其の行塞がる」とは君に合わず、その任を得ず、用を施すところがないこと。膏は甘美なもので禄位の象、雉は五を指し、文明の徳がある（離の中で文明、雉は模様が明らか）ので雉という。三は才があるのに六五の禄位を得ない、雉の膏を得て食らわないのである。君子はその徳を蘊めば久しくして必ず彰れ、その道を守れば終わりには必ず亨る。五は聡明の象があり、三は上に進もうとする物である。陰陽が交われば和合して雨となる。「方に雨ふらんとす」とは、五と三がまさに和合しようとすることである。「悔いを虧く、終に吉」とは、役不足の悔いがあっても終には吉を得ること。三は才を懐いて不遇なので不足の悔いがある。しかし陽剛の徳があり、上は聡明で下は巽正なので、終には必ず合う。だから吉である。三は中でないが巽の体なので剛に過ぎる失はない。もし剛に過ぎれば、どうして終に吉であろう。</p>\n<p><span class=\"tag\">象伝について程伝</span>始め鼎の耳と異なるのは、相求める義（求め方）を失ったからである。五と正応でないのに合うことを求めるのは、その義を失うことで、中でないのは同志でない象である。だからその道は塞がって通じない。しかし上は明らかで下は才がある。終には必ず和合する。だから方に雨ふらんとして吉なのである。</p>\n<p>本田の講説：受講者が「本当なら対応関係にあるのは三と上ですよね」と言うと、本田は、三と上、二と五が対応関係で、なぜここで五を持ち出したかというと、上を見ると陰が五しかないので、本来二の相手である五に色目を使う、割り込もうとするといったニュアンスなのであろう、と答えた。キジは良い鳥かという問いには、昔、武士階級の人が君主に初めてお目見えする時の手土産は必ずキジと決まっていた、キジは捕らえられても絶対に餌を食べないので節を守る意味でそうした、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才能があるのに上と合わず、用いられず役不足をかこつ。道を守って待てば、やがて和合して吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">鼎折足、覆公餗、其形渥、凶。</span></summary><div class=\"body\"><div class=\"yomi\">鼎、足を折り、公の餗（こながき）を覆す。其の形渥（あく）たり。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「覆公餗、信如何也。」（公の餗を覆す、信に如何ぞや。）</div>\n<p>鼎が足を折って、中身の殿様のお粥をひっくり返した。餗（こながき）は蕎麦がきと同じように粉を練ったもの。鼎自身が恥じ入って真っ赤になり、汗をだらだら流す。凶。大変悪い判断である。</p>\n<p><span class=\"tag\">程伝</span>四は大臣の位で、天下の事を任される者である。天下の事はどうして一人で担えよう。必ず天下の賢智を求めて力を合わせるべきである。その人を得れば、天下の治は労せずして致せる。用いる者がその人でなければ、国家の事を敗り、天下の患いを残す。四は下の初に応じるが、初は陰柔の小人で用いるべきでない者である。それを四が用いた。任に堪えず事を敗るのは、鼎が足を折るようなものである（初はちょうど足の位置）。足を折れば公上の餗を覆す。餗とは鼎の実（中身）である。大臣の位で天下の任に当たりながら、用いる人がその人でなく、覆敗に至る。任に堪えないので、甚だ恥ずべきである。「其の形渥たり」とは赧汗（真っ赤になって汗が流れる）のことで、その凶は知れている。繋辞伝に「徳薄くして位尊く、知小にして謀大に、力少なくして任重ければ、及ばざること鮮し」とある。任に堪えないことを言う。贔屓する者に蔽われるのは、徳が薄く知が小さいからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>大臣が天下の任に当たり、必ず天下の治安を成し遂げれば、君上の信ずるところ、下民の望むところ、自分が身を致し道に任ずる志を誤らない。期待するところを失わないのが、いわゆる信である。そうでなければ職を失い、上の委任を誤る。信と言えようか。だから「如何ぞや」と言う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>重責を負いながら、ふさわしくない人を用いて大失敗し、面目を失う。大凶。人選を誤るな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">鼎黃耳金鉉、利貞。</span></summary><div class=\"body\"><div class=\"yomi\">鼎、黄耳（こうじ）金鉉（きんげん）あり。貞しきに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鼎黃耳、中以為實也。」（鼎黄耳ありとは、中以て実と為すなり。）</div>\n<p>鼎に黄色い耳と、黄金色の鉉（つる）がある。正しい道を守るがよろしい。受講者の問いに、本田は、金鉉が二を、黄耳が五を指していると答えた。</p>\n<p><span class=\"tag\">程伝</span>五は鼎の上にあり、耳の象である。鼎を挙げるのは耳にあり、耳は鼎の主である。五には中の徳があるので「黄」という（黄は五行の中央の色）。鉉とは耳に加わるもの（耳に通すつる）である。二は五に応じ、来て耳に従う者で、鉉である。二は剛中の徳があり、陽の体は剛、中の色は黄、だから金鉉という。五は文明で中を得て剛に応じ、二は剛中で巽の体であって上に応がある。その才に足りないものはなく、相応じるのも至って善い。利するところは貞固にある。六五は中にいて中に応じ、正に至らないおそれがあるが（陰が陽位）、本来中にいて中に応じているので正を失うには至らない。しかし質が陰柔なので、中において貞固であれと戒めるのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>六五は中を得ていることが善さで、中をもって実徳とする。五が聡明で剛に応じ、鼎の主となり鼎の道を得ているのは、みな中を得ていることによる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>良い補佐役を得て、中庸を実質として事を担う。柔らかすぎないよう、正しさを堅く守れ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">鼎玉鉉、大吉、无不利。</span></summary><div class=\"body\"><div class=\"yomi\">鼎、玉鉉あり。大吉にして利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「玉鉉在上、剛柔節也。」（玉鉉上に在るは、剛柔節あるなり。）</div>\n<p>鼎に玉で飾った鉉が付いている。大吉。何の不利もない。</p>\n<p><span class=\"tag\">程伝</span>井と鼎は上に出すことを用とする。終わりにいるのは鼎の功の完成である。上にあるのは鉉の象である。剛にして温かなものは玉である。九は陽だが陰位にいて、柔（六五）を踏んでいる。剛を極めず、温かさのある者である。成功に居る道は善処することだけで、剛柔が適宜で動静を誤らなければ、大吉で利あらざるなしである。上にいるのは位のない地だが、実際は用いられるべき人物で、他の卦とは異なる。井もそうである。</p>\n<p><span class=\"tag\">象伝について程伝</span>剛にして温、これが節があることである。上は功が成り用を致す地にいて、剛柔が節に中っている。大吉で利あらざるなしのゆえんである。ある人が「井と鼎はどちらも終わりを成功とするのに、鼎だけ元吉と言わないのはなぜか」と問う。答え：井の功用はみな上に出すことにあり、また博く施して常がある徳がある。だから元吉という。鼎は煮炊きを功とし、上にいることを成徳とする。井とは異なる。剛柔に節度があるので大吉を得るのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>事業が完成し、強さと柔らかさの釣り合いが取れている。大吉で万事に有利。</div></div></details><div class=\"pager\"><a href=\"#gua-49\">← 沢火革</a><a href=\"#gua-51\">震為雷 →</a></div>", "gua-51": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 51 卦　第六十一講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">震為雷</div><div class=\"yo\">しんいらい</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-51\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-51\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-51\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-51\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-51\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-51\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-51\" data-jump=\"yao\">六爻</a></div><h3 id=\"g51-s0\">卦の名と象</h3>\n<p>上も下も同じ形の震である。震には地震の意味もあるが、八卦を物に当てると普通は雷という。地震でも雷でも通ることは通る。受講者が「震と震のように同じ八卦が続くのは珍しいのでは」と言うと、本田は、上下ひっくり返した形がペアになるので全部そうなる、他には震をひっくり返した艮と艮、巽と兌、乾と坤、坎と離がある、と答えた。</p>\n<p>程伝（序卦伝を引く）：「器を主る者は長子に若くは莫し。故に之を受くるに震を以てす」。鼎は器の最も大切なもの、震は長男である。長男は国家を伝え、君主の位号を継ぐ者で、器（祭器）を主る主である。だから鼎の後を継ぐ。序卦伝はその一義の大きなものを取って次第としたのである。</p>\n<ul class=\"sen\"><li>卦の形は、一陽が二陰の下に生じ、動いて上ろうとするものである。だから震という。震は動である。「動」と言わずに「震」と言うのは、震には動いて奮い立ち、驚かせる意味があるからである。</li><li>乾坤（父母）が交わり、一索（第一回の交わり）で坤の一番下に陽気が入って震となる。生物の長なので長男である。その象は雷、その義は動。雷には震い奮う象があり、動には驚き懼れさせる意味がある。</li></ul>\n<h3 id=\"g51-s1\">卦辞</h3>\n<div class=\"orig\">震、亨。震來虩虩、笑言啞啞。震驚百里、不喪匕鬯。</div>\n<div class=\"yomi\">震は亨る。震の来るとき虩虩（げきげき）たり。笑言啞啞（あくあく）たり。震は百里を驚かす。匕鬯（ひちょう）を喪わず。</div>\n<p>この卦が出れば願いごとは通る。雷が落ちてくる時、人々は恐れてきょろきょろする（虩虩）。だが過ぎてしまえば、大口を開けて笑ってしゃべる（啞啞）。雷は百里の範囲を驚かすが、祭りの主たる長男は、雷が鳴ってもおさじ（匕）とウコン草の酒（鬯）を取り落とさない。鬯はウコン草（鬱金草。普通チューリップをウコン草と訳す）から作った香りの高い酒で、神前に注ぐもので飲むものではない。匕はさじの象形文字で、匕首（あいくち）の匕である。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>陽が下に生じて進むので亨る義がある。また震は動であり、恐懼であり、器を主る義がある。震動して奮発し、動いて進み、懼れて修め、器を主って大を保つ。みな亨ることを致せる。だから震には亨る徳がある。</li><li>震動が来ると恐懼して自ら安んじず、周りを顧み慮ってきょろきょろする。虩虩は周りを見回して不安なさまで、「虩」は本来ハエトリグモ（蠅虎）のこと、ハエトリグモはいつも周りをぐるぐる見回して一時もじっとしていないからである。震に処することがこのようであれば、かえってその安らかさを保てる。だから笑言啞啞たる。啞啞は言笑して和やかなさまである。</li><li>震動の大きなものとそれに処する道を言う。動きの大なるものは雷に及ぶものはない。雷の震動は百里の遠くまで驚かし、懼れて自失しない者はない。雷声の及ぶ所は百里である。ただ宗廟の祭祀に匕鬯を執る者は喪失しない。人がその誠を尽くすのは祭祀に及ぶものはない。匕は鼎の実を載せて俎に運ぶもの、鬯は地に灌いで神を降ろすものである。酌んで神を求め、犠牲を薦めて享けてくれることを祈る時、誠敬の心を尽くせば、震雷の威でも懼れて守りを失わせることはできない。大きな震懼に臨んでよく安んじて自失しないのは、ただ誠敬だけである。これが震に処する道である。卦の才には取るべきものがないので、ただ震に処する道を言う。</li></ul>\n<p>本田の講説：誠敬（真心と慎み）は程伊川が大変大切にして好んだ言葉である。受講者が「雷が鳴ったら周章狼狽しても差し支えないのか」と問うと、本田は差し支えない、周章狼狽というより自らの身を顧みて慎み恐れることで、孔子も雷が鳴る時は身を慎んだと『論語』にある、雷は天の怒りだから自分の身を慎んで恐れるのが正しい、と答えた。また中国でも神は降りてくるかという問いには、降りてくる、天の神であったり先祖の霊魂であったりする、と答えた。</p>\n<h3 id=\"g51-s2\">彖伝</h3>\n<div class=\"orig\">震、亨。震來虩虩、恐致福也。笑言啞啞、後有則也。震驚百里、驚遠而懼邇也。出可以守宗廟社稷、以為祭主也。</div>\n<div class=\"yomi\">震は亨る。震の来るとき虩虩たりとは、恐れて福を致すなり。笑言啞啞たりとは、後に則有るなり。震は百里を驚かすとは、遠きを驚かして邇（ちか）きを懼れしむるなり。出でて以て宗廟社稷を守り、以て祭主と為る可きなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>震にはもともと亨る義があり、卦の才（上下の組み合わせや爻の対応）によるのではない。震が来てよく恐懼し、自ら修め自ら慎めば、かえって福吉を致せる。「笑言」とは自若としていること。よく恐懼したからこそ、その後自ら処するのに法則がある。則があれば安らかで懼れない。震に処する道である。</li><li>雷が震うと百里に及び、遠い者は驚き近い者は懼れる。その威の遠大なことを言う。</li><li>彖伝の文は「匕鬯を喪わず」の一句が脱けている（本田：わざと省いたとも考えられる）。卦辞の「匕鬯を喪わず」は誠敬の至りで、威懼も自失させられないことを言う。彖伝は、長子はこのようであるべきだとして上の文を承け、長子の義を用いて解したのである。長子の誠敬が匕鬯を喪わないほどなら、君として出て宗廟社稷を守り、祭主となれる。長子がこのようであって初めて世祀を守り国家を承けられる。本田によれば、「出でて」は東宮を出て朝廷に立つこと、「社稷」はここでは文字どおり天（土地神）と農業神を祭る祭壇の意味である。</li></ul>\n<p>本田の講説：受講者が「『恐れて福を致す』は面白い表現だが他にもあるか」と問うと、この通りの文句はないと思うが、似た表現はいろいろな卦に出てくる、と答えた。また「卦才取る无し」について、程伊川の言う「才」は形であったり徳であったり非常に広い範囲で使っており、時々わかりにくいことがある、と説明した。</p>\n<h3 id=\"g51-s3\">大象</h3>\n<div class=\"orig\">洊雷、震。君子以恐懼脩省。</div>\n<div class=\"yomi\">洊（かさ）なれる雷は震なり。君子以て恐懼して脩省す。</div>\n<p>雷が二つ重なった形が震である。君子はこれに倣って、雷が鳴った時のようにひたすら恐れ慎み、我が身を反省する。</p>\n<p><span class=\"tag\">程伝</span>洊とは重襲（重なる）である。上下みな震なので洊雷という。雷が重なり寄り添えば（仍）、その威はますます盛んである。君子は洊雷の威震の象を観て、恐懼し自ら修め飭（つつし）み、修省する。君子が天の威を畏れれば、その身を修め正し、その過ちを思い省みて改める。雷震だけでなく、およそ驚き懼れる事に遇えば、みなこのようにすべきである。</p>\n<h3 id=\"g51-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>中は正より重い。</b> 六五の程伝によれば、諸卦の二・五は位に当たらなくても中であることを美とし、三・四は位に当たっていても中でないことを過ちとする。中は常に正より重い。中であれば正に違わないが、正は必ずしも中ではない。天下の理は中より善いものはない。</li><li><b>解釈は時に行き当たりばったり。</b> 受講者が「なぜ柔は動の極にいられないのか」と問うと、本田は、卦全体が動きの性質なので、動きに耐えられる強さが足りないというのであろう、さりとて一番上が剛なら不正になるので、その時はまた良くないと言われるかもしれない、文句と卦の形は全部が全部合理的に説明がつくわけでもないので、その時々に多少行き当たりばったりになる、と答えた。</li><li><b>注釈のない語。</b> 六二の「貝を喪うを億る」に注釈がないのはなぜかという問いに、本田は、状況だけで一つ一つの「貝」や「陵」について考えなくてもいいというのが程伊川の意見であろう、と答えた。</li><li><b>「婚媾」の解釈。</b> 上六の「婚媾言こと有り」は朱子も非常に困って「わからん」と放り出している。「婚媾」を仲間の意味に取るのは他に例がなく苦しい。屯・賁・睽の卦にも出てくるが、いずれも結婚の意味である。程伝の「衆動の首と為る」は、あるテキストでは「震動の首と為る」とある。乾の「群龍首无し」とは関係がない。</li><li><b>震と艮。</b> 震はあまり良い卦ではないが、似たような次の艮の卦は良い卦とされる。艮も上下同じ形で応が一つもなく、本来良い卦にならないはずなのだが。</li></ul>\n<h3 id=\"g51-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>願いは通る。突然の衝撃に驚いても、恐れ慎んで身を省みれば、後には笑って過ごせる。</li><li>大事に臨んでも誠敬を保てば、取り乱して大切なものを失うことはない。</li><li>驚くべき事に遇えば、まず我が身の過ちを反省して改めよ。</li><li>財を失っても追うな。自分の正しさを守れば、時が過ぎて戻る（六二）。</li><li>災いが身に及ぶ前に、隣の災難を見て自らを戒めれば咎はない（上六）。</li></ul><h2 class=\"sec\" id=\"g51-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">震來虩虩、後笑言啞啞、吉。</span></summary><div class=\"body\"><div class=\"yomi\">震の来るとき虩虩たり。後に笑言啞啞たり。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「震來虩虩、恐致福也。笑言啞啞、後有則也。」（震の来るとき虩虩たりとは、恐れて福を致すなり。笑言啞啞たりとは、後に則有るなり。）</div>\n<p>雷が来る時、人々はきょろきょろと周りを見回して恐れるが、その後、雷が通り過ぎれば、笑ったりしゃべったりする。吉。爻辞の句は卦辞とまったく同じで、違うのは「後」の字がついていることで、これで意味がはっきりする。</p>\n<p><span class=\"tag\">程伝</span>初九は震（成卦）の主で、震を致す者である。卦の下にいて震の初めに当たる。震の来るのを知り、もしよく恐懼して顧み慮ることびくびくとし、あえて安らかにじっとしていなければ、終には必ずその安吉を保てる。だから後に笑言啞啞たる。</p>\n<p><span class=\"tag\">象伝について程伝</span>震が来てよく恐懼し周りを顧みれば憂いはない。恐懼によってかえって福を致すのである。恐懼によって自ら修省し、あえて法度に違わない。震によって後に法則がある。だからよく安吉を保ち、笑言啞啞たるのである。</p>\n<p>本田の講説：受講者が「初九が震の卦の主ですか」と問うと、そうだ、初九がこの卦の主体である、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>思いがけない衝撃が来るが、恐れ慎んで身を省みれば、後には笑って過ごせる。吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">震來厲、億喪貝、躋于九陵、勿逐、七日得。</span></summary><div class=\"body\"><div class=\"yomi\">震の来るとき厲（はげ）し。貝を喪うを億（はか）り、九陵に躋（のぼ）る。逐う勿れ。七日にして得ん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「震來厲、乘剛也。」（震の来るとき厲しとは、剛に乗ればなり。）</div>\n<p>雷が激しくやって来て我が身が危うい。財産を失うことを恐れて、重なる丘の上に上る。宝を取り落としても追う必要はない。七日経てば戻ってくる。「貝」は昔の貨幣、「億」は慮るの意味。</p>\n<p><span class=\"tag\">程伝</span>六二は中にいて正を得ており、よく震に処する者である。しかし初九の剛に乗っている。九は震の主で、震が動いて上り奮う。誰がこれを防げよう。厲は猛、危うさである。相手の来方が猛々しいので、自分のいる所は危うい。億は度る、貝は所有する資財、躋は升る、九陵は陵の高いもの、逐は追うことである。震が来る勢いが厲しく、当たることができず、必ず所有を失うことを度って、至って高い所に升って避けるのである。九とはその重なることを言い、丘陵の重なる高さの至りである。九は重なることの多いことで、九天・九地のようなものである（本田：一桁の数の一番上なので、日本語でも「九重の奥」と言う）。「逐う勿れ、七日にして得ん」とは、二の貴ぶところは中正である。震が来るに遇い、勢いを量って退き避けても、その中正を守り自失しないようにすべきである。必ず失うことを知るので、遠く避けて自ら守る。過ぎればその常に復する。追わずに自ら得るのである。逐とは自分を失って物に従うことで、物に従えばその守りを失う。だから「逐う勿れ」と戒める。遠く避けて自ら守る、これが震に処する大きな心得である。二のような者は恐懼して善処すべき者である。卦には六つの位があり、七になれば卦の外に出て新しく始まる。事はすでに終わり、時はすでに変わる。守りを失わなければ、相手の来るのを防げなくても、時が過ぎ事が止めば常に復する。だから「七日にして得ん」という。</p>\n<p><span class=\"tag\">象伝について程伝</span>震に当たって剛に乗っている。だから相手は激しく、自分は危うい（本田：足元の初九が強い陽なので、足元がぐらぐらして危ない）。震剛の来るのをどうして防げよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>強い勢いに押されて財産を失いそうな時。逆らわず退いて身を守れ。失ったものを追わなくても、時が過ぎれば戻ってくる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">震蘇蘇、震行无眚。</span></summary><div class=\"body\"><div class=\"yomi\">震いて蘇蘇（そそ）たり。震いて行くときは眚（わざわい）无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「震蘇蘇、位不當也。」（震いて蘇蘇たりとは、位当らざればなり。）</div>\n<p>雷鳴の轟く時に呆然自失する（蘇蘇）。ただ震え震えて正しい方向に行く時は、災いを免れる。</p>\n<p><span class=\"tag\">程伝</span>蘇蘇とは神気が緩み散って自失するさまである。三は陰で陽位にいて不正である。不正にいれば平時でさえ安んじられない。まして震に処してはなおさらで、震懼して蘇蘇然とする。もし震懼によってよく行き、不正を去って正に就けば、過ちはなくなる。眚は過ちである。三が行けば四に至り、四は正（陰が偶数位）である。動いて正に就くことを善とする。だから二は「逐う勿れ、自ら得ん」と言い（二は正）、三は行けば眚がないと言う。不正のまま震に処していれば、災いがあることは知れている。</p>\n<p><span class=\"tag\">象伝について程伝</span>懼れて自失し蘇蘇然たるのは、いる位が不当だからである。不中不正で、どうして安らかでいられよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>衝撃に呆然自失する。今の不適切な立場にとどまらず、正しい位置へ動けば災いを免れる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">震遂泥。</span></summary><div class=\"body\"><div class=\"yomi\">震いて遂に泥（なず）む。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「震遂泥、未光也。」（震いて遂に泥むとは、未だ光（おお）いならざるなり。）</div>\n<p>雷が鳴るけれども、そのままぐずぐずと消滅してしまう（「遂に」はそのままの意味）。ここの判断は大変悪い。</p>\n<p><span class=\"tag\">程伝</span>九四は震動の時にいて、不中不正、柔の位にいて剛健の道を失い、四にいて中正の徳がない。重なる陰の間に陥り溺れ、自ら震い奮うことができない者である。だから「遂に泥む」という。泥とは滞り溺れることである。不正の陽で上下とも重陰である。どうして泥むことを免れよう。遂とは反ることのない意味（ずるずると引き返せない）である。震懼に処しては自ら守れず、震動しようとしても奮えない。震の道は亡びた。どうして再び大いに亨れよう。</p>\n<p>本田の講説：初九がこの卦の主体で、九四は上半分の対応する地位にいるが、上も下も陰が重なる中にどっぷり嵌まって通ることができない。</p>\n<p><span class=\"tag\">象伝について程伝</span>陽は剛のもの、震は動く義である。剛で動きにいれば、本来大いに亨る道がある。それなのに剛正を失い重陰に陥って、遂に泥むに至った。どうして光大であろう。「未だ光いならず」と言うのは、本来はよく震えるはずだったのに、徳を失ったので泥んだことを示す。</p>\n<p>本田の講説：テキストによっては「遂」が「墜」になっていて、「泥に墜つ」となる。また「震」を地震と解釈すれば、ひどい地震の時は地面が液状化して泥のようになる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>奮い立とうとしても周囲に足を取られ、ずるずると沈んでしまう。勢いは失われる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">震往來厲、億无喪有事。</span></summary><div class=\"body\"><div class=\"yomi\">震いて往くも来るも厲し。億りて有事を喪う无かれ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「震往來厲、危行也。其事在中、大无喪也。」（震いて往くも来るも厲しとは、危うく行くなり。其の事中に在り、喪う无きを大とするなり。）</div>\n<p>雷の鳴る時、行っても帰ってもどちらも危うい。自分の持っているもの（事）をなくさないよう、あらかじめ慮れ。</p>\n<p><span class=\"tag\">程伝</span>五は陰で陽位にいて、位に当たらず不正だが、柔で剛位にいて、しかも中を得ている。中の徳がある者である。中を失わなければ正に違わない。だから中を貴しとする。諸卦の二・五は位に当たらなくても中であることを美とし、三・四は位に当たっていても中でないことを過ちとする。中は常に正より重い。中であれば正に違わないが、正は必ずしも中ではない。天下の理は中より善いものはない。それは二・五に見ることができる。五が動いて上に行けば、柔なので動の極にいることはできず、下に来れば剛（九四）を犯す。往くも来るも危うい。君位にいて動の主となり、時宜に随い変化に応じるには、中にあるだけである。だからその所有する事を失わないよう度るべきである。所有する事とは中の徳である。中を失わなければ、危うさがあっても凶には至らない。「億度」とは計り慮って中を失わないことを求めることである。五が危ういのは、陽剛でなく助けがないからである（本田：上下同じ形なので応の関係が一つもない）。もし陽剛で助けがあって動の主となれば亨る。往来みな危うく、時は甚だ難しい。中を失わないことを期すれば自ら守れる。柔で動の主となれば、もとより亨済を致すことはできない。</p>\n<p><span class=\"tag\">象伝について程伝</span>往来ともに危うい、行けば危うさがあり、動けばみな危うい。ただその事を失わないことにある。その事とは中である。中を失わなければ自ら守れる。「喪う无きを大とする」とは、喪わないことを大事とすることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>進んでも退いても危うい。動き回らず、中庸の徳という唯一の財産を失わないよう心掛ければ凶には至らない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">震索索、視矍矍、征凶。震不于其躬、于其鄰、无咎。婚媾有言。</span></summary><div class=\"body\"><div class=\"yomi\">震いて索索たり。視ること矍矍（かくかく）たり。征けば凶。震うこと其の躬（み）に于いてせず、其の鄰に于いてす。咎无し。婚媾言（ものいう）こと有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「震索索、中未得也。雖凶无咎、畏鄰戒也。」（震いて索索たるは、中未だ得ざればなり。凶なりと雖も咎无きは、鄰の戒めを畏るればなり。）</div>\n<p>雷が鳴る時、心は意気阻喪して視線はきょときょとする。前進すれば凶。雷の害はまだ我が身には及ばず、隣に及んだ時に警戒・自粛すれば咎はない。ただし上六だけが災いを免れることについて、仲間から文句が出るであろう。「婚媾」は結婚相手、仲間の意味で、ここでは上六と同じ陰を指す。この爻辞の文句はだいぶわかりにくく、論理的に続かないところがある。</p>\n<p><span class=\"tag\">程伝</span>索索とは消え尽きて存しないさまで、志気が萎え尽きることを言う。六は陰柔で震動の極にいて、震懼の甚だしいこと、志気が殫（たお）れ索（すが）れる。矍矍とは不安定なさまで、志気が索索であれば視線も定まらない。陰柔で中正でない質で震動の極にいるので、行けば凶である。震が身に及ぶことを「其の躬に于いてす」という。「其の躬に于いてせず」とは、まだ身に及ばないこと。鄰とは身に近いものである。まだ身に及ばない前に恐懼すれば極には至らない。だから咎がない。極に至らなければ、なお改めるべき道がある。震が終われば変ずるべきである。柔は固守しないので、隣の戒めを畏れてよく変ずる義がある。聖人は震の終わりに、人に懼れを知り改める義を示した。人に善を勧める意は深い。婚媾は親しむもので、ともに動く者を言う。「言こと有り」とは怨咎の言葉があることである。六は震の上にいて、初めは衆動の首であった。今は隣の戒めを畏れてあえて進まず、もろもろの震（仲間）と異なる。だから仲間から文句を言われる。</p>\n<p><span class=\"tag\">象伝について程伝</span>恐懼自失がこのようなのは、中道を得ていない、中を過ぎているからである。中を得させれば索索には至らない。極まってさらに行けば凶である。もし隣の戒めを見て懼れを知り、極まらない前に変ずれば咎はない。上六は動の極で、震が極まれば変ずる義がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>恐れて意気消沈し、うろたえる。進めば凶。身近な人の災難を見て早めに自らを戒めれば咎はないが、仲間から恨み言を言われる。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>阪神大震災の一週間前</div><div class=\"rb\">阪神大震災のちょうど一週間前、梅花女子大の大学院の生徒に卦を立ててやったら、この卦の初九が出た。「地震に遭うぞ」と言ったら一週間後にぴたりと当たり、ひどく不思議がっていた。その人は地震で下宿の本などが全部落ちてしまい、ちょうど卒業試験前だったが勉強できなかった。そこで大学は臨時措置として無試験で卒業させた。これが「笑言啞啞」である、と本田は言う。</div></div><div class=\"pager\"><a href=\"#gua-50\">← 火風鼎</a><a href=\"#gua-52\">艮為山 →</a></div>", "gua-52": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 52 卦　第六十一講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">艮為山</div><div class=\"yo\">ごんいさん</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-52\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-52\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-52\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-52\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-52\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-52\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-52\" data-jump=\"yao\">六爻</a></div><h3 id=\"g52-s0\">卦の名と象</h3>\n<p>上も下も艮で、この形の卦をやはり艮と名付ける。震の卦を上下ひっくり返すと艮の形になる。艮も上下まったく同じ形で、上と下とに応が一つもなく、本来良い卦にはならないはずだが、震があまり良い卦でないのに対して、艮は良い卦とされる。</p>\n<p>程伝（序卦伝を引く）：「震とは動くなり。物は以て終に動く可からず。之を止む。故に之を受くるに艮を以てす」。艮は止まることである。動と静は相因る。動けば静があり、静なれば動がある。物は常に動く理はない。だから艮が震に次ぐ。</p>\n<ul class=\"sen\"><li>「艮」と言って「止」と言わないのは、艮は山の象で、安らかにどっしりと堅実で中身が詰まっている意味があり、「止」の字だけではその義を尽くせないからである。</li><li>乾坤が交わり、三索（第三回の交わり）で艮となる（第一回で震、第二回で坎）。一陽が二陰の上にいる。陽は動いて上り進むものだが、すでに上に至れば止まる。陰は静である。上は止まり下は静か、だから艮という。</li><li>大畜・小畜にも止まる意味があるが、畜止は力で制して止めること、艮止は安止、自らその場所に止まることである。</li></ul>\n<h3 id=\"g52-s1\">卦辞</h3>\n<div class=\"orig\">艮其背、不獲其身。行其庭、不見其人、无咎。</div>\n<div class=\"yomi\">其の背に艮（とど）まりて、其の身を獲（み）ず。其の庭に行きて、其の人を見ず。咎无し。</div>\n<p>自分の心が、自分の目には見えない背中に止まって、我が体を見ない。他人の庭に行っても、そこの人が見えない。咎はない。非常にわかりにくい、象徴的な文句である。</p>\n<p><span class=\"tag\">程伝</span>人がその止まるところに安んじられないのは、欲に動かされるからである。欲が前に牽いて、止まろうとしてもできない。だから艮の道は、背中に止まるべきである。見えるものはみな前にあり、背中はそれに背く、見えないところである。見えないところに止まれば、欲がその心を乱すことはなく、止まることは安らかである。「其の身を獲ず」とは自分の身を見ないこと、我を忘れることである。我がなければ止まる。我をなくせなければ止まる道はない。「其の庭に行きて其の人を見ず」とは、庭と除（みぎり。雨垂れを受ける所）の間は至って近いが、背中にあれば至って近くても見えない。物と交わらないことである。外物が接せず、内欲が萌えない。このように止まるのが止まる道を得たもので、止まることにおいて咎がない。</p>\n<p>本田の講説：この卦が特に宋学で重んじられるのは、程伊川のこのような解釈による。程伊川と同じ頃の周敦頤は「法華経全編はこの一つの艮の卦に及ばない」とまで言っている。これより前に艮を讃えた人がないわけではなく、晋の裴頠は『崇有論』で、老子と同じことは儒教の経典ですでに孔子が言っていると力説し、艮・坤・節の卦を挙げている。</p>\n<h3 id=\"g52-s2\">彖伝</h3>\n<div class=\"orig\">艮、止也。時止則止、時行則行、動靜不失其時、其道光明。艮其止、止其所也。上下敵應、不相與也。是以不獲其身、行其庭不見其人、无咎也。</div>\n<div class=\"yomi\">艮は止まるなり。時止まれば則ち止まり、時行けば則ち行く。動静其の時を失わざれば、其の道光明なり。其の止に艮まるは、其の所に止まるなり。上下敵応して、相与せざるなり。是を以て其の身を獲ず、其の庭に行きて其の人を見ず、咎无きなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>艮は止まることである。止まる道は、ただその時にかなうことである。行止・動静が時によらなければ妄りである。時を失わなければ、理に順い義に合う。物にあるのを理といい、物に処するのを義という。動静が理義に合い、時を失わないから、その道は光明である。君子が時を貴ぶのは、孔子（仲尼）の行止・久速がそれである。艮の体は篤実で、光明の義がある。本田によれば、「理」は宋学で最もやかましく言うもので、物の側にあるのが理、人の側にあるのが義である。艮に篤実の意味があるのは、大畜の彖伝に「剛健篤実」とあるからである。</li><li>「其の止に艮まる」とは、止めて止まることである。止めてよく止まるのは、止めるのにその所を得ているからである。所を得なければ止まる理はない。孔子は「止まるに於いて其の止まる所を知る」（『大学』）と言った。まさに止まるべきところである。物があれば必ず則がある（『詩経』）。父は慈に止まり、子は孝に止まり、君は仁に止まり、臣は敬に止まる。万物万事、それぞれの所がないものはない。所を得れば安く、失えば悖る。聖人が天下を順治させられるのは、物のために則を作るのではなく、ただ止めるのにそれぞれその所においてするだけである。</li><li>「上下敵応して相与せず」は卦の形で言う。上下二体が敵対して応じ、相与する義がない。陰陽が応じれば情が通じて与するが、敵対しているので与しない。与しなければ背き合う。背き合うのは心が背中に止まって自分の体を見ないことで、これが止まる義である。だから其の身を獲ず、其の人を見ない。こうして背に止まれば咎はない。</li></ul>\n<h3 id=\"g52-s3\">大象</h3>\n<div class=\"orig\">兼山、艮。君子以思不出其位。</div>\n<div class=\"yomi\">兼ねたる山あるは艮なり。君子以て思い、其の位を出でず。</div>\n<p>山と山とが重なった形が艮である。君子はこの形を見て自分の場所に踏み止まり、自分の地位を踏み出したいとは思わない（身分相応の所に思いを止める）。</p>\n<p><span class=\"tag\">程伝</span>上下みな山なので兼山という。これとあれとを併せるのを兼といい、重複のことである。重艮の象である。君子は艮止の象を観て、思いを止まる所に安んじ、その位を出ない。位とは居るべき分際である。万事にはそれぞれの所があり、その所を得れば止まって安らかである。もし行くべき時に止まり、速やかに去るべき時に長居し、過ぎたり及ばなかったりすれば、みなその位を出たのである。まして分を越え、拠るべきでない所に拠ればなおさらである。</p>\n<h3 id=\"g52-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>体の部位で上る爻辞。</b> 初六は足先（趾）、六二はふくらはぎ（腓）、九三は腰（限）、六四は胴体（身）、六五は顎の関節（輔）と、下から順に体の部位で述べている。</li><li><b>程伊川の感慨。</b> 六二の程伝の最後、「士が高位にいれば救うことがあって随うだけということはないが、下位にいれば救うべき時も随うべき時もあり、救おうとして得られず渋々随うこともある」というところは、程伊川自身感慨深かったのかもしれない、と本田は言う。</li><li><b>卦の主体。</b> 受講者の問いに、本田は、実際の力関係では六五はあまり力がないが君位なので形式的にはこの卦の主体は六五、実力は九三にある、と答えた。上九の程伝も上九を艮の主とし、三・五・上と主体が三回出てくる。九三が主体なら、上下同じ形なので上九も当然主体である。</li><li><b>吉は上九だけ。</b> 六爻のうち吉は上九だけである。上はとかく行き過ぎを警戒されるが、この卦では止まることの極点なので行き過ぎにはならず、わざわざ「過ぎず」と述べている。</li><li><b>有終の美。</b> 上九象伝の「終りを厚くする」について、『詩経』に「初め有らざる靡し、克く終り有る鮮し」とあり、「有終の美」という言葉があるように、「終わりが有る」というのはこれだけで良い概念である。</li></ul>\n<h3 id=\"g52-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>欲に引かれず、止まるべき所に止まれば咎はない。</li><li>止まるべき時は止まり、行くべき時は行け。動静が時を失わなければ道は光り輝く。</li><li>自分の分際を超えたことを思うな。</li><li>事は初めのうちに止めれば失敗しない（初六）。</li><li>一つの態度に固執しすぎると孤立し、心が焼かれるような不安に陥る（九三）。</li><li>言葉を慎み、口に出す前に止めれば悔いはない（六五）。</li><li>最後まで手厚く踏み止まれる者は吉（上九）。</li></ul><h2 class=\"sec\" id=\"g52-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">艮其趾、无咎、利永貞。</span></summary><div class=\"body\"><div class=\"yomi\">其の趾（あし）に艮まる。咎无し。永貞に利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「艮其趾、未失正也。」（其の趾に艮まるとは、未だ正を失せざるなり。）</div>\n<p>足先が動くか動かぬかの段階で踏み止まる。それでこそ咎はない。永く正道を守るがよろしい。足先は動こうと思った時に一番最初にむずむずする部分で、趾は足首から先を言う。</p>\n<p><span class=\"tag\">程伝</span>六は下にいて趾の象である。趾は動きの先である。「其の趾に艮まる」は動きの初めに止まることである。事を初めに止めれば、まだ正を失うには至らない。だから咎がない。陰柔で下にいるのは、まさに止まるべき時で、行けばその正を失う。だから止まれば咎がない。陰柔の者は常であることができず、堅固でないことを憂える。だから止まる初めに当たって、利は常永貞固にあり、そうすれば止まる道を失わない、と戒める。</p>\n<p><span class=\"tag\">象伝について程伝</span>止まるべき時に行くのは正しくない。これを初めに止めるので、まだ正を失うに至らない。事を始めに止めれば、止めやすく失敗に至らない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>動き出す前に踏み止まれ。初めのうちに止めれば咎はない。正しさを長く守れ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">艮其腓、不拯其隨、其心不快。</span></summary><div class=\"body\"><div class=\"yomi\">其の腓（こむら）に艮まる。拯（すく）わずして其れ随う。其の心快からず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不拯其隨、未退聽也。」（拯わずして其れ随うとは、未だ退き聴かざればなり。）</div>\n<p>ふくらはぎの段階で止まる。自分の上の者の失敗を救えず、ただ随うだけ。だから心も不愉快である。</p>\n<p><span class=\"tag\">程伝</span>二は中にいて正を得ており、止まる道を得た者である。しかし上に応援がなく（五と引き合わない）、その君を得ない。三は下体の上にいて、止まることの主となるが、剛で中を失い、止まることの宜しきを得ない。剛で上に止まり、降りて下に求める者ではない。二は中正の徳があっても、三は従わない。二の行止は上に繋がっており、自由を得るのではない。だから腓の象とする。股が動けば腓は随い、動止は股にあって腓にはない。二は中正の道で三の不中を救えないので、勉めてこれに随うしかない。救えずにただ随うのである。咎は自分にはないが、どうして望むところであろう。言は聴かれず、道は行われない。だから心が快くない。その志を行えないからである。士が高位にいれば、救うことがあって随うだけということはない。下位にいれば、救うべき時もあり、随うべき時もあり、救おうとして得られず後に随う時もある。</p>\n<p><span class=\"tag\">象伝について程伝</span>救えずにただ随うのは、上にいる者がへりくだって従わないからである。「退き聴く」とは下りて従うことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上の者の誤りを正せず、不本意ながら付き従うしかない。心は晴れない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">艮其限、列其夤、厲薰心。</span></summary><div class=\"body\"><div class=\"yomi\">其の限（こし）に艮まる。其の夤（せじし）を列（さ）く。厲（あや）うきこと心を薫（くす）ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「艮其限、危薰心也。」（其の限に艮まるとは、危うきこと心を薫ぶなり。）</div>\n<p>腰のところで止まる（「限」は腰の意味）。にっちもさっちもいかず、背中の肉が裂けてしまう。不安の極みで、心臓が火で燻べられる思いがする。</p>\n<p><span class=\"tag\">程伝</span>限は分隔で、上下の境を言う（卦全体を人体に見立てれば三は腰）。三は剛で剛位にいて中でない。艮を成す主で、止まることの極である。下体の上にいて上下の境を隔てている。みな止まる義である。だから「其の限に艮まる」という。確乎として止まり、進退できない者である（本田：テキストでは「確乎」が「随乎」になっているが、それでは意味が通らないので他のテキストに従って改める）。人の身で言えば背の肉を裂くようなものである。夤は背中の肉で、上下の境である。これを裂けば上下は続かない。下に止まることが堅いことを言う。止まる道は宜しきを得ることが貴い。行止を時によらず一つに定め、その堅強がこのようであれば、世に処して物と背き絶たれ、その危うさは甚だしい。人が一隅に固く止まり、世の中のすべてが仲良くしなければ、艱難・忿懼が心の中に燃えて乱す（撓は乱すの意味）。どうして安らかでゆったりする理があろう。「厲うきこと心を薫ぶ」とは、不安の勢いが心中を燻べ焼くことである。</p>\n<p><span class=\"tag\">象伝について程伝</span>固く止まって進退できず、危懼の思いが常に心中を燻べ焼くことを言う。象伝は爻辞の「厲」を「危」というやさしい字に置き換えている。</p>\n<p>本田の講説：受講者の問いに、「限」は腰の意味だが、腰の意味ではあまりこの字は使わない、と答えた。「要するに、時を得て進み時を得て止まれということですね」という受講者に、そういうことだと答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>一つの態度に固執して身動きが取れず、周囲と断絶する。心は不安に焼かれる。危うい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">艮其身、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の身に艮まる。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「艮其身、止諸躬也。」（其の身に艮まるとは、諸（これ）を躬に止むるなり。）</div>\n<p>自分の胴体のところに止まる（「身」は胴体で、腰より上も含む）。我が身をよくするまでで、他人を止めることはできない。咎はない。</p>\n<p><span class=\"tag\">程伝</span>四は大臣の位で、天下のまさに止まるべきものを止める者である。陰柔で陽剛の君に遇わないので、物を止めることができない。ただ自分の身に止まれば咎がない。咎がないのは正に止まるからである（陰が陰位）。「其の身に艮まる、咎无し」と言うのは、物を止めることができないことを示す。これを政に施せば咎がある。大臣の位にいてわずかに自分の身を善くするだけというのは、取り柄のないこと甚だしい。</p>\n<p><span class=\"tag\">象伝について程伝</span>天下の止を定めることはできず、ただ自分の身に止まるだけである。どうして大臣の位にふさわしかろう。本田によれば、「身」を「躬」に置き換えたのは、「躬」のほうが自分自身というニュアンスがはっきりするからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人を止める力はなく、自分の身を慎むのがせいぜい。それで咎は免れるが、責任ある立場としては物足りない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">艮其輔、言有序、悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">其の輔（つら）に艮まる。言うこと序有り。悔い亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「艮其輔、以中正也。」（其の輔に艮まるとは、中正を以てなり。）</div>\n<p>顎の関節のところで踏み止まる。「輔車」という言葉があり、上顎と下顎の関節の部分で、輔は頬、関節が車のように回転することから車という。だから言葉に秩序があり、妄言しない。ありがちな悔いもなくなる。</p>\n<p><span class=\"tag\">程伝</span>五は君位で、艮の主、天下の止を主る者である。しかし陰柔の才ではこの義に当たるに足りない。ただ上にいるので、輔の義を取って言う。人が慎んで止まるべきものは言行である。五は上にいるので輔で言う。輔は言葉が出る所である。輔に止まれば、言葉は妄りに出ず、序がある。軽々しく発して序がなければ悔いがある。輔に止めれば悔いは亡ぶ。「序有り」とは節に中って次第があることである。輔と頬舌はみな言葉が出る所で、輔はその中にある。「其の輔に艮まる」とは中に止まることである。</p>\n<p><span class=\"tag\">象伝について程伝</span>五の善いところは中である。「其の輔に艮まる」とは中に止まることである。言葉は中を得ることを正とする。輔に止めるのは、中を失わずに正を得させるのである。本田によれば、この爻は正ではないので、朱子は「正の字は省くべきだ」と言うが、伊川は中は正より重いので中であれば正であるとして解釈する。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>言葉を慎み、口に出す前に止めよ。言葉に筋道があれば悔いはなくなる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">敦艮、吉。</span></summary><div class=\"body\"><div class=\"yomi\">艮まるに敦（あつ）し。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「敦艮之吉、以厚終也。」（艮まるに敦きの吉なるは、終りを厚くするを以てなり。）</div>\n<p>止まることの最も篤実なものである。吉。「吉」という判断は六爻の中で初めて出てくる。</p>\n<p><span class=\"tag\">程伝</span>九は剛実で上にいて、また艮の主である。艮の終わりにいて、止まること至って堅く篤い者である。敦とは篤実である。止まることの極にいるので、過ぎずに敦いとする。人が止まるのは久しく終わりまで続けることが難しい。だから節操は晩年に移り、守りは終わりに失われ、事は久しくして廃れる。人が共に憂えるところである。上九はよく終わりに敦厚で、止道の至善である。吉なるゆえんである。六爻の徳のうち、ただこれだけが吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>天下の事は、ただ終わりまで守ることが難しい。止まることに敦いのは、終わりを全うする者である。上が吉なのは、終わりを厚くできるからである。</p>\n<p>本田の講説：受講者が「上は過ぎているのでは。なぜ『過ぎず』なのか」と問うと、上はとかく行き過ぎを警戒されるので、この卦ではわざわざ行き過ぎでないと述べている、止まる卦の極点だから行き過ぎにはならない、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>最後まで手厚く踏み止まり、晩節を全うできる。吉。</div></div></details><div class=\"pager\"><a href=\"#gua-51\">← 震為雷</a><a href=\"#gua-53\">風山漸 →</a></div>", "gua-53": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 53 卦　第六十二講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風山漸</div><div class=\"yo\">ふうざんぜん</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-53\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-53\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-53\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-53\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-53\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-53\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-53\" data-jump=\"yao\">六爻</a></div><h3 id=\"g53-s0\">卦の名と象</h3>\n<p>下が艮で上が巽、これが漸という卦である。漸は順序を追ってだんだん進むことである。</p>\n<p>程伝（序卦伝を引く）：「艮とは止まるなり。物は以て終に止まる可からず。故に之を受くるに漸を以てす。漸とは進むなり」。止まれば必ず進むことがある。物が伸び縮みし、消えたり伸びたりする理である。止まることが生じるのも進むことから、止まりが返っていくところもまた進むことである。だから漸が艮に次ぐ。進むのに順序があるのを漸という。今の人（宋代の人）も緩やかに進むことを漸という。進むのに順序をもってし、次第を越えないので、進み方は緩やかになる。</p>\n<ul class=\"sen\"><li>卦は上が巽（木）、下が艮（山）で、山の上に木がある。木が高いのは山によりかかっているからで、その高さには因るところがある。高さに因るところがあるのは、進むのに順序があることで、だから漸という。</li></ul>\n<h3 id=\"g53-s1\">卦辞</h3>\n<div class=\"orig\">漸、女歸吉、利貞。</div>\n<div class=\"yomi\">漸は、女の帰（とつ）ぐに吉。貞しきに利あり。</div>\n<p>この卦が出たら、娘が嫁ぐのによろしい。男女ともに正しければ利があるであろう。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦の才で漸の義を兼ねて言う。乾坤が変じて巽・艮となる（乾の一番下が陰に変われば巽、坤の一番上が陽に変われば艮）。艮と巽が重なって漸となる。卦で言えば、乾の四と坤の三の二爻が入れ替わって交わったのである。この交わりで男女がそれぞれ正しい位を得た（二・三・四・五がみな正位）。初と上は位に当たらないが、陽が上、陰が下で、尊卑の正を得ている。男女がそれぞれ正位を得ているのである。この点で次の帰妹とちょうど正反対である（帰妹は二・三・四・五がみな不正）。女が嫁ぐのにこのように正しければ吉である。</li><li>天下の事は、進むのに必ず漸（順序）をもってしなければならないが、それが最も顕著なのは女の嫁ぐことである。臣が朝廷に進み、人が事に進むのにも順序があるべきで、順序によらなければ節を越え義を犯し、凶咎が随う。しかし義の軽重・廉恥の道で言えば、女が人に従うのが最も大きい。だから女の嫁ぐことをこの卦の義とした。また男女は万事の先である（男女があって初めて子ができる）。</li><li>諸卦に「利貞」の語は多いが、その意味は同じではない。不正の疑いがあるので戒めとして言う場合、その事が必ず正であって初めて宜しきを得る場合、利がある理由を正があることで言う場合がある。戒めの例は損の九二で（陰位にいて説（兌）の体にいるので、正しくあるべきだと戒める）、必ず正であって宜しきを得る例は大畜で（蓄えるものが正しくて初めて利がある）、利がある理由を正があることで言うのがこの漸である。女が嫁いで吉なのはこのように正しいからで、その正は固有のものであり、戒めを設けたのではない。漸の義は亨ると言ってよさそうなのに言わないのは、亨は通達の義で、漸進の義ではないからである。</li></ul>\n<p>本田の講説：ここは何か原則的なことについて非常に詳しく書いている。二番目・三番目（必ず正であって宜しきを得る場合、正があるから利がある場合）はあまりはっきりしないが、とにかく漸の場合は戒めではなく、正しさが固有だというのである。受講者が「二爻の交わりとはどの二爻か」と問うと、乾の四番目と坤の三番目が入れ替わり交差するのだと答えた。</p>\n<h3 id=\"g53-s2\">彖伝</h3>\n<div class=\"orig\">漸之進也、女歸吉也。進得位、往有功也。進以正、可以正邦也。其位剛得中也。止而巽、動不窮也。</div>\n<div class=\"yomi\">漸の進むや、女の帰ぐに吉なり。進んで位を得たり、往けば功有るなり。進むに正を以てす、以て邦を正す可きなり。其の位は剛にして中を得るなり。止まりて巽う、動いて窮まらざるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>漸の義のように進むのは女が嫁ぐ吉である。正しくて順序があることを言う。女の嫁ぐことが最も大きいだけで、他の進むこともまた同じである。</li><li>漸進の時に陰陽がそれぞれ正位を得ている。進んで功があるのである。四はまた三から進んで正位を得、三は下を離れて上となって正位を得る。これも進んで位を得る義である（本田：この後に「是れ往きて功有るなり」という文句のあるテキストもあり、あったほうがよくわかる）。</li><li>正道で進めば、邦国を正し天下に至るまで正せる。事に進み、徳に進み、位に進むのも、みな正をもってすべきである。</li><li>上に「進んで位を得たり、往けば功有るなり」と言ったのは、諸爻がみな正位を得ていることを言う。ここでまた「其の位は剛にして中を得る」と言うのは、九五が陽剛中正で尊位を得ていることである。二・三・四も位を得ているが、五が尊位を得ているのには及ばないので、特に言う。</li><li>内は艮（止）、外は巽（順）。止まるのは安静の象、巽は和順の義である。人が進むのに、もし欲の動きに任せれば、騒がしくて漸を得ず、困窮がある。漸の卦は内が止まって静か、外が巽順なので、進み動いても困窮しない。</li></ul>\n<p>本田の講説：受講者が「今で言えばきちんとした仲人がいて、なるべく両家同士でということですね」と言うと、本田は、そう、結納をきちんと納めて、恋愛はいかんと言うのだ、と答えた。漸という立派な卦をどうして男女のことに限定したのかという問いには、易は占いの書物で、人が一番よく尋ねに来る話題だったからであろう、と答えた。女は陰の象徴で、男性的に積極的にやってはいけない、次の帰妹では女が積極的に嫁に行きたがる、とも言った。受講者からは『古事記』でイザナギとイザナミが最初に交わる時、女の方から先に声をかけたのがいかんと言われる話も出た。</p>\n<h3 id=\"g53-s3\">大象</h3>\n<div class=\"orig\">山上有木、漸。君子以居賢德善俗。</div>\n<div class=\"yomi\">山上に木有るは漸なり。君子以て賢徳に居り、俗を善くす。</div>\n<p>山のてっぺんに木が立っている。その木の高さは山の高さによりかかり、木自体もだんだん成長する。君子はこれにかたどって、賢人としての徳を積み重ね、漸進的に世の中の風俗を善い方に変える。</p>\n<p><span class=\"tag\">程伝</span>山の上に木があり、その高さには因るところがある。漸の義である。君子は漸の象を観て、賢善の徳に居り、風俗を美しくする。人が徳に進むには必ず漸があり、習い重ねてよく安んじられる。節を越えて急に至れるものではない。自分の修養でもそうである。まして人を教化するのに、漸によらなければどうして入っていけよう。風俗を移し変えるのは一朝一夕にできることではない。だから俗を善くするには必ず漸をもってする。</p>\n<h3 id=\"g53-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>水鳥（鴻）の象。</b> 六爻はすべて鴻（水鳥）の象を取る。鴻は来るのに季節があり、群れには序列がある（何か頭だったものがあり、その後に順序よく並ぶ）。その時と序列を失わないのが漸である。干（水際）→磐（岩）→陸（平原）→木→陵（丘）→逵（雲の通い路）と順に上っていく。受講者の問いに、鴻は和名ヒシクイで菱の実を食べる、と答えた。</li><li><b>比より応。</b> 九三について受講者が「三が四と仲良くしてはいけないのは」と問うと、本来の応ずる相手ではないからで、三は上と、四は初と対応する関係である、比より応のほうが良い、と答えた。</li><li><b>程伊川と朱子。</b> 受講者の問いに、程伊川は宋代の官僚で天子を諫める顧問官のような役目をしていた、宋代の儒学は漢から唐までの訓詁学とまったく変わり、非常に新しい哲学的な解釈を儒教に持ち込んだのが程伊川と朱子で、程朱学という、程伊川は朱子より百年早く、朱子は直接習うことはできず程伊川の弟子筋についた、程伊川はその基礎を作った、と答えた。</li><li><b>一番上がまずい卦。</b> 講義冒頭の雑談で、受講者が「日本はバブルで真っ逆さまに落ちた。乾の上は『亢龍悔いあり』だったが、他にも一番上へ行ったら悪くなる卦はあるか」と問うと、本田は、そういうのは割にあるはず、登りつめれば後は落ちるより仕方がない、と答えた。卦全体で一番悪いのは剝で、今日やる帰妹（妹を嫁に出す卦）もわりに悪い文句が出る、と言った。</li></ul>\n<h3 id=\"g53-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>物事は順序を踏んで少しずつ進めよ。急進すれば窮する。</li><li>結婚には吉。手順を正しく踏んだ縁組がよい。</li><li>徳を積み重ね、時間をかけて周囲を善く変えよ。</li><li>低い地位で不安でも、道義上は咎はない（初六）。</li><li>正しい相手との縁は、邪魔が入っても最後には遂げられる（九五）。</li><li>本来の相手でない者と結べば凶。せいぜい自分を守ることに努めよ（九三）。</li></ul><h2 class=\"sec\" id=\"g53-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">鴻漸于干、小子厲、有言、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">鴻（こう）、干（みぎわ）に漸（すす）む。小子は厲（あや）うし。言うこと有れど、咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「小子之厲、義无咎也。」（小子の厲うき、義において咎无きなり。）</div>\n<p>水鳥が水際に進んだ。無知な小人は危ぶむ。上から小言をくらうこともある。しかし道義においては咎はない。</p>\n<p><span class=\"tag\">程伝</span>漸の諸爻はみな鴻の象を取る。鴻は来るのに時があり、群れるのに序がある。その時と序を失わないのが漸である。干は水際である。水鳥が水際に止まる、水は至って近い。その進むことは漸というべきで、行くのに時をもってするのが漸である。進むのに漸を失わないのは宜しきを得ている。六は初にいて至って低く、陰柔の才は至って弱く、しかも上に応援がない（四も陰）。これで進むのは常人の憂えるところである。君子は深く識り遠く照らし、義理の安んずる所、時事の宜しき所を知るので、これに処して疑わない。小人・幼子はただ過ぎた事を見て、衆人の知に従うだけで、理を明らかにすることはできない。だから危懼して言うことがある。下にいるのは進む余地があるゆえん、柔であるのは躁がしくないゆえん、応がないのは漸で進めるゆえんで、みな義において咎はない。小子はそれを知らない。もし漸の初めに剛躁を用いて急進すれば漸の義を失い、進めないうえに咎があるのは必然である。</p>\n<p><span class=\"tag\">象伝について程伝</span>小子は危懼とするが、義理においては実は咎がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>まだ低い位置で心細く、周囲から何か言われることもあるが、焦らず順序を守れば咎はない。急進は禁物。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">鴻漸于磐、飲食衎衎、吉。</span></summary><div class=\"body\"><div class=\"yomi\">鴻、磐（いわ）に漸む。飲食衎衎（かんかん）たり。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「飲食衎衎、不素飽也。」（飲食衎衎たるは、素（むな）しく飽かざるなり。）</div>\n<p>水鳥が固い岩のところまで進んだ。君子は和やかに飲食して楽しむ（衎衎は和らぎ楽しむさま。「磐」と「衎」で韻を踏む）。吉。</p>\n<p><span class=\"tag\">程伝</span>二は中正にいて、五に応じる。進むことの安らかな者である。ただ漸の卦にいるので、進むことは速やかでない。磐は石の安らかで平たいもので、江河の岸辺にあるものである。進むことの安らかさにかたどる。干から磐に行くのもまた漸である。二は九五の君と中正の道で相応じている。その進むことの安固平易なことは、これ以上のものはない。だからその飲食和楽、吉なることは知れている。</p>\n<p><span class=\"tag\">象伝について程伝</span>爻辞は進むことの安平なことから、飲食和楽を取って言った。孔子は後人がその義を悟らないことを恐れて、さらに解釈した。中正の君子が中正の君に遇い、漸く上に進んで、その道を行い天下に及ぼそうとする。いわゆる飲食衎衎とは志を得て和楽することで、空しく飲食に飽きるだけではない。素とは空である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>安定した地位を得て、良い上役とも心が通う。和やかに楽しめて吉。ただし無為徒食ではなく、志を行う場を得た喜びである。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">鴻漸于陸、夫征不復、婦孕不育、凶。利禦寇。</span></summary><div class=\"body\"><div class=\"yomi\">鴻、陸に漸む。夫征きて復（かえ）らず。婦孕んで育（やしな）われず。凶。寇（あだ）を禦ぐに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「夫征不復、離群醜也。婦孕不育、失其道也。利用禦寇、順相保也。」（夫征きて復らずとは、群を離れて醜（は）ずればなり。婦孕んで育われずとは、其の道を失すればなり。用て寇を禦ぐに利ありとは、順にして相保つなり。）</div>\n<p>水鳥が平原まで進んだ。夫は出征して帰ってこない。妻は孕んだが子が育たない。凶。敵を防ぐのに精一杯である。あまりよくない判断である。</p>\n<p><span class=\"tag\">程伝</span>平らで高いのを陸といい、平原である。三は下卦の上にいて、進んで陸に至った。陽は上り進む者で、漸の時に志はまさに漸進しようとするが、上に応援がない（上も陽）。正を守って時を待ち、平地に安処すれば漸の道を得る。もし自ら守れず、欲に牽かれ志が取り付くところがあれば漸の道を失う。四は陰で上にあって密接に比し、陽の悦ぶところである。三は陽で下にあって親しみ、陰の従うところである。二爻が比していずれも応がない。比すれば親しんで合いやすく、応がなければ他に求める相手がない。だからこれを戒める。夫は陽で三のこと。三がもし正を守らずに四と合えば、行くを知って反るを知らない。征は行く、復は反ることで、「復らず」とは義理を顧みないことである。婦は四のこと。もし不正で合えば、孕んでも育たない。その道によらないからである。このようであれば凶である。三の利するところは寇を禦ぐことにある。非理で来るものが寇で、正を守って邪を防ぐのがいわゆる寇を禦ぐことである。禦げなければ自ら失って凶である。</p>\n<p><span class=\"tag\">象伝について程伝</span>「夫征きて復らず」は漸の正を失うことで、欲に従って正を失い、その群類を離れるので醜（恥ずべき）である。卦の諸爻はみな正であり、一人正を失えば群類を離れることになる。婦が孕むのにその道によらないので育たない。利するところは寇を禦ぐことで、順道によって自らを保つことを言う。君子が小人と比する時（九三と六四）、正をもって自ら守る。君子が自分を全うするだけでなく、小人も不義に陥らずに済む。これが順道で相保ち、その悪を禦ぎ止めることで、だから「寇を禦ぐ」という。本田によれば、程伊川は「群を離れて醜し」と読むが、他の注釈では「群醜を離る」と読み、醜に類の意味があるとする。受講者が「どうしてこれで寇を禦ぐのに利があるのか」と問うと、せいぜいそれぐらいしかできないということだと答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>欲に駆られて本来の相手でない者と結べば、家庭も子も失う。凶。正しさを守り、誘惑を防ぐことに努めよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">鴻漸于木、或得其桷、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">鴻、木に漸む。或は其の桷（たるき）を得。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「或得其桷、順以巽也。」（或は其の桷を得とは、順にして以て巽なればなり。）</div>\n<p>水鳥が木まで進んだ。平たい横枝に止まることもできる。それならば咎はない。</p>\n<p><span class=\"tag\">程伝</span>漸の時に、四は陰柔で進んで陽剛（九三）の上に拠っている。陽剛は上り進むもので、どうして陰柔の下に安んじていよう。だから四のいる所は安らかな地ではない。鴻が木に進むようなものである。木は漸く高く、しかも不安の象がある。鴻の趾は（水掻きで）連なっていて枝を握れないので、木には棲まない。桷は横に平たい枝で、その上ならば安処できる。四のいる所は本来危ういが、もし自ら安寧の道を得れば咎がない。鴻が木にいるのは本来安らかでないが、平らな枝を得てそこにいれば安らかなようなものである。四は正位にいて巽であり、本来咎のないはずの者である。それなのに「或は」と得失で言うのは、得失によってその義を明らかにするのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>桷とは平安な所である。安らかさを求める道は順と巽だけである。もしその義が順正で、処し方が謙巽であれば、どこにいて安らかでないことがあろう。四が順正で巽であるのは、桷を得ることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>落ち着かない不安定な立場だが、素直に謙虚にしていれば安住の場を得て咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">鴻漸于陵、婦三歲不孕、終莫之勝、吉。</span></summary><div class=\"body\"><div class=\"yomi\">鴻、陵（おか）に漸む。婦三歳まで孕まず。終に之に勝つこと莫し。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「終莫之勝吉、得所願也。」（終に之に勝つ莫し吉なりとは、願う所を得るなり。）</div>\n<p>水鳥が高い丘に進んだ。妻は三年経っても孕まない（夫婦の間を邪魔する者がいる）。しかし邪魔する者もついに勝つことはできない。最後は吉。この卦の主体の爻である。</p>\n<p><span class=\"tag\">程伝</span>陵は高い丘で、鴻の止まる最も高い所である。君の位にかたどる。尊位を得ていても、漸の時なのでその道が行われるのはもとより急ではない。二と正応で中正の徳が同じだが、三と四に隔てられている。三は二に比し、四は五に比し、みなその交わりを隔てる者である。だからすぐには合えず、三年孕まない。しかし中正の道は必ず亨る理がある。不正がどうしてこれを隔て害せよう。だから終にこれに勝つものはない。ただ合うのに漸があるだけで、終には吉を得る。不正で中正に敵するのは一時のことで、久しければどうして勝てよう。</p>\n<p><span class=\"tag\">象伝について程伝</span>君臣が中正で交わるのだから、その道は行われるべきである。間を隔てる者があっても、終にどうして勝てよう。徐々に必ずその願いを得る。これが漸の吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>正しい相手との縁や君臣の信頼は、邪魔者に隔てられてすぐには実らないが、時間をかければ必ず願いがかなう。吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">鴻漸于陸（逵）、其羽可用為儀、吉。</span></summary><div class=\"body\"><div class=\"yomi\">鴻、逵（き）に漸む。其の羽用て儀と為す可し。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「其羽可用為儀吉、不可亂也。」（其の羽用て儀と為す可し吉なりとは、乱す可からざるなり。）</div>\n<p>「陸」はすでに九三にあったので、ここは「逵」（音は「き」）に改める。水鳥が天上の雲の通い路まで上った。その落とした羽根は儀式の飾りとするに足る。吉。</p>\n<p><span class=\"tag\">程伝</span>安定胡公（胡瑗、程伊川の師匠筋）は「陸」を「逵」に改めよと言う。逵は雲路で、虚空の中である。『爾雅』に「九達を逵という」とあり（『爾雅』は十三経の一つで、経書を読むのに必要な難しい字を解説した最古の字引）、どこへも通じて隔てがない意味である。上九は至高の位にいて、さらに上り進む、位の外に出ている。他の卦なら上は行き過ぎだが、漸の時においては謙巽の極みにいて、必ずその序がある。鴻が止まる所を離れて雲の空に飛ぶようなものである。人で言えば常の事の外に超逸する者（世捨て人）である。進んでここに至っても漸を失わない。賢達の高い趣きである。だから儀法（手本）とすることができ、吉である。羽は鴻が進むのに用いるもので、上九の進む道にたとえた。本田によれば、「儀」は程伝では手本の意味だが、本来は儀式の飾りの意味である。</p>\n<p><span class=\"tag\">象伝について程伝</span>君子の進むことは、下から高きへ、微かなところから著しいところへ、と順序があり、跬歩（半歩）・造次（慌ただしい時）にも序がないことはない。その序を失わなければ、必ずその吉を得る。だから上九は窮めて高い所にいても吉を失わない。儀法とすべきなのは、その序があって乱すことができないからである。本田によれば、大畜の上九にも「天の衢を何（にな）う」という空中の道の言い方がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高い境地に達し、世俗を超えても秩序を失わない。その姿は人の手本となる。吉。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>年頭の卦（第六十二講冒頭）</div><div class=\"rb\">第六十二講の初めに、卦に入る前に受講者たちが年頭の卦を立てた。同人の六二を得た受講者は「人と同調しろということ、身内とだけ付き合っていたら恥をかくから広く付き合えということですね」と言い、本田は「そういうこと」と答えた。噬嗑の初九を得た受講者には、本田は「噬嗑の初九はあんまり良くない」「早いうちに悪いものを出してしまえ、悪人を退治しろということ」「初九は自分が足を噛まれる」と言った。中原さんの水風井の六五については、「これはいい卦です」と言った。</div></div><div class=\"pager\"><a href=\"#gua-52\">← 艮為山</a><a href=\"#gua-54\">雷沢帰妹 →</a></div>", "gua-54": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 54 卦　第六十二講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">雷沢帰妹</div><div class=\"yo\">らいたくきまい</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-54\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-54\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-54\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-54\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-54\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-54\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-54\" data-jump=\"yao\">六爻</a></div><h3 id=\"g54-s0\">卦の名と象</h3>\n<p>帰妹は「妹を嫁がせる」、娘が嫁ぐことである。下が悦ぶ（兌）、上が動く（震）形の卦である。</p>\n<p>程伝（序卦伝を引く）：「漸とは進むなり。進めば必ず帰する所有り。故に之を受くるに帰妹を以てす」。進めば必ずどこかに至りつく。だから漸には「帰する」という意味がつきまとい、帰妹が漸に次ぐ。帰妹とは女が予定された男のところへ嫁ぐ（帰する）ことで、妹とは若い娘の称である。</p>\n<ul class=\"sen\"><li>卦は震が上、兌が下。震は長男、兌は少女で、少女が長男に従う形である。男が動いて女が悦び、また女が悦びをもって動く。すべて男が女を悦び、女が悦んで男に従う義である。</li><li>六十四卦のなかで男女の配合を説くものは咸・恒・漸・帰妹の四つある。咸は男女が相感ずる卦で（咸は感と同じく無心の感応）、男が女にへりくだり、止まって悦ぶ。恒は常で、男が上、女がへりくだり、六爻の陰陽がすべて応じて、夫唱婦随の常道を示す。漸は女が嫁ぐのに正しきを得る卦で、二・三・四・五の各爻がみな正位を得、止まって巽順、進み方に秩序がある。</li><li>帰妹は女が悦びをもって積極的に動く卦で、男女の正を得ていない。だから二・三・四・五の位がすべて不正である。初と上は陰陽の位に当たっているが、陽が一番下、陰が一番上なので、これも位を得ているとは言えない。帰妹は漸とちょうど正反対である。</li><li>咸・恒は夫婦の道、漸・帰妹は女が嫁ぐ義である。咸と帰妹は男女の情を示し（咸は止まって悦び、帰妹は悦んで動く。ともに悦の情を伴う）、恒と漸は夫婦の道義を示す（恒は巽って動き、漸は止まって巽う。ともに巽順の徳を持つ）。男女の道・夫婦の義は恒と漸に備わっている。</li><li>沢の上に雷があり、雷が震えて沢が動く。物が随って動くのに水に及ぶものはない。男が上で動き、女が嫁いでそれに従う象である。人が悦ぶ対象は若い娘なので「妹」の字を用いた。また長男が少女を悦ぶ義もある。</li></ul>\n<p>受講者が「妹とは少女の意味か、三女の意味か」と問うと、本田は「両方の意味がある」と答えた。</p>\n<h3 id=\"g54-s1\">卦辞</h3>\n<div class=\"orig\">歸妹、征凶。无攸利。</div>\n<div class=\"yomi\">帰妹は、征けば凶。利する攸无し。</div>\n<p>この卦が出たら前進してはならない。何の利益もない。悪い判断である。</p>\n<p><span class=\"tag\">程伝</span>悦びをもって動き、動いて当たらない（二・三・四・五がすべて不正）。だから凶である。「当らず」とは位が不当なこと、「征けば凶」とは動けば凶ということである。卦の義のようであれば、女が嫁ぐことだけでなく、どちらへ向かっても何の利益もない。</p>\n<h3 id=\"g54-s2\">彖伝</h3>\n<div class=\"orig\">歸妹、天地之大義也。天地不交、而萬物不興。歸妹、人之終始也。説以動、所歸妹也。征凶、位不當也。无攸利、柔乘剛也。</div>\n<div class=\"yomi\">帰妹は天地の大義なり。天地交わらずんば、万物興らず。帰妹は人の終始なり。説びて以て動く、帰ぐ所は妹なり。征けば凶とは、位当らざればなり。利する攸无しとは、柔、剛に乗ればなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「一陰一陽之を道と謂う」（繋辞伝）。陰陽が交感し男女が配合するのは天地の常理である。帰妹は女が男に嫁ぐことで、男が女の上にあり、女が陽に従って動く。だから「天地の大義」という。</li><li>天地が交わらなければ、万物はどこから生じよう。女が男に嫁ぐのは生命が次々に続く道である。男女が交わって生息（子孫の発生）があり、生息があってその終わりが窮まらない。先の者が終わって後の者が始まり、相続いて窮まらない。これが「人の終始」である。</li><li>上下二体で帰妹の義を説く。悦んで動くのは少女のすることで、嫁ぐ者は妹である。「征けば凶」なのは諸爻がみな位に当たらず、居場所がすべて不正だからで、どちらを向いても凶でないことはない。おおむね女が悦んで自分から動けば、正を失わない者があろうか。</li><li>位が不当なだけでなく、三と五がともに陽の上に乗る過ちがある。男女には尊卑の序、夫婦には夫唱婦随の礼があるのが常理で、恒卦がそれである。もし常正の道によらず、情に徇い欲をほしいままにし、ただ悦びで動けば、夫婦は瀆れ乱れる。男は欲に牽かれて剛を失い、婦は悦びに狃れて順を忘れる。陰陽の配合・男女の交構は理の常であるが、欲に従って流れ義理によらなければ、邪淫に至らないところがない。身を傷り徳を敗る、どうして人の道と言えよう。帰妹が凶であるゆえんである。</li></ul>\n<p>本田の講説：女が情にまかせて悦びに流されて動く、というのがこの卦が凶である理由である。受講者が「悦んで動くのは良くないのか」「女が動くから良くないのか」と問うと、本田は「良くない。女の方が積極的に相手を悦んで動き出すのは良くない。夫唱婦随で、女はひたすら随うべきものと考えるのである」と答えた。</p>\n<h3 id=\"g54-s3\">大象</h3>\n<div class=\"orig\">澤上有雷、歸妹。君子以永終知敝。</div>\n<div class=\"yomi\">沢上に雷有るは帰妹なり。君子以て終りを永くし敝（やぶ）るるを知る。</div>\n<p>雷が上に動き、下の沢が悦び従う、それが帰妹である。君子はこれにのっとって、永遠に血統が続くよう願い、物には必ず壊れることがあると知って用心する。</p>\n<p><span class=\"tag\">程伝</span>雷が上で震い沢が動く、陽が動いて陰が悦び従う、女が男に従う象である。君子は男女が配合して生息が相続く象を観て、終わりを永くし、また敝れることがあるのを知る。「終りを永くす」とは、生息が相継いでその伝わりを永久にすること。「敝るるを知る」とは、物には敝れがあるので、それを継ぐ道を講じることを知ることである。また夫婦の道はまさに常に永く終わるべきもので、必ず敝壊があることを知って戒め慎む。敝壊とは離れる隙間のことである。帰妹は悦んで動くもので、恒の巽って動く、漸の止まって巽うのとは違う。少女の悦びは情の感動で、動けば正を失う。夫婦の正しい、常久であるべき道ではなく、久しくすれば必ず敝れる。必ず敝れると知れば、その終わりを永くすることを思うべきである。天下の反目する夫婦は、みな終わりを永くできなかった者である。夫婦の道だけでなく、天下の事は終わりがあり敝れないものはなく、継ぐべく久しくすべき道がないわけではない。帰妹を観れば、終わりを永くする戒めを思うべきである。</p>\n<h3 id=\"g54-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>婚姻の四卦。</b> 程伊川は帰妹の冒頭で、咸・恒・漸・帰妹の四卦を対比して婚姻の総論を述べる（卦の名と象の項を参照）。</li><li><b>男尊女卑。</b> 初九の講義で受講者が「男尊女卑ですね」と言うと、本田は「ええ、ものすごく男尊女卑」と答えた。</li><li><b>狎れ合いは駄目。</b> 九二の象伝の程伝は、世間の人は狎れ狎れしいことを夫婦の常道と思い、ひっそりした貞しさを常道に反すると思うが、実はそれこそ夫婦の常久の道だと言う。受講者が「狎れ狎れしいのは駄目なんですね」と言うと、本田は「みだりにいちゃいちゃするのはよろしくない、と言う。宋代の夫婦というのは狎れになっていたのであろう」と答えた。</li><li><b>脇嫁の制度。</b> 昔、諸侯が嫁をもらう場合、一遍に九人の嫁をもらった。正妻の他にその妹が脇嫁（娣）として付いてきた。「媵」は腰元である。</li><li><b>帝乙。</b> 殷の帝王は生まれた日の甲乙を名にするが、ここの帝乙がどの帝王かはわからない。帝乙の時に婚姻の礼を正したというのは程伊川の想像である。</li></ul>\n<h3 id=\"g54-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>前進すれば凶、何の利益もない悪い卦。</li><li>悦びや情に流されて自分から動くな。</li><li>物事は必ず敝れることを知り、終わりを永く保つよう用心せよ。</li><li>低い立場の者は、分をわきまえて上を助ければ吉（初九）。</li><li>高い身分にあっても飾らず、へりくだって礼を尊べば吉（六五）。</li></ul><h2 class=\"sec\" id=\"g54-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">歸妹以娣。跛能履。征吉。</span></summary><div class=\"body\"><div class=\"yomi\">帰妹娣（てい）を以てす。跛（あしなえ）能く履む。征けば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「歸妹以娣、以恆也。跛能履吉、相承也。」（帰妹娣を以てするは、恒を以てなり。跛能く履むの吉なるは、相承くればなり。）</div>\n<p>この卦の爻辞はなかなか難しいので程伝による。結婚するのに妹を脇嫁として伴う。脇嫁はへりくだって、足萎えの者がかろうじて歩ける程度に姉に付き従うだけで、自分から行動してはならない。そうすれば前進して吉。</p>\n<p><span class=\"tag\">程伝</span>女が嫁ぐ卦で一番下にいて、正しい応がない（四と応じない）。娣の象である。陽は婦人においては賢く貞しい徳であるが、卑しく低い位にいる。娣で賢正な者である。悦の体で下にいるのは順の義である。娣の卑しい身分では、賢くても何ができよう。せいぜい自分の身を善くし、その君（正妻）を助けるに過ぎない。跛の者がかろうじて地を踏むようなもので、その徳が遠くまで及ばないということである。しかし娣の分際ではこれが善い。だからこれで行けば吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>帰妹の義は悦んで動くことで、夫婦が永く常を保つ道ではない。初九は低い位だが陽剛で、賢貞の徳があり、常の徳をもって行動できる者である。下にいて積極的に行動できず、跛がかろうじて履むようだが、それでも行って吉なのは、よく正妻を助けるからである。君を助けるのが娣の吉である。</p>\n<p>受講者が「男尊女卑ですね」と言うと、本田は「ええ、ものすごく男尊女卑」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>低い立場にあって、自分から動かず上の人を助けるに徹すれば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">眇能視。利幽人之貞。</span></summary><div class=\"body\"><div class=\"yomi\">眇（すがめ）能く視る。幽人の貞に利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「利幽人之貞、未變常也。」（幽人の貞に利ありとは、未だ常を変ぜざるなり。）</div>\n<p>眇の人がかろうじて見える程度。ひっそりと静かな人の貞しさによろしい。</p>\n<p><span class=\"tag\">程伝</span>九二は陽剛で中を得ており、女の賢正な者である。上に正応（六五）があるが、六五はかえって陰柔の質で悦に動く者である。女は賢いが配偶者は良くない。だから二は賢くても自ら進んで内助の功を成すことはできず、せいぜい我が身を善くして少しそれを施すだけで、眇の者がかろうじて見るようなものである。遠くまで及ぼすことはできない。男女の交際は正しい礼によるべきで、夫の五は不正でも、二は自らひっそりと静かで正しい態度を守る。それが利のあるところである。二には剛正の徳があり、幽静の人である。才がこのようで「利貞」と言うのは、このような幽人の貞しさによろしいということで、足りない所を戒めているのではない。</p>\n<p><span class=\"tag\">象伝について程伝</span>幽静の貞しさを守るのは、夫婦の常の道をまだ失っていないのである。世間の人は狎れ狎れしいことを夫婦の常道と思い、幽静の貞しさを常道に反すると思う。それこそが常久の道であることを知らない。</p>\n<p>本田の講説：受講者が「狎れ狎れしいのは駄目なんですね」と言うと、「みだりにいちゃいちゃするのはよろしくない、と言う」と答えた。受講者が「幽人貞吉は他の卦にもありましたね」と言うと、本田は「履の卦、九二」と答えた（テキストは「離」と読めるが、幽人貞吉は履の九二の爻辞）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>相手（配偶者・上司）に恵まれない。自ら出しゃばらず、ひっそりと正しさを守るのがよい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">歸妹以須。反歸以娣。</span></summary><div class=\"body\"><div class=\"yomi\">帰妹以て須（ま）つ。反り帰って娣を以てす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「歸妹以須、未當也。」（帰妹以て須つとは、未だ当らざればなり。）</div>\n<p>嫁ごうとしても適当な相手がいないので待っている。一旦家に帰り、脇嫁として行動すればよろしい。</p>\n<p><span class=\"tag\">程伝</span>三は下体の上にいて、もともと卑しい者ではないが、陰が陽位にいて徳を失い、上に正応がない（上六と引き合わない）。嫁ぎたいと願いながら嫁げない。須は待つことで、まだ嫁ぐ所がないということである。陰で三にいるのは位に当たらず徳が不正、柔で剛を尚ぶのは行いが不順である。兌の主で、悦んで嫁ぐことを求めるのは、動きが非礼である。上に応がないのは受け入れる者がないことで、だから待つ。女子がこのようであれば誰が娶ろう。人の配偶とはなれない。一旦帰って娣となることを求めればよい。不正で居場所を失っているからである。</p>\n<p>本田の講説：受講者が「娣媵の媵は側女ですか」と問うと、「媵は腰元」と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>「未だ当らず」とは、その居場所、その徳、嫁ぐことを求める仕方がみな不当だということである。だから娶る者がなく、待つのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>望みの相手（地位）が得られない。身の程を省み、一歩退いた立場から出直せ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">歸妹愆期。遲歸有時。</span></summary><div class=\"body\"><div class=\"yomi\">帰妹期を愆（すご）す。遅く帰ぐこと時有らん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「愆期之志、有待而行也。」（期を愆すの志は、待つ有りて行かんとなり。）</div>\n<p>嫁ごうとして婚期を過ぎてしまった。しかし遅く嫁ぐと決めれば、いつかは嫁げる時がある。</p>\n<p><span class=\"tag\">程伝</span>陽で四にいる。四は上体で地位が高い。陽は女子においては正徳賢明である。下に正応がない（初と引き合わない）ので、まだ嫁げない。時を過ぎて嫁がないので「期を愆す」という。女子が貴く高い地位にいて賢明な資質があれば、人情として娶りたいと願う者があるはずである。だから期を過ごすのは、かえっていつか時があるということである。おそらく自ら待つところがあるのであって、売れないのではない。良い配偶者を得るのを待って、その後嫁ごうというのである。陽が四にいて位に当たらないが、剛が柔位にいるのはかえって婦人の道である。応がないので期を過ごす義になるが、作者が道理を推すに、賢をもって期を過ごすのは、待つところがあるからだとした。</p>\n<p><span class=\"tag\">象伝について程伝</span>期を過ごすのは自分の意志によるもので、他によるのではない。賢女は人が娶りたいと願う対象で、期を過ごすのはその志が待つところがあるからである。良い配偶者を待って嫁ごうとしているのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>時機を逸したようでも焦るな。良い相手・良い機会を待てば、遅れてもいずれ時が来る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">帝乙歸妹。其君之袂、不如其娣之袂良。月幾望。吉。</span></summary><div class=\"body\"><div class=\"yomi\">帝乙（ていいつ）妹を帰がしむ。其の君の袂、其の娣の袂の良きに如かず。月望（ぼう）に幾（ちか）し。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「帝乙歸妹、不如其娣之袂良也。其位在中、以貴行也。」（帝乙妹を帰がしむ、其の娣の袂の良きに如かざるなり。其の位中に在り、貴を以て行くなり。）</div>\n<p>殷の帝乙が自分の妹を諸侯に嫁がせた。本人の袂の良さは、脇嫁の袂の良さに及ばない（質素な女である）。その徳は満月に近い月のような輝きである。吉。最後の一句は難しく、程伝によって満月に近い月のような輝きと解する。殷の帝王は生まれた日の甲乙を名にするが、この帝乙がどの帝王かはわからない。</p>\n<p><span class=\"tag\">程伝</span>六五は尊位にいる、帝の妹で貴く高い者である。下の九二に応じる、下嫁の象である。王姫の下嫁は昔からあったが、帝乙の時に至って初めて婚姻の礼を正し、男女の分を明らかにした（本田：これは歴史的にわからない。程伊川の想像である）。至貴の女でも、柔順に降る道を失い、驕り高ぶる志があってはならない。だから易で、陰が尊位にいて謙降する者を「帝乙帰妹」と言う。泰の六五がそれである。貴女が嫁ぐのに、謙降して礼に従うのが尊高の徳であって、容姿を飾って人に悦ばれることを事とするのではない。娣媵は飾りを事とする者で、衣袂は容姿を飾るものである。六五は礼を尚んで飾りを尚ばないので、その袂は娣の袂の良さに及ばない。「良」は美しいこと。「月望」は陰が満ちることで、満ちれば陽（夫）と敵対する。「望に幾し」はまだ満ちるに至らないこと。五は貴高だが常に満ち極まらないので、夫に高ぶらない。だから吉である。女が尊貴にいる道である。</p>\n<p><span class=\"tag\">象伝について程伝</span>帝乙が妹を嫁がせる仕方で言う。袂が娣に及ばないのは、礼を尚んで飾りを尚ばないということである。五は柔中で尊高の位にいて、尊貴の身で中道を行う。柔順に降り屈し、礼を尚んで飾りを尚ばない、これが中道である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高い立場にあっても飾らず、驕らず、満ちきる手前で控えれば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">女承筐无實。士刲羊无血。无攸利。</span></summary><div class=\"body\"><div class=\"yomi\">女、筐（かたみ）を承ぐるに実无し。士、羊を刲（さ）くに血无し。利する攸无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「上六无實、承虚筐也。」（上六実无きは、虚筐を承ぐるなり。）</div>\n<p>嫁が捧げ持つ竹籠に中身がない。花婿が犠牲の羊を割くと血が出ない。何の利益もない。至って悪い判断である。</p>\n<p><span class=\"tag\">程伝</span>上六は女が嫁ぐ卦の終わりにいて、下に応がない。嫁いで終わりを遂げられない者である。婦とは先祖を承け祭祀を奉ずる者で、祭祀を奉じられなければ婦となれない。筐（竹で編んだ籠。筐は四角、筥は丸い）の中身は婦の職として供えるもので、昔は部屋で先祖を祭るのに、器にひしおや菖蒲の根などを盛り、后や夫人がこれをつかさどった。諸侯の祭りには夫が親しく生け贄を割き、卿・大夫・士もみなそうで、血を取って祭った。『礼記』郊特牲に「血祭は気を盛るなり」とある（本田：気とは生命源）。女は筐筥を承事すべきなのに中身がない、つまり祭祀を奉じられない。夫婦は共に宗廟を承けるもので、婦が祭祀を奉じられなければ夫も祭祀を承けられない。だから羊を割いて血がない、祭るものがないのである。祭祀を奉じられなければ離縁されるほかはない。夫婦の終わりのない者で、どこへ行っても利はない。</p>\n<p>本田の講説：受講者が「どうして血が出ないのか」と問うと、実際にはありえないが、妻がお供えの籠を開けると中身がなく、夫が羊を割くと血が出ない、両方とも不吉なたとえである、と答えた。また受講者が「上六と六三が陰同士で応がないのか」と問うと、三と上は対応する関係だが陰同士だから引き合わない、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>中身がないのは空の筐である。空の筐で何を祭ろう。祭祀を奉ずることができないということで、離縁されるのみである。女が嫁いで終わりを遂げない者である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>最も悪い判断。中身のない形だけのもので、結びつき（縁組・契約）は実を結ばず、離れることになる。</div></div></details><div class=\"pager\"><a href=\"#gua-53\">← 風山漸</a><a href=\"#gua-55\">雷火豊 →</a></div>", "gua-55": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 55 卦　第六十三講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">雷火豊</div><div class=\"yo\">らいかほう</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-55\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-55\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-55\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-55\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-55\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-55\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-55\" data-jump=\"yao\">六爻</a></div><h3 id=\"g55-s0\">卦の名と象</h3>\n<p>豊は、たかつきの上に穀物を豊かに盛った形の字である。受講者が「豊というのは良い卦なんですか」と問うと、本田は「いや、これは悪い卦」と答え、蘇東坡などは、聖人は常に自らを不足の場におかなければならない、豊は満ちあふれることだから聖人のことではない、と言っている、と述べた。</p>\n<p>程伝（序卦伝を引く）：「其の帰する所を得る者は、必ず大なり。故に之を受くるに豊を以てす」。物が帰し集まる所は、必ず大を成す。だから帰妹の後を豊が受ける。豊とは盛大の義である。</p>\n<ul class=\"sen\"><li>卦は震が上、離が下。震は動、離は明である。明をもって動き、動いてよく明らか、いずれも豊を致す道である。明であれば天下を照らすに足り、動けば亨るに足る。そうして初めて豊大を致すことができる。</li></ul>\n<h3 id=\"g55-s1\">卦辞</h3>\n<div class=\"orig\">豐、亨。王假之。勿憂。宜日中。</div>\n<div class=\"yomi\">豊は亨る。王之に仮（いた）る。憂うる勿れ。日中に宜し。</div>\n<p>この卦が出たら願いは通る。王者のみがこういう豊かさの極致に至りうる。太陽が中天にかかる時の明るさのようでありたい。そうであれば憂いはない。</p>\n<p><span class=\"tag\">程伝</span>豊は盛の意味で、その義から自ずと亨る。天下の広大を極めるのは王者だけで、「仮」は至ることである。天位の尊さ、四海の富、群生の多さ、王道の大きさ、豊を極める道は王者だけのものである。豊の時は人民が繁庶で事物が盛んで、これを治めて隅々まで行き届かせるのは容易でなく、憂慮すべきである。日中の盛んな明るさが広く照らして及ばない所がないようであって、初めて憂いがない。</p>\n<p>本田の講説：逆に言えば、豊かさという事態において、王者たる者は常に憂えねばならないということである。</p>\n<h3 id=\"g55-s2\">彖伝</h3>\n<div class=\"orig\">豐、大也。明以動、故豐。王假之、尚大也。勿憂宜日中、宜照天下也。日中則昃、月盈則食。天地盈虚、與時消息。而況於人乎。況於鬼神乎。</div>\n<div class=\"yomi\">豊は大なり。明以て動く、故に豊なり。王之に仮るは、大を尚べばなり。憂うる勿れ日中に宜しとは、宜しく天下を照らすべきなり。日中すれば昃（かたむ）き、月盈つれば食く。天地の盈虚、時と消息す。而るを況や人に於いてをや。況や鬼神に於いてをや。</div>\n<p>太陽は中天にかかれば次の瞬間には西へ傾き、月は満月になればその後は欠けはじめる。大自然の満ち欠けすら時とともに縮んだり伸びたりするのだから、まして人間や鬼神（陰陽の気が形を成すもの）においてはなおさらである。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>豊は盛大の義。離の明と震の動が相助けて豊大を成す。</li><li>王者は四海の広さ、兆民の多さを所有し、天下の大を極める。だから豊大の道は王者だけが致せる。所有するものがすでに大きいので、それを保ち治める道もまた大でなければならない。王者の尚ぶところは至って大である。</li><li>所有が広く治める人が多ければ、自分の力が隅々まで及ばないことを憂慮すべきである。日中の盛明のように天下を照らして至らない所がなければ、憂いはない。こうして初めて豊大を保てる。豊大を保有するのは、小才小知でできることではない。</li><li>豊盛の至りを言った上で、それが常に保てないことを言って戒めとする。日は中天で盛りが極まれば傾き、月は満ちれば欠ける。「盈虚」は盛衰、「消息」は進退である。天地の運行も時に随って進退する。「鬼神」とは造化の跡で、万物の盛衰にその消息を見ることができる。豊盛の時にこそこの戒めをなし、中を守って盛りに過ぎないことを欲するのである。豊に処する道は容易ではない。</li></ul>\n<p>本田の講説：彖伝の「日、中すれば昃く」から、豊かであることは非常に憂慮すべきことで、豊かであれば後は欠けるほかない、と戒めているのである。</p>\n<h3 id=\"g55-s3\">大象</h3>\n<div class=\"orig\">雷電皆至、豐。君子以折獄致刑。</div>\n<div class=\"yomi\">雷電皆な至るは豊なり。君子以て獄を折（さだ）め刑を致す。</div>\n<p>雷と稲妻が一緒にやってくる、それが豊である。雷の威厳と稲妻の明るさは裁判に最も必要なものである。君子はこれにのっとって、稲妻の明るさで判決を下し、雷のような威厳で刑罰を行う。</p>\n<p><span class=\"tag\">程伝</span>「雷電皆な至る」とは明と震が並んで行くことで、二体が合わさるので「皆な至る」という。明と動が相助けて豊の象を成す。離は明で照察の象、震は動で威断の象である。獄を折める者は必ずその実情を照らす（『書経』舜典に「惟れ明にして克く允とせらる」、聡明であってこそ民に信頼される）。刑を致すのは悪を威すことで、決断があってこそ刑を行える。だから君子は雷電の明動の象を観て、獄を折め刑を致す。噬嗑の大象には「先王以て罰を明らかにし法を勅す」とあり、豊には「君子獄を折む」とある。噬嗑は明が上にあって威が下にあり、王者の事なので法を立てる。豊は明が下にあって威の上にくっつくので、君子の用で、獄を折め刑を致す。旅は明が上にありながら「君子」と言うが、旅は刑を用いるのに慎重で獄を留めない義を取るからで、君子はみなそうあるべきだからである。</p>\n<p>本田の講説：受講者が「折めるというのは、ほかにどういう場合に出てきますか。折檻なんかそうですね」と問うと、本田は、折獄は『論語』に出てくる、孔子が子路を評して「片言以て獄を折むべき者は、其れ由なるか」と言った、と答えた。「折檻」は、前漢の朱雲という家来が皇帝を手ひどく諌め、皇帝が怒って「下がりおろう」と言うのに欄干にしがみついて離れず、欄干が折れた故事による。だから折檻の原義は君主を手厳しく諌めることである。</p>\n<h3 id=\"g55-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>豊は警戒すべき卦。</b> 豊という卦名は「豊か」の意味だが、彖伝に「日、中すれば昃き、月、盈つれば食く」とあるように、豊かさ自体が警戒すべきものである。『周易折中』に引く蘇東坡の『易伝』に「豊は満ち足りたという意味で、満ち足ればあふれる。だから聖人のことではない」とある。</li><li><b>受講者との問答。</b> 「凶と断じているのは少ないですよね」に本田は「少ない」と答えた。「六二にどうして文章が上手いという意味があるのか」には「六二のいる離の卦に文明という意味があるから」。「六本の爻の中で良いのは六二だけか」には「そう」。「右肱を折るという表現は他の卦にもあるか」には「この卦だけ」と答えた。</li><li><b>明と動の相助け。</b> 初九と九四はどちらも陽で本来なら反発する関係だが、明の初めと動の初めとして相助けるので、往けば喜ばれる。程伝は「舟を同じうすれば胡越も心を一にし、難を共にすれば仇怨も協力す」と言う。</li><li><b>暗君に仕える道。</b> 六二の程伝は、暗君に仕えて心を得られなければ、至誠を尽くして相手の志を感発するのみで、誠意で動かせれば昏蒙も開け、柔弱も補え、不正も正せる、管仲が斉の桓公を助け、諸葛孔明が蜀の後主（二代目）を助けたのがそれだ、と説く。</li></ul>\n<h3 id=\"g55-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>豊かさの極みの時。願いは通るが、満ちれば欠ける。豊かな時こそ憂えて慎め。</li><li>太陽が中天にあるように、隅々まで行き届かせる大きな器量が要る。</li><li>力の等しい相手とは、張り合わず協力すれば喜ばれる（初九・九四）。「俺が先だ」と勝とうとすれば災いがある。</li><li>上に頼れない時は、誠意で相手の心を開け（六二）。</li><li>自ら高ぶって人を遠ざければ、誰も寄りつかない（上六）。</li></ul><h2 class=\"sec\" id=\"g55-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">遇其配主。雖旬无咎。往有尚。</span></summary><div class=\"body\"><div class=\"yomi\">其の配主に遇う。旬（ひと）しと雖も咎无し。往けば尚ぶこと有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「雖旬无咎、過旬災也。」（旬しと雖も咎无し、旬しきを過ぐれば災あるなり。）</div>\n<p>自分と助け合う相手（九四）に会える。主といっても主人の意味ではない。相手は自分と対等だが、それで構わない。「旬」を「ひとし」と読むのは珍しい用例だが、程伊川はそう解する。進んで行けば大切にされる。</p>\n<p><span class=\"tag\">程伝</span>雷電がともに至って豊の象を成し、明と動が相資けて豊の道を致す。明でなければ照らせず、動でなければ行けない。相待つこと形と影のよう、相助けること表裏のようである。初九は明の初め、九四は動の初めで、相待ってその用を成すべきである。だから匹敵する位置にありながら応じ、位は相応じ、用は相資ける。初は四を配主（自分が配する相手）と呼び、四は初を夷主と呼ぶ。配は匹敵の意味だが、相手にくっつく関係で、「天に配す」（先祖を天と並べ祭る）、「君子に配す」（娘を若い男に妻合わせる）の配と同じである。「旬」は均である。天下の相応じるものは、陰が陽に応じ、柔が剛に従い、下が上に附くように、常に匹敵ではない。匹敵すればどうして相従えよう。ただ豊の初と四は用が相資け、応が相成すので、ともに陽剛でも相従って咎がない。明でなければ動いても行く所がなく、動でなければ明を用いる所がない。舟を同じくすれば胡越も心を一つにし、難を共にすれば仇怨も協力する。事勢がそうさせるのである。往って従えば豊を成すことができ、だから「往けば尚ぶこと有り」、喜ばれることがある。他の卦であれば、陽同士で相下らなければ隙が生じる。</p>\n<p>本田の講説：受講者が「これは相助けるからという意味か。普通だったら反発する関係ですね」と言うと、本田は「反発する。しかも明と動が必ず相助け合う関係にあるという」と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>聖人は時によって宜しきに処し、事に随って理に順う。勢いが均しければ相下らないのは常理だが、敵しても相資ける者があるのは相求めるからで、初と四がそれである。人と同じくして力が均しい者は、己を降して相求め、力を合わせて事に従うことにある。もし己を先にする私を抱き、上を凌ぐ意があれば、憂いが至る。均しくして己を先にする、これが「旬しきを過ぐる」で、一たび勝ちを求めれば共同できない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>対等の協力者に出会う。張り合わず力を合わせれば喜ばれるが、相手に勝とうとすれば災いがある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">豐其蔀、日中見斗。往得疑疾。有孚發若、吉。</span></summary><div class=\"body\"><div class=\"yomi\">其の蔀（しとみ）を豊いにす。日中に斗を見る。往けば疑疾を得ん。孚有って発若たれば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有孚發若、信以發志也。」（孚有って発若たりとは、信以て志を発くなり。）</div>\n<p>蔀戸を盛大にかける。蔀とは縁先につっかい棒をして板戸をかけたもので、下ろしてあれば暗いので、日中に北斗七星が見える。押しかけて行けば疑われ憎まれる。真心をもって相手の心を啓発してやれば吉である。「発若」とは相手を感激させること。</p>\n<p><span class=\"tag\">程伝</span>明と動が相資けて豊を成す。二は明の主で、中正を得ており、明である者である。五は相応の地にいるが、陰柔で不正、よく動く者ではない。二と五はともに陰で、明動相資けるべき時に相応の位置にいるが、五の才は足りず、二を助けられない。だから豊を成せず、二はその明の功を失う。明の功がなければ昏暗である。だから「其の蔀を豊いにす、日中に斗を見る」という。斗は暗い時に見えるもの、蔀は周りに立てまわして明を覆い隠すものである。斗は陰に属し運行をつかさどる（北斗が周りの星を回転させる）。五が陰柔で君位にいることにかたどる。日中の盛明の時に斗を見るのは、豊大の時に柔弱な主に遇うようなものである。二は至明中正の才だが、遇うのは柔暗不正の君で、君は下に求めてこない。もし往って求めれば、かえって疑われ憎まれる。暗主とはそういうものである。ではどうすればよいか。君子が上に仕えて心を得られなければ、至誠を尽くしてその志を感発するのみである。誠意で動かせれば、昏蒙でも開け、柔弱でも補え、不正でも正せる。古人が凡庸な君主に仕えてその道を行えたのは、自分の誠意が上に達して君に篤く信じられたからで、管仲が斉の桓公の宰相となり、諸葛孔明が蜀の後主（二代目）を助けたのがそれである。誠信で志を開けば道を行える。だから吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>自分の孚信で上の心志を感発することをいう。開くことができれば吉なことは知るべきである。柔暗であっても、開く道はある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上の人が頼りにならず、こちらから押しかければ疑われる。誠意を尽くして相手の心を開けば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">豐其沛、日中見沫。折其右肱、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の沛（はい）を豊いにす。日中に沫（まい）を見る。其の右の肱を折る。咎むる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「豐其沛、不可大事也。折其右肱、終不可用也。」（其の沛を豊いにすとは、大事に可ならざるなり。其の右の肱を折るとは、終に用う可からざるなり。）</div>\n<p>幔幕を盛大に張りめぐらす。部屋の中は真っ暗になって、日中に小さい星が見える。上の相手は助け甲斐のない人物で、苦労して右腕が折れた。しかし誰を咎めることもできない。</p>\n<p><span class=\"tag\">程伝</span>「沛」は古本に「旆」（旗）の字に作るものがあり、王弼の注に「幡幔」とあるので、王弼の見たテキストはそうだったのだろう。幡幔は室内を囲み覆うもので、蔀よりさらに暗い。三は明体（離）の上にいて、陽剛で正を得て、本来明らかな者だが、かえって四より暗いのは、応じる相手（上六）が陰暗だからである。豊の道は明と動が相資けて成る。上は陰柔で位がなく、震の終わりにいる。震は終わりに至れば止まり、動けない（他の卦は終わりに至れば極まるが、震は終われば止まる）。三は上の応がなければ豊を成せない。沫は星の微小で名も数もないもので、「沫を見る」は暗さの甚だしいことである。右肱は人の最も用いる所で、それが折れれば何もできない。賢智の才も明君に遇えば天下に事をなせるが、頼るべき主がなければ何もできない。人が事をなして失敗すれば、誰かに咎を帰することもできる。しかし動こうとして右肱がなく、上に頼る相手がなければどうしようもなく、咎を帰する所もない。「咎むる无し」とはそういう意味である。</p>\n<p><span class=\"tag\">象伝について程伝</span>三は上に応じるが、上は陰で位がなく、柔弱で勢力がなく、行き詰まりにいる。ともに大事を成せようか。頼る所がなく、右肱が折れたように、ついに用いることができない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に頼るべき相手がなく、片腕をもがれたように何もできない。大事を企てるな。誰を責めても仕方がない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">豐其蔀、日中見斗。遇其夷主、吉。</span></summary><div class=\"body\"><div class=\"yomi\">其の蔀を豊いにす。日中に斗を見る。其の夷主に遇う。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「豐其蔀、位不當也。日中見斗、幽不明也。遇其夷主、吉行也。」（其の蔀を豊いにすとは、位当らざればなり。日中に斗を見るとは、幽にして明らかならざるなり。其の夷主に遇うとは、吉の行いなり。）</div>\n<p>蔀戸を盛大に部屋の周りにめぐらす。室内が暗くて日中なのに北斗が見える。九四が下りて行って、自分と同等の相手（初九）に会えば吉。「夷」は平等・等しい意味である。</p>\n<p><span class=\"tag\">程伝</span>四は陽剛で動の主であり、大臣の位を得ているが、不中正で、陰暗柔弱の主（六五）に遇う。どうして豊大を致せよう。だから「其の蔀を豊いにす」という。蔀は周囲を覆うもので、周りを囲めば大きくなれず、明を覆えば明らかでない。「日中に斗を見る」は、盛明の時にかえって暗いことである。「夷主」は等しい相手で、応じる者なので主という（主人の意味ではない）。初と四はともに陽で上下卦の初めにいて、徳が等しく相応の位置にある。大臣の位にいて、下にいる賢を得、同じ徳で相輔ける。その助けは小さくない。だから吉である。ある人が「四の才で下の賢を得て助けとすれば、豊を致せるか」と問うた。答え：下にいる者が上に位ある者を得て与となり、上にいる者が下の賢才を得て助けとなれば、もちろん益がある。だから吉である。しかし天下の豊を致すのは、しかるべき君があって初めてできる。五は陰柔で動の体にいて、虚心にへりくだり賢を下る象がない。下に賢（初九・九三・九四）が多くても何をなせよう。君が陽剛中正でなければ、天下の豊を致すことはできない。</p>\n<p><span class=\"tag\">象伝について程伝</span>「位当らず」とは、不中正で高位にいることで、だから暗くて豊を致せない。「幽にして明らかならず」は、君が陰柔で、自身も不中正だからである。陽剛の初と四が相遇うのが吉の行いで、四が下りて初に就くので「行」という。下に求めれば吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上が暗く、自分も力を発揮できない。下の対等な協力者に自ら下りて求めれば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">來章、有慶譽。吉。</span></summary><div class=\"body\"><div class=\"yomi\">章を来す。慶誉有って吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六五之吉、有慶也。」（六五の吉は、慶び有るなり。）</div>\n<p>文章の麗しい才能を招くならば、喜びと名誉が得られる。吉。</p>\n<p><span class=\"tag\">程伝</span>五は陰柔の才で豊の主となっており、もとよりその豊を成せない。もし下にいる章美の才を招いて用いれば、福慶があり、名誉も得られる。これが吉である。六二は離の主で文明・中正の徳があり、章美の才である。五が誠にこれを招いて位に就け委任すれば、豊大の慶びと美しい名を致せる。章美の才は二を主として言うが、初・三・四もみな陽剛の才で、五がよく賢才を用いれば、類を同じくして助けに来る。二は陰だが文明中正の徳があり、下にいる大賢である。五と二は陰陽の正応ではないが、明と動が相資ける時にあり、相用をなす位置にある。五が章を来せば慶誉があって吉である。しかし六五には己を虚しくして賢に下る義はない。聖人はこの義を仮に設けて教えとしたのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>吉であるのは、福慶があって天下に及ぶからである。人君が柔暗でも、賢才を用いれば天下の福慶を致せる。ただ、それができないことが憂いである。</p>\n<p>本田の講説：受講者が「この吉も、あまりいい意味の吉ではないですね」と言った。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力は足りないが、下の優れた人材を招いて任せれば、喜びと名誉がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">豐其屋、蔀其家。闚其戸、闃其无人。三歳不覿。凶。</span></summary><div class=\"body\"><div class=\"yomi\">其の屋を豊いにす。其の家に蔀す。其の戸を闚（うかが）うに、闃（げき）として其れ人无し。三歳まで覿（み）ず。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「豐其屋、天際翔也。闚其戸闃其无人、自藏也。」（其の屋を豊いにすとは、天際に翔くるなり。其の戸を闚うに闃として其れ人无しとは、自ら蔵るるなり。）</div>\n<p>屋根を大きくし、家の周りに蔀戸を張りめぐらせる。戸口を窺うとシーンとして人影がない（闃はシーンとする様子）。三年経っても人の出入りを見ない。凶。非常に悪い判断で、豊かという卦だが、ここでは家の周りに立てまわすものが豊かだというのである。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔の質で豊の極みにいて、動の終わりにいる。自己満足して尊大で、騒がしく動くことが甚だしい。豊大の時には謙屈がよいのに、極高にいる。豊大の功を致すのは剛健にあるのに、体は陰柔である。豊大の任に当たるには時を得ることが要るのに、位に当たらない（上は無位の地）。上六のような者は、身の処し方に一つも当たる所がなく、凶なことは知るべきである。「其の屋を豊いにす」は居る所が甚だ高いこと、「其の家に蔀す」は居る所が暗いことである。陰柔で豊大におり、無位の地にいながら、高ぶり暗く、自ら人から絶っている。誰が味方しよう。だから戸を窺うとひっそりとして人がいない。三年の久しきに至っても変わることを知らない。凶なのは当然である。「覿ず」はなお人を見ないことで、変わらないからである。上は卦の終わりにいて変ずる義があるのに変われないのは、その才が変われないのである。</p>\n<p>本田の講説：受講者が「他の卦にも三歳まで……というのがありましたね」と言うと、本田は「三歳というのはよく出てくる」と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>六は豊大の極みにいて、上にいて自ら高ぶること、天の果てに飛び翔けるようである。その高大の甚だしさを言う。「戸を窺うに人无し」とは、豊大の極みにいても実は無位の地で、人はその昏暗なのに自ら高大にするのを見て、みなこれを絶つ。自ら隠れ避けて人と親しまないのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>非常に悪い。自ら高ぶり閉じこもって、人が離れ去る。いつまでも態度を改めなければ凶。</div></div></details><div class=\"pager\"><a href=\"#gua-54\">← 雷沢帰妹</a><a href=\"#gua-56\">火山旅 →</a></div>", "gua-56": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 56 卦　第六十三講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">火山旅</div><div class=\"yo\">かざんりょ</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-56\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-56\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-56\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-56\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-56\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-56\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-56\" data-jump=\"yao\">六爻</a></div><h3 id=\"g56-s0\">卦の名と象</h3>\n<p>旅は豊を上下ひっくり返した形である。旅とは今の「旅行」の観念とは違い、昔は官職を離れて他国に流浪する苦難の時であった。</p>\n<p>程伝（序卦伝を引く）：「豊は大なり。大を窮むる者は必ず其の居を失す。故に之を受くるに旅を以てす」。あまりに大きくなりすぎた者は、その場におれず外にはみ出す。豊盛が窮極に至れば、必ず安んずる所を失う。旅が豊に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦は離が上、艮が下。山はその場に止まって移らず、火は上へ燃え移って居らない。その場を去って留まらない象で、だから旅である。</li><li>また離は「麗く」で、火が山の外に麗いている。これも旅の象である。</li></ul>\n<h3 id=\"g56-s1\">卦辞</h3>\n<div class=\"orig\">旅、小亨。旅貞吉。</div>\n<div class=\"yomi\">旅は小しく亨る。旅の貞にして吉なり。</div>\n<p>旅の卦が出れば、少しだけ願いが通る。旅に出た時は身を守るのが精一杯である。旅の時の正しい道を守れば吉。</p>\n<p><span class=\"tag\">程伝</span>卦の才で言う。卦の才（動かない山の上を火が燃え移る）のようであれば、少し亨ることができ、旅の貞正を得て吉である。</p>\n<h3 id=\"g56-s2\">彖伝</h3>\n<div class=\"orig\">旅小亨、柔得中乎外而順乎剛、止而麗乎明。是以小亨、旅貞吉也。旅之時義大矣哉。</div>\n<div class=\"yomi\">旅は小しく亨る。柔、中を外に得て剛に順い、止まって明に麗く。是を以て小しく亨る。旅の貞あって吉なり。旅の時義大なるかな。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>六が上って五にいる、中を外に得るのである。上下の陽（上九・九四）に附く、剛に順うのである。下の艮は止まり、上の離は麗く。止まって明に麗くのである。柔順で外の中を得、止まる所が明に麗く。だから少し亨ることができ、旅の貞正を得て吉である。旅の困しい時は、陽剛中正で下に助けがあるのでなければ大いに亨ることはできない。「外に在るの中」を得ているとは、中は一つの仕方（一揆）ではなく、旅には旅の中があるということである。止まって明に麗けば時宜を失わず、そうして初めて旅に処する道を得る。</li><li>天下の事は時に随ってそれぞれ宜しきに適うべきだが、旅は処し難い時である。だからその時義の大きさを称える。</li></ul>\n<p>本田の講説：受講者が「一揆というのは百姓一揆の一揆ですか」と問うと、「同じ。揆は取るの意味、一揆は主義主張を一つにするという意味」と答えた。</p>\n<h3 id=\"g56-s3\">大象</h3>\n<div class=\"orig\">山上有火、旅。君子以明愼用刑、而不留獄。</div>\n<div class=\"yomi\">山上に火有るは旅なり。君子以て明らかに慎んで刑を用いて、獄を留めず。</div>\n<p>山の上に火があり、どこをも明々と照らす、それが旅である。君子はこれにのっとって、明察と慎重さで刑罰を行い、火が次々に燃え移るように、罪人を長く獄中に留めない。</p>\n<p><span class=\"tag\">程伝</span>火が高い所にあれば照らさない所はない。君子は明照の象を観て、明慎をもって刑を用いる。明は恃みにしてはならないので、慎みを戒めとする。明であって止まるのも慎みの象である。行って留まらない象を観て、獄を留めない。獄はやむを得ず設けるもので、民が罪を犯して入る。どうしていつまでも留めておけよう。</p>\n<h3 id=\"g56-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>旅の時の四と五。</b> 旅の卦では、五も旅に出ているので君主の意味を取らず、四も大臣の位とは言えない。天子は天下が自分の家なので旅ということがなく、君主が旅に出れば位を失うことになる。孔子が司法大臣だったのが、旅に出たら無冠の大夫となったのと同じである。</li><li><b>旅とは国外に出ることだけではない。</b> 六五の程伝は、苦しんで安んずる所を得ず、親しむ者が少なければ、それはすべて旅の時である、と言う。</li><li><b>受講者との問答。</b> 「旅に出るというのはなかなか難しいんですね」「旅の時に斧が必要だというのは実感がありますね」という感想が出た。「なぜ次の字でやどるの意味になるのか」に、受講者が「東海道五十三次の次じゃないですか、旅に出たら次々に宿に泊まる」と言い、本田は「東海道五十三次の次の字は確かにこの用法」と答えた。また「次」は師の六四の「師左に次る」にもある。</li></ul>\n<h3 id=\"g56-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>旅の卦が出れば、願いは少しだけ通る。身を守るのが精一杯の時。</li><li>旅先（不安定な立場）では、柔順にへりくだるのが第一。</li><li>こせこせとけち臭いことをすれば恥と災いを招く（初六）。</li><li>鼻息荒く自ら高ぶれば、居場所も味方も失う（九三・上九）。</li><li>中庸を守り、上下に親しまれれば、ついには誉れを得る（六五）。</li></ul><h2 class=\"sec\" id=\"g56-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">旅瑣瑣。斯其所取災。</span></summary><div class=\"body\"><div class=\"yomi\">旅のとき瑣瑣（ささ）たり。斯れ其の災を取る所なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「旅瑣瑣、志窮災也。」（旅のとき瑣瑣たるは、志窮まって災あるなり。）</div>\n<p>旅に出て、こせこせとけち臭い行動ばかりしている。これこそ恥をかき災難を招く所以である。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔で旅の時にいて、卑しく低い所にいる。柔弱の人が旅に困しんで卑賤にいる、心に存するところが汚く低い者である。志の低い人が旅に困しめば、卑しく細々として何でもする。これが侮辱を招き災いを取るゆえんである。「瑣瑣」はみだりがましく細々とした様子である。旅に困しむ時に才質がこのようでは、上に助け（九四）があっても何にもならない。四は陽性で離の体（火で燃え上がる）なので、下に親しむ者ではない。また旅にあるので、他の卦で四を大臣の位とするのとは違う。</p>\n<p>本田の講説：旅に出ているので、大臣に相応しい人物でも大臣の位にはいない。孔子が司法大臣だったのが、旅に出たら無冠の大夫となったのと同じである。</p>\n<p><span class=\"tag\">象伝について程伝</span>志が窮迫して、自ら災いを取るのである。「災」と「眚」は対にすれば、災は外から降りかかるもの、眚は自分の過失という区別があるが、一字で言えばどちらも「わざわい」である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>苦境でこせこせと卑しい振る舞いをすれば、侮られ災いを招く。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">旅即次。懷其資。得童僕貞。</span></summary><div class=\"body\"><div class=\"yomi\">旅のとき次（やど）りに即く。其の資（たから）を懐く。童僕の貞を得たり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「得童僕貞、終无尤也。」（童僕の貞を得るは、終に尤无きなり。）</div>\n<p>旅行中、旅籠屋に泊まる。旅費はたっぷり懐にある。忠実なしもべもいる。</p>\n<p><span class=\"tag\">程伝</span>二は柔順中正の徳がある。柔順なら衆が味方し、中正なら身の処し方が当を失わない。だから持っているものを保ち、童僕も忠信を尽くす。五の文明の徳と上下の助けには及ばないが、旅に処する善い者である。次舎は旅で安んずる所、貨財は旅で助けとする所、童僕は旅で頼る所である。次舎に就き、資財を懐にし、忠良な童僕を得る、旅の善である。柔弱で下にいる者が童（初六）、強壮で外にいる者が僕（九三）で、二は柔順中正なので内外の心を得る。旅で親しむのは童僕である。吉と言わないのは、旅の際は災いの類を免れればそれで善いからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>旅の人が頼るのは童僕で、その忠を得れば、ついに咎も後悔もない。</p>\n<p>本田の講説：受講者が「次の字は宿るという意味か」と問うと、「次は宿る。師の卦の六四に『師左に次る』とあった」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>落ち着き先、資金、忠実な助け手を得る。旅（不安定な立場）としては善い状態で、咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">旅焚其次。喪其童僕貞。厲。</span></summary><div class=\"body\"><div class=\"yomi\">旅のとき其の次りを焚く。其の童僕の貞を喪う。厲（あやう）し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「旅焚其次、亦以傷矣。以旅與下、其義喪也。」（旅のとき其の次りを焚く、亦た以て傷ましし。旅を以て下に与す、其の義、喪わるるなり。）</div>\n<p>旅の時、旅籠屋が火事になった。しもべたちの忠実さもなくした。我が身は危うい。</p>\n<p><span class=\"tag\">程伝</span>旅に処する道は柔順・謙下を先とする。三は剛で中でなく、下体（艮・山）の上にいて、自ら高しとする象がある。旅にあって剛に過ぎ自ら高しとするのは、困災を招く道である。自ら高しとすれば上に順わないので、上は味方せず、次りを焚く、安んずる所を失う。上の離は焚く象である。剛に過ぎれば下に暴であるから、下は離れて童僕の貞信を失う、その心を失うのである。このようであれば危うい道である。</p>\n<p>本田の講説：受講者が「どうして宿を焚くことになるのか」と問うと、六二で宿に就くと言ったので、三は二という中庸の道を外れて高く上りすぎ、自ら高しとして宿を失う、だから宿を焚くと言う、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>旅で次舎を焚失する、困しみ傷むべきことである。旅の時に下に対する道がこのようであれば、義として忠貞を失うはずである。旅で過剛で自ら高しとして下に接すれば、必ずその心を失う。旅で童僕の心を失うのは危ぶむべきことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>不安定な立場で高ぶり、下に強く当たれば、居場所も部下の心も失う。危うい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">旅于處。得其資斧。我心不快。</span></summary><div class=\"body\"><div class=\"yomi\">旅のとき于（ここ）に処る。其の資斧を得たり。我が心快からず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「旅于處、未得位也。得其資斧、心未快也。」（旅のとき于に処るは、未だ位を得ざるなり。其の資斧を得たり、心未だ快からざるなり。）</div>\n<p>旅行中、一休みする場所を得た。旅費と、草木を切り払い薪を取る斧（旅行中に必須の物）は手元にある。ただ強い味方がいないので、心はまだ愉快でない。</p>\n<p><span class=\"tag\">程伝</span>四は陽剛で中にいないが、柔位にいて上体の下にいる。柔を用いてよく下る象があり、旅の宜しさを得ている。剛明の才で五に味方され、初に応じられる。旅にあって善い者である。しかし四は正でないので、落ち着き所（処止）を得ても、二が次舎に就くのには及ばない。剛明の才があって上下に味方されるのは、旅で貨財の資と器用の利を得ることである。旅では善いが、上に剛陽の味方がなく（六五は柔弱）、下はただ陰柔（初六）が応じるだけなので、才を伸ばし志を行うことができず、心が快くない。「我」とは四について言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>四は君に近く、ふつうは位に当たるとするが、旅では五に君の義を取らないので、四もまだ位を得ていない。ある人が「ならば陽で四にいるのは不正で、咎ありとすべきではないか」と問うた。答え：剛で柔位にいるのは旅の宜しさである。剛明の才で、時を得て志を行いたいと思っている。だから資斧を得たのは旅においては善いが、その心志はまだ快くない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ひとまず落ち着き場所と手段は得たが、力を振るえる立場ではなく、心は満たされない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">射雉、一矢亡。終以譽命。</span></summary><div class=\"body\"><div class=\"yomi\">雉を射て、一矢もて亡（ほろぼ）す。終に以て誉命あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「終以譽命、上逮也。」（終に以て誉命ありとは、上逮（およ）ぶなり。）</div>\n<p>一本の矢で雉を射落とした（「一矢もて亡す」は程伊川の読み方で、「一矢亡う」という読みもある）。雉を射止めたことで、ついに名誉と爵位を得た。</p>\n<p><span class=\"tag\">程伝</span>六五は文明・柔順の徳があり、中道を得て、上下（上九・九四）が味方する。旅に処する至善の者である。人が旅にあって文明の道に合うのは善と言える。旅の人が動いて過失があれば困辱が付いてまわるが、動いて失がなくて初めて善である。離は雉で（説卦伝に「離を雉と為す」）、模様の明らかな文明の物である。「雉を射る」とは文明の道に必ず合うことで、一矢で射落とすように、発して当たらないことがなければ、ついに誉命を致す。「誉」は良い評判、「命」は福禄である。五は文明の位にいて文明の徳があるので、動けば必ず文明の道に当たる。五は君位だが、人君には旅がない。旅をすれば位を失う。だから君の義を取らない。</p>\n<p><span class=\"tag\">象伝について程伝</span>文明柔順の徳があれば上下が味方する。「逮」は与する（味方する）ことである。よく上に順って上に味方される。人の上にあっては下に気に入られ、人の下にあっては上に味方される。旅で上下に味方されるのが誉命を致すゆえんである。旅とは困しんで安んずる所を得ない時で、「終に以て誉命あり」とはついに誉命を致すということ。誉命があれば、もはや旅ではない。困しんで親しむ者が少なければ旅で、必ずしも国外にいることではない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>一発で的を射止め、ついに名誉と地位を得る。上下に好かれ、苦境から抜け出せる吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">鳥焚其巣。旅人先笑後號咷。喪牛于易。凶。</span></summary><div class=\"body\"><div class=\"yomi\">鳥其の巣を焚く。旅人先に笑い、後に号咷（ごうとう）す。牛を易（やす）きに喪う。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「以旅在上、其義焚也。喪牛于易、終莫之聞也。」（旅を以て上に在り、其の義、焚かるるなり。牛を易きに喪う、終に之を聞く莫きなり。）</div>\n<p>鳥の巣が焼けた。旅人が最初は笑っているが、後には泣き喚く。うっかりして牛をなくしてしまう（「易」は安易・うっかりの意味で、「易きに喪う」は程伊川の読み。他の注釈では「易に喪う」と読み、易を場（国境）の意味に解する説があり、本田はそちらの方が本当は正しいだ
