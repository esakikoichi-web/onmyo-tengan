物だが、脆くて折れやすい。五がもし莧陸のように陰に感じても、それを決断することが易ければ中行において咎はない。そうでなければ中正を失う。陰に感じることが多い物のうち莧陸は断ちやすいので、象に取ったのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>爻辞は「夬を夬とす」と言い、それで「中行において咎无し」とした。象伝はさらにその義を尽くして「中未だ光いならず」と言う。人は心が正しく意が誠であって、初めて中正の道を極め、充実して光り輝く。五は心に親しむところがあり、義として不可なので決したのである。外では中正の義を失わず咎がないとはいえ、中道においてはまだ光大とは言えない。人の心はひとたび欲するところがあれば道を離れる。孔子がここで人に示す意味は深い。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>心惹かれる相手でも、道に外れるなら思い切って断ち切れ。断てば咎はないが、心惹かれた時点ですでに完全とは言えない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">无號、終有凶。</span></summary><div class=\"body\"><div class=\"yomi\">号（さけ）ぶ无し。終に凶有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「无號之凶、終不可長也。」（号ぶ无きの凶は、終に長かる可からざるなり。）</div>\n<p>泣き叫んでも無駄である。最後は凶。ここの「号」は平声に読めと注があり、その時は「泣き叫ぶ」の意味になる。</p>\n<p><span class=\"tag\">程伝</span>陽が長じてまさに極まろうとし、陰が消えてまさに尽きようとしている。一陰だけが窮まった地にいる。衆君子が時を得て、危うい極みにある小人を決し去るのである。その勢いは必ず消え尽きる。だから泣いても無駄、終に必ず凶がある、と言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>陽剛の君子の道は進んでますます盛んで、小人の道はすでに窮まり、自然に消え亡ぶ。どうしてまた長く続けられよう。泣き叫んでも無駄である。先儒は、卦の中に「孚あって号す」「惕れて号す」とあるので、「号ぶ无し」も号令の意味で去声に読み、さらに号令を加えても無駄だという意味だとした。これは間違いである。一卦の中にたまたま同じ字の平声と去声があっても何の差し支えもない。しかし易を読む者はおおむねみなこれを疑う。ある人が問うた。「聖人は天下に対して、大悪人でもいまだかつて必ずしも絶たなかった。今ただちに泣いても無駄だと言い、必ず凶があると言うのはよいのか」。答え：夬は小人の道が消え亡ぶ時である。小人を決し去る道は、必ずしも尽く誅殺することではない。改心させれば小人の道は亡ぶ。道が亡ぶのが小人にとっての凶である。</p>\n<p>本田と受講者の問答：受講者が「この卦が出たら絶対の凶だな」と言うと、本田は「いや、君子にとってはよろしい。小人にとっては免れない」と答えた。「これだけはっきり凶と出るのは少ないね」と言われ、少ない、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>追い詰められた側には、もう逃れる道はない。泣いても無駄で終には凶。ただし正しい側にとっては悪を除き切る時である。</div></div></details><div class=\"pager\"><a href=\"#gua-42\">← 風雷益</a><a href=\"#gua-44\">天風姤 →</a></div>", "gua-44": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 44 卦　第五十七講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天風姤</div><div class=\"yo\">てんぷうこう</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-44\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-44\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-44\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-44\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-44\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-44\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-44\" data-jump=\"yao\">六爻</a></div><h3 id=\"g44-s0\">卦の名と象</h3>\n<p>下は巽で謙遜の意味、風のシンボル。上は乾で天のシンボル。天の下に風がある。夬の卦を上下ひっくり返した形で、六本の爻のうち下の一本だけが陰である。本田は、五人の男に女が一人と思えばよろしい、と言う。</p>\n<p>程伝（序卦伝を引く）：「夬とは決なり。決すれば必ず遇うこと有り。故に之を受くるに姤を以てす。姤とは遇なり」。決とは判（わか）れることである（判は半と刀を合わせた字で、刀で半分に分けるのが原義）。物が決して分かれれば、遇合（たまたま合う）することがある。もともと合っていれば、どうして遇うことがあろうか。姤が夬に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>二体で言えば、風が天の下を行く。天の下は万物の世界で、風が行けば触れないものはない。遇うの象である。</li><li>また一陰が始めて下に生じ、陰が陽と遇う。だから姤という。</li></ul>\n<p>本田の講説：受講者が「本来合致しているものなら偶然合うことは有り得ないというのはよくわからない」と問うと、本田は、もともと一体のものなら行き遇うということはない、男と女が夫婦になるのは本来別のものが合っているから切り離れることもあり、切り離れることがあるからばったり合うのだ、ここらへんはちょっと程伊川の説も苦しい、と答えた。</p>\n<h3 id=\"g44-s1\">卦辞</h3>\n<div class=\"orig\">姤、女壯。勿用取女。</div>\n<div class=\"yomi\">姤は女壮んなり。用て女を取る勿れ。</div>\n<p>この卦が出たら、鼻息の荒い女である。こんな女を妻として娶ってはならない。本田は、あまりよくない判断で、結婚を占ってこの卦が出たら絶対アウト、と言う。</p>\n<p><span class=\"tag\">程伝</span>一陰が始めて生じ、これから長じてだんだん盛んになる。女がまさに長じ壮んになろうとするのである。陰が長ずれば陽は消え、女が壮んなら男は弱い。だからこのような女を娶るなと戒める。女を娶るのは、その柔和で順従な性質で家道を成そうとするためである。姤は陰が始めて進み、だんだん壮んになって陽に匹敵しようとするもので、だから娶ってはならない。女がだんだん壮んになれば男女の正を失い、家道は敗れる。姤は一陰で甚だ微かだが、だんだん壮んになる道があるので戒めるのである。</p>\n<p>本田の講説：受講者が「封建的ですね」「これは女性に読ませたくないですね」と言うと、本田は、これは易の作者がそれだけ女性を恐れているのだ、と答えた。</p>\n<h3 id=\"g44-s2\">彖伝</h3>\n<div class=\"orig\">姤、遇也、柔遇剛也。勿用取女、不可與長也。天地相遇、品物咸章也。剛遇中正、天下大行也。姤之時義大矣哉。</div>\n<div class=\"yomi\">姤は遇なり。柔、剛に遇うなり。用て女を取る勿れとは、与に長かる可からざればなり。天地相遇って品物咸（みな）章（あきら）かなり。剛、中正に遇いて、天下大いに行わるるなり。姤の時義、大なるかな。</div>\n<p>本田の講説：姤と遇は古語ではほとんど似た母音で、同じ母音の字を持ってきて解釈したもの。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>姤の義は遇である。卦が姤であるのは、柔が剛に遇うからである。一陰が始めて生じ、始めて陽と遇うのである。</li><li>陰が生じてだんだん長じ盛んになる。陰が盛んなら陽は衰える。女を娶るのは長久に家を成そうとするからで、このだんだん盛んになる陰はまさに陽を消し勝とうとするので、ともに長久であることはできない。およそ女子・小人・夷狄は、勢いが少しでも盛んになれば、どうしてともに久しくできようか。だから「このような女を娶るな」と戒める。</li><li>陰が始めて下に生じて陽と遇う。天地が相遇うのである。陰陽が交わり遇わなければ万物は生じない。天地が相遇えば庶類を化育する。「品物咸章かなり」とは万物が明らかになることである。</li><li>卦の才で言う。五と二はどちらも陽剛で中にいる。剛で中正をもって遇うのである。君は剛中の臣を得、臣は中正の君に遇う。君臣がともに剛陽で中正に遇えば、その道は大いに天下に行われる。</li><li>姤の時と姤の義が至って大きいことを称える。天地が遇わなければ万物は生じず、君臣が遇わなければ政治は興らず、聖賢が遇わなければ道徳は亨らず、事物が遇わなければ功用は成らない。姤の時と義はみな甚だ大きい。</li></ul>\n<p>本田の講説：孔子も「女子と小人は養い難し」と言うが、そこに程伊川が夷狄を加えた。北宋はいつも金という夷狄に悩まされていた。この陰は娶ってはいけないが、遇うということ自体は必ずしも悪くないという。二は不正（陽が陰位）だが、程伊川は中を得ていれば正・不正はあまり問題にしない。</p>\n<h3 id=\"g44-s3\">大象</h3>\n<div class=\"orig\">天下有風、姤。后以施命誥四方。</div>\n<div class=\"yomi\">天の下に風有るは姤なり。后（きみ）以て命を施し四方に誥（つ）ぐ。</div>\n<p>天の下に風が吹けば、四方に遍く行き渡る。それが姤である。君主はこれにのっとって、命令を発し四方に告げる。「后」の字を「おきさき」の意味に使うのは二次的な意味で、一番古くは君主の意味である。</p>\n<p><span class=\"tag\">程伝</span>風が天下を行けば遍く行き渡らない所はない。君后はその周遍の象を見て、命令を施して遍く四方に告げる。「風、地上を行く」と「天の下に風有り」は、どちらも庶物に周遍する象である。地上を行って遍く万物に触れるのは観で、経歴観省（巡視）の象である。天下を行って四方に周遍するのは姤で、命令を施し発する象である。諸々の象伝で、あるいは先王、あるいは后、あるいは君子・大人と称する。先王と称するのは、先王が法制を立て、国を建て、楽を作り、方を省み、法を正し（勅し）、関を閉じ、物を育て、帝を享る場合である。后と称するのは后王のなす所で、天地の道を財成し、命を施し四方に誥ぐ場合である。君子は上下の通称、大人は王公の通称である。</p>\n<p>本田の講説：それぞれ象伝の一句を踏まえている。罰を明らかにし法を正すのは噬嗑「先王以て罰を明らかにし法を勅す」、国を建てるのは比「万国を建て」、楽を作るのは豫「楽を作り徳を崇ぶ」、方を省みるのは観「方を省み民を観る」、関を閉じるのは復「至日に関を閉ず」、物を育てるのは无妄「万物を育す」に似た文句、帝を享るのは渙「帝を享り廟を立つ」、天地の道を財成するのは泰「后以て天地の道を裁成す」である。</p>\n<h3 id=\"g44-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>女一人に男五人。</b> 姤は六本の爻のうち陰が下に一つだけで、皆がこの女を狙っている。一番近い二が先にくっついてしまい、他の者はみなつとの中の魚がなくなった状態になる。受講者が「なんだかわけのわからない卦ですね」「六角関係ですか」「本来なら四が初と応じているのに、隣の二に寝取られちゃったんですね」と言い合った。本田は、正当な地位にいるから正しいとばかりはいかない、と言い、受講者の「こういうのは儒教学者的な解釈にないですね」に、易の作者ははるかに現実的だ、と答えた。</li><li><b>卦辞と爻辞。</b> 受講者が「女を娶るなかれ」と爻辞は何の関係があるのかと問うと、本田は、爻辞と卦辞は必ずしも関係ない、と答えた。</li><li><b>男一人に女五人。</b> 受講者が、逆に男が一人に女が五人の卦（剝や復）ではそういうことは言わないのかと問うと、本田は、一夫多妻の時代だからそれはかまわない、天子は礼の制度で百二十人の奥さんがいたし、実際はもっといただろう、完全に男尊女卑だ、と答えた。</li><li><b>魚の話。</b> 魚は当時の人々にとって貴重なもので、だいたい川魚ばかり、海魚は干し魚か塩漬けにした。秦の始皇帝が天下巡視の途中で亡くなった時、喪を隠して棺をこっそり運ぶのに、屍臭がわからないように車一杯に干し魚や干しあわびを積んで輸送したと『史記』にある。</li><li><b>賢人を求める君主。</b> 九五の程伝は、殷の高宗が夢に見た顔を捜し求めて、城を築く土工の中から傅説を見出し宰相に抜擢したこと（『書経』説命）、周の文王が魚を釣る隠者の太公望呂尚に出会ったこと（『史記』斉世家）を挙げる。太公望とは「太公、汝を望む」というニックネームで、本名は呂尚である。</li><li><b>天理。</b> 「天理」の二字は程伊川の得意の説で、伊川が作った熟語ではないが、自分の体験から得た二字であると語録の中にある。</li><li><b>良い爻は少ない。</b> 卦の判断「用て女を取る勿れ」、各爻の判断とも、あまり良い卦ではない。かろうじて良いのは九二と九五くらいである。</li></ul>\n<h3 id=\"g44-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>思いがけない出会いの時。ただし相手は気が強く、だんだん勢いを増してくる。結婚を占ってこの卦が出たら、娶ってはならない。</li><li>小さな悪・陰の芽は、微かなうちに止めよ（初六）。</li><li>出会った相手とは専一に結べ。他に心を移すな（九二）。</li><li>身近な者を失うのは、自分が下を遠ざけた結果（九四）。</li><li>上に立つ者が中正の徳を内に含み、へりくだって賢人を求めれば、天から授かるように得られる（九五）。</li><li>高ぶって角を突き出すような態度では、誰とも遇えず恥をかく（上九）。</li></ul><h2 class=\"sec\" id=\"g44-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">繋于金柅、貞吉。有攸往、見凶。羸豕孚蹢躅。</span></summary><div class=\"body\"><div class=\"yomi\">金柅（きんじ）に繋る。貞吉なり。往く攸有れば凶を見る。羸（るい）豕、孚に蹢躅（てきちょく）たり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「繋于金柅、柔道牽也。」（金柅に繋るは、柔道牽（すす）めばなり。）</div>\n<p>金属の車止めを咬ませて、さらに紐でくくる（金は金属の意味で、銅であっても金という。「柅」は車輪に咬ませる楔形の車止めで、つくりの「尼」に止める意味がある）。そうすることが正しくて吉。前進させれば悪い目に遭う。痩せた豚が心中ひそかに跳躍を図っている（「羸」は痩せている、熟語で羸痩。「孚」は心中ひそかに。「蹢躅」は跳びはねること）。本田は、非常に象徴的な文句で、多少ユーモラスなニュアンスもある、と言う。</p>\n<p><span class=\"tag\">程伝</span>姤は陰が始めて生じて長じようとする卦である。一陰が生じれば長じてだんだん盛んになり、陰が長ずれば陽が消える。小人の道が長ずるのである。これを制するのは、まさに微かでまだ盛んでない時にすべきである。柅は車を止める物で、金で作るのは堅強の至りである。金柅で止め、さらに繋ぐのは、止めることの固さである。固く止めて進めないようにすれば、陽剛の貞正の道にとって吉である。進み往かせれば、だんだん盛んになって陽を害する。これが凶を見ることである。「羸豕孚に蹢躅」とは、聖人が重ねて戒めて言ったもので、陰は甚だ微かでも忽せにしてはならない。豕は陰躁の物なので喩えとした。羸弱な豕はまだ強猛にはなれないが、その心中は跳びはねることにある。陰が微かで下にいるのは羸と言えるが、その心中は陽を消すことにある。君子と小人は道を異にし、小人はたとえ微弱な時でも君子を害する心がないことはない。微かなうちに防げば、何もできない。</p>\n<p><span class=\"tag\">象伝について程伝</span>牽とは引いて進むことである。陰が始めて生じてだんだん進む。柔道がまさに進もうとするのである。これを金柅に繋ぐのは、その進みを止めるためである。進ませなければ正道を消すことはできず、それが貞吉である。</p>\n<p>本田の講説：受講者に「牽」の書き順を問われ、玄を書いて「わかんむり」をかぶせ下に牛、ケンという発音は玄から来ている、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>小さな悪の芽、よからぬ勢いは、微かなうちにしっかり止めよ。進ませれば凶。見かけは弱々しくても油断するな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">包有魚、无咎。不利賓。</span></summary><div class=\"body\"><div class=\"yomi\">包（つと）に魚有り。咎无し。賓に利あらず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「包有魚、義不及賓也。」（包に魚有るは、義として賓に及ばざるなり。）</div>\n<p>わらづとに魚がある（魚とは初六を指す）。そのこと自体に咎はない。外から来た客にまで振る舞うことはない。</p>\n<p><span class=\"tag\">程伝</span>姤は遇である。二と初は親しく隣り合い、相遇う者である。他の卦では初は四に正応するが、姤では遇を重しとする（本田：初と四、二と五という本来の組み合わせでなく、隣り合う初と二の方が重い）。相遇う道は専一を主とする。二は剛中で、遇うにはもとより誠をもってする。しかし初は陰柔で、衆陽が上にいて、また相応ずる四もいる。その志が求める所である。陰柔の質は貞固であることが難しい。だから二が初に遇っても、その誠心を得難い。遇う相手の誠心を得られないのは、遇の道が背くことである。包は苴裹（わらづと）である。魚は陰物の美味なもので、陽が陰に対してそれを悦び美とするので魚の象を取る。二が初に対して、もし固くこれを包み止めること、包に魚があるようであれば、遇において咎はない。賓とは外から来る者である。「賓に利あらず」とは、包の魚をどうして賓に及ぼせようか、さらに外人に及ぼしてはならないということである。遇の道は専一であるべきで、二つになれば雑である。</p>\n<p>本田の講説：初六は六本の爻の中でたった一人の女性で、上に五人の男がいる。陰性で柔弱なので志がいつも二つにも三つにも割れる。魚は水中に棲むので陰性、火が陽の代表なら水は陰の代表である。</p>\n<p><span class=\"tag\">象伝について程伝</span>二が初に遇うには、外に二心があってはならない。包に魚があるようにすっぽりと専一であるべきである。包の魚は、義として賓客に及ばない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>出会った相手としっかり結びついていれば咎はない。その相手を他人にまで広げるな。関係は専一に。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">臀无膚、其行次且。厲、无大咎。</span></summary><div class=\"body\"><div class=\"yomi\">臀に膚无し。其の行くこと次且たり。厲うけれども大いなる咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「其行次且、行未牽也。」（其の行くこと次且たるは、行くこと未だ牽まざるなり。）</div>\n<p>尻の皮膚が擦りむけて、歩こうにもぎくしゃくして進めない。危険を自覚すれば大きな咎はない。</p>\n<p><span class=\"tag\">程伝</span>二と初はすでに相遇った。三は初を悦んで、密かに二と隣り合っている。安んずる所ではない。また二に忌み憎まれる（競争相手だから）。その居ることが安らかでないのは、尻に膚がないようなものである。居ることが安らかでなければ去るべきだが、遇の時にいて、志は遇うことを求めている。一陰が下にいて、それは皆が欲する相手である。だから居るのが安らかでなくても、行くのもまたぎくしゃくする。次且とは進むことが困難なさまで、にわかに捨て去れないことを言う（本田：「捨てる」とは今いる場所を捨てること、相手を思い切ることの両方の意味がある）。しかし三は剛で正位にいて巽の体にいるので、終わりまで迷うことはない。もしその不正を知って危懼を抱き、敢えて妄動しなければ、大いなる咎はないことができる。義でないのに遇うことを求めるのは、もとよりすでに咎がある。危うさを知って止まれば、大いなる咎には至らない。</p>\n<p>本田の講説：テキストの注によって「咎」の字を補う。</p>\n<p><span class=\"tag\">象伝について程伝</span>その始めの志は初に遇うことを求めたので、行きが遅々として進まない。行くのを速やかにしない。危うさを知って改めたので、大いなる咎には至らないのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>望んではいけない相手に心を寄せて、居るも進むもままならない。危うさを自覚して妄動しなければ大きな咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">包无魚。起凶。</span></summary><div class=\"body\"><div class=\"yomi\">包に魚无し。凶を起こさん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「无魚之凶、遠民也。」（魚无きの凶は、民に遠ざかるなり。）</div>\n<p>つとに魚がなくなった（九二に奪われたのである）。難儀が起こるであろう。</p>\n<p><span class=\"tag\">程伝</span>包は包み蓄える物、魚は美とする物である。四と初は正応で、当然遇うべきだが、初はすでに二に遇ってしまった。その遇う相手を失ったのは、包に魚がないようなものである。その所有するものを失ったのである。四は遇の時に上位にいて、その下（民）を失った。下が離れるのは自分の徳を失ったことによる。四の失とは中正でないことである。不中正でその民を失ったので凶である。ある人が問うた。「初が二に従ったのは近いからで、四の罪ではなかろう」。答え：四について言えば、当然咎がある。下を保てなかったのは道を失ったからである。上が道を失わないのに下が離れることがあろうか。遇の道は、君臣・民主・夫婦・朋友みなここにある。四は下が離れたことから民を主として言う。上にいて下が離れれば、必ず凶変がある。「起」とはまさに生じようとすること。民心がすでに離れ、難がまさに起ころうとするのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>下が離れるのは自分が招いたのである。「民に遠ざかる」とは自分が民を遠ざけたのである。上にいる者が、民を離れさせるようにしたところがあるのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>あるはずのものを失い、身近な者に去られる。自分が下を遠ざけた結果で、やがて難儀が起こる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">以杞包瓜。含章。有隕自天。</span></summary><div class=\"body\"><div class=\"yomi\">杞（おうち）を以て瓜を包む。章を含む。天より隕（お）つること有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九五含章、中正也。有隕自天、志不舍命也。」（九五の章を含むは、中正なればなり。天より隕つること有りとは、志、命を舎（たが）わざればなり。）</div>\n<p>オウチの葉で瓜を包む（「杞」を柳行李と解釈する注もあるが、程伝では棟（おうち）の葉）。あやのあるもの（章、瓜を指す）を内に包んだ形である。こうであれば天から福が降ってくる。本田は、これは今までの爻辞の中では良い判断だと言う。</p>\n<p><span class=\"tag\">程伝</span>九五は下にも応がない（二は陽で、しかも初にかかずらわっている）。遇う相手がいるわけではない。しかし遇の道を得ているので、終には必ず遇う。上下が遇うのは互いに求めるからである。杞は高木で葉が大きく、高い所にいて体が大きく物を包めるものである。美しい実で下にあるのは瓜である。美味で下にいるのは、側微（身分が低く人に知られない）の賢人の象である。五は尊い君位にいて、下に賢才を求める。至高の身で至下に求めるのは、杞の葉で瓜を包むようなもので、このようによく自ら降り屈するのである。しかも内に中正の徳を蘊み、充実して美しい。人君がこのようであれば、求める相手に遇わないはずはない。身を屈して賢を求めても、自分の徳が正しくなければ、賢者は用いられることを潔しとしない。だから必ず章を内に含み畜え、至誠を内に積めば、天から隕ちてくることがある。天から降るというようなもので、必ず得られることを言う。昔から、至誠で身を屈し中正の道で天下の賢を求めて、遇わなかった例はない。殷の高宗が夢に感じて傅説を得、周の文王が漁釣の者（太公望）に遇ったのは、みなこの道による。</p>\n<p><span class=\"tag\">象伝について程伝</span>「含章」とはその中正の徳を含み蘊むことである。徳が充実すれば章を成して光がある。命は天理で、舎は違うことである。至誠中正で身を屈して賢を求め、その志の存し方が天理に合う。だから天から隕つることがあり、必ず得るのである。</p>\n<p>本田の講説：「舎」は「捨て置く」という字だが、伊川は「たがう」と読ませる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高い地位にあってもへりくだり、内に中正の徳と誠を蓄えて人を求めれば、天から授かるように良き出会い（賢人・協力者）が得られる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">姤其角。吝、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の角に姤（あ）う。吝なり。咎むること无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「姤其角、上窮吝也。」（其の角に姤うとは、上に窮まって吝なり。）</div>\n<p>誰かに遇おうとして、角のように堅くふんぞり返った態度で出会ってしまう。恥をかく。しかし誰を咎めることもできない。最後は「咎无し」ではなく「咎むること无し」と読む。</p>\n<p><span class=\"tag\">程伝</span>至って剛で最上にいるものは角である。九は剛で上にいるので角を象とする。人が遇うのは、身を屈して相従い、和順で相接するからで、だからよく合う。上九は高く亢（たか）ぶり剛が極まっている。誰が与しようか。これで遇うことを求めれば、もとより恥ずべきである。人が遠ざかるのは他人の罪ではなく、自分が招いたことで、だから咎を帰する所がない。</p>\n<p>本田の講説：「亢」は「亢龍悔い有り」の亢である。この卦で唯一の女性は初六なので、上九は初に遇うことを求めるのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>居る所がすでに窮まり、剛もまた極まっている。上に窮まって吝を致すのである。剛の極みで高い所にいて遇うことを求めるのは、難しいことではないか。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高ぶって角を立てた態度では、誰とも打ち解けられず恥をかく。自分が招いたことで、誰も責められない。</div></div></details><div class=\"pager\"><a href=\"#gua-43\">← 沢天夬</a><a href=\"#gua-45\">沢地萃 →</a></div>", "gua-45": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 45 卦　第五十八講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">沢地萃</div><div class=\"yo\">たくちすい</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-45\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-45\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-45\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-45\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-45\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-45\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-45\" data-jump=\"yao\">六爻</a></div><h3 id=\"g45-s0\">卦の名と象</h3>\n<p>萃は抜粋の萃で、草が群生しているさまという。あつまるという意味である。</p>\n<p>程伝（序卦伝を引く）：「姤とは遇なり。物相遇って而る後聚まる。故に之を受くるに萃を以てす。萃とは聚まるなり」。物が出会えば群を成す。萃が姤に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は、上が沢、下が地。沢が地の上に上る、水の集まった形である。だから萃という。</li><li>「沢、地上に在り」と言わず「沢、地に上る」と言うのは、地に上ることが集まるという動きの意味になるからである（「地上に在り」では動きがない）。</li></ul>\n<h3 id=\"g45-s1\">卦辞</h3>\n<div class=\"orig\">萃亨。王假有廟。利見大人、亨、利貞。用大牲吉。利有攸往。</div>\n<div class=\"yomi\">萃は（亨る）。王、有廟に仮（いた）る。大人を見るに利あり。亨る。貞しきに利あり。大牲を用うるに吉。往く攸有るに利あり。</div>\n<p>この卦が出たら、王者は廟で先祖を祭るがよい。偉大な人物に出会えるであろう。願いごとは通る。ただし動機の正しいことを条件とする。立派な生け贄を供えてよろしい。何事も前進してよい。</p>\n<p>本田の講説：「有廟」の「有」は美称の接頭語で意味はない（唐王朝を有唐というのと同じ）。「仮」は「いたる」で、音はカでなくカク。テキストには卦名に続けて「萃は亨る」とあるが、程伊川は、続く本文にも「大人を見るに利あり。亨る」と出てくるので二度出てくるわけはない、とこの「亨」の字を省けと言う。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>王者が天下を萃（あつ）める道は、有廟に至って極まる。群生は至って多いが、その帰仰を一つにすることができる。人心はその向かう所を知ることができないが、廟ではその誠敬を致すことができる。鬼神は度り難いものだが、廟ではその来格（来り至ること）を致すことができる。天下の人心を萃め、衆の志をまとめる道は一つではないが、その至大なものは宗廟に過ぎるものはない。だから王者が天下を萃める道は、有廟に至れば萃の道の至りである。祭祀の報いは人心に本づく。聖人は礼を制してその徳を成すだけである。豺や獺でさえ祭ることを知っている。その本性がそうさせるのである。萃の下に亨の字があるのは衍字である。亨の字はおのずから下にある。渙とは同じでなく、渙は先に卦の才を言い、萃は先に卦の義を言っている。彖伝の文を見れば甚だ明らかである。</li><li>天下が萃まる時は、必ず大人を得て治める。人が集まれば乱れ、物が集まれば争い、事が集まれば紊れる。大人が治めるのでなければ、萃は争乱を招くだけである。不正をもって萃まれば、人の萃まりは苟合（野合）、財の萃まりは悖入（不正な収入）である。どうして亨ることができよう。だから貞しきに利あり。</li><li>萃は豊厚の時で、その用いるものも宜しく相応すべきである。だから大牲を用いれば吉。事は祭より重いものはないので、祭で言った。上は鬼神に交わり、下は民物に接し、百の用はみな然りである。萃の時に物に交わるのに厚くすれば豊富の吉を受け、天下もその富楽をともにする。時が豊かなのに物に交わるのに薄くすれば、その豊美を享けられず、天下は与せず悔吝が生じる。時の宜しきに随い理に順って行うので、彖伝に「天命に順う」という。何かをしようとしてできないのは力が足りないからである。今は萃の時なので往く所があってよい。功を興し事を立てるには、なすべき時を得ることが貴い。萃まって後に用いるので、動いても余裕がある。天理がそうさせるのである。</li></ul>\n<p>本田の講説：豺（山犬）は余った肉を木の枝に掛けて山の神を祭り、獺（カワウソ）は残った魚を岸に並べて川の神を祭るという伝説が『礼記』月令にある。渙の卦辞は「渙は亨る。王、有廟に仮る」で、まず「亨る」を先に言うが、萃は王者が人を集める道義を先に言って最後に「亨る」と判断する。ここでは富というものを非常に賛美しており、豊かな時には祭りの供え物も豊かであれ、ケチケチしていれば天下は誰も味方しない、という。受講者が「敷衍」の「衍」は余計の意味かと問うと、本田は、余りという意味で、義捐金の「捐」も似た意味、余った金があれば出すということだ、と答えた。</p>\n<h3 id=\"g45-s2\">彖伝</h3>\n<div class=\"orig\">萃、聚也。順以説、剛中而應、故聚也。王假有廟、致孝享也。利見大人亨、聚以正也。用大牲吉、利有攸往、順天命也。觀其所聚、而天地萬物之情可見矣。</div>\n<p>萃は聚まるなり。順にして以て説び、剛中にして応ず。故に聚まるなり。王、有廟に仮るとは、孝享を致すなり。大人を見るに利あり亨るとは、聚むるに正を以てすればなり。大牲を用うるに吉、往く攸有るに利ありとは、天命に順えばなり。其の聚まる所を観て、天地万物の情見る可し。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>萃の義は聚まることである。「順にして以て説ぶ」とは卦の才で言う。上は説（兌）で下は順（坤）である。上は説の道で民を使い人心に順い、下は上の政令を説んで上に順う。上下が順い説び、また剛中正の位に陽爻（九五）がいて下に応助（六二）がある。このようであるからよく萃まる。天下の萃まりを欲するなら、才がこのようでなければできない。</li><li>王者が人心を萃める道は、宗廟を建立するに至る。孝享の誠を致すためである。祭祀は人心が自ら尽くすものである。だから天下の心を萃めるには孝享に及ぶものはない。王者の天下を萃める道は、有廟に至ればその極みである。</li><li>萃の時に大人を見れば亨る。萃めるのに正道をもってするからである。大人を見れば萃めるのに正道をもってし、その正を得れば亨る。萃めるのに正をもってしなければ、どうして亨ろうか（本田：テキストは最後を「享」としており、「亨」の誤植かもしれない。どちらでも意味は通るが「亨」の方がすんなり通る）。</li><li>「大牲を用う」は上の有廟の文を承けて祭祀で言う。およそ事はみなそうである。萃の時に物に交わる者は、厚くその宜しきに称うべきである。物が萃まれば力が足り、事をなすことができる。だから往く所があってよい。みな天理がそうさせるので、「天命に順う」という。</li><li>萃まりの理を見て、天地万物の情を見ることができる。天地の化育、万物の生成で、およそ有るものはみな萃まったものである。有無・動静・終始の理は、聚散だけである。だからその萃まるゆえんを見れば、天地万物の情が見られる。</li></ul>\n<p>本田の講説：「説」の字は「喜ぶ」と「喜ばせる」の両方に読め、お上は人心に順って喜ばせ、下はお上のすることを喜んで従う。説の字にはセツ（論説）・ゼイ（遊説）・エツ（喜ぶ・喜ばせる）の三つの音がある。『論語』冒頭の「亦た説ばしからずや」は「ごんべん」で、「りっしんべん」の字（悦）の方が後に出てくる。昔は文字が少なかったので、一字を何通りにも読ませた。上が「説道を以て民を使う」という考え方は他の古典にはあまりないが、易の中ではしょっちゅう出てくる。孟子の理論はどちらかというと民を甘やかす方向で、殷の湯王などが革命の旗を揚げた時、東を攻めれば西の民が「なぜ私の国を攻めてくれないか」と恨んだといい、革命の戦すら民を喜ばせるためだという。ただし大臣クラスが君主をさしおいて民衆の人気を取り、結局は君主の地位を奪ってしまうこともよくあり、魯の季孫氏は穀物を民に貸す時は大きい枡で貸し、取り立てる時は小さい枡で返させて実権を握った。また、陰陽の気が集まるのが生、散るのが死という宋学一般の考え方が背後にあり、易の本文より孔子の解説が高度で、程伊川の伝はさらに高度な深い哲学になっている、と言う。</p>\n<h3 id=\"g45-s3\">大象</h3>\n<div class=\"orig\">澤上於地、萃。君子以除戎器、戒不虞。</div>\n<div class=\"yomi\">沢、地に上るは萃なり。君子以て戎器を除（おさ）め、不虞を戒む。</div>\n<p>沢が大地の上に上った。ここで初めて水が集まる。君子はこれを見て、武器を手入れし、思いがけない事態を警戒する。</p>\n<p>本田の講説：沢が地に上るのでなぜ武器を手入れし不虞を戒めるのか、程伊川ははっきり言わないが、朱子の注では、地上に大きな貯水池ができれば、いつ土手が切れて洪水になるかもしれないからだと説明する。程伊川は出水のことは言わない。</p>\n<p><span class=\"tag\">程伝</span>沢が地に上るのは萃の象である。君子は萃の象を見て、戎器を除治し、不虞に戒備する。およそ物が萃まれば、予期しない事が起こる。衆が萃まれば争いがあり、物が萃まれば奪うことがある。おおむね萃まれば事故が多い。だから萃の象を見て戒めるのである。「除」とは治めること。弊悪を去り、調べ（簡）治めて集めておく。不虞を戒めるためである。</p>\n<p>本田の講説：受講者の「除夜の鐘の除はこれか」という問いに、あれは古い年を除くということだ、と答えた。</p>\n<h3 id=\"g45-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>古代の祭り。</b> 受講者が「祭りはそんなに重んじたのか」と問うと、本田は、古代ではそうで、礼の経典『礼記』『儀礼』『周礼』を見ると祭りの数が実に多く、一年中毎日何かの祭りをしなければならないくらいだ、と答えた。祭るのは天の神・山の神・川の神・祖先で、多神教になる。大牲（生け贄）は牛・羊・豚の三種類で丸焼きにし、天子以下がお下がりを食べる。お下がりを食べるのは神様と同じ血をすすることになるので大切な意味がある。『礼記』の編纂は漢代だが言い伝えは古く、『周礼』は周の国家制度で、祭政一致である。日本で「政」を「まつりごと」と読むのも、お祭りが政治の中心だったことを示す。</li><li><b>廟とは。</b> 廟は先祖を祭る建物で墓ではない。日本でいえば日光東照宮のようなもので、仏教が入る前なら伊勢神宮のようなものが廟にあたる。天皇の墓所は別にある。宗は本家の意味。「享」（祭る・供える、音キョウ）と「亨」（通る、音コウ）は一画の違いである。</li><li><b>天命と五十にして天命を知る。</b> 受講者の問いに、本田は、伝の部分には「楽天知命」などの例がある、と答えた。「五十にして天命を知る」には二通りの解釈があり、一般には、五十になって自分の人生の見通しがつくというやや悲観的な解釈をするが、伊藤仁斎は、天が自分に与えた使命（天下に道徳を知らせる使命）を自覚するという積極的な解釈をした。</li><li><b>画一的でない解釈。</b> 六二について受講者が「どうして九四が良くて二が悪いのか」と問うと、本田は、五の判断は悪くないが、二は下半分が全部陰の真ん中にいて、小人のグループの真ん中に落ち込んでいるので、いつ心変わりするかわからないと警戒される、と答えた。受講者が「画一的な解釈をしないところがいいですね」と言うと、本来なら中で正なら良い判断があって当然だが、卦によっては必ずしも中と正が絶対ではない、と答えた。</li><li><b>十翼。</b> 受講者の問いに、本田は、孔子の作という解説は彖伝・象伝（卦辞の後の大象、爻辞の後の小象）・繋辞伝（易全体の概説）・説卦伝・序卦伝・雑卦伝・文言伝で、伝は十巻あって「十翼」という、孔子から後はいろんな人の注釈になる、と説明した。</li><li><b>人が集まると乱れる。</b> 卦の判断はどれもあまりよくない。受講者が「人が集まると乱れるんですね」と言った。</li></ul>\n<h3 id=\"g45-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>人や物が集まる、豊かな時。誠を尽くして祭り（人心をまとめ）、優れた人物に会えば願いは通る。ただし集め方・集まり方が正しくなければならない。</li><li>豊かな時には物惜しみせず手厚くせよ。前進してよい。</li><li>人や物が集まれば争いや事故が起こる。備えを整え、不慮の事態を警戒せよ。</li><li>本来の相手を見失って小人の群れに流されるな。笑われても正しい相手のもとへ行け（初六）。</li><li>真心があれば質素でもよい（六二）。</li><li>位にふさわしくない者は、結果が大吉であって初めて咎を免れる（九四）。</li><li>人がついて来ないなら、自分の徳を修めよ（九五）。</li></ul><h2 class=\"sec\" id=\"g45-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">有孚不終、乃亂乃萃。若號、一握爲笑。勿恤、往无咎。</span></summary><div class=\"body\"><div class=\"yomi\">孚有りて終らず。乃ち乱れ乃ち萃まる。若し号（さけ）べば、一握笑いと為らん。恤うること勿く、往けば咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「乃亂乃萃、其志亂也。」（乃ち乱れ乃ち萃まるとは、其の志乱るるなり。）</div>\n<p>誠を尽くすべき相手がいながら、誠意が最後まで続かない。心が乱れて小人たちと集まる。もし大声を挙げて本来の正当な相手に呼びかければ、小人たちはひとかたまりになって嘲笑うであろう。笑われても気にかけず、出掛けて行って本来の相手につけば咎はない。本田は、大変複雑な判断だと言う。</p>\n<p><span class=\"tag\">程伝</span>初と四は正応で、もとは孚（まこと）があって相従う者である。しかし萃の時に当たり、三陰が集まっていて、初は陰柔で正を守る節操がない。もし正応を捨ててその同類（二・三の陰）に従えば、孚があって終わらないことになる。「乃ち乱れ」とはその心が惑い乱れること、「乃ち萃まる」とはその同類と萃まることである。もし正を守って従わず、号呼して正応を求めれば、一握がこれを笑う。一握は俗語の一団で、衆が集まって笑い者にするという意味である。もし恤えることなく往って剛陽の正応に従えば過咎はない。そうでなければ小人の群れに入るであろう。</p>\n<p>本田の講説：「為笑」の上に「集」の字がないテキストもあるが、あった方がよい。</p>\n<p><span class=\"tag\">象伝について程伝</span>その心志が群陰に惑乱されるので、群陰に萃まるのである。その守りを固めることができなければ、小人に惑乱されて正を失う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>本来の相手への誠を貫けず、周りの仲間に流されそうになる。笑われても気にせず、正しい相手のもとへ行けば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">引吉、无咎。孚乃利用禴。</span></summary><div class=\"body\"><div class=\"yomi\">引けば吉にして咎无し。孚あって乃ち禴（やく）を用うるに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「引吉无咎、中未變也。」（引けば吉にして咎无きは、中未だ変ぜざればなり。）</div>\n<p>正当な相手が引っ張ってくれれば吉で咎はない。真心があれば倹約な祭りに用いてもよろしい。「禴」は粗末で倹約な祭りの名。</p>\n<p><span class=\"tag\">程伝</span>初は陰柔で中正でもないので、恐らくその孚を終えられない。だからその才によって戒めをなした。二は陰柔だが中正を得ている。だから戒めはするが、その言葉は控えめである。およそ爻辞で得失の両方に関わるものは、法とし戒めとするが、それぞれその才によって言う。「引けば吉にして咎无し」の引くとは牽くことである。人の交わりは、相求めれば合い、相恃めば離れる。二と五は正応で萃まるべき者だが、遠く隔たっており、群陰の間にもいる。必ず牽き合って初めて萃まることができる。五は尊位にいて中正の徳があり、二もまた中正の道で往って萃まる。これは君臣が和合することで、その共に致す所は量り知れない。だから吉で咎がない。「咎无し」とは、よく過ちを補うことで、二と五が引き合わなければ過ちとなる。「孚あって乃ち禴を用うるに利あり」の孚とは誠が中にあることである。禴は祭りの簡薄なもので、菲薄に祭って物を備えることを尚ばず、専ら誠意で神明に交わるのである。孚があれば文飾を用いず、専ら至誠で上（神）に交わることを、禴を用いると言ったのは、その誠を薦めることを言うだけである。上下が萃まって飾りを尚ぶのは、まだ誠でない。中が実である者は飾りを外に借りない。これが禴を用いる義である。孚信は萃の本である。君臣の萃まりだけでなく、天下の萃まりはみな誠にある。</p>\n<p>本田の講説：ここの爻辞はだいぶ難しく、非常に屈折があり、程伊川は克明に説明する。「禴」は「しめすへん」に「龠」で、音は倹約の約と同じ。「龠」は竹の管を何本も集めた笛。しめすへんに「勺」と書くこともあり、春の祭りとも夏の祭りとも言い、形式はよくわからない。「神明」は二字で神の意味。「人の交わりは相恃めば離る」とは、己を恃むこと（自慢するところ）があれば結局離れるということ。「物を備うるを尚ばず」の「備」は、お供えではなく準備する（多くの生け贄を揃える）意味。</p>\n<p><span class=\"tag\">象伝について程伝</span>萃の時は萃まることを吉とする。だから九四は上下の萃まりを得て大吉とされる。二と五は正応だが、場所が異なり間を隔てるものがある。萃まるべくしてまだ合わない者である。五が引いて萃まれば吉で咎がない。二には中正の徳があるので、まだにわかに心変わりするには至らない。変われば引いてもらえない。ある人が問うた。「二は中正の徳があるのに、象伝が『未だ変ぜず』と言うのは言葉が足りないようだが、なぜか」。答え：群陰が並び、類をもって萃まる時である。その間にいて自ら守って変わらず、遠く正応を待つのは、剛立の者だけができる。二は陰柔の才なので、中正の徳によって心変わりしないことを期待するだけである。だから象伝はその意を含んで戒めを存したのである。</p>\n<p>本田の講説：受講者が「引き合うというのは利害関係でも当てはまるか」と問うと、本田は、利害関係でも言う、五は君主の位にいて下に応援が欲しいので、二を引っ張ろうとする、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>本来の相手（上の人）に引き上げてもらえれば吉。飾らず真心で接せよ。周囲に流されて心変わりしないよう注意。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">萃如嗟如、无攸利。往无咎、小吝。</span></summary><div class=\"body\"><div class=\"yomi\">萃如たり、嗟如たり。利する攸无し。往けば咎无し。小しく吝なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「往无咎、上巽也。」（往けば咎无きは、上巽えばなり。）</div>\n<p>上下の二や四と集まろうとするが相手にされず嘆く（「如」は形容詞を作る字）。何の利益もない。上六のところへ行って集まれば咎はない。しかしうろうろした分だけ少し恥ずかしい。</p>\n<p><span class=\"tag\">程伝</span>三は陰柔で中正でない人である。萃まりを人に求めても与する者がない。四に求めれば、四は正応でも同類でもなく、三は不正なので四に棄てられる。二に与しようとすれば、二は自ら中正で五に応じており、三は不正なので二に与されない。だから萃まろうとしても人に棄てられ嗟（なげ）く。萃まりを得られず恨み嘆くのである。上下みな与せず、利する所がない。ただ往って上六に従えば萃まりを得て咎はない。三と上は陰陽の応ではないが、萃の時には類をもって相従う。どちらも柔で一体（上卦・下卦）の上にいて、どちらも応がない。似たような地にいる。上はまた説（兌）の極みにいる。だから萃まりを得て咎がない。易の道は変動して常がなく、人がこれを識るかどうかにある。それなのに「小しく吝」なのはなぜか。三は始め四と二に萃まりを求めて得られず、後に往って上六に従った。人の動きがこのようであれば、求めるものを得ても小しく恥ずべきである。</p>\n<p><span class=\"tag\">象伝について程伝</span>上六は説（兌）の極みにいて巽順である。三が往って咎がないのは、上六が巽順で受け入れてくれるからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>近くの人には相手にされず嘆くが、思い切って遠い相手（上の人）のもとへ行けば受け入れられ咎はない。ただし迷った分だけ少し恥をかく。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">大吉无咎。</span></summary><div class=\"body\"><div class=\"yomi\">大吉にして咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大吉无咎、位不當也。」（大吉にして咎无きは、位当らざればなり。）</div>\n<p>結果が大吉であって初めて咎を免れる。何の形容もなく、いきなり判断だけである。この「咎无し」は、本来咎があるべきところを免れるという意味。受講者が「大吉って珍しいですね」と言うと、本田は「珍しい」と答えた。</p>\n<p><span class=\"tag\">程伝</span>四は萃の時に当たり、上は九五の君に親しんで君臣の萃まりを得、下は下体の群陰に親しんで民の萃まりを得ている。上下の萃まりを得たのは善と言える。しかし四は陽で陰位にいて、正ではない。上下の萃まりを得ても、必ず大吉を得て初めて咎がない。「大」とは周遍の義で、周く行き渡らない所がなくて初めて大であり、正しくない所がなくて初めて大吉である。大吉なら咎がない。上下の萃まりは、もとより正道によらずに得る者もある。理に背き道を枉げて君を得た者は昔から多く、理に背き道を枉げて民を得た者もあった。斉の陳常、魯の季氏がそれである。それを大吉、咎なしとできようか。だから九四は必ず大吉であって初めて咎がない。</p>\n<p>本田の講説：陳常は後に姓を改めて田常といい、最後には斉の君を弑して実権を握った。季孫氏は魯の家老職の筆頭で実権を握り、孔子が対立した。どちらも民に穀物を貸す時には大きい枡で貸し、返させる時には小さい枡で返させて人民の歓心を買った。この連中は論外である。</p>\n<p><span class=\"tag\">象伝について程伝</span>その位が当たらないので、その為すところがまだ善を尽くしていないことを疑う。だから必ず大吉を得て初めて咎がないと言う。善を尽くさなければどうして大吉とできようか。</p>\n<p>本田の講説：受講者が「あまり良い卦ではないんですね」と言うと、本田は、位が不当ということがどうしてもある、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上下から人が集まるが、立場がふさわしくない。何事も隅々まで善を尽くし、結果が大吉であって初めて咎を免れる。人気取りに走るな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">萃有位、无咎。匪孚、元永貞、悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">萃むるに位有り。咎无し。孚とするに匪ざれば、元永貞にして悔い亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「萃有位、志未光也。」（萃むるに位有るも、志未だ光（おお）いならざればなり。）</div>\n<p>天下の人望を集めて高い位に就いている。咎はない。まだ信じない人があれば、最も善く永久な正しさを修めれば、信じられないという悔は消えるであろう。</p>\n<p><span class=\"tag\">程伝</span>九五は天下の尊位にいて、天下の衆を萃めて君臨している。その位を正し、その徳を修めるべきである。陽剛で尊位にいて、その位にかなっている。これが「位有り」である。中正の道を得て咎がない。このようであって、なお信じず帰服しない者があれば、自ら反省して元永貞の徳を修めるべきである。そうすれば服さないことを思う者はなく悔は亡ぶ。元永貞とは君の徳で、民が帰する所である。天下を比（親しむ）む道と萃める道は、みなこの三者（位有り・咎无し・元永貞）にある。王者がすでにその位とその徳があり、中正で咎がないのに、天下になお信服帰附しない者があるのは、その道がまだ光大でなく、元永貞の道がまだ至らないからである。徳を修めて招き寄せることにある。苗民が命に逆らった時、帝（舜）は大いに文徳を敷いた（『書経』大禹謨）。舜の徳が至らなかったわけではない。遠近・昏明の違いがあるので、帰服に先後があるのである。まだ帰服しない者があれば徳を修めるべきである。いわゆる徳とは元永貞の道である。元は首であり長であり、君の徳である。首として庶物に出で（乾の彖伝）、群生に君長たる。尊大の義、主統の義がある。そのうえ恒永貞固であれば、神明に通じ四海に輝き、「服せざるを思う無し」（『詩経』大雅・文王有声）で、孚とされないことはなく、悔は亡ぶ。いわゆる悔とは、志がまだ光大でなく、心がまだ慊（あきた）らないことである。</p>\n<p>本田の講説：舜は武力ではなく文化的な徳を天下に敷いた。三苗の場合は遠くて素質も昏かった。受講者が苗民は今の苗族かと問うと、苗族は三苗の末裔だろうというがわからない、と答えた。「慊」は「りっしんべん」に兼で「あきたる」と読む。</p>\n<p><span class=\"tag\">象伝について程伝</span>象伝は爻辞の上句を挙げる（本田：意味は下まで含んでいる）。王者の志は、必ず信が天下に著れることを欲する。感ずれば必ず通じ、命あるものは帰することを思わないものはない。なお孚とされないなら、その志がまだ光大でないからである。</p>\n<p>本田の講説：「帰する」とはその人のところに慕い寄ることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人の上に立ち人を集める地位にあり、咎はない。まだ従わない者がいれば、相手を責めず、自分の徳を長く正しく修めよ。そうすれば悔は消える。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">齎咨涕洟、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">齎咨（せいし）涕洟（ていい）す。咎むる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「齎咨涕洟、未安上也。」（齎咨涕洟すとは、未だ上に安んぜざればなり。）</div>\n<p>誰もついて来ないので、嘆いて涙を流す（「齎咨」は嘆く、「涕洟」は涙を流す）。誰を咎めることもできない（自分が招いたこと）。「无咎」は「咎むる无し」と読み、「咎无し」とは違う。</p>\n<p><span class=\"tag\">程伝</span>六は説（兌）の主で、陰柔の小人が高位を説んでそこにいる。天下の誰が敢えて与しようか。萃まりを求めても誰も応じない。窮まって嗟き涕洟するに至る。「齎咨」とは咨嗟（嘆く）である。人がこれを絶つのは自分が招いたことで、誰を咎めようか。人に憎まれ絶たれてどうしてよいかわからなければ、隕穫（がっかりする。『礼記』儒行篇の言葉）して嗟き涕するに至る。真に小人の情状である。</p>\n<p><span class=\"tag\">象伝について程伝</span>小人の居る所は常にその宜しきを失う。貪って欲に従えば、自ら安全な地を選べない。困窮に至れば顛沛して（ひっくり返って）なすべきを知らない。上六が涕洟するのは、上にいることに安んじられないからである。君子はその居る所を慎み、義でなければ居らない。不幸にして危困があれば、泰然として自ら安んじ、心を煩わさない。小人は安らかな所に居ることを好まず、常に分不相応な地位を踏む。窮迫に及べば、がっくりとして心乱れ、甚だしきは涕洟に至る。恥ずべきである。「未だ」とは遽（にわか）にはできないという辞で、俗に言う「未便」のようなものである。すぐには上に安んじられないのである。陰で最も高い所にいて、孤独で与する者がない。もともとその居場所ではない。どうして安らかでいられよう。</p>\n<p>本田の講説：「顛沛」はひっくり返ること。『論語』に「造次顛沛」とあり、造次は慌ただしいこと。受講者に「撓」の音を問われ、「どう」で「たわむ」という字、と答えた。受講者が「これはすごいですね」と言うと、本田は、どれも判断辞はあまりよくない、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>分不相応な高い地位にいて、誰もついて来ず嘆き悲しむ。自ら招いたことで誰も責められない。</div></div></details><div class=\"pager\"><a href=\"#gua-44\">← 天風姤</a><a href=\"#gua-46\">地風升 →</a></div>", "gua-46": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 46 卦　第五十八講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地風升</div><div class=\"yo\">ちふうしょう</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-46\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-46\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-46\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-46\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-46\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-46\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-46\" data-jump=\"yao\">六爻</a></div><h3 id=\"g46-s0\">卦の名と象</h3>\n<p>「升」は一升二升の升で、本来はマス目の意味であって「のぼる」という意味はない。上に日が付いた「昇」の字と同音なので、マス目の字を借りて使う。巽は風であったり木であったりし、坤は土なので、土の下に木がある形である。</p>\n<p>程伝（序卦伝を引く）：「萃とは聚まるなり。聚まりて上る者を升と謂う。故に之を受くるに升を以てす」。物が積み集まってますます高大になる、集まって上るのである。だから升という。升が萃に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は、上が坤（地）、下が巽（木）。木が地の下にあり、地中に木を生ずる形である。木が地中に生じ、成長してだんだん高くなる。升の象である。</li></ul>\n<h3 id=\"g46-s1\">卦辞</h3>\n<div class=\"orig\">升、元亨。用見大人、勿恤。南征吉。</div>\n<div class=\"yomi\">升は元いに亨る。用て大人を見る。恤うる勿れ。南征して吉。</div>\n<p>この卦が出れば、願いごとは大いに通る。この卦の徳をもって偉大な人物に会えば、心配せずとも前進してよろしい。</p>\n<p><span class=\"tag\">程伝</span>升とは進んで上ることである。升り進めば亨るという意味がある。そして卦の才が善いので、大いに亨る。この道（巽順）をもって大人に会えば、憂恤を借りず（心配する必要がなく）、前進して吉である。「南征」とは前進のことである。</p>\n<p>本田の講説：「恤」は「りっしんべん」に血で、「うれえる・いたむ・あわれむ」の意味。戦争中に「恤兵基金」というのがあった。「南征とは前進なり」は程伊川の解釈で、他の注釈者は「巽は東南の方角の卦だから」などいろいろ言うが、程伊川は、天子は南面する、人間は南に向かって行くのが一番自然だと言う。</p>\n<h3 id=\"g46-s2\">彖伝</h3>\n<div class=\"orig\">柔以時升。巽而順、剛中而應、是以大亨。用見大人勿恤、有慶也。南征吉、志行也。</div>\n<div class=\"yomi\">柔、時を以て升る。巽にして順、剛中にして応ず。是を以て大いに亨る。用て大人を見る、恤うる勿れとは、慶び有るなり。南征して吉とは、志行わるるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>二体で言う。柔が升るとは、坤が上り行くことである。巽はもとより体が卑しく下にいるが、坤が時に順って上った。升るのに時をもってするのである。時がまさに升るべき時だということである。坤が上にあって升の卦となれば、下は巽、上は順で、巽順の道で升る。これは時にかなうと言える。二は剛中の道で五に応じ、五は中順の徳で二に応じる。よく巽順にして時に升るので、大いに亨る。彖伝の文に「大亨」とあるのは誤りで、そのことは大有の卦で説明した。</li><li>およそ升る道は、必ず大人による。位に升るのは王公により、道に升るのは聖賢による。巽順で剛中の道を用いて大人に会えば、必ずその升ることを遂げる。「恤うる勿し」とは、遂げられないことを憂えないこと。升ることを遂げれば自分の福慶であり、それが物にも及ぶ。</li><li>南は人の向かう所である。南征とは前進のことで、前進すれば升ることを遂げて、その志を行うことができる。だから吉である。</li></ul>\n<p>本田の講説：八卦のうち一陽二陰（震・坎・艮）を剛卦（陽卦）、一陰二陽（巽・離・兌）を柔卦（陰卦）といい、巽は柔卦である。程伊川によれば、乾坤以外で元亨利貞の四徳が備わる屯・随・无妄などは、彖伝で「元亨」と言わずに「大亨」と言い換えるが、これは乾坤を避けるためであって、利貞がなく元亨の二徳だけのものは彖伝でも「元亨」のままである。だから升だけ「大亨」と言い換えるのは間違っている、というのが伊川の理解である。</p>\n<h3 id=\"g46-s3\">大象</h3>\n<div class=\"orig\">地中生木、升。君子以順德、積小以高大。</div>\n<div class=\"yomi\">地中に木を生ずるは升なり。君子以て徳を順にし、小を積みて以て高大にす。</div>\n<p>木が地中に生じてだんだん上昇する。君子はこれにのっとって、自分の徳を素直に修め、小さなものを積み重ねて高く大きなものにする。</p>\n<p><span class=\"tag\">程伝</span>木が地中に生じ、成長して上に升る。升の象である。君子は升の象を見て、その徳を順に修め、微小を積み重ねて高大に至る。順であれば進むことができ、逆であれば退く。万物が進み伸びるのはみな順の道による。「善積まざれば以て名を成すに足らず」（繋辞伝）。学業の充実、道徳の崇高はみな積み重ねによって至る。小を積むことは高大を成すゆえんで、これが升の義である。</p>\n<h3 id=\"g46-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>周の文王と殷の紂王。</b> 六四の「王用て岐山に亨る」について、本田は周の歴史を語った。周の王朝を建てたのは文王の息子の武王だが、周の始まりは文王ということにされている。岐山は今の陝西省にある山で、周の都があった。文王は殷の紂王の家来で、諸侯の中で一番大きな権力を持ち、紂王に疑われ睨まれていたが殺されずに済んだ。文王が死ぬとすぐ、武王は文王の位牌を馬車に乗せ、葬式もせずに革命の旗を揚げて紂王を殺した。その時、伯夷・叔斉という二人の隠者が馬の首に取りすがって、「父親が死んでまだ葬式もしないのに戦争を始めるのは親孝行でない。仮にも自分の君主を殺すのは不忠である」と諫めた。文王・武王を並べて聖人という。周の建国は紀元前一〇五〇年で、実在がはっきりわかっているのは殷からである（亀の甲羅や青銅器に彫られた文字でわかる）。</li><li><b>紂王は本当に暴君か。</b> 受講者が「ものすごい暴君だったのか」と問うと、本田は、滅ぼされるとすべての悪徳を積み重ねられるので本当はどうか、実際は名君だったらしい、四方の盗賊と悪戦苦闘して殷の王朝を守ったが、すっかり疲弊し経済的に破綻して反乱を起こされ、その旗頭が武王だった、と答えた。孔子の弟子の子貢が早くから「君子は下流に居るを悪む」（流れの下流にいると、あらゆる汚名・悪行を被せられる）、紂の悪はそれほどひどくはなかったと言っている。受講者が「老子は下流におる方がいいと言っていますね」と言った。</li><li><b>漢字の歴史。</b> 漢字がはっきりするのは殷の時代で、だいぶ絵に近いがそれとわかる。殷の「馬」の字には顔がある。漢の時代はまだ隷書で、楷書になるのはだいたい魏晋時代から。当時は竹簡・木簡、それに帛（きぬ）に書いた。</li><li><b>「咎无し」は消極的な判断。</b> 六四の程伝の問答について、本田は、「咎无し」は「過ちを補う、本来咎があるべきなのにその咎を免れる」という消極的な判断で、あまりよい判断辞ではない、と説明した。</li><li><b>「慶び有り」と「喜び有り」。</b> 九二の象伝の程伝は、象伝で「慶び有り」と言う場合はその福が物に及ぶこと、「喜び有り」と言う場合はその事自体が善くまた喜ぶべきことがあることだ、と区別する。例として大畜の六四「童牛の牿（こう）、元吉」（牛が幼いうちに人を突かないよう角の間に横木を渡しておく）の象伝「喜び有り」は、仕事がたやすく、嫌がるのを無理に強制する困難を免れるので喜ぶべきだ、という意味である。</li><li><b>程伝と象伝の食い違い。</b> 上六の「不息の貞に利あり」を、程伊川は乾の大象「君子以て自彊息まず」に引っかけ、昇ろうとして止まない心を自分の不断の努力に用いれば利がある、と解釈する。しかし孔子の象伝にはそういう意味の文句はなく、「升るに冥し」の解釈だけで、昇ろう昇ろうとしていれば消滅するだけで利益がない、と言う。ここのところ程伊川の伝と象伝とが少し食い違う。</li></ul>\n<h3 id=\"g46-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>地中から木が伸びるように上昇する時。願いは大いに通る。</li><li>優れた人物（引き立ててくれる人）に会え。心配せず前へ進んでよい。</li><li>素直に徳を修め、小さなことを積み重ねて高く大きなものにせよ。</li><li>上の人を信じてついて行けば大吉（初六）。誠意があれば飾らなくてよい（九二）。</li><li>妨げるものなく昇れる時もある（九三）。ただし上位に近い者は分を越えず、上と下を引き上げよ（六四）。</li><li>正しさを持続すれば、階段を昇るようにたやすく昇れる（六五）。</li><li>昇ることにばかり目が眩めば消滅するだけ。その熱意は自分の修養に向けよ（上六）。</li></ul><h2 class=\"sec\" id=\"g46-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">允升、大吉。</span></summary><div class=\"body\"><div class=\"yomi\">允（まこと）にして升る。大吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「允升大吉、上合志也。」（允にして升る大吉とは、上、志を合すればなり。）</div>\n<p>上の人の言うことを信じ、上の人について昇る。結果は大吉。</p>\n<p><span class=\"tag\">程伝</span>初は柔で巽の体の一番下にいて、また巽の主である（八卦のうち二陽一陰の卦では一陰が主体となる）。上は九二の剛を承けている。巽の至れる者である。二は剛中の徳で上は五の君に応じ、升の任に当たる者である。「允」とは信じ従うことである。初の柔巽は、ただ二を信じ従い、二に信じ従ってともに升る。だから大吉である。二は徳で言えば剛中で、力で言えば任に当たるべき者である。初の陰柔は応援もなく（四も陰で引き合わない）、自ら升ることはできない。剛中の賢に従って進むのは、剛中の道によるのである。吉でこれより大きなものがあろうか。</p>\n<p><span class=\"tag\">象伝について程伝</span>上と志を合わせるのである。上とは九二を言う。二に従って升るのは、二と志を同じくすることで、剛中の賢を信じ従うことができる。大吉であるゆえんである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>信頼できる上の人について行けば、ともに昇ることができて大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">孚乃利用禴、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">孚あって乃ち禴を用うるに利あり。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九二之孚、有喜也。」（九二の孚あるは、喜び有るなり。）</div>\n<p>誠意があってこそ、質素な祭りでも神々に受け入れられる。咎はない。</p>\n<p><span class=\"tag\">程伝</span>二は陽剛で下にいて、五は陰柔で上にいる。剛が柔に仕え、陽が陰に従うのは、時にそうすることがあっても順道ではない。暗が明に臨み、剛が弱に仕える。もし勢いにつれて黽勉（努めて）そうするのであれば、心から誠に服するのではない。上下の交わりが誠をもってしなければ、どうして久しく続き、何かをなすことができよう。五は陰柔でも尊位にいて、二は陽剛でも上に仕える者である。内に至誠を存して文飾を外に借りないのがよい。誠が中に積もれば、自ずから外を事としない。だから「禴を用うるに利あり」という。誠を尚ぶことである。昔から剛強の臣が柔弱の君に仕えるのに、うわべを飾らない者はなかった。禴は祭りの簡質なもので、孚があれば文飾を用いず、専ら誠で上に感通すべきだということである。このようであれば咎がないことができる。剛強の臣が柔弱の君に仕え、しかも升の時に当たる。誠意で交わらなければ、どうして咎を免れようか。</p>\n<p>本田の講説：これは言わば萃の六二に比べて「逆」である。「黽」も努めることで、「敏」と音が同じ、字の原義はアオガエル。九二は非常に危ない瀬を渡っており、誠意で交わらなければ必ず疑われる、ということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>二がよく孚誠で上に仕えれば、臣としての道に咎がないだけでなく、剛中の道を行い、その沢を天下に及ぼすことができる。これが喜び有りである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>力のある部下が弱い上役に仕える立場。飾らず真心だけで仕えれば咎はなく、喜びがある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">升虛邑。</span></summary><div class=\"body\"><div class=\"yomi\">虚邑に升る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「升虛邑、无所疑也。」（虚邑に升るは、疑う所无きなり。）</div>\n<p>無人の村に昇る。</p>\n<p><span class=\"tag\">程伝</span>三は陽剛の才で、正位にいて巽の体にある。上はみなこれに順い、また応援（上六）がある。このような善さで升る。人のいない邑に入るようなもので、誰が拒むだろうか。</p>\n<p><span class=\"tag\">象伝について程伝</span>人のいない邑に入る。その進むことに疑阻（妨げ）がない。</p>\n<p>本田の講説：「疑」の字は「障礙物」の「礙」と通じる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>妨げるものがなく、無人の村に入るように楽に進める。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">王用亨于岐山、吉无咎。</span></summary><div class=\"body\"><div class=\"yomi\">王用て岐山に亨る。吉にして咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「王用亨于岐山、順事也。」（王用て岐山に亨るは、事に順えばなり。）</div>\n<p>周の文王がこの卦の徳をもって、岐山において天下の王となる事業をすんなりと完成させた（「亨」とは自分の仕事をすんなり完成させること）。結果は吉で咎はない。</p>\n<p><span class=\"tag\">程伝</span>四は柔順の才で、上は君の升るのに順い、下は下の進むのに順い、自分はその所に止まる。陰で柔の位にいるのは、陰で下にいて、その所に止まるのである。昔、文王が岐山の下にいた時、上は天子（殷の紂王）に順ってこれを有道に致そうとし、下は天下の賢に順ってこれを升進させ、自分は柔順謙恭で、その位を出なかった。至徳はこのようで、周の王業はこれによって亨ったのである。四がこのようであれば、亨って吉で咎がない。ある人が問うた。「四の才はもとより善いのに、さらに咎无しの辞があるのはなぜか」。答え：四の才は善くても、その位は戒めるべきである。君に近い位にいて升の時に当たり、もう升ってはならない。升れば凶咎があるのは知れたことである。だから文王のようであれば吉で咎がないという。しかし大臣の位にいて、升らないわけにもいかない。上は君の道を升らせ、下は天下の賢を升らせ、自分はその分に止まるべきである。分は止まるべきでも、徳は升るべきであり、道は亨るべきである。この道を尽くした者は、ただ文王だけであろうか。</p>\n<p><span class=\"tag\">象伝について程伝</span>四は君に近い位にいて升の時に当たる。吉で咎がないのは、順の徳があるからである。柔で坤の体にいる、順の至りである。文王が岐山で亨ったのも、時に順い事に順ったからである。上は上に順い、下は下に順い、自分は順でその義に処する。だから「事に順う」という。</p>\n<p>本田の講説：受講者の問いに、象伝の「王」は文王であり、文王は紂の家来のまま亡くなり、武王が天子になった、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>君主（トップ）に近い立場。自分は分を越えて昇ろうとせず、上を正しい方へ導き、下の賢者を引き立てれば、事は成就して吉、咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">貞吉、升階。</span></summary><div class=\"body\"><div class=\"yomi\">貞なるときは吉。階に升る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「貞吉升階、大得志也。」（貞なるときは吉、階に升るとは、大いに志を得るなり。）</div>\n<p>正しい道を固守すれば吉。階段を昇るようにたやすく昇れる。本田は、非常にめでたい判断だと言う。</p>\n<p><span class=\"tag\">程伝</span>五は下に剛中の応（九二）があるので、尊位にいて吉である。しかし質はもと陰なので、必ず貞固を守って初めてその吉を得る。もし貞固でなければ、賢を信ずることも篤くなく、賢に任ずることも終わりを遂げない（途中で心変わりする）。どうして吉であろうか。階は由って升る所である。剛中の賢に任じてこれを輔けとして升る。階段によって昇るようで、助けがあってたやすいということである。二を指して正応と言ったが、下にいる賢はみな由って升るための階である。よく賢を用いれば、その仲間もみな升ってくる。</p>\n<p><span class=\"tag\">象伝について程伝</span>賢才に倚り任じて、よく貞固である。このように升れば天下の大治を致すことができ、その志は大いに得られる。君道が升るには、ただ賢才の助けがないことを患うだけである。助けがあれば、階に由って升るようにたやすい（本田：「由」は「猶」と同じ）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>優れた補佐を信じて任せ、正しさを貫けば、階段を昇るようにたやすく昇り、志が大いに遂げられる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">冥升。利于不息之貞。</span></summary><div class=\"body\"><div class=\"yomi\">升るに冥（くら）し。息まざるの貞に利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「冥升在上、消不富也。」（升るに冥くして上に在り。消して富まざるなり。）</div>\n<p>昇ることに目が眩む。その止まることのない心を、正しいことに用いれば利がある。</p>\n<p><span class=\"tag\">程伝</span>六は陰で升の極みにいる。升ることに冥く（昏く）、進むことを知って止まることを知らない者で、その昏さは甚だしい。しかし升ることを求めて止まない心は、時に用いるところがある。貞正の事において休みなく努めることに当てれば宜しい。君子は貞正の徳において自強して息まない。上六の止まない心をここに用いれば利がある。小人の、利益を貪り求めてやまない心を徳を進めることに移せば、何の善がこれに及ぼうか。</p>\n<p><span class=\"tag\">象伝について程伝</span>升ることに昏く冥い。升ることを極めて止むことを知らなければ、ただ消滅するだけで、どうしてまた加益があろうか。「富まず」とは、もはや増益がないことである。升ることがすでに極まれば、退くことがあるだけで進むことはない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上昇欲に目が眩んで止まることを知らない。このままでは消えていくだけで得るものはない。その熱意は自分を磨く努力に向けよ。</div></div></details><div class=\"pager\"><a href=\"#gua-45\">← 沢地萃</a><a href=\"#gua-47\">沢水困 →</a></div>", "gua-47": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 47 卦　第五十九講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">沢水困</div><div class=\"yo\">たくすいこん</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-47\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-47\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-47\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-47\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-47\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-47\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-47\" data-jump=\"yao\">六爻</a></div><h3 id=\"g47-s0\">卦の名と象</h3>\n<p>困は「苦しむ・くたびれる」の意味である。「困」の字は、木がかこいに囲まれて伸びない形。「憊」（疲労困憊の憊）、「乏」（欠乏の乏）と同じく、くたびれる意味である。</p>\n<p>程伝（序卦伝を引く）：「升りて已まざれば必ず困しむ。故に之を受くるに困を以てす」。前の升の卦は下から昇る卦で、力を用いて進もうとするものである。昇ろう昇ろうとして止まなければ、最後は必ずくたびれ苦しむ。だから升の後に困が来る。</p>\n<ul class=\"sen\"><li>卦は上が兌（沢）、下が坎（水）である。水が沢の上にあれば節の卦で、別段困ることはない。ところがこの卦は水が沢の下にある。沢の底から水が下に漏れ、沢が枯渇して水がなくなる形である。だから苦しみ窮乏するという意味になる。</li><li>兌は陰卦でありながら上におり、坎は陽卦でありながら下にいる（二陽一陰は陰卦、一陽二陰は陽卦）。爻で言えば、上六は二つの陽の上に乗り、九二は二つの陰の中に落ち込んでいる。いずれも陰（柔弱なるもの・小人）が陽（強いもの・君子）を覆い隠す形である。君子が小人に覆われて窮困する時である。</li><li>本田の講説：卦名からして大変悪い卦だが、孔子の彖伝は「苦しみながらも自分の願うところを放棄しない」という道徳的な教訓を付け加えている。</li></ul>\n<h3 id=\"g47-s1\">卦辞</h3>\n<div class=\"orig\">困、亨。貞大人吉、无咎。有言不信。</div>\n<div class=\"yomi\">困は亨る。貞なり。大人は吉にして咎无し。言うこと有れど信ぜられず。</div>\n<p>この卦が出れば困窮するが、自分の理想を貫くがよい。理想は通る。それが正しい道である。占う人が大人であれば結果は吉で、咎はない。ただし困窮の時に言い訳をしても人は信じない。言い訳をしても無駄だということである。</p>\n<p><span class=\"tag\">程伝</span>卦の才のようであれば、困窮しながらよく道を貫く（下卦は陥る、上卦は喜ぶ意味があるので、苦しみのうちに我が理想を貫くという意味になる）。しかも正しさを得る。これこそ大人が困窮の時に処する道である。だから吉にして咎がない。大人が困に処するのは、ただそれ自体がめでたいだけでなく、天を楽しみ命に安んじる（繋辞伝の「天を楽しみ命を知る、故に憂えず」を引く。テキストによっては「命を知る」）。それが吉を失わないゆえんである。まして困窮の時に相応しく対処するのだから、何の咎があろう。「言うこと有れど信ぜられず」とは、困窮の時につべこべ言い訳をしても誰も信じない、つまり文句を言うなという判断である。</p>\n<h3 id=\"g47-s2\">彖伝</h3>\n<div class=\"orig\">困、剛揜也。險以說、困而不失其所亨、其唯君子乎。貞大人吉、以剛中也。有言不信、尚口乃窮也。</div>\n<div class=\"yomi\">困は剛揜（おお）わるるなり。険以て説（よろこ）ぶ。困しみて其の亨る所を失わざるは、其れ唯だ君子か。貞なり、大人は吉なりとは、剛中を以てなり。言うこと有れど信ぜられずとは、口を尚べば乃ち窮するなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>困である理由は、剛が柔に掩われるからである。下では陽が陰の中に陥り、上では陽の上に陰がかぶさる。陥るのもまた掩われることである（「揜」は「掩」のもう一つの形）。剛陽の君子が陰柔の小人に掩い隠される。君子の道が困しみ塞がる時である。</li><li>「険以て説ぶ」は卦の才で困に処する道を言う。下は険、上は説、つまり険の中にいてよく説ぶ。困窮艱難の中にあっても、天を楽しみ義に安んじれば、自ずからその説楽を得る。時は困しんでも、身の処し方に義を失わなければ、その道は自ずから亨る。これができるのは君子だけである。もし困しむべき時にかえって（世俗的に）亨るなら、身は亨っても、その道は困しんでいるのである。君子とは大人の通称である。</li><li>「貞なり、大人は吉」：困窮のうちにも正を持続するのが大人の吉なるゆえんで、それは剛中の道（上下の卦の中央の九二・九五がどちらも陽）を持っているからである。剛中でなければ、困に遇えばその正を失うであろう。</li><li>「口を尚べば乃ち窮す」：困の時に当たってつべこべ言っても人は信じない。口先で困を免れようとすることこそ、ますます困窮を深める元である。この卦は説（兌）で困に処している（説卦伝に「兌は口舌と為す」）。だから口を尚ぶことの戒めがある。</li></ul>\n<p>本田の講説：受講者が「『論語』にありますよね」と言うと、本田は衛霊公篇の話をした。陳・蔡の間で孔子が敵兵に囲まれ三日間飯が食えなかった時、子路が怒って「君子も窮する有るか」と言うと、孔子は「君子固より窮す。小人窮すれば斯に濫る」と答えた。君子が困窮するのは当然で、小人は困窮すればでたらめに何でも悪いことをするという。また受講者が「口舌の徒」「多言しばしば窮す」と言うと、通じるところがあると答えた。</p>\n<h3 id=\"g47-s3\">大象</h3>\n<div class=\"orig\">澤无水、困。君子以致命遂志。</div>\n<div class=\"yomi\">沢に水无きは困なり。君子以て命を致し志を遂ぐ。</div>\n<p>沢の底が抜けて水がなくなる、これを困という。君子はこれにかたどって、困窮という己の運命を受け止めて達観し、自分の理想を遂げようとする。「命を致し」は朱子の解釈では「命を投げ出して」となり、『論語』にそういう使い方があるが、程伊川はそう解釈しない。命を投げ出しては具合が悪いと思ったのであろう。</p>\n<p><span class=\"tag\">程伝</span>沢に水がないのは困窮の象である。君子が困窮の時に当たり、防ぎ先を考える道を尽くしてもなお免れないのは命である。その命を推し致して（突き詰めて泰然と受け止めて）その志を遂げるべきである。命の当然を知れば、窮塞・禍患も心を動かさない。我が義を行うだけである。もし命を知らなければ、艱難に恐懼し、窮厄に隕穫し（「隕穫」は絶望の意味）、守るところを失うであろう。どうして善をなす志を遂げられよう。</p>\n<p>本田の講説：受講者が「『人事を尽くして天命を待つ』みたいですね」と言うと、本田は「天命を達観して、さらに人事を尽くせ」ということだと答えた。「天を楽しむ」というセンスがわからないという受講者には、貧乏するなら貧乏も天と受け止めて楽しむことで、日本でも『方丈記』に多少そういうところがあり、陶淵明は貧乏をちゃかしている、白居易のあざな「楽天」は「楽天知命」から取った、と説明した。</p>\n<h3 id=\"g47-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>すべての爻に「困」の字。</b> 卦名が「困」なので、六爻の辞すべてに「困しむ」の字が入っている。爻辞の象徴的な文句が非常に難しく、この卦が出ればだいたい渋い判断である。</li><li><b>陽同士の応。</b> 九二の程伝によれば、諸卦で二と五が陽同士で応じてしかも吉なのは、小畜と困だけである。二と五は本来陰陽が異なって初めて引き合うが、この二卦はどちらも陽が陰に邪魔されている（小畜は一陰が五陽を止め、困は陽が陰に覆われる）ので、いじめられている陽同士が引き合い助け合う。</li><li><b>君臣は義で合う。</b> 九五の程伝は、陰陽が相応じるのは夫婦・骨肉のように自然に定まった関係だが、五と二はどちらも陽で、剛中の徳が同じことで求め合って後に合う。君臣・朋友のように、他人同士が義で合うのであり、だから時間をかけてようやく喜びがある、と説く。</li><li><b>程伊川の感慨。</b> 九四の程伝に「寒士の妻、弱国の臣は、ただ自分の正に安んずるのみ。勢いある者を選んで従えば悪の大なる者で、世に容れられない」とあるのは、程伊川自身の感慨であろう。程伊川は王安石の新法に反対で、朝廷の中では孤立し、勢いのある大臣には疎まれていた。受講者の問いに答えて本田は、程伊川は北宋の官僚で、皇太子の教育係や天子の顧問のような職にあって言いたいことを言い、あまり出世しなかった、朱子は程伊川のちょうど百年後に生まれ南宋の人、程朱学は英語でNeo Confucianism、兄の程明道は伊川ほど禁欲的でなくゆったりしていて面白く、あまり本を書かなかった、と説明した。</li><li><b>祭・祀・享の別。</b> 九二では「享祀」、九五では「祭祀」と言う。大意はどちらも「至誠を用いれば福を受ける」である。分けて言えば、祭は天神、祀は地祇、享は人鬼をまつる字である。五は君位なので祭と言い、二は下にいるので享と言う。</li><li><b>一番悪い卦。</b> 受講者の問いに、本田は、困は一番悪い卦ではない、一番悪いのは上に一本だけ陽が残っている剝の卦だ、と答えた。困は困窮の時という大変厳しい卦だが、とにかくそれを受け止めて志を失うなという卦である。</li></ul>\n<h3 id=\"g47-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>困窮するが、理想を貫けば通る。大人物なら吉で咎はない。</li><li>困窮の時に言い訳をしても誰も信じない。口先で免れようとするとますます窮する。</li><li>命を受け止めて志を遂げよ。天を楽しみ義に安んじれば、苦しみの中にも喜びがある。</li><li>自分から地位を求めて動けば凶。真心を守って待て（九二）。</li><li>この卦では上六が初めて吉を得る。困窮も極まれば突き抜ける。</li></ul><h2 class=\"sec\" id=\"g47-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">臀困于株木、入于幽谷、三歲不覿。</span></summary><div class=\"body\"><div class=\"yomi\">臀（しり）、株木に困しむ。幽谷に入る。三歳まで覿（み）ず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「入于幽谷、幽不明也。」（幽谷に入るとは、幽にして不明なればなり。）</div>\n<p>尻が木の切り株に苦しむ。深い谷に入り、三年間日の目を見ない。大変悪い判断である。</p>\n<p><span class=\"tag\">程伝</span>初六は陰柔で最も低い位にいて、しかも坎（落とし穴）の底にいる。困窮のどん底にあって自らを救い出せない者である。必ず上の剛明の人を得て助けとすれば、その困を救える。初と四は正応だが、九四は陽で陰位にいて不正、剛を失して中でもなく、自分も陰に掩われて困しんでいる。どうして他人を救えよう。枯木が物に影を落とせないようなものである。株木とは枝葉のない木で、四を指す。四は君に近い位で、他の卦なら人を庇えないことはないが、困の時なので庇えない。臀は座るためのもので、「臀、株木に困しむ」とは庇ってくれる者がなく、自分の居場所にも安んじられないことである。居場所に安んじられれば困ではない。「幽谷に入る」とは、陰柔の人は自分の境遇に安んじられず、困を免れられないので、ますます迷い妄動して深い困に入ることである。谷は深く暗い場所。自ら抜け出る勢いもなく、三年に至っても日の目を見ない。「覿ず」とは、願いが通る状態に至らないことである。</p>\n<p><span class=\"tag\">象伝について程伝</span>幽とは目先が見えないことである。ますます真っ暗闇に入り、自ら深い困に陥る。目が見えていれば陥ることはない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>困窮のどん底。頼る者もなく、迷い動けばますます深みにはまり、長く日の目を見ない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">困于酒食、朱紱方來。利用享祀。征凶、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">酒食に困しむ。朱紱（しゅふつ）方に来る。用て享祀するに利あり。征けば凶、咎むる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「困于酒食、中有慶也。」（酒食に困しむとは、中にして慶び有るなり。）</div>\n<p>酒と飯に苦しむ（「食」は「し」と読み飯の意味）。そこへ高い身分を示す朱色の前垂れ（膝掛け）がまさにやって来る。祭りをするのによろしい。進めば凶だが、誰を咎めることもできない。朱子は「酒や飯を振る舞われて食べ過ぎて苦しむ」と解し、良い判断のようになる。程伊川は「人に施すべき酒や飯に窮乏する」と解す。本田は程伊川の読みに従って読んだが、いずれにしても難しい判断辞だと言う。</p>\n<p><span class=\"tag\">程伝</span>酒食は人の欲するもので、上から言えば下に施し恵むものである。二は剛中の才で困の時にいる。君子は境遇に安んじ、険難に窮しても心を動かさず、身の困を憂えない。困しむのはただ欲するところ、すなわち天下の民に恩沢を与え天下の困を救うことが遂げられないことである。だから酒食に困しむという。大人君子が道を抱いて下に困しむ時は、必ず有道の君がこれを求めて用い、その後に蓄えた徳を施せる。上には九五の剛中の君がいて、道は同じく徳は合う。必ず来て求めるであろう。それが「朱紱方に来る」である。朱紱は王者の服、前垂れで、二と五の行き来を問題にするので足にかかわる紱を象徴とした。享祀とは至誠で神に通じることで、困の時には祭りのような至誠を用いるがよい。徳が誠であれば自ずから上に感通する。昔から賢哲が朝廷から遠い所に困しんで、ついに徳が上に達し道が用いられたのは、ただ至誠を守ったからである。「征けば凶、咎むる无し」とは、至誠で安んじて命を待たずに、自ら出かけて位を求めれば、難儀を犯して凶を得るということで、自ら招いたものだから誰を咎められよう。時を量らず行くのは居場所に安んじないからで、困に心を動かされ、中徳を失って自ら悔いを取るのである。</p>\n<p>本田の講説：程伊川の言わんとするところは、この人なりの理想主義である。</p>\n<p><span class=\"tag\">象伝について程伝</span>欲するところに困しみ、まだ恵みを人に施せなくても、中を守っていれば必ず亨って慶びがある。たとえその時まだ亨通しなくても、中徳を守ること自体が君子の道が亨ることであり、それもまた慶びである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>志を遂げられず苦しむが、真心を守っていれば上からの引き立てがある。自分から求めて動けば凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">困于石、據于蒺蔾、入于其宮、不見其妻、凶。</span></summary><div class=\"body\"><div class=\"yomi\">石に困しみ、蒺蔾（しつり）に拠る。其の宮に入りて、其の妻を見ず。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「據于蒺蔾、乘剛也。入于其宮不見其妻、不祥也。」（蒺蔾に拠るとは、剛に乗ればなり。其の宮に入りて其の妻を見ずとは、不祥なり。）</div>\n<p>前には石がごろごろし、尻の下にはイバラがある。我が家に帰ってみれば妻はいない。凶。非常に悪い状況がはっきりしている。「拠る」とは座ること、尻の下に敷くことである。</p>\n<p><span class=\"tag\">程伝</span>六三は陰柔で不中正の質で、険の極にいて、陽位にいるので剛を用いる。困に処する道を失った甚だしい者である。石は堅く重く勝ち難いもので、上の二陽（四・五）を指す。蒺蔾は刺があって座れないもの。三は剛険で上に進もうとするが、二陽が上にあって力で勝てず、堅くて犯せない。ますます苦しむだけで、それが「石に困しむ」である。不善の徳で九二の剛中の上に座り、その不安なことは刺の上に座るようで、それが「蒺蔾に拠る」である。進退どちらも困しみ、居場所に安んじようとしてもできない。宮とは安んじる居所、妻とは安んじる主体である。進んでも退いても留まっても不可なら、ただ死ぬだけで、その凶は知れている。繋辞伝に「困しむ所に非ずして困しめば名必ず辱められ、拠る所に非ずして拠れば身必ず危うし。既に辱められ且つ危うければ、死期将に至らんとす。妻其れ見るを得可けんや」とある。二陽は犯すべきでないのに犯して困を取る、これが困しむ所でないのに困しむことである。三が二の上にいること自体は構わず、謙柔でへりくだれば害はないが、剛険で乗りかかれば二も抵抗し、不安で困を取る。</p>\n<p><span class=\"tag\">象伝について程伝</span>九二の剛の上に乗り、不安なことは刺を尻に敷くようだという意味である。「不祥」とは不善の徴（前知らせ）で、安んじる所を失うのは不善の結果である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>力で勝てない相手に挑み、居場所もなく、家庭も失う。大凶。無理に動くな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">來徐徐、困于金車、吝、有終。</span></summary><div class=\"body\"><div class=\"yomi\">来ること徐徐たり。金車に困しむ。吝なれど終り有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「來徐徐、志在下也。雖不當位、有與也。」（来ること徐徐たりとは、志下に在るなり。位に当らずと雖も、与有るなり。）</div>\n<p>対応する相手のところへ下りて行こうとして遅疑逡巡する。途中で黄金造りの車に阻まれる。遅疑するのは恥ずべきだが、結果的には有終の美を遂げる。多少屈折した判断で、まるまる悪いことにはならない。</p>\n<p><span class=\"tag\">程伝</span>力が足りなければこそ困しむ。困を救う道は必ず人の助けによる。困の時に上下が助けを求め合うのは当然である。四と初は正応だが、四は不中不正で困の時にいて、人の困を救う才が足りない。初は二に親しんでいる（比している）。二は剛中の才があり、天下の困を救うに足るので、初は当然二に従うであろう。金は剛（九二）、車は物を載せるもので、二は剛で下にいて四を戴いているので金車という。四は初に従おうとして二に阻まれ、その来ることは遅疑して徐々たる。これが金車に困しむことである。自分の応ずる相手が自分を軽んじて二にくっつくのではと疑い、躊躇してにわかに進めない。恥ずべきではないか。「終り有り」とは、事の行き着くところは正であり、四と初は正応なので、最後は必ず結ばれるということである。寒士の妻、弱国の臣は、ただその正に安んずるのみ。もし勢いある者を選んで従えば、悪の大なる者で世に容れられない。二と四はどちらも陽で陰位にいるが、二は剛中の才があって困を救える。陰位にいるのは柔を尚ぶこと、中を得るのは剛柔の宜しきを失わないことである。</p>\n<p>本田の講説：最後に二の徳を讃えているのは、二は剛でありながら陰位におり中を得ているので、結局は邪魔をしないだろうということである。「終り有り」は九四自体が有終の美を遂げる、最後は初六と九四が結ばれるという意味である。「吝」は恥ずべし。漢代に金根車という馬車はあったが、「金車」という言葉は『易経』の中には他にあまり出てこないと思う。</p>\n<p><span class=\"tag\">象伝について程伝</span>四は初に応じるが二に隔てられている。志は下（初）の助けを求めることにあるので、徐々にではあるが下りて来る。陽で陰位にいて位に当たらず、まだ善くないが、正応の初が最終的には味方してくれる（二の邪魔は排除される）。だから終りがある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>助けを求める相手との間に邪魔が入り、ぐずぐずして恥ずかしい思いもするが、正しい縁なので最後は結ばれる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">劓刖、困于赤紱。乃徐有說。利用祭祀。</span></summary><div class=\"body\"><div class=\"yomi\">劓（はなき）られ刖（あしき）らる。赤紱に困しむ。乃ち徐（おもむろ）にして説（よろこ）び有り。用て祭祀するに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「劓刖、志未得也。乃徐有說、以中直也。利用祭祀、受福也。」（劓られ刖らるとは、志未だ得ざるなり。乃ち徐にして説び有りとは、中直を以てなり。用て祭祀するに利ありとは、福を受くるなり。）</div>\n<p>鼻斬りの刑、足斬りの刑に処せられる。赤い前垂れ（諸侯）に苦しむ。だが困窮の時にようやく喜びがある。祭りをするのによろしい。程伊川の易伝では「祭りの時のような真心で賢人を招くがよい」となる。甚だ過激な文句である。</p>\n<p><span class=\"tag\">程伝</span>鼻を截るのを劓といい、上が傷つくこと（九五の上を陰が覆う）。足を去るのを刖といい、下が傷つくこと（一爻隔てて六三の陰が下から侵す）。上下ともに陰に掩われ傷つけられる象である。五は君位で、人君の困は上下に味方がいないことによる。赤紱は臣下（諸侯）の服で、行き来の義を取るので紱を言う。人君の困は天下が来ないことで、天下が来れば困ではない。五は困の時にあっても剛中の徳があり、下に九二の剛中の賢がいる。道は同じく徳は合い、やがて必ず応じて来て、ともに天下の困を救う。始めは困しみ、ようやくにして喜びがある。祭祀は必ず誠敬を致して福を受ける。人君は困の時に、天下の困を思い天下の賢を求めるべきで、祭りのように誠敬を致せば、天下の賢を招き天下の困を救える。ある人が問う、「五と二は徳が同じなのに上下に与无しとは何か」。答え：陰陽が応じるのは夫婦・骨肉のように自然に定まっているが、五と二はどちらも陽で、剛中の徳が同じことで求め合って後に合う。君臣・朋友のように義で合うのである。困の初めにどうして上下の与があろう。与があれば困ではない。だから徐々に合って後に喜びがある。二には享祀、五には祭祀と言うが、大意は至誠を用いて福を受けよということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>始めは陰に掩われ上下の与がなく、困しんで志をまだ得ない時である。「徐にして説び有り」とは、中直の道で下にいる賢を得て、ともに困を救うことである。「中正」と言わず「中直」と言うのは、二と合う者は直と言えば十分だからで（本田によれば、二は不正なので「正」と言うのが憚られた）、直は正に比べて意味がやや広い。祭祀のように誠意を尽くして天下の賢を求めれば、天下の困を亨通させ福慶を享受できる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上下から攻められ孤立して苦しむが、誠を尽くして賢人を求めれば、ようやく喜びが来る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">困于葛藟、于臲卼。曰動悔有悔、征吉。</span></summary><div class=\"body\"><div class=\"yomi\">葛藟（かつるい）に、臲卼（げつごつ）に困しむ。曰く、動けば悔ゆと。悔ゆること有るときは征きて吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「困于葛藟、未當也。動悔有悔、吉行也。」（葛藟に困しむとは、未だ当らざるなり。動けば悔ゆ、悔ゆること有りとは、吉にして行くなり。）</div>\n<p>クズカズラに、ぐらぐらした危ない足場に行き悩む。「困」を二度使うところを略した、少し複雑な構文である。臲卼は木の切り株のような縦に立った柱。もし「へたに動けば後悔があるぞ」と自らに言い聞かせ、よく悔い改めるときは、前進して吉。</p>\n<p><span class=\"tag\">程伝</span>物は極まれば反り、事は極まれば変ずる。困はすでに極まった。理として変わるべきである。葛藟は纏いつくもの、臲卼は危うくぐらつく状態。上六は困の極にいて、困に纏いつかれ、しかも最も高く危うい地にいる。「動けば悔ゆ」とは動けば必ず悔いがあり、困しまないことがないこと。「悔ゆること有り」とは前の過ちを咎めること。「曰く」とは自ら言うことである。もし「動けば悔いを得る」と自ら言い聞かせれば、前のやり方を変えて悔い改める。よく悔いれば進んで吉を得る。困が極まって行けば困を出る。だから吉である。ある人が問う、「三は下卦の上にいて凶なのに、上は卦の上にいて凶でないのはなぜか」。答え：三は陽位にいて、坎の険の一部で、剛険を用いるから凶である。上は柔で兌（説）にいて、ただ困の極というだけである。困が極まれば変ずる道がある（本田によれば、テキストでは「困変ずれば」となっているが意味が通じず、他のテキストによって「困極まれば」と訂正する）。屯の上も応がなく卦の終わりにいるが「泣血漣如」で、困の上は「悔ゆること有るときは征きて吉」である。屯の上は険の極、困の上は説の体だからである。説順で進めば困を離れられる。</p>\n<p><span class=\"tag\">象伝について程伝</span>困に纏いつかれて変われないのは、まだその道を得ていない、困に処することが当を得ていないのである。動けば悔いを得ると知って悔い改め、これを去れば困を出られる。それが「吉にして行く」である。</p>\n<p>本田の講説：受講者が「これは上六が一番いいんですか」と問うと、本田は、この卦では上六が初めて吉の字を得る、困窮の卦だから一番てっぺんまで行けば突き抜ける、と答えた。「こないだの蹇の卦とは違うんですね」という問いには、足萎えの卦とはまた違う、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>困窮の極み。身動きが取れず危ういが、これまでのやり方を悔い改めて進めば、困窮を抜け出て吉。</div></div></details><div class=\"pager\"><a href=\"#gua-46\">← 地風升</a><a href=\"#gua-48\">水風井 →</a></div>", "gua-48": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 48 卦　第五十九講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水風井</div><div class=\"yo\">すいふうせい</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-48\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-48\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-48\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-48\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-48\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-48\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-48\" data-jump=\"yao\">六爻</a></div><h3 id=\"g48-s0\">卦の名と象</h3>\n<p>井は井戸である。卦の形は上が水で下が木、前の困の卦を上下ひっくり返した形である。「井」の字の古い形は「丼」で、井桁の中に木または瓦のつるべがある形である。あまりめでたい文句はついていないが、さりとてさほど悪いこともない卦である。</p>\n<p>程伝（序卦伝を引く）：「上に困しむ者は必ず下に反る。故に之を受くるに井を以てす」。この一句は前の困の序卦伝「升りて已まざれば必ず困しむ」を受けたもので、上昇して止まず苦しめば、必ず下に帰らねばならない、という意味である。物の中で一番低い所にあるのは井戸で、それより低い物はない。だから困の後に井が来る。</p>\n<ul class=\"sen\"><li>卦は坎が上、巽が下である。坎の象は水、巽の象は木で、巽の義は「入る」である（説卦伝）。木は器（つるべ）の象で、木のつるべが水の下に入って水を汲み上げる形、これが井である。</li><li>本田の講説：朱子は「つるべは木でなく陶器のようなもので、木をつるべとするのはおかしい」と言い、他の解釈をする学者もいるが、つるべには木製も瓦製も両方あろう。こだわらなくても程伊川の易伝で通じる。</li><li>程伝（初六）：井と鼎の卦は、どちらもその品物の名前である。物の形あるいは用途を取って卦の名義とした（鼎の卦は鼎の形をしている）。</li></ul>\n<h3 id=\"g48-s1\">卦辞</h3>\n<div class=\"orig\">井、改邑不改井、无喪无得、往來井井。汔至亦未繘井、羸其瓶、凶。</div>\n<div class=\"yomi\">井は、邑を改めて井を改めず。喪う无く、得る无し。往くも来るも井井たり。汔（ほとん）ど至らんとして亦た未だ井に繘（つりい）とせず。其の瓶（つるべ）を羸（やぶ）る。凶。</div>\n<p>村の区画は改まっても、村の中心にある井戸は変わらない。汲んでも汲まなくても減りもせず増えもしない。常にこんこんと一定の水準を保っている。人が汲みに来ては去るが、水の清さは変わらない（「井井」は清潔さが変わらないこと）。つるべの縄が水面に至ろうとして、まだ届かぬうちにつるべが壁にぶつかって割れる。凶。前半はよいが最後の判断は凶で、「往来井井」までは井戸の徳を述べ、最後は「つるべが届かずに割れれば凶」という二段の判断になっている。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>井の体は恒常で改めることができない。邑は改めて他所へ移せるが、井戸は移せない。だから「邑を改めて井を改めず」。汲んでも尽きず、そのままでも溢れない。これが「喪う无く得る无し」。汲みに来る者はみなその用を得る、これが「往来井井」。その徳が恒常で、その用があまねく行き渡る。恒常性とあまねさ、これが井の道である。</li><li>「汔」はほとんどの意味、「繘」はつるべなわである。井は水を汲む用をなしてこそ手柄がある。ほとんど水面に至っても用を遂げなければ、つるべなわを井に下さないのと同じである。君子の道は成ることを貴ぶ。だから「五穀熟せざれば荑稗（イヌビエ・ヒエ）に如かず」（『孟子』告子篇）、「井を掘ること九仞にして泉に及ばざれば、猶お井を棄つると為す」（仞は七尺あるいは八尺）。物を救う用がありながら物に及ばなければ、ないのと同じである。つるべを壊して失えば、井の用は失われる。だから凶である。「羸」は壊れる意味である。</li></ul>\n<h3 id=\"g48-s2\">彖伝</h3>\n<div class=\"orig\">巽乎水而上水、井。井養而不窮也。改邑不改井、乃以剛中也。汔至亦未繘井、未有功也。羸其瓶、是以凶也。</div>\n<div class=\"yomi\">水に巽（い）りて水を上ぐるは井なり。井は養いて窮まらざるなり。邑を改めて井を改めざるは、乃ち剛中を以てなり。汔ど至らんとして亦た未だ井に繘せずとは、未だ功有らざるなり。其の瓶を羸る、是を以て凶なり。</div>\n<p>木のつるべが水の中に入って水を汲み上げるのが井戸である。井戸は人を養って尽きない。村の区画は変わっても井戸が変わらないのは、二と五が剛中の徳を持っているからである。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>水の下に入って水を上げるのが井である。井が物を養うことは極まり止むことがない。汲んでも尽きないのは、その徳に恒常性があるからである。邑は改められても井は移せない、これもその徳の恒常である。二・五の爻は剛中の徳で、その恒常性はこのようである。卦の形と卦の義がちょうど合致する。</li><li>たとえほとんど水面に至っても、まだ用をなさなければ、つるべなわを下さないのと同じである。井は用をなすことを手柄とし、水が出て初めて用となる。まだ出なければ何の功があろう。つるべは水を上げて井の用を果たすものである。それを壊せば用をなさない。だから凶である。</li></ul>\n<h3 id=\"g48-s3\">大象</h3>\n<div class=\"orig\">木上有水、井。君子以勞民勸相。</div>\n<div class=\"yomi\">木の上に水有るは井なり。君子以て民を労（ねぎら）い、勧め相（たす）けしむ。</div>\n<p>木のつるべで水を汲み上げるのが井戸である。君子はこれに倣って、民の苦労をねぎらい、民が助け合うように奨励する。</p>\n<p><span class=\"tag\">程伝</span>木（つるべ）が水を受けてこれを上げる、器で水を汲み出す、井の象である。君子は井の象を観て井の徳にのっとり、その民を労い徠（まね）き、民に互いに助け合う道を勧める。民を労い徠くのは井の用にのっとり、民に勧めて助け合わせるのは井の施し（あまねく人に施す）にのっとる。本田によれば、「徠」は「彳」がなくても来させる意味になるが、「徠」とすると行く動きがはっきりする。</p>\n<h3 id=\"g48-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>悔・吝・咎を付けない理由。</b> 九二の程伝で、ある人が「初と二はどちらも手柄がないのに、悔や吝の語がつかないのはなぜか」と問う。答え：失すれば悔があり、過てば咎となる。応援がなくて用をなせないのは悔や咎ではない。「二が中にいるのに初に親しむのは過ちではないか」と問うと、中にいるのは過ちではなく、上れないのは五の応援がないためで、初に比するからではない、と答える。本田は、爻辞自体は悪い判断でも必ずしも悔や咎の字を加えないのには理由がある、と程伊川は考えるのだと説明する。受講者が「失すれば悔有り、過てば咎と為す」はだいたいそうなのかと問うと、本田は「はい」と答えた。また「応援がない」のが時勢のせいか人徳のせいかという問いには、卦によって違い、陽同士が二と五にいて良い場合もあり、原則は立てられないと答えた。</li><li><b>事なかれ主義への戒め。</b> 六四の程伝の最後「もし剛陽の才なら、修繕だけに止まるはずはなく、止まれば咎められる」の二句は本文にはまったくない。程伊川が自分の意見で付け加えたもので、身の回りの官僚に事なかれの人があまりに多いので諫めたのであろう、と本田は言う。</li><li><b>屈原と九三。</b> 九三の爻辞は『史記』屈原列伝で、司馬遷が屈原を悼んだ文句の中に引かれている。楚の懐王が秦に招かれた時、屈原が「行ってはいけない」と言うのに出かけて虜になり、一生虜で終えた。司馬遷はこの辞を引き、さらに「王の不明ならば、豈に福とするに足らんや」と加えて、王が屈原の言を聞かなかったことをあざけっている。</li><li><b>上が最も良い卦。</b> 普通の卦の終わり（上爻）は極まり変ずる所であまりよくないが、井と鼎だけは卦の終わりが成功を意味する（鼎の上九は「大吉にして利あらざる无し」）。井は水を上げることを手柄とするからである。</li><li><b>「舎」のアクセント。</b> 初六象伝の「時舎也」について、テキストに「舎、上声」とある。去声なら「やどる、とどまる」、上声なら「捨」と同じ「すてる」の意味で、ここは「すてる」と読む。乾の文言伝「見龍田に在るは時に舎（やど）まるなり」とは音が違う。受講者の問いに、本田は「時に舎てらる」は易ではここと乾の文言伝の二回しか出てこない、乾の文言伝はようやく認められようとしている龍なので、「捨てられる」と読むと矛盾するので、論理が通じるようアクセントを変えたのだと説明した。</li></ul>\n<h3 id=\"g48-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>井戸のように恒常で変わらず、あまねく人を養う徳を持て。</li><li>用をなすのは結果を出してこそ。あと一歩で事を壊せば凶（卦辞）。</li><li>民をねぎらい、互いに助け合うよう勧めよ。</li><li>力が弱ければ、せめて自分の仕事をきちんと修めて廃れさせるな（六四）。</li><li>上爻に至って初めて大吉。井は汲み上げ切ってこそ成功である（上六）。</li></ul><h2 class=\"sec\" id=\"g48-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">井泥不食、舊井无禽。</span></summary><div class=\"body\"><div class=\"yomi\">井泥（ひじりこ）にして食らわれず。旧井に禽（とり）无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「井泥不食、下也。舊井无禽、時舍也。」（井泥にして食らわれずとは、下なればなり。旧井に禽无しとは、時に舎（す）てらるるなり。）</div>\n<p>井戸の底が泥で濁って飲めない。古い井戸には鳥も水を飲みに下りてこない。</p>\n<p><span class=\"tag\">程伝</span>井と鼎はどちらも物で、物について義をなす。初六は陰柔で最も下にいて、上に応援がない（四と陰同士で引き合わない）。水を上げる形がなく、物を救えない。これが飲めない井である。飲めないのは泥だからで、井の下にいるので泥の象がある。井は水が人を養うことで用があり、水がなければ捨て置かれて用いられない。水が上れば人はその用を得、鳥もそこに就いて水を求める。古く捨てられた井は人がもう飲まず、水も上がらないので、鳥もまた行かない。物を救うことがないからである。初六は陰で一番下にいて、陰は弱く力がない。これはちょうど、人が天下を救うべき時に、才が弱く援けもなく、効用を他人に及ぼせず、結局時勢から捨てられるのと同じである。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰で井の下にいるのは泥の象で、水がなく泥だけがあるのは人の飲まないものである。飲まなければ水はますます上がらず、鳥にも及ばず、鳥も来ない。物を救えないのを見て、時勢に捨て置かれ用いられないものとした。もし鳥にでも及べば、まだ救うところがあるのだが。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才も援けもなく、何の役にも立てず、時勢から見捨てられる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">井谷射鮒、甕敝漏。</span></summary><div class=\"body\"><div class=\"yomi\">井谷、鮒（ふな）に射（そそ）ぐ。甕（もたい）敝（やぶ）れて漏る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「井谷射鮒、无與也。」（井谷鮒に射ぐとは、与（くみ）する无ければなり。）</div>\n<p>井戸の水が谷川のように横に流れてフナに注ぐ。かめ（瓦製のつるべ）が割れて水が漏れる。「井谷」とは地下水が垂直に上ってくる井戸ではなく、横流れする谷川の水である。</p>\n<p><span class=\"tag\">程伝</span>二は陽剛の才だが下にいて、上に応援がなく（五と陽同士）、下の初に親しんでいる。上らずに下る形である。井の道は上り行くものだが、澗谷の水は傍らに出て下に就く。二は井の中にいながら下に流れ去ろうとするので、井の道を失い、谷と同じである。井は上に出れば人を養い物を救えるが、今は下って泥に就き、鮒に注ぐだけである。鮒は川エビとする説、ガマとする説もあるが、いずれにせよ井の泥の中の小さな生物にしか恩恵を与えない。射は注ぐ意味。甕が破れて漏るのは、陽剛の才で本来人を養い物を救えるのに、上に応援がないので上れず、用をなす功がないことで、水が甕にあって本来用をなせるのに破れて漏れ、役に立たないようなものである。</p>\n<p>本田の講説：受講者が「鮒に注ぐ」とは役に立たないことかと問うと、本田は、広く万人を救うことができず、せいぜい一番低い所にいるケチな人物に恩恵を注ぐだけだということだ、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>井は上に出ることを功とする。二は陽剛の才で本来用をなせるが、下にいて上に応援がないので、下に比して鮒に注ぐ。もし上に味方する者がいれば、汲み上げられ引っ張られて上り、井の功を成し遂げられるのに。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才能はあっても引き立ててくれる人がなく、つまらない相手にしか力を注げない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">井渫不食、為我心惻。可用汲、王明並受其福。</span></summary><div class=\"body\"><div class=\"yomi\">井渫（さら）えて食らわれず。我が心の惻（いた）みを為す。用て汲む可し。王明らかなれば、並びに其の福を受けん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「井渫不食、行惻也。求王明、受福也。」（井渫えて食らわれずとは、行いの惻みあるなり。王の明を求むるは、福を受けんとなり。）</div>\n<p>井戸の水がさらえられて澄んだのに、誰も飲んでくれない。わたし（井戸自身）の心の痛みとなる。汲んで飲める水なのに。上に立つ王が賢明ならば、上下ともにその福を受けるであろうに。</p>\n<p><span class=\"tag\">程伝</span>三は陽剛で正位にいる（陽が陽位）。用をなす才がある者である。井の下体の上にいて、水が清潔で飲めるものである。井は上ることを用とするので、下にいてはまだ用を得ていない。陽の性は上り、志は上六に応じ、剛位にいて中を過ぎている。上り進むことに汲々とする者で、才があって用いられることに心が切実である。まだ用いられないのは、井が渫えて清いのに飲まれないようなもので、我が心の惻（嘆き）となる。三は剛で中でないので、行うことに切実である。『論語』述而篇の「之を用うれば行い、之を舎けば蔵（かく）る」という君子とは異なる。しかし明王が人を用いるのに、どうして完全を求めよう。だから王が明らかなら福を受ける。三の才は用をなすに足り、井の清潔な水が汲んで飲めるようなもので、上に明王があればこれを用いて効を得る。賢才が用いられれば己の道を行え、君はその功を享け、下はその恩沢を被る。上下並びに福を受けるのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>井が渫えられて飲まれないのは、人に才知がありながら用いられず、道を行えないことを憂い惻むのである。行えないことを惻みとすれば、何かを求めずにはいられない。そこで王の明を求めて福を受けようとする。自分の道が行われることに最も切実だからである。</p>\n<p>本田の講説：受講者が「福とは天からの福か」と問うと、本田は、天からの福で、しめすへんがついているからあくまで神からのもの、右側はお供えのお神酒の形だ、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才能も準備も整っているのに用いられず、もどかしい。賢明な上役に恵まれれば、上下ともに福を得る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">井甃、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">井甃（しゅう）す。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「井甃无咎、脩井也。」（井甃す咎无しとは、井を脩むるなり。）</div>\n<p>井戸の壁が修繕された。「甃」とはレンガや石畳を貼って、井戸の壁を崩れないようにすることである。咎はない。</p>\n<p><span class=\"tag\">程伝</span>四は陰柔だが正位にいて（陰が陰位）、上に九五の君を承けている。才は広く施して物を利するには足りないが、自らを守ることはできる者である。だからよく修治すれば咎はない。甃とは石畳を重ねること（砌累）で、井を修めることである。四は才が弱く物を救う功を広げられないが、自分の仕事を修治し、廃れさせないことはできる。もし修治もできず、人を養う功を廃すれば、井の道を失い、咎は大きい。高位にいて剛陽中正の君を得ているので、正に処り上を承け、その仕事を廃さなければ咎を免れる。</p>\n<p><span class=\"tag\">象伝について程伝</span>甃とは井を修治することである。物を救う功を大きくはできないが、修治して廃れさせない。だから咎がない。かろうじて咎を免れるだけである。もし剛陽の才なら、これだけに止まるはずはなく、これに止まれば咎められる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大きな働きはできないが、自分の持ち場をきちんと修めていれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">井洌寒泉食。</span></summary><div class=\"body\"><div class=\"yomi\">井洌（きよ）くして寒泉食らわる。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「寒泉之食、中正也。」（寒泉の食らわるるは、中正なればなり。）</div>\n<p>井戸の水が甘く清く、冷たい地下水がこんこんと湧き出て飲める。大変きれいな判断辞である。「泉」は地下水の意味。</p>\n<p><span class=\"tag\">程伝</span>五は陽剛中正で尊位にいる。その才その徳は善を尽くし美を尽くしている（『論語』八佾篇で孔子が韶の楽を聴いて「美を尽くし、又た善を尽くせり」と言った語）。これが井が洌くて寒泉が食らわれることである。洌とは甘く潔いこと。井泉は冷たいのを美とする（夏でも冷たいのが井戸の水の美点）。甘く清潔な冷たい泉は人の食となるべきもので、井の道の至善である。しかし元吉と言わないのは、井は上に出ることを成功とし、五はまだ上に至っておらず、用が尽くされていないからである。だから上に至って初めて元吉と言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>寒泉が飲めるのは井の道の至善である。五の位は中を得ており、しかも正を得ていれば至善の義となる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才徳が整い、清らかな水のように人を潤す。ただ成功の完成はまだ一歩先である。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">井收勿幕、有孚元吉。</span></summary><div class=\"body\"><div class=\"yomi\">井収（く）みて幕（おお）うこと勿れ。孚有れば元吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「元吉在上、大成也。」（元吉にして上に在り、大いに成るなり。）</div>\n<p>井戸の水を汲み取った後も、覆いをしてはいけない。いつでも誰でも汲めるようにカバーをせずにおけということ。井戸の用途が不変であれば大吉。一番上の位は大体あまりよくないか善悪を超えた位のない場所だが、井戸の卦ではこれが至ってよろしい。</p>\n<p><span class=\"tag\">程伝</span>井は上に出ることを用とする。井の上にいるのは井の道の完成である。収とは汲み取ること、幕とは覆うこと。汲み取って覆わなければ、その利は窮まりがなく、施しは広く大きい。「孚有り」とは恒常で変わらないこと。広く施して恒常であるのは大善の吉である。井の用を体し、広く施して恒常であることは、大人でなければ誰ができよう。他の卦の終わりは極、変ずる所だが、井と鼎だけは終わりが成功となる。だから吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>大善の吉で卦の上にいる。井の道の大成である。井は水を上げることを成功とするからである（本田：だから他の卦と違い、一番上の爻が一番めでたい）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>事業の完成。独り占めせず広く恵みを施し、変わらぬ誠を保てば大吉。</div></div></details><div class=\"pager\"><a href=\"#gua-47\">← 沢水困</a><a href=\"#gua-49\">沢火革 →</a></div>", "gua-49": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 49 卦　第六十講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">沢火革</div><div class=\"yo\">たくかかく</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-49\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-49\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-49\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-49\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-49\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-49\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-49\" data-jump=\"yao\">六爻</a></div><h3 id=\"g49-s0\">卦の名と象</h3>\n<p>革命の「革」であるが、「かわ」という意味もあり、爻辞の中でも「かわ」の意味で使っている部分がある。毛皮の毛を全部剥ぎ取って全く新しいピカピカの革にする、それが「あらためる」という意味に通じる。</p>\n<p>程伝（序卦伝を引く）：「井の道は革めざる可からず。故に之を受くるに革を以てす」。井戸は水をそのままにしておけば濁り腐り、しょっちゅう替えれば清潔である。絶えず改めなければならないものである。だから井の後に革が来る。</p>\n<ul class=\"sen\"><li>卦は上が兌（沢）、下が離（火）で、沢の中に火がある。革は変革である。水と火はお互いに消し合う（息する）もので、水は火を滅し、火は水を涸らす。互いに相手を変革するものである。火の性は上り、水の性は下る。もし火が上で沢が下なら、反対方向に進んで「背く」睽の卦になる。ところが革は火が下、水が上にあって、互いに飛びついて相手に打ち勝ち、消そうとする。だから革という。</li><li>人事で言えば、下は中女、上は少女で、二人の娘が同居しながら嫁ぎ先がそれぞれ異なり、志が同じでない。良い家に嫁いだ者とそうでない者とは仲が悪くなる。だから革という。</li></ul>\n<h3 id=\"g49-s1\">卦辞</h3>\n<div class=\"orig\">革、已日乃孚。元亨利貞、悔亡。</div>\n<div class=\"yomi\">革は、已（や）んぬる日にして乃ち孚（まこと）とせらる。元いに亨る。貞しきに利あり。悔い亡ぶ。</div>\n<p>革命は、革命の機運が満ち充ちた日に初めて人々に信じられる。この卦が出れば願いごとは大いに通る。正しさを持続するによろしい。革命が成功して初めて、革命に付きものの悔も滅びるであろう。</p>\n<p><span class=\"tag\">程伝</span>革とはその故（古い状態）を変えることである。古いものを変えれば、人はにわかに信じられない。だから必ず「已んぬる日」（機運が満ち充ちた日）になって初めて人心は信じ従う。「元亨利貞、悔亡」とは、弊害が極まって後にこれを改める。改めるのは塞がったものを通すゆえんで、改めて大いに亨る。改めて正道に利があれば、長い間には古い弊害を去る道を得て、変動の悔いがなくなる。改めても益がなければなお悔いがあり、まして改めてかえって害があればなおさらである。だから古人は改め作ることを重（はばか）った。本田によれば、「重」には「はばかる」意味があり、「慎重」は「慎み、はばかる」と読んでかまわない。</p>\n<h3 id=\"g49-s2\">彖伝</h3>\n<div class=\"orig\">革、水火相息、二女同居、其志不相得、曰革。已日乃孚、革而信之。文明以說、大亨以正、革而當、其悔乃亡。天地革而四時成。湯武革命、順乎天而應乎人。革之時大矣哉。</div>\n<p>革は、水火相息し、二女同居して、其の志相得ざるを革と曰う。已んぬる日にして乃ち孚とせらるとは、革めて之を信ずるなり。文明以て説び、大いに亨りて以て正し。革めて当る、其の悔い乃ち亡ぶ。天地革まりて四時成る。湯武命を革め、天に順いて人に応ず。革の時、大いなるかな。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>沢と火が相滅息し、二女の志が相得ない。だから革という。「息」は止息（とどまる）の意味にもなり、生息（そだつ）の意味にもなる。物は止息して後に生がある。革の「相息す」は止息、消し合う意味を取る。本田によれば、「終息」の「息」はとどまる、「消息」の「息」はのびるの意味で、正反対の意味がある。</li><li>「已んぬる日にして乃ち孚とせらる」は「革めて之を信ず」と孔子が「孚」の字を解説したものである。事を変革すれば人心がどうしてすぐ信じよう。必ず終わりの日に至って初めて信じる。上にある者は改革の際に、あらかじめ詳らかに告げ、重ねて命令し、機運の満ちた日に至って人々に信じさせる。人心が信じなければ、強いて行っても成功しない。先王の政令も人心は初めは疑う者がいたが、久しくすれば必ず信じた。最後まで信じられずに善い政治を成した者は、いまだかつてない。</li><li>「文明以て説ぶ」は卦の才で革の道を言う。離は文明、兌は説である。文明であれば理を尽くし事を明察し、説であれば人心が和順する。改めてよく事理を照察し人心を和順させれば、大いに亨って貞正を得、変革が至当を得る。だから悔いが亡ぶ。天下の事は改めてその道を得なければかえって弊害を招く。だから革には悔いの道がある。ただ改めることが至当なら、新旧の悔いがみな亡ぶ。</li><li>革の道は天地の変易、時運の終始を極める。天地陰陽が推し移り改まって四時を成し、万物はここで生長し終わりを遂げ、おのおのその宜しきを得る。時運が終われば必ず改めて新たにする者がある。王者が興るのは天に命を受けるのであり、だから世を易えることを革命という。湯王・武王が王となったのは、上は天命に順い、下は人心に応じたのである。天道が変わり世の事が移るのは、革の至大なものである。だから「革の時、大いなるかな」と讃えた。</li></ul>\n<p>本田の講説：中華民国成立の頃、改革派の人が出していた「順天時報」という新聞があった。</p>\n<h3 id=\"g49-s3\">大象</h3>\n<div class=\"orig\">澤中有火、革。君子以治曆明時。</div>\n<div class=\"yomi\">沢中に火有るは革なり。君子以て暦を治め、時を明らかにす。</div>\n<p>沢の中に火があり、水と火が相手を消し合おうとする形が革である。君子はこれにかたどって新しい暦を作り、新しい時代の到来を明示する。新しい王朝が建った時に最初にやることは暦を改めることである。</p>\n<p><span class=\"tag\">程伝</span>水火の相息が革で、革は変ずることである。君子は変革の象を観て、日月星辰の遷り易わるのを推して暦数を作り、四時の序を明らかにする。変易の道は事の至大なものだが、理の至って明らかなもの、迹の至って著しいものは四時に勝るものはない。四時を観て変革に順えば、天地とその序を合わせることになる。</p>\n<h3 id=\"g49-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>天に順い人に応ずる。</b> 受講者の問いに、本田は、これは孟子が詳しく述べていると答えた。天は新しい支配者を誰かに命ずるが、それを必ず民に示し、民がみな待ち望み受け入れる意志を示して初めて、古い支配者の命を取り上げて新しい支配者に命をくだす。決めるのは民だが、古代には世論を聞くシステムがないので、必ず瑞祥が現れる。周の武王が黄河を渡ろうとした時、武王の船に大きな白い魚が飛び込んだ（白は殷の色）。決戦前夜には天から真っ赤な火が降りて殷の都を覆った（赤は周の色）。そこで皆の意見が一致して突撃し、殷を滅ぼした（『書経』）。民衆が全部見るわけではないが、それを言いふらすのである。時代が下ると、前漢を奪った王莽は、自分が天子になるべきだという石碑のようなものが天下の至る所から出てくるようにしたが、全部自分が埋めておいたものだった。</li><li><b>孔子と孟子。</b> 孔子はどうしようもない暴君をどうするとはついぞ言わない。君主は有徳者でなければいかんと言うが、無徳の君主をどうしろとは憚って言わなかった。孟子は一番烈しく、無徳の者は殺してもかまわないと言う。受講者からは「後醍醐天皇は『三たび就る』をしなかったからしくじった」「毛沢東より孫文の辛亥革命のほうがこれらしい」などの声が出た。</li><li><b>「三たび」。</b> 九三の「三たび就る」は、ここでは文字どおり三回の意味である。日本で「八」を重んじるのに対し、中国では一桁の数の終わりである「九」を重んじる。</li><li><b>「改命」は「革命」か。</b> 九四の「改命」について、幕末大坂の懐徳堂の町人学者中井履軒は『周易逢原』で、元は「革命」だったのを後世の儒者が憚って「改命」に変えたのではないかと疑っている。中国の学者は誰もそういう疑いを持たず、程伝も「改命とは之を革むるなり」と革と同じに解する。『易経』の本文に「革命」の二字は出てこず、彖伝で初めて現れる。</li><li><b>大人虎変・君子豹変・小人革面。</b> 立場によって処し方が違う。「変」「変」「面」と韻を踏んでいる。虎の模様は黄と黒の縞がはっきりしていて鮮やか、豹の模様は点々とゴマをふったようで虎ほど鮮やかでない。日本で「君子豹変」というと悪い方に使われるが、元は良い意味で、革命の国だから鮮やかに態度を変えて当然という。中国でも「君子豹変」の方がよく使われる。「大人虎変」はあまり使わない。</li><li><b>性善と下愚。</b> 上六の長い程伝には、「人の性は絶対に善なるものである」という宋学の倫理がある。下愚には自暴と自棄の二つがあるが、自暴自棄の者が必ずしも愚かとは限らず、殷の紂王のように強情で才力が人に過ぎる者もいる。小人が威を畏れて面を革めるところに普通の人と同じ心の働きがあり、本性そのものが悪いのではない。本田は、面従腹背でも面従できる点だけでも評価できるという考えだと説明した。性善説は孟子が最初に言った。</li></ul>\n<h3 id=\"g49-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>改革は機運が満ち充ちてから。早すぎる改革は人に信じられない。</li><li>改革が当を得ていれば、願いは大いに通り、改革に付きものの悔いも消える。</li><li>時・位・才がそろわないうちは、身を固めて妄動するな（初九）。</li><li>進むべき時に進まなければ時を失って咎がある（六二）。</li><li>改革の議論は三度まで確かめて合意を得てから実行せよ（九三）。</li><li>改革が成ったら、それ以上の追及はやりすぎで凶。正しさを守って居れば吉（上六）。</li></ul><h2 class=\"sec\" id=\"g49-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">鞏用黃牛之革。</span></summary><div class=\"body\"><div class=\"yomi\">鞏（かた）むるに黄牛の革を用う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鞏用黃牛、不可以有為也。」（鞏むるに黄牛を用うとは、以て為す有る可からざるなり。）</div>\n<p>飴色の牛の革で我が身を固める。</p>\n<p><span class=\"tag\">程伝</span>変革は事の大なるもので、必ずその時があり、その位があり、その才があって、審らかに慮り慎んで動いて初めて悔いがない。初九は、時で言えば初めで、事の初めに動けば審慎の意がなく、躁易（騒がしく軽々しい）の象がある。位で言えば最も下で、時を得ず援けもなく（四と陽同士で引き合わない）下で動けば僭妄（分不相応）の咎があり、どっしりした勢いもない。才で言えば離の体で陽、離の性は上に燃え上がり、剛の体は健、いずれも動くことに速い。その才がこのようで何かをすれば凶咎が至る。不中で剛、体が騒がしく、足りないのは中と順である。中順で自らを固め妄動しなければよい。鞏は局束（ぎゅっと固め縛る）で、革は包み縛るもの、黄は中の色、牛は順な家畜である。中順の道で自らを固め、妄動しないことである。ある人が「吉凶を言わないのはなぜか」と問う。答え：妄動すれば凶があるが、中順で自らを固めれば改革をせずに済む。改革に踏み出さないのに、どうして吉凶があろう。</p>\n<p><span class=\"tag\">象伝について程伝</span>初九の時・位・才から見て、まだ何かをしてはならない。だから中順で自らを固めるべきである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>まだ動く時ではない。中庸と従順で身を固め、改革に手を出すな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">已日乃革之、征吉无咎。</span></summary><div class=\"body\"><div class=\"yomi\">已んぬる日にして乃ち之を革む。征けば吉にして咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「已日革之、行有嘉也。」（已んぬる日にして之を革むとは、行けば嘉び有るなり。）</div>\n<p>革命の機運が満ち充ちた日になって初めて革命の旗を揚げる。前進して吉、咎はない。</p>\n<p><span class=\"tag\">程伝</span>六二は陰柔で二にいて、柔順で中正を得ており、また文明（離）の主である。上には九五の剛陽の君がいて、徳を同じくして相応じる。中正なら偏蔽がなく、文明なら事理を尽くし、上に応ずれば権勢を得、体が順なら道理に違うことがない。時は可、位は得、才は足りており、革に処する至善の者である。しかし臣の道としては革命の先頭をきるべきでなく、また必ず上下の信を待たねばならない。だから已んぬる日に初めて改める。このような才徳、地位、時は、天下の弊害を改め天下の治を新たにするに足る。進んで上の君を輔けてその道を行うべきで、そうすれば吉で咎はない。進まなければ為すべき時を失い、かえって咎がある。二は体が柔なので進むのが緩く、位に当たっているので足場が固い。変革は事の大なるものなので、この戒め（速く動くな、足場を固めよ）がある。二は中を得て剛に応じているので柔に失するほどではないが、その柔さゆえに疑われるので、「吉」と言い切って立場の正しさを明らかにし、為すべき時を失わせないのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>今こそ天下の弊害を改め、天下の事を新たにすべきである。機運が満ちているのにじっとしていて進まないのは、弊害を救い世を救う心がないことで、時を失して咎がある。</p>\n<p>本田の講説：受講者が「『已んぬる日』がポイントで、その日にならないと改革はできないんですね」と言うと「はい」と答えた。「已」を辰巳の「巳」の字に読む解釈もある。「已んぬる」なら、古い弊害がすでに終わった日に革命を起こせということである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>機運は熟した。上の人と心を合わせ、思い切って進めば吉。ためらえば時を失う。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">征凶、貞厲。革言三就、有孚。</span></summary><div class=\"body\"><div class=\"yomi\">征けば凶。貞なれど厲（あや）うし。革の言、三たび就（な）りて孚有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「革言三就、又何之矣。」（革の言、三たび就る、又た何くに之かん。）</div>\n<p>自ら行こうとすれば凶である。正しさを守り、おそれを抱くべきである。「革命せよ」との意見が三回まで通って初めて、自分も信じ、人々にも信じられるであろう。「言」は言葉、「就」は成就の就で「なる」の意味。</p>\n<p><span class=\"tag\">程伝</span>三は陽剛で下体の上にいて、離（明）の上にいて中を得ない。革に躁動する者である。下にいて変革に躁がしく動けば凶がある。しかし下の上にいて、事を改めるべき時にどうして何もせずにいられよう。正を守り危懼の心を抱き、天下の公論に順えば、行って疑わなくてよい。「革の言」とは改めるべきだという議論のこと、就は成る・合うの意味である。改めるべきだという意見を審らかにし、三度まで諮ってみな合えば信じてよい。重ね重ね慎重にするという意味で、こうすれば必ず至当を得て、自分も信じ衆も信じる。そうして初めて改めてよい。改めるべき事があるのに恐れて何もしなければ時を失って害となる。ただ慎重の至り、自分の剛明を自負せず、詳しく公論を考え三度合意するに至って改めれば、過ちはない。</p>\n<p><span class=\"tag\">象伝について程伝</span>衆の議論に考え合わせて三度合うに至れば、事は至当である。「又た何くに之かん」とは当時の俗語の「更に何くに往かん」（そうするほかない）と同じ言い回しで、宋代にこういう俗語があったらしい。こうして行うのは理に順い時に行うことで、自分の私意でしたいと思うのとは違う。必ずその宜しきを得る。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>改革に逸る気持ちのまま進めば凶。慎重に公の議論にかけ、何度も合意を確かめてから実行せよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">悔亡、有孚改命吉。</span></summary><div class=\"body\"><div class=\"yomi\">悔い亡ぶ。孚有れば命を改めて吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「改命之吉、信志也。」（命を改むるの吉なるは、志を信ずればなり。）</div>\n<p>革命に付きまとう悔もなくなる。人々すべてが信ずれば、革命を行ってよろしい。</p>\n<p><span class=\"tag\">程伝</span>九四は革の盛んな時である。陽剛は革の才、下体を離れて上体に進むのは革の時、水火の境にいるのは革の勢い、君に近い位を得るのは革の任、下に応がない（初と陽同士）のは革の志（下の者に足を引っ張られない）、陽で陰位にいて剛柔相交わるのは革の用である。四はこれらを兼ね備え、まさに改めるべき時である。悔ゆべき事態であればこそ改めるのであり、改めて当を得ればその悔いは亡ぶ。改めて当を得るには、至誠で処することにある。だから孚があれば命を改めて吉。「命を改む」とは改め為すこと、これを革めることである。事が当を得て弊害が改まり、誠で行えば上は信じ下は順う。その吉は知れている。ある人が「四は中正でないのに至善なのはなぜか」と問う。答え：柔の位にいるので剛だが過ぎず、君に近いが迫らず、中正の君に順承している。中正の人である。易が義を取るのは一定せず、時に随うだけである（必ずしも二・五が中、陽陽位・陰陰位が正という原則にとらわれない）。</p>\n<p>本田の講説：「順承」の「承」は、うけたまわる、自分の上に戴いているということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>命を改めて吉なのは、上下がその志を信じるからである。誠が至れば上下は信じる。革の道は上下の信を本とする。当を得ず誠がなければ信じられない。当を得ていても信じられなければ、なお行ってはならない。まして当を得ていなければなおさらである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>改革を実行する好機。真心をもって当たり、上下に信じられていれば、改革して吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">大人虎變、未占有孚。</span></summary><div class=\"body\"><div class=\"yomi\">大人虎のごとく変ず。未だ占わずして孚有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大人虎變、其文炳也。」（大人虎のごとく変ずとは、其の文炳（あき）らかなり。）</div>\n<p>大人物の革命の際の自己変革は、虎の模様のように鮮やかである。占わずとも天下の人々に信じられるであろう。受講者の問いに、本田は、「変ず」とは自己変革する、態度が変わることで、王朝が変われば新しい王朝にぱっと忠誠を誓うが、いやいやのように見えずに鮮やかに変わるということ、これが革命の時の心得だと答えた。程伝によればこの大人は尊位にいるリーダー、革命を成し遂げた新しい支配者である。</p>\n<p><span class=\"tag\">程伝</span>五は陽剛の才、中正の徳で尊位にいる。大人である。大人の道で天下の事を改める。当たらないことはなく、時宜にかなわないことはない。経過する変化は事理が炳（あき）らかに著しく、虎の文様のようである。だから「虎変」という。龍虎は大人の象である（乾の卦ではすべて龍に大人物をたとえた）。「変」とは事物の変である。ある人が「虎とは何か」と問う。答え：大人が天下を変えることは、すなわち大人自身の変である。大人が中正の道で変革する仕方は炳然と明らかで、占いの判断を待たずとも至当であることが知れ、天下は必ず信じる。天下が大人の変革をこうむれば、占いを待たずに当を得ていることを知り信じるのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>事理が明らかに著しいことは、虎の文様が明らかに輝くようである。天下に信じない者があろうか。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>改革の指導者として、迷いなく鮮やかに変われ。占うまでもなく人々は信じてついて来る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">君子豹變、小人革面。征凶、居貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">君子は豹のごとく変ず。小人は面を革む。征けば凶。貞しきに居れば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「君子豹變、其文蔚也。小人革面、順以從君也。」（君子は豹のごとく変ずとは、其の文蔚（うつ）たるなり。小人は面を革むとは、順にして以て君に従うなり。）</div>\n<p>君子（善人）の自己変革は豹の模様のようである。小人物は心から変わることはできず、ただ顔付きだけ改める。しかし小人にはそれでよしとせねばならない。さらに強く改革を進めれば凶。正しい道におれば吉。「居貞吉」は少し難しく、ここの解釈は程伝による。「居れば貞しくして吉」とも読める。受講者の問いに、本田は、君子・小人は階級について言う場合と善悪について言う場合があり、ここは階級ではないことを示すために程伝は「善人」と言ったのだ、と答えた。ここでは大人は君子より一段上で、革命者は大人である。</p>\n<p><span class=\"tag\">程伝</span>革の終わりは革の道の完成である。君子とは善人のことで、善良なら革命に従って変わる。その変化が著しく見えることは、豹の文様が彬蔚（内にこもりつつ明らか）なようである。小人は昏愚で移り難い者で、心から化することはできないが、その面を改めて上の教令に従う。龍虎は大人の象なので大人には虎、君子には豹と言う。人の性はもと善で、みな変化できるが、下愚は聖人でも移せない。堯舜が君となり、舜が堯を継いで百有余年（『史記』によれば堯の在位は九十八年、その後二十年は舜が摂政）、天下の感化は深く長かったが、なお三苗（部族）の反乱や、舜を殺そうとした弟の象がいた。三苗が来服し象が改心したのも、おそらく面を改めたにすぎない。小人がその外を改めたことで革の道は成ったとすべきで、さらに深く追及すればやりすぎで、甚だしいのは道に外れる。だから革の終わりになお進めば凶で、ただ正固で自らを守るべきである。改めて極に至り、正で守らなければ、改めたものがまた変わるかもしれない。天下の事は、初めは改め難いことを憂え、改めた後は守れないことを憂える。だから革の終わりに「貞に居れば吉」と戒める。ある人が「上六のための戒めではないか」と問う。答え：革の終わりのために言うのである（上六への戒めでもありうる）。また「人の性は本善なのに、改められない下愚があるのはなぜか」と問う。答え：性を語ればみな善であるが、才を語れば下愚の移らない者がある。下愚には自暴と自棄の二つがある。人がもし善をもって自らを治めれば移らない者はなく、昏愚の至りでもみな次第に磨いて進める。ただ自暴する者は拒んで信じず、自棄する者は絶って為さず、聖人がともにいても化して入れることができない。これが孔子の言う下愚である（『論語』陽貨篇「唯だ上智と下愚とは移らず」）。しかし天下の自暴自棄する者が必ずしもみな昏愚ではない。往々強情で道にもとりながら才力が人に過ぎる者がいる。殷の紂王（商の辛。辛は生まれた日の十干）がそれである。聖人は自ら善を絶つので下愚と言うが、その最期を考えれば実に愚かであった。「下愚なのになぜ面を改められるのか」と問う。答え：心は善道を絶っていても、上の威光を畏れて罪を少なくしようとする点は普通の人と同じである。普通の人と同じところがあるから、その性の罪ではないことがわかる。</p>\n<p><span class=\"tag\">象伝について程伝</span>君子は化に従って善に遷り、文様をなすことは内にこもりながら外に現れる。中人以上はみな変革できる。移らない小人でも、あえて悪をほしいままにせず、外を改めて君上の教令に従う。これが面を改めることで、ここに至って革の道は成る。小人が勉めて善を仮る（善人のふりをする）のは君子が容認するところである。さらに進んで心から改めよと責めれば凶である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>改革は完成した。善人は進んで変わり、小人は表面だけでも従えばよしとせよ。それ以上追及すれば凶、正しさを守って現状を保てば吉。</div></div></details><div class=\"pager\"><a href=\"#gua-48\">← 水風井</a><a href=\"#gua-50\">火風鼎 →</a></div>", "gua-50": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 50 卦　第六十講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">火風鼎</div><div class=\"yo\">かふうてい</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-50\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-50\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-50\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-50\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-50\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-50\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-50\" data-jump=\"yao\">六爻</a></div><h3 id=\"g50-s0\">卦の名と象</h3>\n<p>鼎（かなえ）は物を煮炊きする三本足の器である。下卦の巽は風の意味だが、木の意味もある。上卦は火。</p>\n<p>程伝（序卦伝を引く）：「物を革むる者は鼎に若くは莫し。故に之を受くるに鼎を以てす」。鼎の用は物を変革することで、生物を煮えた物にし、堅い物を柔らかくする。水と火は一緒にいられないものだが、鼎はこれを合わせて一つの働きをさせ、互いに害さないようにする。これがよく物を革めることで、だから鼎が革に次ぐ。</p>\n<ul class=\"sen\"><li>鼎と名付ける理由は、その象を取り、その義を取る。象を取る見方は二つある。卦全体で言えば、下の初六（陰）が直立する足、真ん中の三つの陽の詰まったものが胴（物を受けて中にある象）、その上に向かい合ってそびえる六五が耳（耳は本当は三つだが前から見れば二つ）、一番上に横に亘る上九が鼎を下げる鉉（つる）である。上下二体で言えば、中が虚のもの（離）が上にあり、下に足があってこれを受けている（説卦伝に巽は股とある）。これも鼎の象である。</li><li>義を取れば、木（巽）が火に従う。巽は入る、従うの意味で、木が火に従い入るのは燃える形である。火の用は焼くと煮るだけで、焼くには器が要らないので、煮るという象を取って鼎とする。木が火に入り続ける（薪を次々燃やす）のは煮炊きの象である。</li><li>ある人が問う、「聖人が器を作るのは卦の象に取ったはずだが（繋辞伝に、離の卦から網、渙の卦から舟、小過の卦から杵臼を作ったとある）、ここは逆に鼎という器にかたどって卦を作ったのか」。答え：器を作るには象に取る。象は卦に示されているが、卦が必ず器より先とは限らない。聖人が器を作るのに卦を見てから象を知るのではない。凡人が象を理解できないので卦を設けて示したのである。卦と器の先後は義を害さない。さらに「鼎は自然の象ではなく人為ではないか」と問う。答え：
