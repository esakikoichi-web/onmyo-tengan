<script>
var V={"home": "<div class=\"hero\"><div class=\"hk\">斯文会・読易会　程伊川『易伝』講義</div><div class=\"hn\">易 經 講 座</div><div class=\"hs\">本田濟 講述　上（一）　乾為天 〜 天地否</div></div><h2 class=\"sec\">易経講座とは</h2><p>『易經講座』は、易学の大家・本田濟（わたる）が、平成四年五月から同十年六月まで満六年余り、政財界人の有志の集まり「読易会」で、北宋の程頤（伊川）の『伊川易伝』（『程氏易伝』）を講じた全講義の記録である。本田は夏休みを除いて月に一度上京し、一回に二卦ずつ、六十七回にわたって講義した。速記録に本田自身が目を通し、朱を入れて完成させた。上・下二巻を、それぞれ二分冊して全四冊とする。この講話は、その上巻の第一分冊（一）を、卦ごと・爻ごとに整理したものである。</p>\n<p>『伊川易伝』は、易を占いの書としてよりも、人がいかに身を処し、君臣・上下がいかに交わるべきかを説く「義理の書」として読んだ、宋学の易注の最高峰である。本田の講義はその程伝を一句ずつ読みながら、朱子の『本義』や漢代以来の諸説、中国史の故事、日本の政治・経済の話題を交えて、易の言葉を現代の処世に引き寄せて説いている。</p><h2 class=\"sec\">序文（要旨）</h2><p>読易会の前身「読老会」は、本田の『老子』講義（『齋注老子講義録』上下）を世に出した。続いて『易経』の講義が完結し、老子と易経という古代中国最高の叡知の原典注釈が出そろった。</p>\n<p>読易会代表の中原伸之（元日本銀行政策委員会審議委員）は、東大経済学部の学生時代に宇野精一教授の十三経注疏・易経の演習に参加し、公田連太郎『易経講話』を読み、斯文会で赤塚忠教授の易経を聴いたが、いずれも部分的であった。読易会では六十七回の講義に皆勤した。中原自身、人生の分岐点で「師」の卦の六四の爻辞「師左次（いくさ、左き次る）。咎无し」によって慎重な決断を下すことができたという。</p>\n<p>易はもとは陰陽の二本の線にすぎない。ライプニッツが見抜いたように二進法である。三本を組み合わせれば二の三乗で八卦、八卦を上下に重ねれば二の六乗で六十四卦、爻の総数は三百八十四。文王が卦辞を、周公が爻辞を懸け、孔子が十翼を述べたと伝えられる。こうして易は、個人の運命を予知して禍を避ける処世の智であると同時に、天地の化育すべてを取り込む聖典となった。</p><h2 class=\"sec\">この講話の読み方</h2><div class=\"toc\"><a href=\"#soron\"><b>総論</b><span>易とは何か・筮法・程伊川と『易伝』序・易図（第一〜四講）</span></a><a href=\"#gua\"><b>十二卦</b><span>乾為天から天地否まで。卦辞・彖伝・大象・程伝・六爻（第五〜二十四講）</span></a><a href=\"#rei\"><b>講座の実例</b><span>講義の席で受講者が実際に筮を立てた例と故事</span></a><a href=\"#find\"><b>検索</b><span>言葉で全文を探す</span></a></div>", "soron": "<h2 class=\"sec\">総論</h2><div class=\"toc\"><a href=\"#soron-1\"><b>総論一</b><span>易とは何か（第一講）</span></a><a href=\"#soron-2\"><b>総論二</b><span>筮法（第二講）</span></a><a href=\"#soron-3\"><b>総論三</b><span>程伊川と『易伝』序（第三講）</span></a><a href=\"#soron-4\"><b>総論四</b><span>易図の説明（第三・四講）</span></a></div>", "soron-1": "<a class=\"back\" href=\"#soron\">← 総論の目次</a><h2 class=\"sec\">総論一　易とは何か（第一講）</h2><h3>五経の首</h3>\n<p>儒教の経典である五経は『易経』『書経』『詩経』『礼経』（礼記・周礼・儀礼）、それに孔子の『春秋』である。『易経』は五経の筆頭に数えられることが多い。ただし易は孔子より前から、筮竹による占いのテキストとして存在していた。</p>\n<h3>易の字義</h3>\n<p>古い字形では「易」は蜥蜴（トカゲ）であり、後漢の『説文解字』もトカゲとする。明の楊慎（升庵）は、南方の色の変わるトカゲ（カメレオン）にちなみ、陰が陽に、陽が陰に「変わる」という易の原理を書名にしたと説いた。これがほぼ定説である。</p>\n<p>後漢の鄭玄は、易の一字に三つの意味があるとした。</p>\n<ul class=\"sen\"><li><b>変易</b>：宇宙の現象、陰陽の気の流れは刻々に変わる。</li><li><b>不易</b>：変わるもののなかに変わらない法則性がある。</li><li><b>簡易</b>：その法則がつかめれば、未来もたやすく知ることができる。千年先の夏至・春分の日も割り出せるように。</li></ul>\n<h3>亀卜から筮へ</h3>\n<p>筮竹の占いより前に、亀の甲羅を焼いて、そのひび割れの形で占う亀卜があった。「卜」はひび割れの象形である。殷の時代は神託によって政治を行い、占う者（巫）が宰相を兼ねた（巫咸・巫賢）。</p>\n<p>西周の時代になると、亀卜より筮竹の占いが盛んになる。春秋時代には諸国を渡り歩いて卦を立てる職業の者が現れた。筮が亀卜に取って代わったのは、数理による占いが古代人には科学的で正確に感じられたことと、何より善し悪しを明記したテキストがあって信用がおけたからである。『春秋左氏伝』に出てくる占いの文句は、ほとんど今の『易経』と同じである。孔子より前に、易が占いの書として成立していたことは確かである。</p>\n<h3>陰と陽</h3>\n<p>陽の棒（⚊）と陰の棒（⚋）を六本重ねたものが卦である。卦の正しい音は「カ」で、俗に「ケ」と読む。陽の棒を陽爻、陰の棒を陰爻という。</p>\n<p>「陰」の偏「阝」は丘、旁の上「今」は音を示し、下の「云」は雲の本字である。丘の曇った側、日陰を意味する。「陽」の旁は地平線の上に昇った太陽と、その下にはためく幟の形で、日向を意味する。山の北を陰、南を陽といい、山陰・山陽の語はこの原義のままである。</p>\n<p>この素朴な日陰・日向の意味が、『左伝』では天の六気（陰・陽・風・雨・晦・明）の二つとなり、『荘子』では天地に満ちる「気の大なる者」、さらには万物を消極と積極に二分する範疇となった。易は、万物がこの陰陽の二元で構成されるという建前に立っている。</p>\n<h3>八卦</h3>\n<p>陰陽を三本ずつ重ねたものが八卦である。</p>\n<div class=\"tw\"><table class=\"tri\"><tr><th>八卦</th><th>自然</th><th>家族</th><th>性質</th><th>動物</th><th>身体</th><th>方位（文王八卦）</th></tr><tr><td>乾 ☰</td><td>天</td><td>父</td><td>健</td><td>馬</td><td>首</td><td>西北</td></tr><tr><td>坤 ☷</td><td>地</td><td>母</td><td>順</td><td>牛</td><td>腹</td><td>西南</td></tr><tr><td>震 ☳</td><td>雷</td><td>長男</td><td>動</td><td>竜</td><td>足</td><td>東</td></tr><tr><td>巽 ☴</td><td>風</td><td>長女</td><td>入</td><td>鶏</td><td>股</td><td>東南</td></tr><tr><td>坎 ☵</td><td>水</td><td>中男</td><td>陥</td><td>豕</td><td>耳</td><td>北</td></tr><tr><td>離 ☲</td><td>火</td><td>中女</td><td>麗（つく）</td><td>雉</td><td>目</td><td>南</td></tr><tr><td>艮 ☶</td><td>山</td><td>少男</td><td>止</td><td>狗</td><td>手</td><td>東北</td></tr><tr><td>兌 ☱</td><td>沢</td><td>少女</td><td>説（よろこぶ）</td><td>羊</td><td>口</td><td>西</td></tr></table></div>\n<p>家族への当てはめはよく説明がつく。乾（父）と坤（母）が交わり、坤の一番下に父の陽気が入って震（長男）、二回目で坎（中男）、三回目で艮（少男）。逆に乾に母の陰気が入って巽（長女）・離（中女）・兌（少女）となる。なぜ震が雷か、巽が風かについては注釈者が苦心しているが、完全には説明がつかない。動物の当てはめも、『易経』のなかでは同じ馬が震や坎に出てくるなど、多少手当たりしだいである。</p>\n<p>方位の「乾（いぬい）」「巽（たつみ）」などの訓はこの文王八卦の方位から来ており、今も使われている。中国の古い図は北を下に、南を上に描く。</p>\n<h3>六十四卦</h3>\n<p>人事の複雑で微妙なところは八卦だけでは表現できないため、八卦を上下に重ねて六十四卦とした。同じ卦を重ねたものは名前が変わらない（乾の上に乾で乾）。</p>\n<ul class=\"sen\"><li><b>夬</b>：下五本が陽で上一本だけが陰。陽気が下から上がってきて、最後の陰を押し切る「決断」の卦。</li><li><b>睽</b>：下が兌（三女）、上が離（次女）。一軒に若い姉妹がいつまでも同居すると必ずけんかになる。目を背けあう卦。</li><li><b>泰</b>：上が地、下が天で天地がひっくり返っているが、「天地交わるは泰」。君主が臣下にへりくだり、上下の意志が通じる。天下泰平の良い卦。</li><li><b>否</b>：上が天、下が地でまっとうに見えるが非常に悪い卦。否は「しからず」ではなく「ふさがる」（音は pi）。君主が上でふんぞり返り、民が下にうずくまって、上下の意志が通じない。</li><li><b>革</b>：下が離、上が兌。「湯武の革命は天に順い人に応ず」。易は武力革命を、天意に従い民意に応ずるものとして是認する立場に立つ。</li></ul>\n<h3>卦辞と爻辞</h3>\n<p>各卦には、卦全体の吉凶を示す「卦辞」がつく。乾なら「乾、元亨利貞」（乾は元いに亨る。貞しきに利ろし）の五字である。これは大まかな運勢を示す。さらに、自分が今この瞬間に卦のなかのどこにいるかという、より細かくデリケートな立場を示すために、六本の爻それぞれに「爻辞」がつく。卦辞がたいへんめでたくても、そのなかには良い爻辞も悪い爻辞もある。</p>\n<h3>六十四卦の概略</h3>\n<p>本田は、六十四卦を陰陽が正反対の卦（錯卦）と対にして概説している。</p>\n<ul class=\"sen\"><li><b>乾</b> 天の道・君主の道。／<b>坤</b> 大地・臣下の道。</li><li><b>履</b> 足でふむ、行う。倫理的な行為。／<b>謙</b> 謙遜。</li><li><b>同人</b> 人を集める、他人との協調。／<b>師</b> 軍隊・戦争。</li><li><b>无妄</b> いつわりのない道理。妄は「望」と同音で、望外の幸運の意味もある。／<b>升</b> のぼる。地中に木が生じて育つ。</li><li><b>姤</b> 邂逅、めぐりあい。一人の女が五人の男に会う卦で、あまり良くない。本田が酒場でこの卦を出し、女性に「五人の男がおるだろう」と言ったら真っ青になったという。／<b>復</b> 冬至の日、大地の底に陽気が一本だけ戻る一陽来復。</li><li><b>訟</b> 天は上へ、水は下へ離れて仲が悪い。争い・訴え。この卦が出たら訴訟沙汰。／<b>明夷</b> 大地の下に太陽。傷ついた太陽（夷は痍と同じ）。</li><li><b>遯</b> のがれる、隠遁。／<b>臨</b> 上から下をのぞむ。</li><li><b>否</b> ふさがる。／<b>泰</b> 通じる、天下泰平。</li><li><b>夬</b> 押し切る、決断。／<b>剥</b> 夏至の後、下から陽気がはぎとられ、上に一画だけ残る。たいへん悪い卦。</li><li><b>兌</b> よろこぶ（古くは「説」）。／<b>艮</b> とどまる。運勢は開けないが、宋学者は「最もよいところにふみとどまる」深い倫理的意味を見て尊重した。</li><li><b>革</b> 沢の底に火が燃える不安な形。社会がひっくり返る。／<b>蒙</b> おろか。蒙をひらく、子供の教育を説く。</li><li><b>随</b> 時勢・運勢に従う徳。／<b>蠱</b> 皿の上に虫。腐敗、そしてその後に事業を立て直す。易では「こと」と訓ずる。</li><li><b>大過</b> 真ん中四本が陽。大いに過ぎる、行き過ぎ。／<b>頤</b> 口を大きくあけて歯が並ぶ形。養う。</li><li><b>困</b> 沢の底が抜けて水が漏る。苦しむ。／<b>賁</b> かざり、装飾。</li><li><b>咸</b> 少男が少女の下にへりくだる。感応、夫婦の道。「心」を省いたのは無心に感ずる意という。／<b>損</b> 泰の下の陽を上に移した形。民の所得を減らして上を増やす。</li><li><b>萃</b> あつまる。地の上に沢。／<b>大畜</b> 大きな停止、大きな蓄え。</li><li><b>大有</b> 天上に太陽が輝く。大きな所有、めでたい卦。／<b>比</b> 五爻ただ一つの陽に、すべての陰が親しむ。</li><li><b>睽</b> そむきあう。／<b>蹇</b> 足がなえる。落とし穴の前で足ぶみする。陸奥宗光の『蹇蹇録』の蹇。</li><li><b>離</b> 古くは「くっつく、付着する」（屈原『離騒』は「憂いに罹る」）。重ねて昇る太陽。／<b>坎</b> 上も下も落とし穴。難儀が二つ重なる悪い卦。</li><li><b>噬嗑</b> 口のなかの異物をかみ切る。刑罰の卦。／<b>井</b> 木のつるべが水に入る井戸。万物・賢人を養う。</li><li><b>鼎</b> 卦の形が鼎に似る。賢人を養う。／<b>屯</b> 「チュン」と読んで、芽生え・満ちる・困難。芽が大地をつきぬけた形。</li><li><b>未済</b> 一・三・五の陽の位に陰、二・四・六の陰の位に陽がいる最も不安定な形。未完成。／<b>既済</b> すべて正しい位にある最も完全な形。易が既済で終わらず未済で終わるのは、完全な形で終わると次への展開がないからである。</li><li><b>旅</b> 山を焼く火は一か所に止まらない。漂泊・放浪の、あまり良くない卦。／<b>節</b> 沢の上に水があふれる。節約。</li><li><b>晋</b> 地の上に太陽。すすむ（高杉晋作の晋）。／<b>需</b> 天の上の雲。待つ、求める。</li><li><b>大壮</b> 陽気が半分を越して大いに盛ん。／<b>観</b> 地上に吹きわたる風。みる、しめす。観の卦の「国の光を観る」が「観光」の語源。</li><li><b>帰妹</b> 長男と少女の結婚。「妹を帰がしむ」。／<b>漸</b> 山の上に木が成長する。すすむ。</li><li><b>豊</b> 雷に稲妻がともなう盛大な時。／<b>渙</b> 凍った水の上に春風が吹いて氷が解ける。散る、離散。</li><li><b>震</b> 雷と地震。／<b>巽</b> 入る、へりくだる。</li><li><b>恒</b> 雷と風が助けあう恒常性。／<b>益</b> 否の上の陽を一本下へ移した形。上を減らして下を増やす。</li><li><b>解</b> 凍った水に春の雷が鳴り、氷が解ける。あらゆる解決。／<b>家人</b> 家族・家庭道徳。二爻の陰が妻、五爻の陽が夫。</li><li><b>小過</b> 小さなことにおける行き過ぎ。／<b>中孚</b> うちなる誠。真ん中二本だけが陰。</li><li><b>豫</b> 大地の上に雷がはじめてとどろく、春が来た時。よろこぶ。／<b>小畜</b> 四爻だけが陰。小さな蓄え、少し止まる。</li></ul>\n<p>繋辞伝に、易は天地の働きに準じ、その知恵は万物に行き渡り、その道は天下を救いうる、だから易によって天の法則・人の運命を知れば「天を楽しみ命を知る（楽天知命）」ことができる、とある。</p><div class=\"pager\"><a class=\"dis\">-</a><a href=\"#soron-2\">総論二 →</a></div>", "soron-2": "<a class=\"back\" href=\"#soron\">← 総論の目次</a><h2 class=\"sec\">総論二　筮法（第二講）</h2><h3>筮竹の数の意味</h3>\n<p>筮竹は五十本。これは十干・十二支・二十八宿の合計である。そこから一本を抜き出して最後まで使わない。これは天地以前の太極にかたどる（韓康伯の注に「太極とは天地以前の無をいう」）。残りを二つに割るのは天と地が分かれたことにかたどり、右から一本を取って左手の小指にかけるのは人にかたどる。一つひとつの操作に形而上学的な意味がある。</p>\n<h3>筮に先立つ祈り</h3>\n<p>静かな部屋で香を焚き、筮竹を操作する前に、朱子が伝える次の文句を唱える。</p>\n<p>「爾（なんじ）の泰筮の常有るに仮る。某官姓名、今、某事云々を以て、未だ可否を知らず。爰に疑う所を神霊に質す。吉凶得失、悔吝憂虞、惟れ爾、神有らば、尚（こいねが）わくは明らかに之を告げよ。」</p>\n<p>爾は筮竹に向かっていう。悔・吝は凶とまではいかない悪い判断、憂虞は憂いとおそれである。</p>\n<h3>本筮法（十八変）</h3>\n<ol class=\"num\"><li>五十本から一本を抜き取る（太極。終始使わない）。</li><li>四十九本を扇形にひらき、無念無想で二つに割る（天と地）。</li><li>右手の分を机に置き、そこから一本取って左手の小指と薬指の間にはさむ（人）。</li><li>左手の分を四本ずつ数え、残り（四・三・二・一。割り切れたら四）を薬指と中指の間にはさむ。</li><li>机上の分を左手に取って同様に四本ずつ数え、残りを中指と人さし指の間にはさむ。三か所の合計は必ず五か九。これが第一変。</li><li>残りの四十四本か四十本で同じ操作をくり返す。合計は四か八。これが第二変。</li><li>さらに残りで同じ操作をくり返す。合計は四か八。これが第三変。</li></ol>\n<p>三変で一本の爻が得られる。</p>\n<div class=\"tw\"><table class=\"tri\"><tr><th>三変の結果</th><th>名</th><th>記号</th><th>数</th></tr><tr><td>二多一少（9・4・8／9・8・4／5・8・8）</td><td>少陽（陽の不変）</td><td>⚊</td><td>七</td></tr><tr><td>二少一多（5・4・8／5・8・4／9・4・4）</td><td>少陰（陰の不変）</td><td>⚋</td><td>八</td></tr><tr><td>三少（5・4・4）</td><td>老陽（陽で、陰に変ずる）</td><td>□</td><td>九</td></tr><tr><td>三多（9・8・8）</td><td>老陰（陰で、陽に変ずる）</td><td>×</td><td>六</td></tr></table></div>\n<p>三つとも少ないのに老陽、三つとも多いのに老陰と、逆転するのが面白いところである。六爻をそろえるには十八回の操作が要る。爻は下から上へ積み上げ、算木を使うと便利である。</p>\n<h3>変爻の読み方（朱子の説）</h3>\n<ol class=\"num\"><li>六爻とも変じない時は、本卦の卦辞で占う。</li><li>一爻が変ずる時は、本卦のその変爻の爻辞で占う。</li><li>二爻が変ずる時は、本卦の二つの変爻の辞で占い、上の爻を主とする。</li><li>三爻が変ずる時は、本卦と之卦（変爻を変えた後の卦）の卦辞で占う。</li><li>四爻が変ずる時は、之卦の二つの不変爻で占い、下の爻を主とする。</li><li>五爻が変ずる時は、之卦の不変爻で占う。</li><li>六爻とも変ずる時は、乾坤は用九・用六の辞による。他の六十二卦は之卦の卦辞で占う。</li></ol>\n<p>例として、旅の卦で初六と六五が変じたとする。初六「旅瑣瑣（さ）たり。斯れ其の災いを取る所なり」（旅先でけちけちすれば災いにあう）と、六五「雉を射て一矢亡う。終に以て誉命あり」（多少の損はあるが最後には名誉と爵位を得る）が矛盾する。朱子に従い上の六五を主とする。旅は羈旅（さすらい）の意味であまり良い卦ではないが、その中でたいへんめでたい立場に置かれている、と読む。</p>\n<h3>略筮法（新井白蛾『易学小筌』）</h3>\n<p>今の大道易者はみなこの略法である。変爻が必ず一つで、三回の操作で済む。</p>\n<ol class=\"num\"><li>五十本から一本を抜いて太極とし、四十九本を二つに分け、右手の分から一本を左手の小指にはさむ。</li><li>左手の分を八本ずつ数え、小指の一本を加えた残数で下卦を得る。1乾・2兌・3離・4震・5巽・6坎・7艮・8坤（割り切れたら8）。</li><li>同じ操作をくり返して上卦を得る。</li><li>もう一度同じ操作をし、今度は六本ずつ数えて、残数で変爻の位置（1初爻〜6上爻）を得る。</li></ol>\n<p>例えば一回目に1（乾）、二回目に5（巽）なら小畜。三回目に2なら小畜の九二の爻辞を見る。</p>\n<p>ほかに、三枚の硬貨を投げる擲銭法もある。</p>\n<h3>爻の位の傾向</h3>\n<ul class=\"sen\"><li>上爻は概してあまり良い判断ではない。昇りすぎて、もう上がれず落ちるだけだからである。</li><li>五爻が易では最も良い。上卦の真ん中で中庸を得ているからである。</li><li>四爻はやや危険であることが多い。</li></ul>\n<p>もちろん総体的な傾向で、例外はある。</p>\n<h3>西洋人と易 ― ユングの共時性</h3>\n<p>ヘルムート・ヴィルヘルム（易をドイツ語に訳したリヒャルト・ヴィルヘルムの息子）は『易経についての八つの講義』（一九五八年）で、人間の行動は因果律だけで導かれるのではなく、心理の深層に基づいており、人は天地の運命的な秩序に適合した時にのみ、いかに行動すべきかの示唆を得ると述べた。古代中国人は、その秩序に身をゆだねることで自由を失うとも、自尊心を傷つけられるとも考えなかった。</p>\n<p>リヒャルト・ヴィルヘルムの独訳を読んだユングは、精神病の患者に筮竹を教えて卦を立てさせた。すると坎を二つ重ねた坎為水（袋小路に入る非常に悪い卦）が実によく出た。ユングはここから「共時性」の考えを立てた。因果律とは正反対に、時間的にも場所的にも懸け離れた事柄が、自分の心のなかの出来事とぴたりと並行する。易の文句にある二千年前の出来事が自分の運命と一つになるのはそのためだという。六十四卦は、民族の集合的無意識の知恵のパターン（原型）である。</p>\n<p>ただし共時性が成り立つには、二つの事象を内側から一つとして把握し、意味を与える主体が欠かせない。易の文句は無限の解釈を許す象徴であり、そのなかから自分にとって意味のあるものを読み取る、創造的な行為がなければならない。</p>\n<h3>講義での占いの実例</h3>\n<p>講座の席で受講者が実際に筮を立て、本田が判じた。</p>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>泰の上六</div><div class=\"rb\">卦辞「泰は、小往き大来る。吉にして亨る」。悪人が退き善人の勢力が伸びる、申し分のない卦である。しかし上六「城、隍（ほり）に復る。師を用うる勿れ。邑より命を告ぐ。貞なれども吝」。堀の土を積み上げた城もいつかは崩れて堀に戻る。泰が極まってふさがる方向へ向かう時である。武力で一気に挽回しようとしてはならず、それは滅亡を早めるだけである。君主が何も命令しないので、見かねた国元から逆に指図される。しかたがないが、多少はずかしい。全体は天下泰平でも、自分の立場は昇り詰めて城が崩れるおそれがある。武断であってはならない、と判じた。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>賁の上九</div><div class=\"rb\">卦辞「賁は亨る。小しく往く攸有るに利あり」。願いは通るが、大きなことに乗り出してはならない。上九「白く賁る。咎无し」。飾りが行き過ぎて素朴な白に帰る。虚しい飾りを去って本来の自分に返れ、という教訓である。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>家人の上九</div><div class=\"rb\">卦辞「家人は、女の貞に利あり」。主婦たる者が正しい道を守るよう務めよ。男性が占った場合は、補佐役がしっかりしなければならない、と読む。上九「孚有りて威如たり。終に吉」。家を正す永久の道は、誠と威厳である。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>大過の九五</div><div class=\"rb\">卦辞「大過は、棟撓（たわ）む。往く攸有るに利あり。亨る」。陽気が過度で棟がたわむ。押し切る力があれば積極的に動いてよいが、危険をはらむ。九五「枯楊、華を生ず。老婦其の士夫を得たり。咎も无く誉れも无し」。卦全体はあまり良くないが、本人の立場は悪くも良くもない。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>益の六四</div><div class=\"rb\">卦辞「益は、往く攸有るに利あり。大川を渉るに利あり」。富が増し、積極的に動いても冒険してもよい。六四「中行あれば、公に告げて従わる。用て依ることを為し国を遷すに利あり」。中庸の行いがあれば上の人に聞き入れられる。隣国に頼る、国を移す、そうしたことに良い。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>豫の九四</div><div class=\"rb\">卦辞「豫は、侯を建て師を行るに利あり」。雷がはじめて地上に響きわたる時で、君主を立て軍を動かす積極的な行為に良い。九四「由豫す。大いに得る有り。疑う勿れ。朋盍（あ）い簪（あつま）る」。人々がこの人によって喜びを得る。ただ柔弱な君の側近として天下の事を一人で引き受けると疑われる危険がある。疑われるのは自分が人を疑い、援助を求めないからで、誠を尽くして人を疑わなければ、同志が一斉に馳せ参じる。占いの判断というより戒めの強い文句だが、判断として概して良い。万事、志が大いに行われる。</div></div>\n<h3>講義での占いの実例（続き・第三講冒頭）</h3>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>渙の六三</div><div class=\"rb\">略筮で下卦に六本残って坎、上卦に五本残って巽、風水渙を得た。卦辞「渙は亨る。王、有廟に仮る。大川を渉るに利あり。貞しきに利あり」。願いは通り、廟の祭りに良く、冒険してよい。正道を持続すれば利がある。三回目に三本残って六三「其の躬を渙す。悔い无し」。利己心（躬）を散じて天下のために働けば悔いはない。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>中孚の九五</div><div class=\"rb\">卦辞「中孚は、豚魚にして吉なり。大川を渉るに利あり。貞しきに利あり」。心中に誠があれば、豚や魚のような粗末な供え物でも吉を得る。正道を守るなら冒険してよい。九五「孚有ること攣如たり。咎无し」。心中に誠があって、下位の補佐者と手をつなぎあえば咎を免れる。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>兌の初九</div><div class=\"rb\">第五講の冒頭、初めて出席した受講者が略筮を立てた。一回目・二回目ともに二本残って兌為沢。卦辞「兌は亨る。貞しきに利あり」。乾の四徳のうち「元」だけが欠けているが、願いは通る。三回目に一本残って初九「和して兌ぶ。吉なり」。最下位に甘んじ、正しい道で人を喜ばせるので、進んでも疑われない（象伝「行いて未だ疑われざればなり」）。上下同じ卦が出るのは確率の上では珍しい。</div></div>\n<p>本田は、六爻の判断の言葉について、「吉」は文字通り吉、「咎无し」は吉までは行かないが、反省して身を慎めば大した被害はない、過ちを補うニュアンスの言葉だと説明している。また、六三の「六」は陰爻、「三」は下から三番目を示す（陽爻は「九」）。</p><div class=\"pager\"><a href=\"#soron-1\">← 総論一</a><a href=\"#soron-3\">総論三 →</a></div>", "soron-3": "<a class=\"back\" href=\"#soron\">← 総論の目次</a><h2 class=\"sec\">総論三　程伊川と『易伝』序（第三講）</h2><h3>程頤（伊川）</h3>\n<p>程頤、字は正叔、河南の人。伊川は住んだ土地の名で、伊川先生と呼ばれる（一〇三三〜一一〇七）。学者・官僚の家柄で、五十四歳で幼帝哲宗の講官（天子の家庭教師）となったが、朝廷の党派争いに巻き込まれて四川に左遷され、その後は早く官を退いて弟子の養成と著述に一生を送った。兄の程顥（明道先生）と並んで、いわゆる道学の基礎を築いた。</p>\n<p>漢から唐までの儒学は訓詁学で、古典の一字一字の解釈を師伝の家宝として伝えるだけだった。そのため人々の関心は老荘や仏教に向かい、唐の韓退之はこれを憂えた。宋の儒者は訓詁にとらわれず、孔子の考えた哲学・形而上学に一気に肉薄しようとした。道学は初めて一定の哲学体系を成した儒教理論である。その拠り所となったのが、形而上学的な議論にあふれる『易経』であった。「伝」は経書の注釈の意味（『春秋左氏伝』の伝と同じ）である。</p>\n<h3>『易伝』序（要旨）</h3>\n<p>序文はほとんどすべてが繋辞伝の言葉を要領よく節録したもので、文章を練りに練った難しい理屈が書かれている。</p>\n<ul class=\"sen\"><li><b>易は変易なり。時に随いて変易し、以て道に従うなり。</b> 易の卦は陰が陽に、陽が陰に時に応じて変わるが、それは天と人の世界の法則に従って変わるのである。易はきわめて広大で、あらゆる物事が説かれている。人の性（生まれつき）と天の命に順い、幽明（陰の世界と陽の世界）に通じ、事物の実情を尽くし、「物を開き務めを成す」（人の知恵を開き、さまざまな事業を成す）道を示そうとした。後世の人が迷った時の指針として、先回りして心配してくれた聖人の気持ちは、至って懇切である。</li><li><b>前儒は意を失して言を伝え、後学は言を誦して味を忘る。</b> 秦の始皇帝は易を占いの書として焼かなかったが、それ以後、易の真意はほとんど伝わらなかった。程頤は千年の後に生まれ、「斯文」（『論語』で孔子が「天の未だ斯文を喪ぼさざるや」と言った、この偉大な文化）が埋もれたことを悼み、後の人に流れを遡って源を求めさせようとして、この注を作った。</li><li><b>易に聖人の道四つ有り。</b> 易によって論ずる者はその辞を、行動する者はその変を、器物を作る者はその象を、占う者はその占を尊ぶ（船や車などの利器は、昔の聖王が卦に倣って作ったと繋辞伝にある）。吉凶消長の理、進退存亡の道は、すべて易の辞に備わる。辞を推し、卦を考えれば変化を知ることができる。</li><li><b>居れば其の象を観て其の辞を玩び、動けば其の変を観て其の占を玩ぶ。</b> 平素は卦の形を見て文句を味わい、行動を起こす時は卦の変化を見て占断を味わう。辞を理解して真意に達しない者はあるが、辞を理解せずに真意に達した者は未だかつてない。</li><li><b>至微なる者は理なり、至著なる者は象なり。体用一源、顕微無間。</b> 最も微妙なものは理、最もはっきりしたものは象である。本体（理）と作用（現象）は源が一つで、目に見える現象とその奥の原理には時間的な隙間もない。この二句は伊川が最も好んだもので、仏典から取った文句である。程伊川の哲学の根幹には、あらゆるものを貫く理（ロゴス）の一元論がある。錯綜する物事のなかに一筋の道を見出し、その定法（易の占断）に従って行動すれば、すべてが備わる。</li><li><b>善く学ぶ者は、言を求むるに必ず近きよりす。</b> 易の文句は難しく見えるが、身近な事をたとえに取っている。身近なものを侮る者は言葉を理解できない。「予の伝うる所の者は辞なり。辞に由りて以て意を得るは、則ち人に在り」。注釈ができるのは言葉までで、そこから聖人の真意を探るのは読者自身の努力による。</li></ul>\n<p>序文の日付は元符二年（一〇九九）正月、伊川六十六歳である。</p><div class=\"pager\"><a href=\"#soron-2\">← 総論二</a><a href=\"#soron-4\">総論四 →</a></div>", "soron-4": "<a class=\"back\" href=\"#soron\">← 総論の目次</a><h2 class=\"sec\">総論四　易図の説明（第三・四講）</h2><p>程伊川の『易伝』にはもともと図はついていなかった。『二程全書』所収の『易伝』に図はなく、伊川はこうした図をあまり信用しなかったらしい。伊川より百年後の朱子は、伊川を最も尊敬し学説も忠実に受け継いだが、神秘数学風の図を大変好み、朱子の『易本義』には図がすべてついている。後に『易伝』と『本義』を合本にしたテキストが流布し、清朝の本の多くはこの合本なので、図が入っている。宋代の人がいかに神秘的な数学に憧れたかがわかって面白い。</p>\n<h3>河図・洛書</h3>\n<p>繋辞伝に「河は図を出し、洛は書を出す。聖人之に則る」とある。黄河から浮かび上がった馬の背に「河図」が、洛水から浮かび上がった亀の甲羅に「洛書」が書かれていた。聖人はこれを手本に易を作った。</p>\n<ul class=\"sen\"><li><b>河図</b>：繋辞伝の「天一地二、天三地四、天五地六、天七地八、天九地十。天数五、地数五。五位相得て各合する有り。天数二十有五、地数三十。凡そ天地の数五十有五。此れ変化を成して鬼神を行る所以なり」を図にしたもの。北（下）に一と六（五行の水）、東に三と八（木）、南に二と七（火）、西に四と九（金）、中央に五と十（土）。向き合う天数・地数の和が等しい（北南は天一＋天七＝八、地六＋地二＝八。東西は天三＋天九＝十二、地八＋地四＝十二）。</li><li><b>洛書</b>：亀の象。九を戴き一を履み、三を左に七を右に、二と四を肩、六と八を足とする。四角く並べると、縦横斜めのどこを足しても十五になる魔法陣である。</li></ul>\n<p>蔡元定によれば、河図・洛書の図は漢の孔安国・劉歆にさかのぼる。宋の劉牧は両者の名を入れ替えたが誤りで、元に戻した。</p>\n<h3>伏羲の易（先天）と文王の易（後天）</h3>\n<p>邵康節（邵雍、字は堯夫）は、今の『易経』（文王・周公・孔子の易）を「後天の学」とし、それ以前に文字になっていない伏羲の易「先天の学」があったと考えた。これは『易経』自体にはない、邵康節の独創である。四つの伏羲図はみな邵康節から出たもので、李之才（挺之）→穆脩（伯長）→華山の道士・陳摶（希夷先生）に遡る。夏の『連山』（艮を首とする）、殷の『帰蔵』（坤を首とする）は卦の順が違うだけで、周易とそれほど変わらず、やはり後天易に当たる。</p>\n<ul class=\"sen\"><li><b>伏羲八卦の次序</b>：繋辞伝「易に太極有り、是れ両儀を生ず。両儀は四象を生じ、四象は八卦を生ず」。太極が陰陽に分かれ、陽が太陽・少陰に、陰が少陽・太陰に分かれ、さらに三画目を重ねて乾一・兌二・離三・震四・巽五・坎六・艮七・坤八となる（ケン・ダ・リ・シン・ソン・カン・ゴン・コン）。略筮の数の当てはめはこの順に基づく。</li><li><b>伏羲八卦の方位</b>：説卦伝「天地位を定め、山沢気を通じ、雷風相薄り、水火相射わず、八卦相錯わる。往を数うる者は順、来を知る者は逆」。邵康節は、天と君を表す乾が中途半端な位置にあるのはおかしい、君主は南面するから乾は南、坤は北でなければならないとし、離を東、坎を西、震を東北、兌を東南、巽を西南、艮を西北に置いた。向かい合う卦はすべて陰陽が逆になる。震から乾へ（立春から夏至へ、陽気が伸びる）を順、巽から坤へ（夏至から冬至へ、陽気が消える）を逆とする。</li><li><b>伏羲六十四卦の次序</b>：陰陽の分裂を六段重ねると、二・四・八・十六・三十二・六十四となる。右端から乾（陽六本）、夬、大有……と並ぶ。ライプニッツは宣教師からこの図を見せられ、陽を1、陰を0と置けば乾は111111、夬は111110、大有は111101と表せることに気づいた。その遺稿のノートが図書館の地下室から見つかり、ライプニッツに二進法のヒントを与えたのはこの図であるというのが、ほぼ定説になっている。</li><li><b>伏羲六十四卦の方位</b>：六十四卦を円形に並べ（外の円）、内側に正方形に並べたもの。円は陽で動いて天となり、方は陰で静かに地となる。「天円地方」、天が卵の白身のように四角い大地を覆うという、古代中国人の宇宙観を示す。陽は子（北・坤の傍らの復）の中に生じて午（南・乾）の中に極まり、陰は午の中に生じて子の中に極まる。</li><li><b>文王八卦の次序</b>：乾を父、坤を母とし、六人の子が生まれる。震は乾の初爻を得た長男、坎は中爻を得た中男、艮は上爻を得た少男。巽は坤の初爻を得た長女、離は中爻を得た中女、兌は上爻を得た少女。</li><li><b>文王八卦の方位</b>：坎は北、離は南、震は東、兌は西、艮は東北、巽は東南、坤は西南、乾は西北。今の『易経』の説卦伝に明記された方位である。邵康節はこれを、本体が動いて作用に入った「後天」の方位とした。</li><li><b>卦変図</b>：彖伝が、ある卦の成り立ちを「どの卦から変化してこの形になった」と説明することがあるので、その変化を図にしたもの。ただしこれは易の一つの意味にすぎず、聖人が卦を画し易を作った本来の意味ではない。一陰一陽の卦は復・姤から、二陰二陽の卦は臨・遯から、三陰三陽の卦は泰・否から、四陰四陽の卦は大壮・観から、五陰五陽の卦は夬・剥から来る。たとえば復の一陽が上がっていくと師・謙・豫・比・剥になる。起点となる復・臨・泰・大壮・夬・乾、姤・遯・否・観・剥・坤は「十二消息卦」（陽気が消えるのが消、伸びるのが息）と呼ばれ、一年十二か月の陰陽の消長を示すので、六十四卦のなかでも重い意味を持つ。</li></ul>\n<h3>結び</h3>\n<p>天地自然の易、伏羲の易、文王・周公の易、孔子の易がある。伏羲以前には文字がなく図だけがあったので、図を深く味わえば、易を作った本来の精微な意図が見える。文王以後は文字がある。ただし、孔子の説をそのまま文王の説としてはならない。易の解釈は時代を追って進化してきたのである。受講者が「伏羲の易のほうが面白いのですか」と問うと、本田は「文字もなくて図しかなかったと言うのですから、面白いかどうかもわからない」と笑った。</p><div class=\"pager\"><a href=\"#soron-3\">← 総論三</a><a href=\"#gua-1\">第1卦 乾為天 →</a></div>", "gua": "<h2 class=\"sec\">十二卦</h2><p class=\"small dim\">卦をえらぶと、卦辞・彖伝・大象・程伝と本田の講説・六爻が読めます。</p><div class=\"grid\"><a class=\"gcard\" href=\"#gua-1\"><div class=\"no\">第1卦</div><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">乾為天</div></a><a class=\"gcard\" href=\"#gua-2\"><div class=\"no\">第2卦</div><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">坤為地</div></a><a class=\"gcard\" href=\"#gua-3\"><div class=\"no\">第3卦</div><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水雷屯</div></a><a class=\"gcard\" href=\"#gua-4\"><div class=\"no\">第4卦</div><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山水蒙</div></a><a class=\"gcard\" href=\"#gua-5\"><div class=\"no\">第5卦</div><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水天需</div></a><a class=\"gcard\" href=\"#gua-6\"><div class=\"no\">第6卦</div><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天水訟</div></a><a class=\"gcard\" href=\"#gua-7\"><div class=\"no\">第7卦</div><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地水師</div></a><a class=\"gcard\" href=\"#gua-8\"><div class=\"no\">第8卦</div><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水地比</div></a><a class=\"gcard\" href=\"#gua-9\"><div class=\"no\">第9卦</div><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風天小畜</div></a><a class=\"gcard\" href=\"#gua-10\"><div class=\"no\">第10卦</div><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天沢履</div></a><a class=\"gcard\" href=\"#gua-11\"><div class=\"no\">第11卦</div><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地天泰</div></a><a class=\"gcard\" href=\"#gua-12\"><div class=\"no\">第12卦</div><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天地否</div></a></div>", "gua-1": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 1 卦　第五講〜第八講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">乾為天</div><div class=\"yo\">けんいてん</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-1\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-1\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-1\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-1\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-1\" data-jump=\"s4\">文言伝</a><a class=\"chip\" href=\"#gua-1\" data-jump=\"s5\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-1\" data-jump=\"s6\">占いの心得</a><a class=\"chip\" href=\"#gua-1\" data-jump=\"yao\">六爻</a></div><h3 id=\"g1-s0\">卦の名と象</h3>\n<p>六爻すべてが陽の卦。略筮なら一回目も二回目も一本残った時、本筮なら十八回の操作で六爻とも陽が出た時に得る。易のなかで最も尊く、めでたい卦である。</p>\n<p><span class=\"tag\">程伝</span>上古の聖人（伏羲）が初めて八卦を画して天・地・人の三才の道が備わり、それを重ねて天下の変化を尽くした。乾を重ねて乾とする。</p>\n<ul class=\"sen\"><li><b>乾は天なり。</b> 天は天の形体、乾は天の性情（性質・感情）である。</li><li><b>乾は健なり。</b> 健やかで止むことのない、生々して休まない働きを乾という。</li><li>天を一言で言えば「道」である（「天すら且つ違わず」の天）。分けて言えば、形体から「天」、主宰する者として「帝」、はたらきから「鬼神」、妙用から「神」、性情から「乾」という。帝の字はもともと天の神様で、人間の帝王に使うのはずっと後のことである。</li><li>乾は万物の始めであり、天・陽・父・君を表す。</li></ul>\n<h3 id=\"g1-s1\">卦辞</h3>\n<div class=\"orig\">乾、元亨利貞。</div>\n<div class=\"yomi\">乾は、元（おお）いに亨（とお）る。貞（ただ）しきに利（よ）ろし。</div>\n<p>本文自体の意味は簡単で、「この卦が出たら願いは大いに通る。ただし動機が正しい場合にのみ利益がある」という占断である。しかし孔子以後、程伊川に至るまで、元・亨・利・貞の四字に一つひとつ形而上学的な解釈が加えられた。</p>\n<p><span class=\"tag\">程伝</span>元亨利貞を「四徳」という。</p>\n<ul class=\"sen\"><li><b>元</b>は万物の始め（字の本義は「頭」）。</li><li><b>亨</b>は万物の成長。</li><li><b>利</b>は万物が生育を遂げること。</li><li><b>貞</b>は万物の完成。</li></ul>\n<p>ただ乾と坤だけがこの四徳をそのまま備え、他の卦では事に応じて制限がつく（「小しく亨る」「女の貞に利あり」など）。元はもっぱら善・大を、利は正しくして持続することを主とする。四徳の意味は広く大きい。</p>\n<h3 id=\"g1-s2\">彖伝</h3>\n<div class=\"orig\">大哉乾元、萬物資始、乃統天。雲行雨施、品物流形。大明終始、六位時成、時乘六龍以御天。乾道變化、各正性命、保合大和、乃利貞。首出庶物、萬國咸寧。</div>\n<p>大なるかな乾元。万物資（と）りて始む。乃ち天を統ぶ。雲行き雨施し、品物形を流（し）く。大いに終始を明らかにし、六位時に成る。時に六龍に乗りて以て天を御す。乾道変化して、各（おのおの）性命を正し、大和を保合す。乃ち利貞。庶物に首出して、万国咸（ことごと）く寧（やす）し。</p>\n<p><span class=\"tag\">程伝</span>卦辞を「彖」といい、孔子がそれに従って述べた解釈もまた「彖」という（彖伝）。彖は一卦の義を言うので、知者が彖辞を見れば「思い半ばを過ぎる」（繋辞伝）。</p>\n<ul class=\"sen\"><li>「大なるかな乾元」は元の徳をたたえる。四徳の元は、五常の仁のようなものである。狭く言えば一事だが、広く言えば四者を包む。</li><li>「万物資りて始む。乃ち天を統ぶ」は元を言う。天道は万物を始め、万物は始めを天から受ける。</li><li>「雲行き雨施し、品物形を流く」は亨を言う。天道が運行して万物を生育する。</li><li>卦の初めと終わりが天道の終始であり、六爻の時に乗ずるのは天運である。「天を御す」とは天運に当たることをいう。</li><li>天が賦与するものを「命」、物が受けるものを「性」という。</li><li>「保」は常に存すること、「合」は常に和すること。天地の道が永久にやまないのは大いなる調和を保合するからである。</li><li>天は万物の祖、王は万国の宗である。王者が天道を体得すれば、万国はことごとく安らかである。</li></ul>\n<p>本田の訳：ああ偉大なるかな、乾の元の徳。万物はここから生命の始めを受け、天によって統一される。天の気は雲となり雨となって、あらゆる生物がそれぞれの形をして地上に分布する。天の道の終始を明らかにすれば、時に応じて六つの位ができる。その六頭の龍にまたがり、天の運行に身を任せて天を駆け巡る。天道は刻々に変化して万物にふさわしい性質を与え、宇宙の大調和を保つ。これこそ「貞しきに利あり」である。天が万物の頭であるのにかたどって、王者は万国をリードし、万国はことごとく平安になる。「この彖伝の文章、なかなか優れた文章であります」。</p>\n<h3 id=\"g1-s3\">大象</h3>\n<div class=\"orig\">天行健、君子以自彊不息。</div>\n<div class=\"yomi\">天行は健なり。君子以て自ら彊（つと）めて息（や）まず。</div>\n<p>天の運行はいとも健やかで、一刻も休まない。君子はこの卦にのっとって、自ら努力して休むことがない。</p>\n<p><span class=\"tag\">程伝</span>卦の下の象（大象）は一卦の象を、爻の下の象（小象）は一爻の象を解く。どの卦もその象から法を取る。天道が万物を覆い育てる姿はあまりに大きく、聖人でなければその徳を身につけられない。そこで、あらゆる人が法を取れるよう、その運行の健やかさだけを取り上げた。君子が自ら努めて休まないのは、天行の健に法るのである。</p>\n<h3 id=\"g1-s4\">文言伝</h3>\n<p>文言伝は乾と坤にだけついている、孔子が熱を入れて書いた長い解説である。何度も同じ爻を説明し直すので、宋の欧陽修は孔子の自作ではなく寄せ集めだろうと疑った。しかし、ある時は人事から、ある時は陰陽から、ある時は「時」から、ある時は言葉の意味からと、角度を変えて説明し直していると考えれば筋は通る。</p>\n<div class=\"orig\">元者善之長也、亨者嘉之會也、利者義之和也、貞者事之幹也。</div>\n<div class=\"yomi\">元は善の長なり。亨は嘉の会なり。利は義の和なり。貞は事の幹なり。</div>\n<p><span class=\"tag\">程伝</span>他の卦には彖・象しかないが、乾坤だけはさらに文言を設けてその義を明らかにし、乾の道を人事に推し及ぼしている。元はあらゆる善の頭、亨は美しく良きものの集まり、利は義（事のよろしき）にぴたりと和すること、貞は物事をつかさどる働きである（「幹事」の語はここから出た）。</p>\n<ul class=\"sen\"><li><b>君子は仁を体すれば、以て人に長たるに足る。</b> 元・亨・利・貞を人の道徳に当てると仁・礼・義・智であり、元は仁に当たる。乾の仁（天が万物を愛する徳）にのっとれば、人の上に立つことができる。</li><li><b>会を嘉すれば、以て礼に合するに足る。</b> 良きものが集まり流通すれば礼にかなう。礼にかなわなければ理に背き、理に背けば生気は流通しない。</li><li><b>物を利すれば、以て義に和するに足る。</b> 宜しきを得てこそ物に利益を与えられる。</li><li><b>貞固は以て事に幹たるに足る。</b> 正しさの持続こそ、物事をつかさどるもとである。</li></ul>\n<p>君子はこの四徳を行う者である。だから「乾は元亨利貞」と、ここでは一字ずつ切って読ませる。四徳を行えば乾に合する。易では、六十四卦は宇宙のなかの陰陽の気の流れの状態を象徴し、一つの卦が出るのは、ある瞬間の陰陽の流れがそういう状態にあるということで、その文句は占った人への戒め・教訓・行動の指針となる。</p>\n<div class=\"orig\">大哉乾乎、剛健中正、純粹精也。六爻發揮、旁通情也。時乘六龍、以御天也。雲行雨施、天下平也。</div>\n<div class=\"yomi\">大なるかな乾や。剛健中正、純粋にして精なり。六爻発揮して、旁（あまね）く情を通ずるなり。時に六龍に乗りて以て天を御するなり。雲行き雨施して、天下平らかなり。</div>\n<p>本体は剛、作用は健、行いは中庸、立場は正しく、まじり気がなく、よりすぐられている。剛・健・中・正・純・粋の六者の極致を「精」という。聖人が下から上がって九五の地位に達すると、天の恵みは雲となり雨となって降り注ぎ、五穀が実って天下は平和になる。「大変力強い優れた文章です」。</p>\n<h3 id=\"g1-s5\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>龍の象。</b> 理には形がないので、象を借りて義を表す。乾は龍を象とする。龍は変化して測りがたいので、乾道の変化、陽気の消長、聖人の進退を表すのにふさわしい。程伝は六爻すべてを舜の生涯にたとえる。百姓の子として世に出なかった時（初九）から、歴山で田を耕し（九二）、その徳が堯の耳に達し（九三）、さまざまに試され（九四）、天子の位に即く（九五）。</li><li><b>応。</b> 下卦と上卦の対応する爻（初と四、二と五、三と上）は、陰陽が逆の時に応じあい、陽と陽・陰と陰では普通は反発する。しかし乾坤は純体で剛柔の別がないので、九二と九五は同じ陽どうしでも同徳をもって応じる。</li><li><b>中と正。</b> 「中」は下卦・上卦の真ん中（二と五）、「正」は奇数の位に陽、偶数の位に陰がいること。九五はまさに中であり正である。</li><li><b>三才。</b> 卦を天・人・地に分けると、初・二が地、三・四が人、五・上が天に当たる。三は田（地）を離れたがまだ天に至らず、四は人の位の上に出てしまっている。どちらも危うい地位である。</li><li><b>程伊川の主知主義。</b> 文言伝の九三「至るを知りて之に至る（知至至之）、終わるを知りて之を終う（知終終之）」について、程伝は、まず到達点を知り（致知）、知ってから力行する（知が先、行が後）と説く。『大学』の「格物致知」に通じる。これは程伊川も朱子もほぼ同じ考え方で、後に明の王陽明は「知行合一」を唱えてこれに反対した。</li><li><b>聖人も失敗することがある。</b> ある人が「乾の六爻は全部聖人のことか」と問うた（「亢龍悔い有り」のような悪い判断もあるから）。程伊川は答える。いかなる時も道義を尽くすのが聖人である。しかし必ず成功するとは限らず、失敗すれば凶の運命が伴う。聖人の心は、いかなる時も道義を尽くすことにあり、これは乾だけでなくあらゆる卦に通じる。本田はこれを「いかにも道学者らしい立場」と評している。</li><li><b>鬼神。</b> 文言伝の九五に、大人は「天に先んじて天違わず、天に後れて天の時を奉ず」、天すら違わない、まして人や鬼神をや、とある。鬼は人が死んでなるもの、神は天・地・山・川の神々。孔子は「怪力乱神を語らず」と言い、「未だ生を知らず、焉んぞ死を知らん」と答えたが、鬼神を信じなかったのではなく、凡人には知りえないものとして敬して遠ざけたのである。孔子が最も大事にしたのは親孝行で、それは死んだ親をいかに丁寧に祭るかということであった。程伝は鬼神を「造化の迹（万物を生成する目に見えぬ働きが姿を見せたもの）」と解し、孔子を無神論者とする見方は、こうした程朱の解釈がそれに近いのだという。</li><li><b>四声と平仄。</b> 九三の文言の「与（とも）に幾（き）すべし」の「幾」に「音は機」と注がある。幾には平声（近い）・上声（いくばく）・去声（こいねがう）の三音があり、ここは平声で「近い」の意味に読めという指示である。受講者の求めに応じて、本田は平仄と押韻を、杜甫「春望」、李白「早に白帝城を発す」を例に詳しく説明した（五言は「二四不同」、七言は「二四不同、二六対」）。日本人の漢詩は菅原道真から頼山陽、乃木希典に至るまで、平仄がきちんと合っているという。</li></ul>\n<h3 id=\"g1-s6\">占いの心得</h3>\n<ul class=\"sen\"><li>卦全体は大いにめでたいが、六爻のなかに良い位置と悪い位置がある。二と五が最も安全で、とくに五が最上。三と四は上下の境目で危うい。上は昇りすぎて判断が悪い。</li><li>陽気ばかりの時に、自分がその頭になろうとしてはならない（用九）。</li><li>「大人を見るに利あり」は九二と九五にだけつく。九二では下位の賢人が九五の君に会い、九五では君が下の賢人を引見し、天下の人々がこの大人を仰ぐ。同じ「大人を見るに利あり」でも、訟の卦では公平な裁判官に会えれば利がある（会う前から利はわかっている）のに対し、乾では聖人が実際に世に現れ、ともに事業を成して初めて利が生ずる、と程伝は区別する。本田は「程伊川もここまでこだわる必要はないように思われます」と評している。</li></ul><h2 class=\"sec\" id=\"g1-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">潛龍勿用。</span></summary><div class=\"body\"><div class=\"yomi\">潜龍なり。用うる勿れ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「潛龍勿用、陽在下也。」（潜龍用うる勿れとは、陽、下に在るなり。）</div>\n<p>地下に潜む龍である。行動してはならない。「用うる」は行動すること。九は陽の数の盛り（一桁の奇数の最大）なので陽爻に名づけ、一番下の爻を「初」という。</p>\n<p><span class=\"tag\">程伝</span>初は一卦の一番下にあって物事の始まりである。陽気がようやく萌え出し、聖人がまだ身分卑しく世に知られない時。龍が潜み隠れているようなもので、自ら行動してはならない。才能を隠して実力を養い、時を待つべきである。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>龍の徳がありながら隠れている者である。世の流行で生き方を変えず、名を求めず、世を逃れても悶えず、正しいと認められなくても悶えない。楽しめば行い、憂えれば去る。志が確乎として抜くことができない。程伝はこれを、聖賢が卑しい地位にあって道を守り、自ら信じ自ら楽しみ、可を見て動き、難を知って避け、その守りが堅くて奪えない姿とする。また「君子は成徳を以て行いを為す」。徳は行いに移してこそ徳で、初九は徳がまだ隠れて現れず、行いがまだ成らないので、君子は用いない。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>時はまだ至らない。行動してはならない。才を隠して実力を養い、時を待て。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">見龍在田、利見大人。</span></summary><div class=\"body\"><div class=\"yomi\">見龍（げんりょう）田に在り。大人を見るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「見龍在田、德施普也。」（見龍田に在りとは、徳の施し普きなり。）</div>\n<p>龍が地上に現れ、田にいる。「見」は現れる意で「ゲン」と読む。大人（九五の聖人）に会うことができ、会えば利益がある。</p>\n<p><span class=\"tag\">程伝</span>田は地上である。徳がすでに世に現れた。舜が歴山で田を耕し雷沢で漁をしていた時、人々がその徳を慕って畦を譲り、良い釣り場を譲った、その能力がわずかに現れ始めた時である。九二は大徳の君（九五）に見えてその道を行い、君もまた大徳の臣を見て共に功を成し、天下は大徳の人を見てその恩恵を被る。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>龍の徳があって正中（下卦の真ん中）にいる者である。日常の言葉に偽りなく、日常の行いを謹み、邪を防いでその誠を保つ。世を善くして誇らず、徳は広く人を感化する。君主の位にはまだないが、君の徳がある。また「学びて以て之を聚め、問いて以て之を弁じ、寛にして以て之に居り、仁にして以て之を行う」。学び問うのは徳に進むこと、寛く居て仁で行うのは業を修めることである。程伝によれば、進んでその位に就いた者は舜・禹であり、位には就かず進んでその道を行った者は伊尹（料理人から殷の湯王の宰相になった）・傅説（殷の高宗が夢に見た人物を探し、土木工事の人夫から宰相に抜擢した）である。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>徳が世に現れる時。上位の大人に会い、共に事を成すことができる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">君子終日乾乾、夕惕若、厲无咎。</span></summary><div class=\"body\"><div class=\"yomi\">君子終日乾乾（けんけん）し、夕べまで惕若（てきじゃく）たり。厲（あや）うけれども咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「終日乾乾、反復道也。」（終日乾乾すとは、反復して道なればなり。）</div>\n<p>徳ある人は一日中努め、夕方まで過ちがなかったかと恐れる。この地位は危険ではあるが、大した咎はない。「咎无し」は、反省して身を慎めば何ともない、という判断である。</p>\n<p><span class=\"tag\">程伝</span>三は人の位だが、すでに下卦の一番上にあって、まだ下を離れないのに尊く名が上がった者である。舜の人知れぬ徳が天子の耳に達した時である。昼夜怠らず恐れ慎めば、危地にいても咎はない。下位にありながら君主の徳がすでに現れ、天下が帰そうとしている。堯には実子の丹朱がいて妬みが生じ、舜の家では腹違いの弟が舜を殺そうとしていた。その危うさは知れたことである。聖人のことを述べていても、戒めを設けなければ教えにならない。易を作った意味はそこにある。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>君子は徳に進み業を修める。忠信は徳に進む手段、言葉を修めて誠を立てるのは業に居る手段である。到達点を知って到達し（知至至之）、終着点を知って終える（知終終之）。だから上位にいても驕らず、下位にいても憂えない。時に応じて惕れれば、危うくても咎はない。また、重剛（陽の位に陽）で中を外れ、天にも田にもいない危うい地位だから、乾乾として惕れるのである。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危うい地位だが、一日中努め、過ちを恐れて慎めば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">或躍在淵、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">或（あるい）は躍りて淵に在り。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「或躍在淵、進无咎也。」（或は躍りて淵に在りとは、進むも咎无きなり。）</div>\n<p>龍が昇ろうか降りようかと迷い、深い淵で躍り上がったり沈んだりしている。「或」に「心」をつけると「惑」で、或にも惑うという意味がある。結果的に咎はない。</p>\n<p><span class=\"tag\">程伝</span>淵は龍の安んずる所。「或」は疑いの言葉で、まだ決めていないことをいう。躍るか躍らないかは、時に応じて安全な方へ就くだけである。聖人の行動は常に時にかなう。舜が堯にさまざまに試された時である（堯は舜を娘とめあわせて家庭での行いを見、政治の場に就けて働きを見た）。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>上下に定まりがないのは邪をなすのではなく、進退に定まりがないのは仲間を離れるのではない。君子が徳に進み業を修め、時に遅れまいとするだけである。君子が時に従うのは、影が形に従うようなもので、離れられるものは道ではない（『中庸』）。また、四は天にも田にもおらず人の位の上に出た危地で、自らを疑うからこそ咎がない。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>進退を決めかねる時。時をよく見て安心できる所を選べば、進んでも咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">飛龍在天、利見大人。</span></summary><div class=\"body\"><div class=\"yomi\">飛龍天に在り。大人を見るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「飛龍在天、大人造也。」（飛龍天に在りとは、大人の造（な）すなり。）</div>\n<p>龍が飛び上がって天にある。乾のなかで一番めでたい爻である。君主は下位にある大徳の人を引見し、天下の人々は龍にも似た偉大な人を仰ぐ。</p>\n<p><span class=\"tag\">程伝</span>進んで天位にあり、舜が天子の位に即いた場面である。聖人が天位を得れば、下にある大徳の人を見てともに天下の事を成す。大人が聖人の事業をなす、すなわち王者となって天下を治めることである。本田によれば、この爻が出たらその人は天子にもなれるという判断である。儒教では、道徳的に最も高い聖人こそ天子の位に立つべきだと考える。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>「同声相応じ、同気相求む。水は湿えるに流れ、火は燥けるに就く。雲は龍に従い、風は虎に従う。聖人作りて万物覩る。天に本づく者は上に親しみ、地に本づく者は下に親しむ。則ち各其の類に従う」。同じ音に調律した弦が共鳴し、雨の前に敷石がまだ濡れないうちから湿るように、同類は引きあう。人と聖人は同類だから、聖人が立てば万人が仰ぐ。「万物」の「物」は人の意味である（「人物」「物論」の物）。日月星辰は天に、虫獣草木は地につく。</div>\n<p>また「大人は、天地と其の徳を合わせ、日月と其の明を合わせ、四時と其の序を合わせ、鬼神と其の吉凶を合わせる。天に先んじて天違わず、天に後れて天の時を奉ず」。暦のように聖人が先に作ったものに天が後からついてくることもあり、春夏に賞を与え秋冬に刑を行うように、天の秩序を後から奉じることもある。程伝は、それができるのは大人が道に合しているからで、天地とは道であり、鬼神とは造化の迹であるという。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>運気の頂点。天子にもなれるという判断である。上は下の賢人を用い、下は上の大人を仰いで、ともに大事を成す。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">亢龍有悔。</span></summary><div class=\"body\"><div class=\"yomi\">亢龍（こうりょう）悔い有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「亢龍有悔、盈不可久也。」（亢龍悔い有りとは、盈（み）つれば久しかる可からざるなり。）</div>\n<p>昇り詰めた龍には後悔がある。満ちればあふれこぼれ、長くは続かない。昇り詰めれば、あとは落ちるより仕方がない。</p>\n<p><span class=\"tag\">程伝</span>五は位の極みで中正であり、時の権を得ている。五を過ぎれば亢（昇りすぎ）である。上は亢の極みに至るので悔いがある。過ぎれば悔いがあるが、聖人だけは進退存亡を知って過ぎることがないので、悔いに至らない。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>「貴くして位无く、高くして民无く、賢人下位に在りて輔くる无し。是を以て動けば悔い有り」。五が君の位で、上はもはや正式の位ではない。一番高い所にいるが従う民はなく、九四以下の賢人も助けてくれない。また「亢の言たるや、進むを知りて退くを知らず、存するを知りて亡ぶるを知らず、得るを知りて喪うを知らず。其れ唯だ聖人か。進退存亡を知りて其の正を失わざる者は、其れ唯だ聖人か」。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>盛りの極み。進むことだけ知って退くことを知らなければ災いが至る。進退存亡の理を知れ。</div></div></details><details class=\"yao\"><summary><span class=\"p\">用九</span><span class=\"t\">見群龍无首、吉。</span></summary><div class=\"body\"><div class=\"yomi\">群龍を見る。首（かしら）たる无ければ吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「用九、天德不可爲首也。」（用九は、天徳首と為る可からざるなり。）</div>\n<p>陽気があたりに満ち満ち、龍がたくさん群がっているのが見える。自分がその頭になろうとしなければ吉である。</p>\n<p>古い注では、本筮で六爻すべてが老陽（変爻）になった特殊な場合にこの辞を見るとする。しかし程伝は、用九を筮の操作のことではなく、乾の剛に処する道、陽気が盛んな時にいかに行動すべきかを説いた教訓の句と見る。陽の性格で純陽の乾にいるのは剛に過ぎる。剛と柔が助けあってこそ中庸が得られる。剛をもって天下の先頭に立とうとすれば凶を招く。天の徳はもともと陽剛なのに、さらに剛を用いて先頭を好めば行き過ぎである。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>「乾元用九は、天下治まるなり」「乃ち天の則を見る」。陽を用いる道は、天も聖人も同じで、その用を得れば天下が治まる。用九は特定の爻ではなく、乾の六爻全体の概論に当たる。乾と坤（用六）にだけあるのは、全部の爻が陽、あるいは陰という特別な卦だからである。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>萃の初六</div><div class=\"rb\">卦辞「萃は亨る。王、有廟に仮る。大人を見るに利あり。亨る。貞しきに利あり。大牲を用うるに吉。往く攸有るに利あり」。人が集まる卦で、この人のもとに人が集まる。初六「孚有りて終わらず。乃ち乱れ乃ち萃まる。若し号（さけ）べば、一握して笑いと為らん。恤（うれ）うる勿れ。往けば咎无し」。九四への誠意はあるが貫けず、心が乱れたり仲間に戻ったりする。大声で呼べば仲間が一つになって笑うことになる。多少不安定だが心配はいらない。受講者が「派閥ができるんですな」と言い、一同笑った。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>益の六三・九五</div><div class=\"rb\">益は否の上の陽を一本減らして一番下に加えた形で、お上の財産を減らして下々に恵む、大変良い卦である。易はあまり損得を言わないが、損と益の卦だけは損得を言う。六三「之を益すに凶事を用う。咎无し。孚有りて中行あれば、公に告ぐるに圭を用う」。艱難非常の際には民に利益を与えてやるがよい。誠意があり中庸を踏めば、お上からも信じられる。九五「孚有りて恵心あれば、問う勿くして元吉。孚有りて我が徳を恵とせん」。君主に誠意と恵みの心があれば、問うまでもなく大吉で、下々は君主の徳を恩恵として頂戴する。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>平成五年の運勢（第八講）</div><div class=\"rb\">新年のおさらいに受講者が筮を立てた。</div><ul class=\"sen\"><li><b>姤の九四</b>：卦辞「姤は女壮んなり。用て女を取る勿れ」。一人の女が五人の男に会う形で、結婚を占えば大凶。九四「包に魚无し。起てば凶」。苞（つと）に魚が入っていない、あまり儲からない、行動してはならない。受講者は「女に気を付けるとしよう」と笑った。</li><li><b>豊の六二</b>：豊は雷に火で景気が良さそうだが、度が過ぎる。卦辞「豊は亨る。王之に仮る。憂うる勿れ。日中に宜し」。日は中すれば必ず傾く。六二「其の蔀（しとみ）を豊いにす。日中に斗を見る。往けば疑疾を得ん。孚有りて発若たれば吉」。蔀戸を降ろして暗く、日中に北斗が見える。暗い状況だが、誠意をもって対処すれば吉。本田自身も豊の上六を得て「大凶なんですよ」と言っている。</li><li><b>兌の六三</b>：卦辞「兌は亨る。貞しきに利あり」。めでたい卦だが、六三「来りて兌ぶ。凶なり」だけが悪い。下卦の主の爻なのに陰で、中を外れ、陽の位に陰がいて不正で、応じる上六も陰だからである。</li><li><b>中孚の上九</b>：卦辞「中孚は豚魚にして吉。大川を渉るに利あり。貞しきに利あり」。粗末な供え物でも神が聞いてくれる、冒険してよい卦である。上場を控えた受講者が上九を得た。「翰音（かんおん）天に登る。貞なれども凶」。翰音は鶏で、ろくに飛べない鶏が天に上ろうとしても、長くは飛べず地に落ちる。一同爆笑し、受講者は「いや、これは参った」と言った。</li></ul></div><div class=\"pager\"><a href=\"#soron-4\">← 総論四</a><a href=\"#gua-2\">坤為地 →</a></div>", "gua-2": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 2 卦　第九講〜第十一講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">坤為地</div><div class=\"yo\">こんいち</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-2\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-2\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-2\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-2\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-2\" data-jump=\"s4\">文言伝</a><a class=\"chip\" href=\"#gua-2\" data-jump=\"s5\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-2\" data-jump=\"s6\">占いの心得</a><a class=\"chip\" href=\"#gua-2\" data-jump=\"yao\">六爻</a></div><h3 id=\"g2-s0\">卦の名と象</h3>\n<p>六爻すべてが陰の卦。乾が天・陽・父・君・夫を表すのに対し、坤は地・陰・母・臣・妻の道を表す。乾と坤だけに文言伝がつくが、坤の文言伝は乾ほど長くない。「乾の文言伝はだいぶ退屈でしたが、坤の方には、おもしろいところがあります」。</p>\n<h3 id=\"g2-s1\">卦辞</h3>\n<div class=\"orig\">坤、元亨、利牝馬之貞。君子有攸往、先迷後得、主利。西南得朋、東北喪朋。安貞吉。</div>\n<div class=\"yomi\">坤は、元いに亨る。牝馬の貞に利あり。君子往く攸（ところ）有り。先んずれば迷い、後るれば得て、利を主（つかさど）る。西南に朋を得、東北に朋を喪う。安貞にして吉なり。</div>\n<p>坤の卦が出れば、願いは大いに通る。ただし雌馬のようにおとなしく持続力がある場合にのみ利益がある。乾の「貞しきに利あり」には限定がなかったが、ここでは「牝馬の」と限定がつく。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>坤は乾の対である。四徳は同じだが、貞の中身が違う。乾は剛固を貞とし、坤は柔順を貞とする。牝馬は柔順でありながら、よく歩く（健行）。だから牝馬の貞という。</li><li>君子の行いは柔順で、利にして貞であり、坤の徳に合する。</li><li>陰は陽に従うもので、誰かが歌い出すのを待って唱和する。陰が陽に先立てば迷い誤り、後ろにいれば常を得る。「利を主る」とは、万物を利する仕事が坤によってつかさどられること。万物の生成はみな地の功である。臣の道もそうで、君は命じ臣は行う。仕事に精を出すのは臣の職分である。</li><li>坤は八卦の方位で西南（未申）に当たる。西南は陰の方、東北は陽の方。西南に行けば同類の友を得、東北に行けば友を失う。ただ、陰は必ず陽に従うもので、あえて同類を離れて反対側につくことで、万物を化育する功を成し、安らかで正しい吉が得られる。字面通りなら「西南が良く東北が悪い」と読めるが、彖伝はむしろ東北がかえって良いとし、程伝もそれに従う。</li></ul>\n<h3 id=\"g2-s2\">彖伝</h3>\n<div class=\"orig\">至哉坤元、萬物資生、乃順承天。坤厚載物、德合无疆。含弘光大、品物咸亨。牝馬地類、行地无疆。柔順利貞、君子攸行。先迷失道、後順得常。西南得朋、乃與類行。東北喪朋、乃終有慶。安貞之吉、應地无疆。</div>\n<p>至れるかな坤元。万物資りて生ず。乃ち天に順承す。坤は厚くして物を載せ、徳は无疆（むきょう）に合す。含弘光大にして、品物咸（ことごと）く亨る。牝馬は地の類、地を行くこと无疆なり。柔順利貞は、君子の行う攸なり。先んずれば迷いて道を失い、後るれば順にして常を得。西南に朋を得るは、乃ち類と行くなり。東北に朋を喪うは、乃ち終に慶び有るなり。安貞の吉は、地の无疆なるに応ず。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>万物がこれによって形を生ずるのだから「大」と言ってもよさそうだが、乾ですでに「大なるかな」を使ったので、坤では一段劣る「至」の字を用いた。聖人（孔子）は上下の分においてこれほど謹厳である。</li><li>万物は乾から始め（生命の始まり）を得、坤によって生ずる（形の始まり）。父は母に生気を施し、母はそれを受けて子の肉体を生む、父母の道である。</li><li>乾の彖伝が「剛・健・中・正・純・粋」で形容したのに対し、坤は「含・弘・光・大」で形容する。含は包容、弘は寛裕（広さ）、光は昭明（輝き）、大は博厚（厚さ）。</li><li>疑問：「地を行くこと无疆」とは健やかということで、乾は健、坤は順のはずなのに、坤も健なのか。答え：健でなければどうして乾に配することができよう。乾だけが行き、坤はひたすら止まるということはない。牝馬の動きが力強いことは、その柔順を妨げない。</li><li>形而上（形をまだなさない段階）を天地の道といい、形而下（形をなした後）を陰陽という（形而上・形而下はもともと『易経』に出てくる言葉）。陰が同類と一緒にいるだけでは物を生めない。同類を離れて陽に従ってこそ物を生む功が成り、終に慶びがある。</li><li>彖伝に「无疆」が三回出てくるが、中身が違う。「徳は无疆に合す」は天の働きがやまないこと、「地の无疆なるに応ず」は大地の広さが窮まりないこと、「地を行くこと无疆」は牝馬がどこまでも健やかに歩むことである。</li></ul>\n<p>本田は「ここらへんの程伊川の注、親切過ぎて、多少くどいようですけど、この人のいかにも論理的な頭を示しています」と評している。</p>\n<h3 id=\"g2-s3\">大象</h3>\n<div class=\"orig\">地勢坤、君子以厚德載物。</div>\n<div class=\"yomi\">地勢は坤なり。君子以て徳を厚くして物を載す。</div>\n<p>大地の勢いはなだらかである。君子はこの卦にかたどって、大地のように分厚い徳で、あらゆる物を受け容れる。</p>\n<p><span class=\"tag\">程伝</span>坤道の大きさは乾と同じで、聖人でなければ体得できない。地は厚く、その勢いは順に傾いている。中国人の感覚では、黄河も揚子江も大河はみな西から東へ流れるので、西が高く東へなだらかに傾斜していると考える。君子はこの順厚の象を見て、深く厚い徳で万物を受け容れる。</p>\n<h3 id=\"g2-s4\">文言伝</h3>\n<div class=\"orig\">坤至柔而動也剛、至靜而德方。後得主利而有常。含萬物而化光。坤道其順乎、承天而時行。</div>\n<div class=\"yomi\">坤は至柔にして動くや剛、至静にして徳は方なり。後るれば得て利を主りて常有り。万物を含んで化光いなり。坤の道は其れ順か。天を承けて時に行う。</div>\n<p>坤は至って柔らかいが、牝馬のように動きは力強い。至って静かだが、その働きには法則性（方）がある。人の後ろにつくことで当を得て、万物を生む利益の主体となる。これが坤の常道である。大地はあらゆる物を内に含み、その感化は輝かしく大きい。天の働きを受けて時に違わず行う。程伝は、本文の「主」の下に「利」の字が脱けていると指摘する。</p>\n<div class=\"orig\">積善之家、必有餘慶。積不善之家、必有餘殃。臣弑其君、子弑其父、非一朝一夕之故、其所由來者漸矣。由辯之不早辯也。易曰、履霜堅冰至、蓋言順也。</div>\n<p>善を積むの家には必ず余慶有り。不善を積むの家には必ず余殃（よおう）有り。臣其の君を弑し、子其の父を弑するは、一朝一夕の故に非ず。其の由りて来る所の者漸（ぜん）なり。之を弁ずること早く弁ぜざるに由るなり。易に曰く、霜を履んで堅冰至ると。蓋し順を言うなり。</p>\n<p>『易経』全体のなかでも最も人口に膾炙した一節である。善を積んだ家には子孫にまで及ぶ喜びがあり、悪を積んだ家には子孫にまで及ぶ災いがある。臣が君を殺し、子が父を殺すような大事件は一朝一夕に起こったのではなく、小さな悪が積もり積もってだんだん大きくなったのを、早く見分けなかったからである。</p>\n<p><span class=\"tag\">程伝</span>天下の事は積もらずに成るものはない。明知の人は、小さな悪が積もって大きくなることを知り、早く見分けて伸ばさせない。そうすれば天下の悪は完成しようがない。これが初六の霜の戒めである。</p>\n<p>本田の講説：仏教の因果応報とよく比べられるが、仏教では本人が報いを受けるのに対し、中国では家族主義で、家が主体である。道教の民衆教化書には、善行をすれば何日寿命が延び、悪事をすれば何日縮むと書かれていて、毎日の善悪を帳簿のように点数でつける「功過格」（明の袁了凡が考案）がある。悪事をしても見合う善行をすれば帳消しになり、今生で報われない善は子孫に繰り越される。ベンジャミン・フランクリンが日記に善悪の採点表をつけていたのにも似ていて、こういうものは簿記のようなものができてから出てきたらしい。</p>\n<h3 id=\"g2-s5\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>程伊川の忠臣観。</b> 六三の「章を含む」について、程伝は、臣下は手柄を我が物とせず君主の功とすべきだが、なすべき義はしかるべき時にぱっと行動に出す、能力を隠したまま何があっても動かないのは忠ではない、と説く。本田は、程伊川は天子に御進講する職にあった非常にきまじめな官僚で忠義の心が篤く、この注にはその気持ちが生で出ていると評している。</li><li><b>六五の特異な解釈。</b> 「黄裳元吉」は普通は大変めでたい文句だが、程伊川は他の注釈者にない解釈をして、女性が天子の位に就くことへの強い戒めと読む。北宋の哲宗が十歳で即位した後、祖母の宣仁太皇太后が長く垂簾の政治を行った。伊川はこれに不満で、易伝のなかであてこすっているのだという説が『朱子語類』に見える。</li><li><b>陰陽と善悪。</b> 陰陽の対立は、陰が本質的に悪く陽が本質的に善いというわけではないが、二つの対立物に当てはめる時には、陽を君子、陰を小人に当てることがある。</li><li><b>乾坤を終えて。</b> 乾坤の二卦は文言伝という長い解説がついていて一つの山であり、これが済むと後はわりとすんなり行く。</li></ul>\n<h3 id=\"g2-s6\">占いの心得</h3>\n<ul class=\"sen\"><li>人の先に立とうとせず、後ろについて行けば当を得る。</li><li>同類だけで固まらず、あえて異なる者（陽）について行くことで、最後に喜びがある。</li><li>小さな悪の兆しを早く見分け、伸ばさせない（初六）。</li><li>「易は険を占わず」。謀反の成否のような危険なことを易で占ってはならない（六五の南蒯の故事）。</li></ul><h2 class=\"sec\" id=\"g2-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">履霜堅冰至。</span></summary><div class=\"body\"><div class=\"yomi\">霜を履んで堅冰至る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「履霜堅冰、陰始凝也。馴致其道、至堅冰也。」（霜を履んで堅冰とは、陰始めて凝るなり。其の道を馴致して、堅冰に至るなり。）</div>\n<p>霜を踏むようになると、だんだん寒くなり、やがて堅い氷がやって来る。</p>\n<p><span class=\"tag\">程伝</span>陰を「六」と称するのは陰の盛りだからである。八は陰でも多少陽気を含んでいて、純粋に盛んな陰ではない（本筮で九・八・八と三回とも多い数が出れば六＝老陰、二少一多なら八＝少陰、三回とも少なければ九＝老陽、二多一少なら七＝少陽）。陰が初めて下に生じた兆しはごくかすかだが、聖人はそれが成長することを慮って、ここで戒めを下す。秋の初めに霜を踏めば、陰がだんだん盛んになって堅い氷に至ることを知るべきである。朝廷の下のほうに小人が生じた時、今はわずかでもそのまま伸ばしてはならないのと同じである。象伝の「馴」は「習」で、慣れること、ずるずるべったりということ。慣れることで程度がひどくなる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>小さな兆しのうちに戒めよ。放っておけば大きな害に至る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">直方大、不習无不利。</span></summary><div class=\"body\"><div class=\"yomi\">直・方・大なり。習わざるも利せざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六二之動、直以方也。不習无不利、地道光也。」（六二の動きは、直にして以て方なり。習わざるも利せざる无しとは、地道光いなるなり。）</div>\n<p>まっすぐで、正方形で、大きい。学習を待たず、自然のままであらゆる物に利益がある。大変めでたい判断である。</p>\n<p><span class=\"tag\">程伝</span>二は陰の位で下にあり、中正であるから坤の主であり、この爻辞は坤の道全体をまとめている。直・方・大の三つで大地の徳用を形容し尽くしている。「習わず」とは自然のままということ。坤では作為しなくても結果的にそうなり、聖人では「従容として道に中る」（『中庸』）。直・方・大は『孟子』公孫丑篇で浩然の気を形容した「至大至剛にして以て直」に当たるが、坤の卦なので乾に属する「剛」の字を使わず「方」に代えた。乾の「貞」に坤では「牝馬の」を加えたのと同じである。気を言う時はふつう大を先にするが、坤では直・方があってこそ大となる。また、乾坤は純体なので位で応じるが、二は坤の主なので五との応は取らない。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>「直は其の正なり、方は其の義なり。君子は敬以て内を直くし、義以て外を方にす。敬義立ちて徳孤ならず」（「徳孤ならず」は『論語』の孔子の言葉そのまま）。程伝によれば、慎み（敬）を主として心の内をまっすぐにし、義を守って外の形をきちんとする。義が外に現れるといっても、義が外にあるわけではない（『孟子』で、義は外から強いられるものだとする告子に対し、孟子は義も心に内在すると反駁した論争を踏まえている）。敬と義が立てば、大きくなろうとしなくても大となり、徳は孤立せず、必ずついて来る人がいる。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>何も作為しなくても万事に利がある、大変めでたい時。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">含章可貞。或從王事、无成有終。</span></summary><div class=\"body\"><div class=\"yomi\">章（あや）を含む。貞にす可し。或は王事に従う。成すこと无くして終り有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「含章可貞、以時發也。或從王事、知光大也。」（章を含む貞にす可しとは、時を以て発するなり。或は王事に従うとは、知光大なるなり。）</div>\n<p>美しいあやを内に含んでいる。正しさを固く守るべきである。時には王の仕事に従事するが、功を成しても自分の手柄とせず、ひたすら仕事を終えることを心がける。</p>\n<p><span class=\"tag\">程伝</span>三は下卦の一番上で、しかるべき地位を得た者である。臣の道は、美点（徳や才能）を内に含み隠し、功があれば君に帰すべきである。そうすれば上には忌み嫌う心がなく、下は恭順の道を得る。「貞にす可し」とは、固く守り続ければ地位が長く続いて悔いがないということ。時に王事に従っても、その成功を我がものとせず、ただ職を守って事を終えるのが臣の道である。</p>\n<p>象伝の「時を以て発す」は本文にない考えで、孔子が付け加えたもの。程伝によれば、孔子は読者が文字の表面にとらわれて本意に達しないことを恐れた。美を包み隠すのが臣の正しい道だが、義としてなすべきことはしかるべき時に発する。ただ、その功を自分のものとしないだけである。隠したまま最後まで動かないのは忠を尽くさない者である。王事に従って功を誇らないのは知恵が輝くばかりに大きいからで、知恵の浅い人は少しでも手柄があれば、人が知ってくれないことを恐れる。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>陰は美があっても含んで王事に従い、自ら成すことはしない。地の道、妻の道、臣の道である。地道は天に代わって物を育てても、成功は天のものとする。妻の道もまたそうである。「今のフェミニズムの人が聞いたら怒るでしょうが、中国ではだいたいこれが建前でした」。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才能を内に秘め、手柄を上に譲って、職分を最後まで務めよ。ただし、なすべき時には動け。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">括囊、无咎无譽。</span></summary><div class=\"body\"><div class=\"yomi\">嚢（ふくろ）を括（くく）る。咎も无く、誉れも无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「括囊无咎、慎不害也。」（嚢を括る咎无しとは、慎めば害あらざるなり。）</div>\n<p>袋の口をくくったように何も言わない。咎もない代わりに誉れもない。あまり良い判断ではない。</p>\n<p><span class=\"tag\">程伝</span>四は君の位である五に近いが、四も五も陰で引き合わない（電気と同じで、陰と陽なら引き合うが陰と陰ではそっぽを向く）。上下・君臣の気持ちが隔たっている時である。この時に自分が正しいと振りかざせば、君から危ぶまれ疑われる。知恵をくらまして袋の口を括ったように外に出さなければ咎を免れるが、そうでなければ害がある。隠すからには誉れもない。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>「天地変化して草木蕃（しげ）る。天地閉じて賢人隠る」。天地が交われば万物が変化し草木が茂り、君臣が交われば道が通じる。天地が閉じ隔たれば万物は遂げず、君臣の道が絶えれば賢人は隠れる。上下の意思が通じない時代には、謹んで自分を守るべきである。</div>\n<p>戦国末の荀子は、この爻辞を「腐儒の謂なり」（腰抜け儒者のことだ）と痛烈に批判した（非相篇）。荀子は大変行動的な思想の持ち主であった。孔子の象伝は、誉めてはいないが、まるまる悪いともしていない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上下が通じない時。口を慎み、才を隠して身を守れ。害は避けられるが、誉れもない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">黃裳元吉。</span></summary><div class=\"body\"><div class=\"yomi\">黄裳（こうしょう）にして元吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「黃裳元吉、文在中也。」（黄裳にして元吉とは、文中に在るなり。）</div>\n<p>黄色い裳（はかま）のようであれば大いに吉。五行説では東が青、南が赤、西が白、北が黒で、中央が黄である。黄は中庸、袴は下半身に着けるものでへりくだることを暗示する。中庸を得てへりくだっていれば大吉、という意味である。</p>\n<p><span class=\"tag\">程伝</span>坤は臣の道だが、五は実に君の位である。だからその地位にいる者のために戒めて「黄裳にして元吉」という。黄は中の色、裳は下の服。中を守って下にいれば大吉で、その分を守るということである。元は「大」と「善」の二つの意味を含む。黄裳であって初めて吉だというのは、尊位にいることが天下の大凶であることを意味している。後の人はこの裏の意味に達していないので、明らかにせずにはいられない。</p>\n<p>五は尊位である。他の卦では五に陰がいると、柔順（蒙）、文明（離）、暗弱（明夷）などを意味するが、坤では陰が尊位にいることを意味する。陰は臣の道、妻の道である。臣が尊位に就いた例は、羿（弓の名人で十個の太陽のうち九つを射落としたという伝説の人、夏が衰えた時に取って代わった）や王莽（前漢末に皇太后の外戚の立場を利用して位を奪い、『周礼』に基づく急進的な土地改革や貨幣改革を一度にやって豪族の反乱にあい、たちまち倒れた）がある。これはまだ話になる。中国では革命はよくあることだからである。しかし、婦人が尊位に就いた女媧氏（伏羲に代わって立ち、欠けた天を補ったという神話の女性）や武氏（唐の則天武后。中国史ただ一人の女帝で、政治的能力も実際にあり、則天文字を作った）は、非常の変で話にならない。だから黄裳の戒めがあるが、憚って言い尽くさないのである。</p>\n<p>ある人が問うた。「革の卦では殷の湯王・周の武王の革命をあからさまに言い、彖伝で『湯武の革命は天に順い人に応ず。革の時大なるかな』と賛美しているのに、ここで何も言わないのはなぜか」。伊川は答えた。「興亡は常の理である。陰が尊位にいるのは非常の変である」。</p>\n<p>本田は、これはきわめて特異な解釈だと述べ、「女権論者が聞いたら、ものすごく怒るでしょうけど、古代中国ではこれが常識」と付け加えている。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>「君子は黄中にして理に通ず。正位にして体に居る。美其の中に在りて、四支に暢び、事業に発す。美の至りなり」。黄色という尊い色、美しい模様が内にあって道理に通じ、尊い位にいながら下にいる者のあり方を失わない。美しい徳が内に積もって、体全体にのびのびと現れ、事業にまで現れる。最も盛んな美徳である。坤では五を最も尊い位とは言わず、中正の良い位の意味にだけ取る。</div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">故事</span>南蒯の筮（『春秋左氏伝』昭公十二年）</div><div class=\"rb\">孔子がまだ生きていた頃、魯の南蒯がクーデターを起こそうとして占い、「坤の比に之く」、すなわち坤の六五だけが変じた「黄裳元吉」を得た。南蒯は成功間違いなしと思い、魯の賢人・子服恵伯に意見を求めた。恵伯は答えた。「忠信の事ならば成功するが、そうでなければ失敗する。外は強く内は温かいのが忠、和やかに正しきに従うのが信。だから黄裳元吉という。黄は中の色、裳は下の飾り、元は善の長である。中が忠でなければ黄の色を得られず、下にあって恭しくなければ裳の飾りを得られず、事が善でなければ良い結果は得られない。しかも易は険を占ってはならない。占って吉と出ても、忠・恭・善の三徳のない人には当たらない」。南蒯は兵を起こして失敗した。恵伯の「易は危険な事を占ってはならない」という戒めは、易占全般にかかわる原則として伝えられている。</div></div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>中庸を守り、へりくだっていれば大吉。分を越えて尊位を求めれば大凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">龍戰于野、其血玄黃。</span></summary><div class=\"body\"><div class=\"yomi\">龍野に戦う。其の血玄黄（げんこう）なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「龍戰于野、其道窮也。」（龍野に戦うとは、其の道窮まればなり。）</div>\n<p>龍が野原で戦い、両方とも傷ついて、一方は黒い血を、一方は黄色い血を流す。</p>\n<p><span class=\"tag\">程伝</span>陰は陽に従うものだが、盛んなことが極まれば陽に抗して争う。六はすでに極まっており、なお進んでやまなければ必ず戦う。「野」とは、陰が卦の下から上までのぼり詰め、さらに外へ飛び出すこと。陰と陽の力が匹敵すれば、どちらも必ず傷つく。玄は赤みを帯びた黒で天の色、黄は大地の色である。受講者が「『千字文』の『天地玄黄』と同じですね」と問うと、本田は「ええ、同じです」と答えた。日本人は天を青いと感じるが、古代中国人は深い青を「玄」、黒いと感じたようである。</p>\n<div class=\"kd\"><span class=\"kl\">文言伝</span>「陰、陽に疑わるれば必ず戦う。其の陽无きに嫌（まぎ）らわしきが為の故に龍と称す。猶お未だ其の類を離れず、故に血と称す」。陰が盛んになりすぎて陽と紛らわしくなれば、必ず陽と戦う。卦は純陰だが、陰の裏には目に見えない陽が必ずひそんでいる。それを示すために、最も陽なる物である「龍」と言った。とはいえ陰の類を離れたわけではないので「血」（陰に属する）と言う。陽も傷つかずにはいられず、天も地もともに傷つく。本田は、おとなしいと思われて馬鹿にされ、最後にカッとなって反抗した明智光秀のようなものだ、とたとえている。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>陰が極まって上と争う時。双方ともに傷つく。</div></div></details><details class=\"yao\"><summary><span class=\"p\">用六</span><span class=\"t\">利永貞。</span></summary><div class=\"body\"><div class=\"yomi\">永貞に利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「用六永貞、以大終也。」（用六の永貞は、大を以て終うるなり。）</div>\n<p>永久に正しさを守る場合にのみ利益がある。</p>\n<p><span class=\"tag\">程伝</span>坤の用六は乾の用九と同じで、陰に処する道を言う。陰の道は柔らかく、それだけに永く持続することが難しい。だから常に永く貞固であることに利がある。正しさ・堅固さが足りなければ終わりを永くできない。終わりを盛大にしてこそ永貞である。程伝の解釈では、用六は卦に出て来るものではないが、六爻すべてが変爻の時にここを見るという別の説もある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>柔順を最後まで持続せよ。終わりを全うしてこそ利がある。</div></div></details><div class=\"pager\"><a href=\"#gua-1\">← 乾為天</a><a href=\"#gua-3\">水雷屯 →</a></div>", "gua-3": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 3 卦　第十一講〜第十三講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水雷屯</div><div class=\"yo\">すいらいちゅん</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-3\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-3\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-3\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-3\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-3\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-3\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-3\" data-jump=\"yao\">六爻</a></div><h3 id=\"g3-s0\">卦の名と象</h3>\n<p>「トン」とは読まず「チュン」と読む。屯は「駐屯」のようにトンと読めば「とどまる」、チュンと読めば「満ちる」意味になる。字は草の芽（屮）が地面（一）を穿つ形を表す。乾坤の後に最初に出て来る卦である。</p>\n<p>程伝（序卦伝を引く）：「天地有りて然る後に万物生ず。天地の間に盈つる者は唯だ万物なり。故に之を受くるに屯を以てす。屯とは盈つるなり。屯とは物の始めて生ずるなり」。</p>\n<ul class=\"sen\"><li>万物が初めて生ずる時は、生気がむすばれてまだ外へ通らない。だから「盈つ」（中に満ちる）といい、天地の間にふさがっている。のびのびと茂るに至れば、ふさがる意味はなくなる。</li><li>雲（坎）と雷（震）が起こるのは、陰陽が初めて交わったところである。震は坤の一番下に、坎は坤の真ん中に陽気が交わった形で、父の陽気が母の陰気と交わって長男・中男を生んだ形である。</li><li>陰陽が交わって雲と雷が応じているが、まだ恵みの雨になっていない。だから屯（ふさがる）という。もし雨になれば、上下が入れ替わった解（氷が解ける、万事が解決する）の卦になる。</li><li>坎は険、震は動で、険の中に動く形でもあり、これも屯の意味である。陰陽が全く交わらなければ否、交わってまだのびないのが屯である。時にあっては、天下がふさがって困難で、まだ泰平でない時である。</li></ul>\n<h3 id=\"g3-s1\">卦辞</h3>\n<div class=\"orig\">屯、元亨利貞。勿用有攸往。利建侯。</div>\n<div class=\"yomi\">屯は、元いに亨る。貞しきに利あり。用て往く攸（ところ）有る勿れ。侯を建つるに利あり。</div>\n<p>この卦が出れば、願いは大いに通る。正しい道を持続するのが良い。危険な時だから、どこかへ行こうとしてはならない。諸侯を立てて自分の補佐とするのが良い。</p>\n<p><span class=\"tag\">程伝</span>屯には大いに亨る道がある。これに処するには貞固（正しさの持続）が肝心で、貞固でなければ難儀を救えない。難儀の時にはまだ進んではならない。天下の難儀は君主一人の力では救えず、必ず広く助けを求める。だから侯を建てるに利がある。</p>\n<p>本田の講説：屯には、草が地面を突き抜けて物が初めて生じるという意味と、生みの苦しみ・難儀という二つの意味がある。純粋な陽気と純粋な陰気が交わって、こうした複雑な形になるから、生みの苦しみという意味にもなる。程伝の「済う」はもともと川を渡る意味で、本田自身の名「濟」も「わたる」と読むのだが「誰もそう読んでくれない」と笑う。六十三番目の既済・最後の未済は、いずれも狐が川を渡るシンボルを使っている。</p>\n<h3 id=\"g3-s2\">彖伝</h3>\n<div class=\"orig\">屯、剛柔始交而難生。動乎險中、大亨貞。雷雨之動滿盈。天造草昧、宜建侯而不寧。</div>\n<div class=\"yomi\">屯は、剛柔始めて交わりて難生ず。険中に動く。大いに亨りて貞なるは、雷雨の動き満盈すればなり。天造草昧、宜しく侯を建つべくして寧（やす）しとせず。</div>\n<p>陽気と陰気が初めて交わって、生みの困難が生じた。上の坎は落とし穴で険、下の震は雷で動。危険のなかで動いている。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>雲と雷の二象から言えば初めて交わったところ、坎と震の二体から言えば険の中に動くところである。初めて交わってまだのびないから「難生ず」という。今にも雨になりそうでならない状態である。</li><li>「大いに亨りて貞」というのは、雷雨の動きが天地に満ち満ちるからである。陰陽が初めて交わればまだ難渋してのびないが、相和して行き渡れば雷雨となり、天地の間に満ちて、生物はついに芽を出す。大いに亨る道がここにある。ただし大いに亨るのは貞（正しさの持続）による。貞固でなければどうして屯を抜け出せよう。人が困難に処する場合、その困難こそが大いに亨る可能性をはらんでおり、それを現実にするのも貞固である。</li><li>上文で天地が物を生ずることを述べたので、ここでは人間界の時事を述べる。「天造」は時運、「草」は慌ただしく混乱して秩序がないこと、「昧」は暗くて先が見えないこと。このような時には、助けとなる諸侯を立てて難儀を救うべきである。しかし侯を立てて助けとしても、君主自身が憂い努め、びくびくと恐れているべきで、のんびり構えている暇はない。これは聖人の深い戒めである。</li></ul>\n<h3 id=\"g3-s3\">大象</h3>\n<div class=\"orig\">雲雷屯、君子以經綸。</div>\n<div class=\"yomi\">雲雷は屯なり。君子以て経綸す。</div>\n<p>雲と雷からなる卦が屯である。君子はこの卦にのっとって、天下の事に秩序をつける。「経」は縦糸をそろえること、「綸」は糸目をそろえること。</p>\n<p><span class=\"tag\">程伝</span>坎を「雨」と言わず「雲」と言うのは、雨になろうとしてまだ雨になっていないからである。だから屯である。君子は屯の象を見て、天下の事を経綸し、難儀を救う。経緯・綸緝は、あらゆる政治的な営みをいう。</p>\n<h3 id=\"g3-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>爻の関係は相対的に読む。</b> 初九は「賢明で強い人」とされるのに、六二から見ると迫ってくる「寇（あだ）」とされる。これはおかしいのではないかと問う人に、程伊川は答える。六二が柔の身で剛の初九に近いという相対関係から意味を立てたもので、初九の徳がどうかは計算に入れていない。易で爻と爻の位置関係を説く場合、意味の取り方はすべてこの通りで、その場その場の相対的な関係による。</li><li><b>へりくだる賢者。</b> 初九の「貴を以て賤に下る」について、本田は「才能があるのにへりくだることによって、よい結果を生む。これは老子に通じる考え方です」と述べている。</li><li><b>改革は漸進的に。</b> 九五の程伝は、権威が手を離れた君主がにわかに是正しようとして滅んだ例、漸進的に改めて復興した例、何もしないで滅んだ例を挙げている（下記）。</li></ul>\n<h3 id=\"g3-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>難儀の時で、急いで進んではならない。正しさを持続し、助けを求めよ。</li><li>自分の力が足りなければ、賢人を見つけて補佐とし、それから進め。</li><li>欲にかられて道案内なしに獲物を追ってはならない。兆しを見て手を引け。</li><li>改めるなら少しずつ。急激に正そうとすれば凶。</li></ul><h2 class=\"sec\" id=\"g3-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">磐桓、利居貞、利建侯。</span></summary><div class=\"body\"><div class=\"yomi\">磐桓（ばんかん）す。貞に居るに利あり。侯を建つるに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「雖磐桓、志行正也。以貴下賤、大得民也。」（磐桓すと雖も、志は正を行うなり。貴を以て賤に下る、大いに民を得るなり。）</div>\n<p>躊躇して進めない。ひたすら正しい所にじっとしているのがよい。助けとなる諸侯を立てるがよい。</p>\n<p><span class=\"tag\">程伝</span>初九は陽で一番下にいる、剛明の才である。難儀の世にあって下位にいるので、まっすぐ出かけて難儀を救うことはできず、うろうろと躊躇する。屯の初めにいて、躊躇せずにいきなり進めば難儀の真っただ中に突入する。だから正しい所にいて志を固めるべきである。人が難儀に処する時、正しさを守り通せる人はめったにいない。守る操がなければ義を失い、時の難儀を救えない。下位にとどまっているから助けが必要で、侯を建てるとは助けを求めることである。</p>\n<p><span class=\"tag\">象伝について程伝</span>賢人が下におり、時はまだ不利で、まっすぐ進んで時の難儀を救うことはできない。しかし難儀を救おうという志と能力はある。志は正を行うことにある。</p>\n<p>また「貴を以て賤に下る」：屯難の時、陰柔の者は自分で生き延びることもできない。ここに一人の剛陽の才があり、人々（上の二陰）が帰し従う存在である。それなのにさらに自ら一番下にへりくだる。これが大いに民を得るゆえんである。ある人が「一番下にいるのにどうして貴いのか」と問うた。答え：剛明の才で陰柔の下にへりくだり、難儀を救う才で無能な者の下にへりくだる。これが貴を以て賤に下るということである。まして陽は陰に対してもともと貴い。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>進めない時。焦らず正しさを守り、助けを得よ。へりくだれば人心を得る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">屯如邅如、乘馬班如。匪寇婚媾、女子貞不字、十年乃字。</span></summary><div class=\"body\"><div class=\"yomi\">屯如たり、邅如（てんじょ）たり、乗馬班如たり。寇（あだ）するに匪（あら）ざれば婚媾（こんこう）せん。女子貞にして字（じ）せず。十年にして乃ち字す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六二之難、乘剛也。十年乃字、反常也。」（六二の難は、剛に乗ればなり。十年にして乃ち字すは、常に反ればなり。）</div>\n<p>行き悩み、堂々巡りし、馬に乗っても降りてしまって進めない。仇する者がなければ結婚するであろう。この娘は貞節で、仇する男の子を孕むことはない。十年たって初めて妊娠する。程伝は「字」を「字育」（孕み育てる）と解するが、朱子は「婚約する」と解する。</p>\n<p><span class=\"tag\">程伝</span>六二は陰柔の身で屯の世にいる。正しく応じる相手（九五）が上にいるが、すぐ下の初九の剛に迫られている。だから難儀して堂々巡りする。「如」は形容の助字。乗馬は正しい相手のもとへ行こうとすること。班は分かれる意味で、馬から降りることを班という（本田は、この解釈は訓詁としては少し乱暴で、本当は馬が群れを離れることだとする）。</p>\n<p>二は自分では難儀から抜けられないが、中を得て正しく、上に応がある、義を失わない者である。しかし初九にすぐ迫られている。陰は陽の求めるもの、柔は剛の凌ぐものである。仮に初九という寇に迫られなければ、上に行って九五と結婚するだろう。寇とは正しい道によらずにやって来る者である。二は中正を守って初九といい加減に一緒にならないから、いつまでも子ができない。貞節を守って変わらなければ、十年後には難儀が極まって必ず通じ、正しい相手を得て子を生み育てる。女子の陰柔の身でも節操を守れば、久しくして必ず通じる。まして君子が道を守って違わなければなおさらである。</p>\n<p><span class=\"tag\">象伝について程伝</span>二は屯の時に剛（初九）の上に乗って迫られる。これが六二の難である。十年たてば難は久しくして必ず過ぎ、常に返って正しい相手と一緒になれる。十は数の終わり、最も完成された数である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>行き悩む時。目先の誘いに乗らず、正しい相手・正しい道を守り抜けば、久しくして必ず通じる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">即鹿无虞、惟入于林中。君子幾不如舍、往吝。</span></summary><div class=\"body\"><div class=\"yomi\">鹿に即（つ）くに虞（ぐ）无し。惟だ林中に入る。君子は幾（き）を見て舎（お）くに如かず。往けば吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「即鹿无虞、以從禽也。君子舍之、往吝窮也。」（鹿に即くに虞无きは、以て禽に従うなり。君子之を舎くは、往けば吝にして窮すればなり。）</div>\n<p>鹿を追うのに道案内（虞人＝山林の役人）がいない。そのまま追えば林の中に迷い込むのが落ちである。君子は兆しを見て鹿を放っておくにしくはない。追って行けば恥をかく（凶とまではいかない）。</p>\n<p><span class=\"tag\">程伝</span>六三は陰柔で陽の位（三）にいる。陰柔で屯を安んずる力がなく、剛の位にいて中正でないので妄動する。求めるものを貪っても自分を救うこともできず、上に応援（上六も陰）もない。どこへ行こうというのか。鹿を追うのに案内人がないのと同じで、山林に入るには必ず先導が要る。君子は事の機微を見て、これを捨てて追わないにしくはない。行けば徒らに窮して恥をかく。</p>\n<p><span class=\"tag\">象伝について程伝</span>事が不可なのに妄りに動くのは欲に従うからであり、案内なしに鹿を追うのは獲物を貪るからである。屯の時に動くべきでないのに動くのは、欲に従う心があるからだ。君子は兆しを見て捨て置く。</p>\n<p>受講者が「『虞』は虞美人の虞と同じですね」と問うと、本田は、虞は堯舜の舜の姓で虞舜といい、その末裔は春秋時代にも虞という小国を建てて続いていた、虞美人はその血筋かもしれない、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>欲にかられて深追いすれば迷う。道案内がないなら手を引け。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">乘馬班如、求婚媾、往吉、无不利。</span></summary><div class=\"body\"><div class=\"yomi\">乗馬班如たり。婚媾を求む。往けば吉にして、利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「求而往、明也。」（求めて往くは、明なり。）</div>\n<p>馬に乗っても降りてしまって進めない。結婚相手を求めているのだ。相手が見つかって前進すれば吉で、何事にも利がある。</p>\n<p><span class=\"tag\">程伝</span>六四は柔順で君（九五）に近い位におり、上に気に入られる者である。しかしその才は時の屯を救うに足りないので、進もうとしてまた止まる。自分に力がなければ、賢者を求めて助けとすれば救える。初九は陽剛の賢人で、六四と正しく応じる相手、自分の結婚すべき相手である。この陽剛の婚媾を求め、ともに陽剛中正の君（九五）を補佐して時の屯を救えば、吉で利あらざるなし。公卿の位にいて自分の才は足りなくても、下にいる賢人を求め、親しんで用いれば、どんな難儀も救える。</p>\n<p><span class=\"tag\">象伝について程伝</span>自分の不足を知り、賢人を求めて自らを助け、それから行く。これを明という。賢人を招ける地位にいながら何もせずに終わるのは、至って暗い者である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力不足を知り、賢い協力者を得てから進めば、万事に利がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">屯其膏、小貞吉、大貞凶。</span></summary><div class=\"body\"><div class=\"yomi\">其の膏（あぶら）を屯む。小貞なれば吉。大貞なれば凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「屯其膏、施未光也。」（其の膏を屯むは、施し未だ光いならざるなり。）</div>\n<p>恩沢をとどめて下に降さない。少しずつ正せば吉、急激に正せば凶。</p>\n<p><span class=\"tag\">程伝</span>五は尊位にいて正を得ながら、屯の時に当たる。剛明の賢人の補佐があれば難儀を救えるが、その臣がいないので、膏（恩沢）を屯める結果となる。君主の屯で、名位が落ちたわけではないが、施策が行き届かず、恩沢が下に及ばない。これは君主の危機である。恩沢が下らないのは、権威が自分の手にないからだ。権威が去ったのに、にわかに正そうとすれば凶を求める道である。</p>\n<ul class=\"sen\"><li><b>魯の昭公</b>：孔子と同じころの君主。魯では家老の季孫・臧孫・叔孫（本文のまま）の三家が公室を凌ぐ権勢を誇っていた。昭公は腹に据えかねて季孫を武力で攻めたが、叔孫が季孫を救い、昭公は斉に亡命して客死した。</li><li><b>高貴郷公</b>：三国時代、魏の四代目の皇帝。大将軍司馬氏の専横に対し、自ら近衛軍を率いて討とうとして敗死した（二六〇年）。</li></ul>\n<p>だから「小貞なれば吉」。小貞とは漸進的に正すことである。殷の盤庚や周の宣王は、徳を修め賢人を登用して先王の政治を復興し、離反しかけた諸侯も再び参勤するようになった。道によって順に導き、乱暴でなかったからである。とはいえ、唐の僖宗・昭宗（唐の最後の二代。『新唐書』によれば晩唐の九帝のうち七帝が宦官に擁立された。僖宗は暗愚、昭宗は英邁だったが家臣が働かず国を滅ぼした）のように何もせず平然としているのもよくない。何もしなければ屯はいつまでも続き、ついには滅亡に至る。</p>\n<p><span class=\"tag\">象伝について程伝</span>恩沢が下に及ばない。君主の徳の施しがまだ大きく輝いていない。これは人君の屯である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者の恵みが行き渡らない時。急激な改革は凶。徳を修め賢人を用い、少しずつ正せば吉。何もしないのもよくない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">乘馬班如、泣血漣如。</span></summary><div class=\"body\"><div class=\"yomi\">乗馬班如たり。泣血漣如（れんじょ）たり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「泣血漣如、何可長也。」（泣血漣如たり、何ぞ長かるべけんや。）</div>\n<p>馬に乗ってもすぐ降りてしまって進めない。血の涙がはらはらと流れる。</p>\n<p><span class=\"tag\">程伝</span>上六は陰柔の身で屯の終わり、険の極みにいて応援がない（応じる六三も陰で引き合わない）。じっとしていれば不安で、動けば行き場がない（一番上はそれ以上行き場がない）。馬に乗って行こうとしても進めず、困り果てて血の涙が流れる。屯の極みである。もし陽剛で助けがあれば、屯はすでに極まっているので救われることも可能なのだが。</p>\n<p><span class=\"tag\">象伝について程伝</span>屯難が窮まり、なすすべを知らず、血の涙を流す。こんなにひっくり返った状態で長く続くことができようか。卦は一つの事であり、爻はその事の時である。三画に分け、それを二つ重ねて、あらゆる道理を包括できる。「引きて之を伸ばし、類に触れて之を長ずれば、天下の能事畢る」（繋辞伝）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>困難の極みで助けがない。このままでは長く持たない。</div></div></details><div class=\"pager\"><a href=\"#gua-2\">← 坤為地</a><a href=\"#gua-4\">山水蒙 →</a></div>", "gua-4": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 4 卦　第十三講〜第十四講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山水蒙</div><div class=\"yo\">さんすいもう</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-4\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-4\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-4\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-4\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-4\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-4\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-4\" data-jump=\"yao\">六爻</a></div><h3 id=\"g4-s0\">卦の名と象</h3>\n<p>屯をひっくり返した形が蒙である。</p>\n<p>程伝（序卦伝を引く）：「屯とは物の始めて生ずるなり。物生ずれば必ず蒙。故に之を受くるに蒙を以てす。蒙とは蒙（おろ）かなり。物の穉（おさな）きなり」。物が初めて生じた時は幼く小さく、その愚かさはまだ啓発されていない。蒙が屯の次に来るゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は上が艮、下が坎。艮は山・止まる、坎は水・険。山の下に険があり、険にあって止まる。どこへ行けばよいかわからない、蒙の象である。</li><li>水は必ず流れて行くものだが、湧き出たばかりでまだ行く所がない。だから蒙という。進むに及んでは「亨る」の意味になる。</li></ul>\n<h3 id=\"g4-s1\">卦辞</h3>\n<div class=\"orig\">蒙、亨。匪我求童蒙、童蒙求我。初筮告。再三瀆、瀆則不告。利貞。</div>\n<div class=\"yomi\">蒙は亨る。我、童蒙を求むるに匪（あら）ず。童蒙、我に求む。初筮なれば告ぐ。再三なれば瀆（けが）る。瀆るれば告げず。貞しきに利あり。</div>\n<p>蒙の卦が出たら願いは通る。私の方から愚かな子どもを探して教えるのではない。愚かな子どもの方から私に教えを求めるのだ。教育とはそうあるべきだということである。占いで、最初の筮で出た判断は告げてやる。気に入らないからもう一度、また気に入らないからもう一度と再三筮に尋ねるのは、占いの神聖さを汚すもので、汚すようなことをすれば答えてやらない。動機が正しい場合にのみ利益がある。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>蒙には開発される理があり、それが「亨る」の意味である。卦の働きが時にかなって中庸を得ることが、亨る道である。</li><li>六五が蒙の主、九二が蒙を啓く者である。「我」とは九二を指す。二は卦の主ではないが、君である五がすでに二に順いへりくだっているので、二が蒙を啓く者として主体に言葉を立てた。</li><li>五は尊位にいて柔順の徳があり、いま童蒙の状態にあって、二と陰陽の正しい応をなし、中の徳を同じくする。だから二の道を用いて自分の蒙を啓くことができる。</li><li>二は剛中の徳で下にいて、君の信ずる相手である。道を守り、君が至誠をもって自分に求めて来るのを待って応じれば、その道を用いることができる。</li><li>「筮」は占断である。真心をもって一途に求めてくれば告げる。再三尋ねるのは煩わしく侮るもので、告げない。蒙を啓く道は正しさが一番である。また二は剛中だが陰の位にいるので、常に戒めの心を持つべきである。</li></ul>\n<h3 id=\"g4-s2\">彖伝</h3>\n<div class=\"orig\">蒙、山下有險、險而止、蒙。蒙亨、以亨行時中也。匪我求童蒙、童蒙求我、志應也。初筮告、以剛中也。再三瀆、瀆則不告、瀆蒙也。蒙以養正、聖功也。</div>\n<p>蒙は山の下に険有り、険にして止まるは蒙なり。蒙は亨るとは、亨るを以て時中を行うなり。我童蒙を求むるに匪ず、童蒙我に求むとは、志応ずるなり。初筮なれば告ぐとは、剛中を以てなり。再三なれば瀆る、瀆るれば告げずとは、蒙を瀆せばなり。蒙以て正を養うは、聖の功なり。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>山の下に険がある。内（下卦）は険でじっとしていられず、外（上卦）は止まって進めない。どうしてよいかわからない。だから昏蒙の意味になる。卦の下半分を内卦といい、家の中・心の中を表し、上半分を外卦という。</li><li>蒙が亨るのは、亨る道で行うからである。亨る道とは「時中」で、時とは二が君（五）の応を受けること、中とは二と五がそれぞれ真ん中にいること。中を得ることは時を得ることでもある。</li><li>「志応ずるなり」：二は剛明の才で下におり、五は童蒙で上にいる。二が五を求めるのではなく、五の志が二に応じるのである。賢者が下にいる場合、自ら進んで君に職を求めてはならない。自分から求めれば必ず信用されない。昔の賢人が、君主が敬を尽くし礼を尽くして来るのを待ってから出向いたのは、自分を尊大に見せるためではない。君主が徳を尊び道を楽しむ人でなければ、ともに事をなすに足りないからである。</li><li>「蒙を瀆す」とは、占いを求める者も告げる者も、ともに煩わしく汚されるということである。たとえ告げても相手は信じて受けない。</li><li>「利貞」の意味を伸ばして明らかにした。これは二を戒めるだけでなく、蒙を養う道である。知恵がまだ開かない状態を蒙という。純一で喜怒哀楽や欲望がまだ現れない幼い時に正しさを養うのが、聖人となる功である。年頃になって欲望が外に現れてから禁じても、さからいつかえて（扞格）勝ちがたい。蒙に正を養うのが最良の学問である。蒙の六爻のうち、二つの陽が蒙を治める者、四つの陰が蒙の中にある者である。</li></ul>\n<h3 id=\"g4-s3\">大象</h3>\n<div class=\"orig\">山下出泉、蒙。君子以果行育德。</div>\n<div class=\"yomi\">山の下に泉を出だすは蒙なり。君子以て行いを果たし徳を育つ。</div>\n<p>山の下にちょろちょろと泉が湧き出た形が蒙である。君子はこれにならって、行いを果断にし、徳を育てる。</p>\n<p><span class=\"tag\">程伝</span>山の下に泉が出て、険にあい、まだ行く所がない。蒙の象であり、人が幼くて行く所を知らないようなものである。君子は、水が出てまだすらすら流れないのを見て自分の行いを果断にし、湧き出たばかりでまだ向かう所がないのを見て自分の明徳を養い育てる。「明徳」は『大学』の「明徳を明らかにす」の明徳で、万人の持つ理性である。</p>\n<h3 id=\"g4-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>刑罰と教化。</b> 初六の程伝は、民を啓発するには、まず刑罰禁令を明らかにして示し、畏れを知らしめてから教え導くと説く。『論語』は「之を道びくに政を以てし、之を斉うるに刑を以てすれば、民免れて恥無し。之を道びくに徳を以てし、之を斉うるに礼を以てすれば、恥有り且つ格（ただ）し」と言うが、程伊川は、聖人は徳を尊んで刑を尊ばないとはいえ、どちらか一方に偏ってはならないとする。本田は、これは道徳ばかり重んじて刑罰を馬鹿にする態度への批判で、程伊川は一見こちこちの儒者のようでも決して非常識な人ではなく、天子に御進講する役に就いたこともあって現実の政治にも理解があった、と評している。</li><li><b>程伊川と朱子。</b> 程伊川は道学者で、易を教訓的に解釈したがる。百年後の朱子はほぼ伊川の注を踏襲したが、教訓的に過ぎる点には批判も加えている。朱子は、易は教訓よりも占いを主目的とした書だと考えた。</li><li><b>大象の「行いを果たし徳を育つ」。</b> 蒙は啓蒙・教育を説く卦である。徳を育てるのは教育だが、行いを果断にするというのは、爻辞に「人を刑するに利あり」「蒙を撃つ」と、わりあい烈しいところがあることによるのだろう。</li></ul>\n<h3 id=\"g4-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>再三筮を立てて占いを汚してはならない。一途な真心で初筮に問え。</li><li>教えは押しつけるものではなく、求められて授けるもの。</li><li>幼いうちに正しさを養え。</li><li>自分が愚かなら、賢い人に素直に任せ、教えを請え（六五）。賢い人から遠ざかれば恥をかく（六四）。</li></ul><h2 class=\"sec\" id=\"g4-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">發蒙、利用刑人、用說桎梏、以往吝。</span></summary><div class=\"body\"><div class=\"yomi\">蒙を発（ひら）く。用て人を刑するに利あり。用て桎梏（しっこく）を説（と）く。以て往けば吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「利用刑人、以正法也。」（用て人を刑するに利ありとは、以て法を正すなり。）</div>\n<p>愚かな者を啓発してやるがよい（発蒙は啓蒙と同じ）。人を刑罰するのによろしく、逆に人の枷（かせ）を解いてやるのによろしい。この爻が出たらビシビシやってよい。しかし、いつまでも厳しい態度で押し通せば恥をかく。「説」は「脱」と同じ。</p>\n<p><span class=\"tag\">程伝</span>初は陰で下にいる、下民の蒙である。下民の蒙を啓くには、まず刑禁を明らかにして示し、畏れを知らしめてから教え導く。昔から聖王の政治は、刑罰を設けて民をそろえ、教化を明らかにして風俗を善くした。刑罰が立ってこそ教化が行われる。政治の初めにはまず法を立て、蒙を治める初めに刑罰で威すのは、昏蒙の桎梏（拘束）を取り去るためである。その桎梏を取り去らなければ、どんな善い教えも入って行かない。刑禁で率いれば、心でまだわからなくても威を畏れて従い、昏蒙の欲をほしいままにしない。そうしてだんだん善道を知り、悪い心を改めれば、風俗を移し変えることができる。ただし刑罰だけで治めれば、蒙は畏れても啓かれず、民は免れさえすればよいと恥を知らない。だから、それで押し通せば恥ずべき結果になる。</p>\n<p><span class=\"tag\">象伝について程伝</span>蒙を治める初めに、越えてはならない関所を立て、その罪を明らかにする。これが法を正すことである。民を黙って従わせ、だんだん教化に至る。ある人が「いきなり刑罰を用いるのは『教えずして殺す、之を虐と謂う』（『論語』）ことにならないか」と問うた。答え：法を立て刑を制することこそ、教える手段なのである。後世の刑罰を論ずる者は、そのなかに教化があることを知らない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>最初は規律を厳しく示してよい。ただし厳しさ一本で押し通せば恥をかく。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">包蒙吉。納婦吉。子克家。</span></summary><div class=\"body\"><div class=\"yomi\">蒙を包（か）ぬ。吉。婦を納るるに吉。子、家を克（よ）くす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「子克家、剛柔接也。」（子、家を克くすとは、剛柔接すればなり。）</div>\n<p>あらゆる愚かな者を包容せよ。そうすれば吉。妻を娶るのに吉。子が父に代わって一家をよく治める。</p>\n<p><span class=\"tag\">程伝</span>包は含容である。二は蒙の世にいて、剛明の才があり、六五の君と応じ、中の徳も同じ。蒙を啓く任に当たる者である。包容を広くし、愚かな者を哀れんで（矜も哀と同じ）やれば、天下の蒙を啓き、蒙を治める功を成すことができる。卦に陽は二つしかなく、上九は剛に過ぎ、九二だけが剛中の徳で五に応じ、時に用いられる唯一の賢明な者である。もし自分の明を恃み、自負するばかりなら徳は広まらない。だから相手が柔弱で暗い婦人でも、その善い所を受け容れれば、自分の明も広くなる。諸爻がみな陰なので「婦」という。堯舜は誰も及ばない聖人だが、『書経』呂刑に「下民に清問す」とあるように、人々から善を取って自分の善とした。二が包み納れれば君の事を成し遂げられる。子がよく家を治めるようなものである。五は陰なので、蒙を啓く功はすべて二から出る。家で言えば五は父、二は子である。</p>\n<p>本田の講説：もともとの爻辞は妻を娶るという日常的な行為を言っているが、程伝は、愚かな婦人でもその善い所は受け容れよという教訓的な意味に解している。中国の古典では婦人は一段下がった存在とみるのが常識である。</p>\n<p><span class=\"tag\">象伝について程伝</span>子がよく家を治めるのは父の信任が専らだからで、二が蒙の功をつかさどるのは五の信任が専らだからである。二と五の剛柔の情が接しているので、剛中の道を行い蒙を啓く功を成すことができる。上下の情が接しなければ、二が剛中でもその事をつかさどれない。「尸（つかさど）る」の尸は、先祖の祭りで位牌の代わりに死者の幼い孫を上座に座らせ、供え物を食べさせた「かたしろ」のことで、そこから動詞として「つかさどる」と読む。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>寛く包容すれば吉。下の者の意見も受け容れよ。上から信じて任されてこそ事は成る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">勿用取女。見金夫、不有躬。无攸利。</span></summary><div class=\"body\"><div class=\"yomi\">用て女を取る勿れ。金夫を見て躬（み）を有たず。利する攸无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「勿用取女、行不順也。」（用て女を取る勿れとは、行い順ならざればなり。）</div>\n<p>結婚しようとする者がこのを得たら、その女を娶ってはならない。金のある男と見れば身持ちを忘れる女である。娶っても何の利もない。「金夫」は他の古典に用例がなく、当時の俗語だろう。</p>\n<p><span class=\"tag\">程伝</span>三は陰柔で蒙暗の中にいて、中でも正でもない、妄動する女である。正しい応（上九）は遠くて従えず、すぐ近くの九二が群蒙の帰する所となり時の盛りを得ているのを見て、正応を捨てて九二に従う。これが金夫を見るということである。女が人に従うには正しい礼によるべきなのに、金が多いのを見て喜んで従い、身を保てない。どこへ行っても利はない。</p>\n<p>本田の講説：卦の中心は五で君主、上は王弼の説では「無位の地」で隠遁者のような人で、うだつがあがらない。蒙に男は九二と上九しかいないが、九二は羽振りがいいので、六三は近くの九二になびくのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>このような女は行いがよこしまで素直でない。娶ってはならない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>目先の利になびく相手とは縁を結ぶな。何の利もない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">困蒙、吝。</span></summary><div class=\"body\"><div class=\"yomi\">蒙に困（くる）しむ。吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「困蒙之吝、獨遠實也。」（蒙に困しむの吝は、独り実に遠ざかればなり。）</div>\n<p>自分の蒙昧さゆえに難渋する。恥ずべきである。</p>\n<p><span class=\"tag\">程伝</span>四は陰柔で蒙暗にあり、剛明の親しい助けがない（応じる初も陰で引き合わない）。自分の蒙を啓くすべがなく、昏蒙に苦しむ者である。至って恥ずべきである。吝は不足の意味で、第三者から見て軽蔑すべき状態をいう。</p>\n<p><span class=\"tag\">象伝について程伝</span>蒙の時には陽剛が蒙を啓く者である。四は陰柔で、剛（九二）から最も遠い。愚蒙の人で賢者に近づかず、明を得るすべがない。恥ずべきなのは、自分ひとり賢明な人から遠ざかっているからである。賢者に親しめず困窮に至るのは、恥の甚だしいものである。「実」とは陽剛（九二）を指す。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>賢い人から遠ざかって迷う。恥ずべき状態。自ら賢者に近づけ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">童蒙、吉。</span></summary><div class=\"body\"><div class=\"yomi\">童蒙なり。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「童蒙之吉、順以巽也。」（童蒙の吉なるは、順にして以て巽（そん）なればなり。）</div>\n<p>まだ幼くて愚かな状態だが、結果は吉。</p>\n<p><span class=\"tag\">程伝</span>五は柔順で君の位にいて、下は九二と応じる。柔中の徳で剛明の才に任せるので、天下の蒙を治めることができる。だから吉。「童」とは、まだ知恵が開けず人の助けに頼るという点にたとえを取ったもの。人君がもし至誠をもって賢者に任せて功を成せば、自分から出た功と何の違いがあろう。自分はおとなしいが、家来がしっかりしていて、陰と陽でぴったり息が合っているのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>己を捨てて人に従うのが順、志を降して下に求めるのが巽（謙遜）である。このようであれば天下を治めて余裕がある。「優」はここでは「すぐれる」ではなく「余裕がある」の意味（「優游涵泳」の優。この熟語の出典は『論語』「七十にして心の欲する所に従いて矩を踰えず」の朱子の注「学者は当に優游涵泳すべし」で、「優游」の二字は『詩経』にすでにある）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の未熟を自覚し、素直に賢い人に任せれば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">擊蒙、不利爲寇、利禦寇。</span></summary><div class=\"body\"><div class=\"yomi\">蒙を撃つ。寇（あだ）を為すに利あらず。寇を禦ぐに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「利用禦寇、上下順也。」（用て寇を禦ぐに利ありとは、上下順なればなり。）</div>\n<p>愚か者をぶん殴れ。ただし、こちらから暴力をふるうのはよくない。敵の暴力を防ぐのがよい。本文は大変素朴な内容だが、程伝は教訓的である。</p>\n<p><span class=\"tag\">程伝</span>九は蒙の終わり、蒙の極みの時に当たる。人の愚蒙がすでに極まり、堯の時に苗民（三苗という部族。今も苗族という少数民族がいる）が従わなかったように、寇をなし乱をなす者である。これは討伐してよい。しかし九は上にいて剛が極まり中を得ていないので、「寇を為すに利あらず」と戒める。人の蒙を治めるのは寇を防ぐことであり、ほしいままに乱暴をするのは寇をなすことである。舜が有苗（有は接頭語）を征し、周公が三監を誅したのは寇を防いだのであり、秦の始皇帝・漢の武帝が地の果てまで兵を出して周りの国々を従えたのは寇をなしたのである。</p>\n<p>本田の講説：殷を倒した周の武王は早く死に、子の成王はまだ赤ん坊だったので、武王の弟の周公が摂政をした。摂政という言葉はこの故事に始まる。周公は成王を背負って実際に玉座に即いたので、臣下たちは周公に野心があるのではと疑った。三監は周公が殷の遺民を治めるために置いた役で、一人は殷の王子、あとの二人は周公の弟であったが、ともに反乱を起こした。</p>\n<p><span class=\"tag\">象伝について程伝</span>上に対しては乱暴すぎず、下に対しては相手の蒙を撃ち去ることができる。上下ともに順を得ている。これが寇を防ぐことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>どうしてもわからない者には厳しく臨んでよい。ただし度を越えた攻撃は自分が害をなすことになる。守りに徹せよ。</div></div></details><div class=\"pager\"><a href=\"#gua-3\">← 水雷屯</a><a href=\"#gua-5\">水天需 →</a></div>", "gua-5": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 5 卦　第十五講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水天需</div><div class=\"yo\">すいてんじゅ</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-5\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-5\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-5\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-5\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-5\" data-jump=\"s4\">占いの心得</a><a class=\"chip\" href=\"#gua-5\" data-jump=\"yao\">六爻</a></div><h3 id=\"g5-s0\">卦の名と象</h3>\n<p>需は「用いる」「待つ」という意味である。</p>\n<p>程伝（序卦伝を引く）：「蒙とは蒙かなり、物の穉きなり。物穉ければ養わざる可からざるなり。故に之を受くるに需を以てす。需とは飲食の道なり」。幼いものは必ず養いを待って成長し、物を養うのに最も必要なのは飲食である。だから需は飲食の道である。</p>\n<ul class=\"sen\"><li>卦の形は、雲が天の上にある。天上に湿気が集まって物を潤すシンボルで、飲食は物を潤し益するものだから、飲食の道とする。</li><li>卦の大意は「須（ま）つ」である。下卦の乾は剛健で必ず進もうとするものだが、坎（険）の下にいる。険がその進みを阻むので、しばらく待ってから進む。</li><li>本田によれば、「需」は「濡」「儒」「懦」などの旁になり、いずれも「グズグズする」というニュアンスがある。序卦伝は、人が最も必要とし、それがなければ生命を保てないものというシンボルを取って飲食とした。</li></ul>\n<h3 id=\"g5-s1\">卦辞</h3>\n<div class=\"orig\">需、有孚、光亨。貞吉。利涉大川。</div>\n<div class=\"yomi\">需は、孚（まこと）有れば、光（かがや）き亨る。貞しくして吉。大川を渉るに利あり。</div>\n<p>占う人に誠があれば、輝いて願いは大いに通る。正しくて結果は吉。冒険をしてもよい。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>需は須（待つ）である。上下の卦で言えば、乾は剛健で上へ進もうとするが、上の坎（険）にあってまだ進めない。だから待つ意味になる。</li><li>爻で言えば、九五が君の位にいて需の主であり、剛健中正の徳があって誠信が中に充実している。これが「孚有り」である。誠があれば光明でよく通じ、貞正を得て吉。この徳で待てば、何が得られないことがあろう。険があっても難しくない。だから大川を渡るに利がある。</li><li>『易経』の「貞吉」には二通りある。それ自体が正しいから吉である場合と、正しさを得るならば吉であるという場合で、区別すべきである。</li></ul>\n<p>本田の講説：概括的に言えば、陰はだいたい小人・悪しきもの、陽は君子・善きものである。九五は上卦の中にいて陽だから善で、善なるものが真ん中にいるので、真心が内に充実した形と言える。</p>\n<h3 id=\"g5-s2\">彖伝</h3>\n<div class=\"orig\">需、須也。險在前也。剛健而不陷、其義不困窮矣。需有孚、光亨貞吉、位乎天位、以正中也。利涉大川、往有功也。</div>\n<div class=\"yomi\">需は須なり。険、前に在るなり。剛健にして陥らず、其の義困窮せず。需は孚有れば光き亨る、貞しくして吉とは、天位に位し、正中を以てなり。大川を渉るに利ありとは、往けば功有るなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>険が前にあって、にわかに進むことはできないから、待って行く。乾の剛健さを持ちながら、よく待って軽々しく動かない。だから険に陥らず、困窮に至らない。剛健な人の動きは必ず軽々しく騒がしいものだが、よく自分を押さえて待ってから動くのは、これに処する至善の道である。だから孔子は「其の義困窮せず」とたたえた。</li><li>五は剛実で中にいる。中が実なのは孚の象である。しかも需（酒食）が得られる（九五の爻辞に「酒食」が出る）。これもまた実がある、願いがかなうという意味である。乾の剛健で至誠だから、徳は輝いてよく通じ、正しくて吉。「天位に位す」は五を指し、「正中を以て」は二も兼ねて言う（二は中だが陽が偶数位で正ではない。本田は、程伊川はこの点を軽く見ていると指摘する）。</li><li>すでに孚があって正しければ、険を踏み越えても進めば功がある。これが需の道の至りである。乾の剛健で、険を見て止まり待つことができる。何の利がないことがあろう。</li></ul>\n<h3 id=\"g5-s3\">大象</h3>\n<div class=\"orig\">雲上於天、需。君子以飲食宴樂。</div>\n<div class=\"yomi\">雲、天に上るは需なり。君子以て飲食宴楽す。</div>\n<p>雲が天の上に立ちこめて、まだ雨にならない形が需である。君子はこれを見て、飲食し、宴会して楽しみながら時を待ち、まっすぐ前進しようとはしない。大象には必ず「君子以て」（君子はこの卦のシンボルに従って）という文句がつく。</p>\n<p><span class=\"tag\">程伝</span>雲の気がむしむしと天に昇る。必ず陰陽が和して満ちるのを待って初めて雨となる。雲が天に上ったばかりでまだ雨にならないので、待つ意味になる。君子が才徳を蓄えて、まだ世に施していないようなものである。君子はこの象を見て、道徳を胸に抱き、安んじて時を待ち、飲食して気力・体力を養い、宴楽して心を和らげる。『中庸』に言う「君子は易きに居りて以て命を俟つ。小人は険を行いて以て幸いを徼（もと）む」である。</p>\n<h3 id=\"g5-s4\">占いの心得</h3>\n<ul class=\"sen\"><li>前に危険がある。急いで進まず、誠を抱いて時を待て。待てば必ず通じる。</li><li>ただ待つだけでなく、飲み食い楽しみながら英気を養って待つ。</li><li>待つことの意味は、時を見て動くことにある。絶対に進むなという意味ではない（九三の程伝）。</li><li>招かれざる客が来ても、敬意をもって迎えれば最後は吉（上六）。</li></ul><h2 class=\"sec\" id=\"g5-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">需于郊。利用恆。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">郊（こう）に需つ。恒を用うるに利あり。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「需于郊、不犯難行也。利用恆无咎、未失常也。」（郊に需つとは、難を犯して行かざるなり。恒を用うるに利あり咎无しとは、未だ常を失わざるなり。）</div>\n<p>郊外で待っている。いつもの行いを守るのに利がある（まだ冒険はできない）。そうすれば咎はない。</p>\n<p><span class=\"tag\">程伝</span>需は険に遭うので待ってから進む卦である。初は険から最も遠いので「郊に需つ」という。郊は広々として遠い所。遠くにいて、安んじて常を守るのがよく、そうすれば咎はない。常に安んじられなければ、騒がしく動いて難を犯し、遠くで待って咎を免れることもできなくなる。</p>\n<p><span class=\"tag\">象伝について程伝</span>郊にいる者は険難を犯して行かない。陽は剛健で上へ進もうとするものだが、初は遠い地でよく待ち、険を犯さない。さらに安らかに居て常を失わなければ咎はない。足は踏み出さなくても気持ちだけ動いている者は、常に安んじることができない。君子が時を待つ時は、安静にして志を守り、心安らかにそのまま一生を終えてもよいという気持ちでいる。それでこそ常を用いると言える。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>まだ危険から遠い。焦らず、いつもの通りに過ごしていれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">需于沙。小有言。終吉。</span></summary><div class=\"body\"><div class=\"yomi\">沙（すな）に需つ。小しく言有り。終に吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「需于沙、衍在中也。雖小有言、以終吉也。」（沙に需つとは、衍（ゆたか）にして中に在るなり。小しく言有りと雖も、吉を以て終うるなり。）</div>\n<p>川べりの砂浜で待っている（後漢の鄭玄のテキストでは「沙」が「沚」（水際）になっている）。少し人から物言いがつくが、最後には良い結果が得られる。</p>\n<p><span class=\"tag\">程伝</span>坎は水で、水に近ければ砂がある。二は険にだんだん近づいたので「沙に需つ」という。まだ害には至らないが、すでに少し物言いがついた。難儀を示す言葉には大小があり、小さなものとして「言有り」がある。言葉で傷つけられるのは至って小さな難儀である。二は剛陽の才で柔（陰の位）にいて、中を守り、ゆったりと身を処している。これは待つことの善きものである。険には近づいたがまだ陥っていないので、少し言葉の傷があっても大害はなく、最後には吉を得る。</p>\n<p><span class=\"tag\">象伝について程伝</span>「衍」はゆったりと余裕があること。二は険に近いが、寛やかに中にいるので、少し言われても終に吉を得る。よく身を処する者である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険が近づき、多少の陰口や物言いはあるが、ゆったり構えて中庸を守れば最後は吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">需于泥。致寇至。</span></summary><div class=\"body\"><div class=\"yomi\">泥に需つ。寇の至るを致す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「需于泥、災在外也。自我致寇、敬愼不敗也。」（泥に需つとは、災い外に在るなり。我より寇を致す、敬慎すれば敗れざるなり。）</div>\n<p>泥の中でじっとしている。敵が攻めて来る結果を招く。判断は少し良くない。</p>\n<p><span class=\"tag\">程伝</span>泥は水（上卦）に迫っている所。進んで険に迫ったので、寇難の至るのを招く。三は剛で中を得ず、しかも健体（乾）の一番上にいて、進んでやまない形がある。だから寇を招く。もし身を慎まなければ失敗する。</p>\n<p><span class=\"tag\">象伝について程伝</span>三は上卦の険にひどく近いので「災い外に在り」という。災は患難の通称で、天災の「眚」と分ければ、災は自分から招いたものである。三が寇を招くのは自ら進んで迫るからで、だから「我より」という。もし敬慎して時のよろしきを量って進めば、敗れることはない。需の時は待ってから進む時であり、その意味は時を見て動くことにある。絶対に進むなと戒めているのではない。ただ慎んで宜しきを失わないよう戒めているのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険に近づきすぎて敵を招く。自ら招いた災いである。慎めば失敗しない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">需于血。出自穴。</span></summary><div class=\"body\"><div class=\"yomi\">血に需つ。穴より出づ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「需于血、順以聽也。」（血に需つとは、順にして以て聴（したが）うなり。）</div>\n<p>すでに危険の中に足を踏み入れ、血だまりの中で立ち止まる。安全な隠れ家から出てしまった。程伝は「穴」を物の安んずる所と解し、王弼などは落とし穴と解する。</p>\n<p><span class=\"tag\">程伝</span>四は陰柔の質で険の中にいて、下からは三陽が進んで来るのに当たる。険に傷つく者である。だから「血に需つ」という。険に傷ついては安らかにいられず、必ず居場所を失う。だから「穴より出づ」という。しかし柔順に時に従い、険難と競わなければ凶には至らない。柔が陰の位にいて、競える者ではない。もし陽がここにいれば、中正の徳なく、いたずらに剛で険と競うので必ず凶である。</p>\n<p><span class=\"tag\">象伝について程伝</span>四は陰柔で険の中にいて、じっとしていられないので、退いて穴から出る。陰柔では時と競えない。いられなければ退く。素直に時に従うから、凶には至らない。「聴」は聞き入れることから「従う」の意味にもなる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険の中で傷つく。抗わず、素直に退いて時に従えば凶には至らない。</div></div></details><d
