ろうと言う）。凶。</p>\n<p><span class=\"tag\">程伝</span>鳥は飛び上がって高い所にいるものである。上九は不中で最も高い所にいて、また離の体（炎上）で、その高ぶりは知るべきである（亢は乾の上九「亢龍悔あり」の亢）。だから鳥の象を取る。旅では謙降柔和であって初めて身を保てるのに、上九は剛に過ぎ自ら高しとし、安んずべき所を失う。巣は鳥の安んじ止まる所で、「巣を焚く」とは安んずる所、止まる所を失うことである。離の上にいるので焚く象となる。陽剛で至高にいて、始めはいい気持ちなので先に笑う。やがて安んずる所を失い、味方もないので泣き喚く。軽易でその順徳を喪う、凶であるゆえんである。牛は順の物で、「牛を易きに喪う」とは、油断・安易でその順を失うことである。離の火は上に燃え上がるので、軽易の象となる。「旅人」の字を加えるのは、「鳥其の巣を焚く」を承けているからで、加えなければ鳥が笑い泣くことになる。</p>\n<p><span class=\"tag\">象伝について程伝</span>旅でありながら一番上にいて、尊高に自らを置く。どうしてその居を保てよう。義として巣を焚かれることがある。剛で極にいて自ら高ぶり、志を得たと思って笑うが、軽易で順徳を喪っていることを知らない。「終に之を聞く莫し」とは、最後まで自分で気づかないということである。自覚していれば、泣き喚くところまでは至らない。陽剛不中で極にいるので、もともと高ぶり騒がしく動く象があり、しかも火が炎上するので、その害はさらに甚だしい。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高ぶって居場所を焼き、初めは笑っても後に泣く。油断して素直さを失い、本人は気づかない。凶。</div></div></details><div class=\"pager\"><a href=\"#gua-55\">← 雷火豊</a><a href=\"#gua-57\">巽為風 →</a></div>", "gua-57": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 57 卦　第六十四講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">巽為風</div><div class=\"yo\">そんいふう</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-57\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-57\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-57\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-57\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-57\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-57\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-57\" data-jump=\"yao\">六爻</a></div><h3 id=\"g57-s0\">卦の名と象</h3>\n<p>巽の字は、机の上に二人の人が神前にひざまずいている形で、お供えの意味。饌と同じである。謙遜の遜とまったく同音で、「へりくだる」という意味もある。卦の徳としては「入る」「へりくだる」という。受講者が「巽にはどうして入るという意味があるのか」と問うと、本田は、巽の卦は風のシンボルで、風はどこにでも入るところから「入る」という意味が出てきた、と答えた。上下とも同じ巽の卦を二つ重ねてある。</p>\n<p>程伝（序卦伝を引く）：「旅にして容るる所无し。故に之を受くるに巽を以てす。巽とは入るなり」。旅の時は親しむ者が少ない。巽順でなければどうして受け入れられよう。かりそめにも巽順であれば、旅に困しむなかでも、どこへ行っても入れないことはない。巽が旅に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は、一陰が二陽の下にあり、陽に巽順している。だから巽という。</li></ul>\n<h3 id=\"g57-s1\">卦辞</h3>\n<div class=\"orig\">巽、小亨。利有攸往。利見大人。</div>\n<div class=\"yomi\">巽は小しく亨る。往く攸有るに利あり。大人を見るに利あり。</div>\n<p>この卦が出たら少し願いが叶う。前進してよろしい。偉大な人物に出会えば利益がある。</p>\n<p><span class=\"tag\">程伝</span>卦の才によって、少し亨り、往く所あるに利があり、大人を見るに利がある。巽と兌はいずれも剛（九五・九二）が中正を得ており、意味もよく似ている。しかし兌は「亨る」、巽は「小しく亨る」と限定がつく。兌は陽のしわざで、巽は陰のしわざだからである（初が陽か陰かで卦の主体を見る）。兌は柔が外にあり、用が柔である。巽は柔が内にあり、性が柔である。だから巽の亨りは小さい。</p>\n<h3 id=\"g57-s2\">彖伝</h3>\n<div class=\"orig\">重巽以申命。剛巽乎中正而志行。柔皆順乎剛。是以小亨。利有攸往、利見大人。</div>\n<div class=\"yomi\">重巽以て命を申（かさ）ぬ。剛、中正に巽って志行わる。柔皆な剛に順う。是を以て小しく亨る。往く攸有るに利あり。大人を見るに利あり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「重巽」とは上下ともに巽であること。上は道に順って命令を出し、下は命令を奉じて順従する。上下ともに順、重巽の象である。また重は重複の義で、君子は重巽の義を体して命令を丁寧に繰り返す。「申」は重複、丁寧の意味である。</li><li>卦の才で言う。陽剛（九五）が巽にいて中正を得ており、中正の道に巽順する。陽の性は上がることで、その志は中正の道によって上り行くことにある。上下の柔（初六・六四）がみな剛に巽順する。卦の才がこのようなので、内が柔でも少し亨ることができる。</li><li>巽の道は、入らない所がない。だから往く所あるに利がある。巽は善道だが、必ず従うべき相手を知らねばならず、陽剛中正の人に巽従すれば利がある。だから大人を見るに利がある。五・二の中正のような者が大人である。巽順が大人に対してでなければ、過ちとならないとは限らない。</li></ul>\n<p>本田の講説：受講者が「初と四はどの爻に順うのか」と問うと、「初は二、四は五に順う」と答えた。「それぞれ身分が下だから順うのは当然では」と問われると、それはそうだが、程伝を見ると四は五だけでなく三にも二にもへりくだる。初は奇数の位で本来強い位置にいながら、上の陰位の二にへりくだる、それがよいということだ、と答えた。「下が上にへりくだらない下克上というのはあるのか」には、有り得る、陰陽の位で言えば初は本来陽のはずで、それが初六という時点ですでにへりくだっている、と答えた。</p>\n<h3 id=\"g57-s3\">大象</h3>\n<div class=\"orig\">隨風、巽。君子以申命行事。</div>\n<div class=\"yomi\">随風は巽なり。君子以て命を申ね、事を行う。</div>\n<p>風が二つ続いて吹く形が巽である。風は草をなびかせ、どこにでも入り込む。『論語』に「君子の徳は風、小人の徳は草。草之に風を上うれば必ず偃す」とある。上に立つ者はこれにかたどって、命令を反復し周知させた上で政治を行う。</p>\n<p><span class=\"tag\">程伝</span>両つの風が相重なるのが随風である。「随」は相継ぐ義である。君子は重巽が相継いで順である象を観て、命令を重ね、政事を行う。随と重はともに上下みな順う意味である。上は下に順って命令を出し、下は上に順ってこれに従う。上下みな順うのが重巽の義である。命令・政事が理に順えば、民心に合して民は順従する。</p>\n<h3 id=\"g57-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>進退はうろうろすること。</b> 受講者が「進退自由と言えば何かいいことのように思うが」と言うと、本田は、易の場合、進退と言えばうろうろするという意味で、よくない、と答えた。</li><li><b>史巫と祝詞。</b> 九二の「史巫」について、史は祝詞を上げる人、巫は神様が乗り移るシャーマンである。史といえば歴史編纂家だが、神に仕える時に祝詞を上げる役目もし、「史祝」と熟する場合がある。受講者が「中国に祝詞があるのか」と問うと、「神様に告げる言葉はある」と答えた。</li><li><b>狩り。</b> 六四の「田して三品を獲る」について、受講者が「比喩か」と問うと「比喩。功徳が上下に及ぶという」と答えた。「田は狩りか、よく出てくる」には、広く取ればどの季節でも狩りを言い、細かく分けると田は冬の狩り、春・秋の狩りが蒐だという、と答えた。「この頃の中国人は狩猟か」には、「いや、もう農耕に入っている。狩猟もしょっちゅうやっていることはやっている」と答えた。</li><li><b>よくわからない卦。</b> 巽の卦と次の兌の卦はあまりよくわからない、朱子も疑っている、と本田は言う。どちらもあまり良い卦ではない。</li></ul>\n<h3 id=\"g57-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>へりくだって少し願いが通る時。前進してよく、優れた人物（大人）に従えば利益がある。</li><li>ただし、へりくだる相手を選べ。大人に対してでなければ過ちとなりうる。</li><li>へりくだりすぎて迷うな。武人のような強い志を持て（初六）。</li><li>謙遜が誠意から出ていれば、卑屈に見えても吉（九二）。</li><li>無理に取り繕った謙遜は何度も失敗する（九三）。</li><li>命令や方針を変える時は、前後をよく考え丁寧に（九五）。</li><li>謙遜も度を越せば決断力を失い凶（上九）。</li></ul><h2 class=\"sec\" id=\"g57-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">進退。利武人之貞。</span></summary><div class=\"body\"><div class=\"yomi\">進み退く。武人の貞に利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「進退、志疑也。利武人之貞、志治也。」（進み退くは志疑えばなり。武人の貞に利ありとは、志治まるなり。）</div>\n<p>進んでみたり退いてみたり、どうしてよいか迷っている。武人のような強い志があればよろしい。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔で、巽の卦の最も低い所にいて、中を得ず、上に剛（九二）を承けている。巽に過ぎる者である。陰柔の人が卑巽に過ぎれば、志は恐れて不安になり、進んだり退いたりして従う所を知らない。その利とするところは武人の貞にある。武人の剛貞の志を用いれば宜しい。自らを励まして剛貞をなせば、卑屈に過ぎ恐れ畏れる失はなくなる。</p>\n<p><span class=\"tag\">象伝について程伝</span>進退して安んずる所を知らないのは、志が疑い懼れているからである。武人の剛貞を用いて志を立てれば、志は治まる。「治まる」とは、しゃんと修め立つことである。</p>\n<p>本田の講説：受講者が「進退自由と言えば何かいいことのように思うが」と言うと、易の場合、進退と言えばうろうろするという意味でよくない、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>迷って進退が定まらない。思い切って武人のように強い志を立てよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">巽在牀下。用史巫紛若。吉无咎。</span></summary><div class=\"body\"><div class=\"yomi\">巽のとき牀下に在り。史巫を用うること紛若たり。吉にして咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「紛若之吉、得中也。」（紛若の吉なるは、中を得ればなり。）</div>\n<p>へりくだるべき時に、卑屈に過ぎて寝台の下に潜っている。神に誠を告げるのに、神主や巫女を数多く用いる。そうすれば吉で咎はない。「史巫を用うること紛若」がおもしろい。史は祝詞を上げる人、巫は神様が乗り移るシャーマンである。</p>\n<p><span class=\"tag\">程伝</span>二は巽の時にいて、陽で陰位にいて、しかも下にいる。巽に過ぎる者である。牀は人の安んずる所で、その下にいるのは巽に過ぎ、安んずる所を過ぎたのである。人が巽に過ぎるのは、恐れ怯えるのでなければ諂い悦ばせることで、どちらも正しくない。二は実は剛中で、巽の体で柔位にいるので巽に過ぎるとはいえ、邪心があるのではない。恭巽が過ぎるのは正しい礼ではないが、恥辱から遠ざかり、怨咎を絶つことができ、これも吉道である。史巫とは誠意を神に通じる者で、紛若は多いこと。至誠をもって巽に安んじ、その誠意を通じる者を多くすれば、吉で咎はない。その誠が人を動かすに足るということである。人はその誠意を察せず、過度の巽を諂いとみなすからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>二は柔位にいて下にいるので巽に過ぎる象だが、誠意を通じる者を多くして紛然とさせられるのは、中を得ているからである。陽が中にいるのは中が実で誠実の象である。中が誠であれば人は自ら信じる。誠意をもってすれば諂いや恐れではない。だから吉で咎がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>へりくだりすぎるほどだが、真心があるので、それが人に通じるよう尽くせば吉で咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">頻巽。吝。</span></summary><div class=\"body\"><div class=\"yomi\">頻（しき）りに巽う。吝し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「頻巽之吝、志窮也。」（頻りに巽うの吝しきは、志窮まればなり。）</div>\n<p>努めて人にへりくだるが、何度も失敗する。恥ずかしい。「頻りに」の読みには異説があり、唐の孔穎達の『周易正義』は顰蹙の「顰」と同じに読み、「顰みつつ巽う」、上に六四に乗られて屈辱的だが顔をしかめながら従う意味に取る。ただし「しきりに」の読みの方が普遍的である。</p>\n<p><span class=\"tag\">程伝</span>三は陽で剛位にいて中を得ず、下体の上にいる。剛亢の質で巽の時にいるので、よく巽う者ではなく、努めてそうするので、しばしば失敗する。巽の時に下体にいて、上に巽が臨み、四は柔巽で親しんでくる。乗っている者（九二）も剛で、上にはまた重剛（九五・上九）がある。巽うまいとしてもできようか。だからしばしば失敗してはしばしば巽う。吝である。</p>\n<p>本田の講説：受講者が「どうしてこれは失敗するのか」と問うと、あまりに強すぎる性質で、下半分の一番上という割に危険な地位にいる、どの卦も下から三番目・四番目は多少危険なところがあった、またすぐ下の乗っている相手も陽で、少し上り詰めた感じがある、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>三の本質はもともと巽えるものではない。上に巽が臨み、重剛を承けて剛に乗るので、勢いとして志を行えない。だからしばしば失ってはしばしば巽う。その志が窮まって甚だ吝である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>無理をして取り繕った謙遜は何度も失敗し、恥をかく。本心から出ない従順は続かない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">悔亡。田獲三品。</span></summary><div class=\"body\"><div class=\"yomi\">悔い亡ぶ。田（かり）して三品を獲たり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「田獲三品、有功也。」（田して三品を獲たりとは、功有るなり。）</div>\n<p>あるべき後悔はなくなる（陰が陰位にいて、へりくだることのほどよさを得ているから）。狩りをすれば三種の獲物が獲られる。</p>\n<p><span class=\"tag\">程伝</span>陰柔で下に援けがなく（初と陰同士で引き合わない）、承ける者も乗る者もみな剛（九五・九三）である。悔いがあって当然である。しかし四は陰で陰位にいて巽の正を得ている。上体の下にいて、上にいながらよく下る。上の下にいるのは上に巽うこと、巽をもって下に臨むのは下に巽うことである。よく処することこのようなので、悔いが亡ぶ。悔いが亡ぶのは、田して三品を獲るようなものである。「田して三品を獲る」とは、上下にあまねく及ぶことである。狩りの獲物は三つに分け、一つは乾豆（祭りの干し肉）、一つは賓客と充庖（君主の食膳）、一つは徒御（家来）に分ける。四はよく上下の陽に巽い、三品を獲たように、あまねく上下に及ぶ。四の地はもともと悔いがあるが、処し方が善いので悔いが亡び、しかも功がある。天下の事は、よく処すれば悔いが時に功となることがある。</p>\n<p><span class=\"tag\">象伝について程伝</span>上下に巽い、田して三品を獲たように、あまねく上下に及ぶ。巽の功を成すのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上下を強い者に挟まれた難しい立場だが、上にも下にもへりくだれば、後悔は消え、皆に行き渡る成果を得る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">貞吉悔亡。无不利。无初有終。先庚三日、後庚三日、吉。</span></summary><div class=\"body\"><div class=\"yomi\">貞にして吉、悔い亡ぶ。利あらざる无し。初め无くして終り有り。庚に先だつこと三日、庚に後るること三日、吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九五之吉、位正中也。」（九五の吉なる、位正中なればなり。）</div>\n<p>動機が正しければ吉で、悔いもなくなる。何の不利もない。初めはよくないが、有終の美を遂げられる。命令を変更する場合は、その前後三日ずつ丁寧に言い聞かせよ。「庚」は変更の「更」と同じ。吉。</p>\n<p><span class=\"tag\">程伝</span>五は尊位にいて巽の主で、命令の出る所である。中正にいて巽の善を尽くしている。しかし巽は柔順の道で、利するところは貞にある。五に不足があるのではないが、巽においては戒めるべきである。貞であれば吉で悔いが亡び、利あらざる所はない。貞とは正中である。巽にいて命令を出すには、みな中正をもって吉とする。巽で貞でなければ悔いがあり、どうして利あらざる所なしと言えよう。命令を出せば変更がある。「初め无し」とは始めが善くないこと、「終り有り」とは改めて善くすることである。始めから善ければ、命令を重ねる必要も改める必要もない。「先庚三日、後庚三日、吉」とは、命令を出して変更する道はこのようであるべきだということである。蠱の卦で甲は事の端（始め）とした。庚は変更の始めである。十干では戊己が中で、中を過ぎれば変ずる。だから庚という。事を改めるには、始めを原ね終わりを要めて（繋辞伝に「易の書たるや、始めを原ね終りを要め、以て質と為すなり」）、蠱の先甲後甲の義のようにすべきである。そうすれば吉である。（蠱の「先甲三日、後甲三日」は物事を始める時に前後三日よく考えよという意味であった。）</p>\n<p><span class=\"tag\">象伝について程伝</span>九五が吉なのは正中にいるからである。正中の道を得れば吉で悔いが亡ぶ。正中とは過ぎず及ばず、まさにその中を得ることである。柔巽にいることも、命令を出すことも、ただ中を得ることを善とする。中を失えば悔いがある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>初めはうまくいかなくても、正しい心で改めれば終わりは良い。方針を変える時は前後をよく考え、丁寧に周知せよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">巽在牀下。喪其資斧。貞凶。</span></summary><div class=\"body\"><div class=\"yomi\">巽って牀下に在り。其の資斧を喪う。貞において凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「巽在牀下、上窮也。喪其資斧、正乎凶也。」（巽って牀下に在り、上にして窮まるなり。其の資斧を喪う、正ならんや、凶なり。）</div>\n<p>へりくだって寝台の下にひれ伏す。もともと持っていた斧（決断を意味する）を失う。正しい道において凶。象伝の読みでは「正ならんや、凶なり」と読ませるが、程伊川は「貞において凶」と読む。</p>\n<p><span class=\"tag\">程伝</span>牀は人の安んずる所で、「下に在る」は安んずる所を過ぎる義である。九は巽の極にいて、巽に過ぎる者である。資は所有するもの、斧は断ち切るものである。陽剛はもともと決断力があるが、巽に過ぎてその剛断を失い、所有するものを失う。「資斧を喪う」である。上にいて巽に過ぎ、自失するに至るのは、正道において凶である。</p>\n<p><span class=\"tag\">象伝について程伝</span>牀の下にいるのは巽に過ぎることで、卦の上にいて巽が極に至ったのである。上にいて巽に過ぎ自失するに至る、正と言えようか。凶道である。巽はもともと善行なので、象伝の作者は一旦これを疑って「正と為すを得んや」と問い、さらに断じて「乃ち凶なり」と言った。本田によれば、この「乃ち」は逆接（not but の意味）である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>へりくだりすぎて決断力を失い、自分を見失う。卑屈は凶。</div></div></details><div class=\"pager\"><a href=\"#gua-56\">← 火山旅</a><a href=\"#gua-58\">兌為沢 →</a></div>", "gua-58": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 58 卦　第六十四講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">兌為沢</div><div class=\"yo\">だいたく</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-58\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-58\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-58\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-58\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-58\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-58\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-58\" data-jump=\"yao\">六爻</a></div><h3 id=\"g58-s0\">卦の名と象</h3>\n<p>兌の字は、ひざまずいている人の上に口があり、口から息が出ている形である。「兌」は言偏をつけた「説」の字と同じで、言う、あるいはよろこぶの意味。「悦」は後からできた字で、『論語』にはなかったから、よろこぶの意味でも「説」を使っている。程伝には述べていないが、一説によれば兌は「無言の説」であるという。咸が「無心の感」であるのに対応して、兌は無言の喜ばせ方だというのである。上下とも同じ兌の卦を二つ重ねてある。</p>\n<p>程伝（序卦伝を引く）：「巽とは入るなり。入りて後之を説ぶ（あるいは説ばす）。故に之を受くるに兌を以てす。兌とは説ぶなり」。相手の心に入り込めば相手を喜ばせることができ、互いが喜べば相手の心に入ることができる。兌が巽に次ぐゆえんである。</p>\n<h3 id=\"g58-s1\">卦辞</h3>\n<div class=\"orig\">兌、亨。利貞。</div>\n<div class=\"yomi\">兌は亨る。貞しきに利あり。</div>\n<p>この卦が出たら願いごとはすんなりと通る。動機が正しければ利益がある。</p>\n<p><span class=\"tag\">程伝</span>兌は説である。説は亨るを致す道である。よく物を説ばせれば、物も説んで味方しないことはないので、亨るを致すに足る。しかし説びをなす道は貞正であることが利である。道に背いて説びを求めれば、邪な諂いで、悔咎がある（「咎」はあるテキストでは「悔」になっているが、どちらでもよい）。だから「貞しきに利あり」と戒める。</p>\n<h3 id=\"g58-s2\">彖伝</h3>\n<div class=\"orig\">兌、説也。剛中而柔外、説以利貞。是以順乎天而應乎人。説以先民、民忘其勞。説以犯難、民忘其死。説之大、民勸矣哉。</div>\n<div class=\"yomi\">兌は説なり。剛中にして柔外なり。説んで以て貞しきに利あり。是を以て天に順いて人に応ず。説んで以て民に先だつときは、民其の労を忘る。説んで以て難を犯すときは、民其の死を忘る。説の大なる、民勧むかな。</div>\n<p>兌は喜ぶ・喜ばすという意味である。陽が内側（二・五）にあり、陰が外側にある。外面が柔らかいから人を喜ばせ、強いものが内にあるから動機の正しさに利がある。だから天理に適い、人の心に適う。民を喜ばせる仕方で民の先頭に立てば、民は労苦を忘れる。民を喜ばせる仕方で戦場の先頭に立てば、民は死を恐れない。民を喜ばす道の偉大なること、民はいかに励むことか。本田は、この彖伝の文句は非常に力強い、「天に順いて人に応ず」は革の彖伝と同じ文句だ、と言う。</p>\n<p><span class=\"tag\">程伝</span>兌は説である。一陰が二陽の上にいて、陰が陽を説び、陽に説ばれる。陽剛が中にいるのは中心が誠実である象、柔爻が外にあるのは物に接するのに和柔である象である。だから説んでよく貞しい。「貞しきに利あり」とは、説の道は正しくあるべきだということで、卦に剛中の徳があるので、よく貞しい。説んで貞しいので、上は天理に順い、下は人心に応じる。説道の至正至善である。道に違って百姓の誉れを求めるような者は、かりそめに説ばせる道で、道に違い天に順わない。誉れを求めるのは人に応ずることではなく、一時の説びを取るだけで、君子の正道ではない。君子の道は民を説ばせること天地の施しのようで、その心を感じさせ、説服して厭うことがない（「斁」は厭う意味で、『詩経』葛覃に出てくる）。だからこれで民に先立てば、民心は説び従って労苦を忘れ、これで民を率いて難を犯せば、民心は義に説服して死を恐れない。説道の大きさに、民は勧まない者はない。勧とは信じて努めて従うことである。人君の道は人心を説服させることを根本とする。だから聖人はその大きさを称えたのである。</p>\n<h3 id=\"g58-s3\">大象</h3>\n<div class=\"orig\">麗澤、兌。君子以朋友講習。</div>\n<div class=\"yomi\">麗沢は兌なり。君子以て朋友講習す。</div>\n<p>沢と沢が二つ連なって水脈が通い合い、互いに相手を潤して、両方の水量がいよいよ豊かになる。君子はこれにかたどって、友達同士寄り集まって勉強し合う。朋は同門、友は同志である。受講者が「麗沢大学の麗沢ですか」と問うと、本田は「そう。麗沢大学の語源」と答えた。</p>\n<p><span class=\"tag\">程伝</span>「麗沢」とは二つの沢が附麗することである。両沢が相麗き、交々浸潤し合い、互いに滋益する象がある。だから君子はその象を観て朋友講習する。講習とは互いに益し合うことである。先儒は「天下の説ぶべきもので朋友講習に若くはない」と言った。朋友講習はもとより説ぶべきものの大なるものだが、さらに相益す象を明らかにすべきである。</p>\n<p>本田の講説：この「先儒」が誰を指すのか、素直に考えれば孔子とも考えられるが、程伊川は孔子をたいてい「聖人」と呼んでいて、「先儒」という言い方は今まであまりしなかった。喜ぶべきものの代表として朋友講習をあげ、喜びがあるだけでなく互いを利益することを明らかにすべきだ、というのである。</p>\n<h3 id=\"g58-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>二字だけの爻辞。</b> この卦の爻辞はすべて二字で、初九が和兌、九二が孚兌、六三が来兌、九四が商兌、九五だけが少し違い、上六が引兌。最も短い爻辞である。卦名が「無言の喜ばせ方」なので、無言と関係があって短いのだという解説がある。朱子はこれに対して、この文句はどこへもっていっても構わないようで必然性がないと言う。たとえば剥の爻辞などは下から順に上がって行く形が見えて一つも抜き差しならないが、「和」「孚」「来」などはどこへ入れ替えてもよいようだ、と。本田も、この爻辞は二字二字であまりに簡単すぎてよくわからない、巽と兌の卦はあまりよくわからない、朱子も疑っている、と言う。</li><li><b>卦の主体。</b> 受講者が「この卦の主体はどこか」と問うと、本田は「五はあまり良くない。強いていえば二がよろしい」と答えた。「巽はどれが主体か」には「巽は九五が主体であった」と答えた（ただし程伝は九五をこの卦の君主とする）。</li><li><b>和して同ぜず。</b> 『論語』子路篇の「君子は和して同ぜず」の和は、意見が違いながらも調和することで、付和雷同はしない。初九・九二の講義で引かれる。</li><li><b>介の字。</b> 受講者が「日本でも名前に何々の介という時にこの字を使いますね」と言うと、本田は、介はもと礼法で主君を介助する役で、それで「すけ」の訓が生じた、と答えた。</li><li><b>巧言令色を恐れる。</b> 九五の程伝は、堯舜ほどの盛徳の君主にも戒めるべき点はあり、聖賢が上にいても天下に小人は絶えないと言う。堯の朝廷には四凶（共工・驩兜・三苗・鯀）がいて、悪を隠して命令に順っていた。舜ほどの聖人ですら巧言令色を恐れた（『書経』皐陶謨に「何ぞ巧言令色孔壬を畏れんや」。皐陶は舜の家来）。</li><li><b>剥の字。</b> 受講者が「剥の字はよく出てくるか」と問うと、本田は、剥の卦以外でこの字が出てくるのはこれぐらいで、突然ここに出てくるので少しびっくりする、と答えた。剥は一番上だけが陽で、だんだん陽が消えて最後に一本だけ残った形である。</li></ul>\n<h3 id=\"g58-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>喜びの時、願いはすんなり通る。ただし動機が正しくなければならない。道に背いて人を喜ばせれば諂いとなり後悔する。</li><li>友と学び合うのが最上の喜び。</li><li>偏らず和をもって人を喜ばせれば吉（初九）。真心をもって喜ばせれば吉（九二）。</li><li>自分を曲げて機嫌を取りに行けば凶（六三）。</li><li>どちらに付くか迷ったら、きっぱりと正を守り邪を退けよ（九四）。</li><li>甘言を弄する者を信じるな（九五）。</li><li>いつまでもずるずると相手の機嫌を取り続けても輝きはない（上六）。</li></ul><h2 class=\"sec\" id=\"g58-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">和兌。吉。</span></summary><div class=\"body\"><div class=\"yomi\">和して兌ぶ。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「和兌之吉、行未疑也。」（和して兌ぶの吉なる、行い未だ疑われざればなり。）</div>\n<p>和らぎの精神で人を喜ばせる（「よろこぶ」と訓じるが「よろこばせる」の意味）。吉。割に良い判断である。</p>\n<p><span class=\"tag\">程伝</span>初は陽だが、説の体にいて最も下にいて、係わり応じる者がない（四と同じ陽で応じない）。よく卑下和順して人を説ばせ、偏り私する所のない者である。和をもって説びをなして私する所がないのは、説の正しさである。陽剛なので卑しくなく、下にいるのでよく巽い、説にいるのでよく和し、応がないので偏らない。説に処すことこのようなので吉である。（本田：偏私は依怙贔屓。もし初九の上が六四であったら、かえって依怙贔屓になる。）</p>\n<p><span class=\"tag\">象伝について程伝</span>求めるところがあって和すれば、邪な諂いに陥る。初は時に随って順処し、心に係わる所も、誰かのためにする所もなく、ただ和をもってする。だから吉である。象伝はさらに、初が説にいて下にあり、中正でないので、「行い未だ疑われず」と言った。その行いにまだ疑うべきものがない、まだその失を見ないということである。もし中正を得ていれば、この言葉はなかったであろう。説は中正をもって本とする。爻辞はただその義を述べ、象伝は推して言い尽くすのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>偏らず、誰とも和やかに接すれば、疑われることもなく吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">孚兌。吉。悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">孚（まこと）あって兌ぶ。吉。悔い亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「孚兌之吉、信志也。」（孚もて兌ぶの吉なるは、志を信にすればなり。）</div>\n<p>真心が中に満ちて、人を喜ばせる。吉。小人と隣り合わせている悔いも亡ぶ。</p>\n<p><span class=\"tag\">程伝</span>二は陰（六三）に承け比している。陰柔は小人で、これを説べば悔いがあるはずである。二は剛中の徳があり、孚信が内に満ちているので、小人に親しんでも自ら守って失わない。君子は和して同ぜず、説んで剛中を失わない。だから吉で悔いが亡ぶ。二が剛中でなければ悔いがある。自ら守るので亡ぶのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>心に存するものを志という。二は剛実で中にいて、孚信が中にある。志が誠信を存していれば、どうして小人を説んで自失するに至ろう。だから吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>誘惑する小人がそばにいても、真心を守り自分を失わなければ吉、後悔もない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">來兌。凶。</span></summary><div class=\"body\"><div class=\"yomi\">来りて兌ぶ。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「來兌之凶、位不當也。」（来りて兌ぶの凶なる、位当らざればなり。）</div>\n<p>降りて来て人を喜ばせる。非道なことをしてまで喜ばせる。凶。判断が非常に悪い。</p>\n<p><span class=\"tag\">程伝</span>六三は陰柔不中正の人で、道によらずに説ばせる者である。「来りて兌ぶ」とは、相手に就いて説びを求めることである。下にある陽に比し、己を枉げ、非道に就いて説びを求める。凶であるゆえんである。内に之くのを来という。上下ともに陽だが、ひとり内に之くのは、同体（兌）で陰の性が下るからである。道を失って下って行くのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>自ら処する所が中正でなく、上に応がなく、みだりに説びを求める。凶であるゆえんである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分を曲げて機嫌取りに走れば凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">商兌未寧。介疾有喜。</span></summary><div class=\"body\"><div class=\"yomi\">商（はか）りて兌ぶ。未だ寧（やす）からず。介として疾（にく）めば喜び有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九四之喜、有慶也。」（九四の喜びは、慶有るなり。）</div>\n<p>九四は五と三の間にあって、どちらの機嫌を取るべきか去就をはかり、まだ心が定まらない。きりりとして悪を憎めば喜びがある。「介」は決然としての意味で、豫の六二の爻辞に「石に介たり」、晋の六二の爻辞に「介いなる福」とある。「介疾」の二字はここにしか出てこず、わかりにくいが、程伊川は「介として疾めば」と読む。</p>\n<p><span class=\"tag\">程伝</span>四は上に中正の五を承け、下に柔邪の三に比す。陽剛だが処する所が正でない。三は陰柔で陽の説ぶ所である。決めかねて商度する。「未だ寧からず」とは、従う所を議してまだ決まらないことである。二つの間を介という。介は分限で、土地の境は介に田を加えて界とし、義は同じである。だから人に節操があることを介という。もし介然として正を守り、邪悪を憎み遠ざければ喜びがある。五に従うのは正、三を説ぶのは邪である。四は君に近い地で、もし剛介に正を守り邪悪を憎み遠ざければ、君の信任を得て道を行い、福慶が物に及ぶ。それが喜びありである。四のような者は得失がまだ定まらず、従う相手にかかっている。</p>\n<p><span class=\"tag\">象伝について程伝</span>「喜び」とは、もし正を守り、君がこれを説べば、陽剛の道を行うことができ、福慶が物（民衆）に及ぶということである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>二つの誘いの間で迷っている。きっぱりと正しい方に就き、よこしまな方を退ければ喜びがある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">孚于剝。有厲。</span></summary><div class=\"body\"><div class=\"yomi\">剝に孚あるときは、厲（あやう）きこと有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「孚于剝、位正當也。」（剝に孚あるは、位正に当ればなり。）</div>\n<p>君子を剝落させる小人（陰）を信じれば、危ういことがある。これまでの爻辞にはすべて「兌」の字がついていたが、この爻辞だけはつかず、しかも「剝」の字を使う。</p>\n<p><span class=\"tag\">程伝</span>九五は尊位を得て中正にいて、説道の善を尽くしている。それなのに「厲きこと有り」の戒めを設けるのは、堯舜の盛んな時でも戒めがなくはなかったように、戒めるべき所を戒めるのである。聖賢が上にいても天下に小人がいないことはない。ただその悪をほしいままにさせないだけで、聖人もまた彼らが努めて面を革めることを説ぶ（革の上六に「小人は面を革む」）。小人も聖賢の説ぶべきことを知らないわけではない。四凶が堯の朝廷にいて悪を隠して命令に順ったのがそれで、聖人は彼らが最後まで悪であることを知らないのではなく、罪を畏れて強いて仁人のふりをする点を取っただけである。五がもし誠心から小人の仮の善を信じて実とし、その腹黒さを知らなければ危うい道である。小人は備えが至らなければ善を害する。聖人の戒めの意は深い。剝とは陽を消すものの名で、陰が陽を消すのである。おそらく上六を指す。だから剝に孚あれば危うい。五が説の時に上六に比しているので戒めた。舜ほどの聖人でも巧言令色を畏れた。どうして戒めずにおれよう。説が人を惑わすのは、入りやすく恐るべきことこのようである。</p>\n<p><span class=\"tag\">象伝について程伝</span>剝に孚あるを戒めるのは、五がいる所がまさに戒めるべき位置に当たるからである。陰柔（上六）に比し、相説ぶ道があるので、これを信じることを戒める。</p>\n<p>本田の講説：程伝によれば、戒めの言葉はついているが九五がこの卦の君主である。受講者が「警戒すべき陰は上六だけか。四凶は下の方にたくさんいたようだが」と問うと、この卦の陰は上六と六三だけだが、六三は下を向いているので放っておいてよく、上六を警戒せよというのだ、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>耳に心地よい甘言を弄する者を信じるな。信じれば危うい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">引兌。</span></summary><div class=\"body\"><div class=\"yomi\">引きて兌ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「上六引兌、未光也。」（上六引きて兌ぶは、未だ光あらざるなり。）</div>\n<p>喜びの道をさらに引き伸ばして相手を喜ばせようとする。</p>\n<p><span class=\"tag\">程伝</span>他の卦は極に至れば変ずるが、兌は説で、極まればいよいよ説ぶ。上六は説の主（三本の爻の中でただ一つの陰）で、説の極にいて、説んで已むことを知らない者である。説がすでに極まっているのに、さらに引いてこれを長くしようとする。それなのに悔咎に至ると言わないのはなぜか。答え：説んで已むことを知らないことを言っただけで、説ぶ相手の善悪はまだ言っていないからである。また下は九五の中正に乗っていて、その邪説を施すことができない。六三（応）は、承ける者も乗る者もみな正でない（九四・九二）ので凶としたのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>説がすでに極まっているのに、さらに引いて長くしようとする。説ばせる心は已まないが、事理はすでに過ぎていて、実際に説ぶべきものはない。事が盛んであれば光輝があるが、すでに極まって強いて長く引き伸ばすのは、意味がないこと甚だしい。どうして光があろう。「未だ」とは必ずしもそうではないという辞で、象伝に多く用いる。必ずしも光輝があるのではない、つまり光ることができないという意味である。</p>\n<p>本田の講説：受講者が「引きて兌ぶというのは、いつまで経っても未練がましいということか」と問うと、「ぐずぐずと引き伸ばして、相手の機嫌を取ろうとする」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>もう終わったことをずるずると引き延ばして機嫌を取り続けても、何の輝きもない。</div></div></details><div class=\"pager\"><a href=\"#gua-57\">← 巽為風</a><a href=\"#gua-59\">風水渙 →</a></div>", "gua-59": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 59 卦　第六十五講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風水渙</div><div class=\"yo\">ふうすいかん</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-59\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-59\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-59\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-59\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-59\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-59\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-59\" data-jump=\"yao\">六爻</a></div><h3 id=\"g59-s0\">卦の名と象</h3>\n<p>下が水で上が木（風）という形、これが渙である。受講者が「渙という字は日本語でどういう意味か」と問うと、本田は、散るという意味で、才気渙発の渙、渙発は発散するという意味、勅語を出すことを渙発と言ったのは、この卦の九五の「汗のごとく大号す」、王様が一度命令したら汗のように二度と戻らないという所から来ている、と答えた。また字の語源を問われ、水の上を風が渡って波が散るということで、旁の「奐」は音を示すだけ、と答えた。</p>\n<p>程伝（序卦伝を引く）：「兌とは説ぶなり。説びて後之を散ず。故に之を受くるに渙を以てす」。説べば散ずる。人の気は憂えれば結ぼれ、説べば伸び伸びと散ずる。だから説には散の義があり、渙が兌に次ぐ。</p>\n<ul class=\"sen\"><li>卦は巽が上、坎が下。風が水の上を行き、水は風に遇えば波が散る。だから渙である。</li></ul>\n<p>本田の講説：渙という卦の名自体は「散る」で良い意味ではないが、散ろうとする者を集めるというのがこの卦全体の傾向である。程伊川も朱子もそういう方向に解釈する。</p>\n<h3 id=\"g59-s1\">卦辞</h3>\n<div class=\"orig\">渙、亨。王假有廟。利渉大川。利貞。</div>\n<div class=\"yomi\">渙は亨る。王、有廟に仮（いた）る。大川を渉るに利あり。貞しきに利あり。</div>\n<p>この卦が出れば願いは通る。王様が廟に至って祭り、人心を一つにまとめる（「有廟」の「有」は美称で意味はない）。廟を祭ることは、先祖の散ろうとする霊魂を集めることでもある。冒険をしてよろしい。ただし動機が正しいことを条件とする。</p>\n<p><span class=\"tag\">程伝</span>渙は離散である。人の離散は心による。人心が離れれば散ずる。散を治めるのもまた心に基づく。人心を合わせれば散じたものも集められる。だから卦の義はみな心を主とする。「貞しきに利あり」とは、渙散を合わせる道は正固にあるということである。</p>\n<h3 id=\"g59-s2\">彖伝</h3>\n<div class=\"orig\">渙亨、剛來而不窮、柔得位乎外而上同。王假有廟、王乃在中也。利渉大川、乘木有功也。</div>\n<div class=\"yomi\">渙は亨る。剛来りて窮まらず。柔、位を外に得て上同す。王有廟に仮るは、王乃ち中に在るなり。大川を渉るに利あるは、木に乗って功有るなり。</div>\n<p>本田の講説：程伊川はすべて卦の変化は乾坤から来ると言う。乾の九四と坤の六二が入れ替わると、下半分は坎、上半分は巽になり、それを合わせた形が渙である。「上同」とは上の人に付くという意味である。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>渙がよく亨るのは、卦の才がこのようだからである。渙が渙となるのは、九が来て二にいて、六が上って四にいるからである。剛陽が来て下に窮まらず、中を得ている。柔が往って外に正位を得て、五の中に同じる。五に巽順するのが上同である。四と五は君臣の位で、相比してその義が通じる。五に同ずるのは中に従うことである。渙の時に中を守れば離散に至らない。だから亨ることができる。</li><li>「王有廟に仮る」の義は萃の卦に詳しい（まったく同じ文句が萃にある）。天下離散の時、王者が人心を合わせて有廟に至るのは、「王乃ち中に在る」ことである。「中に在り」とは、その中を求め得ること、心を摂る（つかむ）ことである。中は心の象である。剛来りて窮まらず、柔位を得て上同す、という卦の才の義はみな中を主とする。王者が渙を救う道は、その中（民心）を得ることにある。孟子は「其の民を得るに道有り。其の心を得れば斯に民を得ん」と言う（離婁篇）。天帝を祭り廟を立てるのは、民心の帰従する所である。人心を帰せしめる道でこれより大きなものはない。渙を救う道はここに極まる。</li><li>渙を治める道は難を済うべきである。卦には木に乗って川を渡る象がある。上の巽は木、下の坎は水・大川で、大川を渉るに利があるのは、それで渙を救おうということである。木が水の上にあるのは舟に乗る象で、舟に乗るのは川を渡るためである。渡れば渙を救う功がある。</li></ul>\n<p>本田の講説：繋辞伝には、あらゆる文明の利器は卦の形から来たという理論があり、「木を刳りて舟と為し、木を剡りて楫と為す。舟楫の利、以て通ぜざるを済し、遠きを致して以て天下を利す。蓋し諸を渙に取る」とある。舟はこの渙の卦から思いついて発明されたというのである。</p>\n<h3 id=\"g59-s3\">大象</h3>\n<div class=\"orig\">風行水上、渙。先王以享于帝立廟。</div>\n<div class=\"yomi\">風、水上を行くは渙なり。先王以て帝に享し、廟を立つ。</div>\n<p>風が水の上を吹き渡れば波が散る、この形が渙である。昔の王者はこの卦の形を見て、天下の離散しようとする民を集めるべく、天帝を祭り、廟を建てる。</p>\n<p><span class=\"tag\">程伝</span>風が水上を行くのは離散の象である。先王はこの象を観て天下の渙散を救い、帝を祭り廟を立てるに至った。人心を収め合わせるのは宗廟に及ぶものはない。祭祀の報いはその心から出る。だから帝を祭り廟を立てるのは、人心の帰する所である。人心をつなぎ離散を合わせる道で、これより大きなものはない。</p>\n<p>本田の講説：祭りの報いは外からやってくるのではなく、祭る人の心の満足として心の中にある、というここの理論はいかにも宋学者らしい。</p>\n<h3 id=\"g59-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>心を主とする卦。</b> 程伝によれば、渙の卦の義はみな心を主とする。人心が離れれば散じ、散を治めるのも心による。</li><li><b>初と始。</b> 受講者が「はじめというときの初と始はどう違うのか」と問うと、本田は、初六を始と置き換えるわけにはいかないように、ニュアンスがちょっと違う、と答えた。</li><li><b>古い易の注釈。</b> 九二の机を五とする旧説について、本田は、三国呉の虞翻などは確かにそう解釈している（虞翻は魏の王弼と同時代の人）、一番古い解説は前漢の孟喜・京房のもので、京房は漢の武帝より少し後の人で、実際に六十四卦を暦に割り付けた、と説明する。</li><li><b>「悔无し」と「悔亡ぶ」の違い。</b> 六三の程伝は、「悔亡ぶ」はもともと悔いがあるべきなのにそれを滅ぼせること、「悔无し」はもともと悔いがないことだと区別する。本田は、ここの程伝はたいへん親切だと言う。</li><li><b>四と五の協力。</b> 六四と九五は義が相通じているので通して説かれる。四には「元吉」と言い、五には「王居りて咎无し」と位にふさわしいことを言う。四には働きを言い、五には成功を言う。手柄は君に帰し、働きは家来に帰するという君臣の分である。</li><li><b>「渙」は「渙のとき」と読む。</b> 程伊川は九二以下の爻辞の冒頭の渙を「渙のとき」と読ませる。九五には渙が二度出るが、上は「渙のとき」、下は「渙において」と読む。上九の象伝については、程伊川は「血」の下に「去」の字を補う。受講者が「其の膏を屯むと同じになるというのは何を言いたいのか」と問うと、本田は、意味が同じではなく、文法的に構文が同じになるということで、その構文ではここは意味が通らないと言っているのだ、と答えた。朱子も同様に「去」を補い、王弼は「其の血を渙す」と読んで障害を散らす意味に解する。</li></ul>\n<h3 id=\"g59-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>人心がばらばらになる時。願いは通るが、人の心をまとめることが要である。</li><li>祭りなど人心を一つにする手立てを講じ、冒険してもよいが、動機は正しく。</li><li>離散は始めのうちに手を打てば救いやすい。強い助け手に頼れ（初六）。</li><li>頼れる相手に身を寄せれば悔いは消える（九二）。</li><li>私的な派閥を解き、大きな集団にまとめれば大吉（六四）。</li><li>上に立つ者は、命令を汗のように隅々まで行き渡らせよ（九五）。</li><li>争いの場から遠ざかれば害を免れる（上九）。</li></ul><h2 class=\"sec\" id=\"g59-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">用拯馬壯。吉。</span></summary><div class=\"body\"><div class=\"yomi\">用て拯（すく）う。馬壮んなれば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「初六之吉、順也。」（初六の吉なる、順えばなり。）</div>\n<p>人心が離散しようとするその初めに、その離散を救おうとする。駆けつける馬の力が強ければ吉。</p>\n<p><span class=\"tag\">程伝</span>六は卦の初めにいる、渙の始めである。散じ始めようとする時にこれを救い、しかも馬の壮んなるを得る。吉であるゆえんである。六爻のなかで初だけ「渙」と言わないのは、離散の勢いはこれを弁えるのが早くあるべきで、まさに始まる時に救えば渙に至らないからで、教えとして深い。馬は人の身を託すもので、壮んな馬に託すので渙を救える。馬とは九二を指す。二は剛中の才があり、初は陰柔順で、ともに上に応がない。応がないので親しみ相求める。初の柔順が剛中の才に託して渙を救うのは、壮んな馬を得て遠くに至るようなもので、必ず救える。だから吉である。渙の始めに救えば力を用いることが容易である。時の順だからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>初が吉なのは、剛中の才に順従するからである。始めて渙ずる時に用いて救うのは、時に順うのである。（本田：程伊川は「順」の字が「上の剛中の才に順う」と「時に順う」の両方にかかると解釈する。）</p>\n<p>本田の講説：受講者が「はじめというときに、初と始ではどう違うのか」と問うと、初六を始と置き換えるわけにはいかないように、ニュアンスがちょっと違う、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ばらばらになり始めた初期に手を打て。力ある助け手を得れば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">渙奔其机。悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">渙のとき、其の机（おしまずき）に奔る。悔い亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「渙奔其机、得願也。」（渙のとき其の机に奔るは、願いを得るなり。）</div>\n<p>机は殿様がもたれる脇息のことで、旁の「几」は兀座（ぽつねんと座る）などに使う。天下が離散する時、急いで脇息（頼れるもの）に身を託す。あるべき悔いもなくなる。</p>\n<p><span class=\"tag\">程伝</span>諸爻がみな渙と言うのは、渙の時をいうのである。渙の時に険の中にいるので、悔いがあることは知れている。もし走って安んずる所に就けば、悔いが亡ぶ。机とは俯して寄りかかって安んずるもので、「俯す」は下に就くこと、「奔る」は急ぎ行くことである。二と初は正応ではないが、渙離の時にどちらも上に与（応援）がなく、陰陽が親比して相求め、相頼る者である。だから二は初を机とし、初は二を馬とする。急いで初に就いて安んずれば、悔いを亡ぼせる。初は坎の体だが、険の中ではない。ある人が「初は柔微なのに、どうして頼りになるか」と疑った。答え：渙の時は、力を合わせるだけまだましである。先儒がみな五を机とするのは誤りである。渙離の時に二陽がどうして同じくできよう。もし同じくできれば渙を救う功は大きく、悔いが亡ぶだけではないはずである。机とは俯して就く所をいう。</p>\n<p>本田の講説：先儒の説として、三国呉の虞翻などは確かに五を机と解釈している。虞翻は魏の王弼と同じ時代の人。一番古い解説は前漢の孟喜・京房のもので、京房は漢の武帝より少し後の人で、実際に六十四卦を暦に割り付けた。</p>\n<p><span class=\"tag\">象伝について程伝</span>渙散の時は合わさることで安きをなす。二は険中にいて、急いで初に親しむのは安きを求めてである。これに頼ること机のようで、その悔いを亡ぼす。願う所を得るのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>困難のさなか、身近な頼れる相手に急いで寄り添えば、悔いは消える。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">渙其躬。无悔。</span></summary><div class=\"body\"><div class=\"yomi\">渙のとき、其の躬においてす。悔い无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「渙其躬、志在外也。」（渙のとき其の躬においてすとは、志外に在るなり。）</div>\n<p>天下が離散する時、人民を救う才能はないが、我が身だけは離散の悔いがない。</p>\n<p><span class=\"tag\">程伝</span>三は渙の時にいて、ひとり応与（上九）がある。散の悔いがない。しかし陰柔で中正でない才で、位のない地（下卦の上）にいる。どうして時の渙を救って人に及ぼせよう。その身に止まって悔いがないだけである。爻辞の初めに「渙」の字を加えるのは、渙の時にあって、我が身に渙の悔いがないということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>志が上に応じる、外に在るのである。上と応じるので、その身は渙を免れて悔いがない。「悔亡ぶ」はもともと悔いがあってそれを亡ぼせること、「悔无し」はもともと悔いがないことである。（本田：ここの程伝はたいへん親切で、「悔无し」と「悔亡ぶ」は違うという。）</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>世を救う力はないが、外に頼れる応援があり、自分の身は無事でいられる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">渙其群。元吉。渙有丘。匪夷所思。</span></summary><div class=\"body\"><div class=\"yomi\">渙のとき、其れ群せしむ。元吉なり。渙して丘有り。夷（つね）の思う所に匪ず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「渙其群元吉、光大也。」（渙のとき其れ群せしむ、元吉とは、光大なり。）</div>\n<p>人心が離散する時に、人々を群集させる。大吉。離散しようとする人々を集めて、丘のような大集団とする。その手柄は常識の思い及ぶ所ではない。</p>\n<p><span class=\"tag\">程伝</span>渙の四と五は義が相須つので、通して言う。彖伝は「上同す」と言った。四は巽順で正しく、大臣の位にいる。五は剛中で正しく、君位にいる。君臣が力を合わせ、剛柔が相済って天下の渙を救う者である。渙散の時に当たり、剛を用いれば懐けられず、柔を用いれば依り帰する所となるに足りない。四は巽順の正道で剛中正の君を補け、君臣が功を同じくする。渙を救えるゆえんである。天下が渙散して、よくこれを群聚させる、大善の吉と言うべきである。「渙して丘有り、夷の思う所に匪ず」は賛美の辞である。丘は聚まりの大きなものである。渙散の時に大衆を聚められれば、その功は甚だ大きく、その事は甚だ難しく、その働きは至って神妙である。夷は平常で、平常の見識の思い及ぶ所ではない。大賢智でなければ誰がこのようにできよう。</p>\n<p><span class=\"tag\">象伝について程伝</span>元吉と称するのは、その功徳が光大だからである。「元吉光大」を五でなく四に言うのは、二爻の義が通じているからで、四にはその施用（働き）を言い、五にはその成功を言う。君臣の分である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ばらばらの人々を大きくまとめ上げる大吉。常識を超えた大きな成果がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">渙汗其大號。渙王居。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">渙のとき、汗のごとく其れ大号す。渙において王として居る。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「王居无咎、正位也。」（王として居る、咎无きは、正位なればなり。）</div>\n<p>天下が離散する時、号令をすべての人に行き渡らせること、汗が全身を潤すようにする。離散に処して王として人々の上にいる。咎はない。</p>\n<p><span class=\"tag\">程伝</span>五と四は君臣が徳を合わせ、剛中正・巽順の道で渙を治め、その道を得ている。ただ人心に浹（あまね）く行き渡ることにあれば、人々は順従する。号令を民心に行き渡らせ、人の体の汗が四体に行き渡るようにすれば、信服して従う。このようであれば天下の渙を救え、王位にいるにふさわしく、咎がない。「大号」とは大政令で、民を新たにする命令（本田：『大学』に「大学の道は民を新たにするに在り」とある）、渙を救う大政である。再び渙と言うのは、上は渙の時を、下は渙に処することをいう。四では元吉と言ったが、五ではただ位にふさわしいと言う。渙の四・五を通じて言うのは、渙は離散を害とし、これを救って合わせるのであって、君臣が功を同じくし力を合わせなければ救えないからである。爻の義が相須つのは時の宜しさである。</p>\n<p><span class=\"tag\">象伝について程伝</span>「王として居る」とは正位、人君の位である。五のなすようにできれば、その位にいるにふさわしく、咎がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者が大号令を隅々まで行き渡らせて人心をまとめれば、その地位にふさわしく咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">渙其血去逖出。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">渙のとき、其の血（いたみ）去り、逖（おそ）れ出づ。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「渙其血去、遠害也。」（渙のとき其の血去るは、害に遠ざかるなり。）</div>\n<p>天下が離散する時、流離の苦しみを抜け出て、恐怖も去る。咎はない。小畜の六四に「孚有り。血去り惕れ出づ。咎无し」とあったのと同じ文句である。</p>\n<p><span class=\"tag\">程伝</span>渙の諸爻はみな係わり応じる者がなく、これも渙の象である。ただ上だけが三に応じる。三は険陥の極にいる。もし下ってこれに従えば、渙を出ることはできない。険には傷害・畏懼の象があるので血・逖という。しかし九は陽剛で渙の外にいて、渙を出る象がある。また巽の極にいて、よく事理に巽順する。だから、もしその血を去らせ、その逖れを出させることができれば咎はない、という。「其の」とは持っているもの（自分の痛み、恐れ）である。渙の時は合わさることを功とするが、ひとり上だけは渙の極にいて、下に係わりがあって険に臨む。だから渙を出て害に遠ざかることを善しとする。</p>\n<p><span class=\"tag\">象伝について程伝</span>もし象伝の文のように「其の血を渙す」とすれば、屯の九五の「其の膏を屯む」と同じ構文になるが、義はそうではない。おそらく血の字の下に去の字が脱けている。血去り逖れ出づとは、害に遠ざかれば咎がないということである。</p>\n<p>本田の講説：受講者が「膏を屯むと同じになるというのは何を言いたいのか」と問うと、意味が同じではなく、文法的に構文が同じになるということで、その構文ではここは意味が通らないと言っているのだ、程伊川は九二の注で本文の渙はすべて「渙のとき」と読めと言っていたから、ここも「其の血を渙す」では具合が悪い、朱子も同じように去の字を補って読む、王弼は「其の血を渙す」と読み、障害を散らす意味に解釈する、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険な関わりから身を引いて遠ざかれば、痛みも恐れも去り、咎はない。</div></div></details><div class=\"pager\"><a href=\"#gua-58\">← 兌為沢</a><a href=\"#gua-60\">水沢節 →</a></div>", "gua-60": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 60 卦　第六十五講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水沢節</div><div class=\"yo\">すいたくせつ</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-60\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-60\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-60\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-60\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-60\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-60\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-60\" data-jump=\"yao\">六爻</a></div><h3 id=\"g60-s0\">卦の名と象</h3>\n<p>節は節約の節。下が沢、上が水、これが節である。「節」の字の意味は竹の節で、節目節目で止めるという意味がある。</p>\n<p>程伝（序卦伝を引く）：「渙とは離るるなり。物は以て終に離る可からず。故に之を受くるに節を以てす」。物がすでに離散すれば、これを節止（止めること）すべきである。節が渙に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦は沢の上に水がある。沢（池）の容量には限りがあり、沢の上に水を置けば、満ちれば入りきらない。節がある象である。だから節という。</li></ul>\n<h3 id=\"g60-s1\">卦辞</h3>\n<div class=\"orig\">節、亨。苦節不可貞。</div>\n<div class=\"yomi\">節は亨る。苦節す、貞にす可からず。</div>\n<p>この卦が出れば願いは通る。しかし苦しいほどの節約は長くは続かない。日本語では「苦節」は良い言葉のようだが、ここではあまり良くない。</p>\n<p><span class=\"tag\">程伝</span>事に節があれば亨る道を致す。だから節に亨る義がある。節は中に適うことを貴ぶ。過ぎれば苦しい。節が苦しいほどになれば、どうして常に続けられよう。固く守って常としてはならない。「貞にす可からず」とはそういうことである。</p>\n<h3 id=\"g60-s2\">彖伝</h3>\n<div class=\"orig\">節亨、剛柔分而剛得中。苦節不可貞、其道窮也。説以行險、當位以節、中正以通。天地節而四時成。節以制度、不傷財、不害民。</div>\n<div class=\"yomi\">節は亨る。剛柔分かれて、剛、中を得ればなり。苦節す、貞にす可からずとは、其の道窮すればなり。説びて以て険に行き、位に当りて以て節し、中正にして以て通ず。天地節して四時成る。節するに制度を以てすれば、財を傷らず、民を害せず。</div>\n<p>この卦の形は、陽と陰が三本ずつ等分に分かれ、二と五の陽がちょうど上下卦の真ん中の位を得ている。だから通ると言う。下半分は喜び、上半分は険で、人は喜ぶ対象に向かって進んで止むことを知らず、落とし穴にはまってそこで行き詰まる。五が尊位に当たって止まり、中正を得て願いが通る（「節す」とは止まること）。節度は大宇宙の中にもあり、天地に節目があってこそ四季が完成する。聖人が制度をもって人々の欲望を節すれば、財を傷つけず、民を害しない。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>節の道には自ずから亨る義がある。事に節があればよく亨る。また卦の才は、剛柔が分かれて（半分ずつ）処り、剛が中を得て過ぎない。これが節であるゆえん、亨るゆえんである。</li><li>節が極に至って苦しければ、堅固に常に守ることはできない。その道がすでに窮まっているからである。</li><li>卦の才で言う。内は兌、外は坎で、説んで険に行くのである。人は説ぶ所には進んで止むことを知らないが、険に遇えば止まろうと思う。説んで止まる、これが節の義である。「位に当りて以て節す」とは、五が尊位にいる、位に当たるのである。沢の上に水があるのが節で、位に当たって節するのは節を主る者である。中正を得ているのは、節してよく通ずるのである。中正であれば通じ、過ぎれば苦しい。</li><li>推して節の道を言う。天地に節があるので四時を成す。節がなければ秩序を失う。聖人は制度を立てて節とするので、財を傷らず民を害しない。人欲には窮まりがない。制度で節さなければ、奢侈放肆に至り（侈は贅沢、肆はほしいまま）、財を傷り民を害するに至る。</li></ul>\n<h3 id=\"g60-s3\">大象</h3>\n<div class=\"orig\">澤上有水、節。君子以制數度、議德行。</div>\n<div class=\"yomi\">沢上に水有るは節なり。君子以て数度を制し、徳行を議す。</div>\n<p>池の上に水があるのが節の形である。池には容量があり、上の水を適度に下に垂らすのでなければ池があふれてしまう。君子はこれを見て、人に与うべき物資の数量と決まりを定め、人々の徳性や能力を推し量って適宜に欲望を充足させる。</p>\n<p><span class=\"tag\">程伝</span>沢の水を容れるには限りがあり、過ぎれば溢れる。これが節である。君子は節の象を観て数度を制定する。物の大小・軽重・高下・文質（飾りと質朴）にはみな数度があり、節となす。数は多寡、度は法制である。「徳行を議す」とは、内に存するのを徳、外に発するのを行といい、人の徳行が義に当たれば節に中る。議とは商度して節に中ることを求めることである。</p>\n<h3 id=\"g60-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>苦節は良くない。</b> 日本語の「苦節」は良い言葉のようだが、易の使い方では良いことではない。苦節は長続きしないということが、この卦には（卦辞と上六で）二回出てくる。あまり節約してはならないということである。</li><li><b>時が通ずれば出よ。</b> 初九の象伝の程伝は、「戸庭を出でず」に固執することを戒め、時が通ずれば行き、塞がれば止むべきだ、と言う。『荘子』盗跖篇の尾生の信（尾生という若者が女と橋の下で待ち合わせたが女が来ず、水が満ちてきても去らずに溺れ死んだ）は、通塞を知らないのである。だから君子は「貞にして諒ならず」（『論語』衛霊公篇。諒は小さな信義に固執すること）。受講者が「門庭まで出たら、もう外へ出なきゃならんということですね」と言うと、本田は「そう。時が通ずれば出ろという」と答えた。</li><li><b>繋辞伝の解釈。</b> 繋辞伝上に「戸庭を出でず、咎无し。子曰く、乱の生ずる所は、言語以て階と為す。君密ならざれば臣を失い、臣密ならざれば身を失い、幾事密ならざれば害成る。是を以て君子は慎密にして出さざるなり」とあり、繋辞伝は「出」の字を言葉を出す意味に解する。程伝は、人において節すべきは言と行いで、言に節すれば行いも知るべく、言が先にあるべきだからだ、と言う。</li><li><b>中は正より上位。</b> 九五の象伝の程伝は「中を得れば正なり。正は尽くは中なる能わず」と言う。本田は、ここは程伊川の「中という徳は正よりも上位にある」という考えだ、と言う。</li><li><b>節の悔亡。</b> 上六の「悔亡」はここでは「悔い亡ぶ」と読まず「悔ゆれば凶亡ぶ」と読む。こういう読み方は他に例がない。</li></ul>\n<h3 id=\"g60-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>節度を守れば願いは通る。ただし苦しいほどの節約・我慢は続かず、固執すれば行き詰まる。</li><li>初めは謹んで出しゃばらず、言葉を慎め（初九）。ただし時が通じたら出るべき時には出よ（九二）。</li><li>自ら節しなければ嘆くことになり、誰も責められない（六三）。</li><li>無理なく心安らかに守れる節度が最もよい（六四・九五）。</li><li>苦節に固執すれば凶、改めれば凶は消える（上六）。</li></ul><h2 class=\"sec\" id=\"g60-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">不出戸庭。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">戸庭を出でず。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不出戸庭、知通塞也。」（戸庭を出でざるは、通塞を知るなり。）</div>\n<p>踏み留まって、ドアのすぐ外の中庭にも出ない。その態度は咎がない。後に「門庭」という言葉が出てくるが、「戸」は一枚戸の扉、「門」は観音開きの二枚扉を指す。</p>\n<p><span class=\"tag\">程伝</span>戸庭は戸の外の庭、門庭は門の内の庭である。初は陽で下にいて、上に応（六四）がある。節しようとする者ではない（上へ上がろうとするかもしれない）。また節の初めに当たる。だから謹守を戒める。戸庭を出ないほどであれば咎はない。初めはよく固く守っても、終わりには変わることがある。初めに謹まなければ、どうして終わりを全うできよう。だから節の初めに戒めることが甚だ厳しいのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>爻辞は節の初めに謹守を戒めたので、「戸庭を出でざれば咎无し」と言った。象伝は、人がその言葉に拘泥することを恐れ、さらに明らかにして「謹守して戸庭を出でざるべしといえども、必ず時の通塞を知れ」と言った。通ずれば行き、塞がれば止まる。義として出るべきなら出る。尾生の信、水が至っても去らなかったのは、通塞を知らないのである。だから君子は貞にして諒ならず。繋辞伝がこの爻をただ言葉について解するのは、人において節すべきはただ言と行いで、言に節すれば行いも知るべく、言が先にあるべきだからである。</p>\n<p>本田の講説：尾生の信は『荘子』盗跖篇にある話で、尾生という学生が女と橋の下で待ち合わせたが女が来ず、潮が満ちてきて溺れ死んだ。「貞にして諒ならず」は『論語』衛霊公篇にある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>今は出しゃばらず、言葉を慎んで内に留まれば咎はない。ただし時が開けたら出るべき時を見失うな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">不出門庭。凶。</span></summary><div class=\"body\"><div class=\"yomi\">門庭を出でず。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不出門庭凶、失時極也。」（門庭を出でず、凶なるは、時を失すること極まればなり。）</div>\n<p>九二は門から外に出ない。凶。</p>\n<p><span class=\"tag\">程伝</span>二は剛中の質だが、陰位にいて説（兌）の体にいて、柔（六三）を承ける。陰位にいるのは不正、説にいるのは剛を失うこと、柔を承けるのは邪に近づくことである。節の道は剛中正をもってすべきで、二はその剛中の徳を失い、九五の剛中正とは異なる。「門庭を出でず」とは外に之かないこと、五に従わないことである。二と五は陰陽の正応ではないので従わない。もし剛中の道をもって相合えば、節の功を成すことができる。ただ徳を失い時を失うので凶である。五に合わないのは不正の節である。剛中正をもって節とするのは、「忿を懲らし慾を窒ぐ」「過ぎたるを損し余り有るを抑う」（損の大象・彖伝の文句）のようなことで、不正の節とは、ものを用いるのに吝嗇に節し、行いを懦弱に節するようなことである。</p>\n<p><span class=\"tag\">象伝について程伝</span>上の九五の剛中正の道に従って節の功を成すことができず、私昵する陰柔（六三）に係わる。これは時を失うことの至極で、凶であるゆえんである。「時を失す」とは、その宜しき所を失うことである。（本田：「昵」は親しむ意味で、プライベートに親しい相手に従うことである。）</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>出るべき時に出ず、身近な馴れ合いにとどまっている。好機を完全に逃す凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">不節若、則嗟若。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">節若たらずんば、則ち嗟若たり。咎むる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不節之嗟、又誰咎也。」（不節の嗟き、又た誰をか咎めん。）</div>\n<p>自らを節して道義に従わなければ、嘆かねばならない（「若」は形容詞を作る字）。嘆くはめになっても、誰を咎めることもできない。</p>\n<p><span class=\"tag\">程伝</span>六三は中正でなく、剛（九二）に乗り険（坎）に臨む。もとより咎があるべきである。しかし柔順で和説（兌）なので、自ら節して義に順えば過ちを免れられる。そうでなければ凶咎が必ず至り、傷み嗟くことになる。だから「節若たらずんば嗟若たり」という。自分で招いたもので、咎を帰する所はない。</p>\n<p><span class=\"tag\">象伝について程伝</span>節すれば過ちを免れられるのに、自ら節することができず、嘆くべき結果を招く。いったい誰を咎められよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分を律しなければ、後で嘆くことになる。それは自業自得である。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">安節。亨。</span></summary><div class=\"body\"><div class=\"yomi\">節に安んず。亨る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「安節之亨、承上道也。」（節に安んずるの亨るは、上の道を承くればなり。）</div>\n<p>節約の道に心安んずる。願いは通る。「安節す」と読んでもかまわない。</p>\n<p><span class=\"tag\">程伝</span>四は九五の剛中正の道を順承している。中正をもって節とするのである。陰で陰位にいて、正に安んずる。位に当たるのは節がある象である。下は初に応じる。四は坎の体で水である。水が上に溢れるのは節がなく、下に就くのは節がある。四のようなのは、強いてこれを節するのではなく、節に安んずる者である。だから亨ることができる。節は安らかであることを善しとする。強いて守って安らかでなければ常であることはできず、どうして亨れよう。</p>\n<p><span class=\"tag\">象伝について程伝</span>四が節に安んずる義は一つではないが、象伝はただ最も重いものを挙げた。上の九五の剛中正の道を承けて節とすることで、それが亨るに足る。他の良さも中正を出ない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>無理のない節度に心安らかに従えば、願いは通る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">甘節。吉。往有尚。</span></summary><div class=\"body\"><div class=\"yomi\">甘節す。吉。往けば尚ぶこと有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「甘節之吉、居位中也。」（甘節の吉なる、位に居りて中なればなり。）</div>\n<p>最も甘美なる節制の仕方（程伝による）。吉。この行き方で前進すれば、万民に尊ばれる。「節に甘んず」と読んでもよい。</p>\n<p><span class=\"tag\">程伝</span>九五は剛中正で尊位にいて、節の主である。いわゆる「位に当りて以て節し、中正にして以て通ずる」者である。己にあっては安らかに行い、天下に行えば説び従われる。節の甘美なる者で、その吉は知るべきである。これで行けばその功は大きい。だから往けば嘉尚すべきことがある。</p>\n<p><span class=\"tag\">象伝について程伝</span>すでに尊位にいて、また中道を得ている。吉で功があるゆえんである。節は中を貴しとする。中を得れば正である。正はことごとく中であるとは限らない。</p>\n<p>本田の講説：ここは程伊川の「中という徳は正よりも上位にある」という考えである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分も楽に守れ、人も喜んで従う、甘美な節度。吉で、進めば尊ばれる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">苦節。貞凶。悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">苦節す。貞なるときは凶。悔ゆるときは凶亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「苦節貞凶、其道窮也。」（苦節す、貞なるときは凶とは、其の道窮まればなり。）</div>\n<p>苦しいほどの節約（苦節の語は卦辞にも出てきた）。固執すれば凶、後悔して改めれば凶がなくなる。最後の「悔亡」の二字は、ここでは「悔い亡ぶ」とは読まない。こういう読み方は他に例がない。</p>\n<p><span class=\"tag\">程伝</span>上六は節の極にいる、節の苦しい者である。険の極にいるのも苦しい義である。固守すれば凶、悔ゆれば凶が亡ぶ。「悔ゆ」とは過ぎたるを損らし中に従うことである。節の「悔亡」は、他の卦の「悔亡」と辞は同じでも義は異なる。</p>\n<p><span class=\"tag\">象伝について程伝</span>節がすでに苦しいのに貞固にこれを守れば凶である。思うに節の道が窮極に至ったのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>苦しすぎる我慢・倹約に固執すれば凶。行き過ぎを改めて中庸に戻れば、凶は消える。</div></div></details><div class=\"pager\"><a href=\"#gua-59\">← 風水渙</a><a href=\"#gua-61\">風沢中孚 →</a></div>", "gua-61": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 61 卦　第六十六講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風沢中孚</div><div class=\"yo\">ふうたくちゅうふ</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-61\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-61\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-61\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-61\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-61\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-61\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-61\" data-jump=\"yao\">六爻</a></div><h3 id=\"g61-s0\">卦の名と象</h3>\n<p>中孚は朱子もよくわからないと言っている。中孚は内なる誠である。「孚」はまこと。孚の字は上半分が爪、下半分が子で、鳥が卵を抱いている形を示す。左側に卵を付けると孵化の「孵」の字になる。一定の時が来たら必ず卵が孵るところから、期日を誤らないことの意味になる。形から言うと、下に二本陽、真ん中に二本陰、上にまた二本陽がある。</p>\n<p>程伝（序卦伝を引く）：「節して之を信ず。故に之を受くるに中孚を以てす」。節とは制節して越えさせないことである。信じて後によく行える。上はよく信じてこれを守り、下は信じてこれに従う。節して信ずるのである。中孚が節に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦は沢の上に風がある。風が沢上を行って水中を感動させる、中孚の象である。「感」は感じて動くことである。</li><li>内外がみな実（陽）で中が虚（三・四が陰）である。中が虚であるのは中孚の象である。また二・五がみな陽で中が実であるのも孚の義である。二体（上下卦）で見れば中実、全体で見れば中虚。中虚は信の本、中実は信の質である。</li></ul>\n<p>本田の講説：誠というのは「虚心」と「中身が詰まっている」という両方の意味がある。</p>\n<h3 id=\"g61-s1\">卦辞</h3>\n<div class=\"orig\">中孚、豚魚吉。利渉大川。利貞。</div>\n<div class=\"yomi\">中孚は豚魚にして吉なり。大川を渉るに利あり。貞しきに利あり。</div>\n<p>心中に誠があれば、豚や魚のような最も鈍感なものをも感動させることができる。そうであれば吉。冒険してよろしい。動機が正しくなければいけない。</p>\n<p><span class=\"tag\">程伝</span>豚は躁がしく、魚は冥（くら）く、物の中で最も感じさせにくい者である。孚信が豚魚を感じさせるほどなら、至らない所はない。だから吉である。忠信（二字で真心の意味。『論語』の初めにある）は水火をも踏める。まして川を渉ることなど何でもない。信を守る道は堅く正しいことにある。だから「貞しきに利あり」である。</p>\n<h3 id=\"g61-s2\">彖伝</h3>\n<div class=\"orig\">中孚、柔在内而剛得中。説而巽、孚。乃化邦也。豚魚吉、信及豚魚也。利渉大川、乘木舟虚也。中孚以利貞、乃應乎天也。</div>\n<div class=\"yomi\">中孚は柔内に在りて剛中を得たり。説びて巽うは孚なり。乃ち邦を化するなり。豚魚にして吉とは、信、豚魚に及ぶなり。大川を渉るに利あるは、木に乗って舟虚しければなり。中孚にして以て貞しきに利あり、乃ち天に応ずるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>二柔が内にあり、中虚で誠の象である。二剛が上下の体の中を得ており、中実の象である。卦が中孚であるゆえんである。</li><li>二体で卦の用を言う。上は巽、下は兌で、上が至誠で下に順い、下が孚あって上に説び従う。このように孚があって初めて邦国を化することができる。もし民が説び従わず、事理に違えば、どうして天下を化せよう。</li><li>信が豚魚に及ぶほどであれば信道は至っている。吉であるゆえんである。</li><li>中孚で険難を渉るのは、木に乗って川を渡り、しかも虚舟（中が空の舟）を用いるようなものである。舟が虚しければ沈み覆る憂いがない。卦が虚であるのは虚舟の象である。</li><li>中孚で貞なれば天に応じる。天の道は孚と貞にほかならない。</li></ul>\n<p>本田の講説：受講者が「この険難はどこにあるのか」と問うと、下半分の沢を指す、と答えた。「坎の卦でなくても険難の意味になるのか」には「沢でも川と言ってよろしい」と答えた。天の道が孚と貞であるとは、天体の動き・星の運行は絶対に期日を変えないのが孚、天のすることが常に正しいのが貞ということである。</p>\n<h3 id=\"g61-s3\">大象</h3>\n<div class=\"orig\">澤上有風、中孚。君子以議獄緩死。</div>\n<div class=\"yomi\">沢上に風有るは中孚なり。君子以て獄を議し、死を緩くす。</div>\n<p>沢の上を風が渡れば、波が動いて中の水まで感動させる、これが中孚である。君子はこれを見て、訴訟においては十分に犯人に同情して裁判をよくよく吟味し、なるべく死刑を減らす。</p>\n<p><span class=\"tag\">程伝</span>沢上に風があり、沢中に感ずる。水の体は虚なので風が入り込める。人の心は虚なので物が感動させられる。風が沢に動くのは、物が心中に感ずるようなもので、だから中孚の象とする。君子はその象を観て、獄を議し死を緩くする。獄を議するには忠を尽くすのみ、死を決するには惻（あわれみ）を極めるのみ。だから誠意で常に寛大を求める。緩は寛くすることである。君子は天下の事で忠を尽くさないことはないが、獄を議し死を緩くすることが最も大きい。</p>\n<p>本田の講説：受講者が「この獄というのは何か、今の獄とは違うのか」と問うと、「裁判沙汰。ちょっと違う」と答え、『論語』に「片言以て獄を折む」とあり、折獄とは裁判沙汰を決定することだ、と説明した。</p>\n<h3 id=\"g61-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>誠は通じるか。</b> 九二の講義で、受講者が「日本人は昔から誠であれば通じると言って、外国人と折衝するときもそうだと言うが、こういう思想は東洋なのか」と問うと、本田は「中国人は雄弁術が随分昔から盛んであった。誠であれば言葉が足らんでも通ずるというのは、日本人だけではないか」と答えた。「忠義や孝行は教えないとわからないから教えるというのが中国思想の根底か」に対しては、中国の道は非常に厳しく、がみがみと親孝行せよと言うだけでなく、ちょっとでも親不孝な行為をした者にはものすごい刑罰がある、と答えた。受講者は「日本は性善説なんですね。言わなくても阿吽の呼吸でわかっているだろうという」と言った。</li><li><b>爵位。</b> 受講者が「爵位はこの頃もあったのか」と問うと、本田は、爵位は大昔からある、秦の始皇帝は敵の首を一つ取れば爵位を一つあげるという制度を作った、爵位と官職とは別である、と答えた。</li><li><b>繋辞伝の引用。</b> 繋辞伝に「鳴鶴陰に在り、其の子之に和す。我に好爵有り、吾爾と之を靡にせん。子曰く、君子其の室に居り、其の言を出だす、善なれば千里の外これに応ず。況んや其の邇きものをや。其の室に居り、其の言を出だす、善ならざれば千里の外これに違う」とある。本田は、程伊川の引用は省きすぎている、「善ければ」とは君子の言葉が善ければということだ、と言う。</li><li><b>卦の主。</b> 受講者が「六三がこの卦の主か」と問うと、本田は「三と四がこの卦の主になっている」と答えた。</li><li><b>「月望に幾し」。</b> 受講者が「この句は小畜では上九、帰妹では六五にあるが、四の場合が良いのでは。どうして上や五でも良いのか」と問うと、本田は、「月望に幾し」は盛んであることの至りで、上九でも六五でもよく、六四において言うのがむしろ例外だ、と答えた。「馬匹は両服・両驂のどちらか」には「どちらでもよい。四頭立ての外側の二頭は添え馬であるから必ずしもなくてもいい」と答えた。</li><li><b>教訓的な卦。</b> 中孚の卦は悪い判断はないが、卦全体が非常に教訓的で、どういう事態を指すのかがよくわからない、と本田は言う。</li></ul>\n<h3 id=\"g61-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>内なる真心があれば、どんな鈍い相手も感動させ、冒険してもよい。ただし動機は正しく。</li><li>信じる相手は最初によく見極め、決めたら一途に（初九）。</li><li>真心は離れていても通じ合う（九二）。</li><li>主体性なく人に振り回されるな（六三）。</li><li>満ちる手前で控え、私的なつながりを断って上に従えば咎はない（六四）。</li><li>上に立つ者は、手をつなぐように固く人心を結べ（九五）。</li><li>中身のない評判だけが高く上がっても長続きしない。固執すれば凶（上九）。</li></ul><h2 class=\"sec\" id=\"g61-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">虞吉。有它不燕。</span></summary><div class=\"body\"><div class=\"yomi\">虞（はか）れば吉。它（た）有るときは燕（やす）からず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「初九虞吉、志未變也。」（初九の虞れば吉なるは、志未だ変ぜざればなり。）</div>\n<p>信じてよい相手かどうかよくよく推し量ってから従え。そうすれば吉。一旦信を置いた後に心変わりする時は、心が不安である。「它」は「他」と同じ。</p>\n<p><span class=\"tag\">程伝</span>九は中孚の初めに当たる。だからその信ずる所を審らかにせよと戒める。虞は度ることである。信ずべき相手かを度って、その後従う。至信があっても、その相手を得なければ悔咎がある。だから度って後信ずれば吉である。すでに信ずる所を得れば誠一であるべきで、もし他心があれば安らかさを得られない。燕は安裕である。「它有り」とは志が定まらないことで、志が定まらなければ惑って安らかでない。初と四は正応で、四は巽の体で正に居り、善くないことはない。爻は始めを謀る義を重んじるので、相応の義を取らない。もし応を先に考えれば、度ることにならない。</p>\n<p>本田の講説：最後の所がちょっとわかりにくい。</p>\n<p><span class=\"tag\">象伝について程伝</span>信の始めに当たり、志がまだ従う所を持たないうちに、信ずる所を度れば正を得る。だから吉である。思うにその志はまだ変動していない。志が従う所を持てば変動で、そうなれば度っても正を得られない。初めに信ずる所を求める道を言ったのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>信じる相手は最初によく見極めよ。決めた後に二心を抱けば心は休まらない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">鳴鶴在陰。其子和之。我有好爵、吾與爾靡之。</span></summary><div class=\"body\"><div class=\"yomi\">鳴鶴陰に在り。其の子之に和す。我に好爵有り、吾と爾と之に靡（かか）る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「其子和之、中心願也。」（其の子之に和す、中心願えばなり。）</div>\n<p>鶴の親が目に見えない木陰にひそみ、のどを鳴らして子を呼ぶ。他の者にはその声は聞こえないが、鶴の子は親の声に感動して、これに合わせて鳴き交わす。同じように、わたしに良き爵位があれば、わたしと親友のそなたと、ともにこの爵位を慕うであろう。程伊川は「吾と爾と之に靡る」と読むが、「吾爾と之を靡にせん」という読みもある。「靡る」とは心にかけ慕うことである。</p>\n<p><span class=\"tag\">程伝</span>二は剛実で中にいて、孚の至れる者である。孚が至ればよく感通する。鶴が幽隠の所で鳴けば他には聞こえないが、その子は相応じて和す。中心の願いが相通ずるからである。好爵は我が有だが、彼もまた繋慕する。好爵を説ぶ意は同じだからである。我が中に孚があれば、応じない者はない。誠は同じだからである。至誠には遠近・幽深の隔てがない。だから繋辞伝に「善なれば千里の外之に応じ、善ならざれば千里の外之に違う」という。誠が必ず通ずるということである。至誠感通の道を知る者のみがこれを識ることができる。</p>\n<p>本田の講説：程伊川は「彼」が誰かを明言していないが、後の六三の注に「係る所有り」と言うので、暗に三を指すかと思う。</p>\n<p><span class=\"tag\">象伝について程伝</span>「中心の願い」とは、誠意の願う所をいう。だから通じて相応ずるのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>真心は隠れていても相手に通じ、喜びを分かち合える。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">得敵。或鼓或罷、或泣或歌。</span></summary><div class=\"body\"><div class=\"yomi\">敵を得たり。或は鼓し、或は罷め、或は泣き、或は歌う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「或鼓或罷、位不當也。」（或は鼓し或は罷む、位当らざればなり。）</div>\n<p>匹敵する相手を得ようとして、時には太鼓を鳴らして呼びかけ、時には太鼓を打つのをやめ、時には泣きわめき、時には歌う。「敵」には憎み合う敵のほかに、ちょうど自分に匹敵する相手という意味がある。</p>\n<p><span class=\"tag\">程伝</span>敵は対敵で、交々孚とする相手、正応の上九である。三と四はどちらも中を虚しくして孚を成す主だが、居る所が異なる。四は位を得て正に居るので、匹（初九）を亡って上に従う。三は中でなく正を失っているので、敵を得て志を煩わす。柔説（兌）の質で、すでに係わる所（二の好爵）があり、ただ信ずる所に従う。あるいは鼓張し、あるいは罷め廃し、あるいは悲しみ泣き、あるいは歌い楽しむ。動止・憂楽がみな信ずる所に係っている。ただ信ずる所に係るので、まだ吉凶はわからない。しかし明達の君子のすることではない。</p>\n<p>本田の講説：受講者が「この爻がこの卦の主か」と問うと、「そう。三と四がこの卦の主になっている」と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>居る所が位に当たらないので、主とする所がなく、ただ信ずる所に従う。居る所が正を得ていれば、信ずる所に一定の方向がある。</p>\n<p>本田の講説：受講者が「上と下に引っ張られるわけですね」と言うと、「そう。上九と九二、上の者と下の者に引っ張られてふらふらするので、六三には主体性がないという」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>主体性がなく、相手次第で喜んだり泣いたり振り回される。吉凶定まらず、賢明なあり方ではない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">月幾望。馬匹亡。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">月望に幾し。馬の匹（たぐい）亡うときは咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「馬匹亡、絶類上也。」（馬の匹亡うは、類を絶ちて上るなり。）</div>\n<p>月が満月に近い（望は満月。輝かしい地位ということ。この句は小畜・帰妹にも出てくる）。二頭立ての馬の一匹を見捨てる時は咎がない。一匹を見捨てるとは、初九との縁を切ること。六四は初九と対応する関係だが、同時に五にも引かれている。</p>\n<p><span class=\"tag\">程伝</span>四は孚を成す主で、君に近い位にいる。その正を得て、上（五）の信任も至っている。孚の任に当たる者である。月が望に近いようなもので、盛んの至りである。すでに望ならば敵する。臣が君に敵すれば災禍が必ず至る。だから幾望を至盛とする。「馬の匹亡う」とは、四と初は正応で類である。昔は車に四頭の馬を用い、純色を備えられなければ、両服（内側の二頭）と両驂（外側の二頭）をそれぞれ一色にし、大きさも必ず揃えた。だから二頭の馬を匹（一対）とする。馬は行くものである。初は上って四に応じ、四もまた進んで五に従う。みな上へ行くので、馬を象とする。孚の道は一であることにある。四がすでに五に従い、もしまた下の初に係われば、一でなくなり孚を害する。咎がある。だから馬の匹を亡うときは咎がない。上の五に従って初に係わらない、これがその匹を亡うことである。初に係われば進めず、孚の功を成せない。</p>\n<p><span class=\"tag\">象伝について程伝</span>その類を絶って上の五に従うのである。類とは応（初九）をいう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>盛りの手前の最も良い地位。満ちすぎず、私的な仲間との縁を断って上に一筋に仕えれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">有孚攣如。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">孚有り、攣如（れんじょ）たり。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有孚攣如、位正當也。」（孚有り攣如たり、位正に当ればなり。）</div>\n<p>手をつなぎ合うような誠がある。そうであれば咎がない。「攣」は程伝に「拘攣」とあり、手をつなぎ合う意味。「拘」はくくる、「攣」は手をつなぐこと。攣の字の下の手の代わりに心を書けば「戀」になる。</p>\n<p><span class=\"tag\">程伝</span>五は君位にいる。人君の道は、至誠をもって天下を感通し、天下の心にこれを信じさせ、拘攣するように固く結ばせるべきである。そうであれば咎がない。人君の孚が天下をこのように固く結ばせることができなければ、億兆の心が離れないとどうして保証できよう。</p>\n<p><span class=\"tag\">象伝について程伝</span>五は君の尊位にいて、中正の道に由る。天下にこれを信じさせること拘攣のように固い。それでこそその位にふさわしい。人君の道はこのようであるべきである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者が誠で人々と固く結ばれていれば、咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">翰音登于天。貞凶。</span></summary><div class=\"body\"><div class=\"yomi\">翰音（かんおん）天に登る。貞なれば凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「翰音登于天、何可長也。」（翰音天に登る、何ぞ長かる可けんや。）</div>\n<p>空を飛ぶ鳥の羽根の音だけが天に登る（「翰」は大きな羽根、翰音は大きな羽根の音）。実体は必ずしも登っていない。このような態度に固執すれば凶。</p>\n<p><span class=\"tag\">程伝</span>翰音とは音だけが飛んで実が従わないことである。信の終わりにいて、終われば衰える。忠篤が内に喪われ、華美が外に揚がる。だから「翰音天に登る」という。正もまた滅ぶ。陽の性は上に進み、巽の体は飛揚する。九は中孚の時に最上にいて、進むことを信じて止まることを知らない者である。その極、翰音が登って天に聞こえるに至る。貞固にして変ずることを知らなければ、凶なことは知るべきである。孔子は「信を好んで学を好まざれば、其の蔽や賊」と言った（『論語』陽貨篇）。固守して通ずることを知らないことである。</p>\n<p>本田の講説：信を好んで学を好まないとは、言わばやくざの信義みたいなものである。陽貨篇のこの言葉は何カ条かあり、他に「仁を好んで学を好まざれば、其の蔽や愚」などがある。</p>\n<p><span class=\"tag\">象伝について程伝</span>信を守って窮極に至り、変ずることを知らない。どうして長久であり得よう。固く守って通じない。このようであれば凶である。</p>\n<p>本田の講説：受講者が「先生の本では『貞しけれど凶』になっているが、読み方が違うのか」と問うと、清の王夫之はここを「貞しけれど凶」と読む、程伊川は「貞なれば凶」と読んで固守の意味に解釈し、朱子も同じだ、と答えた。「翰音天に登るというのは羽根の音だけが上に行くのか」には、程伊川の解釈では実体が伴わず羽根の音だけが登るというが、別の解釈では翰音の二字は鶏のことを指すといい、この方がいいかもしれない、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>中身の伴わない名声だけが高く上がる。小さな信義に固執して変われなければ凶。長くは続かない。</div></div></details><div class=\"pager\"><a href=\"#gua-60\">← 水沢節</a><a href=\"#gua-62\">雷山小過 →</a></div>", "gua-62": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 62 卦　第六十六講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">雷山小過</div><div class=\"yo\">らいざんしょうか</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-62\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-62\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-62\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-62\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-62\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-62\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-62\" data-jump=\"yao\">六爻</a></div><h3 id=\"g62-s0\">卦の名と象</h3>\n<p>卦の下半分が艮（止まる、山）、上半分が震（雷）。山の上に雷がある形、これが小過である。受講者が「大過という卦もありましたっけ」と問うと、本田は、大過の卦もあり、形がよく似ているが、大過は真ん中の四本が陽で一番上と一番下が陰だ、と答えた。</p>\n<p>程伝（序卦伝を引く）：「其の信有る者は必ず之を行う。故に之を受くるに小過を以てす」。人が信ずる所は必ず行い、行えば過ぎる。小過が中孚に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦は山の上に雷がある。雷が高い所で震えば、その声は常を過ぎる。だから小過である。</li><li>また陰（六五）が尊位にいて、陽（九四）が位を失って中でない。小なる者（陰）がその常を過ぎるのである。だから小なる者の過ぎること、また小事の過ぎること、また過ちの小さいこととする。</li></ul>\n<h3 id=\"g62-s1\">卦辞</h3>\n<div class=\"orig\">小過、亨。利貞。可小事、不可大事。飛鳥遺之音。不宜上、宜下。大吉。</div>\n<div class=\"yomi\">小過は亨る。貞しきに利あり。小事に可なり、大事に可ならず。飛鳥、之が音を遺す。上るに宜しからず、下るに宜し。大吉。</div>\n<p>小さな行き過ぎは願いが通ることがある。ただし時宜に適うことを条件とする。小さな事の行き過ぎはよろしいが、大きな事の行き過ぎはよくない。飛ぶ鳥がやや行き過ぎて、鳴き音だけが残っている、そのような姿がよい（ここの文句の意味はよくわからない）。鳥の声は下から上へ上るのはよろしくなく、上から下へ下りてくる方がよろしい（重力に対して素直であるという意味のようである）。大吉。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>過とはその常を過ぎることである。曲がったものを矯めるのに正しい所を過ぎる（矯枉過正。『後漢書』仲長統伝に出てくる言葉。少々行き過ぎたように見えてちょうど正しい状態になる）ようなもので、過ぎるのは正に就くためである。事には時にそうすべき場合があり、過ぎるのを待って初めて亨るものがある。だから小過には自ずから亨る義がある。「貞しきに利あり」とは、過ぎる道は貞に利があるということで、時宜を失わないのを正という。</li><li>過ぎるのは中に就くことを求めるためである。過ぎてよいのは小事であって、大事をどうして過ぎてよかろう。それは大過で詳しく論じた（本田：大過の卦辞に「棟撓む、本末弱きなり」、上六に「過ぎて渉る、頂を滅す、凶」とあった）。飛鳥が音を遺すのは、過ぎてもまだ遠くないことである。「上るに宜しからず、下るに宜し」とは、順であるべきだということで、順であれば大吉である。過ぎて中に就くのは理に順うことで、過ぎて理に順えばその吉は必ず大きい。</li></ul>\n<p>本田の講説：受講者が「過ぐるを待ちて後能く亨る者有りとはどういうことか」と問うと、少々行き過ぎて初めて思う通りになる、つまり矯枉過正の場合だ、と答えた。「どうしてここに時宜という時の概念が入ってくるのか」には、矯枉過正をするしかるべき時がある、政策でも何でもやり過ぎてちょうどになる時がある、それが時の宜しきを得るということであろう、大象の「行いは恭に過ぎ、喪は哀に過ぎ、用は倹に過ぐ」も時によってそうする、と答えた。「小事は行き過ぎた方が良いこともあるが、大事は行き過ぎてはならないということか」には「そう」と答えた。</p>\n<h3 id=\"g62-s2\">彖伝</h3>\n<div class=\"orig\">小過、小者過而亨也。過以利貞、與時行也。柔得中、是以小事吉也。剛失位而不中、是以不可大事也。有飛鳥之象焉。飛鳥遺之音、不宜上宜下大吉、上逆而下順也。</div>\n<p>小過は小なる者の過ぎて亨るなり。過ぎて以て貞しきに利あり、時と行わるるなり。柔、中を得。是を以て小事に吉なり。剛、位を失して中ならず。是を以て大事に可ならず。飛鳥の象有り。飛鳥之が音を遺す、上るに宜しからず下るに宜し、大吉なるは、上ることは逆にして下ることは順なればなり。</p>\n<p>本田によれば、この卦は彖伝が少し長く難しいので丁寧に読む。最後のところはあまりよくわからない。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>陽は大、陰は小である。陰が位を得（六五）、陽が位を失って中でない（九四）。小者が過ぎるのである。だから小事の過ぎること、過ちの小さいこととする。小者と小事は、時があって過ぎるべきことがあり、その過ぎ方も小さいので小過という。事には過ぎるのを待って初めて亨るものがある。過ぎることがよく亨るゆえんである。</li><li>過ぎて貞に利があるとは、時と行われることである。時が過ぎるべき時に過ぎるのは過ちではなく、時の宜しさで、いわゆる正である。</li><li>小過の道は小事において過ぎれば吉なものである。彖伝は卦の才でその吉の義を言う。「柔、中を得」とは二と五が中にいることで、陰柔が位を得て、小事の吉を致せるだけで、大事を済すことはできない。剛が位を失って中でない、だから大事に可でない。大事は陽剛の才でなければ済せない。三は中でなく、四は位を失う。小過の時は自ずから大事に可でなく、卦の才もまた大事に堪えない。時と合うのである。</li><li>「飛鳥の象有り」の一句は彖伝の体裁に似ない。おそらく解釈者の辞が誤って彖伝の中に入ったのであろう。卦の中の二本が剛（陽）、外の上下各二本が柔（陰）で、飛ぶ鳥の象がある。だから飛鳥について義をなしたのである。</li><li>事は時があって過ぎるべきで、宜しきに従うためである。しかしどうして甚だしく過ぎてよかろう。恭に過ぎ、哀に過ぎ、倹に過ぎるようなことも、大いに過ぎれば不可である。だから小過にあるのである。過ぎる所は飛鳥が音を遺すようであるべきである。鳥は飛ぶのが速く、声が出た時には身はもう過ぎているが、身と声はそれほど遠く離れない。事の過ぎるべきものもそのようで、常を甚だ遠く過ぎてはならず、宜しさを得ることにある。「上るに宜しからず下るに宜し」は、さらに鳥の音について順であるべき義を取る。過ぎる道は飛鳥が遺す音のようであるべきで、声は逆に上れば難しく、順に下れば易しい。だから高い所にあれば大きく響く。山上に雷があるのが小過である。飛鳥の遺す音は順に宜しく、過ぎる道は順に行えば吉である。過ぎるのは宜しきに順うためで、宜しきに順うので大吉である。</li></ul>\n<p>本田の講説：「飛鳥、之が音を遺す」は小さな行き過ぎの例として、鳥の体と音とがそれほど離れていないと言い、しかも残した音の発生源が高ければ大きく響くという。これは大象の「山上に雷有るは小過なり」と内容がかけてある。</p>\n<h3 id=\"g62-s3\">大象</h3>\n<div class=\"orig\">山上有雷、小過。君子以行過乎恭、喪過乎哀、用過乎儉。</div>\n<div class=\"yomi\">山上に雷有るは小過なり。君子以て行いは恭に過ぎ、喪は哀に過ぎ、用は倹に過ぐ。</div>\n<p>山の上で雷が震えば、度を過ぎて音が大きく轟く。君子はこれにかたどって、日常の行いは恭しさの度を少し過ぎるくらいにし、喪に服する時は悲しみが少々行き過ぎたように振る舞い、消費はなるべく倹約の度を少し過ぎるくらいにする。</p>\n<p><span class=\"tag\">程伝</span>雷が山上で震うと、その声は常を過ぎる。だから小過である。天下の事は時があって過ぎるべきだが、過ぎすぎてはならない。だから小過である。君子は小過の象を観て、事の過ぎるべきものを勉める。行いは恭に過ぎ、喪は哀に過ぎ、用は倹に過ぐ、これである。過ぎるべくして過ぎるのは事の宜しさで、過ぎるべきでないのに過ぎるのは過ちである。</p>\n<p>本田の講説：ここの句は『論語』八佾篇の「礼は其の奢らんよりは寧ろ倹せよ。喪は其の易めんよりは寧ろ戚め」を踏まえている。</p>\n<h3 id=\"g62-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>よくわからない爻辞。</b> 朱子が、小過の爻辞は今一つよくわからないと言っている。六二のあたりが何かよくわからない。朱子は九四の注で「よくわからん」と言い、上六の本義では文字の誤りがあるのではないかと言う。</li><li><b>退いて自ら保つ。</b> 九四の程伝「陰過ぐるの時に当たり、陽退縮して自ら保てば足れり」について、受講者が「小人が盛んな時は身をひそめよというのは、ちょっと老荘の思想に似ていますね」と言うと、本田は「はい、少し似ている。道学者にはふさわしくないが、これは程伊川自身にそういう経験がある」と答えた。</li><li><b>上六の「道理」。</b> 受講者が「どうしてここで突然、道理というのが出てくるのか」と問うと、本田は、ここまでは「祖を過ぎて妣に遇う」のように「遇う」は誰かに会う意味だったが、上六の爻辞は誰に会うのかを何も言わないので、程伊川も弱って「道理」を持ち出したのであろう、『易経』の本文は道理に会うというような抽象的なことは言っておらず、易の作者の本意ではないと思われる、と答えた。</li></ul>\n<h3 id=\"g62-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>小さなことなら少々行き過ぎてよく、願いは通る。大きなことで行き過ぎてはならない。</li><li>行き過ぎるなら、恭しさ・悲しみ・倹約の方へ。時宜に適っていれば大吉。</li><li>上を目指すより、下に就く方が順当。</li><li>飛ぶ鳥のように速く遠く行き過ぎれば、救いようのない凶（初六・上六）。</li><li>臣下の分を越えるな（六二）。</li><li>小人の勢いの強い時は、十分に防備せよ（九三）。強がらず退いて身を保て（九四）。</li><li>力の足りない者同士では大事は成らない（六五）。</li></ul><h2 class=\"sec\" id=\"g62-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">飛鳥以凶。</span></summary><div class=\"body\"><div class=\"yomi\">飛鳥以て凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「飛鳥以凶、不可如何也。」（飛鳥以て凶、如何ともす可からざるなり。）</div>\n<p>行き過ぎの度を過ぎて、飛ぶ鳥のように遠くへ行き過ぎた。凶。</p>\n<p><span class=\"tag\">程伝</span>初六は陰柔で下にいる、小人の象である。また上の四に応じ、四は動の体（震）である。小人で躁がしく軽易で、上に応援がある。過ぎるべき所でも必ず甚だしく過ぎる。まして過ぎるべきでないのに過ぎるのはなおさらである。その過ぎ方は飛鳥の速いようで、凶であるゆえんである。躁がしく速いので、過ぎ方が速く遠く、救い止めようとしても及ばない。</p>\n<p><span class=\"tag\">象伝について程伝</span>その過ぎ方は飛鳥の速いようで、どうして救い止められよう。凶なのは当然である。「如何ともす可からず」とは、力を用いる所がないことである。（本田：「如何」は「奈何」と書いてもよい。）</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勢いに任せて一気に行き過ぎ、止めようがない。凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">過其祖、遇其妣。不及其君、遇其臣。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の祖を過ぎて、其の妣（ひ）に遇う。其の君に及ばず、其の臣に遇う。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不及其君、臣不可過也。」（其の君に及ばずとは、臣は過ぐ可からざるなり。）</div>\n<p>おじいさん（九四）を通り過ぎておばあさん（六五）に出会う。上っては行くが、君主の地位にまで及ぼうとはせず、家来の身分のところに行き当たってそこで止まる。咎はない。程伊川の解釈では、家来の分際に踏み止まれということのようである。</p>\n<p><span class=\"tag\">程伝</span>陽が上にあるのは父の象で、父より尊いのは祖の象である。四は三の上にあるので祖とする。二と五は相応の地にいて、ともに柔中の徳があり、志は三・四に従わない。だから四を過ぎて五に遇う、これが祖を過ぐるである。五は陰で尊い、妣（祖母）の象である。二と徳を同じくして相応じる。他の卦では陰陽が相求めるが、過ぎる時には必ず常を過ぎるので異なるのである。過ぎない所はないので、二が五に従うことにも、その過ぎることを戒める。「其の君に及ばず、其の臣に遇う」とは、上に進んでも過ぎて君に及ばず、臣の道に当たれば咎がないということである。遇は当たること。臣の分を過ぎれば咎があることは知るべきである。</p>\n<p>本田の講説：受講者が「父は何か、九三か」と問うと、九三に当たるであろうが、爻辞に「父」の字は出てこないので程伊川も説明していない、祖が四で、それが三の上にあるから三は父と言える、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>過ぎる時は事が常を過ぎないことはない。だから上に進むことにおいては君に及ぶことを戒める。「臣過ぐ可からず」とは、臣の分を過ぎてはならないということである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上を目指して進んでよいが、主君・上司の分まで越えてはならない。自分の分に留まれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">弗過防之。從或戕之。凶。</span></summary><div class=\"body\"><div class=\"yomi\">過ぎて之を防がず。従わば或は之を戕（そこな）う。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「從或戕之、凶如何也。」（従わば或は之を戕う、凶如何ぞや。）</div>\n<p>陰の勢力が強すぎる時なので、少々度を過ぎても小人の勢いを防ぐべきである。そうしなければ、向こうが嵩にかかってこちらを害する。その時は凶。「弗過防之」は「過ぎず、之を防ぐ」とも読めそうだが、王弼・程伊川・朱子とも四字を一句に読み、意味の上からそう読ませる。</p>\n<p><span class=\"tag\">程伝</span>小過は陰が過ぎ、陽が位を失う時である。三はひとり正に居るが、下にいて為す所がなく、衆陰に忌み憎まれる。だから過ぎるべきことがあるとすれば、過ぎて小人を防ぐことにある。もし過ぎてこれを防がなければ、あるいは従ってこれを害する。そうなれば凶である。三は陰が過ぎる時に陽で剛位にいて、剛に過ぎる者である。ある人が「過ぎて防ぐことを戒めるなら、剛に過ぎることも戒めるべきではないか」と問うた。答え：小人を防ぐ道は己を正すことを先とする。三は正を失わないので、必ずしも凶になる義はない。よく過ぎて防げば凶を免れる。三は下の上にいるが、上の下（四）にいても同じで、よく過ぎて防げば免れる。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰が過ぎる時は必ず陽を害し、小人の道が盛んなら必ず君子を害する。過ぎて防ぎをなすべきで、防ぐことが至らなければ害される。だから「凶、如何ぞや」と言う。その甚だしさを言う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>小人の勢力が強い時。やり過ぎと思うほど十分に備えよ。油断すれば害される凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">无咎。弗過遇之。往厲必戒。勿用永貞。</span></summary><div class=\"body\"><div class=\"yomi\">咎无し。過ぎずして之に遇う。往けば厲（あやう）し。必ず戒めよ。永貞に用うること勿れ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「弗過遇之、位不當也。往厲必戒、終不可長也。」（過ぎず之に遇う、位当らざるなり。往けば厲し、必ず戒めよ、終に長ず可からざるなり。）</div>\n<p>九四は陽が陰位にいるが咎はない。剛に過ぎることはなく、ちょうど程のよろしきに合う。しかしもし前進すれば危うい。必ず戒めよ。今までの行き方を固執してはいけない（「永貞」とは今までのやり方を固執すること）。</p>\n<p><span class=\"tag\">程伝</span>四は小過の時に剛で柔位にいる、剛に過ぎないのである。だから咎がない。過ぎなければ宜しきに合う、だから「之に遇う」と言い、その道を得たことをいう。もし往けば危うさがあり、必ず戒め懼れるべきである。「往く」とは柔を去って剛で進むことである。「永貞に用うる勿れ」とは、陽の性は堅剛なので、宜しきに随えと戒め、固守してはならないということである。陰が過ぎる時に陽剛が位を失えば、君子は時に随って順に処すべきで、その常を固く守ってはならない。四は高位にいるが上下の交わりがなく、五に比し初に応じるが、陰が過ぎる時に彼らがどうして陽に従おう。だから往けば危うい。</p>\n<p><span class=\"tag\">象伝について程伝</span>「位当らず」とは柔位にいることをいう。陰が過ぎる時に剛に過ぎずかえって柔位にいるのは、その宜しさを得たのである。だから「之に遇う」という。陽が四にいるのは本来位に当たらないが、柔位にいるのはかえって時の宜しさに合う。陰が過ぎる時は、陽は退縮して自ら保てば足りる。どうして長じて盛んになれよう。だから往けば危うく、必ず戒めるべきである。（本田：「長」は「ながい」でなく「長ず」と動詞に読めと程伝にある。）</p>\n<p>本田の講説：受講者が「小人が盛んな時は身をひそめよというのは、ちょっと老荘の思想に似ていますね」と言うと、「はい、少し似ている。道学者にはふさわしくないが、これは程伊川自身にそういう経験がある」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>強がらず控えめな今の立場が程よい。進めば危うい。従来のやり方に固執せず、退いて身を保て。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">密雲不雨、自我西郊。公弋取彼在穴。</span></summary><div class=\"body\"><div class=\"yomi\">密雲して雨ふらず、我が西郊よりす。公弋（いぐるみ）して彼の穴に在るを取る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「密雲不雨、已上也。」（密雲して雨ふらず、已に上ればなり。）</div>\n<p>周の西の郊外から黒い雲が群がって来るが雨にはならない（小畜の卦辞に同じ文句があった）。お上がいぐるみ（矢の先に紐がついているもの）で穴の中にいる獲物（六二）を捕る。</p>\n<p><span class=\"tag\">程伝</span>五は陰柔で尊位にいる。過ぎて何かを為そうとしても、どうして功を成せよう。密雲が雨にならないようなものである。雨にならないのは西から来るからで、陰は雨を成せない。このことは小畜の卦で解した。「弋」とは射て取ることで、「射」はただ射るだけだが、弋には取る義がある。穴は山中の空所で、中が空である。「穴に在る」とは六二を指す（下卦の艮が山）。五と二はもともと相応ではないが、弋してこれを取る。五は君位に当たるので公という。公とは上のことである。同類（陰）が相取って、これを得ても、両陰でどうして大事を済せよう。密雲が雨にならないようなものである。</p>\n<p><span class=\"tag\">象伝について程伝</span>陽が降り陰が升り、合して和すれば雨となる。陰がすでに上にあり、雲が密でもどうして雨を成せよう。陰が過ぎれば大を成せない義である。</p>\n<p>本田の講説：受講者が「次の爻辞に出てくる密雲は前にもありましたね」と問うと、「密雲は小畜の卦に出てきた」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>気配ばかりで実りがない。力の足りない者同士が組んでも大事は成らない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">弗遇過之。飛鳥離之。凶。是謂災眚。</span></summary><div class=\"body\"><div class=\"yomi\">遇わず、之を過ぐ。飛鳥之を離る。凶。是を災眚（さいせい）と謂う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「弗遇過之、已亢也。」（遇わず之を過ぐ、已に亢ればなり。）</div>\n<p>道理と行き会わず、通り過ぎる。常を過ぎた速さで通り過ぎ、飛ぶ鳥が常識を離れて速く飛び去るようなものである。凶。これは天災であり人災である（「災」は天災、「眚」は人災）。「之を離る」は「之に離る」とも読めるが、上に「之を過ぐ」とあるので程伊川は「はなる」と読む。</p>\n<p><span class=\"tag\">程伝</span>六は陰で動の体にいて、過ぎることの極にいる。理と遇わず、動けばみなこれを過ぎる。理に違い常を過ぎること飛鳥の速いようで、凶であるゆえんである。「離る」とは過ぎることの遠いことで、これを災眚という。災眚があるべきだということである。災は天の殃い、眚は人為である。過ぎることの極なので、人の眚だけでなく天の災もまた至る。その凶は知るべきで、天理も人事もみなそうである。</p>\n<p><span class=\"tag\">象伝について程伝</span>過ぎることの終わりにいて、理に遇わずに過ぎる。過ぎることが亢極（上りつめること。「亢龍悔いあり」の亢）している。その凶は言うまでもない。</p>\n<p>本田の講説：受講者が「どうしてここで突然道理というのが出てくるのか」と問うと、ここまでは祖を過ぎて妣に遇うなど、遇うとは誰かに会う意味だったが、誰に会うのかを爻辞が何も言わないので、程伊川も弱って道理を持ち出したのであろう、『易経』の本文は道理に会うというような抽象的なことは言っておらず、易の作者の本意ではないと思われる、と答えた。受講者が「朱子は何と言っているか」と問うと、朱子は九四の注で「よくわからん」と言い、上六の本義では文字の誤りがあるのではないかと言う、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>道理を外れて行き過ぎ、上りつめた極み。天災も人災も招く凶。</div></div></details><div class=\"pager\"><a href=\"#gua-61\">← 風沢中孚</a><a href=\"#gua-63\">水火既済 →</a></div>", "gua-63": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 63 卦　第六十七講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水火既済</div><div class=\"yo\">すいかきせい</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-63\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-63\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-63\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-63\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-63\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-63\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-63\" data-jump=\"yao\">六爻</a></div><h3 id=\"g63-s0\">卦の名と象</h3>\n<p>下が火、上が水、この卦が既済、「すでに済る」である。「済」は川を渡るが原義で、「わたる」「なす」「なる」と訓ずる。</p>\n<p>程伝（序卦伝を引く）：「物に過ぐる者有れば必ず済す。故に之を受くるに既済を以てす」。よく物に過ぎる者は必ず事を済すことができる。だから小過の後を既済が受ける。</p>\n<ul class=\"sen\"><li>卦は水が火の上にある。水火が交われば相用をなし、それぞれその用に当たる。だから既済という。天下万事がすでに済った時である。</li></ul>\n<p>本田の講説：水は器の中に入っている。これは孔穎達の『周易正義』にはっきりそう書いてある。鍋の中に水が入っていてそれを下から火であぶる、ちょうど物を煮炊きする形で、水の冷気と火の熱気が交流して初めて物が煮炊きできる。序卦伝の意味は、曲がった物を矯めるには少々反対の方に行き過ぎなければならず、そうして初めて物事は成る、ということである。</p>\n<h3 id=\"g63-s1\">卦辞</h3>\n<div class=\"orig\">既濟、亨小。利貞。初吉終亂。</div>\n<div class=\"yomi\">既済は小さきものさえに亨る。貞しきに利あり。初めは吉、終りには乱る。</div>\n<p>大きなものは真っ先に通るが、どんな小さなものにさえ行き届く。動機が正しいことを条件とする。初めは良いが、最後には乱れる（完成の後には必ず未完成の時が来る）。朱子は「小」と「亨」の字をひっくり返せと言うが、程伝を見ると、この順番でなければならない。</p>\n<p><span class=\"tag\">程伝</span>既済の時は、大なる者はすでに亨り、小なる者もなお亨ることがある。既済の時でも小さいものにまだ亨らないものがないとは限らない。「小」の字が「亨」の下にあるのは、言葉としてそうあるべきだからで、もし「小亨る」と言えば、亨ることが小さいという意味になってしまう。「貞しきに利あり」とは、既済の時に処するには、貞固にこれを守ることにある。「初め吉」とは済り始めの時、「終りには乱る」とは、済ることが極まれば反る（ひっくり返る）ということである。</p>\n<h3 id=\"g63-s2\">彖伝</h3>\n<div class=\"orig\">既濟亨、小者亨也。利貞、剛柔正而位當也。初吉、柔得中也。終止則亂、其道窮也。</div>\n<div class=\"yomi\">既済は亨る、小さき者も亨るなり。貞しきに利あるは、剛柔正にして位当ればなり。初め吉なるは、柔、中を得ればなり。終りに止まれば乱る、其の道窮まるなり。</div>\n<p>この卦は一番完成した形で、初・三・五が陽、二・四・上が陰と、陰陽すべてが正しい地位にある。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>既済の時は、大なる者はすでに亨っている。ただ小さい者も亨ることがあるのである。時がすでに済ったので、正固に守るべきである。卦の才は剛柔がみな位に当たる。位に当たるのは常で、正固はこのような常を守ることにある。陰陽がそれぞれ正位を得ている、既済とするゆえんである。</li><li>二は柔順文明で中を得ているので、既済の功を成せる。二は下にいて、済り始めの時で、しかもよく処している。だから吉である。</li><li>天下の事は進まなければ退き、一定の理はない。済の終わりに進まずに止まれば、常に止まることはなく、衰乱が至る。その道が窮まったのである。九五の才が善くないのではなく、時が極まり道が窮まったので、理として必ず変ずべきである。ある人が「聖人はここに至ってどうするのか」と問うた。答え：ただ聖人だけが、まだ窮まらないうちにその変を通じ、極に至らせないことができる。堯舜がそれである。だから終わりがあっても乱れなかった。</li></ul>\n<p>本田の講説：繋辞伝に「易は窮まれば変ず、変ずれば通ず」とある。そうでなければならない。受講者が「これは乾などにある君子終わり有りとどういう関係か」と問うと、「あれは有終の美。あれとはまた別である」と答えた。受講者が「初と始の違いは何か」と問うと、「初」は否定詞の上に置いて「はじめから全然〜しない」という使い方ができるが「始」にはそういう用法はない、「初」は「終わり」に対する起点、一番はじめの意味が強く、「始」はずっと継続する動作の中途にも当てはまる、物事の最初とは言うが最始とは言わない、と答えた。時間・場所の違いは必ずしもない。</p>\n<h3 id=\"g63-s3\">大象</h3>\n<div class=\"orig\">水在火上、既濟。君子以思患而豫防之。</div>\n<div class=\"yomi\">水、火の上に在るは既済なり。君子以て患を思いて、予め之を防ぐ。</div>\n<p>水が火の上にかかっている形が既済である。君子はこの卦の形を見て、将来の心配事を考え、予めこれを防ぐ。上半分の坎は危険・落とし穴、下半分の離は文明・明らかな知恵の意味があり、明らかさで危険を予防するという関係である。</p>\n<p><span class=\"tag\">程伝</span>水火がすでに交わり、それぞれその用を得るのが既済である。時が既済に当たれば、ただ患害が生じることを慮るだけである。だから患を思って予め防ぎ、患に至らないようにする。昔から天下がすでに済って禍乱を招いた者は、患を思って予め防ぐことができなかったからである。</p>\n<h3 id=\"g63-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>「可もなく不可もなし」。</b> 第六十七講の冒頭、本田は前回質問のあった「可もなく不可もなし」について、今では毒にも薬にもならないという意味だが、『論語』の本文ではそういう意味ではない、孔子が伯夷・叔斉以下七人の隠者を挙げて「我は則ち是に異なり。可も無く不可も無し」と言うのは、政治権力をよしとして必ず仕えもせず、不可として全部背を向けもせず、仕えるべき時には仕える、つまり「私は融通無碍だ」という意味だ、と説明した。</li><li><b>既済より未済。</b> 既済は最も理想的な形だが、あまり文句はめでたくない。清の王夫之は既済より未済の方がましと言う。俗人の常識なら未済が先に来て、その後に完成の既済が来る順でも良さそうだが、それをひっくり返している。既済を六十四卦の最後に置いたらそこでサイクルが止まってしまう。</li><li><b>卦の順序は誰が決めたか。</b> 受講者が「この順序は文王の書いた通りか」と問うと、本田は、序卦伝は孔子の作となっている、十翼の作者は孔子で、『史記』孔子世家に「孔子晩にして易を喜み、彖・繋・象・説卦・文言を序す」とあり、通説では序卦伝も孔子の作だが、序卦伝の書き方は既定の順序を説明するような書き方なので、誰がこの順序を定めたかは実は不明だ、と答えた。</li><li><b>上経三十・下経三十四。</b> 六十四卦を上下に分けるのに、三十二ずつでなく上経三十・下経三十四とするのは、卦の配列が上下反対の形の二卦をペアとして挙げてあり、ひっくり返しても同じ形の卦（乾・坤・頤・大過・坎・離など八つ）はそれぞれ一つに数えるので、上経・下経とも十八ずつになるからである。序卦伝では上経が離で終わり下経が咸で始まり、この区切りは動かせないだろう。序卦伝の下経の部分には咸の卦名が出てこず、「夫婦」という語で置き換えている。序卦伝の冒頭で乾坤と言わず「天地」と言うのに合わせたのである。序卦伝は離と咸のつながりについては説明していない。</li><li><b>多士済々。</b> 受講者が「多士済々とはどういう意味か」と問うと、本田は、「多士済々、文王以て寧し」（『詩経』大雅・文王）は救済の意味ではなく、たくさんの士が整然と並んでいることだ、と答えた。</li><li><b>唐の太宗。</b> 六二の程伝の「唐の太宗の諫めを用うるを以てして、猶お終りに怠る」について、本田は、太宗は唐の二代目で西暦六二七年に即位した、『新唐書』の房玄齢伝によれば、太宗は晩年政治に飽きて、かつての宰相房玄齢を呼び出して意見を聞くことがほとんどなくなり、たまに呼び出されると房玄齢はとめどなく涙を流したという、と説明する。</li><li><b>福とは。</b> 九五の講義で、受講者が「福を受けるという言い方は他にも出てくるか」と問うと、晋の六二に「茲の介いなる福を其の王母に受く」（王母は亡くなった祖母。祖母の霊から大いなる福を受ける）とある、と答えた。「福はもともとどういう字か」には、示偏は神様のことで、神様に酒を入れた器を供えている形の象形文字、と答えた。「福禄寿の福は」には、福は『書経』に「寿・康寧・好徳」とある、命が長いことと健康と道徳性を好むことで、道徳性を福に数えたのは非常に理知的だ、と答えた。</li></ul>\n<h3 id=\"g63-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>物事が完成した時。小さなことまで通るが、正しさを堅く守れ。初めは良くても終わりは乱れる。</li><li>完成の時こそ、将来の災いを思って予め防げ。</li><li>安住して止まれば衰乱が来る。行き詰まる前に変化に通じよ。</li><li>勢いに任せて進まず、踏み止まれば咎はない（初九）。</li><li>失ったものを追い求めるな。中正を守れば時が変わって戻ってくる（六二）。</li><li>平定後の遠征は大変な労苦。小人に任せるな（九三）。</li><li>一日中警戒を怠るな（六四）。</li><li>盛大な形より、時に適った誠意が福を受ける（九五）。</li><li>極まれば頭まで水に浸かる危うさ。長くは続かない（上六）。</li></ul><h2 class=\"sec\" id=\"g63-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">曳其輪。濡其尾。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の輪を曳く。其の尾を濡らす。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「曳其輪、義无咎也。」（其の輪を曳く、義として咎无きなり。）</div>\n<p>進もうとする車輪を後ろに引き戻し、進まないようにする。狐が川を渡ろうとして尻尾を濡らし、結局は渡らない。そういう状態であれば咎はない。</p>\n<p><span class=\"tag\">程伝</span>初は陽で下にいて、上は四に応じ、また火の体である。その進む志は鋭い。しかし時はすでに済った。進んで止まなければ悔咎に至る。だからその輪を曳き、その尾を濡らせば、咎なきを得る。輪は行くためのもので、逆にこれを曳くのは進ませないことである。獣が水を渡るときは必ず尾を掲げ、尾を濡らせば渡れない。既済の初めに、よく進むことを止めれば咎はない。止むことを知らなければ咎に至る。</p>\n<p><span class=\"tag\">象伝について程伝</span>既済の初めによく進むのを止めれば極に至らない。その義として自ずから咎がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>物事は既に成った。勢いに任せてさらに進まず、自ら踏み止まれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">婦喪其茀。勿逐。七日得。</span></summary><div class=\"body\"><div class=\"yomi\">婦、其の茀（ふつ）を喪う。逐う勿れ。七日にして得ん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「七日得、以中道也。」（七日にして得ん、中道を以てなり。）</div>\n<p>妻が車で外出しようとしたところ、車の覆いをなくした（「茀」は髪飾り、馬の髪飾り、あるいは女車の覆いのことで、ここでは車の覆いが一番当たる。古代では夫のある婦人は他人に道で顔を見せないのが礼儀であった）。これでは外出できない。しかし心配はいらない。探し回らなくても七日すれば帰ってくる。</p>\n<p><span class=\"tag\">程伝</span>二は文明中正の徳で、上の剛陽中正の君（九五）に応じる。その志を行えるはずである。しかし五はすでに尊位を得て、時はすでに済っている。もう進んで為すこともなく、下にいる賢者を用いようと求める意はない。だから二は行いを遂げられない。昔からすでに済ってよく人を用いた者は少ない。唐の太宗ほど諫めを用いた人でも、なお晩年には怠った。ましてそれ以下の者はなおさらである。この時には、剛中（九五）はかえって中が満ちることになり、坎と離は相戻る（敵対する）。人がよく時を識り変を知れば、易を語ることができる。二は陰なので婦という。茀は婦人が門を出るとき自らを覆い隠すもので、茀を失えば行けない。二が五に求め用いられなければ行けないのは、婦が茀を失うようなものである。しかし中正の道はどうして廃されよう。時が過ぎれば行けるであろう。「逐う」とは物に従うことで、物に従えば平素の守りを失う。だから逐う勿れと戒める。自ら守って失わなければ、七日でまた得られる。卦には六つの位があり、七は変ずることで、七日にして得んとは時が変ずることをいう。上に用いられなくても、中正の道が最後まで廃される理はない。今行えなくても必ず別の時に行われる。聖人の勧め戒めは深い。</p>\n<p>本田の講説：易を語るには、満ち溢れるという変化を知らなければならない。良い卦であっても時によって悪いところがある。受講者が「七日にして得んの七日は他にも出てくるか」と問うと、「復の卦に七日来復とある」と答えた。「爻の数が六だからその次ということか」には「そう。これが一番分かりやすい解釈」と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>中正の道は時に用いられなくても、ついに行われない理はない。だから茀を失っても七日でまた得られる。自らその中を守れば、別の時に必ず行われる。中を失わなければ正である。（本田：「中」の方が「正」よりも上というのが程伊川の理論である。）</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に用いられず、身動きが取れない。失ったものを追い求めるな。正しさを守って待てば、時が変わって戻ってくる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">高宗伐鬼方、三年克之。小人勿用。</span></summary><div class=\"body\"><div class=\"yomi\">高宗、鬼方を伐ち、三年にして之に克つ。小人は用うる勿れ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「三年克之、憊也。」（三年にして之に克つ、憊（つか）れたるなり。）</div>\n<p>殷の高宗が鬼方（異民族の国の名前。『後漢書』西羌伝に出てくる）を征伐し、三年かかってようやく勝った。高宗は殷の二十三代目の帝王で、紀元前千三百年頃の人物。高宗のような王者の征伐だから良いのであって、小人はこのような場合に用いてはならない。</p>\n<p>本田の講説：受講者が「三年という言葉は他にも出てくるか」と問うと、同人の「三歳まで興さず」の三歳が同じような意味で、同人の場合は三年かかっても戦を起こせない、と答えた。</p>\n<p><span class=\"tag\">程伝</span>九三は既済の時に剛で剛位にいる、剛を用いることの至りである。すでに済って剛を用いることこのようなのは、高宗が鬼方を伐つことである。高宗は必ず商（殷）の高宗であろう。天下の事がすでに済って、遠く暴乱を伐つのである。威武が及ぶことができて、民を救うことを心とするのは王者の事で、聖賢の君なら可である。もし威武をほしいままにし、服さない者を怒り、土地を貪るなら、民を損ない欲をほしいままにすることになる。だから「小人は用うる勿れ」と戒める。小人がこれを為せば、貪りと怒りの私意でする。貪りと怒りでなければあえてしないのである。「三年にして之に克つ」は、その労憊の甚だしさを示す。聖人は九三が既済の時に剛を用いることにちなんでこの義を発し、人に示して法とし戒めとした。浅見の者の及ぶ所ではない。</p>\n<p><span class=\"tag\">象伝について程伝</span>「憊れたり」と言って、その事の至って難しいことを示す。高宗にあってこれを為すのは可だが、高宗の心がなければ、貪りと怒りで民に災いを及ぼす。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>平定後になお大事を起こせば大変な労苦となる。大義ある者なら可だが、私欲で事を起こすな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">繻有衣袽。終日戒。</span></summary><div class=\"body\"><div class=\"yomi\">繻（じゅ）るるに衣袽（いじょ）有り。終日戒む。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「終日戒、有所疑也。」（終日戒むとは、疑う所有るなり。）</div>\n<p>舟に水漏れがある。その水漏れを埋める古着やぼろを用意して詰め、一日中水漏れを警戒せよ。「繻」は彩りのある分厚い絹のことで、それに衣が詰まっているというのは少しおかしく、程伝に「繻は当に濡に作るべし」とある。程伊川だけでなく、字を改めよとする説の方が多い。「袽」はぼろきれの意味。</p>\n<p><span class=\"tag\">程伝</span>四は既済の卦で坎の体にいるので、舟を取って義とする。四は君に近い位で、その任に当たる者である。既済の時には、患を防ぎ変を慮ることを急務とする。繻は濡とすべきで、滲み漏れることである。舟に漏れがあれば衣袽で塞ぐ。衣袽があって濡漏に備え、また終日戒め懼れて怠らない。患を慮ることはこのようであるべきである。吉と言わないのは、ようやく患を免れたところで、既済の時に患を免れれば足り、それ以上を望むことはないからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>終日戒め懼れるのは、常に患が至ろうとするのを疑うのである。既済の時に処するには、このように畏れ慎むべきである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>すでに成ったものにほころびが生じつつある。備えを用意し、一日中警戒を怠るな。災難を免れれば十分。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">東鄰殺牛、不如西鄰之禴祭、實受其福。</span></summary><div class=\"body\"><div class=\"yomi\">東鄰牛を殺すは、西鄰の禴祭（やくさい）に如かず。実に其の福を受けん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「東鄰殺牛、不如西鄰之時也。實受其福、吉大來也。」（東鄰牛を殺すは、西鄰の時あるに如かざるなり。実に其の福を受く、吉大いに来るなり。）</div>\n<p>東隣の家が牛を殺して祭っている。これは西隣の家の質素な祭りに及ばない。西隣の質素な祭りこそ、まことに神から福を受けるであろう。牛を殺すのは贅沢で最高の祭りで、東隣の大盤振る舞いの祭りより、西隣の粗末な祭りの方が誠意がこもっているということである。</p>\n<p><span class=\"tag\">程伝</span>五は中実で孚（まこと）である。二は中虚で誠である。だからどちらも祭祀を取って義とする。東鄰は陽で五をいい、西鄰は陰で二をいう。牛を殺すのは盛大な祭り、禴は質素な祭りである。盛祭が薄祭に及ばないのは、時が同じでないからである。二も五もみな孚誠中正の徳がある。二は済の下にいて、なお進むことがあるので福を受ける。五は済の極にいて、進む所がない。誠中正をもって守っても、まだひっくり返るに至らないだけである。理が極まって反らないものはない。すでに極に至れば、善く処しても如何ともしようがない。だから爻と象はただその時を言うのである。</p>\n<p>本田の講説：注釈者によっては、九五において六二を讃えるのはおかしいと疑う者もあるが、程伊川はこれを九五への戒めの言葉と取ればよいと考えた。『礼記』坊記篇の、祭りには誠意が大切だということを述べた文の中にこの句が引かれており、後漢の鄭玄の『礼記』注で初めて、東隣は殷の紂の国、西隣は周の文王の国と解釈された。程伊川がそのことを説明しないのは、易を書いた文王がまだ紂の家来で、しかも牢屋に入れられている時に紂の悪口を書くのは難しいと考えたからではないか。</p>\n<p><span class=\"tag\">象伝について程伝</span>五の才徳が善くないのではなく、二の時に及ばないのである。二は下にいて進む時がある。中正で孚があれば、その吉は大いに来る。いわゆる福を受けるのである。「吉大いに来る」とは、既済の時において大いに来るということである。小に亨るのは初の吉（「咎无し」）である。（本田：最後の所が少しわかりにくい。なぜここで「大」の字が出てくるのかの理由を述べている。）</p>\n<p>本田の講説：受講者が「福を受けるのは六二か九五か」と問うと、九五の爻辞で六二を褒め称えるのはおかしいとして東隣を六二、西隣を九五とする解釈もあるが、西・東と陰・陽の関係が逆転してしまうので無理がある、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>絶頂を過ぎた立場では、盛大な形式より、時に適った質素な誠意の方が福を受ける。これから伸びる者に分がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">濡其首。厲。</span></summary><div class=\"body\"><div class=\"yomi\">其の首（こうべ）を濡らす。厲（あやう）し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「濡其首厲、何可久也。」（其の首を濡らす、厲し、何ぞ久しかる可けんや。）</div>\n<p>狐が川を渡り終えた途端に頭までどっぷり濡らしてしまう（初九の「尾を濡らす」と同じく狐が川を渡る様子にたとえた）。危ない。</p>\n<p><span class=\"tag\">程伝</span>既済の極は、もとより安らかでなく危うい。また陰柔でここにいて、坎の体の上にいる。坎は水で、済も水を渡る義を取る。だからその窮まりは首を濡らすに至ると言う。危うさは知るべきである。既済の終わりに小人がいれば、その敗壊は立ったままで待てるほどすぐ来る。</p>\n<p>本田の講説：ちょうど向こう岸に届いたところで、まだ陸に上がっていない状態である。受講者が「首という字はこうべと読むのか」と問うと、「首」は首領、かしらの意味で、「くび」は「頸」の字で表す、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>既済の窮まりは危うく、首を濡らすに至る。どうして長久であり得よう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>成し遂げたと思った途端に足をすくわれる危うさ。今の状態は長くは続かない。</div></div></details><div class=\"pager\"><a href=\"#gua-62\">← 雷山小過</a><a href=\"#gua-64\">火水未済 →</a></div>", "gua-64": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 64 卦　第六十七講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">火水未済</div><div class=\"yo\">かすいびせい</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-64\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-64\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-64\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-64\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-64\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-64\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-64\" data-jump=\"yao\">六爻</a></div><h3 id=\"g64-s0\">卦の名と象</h3>\n<p>この卦は既済を上下ひっくり返した形で、下が坎（水）、上が離（火）。前の既済は全部の爻が正であったが、この未済では全
