久而不已也。</div>\n<div class=\"yomi\">恒は亨る、咎无し、貞しきに利ありとは、其の道に久しければなり。天地の道は恒久にして已まざるなり。</div>\n<p>願いが通り咎がなく正しきに利があるのは、その道を恒久的に守っているからである。天地の道は恒久であってやまない。</p>\n<p><span class=\"tag\">程伝</span>恒の道は亨って咎がないが、恒とするところがその正を得ていなければならない。正を失えば恒とすべき道ではない。「其の道」とは恒とすべき正道である。その道を恒にしないことと、不正に恒であることは、どちらも亨ることができず咎がある。天地がやまないのは恒久の道があるからで、人も恒とすべき道に恒であれば天地の理に合する。本田によれば、天・地・人を「三才」と並び称し、中国には古くから人は小宇宙で天地と合致できるという思想がある。</p>\n<div class=\"orig\">利有攸往、終則有始也。</div>\n<div class=\"yomi\">往く攸有るに利ありとは、終われば則ち始まること有るなり。</div>\n<p>前進すれば利益がある。一旦行き止まったようでもまた始まるので、永遠に前進する可能性がある。</p>\n<p><span class=\"tag\">程伝</span>天下の理として、動かずに恒であり得るものはない。動けば終わってまた始まるので、恒であって窮まらない。天地の生ずる物は、山岳の堅く厚いものでさえ変わらないものはない。だから恒とは一定のことではない。一定であれば恒であることはできない。ただ時に随って変易することが常道である。だから「往く攸有るに利あり」という。この理を明らかにしたのは、人が常に拘泥することを恐れるからである。</p>\n<div class=\"orig\">日月得天而能久照、四時變化而能久成、聖人久於其道而天下化成。觀其所恆、而天地萬物之情可見矣。</div>\n<div class=\"yomi\">日月は天を得て能く久しく照らし、四時は変化して能く久しく成し、聖人は其の道に久しくして天下化成す。其の恒とする所を観て、天地万物の情見る可し。</div>\n<p><span class=\"tag\">程伝</span>これは常の理を極言する。日月は陰陽の精であり、天の道に順って往来盈縮するので、久しく照らしてやまない。「天を得」とは天理に順うことである。四時は陰陽の気で、往来変化して万物を生成し、これも天を得ているので常久にしてやまない。聖人は常久の道をもって行うことに常があり、天下はこれに化して美しい風俗を成す。「其の恒とする所を観る」とは、日月が久しく照らし、四時が久しく成し、聖人の道が常久であり得る理を観ることで、これを観れば天地万物の情理が見える。天地常久の道、天下常久の理は、道を知る者でなければ誰が識ろう。</p>\n<h3 id=\"g32-s3\">大象</h3>\n<div class=\"orig\">雷風、恆。君子以立不易方。</div>\n<div class=\"yomi\">雷風は恒なり。君子以て立ちて方を易えず。</div>\n<p>雷と風が助け合う形が恒である。君子はこの卦のシンボルに従って、立脚点を変えない。</p>\n<p><span class=\"tag\">程伝</span>君子は雷風が相与して恒を成す象を観て、その徳を常にし、自ら大中常久の道に立って、その方所（立場）を変えない。</p>\n<h3 id=\"g32-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>恒は一定不変ではない。</b> 程伊川は繰り返し、恒とは一隅を守って変化を知らないことではなく、時に随って変易することこそが常道だと説く。変化の中に常がある。</li><li><b>中は正より重い。</b> 九二の程伝は、陽が陰位にいて「正」を得ていなくても「中」を得ていれば悔が亡ぶとし、中であれば正しいが、正は必ずしも中ではない、と言う。本田によれば、『易経』全体で中の徳のほうが確かに強い。中と正の軽重をわきまえれば易を語ることができる、と程伝は言う。</li><li><b>『論語』に引かれる九三。</b> 九三の「其の徳を恒にせずんば、或は之が羞を承けん」の二句は『論語』子路篇にそのまま引かれている。孔子が易を引用したのである。</li><li><b>陰の君主と陽の臣。</b> 他の卦では陰が君位にいて下の陽に応ずるのは悪くない。師・泰・大有・蠱などはいずれも君位が陰で九二の強い家来に応じ、師では下の強い将軍に戦の全権を委任する意味になる。しかし恒の卦では、弱い君主が強い家来に従うことを常の道とするのはよくない（六五）。</li><li><b>「一に従って終わる」。</b> 六五の象伝のこの言葉は、後世、一人の夫に操を守って再婚してはならぬ意味によく使われた。実際は再婚は必ずしも許されないことではなかったが、後家を通すことが褒めたたえられた。本田は、孔子もこういう所では割にわからず屋で、『論語』を見ても結構難しい亭主だったらしく、奥さんに早く逃げられている、と言う。</li><li><b>変化と節操の程度問題。</b> 講義の終わりに受講者が「全部の判断があまり良くない」「凶と吝が非常に多い」と言うと、本田は咸も恒もあまり良くないと答えた。「変化は常道だと言いながら、しょっちゅうふらふらするのも良くないのか」「変化しないのもまた駄目なのか」との問いに、程度問題で、一隅を守って動かないのも良くないが、ふらふらして節操がないのも良くない、易という字自体が「かわる」という意味で固執は良くないが、あまり動くのも良くない、時と位による、と答えた。</li></ul>\n<h3 id=\"g32-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>願いは通り咎もないが、動機が正しいことが条件。前進してよい。</li><li>恒とは一定不変ではなく、時に随って変わりつつ正道を守ること。</li><li>立脚点をむやみに変えるな。</li><li>下の身で上に多くを求めすぎ、元のあり方に固執すれば凶（初六）。</li><li>位が不正でも中庸を守れば悔は消える（九二）。</li><li>主義をふらふら変えれば恥を受け、どこにも身の置き所がなくなる（九三）。</li><li>本来いるべきでない場所に長く居座っても成果はない（九四）。</li><li>従順を常とするのは女性には吉、男性には凶（六五）。</li><li>高い地位でせわしなく動き回れば凶で、何の功もない（上六）。</li></ul><h2 class=\"sec\" id=\"g32-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">浚恆、貞凶、无攸利。</span></summary><div class=\"body\"><div class=\"yomi\">浚（ふか）く恒にす。貞しけれど凶。利する攸无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「浚恆之凶、始求深也。」（浚く恒にするの凶なるは、始めにして求むること深ければなり。）</div>\n<p>初六は恒を求めることが深きに過ぎる。志は正しそうであるが、結果は凶。何の利益もない。</p>\n<p><span class=\"tag\">程伝</span>初は下にいて、四はその正応である（初と四は陰陽で応じる）。柔暗な人で、常を守ることはできても勢いを度ることができない。四は震の体で陽性であり高い所にいて、上ることを志して下らない。また二・三に隔てられて、初に応ずる志は常とは異なる。それなのに初は四に求め望むことが深い。これは常を知って変を知らないのである。浚とはこれを深くすること、浚恒とは恒を求めることが深いことである。常を守って勢いを度らず、求め望むことが深いのを固く守るのは凶の道である。常に泥（なず）むことがこのようであれば、どこへ往っても利がない。世間で故素（元のあり方）を責め望んで悔咎に至る者は、みな恒に浚い者である。上に求めることが深いのは、自分の場所に安んずることができない者で、柔微の身で安んじないのもまた凶を招く道である。およそ卦の初は始めで微かな地、上は終わりで深く盛んな地である。下にいて求めることが深いのは、時を知らないのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>恒の始めにいて上に求め望むことが深いのは、常を知って勢いを度ることを知らないことの甚だしいものである。凶であるのは、柔暗で恒の宜しさを得ていないからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>まだ始めの低い身で、相手や上に多くを求めすぎている。元のあり方に固執し時勢を見なければ凶で、何の利もない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">悔亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九二悔亡、能久中也。」（九二の悔亡ぶは、能く中に久しければなり。）</div>\n<p>この爻が出れば後悔はなくなる。九二は吉凶の判断辞だけで、状況を形容する文句がない。こういう例も時々ある。</p>\n<p><span class=\"tag\">程伝</span>恒の時にいて、居場所がその正を得ているのが常道である。九は陽で陰位にいるので常の理ではなく、本来悔があるはずである。しかし二は中徳をもって五に応じ、五もまた中にいる。中をもって中に応じ、居ることも動くこともみな中を得ている。これはよく中に恒久なのである。中に恒久であれば正を失わない。中は正より重く、中であれば正しいが、正は必ずしも中ではない。九二は剛中の徳で中に応ずる、徳の勝れたものであり、悔を亡ぼすに足る。人が中と正の軽重の勢いを識れば、ともに易を語ることができる。</p>\n<p>本田の講説：陰が陰位、陽が陽位にいるのが常道だが、九二は陽で陰位（偶数位）にいる。程伊川は中のほうが正より上だと言い、『易経』全体で中の徳のほうが確かに強い。</p>\n<p><span class=\"tag\">象伝について程伝</span>悔が亡ぶのは、よく中に恒久であるからである。人がよく中に恒久であれば、ただ悔を亡ぼすだけではなく、徳の善いものである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>立場は本来ふさわしくないが、中庸を守り続ければ後悔は消える。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">不恆其德、或承之羞、貞吝。</span></summary><div class=\"body\"><div class=\"yomi\">其の徳を恒にせずんば、或は之が羞（はじ）を承けん。貞しけれど吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不恆其德、无所容也。」（其の徳を恒にせず、容るる所无きなり。）</div>\n<p>自分の徳を恒久的なものとしない、つまり自分の主義をふらふらと変える時には、恥を受けることがあろう。自分自身は正しい道を守っているつもりでも、恥ずべき結果になる。この二句は『論語』子路篇にそのまま引かれている。</p>\n<p><span class=\"tag\">程伝</span>三は陽で陽位にいて、居る場所がその位を得ている。これは常の場所である。しかし志は上六に従おうとする。ただ陰陽が相応ずるだけでなく、風（巽）はまた雷（震）に従う。恒とすべき場所にいて恒に居らない、常のない人である。その徳が常でなければ、羞辱を承けることがある。「或は之を承く」とは、時あってやって来ることである。「貞しけれど吝」とは、常でないことを固守して恒としているので、どうして羞じないでいられよう。「吝」も恥の意味である。</p>\n<p>本田の講説：陽が陽位という自分の位置にじっとしていないで、上に向かってふらふらと色目を使う。全くもって恥ずべきことである。</p>\n<p><span class=\"tag\">象伝について程伝</span>人がもともと常がなければ、どこに身を容れられよう。当然いるべき地にさえ恒であることができない。身を置く場所が本来腰を据えるべき所でなければ、どうして恒であり得よう。常のない人は身を容れる所がないのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>主義や態度をふらふら変えれば恥を受け、どこにも身の置き所がなくなる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">田无禽。</span></summary><div class=\"body\"><div class=\"yomi\">田（かり）して禽无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「久非其位、安得禽也。」（其の位に非ざるに久しければ、安んぞ禽を得んや。）</div>\n<p>狩りをしても獲物がない。吉凶の文句がないが、この句は形容であると同時にそのまま判断になっている。悪いことは言わずとも判るので凶と言わない。</p>\n<p><span class=\"tag\">程伝</span>陽で陰位にいて、居る所がその位ではない。居る所がその所でなければ、恒であっても何の益があろう。人のなすことは、その道を得れば久しくして功を成すが、その道を得なければ久しくしても何の益もない。だから田猟を譬えとする。九が四にいれば、たとえ恒久であっても、田猟して禽獣の獲物がないようなもので、いたずらに力を用いて功がないことを言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>居る所がその位でなければ、久しくても何を得られよう。田猟を譬えとするので「安んぞ禽を得ん」という。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>本来いるべきでない場所でいくら粘っても、骨折り損で成果はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">恆其德、貞。婦人吉、夫子凶。</span></summary><div class=\"body\"><div class=\"yomi\">其の徳を恒にす。貞し。婦人は吉、夫子は凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「婦人貞吉、從一而終也。夫子制義、從婦凶也。」（婦人は貞しくして吉、一に従って終ればなり。夫子は義を制す、婦に従えば凶なり。）</div>\n<p>自分の徳を恒常的なものにすれば正しい。この爻が出た場合、婦人にとっては吉、男子にとっては凶。占った人が女か男かによって吉凶が分かれる。</p>\n<p><span class=\"tag\">程伝</span>五は二に応じ、陰柔で陽剛に応じ、中にいて応ずる相手もまた中である。陰柔の正である。だからその徳を恒久にすれば貞である。順うことを恒とするのは婦人の道で、婦人においては貞で吉である。もし丈夫（男）が順従を恒とすれば、陽剛の正を失い、凶である。五は君位なのに君道で言わないのは、六五の義は丈夫においてさえ凶であり、まして人君においてはなおさらだからである。他の卦では柔が君位にいて剛に応ずるのを、まだ失とはしない。恒にあるから不可なのである。君道がどうして柔順を恒とできよう。</p>\n<p>本田の講説：師・泰・大有・蠱などは君位が陰で九二の強い家来に応じているが、必ずしも悪い判断ではない。恒の卦にあるから、弱い君主が強い家来に権力を委ねることは常の道として良いとは言えないのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>五が二に従うのは、婦人においては正しくて吉である。婦人は従うことを正とし、順を徳とし、終生一人の夫に従うことを守るべきである。夫子は義をもって事を制する者で、婦人の道に従えば凶である。</p>\n<p>本田の講説：夫は自分で物事の方針を決めるべきもので、妻の言うことを聞いて尻に敷かれるのは凶である。「一に従って終わる」はここから出た言葉である（程伝と本田の講説の項参照）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人に従順であることを貫くのは、女性には吉、男性には凶。男は自ら方針を決めよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">振恆、凶。</span></summary><div class=\"body\"><div class=\"yomi\">恒に振（ふる）う。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「振恆在上、大无功也。」（振恒にして上に在り、大いに功无きなり。）</div>\n<p>上六はふらふら動くことを常としている。こういう生き方は凶である。</p>\n<p><span class=\"tag\">程伝</span>六は恒の極みにいて、震の終わりにいる。恒が極まれば常でなくなり、震の終わりは動きの極みである。柔で上にいるのは安らかな場所ではなく、また陰柔は守りを堅固にすることができない。みな常でない義である。だから振を恒とする。振とは動きの速やかなもので、衣を振るい、書を振るうように、運動が絶えないことである。上にいて動きに節がなく、それを恒とする。凶であるのは当然である。</p>\n<p>本田の講説：「衣を振るう」とは着物の両肩を持ってばたばたとほこりを払うこと、「書を振るう」とは紙魚を落とすため書物をばたばたと振るうことで、激しく連続して動く意味である。</p>\n<p><span class=\"tag\">象伝について程伝</span>上にいる道は、必ず恒の徳があって初めて功がある。もし躁動して常がなければ、何を成し遂げられよう。上にいて常がないので、その凶は甚だしい。象伝はさらに、何も成立させられないことを言って「大いに功无し」という。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高い地位にいながら落ち着きなく動き回っている。凶で、何の功も立たない。</div></div></details><div class=\"pager\"><a href=\"#gua-31\">← 沢山咸</a><a href=\"#gua-33\">天山遯 →</a></div>", "gua-33": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 33 卦　第五十二講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天山遯</div><div class=\"yo\">てんざんとん</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-33\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-33\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-33\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-33\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-33\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-33\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-33\" data-jump=\"yao\">六爻</a></div><h3 id=\"g33-s0\">卦の名と象</h3>\n<p>艮下乾上。艮は止まる、あるいは山を意味し、乾は天を意味する。下が山、上が天という形が遯という卦である。</p>\n<p>程伝（序卦伝を引く）：「恒とは久しきなり。物は以て久しく其の所に居る可からず。故に之を受くるに遯を以てす。遯とは退くなり」。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>物が久しく止まれば必ず去ることがある。久しく止まることと去ることは相伴う理である。だから遯が恒に継ぐ。遯は退くこと、避けることで、ものから背を向けて去る義である。</li><li>卦は天の下に山がある。天は上にある物で、陽の性は上り進む。山は高く起こる物だが、その体は止まる物である。山には上を凌ごうとする象があるが止まって進まない。天は上り進んでこれから去る。下が上を凌ごうとすると上は去る。互いに違（たが）う（「違」は道の上で足が別の方向を向いている形）。だから遯去の義となる。</li><li>二陰が下に生じ、陰が長じてまさに盛んになろうとし、陽は消えて退く。小人がだんだん盛んになり、君子が退いてこれを避ける。だから遯という。</li></ul>\n<h3 id=\"g33-s1\">卦辞</h3>\n<div class=\"orig\">遯、亨。小利貞。</div>\n<div class=\"yomi\">遯は亨る。小しく貞しきに利あり。</div>\n<p>卦辞は至って簡単である。この卦が出たら願いごとは通るであろう。大事業には向かないが、小さく消極的に正義を守るにはよろしい。</p>\n<p><span class=\"tag\">程伝</span>遯は陰が長じ陽が消える、君子が遯れ蔵（かく）れる時である。君子は退き蔵れてその道を伸ばす。道が屈しないのが亨るということで、だから遯には亨る道理がある。世の事においても、遯れることで亨るものがある。小人の道が長ずる時でも、君子が幾（きざし）を知って退き避けるのはもとより善い。しかし事には一概に言えないところがあり、時と共に消息（伸縮）すべきで、必ずしも同じではない。陰柔がまさに長じようとしていても、まだ甚だしく盛んではないので、君子にはなお遅々として力を致す道がある。大貞にはよろしくないが、なお小貞には利がある。</p>\n<p>本田の講説：「退蔵」は繋辞伝の「聖人は此を以て心を洗い、密に退蔵す」から出た言葉で、天道の精密な動きの中に身を隠すということである。これを名前にした人に国文学者の穎原退蔵がいる。受講者が「幾という字には、兆しのほかに物事のツボという意味もあるのか」と問うと、本田は、それは木偏をつけた「機」の字のほうで、機は機械仕掛けの石弓の引き金の部分なので、きっかけとか一番大事な所という意味になるが、「幾」だけではそういう意味にはならない、と答えた。受講者が「安岡正篤氏が『幾を知る』をツボの意味に解していたのでおかしいと思った」と言うと、本田は、繋辞伝の定義では幾とは「動の微、吉の先見」で、それが一番元の意味だと答えた。</p>\n<h3 id=\"g33-s2\">彖伝</h3>\n<div class=\"orig\">遯亨、遯而亨也。</div>\n<div class=\"yomi\">遯は亨るとは、遯れて亨るなり。</div>\n<p>卦辞に「遯は亨る」とあった。その意味は、一歩退くことによって自分の願いが叶うということである。卦辞は「遯亨」の二字だけだったが、彖伝は「而」の一字を加えただけで意味がはっきりした。</p>\n<p><span class=\"tag\">程伝</span>小人の道が長ずる時、君子は遯れ退く。それが道の亨るゆえんである。君子が遯れ蔵れるのは道を伸ばすためである。これは遯の時に処する道を言う。「剛位に当りて応ず」以下は、この時とこの卦の才に、なお為すべき理があることを論じる。</p>\n<div class=\"orig\">剛當位而應、與時行也。</div>\n<div class=\"yomi\">剛、位に当りて応ず。時と行くなり。</div>\n<p>九五という剛毅なものが中正の君位に当たり、下の六二と応じている。陰気の伸びる時とはいえ、時勢の動きに応じて行動することを示す。「時と行く」とは、隠れるばかりで何もしないのではなく、時によっては行動し、時によっては隠れることである。</p>\n<p><span class=\"tag\">程伝</span>遯の時であっても、君子がこれに処するのに、必ず退く義があるわけではない。五は剛陽の徳で中正の位にいて、下の六二もまた中正で応じている。陰が長ずる時でも、卦の才がこのようであれば、なお時に随って消息すべきで、いやしくも力を致せるならば、至誠を尽くしてその道を扶持しないことはない。必ずしも遯れ蔵れることを必然とするのではない。だから「時と行く」という。</p>\n<p>本田の講説：ここの程伝は、孔子の彖伝よりさらに激しく積極的な意味を打ち出している。逃れる時ではあるが、まだ努力する余地のある時は、時に応じて力を奮えと言うのである。</p>\n<div class=\"orig\">小利貞、浸而長也。遯之時義大矣哉。</div>\n<div class=\"yomi\">小しく貞しきに利ありとは、浸（ようや）くにして長ずるなり。遯の時義大なるかな。</div>\n<p>卦辞に「小しく貞しきに利あり」とあったのは、陰がだんだんと長ずる時だからで、積極的な行動には利益がなく、小さな正義に利益がある。遯という逃れるべき時の意味には偉大なものがある。</p>\n<p><span class=\"tag\">程伝</span>陰が長ずる時に大貞にはよろしくないが小貞には利がある、というのは、陰の長ずるのは必ず浸（じわじわ下から水が浸す）によるもので、急に盛んになることはできないので、君子はなお少しは道を貞しくすることができるからである。「小利貞」とは、道を扶持してまだ亡びないようにすることである。遯は陰が初めて長ずる時で、君子は微を知るので、当然深く戒めるべきだが、聖人（彖伝の作者、孔子）の天下を救う意はたやすくやむものではない。だから「時と行く」「小利貞」の教えがある。聖賢は天下において、道がまさに廃されようとしていると知っても、どうして座ったまま乱れを見過ごして救わないでいられよう。必ず区々として力を、乱れがまだ極まらない間に致し、衰えたものを強くし、彼（小人）の進むのを難儀させ、しばらくの安らぎを図る。いやしくもこれをなし得るなら、孔孟も潔しとしてなしたことである。王允が漢において、謝安が晋においてしたのがこれである。もし変ずべき道、亨るべき道理があるなら、言うまでもない。これが遯の時に処する道である。だから「其の時義大なるかな」と讃える。遯の時は久しいこともあり速やかなこともあるが、その義はみな大である。</p>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>後漢の終わりに宦官と正義派の官僚が争って世が乱れ、董卓という軍閥が出てきて宦官を皆殺しにした。董卓は物凄い野心家で、天子を洛陽から長安に連れていって自分が天子になろうとした。王允という正義派の官僚が董卓をやっつけようとしたが、策があまり上手でなく逆に殺された。謝安は東晋の宰相（文官）で、大将軍の桓温が軍事権を握って天子の位を狙っていたが、謝安がうまく立ち回って、とうとう桓温に天下を奪わせなかった。王允は策略が下手であっさり殺されたのであまり褒められないが、程伊川は王允の志を買って褒めている。王允のことは『後漢書』、謝安のことは『晋書』に伝記がある。中国には『史記』から『明史』まで全王朝の歴史書が欠かさず続いており、新しい王朝が建つと第一にやるべきことは、滅ぼした前の王朝の歴史書を編纂することであった。</li><li>受講者が程伊川の時代を問うと、本田は、北宋の人で、宋の王朝はまだ南に追い落とされてはいないが、遼や金などの異民族の国がいつも攻め込もうとしていた危機的な状況だったので、宋のインテリゲンチャは例外なく尊王攘夷の思想が強く、異民族への敵愾心と国を守らねばという愛国心が旺盛であった、と答えた。</li><li>「時義大なるかな」について：「何々の時、義大なるかな」「時義大なるかな」「時用大なるかな」などがいくつか出てくる。時義は卦の時の持つ意義で、ここでは遯という時の持つ意味である。</li><li>受講者が「孔孟の為すを屑しとする所」の意味を問うと、本田は、逃げねばならない事態に近いが、少しでも国を守りしばらくでも安らかにしようということで、それができるなら孔子や孟子も同じことをやったであろう、という意味だと答えた。また孔子は天下の人を救わねばという思いがある一方で、川のほとりで水浴びをし、春の暮れに新しい着物で散歩しようということをいつも夢見ていた、と言う。</li></ul>\n<h3 id=\"g33-s3\">大象</h3>\n<div class=\"orig\">天下有山、遯。君子以遠小人、不惡而嚴。</div>\n<div class=\"yomi\">天の下に山有るは遯なり。君子以て小人を遠ざけ、悪（にく）まずして厳にす。</div>\n<p>この卦は天の下に山がある。天は上へ上へ逃れ、山は下に踏みとどまる。君子はこの卦の形にかたどって、小人を遠ざける。悪口雑言を吐くのではなく、自ら厳格な態度で小人を遠ざける。</p>\n<p><span class=\"tag\">程伝</span>天の下に山がある。山は下に起こって止まり、天は上り進んで、相違う。これが遯避の象である（「山上に起りて」とするテキストがあるが、「下に起りて」のほうがよい）。君子はこの象を見て小人を避け遠ざける。小人を遠ざける道は、もし悪声厲色（悪口や怒った顔）をもってすれば、たまたまその怨みや怒りを招くだけである。ただ矜荘威厳（誇りと厳かさ）によって、敬い畏れることを知らしめれば、小人は自然に遠ざかる。</p>\n<h3 id=\"g33-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>遯は割に良い卦。</b> 受講者が「どうして時義大なるかなが出てくるのか、そんなに素晴らしい卦なのか」と問うと、本田は、この卦は割に良い卦だと答えた。卦の形は下の陰気が伸びて陽気が退くので良くなさそうだが、一つ一つの爻辞には大変めでたい文句がついていて、四番目から上が「好遯」「嘉遯」「肥遯」と大変めでたい。中国では隠遁者は反体制的な人ではあるが、一般に仁義があると言われる。</li><li><b>戦いながら逃げる。</b> 受講者が「所詮は逃げなくてはいかんということか」と問うと、本田は、所詮はそうだが、一矢を報いる気があれば戦いながら逃げろ、命を捨てることは絶対にしない、と答えた。一番下の爻は「厲（あやう）し」で、逃げ遅れると危ないという判断もしている。「戦って逃げずに済むことはないのか」には、遯にはない、五番目・六番目は堂々と逃れる、結局逃げる、と答えた。受講者が「鉄砲を撃ちながら退却しているみたいだ」と言うと、本田は「そういうこと」と答えた。陰がもう一つ増えると否になり一番悪い卦になるが、遯はまだ否まではいかない。</li><li><b>「小しく貞し」は卦全体の形勢から。</b> 「小しく貞し」が下に一本残る陽を指すのかとの問いに、どれということは言っておらず、陽が退く時なので積極的な行動に向かないという卦全体の形勢から言う、と答えた。六二と九五がうまく対応しているので卦として悪くはない。</li><li><b>程伊川と宋学。</b> 程伊川は朱子に匹敵する、易を一番よく解釈した人で、朱子よりだいぶ先輩である。万物に共通する「理」があり、それが日月の運行を整然とさせ、人の心に宿れば理性になるとした。理を発見したのが程伊川だと言われる。朱子は理だけでは物質の発生が説明できないので「気」の概念を組み合わせた。彼らは哲学概論のような書物は書かず、経書の注釈の中に哲学を書いた。両者を合わせて程朱学という。兄が程明道で、二程と称する。</li><li><b>陽明学。</b> 陽明学は朱子学から自然に派生し、極端に推し進めると陽明学になる。朱子は理を発見するのに読書と窮理（自然科学的な観察）を必要とした。王陽明はそれを文字どおりに解して、書斎の前の竹の理を探ろうと、座禅を組んで睨めっこしたが何もわからず、百八十度考えを変えて、あらゆる理は初めから自分の心の中に備わっていると考えた。禅宗に一番近い。王陽明は若い時肺結核で死を宣告され、石の棺桶の中で座禅を組んでいたら治ったという（本田は絶対安静による自然治癒だろうと言う）。陽明学に凝った人は主観に走って危ない（大塩平八郎など）。「知行一致」は陽明が述べた。水戸学は陽明学ではなく、神懸かりの国学のほうに行く。安岡正篤の最初の本は若い時に書いた『王陽明』で、大変よくできた本である。受講者たちは、安岡氏が『論語』の「五十以て易を学べば」の「五十」が大切だと言っていたこと、時局解説が一番面白かったことなどを語り合った。本田は「時局」は漢語の中にある言葉だが、易や古典にはあまり出てこないと答えた。</li><li><b>劉備と程伊川の蜀びいき。</b> 九三の程伝は、蜀の先主劉備が荊州の民を棄てるに忍びなかったことを「咎无し」とする（九三の項参照）。</li></ul>\n<h3 id=\"g33-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>小人の勢いが伸びる時。一歩退くことで願いが通る。大事業には向かず、小さく正しさを守るのがよい。</li><li>ただし逃げるばかりではなく、まだ余地があれば時に応じて力を尽くせ。</li><li>小人を遠ざけるには、憎んで悪口を言うのではなく、威厳ある態度で臨め。</li><li>逃げ遅れたら、慌てて動かずじっと身を隠せ（初六）。</li><li>後ろ髪を引かれてぐずぐずすれば危うい。身近な召し使いを養う程度ならよいが、大事には向かない（九三）。</li><li>愛着を振り切って退けるなら吉、できなければ悪い（九四）。</li><li>志を正しく保って退けば吉（九五）。何の係累もなく遠く退けば万事よし（上九）。</li></ul><h2 class=\"sec\" id=\"g33-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">遯尾。厲。勿用有攸往。</span></summary><div class=\"body\"><div class=\"yomi\">遯るるの尾なり。厲（あやう）し。用て往く攸有る勿れ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「遯尾之厲、不往何災也。」（遯尾の厲うきは、往かざれば何の災いあらん。）</div>\n<p>退くについて一番尻尾になってしまった、つまり逃げ遅れた。これは危うい。この爻が出たら、前進しようとしてはいけない。</p>\n<p><span class=\"tag\">程伝</span>他の卦では下を初とするが、遯は往って遯れる卦で、前にいる者が先に進むので、初はかえって尾になる。尾は後にあるもので、遯れて後にいるのは及ばない者である。だから危うい。初は柔で微の地にいて、すでに遯れるのに後れた。もう往くべきではなく、往けば危うい。微小な者は晦（くら）まし蔵れやすい。往けば危うく、往かなければ災いがないのだから、往かないに越したことはない。</p>\n<p><span class=\"tag\">象伝について程伝</span>幾を見て先に去るのがもとより善い。遯れて尾となるのは危うい道である。往けばすでに危ういので、往かずに晦まし蔵れれば災いを免れる。微に処しているからである。古人にも、微賤の身で乱世に晦まし隠れて国を去らなかった者が多い。</p>\n<p>本田の講説：受講者が「蔵というのはじっとしているという意味か」と問うと、本田は、「晦」は自分の知恵の光をくらます、馬鹿なふりをする意味で、「韜晦」などに使う。「韜」は刀などを革の鞘に包むこと、「蔵」は身を隠す意味だ、と答えた。受講者が「老荘みたいな話ですね」と言った。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>逃げ遅れて危うい立場。慌てて動けばかえって危ない。目立たぬように身を隠してじっとしていれば災いはない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">執之用黃牛之革、莫之勝說。</span></summary><div class=\"body\"><div class=\"yomi\">之を執（と）うるに黄牛の革を用てす。之を勝（あ）げて説（と）く莫し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「執用黃牛、固志也。」（執うるに黄牛を用てすとは、志を固くするなり。）</div>\n<p>革は古い訓で「つくりかわ」と読み、なめした革のことである。黄色い牛の革で繋ぎとめる。その固さはたとえようもない。本田によれば、「説」は本当は「脱」と通じ、朱子の注はそちらに取る（解き脱すことができない）。程伊川はやや古い文字学に疎いので、文字通り、言い表せないの意味に解する。「勝」は何々するに耐える意味で、「説くに勝うる莫し」と読むこともできる。</p>\n<p><span class=\"tag\">程伝</span>二と五は正応である。遯の時であっても、二は中正で五に順応し、五は中正で親しく二に合する。その交わりは自然に固い。黄は中の色、牛は順な物、革は堅固な物である。二と五が中正・順道で相親しみ結ぶ固さは、牛の革で縛ったようである。「之を勝げて説く莫し」とは、その交わりの固さは言い表しようがないということである（「言うに勝う可からず」と読んでもかまわない）。遯の時にあるので、これを極言したのである。</p>\n<p>本田の講説：五行説では北が水・黒、東が木・青、南が火・赤、西が金・白、中央が土・黄。二が中庸を得ていることを黄という色で表現している。</p>\n<p><span class=\"tag\">象伝について程伝</span>上下が中順の道で固く結び合う。その心志が甚だ堅いことを、牛革で執（と）らえるようだとたとえた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>信頼し合う相手との結束が極めて固い。逃れる時勢にあっても、中正と従順の道で固く結んで離れない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">係遯。有疾厲。畜臣妾吉。</span></summary><div class=\"body\"><div class=\"yomi\">係遯す。疾有りて厲し。臣妾を畜（やしな）うときは吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「係遯之厲、有疾憊也。畜臣妾吉、不可大事也。」（係遯の厲うきは、疾有りて憊（くる）しむなり。臣妾を畜うときは吉とは、大事に可ならざるなり。）</div>\n<p>係遯とは、逃れようとして後ろ髪を引かれること。病気があり、危ない。臣妾は一番古い使い方では男奴隷・女奴隷、つまり召し使いの意味で、召し使いを養うには吉であろう。</p>\n<p><span class=\"tag\">程伝</span>陽の志は陰を説ぶ。三は二とぴったり比しており、二に係わる者である。遯は速やかに遠く去ることを貴ぶ。係わるところがあれば、どうして速やかに遠く去れよう。遯に害がある。だから疾ありとする。遯が速やかでないので危うい。臣妾とは小人・女子で、恩に懐いて義を知らず、親しみ愛すればその上に忠である。係恋の私恩は小人女子を待つ道である。だから係恋の道で臣妾を畜養すれば、その心を得て吉である。しかし君子が君子を待遇する道は、このようではない。三と二は正応ではなく、比（隣り合わせ）で親しむだけで、君子を待つ道ではない。もし正をもってすれば、係わることがあっても疾ありとはならない。蜀の先主（劉備）が荊州の士民を棄てるに忍びなかったのがそれで、危ういけれども咎はない。</p>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>小人女子を親しみ愛すれば上に忠であるというのは、だいぶ男女差別が甚だしいが、孔子も「女子と小人は養い難し」と言っている。後ろ髪を引かれるようなセンチメンタルな恩愛の情、依怙贔屓は小人女子にとっての道であり、その情で小人女子を養えば歓心を買えて結果はよい。</li><li>『三国志』の劉備の伝記の話。劉備は世に出る前、荊州一帯の軍閥劉表に頼っていた。劉表が亡くなる時に息子を託され、荊州の人々も劉備に懐いたが、そこへ曹操が攻めてきた。兵力ではとても敵わない。諸葛孔明は荊州を放棄して江陵だけを守れと勧めたが、劉備は「大事を成すには人をもって基とする。今、人が私に懐いているのに、この民を棄て去るに忍びない」と言って、そして大敗した。戦術から言えば愚かだが、程伊川は善しとしている。易の本文には「咎无し」という判断はついておらず、程伊川の蜀びいき・劉備びいきがこう言わせた。宋の人は魏と蜀を比べて蜀を正統とする考えが強く、劉備と諸葛孔明がひいきされる。寄席で語られた『三国志演義』が後に小説になった。受講者が「負けても咎がないことがあり得るのか」と問うと、本田は、後でまた盛り返したから、一旦は負けても志において咎がないということだろう、程伊川は時々本文に書いてない独自の理論を述べる、と答えた。</li></ul>\n<p><span class=\"tag\">象伝について程伝</span>退いて係わるところがあれば、必ず困憊して危うさを招く。疾があるとは憊（つか）れることである。おそらく遯れる力が足りないのであろう。私恩の心で臣妾を畜養すれば吉だが、どうして大事に当たれよう。本田によれば、爻辞の「疾有り」を象伝で「憊」（困憊）と言い換えている。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>情に引かれて退くべき時にぐずぐずし、疲弊して危うい。身近な使用人を情で養う程度ならよいが、大事には向かない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">好遯。君子吉、小人否。</span></summary><div class=\"body\"><div class=\"yomi\">好（この）めども遯る。君子は吉。小人は否（あ）し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「君子好遯、小人否也。」（君子は好めども遯る。小人は否しきなり。）</div>\n<p>九四から、だんだん逃れる卦の外に近いほうになり、判断がよくなる。好遯は、愛する者がありながら逃れる、心を鬼にして隠遁するという意味である。占う人が君子ならば吉、小人ならば結果はよくない。</p>\n<p><span class=\"tag\">程伝</span>四と初は正応で、好み愛する相手である。君子は好み愛するものがあっても、義として去るべきなら、去って疑わない。いわゆる「己に克ち礼に復る」「道をもって欲を制す」で、だから吉である。小人は義をもって処することができず、好むところに昵（した）しみ、私するところに牽かれて、身を陥れ辱めてもやめられない。だから小人においては否である。否とは不善である。四は乾の体で剛断ができるが、聖人は四が陰位にいて係わるところがあるので、小人への戒めを設けた。正を失うことを恐れたのである。</p>\n<p>本田の講説：「己に克ち礼に復る」は『論語』で孔子が仁を定義した箇所で、程朱学では「己」は私欲、「礼」は天理と解釈する。「道を以て欲を制す」は『礼記』楽記にある。「否」は易の卦の名でもあり、塞がる・悪いの意味で、ここでは積極的に「悪い」意味である。受講者が「陥辱」の意味を問うと、陥れ辱める、我が身を陥れて恥をかくことだと答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>君子は好むものがあってもよく遯れ、義を失わない。小人は私意に勝つことができず不善に至る。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>愛着のあるものを振り切って退くべき時。きっぱり退ければ吉、未練に負ければ悪い結果になる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">嘉遯。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">嘉（よ）く遯る。貞しくして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「嘉遯貞吉、以正志也。」（嘉遯の貞吉なるは、志を正すを以てなり。）</div>\n<p>めでたい隠遁ぶり。正しくて吉である。</p>\n<p><span class=\"tag\">程伝</span>九五は中正で、遯の嘉美なる者である。居る所が中正の道を得て、時に止まり時に行く。いわゆる嘉美である。だから貞正にして吉とする。九五に係わる応（六二）がないわけではないが、二も五もみな中正で自らを処している。その心志から動作に及ぶまで中正で、私に係わる失がない。だから嘉とする。卦辞・彖伝では遯の時を概論し、「時と行く」「小利貞」と言って、なお遯を救う意があった。爻においては、五に至って遯はまさに極まろうとするので、ただ中正に遯に処することをもって言う。遯は人君の事ではないので、君位を主として言わない。しかし人君が避け遠ざけるところもまた遯であり、やはり中正にあるのみである。</p>\n<p>本田の講説：卦辞のことも孔子の彖伝のことも「彖」と言い、ここでは両方にかかる。爻辞は一番下では「尾」、三番目では「係」の字を用いていたが、五に至って隠遁はその極点に達しようとし、どうでも思い切って逃れざるを得ないので、せめて中庸と正義で処せよと勧める。ふつう五といえば君主の位だが、隠遁の卦では一番堂々と見事に隠遁する者、隠遁の志が最もすっきりした者を五に置いている。</p>\n<p><span class=\"tag\">象伝について程伝</span>志が正しければ動きは必ず正に由る。遯の嘉であるゆえんである。中にいて正を得、中正に応ずる。これが志の正しいことで、だから吉である。人が遯れるのも止まるのも、ただその志を正すことにある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>時を見極めて堂々と退く、見事な引き際。志を正しく保てば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">肥遯。无不利。</span></summary><div class=\"body\"><div class=\"yomi\">肥（ゆた）かに遯る。利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「肥遯无不利、无所疑也。」（肥遯の利あらざる无きは、疑う所无ければなり。）</div>\n<p>余裕綽々たる隠遁。何の不利もない。ふつうの卦では上の位は悪くなるが、隠遁の卦では、上という階級社会から外へ外れた位が至ってめでたい。「肥」の字を使っているのが大変面白い。中国でも隠遁者といえば、伯夷・叔斉のように蕨を食って痩せ細り栄養失調になるイメージが強いが、これは物質的にも不自由のない、肥え太った隠遁である。</p>\n<p><span class=\"tag\">程伝</span>肥とは充大寛裕の意である。遯はただ飄然として遠く逝き、係わり滞るところがないのを善とする。上九は乾の体で剛断であり、卦の外にいて、下に係わるところもない（下の九三は同じ陽で引き合わない）。遯れることの遠く、係累のないもので、寛綽として余裕があると言える。遯は窮困の時だが、善く処すれば肥となる。その遯れ方がこのようであれば、何の不利があろう。</p>\n<p>本田の講説：「逝」の字には一旦行ったら二度と帰らないというニュアンスがある。五が君主の位だから、その上はもう階級社会の外に出ている。中国の仙人はみな世を捨てて山に入る。日本で仙人といえば痩せ細った絵ばかりだが、『列仙伝』や『神仙伝』の挿絵を見ると、でっぷりと太っている。</p>\n<p><span class=\"tag\">象伝について程伝</span>その遯れ方が遠く、疑い滞るところがない。卦の外にいるのは世間からすでに遠いこと、応がないのは係累がないことで、だから剛決して疑いがない。「疑滞」は「凝滞」と同じ意味である。</p>\n<p>本田の講説：受講者が「自分が疑わないという意味か」と問うと、本田は、自分が疑わない、「疑われない」とする解釈もある、と答えた。「これはすごいですね」との声に、すごい、めでたい卦だと答え、自著に「六朝時代の詩文に、隠者の境涯を讃えて、さきの嘉遯、この肥遯の語がよく用いられる。梁の風流隠士、阮孝緒を、占いの名人張有道が占ったときに出た卦が、やはり遯の上九であるという（『南史』阮孝緒伝）」と解説したことを紹介した。また「肥遯」の「肥」を「飛」に作るテキストもあり、それでも意味は通ずる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>何のしがらみもなく悠々と身を引ける。迷わず退けば万事に不利はない。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>梁の阮孝緒の占い</div><div class=\"rb\">本田の自著の解説によれば、梁の風流隠士阮孝緒を、占いの名人張有道が占ったときに出た卦が遯の上九（肥遯）であったという（『南史』阮孝緒伝）。六朝時代の詩文では、隠者の境涯を讃えるのに嘉遯・肥遯の語がよく用いられる。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>年賀状に書いた観の上九</div><div class=\"rb\">受講者が、今年の年賀状に観の上九「其の生を観る。君子なるときは咎无し」を書いたところ意味を聞かれ、「咎无し」は言うなら中吉くらい、象伝の「志未だ平らかならず」は、上九だから万事終わっているがまだ少し色気が残っている感じ、と説明したと話した。本田はそれで結構だと答え、孔子の象伝は元の判断辞と必ずしもぴったり合わない所がある、と言った。程伊川や朱子は「民に仰ぎ観られているから安心はできない」と戒めの意味に解している。観の九五と上九はただ「咎无し」ではなく「君子なれば」という限定がつくので、「志未だ平らかならず」は、まだ安心してはいけないぞと言っているのである。</div></div><div class=\"pager\"><a href=\"#gua-32\">← 雷風恒</a><a href=\"#gua-34\">雷天大壮 →</a></div>", "gua-34": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 34 卦　第五十二講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">雷天大壮</div><div class=\"yo\">らいてんたいそう</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-34\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-34\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-34\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-34\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-34\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-34\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-34\" data-jump=\"yao\">六爻</a></div><h3 id=\"g34-s0\">卦の名と象</h3>\n<p>遯の卦を上下ひっくり返した形である。乾下震上、乾が下、震が上。</p>\n<p>程伝（序卦伝を引く）：「遯とは退くなり。物は以て終に遯る可からず。故に之を受くるに大壮を以てす」。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>遯は違去（背を向けて去る）の義、壮は進盛の義である。遯は陰が長じて陽が遯れる形、大壮は陽が盛んになる形である（遯とは反対に、下の四本が陽になる）。衰えれば必ず盛んになるのは、消長が互いに待つ道理である。だから遯れた後には必ず壮んになる。大壮が遯に次ぐゆえんである。</li><li>卦は震が上、乾が下。乾は剛、震は動で、剛をもって動くのが大壮の義である。剛陽は大であり、陽が長じてすでに中を過ぎた。大なる者が壮盛なのである。また雷の威が天の上で震う、これも大壮の義である。</li></ul>\n<h3 id=\"g34-s1\">卦辞</h3>\n<div class=\"orig\">大壯、利貞。</div>\n<div class=\"yomi\">大壮は、貞しきに利あり。</div>\n<p>至って簡単な判断辞。この卦が出たら、動機が正しいことを条件とする。</p>\n<p><span class=\"tag\">程伝</span>大壮の道は貞固に利がある。大壮であって正を得なければ、強猛の行いにすぎず、君子の道ではない。壮とは盛んの意味である。</p>\n<p>本田の講説：受講者が「壮（旧字体は壯）の部首はどうなっているのか」と問うと、本田は、片という字を左右反対にした形で、ここは筆記の関係ではねている、と答えた。</p>\n<h3 id=\"g34-s2\">彖伝</h3>\n<div class=\"orig\">大壯、大者壯也。剛以動、故壯。</div>\n<div class=\"yomi\">大壮は、大なる者壮んなるなり。剛にして以て動く、故に壮んなり。</div>\n<p>大壮とは、大きな者が盛んという意味である。剛なる者が動くので盛んという意味になる。</p>\n<p><span class=\"tag\">程伝</span>大壮と名づけるのは、大なる者が壮んなことを言う。陰を小とし、陽を大とする。陽が長じてすでに盛んであるのが、大なる者の壮んなことである。下は剛で上は動き、乾の至剛をもって動く。だから大壮である。大壮には、大なる者が壮んであることと、壮んであることの大きいことの二つの意味がある。</p>\n<div class=\"orig\">大壯利貞、大者正也。正大而天地之情可見矣。</div>\n<div class=\"yomi\">大壮は貞しきに利ありとは、大なる者正しきなり。正大にして天地の情見る可し。</div>\n<p>「大壮は貞しきに利あり」とは、大なる者（陽）が正しいということである。正しく大きくあってこそ（「公明正大」の正大）、天地の実情を見ることができる。</p>\n<p><span class=\"tag\">程伝</span>大なる者がすでに壮んであれば、貞正に利がある。正にして大なるものが道である。正大の理を極めれば天地の情が見える。天地の道が常久にしてやまないのは、至大至正だからである（本田によれば、天体の運行を想像すればわかる）。正大の理は、学者が黙識心通（黙って認識し心に通じる）すべきものである。「大正」と言わずに「正大」と言うのは、一つの事（概念）と誤解されるのを恐れたからである。</p>\n<p>本田の講説：「大正」と言えば「大」が「正」の程度を形容するように取られるが、「正大」と言えば「正」と「大」との意味になる。受講者が「大正は大正時代の大正ですね、どこか他に出てくるのか」と問うと、本田は、大畜の卦の彖伝に出る、元号に使う言葉は必ず五経に出典がある、と答えた。</p>\n<h3 id=\"g34-s3\">大象</h3>\n<div class=\"orig\">雷在天上、大壯。君子以非禮弗履。</div>\n<div class=\"yomi\">雷、天上に在るは大壮なり。君子以て礼に非ざれば履まず。</div>\n<p>上半分が雷、下半分が天で、雷が天上で轟いている形、これが大壮である。君子はこの卦のシンボルに基づいて、非礼なことは行わない。</p>\n<p><span class=\"tag\">程伝</span>雷が天上に震う、大にして壮んである。君子はこの象を観て、その壮を行う。君子の大壮は、己に克ち礼に復るに及ぶものはない。古人は「自ら勝つ者を強と謂う」と言った。『中庸』は「和して流れず」「中立して倚らず」をみな「強なるかな矯」と讃える。湯火に赴き白刃を踏むのは、武夫の勇者にもできる。しかし己に克ち礼に復ることに至っては、君子の大壮でなければできない。だから「君子以て礼に非ざれば履まず」という。</p>\n<p>本田の講説：孔子は一日でも克己復礼ができたら天下の人が仁に帰するだろうとまで言い切っている。ここの「古人」は老子のことで、『老子』第三十三章の文句である。儒教から言えば老荘は異端で、程伊川はこちこちの儒者だから老子の名を出すのを嫌がって「古人」と言った。「矯」も強い意味。『中庸』の原文では「和して流れず、強なるかな矯。中立して倚らず、強なるかな矯」と二度繰り返すが、ここでは「皆な曰く」として一度にまとめている。</p>\n<h3 id=\"g34-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>中は正より重い（再説）。</b> 九二の程伝で程伊川は、ある人の「貞と言うのは陽が陰位にいることを戒めるためではないか」という問いに、易は重い所を取って義とする、九二は中を得ているので正しく、九四は中がないので不正の戒めがある、時義の軽重を識れば易を学べる、と答えている。本田は、これは程伊川が時々主張する「中は正より重い」説で、伊川には自分で原則を立ててしまう割合に強引な所がある、と言う。</li><li><b>「壮」と「羊」の字。</b> 大壮の爻辞には「壮」の字がよく使われるが、九二・六五・上六には使われておらず、代わりに六五と上六には「羊」の字が使われている。</li><li><b>動物はみな得手を用いる。</b> 九三の程伝：歯のある動物は噛み、角のある動物は突き、蹄のある動物は踏む。羊は首（頭）に壮んで、牡羊は角で突くのを好むので象とした。</li><li><b>君主の力が足りぬ時の壮の治め方。</b> 六五の程伝：君の権が下を制するに足りれば、強くはびこる人がいても「壮」とは言うに足りない。君の勢いが足りない時に初めて「壮を治む」という表現になる。だから壮を治める道は、剛を用いてはならない。</li><li><b>「藩」「決」の字。</b> 受講者の質問に答えて本田は、「藩」は廃藩置県の藩と同じで、天子の居場所を敵から守るまがきが各藩であり、諸侯の国を天子を囲んで守るものという意味で「藩屏」と言う、と説明した。「決」は切る・切り開く意味で、自決の決と同じ。以前、渡辺さんに夬の卦が出たとき「夬は決なり」という解説がついていた。「夬」だけだと象形文字で、弓を引くとき親指にはめる「ゆがけ」を意味し、そこから「切り離す」の意味が生じた。</li><li><b>卦の終わりは変化を予感させる。</b> 上六の程伝が「変ずべし」と言うように、だいたい卦の一番終わりは別の卦に変ずることを予感させる所がある。</li></ul>\n<h3 id=\"g34-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>勢いの盛んな時。ただし動機が正しいことが条件で、正しさを欠けばただの強猛にすぎない。</li><li>真の強さは己に克つことにある。礼に外れたことはするな。</li><li>下の身で勢いにまかせて進めば必ず凶（初九）。</li><li>中庸を得ていれば正しくて吉（九二）。</li><li>力ずくや相手を無視する態度は、垣根に角を絡めた羊のように身動きが取れなくなる（九三）。</li><li>正しさを守れば障害が開けて前進できる（九四）。</li><li>力で押さえられない相手は、柔らかくいなせば悔はない（六五）。</li><li>進退窮まったら、苦境を自覚して態度を変えれば吉（上六）。</li></ul><h2 class=\"sec\" id=\"g34-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">壯于趾、征凶、有孚。</span></summary><div class=\"body\"><div class=\"yomi\">趾（あし）に壮んなり。征（ゆ）けば凶。孚（まこと）有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「壯于趾、其孚窮也。」（趾に壮んなる、其れ孚に窮するなり。）</div>\n<p>初九は足に元気がありすぎる。「趾」は足首から下の部分。前進すれば凶。間違いなくそうなる。「孚有り」は間違いなくそうなるという意味で、程伊川はそう読ませる。</p>\n<p><span class=\"tag\">程伝</span>初は陽剛で乾の体であり、下にいて、進むことに壮んな者である。下にいて壮を用いるのは、趾に壮んなることである。趾は下にあって進み動く物である。九は下にいて壮を用い、しかも中を得ていない。剛をもって壮の時にいれば、上にいてもなお行くべきではない。まして下にいるのだからなおさらである。だから征けばその凶は孚（まこと）である。孚は信である。壮をもって往けば凶を得ることは必然だということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>下にいて壮を用いて行けば、必ず窮して凶となることを信じてよい。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>下の身で血気にはやって進もうとしている。進めば間違いなく行き詰まって凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">貞しくして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九二貞吉、以中也。」（九二の貞吉なるは、中を以てなり。）</div>\n<p>正しくて、しかも吉。九二は判断辞だけで状況を示す字はない。こういう判断が時々ある。「貞吉」は「貞しければ吉」とも「貞しくして吉」とも二通りに読めるが、ここは「貞しくして吉」と読ませる。</p>\n<p><span class=\"tag\">程伝</span>二は陽剛で大壮の時に当たっているが、柔位にいて中に処しているので、正を得ており、壮が過ぎていない。正を得て吉である。ある人が問うた。「爻で貞と言うのは、九が二（陰位）にいるのを戒めとするのではないか」。答え：易は勝れたところを取って義とする。陽剛・乾体で大壮の時に当たり、中道を得ているので、正しくないことはない。四においては不正の戒めがある。人が時義の軽重を識れば、ともに易を学ぶことができる。</p>\n<p>本田の講説：ある人の疑問は、爻辞を「貞しければ吉」と読み、陰性の分相応な態度の者がここにいれば吉と解すべきではないか、というものである。易は陽陽位・陰陰位の原則を杓子定規に適用するのではなく、どちらが重要かを見極めて取り上げる。九二は位は不正だが中を得ているから「貞しくして吉」、九四は中を得ていないから不正が咎められる。</p>\n<p><span class=\"tag\">象伝について程伝</span>正にして吉であるゆえんは、中道を得ているからである。中であれば正を失わない。まして陽剛で乾体であるならなおさらである。本田によれば、この場合の「正」は陽陽位・陰陰位の原則ではなく世間で言う正しさで、それより中庸のほうが重い。テキストによっては「剛」の下に「壮」の字がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勢いの盛んな時だが、行き過ぎず中庸を守っているので、正しくて吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">小人用壯、君子用罔、貞厲。羝羊觸藩、羸其角。</span></summary><div class=\"body\"><div class=\"yomi\">小人は壮を用い、君子は罔（な）みするを用う。貞なれば厲し。羝羊（ていよう）藩（まがき）に触れて其の角を羸（くる）しましむ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「小人用壯、君子罔也。」（小人は壮を用う。君子は罔みす。）</div>\n<p>この爻が出た場合、占う人が小人ならば蛮勇を奮い、君子ならば事態を無視するであろう。「罔」は程伊川の解では「无」で、無視するという意味。いずれも強きに過ぎる態度で、こういう態度を固執すれば危ない。たとえば牡羊が生け垣に角を突っかけて、角が絡まって動けないようなものである。「羸」は体が弱る、痩せ細るという意味。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>三は剛で陽位にいて壮に処し、また乾体の終わりに当たる。壮の極まった者である。壮を極めれば、小人においては壮を用い、君子においては罔を用いる。小人は力を尚ぶので勇を用い、君子は志が剛なので罔を用いる。罔は无で、「蔑（ないがし）ろにする」と言うようなものである。至剛で事を蔑視し、忌憚するところがない。君子・小人とは地位で言う（本田によれば、小人は無教養な庶民、君子はやや教養のある階級）。『論語』の「君子勇有りて義无きを乱と為す」のようなものである（陽貨篇。「小人は盗と為す」と続く）。</li><li>剛柔が中を得れば、折れず屈せず、天下に施して宜しくないことはない。もし剛が大いに過ぎれば和順の徳がなく、傷つけることが多く、与（くみ）する者がない。貞固にこれを守れば危うい道である。</li><li>凡そ物はその壮んな所を用いないものはない。歯のあるものは噛み、角のあるものは触れ（突き）、蹄のあるものは踏む。羊は首に壮んで、羝（牡羊）は触れることを好むので象とする。羊は好んで藩に触れる。藩が前に当たるからで、前に物があれば必ず触れる。このように壮を用いることを好めば、必ずその角を羸しませる。人が剛壮を尚び、当たる所必ず用いれば、必ず摧（くだ）かれ困しむのと同じである。</li><li>ある人が問うた。「三の壮はこれほど甚だしいのに、凶に至らないのはなぜか」。答え：三の所為は凶を致すに足るが、まさにその危うさを言っているので、まだ凶に及ばない。凶を致す道があってまだ至らない者を「厲し」というのである。</li></ul>\n<p><span class=\"tag\">象伝について程伝</span>小人においてはその強壮の力を用い、君子においては罔を用いる。志気が剛強で、事を蔑視して顧み憚ることがない。</p>\n<p>本田の講説：受講者が「君子は罔すとはすごい言葉ですね」と言うと、本田は、いろいろ読み方があり、朱子は「君子は罔し」と読む、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勢いの極みで、力ずくで押したり相手を無視したりしがち。そのまま押し通せば、垣根に角を絡めた羊のように身動きが取れなくなり危うい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">貞吉悔亡。藩決不羸、壯于大輿之輹。</span></summary><div class=\"body\"><div class=\"yomi\">貞しければ吉にして悔亡ぶ。藩決（ひら）けて羸しまず。大輿（たいよ）の輹（ふく）に壮んなり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「藩決不羸、尚往也。」（藩決けて羸しまずとは、尚お往くなり。）</div>\n<p>動機が正しければ結果は吉で、悔もなくなる。羊の角に絡まった垣根が切れて自由になったようなもの。大きな車のスポークが力強く、前進することができる。本田によれば、自著では「輹」に「とこしばり」（車輪の軸を車体に括りつけるもの）と訓をつけ朱子もそう取るが、程伊川は「輻」（スポーク）と同じに読んでいる。</p>\n<p><span class=\"tag\">程伝</span>四は陽剛で長盛し、壮がすでに中を過ぎた、壮の甚だしいものである。しかし四にいるのは不正である。君子の道が長ずる時に、どうして不正があってよかろう。だから貞しければ吉で悔が亡ぶと戒める。道が長ずる時に少しでも失すれば、亨り進む勢いを害する。これが悔ありである。もし他の卦で重剛で柔位にいるなら、必ずしも善でないとは限らない。大過がそれである。藩は限り隔てるものである。決け開けば、もうその壮を羸しめない。高大な車は輪輹が強壮で、行くことの利がわかる。だから「大輿の輹に壮んなり」という。輹は輪の要所で、車が壊れるのは常に輹が折れることによる。輹が壮んなら車は強い。「輹に壮んなり」とは、進むことに壮んなことを言う。</p>\n<p>本田の講説：大過の九四は陽が陰位にいるが判断は吉である。大過は「時には度を過ぎたことをやらねばならない」卦で、やり過ぎてもよい時だから許されるが、大壮とは時勢が違う。「限」と「隔」はほぼ同じ意味で、「限」の字自体に隣家との間仕切りという意味がある。</p>\n<p><span class=\"tag\">象伝について程伝</span>剛陽が長ずれば必ず極（疲れ）に至る。四はすでに盛んだが、その往くことはまだやまない。まさに盛んな陽で壮を用いて進むので、これに当たる者はない。藩が決け開いてその力を羸しめないのである。「尚お往く」とは、その進むことがやまないことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>正しさを守れば悔は消え、障害が開けて大いに前進できる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">喪羊于易、无悔。</span></summary><div class=\"body\"><div class=\"yomi\">羊を易（い）に喪（うしな）う。悔无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「喪羊于易、位不當也。」（羊を易に喪うとは、位当たらざればなり。）</div>\n<p>牡羊の暴力を軟らかな態度でいなしてやる。後悔はなくなるであろう。本田によれば、自著では朱子の注によって「羊を易に喪う」と読ませ、朱子は「易」を土偏の「場」と同じだと言う。程伊川はこれを「い」と読み、たやすい（和易）の意味に解する。</p>\n<p><span class=\"tag\">程伝</span>羊は群れて行き、好んで触れる。これで諸陽が並び進む形を象る。四陽がまさに長じて並び進もうとしている。五は柔で上にいる。もし力で制しようとすれば、勝つのが難しく悔がある。ただ和易（和らぎやすらか）にこれを待てば、群陽はその剛を用いるところがない。これがその壮を和易に喪わせることである。このようであれば悔がない。五は位で言えば正、徳で言えば中であるから、和易の道を用いて、群陽が壮んであっても用いるところがないようにさせることができる。</p>\n<p>本田の講説：この場合の「正」は陰陰位・陽陽位の意味ではなく、公明正大な君主の地位にいることである。</p>\n<p><span class=\"tag\">象伝について程伝</span>必ず柔和を用いるゆえんは、陰柔で尊位にいるからである。もし陽剛・中正で尊位を得ていれば、下が壮んになることはない。五の位が当たらないので、「羊を易に喪う」の義を設けた。しかしおおむね壮を治めるには剛を用いてはならない。君臣・上下の勢いはもともと等しくない。いやしくも君の権が下を制するに足りれば、強壮跋扈する人がいても壮と言うには足りない。必ず人君の勢いに足りないところがあって、初めてこれを「壮を治む」と言う。だから壮を治める道は剛を用いてはならない。</p>\n<p>本田の講説：九五なら力で押さえられるが、六（陰）で君主の地位にふさわしくないから、軟らかな態度で相手をいなすにとどまる。君主に充分な実権がなければ、軟らかな態度で接するしか仕方がない、ということである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勢いづいた相手を力で抑えようとすれば失敗する。和やかに受け流せば、相手は力の振るいどころを失い、悔はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">羝羊觸藩、不能退、不能遂、无攸利、艱則吉。</span></summary><div class=\"body\"><div class=\"yomi\">羝羊藩に触る。退く能わず、遂（すす）む能わず。利する攸无し。艱（なや）めば則ち吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不能退不能遂、不詳也。艱則吉、咎不長也。」（退く能わず遂む能わずとは、詳（つまび）らかならざればなり。艱めば則ち吉とは、咎長ぜざるなり。）</div>\n<p>牡羊がまがきに角を突っ込み、退くことも進むこともならない。「遂」はすすむ（豚や猪のようなものが道の上を走っている形）。何の利益もない。困難を自覚し、慎んで対処すれば吉に転ずるであろう。</p>\n<p><span class=\"tag\">程伝</span>羝羊はただその壮を用いることから象を取るだけなので、陰爻にも羊と言う。六は陰で震の終わりにいて、壮の極みに当たる。その過ちが知れる。羝羊が藩に触れるように、進めば身が礙げられ、退けば角が妨げられ、進退ともに不可である。六はもともと陰柔なので、己に勝って義に就くことができない。これが退く能わずである。陰柔の人は、壮を用いる心を極めても、必ずその壮を遂げることはできない。剛（強い者）に遇えば必ず縮む。これが遂む能わずである。その所為がこのようでは、どこへ行っても利がない。陰柔が壮の時にいて、その守りを固くできず、もし艱難に遇えば必ずその壮を失う。壮を失えば、かえって柔弱の分を得る。これが艱めば吉を得るということである。壮を用いれば利がなく、艱を知って柔に処すれば吉である。壮の終わりにいるので、変ずる義があるのである。</p>\n<p>本田の講説：「退く」とは一歩身を引いて我が身を反省することで、それができない。九三に「小人は壮を用う」とある「壮」は暴力の意味で、陰柔の者は自分より強い者が打ち砕きに来れば萎縮して進むこともできない。だいたい卦の一番終わりは別の卦に変ずることを予感させるので、こういう注が下される。</p>\n<p><span class=\"tag\">象伝について程伝</span>居るべきでない所にいるので進退ともにできない。自ら処することが詳らかで慎み深くなかったからである。「艱めば則ち吉」とは、柔が艱難に遇い、また壮の終わりにいるので、自ら変ずべきであり、変ずればその分を得て、過ちは長じない。だから吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>無理押しして進退窮まり、何の利もない。苦境を自覚して強がりを捨て、身の程をわきまえれば、咎は長引かず吉に転じる。</div></div></details><div class=\"pager\"><a href=\"#gua-33\">← 天山遯</a><a href=\"#gua-35\">火地晋 →</a></div>", "gua-35": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 35 卦　第五十三講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">火地晋</div><div class=\"yo\">かちしん</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-35\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-35\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-35\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-35\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-35\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-35\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-35\" data-jump=\"yao\">六爻</a></div><h3 id=\"g35-s0\">卦の名と象</h3>\n<p>坤下離上、下が坤、上が離である。晋は訓ずれば「すすむ」。</p>\n<p>程伝（序卦伝を引く）：「物は以て終に壮んなる可からず。故に之を受くるに晋を以てす。晋とは進むなり」。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>物が壮んであって終わりに止まるという理はない。すでに盛壮であれば必ず進む。晋が大壮に継ぐゆえんである。</li><li>卦は離が坤の上にあり、明（太陽）が地上に出る形である。地から出て昇れば昇るほど明るさを増す。だから晋という。晋は進んで光明盛大になる意である。およそ物がだんだん盛んになることを進むという。だから彖伝に「晋は進むなり」という。</li><li>卦には元亨利貞の徳を記すものと記さないものがあり、その宜しきに随う。乾坤以外で「元亨」と言うのは、もともとその徳を固有するものである。「利貞」と言うのは、足らないところがあって貞によって益すべきものである。四徳を記していても意味の異なる（不同な）ものがあり、革・漸がそれである。卦に随って見るべきである。晋は盛んであって徳を記さないが、それは記す必要がないからである。晋の明は盛んなので、さらに「亨る」と言わない。大明に順い麗（つ）くので、正を戒める必要もない。</li></ul>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>革の卦は元亨利貞を記すがその後に「悔亡ぶ」とある。武力革命の卦なので本来悔がつきもので、革命を起こす人が四徳を備えて初めて悔がなくなるという意味である。漸の卦は「女の帰（とつ）ぐに吉」の後に「貞しきに利あり」とあり、娘が嫁ぐときは吉だが心が正しいときにのみ利益があるという、戒めの意味が強いものである。</li><li>晋は地上に太陽が輝き、下の坤（素直・従順）が明らかな太陽に従う卦で、明らかで盛んなのは言わずと知れたことなので「亨」と言わず、大いに明らかなものに従う卦なので正しくあれと戒める必要もない、というのが程伊川の解釈である。四徳がない卦はふつうそれほどめでたくなく、良い卦ならどれかが付いて当然なので、これは程伊川独特の解釈である。受講者の問いに答えて、ここでいう「徳」は元亨利貞の四徳のことだと説明した。</li><li>受講者が「もし記すならどういう徳になるか」と問うと、伊川は記す必要がないと言った、そのくらい申し分なく、内容においては四徳みな揃っている、ただし易の作者は「すすむ」ということに余り価値を認めなかったらしい、と答えた。</li></ul>\n<h3 id=\"g35-s1\">卦辞</h3>\n<div class=\"orig\">晉、康侯用錫馬蕃庶、晝日三接。</div>\n<div class=\"yomi\">晋は、康（やす）んずる侯なり。用て馬を錫（たま）うこと蕃庶（はんしょ）たり。昼日に三たび接（まじ）わる。</div>\n<p>晋という卦は天下を安んずる諸侯を意味する。この卦が出たら、天子から馬をたくさん賜わるであろう。しかも、昼日中に三回接見を賜わるであろう。</p>\n<p>本田の講説：「康侯」の二字を普通名詞にして「康んずる侯」と読むのは少し無理なようだが、どの解釈もだいたいそうなっている。固有名詞に取る説もなくはないが、あまりぴったり来ない。周の文王の子で衛に封ぜられた衛康叔という人物が実在したが、建前上卦辞は周の文王の作なので、それより後の人が出てきては具合が悪い。だから「康んずる侯」と読ませる。「蕃庶」はたくさんという意味で、「蕃」は動物が繁殖する、「庶」は庶人の意味。「錫」はもともと「たまう」という字で、「すず」の意味は後でついた。</p>\n<p><span class=\"tag\">程伝</span>晋は進盛の時である。大明が上にあって下体が順い附く。諸侯が王を承ける象である。だから「康侯」という。康侯とは治安の侯である。上が大明で徳を同じくし、治安の侯を順い附かせる。だからその寵を受け、しばしば馬を賜わること衆多である。車馬は重い賜わり物で、蕃庶は多いこと。賜与が厚いだけでなく、親しく礼遇されることが昼の間に三たび接見されるほどで、寵遇の至りを言う。晋は進むことの盛んな時で、上は明、下は順であり、君臣が相得ている。上について言えば明盛に進み、臣について言えば進んで高く顕らかな地位に昇り、その光寵を受けるのである。</p>\n<h3 id=\"g35-s2\">彖伝</h3>\n<div class=\"orig\">晉、進也。明出地上、順而麗乎大明、柔進而上行。是以康侯用錫馬蕃庶、晝日三接也。</div>\n<div class=\"yomi\">晋は進むなり。明、地上に出で、順にして大明に麗（つ）き、柔進んで上行す。是を以て康侯用て馬を錫うこと蕃庶、昼日に三たび接わるなり。</div>\n<p>晋は進むという意味である。明らかな太陽が地上に出ている。下半分の臣下が素直に上半分の聡明な天子にくっつく。また陰が上っていって六五という君主の位につく。こういうわけで、国を安んずる諸侯がこの天子から馬をたくさん賜わり、日中に三回も接見されるのである。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>晋は進むことで、明が進んで盛んになることである。明が地を出てますます進んで盛んになるので晋という。これを「進」と名づけないのは、進は前進の意味だけで、明盛の義を兼ねることができないからである。</li><li>「明、地上に出づ」とは離が坤の上にあること。坤が離に麗くのは、順をもって大明に附くことで、順徳の臣が大明の君に附く象である。</li><li>およそ離が上にある卦では、柔が君位にいるので、多く「柔進んで上行す」と言う。噬嗑・睽・鼎がそうである。六五は柔で君位にいて、明であって順く下を待遇し、寵遇親密の義となる。だから「康侯用て馬を錫うこと蕃庶、昼日に三たび接わる」となる。</li><li>大明の君は天下を安んずる者で、諸侯がよく天子の明徳に順い附く。これは民を康んじ国を安んずる侯である。だから康侯という。そのため寵錫を受けて親しく礼遇され、昼の間に三たび天子に接見される。「公卿」と言わずに「侯」と言うのは、天子は上で治める者、諸侯は下で治める者であり、下にいて大明の君に順い附くのは諸侯の象だからである。</li></ul>\n<p>本田の講説：テキストによっては「柔進んで上行す」とあり、この方がよいかもしれない。受講者が「すすむに二つの字があって意味が違うとはどういうことか」と問うと、本田は、彖伝に「晋は進なり」とあるのに、なぜ卦を「進」と命名しなかったかを程伊川は何とか説明しなければならず、このように解釈したのだと答えた。「進」の字のしんにょうは道で、「隹」（鳥）が道を歩いている形であり、晋の字の方が意味が深いと程伊川は言うわけである。</p>\n<h3 id=\"g35-s3\">大象</h3>\n<div class=\"orig\">明出地上、晉。君子以自昭明德。</div>\n<div class=\"yomi\">明、地上に出づるは晋なり。君子以て自ら明徳を昭（あき）らかにす。</div>\n<p>太陽が地上に出た形が晋である。君子はこの卦の形にのっとって、自分自身の明徳をいよいよ明らかにする。四書の一つ『大学』に「明明徳」（明徳を明らかにする）という句があり、意味はまったく同じである。</p>\n<p><span class=\"tag\">程伝</span>昭とはこれを明らかにすることである。『春秋左氏伝』（桓公二年）に「徳を昭らかにし違（たが）うを塞ぐ」とある。その徳を昭らかにすることである。君子は明が地上に出てますます明盛になる象を観て、自らその明徳を昭らかにする。蔽いを去り知を致すのは、明徳を己に昭らかにすること。明徳を天下に明らかにするのは、明徳を外に昭らかにすること。明徳を明らかにすることは己にある。だから「自ら昭らかにす」という。</p>\n<p>本田の講説：儒教はだいたい性善説が建前で（荀子のような人は例外）、人は誰もが徳を持って生まれるものとして、その徳を明らかにすることを説く。</p>\n<h3 id=\"g35-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>『大学』『中庸』と四書五経。</b> 受講者が「『大学』と『易』ではどちらが古いか」と問うと、本田は易の方が古いと答えた。孔子が作ったと言われる象伝も実際は孔子より遅れるだろうが、『大学』はだいぶ時代が下がる。『大学』も『中庸』も『礼記』の中の一篇で、朱子が抜き出して単行本にしたもので、ごく短い。朱子の慧眼で、その二篇は特に優れた部分である。『論語』『孟子』と並べて四書と呼ぶ。成立順は『論語』『孟子』『中庸』『大学』。『中庸』は通説では孔子の孫が書いたとされるが、出来上がったのはおそらく秦の始皇帝の頃。『礼記』は多くの篇からなる編纂物で、編纂したのは漢代の戴聖。五経は易・書・詩・礼・春秋で、易が最初に来るのは易が一番深いからである。『書経』は堯舜から始まる歴代君主の詔勅を集めたもので、王朝が変わる時に天子が革命の旗を揚げて家来に布告したものが一番多い。革命思想はすでに『書経』にある。</li><li><b>格物致知。</b> 受講者の問いに答えて：『大学』にある言葉で、朱子は「物に格（いた）り知を致す」と解し、一つ一つの具体的な物の本質を明らかにし、総合してより高い知恵に至るとする（自然観察にも通じる）。王陽明は「物を格（ただ）し知を致す」と解し、あらゆる真理は自分の心の中にあり、万物を正しい姿に戻すのは自分の良知の現れだとする。ふつうは朱子の解釈で使われ、『大学』で王陽明のように解すると後の「誠意、正心、修身、斉家、治国、平天下」に続かない。修身の「修」は原文では肉月の「脩」で、どちらに書いてもかまわない。</li><li><b>春秋の筆法。</b> 『春秋』には『左氏伝』『公羊伝』『穀梁伝』の三つの解釈があるが、原本は一つ。「趙盾其の君を弑す」の例：実際に君を殺したのは一族の趙穿で、総理大臣格の趙盾は国境のあたりに使いに出ていたが、兵力もないので隣国に逃げ込み、時期を待って君の敵を伐った。しかし史官は「総理大臣として、すぐ宮殿に取って返して斬り死にすべきだったのにしなかった。お前が殺したのと同じだ」として「趙盾其の君を弑す」と書いた。非常に厳しく家来の道義を責める書き方である。</li><li><b>九と六の由来。</b> 受講者が「なぜ陽を九、陰を六と言うのか」と問うと、本田は、陽の不変が七、陽の変が九、陰の不変が八、陰の変が六という約束があると答えた。本筮では四十九本の筮竹を二つに分け、右の一本を左小指に掛け、四本ずつ捨てて残りを勘定する。一回目で残るのは九か五、二回目・三回目は八か四で、三回やって初めて一爻が出る。二多一少で七、二少一多で八、三つとも少なければ老陽で九、三つとも多ければ老陰で六となる。なぜその数で呼ぶかはよくわからない。爻は卦の中で変を見るので六か九で呼ぶ。一から五を使わないのは、爻の場所を示す数字と重なって具合が悪いからである。七八九六の数字を使うことは随分昔からあり、『左伝』と同時期の『国語』の占いの記事に、全部の爻が八（不変）であったと書いてある。老陽・少陽の「少」は若いという意味で、年取った陽はやがて陰に変わり得る、それが変である。「六」は呉音で、「リク」と読むのが正しい。また彖伝の「彖」の字の本来の意味は豚が勢いよく走ることで、なぜ彖伝に使われるかわからない。</li><li><b>恤兵。</b> 六五の「恤」は、うれえる、あわれむの意味。戦争中は傷病兵などをあわれむ「恤兵」という言葉があり、「恤兵基金」もあった。戦争中までは難しい古典的な字を日常的に使っていた。</li><li><b>上九の程伝の苦しさ。</b> 程伊川は上九の「邑を伐つ」を自らの内心を治めるという倫理的な意味に転化しているので、下の「貞において吝」が浮いてしまい、伝の最後はちょっと苦しい。朱子もだいたい程伊川に従いながら、少し修正している。</li></ul>\n<h3 id=\"g35-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>明るい太陽が昇るように進む時。上の引き立てを受け、厚遇される。</li><li>自らの明徳を明らかにせよ。</li><li>進もうとして阻まれても、正しさを守れば吉。まだ信用されていなくても焦らずゆったり構えよ（初六）。</li><li>進むのに心配が伴うが、正しさを守れば上から大きな福を授かる（六二）。</li><li>皆に信じられ、上に従えば悔は消える（六三）。</li><li>不相応な高位にしがみつき、びくびくするのは危うい（九四）。</li><li>損得にくよくよせず、人に任せて進めば吉（六五）。</li><li>強さで押し進むのは自らの過ちを正すことにのみ用いよ。武力に頼るのはやはり恥ずべき（上九）。</li></ul><h2 class=\"sec\" id=\"g35-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">晉如摧如、貞吉。罔孚、裕无咎。</span></summary><div class=\"body\"><div class=\"yomi\">晋如（しんじょ）たり摧如（さいじょ）たり。貞しければ吉。孚とせらるる罔（な）きも、裕（ゆた）かなれば咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「晉如摧如、獨行正也。裕无咎、未受命也。」（晋如たり摧如たりとは、独り正を行うなり。裕かなれば咎无しとは、未だ命を受けざればなり。）</div>\n<p>進もうとしては打ち砕かれる。「如」は「突如」「面目躍如」のように他の字の下について形容詞を作る。動機が正しければ吉である。初めて進むのだからまだ人から信ぜられないが、心豊かに待っていれば咎はない。「見」の字が動詞の上に来ると「る・らる」という受け身の意味になる。</p>\n<p><span class=\"tag\">程伝</span>初は晋の下にいて、進むことの始めである。晋如は升り進むこと、摧如は抑えられ退くことである。始めて進むにあたっては、進みを遂げても遂げなくても、ただ正を得れば吉である。「孚とせらるる罔し」とは、下にいて始めて進むのに、どうしてすぐ上から深く信ぜられよう。もし上にまだ信ぜられなければ、中に安んじて自ら守り、寛裕にして、上の信を求めることに急であってはならない。もし信を欲する心が切であれば、汲々として守りを失うか、悻々（ふんぜん）として義を傷つけるかで、いずれも咎がある。だから裕かであれば咎はない。君子が進退に処する道である。</p>\n<p><span class=\"tag\">象伝について程伝</span>進むにしても抑えられるにしても、ただ独り正道を行うのである。寛裕であれば咎がないのは、始めて進んでまだ位に当たっていないからである。君子の進退は、遅いこともあれば速いこともあり、ただ義の当たる所に従うが、心が裕かでないことはない。聖人は後の人が寛裕の義に通じず、位にいる者が職を廃し守りを失って、それを裕かだと考えることを恐れた。だから特に、初六で「裕かなれば咎无し」とは、始めて進んでまだ命を受け職任に当たっていないからだ、と言う。もし官の守りがあって上に信ぜられずにその職を失うなら、一日も居るべきではない。しかし事は一概ではなく、遅速はただ時による。またそれには兆しがあるものである。</p>\n<p>本田の講説：伊川の伝の終わりのあたりは、本文にない程伊川独自の考え・感想を付け加えている。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>進もうとして阻まれる始めの段階。正しさを守れば吉。まだ信用されなくても焦らず、ゆったり構えていれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">晉如愁如、貞吉。受茲介福、于其王母。</span></summary><div class=\"body\"><div class=\"yomi\">晋如たり愁如たり。貞しければ吉。茲（こ）の介福（かいふく）を其の王母に受く。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「受茲介福、以中正也。」（茲の介福を受くるは、中正を以てなり。）</div>\n<p>この卦が出たら、進むことは進むが、心配しながら進むことになる。動機が正しければ結果は吉。大きな福を祖母から授かるであろう。「介」は大きい、「王母」はおばあさんの意味である。</p>\n<p><span class=\"tag\">程伝</span>六二は下にいて、上に応援がなく、中正柔和の徳をもってしている。進むことに強い者ではない。だから進むことにおいて憂愁する。進むことの難しさを言う。しかし貞正を守れば吉を得る。だから「晋如たり愁如たり、貞しければ吉」という。王母は祖母で、陰の至尊なる者、六五を指す。二は中正の道で自らを守り、上に応援がなく自ら進むことはできないが、その中正の徳は久しくすれば必ず彰われる。人は自然とこれを求めるであろう。思うに六五は大明の君で、二と徳を同じくする。必ずこれを求め、これに寵禄を加えるであろう。これが「介福を王母に受く」である。介は大である。</p>\n<p>本田の講説：二と五は対応する関係だが、ここでは同じ陰で引き合わないので、上に応援がない。受講者が「陰同士でも授かるのか」と問うと、本田は、陰同士でも授かると答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>中正の道をもってするからである。人がよく中正の道を守れば、久しくして必ず亨る。まして大明が上にいて徳を同じくしているのだから、必ず大福を受ける。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>進むのに不安が伴うが、正しさを守れば吉。中正の徳がやがて認められ、上から大きな恩恵を受ける。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">衆允、悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">衆、允（まこと）とす。悔亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「衆允之志、上行也。」（衆、允とするの志は、上行するなり。）</div>\n<p>諸人から信ぜられる。後悔はなくなるであろう。</p>\n<p><span class=\"tag\">程伝</span>三は中正を得ていないので、悔があるはずである。しかし三は坤の体の上にいて、順の極みである。三陰はみな上に順おうとする者で、三が上に順うのは衆と志を同じくすることで、衆が信じ従うところとなる。それで悔が亡ぶのである。上の大明に順い附き、上は大明に向かい、下は衆に信ぜられ従われる。何の不利があろう。ある人が問うた。「中正でもないのに衆と同じくするのを善とできるのか」。答え：衆が信じるものは必ず至当である。まして上の大明に順うのだから、どうして不善があろう。だから悔が亡ぶ。それはその不正の失を亡ぼすのである。古人は「謀、衆に従えば天心に合す」と言った。</p>\n<p>本田の講説：六三は三本陰が並んでいる中の一番上にいるので、人々が信じ従う対象となる。「古人曰く」の通りの文句は実は見つからない。似た文句としては『左伝』成公六年に「三人占すれば、二人に従う。衆なるが故なり」（三人で占って二人の意見が合えばそれに従う、多数だから）とある。</p>\n<p><span class=\"tag\">象伝について程伝</span>上行とは、上に順って大明に麗くことである。上の大明の君に従うのは、衆の志が同じくするところである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人々の信頼を得て、ともに上に従って進める。本来の欠点による悔も消える。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">晉如鼫鼠、貞厲。</span></summary><div class=\"body\"><div class=\"yomi\">晋むこと鼫鼠（せきそ）の如し。貞なれば厲し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鼫鼠貞厲、位不當也。」（鼫鼠貞厲なるは、位当たらざればなり。）</div>\n<p>九四は、おおねずみのようにびくびくしながら進む。この態度を固執すれば危ういであろう。『詩経』に「碩鼠」という詩があり、鼫鼠はそれと同じ、人を恐れるおおねずみのことである。</p>\n<p><span class=\"tag\">程伝</span>九で四にいて、その位ではない。その位でないのにいるのは、貪ってその位に拠る者である。高位を貪っているのは、もとより安んずる所ではない。しかも三陰がみな自分の下にいて、勢い必ず上り進むので、心中これを畏れ忌む。貪って人を畏れるのは鼫鼠である。だから「晋むこと鼫鼠の如し」という。貪って畏忌の心を存し、貞固にこれを守れば、危ういことは知れている。「貞なれば厲し」と言うのは、改める道を開いているのである。</p>\n<p>本田の講説：この態度を固執すれば危ないということは、この態度を改めれば危うさを逃れるということでもある。</p>\n<p><span class=\"tag\">象伝について程伝</span>賢者は正しい徳をもって高位にいるべきである。不正で高位にいるのは、その居るべき所ではない。貪って失うことを恐れれば人を畏れる。固くその地に居座れば危ういことは知れている。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>分不相応な地位にしがみつき、下から追われるのを恐れてびくびくしている。そのままでは危うい。態度を改めよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">悔亡、失得勿恤。往吉、无不利。</span></summary><div class=\"body\"><div class=\"yomi\">悔亡ぶ。失得恤（うれ）うる勿れ。往けば吉にして、利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「失得勿恤、往有慶也。」（失得恤うる勿れとは、往きて慶び有るなり。）</div>\n<p>六五は本来後悔があるはずだが、後悔がなくなるであろう。結果の善し悪しに心配は無用である。前進すれば吉。何の不利もない。</p>\n<p><span class=\"tag\">程伝</span>六は陰で尊位にいて、本来悔があるはずである。大いに明らかで、下がみな順い附くので悔が亡ぶのである。下は順徳を同じくして附いている。誠を推して委任し、衆人の才を尽くし、天下の志を通ずべきである。その明を自任して、失得をうれえてはならない。このようにして往けば、吉で不利はない。六五は大明の主で、明照できないことは心配ない。ただ明を用いることが過ぎて、察に至り委任の道を失うことを憂える。だから「失得恤うる勿れ」と戒める。私意で偏って任ずれば、蔽われるところがある。天下の公を尽くすのに、どうしてまた私察を用いるべきであろう。</p>\n<p>本田の講説：結果の善し悪しに目を奪われると、下の者に対してあらさがしをする。だから結果の善し悪しにくよくよするなと戒める。この程伊川の伝は本文よりだいぶ深く立ち入って、支配者に対する戒めになっている。</p>\n<p><span class=\"tag\">象伝について程伝</span>大明の徳で下が附くのを得た。誠を推して委任すれば、天下の大功を成すことができる。これが往いて福慶があることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者が損得や結果にくよくよせず、信頼して人に任せれば、進んで吉、何の不利もない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">晉其角、維用伐邑、厲吉无咎、貞吝。</span></summary><div class=\"body\"><div class=\"yomi\">其の角を晋む。維（こ）れ用て邑を伐つ。厲けれど吉にして咎无し。貞において吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「維用伐邑、道未光也。」（維れ用て邑を伐つとは、道未だ光いならざるなり。）</div>\n<p>角の強さを推し進める。これでもって自分の領地の反乱を伐つ場合には、危険はあるが結果は吉で、咎はない。ただし正しい道においては恥ずかしい。ちょっと屈折した判断である。「邑」は昔の諸侯の持ち地所で、諸侯は城内に住み、領地は郊外に持っていた。「貞にして吝」はちょっとおかしいので、伝を見ると「貞において吝」と読ませている。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>角は剛で上にある物である。上九は剛で卦の極みにいるので、角を象とする。陽で上にいるのは剛の極みであり、晋の上にいるのは進むことの極みである。剛が極まれば強猛の過ちがあり、進むことが極まれば躁急の失がある。剛で進むことを極めるのは、中を失うことが甚だしい。どこに用いてもよいことはない。</li><li>ただ邑を伐つことに用いれば、危うくても吉で咎はない。四方を伐つのは外を治めること、居邑を伐つのは内を治めることである。「邑を伐つ」とは、自らを治めることを言う。人が自らを治めるのに、剛が極まれば道を守ることはいよいよ固く、進むことが極まれば善に遷ることはいよいよ速やかである。上九のような者がこれで自らを治めれば、危うくても吉で咎がない。厳厲は安和の道ではないが、自らを治めることにおいては功がある。</li><li>さらに「貞において吝」と言って、その義を尽くす。剛を極めて進むことは、自らを治めることに功があっても、中和の徳ではない。だから貞正の道においては吝とする。中正を失わないのを貞とする。</li></ul>\n<p>本田の講説：自分の領地の反乱を征伐するにはいくら厳しくてもよいというのは、昔の中国の支配階級に属する程伊川らしい考え方である。原文はあくまで武力で自分の領地を伐つというにとどまるので「貞において吝」という判断が加わるのだが、程伊川は「邑を伐つ」を「自らの内心を治める」という倫理的な意味に転化して解釈しているので、下の「貞において吝」が浮いてしまい、伝の最後はちょっと苦しい。受講者が通説を問うと、朱子もだいたい同じで、程伊川の伝に従いながらちょっと修正しているという。受講者が「本来なら反乱など起こされないよう日頃からきちんと治めるべきで、武力で征伐せねばならないこと自体が恥ずべきなのか」と言うと、本田はそうだと答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>「維れ用て邑を伐つ」は、すでに吉で咎がないのに、さらに「貞において吝」と言うのは、その道がまだ光大でないからである。正理で言えば羞ずべきである。道がすでに光大であれば中正でないことはなく、どうして過ちがあろう。いま過ちを伐って自らを治めるのは、功はあってもその道はまだ光大ではない。ここにも善を尽くす道を言っている。テキストに「功失有りと雖も」とあるのは具合が悪く、「功有りと雖も」とするのがよい、と本田は言う。</p>\n<p>本田の講説：「光」は「広」と同じ。「光大なれば中正ならざる无し」のあたりに、程伊川が中庸をどう考えていたかが窺える。「善を尽くす」は『論語』で孔子が古代の音楽を評した言葉で、舜の音楽を「美を尽くし、また善を尽くす」、周の武王の音楽を「美を尽くすも、未だ善を尽くさず」と評した。孔子は美学的な感受性が優れていた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>強さと勢いの極み。身内や自分自身の乱れを厳しく正すのに用いれば危うくても吉で咎はないが、力に頼らねばならぬこと自体は恥ずべきことと心得よ。</div></div></details><div class=\"pager\"><a href=\"#gua-34\">← 雷天大壮</a><a href=\"#gua-36\">地火明夷 →</a></div>", "gua-36": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 36 卦　第五十三講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地火明夷</div><div class=\"yo\">ちかめいい</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-36\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-36\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-36\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-36\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-36\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-36\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-36\" data-jump=\"yao\">六爻</a></div><h3 id=\"g36-s0\">卦の名と象</h3>\n<p>大変悪い卦。地の下に太陽がある。先の晋とちょうど上下が反対になる。離下坤上、太陽が下で大地が上というのが明夷である。</p>\n<p>程伝（序卦伝を引く）：「晋とは進むなり。進めば必ず傷るる所有り。故に之を受くるに明夷を以てす。夷とは傷るるなり」。</p>\n<p><span class=\"tag\">程伝</span>進んでやまなければ必ず傷つくことがある。理の自然である。明夷が晋に次ぐゆえんである。卦は坤が上、離が下で、明が地中に入る形である。晋を反対にすれば明夷になるので、義は晋とちょうど相反する。晋は明盛の卦で、明君が上にいて群賢が並び進む時である。明夷は昏暗の卦で、暗君が上にいて明者が傷つけられる時である。日が地中に入り、明が傷つけられて昏暗になる。だから明夷という。</p>\n<h3 id=\"g36-s1\">卦辞</h3>\n<div class=\"orig\">明夷、利艱貞。</div>\n<div class=\"yomi\">明夷は、艱（なや）みて貞しきに利あり。</div>\n<p>明のやぶれるとき、艱難辛苦のうちに誠意を貫くがよろしい。卦の四徳のうち「貞」の字は使っているが「艱貞」である。</p>\n<p><span class=\"tag\">程伝</span>君子が明夷の時に当たっては、艱難を知ってその正を失わないことに利がある。昏暗の時にあって、よくその正を失わない。これこそ明哲な君子たるゆえんである。</p>\n<h3 id=\"g36-s2\">彖伝</h3>\n<div class=\"orig\">明入地中、明夷。内文明而外柔順、以蒙大難、文王以之。</div>\n<div class=\"yomi\">明、地中に入るは明夷なり。内文明にして外柔順、以て大難を蒙る。文王之を以てす。</div>\n<p>太陽が地下に潜ったのが明夷である。下半分が文明、上半分が柔順で、内に文明の徳を持ちながら、うわべは柔順に見せ、それで大きな難儀を耐え忍ぶ。周の文王はこういう態度をもってした。</p>\n<p><span class=\"tag\">程伝</span>明が地中に入り、その明が滅びる。だから明夷という。内卦の離は文明の象、外卦の坤は柔順の象である。人となりが内に文明の徳を持ち、外はよく柔順な者で、昔文王がそうであった。だから「文王之を以てす」という。紂の昏暗に当たり、まさに明夷の時であったが、文王は内に文明の徳があり、外は柔順に紂に仕え、大難を蒙り犯しながら内にその明聖を失わず、しかも外は禍患から遠ざかることができた。これが文王の用いた道である。</p>\n<p>本田の講説：周の文王は殷の暴君紂王と時代を共にした。文王のほうが天下の三分の二を領有し人気を持ちながら、紂に虐げられ、牢屋に放り込まれた。羑里（ゆうり）という所に軟禁されていたその時に『易経』を書いたとされる。紂は殷の最後の王で実在の人物であり、甲骨文にも出てくる。実際は周りの異民族を退治した名君だったが、手を広げ過ぎて人民が疲弊し、国を滅ぼした。</p>\n<div class=\"orig\">利艱貞、晦其明也。内難而能正其志、箕子以之。</div>\n<div class=\"yomi\">艱みて貞しきに利ありとは、其の明を晦（くら）くするなり。内難あって能く其の志を正す。箕子之を以てす。</div>\n<p>卦辞に「艱難辛苦のうちに誠意を貫くがよろしい」と言うのは、自分の知恵を隠すことである。暴君の国内にいるという難儀に直面しながら、よく自分の志を正しく貫いた。箕子はそういう態度をもってした。</p>\n<p><span class=\"tag\">程伝</span>明夷の時に艱厄に処してその正を失わないことに利がある。その明を晦まし蔵すことができるということである。明を晦まさなければ患害を被り、正を守らなければ賢明ではない。箕子は紂の時に当たり、身はその国内にあり、切実にその難に近かった。だから「内難」という。しかし箕子はよくその明を晦まし、自らその正志を守った。これが箕子の用いた道である。だから「箕子之を以てす」という。</p>\n<p>本田の講説：箕子は紂のいとこに当たる。紂の身内には比干・微子・箕子がいた。比干はずけずけと諫めて心臓をくりぬかれ、微子は地位を捨てて亡命し、箕子は狂人のまねをして逃れた。受講者が「明を晦ますなんていうのは老子みたいですね」と言うと、本田は、そうで、こういうところで『老子』と『易』の気分がつながることがある、と答えた。</p>\n<h3 id=\"g36-s3\">大象</h3>\n<div class=\"orig\">明入地中、明夷。君子以莅衆、用晦而明。</div>\n<div class=\"yomi\">明、地中に入るは明夷なり。君子以て衆に莅（のぞ）むに、晦（くら）きを用てして而も明らかなり。</div>\n<p>太陽が地中に潜る形が明夷である。君子はこの卦の姿にかたどって、大衆に接するのに、地中に入った太陽のように、表向きは愚かな顔をしながら、しかも内は明らかである。</p>\n<p><span class=\"tag\">程伝</span>明は照らすためのもので、君子は照らさない所はない。しかし明を用いることが過ぎれば察（苛察）に傷つく。察が太だしければ、事を尽くして含弘の度量がない。だから君子は明が地中に入る象を観て、衆に臨むのに明察を極めず晦を用いる。そうして初めてよく物を容れ、衆を和し、衆が親しみ安んずる。晦を用いることがかえって明であるゆえんである。もし自らの明に任せて察しないところがなければ、自分がその（下々の小さな過ちへの）憤りに堪えず、寛厚含容の徳がなくなり、人情は背き疑って安らかでなく、衆に臨む道を失う。それこそかえって不明となるゆえんである。古の人が冠の前に旒（ビーズの紐）を垂らし、門前に屏樹を設けたのは、明を尽くすことを欲しなかったからである。</p>\n<p>本田の講説：昔の冠は、前にビーズを連ねたものが十二本ぶら下がっていてちょうど目を覆うようになっていた。わざとあまり前がよく見えないようにしてある。冠の横には耳栓がぶら下がっていて、あまりよく聞こえないようにしてある。君主の聡明さに自分からブレーキをかけるという意味である。屏樹は宮殿の前の道に見通しが利かないように立てるもので、昔は樹を立て、後世では壁を建てた。</p>\n<h3 id=\"g36-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>悪い卦にも救いがある。</b> 明夷は卦自体の構成は至って不吉な悪い卦のようだが、程伊川の伝は必ずしも悪いとばかりは言わない。孔子の彖伝も文王や箕子の態度を持ってきて、紂という暗君の支配する時に自分の聡明さをわざと隠すという処世の道を示しており、程伝はそれをさらに強く打ち出している。注釈者は初九のような悪い判断も悪い方向ばかりには解釈しない。受講者が「凶の卦の場合には、必ず、しかしこう努力すれば咎なしとなっていますね」と言うと、本田は、あまり良くない所にいても救いは何とかある、と答えた。卦は六十四、爻はその六倍で三百八十四である。</li><li><b>歴史の例が多い。</b> 受講者が「明夷は深刻な卦で、注に熱が入っていますね」と言うと、本田は、書いている人はだいぶ熱が入っていて、いろんなたとえを持ってくる、と答えた。程伊川は自分自身朝廷に仕えて君主を諫める役目をしていたので、六四の伝はひどく熱が入っている。</li><li><b>滄浪の水。</b> 受講者が「乱世では馬鹿になっていなければだめということですね」「滄浪の水ですね」と言うと、本田は『楚辞』漁父の辞の話をした。屈原が君主に容れられず、位を捨てて今の湖南省の川のほとりで身投げしようかとうろうろしていると、漁師の老人が「あなたは大夫の屈原殿ではないか。なぜこんな所をうろうろしているのか」と言う。屈原が「衆人皆な酔えり、我独り醒む」と言うと、老人はからからと笑い「滄浪の水清まば、以て吾が纓（冠のひも）を濯う可し。滄浪の水濁らば、以て吾が足を濯う可し」と言った。時勢に応じて進退すればよい、濁った世に自分の清潔さをあまりひけらかしてはいかん、ということである。「漁父の利」は別の故事で、鷸（シギ）と蚌（ドブガイ）が争っているのを漁師が両方とも捕ったという話で、出典は『戦国策』だったと思う、と本田は言う。</li><li><b>朱子学と陽明学（続き）。</b> 朱子は学問の広い人で礼の経書もすべて注釈し、易にもだいぶ力を入れた。倫理的に厳しい。韓国の有名な朱子学者は李朝の李退渓、日本では林羅山。陽明学は自分の心がすべてであるので革命や独走に走りやすい（大塩平八郎、西郷隆盛、三島由紀夫）。朱子学は階層社会を大事にし、修身・斉家・治国・平天下のステップを踏む漸進的なもので、革命的にはならない。朱子は宋の人で一一三〇年に生まれ一二〇〇年に亡くなった（一番覚えやすい）。王陽明は明の人で、それからさらに二百年以上下がる。</li><li><b>湯武革命への歯止め。</b> 九三の程伝は、湯王・武王の革命は天下を利とする意があったのではなく、天下の害を除くためであり、志がそうでなければ悖乱にすぎない、と言う。本田によれば、儒教、特に孟子は湯武の革命をばかに賛美するが、程伊川は非常に常識的で、ちゃんとブレーキをかけている。</li><li><b>五が君位とは限らない。</b> 六五の程伝によれば、五を君位とするのは易の常だが、易が義を取るのは時に随って変動する。明夷では上六を暗君（明夷の主）とし、六五はそれにごく近い箕子に当てる。受講者が「爻の意味を随所で変えるのは他にもあったが、シチュエーションで変えるのか」と問うと、本田は、そうだ、五が君位というのは原則だが、ここでは五が箕子を指し、ふつう君主の地位を離れた隠遁者である上が君主になる、と答えた。</li><li><b>箕子と朝鮮。</b> 六五の「箕子之明夷」は、ふつう「箕子の明夷（やぶ）る」と読むが、「箕子明夷に之く」とも読める。前漢の伏生の『尚書大伝』（『書経』の一番古い注釈書で一部しか残っていない）では、どうやら箕子が明夷（今の朝鮮・韓国）まで逃げて行ったと読む。韓国では箕子を開国の祖として尊敬し、箕子の廟があるはずである。箕子を崇めるのは、韓国自体が自分を「えびす」と呼ばれることを容認するのに似る（日本も中国の歴史書では「東夷」である）。ただ「明夷に之く」と読むと象伝とのつながりが悪く、卦名の「明が夷れる」という読みも成立しない。受講者が「箕子が朝鮮に逃げた事実があるのか」と問うと、本田は、わからない、この一句にしか出てこない、韓国はこの一句によって箕子を開国の始祖とした、と答えた。受講者が韓国の国旗の太極と乾坤離坎に触れると、本田は、乾坤が南北なのは邵康節の先天の易にのっとったものだと思う、と答えた。</li><li><b>揚雄への厳しい評価。</b> 揚雄は前漢末の文人で、易に模して『太玄』を創作した大変な才能の人だが、王莽が天下を奪った時に心ならずも仕え、王莽の徳を称える文を書いて天下に広め、媚びたばかりに悪名を残した。程伊川は、それは自分の聡明さを自らなくしたことだと評する。道学者は特にそういう点に厳しく、揚雄への風当たりは強い。揚雄は「楊雄」とも書き、木版本では木偏の本も時々あるが、揚雄のほうがよい。</li></ul>\n<h3 id=\"g36-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>暗君の下で賢者が傷つけられる暗黒の時。艱難の中で正しさを貫け。</li><li>知恵を表に出さず、愚かそうに見せながら内には明を保て（文王・箕子の道）。</li><li>人に臨むのに細かいあら探しをせず、包容力を持て。</li><li>危険の兆しを見たら、世間に怪しまれても早く身を引け（初九）。</li><li>傷を受けても深手ではない。強い助けを得て速やかに逃れれば吉（六二）。</li><li>暗の元凶を除くことはできるが、古い習慣を急に改めようとするな（九三）。</li><li>暗君の腹心に入り込む邪な者に注意（六四）。</li><li>暗君の身近にいるなら、知恵を隠しても志は正しく守れ（六五）。</li><li>高い地位にあって明を失えば、天から地に落ちる（上六）。</li></ul><h2 class=\"sec\" id=\"g36-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">明夷于飛、垂其翼。君子于行、三日不食。有攸往、主人有言。</span></summary><div class=\"body\"><div class=\"yomi\">明夷（やぶ）れて于（ここ）に飛んで其の翼を垂る。君子于（ゆ）き行く、三日食らわず。往く攸有り。主人言（ものい）うこと有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「君子于行、義不食也。」（君子于き行くとは、義として食らわざるなり。）</div>\n<p>傷ついた翼、聡明さを隠した翼が飛ぼう飛ぼうとはするが、とかく翼が垂れ下がり上手く飛べない。君子は禄位を去って出て行くが、三日間飯が食えない。どこかへ行って泊めてもらおうとすれば、宿の主人が文句を言う。大変悪い判断のようだが、注釈者は悪い方向ばかりには解釈しない。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>初九は明の体で明夷の初めにいる。傷つけられる始めである。九は陽明で上に進む者なので、飛ぶ象を取る。昏暗が上にあって陽明を傷つけ、上り進めないようにする。飛ぼうとして翼を傷つけられるのである。翼が傷つけられたので垂れる。およそ小人が君子を害するのは、その行く手段を害するのである。</li><li>「君子于き行く、三日食らわず」とは、君子は明で事の微を見る。傷つけられる端緒はあってもまだ顕かではないが、君子はよくこれを見て、行き去って避ける。「于き行く」とは、その禄位を去って退き蔵れること。「三日食らわず」とは、困窮の極みを言う。事がまだ顕かでなく処し方が甚だ難しいので、幾を見る明でなければできない。幾を知ることは君子の独見で、衆人が識るところではない。だから明夷の始め、傷がまだ顕かでないうちに去れば、世俗は誰もが疑い怪しむ。だから往く所があれば主人が文句を言う。</li><li>しかし君子は世俗に怪しまれるからといって行いを遅疑しない。衆人がすべて識るのを待っていては、傷がすでに及んで去ることができなくなる。これが薛方の明であるゆえんで、揚雄が去り得なかったゆえんである。</li><li>ある人が問うた。「翼を垂れるまでになったら傷はすでに明らかなのに、どうして衆人がまだ識らないことがあるのか」。答え：初は傷の始めである。「其の翼を垂る」とは、飛ぶ手段を傷つけられただけで、事はまだ顕かでない。君子は幾を見るので速やかに去るが、世俗の人はまだ見ることができず、怪しんでこれをそしる。穆生が楚を去った時、申公・白公でさえこれをそしった。まして世俗の人はなおさらである。彼らはただ醴（甘酒）という小さな礼を責めたとそしり、穆生が胥靡（刑罰）の禍いを避けたのだとは知らなかった。穆生は「去らなければ、楚の人はいずれ私を市で鉗（くびかせ）にするだろう」と言ったが、その時は二人の儒者でさえ言い過ぎだと思った。また袁閎は、党錮の事件がまだ起こらない前、名徳の士がまさに蜂起する時に、独り身を土室に潜めた。人々は狂人だと言ったが、ついに党錮の禍を免れた。だから往く所があれば主人が文句を言うのは、怪しむに足らない。</li></ul>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>前漢の薛方は、反逆者王莽に呼ばれた時「堯舜の時代にも許由のような隠者の存在は許されたではないか」と固く断り、王莽も強制しなかったので、家でずっと教授をした（『漢書』鮑宣伝）。揚雄は王莽が帝位を簒奪した時に王莽に媚びてその徳をたたえる文を書き、王莽があっという間に倒されるとかえってお咎めを受け、捕吏がやって来た時に慌てて二階から飛び降りて足をくじき、笑い者になった（『漢書』揚雄伝）。</li><li>穆生の話は『漢書』楚元王伝に出てくる。酒の飲めない穆生のために元王がいつも甘酒を用意していたが、元王が死んで代替わりすると甘酒が出なくなったので、穆生は国を去った。「胥靡」は刑罰、「鉗」は首枷・足枷。穆生が去るのを非難した申公・白公自身が、のちに二代目の君主から刑罰を受けた。</li><li>袁閎のことは『後漢書』に出てくる。庭に地下室（土室）を作ってそこに籠もり、部屋には扉もなく窓が一つ開いていて、そこから食物を入れてもらっていたという。「党錮」は、宦官のグループが正義派の官僚たちを公職から追放したことで、錮は牢屋に入れることではなく官職に就けないことである。ここの伝は歴史的事象を引いた面白いたとえである。</li></ul>\n<p><span class=\"tag\">象伝について程伝</span>君子が遯れ蔵れて困窮するのは義として当然である。ただ義の当然であるから、安らかに処して悶えることがない。食えなくても構わない。本田によれば、「悶えることなし」という文句は乾の卦（初九の文言伝）にもあった。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険の兆しが見えたら、まだ周りが気づかないうちに地位を捨てて去れ。困窮し、世間から非難されても、それを怪しむには足りない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">明夷、夷于左股。用拯馬壯、吉。</span></summary><div class=\"body\"><div class=\"yomi\">明夷れて左の股を夷る。用て拯（すく）う馬壮んなれば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六二之吉、順以則也。」（六二の吉なるは、順にして以て則あればなり。）</div>\n<p>知恵を隠すべき時に、左の股に傷がついた。自分を救ってくれる馬が強ければ、逃げ切れて吉。本田によれば、「用て拯う、馬壮んなれば」と読むのは文法的に無理があり、注釈者もいろいろ苦労しているが、あまりぴったり来るものがない。</p>\n<p><span class=\"tag\">程伝</span>六二は至明の才で、中正を得て順を体し、時に順って自ら処している。処し方の至善なるものである。しかし君子が自らよく処しても、陰暗の小人が明を傷つける時に当たっては、やはりその傷を免れない。ただ君子は自ら処するのに道があるので、深く傷つけることはできず、ついにはよくこれを避けるだけである。足は行く手段で、股は脛・足の上にあって、行くのにそれほど切実ではない。左はまた用いるのに便利な側ではない。手足の用は右を便とし、ただ蹴り踏ん張る時に左を用いるのは、思うに右に立つのを本とするからである。「左股を夷る」とは、行くことを害されるが甚だ切ではないことである。それでもまた必ず自ら免れる道があり、救うのに壮健な馬を用いれば速やかに免れて吉である。君子が陰暗に傷つけられても、自ら処するに道があるので傷は甚だしくなく、自ら救うに道があるので免れることが速やかである。救う道が壮んでなければ、傷を被ることが深い。だから「馬壮んなれば吉」という。二は明で陰暗の下にいる。吉とはただ傷害を免れることができるだけで、この時に大いに為すことがあるという意味ではない。</p>\n<p>本田の講説：股はあまり動かず脚の下のほうほど振りが大きいので、この理屈は生理学的にはおかしいかもしれない。右に重心を置いて立つから、蹴飛ばすのは左で蹴飛ばすのが便利ということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>六二が吉を得るのは、順で法則があるからである。「則」とは中正の道を言う。よく順って中正を得ているのが、明が傷つけられる時に処してその吉を保つゆえんである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>小人に傷つけられるが深手ではない。時勢に順い中正を守り、強い助けを得て速やかに逃れれば吉。ただし大事をなせる時ではない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">明夷于南狩、得其大首。不可疾貞。</span></summary><div class=\"body\"><div class=\"yomi\">明夷れて南に狩りし、其の大首を得ん。疾（と）く貞にす可からず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「南狩之志、乃大得也。」（南狩の志は、乃ち大いに得るなり。）</div>\n<p>九三は知恵を隠しているが、南に狩りをして敵の首領を得るであろう。ただしあまりに急に正義を振りかざすべきではない。</p>\n<p><span class=\"tag\">程伝</span>九三は離の上、明の極みである。また剛で上に進む。上六は坤の上、暗の極みである。至明が下にいて下の上となり、至暗が上にいて窮極の地にいる。まさに相敵応する。明をもって暗を除こうとする者である。この義は湯武の事であろうか。南は前にあって明るい方角、狩は田猟して害を除くこと。「南狩」とは前進して害を除くことで、その大首を獲るべきである。大首とは暗の魁首、上六を言う。三と上は正応で、至明が至暗に克つ象である。「疾く貞にす可からず」とは、その元悪を誅しても、旧く染まった汚俗はにわかに革めることはできず、必ず漸進的にすべきで、革めることが急であれば駭き懼れて安らかでないということである。だから『書経』酒誥に「殷の迪（みち）びける諸臣、惟れ工（官）、乃ち酒に湎（おぼ）る。庸て之を殺す勿れ。姑く惟れ之を教えよ」とある。だいぶ長く経ってもなお「余風未だ殄（つ）きず」と言う。浸り漬かった風俗はにわかに革めることができない。だから「疾く貞にす可からず」、正すことを急にしてはならないという。上は君位ではないが、上にいて暗の極みなので暗の主とし、「大首」という。</p>\n<p>本田の講説：「湯武」は殷の湯王と周の武王で、それぞれ革命によって殷王朝・周王朝を打ち立てた。酒誥は『書経』の一篇で、周の時代に作られた天子の詔勅であり、殷の人民が酒ばかり飲んでいるのを戒めたもの。「駭」は驚く、「懼」は恐れる。</p>\n<p><span class=\"tag\">象伝について程伝</span>下の明で上の暗を除くのは、その志が害を去ることにある。商（殷）の湯王・周の武王がどうして天下を利とする意があったろう。「其の大首を得」とは、害を除いて大いにその志を得たことである。志がいやしくもそうでなければ、悖乱の事である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>暗愚な元凶を除き、志を大いに遂げることができる。ただし長年の悪弊は急には改まらないので、正すことを焦るな。私利のためにすれば乱にすぎない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">入于左腹、獲明夷之心、于出門庭。</span></summary><div class=\"body\"><div class=\"yomi\">左の腹に入る。明夷の心を獲たり。于（ゆ）きて門庭を出づ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「入于左腹、獲心意也。」（左腹に入るは、心意を獲るなり。）</div>\n<p>君主の左の腹に潜り込み、賢明さを傷つける暗愚な君の心を掴んだ。そうしておいて門や庭を出て、したい放題ができる。</p>\n<p><span class=\"tag\">程伝</span>六四は陰で陰位にいて、柔の体にあり、君に近い位にいる。陰邪の小人が高位にいて、柔邪で君に順う者である。六五は明夷の君で、明を傷つける主である。四は柔邪でこれに順い、その交わりを固める。小人が君に仕えるのに、顕明に由り道で合する者はなく、必ず隠僻の道で自ら上に結ぶ。右は用いるべき所で明らかな所、左は用いない所で隠僻の所である。人の手足はみな右を用とし、世に僻所を「僻左」と言う。左は隠僻の所である。四は隠僻の道によって深くその君に入る。だから「左腹に入る」という。腹に入るとは交わりの深いことで、交わりが深いのでその心を得る。邪臣が君に信ぜられるのは、みなその心を奪うことによる。心を奪わなければ、いつまでも悟らずにはいない。「于きて門庭を出づ」とは、すでにその心を信じさせて、その後これを外に行うことである。邪臣が暗君に仕えるには、必ず先にその心を蠱惑し、その後外に行うのである。</p>\n<p>本田の講説：ここでは「僻左」を挙げるが、ほかに「左道」という言い方もあり、邪道のことを言う。受講者が「左遷の左はしりぞくの意味か」と問うと、本田は、古くは右大臣・左大臣で右のほうが位が上で、左は位が下がるという意味だと答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>「左腹に入る」とは、邪僻の道で入り、その心意を得ることである。心を得るので、ついに悟らないのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>邪な者が上の者の腹心に入り込み、その心を掴んで外で勝手放題をする形。君側の奸に注意せよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">箕子之明夷、利貞。</span></summary><div class=\"body\"><div class=\"yomi\">箕子の明夷る。貞しきに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「箕子之貞、明不可息也。」（箕子の貞は、明息（や）む可からざるなり。）</div>\n<p>箕子が自分の知恵を隠した。正しい道を貫けば利がある（「箕子明夷に之く」と読む説については、程伝と本田の講説の項参照）。</p>\n<p><span class=\"tag\">程伝</span>五は君位で、それが常である。しかし易が義を取るのは変動して時に随う。上六は坤の上にいて明夷の極み、陰暗が明を傷つけることの極まった者である。五はこれにごく近い。聖人はそこで五を暗に切に近い者とし、これに処する義を示した。だから専ら君位で言わない。上は陰暗で明を傷つけることの極みなので明夷の主とし、五はその明を傷つける者に切に近い。もしその明を顕らかにすれば必ず傷害される。だから箕子が自ら晦ましたようにすべきで、そうして初めて難を免れることができる。箕子は商の旧臣で、しかも紂と同姓の親族であり、紂にごく近いと言うべきである。明を晦まさなければ禍を被ることは必定である。だから佯狂して奴隷となり、それで害を免れた。その明を晦ましたが、内にはその正を守った。いわゆる「内難あって能く其の志を正す」である。だから箕子を仁という。箕子のような者は貞と言うべきである。五が陰柔なので戒めて「貞しきに利あり」と言う。箕子のように貞固であるべきだということである。君道で言っても同じで、君にもまた晦ますべき時があり、外はその明を晦まし内はその志を正すのである。</p>\n<p>本田の講説：孔子は「殷に三仁あり」と言って、比干・微子・箕子を三人の仁者とした。殷のことを商とも言う。最後の「君道で言えば」以下は易の本文には全くない内容で、程伊川が好んで付け加えたものである。受講者が「佯狂の佯はいつわりか」と問うと、いつわり、うわべはという意味で、テキストには彳（ぎょうにんべん）が書いてあるが人偏でもよい、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>箕子は晦まし蔵したがその貞固を失わず、患難に遭いながらその明は自ずから存して、滅び消えることがなかった。もし禍患に迫られて遂にその守るところを失えば、明を失い、滅び消えることになる。古の人では揚雄のような者がそれである。</p>\n<p>本田の講説：象伝は「箕子の貞は、明息む可からず」とも「箕子の貞明は息む可からず」とも読めるが、程伊川の伝を見ると「貞」で切っている。「息」は「熄」と同じで、やむこと。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>暗君のすぐそばにいる危うい立場。知恵を隠して難を避けつつ、内なる志は正しく守り通せば利がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">不明晦。初登于天、後入于地。</span></summary><div class=\"body\"><div class=\"yomi\">明らかならずして晦（くら）し。初めは天に登り、後には地に入る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「初登于天、照四國也。後入于地、失則也。」（初めは天に登るとは、四国を照らすなり。後には地に入るとは、則を失うなり。）</div>\n<p>上六は至って不明な君で、その知恵は暗い。最初は天のような高い地位に上るが、後には地下に潜ってしまうであろう。</p>\n<p><span class=\"tag\">程伝</span>上は卦の終わりにいて明夷の主であり、また明が傷つくことの極みである。上は至高の地である。明者が至高にいれば本来遠くまで照らすべきだが、明がすでに傷ついているので、不明でかえって昏晦である。もともと高明な所にいて遠くに及ぶべきなのが「初めは天に登る」で、その明を傷つけて昏暗になるのが「後には地に入る」である。上は明夷の終わり、また坤陰の終わりで、傷つくことの極まった者である。</p>\n<p>本田の講説：「至高の地に処る」は「上は至高の地なり」と読んでもかまわない。「不明」と「晦」は同義語を二つ重ねたものである。</p>\n<p><span class=\"tag\">象伝について程伝</span>「初めは天に登る」とは、高い所にいて明であれば照らすことが遠くに及ぶべきことである。それなのに傷つけられて昏暗になる。これが「後には地に入る」で、明の道を失ったのである。「則を失う」とはその道を失うことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高い地位にありながら明を失った暗君。初めは天に昇る勢いでも、最後は地に墜ちる。</div></div></details><div class=\"pager\"><a href=\"#gua-35\">← 火地晋</a><a href=\"#gua-37\">風火家人 →</a></div>", "gua-37": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 37 卦　第五十四講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風火家人</div><div class=\"yo\">ふうかかじん</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-37\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-37\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-37\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-37\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-37\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-37\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-37\" data-jump=\"yao\">六爻</a></div><h3 id=\"g37-s0\">卦の名と象</h3>\n<p>離下巽上、下が離、上が巽である。</p>\n<p>本田の講説：「家人」は本来は舎人、つまり家内奴隷という意味ではなかったかと思う。漢の初め頃、竇太后が『老子』を好んで読んでいたのを、儒者が「老子なんてものは家人の言である」と言った。家内奴隷のような地位の低い、虐げられた連中が唱えた説ということで、竇太后をひどく怒らせたという話が『漢書』にある。しかし孔子の解説では、父は父らしく子は子らしく兄は兄らしく、という家庭内の道徳を説く卦ということになっている。</p>\n<p>程伝（序卦伝を引く）：「夷とは傷るるなり。外に傷るる者は必ず家に反る。故に之を受くるに家人を以てす」。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>外で傷つき困しめば必ず内に帰る。家人が明夷に次ぐゆえんである。家人とは家内の道で、父子の親しみ、夫婦の義、尊卑長幼の序である。倫理を正し、恩義を篤くするのが家人の道である。</li><li>卦は外が巽（風）、内が離（火）で、風が火から出る形である。火が盛んであれば風が生じ、風は火の内から外へ出る。内から外に及ぶ象である。</li><li>二と五が男女の位を内外に正しくしている（二は陰が陰位、五は陽が陽位）。これが家を治める道である。内に明らかで外に巽（へりくだる）、家に処る道である。</li><li>およそ徳を身に有する者は、よく家に施す。家に行われるものは国にも施せ、天下が治まるに至る。天下を治める道は家を治める道で、これを推して外に行うだけである。だから内から外に出る象を取って家人の義とする。</li></ul>\n<p>本田の講説：程伊川がここで述べているのは、『大学』の修身・斉家・治国・平天下というプロセスである。</p>\n<p><span class=\"tag\">程伝</span>文中子の書は「内を明らかにし外を斉（ととの）うる」を義とし、古今これを善しとするが、象の意を取ったものではない。いわゆる「巽に斉す」とは、万物が巽の方角で潔斉することを言うのであって、巽に斉える義があるのではない。「乾に戦う」も、乾に戦いの義があるのではない。</p>\n<p>本田の講説：隋から唐の初めにかけて王通という人が『文中子』を書いた（文中子は王通の号でもある）。その礼楽篇で、弟子が「風が火から出る卦を家人と名づけるのはなぜか」と問うと、文中子は「内を明らかにし外を整えるから家人と名づける」と答えた。文中子は説卦伝の「万物は震より出で、巽に斉す」から、巽に「整える」意味があると解したが、程伊川によればそれは巽の方角で万物が精進潔斎するという意味で、巽に他のものを整える意味があるのではない。これは程伊川の指摘する通りである。</p>\n<h3 id=\"g37-s1\">卦辞</h3>\n<div class=\"orig\">家人、利女貞。</div>\n<div class=\"yomi\">家人は女の貞しきに利あり。</div>\n<p>この卦が出たら、婦人の身の正しさに利がある。妻が身を正しくするのがよい。</p>\n<p><span class=\"tag\">程伝</span>家人の道は、女が正しいことに利がある。女が正しければ家道が正しい。夫は夫、婦は婦であって家道が正しくなる。ただ「女の貞しきに利あり」と言うのは、夫が正しいのは身が正しいだけだが、女が正しいのは家が正しいことだからである。女が正しければ男が正しいことは知れている。</p>\n<p>本田の講説：ここでは、家というものはやはり女性が支えているという認識がある。</p>\n<h3 id=\"g37-s2\">彖伝</h3>\n<div class=\"orig\">家人、女正位乎內、男正位乎外。男女正、天地之大義也。</div>\n<div class=\"yomi\">家人は、女、位を内に正し、男、位を外に正す。男女正しきは天地の大義なり。</div>\n<p>女が内で自分の立場を正しく保ち、男が外で自分の立場を正しく保つ、そういう形の卦である。男女が正しいことは天地の大義にかなう。</p>\n<p><span class=\"tag\">程伝</span>卦の形で言う。陽が五にいるのは外にあること、陰が二にいるのは内にいることで、男女がそれぞれ正しい位を得ている。尊卑内外の道が正しいことは、天地陰陽の大義に合う。本田によれば、天は男、大地は女にかたどる。</p>\n<div class=\"orig\">家人有嚴君焉、父母之謂也。</div>\n<div class=\"yomi\">家人に厳君有りとは、父母の謂なり。</div>\n<p>「家族の中にも厳しい君主がある」というのは、父母を指して言う。有名な文句である。</p>\n<p><span class=\"tag\">程伝</span>家人の道は、必ず尊厳で君長とする者がいる。父母のことである。一家は小さくても、尊厳がなければ孝敬が衰え、君長がなければ法度が廃れる。厳君があって家道は正しい。家とは国の則（手本）である。</p>\n<div class=\"orig\">父父、子子、兄兄、弟弟、夫夫、婦婦、而家道正。正家而天下定矣。</div>\n<div class=\"yomi\">父は父たり、子は子たり、兄は兄たり、弟は弟たり、夫は夫たり、婦は婦たりて、家道正し。家を正して天下定まる。</div>\n<p><span class=\"tag\">程伝</span>父子・兄弟・夫婦がそれぞれその道を得れば家道は正しい。一家の道を推して天下に及ぼすことができる。だから家が正しければ天下が定まる。</p>\n<p>本田の講説：受講者が「婦をツマと読むのはどこから来ているのか」と問うと、婦は女性一般ではなく妻の意味で、字の形は女偏に箒である、と答えた。</p>\n<h3 id=\"g37-s3\">大象</h3>\n<div class=\"orig\">風自火出、家人。君子以言有物、而行有恆。</div>\n<div class=\"yomi\">風、火より出づるは家人なり。君子以て言に物有りて、行いに恒有り。</div>\n<p>上半分が風、下半分が火。火が盛んに燃えて風が火から出ている形が家人である。君子はこの卦の形にのっとって、言葉には具体性があり、行いには恒（法則）がある。</p>\n<p><span class=\"tag\">程伝</span>家を正す本は身を正すことにある。身を正す道は、一言一動もゆるがせにしてはならない（「易」は「あなどる」と読んでもかまわない）。君子は風が火から出る象を観て、事が内から出ることを知る。だから言う所には必ず物があり、行う所には必ず恒がある。物とは事実、恒とは常度法則を言う。徳業が外に著われるのは、言行を内に謹むことによる。言が慎み行いが修まれば、身が正しくて家が治まる。</p>\n<p>本田の講説：この程伊川の易伝はなかなかよくできている。君子の言葉には事実がなければならず、抽象的で何を言っているかわからないことを言ってはならない。受講者が「なぜここで恒が出てくるのか」と問うと、本田は、行いに法則にかなったところがあるということから、家内道徳にも天下を治めるのにも法則性があるという所へ話を持っていこうとするので、「言に物有り」だけでは倫理性が足らんと思って「恒」（法則）という字を持ってきた、と答えた。</p>\n<h3 id=\"g37-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>言と行。</b> 受講者が「言行という言葉はここから来ているのか、どこが一番古いか」と問うと、本田は、どこが一番古いかはわからないが、この象伝は比較的古いはずで、孔子は言と行を並列し、言は忠信、行いは篤敬であればどんな野蛮国にも通用すると言っている、言と行は孔子の言葉の中でいつも伴って出てくる、と答えた。</li><li><b>知行合一と「知難行易」。</b> 受講者が「孫文が日本人を皮肉って『知るは難く行うは易し』と言ったという」と言うと、本田は、それは王陽明で、王陽明が知行合一と言い、行いが先で知ることは後とした、朱子学では知ることが先で行いが後とはっきり言う、王陽明はそれをひっくり返した、孫文は日本人の猪突猛進ぶりを皮肉ったのだろう、と答えた。また王陽明が「格物致知」を言うのと「行いが先」とは矛盾しないかとの問いに、王陽明は自分の心がすべてで、自分の心が万物の在り方を正しくし、天体の運行もすべて自分の心がそうさせると言うのだから、実行が先にあるので合うはずだ、と答えた。王陽明の中国での影響は朱子ほど大きくなく、明が滅びるまでくらいで、陽明学は国教にならなかった。日本人は陽明学が好きなのである。</li><li><b>彖伝と象伝。</b> 受講者がどちらが面白いかと問うと、本田は、彖伝はだいたい長くて理屈がたくさん入っており、六本の爻の位置を見て説明する、象伝は非常に短く、八卦の形で説明し、簡潔な言葉で象徴的・感覚的で、これはこれで面白い、と答えた。『易経』は象伝・彖伝・繋辞伝なども含めて『易経』で、六十四の卦と判断辞、それに対する孔子の解説が全部ついて完成されている。</li><li><b>陽が善しとされる卦。</b> 六二の程伝によれば、家庭内では人情が礼に勝ち恩が義を奪いやすいので、家人の卦では大要剛を善とし、初九・九三・上九が善しとされる。ふつう一番上の爻はあまりよくないが、この卦では善い。</li><li><b>寛と猛。</b> 九三の「寛猛の中」の寛と猛の組み合わせは『左伝』で鄭の子産の言葉として出てくる。国を治めるのに寛やかで治まればそれに越したことはないが、それでやっていけなければ猛々しくするのがよい、と言った。</li><li><b>男尊女卑。</b> 受講者が「この卦の爻は全部男尊女卑ですね」と言うと、本田は「はい、そうです」と答えた。</li><li><b>家産国家。</b> 九五の象伝「交相愛す」について本田は、古代中国では自分の家を正すことがそのまま天下を正す道に通じ、国・天下全部を自分の家族と思う、いわゆる家産国家で、国全部が王者の財産である、と説明した。</li><li><b>なぜ変爻で見るか。</b> 本田は、先に受講者から出た「易はなぜ変爻で見るのか」という鋭い質問について、古い注釈書にも理由は書いておらず、昔から変爻で見ることになっている、と言った。『左伝』『国語』で『易経』の文句を引用する所には「九五」のような言い方はなく、例えば「乾の大有に之くに遇う」と言う（他の五本が不変で五だけが変ということ）。六本出したうち変爻になるのはだいたい一・五本くらいなので、一本か多くて二本出ることになり、一つだけ変という場合が圧倒的に多い。それで断を下すのは至って自然だと思う、と言う。</li></ul>\n<h3 id=\"g37-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>家庭の道徳の卦。女性（妻）が身を正すことに利がある。</li><li>家を治める本は自分の身を正すことにある。言葉には中身を、行いには一貫性を持て。</li><li>家の乱れは初めに掟で防げ（初九）。</li><li>女性は自分で事を遂げようとせず、家の内のことに専念すれば正しくて吉（六二）。</li><li>家を治めるのは、だらしなさよりはむしろ厳しすぎるほうがよい（九三）。</li><li>素直で正しい位にいれば家は富み大吉（六四）。</li><li>夫婦が徳を同じくし互いに愛し合えば、心配なく吉（九五）。</li><li>誠と威厳をもって家に臨み、まず自分の身を反省せよ（上九）。</li></ul><h2 class=\"sec\" id=\"g37-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">閑有家、悔亡。</span></summary><div class=\"body\"><div class=\"yomi\">有家に閑（ふせ）ぐ。悔亡ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「閑有家、志未變也。」（有家に閑ぐは、志未だ変ぜざるなり。）</div>\n<p>「有家」の「有」は美称で意味はない（唐の王朝を「有唐」と言う類い）。家において法度をもって悪を防ぐ。「閑」は門の中に木で、家畜などが勝手に逃げ出さないように門の所に横木がある形で、それが「ふせぐ」の意味になる。後悔しないですむ。「悔い无し」と言わずに「悔い亡ぶ」と言うのは、当然後悔があるべき状態が滅びるという意味である。受講者が「悔い亡ぶは吉のほうか」と問うと、本田は、吉とまでは言わない、せいぜい「咎无し」くらいだと答えた。</p>\n<p><span class=\"tag\">程伝</span>初は家道の始めである。閑とは法度を言う。家を治める始めに、よく法度で防閑すれば悔に至らない。家を治めるのは衆人を治めることで、いやしくも法度で防がなければ、人情が流れ放題になり、必ず悔に至る。長幼の序を失い、男女の別を乱し、恩義を傷つけ、倫理を害し、至らないところはない。よく法度で初めに防げばそういうことはない。だから悔が亡ぶ。九は剛明の才で、よくその家を防ぐ者である。「悔い无し」と言わないのは、群居すれば必ず悔があるが、よく防ぐので亡ぶだけだからである。</p>\n<p>本田の講説：男女の別を乱すとは、みだりがましい淫乱な行為に走ることである。</p>\n<p><span class=\"tag\">象伝について程伝</span>これを初めに防ぐのは、家人の志意がまだ変動しない前である。正しい志がまだ流散変動しないうちにこれを防げば、恩を傷つけず義を失わず、家に処する善である。だから悔が亡ぶ。志が変じてから治めれば、傷つけるところが多く、悔があることになる。</p>\n<p>本田の講説：受講者が「『志意未だ変動せざるの前』というのは、日本語なら『変動する前』でおかしくないか」と問うと、本田は、「未だ何々せざるの前」「既に何々するの後」という言い方は、言わば同格を重ねたもので、よくする言い方だと答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>家庭や組織の乱れは、まだ心が乱れないうちに規律を定めて防げ。そうすれば起こるはずの後悔も起こらない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">无攸遂、在中饋、貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">遂ぐる攸（ところ）无し。中饋（ちゅうき）に在るときは貞しくして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六二之吉、順以巽也。」（六二の吉なるは、順にして以て巽なればなり。）</div>\n<p>婦人は自分で何かをし遂げることはしないほうがよろしい。家内で食事をつかさどることに専念すれば、それが貞しい道で吉である。「饋」は食べ物を贈る意味で、お歳暮・お中元を「歳饋」と言う。「餽」も同じ意味だが、鬼の字が入っていてあまり見場がよくないので、この字のほうがよろしい。</p>\n<p><span class=\"tag\">程伝</span>人が家に処するには、骨肉父子の間にあって、おおむね情が礼に勝ち、恩が義を奪う。ただ剛立の人だけが、私愛でその正理を失わない。だから家人の卦は大要剛を善とし、初・三・上がそれである。六二は陰柔の才で柔位にいる、家を治めることのできない者である。だから遂げる所がなく、為す所がなくてよい。英雄の才でさえ情愛に溺れて自ら守れない者がいる。まして柔弱な人が妻子の情に勝てようか。二のような才は、婦人の道とすれば正である。柔順で中正にいるのは婦人の道である。だから中饋にあればその正を得て吉である。婦人は家の中にいて食事をつかさどる者なので、「中」と言う。</p>\n<p>本田の講説：「剛立」と言えば、麻田剛立という江戸時代の天文学者がいた。</p>\n<p><span class=\"tag\">象伝について程伝</span>二は陰柔で中正にいて、よく順従して卑巽する者である。だから婦人の貞吉とする。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分が主になって事を成し遂げようとせず、内側の務めに専念すれば正しくて吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">家人嗃嗃、悔厲吉。婦子嘻嘻、終吝。</span></summary><div class=\"body\"><div class=\"yomi\">家人嗃嗃（かくかく）たり。厲（はげ）しきに悔いあれど吉。婦子嘻嘻（きき）たれば、終に吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「家人嗃嗃、未失也。婦子嘻嘻、失家節也。」（家人嗃嗃たるは未だ失せざるなり。婦子嘻嘻たるは家の節を失するなり。）</div>\n<p>この文句はちょっと難しい。程伊川の易伝によれば、家長が厳しすぎて家族がみなひいひい言う（嗃嗃は締め上げられて悲鳴を上げる）。厳しすぎるという悔はあるが結果は吉。逆に家の中の女たちがいつもきゃあきゃあと笑い騒いでいれば、最後は恥をかく。受講者が「吝はケチという意味か」と問うと、本田は、易の判断では吝は恥ずべしという意味で、ケチという意味ではない、と答えた。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>嗃嗃はまだ字義が詳らかでないが、文義と音から見ると「嗷嗷」に類する。人が急束（厳しい締め付け）に苦しむ意である（本田によれば、テキストの「又若」は別のテキストの「人苦」とするほうが意味がよく通る）。三は内卦の上にいて、内を治めることをつかさどる者である。陽で剛位にいて中でない。正を得てはいるが剛に過ぎる者である。内を治めることが剛に過ぎれば厳急に傷つく。だから家人が嗃嗃然とする。家を治めることが厳に過ぎれば傷つけることがないわけにはいかず、必ず厳厲に悔がある。骨肉は恩が勝るので、厳が過ぎるために悔がある。</li><li>寛猛の中をまだ得ていないが、家道は斉粛で人心は祗（つつし）み畏れる。なお家の吉である。もし婦子が嘻嘻としていれば、終には羞吝に至る。卦に嘻嘻の象があるのではなく、嗃嗃に対して言ったのである。その放肆に失するよりはむしろ厳に過ぎよ、という意味である。嘻嘻とは笑い楽しんで節がないことで、ほしいままで節がなければ、終には家を敗るに至り、羞ずべきである。</li><li>厳謹が過ぎれば人情において傷つけることがないわけではないが、法度が立ち倫理が正しければ、恩義の存するところとなる。もし嘻嘻として度がなければ、法度は廃れ倫理は乱れる。どうしてその家を保てよう。嘻嘻が甚だしければ家を敗る凶を致す。ただ吝と言うのは、吝が甚だしければ凶に至るので、まだ急に凶とは言わないのである。</li></ul>\n<p>本田の講説：北京音で言うと嗃はホウホウ、嗷はハオハオ（アオアオ）となる。束は検束、締め付けの意味。「厳厲」の厲も程度が厳しい意味。吝とだけ言って凶と言わないのは、まだ引き返す余裕があるということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>家人が嗃嗃としても、家を治める道においてはまだ甚だしく失ったとはしない。もし婦子が嘻嘻としているなら、礼法がなく家の節を失い、家は必ず乱れる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>家の治め方が厳しすぎて家族が悲鳴を上げても、引き締まって結局は吉。逆に締まりなく笑い騒いでいれば、ついには恥をかく。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">富家、大吉。</span></summary><div class=\"body\"><div class=\"yomi\">家を富ます。大吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「富家大吉、順在位也。」（家を富ます大吉なるは、順にして位に在ればなり。）</div>\n<p>この爻が出たら家が金持ちになる。結果は大吉。</p>\n<p><span class=\"tag\">程伝</span>六は巽の体で四にいて、その正位を得ている。居ることが正を得ているのは安処の義である。巽で事に順い、正道に由る。よくその富を保有する者である。家に居る道は、よくその富を保有すれば大吉である。四は高位なのに独り「富」と言うのは、家において高いと言えば家の富のことだからである。その富を保つのは、よくその家を保つことである。吉でこれより大きいものはない。</p>\n<p>本田の講説：四は階級で言えば卿大夫の地位で、社会的に高い地位だが、「貴」などではなく「富」という文字だけを用いている。家を富ますということは、家を長く保ち得るという意味を含む。</p>\n<p><span class=\"tag\">象伝について程伝</span>巽順で正位にいる。正であって巽順なのは、よくその富を保有する者である。家を富ます大吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>素直で分をわきまえ、正しい位にいる。家は富み、それを長く保てる。大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">王假有家、勿恤吉。</span></summary><div class=\"body\"><div class=\"yomi\">王、家を有つに仮（いた）る。恤（うれ）うる勿くして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「王假有家、交相愛也。」（王、家を有つに仮るとは、交々相愛するなり。）</div>\n<p>前に出た「有家」の「有」は美称だったが、ここでは程伊川は「家を有（たも）つ」と読ませる。王様が家を保つ道の極致に至る。心配することは何もなくて吉。</p>\n<p><span class=\"tag\">程伝</span>九五は男で外にあり、剛で陽位にいて、尊位で中正である。またその応（六二）が内で順正である。家を治めることの至正至善なる者である。王が家を有つ道に至る。五は君位なので王と言う。仮は至るである（この場合だけ「仮」はカクと読めと注がある）。家を有つ道を極めることである。王者の道は、身を修めて家を斉え、家が正しければ天下が治まる。古から聖王は、己を恭しくし家を正すことを本としない者はなかった。だから家を有つ道がすでに至れば、憂え労せずして天下は治まる。「恤うる勿くして吉」である。五は己を外に恭しくし、二は家を内に正す。内外が徳を同じくする。至れりと言うべきである。</p>\n<p>本田の講説：「仮」は「格物致知」の「格」と音も意味も同じである。修身・斉家・治国・平天下は儒教で一つの道筋として理解される。</p>\n<p><span class=\"tag\">象伝について程伝</span>「家を有つに仮る」の道とは、ただよくこれを威厳で従わせるだけではなく、必ずその心を感化して誠で合することに至るのである。夫はその内助を愛し、婦はその刑家（家に法を施すこと）を愛する。交々相愛するのである。よくこのようであったのは文王の妃であろうか。もし身が修まり法が立っても家がまだ化していなければ、まだ家を有つに仮る道とは言えない。</p>\n<p>本田の講説：文王の妃は太姒と言う。『詩経』の一番初めの「関雎」の詩は文王の妃の徳を述べた歌だと解説され、『列女伝』にも伝記がある。受講者が「妃の右側は己か巳か」と問うと、己が正しく、木版本では口が開いたり閉まったりするが、開いているのが正しい、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>家を治める道が極まり、夫婦・家族が互いに愛し合う。心配することなく吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">有孚威如、終吉。</span></summary><div class=\"body\"><div class=\"yomi\">孚（まこと）有りて威如たり。終に吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「威如之吉、反身之謂也。」（威如の吉なるは、身に反るの謂なり。）</div>\n<p>この上九という人物は誠があり、しかも威厳がある。最後は吉。</p>\n<p><span class=\"tag\">程伝</span>上は卦の終わりで、家道が成るところである。だから家を治める本を極言する。家を治める道は至誠でなければできない。必ず中に孚があれば、よく常久であり、人も自ずから化して善となる。至誠によらなければ、自分すら常に守ることができない。まして人を化することなど。だから家を治めるには孚があることを本とする。家を治めるのは妻孥（妻子）の情愛の間にある。慈が過ぎれば厳がなくなり、恩が勝てば義を掩う。だから家の患いは常に礼法が足りずに瀆慢が生ずることにある。長が尊厳を失い、少が恭順を忘れて、家が乱れなかった者はまだない。だから必ず威厳があれば、よく終に吉である。家を保つ終わりは、孚があることと威如であることの二者にあるだけである。だから卦の終わりでこれを言う。</p>\n<p>本田の講説：この程伊川の易伝はなかなか熱がこもっている。「孥」は妻や子を含めた呼び方である。</p>\n<p><span class=\"tag\">象伝について程伝</span>家を治める道は身を正すことを本とする。だから「身に反るの謂なり」と言う。爻辞は家を治めるには威厳があるべきだと言い、夫子（孔子）はさらに戒めて、まずその身に厳しくすべきだと言う。威厳がまず自分に行われなければ、人は怨んで服さない。だから威如にして吉なのは、自らに反るからである。孟子のいわゆる「身、道を行わざれば、妻子にも行われず」である（『孟子』尽心篇）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>誠意と威厳をもって家に臨めば、最後は吉。ただし人に厳しくする前に、ま
