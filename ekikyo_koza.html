etails class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">需于酒食。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">酒食に需つ。貞しくして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「酒食貞吉、以中正也。」（酒食貞吉なるは、中正を以てなり。）</div>\n<p>酒と飯を楽しみながら時を待っている。自分の心が正しく、結果も吉。「食」は飯の意味なら「し」と読むのが正しい。</p>\n<p><span class=\"tag\">程伝</span>五は陽剛で中にいて、正位を天に得て、その道を尽くしている。これで待てば、何が得られないことがあろう。だから酒食に安らいで待ち、求めるものは必ず得られる。貞正を得て、しかも求めるものが必ず遂げられるのだから吉である。「需」は「待つ」とも「求める」とも解せる。</p>\n<p><span class=\"tag\">象伝について程伝</span>酒食に待って正しく吉なのは、五が中正を得てその道を尽くしているからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>最良の位置。ゆったり構えて待てば、求めるものは必ず得られる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">入于穴。有不速之客三人來。敬之終吉。</span></summary><div class=\"body\"><div class=\"yomi\">穴に入る。速（まね）かざるの客三人有りて来る。之を敬えば終に吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不速之客來、敬之終吉、雖不當位、未大失也。」（速かざるの客来る、之を敬えば終に吉とは、位に当たらずと雖も、未だ大いに失わざるなり。）</div>\n<p>自分の隠れ家に潜り込む。招いてもいない客が三人やって来る。その客に敬意を払えば、結果は良い。「吉」の字はあるがあまり良い判断ではなく、「速かざるの客」とは、敵とか厄介者が押しかけて来るということである。</p>\n<p><span class=\"tag\">程伝</span>需は険が前にあるので時を待って進む卦である。上六は険の終わりにいる。終われば変わる。需の極みにいて、久しく待ってついに得た。陰が偶数位に止まるのは、その所に安んずることで、だから「穴に入る」という。穴は安んずる所である。安んじて止まると、後れた者が必ずやって来る。「速かざるの客三人」とは下の三陽である。乾の三陽はいつまでも下にいるものではなく、時を待って進む者で、待つことが極まったので、みな上って来る。「速かず」とは、呼ばないのに自ら来ること。上六は待ちに待って安らぐ場所を得た。そこに剛陽が進んで来る。これを忌み憎み争う心を起こさず、誠意と敬意を尽くして待てば、剛暴な者でもどうして侵し凌ぐことがあろう。だから終に吉である。</p>\n<p>ある人が「陰で三陽の上に乗っていて、安らかでいられるのか」と問うた。答え：三陽は健体で、志は上へ進むことにある。上六は陰の位で、陽がいつまでも止まるべき正しい所ではない。だから奪い取ろうという気持ちはない。これを敬えば吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>「位に当たらず」とは、陰で一番上にいることをいう。爻としては六が陰の位にいて安んずる所なのだが、象伝はさらにその義を尽くし、陰は下にいるべきなのに上にいることを「位に当たらず」と明らかにした。普通「位に当たらず」は陰が奇数位、陽が偶数位にいることを言うので、朱子はここを「わけがわからない」と突き放しているが、程伊川は意味が違うと解した。慎んで自ら処すれば陽も凌ぐことはできず、終に吉を得る。不当な地位で危険ではあるが、大きな失敗には至らない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>待ち続けた末に落ち着く所を得るが、招かれざる客がやって来る。敵視せず敬意をもって迎えれば、最後は吉。</div></div></details><div class=\"pager\"><a href=\"#gua-4\">← 山水蒙</a><a href=\"#gua-6\">天水訟 →</a></div>", "gua-6": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 6 卦　第十六講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天水訟</div><div class=\"yo\">てんすいしょう</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-6\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-6\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-6\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-6\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-6\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-6\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-6\" data-jump=\"yao\">六爻</a></div><h3 id=\"g6-s0\">卦の名と象</h3>\n<p>需をひっくり返した形。訟は訴訟の訟で、双方が訴え出て争うことである。</p>\n<p>程伝（序卦伝を引く）：「飲食には必ず訟有り。故に之を受くるに訟を以てす」。人が必要とするのは飲食であり、必須のものがあるところに争いが起こる。だから訟が需に続く。</p>\n<ul class=\"sen\"><li>二象で言えば、天の陽気は上へ行き、水の性質は下へ就く。行く方向が正反対で、訟となる。</li><li>二体で言えば、上は剛、下は険。剛と険が接して、どうして争わずにいられよう。また一人の人間として見れば、内心が陰険で外面が剛強である。訴えるゆえんである。本田は、上が君主、下が臣下なら、織田信長と明智光秀のようなものだと言う。</li></ul>\n<h3 id=\"g6-s1\">卦辞</h3>\n<div class=\"orig\">訟、有孚窒。惕中吉。終凶。利見大人。不利涉大川。</div>\n<div class=\"yomi\">訟は、孚（まこと）有れども窒（ふさ）がる。惕（おそ）る。中すれば吉。終うれば凶。大人を見るに利あり。大川を渉るに利あらず。</div>\n<p>訴訟には内に誠がなければならない。しかし訴訟はとかくすんなりとは行かないので、心に恐れねばならない。中庸を得れば吉で、あくまで争ってやまなければ凶。訴訟をよく聞いてくれる偉大な人に会えれば利益があるが、冒険をしてはならない。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>訟の道には必ず孚実がなければならない。中に実がなければ誣告であり、凶の道である。下卦の坎は真ん中が陽で充実しており、これが「孚有り」の象である。</li><li>訟とは、人と争って判決を人に待つことである。孚があっても、ふさがって通らないのがふつうで、ふさがりがなければ自分の言い分は明らかで訴訟にはならない。事が明らかでなく吉凶も定まらないから、恐れが伴う。「中すれば吉」とは中を得れば吉、「終うれば凶」とは事を最後まで突き詰めれば凶ということ。</li><li>訟は曲直を明らかにすることを求めるものなので、大人に会えれば利がある。大人なら剛明中正で訴えを決してくれる。訟は平和な事ではないから、安全な所を選んでいるべきで、危険に陥ってはならない。だから大川を渉るに利がない。</li></ul>\n<h3 id=\"g6-s2\">彖伝</h3>\n<div class=\"orig\">訟、上剛下險、險而健、訟。訟有孚窒惕中吉、剛來而得中也。終凶、訟不可成也。利見大人、尚中正也。不利涉大川、入于淵也。</div>\n<p>訟は、上剛にして下険なり。険にして健なるは訟なり。訟は孚有れども窒がる、惕る、中すれば吉とは、剛来りて中を得るなり。終うれば凶とは、訟は成す可からざるなり。大人を見るに利ありとは、中正を尚べばなり。大川を渉るに利あらずとは、淵に入ればなり。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>上が剛で下が険、険であってしかも健。上下で言えば陰険な臣と剛強な君が接し、一人で言えば内が険で外が健。どちらも訟を起こすもとである。健でも険でなければ訟は生じず、険でも健でなければ訴えることができない。険でしかも健だから訴えるのである。</li><li>九二は剛で外から来て訟をなす、訟の主である。剛で中にいて中が実だから「孚有り」。訟の時には孚があっても必ず行き悩み、ふさがり、恐れが伴う。坎（険）の中にいるので、なおさらである。剛で外から来て中を得て、訴えても過たないので吉である。</li><li>卦によっては、どの爻が変わってこの形になったかという由来によって意味を立てるものがあり、訟がそれである。ただし、卦辞では九二は善だが、爻辞では九二に善いところがない。卦辞は九二が孚を持ち中を得ていることを取り、爻辞は下から上を訴えることを取っている。意味の取り方が違うのである。</li><li>訟は善事ではなく、やむをえずするものである。事を最後まで突き詰めてはならない。「成す」とは窮め尽くすことである。</li><li>訟とは是非を明らかにすることを求めるもので、是非を正しく判ずるのは中正の人である。聴く者がその人でなければ中正を得られない。中正の大人とは九五である。</li><li>人と訴える者は、必ず自分を安全で平らな所に置くべきである。危険を踏めば自分が陥る。それが深い淵に入ることである。卦に中正の象（九五）と険陥の象（坎）がある。</li></ul>\n<h3 id=\"g6-s3\">大象</h3>\n<div class=\"orig\">天與水違行、訟。君子以作事謀始。</div>\n<div class=\"yomi\">天と水と違い行くは訟なり。君子以て事を作すに始めを謀る。</div>\n<p>天は上り、水は下って、互いにそっぽを向く。これが訟である。君子はこれにならって、事をなす初めをよくよく考える。</p>\n<p><span class=\"tag\">程伝</span>天は上り水は下り、上下が背きあう。訟の起こる由である。上下が順っていれば訟は起こらない。君子はこの象を見て、人情には争訟の道があることを知る。だから何事も初めをよく考え、訟の端緒を事の初めに断ち切れば、訟は起こりようがない。「始めを謀る」の意味は広く、人との交わりを慎むこと、割符・証文をはっきりさせることなどがそれである。</p>\n<h3 id=\"g6-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>元吉と大吉。</b> 九五の「元吉」について程伝は、元吉とは大吉であって善を尽くすこと、吉が大きくても善を尽くさないものもある、と区別する。本田は小過の卦を例に、卦全体は大吉とされながら個々の爻の判断はあまり良くなく、条件がついていてすべて良しというわけではないので、大吉は元吉と違う、と説明している。</li><li><b>同位の陰陽。</b> 訟の卦では、上下で同じ位置の爻が陰と陽で引き合えば味方（初六と九四）、ともに陽で反発すれば敵どうし（九二と九五）となる。</li><li><b>災と眚。</b> 九二の象伝の「眚」は過ち・咎で、居場所が間違っている、つまり強大な領地にいると争いになるという意味。結果として向こうからやって来る災難をいい、悪いと知りつつやるのとは違う。</li></ul>\n<h3 id=\"g6-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>争いは最後まで突き詰めてはならない。途中でやめれば吉、とことんやれば凶。</li><li>公平な第三者に判断を仰げ。危険な冒険はするな。</li><li>争いを防ぐには、事の初めに契約・証文をはっきりさせ、交際を慎重にせよ。</li><li>争って得たものは長くは保てない（上九）。</li></ul><h2 class=\"sec\" id=\"g6-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">不永所事。小有言。終吉。</span></summary><div class=\"body\"><div class=\"yomi\">事とする所を永くせず。小しく言有れども、終に吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不永所事、訟不可長也。雖小有言、其辯明也。」（事とする所を永くせずとは、訟は長くす可からざるなり。小しく言有りと雖も、其の弁明らかなり。）</div>\n<p>訴訟事件を長く引き伸ばさない。多少物言いはつくが、最後は吉である。</p>\n<p><span class=\"tag\">程伝</span>六は柔弱で下にいて、訴えを最後までやり遂げられる者ではない。だから訟の初めに初六の爻の徳にことよせて戒める。もし事を長引かせなければ、少し言われても終には吉を得る。訟は長引かせるべきものではない。陰柔の才で下から上を訴えるのは吉を得にくいが、上に九四の応援があり（初と四は陰陽で引き合う）、事を長引かせないので、少し言われても終には吉を得る。「言有り」は災いの小さなものである。事を長引かせずに凶に至らないのが、訟における吉である。訴訟を意味する卦はもともとめでたくないが、その中で初六は吉を得られる。</p>\n<p><span class=\"tag\">象伝について程伝</span>六は柔弱で下から訴えるので、義として長引かせてはならない。長引かせれば勝てずに災いが及ぶ。少し物言いがつくのは、すでに訴えた以上必ず小さな災いがあるからだが、上に陽剛の正応がいて、自分の弁明が明らかに立つので、終に吉を得る。そうでなければ免れられない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>争いごとは早く切り上げよ。多少言われても、言い分は通り、最後は吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">不克訟。歸而逋。其邑人三百戸。无眚。</span></summary><div class=\"body\"><div class=\"yomi\">訟に克たず。帰りて逋（のが）る。其の邑人三百戸。眚（わざわい）无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不克訟、歸逋竄也。自下訟上、患至掇也。」（訟に克たず、帰りて逋れ竄（かく）るるなり。下より上を訟う、患いの至ること掇（ひろ）うがごときなり。）</div>\n<p>訴訟に負けて自分の領地に逃げ帰る。その領地はわずか三百戸。そのように逃げ帰れば災いはない。</p>\n<p><span class=\"tag\">程伝</span>二と五は応ずべき位置だが、ともに剛で、味方にならず訴えあう者である。九二は外から来て剛で険にいる、訟の主で、五と敵対する。五は中正で君位におり、義として敵う相手ではない（「敵」には匹敵の意味がある）。訴えても義として勝てない。もし勝てないと知って、帰って逃れ避け、寡約に身を処すれば、過眚はない。必ず逃れるのは、対等に戦う場所を避けるためである。三百戸は邑の至って小さなもので、もし強大な所にいれば、なお競うことになり、災いを免れない。</p>\n<p><span class=\"tag\">象伝について程伝</span>義として敵わないので訴えられず、帰って逃れ隠れ、その場所を避ける。下から上を訴えるのは義に背き、勢いも屈する。禍患の至ることは、物を拾い上げるようにたやすい。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>目上や強い相手との争いには勝てない。早く手を引き、小さく引きこもれば災いはない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">食舊德。貞厲、終吉。或從王事、无成。</span></summary><div class=\"body\"><div class=\"yomi\">旧徳に食む。貞しくして厲（あや）うけれど、終に吉。或は王事に従うも、成すこと无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「食舊德、從上吉也。」（旧徳に食むは、上に従えば吉なり。）</div>\n<p>先祖代々の禄で食べている。これが正しい。その地位は危ういが、最後には吉。時によって王の仕事に従うことがあるが、自分の成功はない。</p>\n<p><span class=\"tag\">程伝</span>三は剛の位にいて上九と応じるが、性質はもともと陰柔で、険の中にいて二つの剛（二と四）の間にはさまっている。危ぶみ恐れるべきで、訴えを起こす者ではない。禄は徳に応じて受けるもので、「旧徳に食む」とはもともとの分に安んじることである。貞とは堅く自らを守ること。危地にいても危懼を知れば、終には必ず吉を得る。本分を守って求めなければ、訴えることもない。危うい所にいるというのは、険の中にいて、上も下も剛で、ともに訟の時にいるからである。</p>\n<p>陰は陽に従うもの、下は上に従うものである。三は自ら訴えず、上九のすることに従う。だから「或は王事に従う」という。「成すこと无し」とは、上に従って成ったのであって、手柄は自分にないということ。訟は剛健な者のすることなので、初六は長引かせず、六三は上に従う。どちらも訴えられる者ではない。二つとも陰柔で訴えを突き詰めないので吉を得た。九四もまた勝てずに心を入れ換えて吉を得る。訟では、よく身を正すことを善とする。</p>\n<p><span class=\"tag\">象伝について程伝</span>本分を守り、上に従っても自分から出たことではない。だから成功はないが、その吉を得る。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>本分に安んじ、上に従え。危うい立場でも、欲をかかず身を守れば最後は吉。手柄は自分のものにならない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">不克訟。復即命、渝安貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">訟に克たず。復りて命に即き、渝（かわ）りて安貞なれば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「復即命、渝安貞、不失也。」（復りて命に即き、渝りて安貞なるは、失せざるなり。）</div>\n<p>訴訟に勝てない。本心に立ち返って正しい道理につき、態度を変えて落ち着いて正しくすれば吉。</p>\n<p><span class=\"tag\">程伝</span>四は陽剛で健体（乾）にいて中正を得ず、もともと訟をする者である。上は五、下は三、応は初。五は君で、義として勝てない。三は下で柔で争わない。初は正応で順従で、ともに訴える者ではない。四は剛健で訴えたいが、対敵する相手がいないので、訟を起こすいわれがない。だから「訟に克たず」。また四は陰の位にいて柔（初六）に応じ、止まる意味もある。勝てないと知って、剛く怒って訴えたがる心に打ち勝ち、本心に立ち返って命（正しい道理）につき、心を改め気を平らにして、安らかで正しくなれば吉である。正理を失うのを「方命」という。方は逆らうこと。『書経』堯典に「命に方いて族を圮（やぶ）る」、『孟子』梁恵王篇に「命に方いて民を虐ぐ」とある。剛健で中正でなければ騒がしく動き、安らかにいられず、正しくもない。安貞でないのは訟を好むもとである。義として勝てずに訴えず、正理に返って不安を安貞に変えれば吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>このようであれば過失がない。だから吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>争っても勝てない。怒りを収め、正しい道理に立ち返って態度を改めれば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">訟元吉。</span></summary><div class=\"body\"><div class=\"yomi\">訟え元吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「訟元吉、以中正也。」（訟え元吉なるは、中正を以てなり。）</div>\n<p>九五によって裁きがなされれば、その訴訟は筋が通り、大吉である。</p>\n<p><span class=\"tag\">程伝</span>中正で尊位にいる、訟を治める者である。訟を治めて中正を得るので元吉である。元吉とは大吉であって善を尽くすこと。吉が大きくても善を尽くさないものもある。</p>\n<p><span class=\"tag\">象伝について程伝</span>中正の道は、どこに施しても元吉でないことはない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>公平な裁き手が現れ、筋の通った決着がつく。大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">或錫之鞶帶、終朝三褫之。</span></summary><div class=\"body\"><div class=\"yomi\">或は之に鞶帯（はんたい）を錫（たま）う。終朝に三たび之を褫（うば）う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「以訟受服、亦不足敬也。」（訟を以て服を受く、亦た敬するに足らざるなり。）</div>\n<p>時には訴訟に勝って革の帯を賜ることがあるかもしれない。しかし朝の政務が終わるまでに三回取り上げられるだろう。易では一般に一番上の爻の判断はあまり良くない。</p>\n<p><span class=\"tag\">程伝</span>陽で上にいて、剛健の極みであり、訟の終わりにいて訟を極める者である。剛強をほしいままにして訴えを窮めれば、禍を取って身を滅ぼすのは当然である。仮にうまく訴えて勝ち、窮めてやまず、褒賞の服を受けたとしても、それは人と争って得たものであり、どうしていつまでも安らかに保てよう。だから朝が終わるまでに三たび奪われる。</p>\n<p><span class=\"tag\">象伝について程伝</span>訟を窮め尽くして、仮に褒美の服を受ける寵を得ても、尊敬に値せず、卑しみ憎むべきである。まして禍がその後について来るにおいてはなおさらである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>争って得たものはすぐ失う。勝っても尊敬されない。</div></div></details><div class=\"pager\"><a href=\"#gua-5\">← 水天需</a><a href=\"#gua-7\">地水師 →</a></div>", "gua-7": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 7 卦　第十七講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地水師</div><div class=\"yo\">ちすいし</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-7\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-7\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-7\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-7\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-7\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-7\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-7\" data-jump=\"yao\">六爻</a></div><h3 id=\"g7-s0\">卦の名と象</h3>\n<p>師は師団の師、軍隊である。</p>\n<p>程伝（序卦伝を引く）：「訟には必ず衆の起こる有り。故に之を受くるに師を以てす」。軍隊が起こるのは争いがあるからで、だから師が訟に続く。</p>\n<ul class=\"sen\"><li>二体で言えば、地の中に水がある。大地の下の水は外に出ない。地下水が集まるように軍勢が集まっているシンボルである。程伊川ははっきりとは言わないが、後の朱子の注は、昔は農民の中に軍隊があったので、上の大地が農民、下が兵士を示すのだという。</li><li>二卦の義で言えば、内（下卦）は険、外（上卦）は順。危険な道を従順の徳で進む、それが軍隊の正義である。</li><li>爻で言えば、一本の陽が衆陰の主となっている。一陽が衆を統べる象である。師を上下ひっくり返した比も一陽五陰だが、比は一陽が五の君位にいて君の象、師は一陽が下（二）にいて将帥の象である。師は戦、比は親しむと、意味は正反対になる。</li></ul>\n<h3 id=\"g7-s1\">卦辞</h3>\n<div class=\"orig\">師、貞。丈人吉、无咎。</div>\n<div class=\"yomi\">師は、貞しくあれ。丈人なれば吉にして咎无し。</div>\n<p>軍隊は正しくなければならない。指揮官がしっかりした人物であれば、結果は吉で咎はない。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>軍隊の道は正を根本とする。軍を起こし衆を動かすのは天下に害を与えることで、正義によらなければ民は従わず、無理やり駆り立てるだけになる。だから師は貞を主とする。</li><li>動きが正しくても、率いる者が丈人であってこそ吉で咎がない。吉でも咎のあるもの（困の卦の「悔い有り、征けば吉」など）、咎はなくても不吉なものがあり、吉で咎もないのが善を尽くしたものである。</li><li>丈人とは尊厳ある人の称である。軍を率いて衆を統べるには、衆が尊び信じ畏れ服する人でなければ人心はついて来ない。戦国時代の司馬穣苴は卑しい身分から将軍に抜擢されたが、部下の心がまだ服していないとして、君主のお気に入りの荘賈を監軍にもらった。荘賈は穣苴を侮り、翌朝軍門で会う約束に夕方まで来なかったので、穣苴は荘賈を斬った。</li><li>丈人とは必ずしももとから高い身分の人ではない。才謀徳業が衆に畏れ服されれば丈人である。荘賈を斬ってから兵士がみな穣苴を畏れ服したのは丈人であり、淮陰侯韓信（股くぐりで有名で、若い時は洗濯ばあさんに飯をもらっていた）が卑しい身分から漢の高祖の大将になったのも、その謀と行いが人を畏れさせたからである。</li></ul>\n<h3 id=\"g7-s2\">彖伝</h3>\n<div class=\"orig\">師、衆也。貞、正也。能以衆正、可以王矣。剛中而應、行險而順。以此毒天下、而民從之。吉又何咎矣。</div>\n<div class=\"yomi\">師は衆なり。貞は正なり。能く衆を以て正しければ、以て王たる可し。剛中にして応じ、険を行きて順なり。此を以て天下を毒して、民之に従う。吉にして又何の咎あらん。</div>\n<p>「師」は大衆・人数の意味（古代中国の一個師団は二千五百人）。大衆を率いて正しい方向に向かわせれば、天下の王にもなれる。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>衆人をみな正しくさせることができれば王たることができる。衆の心が服従して正に帰する、王道はこれに尽きる。</li><li>「剛中にして応ず」は九二を言う。剛で中にいて、六五の君と正しく応じ、信任が専らである。「険を行きて順」とは、危険な道を行いながら順をもって動くこと。いわゆる義兵、王者の軍である。</li><li>師旅（旅は旅団、五百人）が起これば財を傷つけ人を害し、天下を害することは避けられない。それでも民心が従うのは、義をもって動くからである。昔、殷の湯王が東を征すれば西の民が「なぜこちらを後にするのか」と怨んだ（『孟子』）。民心が従うのはこのようである。</li><li>「吉」とは必ず勝つこと（卦によっては退くのが吉のこともあるが、ここは戦の卦なので負けるのは良くない）、「咎无し」とは義に合うことである。</li></ul>\n<h3 id=\"g7-s3\">大象</h3>\n<div class=\"orig\">地中有水、師。君子以容民畜衆。</div>\n<div class=\"yomi\">地中に水有るは師なり。君子以て民を容れ衆を畜う。</div>\n<p><span class=\"tag\">程伝</span>地中に水があり、水が地中に集まる。衆が集まる象で、だから師という。君子は地中に水があるこの象を見て、民を受け容れて保護し、兵となる衆を養う。</p>\n<h3 id=\"g7-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>将軍の専断。</b> 九二の程伝は、臣下は本来事を独断できないが、軍隊が宮殿の敷居（閫）を一歩出れば将軍が専制してよい、と説く。ただしその力は自分一人のものではなく、軍隊全体の力によるもので、君主から与えられた権能であり、職分として当然なすべきことである。</li><li><b>周公と王安石への批判。</b> 程伝は、魯で周公を天子の礼楽で祭ったことについて、「周公は他の臣にできない功を立てたから、臣が用いてはならない礼楽を用いてよい」と論ずる世の儒者（名は挙げないが王安石。大胆な経済政策を打ち出した宰相で、政策そのものは良かったが下の小役人が理想通りに動かず失敗した。程伊川とは対立する立場にあった。『二程遺書』巻十九に見える）を批判する。周公の位にいれば周公の事をなすことができ、その位によってできることはみな当然なすべきことで、周公は職分を尽くしただけである。子の道も同じで、孟子が「親に事（つか）うること曾子の若き者は可なり」（離婁篇）と言ったのは、親孝行で有名な曾子の仕え方を並外れたものと考えず、子としてできることは誰でもなすべきことと考えたからである。</li><li><b>指揮系統は一つに。</b> 六三の「輿尸」を、程伊川は「つかさどるもの輿（おお）し」と読み、指揮する者が多いと解する。これは伊川独自の解釈で、他の注では「尸を輿（こし）にす」、死骸を馬車に載せて帰ると読む。本田は「その方が良いと思われるが、伊川は、軍隊において命令系統が二つになれば必ず負けるということを、よほど言いたかったらしい」と評している。</li><li><b>六四「左次」。</b> 程伝は「左」を左遷の左のような意味（退く）に取るが、少し無理がある。受講者に、本田自身の訳本では別の解釈をしていると問われ、軍隊は敵を左に見るように布陣する、そのほうが弓を射やすいからだ、と答えている。なお、本書の序文で読易会代表の中原伸之は、人生の分岐点でこの「師左次。咎无し」によって慎重な決断を下したと記している。</li></ul>\n<h3 id=\"g7-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>事を起こすなら大義名分を正しくし、しっかりした指揮者に任せよ。</li><li>指揮系統を一本にせよ。口出しする者が多ければ失敗する。</li><li>勝てないと見たら一旦退くのは失敗ではない。</li><li>功績があっても、人柄の小人を要職につけてはならない。褒美は金品で与えよ。</li></ul><h2 class=\"sec\" id=\"g7-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">師出以律。否臧凶。</span></summary><div class=\"body\"><div class=\"yomi\">師出づるに律を以てす。否（しか）らざれば臧（よ）くとも凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「師出以律、失律凶也。」（師出づるに律を以てすとは、律を失えば凶なり。）</div>\n<p>軍隊が出動するには、きちんとした軍律・号令に従わなければならない。そうでなければ、結果的に勝てても凶である。</p>\n<p><span class=\"tag\">程伝</span>初は師の始まりで、軍を出す義と軍を動かす道を言う。国が軍を起こすことで言えば、義理に合うのが律法による（法にのっとる）ことで、乱を禁じ暴を誅するために動くのである。義によらずに動けば、善くても凶の道である。「臧」とは勝つこと、「凶」とは民に災いをもたらし義を害することである。軍を動かすことで言えば、律とは号令節制で、軍を動かす道は号令節制を根本とし、これで衆を統制する。律によらなければ、たとえ勝っても凶の道である。軍を制するのに法がなくて、幸いに負けず、時には勝つ者もいるが、それこそ聖人が戒めるところである。</p>\n<p><span class=\"tag\">象伝について程伝</span>軍を出すには律によるべきで、律を失えば凶である。幸いに勝っても凶の道である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>事を始めるには規律と大義名分を正せ。規律なしにうまくいっても、結局は凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">在師中、吉无咎。王三錫命。</span></summary><div class=\"body\"><div class=\"yomi\">師に在りて中す。吉にして咎无し。王三たび命を錫（たま）う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「在師中吉、承天寵也。王三錫命、懷萬邦也。」（師に在りて中す吉とは、天の寵を承くるなり。王三たび命を錫うとは、万邦を懐くるなり。）</div>\n<p>軍にあって中庸を得ている。吉で咎はない。王から三度、爵位を賜る（錫は賜と同じ）。</p>\n<p><span class=\"tag\">程伝</span>師の卦で陽は九二だけで、衆陰の帰する所となる。五は君位でその正応である。二は師の主で、もっぱら事を制する者である。下にいて事を専制するのは、ただ師においてのみ許される。昔から将軍を任ずる時、閫外（宮殿の敷居の外）の事は将軍の専制に任せた。師にあって専制して中道を得るから、吉で咎はない。専権を恃めば臣下の道を失い、専断の力がなければ成功しない。だから中を得るのが吉である。</p>\n<p>軍の道は威と和が並び至れば吉で、その善を尽くせば成功して天下を安んじる。だから王の寵命を三度受ける。三は最高を意味する。六五は上にいて信任を専らにし、さらに寵遇を厚くする。礼遇が功績に釣り合わなければ将の威が重くならず、下が信じないからである。他の卦にも九二が六五に任じられる例（未済など）はあるが、師だけは九二がもっぱら事を主り衆陰が帰するので、その意味が最も大きい。</p>\n<p><span class=\"tag\">象伝について程伝</span>「師に在りて中す、吉」とは天（王）の寵任を受けるからである。臣下は君の寵任がなければ、専征の権を得て成功することはできない。王が三度恩命を賜ってその成功をほめたたえることで、万邦を懐ける結果になる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大事を任され、中庸を得て吉。上から信任され、重ねて褒賞を受ける。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">師或輿尸、凶。</span></summary><div class=\"body\"><div class=\"yomi\">師或は尸（つかさど）るもの輿（おお）し。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「師或輿尸、大无功也。」（師或は尸るもの輿しとは、大いに功无きなり。）</div>\n<p>軍隊で命令を出す者が多い。結果は凶（船頭多くして船山に上る）。</p>\n<p><span class=\"tag\">程伝</span>三は下卦の上にいて、位にいて任に当たる者である。才が陰柔で中正でないだけでなく、師旅の事は任を一人に専らにすべきなのに、二がすでに剛中の才で上に信任されているところへ、さらに他の者に主らせれば凶の道である。「輿尸」とは主る者が多いことで、三を指す。三が下卦の一番上にいるので、この戒めを発した。軍の事は任が一つでなければ必ず敗れる。</p>\n<p><span class=\"tag\">象伝について程伝</span>任せる相手が二人三人となれば、成功するはずがない。功がないばかりか、凶を招く。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>口出しする者が多く、指揮系統が乱れて失敗する。責任者を一人に定めよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">師左次、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">師左次（さじ）す。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「左次无咎、未失常也。」（左次して咎无しとは、未だ常を失わざるなり。）</div>\n<p>軍隊が退いて宿営する。結果は咎がない。</p>\n<p><span class=\"tag\">程伝</span>軍が進むのは強勇による。四は柔で陰の位にいて、進んで勝てる者ではない。進めないと知って退くので「左次」という。左次とは退いて宿ることである。宜しきを量って進退するのは当然のことで、だから咎はない。可を見て進み、難を知って退くのは軍の常である。ここではその退き方が宜しきを得ている点を取り上げ、才能の有無は論じていない。勝てないと量って軍を損なわずに退くのは、突進して全滅するよりはるかにましである。進むべき時に退くなら咎がある。易がこの義を明らかにして後世に示したのは、兵となる民を思いやる仁の深さである。</p>\n<p><span class=\"tag\">象伝について程伝</span>軍を動かす道は、時に応じて宜しきを施すのが常である。退いて宿るのは必ずしも失敗ではない。四の退き方は宜しきを得ている。だから咎がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勝ち目がなければ一旦退け。それは失敗ではなく、時宜を得た判断で、咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">田有禽、利執言、无咎。長子帥師、弟子輿尸、貞凶。</span></summary><div class=\"body\"><div class=\"yomi\">田に禽（きん）有り。言を執るに利あり。咎无し。長子、師を帥いる。弟子、尸るもの輿ければ、貞しけれども凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「長子帥師、以中行也。弟子輿尸、使不當也。」（長子師を帥いるは、中行を以てなり。弟子尸るもの輿しとは、使うこと当たらざるなり。）</div>\n<p>田を荒らす鳥獣（禽は鳥と獣の両方を含み、侵略者のたとえ）がいる。その罪を鳴らして捕らえるのがよく、咎はない。長男が軍を率いるのが正しい。弟たちが大勢口を出せば、意図は正しくても結果は凶。</p>\n<p><span class=\"tag\">程伝</span>五は君位で、軍を起こす主である。だから軍を起こし将を任ずる道を言う。軍が起こるのは、必ず蛮夷が中華を乱し、寇賊奸宄が民を害するのを（『書経』舜典）、徳で懐けられない時で、その後に辞を奉じてこれを誅する。鳥獣が田に入って稲を害すれば、義として狩り取ってよい。このように動けば咎はない。軽々しく動いて天下を毒すれば咎は大きい。「言を執る」とは辞を奉じ、罪を明らかにして討つことである。秦の始皇帝や漢の武帝は、山林を隅々まで掘り起こして獲物を探すような者で、田に禽があるのとは違う。</p>\n<p>将を任じ軍を授ける道は、長子に率いさせるべきである。二は下にいて師の主で、これが長子である。もし弟子（長子以外の者）に主らせれば、行いが正しくても凶である。昔から将の任が専らでなくて敗れた例は多い。春秋時代、晋の荀林父が邲（ひつ）の戦いで楚に敗れたのは指揮系統が明確でなかったからであり（『左伝』）、唐の郭子儀（安禄山の乱で功があった）が相州で安禄山の子を攻めた時、皇帝が宦官の魚朝恩を目付につけたため指揮系統が二つになって敗れた。</p>\n<p><span class=\"tag\">象伝について程伝</span>長子とは二で、中正の徳で上と心を合わせ、任を受けて行く。もし他の者にも主らせれば、任せ方が当を得ず、凶は当然である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>侵してくる者には、大義を明らかにして対処してよい。ただし任せる相手は一人のしっかりした者に。大勢に口出しさせれば凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">大君有命、開國承家。小人勿用。</span></summary><div class=\"body\"><div class=\"yomi\">大君命有り。国を開き家を承（う）けしむ。小人は用うる勿れ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大君有命、以正功也。小人勿用、必亂邦也。」（大君命有りとは、以て功を正すなり。小人用うる勿れとは、必ず邦を乱せばなり。）</div>\n<p>偉大な君が爵命を賜る。新たに国を開かせ、家を世襲させる。小人は用いてはならない。</p>\n<p><span class=\"tag\">程伝</span>上は師の終わり、功の成った時である。大君が爵命で功ある者をほめる。「国を開く」とは諸侯に封ずること、「家を承く」とは卿大夫にすること（承は受）。小人は功があっても用いてはならないと戒める。軍が起こる時、成功の道は一つでなく、従った者も必ずしも君子ばかりではない。小人には金帛や禄位で賞すればよく、国家を持たせて政治をさせてはならない。小人はふだんでも驕りやすく、まして功を挟めばなおさらである。漢の英布・彭越が滅びたのはこのためである（ともに秦の苦役に耐えかねて反乱を起こした者で、漢の高祖に仕えて諸侯となったが、高祖の死後、皇后が功臣を次々に取り潰しにかかったので、不安を感じて反乱を起こし殺された）。聖人の深い慮りと遠い戒めである。</p>\n<p>この爻辞はもっぱら師の終わりの義を言い、爻の位置関係は取っていない。大きなことを言ったのである。爻で言えば、上六は柔で順（坤）の極にいて、師がすでに終わって位のない地にいる。善処して咎のない者である。</p>\n<p><span class=\"tag\">象伝について程伝</span>大君が恩賞の柄を握って軍功を正す。師の終わりである。功をほめても、小人なら功があるからといって任用してはならない。用いれば必ず邦を乱す。小人が功を恃んで邦を乱した例は昔からある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>事が成って論功行賞の時。功ある者は報われるが、人柄の小人に権限を与えてはならない。</div></div></details><div class=\"pager\"><a href=\"#gua-6\">← 天水訟</a><a href=\"#gua-8\">水地比 →</a></div>", "gua-8": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 8 卦　第十八講〜第十九講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水地比</div><div class=\"yo\">すいちひ</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-8\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-8\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-8\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-8\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-8\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-8\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-8\" data-jump=\"yao\">六爻</a></div><h3 id=\"g8-s0\">卦の名と象</h3>\n<p>比は、親しむ、親しみ助けるという意味である。本田は「ここの程伊川の注は大変親切で、ちょっとくどいくらいです」と言う。</p>\n<p>程伝（序卦伝を引く）：「衆には必ず比する所有り。故に之を受くるに比を以てす」。比は親しみ輔けることである。人類は必ず親しみ助けあって初めて安らかでいられる。だから衆があれば必ず親しむ所がある。比が師に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は、上が坎（水）、下が坤（地）。物がぴったり親しみあって隙間がないのは、水が地上にあるのに及ぶものはない。だから比という。</li><li>衆爻はみな陰で、ただ五だけが陽剛で君位にいる。衆が親しみ寄り添う所で、上もまた下に親しむ。だから比である。易では下から五番目が一番いいとされ、一番上はかえって良くない。もろもろの家来（陰）が君主である五に親しむのである。</li></ul>\n<h3 id=\"g8-s1\">卦辞</h3>\n<div class=\"orig\">比、吉。原筮、元永貞、无咎。不寧方來。後夫凶。</div>\n<div class=\"yomi\">比は吉。原（たず）ね筮（うらな）え。元永貞なれば咎无し。寧（やす）からざるもの方（まさ）に来る。後るれば夫も凶。</div>\n<p>親しむことは吉の道である。親しむべき相手を尋ねて占うがよい。人の上に立つ徳があり、永久に正しければ咎はない。自分の地位に安んじられない人が、まさに親しむ相手を求めてやって来る。後れれば、一人前の立派な男でも凶。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>比は吉の道である。人が親しみあうのは自ずから吉の道となる。だから雑卦伝に「比は楽しみ、師は憂う」という。人が親しみあうには必ずその道があり、道によらなければ悔いや咎がある。だから必ず親しむべき相手を推し量り、占い決して、それに親しむ。</li><li>筮とは占い決し卜度（はかる）すること。必ずしも蓍（めどはぎ。昔、筮竹のように用いた草）や亀の甲（卜）を使えということではない。度はここでは「タク」と読む（付度の度）。</li><li>親しむ相手に元（君長の道）・永（いつまでも続くこと）・貞（正道を得ること）の三つがあれば咎はない。上が下に親しむ時も、下が上に従う時も、必ずこの三つを求めれば咎はない。元の字の一番もとの意味は頭である。</li><li>人が自らの安寧を保てない時は、まさにやって来て親しみを求める。親しむ相手を得れば安らかでいられる。安らかでない時には、あくせくと親しみを求めるべきである。もし独立して自らの力を恃み、親しみを求める志が速やかでなく後れれば、「夫」（独り立ちできる立派な男）でもなお凶。まして柔弱な者はなおさらである。</li><li>『左伝』昭公元年に「子南は夫なり」という言い方がある。ある美女が多くの男に求婚され、男たちに軍事教練をさせて見せて婿を選んだ時、その女が「子南こそ一人前の男だ」と言ったという話である。また哀公十一年、斉と魯が戦いになろうという時、戦いを避けたい魯の家老が、戦うべきだと主張する配下に「お前の出る幕ではない」と叱ると、叱られた者は「家老殿は私を一人前の男でないとおっしゃった」と怒って、一人で戦う支度をしたという話もある。</li><li>およそ天地の間に生きる者で、親しみあわずに独りで存在できるものはない。剛強の極みでも独立はできない。比の道は双方の志が求めあうことにある。双方が求めあわなければ離ればなれになる。君は下を懐け撫し、下は上に親しみ輔ける。親戚・朋友・郷党、みなそうである。上下が心を合わせて従いあうべきで、求めあう気持ちがなければ離れて凶になる。人情は求めあえば合い、張りあえば背く。張りあうとは相手の出方を待って、こちらから先に頭を下げないことである。人が親しむには道があるが、親しもうという志をゆるがせにしてはならない。</li></ul>\n<p>本田の講説：「後夫」を「こうふ」と熟語で読んで「遅れて来た男」と取るのが一般的だが、程伊川は独自の解釈をしている。</p>\n<h3 id=\"g8-s2\">彖伝</h3>\n<div class=\"orig\">比、吉也。比、輔也。下順從也。原筮元永貞无咎、以剛中也。不寧方來、上下應也。後夫凶、其道窮也。</div>\n<div class=\"yomi\">比は吉なり。比は輔なり。下、順従するなり。原ね筮え、元永貞なれば咎无しとは、剛中を以てなり。寧からざるもの方に来るとは、上下応ずるなり。後るれば夫も凶とは、其の道窮まるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「比は吉なり」は、比は吉の道であるということ。物が親しみあうのが吉道である。「比は輔なり」は比の字義を解く。比と輔は同じ子音で始まる字で、中国の訓詁は同じ音の字で解釈する傾向がある（「仁は人なり」「義は宜なり」のように）。「下、順従す」は卦が比である理由を解く。五は陽で尊位にいて、群下が順従して親しみ輔ける。</li><li>「剛中を以て」：親しむ道を推し量り占い決して、元永貞を得て初めて咎がない。元永貞であるのは五のような者である。陽剛で中正にいて、比の道の善を尽くす。陽剛で尊位に当たるのは君徳の元、中にいて正を得るのは永貞である。卦辞は本来広く比の道を言ったものだが、彖伝は九五に当てて解釈した。</li><li>「上下応ずる」：人は自ら安寧を保てず、やって来て親しみを求める。民は自らを保てないので君を戴いて安らかさを求め、君は独り立ちできないので民を保って安らかさを得る。安らかでない者が来て親しむのは、上下が応じあうからである。聖人の公から言えば、至誠で天下の比を求めて民を安んじる。後世の王の私から言えば、下民の付き従うのを求めなければ危亡に至る（いつ革命で倒されるかわからない）。だから上下の志は必ず応じあう。卦で言えば、上下の群陰は五に親しみ、五はその衆に親しむ。</li><li>「其の道窮まる」：衆は必ず親しみあって初めてその生を遂げられる。天地の間に、親しまずに遂げられる者はない。もし従おうという志が速やかでなく後れれば比を成せず、夫でも凶。親しむ所なく困窮して凶を招くのは、窮まる道である。</li></ul>\n<h3 id=\"g8-s3\">大象</h3>\n<div class=\"orig\">地上有水、比。先王以建萬國、親諸侯。</div>\n<div class=\"yomi\">地上に水有るは比なり。先王以て万国を建て、諸侯を親しむ。</div>\n<p>大地の上に水がある形を比と呼ぶ。昔の偉大な王者はこの卦にかたどって、万国を建て、諸侯を親しんだ。天子が中央にいて、まわりに諸侯の国を建てる封建制度のことである。</p>\n<p><span class=\"tag\">程伝</span>物が親しみあって隙間がないのは、水が地上にあるのに及ぶものはない。だから比である。先王は比の象を見て、万国を建て諸侯を親しんだ。万国を建てるのは民に親しむためであり、諸侯を親しみいつくしむのは天下に親しむためである。</p>\n<h3 id=\"g8-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>正中と中正。</b> 九五の象伝は「位正中なり」と言う。普通は「中正」と言うが、程伝はこれを区別する。「正中」は、まず正しい所にいて、しかも中を得ること（比・随）。「中正」は中と正の二つの徳を等しく得ること（訟・需）。</li><li><b>易の戒めは厳密。</b> 六二の程伝は「易の戒めたる、厳密なり」と言う。二は中正でも、質は柔、体は順なので「自ら失う」ことへの戒めがある。本田は「易の戒め方は極めて厳密で、易に問いかける人の深層心理にまで踏み込んで戒めをする」と評している。</li><li><b>初めが大事。</b> 初六と上六の対比。比の道は初めが大事で、初めに真心があれば終わりに思いがけない吉が来るが、初めがなければどうして吉になれよう。程伝は『詩経』大雅・蕩の「初め有らざるは靡（な）し、克く終わり有るは鮮（すくな）し」を下敷きにして、初めだけ良くて終わりを全うできないことはあるが、初めがないのに終わりが良いことは絶対にない、と言う。</li><li><b>易の吉凶の割合。</b> 受講者に「易全体で吉と凶はだいたい同数か」と問われ、本田は、吉のほうがやや多いと思う、はっきり「凶」と言い切る場合は割合少ない、と答えている。卦辞の判断では「亨」が良い判断、さらに良いのが「元亨」、一番良いのが「元亨利貞」で、これがつく卦はそう多くない。</li><li><b>略筮法の由来。</b> 受講者に略筮法はいつ頃からかと問われ、本田は、いつ始まったかよくわからない、『易経』本来のやり方は十八回の操作をするもので、乾・兌・離・震・巽・坎・艮・坤という順番も『易経』本来のものではなく宋の邵康節に始まるので、略筮法もそれより後と見てよいだろう、と答えた。説卦伝では乾・坤・震・巽・坎・離・艮・兌の順に数え、「乾は健なり、坤は順なり、震は動なり、巽は入なり、坎は陥なり、離は麗なり、艮は止なり、兌は説なり」とある。離の訓「麗」は美しいではなく「くっつく」で、「離」は「罹病」「罹災」の「罹」と同じ発音で、古くは「つく」の意味に使われた。</li></ul>\n<h3 id=\"g8-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>親しむべき相手をよく見極めよ。人の上に立つ徳・永続性・正しさのある相手を選べ。</li><li>親しむなら早く。様子見をして後れれば、立派な人でも凶。</li><li>初めに真心がなければ、最後まで良い関係は続かない。</li><li>来る者は拒まず、去る者は追わず。こちらから媚びて親しみを求めてはならない（九五）。</li><li>相手を見誤って人でなしに親しめば悲しむべき結果になる（六三）。</li></ul><h2 class=\"sec\" id=\"g8-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">有孚比之、无咎。有孚盈缶、終來有他吉。</span></summary><div class=\"body\"><div class=\"yomi\">孚（まこと）有りて之に比す。咎无し。孚有りて缶（ほとぎ）に盈（み）つ。終に来りて他の吉有らん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「比之初六、有他吉也。」（比の初六は、他の吉有るなり。）</div>\n<p>内に真心があって人に親しむ。咎はない。素焼きの大きな壺に満ちるほどの誠があれば、最後に人々がやって来て、望外の吉があるだろう。初は一番下の爻、上は一番上の爻で、初・二・三・四・五・上と数える。六は陰爻、九は陽爻をいう。</p>\n<p><span class=\"tag\">程伝</span>初六は比の始めである。親しみあう道は誠信を根本とする。心の中に信がないのに人に親しもうとしても、誰が相手にしてくれよう。だから比の始めには必ず誠があって、初めて咎がない。孚とは信が内にあることである。誠信が内に充実しているのは、物が缶（ほとぎ。素焼きの質素な器）の中に満ちているようなものである。缶の中が満ちて外を飾らなければ、終に人々が慕い寄ってきて思いがけない吉がある。「他」とは、ここにあるのではなく外から来ることである。誠実が内に満ちていれば、信じない者はない。外を飾って人に親しみを求める必要があろうか。誠信が中に満ちれば、他人でもみな感じて来り従う。孚信こそが比の根本である。</p>\n<p><span class=\"tag\">象伝について程伝</span>比の初六と言い直しているのは、比の道は初めにあるからである。初めに孚があれば終に他の吉を招く。初めが誠でなければ、終にどうして吉を得よう。上六の凶は初めがないことによる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>飾らない真心で人に接すれば、思いがけない所から吉が来る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">比之自内。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">之に比するに内よりす。貞にして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「比之自内、不自失也。」（之に比するに内よりすとは、自ら失わざるなり。）</div>\n<p>相手に親しむのに、自分の心から親しむ。正しくて吉。</p>\n<p><span class=\"tag\">程伝</span>二と五は正応で、どちらも中正を得ている。中正の道で親しみあう者である。二は内（下卦）にいる。「内よりす」とは自分によることである。才を択んで用いるのは上にあるが、身を国に許すのは必ず自分による。自分が君を得て、道が合って進むのは、内よりするということで、正を得て吉である。中正の道で上の求めに応じるのは、自らを失わないことである。あくせくとしてひたすら人に親しみを求めるのは、君子が自らを大切にする道ではなく、自らを失うものである。</p>\n<p><span class=\"tag\">象伝について程伝</span>自らの中正の道を守り、上の求めを待つ。自らを失わないのである。易の戒めは厳密である。二は中正だが、質は柔で体は順なので、「貞吉」と「自ら失う」の戒めがある。自ら守って上の求めを待てば、後の凶にかかわることはない。士が己を修めるのは上に求める道であり、志を降して身を辱めるのは自重の道ではない。だから伊尹（殷の湯王の宰相。もとは莘（しん）という所で田を耕していたが、湯王が三度訪ねて行って初めて出た）や武侯（諸葛孔明。劉備が三顧の礼で迎えて初めて出た）も、天下を救おうという志は切実だったが、必ず礼が至るのを待ってから出たのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の内なる決心で、正しい相手に親しめ。媚びて取り入るのではなく、求められるのを待てば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">比之匪人。</span></summary><div class=\"body\"><div class=\"yomi\">之に比する、人に匪（あら）ず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「比之匪人、不亦傷乎。」（之に比する、人に匪ず。亦た傷ましからずや。）</div>\n<p>親しもうとする相手が人でなしである。</p>\n<p><span class=\"tag\">程伝</span>三は中正でなく、親しむ相手もみな中正でない。四は陰柔で中でなく、二は応（五）があって初に親しむ。みな中正でなく人に匪ざる者である。人に匪ざる者に親しめば、その失敗は知れたことで、悔吝は言うまでもない。だから傷むべきである。二は中正なのに人に匪ずというのは、時に従って義を取り、それぞれ同じでないからである（二や四はそれ自体として見れば良い判断になるのだが、三から見た場合は良い相手とは言えない）。</p>\n<p><span class=\"tag\">象伝について程伝</span>人が親しみあうのは安吉を求めるためである。ところが人に匪ざる者に親しめば、必ずかえって悔吝を得る。これまた傷むべきことである。深く親しむ相手を見失うことを戒めている。</p>\n<p>本田は「この卦は長いので、今日はここまでと致します」と第十八講を結んでいる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>親しむ相手を誤っている。悲しむべき結果になる。相手を見直せ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">外比之。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">外に之に比す。貞にして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「外比於賢、以從上也。」（外に賢に比するは、以て上に従うなり。）</div>\n<p>本来は一番下の爻と対応する位置にいるが、外に向かって上の五と親しもうとする。その態度は正しくて吉である。</p>\n<p><span class=\"tag\">程伝</span>四と初は相応じない（どちらも陰で反発しあう）ので、五がこれに親しむ。外に五に親しむので、貞正を得て吉である。君臣が親しみあうのはもともと正しく、親しみあうことは双方ともに宜しきを得ることである。五は剛陽中正の賢者で、しかも尊位にいる。四にとっては目上である。賢者に親しみ上に従うのは比の正しさである。だから貞吉という。六が四にいるのも正を得ている。また陰柔不中の人が剛明中正の賢者に親しむのは正を得て吉である。さらに賢者に親しみ上に従うのに必ず正道によれば吉である。いくつかの説が互いに補いあって、その義が初めて備わる。本田は、程伊川の注はくどいようだが、なぜ貞吉なのかをいろいろ角度を変えて解釈していると言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>外に親しむとは、五に従うことである。五は剛明中正の賢者で、しかも君位にいる。四が親しむのは、賢者に親しみ上に従うことで、だから吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>身近な相手ではなく、上の賢い人に親しめ。正しくて吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">顯比。王用三驅、失前禽。邑人不誡。吉。</span></summary><div class=\"body\"><div class=\"yomi\">比を顕（あきら）かにす。王用て三駆し、前禽を失す。邑人誡めず。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「顯比之吉、位正中也。舍逆取順、失前禽也。邑人不誡、上使中也。」（比を顕かにするの吉なるは、位正中なればなり。逆を舎て順を取るは、前禽を失するなり。邑人誡めずとは、上の使うこと中なればなり。）</div>\n<p>親しみの道を明らかにせよ。王者は獲物を捕らえる網で四面を囲わず、一面を開けておき、逃げる獲物は追わない。そうした態度で民に接すれば、領民に前もって戒める必要もない。吉である。</p>\n<p><span class=\"tag\">程伝</span>五は君位にいて、中にいて正を得ている。比の道の善を尽くす者である。人君が天下を親しむ道は、その道を顕かにするだけである。誠意で人に対し、自分の心から推して人を思いやり、政治を行い仁を施して、天下にその恵みを被らせる。そうすれば天下の誰が上に親しまないことがあろう。もしその場当たりの小さな仁をひけらかし、道に違い誉れを求めて下の親しみを求めれば、その道は狭い。どうして天下の親しみを得られよう。</p>\n<p>聖人はこの九五で比の道を顕かにし、礼の「三駆」をたとえに取った。昔の王者は四季の狩りをやめるわけにいかないので（狩りは楽しみというより軍事教練であった）、その情け深い心を推して三駆の礼を作った。『礼記』王制篇の「天子は囲みを合わさず」がそれである。『史記』殷本紀によれば、殷の湯王がお忍びで原野に出ると、民が四面に網を張って「あらゆる獲物が我が網に入れ」と祈っていた。湯王は、それでは生き物が根絶やしになるとして三面を取り払い、「左せんと欲する者は左せよ。右せんと欲する者は右せよ。命を用いざる者のみ我が網に入れ」と祈った。一面では狩りにならないので、後の時代には三面を残した。天子の狩りは三面を囲んで前の一面を開け、獲物が去ろうと思えば去れるようにした。物を取り尽くすに忍びない、殺を憎み生を好む仁である。ただ命を聞かずに逆らって向かってくる獲物だけを取り、前へ逃げるものはすべて逃がす。これが「前禽を失す」である。王者は比の道を顕かにし、天下は自然にやって来て親しむ。来る者は撫し、ちっぽけな恵みをひけらかして親しむポーズを取ることはない。去る者は追わず、来る者は取る。これが王道の偉大な所で、王者の民は皞皞如（こうこうじょ）としてゆったり満足し（『孟子』尽心篇）、自分を治めている者が誰かも意識しない。</p>\n<p>「邑人誡めず、吉」とは、至って公平で私がなく、遠近親疎の区別がないことである。邑は自分の領地で、易に出て来る邑はみな同じ意味。王者の都も諸侯の国中も邑である。誡は期限を切って約束すること。人に公平に接し、自分の領民にもあらかじめ約束し戒める必要がない。聖人は大公無私で天下を治める。君主が天下を親しむ道だけではない。人の親しみあいはみなそうである。臣が君に対しては、忠誠を尽くし才能の限りを尽くすのが、君に親しむ道を顕かにすることで、用いるか否かは君にある。おもねり追従して君に親しみを求めてはならない。友に対しても、身を修め意を誠にして待ち、親しむか否かは相手にある。巧言令色、曲げて従いいい加減に調子を合わせて、人に親しみを求めてはならない。郷党・親戚・人々に対しても、みなそうである。これが三駆して前禽を失するの義である。</p>\n<p><span class=\"tag\">象伝について程伝</span>比を顕かにして吉なのは、居る位が正中を得て、正中の道によるからである。比は不偏を善とするので正中という。来る者を順、去る者を逆と言い、失うのは前へ去る獲物である。来る者は撫し、去る者は追わない。上が下を使うのが中平で、遠近が一つのようだから、身近な者にも約束し戒める必要がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者は公平無私に。来る者を慈しみ、去る者を追わず、媚びて人気を求めるな。そうすれば自然に人が集まって吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">比之无首。凶。</span></summary><div class=\"body\"><div class=\"yomi\">之に比するに首（はじめ）无し。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「比之无首、无所終也。」（之に比するに首无しとは、終る所无きなり。）</div>\n<p>親しもうとしても初めの取っかかりがない。凶。「首」は「かしら」と読んでもよい。</p>\n<p><span class=\"tag\">程伝</span>六は上にいて比の終わりである。首とは始めのことで、頭という意味の字が象徴的に初めを意味する。比の道は始めが善ければ終わりも善い。始めがあって終わりがないことはあるが、始めがないのに終わりがあることは未だかつてない。だから親しもうとして首がなければ、終わりに至って凶である。これは比の終わりに拠って言ったのだが、上六は陰柔で中でなく、険（坎）の極みにいて、もともとよく終える者ではない。初めに親しむのに道によらず、終わりにすき間風が吹く者は、天下に多い。</p>\n<p><span class=\"tag\">象伝について程伝</span>比にすでに首がなければ、どうして終わることができよう。首があってもなお終わりに違うことがある。始めるのに道によらなければ、どうして終わりを保てよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>最初に誠意ある関係を築かなかったので、最後まで続かない。凶。</div></div></details><div class=\"pager\"><a href=\"#gua-7\">← 地水師</a><a href=\"#gua-9\">風天小畜 →</a></div>", "gua-9": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 9 卦　第二十講〜第二十一講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風天小畜</div><div class=\"yo\">ふうてんしょうちく</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-9\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-9\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-9\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-9\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-9\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-9\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-9\" data-jump=\"yao\">六爻</a></div><h3 id=\"g9-s0\">卦の名と象</h3>\n<p>小畜は、小さな蓄積、小さな停止である。「畜」の字は正しくは「茲」と「田」からなる字で、茲は植物の芽生えを意味し、田と組み合わせて穀物を蓄えることを表し、そこから止まるという意味にも使われる。</p>\n<p>程伝（序卦伝を引く）：「比すれば必ず畜まる所有り。故に之を受くるに小畜を以てす」。物が親しみあえば集まりができる。集まるのが畜である。また親しみあえば志が集まる。小畜が比に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>畜は止である。止まれば集まる。</li><li>卦の形は上が巽、下が乾。乾は上にある物（龍）なのに巽の下にいる。剛健を止めるには巽順（へりくだり素直なこと）に及ぶものはない。乾が巽に止められるので畜という。</li><li>ただし巽は陰の卦（三画のうち陽二・陰一）で、その体は巽順である。巽順によって剛健を柔らげるだけで、力で止めるのではない。止め方の小さいものなので、小畜という。</li><li>六爻で言えば、四が一陰で位を得て、五陽に喜ばれる。陰が偶数位にいるのは柔巽の道を得ていることで、群陽の志を止めることができる。</li><li>小畜とは、小さなものが大きなものを止めることで、たった一つの陰が五つの陽を止めている。止める力が小さいのは、六四が陰で弱いからである。</li><li>彖伝はもっぱら六四が諸陽を止めることで卦の成り立ちの義とし、上下二体は言わない。最も重要な点だけを挙げたのである。</li></ul>\n<h3 id=\"g9-s1\">卦辞</h3>\n<div class=\"orig\">小畜、亨。密雲不雨、自我西郊。</div>\n<div class=\"yomi\">小畜は亨る。密雲して雨ふらず。我が西郊よりす。</div>\n<p>この卦が出れば願いは通る。私の西の郊外から黒雲がわき起こるが、雨にはならない。</p>\n<p><span class=\"tag\">程伝</span>雲は陰陽の気である。二気が交わって和すれば、互いに止めあってしっかりと雨になる。陽が先に唱えて陰が和するのが順で、だから和合できる。もし陰が陽に先んじて唱えれば順でなく、和合しない。和合しなければ雨にならない。雲がいかに濃く集まっても雨にならないのは、西の郊外から起こるからである。東北は陽の方、西南は陰の方で、陰から唱えたので和せず雨にならない。人が見れば雲気は四方の遠くから起こるので「郊」という。この辞は六四を拠点に言ったので「我」という。陽を止めるのは四で、四が畜の主である。</p>\n<h3 id=\"g9-s2\">彖伝</h3>\n<div class=\"orig\">小畜、柔得位、而上下應之、曰小畜。健而巽、剛中而志行、乃亨。密雲不雨、尚往也。自我西郊、施未行也。</div>\n<div class=\"yomi\">小畜は、柔、位を得て、上下之に応ずるを小畜と曰う。健にして巽、剛中にして志行わる。乃ち亨る。密雲して雨ふらずとは、尚お往くなり。我が西郊よりすとは、施し未だ行われざるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦の成り立ちを言う。陰で四にいて、しかも上卦にいる。柔が位を得たのである。上下の五陽がみなこれに応じ、止められる。一陰で五陽を止めるので、つなぎ止めても固くはできない。だから小畜という。</li><li>彖伝が卦の成り立ちを解いて「曰」の字を加えるのは、卦の名が二字（重名の卦）の場合で、文章の勢いとしてどうしてもこの字が欲しいのである。一字の卦の名では、革の彖伝だけ「曰」がある。これも解説が長いからで、全く文章技巧上の問題である。</li><li>「健にして巽、剛中にして志行わる」は卦の才で言う。内（下卦）が健で外（上卦）が巽で、健でありながら巽ることができる。二と五は中にいて剛中である。陽の性は上へ進み、下はまた乾体で、志は進むことにある。四が陽を止められるのは柔巽によるが、亨るのは剛中による。卦の成り立ちで言えば一陰が五陽を止め、卦の才で言えば二・五の陽が剛中である。だから止めることは小さいが、亨るのである。</li><li>「密雲して雨ふらず、尚お往くなり」：畜の道が大を成せないのは、密雲が雨にならないようなものである。陰陽が交わって和すれば互いに止めあって雨になるが、和合せず、陽がなお上へ進むので雨にならない。陰の方から先に唱えたので和せず、雨にならず、その功の施しはまだ行われない。小畜が大を成せないのは、西郊の雲が雨にならないようなものである。</li></ul>\n<h3 id=\"g9-s3\">大象</h3>\n<div class=\"orig\">風行天上、小畜。君子以懿文德。</div>\n<div class=\"yomi\">風、天上を行くは小畜なり。君子以て文徳を懿（よ）くす。</div>\n<p>風が天の上を吹きわたる形が小畜である。君子はこれにのっとって、自分の文芸的な才能を美しく磨きあげる。</p>\n<p><span class=\"tag\">程伝</span>乾の剛健が巽に止められる。剛健な性格は柔順だけがこれを止められる（たけだけしいものをたけだけしく止めれば争いになる）。しかし止めても固く制御し切れるわけではなく、柔順でつなぎ止め、飼い馴らす（擾）だけである。だから小畜という。君子はこの義を見て、その文徳を美しくする。畜は止め集めることで、身についた教養を意味する。君子が蓄えるものは、大は道徳と天下を経綸する事業、小は文章と才芸である。文徳は道義に比べれば小さい。</p>\n<h3 id=\"g9-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>「咎无し」の意味。</b> 初九の程伝によれば、「咎无し」とは「このようにすれば咎はない」ということで、繋辞伝に「咎无しとは、善く過ちを補うなり」とある。爻の義がもともと善くても、そうしなければ咎があるという意味と矛盾しない。初九は道によって行くので、咎がないことが甚だ明らかな場合である。</li><li><b>爻辞は未来への戒め。</b> 九二について「二も五も帰ってしまえば止めることがなくなり、小畜を離れてしまうのでは」と問う人に、程伊川は、爻辞はこうすればこうなるという未来への判断で、すでにそうなったことを言うなら何の戒めにもならない、と答える。また「五は巽の一部で乾を止める側なのに、なぜ二と引き合うのか」には、上下二体で言えば巽が乾を止めるが、卦全体で言えば一陰が五陽を止めるので、易では時に応じて義を取るのだ、と答えている。</li><li><b>大畜との対比。</b> 大畜は止めることの大きなもので、極まれば散じて（上九で止めるのをやめ）下の者を天に昇らせる。小畜は止めることの小さなもので、極まって完成する（上九で雨が降る）。</li><li><b>全体像。</b> 本田は、小畜は下剋上という危機的状況のなかで、六四という忠義の臣下が一人で下の者を押しとどめようと頑張っている形だとまとめている。上九の爻辞については、朱子が「大変難しい。何を言おうとしているのかよくわからない」と言っている。</li></ul>\n<h3 id=\"g9-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>力ずくではなく、柔らかくへりくだる態度で相手を止めよ。</li><li>雲は湧くがまだ雨にならない。成果はまだ出ない時で、焦らず力を蓄えよ。</li><li>本来の道に帰れば咎はない（初九）。志を同じくする者と手を携えよ（九二・九五）。</li><li>家庭では、夫が道を失えば妻に制せられ、夫婦が反目する（九三）。</li><li>真心で上に対すれば、傷も恐れも去る（六四）。</li><li>陰の力が満ちようとする時、軽々しく動くな（上九）。</li></ul><h2 class=\"sec\" id=\"g9-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">復自道。何其咎。吉。</span></summary><div class=\"body\"><div class=\"yomi\">復ること道よりす。何ぞ其れ咎あらん。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「復自道、其義吉也。」（復ること道よりすとは、其の義吉なり。）</div>\n<p>道に従って帰るがよい。そうすれば何の咎もない。吉である。</p>\n<p><span class=\"tag\">程伝</span>初九は陽で乾体である。陽は本来上にあるもので、また剛健の才で、上へ進んで帰ることができ、上と志を同じくする。進んで上に帰るのはその本来の道である。だから「復ること道よりす」という（初と四は陰陽で引き合うので、初九は上に進んで六四と合しようとする）。道によって帰るのだから何の咎があろう。咎がないばかりか吉がある。</p>\n<p><span class=\"tag\">象伝について程伝</span>陽剛の才でその道によって帰る。その義は吉である。初と四は正応だが、畜の時にあるので、互いに止めあう者である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>本来あるべき所へ、正しい道によって戻れ。咎はなく吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">牽復。吉。</span></summary><div class=\"body\"><div class=\"yomi\">牽（ひ）いて復る。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「牽復在中、亦不自失也。」（牽いて復りて中に在り、亦た自ら失わざるなり。）</div>\n<p>二と五が手を引きあって上に帰ろうとする。吉。「牽かれて復る」と読んでもよい。</p>\n<p><span class=\"tag\">程伝</span>二は陽で下体の中、五は陽で上体の中にいる。どちらも陽剛で中にいて、陰に止められ、上に帰ろうとする。五は四の上にいるが、止められる点では同じで、志を同じくする者である。同じ患いを持つ者は互いに憂える。二と五は志を同じくするので、手を引きあって帰る。二陽が並び進んで陰が勝てなければ、帰ることを遂げる。だから吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>二は中にいて中を得た者で、剛柔進退が中道を失わない。陽が帰る勢いは必ず強いが、中にいるので、進む力は強くても過剛にはならない。過剛ならば自らを失う。爻辞は牽いて帰って吉の義を言うだけで、象伝はさらにその中にある美点を明らかにした。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>志を同じくする仲間と手を携えて、本来の所へ戻れ。中庸を失わなければ吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">輿說輻。夫妻反目。</span></summary><div class=\"body\"><div class=\"yomi\">輿（くるま）輻（ふく）を説（と）く。夫妻反目す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「夫妻反目、不能正室也。」（夫妻反目すとは、室を正すこと能わざればなり。）</div>\n<p>馬車の輻（や）がばらばらになる（説は脱）。夫婦が反目する。大変悪い判断である。</p>\n<p><span class=\"tag\">程伝</span>三は陽で中を得ず、四にぴったり親しんでいる（三は本来上と応じるが、六四と親しんでいる）。陰陽の情が求めあうのである。また親しみあって中でなく、陰に止められ制される者である。だから前進できず、車が輻を脱いだように行けない。陰は陽に制されるものなのに、今かえって陽を制する。夫婦が反目するようなものである。反目とは目を怒らせて見あうこと。妻が夫に従わず、かえってこれを制する。婦人が夫に溺愛されると、ついにはかえって夫を制するようになる。夫が道を失わないのに妻がこれを制することはありえない。だから輻を脱し反目するのは、三が自分で招いたのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>夫婦が反目するのは、夫が自分の家を正しく治められないからである。三は道によって身を処さず、四にくっついたので、四が三を制して進ませない。夫が家を正せず、反目に至るようなものである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>身近な相手に溺れて主導権を奪われ、身動きが取れない。夫婦の反目。原因は自分にある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">有孚、血去惕出。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">孚有り。血去り、惕（おそ）れ出づ。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有孚惕出、上合志也。」（孚有り惕れ出づとは、上、志を合わすればなり。）</div>\n<p>真心があれば、傷の出血も止まり、恐れもなくなる。咎はない。</p>\n<p><span class=\"tag\">程伝</span>四は畜の時に君に近い位にいて、君を止める者である。もし内に孚誠があれば、五の志はこれを信じ、その止めるのに従う。卦は一陰で衆陽を止める者で、諸陽の志は四に係っている。四がもし力でこれを止めようとすれば、一柔で衆剛に敵対することになり、必ず傷つけられる。ただその誠を尽くして応じれば、相手を感動させることができる。だから傷害は遠ざかり、危懼を免れて咎がない。そうでなければ害を免れない。これが柔で剛を止める道である。人君の威厳に対して、微々たる臣がその欲を止めることがあるのは、孚信があって君を感動させるからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>四に孚があれば、五はこれを信任し、志を合わせる。だから恐れが去って咎がない。恐れが去れば、出血が止まるのも知れたことで、軽いほうを挙げたのである。五が志を合わせれば、衆陽はこれに従う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>力で抑えようとすれば傷つく。真心をもって上に対すれば、信じてもらえ、危険も恐れも去る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">有孚攣如、富以其鄰。</span></summary><div class=\"body\"><div class=\"yomi\">孚有りて攣如（れんじょ）たり。富、其の鄰（となり）と以（とも）にす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有孚攣如、不獨富也。」（孚有りて攣如たりとは、独り富まざるなり。）</div>\n<p>真心があって、志を同じくする者と手を握りあう。自分の富を隣人と分かちあう。</p>\n<p><span class=\"tag\">程伝</span>小畜は衆陽が陰に止められる時である。五は中正で尊位にいて孚があるので、その類はみなこれに応じる。だから「攣如」という。手を引きあって従うことである。五は必ず手を差しのべて引き、ともに救いあう。これが「富、其の鄰と以にす」である。尊位の勢いで、富める者がその財力を推して隣人と共にするようなものである。君子が小人に苦しめられ、正しい人が群邪に厄される時、下の者は必ず上に手を引かれ、ともに進むことを期待し、上の者は必ず下に手を差しのべ、力を合わせる。自分の力を人に推し及ぼすだけでなく、もともと下の者の助けによって力を成すのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>隣人がみな手を引いて従い、衆と欲を同じくして、独りでその富を持たない。君子が厄に処する時、ただ至誠によって衆の力の助けを得て、衆を救うことができる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>誠意で仲間と結ばれ、富を分かちあえば、衆の力を得て難を切り抜けられる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">既雨既處、尚德載。婦貞厲。月幾望、君子征凶。</span></summary><div class=\"body\"><div class=\"yomi\">既に雨ふり既に処（お）る。徳を尚（たっと）んで載（み）つ。婦は貞なれども厲し。月望に幾（ちか）し。君子征けば凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「既雨既處、德積載也。君子征凶、有所疑也。」（既に雨ふり既に処るとは、徳積みて載つるなり。君子征けば凶とは、疑う所有るなり。）</div>\n<p>雨が降り、ここに止まる。徳を尊び積んで満ちる。女性がこれを得たら、動機が正しくても危うい。月がようやく満月になろうとしている。この時、君子が外に向かって行動すれば凶。「徳」を「得」の意味として「尚お載するを得たり」と読む説もある。</p>\n<p><span class=\"tag\">程伝</span>上九は巽順の極で卦の上にいる。畜の終わりにいて、止められるのに従って止まる者で、四に止められる。「既に雨ふる」は和したこと、「既に処る」は止まったこと。陰が陽を止めるのは、和合しなければ止められない。和して止まって畜の道が成る。「徳を尚んで載つ」とは、四が柔巽の徳を積み満ちて完成に至ることである。陰柔が剛を止めるのは一朝一夕にできるものではなく、積み重ねて至る。戒めないでよかろうか。「載」は満ちること。『詩経』大雅・生民に「厥（そ）の声、路に載つ」とある（農業の神で周の始祖とされる后稷が赤ん坊の時、産声が道に満ちたという句）。「婦」は陰（六四）を指す。陰で陽を止め、柔で剛を制する。妻があくまでこれを守れば危うい道である。どうして妻が夫を制し、臣が君を制していつまでも安泰でいられよう。</p>\n<p>月が満月になれば日（太陽）に匹敵する。「望に幾し」とはその盛りがまさに匹敵しようとすることである。陰がすでに陽を止めているのに「望に幾し」と言うのは、柔巽で志を止めているので、力で制しているわけではないからである。しかしやめなければ陽より盛んになろうとする。だから望に近い時に戒めて、「婦が夫に匹敵しようとしている。君子が動けば凶だ」と言う。君子は陽、征は動くこと。望に近いとは満ちようとする時で、もうすでに満月なら陽は消えてしまっていて、何も戒めることはない。</p>\n<p><span class=\"tag\">象伝について程伝</span>「既に雨ふり既に処る」とは道が積み満ちて成ったことである。陰が満ちようとしている時、君子が動けば凶がある。陰が陽に敵すれば必ず陽を消し、小人が君子に抗えば必ず君子を害する。どうして疑い慮らずにいられよう。前もって疑い慮って警戒し、これを制する方法を求めれば、凶には至らない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>止める側の力が満ち、事は一応落ち着いた。しかし弱い側の力が強い側に匹敵しようとしている。今は軽々しく動くな。</div></div></details><div class=\"pager\"><a href=\"#gua-8\">← 水地比</a><a href=\"#gua-10\">天沢履 →</a></div>", "gua-10": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 10 卦　第二十一講〜第二十二講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天沢履</div><div class=\"yo\">てんたくり</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-10\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-10\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-10\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-10\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-10\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-10\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-10\" data-jump=\"yao\">六爻</a></div><h3 id=\"g10-s0\">卦の名と象</h3>\n<p>小畜を上下ひっくり返した形。履は「踏む」という意味だが、中国語の発音では「礼」と全く同じ音である。卦辞・爻辞では単純に「踏む」の意味で用いているが、孔子の作った大象では明らかに「礼」の意味に読みかえている。本田は、文句自体はわりあいやさしい卦だという。</p>\n<p>程伝（序卦伝を引く）：「物畜まりて然る後礼有り。故に之を受くるに履を以てす」。物が集まれば、大小の別、高下の等、美悪の分ができる。だから礼がなければならない。履が小畜に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>履は礼である。礼は人の踏み行うものである。</li><li>卦は天が上、沢が下。天が上にあり沢が下にあるのは、上下の分、尊卑の義で、理の当然である。これが礼の本であり、常に踏むべき道である。だから履という。</li><li>履とは踏むこと、また敷かれること。物を踏むのを履、物に踏まれるのも履という。柔（兌）が剛（乾）に踏まれる、だから履という。</li><li>彖伝が「剛、柔を履む」と言わず「柔、剛に履まる」と言うのは、剛が柔の上に乗るのは常の理で言うまでもないからである。易のなかでは「柔、剛に乗る」（噬嗑の六二、困の六三の象伝）とは言うが、「剛、柔に乗る」とは言わない。柔が剛に踏まれることに、陰が陽に順い喜んで応じる義が見える。</li></ul>\n<p>本田の講説：伊川のこの解釈は独特である。彖伝の「柔履剛」を「柔、剛に履まる」と読むのは文法的に無理がある。伊川がこういう無理な読みをするのは、陰が陽を踏みつけにすることはあってはならないという、厳格な倫理観による。朱子は「柔、剛を履む」と普通に読む。</p>\n<h3 id=\"g10-s1\">卦辞</h3>\n<div class=\"orig\">履虎尾、不咥人、亨。</div>\n<div class=\"yomi\">虎の尾を履む。人を咥（くら）わず。亨る。</div>\n<p>虎の尾を踏むような危険な目にあうが、その虎は踏んだ人を噛まない。願いは通る。</p>\n<p><span class=\"tag\">程伝</span>履は人の踏み行う道である。天が上、沢が下で、柔（兌）が剛（乾）に踏まれる。上下がそれぞれその義を得ている。事の至順、理の至当である。人の行いがこのようであれば、至って危険な所を踏んでも害されることはない。だから虎の尾を踏んでも噛まれず、亨ることができる。下卦の兌は「りっしんべん」をつけると「悦」になるように喜ぶ意味を持ち、踏まれながらも喜んでいるのである。</p>\n<h3 id=\"g10-s2\">彖伝</h3>\n<div class=\"orig\">履、柔履剛也。說而應乎乾、是以履虎尾、不咥人、亨。剛中正、履帝位而不疚、光明也。</div>\n<div class=\"yomi\">履は、柔、剛に履まるるなり。説（よろこ）びて乾に応ず。是を以て虎の尾を履むも、人を咥わず、亨る。剛中正にして帝位を履みて疚（やま）しからず、光明なり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>兌は陰で乾の陽に踏まれる。柔が剛に踏まれるのである。兌は悦び順う性質で乾に応じ、これに踏まれる。下が上に順い、陰が陽を承けるのは天下の正理である。行いがこのようであれば至順至当で、虎の尾を踏んでも傷つけられない。このように行えば亨ることは知れたことである。</li><li>九五は陽剛中正で、尊く帝位を踏んで、何の疚しいところもない。履の道の至善・光明を得た者である。「疚し」とは、心の内に傷つき病むこと。九五の「夬（さだ）めて履む」がそれである。「光明」とは、徳が盛んで光り輝くことである。</li></ul>\n<h3 id=\"g10-s3\">大象</h3>\n<div class=\"orig\">上天下澤、履。君子以辯上下、定民志。</div>\n<div class=\"yomi\">上天下沢は履なり。君子以て上下を弁（わか）ち、民の志を定む。</div>\n<p>天が上、沢が下にある形を履、言いかえれば礼と呼ぶ。君子はこれにのっとって、上下の階級の区別を明らかにし、民が身の程を忘れた野望を持たないように、民の気持ちを一定にする。</p>\n<p>程伝（本田によれば、ここには程伊川に限らず宋代の士大夫、すなわち官僚であり知識人である階層の通念が述べられている）：</p>\n<p>天が上、沢が下は上下の正理である。人の踏む所はこのようであるべきで、だからこの象を取って履という。君子はこの象を見て上下の分をはっきり分け、民の志を定める。上下の分が明らかであって初めて民の志が定まり、民の志が定まって初めて治を言える。民の志が定まらなければ天下は治められない。</p>\n<p>古（いにしえ）の時は、公卿大夫以下、位はそれぞれの徳に応じ、終身その位にいて、その分を得ていた。位が徳に釣り合わなければ、君主が抜擢して進めた。士は学問を修め、学問が成れば君主が求めた。みな自分から求めたのではない。農・工・商・賈（商は行商人、賈は商店主）もそれぞれの仕事に勤め、享受できるものには限りがあった（衣服の色から住まいの広さまで礼で決められていた）。だからみな定まった志があって、天下の心は一つにできた。</p>\n<p>後世になると、庶民や士から公卿に至るまで、日々身の程を越えた尊栄に志し、農工商賈も日々富と贅沢に志すようになった。億兆の人の心が交々利に走り、天下は紛々として乱れた。どうしてこれを一つにできよう。乱れないことを望んでも難しい。これは上下に定まった志がないからである。君子は履の象を見て上下を分け、それぞれをその分に当たらせ、民の心志を定めるのである。</p>\n<p>本田は、中国人はよく古代ほど理想の形ができていて時代が下がるほど悪くなると考える、これは古代尊重という癖で、必ずしも歴史的事実のままではない、と付け加えている。</p>\n<h3 id=\"g10-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>「貞厲」の読み分け。</b> 九五の程伝は、易の「貞厲」は場所によって意味が違うので、それぞれの卦で見よと言う。本田によれば、訟の六三「貞厲終吉」は「貞しければ厲うけれども終に吉」、噬嗑の六五「貞厲无咎」は「貞しく厲ぶめば咎无し」（身を正しくして危険を自覚すれば咎はない）と読み、大壮の九三・旅の九三は履の九五と同じく「貞しけれども厲し」と読む。</li><li><b>聖人は芻蕘にも詢（はか）る。</b> 九五の程伝は、昔の聖人は賢明さも決断力も権勢も十分にありながら、必ず天下の意見に耳を傾け、芻蕘（すうじょう。まぐさ刈り・柴刈りで生計を立てる身分の低い人）の意見でも取り上げた、それが聖人の聖人たる理由だ、と説く。『詩経』大雅「板」と『礼記』坊記に「芻蕘に詢る」という句がある。</li><li><b>中国の武人。</b> 六三の「武人にして大君となる」について、本田は、中国では武人は常に文人より卑しめられた、科挙にも武官を採用する武挙があったが地位は低かった、と説明する。また「眇（すがめ）」「跛（あしなえ）」は現在では差別用語とされるが、古典に出てくるものは致し方ない、と断っている。</li></ul>\n<h3 id=\"g10-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>危険な相手（虎）の尾を踏むような時でも、礼をもってへりくだり、喜んで従えば害されない。</li><li>もとの分に安んじて進め。出世欲だけで進めば驕って転ぶ（初九）。</li><li>力が足りないのに強がれば虎に食われる（六三）。</li><li>上の人の近くにいる時は恐れ慎め（九四）。</li><li>自分の正しさを過信して独断で押し切るのは、正しくても危うい（九五）。</li><li>最後は、これまでの行いを振り返って吉凶を考えよ。終始一貫して欠けるところがなければ大吉（上九）。</li></ul><h2 class=\"sec\" id=\"g10-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">素履、往无咎。</span></summary><div class=\"body\"><div class=\"yomi\">素（もと）より履む。往けば咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「素履之往、獨行願也。」（素より履みて往くは、独り願いを行うなり。）</div>\n<p>もともとの一番低い位に基づいて足を踏み出す。そうして行けば咎はない。</p>\n<p><span class=\"tag\">程伝</span>踏んで元の所にいないのが「行く」ということである。初は最も低い所にいて、もとから下にいる者だが、陽剛の才で上に進むことができる。もしもとの低い地位に安んじて行けば咎はない。人が自分の貧賤の分に安んじられなければ、その進み方は貪欲で慌ただしく、とにかく貧賤から抜け出したいだけで、何かをなそうというのではない。そうして進めば必ず驕りあふれる。だから行けば咎がある。賢者は安んじてそのもとの分を踏み、低い地位にいても楽しみ（孔子の弟子の顔淵が陋巷にあって道を楽しんだように）、進む時には何か世のためにしようとする。だから進めば善をなして不善がない。これがもとの分を守る者である。</p>\n<p><span class=\"tag\">象伝について程伝</span>安んじてもとの分を踏んで行くのは、利を求めるのではなく、もっぱら（独り）その志願を行うだけである。もし富貴を欲する心と道を行う心が胸中で交々戦えば、どうして安んじてもとの分を踏めよう。本田は「このあたりの注、程伊川のいかにも道学者らしい正義感が到る処に見える」と評している。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>今の分に安んじ、世のためにという志で進めば咎はない。出世欲で進むな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">履道坦坦。幽人貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">道を履むこと坦坦たり。幽人なれば貞にして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「幽人貞吉、中不自亂也。」（幽人なれば貞にして吉とは、中自ら乱れざるなり。）</div>\n<p>平らかな大道を踏む。その人が世捨て人のように無欲であれば、正しくて吉。「幽人」は、最近の注では幽閉された人と解されるが（三浦国雄の訳による）、古典的な注釈では俗世間から隠れた隠者の意味に取り、『後漢書』あたりからその用例がある。</p>\n<p><span class=\"tag\">程伝</span>九二は柔（陰の位）にいて、寛やかで中を得ている。その踏む所は坦々として平易な道である。平易な道を得ていても、幽静安恬（心静かに無欲）な人であってこそ、堅固に保って吉である。九二は陽で志が上へ進もうとするので、「幽人」の戒めがある。</p>\n<p><span class=\"tag\">象伝について程伝</span>履の道は安静にある。心の中が恬淡として正しければ、踏む所は安らかでゆったりしている。心が騒がしく動けば、どうして踏む所に安んじられよう。だから必ず幽人であってこそ堅固で吉である。その中心が安静で、利欲によって自らを乱さないからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>平らかな道を行く時。欲を去り心静かであれば、正しくて吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">眇能視、跛能履。履虎尾、咥人、凶。武人爲于大君。</span></summary><div class=\"body\"><div class=\"yomi\">眇（すがめ）能く視、跛（あしなえ）能く履む。虎の尾を履む。人を咥う。凶。武人にして大君と為る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「眇能視、不足以有明也。跛能履、不足以與行也。咥人之凶、位不當也。武人爲于大君、志剛也。」（眇能く視るとは、以て明有るに足らざるなり。跛能く履むとは、以て与に行くに足らざるなり。人を咥うの凶は、位当たらざればなり。武人にして大君と為るは、志剛なればなり。）</div>\n<p>片目が細くても何とか見ようとし、片足が萎えていても何とか歩こうとする。そんな足取りでうっかり虎の尾を踏み、虎がその人に食いつく。凶。暴力だけの人が君主になるという下剋上が起こる。「能」の字が二つとも「而」になっているテキストもある。本田は「大変皮肉で、この卦の中で一番悪い」と言う。</p>\n<p><span class=\"tag\">程伝</span>三は陰で陽の位にいて、剛であろうとするが、体はもともと陰柔で、どうして足場を堅くできよう。だから片目で見てもはっきりせず、萎えた足で歩いても遠くへ行けない。才がもともと足りず、しかも中を得ず、踏む所がその正しさによらない。柔で剛（上の陽）に勝とうとする。その行いがこのようであれば危地を踏む。だから「虎の尾を履む」。うまく踏めないのに危地を踏めば、必ず禍に及ぶ。だから「人を咥う、凶」。「武人にして大君と為る」とは、暴力だけの人が人の上にいて、慌ただしさ・短気をほしいままにするだけで、順に踏んで遠くに至ることができないということである。中正でなく志だけ剛なので、群陽も味方しない。剛で危地を踏んで凶を得る。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰柔の人は才が足りず、はっきり見ることも遠くへ行くこともできないのに、剛に努めて勝とうとする。害を免れようか。柔で三にいて、踏み方が正しくないので禍害を招く。武人をたとえとするのは、陽の位にいながら才が弱く志だけ剛だからで、志が剛なら妄動し、道によらない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>力が足りないのに強がって危険に踏み込み、手痛い目にあう。凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">履虎尾、愬愬、終吉。</span></summary><div class=\"body\"><div class=\"yomi\">虎の尾を履む。愬愬（さくさく）たれば、終に吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「愬愬終吉、志行也。」（愬愬たれば終に吉とは、志行わるるなり。）</div>\n<p>虎の尾を踏むような危険がある。しかし恐れ慎んでいれば、最後には吉。</p>\n<p><span class=\"tag\">程伝</span>九四は陽剛で乾体、四にいても剛の勝った者である。君（五）に近く、懼れの多い地にいて、しかも五と気が合わない（どちらも陽で反発する）。五は剛く押し切ることの過ぎた者で、だから「虎の尾を履む」（五が虎で、そのすぐ下にいる）。愬愬は恐れ慎むさま。もしよく恐れ慎めば、終には吉である。九は剛でも陰の位にいて志は柔で、四は君に近いがそこに居座らない。だから恐れ慎めば、終には危うきを免れて吉を得る。</p>\n<p><span class=\"tag\">象伝について程伝</span>恐れ慎んで終に吉を得るのは、志が我が道を行くことにあって高い地位に安住しないからで、危うい所を去れば吉を得る。陽は前進する力があり、柔の位にいるのは素直な態度で自らを処することである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上の人のすぐ下で危うい立場。びくびくするほど慎めば、最後は吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">夬履。貞厲。</span></summary><div class=\"body\"><div class=\"yomi\">夬（さだ）めて履む。貞しけれども厲し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「夬履貞厲、位正當也。」（夬めて履む、貞しけれども厲しとは、位正に当たればなり。）</div>\n<p>断固として踏む。その意図は正しいが、危うさが伴う。</p>\n<p><span class=\"tag\">程伝</span>夬は剛く押し切ることである。五は陽剛で乾体、至尊の位にいて、自分の決断に任せて行う者である。このようであれば、正しくても危うい。昔の聖人は天下の尊位にいて、明は天下を照らし、剛は事を決し、勢いは思うままにできたが、それでも必ず天下の意見を尽くし、芻蕘の微でも取った。これこそ聖人の聖人たる理由で、帝位を踏んで光明である。もし自分の剛明に任せて決行して顧みなければ、正しくても危うい道である。固守してよかろうか。剛明の才があってもひたすら自分に任せれば危うい。まして剛明の足りない者はなおさらである。</p>\n<p><span class=\"tag\">象伝について程伝</span>夬めて履むことを戒めるのは、まさに尊位に当たっているからである。至尊の位にいて、思うままにできる勢いに頼り、自分の決断に任せて恐れ慎まなければ、正しくても危うい道である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の正しさを過信して独断で押し切るのは危うい。下の者の意見にも耳を傾けよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">視履考祥、其旋元吉。</span></summary><div class=\"body\"><div class=\"yomi\">履むを視て祥を考う。其れ旋（めぐ）るときは元吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「元吉在上、大有慶也。」（元吉にして上に在り、大いに慶び有るなり。）</div>\n<p>その人のふだんの踏み行いを見て、将来の吉凶を考えよ。礼儀正しく立ち回り、欠けるところがなければ大いに吉。</p>\n<p><span class=\"tag\">程伝</span>上は履の終わりにいる。その終わりにおいて、これまでの履行を振り返って善悪と禍福を考える。もしその行いが周旋完備していれば、善でかつ吉である。「旋る」とは立ち居ふるまいが完全で、至らないところがないこと。人の踏む所の終わりを考え見て、終始欠けるところがなければ善の至りで、だから元吉である。人の吉凶は、踏む所の善悪の多少、吉凶の大小にかかっている。</p>\n<p><span class=\"tag\">象伝について程伝</span>上は履の終わりである。人の踏む所が善で吉、終わりに至るまで周旋して欠けることがなければ、大いに福を得る人である。人の行いは、終わりまで一貫していることを貴ぶ。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>これまでの行いを振り返る時。終始欠けるところなく礼を尽くしてきたなら大吉。</div></div></details><div class=\"pager\"><a href=\"#gua-9\">← 風天小畜</a><a href=\"#gua-11\">地天泰 →</a></div>", "gua-11": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 11 卦　第二十二講〜第二十三講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地天泰</div><div class=\"yo\">ちてんたい</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-11\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-11\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-11\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-11\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-11\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-11\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-11\" data-jump=\"yao\">六爻</a></div><h3 id=\"g11-s0\">卦の名と象</h3>\n<p>易者の看板に必ず描かれている卦である。下が乾、上が坤で天地がひっくり返った形、人間界で言えば君主が臣下の下にいるという大変不都合な形だが、これを泰と名づける。泰には「やすらか」「とおる」という二つの訓がある。本田は「易の作者がいかに皮肉な人であったかがわかる」と言う。</p>\n<p>程伝（序卦伝を引く）：「履みて泰（やす）し、然る後安し。故に之を受くるに泰を以てす」。踏み行うことがよろしきを得ればのびのびと通い、のびのびしていれば安らかである。泰が履に次ぐゆえんである。卦は坤陰が上に、乾陽が下にいる。天地陰陽の気が交わって和すれば万物が生成する。だから通泰とする。</p>\n<p>本田の講説：男女の交わりによって子どもができることからの連想で、中国人は万物が陰と陽という二つの気の交わりによって生じると考えた。これが中国において最も伝統的で根本的な自然の哲学である。</p>\n<h3 id=\"g11-s1\">卦辞</h3>\n<div class=\"orig\">泰、小往大來、吉亨。</div>\n<div class=\"yomi\">泰は、小往き大来る。吉にして亨る。</div>\n<p>陰気（小）が外へ出て行き、陽気（大）が内へやって来る。結果は吉で、願いは通る。</p>\n<p><span class=\"tag\">程伝</span>小は陰、大は陽をいう。往くとは外へ行くこと、来るとは来て内にいること。陽気が下降し陰気が上って交わり、陰陽が和らいで伸びやかになれば、万物は生じ遂げる。これが天地の泰である。</p>\n<ul class=\"sen\"><li>人事で言えば、大は君上、小は臣下。君が誠を推して下に任せ、臣が誠を尽くして君に仕え、上下の志が通じる。朝廷の泰である。</li><li>陽は君子、陰は小人。君子が来て内におり、小人が行って外にいる。君子が位を得て小人が下にいる。天下の泰である。</li><li>泰の道は吉でかつ亨る。それなのに「元吉」「元亨」と言わないのは、時代の運には汚れた時も盛んな時もあり、治にも大小があって、泰といっても一概ではないからである。吉・亨と言えば、すべてを包括できる。</li></ul>\n<h3 id=\"g11-s2\">彖伝</h3>\n<div class=\"orig\">泰、小往大來、吉亨、則是天地交而萬物通也、上下交而其志同也。内陽而外陰、内健而外順、内君子而外小人。君子道長、小人道消也。</div>\n<div class=\"yomi\">泰は、小往き大来る、吉にして亨るとは、則ち是れ天地交わりて万物通ずるなり。上下交わりて其の志同じきなり。内陽にして外陰、内健にして外順、内君子にして外小人。君子の道長じ、小人の道消するなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>小往き大来るとは、陰が往き陽が来ること。天地陰陽の気が交わり、万物がその通泰を遂げる。人では上下の情が交わり通じて、その志意が同じになる。</li><li>陽が来て内におり、陰が往って外にいる。陽が進み陰が退く。乾が内に、坤が外にあって、内健外順。君子の道である。君子が内に、小人が外にいて、君子の道が長じ小人の道が消える。だから泰である。まず陰陽が交和することに取り、さらに君子の道が長ずることに取った。陰陽が交和することが、すなわち君子の道が長ずることである。</li></ul>\n<h3 id=\"g11-s3\">大象</h3>\n<div class=\"orig\">天地交泰。后以財成天地之道、輔相天地之宜、以左右民。</div>\n<div class=\"yomi\">天地交わるは泰なり。后（きみ）以て天地の道を財成し、天地の宜を輔相し、以て民を左右（たす）く。</div>\n<p>天地の気が交わる形が泰である。人の上に立つ者はこれにのっとって、天地の道を裁ち作り（財は裁と意味も発音も同じ）、天地の程良さを助け、民を助ける。政治はすべて宇宙の法則に従ってなされるべきだということである。</p>\n<p><span class=\"tag\">程伝</span>天地が交わり陰陽が和すれば、万物は茂り遂げる。人君は天地通泰の象を体して、天地の道を財成し、天地の宜を輔相して民を助けるべきである。「財成」とは、天地の交泰の道を体して形を作り、施政の方法を成すこと。「輔相」とは、天地が通泰すれば万物が茂り遂げるように、人君がこれを体して法制を作り、民に天の時を用い地の理によって化育の功を助けさせ、豊かな実りの利を成させることである。春の気が万物を発生させれば播種の方法を作り、秋の気が万物を実らせれば収穫の方法を作る。民の生は、必ず上が法制を作って教え導き助けることに頼って、その生を遂げられる。これが民を左右（たす）くということである。</p>\n<p>本田の講説：天地の働きに人がのっとりつつ手を貸すという考え方は、人間が自然を征服するという西洋風の考え方とは異なっている。</p>\n<h3 id=\"g11-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>十二消息卦。</b> 泰は消息卦の一つで、一年十二か月に当てはめると正月に当たる。程伊川の注は消息卦に一言も触れないが、後の朱子の注は消息卦で説明している。乾（陽気が最も盛ん）が四月、姤（乾の一番下が陰に変わり、わずかに陰気が発生した）が五月、遯が六月、否が七月、観が八月、剥が九月、坤（陰ばかり）が十月。坤の一番下が陽に変わった復（地下にわずかに陽気が発生した）が十一月で、旧暦でちょうど冬至に当たる。臨が十二月、泰が正月、大壮が二月、夬が三月。易の本文自体はこれを言っていないが、漢代の注釈者がこの概念をはっきり定め、卦辞の「小往き大来る」もこれに依拠して、陰気が縮み陽気が伸びると解釈した。その発想のもとになったのは、卦辞に「七日にして来復す」とある復や、名の通り下から陰気に侵されて上の陽気がはぎ取られる剥の卦だろう。</li><li><b>卦の配列。</b> 『易経』の卦の配列は、上下ひっくり返したものどうし（乾坤のようにひっくり返しても同じものは陰陽を逆にしたものどうし）で二つずつペアになっている。だから剥の次に復が来る。ただし、このペアがいつ頃成立したかはまだはっきりしない。まだ全部は発表されていないが、古い墓から発掘された一番古い『易経』のテキストでは、配列が多少違っているらしい。孔子の作とされる雑卦伝でも卦の順番が多少違う。『周礼』には『周易』のほかに『連山』『帰蔵』という易があったとあるが、残っていない。『連山』は艮を、『帰蔵』は坤を最初に置いたと言われるが、書名から思いついただけのもので、本当かどうかわからない。</li><li><b>包容力と果断さ。</b> 九二の程伝は、汚いものも包み込む度量（荒を包ぬ）と、深い川を裸足で渡るような果断さ（馮河を用う）は矛盾するのではないかという問いに対し、包容の度量を持ちながら剛果の働きを施すのが聖賢の行いだ、と答えている。</li><li><b>貞凶と貞吝。</b> 上六の程伝によれば、「貞凶」「貞吝」には、頑固に守れば凶・吝になる場合と、正しくても凶・吝になる場合の二通りがある。本田によれば、「貞吝」は易の中にあまりなく、泰の上六のほか解の六三くらいで、「貞凶」は師の六五、随の九四、姤の初六などわりあい例がある。</li></ul>\n<h3 id=\"g11-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>上下の気持ちが通じあう、天下泰平の時。めでたい卦だが、泰平は永遠には続かない。</li><li>仲間とともに進めば吉（初九）。</li><li>泰平に慣れて気がゆるむ時こそ、包容力と果断さを併せ持ち、遠くの人材も忘れず、仲間内の私情を断て（九二）。</li><li>平らかなものはいつか傾く。泰平の時こそ自ら危ぶんで正しさを守れ（九三）。</li><li>上に立つ者が身分を下げて賢者に任せれば大吉（六五）。</li><li>泰平の終わりには、崩れるものを力ずくで支えようとしてはならない（上六）。</li></ul><h2 class=\"sec\" id=\"g11-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">拔茅茹、以其彙。征吉。</span></summary><div class=\"body\"><div class=\"yomi\">茅を抜くに茹（じょ）たり。其の彙（たぐい）と以にす。征けば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「拔茅征吉、志在外也。」（茅を抜く征けば吉とは、志外に在るなり。）</div>\n<p>ちがやを引き抜こうとすると、根がつながっていて仲間も全部ずるずると抜けて来る。行動すれば吉。</p>\n<p><span class=\"tag\">程伝</span>初は陽で下にいる、剛明の才がありながら下位にいる者である。時が否（ふさがり）なら君子は退いて窮乏に甘んじ、時が泰になれば志は上へ進むことにある。君子が進む時は必ず仲間と手を引きあって助けあう。茅の根がつながっていて、一本抜けば仲間が連なって起きあがるようなものである。茹は根がつながる形、彙は同類である。賢者は同類とともに進み、志を合わせて道を行う。だから吉である。君子が進む時は必ず類とともにし、自分だけが先んじようとするのではなく、善をともにすることを楽しむ。実際、互いに頼りあって成る。だから君子も小人も、独りで類の助けを頼らない者はない。昔から君子が位を得れば天下の賢者が朝廷に集まり、志を同じくし力を合わせて天下の泰を成した。小人が位にいれば不肖の者が並んで進み、その党が勝って天下はふさがる。それぞれ同類に従うからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>時が泰になろうとすれば、群賢がみな上へ進もうとする。三陽の進もうという志は同じである。だから彙征の象を取った。「志外に在り」とは、上に進もうとすることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>同じ志の仲間とともに進めば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">包荒、用馮河、不遐遺、朋亡。得尚于中行。</span></summary><div class=\"body\"><div class=\"yomi\">荒を包（か）ね、馮河（ひょうが）を用い、遐（とお）きを遺（わす）れず、朋亡う。中行に尚（かな）うを得たり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「包荒得尚于中行、以光大也。」（荒を包ね中行に尚うを得るは、光大なるを以てなり。）</div>\n<p>汚いものも包容せよ（『春秋左氏伝』に「国君は垢を含む」、『老子』にも「国の垢を受く」とある。人の上に立つ者はいろいろな汚辱を身に引き受けねばならない）。時には深い川を舟なしでざぶざぶ渡るような向こう見ずな者も用いよ（『論語』の「暴虎馮河」。孔子はこういう乱暴な者とは行動をともにしないと言った）。遠くに隠れている者も忘れず、仲間内だけを大切にする気持ちを捨てよ。そうしてこそ中庸の道にかなう。「不遐遺」は目的語の「遐」と動詞の「遺」の語順が逆になっているが、上に否定詞があるのでこういう倒置がありうる。</p>\n<p><span class=\"tag\">程伝</span>二は陽剛で中を得て、上の五に応じる。五は柔順で中を得て、下の二に応じる。君臣が徳を同じくし、二は剛中の才で上から専任される。だから二は臣の位にいても治泰の主である。「上下交わりて其の志同じ」で、泰を治める道は二を主として言う。</p>\n<p>荒を包ね、馮河を用い、遐きを遺れず、朋亡う、の四つは泰に処する道である。</p>\n<ul class=\"sen\"><li><b>荒を包ぬ</b>：人情が安泰に慣れると、政治は間延びして法度が廃れ、万事に節度がなくなる。これを治めるには、汚いものも包み込む度量があってこそ、施策が寛やかで細やかになり、弊害が改まり事が治まって人が安んじる。度量がなく怒り憎む心だけがあれば、深い見通しがなく、乱暴にかき乱す心配があり、深い弊害が去らないうちに新たな患いが生じる。</li><li><b>馮河を用う</b>：泰の世には人情が長い平和に慣れ、いつも通りに安んじ、今まで通りにやっていればよいとして、改めることを憚る。馮河の勇がなければ、この時に何もできない。昔から泰平の世は必ずだんだん衰えるが、それは安逸に慣れてずるずるとそうなるのである。剛断の君・英烈の輔佐でなければ、身を抜き出し奮い立って弊害を改められない。</li><li><b>遐きを遺れず</b>：泰の時は人情がただ安逸を好み、深く考え遠くを慮ることがない。泰を治める者は細かなことにまで行き届くべきで、遠い者も忘れてはならない。事の微かなもの、すぐれた才能が狭い路地に隠れ住んでいることなどはみな遠いもので、泰の時にはとかく忘れられる。</li><li><b>朋亡う</b>：泰平の世には人は安逸に慣れ、情がほしいままになって節度を失う。引き締めて正すには、仲間内の私情を断ち切らなければできない。昔から新しい法を立て事を制しても、人情に引かれてついに行えないことが多い。贅沢を禁じれば皇后の親戚に妨げられ、大土地所有を制限すれば貴族に妨げられる。大公で処断して必ず行えなければ、仲間の私情に引かれたのである。</li></ul>\n<p>この四つがあれば九二の徳に合する。だから「中行に尚うを得たり」。尚は配（かなう）である。</p>\n<p><span class=\"tag\">象伝について程伝</span>象伝は「荒を包ぬ」だけを挙げて四つの義を通じて解いた。このようであれば中行の徳にかない、その道は光明で大いに顕れる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>泰平に慣れてゆるんだ時。清濁あわせ呑む度量と、果断な実行力を持ち、遠くの人材も忘れず、身内びいきを断て。そうすれば中庸にかなう。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">无平不陂、无往不復。艱貞无咎。勿恤其孚、于食有福。</span></summary><div class=\"body\"><div class=\"yomi\">平らかにして陂（かたむ）かざる无く、往きて復らざる无し。艱貞なれば咎无し。恤（うれ）うる勿れ、其れ孚（まこと）あり。食に于いて福有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「无往不復、天地際也。」（往きて復らざる无しとは、天地の際わるなり。）</div>\n<p>平らかなままでいつまでも傾かないものはない。行ったまま帰って来ないものはない。危ぶんで正しさを守れば咎はない。心配しなくても願った通りになるだろう。たくさんの禄がもらえるだろう。</p>\n<p><span class=\"tag\">程伝</span>三は泰の中にいて、諸陽の上にいる。泰の盛りである。物の理は循環のようで、下にいる者は必ず上り、上にいる者は必ず降りる。泰が久しければ必ず否になる。だから泰の盛り、陽が進もうとする時に戒めて言う。常に安らかで傾かないものはない、泰は永遠には続かない。常に行ったきりで帰らないものはない、陰はいつか内に帰ってくる（下の三爻が内、上の三爻が外）。平らかなものが傾き、往ったものが帰れば否になる。天理が必ずそうなることを知り、泰の時にも自堕落にならず、常に自ら危ぶんで、行いを正しく堅固にすべきである。そうすれば咎はない。泰に処する道として自ら危ぶみ正しくできれば、常に泰を保ち、くよくよ憂えなくても求めるものは得られる。期待した通りになるのを孚という。そうすれば禄食に福がある。禄食とは福祉（祉はもと神様の足跡）である。徳と善が日に積もれば福禄が日に至る。徳が禄を超えていれば、盛んでも満ちあふれているとは言わない。昔から盛んな者で、道を失わないのに失敗した者はない。</p>\n<p><span class=\"tag\">象伝について程伝</span>天地の交わり方を言う。陽が下に降れば必ず上に帰り、陰が上に昇れば必ず下に帰る。屈伸往来の常理である。天地の交わり方によって、否と泰が常に交替する理を明らかにして戒めとした。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>泰平の盛り。しかし平らかなものは必ず傾く。気をゆるめず自ら危ぶんで正しさを守れば、咎はなく福禄がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">翩翩不富、以其鄰。不戒以孚。</span></summary><div class=\"body\"><div class=\"yomi\">翩翩（へんぺん）として富まず。其の鄰と以にす。戒めずして以て孚あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「翩翩不富、皆失實也。不戒以孚、中心願也。」（翩翩として富まずとは、皆実を失えばなり。戒めずして以て孚ありとは、中心願えばなり。）</div>\n<p>ぱたぱたと飛び下りて来る。富に引かれたわけではないが、隣人（六五・上六）もついて来る。警告したわけでもないのに、真心によってついて来る。</p>\n<p><span class=\"tag\">程伝</span>四は泰の中を過ぎた所にいて、陰で上にいる。志は下に帰ることにある。上の二陰も志は下に走り下りることにある。翩翩とは疾く飛ぶさま。四は翩翩として下に就き、隣人と同じくする。隣とは類で、五と上をいう。人が富んで類が従うのは利のためで、富まずに従うのは志が同じだからである。三陰はみな下にいるべき物（陽が君、陰が臣で、臣は本来下にいるべき）で、上にいるのは本質に背く。みな下へ行こうとするので、富まずとも従い、告げ戒めなくても誠意で合う。陰陽の昇降は時運の否泰で、交わったり散じたりするのは理の常である。泰が中を過ぎれば変わろうとする。聖人は三では「艱貞なれば咎无し」と言ったが、三は中に近く、戒めを知れば保てる。四はすでに中を過ぎて理として必ず変わるので、もっぱら始終往復の道を言う。五は泰の主なので、また泰に処する義を言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>翩翩とは下り行くのが速いこと。富を待たずに従うのは、三陰が上にいるのはみな本質に背くからである。陰はもともと下にいるべき物で、今上にいるのは実を失うこと。告戒を待たずに誠意でともにするのは、心の中の願いにかなうからである。理の当然は天であり（程子や朱子は天の神格性を否定し「天は即ち理なり」と解する）、衆が同じくするのは時である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>泰平が峠を越え、本来の場所へ戻ろうとする流れ。言わずとも仲間が同調してついて来る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">帝乙歸妹、以祉元吉。</span></summary><div class=\"body\"><div class=\"yomi\">帝乙（ていいつ）、妹を帰（とつ）がしむ。以て祉（さいわい）あり、元吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「以祉元吉、中以行願也。」（以て祉あり元吉とは、中にして以て願いを行うなり。）</div>\n<p>殷の帝王の帝乙が、妹を臣下に嫁がせる。夫によく仕えて天からの幸いを受けた。結果は大吉。</p>\n<p><span class=\"tag\">程伝</span>史書は殷の湯王を天乙と呼び、その後に帝祖乙という賢王がおり、さらに後に帝乙がいる（殷の帝王は誕生日の十干を名にした）。『書経』多士篇に「湯より帝乙に至るまで、徳を明らかにし祀を恤（うれ）えざる罔（な）し」とある。爻辞の帝乙が誰かはわからないが、内容から見れば、王女が諸侯に降嫁する時の礼法を初めて作った人だろう。昔から天子の娘は諸侯に嫁いだが、帝乙に至って礼法を作り、尊貴を降して夫に従うようにさせた。六五は陰柔で君位にいて、下の九二の剛明の賢に応じる。五が賢臣に任せて従うのは、帝乙が妹を降嫁させたようなものである。尊を降して陽に従えば、天の幸いを受けて元吉である。元吉とは大吉であって善を尽くすこと、治泰の功を成すことである。</p>\n<p><span class=\"tag\">象伝について程伝</span>祉を得て元吉なのは、中道によって志願を行うからである。中徳があるから剛中の賢（九二）に任せられる。任せて従うのは、みな自分が普段から願っていることで、願っていないことなら従えない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者が身分を下げて賢い人に任せ、従えば、天の幸いを受けて大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">城復于隍。勿用師。自邑告命。貞吝。</span></summary><div class=\"body\"><div class=\"yomi\">城、隍（ほり）に復る。師を用うる勿れ。邑より命を告ぐ。貞なれども吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「城復于隍、其命亂也。」（城、隍に復るとは、其の命乱るるなり。）</div>\n<p>城が崩れて堀に帰る（城を作る時は、まず堀を掘ってその土を盛って築く）。軍隊を用いてはならない。自分の領地にだけ命令を下す（君主の命令が遠くまで届かない。朱子は、領地の家老の方から指図してくると解する）。正しくても恥ずべきことである（吝は凶ほど悪くない）。</p>\n<p><span class=\"tag\">程伝</span>堀の土を積んで城を作るのは、治道を積み重ねて泰を成すのに似ている。泰の終わりに及んで否に返ろうとするのは、城の土が崩れて堀に戻るようなものである。上は泰の終わりで、六は陰の小人でここにいる。ゆくゆくはふさがろうとする。「師を用うる勿れ」とは、君が衆を用いられるのは上下の情が通じて心から従うからである。今泰が終わろうとして泰の道を失い、上下の情が通じず（泰に「通」の意味があることによる）、民心は離散して上に従わない。どうして用いられよう。用いれば乱れる。衆を用いられないので、初めて身近な者から命令を下す。命令が正しくても恥ずべきである。邑とは自分の居る所、身近な者をいう。命令はたいてい近くから始めるものである。</p>\n<p>貞には二義がある。固く守れば凶・吝になる場合と、正しくても凶・吝になる場合である。ここで貞凶と言わず貞吝と言うのは、ふさがろうとして初めて身近に命を告げるのが恥ずべきだからで、ふさがるのは命を告げたことによるのではない。</p>\n<p><span class=\"tag\">象伝について程伝</span>命令しても乱れは止められない。城が堀に返ったのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>泰平の終わり。崩れゆくものを力ずくで支えようとしてはならない。身近なところだけ固めるのは正しくても恥ずべきこと。</div></div></details><div class=\"pager\"><a href=\"#gua-10\">← 天沢履</a><a href=\"#gua-12\">天地否 →</a></div>", "gua-12": "<a class=\"back\" href=\"#gua\">← 十二卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 12 卦　第二十四講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天地否</div><div class=\"yo\">てんちひ</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-12\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-12\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-12\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-12\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-12\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-12\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-12\" data-jump=\"yao\">六爻</a></div><h3 id=\"g12-s0\">卦の名と象</h3>\n<p>泰は天と地が逆さまになった形だったが、これを反対にして天が上、地が下になっているのが否である。このほうが良さそうだが、判断は良くない。泰が「通じる」意味であるのに対し、否は「ふさがる」意味である。</p>\n<p>程伝（序卦伝を引く）：「泰とは通なり。物は以て終に通ず可からず。故に之を受くるに否を以てす」。物の理は往来し、通泰の極みは必ずふさがる。否が泰に次ぐゆえんである。天地が交わり陰陽が和らいで通じれば泰になるが、天が上にいるまま、地が下にいるまま、天地が隔絶して交わらない。だから否である。</p>\n<h3 id=\"g12-s1\">卦辞</h3>\n<div class=\"orig\">否之匪人、不利君子貞。大往小來。</div>\n<div class=\"yomi\">否は之れ人に匪（あら）ず。君子の貞に利あらず。大往き小来る。</div>\n<p>否は人道に背いている。君子の正しい道に利益がない。陽（大）が外に去り、陰（小）が内にやって来る形である。</p>\n<p><span class=\"tag\">程伝</span>天地が交わって万物がその間に生じ、そこで天・地・人の三才が備わる。人は最も霊で、万物の首である（『書経』泰誓に「惟れ人は万物の霊」）。天地の間に生じるものはみな人道による。本田によれば、「人道」には生殖という意味がある。『詩経』大雅・生民に、周の始祖を生んだ姜嫄が野原で巨人の足跡の親指を踏み、腹に響く感じがして処女懐胎し后稷を生んだとあり、鄭玄はこれを「人道の己に感ずる有るが如し」と注している。天地が交わらなければ万物は生じない。これが人道がない、つまり生殖の働きが欠けているということで、「人に匪ず」という。消長・闔闢（開閉）が相因ってやまない。泰が極まれば元に戻り（泰の上六「城、隍に復る」）、否が終われば傾く（否の上九「否を傾く」）。常に変わらない理はない。人道がいつまでもないままでよかろうか。否が終われば泰になる。</p>\n<p>上下が交わり通じ、剛柔が和合するのが君子の道である。否はこれに反する。だから君子の貞に利がない。君子の正道がふさがって行われないのである。「大往き小来る」とは陽が往き陰が来ること（上半分は陽ばかり、下半分は陰ばかり）。小人の道が長じ、君子の道が消える象である。だから否である。</p>\n<h3 id=\"g12-s2\">彖伝</h3>\n<div class=\"orig\">否之匪人、不利君子貞、大往小來、則是天地不交而萬物不通也、上下不交而天下无邦也。内陰而外陽、内柔而外剛、内小人而外君子。小人道長、君子道消也。</div>\n<div class=\"yomi\">否は之れ人に匪ず、君子の貞に利あらず、大往き小来るとは、則ち是れ天地交わらずして万物通ぜざるなり。上下交わらずして天下に邦无きなり。内陰にして外陽、内柔にして外剛、内小人にして外君子。小人の道長じ、君子の道消するなり。</div>\n<p><span class=\"tag\">程伝</span>天地の気が交わらなければ物の生成の理はなく、上下の義が交わらなければ天下に邦国の道はない。邦国を建てるのは治をなすためである。上は政教を施して民を治め、民は君を戴いて命に従う。上下が交わるのが治安の理由である。今上下が交わらない。天下に邦国の道がないのである。陰柔が内に、陽剛が外にいる。君子が往って外に、小人が来て内にいる。小人の道が長じ、君子の道が消える時である。</p>\n<h3 id=\"g12-s3\">大象</h3>\n<div class=\"orig\">天地不交、否。君子以儉德辟難、不可榮以祿。</div>\n<div class=\"yomi\">天地交わらざるは否なり。君子以て徳を倹にして難を辟（さ）く。栄えしむるに禄を以てす可からず。</div>\n<p>天地の気が交わらない形が否である。君子はこれを見て、身を倹約にし、難を避ける。高い禄をもらうことを光栄と考えてはならない。ふさがりの時代には、ひたすらつつましくして難を避けるほかない。</p>\n<p><span class=\"tag\">程伝</span>天地が交わり通じないので否である。否塞の時、君子の道は消える。だから否塞の象を見て、損約の徳で禍難を避けるべきである。栄えて禄位にいてはならない。否は小人が志を得る時で、君子が顕栄の地にいれば禍は必ずその身に及ぶ。だから窮約の地に身を隠すのがよい。</p>\n<h3 id=\"g12-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>君子と小人の使い分け。</b> 彖伝では内（下卦）の陰を小人、外の陽を君子としながら、初六の爻辞では下にいる初六を君子の道とする。程伝は、易は時に従って義を取り、変動して一定しないと言う。否の時には、下にいる者が君子なのである。</li><li><b>応の意味がない。</b> 否では下の三爻がすべて陰、上の三爻がすべて陽で、初と四、二と五、三と上はみな陰陽が逆で引き合うはずだが、ふさがりの時で隔絶して通じないので、応の意味がない。</li><li><b>道学者の厳格さ。</b> 六二の「大人は否にして亨る」について、程伝は、道によらずに身が通るのは道がふさがることであり、身がふさがっても道が通るのが大人だ、と説く。本田は「この注には、程伊川の道学者らしい厳格さがよく現れている」と評する。</li><li><b>安くして危うきを忘れず。</b> 九五の程伝は繋辞伝を引く。「危うき者は其の位に安んずる者なり。亡ぶる者は其の存を保つ者なり。乱るる者は其の治を有つ者なり。是の故に君子は安くして危うきを忘れず、存して亡を忘れず、治まりて乱を忘れず。是を以て身安くして国家保つ可きなり」。</li></ul>\n<h3 id=\"g12-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>ふさがりの時。上下の気持ちが通じず、小人がはびこり、君子の道は行われない。</li><li>出世や高い禄を求めず、つつましく身を守り、難を避けよ。</li><li>仲間とともに節を守れば、身はふさがっても道は通る（初六・六二）。</li><li>上に取り入って身の利を図るのは小人の吉にすぎない。恥を蓄えるな（六三）。</li><li>何事も上の命によってなせば咎はない（九四）。</li><li>ふさがりがやんでも、「今に滅びるぞ」と油断なく備えよ（九五）。</li><li>ふさがりは永遠には続かない。極まれば必ず傾いて喜びに変わる（上九）。</li></ul><h2 class=\"sec\" id=\"g12-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">拔茅茹、以其彙。貞吉亨。</span></summary><div class=\"body\"><div class=\"yomi\">茅を抜くに茹たり。其の彙と以にす。貞なれば吉にして亨る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「拔茅貞吉、志在君也。」（茅を抜く貞なれば吉とは、志君に在るなり。）</div>\n<p>ちがやを引き抜くと、根でつながって仲間と一緒に抜ける。動機が正しければ吉で、願いは通る。</p>\n<p><span class=\"tag\">程伝</span>泰と否がともに茅を象とするのは、群陽・群陰がともに下にいて、根がつながる象があるからである。泰の時はともに征くことを吉とし、否の時はともに貞しくあることを亨るとする。彖伝では内が小人・外が君子を否の義としたが、ここではまた初六が否の時に下にいることを君子の道とする。易は時に従って義を取り、変動して一定しない。否の時に下にいる者が君子である。否の三陰はみな上に応があるが、ふさがって隔絶し通じない時なので、応の義はない。初六がその類（六二・六三）とともに節操を固く守れば、否に処する吉で、その道は通る。否の時に進もうとするのは小人で、君子は道を伸ばして禍を免れるだけである。君子の進退は必ず類とともにする。</p>\n<p><span class=\"tag\">象伝について程伝</span>爻辞は六が自ら下を守ることで君子の否に処する道を明らかにし、象伝はさらに推して君子の心を尽くした。君子が節を固く守って下にいるのは、進まず独善を楽しむのではない。道がふさがって進めないので、下に安んじるだけで、心は常に天下を救うことにある。その志は君を得て進み、天下を安らかにすることにある。だから「志君に在り」という。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ふさがりの時は仲間とともに節操を守れ。身は下にあっても、志を失わなければ道は通る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">包承。小人吉。大人否亨。</span></summary><div class=\"body\"><div class=\"yomi\">包承す。小人は吉。大人は否にして亨る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大人否亨、不亂羣也。」（大人は否にして亨るとは、群に乱れざるなり。）</div>\n<p>かねがね心に包んでいることは、ひたすら上の人の言うことに従おうということである。小人にとっては吉。大人物にとっては身のふさがりだが、道は通る。</p>\n<p><span class=\"tag\">程伝</span>六二は質は陰柔で、居る所は中正（下卦の中で、陰が偶数位）である。小人で言えば、下にふさがっていて、心に包み蓄えるのは、上に承順して否を救い、身の利を図ることだけである。これが小人の吉である。大人は否の時に道をもって身を処する。どうして自分を曲げ道を枉げて上に従おうか。ただ自らの否を守るだけで、身がふさがることがすなわち道が通ることである。ある人が「上下が交わらないのに何を承るのか」と問うた。答え：正しければふさがるが、小人が上に従おうとする心は、どんなふさがりの時にもなくなったことはない。</p>\n<p><span class=\"tag\">象伝について程伝</span>大人は否の時にも正しい節操を守り、小人の群れに乱されない。身はふさがっても道は通る。道によらずに身が通るのは、道がふさがることである。君子と言わず大人と言うのは、このようであれば、その道が本当に偉大だからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に取り入って身の利を図れば小人としては吉。だが大人物は節を曲げず、身はふさがっても道は通る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">包羞。</span></summary><div class=\"body\"><div class=\"yomi\">羞（はじ）を包む。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「包羞、位不當也。」（羞を包むとは、位当たらざればなり。）</div>\n<p>心に包み蓄えるのは恥ばかりである。</p>\n<p><span class=\"tag\">程伝</span>三は陰で中でも正でもなく否にいて、しかも上の陽に近い。道を守り命に安んずる者ではない。窮すれば斯（ここ）に濫（みだ）れる（『論語』衛霊公篇）。小人の情状を極めた者で、心に包み蓄えるのは邪悪なたくらみばかり。恥ずべきである。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰柔で否にいて、中正でない。恥ずべきなのは、居場所が不当だからである。居場所が不当で、することが道によらない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>窮して邪なたくらみを抱く。恥ずべき状態。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">有命无咎。疇離祉。</span></summary><div class=\"body\"><div class=\"yomi\">命有れば咎无し。疇（たぐい）、祉（さいわい）に離（つ）く。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有命无咎、志行也。」（命有れば咎无しとは、志行わるるなり。）</div>\n<p>君主から命じられてするなら咎はない。同類（四・五・上の陽）とともに幸いを受ける。</p>\n<p><span class=\"tag\">程伝</span>四は陽剛健体で、君に近い位にいる。否を救う才があり、高位を得た者で、否を救うに足りる。しかし君の道がふさがっている時に君のすぐそばにいる。恐れるのは、功を誇って人から忌まれることである。一挙一動が必ず君命から出て、権威が上に帰するようにすれば、咎がなく志が行われる。事をすべて君命から出させれば、時の否を救える。その類はみなその福祉に附く。離は麗で、つくこと（麗の原義は鹿の角が二本並んでいる様子）。君子の道が行われれば類とともに進んで天下の否を救う。小人が進む時も類とともにするのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>君の命があれば咎がなく、否を救うことができる。志が行われるのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才能があっても、手柄を自分のものにせず、すべて上の命によって行えば咎はなく、仲間とともに幸いを受ける。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">休否。大人吉。其亡其亡、繫于苞桑。</span></summary><div class=\"body\"><div class=\"yomi\">否を休む。大人の吉なり。其れ亡びなん、其れ亡びなんとて、苞桑（ほうそう）に繋る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大人之吉、位正當也。」（大人の吉なるは、位正に当たればなり。）</div>\n<p>天下のふさがりをやめさせる。大人物のめでたい時である。今に滅びるぞ、今に滅びるぞと言いながら、頑丈な桑の根にしっかりつなぎ止めるようにして、油断なく国家を保つべきである。</p>\n<p><span class=\"tag\">程伝</span>五は陽剛中正の徳で尊位にいる。だから天下の否を休息させることができる。大人の吉である。大人が位に当たれば、その道で天下の否を休息させ、泰へと導く。しかしまだ否を離れていないので、「其れ亡びなん」の戒めがある。否がやんで泰に返ろうとしても、すぐ安心してほしいままにしてはならない。深く慮り遠く戒め、常に否がまた来ることを恐れるべきである。安固の道は桑に縛りつけたようにすることで、桑は根が深く固く、苞は群がり生えることで、その固さは甚だしい。聖人の戒めは深い。漢の王允、唐の李徳裕はこの戒めを知らずに禍敗を招いた（後漢末に軍閥が対立した時、文官の王允は最も悪い将軍を他の将軍の力を借りて倒したが、自分も力を借りた相手に倒された。李徳裕は唐の武宗の宰相で、節度使の力を奪おうとして逆に倒された）。</p>\n<p><span class=\"tag\">象伝について程伝</span>大人の徳があって至尊の正位を得たので、天下の否を休めることができ、吉である。位がなければ、道があっても何ができよう。だから聖人は位を「大宝」と言う（繋辞伝「聖人の大宝を位と曰う」）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ふさがりを終わらせる力のある時。しかし油断は禁物。「今に滅びるぞ」と自らを戒め、基盤を固くせよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">傾否。先否後喜。</span></summary><div class=\"body\"><div class=\"yomi\">否を傾く。先には否がり、後には喜ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「否終則傾、何可長也。」（否終われば則ち傾く、何ぞ長かる可けんや。）</div>\n<p>ふさがりを傾けて、通じる状態に戻る。先にはふさがっていたが、最後には喜びがある。</p>\n<p><span class=\"tag\">程伝</span>上九は否の終わりである。物の理は極まれば必ず返る。泰が極まれば否になり、否が極まれば泰になる。上九は否がすでに極まったので、否の道が傾いて変わる。先に極まるのは否、後に傾くのが喜びで、否が傾けば泰になる。</p>\n<p><span class=\"tag\">象伝について程伝</span>否が終われば必ず傾く。いつまでもふさがったままの理があろうか。極まれば必ず返るのは理の常である。しかし危うきを安きに返し、乱を治に変えるには、必ず陽剛の才があってこそできる。だから否の上九は否を傾けることができるが、屯の上六は陰で力が弱く、屯を変えることができないのである（屯の上六には「乗馬班如たり。泣血漣如たり」という爻辞がついていた）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ふさがりの極み。ここから必ず傾いて、喜びに変わる。</div>\n<p class=\"note\"><i>本書『易經講座 上（一）』はここ、第二十四講の否の卦で終わる。続く同人以下は「（上）二」に収められている。</i></p></div></details><div class=\"pager\"><a href=\"#gua-11\">← 地天泰</a><a class=\"dis\">-</a></div>", "rei": "<h2 class=\"sec\">講座の実例</h2><p class=\"small dim\">講義の席で受講者が筮を立てた例と、講義で引かれた故事。出典の卦・総論へ移れます。</p><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-1\">乾為天</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-1\">乾為天</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-1\">乾為天</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-2\">坤為地</a><div class=\"rb\">**【故</div></div>", "find": "<h2 class=\"sec\">検索</h2><input id=\"q\" class=\"search\" type=\"search\" placeholder=\"例：虎の尾、乗馬班如、王安石\" aria-label=\"検索語\"><div class=\"count\" id=\"qc\"></div><div id=\"qr\"></div>"};
(function(){
var app=document.getElementById("app");
function txt(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent;}
var IDX=Object.keys(V).filter(function(k){return /^(gua|soron)-/.test(k);}).map(function(k){
  var d=document.createElement("div");d.innerHTML=V[k];
  var t=(d.querySelector(".ghead .nm")||d.querySelector("h2"));
  return {k:k,title:t?t.textContent:k,t:d.textContent};});
function tab(v){var t=v.split("-")[0];document.querySelectorAll("nav.tabs a").forEach(function(a){a.classList.toggle("on",a.dataset.t===t);});}
function show(){
  var v=(location.hash||"#home").slice(1);if(!V[v])v="home";
  app.innerHTML=V[v];tab(v);window.scrollTo(0,0);
  try{localStorage.setItem("koza-last",v);}catch(e){}
  app.querySelectorAll("[data-jump]").forEach(function(a){a.addEventListener("click",function(e){
    e.preventDefault();var n=v.split("-")[1];var id=a.dataset.jump==="yao"?"g"+n+"-yao":"g"+n+"-"+a.dataset.jump;
    var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});});
  if(v==="find")initFind();
}
function initFind(){
  var q=document.getElementById("q"),qc=document.getElementById("qc"),qr=document.getElementById("qr");
  function run(){var s=q.value.trim();qr.innerHTML="";if(!s){qc.textContent="";return;}
    var hits=0,h="";IDX.forEach(function(x){var i=x.t.indexOf(s),c=0,snip=[];
      while(i>=0&&c<50){c++;if(snip.length<3){var a=Math.max(0,i-30),b=Math.min(x.t.length,i+s.length+40);
        snip.push((a>0?"…":"")+esc(x.t.slice(a,i))+"<mark>"+esc(s)+"</mark>"+esc(x.t.slice(i+s.length,b))+"…");}
        i=x.t.indexOf(s,i+s.length);}
      if(c){hits+=c;h+='<a class="hit" href="#'+x.k+'"><b>'+esc(x.title)+'</b><span class="small dim">　'+c+'件</span>'+snip.map(function(z){return'<div class="sn">'+z+'</div>';}).join("")+"</a>";}});
    qc.textContent=hits?hits+"件見つかりました":"見つかりませんでした";qr.innerHTML=h;}
  q.addEventListener("input",run);
  try{var s=sessionStorage.getItem("koza-q");if(s){q.value=s;run();}}catch(e){}
  q.addEventListener("change",function(){try{sessionStorage.setItem("koza-q",q.value);}catch(e){}});
}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
var root=document.documentElement;
try{var th=localStorage.getItem("koza-theme");if(th)root.setAttribute("data-theme",th);}catch(e){}
document.getElementById("themebtn").addEventListener("click",function(){
  var cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  var nx=cur==="dark"?"light":"dark";root.setAttribute("data-theme",nx);try{localStorage.setItem("koza-theme",nx);}catch(e){}});
window.addEventListener("hashchange",show);
if(!location.hash){try{var l=localStorage.getItem("koza-last");if(l&&V[l])location.replace("#"+l);}catch(e){}}
show();
})();
</script>
