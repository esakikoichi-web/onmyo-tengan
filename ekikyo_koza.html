"body\"><div class=\"yomi\">咸じて臨む。吉にして利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「咸臨吉无不利、未順命也。」（咸じて臨む、吉にして利あらざる无しとは、未だ命に順わざるなり。）</div>\n<p>感応することで臨む。吉で、何の不利もない。初九も九二もいずれも陽で上に対応する陰がある（初は四、二は五）ので、同じ「咸じて臨む」の文句がついている。</p>\n<p><span class=\"tag\">程伝</span>二はまさに陽が伸びて漸く盛んになる時で、六五の中順の君を感動させる（上卦の坤には牝馬のシンボルがある）。上に交わることが親しいので信任され、その志を行うことができ、臨むところ吉で不利がない。「吉」は己にすでにそうなっていることで、「利あらざる无し」はこれから施す事において不利がないことである（本田：吉はすでに決定的な見通しのできる結果、不利なしは将来の予測）。</p>\n<p><span class=\"tag\">象伝について程伝</span>「未」は婉曲な否定の辞である（「程伝と本田の講説」参照）。二は五と感応して下に臨む。陽剛の徳が伸び、中を得て、至誠で五と感応しあうのであって、五の命に順うことから出たのではない。だから吉で不利がない。五は順体、二は説体で、陰陽が相応ずるので、象伝はわざわざ、説んで命に順うことによるのではないことを明らかにしたのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>命令に従うのではなく、互いの真心が感じ合って事が進む。吉で何事にも不利はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">甘臨。无攸利。既憂之、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">甘んじて臨む。利する攸无し。既に之を憂うれば、咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「甘臨、位不當也。既憂之、咎不長也。」（甘んじて臨むとは、位当らざればなり。既に之を憂う、咎長ぜざるなり。）</div>\n<p>甘い餌で相手を喜ばせて臨む。利はない。危険を恐れて憂えれば咎はない。</p>\n<p><span class=\"tag\">程伝</span>三は下卦の上にいる、人に臨む者である。陰柔で説体（兌）、しかも中正でない（陰が奇数位）。甘説で人に臨む者である。上にいて甘説で下に臨むのは、徳を失うことの甚だしいもので、利はない。兌の性はすでに説ぶうえ、二陽の上に乗っている。陽がまさに伸びて上進するので、不安になってますます甘くする。もし危うさを知って恐れ憂い、謙を持し正を守り、至誠で自ら処すれば咎はない。邪説は自分が招いたものだが、憂えて改めれば何の咎があろう。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰柔の人が中正でない所にいて、下卦の上にいて、また二陽に乗る。位が当たらないのである。危うさを恐れ憂えることを知れば、必ず強めて自ら改める。だから咎は長じない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>甘言・迎合で人を動かそうとしても利はない。立場の危うさを自覚して改めれば、咎はそれ以上大きくならない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">至臨。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">至りて臨む。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「至臨无咎、位當也。」（至りて臨む、咎无きは、位当ればなり。）</div>\n<p>最高の仕方で相手に臨む。咎はない。</p>\n<p><span class=\"tag\">程伝</span>四は上卦の下にいて下卦と比しく（隣り合い）、切に下に臨む。臨むことの至りである。臨む道は近さを尚ぶので、比を至りとする。四は正位にいて、下に剛陽の初に応ずる。君に近い位にいて、正を守り賢（初九）に任じ、親しく下に臨む。だから咎がない。居るところが当たっているからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>君に近い位にいるのは任を得たことである。陰で四にいるのは正を得たことである。初と応ずるのは賢に下ることである。咎がないゆえんは位が当たっていることにある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>下の者に親しく、身近に臨み、賢い部下に任せる。立場にかなっていて咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">知臨。大君之宜。吉。</span></summary><div class=\"body\"><div class=\"yomi\">知あって臨む。大君の宜なり。吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大君之宜、行中之謂也。」（大君の宜とは、中を行うの謂なり。）</div>\n<p>知恵をはたらかせて下々に臨む。これこそ偉大な君主にふさわしい仕方である。吉。</p>\n<p><span class=\"tag\">程伝</span>五は柔中・順体（坤）で尊位にいて、下の剛中の九二に応じ、よく任ずる者である。労せずして治まる。知をもって臨む者である。一人の身で天下の広さに臨み、自ら任ずれば、どうして万事に周ねくできよう。だから自らその知に任ずる者は、知らずとされるに足る。ただ天下の善を取り、天下の聡明に任ずれば周ねからないところはない。自分の知に任じないのが、その知の大なるところである。五は九二の剛中の賢に順応し、これに任じて下に臨む。明知で天下に臨む者で、大君の宜しきところである。その吉は知れている。</p>\n<p><span class=\"tag\">象伝について程伝</span>君臣の道が合うのは、気類が相求めるからである。五には中徳があるので、剛中の賢に倚任できる。大君の宜しきを得て、知臨の功を成すのは、その中徳を行うことによる。人君が賢才に対するのに、道が同じで徳が合うのでなければ、どうして用いられよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分一人の才覚に頼らず、優れた人に任せて臨む。上に立つ者として最上のやり方で吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">敦臨。吉无咎。</span></summary><div class=\"body\"><div class=\"yomi\">敦（あつ）く臨む。吉にして咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「敦臨之吉、志在内也。」（敦く臨むの吉なるは、志内に在ればなり。）</div>\n<p>下々に臨む態度が手厚い。吉で何の咎もない。</p>\n<p><span class=\"tag\">程伝</span>上六は坤の極、順の至りであり、臨の終わりにいる。敦く臨む者である。卦の中では初九・九二の二陽だけで、上の正応（本来は三）ではないが、陰が陽を求めるのは順の至りであり、その志は二陽に従うことにある。尊くして卑に応じ、高くして下に従い、賢を尊び善を取る。敦厚の至りである。だから「敦く臨む」という。吉で咎がないゆえんである。陰柔で上にいるのは、よく臨む者ではなく、咎があって当然だが、剛に順うことが厚いので、吉にして咎がない。六が臨の終わりにいても極の義を取らないのは、臨には過ぎるということがないからで、だからただ厚い義とする。上は位のない地で、ただ上にいることを言うだけである。</p>\n<p><span class=\"tag\">象伝について程伝</span>「志内に在り」とは、初・二に応ずることである。志が剛陽に順い、敦厚であるので、その吉は知れる（内は内卦の初九・九二）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高い地位にあってへりくだり、下の賢い者に手厚く従う。吉で咎はない。</div></div></details><div class=\"pager\"><a href=\"#gua-18\">← 山風蠱</a><a href=\"#gua-20\">風地観 →</a></div>", "gua-20": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 20 卦　第三十六講〜第三十七講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風地観</div><div class=\"yo\">ふうちかん</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-20\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-20\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-20\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-20\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-20\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-20\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-20\" data-jump=\"yao\">六爻</a></div><h3 id=\"g20-s0\">卦の名と象</h3>\n<p>臨の上下を転倒した形で、卦の意味は「よくよく見る、観察する」、また「仰ぎ見られる、示す」である。</p>\n<p>程伝（序卦伝を引く）：「臨とは大なり。物大にして然る後観る可し。故に之を受くるに観を以てす」。観が臨に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>物を観視するのは観（平声）であり、下に仰がれるのは観（去声）である。楼観を観というのは、下から仰がれるからである。人君は、上は天道を観、下は民俗を観る、これが観（平声）である。徳を修め政を行い、民に瞻仰されるのが観（去声）である。</li><li>風が地上を行き、あまねく万物に触れる。周覧（あまねく見て回る）の象である（平声）。</li><li>二陽が上にあり、四陰が下にある。陽剛が尊位にいて、群下に仰がれる。仰観の象である（去声）。</li><li>卦では仰がれる義を取り、爻では観見（見る）の義を取る。時に随って義をなすのである。</li></ul>\n<p>本田の講説：程伝の原文には一つ目の「観」の下に「平声」、二つ目の下に「去声」と注がある。古い中国語には平・上・去・入の四通りのアクセントがあり、平声は初めから終わりまで同じ高さ、去声は尻下がりに発音する。「みる」の時は平声、「みられる」「みせる」「しめす」の時は去声になる。昔の観兵式も、兵隊を見るのではなく兵力を示す意味である。卦の名や卦辞では去声、爻辞ではすべて平声で読む。この卦は陰気が下から上って陽気を侵食している形で、陽が一本になると剥という易の中で一番悪い卦になるが、観ではそういう不吉な意味に取らず、仰ぎ見るべき偉大なものが上にいる良い卦とする。</p>\n<h3 id=\"g20-s1\">卦辞</h3>\n<div class=\"orig\">觀、盥而不薦。有孚顒若。</div>\n<div class=\"yomi\">観は、盥（てあら）いて薦めず。孚有りて顒若（ぎょうじゃく）たり。</div>\n<p>天の祭りの時に、手を洗って鬱金草（チューリップ）をかもした酒を大地に注ぎ、まだ犠牲を捧げていない、祭りの初めの一番緊張している時である。そのように真心を尽くせば、下々も真心を尽くしてお上のしわざを見上げる。</p>\n<p><span class=\"tag\">程伝</span>私はこれを胡翼之先生（程伊川の師匠）から聞いた。「君子が上にいて天下の表儀となるには、必ずその荘敬を極めれば、下は観仰して化する。だから天下の観となるには、宗廟の祭りで始めて盥する時のようでなければならず、薦めた後のようであってはならない。そうすれば下民は至誠を尽くし、顒然として仰ぎ見る」と。盥とは、祭祀の始めに手を盥って鬱鬯（うっちょう）を地に注ぎ、神を求める時である。薦とは、腥（生肉）を献じ熟（煮た肉）を献ずる時である。盥は事の始めで、人心がその誠を尽くす厳粛の至りである。薦めた後になると、礼数が繁縟になって人心が散じ、精一さは始めて盥する時に及ばない。上にいる者はその表儀を正して下の観となり、荘厳であること始めて盥する初めのようで、誠意が少しでも散じて薦めた後のようであってはならない。そうすれば天下の人は誠を尽くし、顒然として瞻仰しない者はない。顒は仰ぎ望むことである。</p>\n<p>本田の講説：盥で酒の強い匂いを地に注ぐのは、神下ろしをするのである。薦めた後は人と人との酒のやり取りなど礼の手数が繁雑になるので、緊張が解ける。</p>\n<h3 id=\"g20-s2\">彖伝</h3>\n<div class=\"orig\">大觀在上、順而巽、中正以觀天下。觀盥而不薦、有孚顒若、下觀而化也。觀天之神道、而四時不忒。聖人以神道設教、而天下服矣。</div>\n<div class=\"yomi\">大観上に在り。順にして巽、中正以て天下に観らる。観は盥いて薦めず、孚有りて顒若たり、下観て化するなり。天の神道を観るに、四時忒（たが）わず。聖人神道を以て教えを設けて、天下服す。</div>\n<p>偉大なる仰ぎ見られるべきものが高いところに掛かっている。下の坤は順、上の巽はへりくだる。九五が中正で天下に仰がれる。本田によれば、この彖伝はなかなか力のこもった文章で、後世よく引かれる文句が出てくる。横山大観の号は「大観上に在り」から取った。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>五は陽剛中正の徳で下に観られる。その徳は甚だ大きい。だから「大観上に在り」という。下は坤、上は巽で、よく順でよく巽である。五は中正にいて、巽順中正の徳で天下に観られる。</li><li>観たる道が、厳敬であること始めて盥する時のようであれば、下民は至誠をもって瞻仰し、従って化する。「薦めず」とは、誠意を少しも散じさせないことである。</li><li>天道は至って神妙である。だから神道という。天の運行で四時が少しも狂わないのを観れば、その神妙さが見える。聖人は天道の神妙さを見て、神道を体して教えを設けた。だから天下で服さない者はない。天道は至って神妙なので、四時を運行し万物を化育して差（たが）いがない。至神の道は名づけようがない。ただ聖人は黙ってその妙用を体し、政教に設ける。だから天下の人はその徳に涵泳してその功を知らず、その化に鼓舞されてその用を測ることができず、自然に仰ぎ見て戴き服する。</li></ul>\n<p>本田の講説：王朝が仏教や道教を信奉して、神罰・仏罰で人民を脅かして服従させるような時に「神道設教」の四字をよく使うが、それは原文の意味から少しずれている。原文の「神道」は天の神秘性のことである。日本の神道も文字はここから借りたのだろうが、意味は異なる。</p>\n<h3 id=\"g20-s3\">大象</h3>\n<div class=\"orig\">風行地上、觀。先王以省方觀民設教。</div>\n<div class=\"yomi\">風、地上を行くは、観なり。先王以て方を省み、民を観て教えを設く。</div>\n<p>風が大地の上を行き過ぎる形である。風が草をなびかせるように、お上の威光が万民に行き届く。昔の王者はこれにのっとって四方を巡視し、民の風俗を見て教えを設けた。</p>\n<p><span class=\"tag\">程伝</span>風が地上を行けば、あまねく万物に及ぶ。周覧の象である。だから先王はこれを体して、方を省みる（巡省する）礼を作り、民俗を観て教えを設けた。天子は四方を巡省し、民俗を観視し、政教を設ける。民が奢れば倹約で示し、倹しければ礼で示すようなことである。「方を省みる」とは民を観ること、「教えを設く」とは民のために示すことである。</p>\n<p>本田の講説：『礼記』の規定によれば、天子は五年に一回天下を巡守する。民の風俗がけちけちしすぎて生産が上がらないような場合に礼を示すのは、礼にはお金がかかるからである。殷の時代には「方」の字を国の意味に用いることがあり、既済の九三に「高宗、鬼方を伐つ」とある（鬼方は鬼の住む国）。観という卦の名は、見る意味と示す意味の両方を含んでいる。</p>\n<h3 id=\"g20-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>爻の見え方の段階。</b> 九五が王様で、下の爻はみな九五を見上げている。初六は大変遠くから見るので子どものような幼稚な見方しかできず、六二は門の間からのぞき見るかすかな見方、六三はちょっとよそ見をして我が身を振り返り、六四は九五に一番近いので賓客として仕えて間近に見る。そこまで近づいてきたわけである（本田）。</li><li><b>「小人」の二義。</b> 初六の爻辞の「小人」は、徳のない者・位のない者の二義のうち後者、庶民のことである。</li><li><b>避諱の欠画。</b> 六三の講説で本田は、講義で使っている木版本では「貞」の字の最後の一画がないと指摘した。北宋の仁宗の本名が「禎」で、そのまま使うのが恐れ多いので最後の一画を略してある。</li><li><b>巻いて懐にする。</b> 六四の程伝：君子が才業を抱けば、自分を善くするだけでなく天下を善くしようと願う。才能を巻いて懐にしまい自らを守るのは（『論語』衛霊公篇「邦に道無ければ、則ち巻いて之を懐にす可し」）、明君がいなくて道を用いてくれる者がないので、やむをえずするのであり、君子の本心ではない。孟子も「天下に中して立ち、四海の民を定むるは、君子之を楽しむ」と言う（尽心篇）。本田は、この後に「しかし君子の本性はそこにはない」という意味の一句が続くのだが、具合が悪いので程伊川はそこまで引かない、と指摘する。程伝の「非常の遇」というそのままの言い方は古典に見つからないが、司馬相如の「蜀の父老を難ず」に「非常の人有りて、然る後に非常の事有り」という一文がある。</li></ul>\n<h3 id=\"g20-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>上に立つ者は、祭りの始めに手を清める時のような厳粛な誠を保てば、下々は仰ぎ見て感化される。</li><li>天の法則に沿った教えは、人に強いずとも自然に服される（彖伝）。</li><li>見識の狭い見方は、庶民なら咎はないが、立場ある者には恥（初六・六二）。</li><li>迷ったら自分のこれまでの生き方を見定めて進退を決めよ（六三）。</li><li>盛んな国の光を見たら、そこに仕えて力を尽くすがよい（六四）。</li><li>上に立つ者は、人々の様子を見て自分の行いの善し悪しを省みよ（九五）。地位を離れても人の手本として見られていることを忘れるな（上九）。</li></ul><h2 class=\"sec\" id=\"g20-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">童觀。小人无咎。君子吝。</span></summary><div class=\"body\"><div class=\"yomi\">童観す。小人は咎无し。君子は吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「初六童觀、小人道也。」（初六の童観するは、小人の道なり。）</div>\n<p>子どものような見方で物を見る。卦を立てた人が庶民なら咎はないが、身分のある人なら恥ずべきことである。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔の質で、陽（九五）から遠い所にいる。だから観見するところが浅く近く、童稚のようである。だから「童観」という。陽剛中正で上にいるのは聖賢の君である。これに近づけばその道徳の盛んなさまが見え、示すところは深遠である。初はこれから遠く、見るところが明らかでなく、童蒙の観るようである。小人は下民である。見るところが昏く浅く、君子の道を識ることができないのは常の分であり、過咎と言うには足りない。君子でこのようであれば、鄙吝すべきである。</p>\n<p><span class=\"tag\">象伝について程伝</span>観るところが明らかでなく童稚のようなのは、小人の分である。だから「小人の道」という。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>見方が浅く幼稚。一般の人なら差し支えないが、責任ある立場の人には恥。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">闚觀。利女貞。</span></summary><div class=\"body\"><div class=\"yomi\">闚観（きかん）す。女の貞に利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「闚觀女貞、亦可醜也。」（闚観する女の貞も、亦た醜ず可きなり。）</div>\n<p>門の間から外をのぞき見る。本田によれば、闚は門の間から見る、窺は穴の中から見ることである。女の生き方としては正しい。女性が卦を立ててこの爻を得たなら悪くはない。</p>\n<p><span class=\"tag\">程伝</span>二は五に応じて、五を観る。五の剛陽中正の道は、二の陰暗柔弱がよく観見できるものではない。だからただ闚観のようである。闚観は少しは見えても甚だしくは明らかでない。二は陽剛中正の道を明らかに見ることができず、その観は女子の貞のようである。見ることが甚だ明らかでなくても順従できるのは、女子の道であり、女子にあっては貞である。二は九五の道を明らかに見られないが、女子のように順従を保てば、中正を失わない（二は下卦の中で、陰が偶数位）。</p>\n<p><span class=\"tag\">象伝について程伝</span>君子が剛陽中正の大道を観見できず、わずかにその彷彿をのぞき見るだけなら、順従できても女子の貞と同じであり、やはり醜ずべきである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>物事をすき間からかすかにしか見られない。素直に従うのは女性の道としては正しいが、立場ある者がそれでは恥。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">觀我生進退。</span></summary><div class=\"body\"><div class=\"yomi\">我が生を観て、進退す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「觀我生進退、未失道也。」（我が生を観て進退す、未だ道を失せざるなり。）</div>\n<p>今までの自分の生き方を見定めて、進退を決めるべきである。</p>\n<p><span class=\"tag\">程伝</span>三は位が正しくない（陰が奇数位）が、順の極（下卦坤の一番上）にいる。時に順って進退できる者である。もし位に当たっていれば、進退に悩む義はない。「我が生を観る」とは、我の生ずるところ、すなわち動作施為で己から出るものをいう。その生ずるところを観て、宜しきに随って進退する。だから正しい位でなくても道を失うに至らない。宜しきに随って進退し、求めることが道を失わない。だから悔咎がない。時に順うことができるからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>己の生を観て進退するのは、宜しきに順うからで、まだ道を失うに至らない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の行いをよく省みて、進むか退くかを決めよ。時の流れに素直に従えば道を外れない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">觀國之光。利用賓于王。</span></summary><div class=\"body\"><div class=\"yomi\">国の光を観る。用て王に賓たるに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「觀國之光、尚賓也。」（国の光を観る、賓たらんと尚うなり。）</div>\n<p>一国の栄光を見る。王の賓客として礼遇される。本田によれば、「観光」の語はこの爻辞から出た。</p>\n<p><span class=\"tag\">程伝</span>観見は近いことより明らかなものはない。五は陽剛中正で尊位にいる、聖賢の君である。四は最も近くにいて、その道を観見する。だから「国の光を観る」という。国の盛徳光輝を観見するのである。人君の身を指して言わず「国」と言うのは、人君について言えば、その一身に行われるものだけを観るのではなく、天下の政化を観るべきだからである。そうすれば人君の道徳は見える。四は陰柔だが巽体にいて正にいる。切に五に近く、その道を観見する者である。聖明が上にいれば、才徳を懐く者はみな朝廷に進んで仕え、輔戴して天下を康済しようと願う。四は君の盛徳と国家の治化の光華盛美を観たのだから、王朝に賓として仕え、智力を尽くし、上はその君を輔け、下は天下に施すべきである。だから「用て王に賓たるに利あり」という。昔、賢徳のある人には人君は賓礼をもって待遇した。だから士が王朝に仕えるのを賓という。</p>\n<p><span class=\"tag\">象伝について程伝</span>君子が才業を抱けば、自分だけでなく天下を善くしようと願う。巻いて懐にする者がいるのは、明君がなくやむをえないのであって、君子の志ではない（「程伝と本田の講説」参照）。四はすでに国の盛徳光華を観見した。古人の言う非常の遇である。だから朝に進んで道を行おうと願う。「尚」は志が願い慕うことである。本田によれば、「尚」はここでは動詞で「こいねがう」意味。『墨子』の「尚賢」篇の尚は「たっとぶ」意味。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>優れた指導者・盛んな組織を間近に見る。そこに迎えられて力を尽くすのがよい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">觀我生。君子无咎。</span></summary><div class=\"body\"><div class=\"yomi\">我が生を観る。君子なるときは咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「觀我生、觀民也。」（我が生を観るとは、民を観るなり。）</div>\n<p>自分の平生の生き方をよくよく反省せよ。天下の人々がみな君子のようであれば咎はない。</p>\n<p><span class=\"tag\">程伝</span>九五は人君の位にいる。時の治乱、俗の美悪は己に繋がっている。己の生を観て、天下の俗がみな君子であれば、己の行った政化が善いのであり、咎はない。天下がまだ君子の道に合わなければ、己の政治がまだ善くないのであり、咎を免れない。</p>\n<p><span class=\"tag\">象伝について程伝</span>我が生は己から出るものである。人君が自分の施為の善否を観ようとすれば、民を観るべきである。民俗が善ければ政化は善い。王弼が「民を観て以て己の道を察す」と言うのがそれである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者は、周囲の人々の様子に自分の行いの結果が表れる。皆が立派なら咎はなく、そうでなければ自分を改めよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">觀其生。君子无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の生を観る。君子なるときは咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「觀其生、志未平也。」（其の生を観る、志未だ平らかならざるなり。）</div>\n<p>人民が上九の生き方を見る。その生き方が君子のようであれば咎はない。本田によれば、六三と九五は「我が生を観る」だったが、上九は「其の生を観る」で、九五は君主が自分の生き方を見るのに対し、上九は人民が上九の生き方を見る。</p>\n<p><span class=\"tag\">程伝</span>上九は陽剛の徳で最上にいて、下に観られるが、位（実権）に当たっていない。賢人君子が位にいないが、天下に観仰される者である（本田：世捨て人や引退した人）。「其の生を観る」とは、その生ずるところ、すなわち己から出る徳業行義を観ることである。すでに天下に観仰されているのだから、自らその生ずるところを観るべきである。みな君子であれば過咎はない。まだ君子でなければ、どうして人に観仰矜式させられよう。それはその咎である。</p>\n<p><span class=\"tag\">象伝について程伝</span>位にいなくても、人はその徳を観て法とするので、自ら慎み省みて、その生ずるところを観るべきである。常に君子であることを失わなければ、人は望みを失わず感化される。位にいないからといって安然として意を用いるところなくいてはならない。その志はまだ安んずることができない。だから「志未だ平らかならず」という。平は安寧のことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>地位を離れていても、人々の手本として見られている。気を緩めず、自分の行いを常に省みれば咎はない。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>陳の敬仲の子孫（『左伝』）</div><div class=\"rb\">陳の国の貴族の敬仲が易者に見てもらったところ、観の卦が出た。易者は、「あなたは陳に代わって国を取るだろう。しかし陳ではなくよその国で、それも自分自身ではなく子孫の代に君主になるだろう」と言った。卦の下半分が土なので国土を所有でき、上半分が風なので、風が物を運ぶようによその国に流浪してそこで国土を得る、というのである。実際この人の子孫は、三百年後に斉の国で姓を変えて田氏となり、斉の実権を握った。本田は、占いの時点が紀元前六〇〇年代、田氏が実権を握るのが紀元前三〇〇年代なので、『左伝』は当たった時点で遡ってこういう話を加えたと考えられる、『左伝』の中の占いはほぼ全部当たっているが、ただ一つ、周王朝が七百年続くと占ったものは、実際には八百年以上続いたので当たっておらず、だから『左伝』は周が滅びる少し前に書かれたと考えられる、と述べた。</div></div><div class=\"pager\"><a href=\"#gua-19\">← 地沢臨</a><a href=\"#gua-21\">火雷噬嗑 →</a></div>", "gua-21": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 21 卦　第三十七講〜第三十九講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">火雷噬嗑</div><div class=\"yo\">からいぜいごう</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-21\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-21\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-21\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-21\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-21\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-21\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-21\" data-jump=\"yao\">六爻</a></div><h3 id=\"g21-s0\">卦の名と象</h3>\n<p>噬は噛む、嗑は口を合わせる、二つで噛み合わせるという意味になる。本田によれば、これは大変おもしろい卦で、顎を意味する頤（☶☳、口の中に歯が四本入った形で、中の四つの陰が歯）の、歯の間に陽が一本入った形が噬嗑である。顎の中に邪魔物が一本入っていて、それを噛み切って初めて口を閉じることができる。そこから、国家秩序にとっての邪魔物を噛み切る、刑罰を用いるという意味になる。</p>\n<p>程伝（序卦伝を引く）：「観る可くして然る後合う所有り。故に之を受くるに噬嗑を以てす。嗑とは合なり」。観るべきものがあって初めて来て合する者がある。噬嗑が観に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>噬は齧（かむ）、嗑は合である。口の中に物があって隔てている。噛んで初めて合う。卦は上下が二つの剛で、中は柔である。外が剛で中が虚なのは人の頤（あご）の象である。中の虚の中にまた一つの剛があるのは、頤の中に物がある象である。口の中に物があれば上下を隔てて嗑うことができない。必ず噛めば嗑うことができる。だから噬嗑とする。</li><li>聖人は卦の象を天下の事に推した。口にあっては物が隔てて合わないこと、天下にあっては強梗（強くて君の権力をふさぐ家来）や讒邪（あることないことを言い立てる家来）が間を隔てることである。だから天下の事が合わない。刑法を用いるべきで、小さければ懲戒し、大きければ誅戮して除去すれば、天下の治は成る。天下から一国一家、万事に至るまで、和合しないのはみな間があるからで、間がなければ合う。天地が物を生じ万物が遂げられるのも、みな合して後に遂げられる。君臣・父子・親戚・朋友の間に離貳怨隙があるのは、讒邪が間に入るからで、これを除去すれば和合する。だから間隔は天下の大害である。噬嗑は天下を治める大用であり、天下の間を去るのは刑罰に任ずることにある。だから卦は刑を用いる義を取る。二体（上卦と下卦）で言えば、明照（離）と威震（震）で、刑を用いる象である。</li></ul>\n<p>本田の講説：平凡な儒家の考え方では、法律はいかん、とにかく徳で感化しなければならんということで刑罰を軽く見るが、『易経』の中ではそんなことは一切言わない。刑罰は刑罰で必要だということをはっきり言う。序卦伝は観の後に噬嗑が来る理由を説明するために、噬嗑を噛み合わせるではなく合体する意味で用いていて、多少苦しい解釈である。</p>\n<h3 id=\"g21-s1\">卦辞</h3>\n<div class=\"orig\">噬嗑、亨。利用獄。</div>\n<div class=\"yomi\">噬嗑は亨る。獄を用うるに利あり。</div>\n<p>この卦が出れば願いごとはすんなりと通る。裁判を行ってよい。「獄」は裁判のこと（監獄の意味にも用いる）。本田によれば、易にはほかに訟という卦もあり、易では裁判や刑罰を道徳に劣るものとは見ていない。木版本では「亨」は「享」とよく混同するが、コウとキョウで音が違う。</p>\n<p><span class=\"tag\">程伝</span>「噬嗑は亨る」とは、卦自体に亨る義がある（本田：上が知恵、下が威光の卦だから、すんなり通るはず）。天下の事が亨らないのは、間があるからである。噛んでこれを嗑わせれば亨通する。「獄を用うるに利あり」とは、噬嗑の道は獄を用いるのに宜しいということである。天下の間は、刑獄でなければ何で去れよう。「刑を用うるに利あり」と言わずに「獄を用うるに利あり」と言うのは、卦に明照の象があり、獄を察するのに利があるからである。獄とは情（真実）を究めるためのものである。その情を得れば、間をなすものの所以がわかる。そうして初めて防ぎを設け刑を施すことができる。</p>\n<p>本田の講説：「情実」という熟語は、日本語では裏口から物を頼むような悪い意味になるが、漢語では悪い意味ではない。「情」に「実」の意味がある。</p>\n<h3 id=\"g21-s2\">彖伝</h3>\n<div class=\"orig\">頤中有物、曰噬嗑。噬嗑而亨。剛柔分、動而明、雷電合而章。柔得中而上行、雖不當位、利用獄也。</div>\n<div class=\"yomi\">頤中に物有るを噬嗑と曰う。噬嗑して亨る。剛柔分かつ。動きて明らかなり。雷電合して章らかなり。柔、中を得て上り行く。位に当らずと雖も、獄を用うるに利あるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>頤の中に物があるので噬嗑という。物が頤中にあれば害となる。噬嗑すればその害は亡び、亨通する。だから「噬嗑して亨る」という。</li><li>卦の才で言う。剛爻と柔爻が相間（互い違い）になり、剛柔が分かれて雑じらない。明弁の象である。明弁は獄を察する本である。「動きて明らか」とは、下は震、上は離で、動いて明らかなことである。「雷電合して章らか」とは、雷が震い電が輝き、相待って並び現れ、合して章らかなことである。照（明らかさ）と威が並び行われるのが獄を用いる道である。よく照らせば情を隠すところがなく、威があれば敢えて畏れない者はない。上で二象から「動きて明らか」を言ったので、さらに威と照を並べ用いる意味を言った。</li><li>六五は柔で中にいる。柔を用いて中を得る義である。「上り行く」とはその尊位にいることを言う。「位に当らずと雖も」とは、柔で五にいるのは当たらないことである。しかし獄を用いるのに利があるのは、獄を治める道は、全く剛であれば厳暴に傷つき、柔に過ぎれば寛縦に失するからである。五は獄を用いる主で、柔で剛の位にいて中を得ており、獄を用いる宜しきを得ている。ある人が問う。柔で剛にいるのが獄を用いるのに利があるなら、剛で柔にいる場合はどうか。答え：剛柔は質であり、居（位）は用である。用が柔なのは獄を用いる宜しきではない（本田：柔らかい人がしっかりした地位にいる方がよく、足場の方が柔らかいのはよろしくない）。</li></ul>\n<h3 id=\"g21-s3\">大象</h3>\n<div class=\"orig\">雷電噬嗑。先王以明罰勅法。</div>\n<div class=\"yomi\">雷電あるは噬嗑なり。先王以て罰を明らかにし法を勅（ととの）う。</div>\n<p>雷と稲妻が一緒に降りかかってくる形が噬嗑である。昔の聖王はこれにのっとって、罰を明らかにし、法律を整備した。</p>\n<p><span class=\"tag\">程伝</span>象には倒置するものはない（上卦を先に、下卦を後に言うのが普通である）。疑うらくはこの文は互（入れ替わり）で、「電雷」とすべきであろう。雷電は相待って並び現れるもので、また噬嗑の象もある。電は明るく、雷は威がある。先王は雷電の象を観て、その明と威にのっとり、刑罰を明らかにし、法令を勅えた。法とは事理を明らかにして防ぎをなすものである。</p>\n<h3 id=\"g21-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>刑罰を受ける爻と行う爻。</b> 初九の程伝：初と上には位がなく、刑罰を受ける人とする。残りの四爻はみな刑罰を用いる人である。初は最下で位のない者、上は尊位の上を過ぎてやはり位のない者である。王弼は「初と上には陰陽の位がない」と言うが（王弼の易注の冒頭「略例」。本田：易の具体的な解釈例を説明したもので、なかなか気が利いている）、陰陽は奇偶にかかわるものなので、陰陽の位がないとは言えない。諸卦で初と上について位に当たる当たらないを言わないのは、事の始終の義が大きいからである。ただ臨の初九は「志正を行う」と位を正としている。需の上六の「位に当らず」、乾の上九の「位无し」は爵位の位であって陰陽の位ではない。</li><li><b>邪魔物の位置の九四がなぜ良いか。</b> 受講者が「九四は頤の中に入った邪魔物に当たるはずなのに、どうしてこれが一番良いのですか」と問うた。本田は、卦の成り立ちを説明する場合は九四が邪魔物の位置に当たるが、一旦卦ができてしまえば、九四は卦の中でかなり高い地位にあるので刑罰を受ける者ということにはならない、刑罰を受けるのは位のない者でなければならないから、初と上が刑罰を受ける者とされる、と答えた。</li><li><b>陰陽と奇偶。</b> 受講者が「奇数が陽で偶数が陰というのは、もともとどうしてそうなったのですか」と問うた。本田は、陽を一、陰を二つに割れた形でシンボル化してから、そうなったのではないか、郭沫若などは一は男性器、割れた形は女性器の象徴だと言っていて、郭沫若はそういうふうに考えたがる、ともかく奇数・偶数だからシンボル化したわけではなく、たまたまシンボルを作ったら奇数・偶数を連想させる形になったと考えられる、と答えた。</li><li><b>酷刑。</b> 噛みつくというのは刑罰のシンボルで、噛むという刑罰があるわけではない。実際に存在した一番苛酷な刑罰に、「骨」の字から「月（肉）」を取った字（冎）で表されるものがあり、文字通り骨から肉を削ぎ落とし、最後は骨だけにしてしまう（本田）。</li><li><b>積悪。</b> 上九の程伝は繋辞伝下を引く。本田はその全文「善積まざれば以て名を成すに足らず。悪積まざれば以て身を滅ぼすに足らず。小人は小善を以て益无しと為して為さざるなり。小悪を以て傷る无しと為して去らざるなり。故に悪積みて掩う可からず、罪大にして解く可からず」を紹介する。</li></ul>\n<h3 id=\"g21-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>間を隔てる邪魔物を噛み切れば、物事はすんなり通る。裁判・刑罰を行ってよい。</li><li>刑罰は明らかさ（真相の究明）と威厳を兼ね、厳しすぎず緩すぎず、中を得て行え。</li><li>小さな過ちのうちに懲らしめれば、大きな悪に進まずに済む（初九）。</li><li>自分の立場が不相応なのに人を裁けば、反発されて恥をかく（六三）。</li><li>困難な相手には、事の難しさを自覚して正しさを固く守れば吉（九四・六五）。</li><li>人の忠告を聞かず悪を積み重ねれば、ついには解けない罪となる。凶（上九）。</li></ul><h2 class=\"sec\" id=\"g21-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">屨校滅趾。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">校（かせ）を屨（は）いて趾を滅（やぶ）る。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「屨校滅趾、不行也。」（校を屨いて趾を滅るは、行かしめざるなり。）</div>\n<p>足枷をはめられて、足首から下をつぶしてしまった。結果的に咎はない。本田によれば、「趾」は足の指に限定して使うこともあるが、原義は足首から下の部分。</p>\n<p><span class=\"tag\">程伝</span>九は初にいて、最も下で位のない者である。下民の象であり、刑を受ける者である。刑を用いる始めに当たり、罪は小さく刑は軽い。校は木の械（かせ）である（校の字の原義）。過ちが小さいので、足に校をはめてその趾を滅傷する。人に小さな過ちがあり、校でその趾を滅すれば、懲りて恐れ、敢えて悪に進まないはずである。だから咎がないのである。繋辞伝に「小しく懲らして大いに誡む。此れ小人の福なり」とあるのは、小さく初めに懲らすので、後に咎がないということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>校を屨いて趾を滅傷すれば、懲戒を知って敢えて悪を長じない。だから「行かしめず」という。古人が刑を制するのに、小罪には趾に校したのは、その行を禁止し、悪に進ませない意味を取ったのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>小さな過ちのうちに軽く罰せられる。懲りて改めれば、かえって咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">噬膚滅鼻。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">膚を噬んで鼻を滅（つく）す。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「噬膚滅鼻、乘剛也。」（膚を噬んで鼻を滅すは、剛に乗ればなり。）</div>\n<p>柔らかい肉を深々と噛んで鼻が肉にめり込む。咎はない。本田によれば、「膚」は皮膚の下の皮下脂肪で肉の一番柔らかい部分。「滅」の原義は火が消えることで、見えない・なくなる意味になり、ここは鼻が見えなくなる意味で「つくす」と読む。</p>\n<p><span class=\"tag\">程伝</span>二は五に応ずる位で、刑を用いる者である（本田：五が君主で、位が上になるほど君主に近づく。二は士ぐらい）。四爻はみな噬むことを義とする。二は中正の位にいて、刑を用いることが中正を得ている。刑を用いることが中正を得ていれば、罪悪の者は服しやすい。だから膚を噬むことを象とする。人の膚を噬めば深く入りやすい。滅は没（めりこむ）ことで、深く入ってその鼻が没するに至る。二は中正で刑を用いるので服しやすいが、初の剛に乗っている。これは強剛の人に刑を用いることである。強剛の人を刑するには、必ず深く痛ませるべきである。だから鼻を滅すに至っても咎がない。中正の道が人を服させやすいことと、厳刑で剛強に対処することは、義が相妨げない。</p>\n<p><span class=\"tag\">象伝について程伝</span>深く鼻を滅すに至るのは、剛に乗るからである。剛に乗るとは強剛の人に刑を用いることで、深厳にならざるをえない。深厳であることが宜しきを得ている、いわゆる中である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>強情な相手には厳しく深く当たらざるをえない。中正を守っていれば、厳しくしても咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">噬腊肉遇毒。小吝。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">腊肉（せきにく）を噬んで毒に遇う。小しく吝なれど、咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「遇毒、位不當也。」（毒に遇うは、位当らざればなり。）</div>\n<p>干し肉を噛んで毒に当たる。「腊肉」は小動物を丸のまま干し肉にしたもの。少し恥をかくが、大きな咎はない。</p>\n<p><span class=\"tag\">程伝</span>三は下卦の上にいる、刑を用いる者である（本田：大夫くらいの身分）。六が三にいるのは位に当たらない。自ら処するのに当を得ずに人を刑すれば、人は服さず、怨み恨んでこれに悖り犯す。乾腊（干し肉）の堅韌なものを噛んで、毒悪の味に遇い、かえって口を傷つけるようなものである。刑を用いて人が服さず、かえって怨傷を致すのは、鄙吝すべきである。しかし噬嗑の時に当たり、大要は間を噛んで嗑わせることである。身の処し方が当たらず、強梗が服しがたく、毒に遇うに至っても、刑を用いること自体が当たらないのではない。だから吝ではあるが小さく、噛んで嗑わせることに咎があるのではない。</p>\n<p>本田の講説：「梗」は「骾」と同じ意味で、背骨が固い。「硬骨」も本当は「骾骨」と書くのが正しい。</p>\n<p><span class=\"tag\">象伝について程伝</span>六三は陰で陽の位にいる、処するところが当たらない。自ら処するのが当たらないので、刑するところの者が服しがたく、かえってこちらに毒する。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の立場が不相応なまま人を裁こうとすれば、相手が反発してこちらが傷つく。少し恥をかくが、事そのものは間違っていない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">噬乾胏、得金矢。利艱貞。吉。</span></summary><div class=\"body\"><div class=\"yomi\">乾胏（かんし）を噬んで、金矢を得たり。艱貞に利あり。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「利艱貞吉、未光也。」（艱貞に利あり、吉とは、未だ光（おお）いならざるなり。）</div>\n<p>骨付きの干し肉を噛んで、金の矢を噛み当てた。獲物の肉の中に狩りの時の矢尻が残っていたのである。殷周時代の古典では「金」は青銅をさすことが多い。困難を自覚しつつ正しさを守るがよい。吉。</p>\n<p><span class=\"tag\">程伝</span>九四は君に近い位にいて、噬嗑の任に当たる者である。四はすでに卦の中を過ぎ、間がますます大きく、刑を用いることもますます深い。だから「乾胏を噬む」という。胏は骨のある肉で、乾肉で骨を兼ね、至って堅く噛みがたい。至って堅いものを噛んで金矢を得た。金は剛、矢は直を取る。四は陽徳で剛直であり、剛直の道を得ている。剛直の道を用いても、利は艱難を知って守りを貞固にすることにある。四は剛明（離体）だが、体は陽で位は柔である。剛明であれば果断に傷つくので、艱難を知れと戒める。居が柔であれば守りが固くないので、堅貞を戒める。剛で貞でない者はいる。およそ剛に失敗する者はみな貞でないからである。噬嗑においては四が最も善い。</p>\n<p><span class=\"tag\">象伝について程伝</span>およそ「未だ光いならず」と言うのは、その道がまだ光大でないことである（本田：「光」は「広」と同音で意味も通じる。兌の上六にもまったく同じ言い方がある）。艱貞に利ありと戒めるのは、その足りないところがあるからで、中正を得ていないからである（上卦の中でなく、陽が偶数位）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>手ごわい相手・難事に当たるが、強く真っ直ぐな力で突破できる。困難を自覚して正しさを固く守れば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">噬乾肉得黄金。貞厲无咎。</span></summary><div class=\"body\"><div class=\"yomi\">乾肉を噬んで黄金を得たり。貞厲なれば咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「貞厲无咎、得當也。」（貞厲なれば咎无しとは、当を得ればなり。）</div>\n<p>干し肉を噛んで黄金を噛み当てた。乾肉には骨がなく、九四の乾胏ほど堅くはない。易の本文の「黄金」はゴールドとは限らず、青銅のこともある。高価な貴金属を噛み当てたということ。困難を自覚して自ら危ぶめば咎はない。</p>\n<p><span class=\"tag\">程伝</span>五は卦の中で高い位にいるので乾肉を噬むとする。かえって四の乾胏より噛みやすいのは、五は尊位にいて、上にある勢いに乗じて下を刑するので、その勢いが易しいからである。しかし卦においてはまさに極まろうとしていて、その間は甚だ大きく、嗑わせやすいわけではない。だから乾肉を噬むとする。「黄金を得たり」とは、黄は中の色、金は剛の物である。五は中にいて中道を得ており、剛（の位）に処して、四が剛で助ける。黄金を得るのである。五には応がない（二も陰で引き合わない）が、四が大臣の位にいてその助けを得る。「貞厲なれば咎无し」とは、六五は中に処し剛の位にいるが、実は柔体である。だから必ず正を守り危懼を懐くよう戒める。そうすれば咎がない。柔で尊位にいて噬嗑の時に当たるので、貞厲を戒めるべきである。</p>\n<p>本田の講説：黄は五行に当てはめれば土で、土は方角で言えば中央である。</p>\n<p><span class=\"tag\">象伝について程伝</span>咎がないゆえんは、なすところが当を得ているからである。当とは、中に居て剛を用い（九四の助け）、正を守り危うさを慮ることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>高い地位の勢いで事を処理でき、良い助けも得られる。ただし自分の弱さを自覚し、正しさを守り危ぶむ心を持てば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">何校滅耳。凶。</span></summary><div class=\"body\"><div class=\"yomi\">校を何（にな）いて耳を滅る。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「何校滅耳、聰不明也。」（校を何いて耳を滅るは、聡明らかならざるなり。）</div>\n<p>首枷を肩に載せられ、枷で耳がつぶれる。凶。「何」は「荷」と同じ意味。</p>\n<p><span class=\"tag\">程伝</span>上は尊位を過ぎた、位のない者である。だから刑を受ける者とする。卦の終わりにいて、その間は大きく、噛まれることの極みである。繋辞伝の「悪積みて掩う可からず、罪大にして解く可からず」である。だから校を何って耳を滅る。その凶は知れている。何は負うことで、首に校を負うのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>人の聡（聴く能力）が昏く悟らず、罪悪を積んで極に至る。古人が法を制するのに、罪の大きい者には校を何わせた。その聞くところがなく、ついにその悪を成したので、校でその耳を滅傷し、聴くことの明らかでないことを誡めたのである。本田によれば、もともと「明」は目がよく見える意味だが、ここでは「聡」の程度を説明するのに「明」の字を用いている。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人の忠告に耳を貸さず、悪を積み重ねた末に重い罰を受ける。凶。</div></div></details><div class=\"pager\"><a href=\"#gua-20\">← 風地観</a><a href=\"#gua-22\">山火賁 →</a></div>", "gua-22": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 22 卦　第三十九講〜第四十一講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山火賁</div><div class=\"yo\">さんかひ</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-22\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-22\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-22\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-22\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-22\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-22\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-22\" data-jump=\"yao\">六爻</a></div><h3 id=\"g22-s0\">卦の名と象</h3>\n<p>賁は「かざる」の意味である。山の下に火が燃えていて、火が下から山全体を照らしている。</p>\n<p>程伝（序卦伝を引く）：「嗑とは合なり。物は以て苟合して已む可からず。故に之を受くるに賁を以てす。賁とは飾りなり」。物が合えば必ず文（あや）がある。文とは飾りである。人が合い聚まれば威儀上下があり、物が合い聚まれば次序行列があるように、合えば必ず文がある。賁が噬嗑に次ぐゆえんである。卦は山の下に火がある。山は草木百物の聚まるところである。下に火があれば、その上を照らし、草木品彙（さまざまな物）がみなその光彩を被る。賁飾の象があるので賁とする。</p>\n<p>本田の講説：「文」は模様の意味でも用いる。「天文」は天の中の模様、「地理」は大地に通っている筋目で、「理」はもともと玉の中の筋目のこと。「彙」はもともとハリネズミのことだが、ハリネズミの針のように一か所に集まる意味で用いられる。</p>\n<h3 id=\"g22-s1\">卦辞</h3>\n<div class=\"orig\">賁、亨。小利有攸往。</div>\n<div class=\"yomi\">賁は亨る。小しく往く有るに利あり。</div>\n<p>この卦が出れば願いごとは通る。少しは前進してよい。</p>\n<p><span class=\"tag\">程伝</span>物は飾りがあって初めて亨る。だから「忠信は礼の本、義理は礼の文。本無ければ立たず、文無ければ行われず」と言う（本田：『礼記』礼器篇の文）。実があって飾りを加えれば亨る。文飾の道は、その光彩を増すことができる。だから前進するのによい（本田：ただし飾りはあくまでも飾りで、実質そのものではない）。</p>\n<h3 id=\"g22-s2\">彖伝</h3>\n<div class=\"orig\">賁亨、柔來而文剛、故亨。分剛上而文柔、故小利有攸往。天文也。文明以止、人文也。觀乎天文以察時變、觀乎人文以化成天下。</div>\n<div class=\"yomi\">賁は亨る。柔来りて剛を文る、故に亨る。剛を分かち上りて柔を文る、故に小しく往く有るに利あり。天文なり。文明以て止まるは、人文なり。天文を観て以て時変を察し、人文を観て以て天下を化成す。</div>\n<p>本田によれば、「人文」という言葉はここが出典である。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦は飾りの象である。上下二体の剛柔が交わるのを文飾とする。下体はもと乾で、柔が来てその中を文って離となった。上体はもと坤で、剛が行ってその上を文って艮となった。明（離）で止まる（艮）、文明に止まって賁となる。天下の事は飾りがなければ行われない。だから賁は亨ることができる。柔が来て剛を文るので亨る。文明の象となる。文明は賁をなすゆえんで、賁の道はよく亨ることを致す。実（まこと）に飾りによって亨るのである（本田：この「実」は副詞「まことに」とも、実質の「ジツ」とも読めるが、ここは副詞で読むのがよい）。剛の中を分かち、上って艮の上を文るので、小しく往く有るに利がある。事は飾りによって光彩を加え、飾りによって行われる。だから小しく往く有るに利がある。進んで利があるのは本があるからで、飾りは実を増すものではなく、ただ文采を加えるだけである。事は文によって顕盛になるので、小しく往くに利ありとする。亨るとは亨通、往くとは一歩加えて進むことである。乾坤の二卦が変じてともに賁の文を成したが、彖伝が上下を分けて言うのは、離の明だけでも亨るに足り、剛が柔を文るのもまた小しく進むことができるからである。</li><li>「天文なり。文明以て止まるは人文なり」は上の文を受けて言う。陰陽剛柔が相文るのは天の文である（本田：天体の交錯や星座の回転）。文明に止まるのは人の文である。質があれば必ず文がある。自然の理である。理には必ず対があり、それが生生の本である。上があれば下があり、これがあればあれがあり、質があれば文がある。一は独立せず、二なれば文となる。道を知る者でなければ、誰がこれを語れよう。天文とは天の理、人文とは人の道である。</li><li>天文とは日月星辰の錯列、寒暑陰陽の代変で、その運行を観て四時の遷改を察する。人文とは人理の倫序で、人文を観て天下を教化すれば、天下はその礼俗を成す。聖人が賁の道を用いるのである。</li><li>卦の成り立ちの原則：卦には、二体の義と二象で成るもの（屯は「険中に動く」と「雲雷」、訟は「上剛下険」と「天水違行」）、一爻を取るもの（小畜は柔が位を得て上下が応ずる、大有は柔が尊位を得て大中で上下が応ずる）、二体と消長の義を取るもの（雷が地中にある復、山が地に附く剥）、二象と二爻の交変を取るもの（風雷益は上を損じ下を益す、山下に沢ある損は下を損じ上を益す）、二象で卦を成しさらに主爻を取るもの（沢が天上にある夬、天の下に風ある姤）、卦の才（はたらき）で成るもの（木を水に入れて水を上げる井、木の上に火がある鼎）、卦の形を象とするもの（山の下に雷のある頤、頤中に物がある噬嗑）がある。これらは卦を成す由来である。</li><li>「剛上り柔下る」「上を損し下を益す」とは、剛が上にいて柔が下にいること、上で損じ下で益すことを言うのであって、一卦の中で爻が昇降するのではない。訟・無妄に「剛来る」と言うのも上体から来るのではない。柔で五にいる者を「進みて上り行く」と言うのは、柔は下にあるべきものなのに尊位にいるからで、下体から上るのではない。</li><li>卦の変はみな乾坤から来る。先儒（漢代の易学者）はこれを理解せず、賁はもと泰であったと言う（泰の二と上が入れ替わった）。しかし泰はすでに乾坤が重なってできた卦で、泰からまた変ずる理があろうか。下の離はもと乾の中爻が変じたもの、上の艮はもと坤の上爻が変じたもの。離が内にあるので「来る」と言い、艮が上にあるので「上る」と言うのであって、下から上るのではない。乾坤が変じて六子となり、八卦が重なって六十四卦となる。みな乾坤から変ずるのである。</li></ul>\n<p>本田の講説：易学には卦変という概念があり、程伊川もこれを用いるが、必ず乾坤の二卦からの変化として説明するのが独特である。漢易では下が乾・上が坤の泰から、乾の真ん中の陽と坤の一番上の陰が入れ替わってこの卦の形になったと考え、彖伝に「来る」「上る」とある以上、注釈者はいろいろ爻を上げたり下げたりしたくなるが、程伊川は泰から賁になったとは言わない。卦の成り立ちの一番基本的な所に戻って、そこから原則を立てようとしている。</p>\n<h3 id=\"g22-s3\">大象</h3>\n<div class=\"orig\">山下有火、賁。君子以明庶政、无敢折獄。</div>\n<div class=\"yomi\">山の下に火有るは賁なり。君子以て庶政を明らかにし、敢えて獄を折（さだ）むる无し。</div>\n<p>山の下に火が燃え、山全体をあかあかと照らし出している。君子はこれにかたどって、もろもろの政策を明らかにする。といって、裁判の判決を下すのに思い切りがよすぎてはならない。本田によれば、「獄を折む」は『論語』で子路を「片言以て獄を折むる者は、其れ由なるか」と批評した文句にある。</p>\n<p><span class=\"tag\">程伝</span>山は草木百物の聚まり生ずるところである。火がその下にあって上を照らせば、みなその光明を被る。賁飾の象である。君子は山の下に火があり明照する象を観て、その庶政を修め明らかにし、文明の治を成す。しかし獄を折むることについては、敢えて果断にはしない。獄を折むるのは人君の慎むべきところで、その明を恃んで軽々しく自ら用いてよいものではない。聖人の用心はこのように深い。象の取るところはただ山の下に火があって物を明照することで、明を用いることを戒めとするが、賁にはまた自ずから敢えて獄を折むる无きの義がある。獄を折むる者は情実を専ら尊ぶ。文飾があればその情を隠してしまう。だから文をもって獄を折めてはならない。</p>\n<p>本田の講説：「情」と「実」は同じ意味で、「情実」も「実情」と同じことである。裁判に関して「文」と言う場合は良くない意味が多い。「舞文」と言えば、悪徳弁護士があちこちから法律の箇条を持って来て巧みに文書を書き上げ、真実を覆い隠すこと。先日のアメリカのシンプソン裁判など、まさしく「文を舞わせる」という感じがした。</p>\n<h3 id=\"g22-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>一は独立せず、二なれば文と為す。</b> 受講者が「この文句には典拠があるのですか」と問うと、本田は、このままの文句はほかにないと思う、程伊川が自分で考えたのだろうが、「一は独立せず」の部分だけなら似た意味の文句はままあり、例えば『穀梁伝』に「独陰生ぜず、独陽生ぜず」とある、と答えた。陰だけ、陽だけの単独の状態では物は生めない。受講者が「対立物があってこそ発展するという意味では弁証法的な思想ですね」と言うと、本田は「おもしろい考え方です」と答えた。</li><li><b>飾りの位置づけ。</b> 受講者が「賁は結局、馬子にも衣装という感じで、それほど大した卦ではないのですか」と問うと、本田は、飾りはしょせん従であって、実質に代わって主となることはできない、ただし人間社会の礼儀や階級まで単なる飾りということになると儒者の考え方とは相反し、むしろ老子の方に近い、もっとも彖伝の考え方は老子のように飾りだから全部無駄というのではなく、飾りは飾りで絶対に必要だという考え方だ、と答えた。卦の終わりに本田は、老子などは飾りをすべて虚飾として斥けるが、易の作者は飾りはなければならないものという立場に立ってこれを六十四卦に加えた、ただし極度になると偽りになるという観点も失わず、最後に「飾りの最上のものは白」という文句を置いた、とまとめる。</li><li><b>道学者らしい解釈。</b> 初九の程伝は、君子が身の飾りとするものは世俗が恥じるもので、世俗が貴ぶものは君子が卑しむものだとする。本田は、いかにも道学者らしい禁欲的倫理に引きつけた解釈だと言う。</li><li><b>正応を捨てるのは義理を欠く。</b> 受講者が「なぜ初が二に従うのは正しくないのですか」と問うと、本田は、もし四が陽なら初と反発しあうので隣の二とくっついてもさほど悪くないが、賁では初と四が陰陽で引き合う「正応」で、前世から赤い糸でつながれたような、親の代からのいいなづけのような強い関係である、それを捨てて他にくっつくのは四に義理を欠くので「義として乗らない」と言うのだ、と答えた。</li><li><b>章炳麟の略奪婚説。</b> 六四の「寇するに匪ず、婚媾せん」について、辛亥革命のころの学者章炳麟は、古代の略奪結婚を歌った文句と見ている。形式的ではあるが花婿が馬に乗って花嫁を連れ去るという、原始民族によくある結婚の形式である。古代には婚礼は必ず夕方に行ったので、「女」に「昏」で結婚を表す。「媾」は男女が交わる、多少みだらな感じのする字である。</li><li><b>避諱の欠画。</b> 六五の「丘」の字は木版本では一画欠けている。孔子の本名だからである。</li><li><b>「戔」の字。</b> 程伊川は「戔戔」を切り刻まれるさまと解し、朱子は「わずか」と解する。戔は元来ホコを二つ重ねた形でチャンチャンバラバラと切り合うことを表し、転じてバラバラにした結果として「わずか」の意味になる。朱子は「戔」にさんずいを付ければ「浅」になるので原義は「わずか」だとするが、程伊川のように切り刻む意味に解することもできる。</li></ul>\n<h3 id=\"g22-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>飾りがあれば物事は通るが、飾りは実質を増すものではないので、進むのは少しだけにとどめよ。</li><li>政治は明らかにせよ。しかし裁判を飾り立てた理屈で軽々しく決めるな（大象）。</li><li>身分が低い時は、楽な道（車）を捨てて義を守ることを自分の飾りとせよ（初九）。</li><li>飾りは長続きしにくい。いつまでも正しさを保てば誰にも侮られない（九三）。</li><li>邪魔が入っても、正しい縁はいずれ結ばれる（六四）。</li><li>飾りが極まれば偽りになる。最上の飾りは白、質素を尊べ（上九）。</li><li>悪い判断の卦が出た時の心構えは、要するに自重せよということに尽きる（第四十一講）。</li><li>卦を立てるところまでは、本人が自分でやった方がよい（第四十一講）。</li></ul><h2 class=\"sec\" id=\"g22-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">賁其趾。舍車而徒。</span></summary><div class=\"body\"><div class=\"yomi\">其の趾を賁る。車を舎てて徒よりす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「舍車而徒、義弗乘也。」（車を舎てて徒よりするは、義として乗らざるなり。）</div>\n<p>自分の足を飾る。足は行くためのものなので、行いを飾る意味にもなる。馬車に乗ることは諦めて徒歩で行く。馬車は貴人の乗り物である。</p>\n<p><span class=\"tag\">程伝</span>初九は剛陽で明体（離）にいて最下にいる。君子で剛明の徳がありながら下にいる者である。君子が位のない地にいて、天下に施すところがなく、ただ自らその行うところを飾るだけである（本田：「行く」と「行う」は同音同義で、二つの意味を兼ねている）。趾は下にあって行くためのものという意味を取る。君子の修飾の道は、その行いを正し、節を守り義に処し、行いをなおざりにしない。義が当たらなければ車輿を捨てて徒行する。人が恥じるところを君子は賁とする。「車を舎てて徒よりす」は、比応の関係でも義を取る。初は二に比し四に応ずる。四に応ずるのは正、二に与するのは正でない。九の剛明で義を守る者が、近くの二に与せず遠く四に応ずるのは、易きを捨てて難きに従うことで、車を捨てて徒行するようなものである。義を守るのは君子の賁である。だから君子の賁とするところは世俗の羞じるところで、世俗の貴ぶところは君子の賤しむところである。車と徒で言うのは、趾と行の縁で義をなしたのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>車を舎てて徒行するのは、義として乗るべきでないからである。初が四に応ずるのは正、二に従うのは正でない。近い二の易きを捨てて四の難きに従う。車を舎てて徒行するのである。君子の賁は、その義を守ることだけである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>地位のない時は、楽な道や身近な誘いを捨て、遠くとも正しい相手・道を選べ。義を守ることが自分の飾りとなる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">賁其須。</span></summary><div class=\"body\"><div class=\"yomi\">其の須（ひげ）を賁る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「賁其須、與上興也。」（其の須を賁るは、上と与に興るなり。）</div>\n<p>あごひげを飾りとする。「須」は「鬚」と同じで、あごひげ。口ひげは「髭」、頬ひげは「髯」と区別する。</p>\n<p><span class=\"tag\">程伝</span>卦が賁であるのは二爻の変（下卦の中が陰に、上卦の上が陽に変わる）によるが、文明の義が重い。二は実に賁の主である。だから主として賁の道を言う。物を飾るのに、その質を大きく変えることはできない。その質によって飾りを加えるだけである。だから須の象を取る。須は頤に附いて動くもので、動くも止まるもただ附くところによる。善悪が賁飾によらないようなものである。二の文明はただ賁飾であり、善悪はその質にかかっている。</p>\n<p><span class=\"tag\">象伝について程伝</span>須を象とするのは、上（九三）とともに動くことである。上に随って動き、動止はただ附くところによる。飾りを物に加えるのに、その質によって賁るのであって、善悪はその質にあるようなものである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>飾りは本体に付き従うもの。自分の価値は付き従う相手（本質）次第である。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">賁如濡如。永貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">賁如たり、濡如たり。永貞なるときは吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「永貞之吉、終莫之陵也。」（永貞の吉なるは、終に之を陵ぐもの莫きなり。）</div>\n<p>きらきらとして、つやつやとして、いつまでも心の正しさを守れば吉である。本田によれば、「如」の字は「然」と同様に形容詞を作るはたらきがあり、易ではよく「〜如」という形容詞を用いる。</p>\n<p><span class=\"tag\">程伝</span>三は文明の極にいて、二と四の二陰の間に処し、相賁る（三は内卦、四は外卦と場所を隔てて飾りあう）。賁の盛んな者である。だから「賁如」という。如は辞である。賁飾の盛んなものは光彩潤沢である。だから「濡如」という。光彩が盛んであれば潤沢がある。『詩経』（大雅・霊台）に「麀鹿濯濯たり」とある（本田：麀は雌鹿、濯濯は毛皮が濡れたように輝くさま）。「永貞なるときは吉」とは、三と二・四は正応ではなく（三は上と対応するのが正しい）、比（隣どうし）で相賁っているだけなので、常永の正しさを戒めたのである。賁は飾りであり、賁の事は常であることが難しい。だから永貞であれば吉である。三は四と相賁り、また下で二に比する。二陰が一陽を交々賁り、上下ともに飾ってくれる。賁の盛んなものである。</p>\n<p><span class=\"tag\">象伝について程伝</span>飾って常でなく、しかも正しくなければ、人に陵（あなど）られる。だから永貞であれば吉と戒めた。その賁が常で正しければ、誰がこれを陵げよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>飾りが最も盛んで輝かしい時。ただ飾りは長続きしにくい。いつまでも正しさを保てば誰にも侮られず吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">賁如皤如。白馬翰如。匪寇婚媾。</span></summary><div class=\"body\"><div class=\"yomi\">賁如たるもの皤如（はじょ）たり。白馬翰如（かんじょ）たり。寇するに匪ずんば、婚媾せんとす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六四當位疑也。匪寇婚媾、終无尤也。」（六四位に当ること疑わるるなり。寇あるに匪ずんば婚媾せんとす、終に尤め无きなり。）</div>\n<p>きらきらと美しく飾られるはずのものが、白生地のままである。白馬にまたがって、鳥のように駆けつける。邪魔者が入らなければ、思う相手と結婚できる。</p>\n<p><span class=\"tag\">程伝</span>四と初は正応で、相賁る者である。本来初に賁られるべきだが、三に隔てられて相賁ることができず、皤如である。皤は白で、まだ賁られていないのである。馬は下にあって動くもので、まだ賁られていないので白馬という。正応に従おうとする志は飛ぶようである。だから「翰如」という。三の寇讐に隔てられなければ、婚媾してその相親しむことを遂げるだろう。己の乗るところ、下に動くものは馬の象である。初と四は正応なので、終には必ず親しめる。ただ始めは間隔があるだけである。</p>\n<p><span class=\"tag\">象伝について程伝</span>四と初は遠く隔たり、三がその間に介在する。四の当たる位が疑わしいとされるのである（本田：四は陰で女性、初は陽で男性。初から見れば三は自分より上位で実力があり四のすぐ隣なので、四は三に引かれるのではないかと初が疑う）。三の寇讐に隔てられて婚媾に親しめないが、正応で、理が直く義が勝つので、終には必ず合う。だから「終に尤め无し」という。尤は怨みである。終に相賁ることができるので、怨尤がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>本来の相手・目標との間に邪魔が入り、飾られないままでいる。心は飛ぶように相手に向かう。正しい縁なので、邪魔さえなければ終には結ばれ、恨みは残らない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">賁于丘園。束帛戔戔。吝終吉。</span></summary><div class=\"body\"><div class=\"yomi\">丘園に賁らる。束帛戔戔（さんさん）たり。吝なるも、終には吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六五之吉、有喜也。」（六五の吉は、喜び有るなり。）</div>\n<p>都が郊外の丘や畑に飾られる。程伝によれば、君主が城外の賢人によって飾られる意味で、徳の高い隠者がいること自体が国の飾りとなる。絹の反物が人の手で裁断され、さまざまに切り刻まれる。自分の生地を人に裁断されることのたとえである。恥ずかしいが、最後は吉。</p>\n<p><span class=\"tag\">程伝</span>六五は陰柔の質で、上九の陽剛の賢に密比し、下には応もない（二も陰で引き合わない）。上九に従う者で、賁を上九に受ける。昔から険を設けて国を守るので、城壘は多く丘坂による。丘は外にあって近く高いもの、園圃（畑）も邑の外にあって近いものである。丘園は外にあって近いもので、上九を指す。六五は君位にいても陰柔の才で自ら守るに足りず、上の剛陽の賢に従う。外の比の賢に飾られるのが「丘園に賁らる」である。もし賁を上九に受け、その裁製を受けること、束帛が戔戔と切られるようであれば、自ら為すことができないのは吝であるが、人に従って賁の功を成し、終に吉を得る。戔戔は剪裁分裂のさまである。帛がまだ用いられないうちは束ねて巻いてあるので束帛という。裁製して衣服を作れば必ず戔戔と分裂する。束帛は六五の本質のたとえ、「戔戔たり」とは人の裁製を受けて用をなすことである。人に頼るのは蒙と同じだが、蒙では吝と言わないのは、童蒙が人に頼るのは当然だからである。童蒙でないのに飾りを人に頼るのは恥ずべきである。しかしその功を享け、終には吉となる。</p>\n<p>本田の講説：「制」は「製」と同じで、布を裁断して着物を作ることである。</p>\n<p><span class=\"tag\">象伝について程伝</span>人に従って賁の功を成し、その美を享けるので、喜びがある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力が足りず、身近な賢者の手で形を整えてもらう。人の手に委ねるのは少し恥ずかしいが、終には吉で喜びがある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">白賁。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">白く賁る。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「白賁无咎、上得志也。」（白く賁れば咎无きは、上にして志を得ればなり。）</div>\n<p>白々とした飾り。咎はない。</p>\n<p><span class=\"tag\">程伝</span>上九は賁の極である。賁飾が極まれば華偽に失する。ただよくその賁を白にすれば、過飾の咎はない。白は素である。素を尚べば本真を失わない。いわゆる「質素を尚ぶ」とは、飾りがないということではない。華やかさに実を滅ぼさせないことである。</p>\n<p><span class=\"tag\">象伝について程伝</span>白く賁って咎がないのは、上にいて志を得るからである。志を得るとは、上は賁の極にいて、上にいて賁を尸る（つかさどる）功を成し、六五の君がその賁を受けることである。だから位のない地にいても、実は賁を尸る功を成し、志を得たとする。他の卦の極にいる者とは異なる（本田：易では一般に上はあまり良くない地位だが、賁の場合は下の君主を飾ってやる手柄を立てる）。すでに上にいて志を得、賁の極にいて華に失する咎があるかもしれない。だから質素であれば咎がなく、飾りは過ぎてはならないと戒めた。</p>\n<p>本田の講説：「尸」は元来「かたしろ」を意味する。死者の祭りの時、祭壇に死者の孫を座らせ、お供えを食べる役をやらせる。そこから動詞として、祭りの主体になる、つかさどる意味になる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>飾りの極みにある時。華美を避け、質素に、本来の素地を生かせば咎はない。地位はなくても人を飾り立てる功を成す。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>新年の運勢占い（第四十一講）</div><div class=\"rb\">第四十一講（平成八年一月）で、本田は「お正月ですから、めいめい、今年の運勢を占ってみましょう」と言い、受講者に筮竹で卦を立てさせた。方法：筮竹五十本のうち一本をわきに寄せて終始使わず、残り四十九本を無念無想で二つに割る。右手の分を下に置き、その中から一本取って左手の小指と薬指の間にはさむ。左手の分を八本ずつ取って行き、小指の一本も含めて残った数で、一本なら乾、二本なら兌、三本なら離、四本なら震、五本なら巽、六本なら坎、七本なら艮、残らなければ坤とする。これを二度行って上下の卦を決め、さらに四十九本を割って同様に一本を挟み、今度は六本ずつ数えて、残りの数で爻を決める（三本残れば下から三つ目の爻）。</div><div class=\"rb\">本田は、悪い判断の卦が出た時の心構えは要するに自重せよということに尽きる、と言った。また、卦が出た時に倫理的にこうしなければならないと判断するか、客観的にそういうものだと受け止めるか二通りあり、程伊川は易の倫理的な面を、朱子は占いの面を強調する、と説明した。例えば朱子は「大川を渉るに利あり」なら「冒険せよ」、「往く攸有るに利あらず」なら「動いてはいけない」と、書かれている通りに行動せよと判断し、程伊川はこれに倫理的な説明を加える。朱子は程伊川より後に注釈を書いたので、初めに、倫理的な説明は程伊川に譲り、自分は易の文句をストレートに占いとして見ると断っている。</div><ul class=\"sen\"><li>乾の九四：「或は躍りて淵に在り」。龍が淵の中で上ろうか下ろうかと迷っている。乾は大変良い卦だが、三・四は真ん中あたりで迷いがある。</li><li>節の初九：「戸庭を出でず」。まだ家から外に出てはいけない。節は苦節の状態であまりありがたい卦ではないが、初九は一番下なので、じっとしていれば咎はない。</li><li>需の初九：「郊に需つ。恒を用うるに利あり」。遠くで待ち、常を守るがよい。需は待つという卦でぐずぐずしていて、あまり良い卦ではないが、一番下なのでそれほど悪くない。</li><li>震の上六：「征けば凶」。「震其の躬に于いてせず、其の鄰に于いてするときは、咎无し」は皮肉な判断で、自分の身には被害が及ばず隣に及ぶ。震は地震の卦であまり良くないが、幸い上六は被害が自分に及ばない。</li><li>旅の九四：「旅して于に処る。其の資斧を得たり」。路銀が手に入るので悪くはないが、「我が心快からず」とあるように、旅先で優遇されてもあまり居心地はよくない。昔は旅に出ること自体大変心細く、あまり良い卦ではないが、この爻は吉凶いずれとも断定しがたい。</li></ul></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>裏の卦を見る</div><div class=\"rb\">受講者が「卦の判断において逆の卦を見ることがありますね」と言うと、本田は、裏を見るというのは、心を入れ替えて逆の方向に行動したらどうなるかを見るために、陰陽が反対の卦を見ることだ、と説明した。例えば乾の九四はあまりよくないが、心を入れ替えたらどうなるかを見るには坤の六四を見る。「嚢を括る。咎无く、誉れ无し」とあり、何も言わないでいれば咎もない代わりに誉れもない。乾の九四は上ろうかやめようか迷っている状態、坤の六四は目立たないようにじっと黙っていよ、隠せよという判断である。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>卦は自分で立てる・南面する</div><div class=\"rb\">受講者が「易は自分の運勢を知るために自分でやるものですか」と問うと、本田は、卦を立てる所までは自分でやった方がよい、以前大地震の一週間前に震の卦が出た時も本人に立てさせた、と答えた。また「卦を立てる時は南面することになっているが、周公や孔子に願いごとをするのだから北面する方が良いのでは」という問いには、周公や孔子に願いごとをするというのは後世の考え方で、占う者が南面するのは『礼記』に「易は亀を抱いて南面す」とあるからで（これはもちろん亀の甲羅を使う占い）、「南面すると帝王と同じになりませんか」との問いには、占いをする時は占う者が最上位ということになる、と答えた。</div></div><div class=\"pager\"><a href=\"#gua-21\">← 火雷噬嗑</a><a href=\"#gua-23\">山地剝 →</a></div>", "gua-23": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 23 卦　第四十一講〜第四十二講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山地剝</div><div class=\"yo\">さんちはく</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-23\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-23\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-23\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-23\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-23\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-23\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-23\" data-jump=\"yao\">六爻</a></div><h3 id=\"g23-s0\">卦の名と象</h3>\n<p>剝は「剥ぎ落とす」の意味である。本田は、六十四卦のなかでも一番悪い卦だと言う。</p>\n<p>程伝（序卦伝を引く）：「賁とは飾りなり。飾りを致し、然る後亨るときは則ち尽く。故に之を受くるに剝を以てす」。飾りを極め、願いがかなう時は、もはや何も残らない。飾りが極まれば剥げ落ちる。物事は極まれば必ず元に戻る。だから賁の後に剝が来る。</p>\n<ul class=\"sen\"><li>卦の形は、下の五爻が陰で、上の一爻だけが陽である。陰が初め下から発生し、だんだん伸びて陰の極みに至る。多くの陰気が陽気を消滅させ、剥ぎ落とす。これを剝という。</li><li>上下の卦で言えば、上半分が山、下半分が大地で、山がべったり大地にくっついている。山は本来高く地上にそびえ立つべきものなのに、反対に地に付着している。山の土が剥ぎ落とされて低くなった形で、これが剝の象である。</li></ul>\n<h3 id=\"g23-s1\">卦辞</h3>\n<div class=\"orig\">剝、不利有攸往。</div>\n<div class=\"yomi\">剝は、往く攸有るに利あらず。</div>\n<p>この卦が出たら、前進してはいけない。</p>\n<p><span class=\"tag\">程伝</span>剝とは、もろもろの陰気が伸びて盛んになり、陽気を消滅させる時である。人間で言えば、小人たちがこぞって君子を剥ぎ落とそうとする時である。だから君子は前進してはいけない（積極的に行動してはいけない）。ただひたすら言葉を謙遜にし（巽は遜に通じる）、行動の迹（あと。目に見える具体的な行動）を晦まし、時の動きに従って進退し、小人の害を免れるべきである。</p>\n<h3 id=\"g23-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、剝、剝也。柔變剛也。不利有攸往、小人長也。順而止之、觀象也。君子尚消息盈虛、天行也。</div>\n<div class=\"yomi\">彖に曰く、剝は、剝するなり。柔、剛を変ずるなり。往く攸有るに利あらざるは、小人長ずるなり。順にして之に止まるは、象を観ればなり。君子は消息盈虚を尚ぶ。天の行なり。</div>\n<p>剝とは、剥ぎ落とすという意味である。陰が陽を変化させる。前進してはいけないのは、小人が伸びようとしているからである。素直にして止まるべきことは、卦の象を見ればわかる（下卦の坤は素直、上卦の艮は止まる）。君子は陰陽の消長や月の満ち欠けを尊ぶ。それが天の運行だからである。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>剝は剥落の意味である。柔が剛を変ずるとは、柔が長じて剛が剥ぎ落とされることである。夏至（五月）には一番下に陰気が発生し（姤）、陰が一つ長ずれば陽が一つ消え、九月に至れば陰気が極まって剝となる。陰柔の気が陽剛の気を変化させるのである。陰は小人の道で、まさに長じ盛んになって陽を消そうとしている。だから君子は往く所があってはならない。</li><li>本田の補説：夏至は陽気が一番強い時だが、一番下にすでに陰気が潜んでいる。その裏の卦が「一陽来復」の復で冬至十一月に当たる。「建」は古い和訓で「おざす」と読み、北斗七星の柄の指す方角で十二か月を表す（五月は建午）。</li><li>君子は剝の時に当たって、往ってはならないことを知り、時に順って止まる。剝の象をよく観察したからである。卦に順にして止まるの象がある。これが剝に処する道である。</li><li>「君子は消息を尚ぶ。天の行なり」とは、君子は消息盈虚（「消衰・息長・盈満・虚損」と二字に引き伸ばして説明している）の理に心を存し、これに順えば、天の運行に合致するということである。理には消え衰えることも、伸び長ずることも、満ちることも、空になることもある。これに順えば吉、逆らえば凶。君子が時に随って敬い尚ぶのは、天に事えるゆえんである。</li></ul>\n<h3 id=\"g23-s3\">大象</h3>\n<div class=\"orig\">山附於地、剝。上以厚下安宅。</div>\n<div class=\"yomi\">山、地に附くは、剝なり。上以て下を厚くし宅を安んず。</div>\n<p>山は高くそびえるものなのに、土を剥ぎ取られて地べたにぴったりとくっついている。これが剝である。人の上に立つ者はこの形を見て、下々の生活を厚くし、その住まいを安楽にしてやる。</p>\n<p><span class=\"tag\">程伝</span>艮が坤に重なり、山が地に附いている。山は高く地に起こるものなのに、かえって地に付着している。頽れ剥ぎ取られた象である。「上」とは君主や人の上に立つ者をさす。象を観て、下を固め、自分の居（地位）を安んずる。下は上の本である。基本が固くて剥ぎ取られる者はいまだかつてない。だから上が剝されるのは必ず下からである。下が剝されれば上は危うい。人の上に立つ者がこの理を知れば、人民を安らかに養って本を厚くする。それが自分の居を安んずるゆえんである。『書経』（五子之歌）に「民は惟れ邦の本、本固ければ邦寧し」とある。本田によれば、夏の太康が国を失ったとき、その兄弟五人が歌った歌の文句である。</p>\n<h3 id=\"g23-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>一番悪い卦。</b> 本田は剝を六十四卦のなかで一番悪い卦だと言う。卦の意味は、下から小人が勢力を伸ばして君子を蹴落とす形である。</li><li><b>陽は尽きない。</b> 上九の程伝は、陽には尽き果てる理がなく、上で剝し尽くされればただちに下に生ずる（復）、その間は呼吸ひとつおく間もない、と説く。坤は十月に当たるが、十月を「陽月」と呼ぶのは、陽がまったく無くなったと疑われるのを恐れるからである。陰についても同じで、純陽の乾（四月）にもすでに下に陰が生じているが、聖人はわざわざ言わないだけである。</li><li><b>十二消息卦。</b> 乾から陰気に下から侵蝕されて姤・遯・否・観・剝を経て坤に至り、今度は下から陽気が生じて復・臨・泰・大壮・夬と変化して乾に戻る。この十二卦を消息卦といい、十二か月に配当する。</li><li><b>聖人の勧善の心。</b> 六五では、剝が君位にまで及んで凶は言うまでもないので、もはや「剝」の字を用いず、別の意味（宮人を貫いて寵愛を受ける）を設けて、小人が善に遷る門を開いている。本田は、伊川は爻辞を聖人の教訓と解釈するのだと言う。</li><li><b>剝と夬の非対称。</b> 「剝の上九ではまだ陽が残っているのに陽の再生を言い、夬の上六ではまだ陰が下に生じていないのになぜ『終に凶有り』と言うのか」という問いに、伊川は、剝の場合は君子の道が滅ぼせないことを示すためで、夬は君子が小人を滅ぼす卦であり、小人の道が消え亡びるのは悪いことではないから、その消亡だけを言えばよく、小人が再び生ずる理を言う必要はない、と答える。</li><li><b>歴史の実例。</b> 六三の程伝は、後漢の霊帝の宦官呂強を挙げる。本田の説明では、後漢末期に宦官グループと正義派官僚（党人）の間に激しい争いが起こり、正義派が大量に投獄されたが、呂強は宦官でありながら大赦を進言して彼らを助け、ほかの宦官に憎まれて無実の罪で自殺に追い込まれた。</li></ul>\n<h3 id=\"g23-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>小人が勢いを伸ばし、君子が剥ぎ落とされる時。前進してはいけない。</li><li>言葉を謙遜にし、行動を目立たせず、時の動きに従って害を免れよ。</li><li>上に立つ者は、下を厚く養って自分の基盤を固めよ（大象）。</li><li>剝の害は下（足元）から迫ってくる。凶の度合いは初・二・四と次第に甚だしくなる。</li><li>陽は決して尽きない。剝が極まれば復が来る。君子であれば最後には人々に担がれる（上九）。</li></ul><h2 class=\"sec\" id=\"g23-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">剝牀以足。蔑貞。凶。</span></summary><div class=\"body\"><div class=\"yomi\">牀を剝するに足を以てす。貞を蔑（ないがし）ろにす。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「剝牀以足、以滅下也。」（牀を剝するに足を以てすとは、以て下を滅すればなり。）</div>\n<p>ベッドの足が剥ぎ取られる。正しさをないがしろにする。凶である。</p>\n<p><span class=\"tag\">程伝</span>陰が陽を剝するのは下から進む。牀（ベッド）を象とするのは、身の処る所（身を安らかに横たえる場所）に取るのである。下から剝して次第に身に及ぶ。牀の足を剝するのは、剝が下から始まるからである。陰が下から進んでようやく正を消す。凶の道である。「蔑」は無くすことで、正道を消し亡ぼすことをいう。陰が陽を剝し柔が剛を変ずるのは、邪が正を侵し、小人が君子を消すことである。その凶は知れている。</p>\n<p>本田の講説：人間の足が剥ぎ取られるとする説もあるが、六四で初めて「膚」が出てくるので、伊川は初からいきなり人の足を剥ぎ取られるのは甚だしすぎると考えて、牀の足と解したのだろう。この方が良い。易では一般に、六爻は下から上への変化を表す。</p>\n<p><span class=\"tag\">象伝について程伝</span>牀の足を象とするのは、陰がまず下から陽を消すからである。滅は無くすことで、正道を侵し滅ぼすことが下から上がっていくのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>足元から崩されはじめる。正しい道がないがしろにされる。凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">剝牀以辨。蔑貞。凶。</span></summary><div class=\"body\"><div class=\"yomi\">牀を剝するに辨を以てす。貞を蔑ろにす。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「剝牀以辨、未有與也。」（牀を剝するに辨を以てすとは、未だ与する有らざればなり。）</div>\n<p>ベッドの胴体まで剥ぎ取られる。正しさをないがしろにする。凶である。</p>\n<p>本田の講説：辨には上下を分ける意味があり、牀の幹（胴体）にあたる。辨を牀の胴体の意味に使うのは珍しい。人間の膝から下とする説もあるが、六四との関連を考えると具合が悪い。</p>\n<p><span class=\"tag\">程伝</span>辨は上下を分隔するもので、牀の幹である。陰がようやく進んで辨にまで及ぶ。いよいよ正を蔑ろにし、凶はますます甚だしい。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰が陽を侵すことがますます盛んになり、辨にまで及ぶのは、陽に応じて助ける者がいないからである（二と五は応ずる位置だが、五も陰なので味方がいない）。小人が君子を侵すとき、君子に味方する者がいれば小人に勝てるし、小人も君子を剝することはできない。味方がいないので蔑ろにされて凶となる。陽が消剝される時に味方がなければ、どうして自分を保てよう。「未だ与する有らず」と「未だ」と言うのは、剝がまだ盛んでないので、ここで味方を得ればまだ勝てるという含みである。人に示す意図は深い。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>害が深まる。味方がいないので防げない。凶。ただしまだ手遅れではなく、助けを得れば挽回の余地がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">剝之。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">之を剝す。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「剝之无咎、失上下也。」（之を剝して咎无きは、上下を失すればなり。）</div>\n<p>陰気が陽気を剥落させつつあるなかで、この六三だけは咎がない。</p>\n<p><span class=\"tag\">程伝</span>衆陰が陽を剝する時に、三だけは剛の位（奇数位）にいて上九と応じ、上下の陰と異なる。志は正に従う。剝の時にいて咎がないとする者である。三の行いは善いと言える。ある人が「それならなぜ吉と言わないのか」と問うた。答え：衆陰が陽を剝し、多くの小人が君子を害する時、三は正に従うとはいえ勢いは孤立して弱く、応ずる相手（上九）は位のない地にいる。この時、難儀を免れることさえ難しい。どうして吉を得られよう。その義は咎がないというにとどまる。咎がないと言うのは、正に従う志を励ますためである。</p>\n<p><span class=\"tag\">象伝について程伝</span>三が剝の時にいて咎がないのは、身の処る所が上下の陰と同じでなく、同類と相失する（態度が違う）からである。剝の時にこのように処すれば咎はない。東漢（後漢）の呂強のような人がそれである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>周りが悪に染まるなかで、ただ一人正しい者に従う。孤立して吉とまではいかないが、咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">剝牀以膚。凶。</span></summary><div class=\"body\"><div class=\"yomi\">牀を剝して膚（はだえ）に以（およ）ぶ。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「剝牀以膚、切近災也。」（牀を剝して膚に以ぶとは、切に災いに近きなり。）</div>\n<p>ベッドが全部剥ぎ落とされて、いよいよ自分の皮膚まで剥ぎ取られる。凶である。</p>\n<p><span class=\"tag\">程伝</span>初めは牀の足を剝し、次第に膚にまで至った。膚は身の外側である。いずれ身を滅ぼそうとしている。凶は知れている。陰の長ずることはすでに盛んで、陽の剝されることはすでに甚だしく、貞道はすでに消えた。だから「貞を蔑ろにす」とは言わず、ただちに凶と言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>五は君位である。剝が四に及ぶのは、人で言えば膚を剝すことである（五が肉や骨、四が皮膚に当たる）。身がまさに滅びようとしている。ひどく災いに近いのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>害がついにわが身に及ぶ。災いは目前で、凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">貫魚以宮人寵。无不利。</span></summary><div class=\"body\"><div class=\"yomi\">貫魚のごとく宮人を以（ひき）いて寵せらる。利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「以宮人寵、終无尤也。」（宮人を以いて寵せらるるは、終に尤め无きなり。）</div>\n<p>お妃が、めざしの魚のように後宮の女性たちをぞろぞろと引き連れて、上の者（上九）の寵愛を受ける。何の不都合もない。本田によれば、五は君位だが陰なので女性、お妃に当たる。この卦で男性は上九しかいない。</p>\n<p><span class=\"tag\">程伝</span>剝が君位にまで及ぶのは剝の極みで、凶は知れている。だから改めて剝とは言わず、別の義を設けて、小人が善に遷る門を開いた。五は群陰の主である。魚は陰に属する物なので象とする。五がもし群陰を率い、貫いた魚のように序列に順わせ、宮人のように上にある陽の寵愛を受けさせれば、不利なところはない。「宮人」とは宮中の人、妻妾や侍使で、陰であることから言い、寵愛を得る義を取る。一陽が上にいて、陰に順従の道があるので、この義を発したのである。</p>\n<p>本田の講説：礼の規定では、天子には后が一人、夫人が三人、嬪が九人、世婦が二十七人、御妻が八十一人いて、妾はさらに低い身分である。</p>\n<p><span class=\"tag\">象伝について程伝</span>群陰が陽を消剝してついに君位に至った。五がもし陰の長として群陰を率い、頭を並べ序列に順って上の陽の寵愛を受けるなら、過ちはない。剝が極まろうとするところでこの義を発するのは、聖人が善に遷ることを勧める心が切実だからである。</p>\n<p>本田の講説：剝という悪い卦の極点で、せめて小人たちが君子に頭を下げるよう道を示している。このように伊川は爻辞を聖人の教訓と解釈する。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勢いを得た立場にあっても、仲間を率いて上の正しい者に従えば、不都合はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">碩果不食。君子得輿、小人剝廬。</span></summary><div class=\"body\"><div class=\"yomi\">碩（おお）いなる果にして食らわれず。君子は輿を得、小人は廬を剝す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「君子得輿、民所載也。小人剝廬、終不可用也。」（君子は輿を得とは、民の載する所なり。小人は廬を剝すとは、終に用う可からざるなり。）</div>\n<p>大きな木の実がたった一つ、食われずに残っている。占ってこれを得た人が君子であれば、輿（御輿または馬車）に乗れる。小人であれば、家の屋根まで剥がされる。本田によれば、「食」と「廬」で韻を踏んでいる。</p>\n<p><span class=\"tag\">程伝</span>諸陽は消剝されてほとんど尽き、上九の一爻だけがなお残る。大きな果実が食われずに残っているようなもので、再生の理がある。上九も変ずれば純陰になるが、陽には尽きる理がない。上で変ずれば下に生じ、その間に息をつく暇もない。聖人はこの理を明らかにし、陽と君子の道が亡ぼせないことを示した。ある人が問うた。「剝が尽きれば純坤となるが、坤に陽はあるのか」。答え：卦を月に配すれば坤は十月に当たる。気の消息で言えば、陽は剝し尽くされて坤となり、陽が来て復となる。陽は尽きていないのである。上で剝されれば下に生ずる。だから十月を陽月という。陽が無いと疑われるのを恐れるからである。陰もまた同じで、聖人が言わないだけである。</p>\n<p>程伝（続き）：陰の道が極めて盛んな時には乱れることは知れている。乱が極まれば人は自ずから治を思う。だから衆心が君子を戴こうと願う。それが「君子は輿を得」である。『詩経』の匪風・下泉が変風の終わりに置かれているゆえんである。卦においても、衆陰が陽を宗とし、ともに載せる象がある。「小人は廬を剝す」とは、小人が剝の極みにいれば、自分の廬（家）を剝し、身を守る所がなくなるということである。ここでは爻の陰陽を論ぜず、小人が剝の極みに処ればその廬にまで及ぶと言うだけである。廬は上にあるので象とする。</p>\n<p>本田の講説：『詩経』の国風には、良い時代の歌である正風（周南・召南）と、悪い時代の歌である変風がある。匪風は檜風の最後、下泉は曹風の最後に置かれ、どちらも政治が乱れて民が新しい支配者を待ち望む内容である。</p>\n<p><span class=\"tag\">象伝について程伝</span>正道が消剝されて極まれば、人はまた治を思う。だから陽剛の君子は民が承け載せる（捧げてかつぎ上げる）ものとなる。小人が剝の極みにいれば小人自身が窮まるだけで、家があっても何の役にも立たない。上九を小人と呼ぶのではない（上九は陽だから小人ではない）。剝の極みの時に小人ならばこうなる、と言っているだけである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>最悪の時を耐え抜いて残った一つの実。君子であれば人々に推し戴かれるが、小人であれば身の置き所を失う。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>飲み屋の女将に剝</div><div class=\"rb\">本田が友人に連れられて行った飲み屋の女将に卦を立ててやったら剝が出た。「体の具合は悪くないか」と言ったら、「実は非常に悪い」ということだった。</div></div><div class=\"pager\"><a href=\"#gua-22\">← 山火賁</a><a href=\"#gua-24\">地雷復 →</a></div>", "gua-24": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 24 卦　第四十三講〜第四十四講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地雷復</div><div class=\"yo\">ちらいふく</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-24\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-24\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-24\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-24\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-24\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-24\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-24\" data-jump=\"yao\">六爻</a></div><h3 id=\"g24-s0\">卦の名と象</h3>\n<p>復は「帰る」「戻る」の意味である。下半分が震、上半分が坤。</p>\n<p>程伝（序卦伝を引く）：「物は以て終に尽く可からず。剝 上に窮まり、下に反る。故に之を受くるに復を以てす」。物には剝し尽くされる理はない。剝が極まれば復が来る。陰が極まれば陽が生ずる。陽が剝されて上に極まれば、また下に生ずる。上に窮まって下に反るのである。これが復が剝に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は、一陽が五陰の下に生じている。陰が極まって陽が帰ってきたのである。陰暦十月に陰が盛んで極まり、冬至（十一月）になると一陽がまた地中に生ずる。だから復という。</li><li>陽は君子の道である。陽が消えて極まると、また反ってくる。君子の道も、消えて極まるとまた長ずる。だから復は「善に反る」という意味になる。</li></ul>\n<h3 id=\"g24-s1\">卦辞</h3>\n<div class=\"orig\">復、亨。出入无疾、朋來无咎。反復其道、七日來復。利有攸往。</div>\n<div class=\"yomi\">復は亨る。出入（しゅつにゅう）疾（やまい）无し。朋来りて咎无し。其の道を反復す。七日にして来復す。往く攸有るに利あり。</div>\n<p>この卦が出れば、願いごとは通る。進んでも退いても害はない。友達が集まって来ても咎はない。やって来た道を繰り返す。なくなったものは七日で帰って来る。前進してよろしい。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>復は亨る。陽気が下に復れば、だんだん通じ盛んになって万物を生育する。君子の道もいったん復れば、次第にその恩沢を天下に通わせる。だから復には亨盛の理がある。</li><li>「出入」とは生長のことである。陽が内に生ずるのが「入」、長じて外に進むのが「出」。先に「出」と言うのは言葉の都合にすぎない。陽の生ずるのは外からではなく内から来るので「入」と言う。物が初めて生ずるとき、その気は至って微かなので、芽生えの困難（屯艱）が多い。陽が初めて生ずるときも至って微かなので、くだけ折れることが多い。春の陽気が発しても陰寒にくじかれることは、朝晩草木を観察すればわかる。「疾无し」とは、微陽の生長を害するものがないことである。害するものがなく、同類がだんだん進んで来れば、まさに盛んになろうとする。だから咎がない。ここでいう「咎」は、気について言えば差い忒（たが）うこと、君子について言えば抑えつけられ塞がれて理を尽くせないことである。陽がまさに復るべきときには、たとえ害するものがあっても、その復るのを止めることはできず、ただ妨げとなるだけである。卦の才にも疾のない義があり、これが復の道の善さである。</li><li>一陽が初めて生ずるときは至って微かで、群陰に勝って万物を発生させることはできない。必ず諸陽が来るのを待ってから、物を生ずる功を成す。だから「朋来りて咎无し」という。三陽（子・丑・寅、十一月・十二月・一月）の気が物を生成するのは、衆陽の功である。君子の道も、いったん消えて復ったばかりでは小人に勝てない。必ず同類が盛んになるのを待って、ようやく力を合わせて勝つことができる。</li><li>「其の道を反復す」とは、消長の道が反復し往来することである。陽が消されてから七変して来り復る。姤は陽が初めて消された形で、そこから七変して復となる。だから「七日」と言い、七変をいう。臨に「八月にして凶有り」と言うのは、陽が長じ始めてから陰が長ずるに至るまで（臨から遯まで）八か月かかるということである。陽が進めば陰は退き、君子の道が長ずれば小人の道は消える。だから「往く攸有るに利あり」。</li></ul>\n<p>本田の講説：長い注だが、言っていることは簡単である。復をすべて天地の気にかけて注釈し、それを人事にあてはめて君子と小人の道として説明している。「屯艱」の「屯」は「とん」とは読まない（屯〈ちゅん〉の卦で、止まる・難儀の意）。</p>\n<h3 id=\"g24-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、復亨、剛反也。動而以順行。是以出入无疾、朋來无咎。反復其道、七日來復、天行也。利有攸往、剛長也。復其見天地之心乎。</div>\n<div class=\"yomi\">彖に曰く、復は亨るとは、剛反るなり。動いて順を以て行く。是を以て出入疾无く、朋来りて咎无し。其の道を反復す、七日にして来復すとは、天行なり。往く攸有るに利ありとは、剛長ずるなり。復は其れ天地の心を見るか。</div>\n<p>復の卦が出れば願いが通るのは、陽が帰ってきたからである。下卦の震は動く、上卦の坤は素直で、素直に動く形である。だから出入に害がなく、同類が来ても咎がない。七日で帰って来るのは天の運行である。前進してよいのは、陽が伸びる時だからである。復という卦は、天地の心を示しているであろう。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「復は亨る」とは、剛が反ってきて亨ることをいう。陽剛が消えて極まると、また来り反る。来れば次第に盛んになって通じる。</li><li>「動いて順を以て行く。是を以て出入疾无く、朋来りて咎无し」は、卦の才から言ったものである。陽が下で動き、順をもって上り行く。だから出入に疾がなく、朋が来て咎がないのである。朋が来るのも、順に動くことでおのずから招くのである。</li><li>消長が相因るのは天の理である。陽剛の君子の道が長ずるので「往く攸有るに利あり」。一陽が下に復るのは、天地が物を生ずる心を見るものである。先儒はみな静をもって天地の心を見るとしたが、動の端こそが天地の心であることを知らなかった。道を知る者でなければ、誰がこれを知ろうか。</li></ul>\n<p>本田の講説：今残っている最古の易注は三国魏の王弼の注で、優れた注釈だが『老子』の理論で解釈している。王弼は復を「寂然至無」と解し、それこそが万物を発生させるとした。『老子』に「万物並び作る。吾は以て復を観る」とあり、老子は無から有が生じたと考える。王弼はこれを持ってきて、冬至の時はすべてが無に帰した一瞬だとした。唐の孔穎達の疏も同じである。伊川はこれに対し、動きの初めこそが天地の心だと言う。朱子も弟子に「王弼のようにこの卦を絶対の無とするなら、一番下の陽爻をどう解釈するのか」と語っている。</p>\n<h3 id=\"g24-s3\">大象</h3>\n<div class=\"orig\">雷在地中、復。先王以至日閉關、商旅不行、后不省方。</div>\n<div class=\"yomi\">雷、地中に在るは復なり。先王以て至日に関を閉ざし、商旅行かず、后（きみ）は方を省（み）ず。</div>\n<p>雷が大地の下に潜っている形を復という（冬至の日に雷が初めて地中で鳴る）。昔の王者はこれにのっとって、冬至の日には関所を閉ざし、商人も旅人も通行させず、君主自身も四方の巡視に出かけない。</p>\n<p><span class=\"tag\">程伝</span>雷は陰陽が相薄（せま）って声を成すものである（「薄」は「迫」と同音）。陽が微かな時はまだ地上に発することができない。雷が地中にあるのは、陽が初めて復った時である。陽は初めて下に生じて甚だ微かであり、安静にしてこそ成長できる。先王は天道に順い、冬至に陽が初めて生ずるに当たり、安静にしてこれを養う。だから関を閉ざし商旅を通さず、人君も四方を巡視しない。一人の身においても同じで、安静にして陽を養うべきである。</p>\n<p>本田の講説：象伝は政治上のことだけを述べているが、伊川はそこから個人の健康法にまで言及している。道教の養生法でも、不老長生の第一歩は体内の精気を惜しむことで、房中術に象徴されるように体液を外に出すことを嫌う。唾液も大切にし、唾を吐いたらもったいないと考える。呼吸法では吸う息を細かくし、一度吸った気を何時間もためておけるようにする。</p>\n<h3 id=\"g24-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>静か動か。</b> 復の彖伝「天地の心を見るか」をめぐって、王弼は老子流に無・静に天地の心を見、伊川は「動の端」こそ天地の心だとした。伊川の注を貫くのは、陽（君子の道）は決して尽きないという確信である。</li><li><b>克己復礼。</b> 六二の程伝は「復とは礼に復るなり」と言う。本田によれば、孔子が顔回に仁を問われて「己に克ち礼に復る」と答えた言葉で、宋学ではこれを、自分の私欲に打ち勝って天理に立ち返るという重大な意味に解釈した。仁は天下の公、善の本である。</li><li><b>公と私。</b> 本田は『韓非子』を引き、「公」の「ム」は「私」の「ム」と同じで、「八」は背くことを表し、公は私に背を向けることだと説明する。</li><li><b>顔回の過ち。</b> 初九の程伝によれば、顔回は形に現れるような過ちがなかったので、孔子に「其れ殆ど庶幾（ちか）からんか」と言われた（繋辞伝下）。過ちがまだ形に現れる前に改めるので、後悔するまでに至らない。本田は、伊川らしい大変道徳的な解釈だと言う。</li><li><b>爻の吉凶を言わない理由。</b> 六四の程伝は、六四は正しい道に帰る志は善いが、柔弱で応ずる初九もまだ微力なので、聖人はその独り復るのを称えるだけで、結果が凶だとは言いたくなかった、と説明する。「咎无し」とも言わないのは、陰で陰位にいて甚だ柔弱で、結局成し遂げられないからである。</li></ul>\n<h3 id=\"g24-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>一陽来復。失ったものが帰り、願いは通る。前進してよい。</li><li>ただし帰ってきたばかりの陽はまだ微かなので、安静にして養え（大象）。仲間が集まるのを待てば力を発揮できる。</li><li>過ちに気づいたら、遠くへ行かないうちにすぐ改めよ（初九が卦中で最も良い）。</li><li>仁者・正しい者にへりくだって従えば吉（六二）。</li><li>何度失敗しても善に帰ろうとすること自体には咎がない（六三）。</li><li>迷って帰らなければ、何をしてもうまくいかず、長く前進できない（上六）。</li></ul><h2 class=\"sec\" id=\"g24-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">不遠復。无祗悔。元吉。</span></summary><div class=\"body\"><div class=\"yomi\">遠からずして復る。悔いに祗（いた）る无し。元いに吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不遠之復、以脩身也。」（遠からざるの復は、以て身を修めんとなり。）</div>\n<p>失せ物や行方不明の人は遠からず帰って来る。後悔するまでにはならない。大いに吉。</p>\n<p><span class=\"tag\">程伝</span>復は陽が反ってくることである。陽は君子の道なので、復は善に反る義となる。初は剛陽で、復の初めにいて、最も先に復る者である。道を遠く外れないうちに復るのである。過ちがあってこそ復ることがある。過ちがなければ復ることもない。ただ過ちを遠く行かないうちに復れば、後悔に至らない。大いに善で吉である。「祗」は「抵」（いたる）と読むべきである。『玉篇』には「適く」とあり、意味は同じである。坎の九五に「既に平らかなるに祗る」とあるのも「至る」意味である。顔回には形に現れる過ちがなく、孔子は「其れ殆ど庶幾からんか」と言った。これが悔いに至らないことである。過ちがまだ形に現れないうちに改めるのだから、何の悔いがあろう。「勉めずして中る」（『中庸』）、「心の欲する所に従いて矩を踰えず」（『論語』為政）という境地にはまだ至らないので過ちはあるが、明らかで剛毅なので、不善があれば必ず知り、知れば必ずすぐに改める（繋辞伝下「不善有れば、未だ嘗て知らずんばあらず。之を知れば、未だ嘗て復た行わざるなり」）。だから悔いに至らない。</p>\n<p><span class=\"tag\">象伝について程伝</span>遠からずして復るのは、君子が身を修める道である。学問の道はほかでもない（『孟子』告子上）、不善を知ればすぐに改めて善に従うだけである。</p>\n<p>本田の講説：この初九の判断が卦のなかで一番良い。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>失ったものはすぐ戻る。過ちに早く気づいて改めれば悔いはない。大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">休復。吉。</span></summary><div class=\"body\"><div class=\"yomi\">休（よ）く復る。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「休復之吉、以下仁也。」（休復の吉なるは、仁に下るを以てなり。）</div>\n<p>見事に帰ってくる。吉。</p>\n<p><span class=\"tag\">程伝</span>二は陰だが中正の位にいて、初九にぴったり親しんでいる。その志は陽に従い、仁にへりくだる者で、復ることの見事な者である。復とは礼に復ることで、礼に復れば仁である。初陽が復るのは仁に復ることで、二はこれに親しんでへりくだる。だから見事で吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>復の見事で吉なのは、仁にへりくだるからである。仁は天下の公、善の本である。初は仁に復り、二はよく親しんでへりくだる。だから吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分より優れた正しい人に素直に従い、ともに正道に帰る。吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">頻復。厲无咎。</span></summary><div class=\"body\"><div class=\"yomi\">頻（しばし）ば復る。厲（あやう）けれど咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「頻復之厲、義无咎也。」（頻復の厲きは、義において咎无きなり。）</div>\n<p>道に帰ろうとしては失敗し、失敗してはまた帰ってくる。危ういが咎はない。</p>\n<p><span class=\"tag\">程伝</span>三は陰で動（震）の極にいる。復ることが頻繁で、固くしていられない者である。復は安定堅固を貴ぶ。しばしば復ってしばしば失うのは、復に安んじないのである。善に復ろうとしてしばしば失うのは危うい道である。聖人は人が善に遷る道を開き、その復るのを善しとし、失うのを危ぶむ。だから「厲けれど咎无し」と言う。しばしば失うからといって復ることまで戒めてはならない。しばしば失うのは危ういが、しばしば復ることに何の咎があろう。過ちは失うことにあって、復ることにはない。</p>\n<p><span class=\"tag\">象伝について程伝</span>しばしば復り、しばしば失う。危ういとはいえ、善に復る義においては咎がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>改めては失敗し、また改める。不安定で危ういが、善に戻ろうとする努力そのものに咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">中行獨復。</span></summary><div class=\"body\"><div class=\"yomi\">中行独り復る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「中行獨復、以從道也。」（中行独り復るとは、道に従うを以てなり。）</div>\n<p>本田によれば、原義は「中途から一人で帰って来る」だが、伊川は五つの陰のなかにあって一人帰ると解釈する。</p>\n<p><span class=\"tag\">程伝</span>この爻の義は最も詳しく味わうべきである。四は群陰の中を行きながら独り復る。正位にいて（陰が偶数位）、下は陽（初九）に応ずる（四と初は陰陽で引き合う）。その志は善いと言える。吉凶を言わないのは、四は柔で群陰の間にいて、初はまだ甚だ微かで助けるに足らず、成し遂げる理がないからである。だから聖人はただその独り復るのを称え、独り道に従えば必ず凶だとは言いたくなかったのである。ある人が「それならなぜ『咎无し』と言わないのか」と問うた。答え：陰で陰位にいて柔弱が甚だしい。陽に従う志はあっても結局成し遂げられない。咎がないわけではない。</p>\n<p><span class=\"tag\">象伝について程伝</span>独り復るのを称えるのは、陽剛の君子の道に従うからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>周囲が皆悪に流れるなかで、一人正しい道に戻る。志は立派だが、力が弱く援けも乏しいので、成果は期待しにくい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">敦復。无悔。</span></summary><div class=\"body\"><div class=\"yomi\">復るに敦（あつ）し。悔い无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「敦復无悔、中以自考也。」（復るに敦く悔い无きは、中以て自ら考（な）せばなり。）</div>\n<p>善に帰ろうとする志が厚い。悔いはない。</p>\n<p><span class=\"tag\">程伝</span>六五は中順の徳で君位にいる。復るのに敦く篤い者である。だから悔いがない。もともと善い判断だが、戒めもその中にある。陽が復ったばかりでまだ微かな時に、柔で尊位にいて、下に助けとなる応（二も陰）もない。だから吉や亨にまでは至らず、悔いがないことができるだけである。</p>\n<p><span class=\"tag\">象伝について程伝</span>中順の徳で君位にいる。復る志を敦くし、中道で自らを成せば、悔いはないはずである。「自ら成す」とは、中順の徳を成すことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>正しい道に帰る志を厚く持てば悔いはない。ただし助けが乏しいので、大きな成功までは望めない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">迷復。凶。有災眚。用行師、終有大敗。以其國、君凶。至于十年不克征。</span></summary><div class=\"body\"><div class=\"yomi\">復るに迷う。凶。災眚（さいせい）有り。用て師を行れば、終に大敗する有り。其の国に以（もち）うれば、君の凶なり。十年に至るまで、征く克わず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「迷復之凶、反君道也。」（復るに迷うの凶なるは、君の道に反けばなり。）</div>\n<p>帰ろうにも迷って帰れない。凶。災難がある。この爻によって戦を行えば、ついには大敗する。国を治めようとすれば君主に災いがある。十年経っても前進できない。本田によれば、伊川の注は「其の国に以うれば、君の凶なり」と読ませるが、「其の国君凶なり」と読む注釈者もある。一番上の位には、概して良い判断がつかない。</p>\n<p><span class=\"tag\">程伝</span>陰柔で復の終わりにいる。最後まで迷って復らない者である。迷って復らなければ凶は知れている。「災」は外から来る天災、「眚」は自分の過ちで自ら作るものである。道に迷って善に復らなければ、自分にあっては動きがみな過失となり、災禍もまた外から至る。おそらく自ら招いたのである。道に迷って復らなければ何をしても用いられない。軍を動かせば大敗し、国を治めれば君に凶がある。十は数の終わりで、「十年に至るまで征く克わず」とは、ついに行くことができないということである。道に迷ってしまえば、いつ行くことができよう。</p>\n<p><span class=\"tag\">象伝について程伝</span>復れば道に合う。復るに迷うのは道に反することで、凶は知れている。「君の凶なり」とは君の道に反することをいう。人君は上にいて衆を治めるのだから、天下の善に従うべきなのに、復るに迷うのは君道に反する。人君だけでなく、誰であれ復るに迷う者は道に背いて凶である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>迷って正道に戻れない。凶。外からの災いと自ら招く過ちが重なる。戦も統治も失敗し、長く前進できない。</div></div></details><div class=\"pager\"><a href=\"#gua-23\">← 山地剝</a><a href=\"#gua-25\">天雷无妄 →</a></div>", "gua-25": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 25 卦　第四十四講〜第四十五講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天雷无妄</div><div class=\"yo\">てんらいむぼう</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-25\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-25\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-25\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-25\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-25\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-25\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-25\" data-jump=\"yao\">六爻</a></div><h3 id=\"g25-s0\">卦の名と象</h3>\n<p>无妄は「偽りなき誠」の意味である。下半分が震、上半分が乾。</p>\n<p>程伝（序卦伝を引く）：「復すれば則ち妄ならず。故に之を受くるに无妄を以てす」。復とは道に反ることである。道に復れば正しい理に合致して妄（偽り）がない。だから復の次に无妄が来る。卦は乾が上、震が下である。震は動で、天理をもって動くのが无妄、人欲をもって動けば妄である。无妄の義は大きい。</p>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>『論語』顔淵篇の「克己復礼」の「己」を、古注は素朴に解するが、伊川や朱子は人欲と解し、人欲を克服して天理に帰ることとする。この无妄の注も同じく、天理と人欲を対立させ、天理に従うのが无妄、人欲に従うのが妄だとする。</li><li>『史記』春申君伝に「無望の福」「無望の禍」という言葉があり、戦国時代には「无妄」は「無望」に通じ、予想外という意味で用いられていたらしい。古い注釈もおおむねこちらの意味で取る。ただ彖伝・象伝には「天命」「天」という言葉があり、孔子の頃からすでに偽りなき誠の意味でも考えられていた。人が望まないのにそうなるのも天のはたらきに通じるので、二つの解釈はまったく相容れないものではない。六三の「无妄の災い」、九五の「无妄の疾」などは、象伝・伊川は一貫して誠の意味で解釈しようとするが、むしろ「思いがけない」と訳した方がすんなり意味が通る。</li></ul>\n<h3 id=\"g25-s1\">卦辞</h3>\n<div class=\"orig\">无妄、元亨利貞。其匪正有眚、不利有攸往。</div>\n<div class=\"yomi\">无妄は、元いに亨る、貞しきに利あり。其れ正に匪ざれば眚（わざわい）有り。往く攸有るに利あらず。</div>\n<p>この卦が出たら、願いごとは大いに通る。ただし占う人の動機が正しいことが条件で、正しくなければ災いがある。その場合、前進しても利益はない。</p>\n<p><span class=\"tag\">程伝</span>无妄とは至誠のことである。至誠は天の道である（『中庸』に「誠は天の道なり。之を誠にするは人の道なり」）。天が万物を化育して生生窮まりなく、それぞれの性命を正す（乾の彖伝の文句）のは无妄である。人が无妄の道に合致できれば、いわゆる「天地と其の徳を合する」（乾の文言伝）ことになる。无妄には大いに亨る理があり、君子が无妄の道を行えば大いに亨る。卦辞は人が无妄の道に拠るべきことを言う。「貞しきに利あり」とは、无妄の道に拠るには正しさを常に保つのがよいということで、正しさを失えば妄である。たとえ邪心がなくても、正しい理に合わなければ妄であり、それはすなわち邪心である。正しくなければ過ちや災いとなる。すでに无妄であるなら、それ以上往こうとしてはならない。往けば妄となる。</p>\n<p>本田の講説：伊川の注は、これをひたすら誠の道という方向で解釈する。</p>\n<h3 id=\"g25-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、无妄、剛自外來而爲主於内。動而健、剛中而應。大亨以正、天之命也。其匪正有眚、不利有攸往。无妄之往、何之矣。天命不祐、行矣哉。</div>\n<div class=\"yomi\">彖に曰く、无妄は、剛 外より来て内に主となる。動いて健なり。剛中にして応ず。大いに亨るに正を以てす。天の命なり。其れ正に匪ざれば眚有り、往く攸有るに利あらずとは、无妄の往く、何くにか之かん。天命祐けず、行かんや。</div>\n<p>无妄は、陽爻が外から来て内卦の主となった形である（坤の初爻に外から陽が入って震になった）。下は動き、上は健やか。九五が中にいて六二と応じる。正しい態度で大いに通る。これが天の命である。動機が正しくなければ災いがあり前進してはならないのは、自分が誠であるならそれ以上どこへ行くことがあろう。行こうとしても天命は助けない。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>初九をいう。坤の初が変じて震となった。外から来たのである。震は初を主とし、卦はこれによって成るので、初は无妄の主である。天をもって動くのが无妄で、動くことが主眼である。剛で柔を変ずるのは、正をもって妄を去る象である。また剛正が内の主となるのも无妄の義である。九が初にいるのは正である。</li><li>下は動き上は健。その動きが剛健であることが无妄の体である。「剛中にして応ず」とは、五が剛で中正にいて、二も中正をもって応ずることで、理に順って妄でない。だからその道は大いに亨通して貞正である。これが天の命で、天命とは天道、いわゆる无妄である。</li><li>无妄は正しいということに尽きる。少しでも正を失えば過ちがあり、それがすなわち妄である。「正に匪ず」が起こるのは往くことがあるからである。无妄のままで往かなければ、どうして正でないことがあろう。无妄は理の正である。さらに往こうとすれば妄に入り、天理に悖る。天命の祐けないところで、行くことはできない。</li></ul>\n<p>本田の講説：彖伝のこの部分は、「无妄」に「自然に任せる」というニュアンスも含んでいるようである。誠という状態に安住して動かなければ不正も発生しない。物事のあるがままに任せよということである。</p>\n<h3 id=\"g25-s3\">大象</h3>\n<div class=\"orig\">天下雷行、物與无妄。先王以茂對時、育萬物。</div>\n<div class=\"yomi\">天の下に雷行き、物ごとに无妄を与う。先王以て茂（さか）んに時に対し、万物を育す。</div>\n<p>天の下に雷がうごめいている形。春になって初めて雷が鳴り、万物一つ一つに誠の道を与える。昔の王者はこれにのっとって、天の時にかなうように行動し、万物を育てた。本田によれば、伊川や朱子は「物ごとに无妄を与う」と読むが、「物ごとに与（とも）にす」と切って読み、雷のめぐりに万物が参加するとする注釈もある。</p>\n<p><span class=\"tag\">程伝</span>雷が天の下を行くと、陰陽が和し相迫って声を成す。そこで蟄（穴ごもりの虫）を驚かし、萌芽を振るい動かし、万物を発生させる。その賦与するものは、大小高下それぞれの性命を正し、少しの差いもない。これが「物ごとに无妄を与う」である。先王は天の下を雷が行き、発生し賦与する象を観て、天の時に対応して万物を養育し、それぞれのよろしさを得させる。天が物に无妄を与えるようなものである。「茂」は盛んの意。「対す」とは、『詩経』大雅・文王の「永く言に命に配す」と同じ類で、天の時に順い合うことである。天道が万物を生じ、それぞれ性命を正して妄でないように、王者も天道を体して人民を養育し、昆虫草木に至るまでそれぞれのよろしさを得させる。これが時に対し物を育する道である。</p>\n<p>本田の講説：古代中国人は、雷とは陰陽の気の衝突であると理解した。</p>\n<h3 id=\"g25-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>无妄と無望。</b> 本田は繰り返し、无妄を「無望」（望外・思いがけない）の意味に取った方が爻辞がわかりやすいと言う。易はもともと占いのテキストなので、「思いがけない良いことがある」という判断があってもおかしくないのに、天道の誠という方向に解釈しようとするから無理が出る。</li><li><b>春申君の話。</b> 『史記』春申君列伝の「无望の福有れば、无望の禍有り」の背景。楚の春申君は、秦に人質となっていた皇太子（後の烈王）を命がけで救い出して即位させ、絶大な権力を握った。子のない烈王に、李園という悪い男が自分の妹をまず春申君に奉り、その女が春申君の子を身ごもったところで烈王に献上した。烈王はその子をわが子と思って太子にし、春申君は事実上次の王の父となった。侍従の朱英が「必ず李園を殺せ。望外の福があれば望外の禍がある」と諫めたが、春申君はためらって殺さず、結局李園に殺された。</li><li><b>受講者との問答。</b> 受講者が「无妄というのは、うそがないということなんですね」と言うと、本田は、象伝の「物ごとに无妄を与う」は物それぞれの道理という倫理的な意味に取れるが、「無望」の方で解釈することもできる、望まないのに放っておいてもそうなるということは、そうなることが自然の道理だということだ、と答えた。「禍があれば福があり、あざなえる縄のごとしということですね」という問いに「そういうことです」、「先生のご本には『自然の合目的性』とありますね」に「同じ意味です」と答えた。</li><li><b>作為と無作為。</b> 六二の程伝で、ある人が「聖人が卦にのっとって物を創作したのは作為ではないか」と問い、伊川は、聖人は時に随って作ったのであって、時に先んじて無理に作ったのではない、時を待たずに作れるなら一人の聖人ですべて作れたはずで、歴代の聖人が代わる代わる作る必要はなかった、と答えている。</li><li><b>収穫を期待して耕すのは妄か。</b> 六二の象伝の程伝によれば、収穫をあてにして耕せば妄である。本田は、百姓は収穫があろうがなかろうが本能的に毎年耕作しなければならないと考えているようで、宋代の道学者らしい、だいぶ苛酷な考え方だと言う。伊川以後の学者で、いかに愚かな百姓でも収穫を期待しないで耕作する者はいないだろうとからかった者がいる。</li><li><b>得には必ず失がつきまとう。</b> 六三の程伝。本田は『呂氏春秋』貴公篇の話を添える。楚王が狩りで弓を忘れ、おつきの者が惜しむと、王は「楚人が失い、楚人が得た。惜しむことはない」と言った。孔子はこれを聞いて「楚と言わなければもっと良かった」と評し、老子はさらに「いっそ人とも言わない方がなお良かった」と述べた。</li><li><b>誠の人は病気にならない。</b> 九五について受講者が「精神も豊かで健康な人は病気になっても薬など呑んではだめだと言っているのか」と問うと、本田は「ええ。その裏には、精神も豊かで何のうそもない人は病気にならないという信仰があります」と答えた。また「薬石」の「石」は針灸の針で、もともと石で作り、後に金属になって「鍼」の字を用いるようになったと説明した。</li></ul>\n<h3 id=\"g25-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>願いは大いに通るが、動機が正しいことが条件。正しくなければ災いがあり、前進してはならない。</li><li>誠であるならそれ以上じたばた動かず、自然の成り行きに任せよ。</li><li>思いがけない得には、必ず思いがけない失がついてくる（六三）。</li><li>今の立場を固く守れば咎はない（九四）。</li><li>思いがけない病気や災難も、誠であれば騒がず放っておけば治る。ムキになって攻めるとかえって悪くなる（九五）。</li><li>極まったところからさらに進めば災いを招く（上九）。</li></ul><h2 class=\"sec\" id=\"g25-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">无妄。往吉。</span></summary><div class=\"body\"><div class=\"yomi\">无妄なり。往けば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「无妄之往、得志也。」（无妄の往くは、志を得ればなり。）</div>\n<p>誠の道である。これに沿って行けば吉。本田によれば、『史記』の用例に従えば「思いがけないことがある」となる。</p>\n<p><span class=\"tag\">程伝</span>九は陽剛で内の主となる。无妄の象である。剛が柔を変じて内にいるのは、中が誠で妄でない者である。无妄をもって往けば、何の不吉があろう。卦辞に「往く攸有るに利あらず」と言うのは、すでに无妄であればさらに往ってはならない、過ぎれば妄になる、ということである。爻に「往けば吉」と言うのは、无妄の道をもって往けば吉だということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>无妄をもって往けば、志を得ないことはない。誠が物に対すれば、動かせないものはない。誠で身を修めれば身は正しく、事を治めれば事は理を得、人に臨めば人は感化される。どこへ行っても志を得る。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>偽りのない誠の心で進めば、思いどおりになって吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">不耕穫、不菑畬、則利有攸往。</span></summary><div class=\"body\"><div class=\"yomi\">耕さずして穫（か）り、菑（し）せずして畬（よ）するときは、則ち往く攸有るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不耕穫、未富也。」（耕さずして穫るは、未だ富まんとせざるなり。）</div>\n<p>耕作しないのに収穫があり、田の土をせっせと返さないのに地味が良くなる。こういう時は前進してよい。「菑」は開墾して一年目の田、「畬」は三年目のこなれた田。</p>\n<p>本田の講説：ここの伊川の注はずいぶん苦しい。爻辞自体は、何もしないのに儲かった、棚から牡丹餅という感じの文句である。伊川はそれが不満で、一生懸命倫理的に解釈しようとして二つの説をあげている。</p>\n<p><span class=\"tag\">程伝</span>事の理として当然そうなるものは妄ではない。人が意識して作為するのは妄である。だから農事でたとえた。二は中正の位にいて、五の中正に応じ、動（震）の体にいて柔順で、動いてよく中正に順う。无妄な者である。だから極端な言い方で无妄の義を表した。耕は農事の始め、穫はその終わり。田の一年目を菑、三年目を畬という。耕さずして穫り、菑せずして畬するとは、初めに自分から事を起こさず、事の理の当然に因るということである。初めに事を起こせば人心の作為で妄である。事の当然に因れば理に順い物に応じ、妄ではない。穫と畬がそれである（第一説）。あるいは、耕せば必ず穫があり、菑すれば必ず畬となるのは理の当然で、心意の作為ではない。このようであれば无妄で、往く所みな利がある（第二説）。</p>\n<p>本田の講説：第一説は、耕さないで放っておいても収穫があることがある、それが无妄だという内容だが、それだけでは具合が悪いので、耕せば必ず収穫があるのは理の当然で作為ではない、という第二説を加えたのであろう。この爻は「无妄」を「無望」の意味に解しておく方がわかりやすい。</p>\n<p><span class=\"tag\">象伝について程伝</span>「未だ」とは必ずそうだと決めてかかるのではないという辞で、臨の九二の象伝「未だ命に順わず」と同じである。耕さずに穫り、菑せずに畬するのは、事の当然に因る。耕せば必ず穫があり、菑すれば必ず畬となるが、富を必して（あてにして）するのではない。初めに耕し菑する時に心が穫や畬を求めていれば、富をあてにしてするのであり、心に欲があってするのは妄である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>思いがけない収穫や好結果がある。前進してよい。ただし利益をあてにして作為すれば妄となる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">无妄之災。或繫之牛。行人之得、邑人之災。</span></summary><div class=\"body\"><div class=\"yomi\">无妄の災あり。或は之が牛を繋ぐ。行人の得るは、邑人の災なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「行人得牛、邑人災也。」（行人の牛を得るは、邑人の災なり。）</div>\n<p>誠の道を踏んでいても災いがある。かりに畑の道に牛がつないであったとする。旅人がそれを黙って引いて行ってしまえば、牛の持ち主である村人には損害である。本田によれば、伊川は无妄を誠と解釈するのでこう読むことになるが、「予想外の災いに遭う」と取る方が後の文句がわかりやすい。</p>\n<p><span class=\"tag\">程伝</span>三は陰柔で中正でない。妄をなす者である。また上九と応じようとするのは欲があることで、これも妄である。无妄の道においては災害となる。人の妄動は欲があるからで、妄動して得れば必ず失がある。たとえ利を得ても、妄動したこと自体がすでに大きな失である。まして凶悔がついてくればなおさらである。知者は妄に得たものを見れば、必ずそれに相当する失があることを知る。だから聖人は六三の妄の象によってこの理を明らかにした。「或は」とは仮にということで、牛をつないでおいたのを行人が得れば有利だが、邑人にとっては災いである。邑人が迷い込んだ馬を得れば、行人にとっては災いである。得があれば失があり、得とするに足りない。行人・邑人は得があれば失があることを言うだけで、彼と我の損得を問題にしているのではない。妄に得た福には災いがついてくる。妄に得た得には失がついてくる。もとより得とするに足りない。人がこれを知れば妄動しなくなる。</p>\n<p>本田の講説：損と得とはあざなえる縄のごとくで、爻辞の例で言えば、牛を盗んだ旅人には必ずバチが当たるということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>行人が牛を得るのは邑人の災いである。得があれば失があり、得とするに足りない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>思いがけない災難。人の得は自分の損になる。棚ぼたの得も必ず損を伴うので、欲に動かされて妄動するな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">可貞。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">貞にす可し。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「可貞无咎、固有之也。」（貞にす可し咎无しとは、固く之を有つなり。）</div>\n<p>今の立場を固く守れ。そうすれば咎はない。</p>\n<p><span class=\"tag\">程伝</span>四は剛陽で乾の体にいて、応ずるもの（初も陽）がない。剛で私心のない者で、どうして妄があろう。貞固に守るべきで、自ずから咎はない。ある人が「九が四（偶数位）にいるのに正と言えるのか」と問うた。答え：剛陽で乾の体にいるうえに、さらに剛（奇数位）にいれば過ぎることになり、過ぎれば妄である。四にいるのは剛を尚ぶ志がないのである。「貞にす可し」は「貞しきに利あり」とは同じでない。「貞にす可し」は今いる所を固く守れということ、「貞しきに利あり」は正しくあれば利があるということである。</p>\n<p>本田の講説：ふつう応援がないのは良くないことだが、ここでは特定の者を贔屓しないという良い意味に解釈される。</p>\n<p><span class=\"tag\">象伝について程伝</span>正しく固く守れば咎はない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>動かず今の立場を固く守れば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">无妄之疾、勿藥有喜。</span></summary><div class=\"body\"><div class=\"yomi\">无妄の疾あり。薬すること勿くして喜び有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「无妄之藥、不可試也。」（无妄の薬は、試む可からざるなり。）</div>\n<p>誠ある人にも病気が降りかかる。薬を用いない方がよい。必ず治る。本田によれば、无妄を「無望」と考えれば、思いがけず病気にかかるという意味になる。「喜び」とは治ることである。</p>\n<p><span class=\"tag\">程伝</span>九は中正で尊位にいて、二も中正で順応する。无妄の至った者と言える。その道にこれ以上加えるものはない。「疾」とは害をなすものである。五ほどの无妄であれば、疾があっても薬で治さなければ喜びがある。人に疾があれば薬石で邪を攻め去り、正を養う。もし気体が平和で本来病気がないのに攻め治せば、かえって正を害する。だから薬しなければ喜びがある。「喜び有り」とは、疾が自ずから亡ぶことである。无妄における疾とは、治めても治まらず、率いても従わず、化しても改めない者のように、妄をもって无妄に害をなす者である。舜にとっての有苗、周公にとっての管叔・蔡叔、孔子にとっての叔孫武叔がそれである。すでに无妄で、これを害する者があっても、自然の疾のように憂えるに足りないとすべきである。もし自ら攻め治めようとすれば、その无妄を変えて妄に入ることになる。五は无妄の極みにいるので、戒めは動くことにある。動けば妄である。</p>\n<p>本田の講説：有苗氏は部族の名で、反乱してやまないので舜が三危の山に流した。管叔・蔡叔は周公の兄弟で、周公の悪口を言い、殷の遺民を率いて反乱を起こした。叔孫氏は魯の家老職の三桓（季孫・叔孫・孟孫）の一つで、叔孫武叔が孔子をそしったことが『論語』子張篇に見える。</p>\n<p><span class=\"tag\">象伝について程伝</span>人に妄があれば、理として必ず改めるべきだが、すでに无妄であるのに薬で治そうとすれば、かえって妄となる。だから「試む可からず」という。「試みる」とは、しばらく用いてみること、少しなめてみるというのと同じである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>思いがけない病気や災難。慌てて手を打たず放っておけば自然に治る。自分を害する者がいても、カッとなって攻めれば自分が妄に陥る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">无妄行、有眚。无攸利。</span></summary><div class=\"body\"><div class=\"yomi\">无妄にして行く。眚有り。利する攸无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「无妄之行、窮之災也。」（无妄の行くは、窮まるの災いあるなり。）</div>\n<p>誠の道の終わりにあって、さらに前進しようとする。災いがある。何の利益もない。</p>\n<p><span class=\"tag\">程伝</span>上は卦の終わりにいて、无妄が極まった者である。極まってなお行けば、理に過ぎる。理に過ぎれば妄である。だから上九で行けば過ちや災いがあり、利するところがない。</p>\n<p><span class=\"tag\">象伝について程伝</span>无妄がすでに極まって、さらに加え進めば妄となる。窮極して災害となるのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>もう行き着くところまで来ている。さらに進めば災いを招くだけで利はない。</div></div></details><div class=\"pager\"><a href=\"#gua-24\">← 地雷復</a><a href=\"#gua-26\">山天大畜 →</a></div>", "gua-26": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 26 卦　第四十五講〜第四十六講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山天大畜</div><div class=\"yo\">さんてんだいちく</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-26\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-26\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-26\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-26\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-26\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-26\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-26\" data-jump=\"yao\">六爻</a></div><h3 id=\"g26-s0\">卦の名と象</h3>\n<p>「畜」には「とどめる」意味で「チク」と読む場合と、「やしなう」意味で「キク」と読む場合があるが、卦の名としては「ダイチク」と「とどめる」の方で読む。下半分が乾、上半分が艮。</p>\n<p>程伝（序卦伝を引く）：「无妄有りて、然る後畜う可し。故に之を受くるに大畜を以てす」。无妄であれば実がある。実があってこそ蓄えることができる。だから无妄の次に大畜が来る。</p>\n<ul class=\"sen\"><li>卦は艮が上、乾が下で、天が山の中にある。蓄えるものが至って大きい象である。</li><li>畜は止めるという意味でもあり、蓄えるという意味でもある。止めれば集まる。天が山中にある象から言えば、人の心の中に教養や道徳が蘊蓄として蓄えられる意味になる。止めるという艮が健やかに進む乾を止めていることから言えば、大きく止めるという意味になる。止めてこそ蓄積ができるので、止めることが蓄積の意味にもなる。</li></ul>\n<p>本田の講説：天が山の中に蓄えられるなど実際にはありえないが、イメージとして大いなる蓄積のシンボルになる。</p>\n<h3 id=\"g26-s1\">卦辞</h3>\n<div class=\"orig\">大畜、利貞。不家食吉。利渉大川。</div>\n<div class=\"yomi\">大畜は貞しきに利あり。家食せずして吉なり。大川を渉るに利あり。</div>\n<p>大畜の卦が出れば、心がけが正しければ利益がある。朝廷に用いられ高い役職につくのがよい（「家食せず」とは、家で飯を食わないこと、つまり官職につくこと）。冒険をしてもよい。</p>\n<p><span class=\"tag\">程伝</span>天ほど大きいものはないのに山の中にある。艮が上にあって乾を下に止めている。いずれも至って大きなものを蘊蓄する象である。人で言えば、学術道徳が内に充積していること、つまり蓄えるものが大きいことである。人の蘊蓄は正道を得なければならない。だから「貞しきに利あり」。異端の学のように、蓄えるものは多くても不正なものがある（本田によれば、道学者から言えば主に老荘と仏教のこと）。道徳が身に充積すれば、上位にあって天禄を受け、天下に施すべきで、そうなれば一身の吉ではなく天下の吉である。困窮して自ら家で食らうのは、道がふさがっているからである。だから家で食らわなければ吉。蓄えたものはすでに大きいので、時に施して天下の艱険を救うべきである。これが大畜の用で、だから「大川を渉るに利あり」。これは大畜の義によって言った。彖伝は卦の才徳によって言う。爻は止めるという義だけで言う。易は道を体とし、爻に即して宜しきを示し、明らかで近いものを取るのである。</p>\n<p>受講者との問答：受講者が「『家食』というのは外で仕事をしないで家でゴロゴロしていることか」と問うと、本田は「ゴロゴロしているのではなく、朝廷の禄を食まず、自力で田んぼを耕して生計を立てること」と答えた。また「易の卦辞によく『利あり』とあるが、この利は利益という意味か」との問いに「易はもともと占いだから、利益について語っても不思議はない」と答え、「『論語』では孔子は利についてあまり語らなかったと
