あるが」との問いには「易の卦辞と孔子とでは利についての考え方が違う。孔子は厳格主義で、損得を考えて行動してはならないという立場を取る。しかし損得を考えないなら占いをする必要もないわけで、易の方は損得を問題にする」と答えた。</p>\n<h3 id=\"g26-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、大畜、剛健篤實、輝光日新其德。剛上而尚賢、能止健、大正也。不家食吉、養賢也。利渉大川、應乎天也。</div>\n<div class=\"yomi\">彖に曰く、大畜は剛健篤実、輝光あり。日に其の徳を新たにす。剛、上にして賢を尚ぶ。能く健を止む、大正なり。家食せずして吉とは、賢を養うなり。大川を渉るに利あるは、天に応ずればなり。</div>\n<p>大畜は強く健やかで（乾の性質）、生真面目（艮の性質）であり、教養が内に充実して外に光り輝き、日々徳を新たにする。陽爻が一番上にいるのは、六五の君主が賢者を尊んで自分の上に置いたのである。強い乾を上の艮がよく止めている。これは大いに正しい。禄をもらえれば吉なのは、君主が賢者を養うからである。冒険してよいのは、行動が天に応じているからである。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦の才徳で言う。乾の体は剛健、艮の体は篤実。人の才が剛健篤実であれば、蓄えるものがよく大いに充実して輝く光がある。蓄えてやまなければ、その徳は日々新たになる。</li><li>「剛上」とは陽が上にいることで、陽剛が尊位（五）の上にいるのは賢を尊ぶ象である。止まる艮が健やかな乾の上にいるのは健を止める義である。健を止めることは大正でなければできない。上にいる陽が賢を尊ぶ六五に尊ばれて、よく至健を止める。みな大正の道である。</li><li>大畜の人は蓄えたものを施して天下を救うべきである。だから家で食らわなければ吉。天位にいて天禄を受けることである。国家が賢を養えば、賢者はその道を行うことができる。「大川を渉るに利あり」とは、蘊蓄ある人は天下の艱険を救うべきだということで、彖伝はさらに卦の才を明らかにして、天に応ずるからだと言う。六五は君で、下の乾の中（九二）に応ずる。大畜の君が乾に応じて行うのである。行いが天に応ずれば、渡れない険はない。まして他の小さなことはなおさらである。</li></ul>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>『大学』に引く殷の湯王の盤（金だらい）の銘に「苟に日に新たならば、日に日に新たに、又た日に新たならん」とある。王が毎日それを読んで反省した。殷は甲骨や青銅器に文字を彫った遺物が多く残っていて実在は間違いなく、出土品によって『史記』の系図もすべて正しいことが実証された。司馬遷は出土品など知る由もなく伝承に頼ったのだが、それが正確だった。夏はまだ実在が確認されていないが、殷のような高度な文明が忽然と現れるはずはなく、その前にも何らかの文明があったと考えるのが自然で、実際殷より古い遺物も最近発掘されている。ただそれが夏と名乗る王朝だったかはまだわからない。湯は儒教では堯・舜・禹・文王・武王・孔子と並ぶ聖人で、孟子は聖人とはされず「亜聖」（聖人に次ぐ者）とされる。「聖」という字は「耳」に意味があり、どんな遠い所のことでも耳に届くということである。</li><li>下位者の前進を押し止めることは下剋上を防ぐことだから、大いに正しい。</li><li>この彖伝の部分は、伊川の読みのほかに「剛健篤実、輝光日に新たなり。其の徳剛上にして賢を尚ぶ」と読む説もある。</li><li>受講者が「大正という元号はここから来たのか」と問うと、本田は「そうかもしれません」と答えた。</li></ul>\n<h3 id=\"g26-s3\">大象</h3>\n<div class=\"orig\">天在山中、大畜。君子以多識前言往行、以畜其德。</div>\n<div class=\"yomi\">天、山中に在るは大畜なり。君子以て多く前言往行を識（し）り、以て其の徳を畜う。</div>\n<p>天が山の中にあるのが大畜である。君子はこれにのっとって、昔の人の善き言葉と行いを多く知り、自分の徳を蓄える。</p>\n<p><span class=\"tag\">程伝</span>天は至大であるのに山の中にある。蓄えるものが至大である象である。君子はこの象を観て、自分の蘊蓄を大にする。人の蘊蓄は学問によって大きくなる。それは昔の聖賢の言葉と行いを多く聞くことにある。その事跡を考えて効用を観察し、その言葉を察してその心を求め、知って我が物とし、それによって徳を成す。これが大畜の義である。</p>\n<h3 id=\"g26-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>小畜と大畜。</b> 受講者の問いに本田は、文字通り蓄えるものが大きいか小さいかだと答えた。小畜の象伝は「君子以て文徳を懿くす」で、文徳（文章才芸）は君子の蘊蓄のなかでは道徳に比べて小さい。大畜の君子はまさに「其の徳を畜う」。また畜には止める意味もあり、小畜・大畜ともに陽を圧し止めようという形の卦だが、小畜は陰爻が一本しかなく、大畜は二本あるので、圧し止める力も小畜の方が小さい。力の大小という点でも、小畜の判断辞より大畜の判断辞の方が概してめでたい。</li><li><b>応じる関係が止める関係になる。</b> 初九の程伝によれば、大畜では乾の三爻は止められる側、艮の三爻は止める側として義を取る。ふつうの卦では陰陽で応ずる初と四は助け合う関係だが、大畜ではかえって相手を止める関係になる。逆に上と三はともに陽で、ふつうなら反発するが、陽はみな上り進むものなので、同志という意味になり止めることにはならない。</li><li><b>時と勢い。</b> 九二の象伝の程伝は、初・二は乾体でも進むに足りず、四・五は陰柔でもよく止める、時の盛衰と勢いの強弱は、易を学ぶ者が深く見極めるべきことだ、と言う。</li><li><b>悪は芽のうちに止めよ。</b> 六四の程伝は、悪は始めのうちなら止めやすく、盛んになってから禁じれば抵抗されると説く。本田は、伊川の注は易を現実的な教訓として解釈する傾向があるが、ここは割合その解釈法の冴えたところが見える、と言う。</li><li><b>悪の根本を断て。</b> 六五の程伝は、刑罰を厳しくして力ずくで抑えるのでなく、悪の生ずる本源をふさげ、民に生業を与え廉恥を教えよ、と説く。本田は『論語』顔淵篇で、魯の実力者季康子が泥棒の多いことを孔子に相談し、孔子が「あなた自身が欲を捨てたなら、褒美を与えても盗みはしないだろう」と答えた話を添える。</li><li><b>宦官と牧畜。</b> 受講者が「宦官というのも去勢された男性ですね」と言うと、本田は、日本に宦官が伝わらなかったのは牧畜社会でなく去勢の技術がなかったからだろう、宦官がいるのは中国に限らず、みな牧畜社会だ、と答えた。</li><li><b>反切。</b> 九二の注の下にある「徒活反」について、本田は反切法で、上の字の子音と下の字の母音を組み合わせて発音を示す（「徒」の子音と「活」の母音で「タツ」）と説明した。</li><li><b>「已」と「巳」。</b> 版本ではよく混用される。「やめる」「すでに」は「已」が正しく、「巳」は干支で使う。「己」（おのれ）は割合きちんと区別されている。</li></ul>\n<h3 id=\"g26-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>大いなる蓄積の時。心がけが正しければ利がある。家に引きこもらず世に出て用いられよ。冒険してもよい。</li><li>昔の人の言葉と行いを学んで、自分の徳を蓄えよ（大象）。</li><li>下の三爻（止められる側）は、勢いを見て踏みとどまるのがよい。危険を冒して進めば災いがある（初九・九二）。</li><li>進む時も、困難を自覚し、備えと慎みを怠るな（九三）。</li><li>上の側にあっては、悪や暴走は芽のうちに、根本から止めよ（六四・六五）。</li><li>止めることが極まれば、道は大きく開ける（上九）。</li></ul><h2 class=\"sec\" id=\"g26-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">有厲。利已。</span></summary><div class=\"body\"><div class=\"yomi\">厲（あやう）きこと有り。已むるに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有厲利已、不犯災也。」（厲きこと有り、已むるに利ありとは、災いを犯さざるなり。）</div>\n<p>危険がある。踏みとどまった方がよい。</p>\n<p><span class=\"tag\">程伝</span>大畜は艮が乾を止畜する卦である（ここでは「止畜」と熟語にしているので、畜は止める意味）。だから乾の三爻はみな止められる義を取り、艮の三爻はみな止める義を取る。初は陽剛で健体であり下にいる。必ず上り進む者である。六四が上にいて自分を止める。上にいて位を得ている勢いにどうして敵えよう。もし犯して進めば必ず危うい。だから已めて進まないのがよい。他の卦なら四と初は正応で助け合う者だが、大畜では相応ずるのがかえって相止めることになる。上と三はともに陽なので志を合わせる。陽はみな上り進むもので、同志の象があり、止める義はない。</p>\n<p><span class=\"tag\">象伝について程伝</span>危うさがあるなら已むべきで、危うさを犯して行ってはならない。勢いを量らずに進めば、災いがあるのは必至である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>前進すれば危険。勢いの強い相手に阻まれているので、踏みとどまれ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">輿說輹。</span></summary><div class=\"body\"><div class=\"yomi\">輿、輹（ふく）を説（と）く。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「輿說輹、中无尤也。」（輿、輹を説くは、中にして尤め无きなり。）</div>\n<p>馬車から車軸を縛る紐がほどけてしまった。本田によれば、原始的な方法では車軸を車台に革紐でぐるぐる縛っていた。その革紐が輹で、ほどけると車軸がばらばらになって走れない。にっちもさっちも行かないということである。</p>\n<p><span class=\"tag\">程伝</span>二は六五に止められている。勢いとして進めない。五は上にいる勢いによっているので、どうして犯せよう。二は剛健の体だが、中道を得ているので進退に失がない。進む志はあっても、勢いが不可なのを量れば止まって行かない。輿が輹を脱したように、行かないということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>輿が輹を脱して行かないのは、中にいて道を得、動いて宜しきを失わないからで、だから尤めがない。善は中より善いものはない。柔中は過剛に至らないだけだが、剛中は中であって才がある。初九は中を得ていないので「厲きこと有り、已むるに利あり」と戒めた。二は中を得て進退に過ちがないので「輿、輹を説く」とだけ言い、自分から行かないことをいう。行かなければ尤めはない。初と二は乾体の剛健でも進むに足りず、四と五は陰柔でもよく止める。時の盛衰、勢いの強弱は、易を学ぶ者が深く知るべきところである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>進もうにも進めない。勢いが不利と見て自分から止まれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">良馬逐。利艱貞。日閑輿衛、利有攸往。</span></summary><div class=\"body\"><div class=\"yomi\">良馬逐（お）えり。艱貞に利あり。日に輿衛を閑（なら）わば、往く攸有るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「利有攸往、上合志也。」（往く攸有るに利ありとは、上 志を合すればなり。）</div>\n<p>良い馬の競争。困難を自覚して正しい道を守るのがよい。毎日、馬車の御し方と身の守り方を練習しておけば、前進してよい。爻辞の「曰」を、伊川は「日」に改めて読んでいる。</p>\n<p><span class=\"tag\">程伝</span>三は剛健の極みで、上九の陽も上り進むものである。また上九は畜の極みにいて変じようとしている。だから三を止めず、志を合わせてともに進む。三は剛健の才で、上と志を合わせて進む。その速さは良馬が追いかけ合うようである。進む勢いが速くても、自分の才の健やかさと上の応援を恃んで、備えと慎みを忘れてはならない。だから事の難しさを知り、正しい道によるべきである。輿は行くのに用いる物、衛は自ら防ぐ手段である。日常、輿と防衛を練習していれば往く所があってよい。三は乾体で正位にいて貞であることのできる者だが、鋭く進もうとするので、艱難を知ることと正を失わないことで戒めた。すでに進むことに鋭ければ、剛明であっても時に失敗がある。戒めないわけにはいかない。</p>\n<p>本田の講説：「輿」は馬車の箱の部分である。注の下に、陸徳明『釈文』に「曰」の音は「越」、劉表は「曰」は「言」と同じく「ここに」の意、鄭玄は「人実の反」つまり「日」として読み、日に車徒を習うと解する、とあり、伊川の『易伝』は鄭玄の説に従っている。</p>\n<p><span class=\"tag\">象伝について程伝</span>往く所があってよいのは、上にいる者と志を合わせるからである。上は陽性で上り進み、しかも畜の極みにあって変じようとしている。だから下の三を止めず、志を合わせて上り進むのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>同志とともに勢いよく進める時。ただし過信せず、困難を自覚し、日頃の備えと用心を怠らなければ、前進してよい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">童牛之牿。元吉。</span></summary><div class=\"body\"><div class=\"yomi\">童牛の牿（こく）。元いに吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六四元吉、有喜也。」（六四の元吉なるは、喜び有るなり。）</div>\n<p>子牛の角に横木をつける。大吉。</p>\n<p><span class=\"tag\">程伝</span>位で言えば、四は下の初に応じ、初を止める者である。初は下にいて陽の微かな者である。微かなうちに止めれば制しやすい。生えたばかりの子牛の角に横木を付けるようなもので、大いに善くて吉である。止める道を概論すれば、四は艮の体で上位にいて正を得ている。正しい徳で大臣の位にいて、止めることを任とする者である。大臣の任は、上は人君の邪心を止め、下は天下の悪人を止める。人の悪は、始めに止めれば易く、盛んになってから禁ずれば扞格して勝たない。だから上の悪が甚だしければ聖人が救っても払（もと）ることを免れず、下の悪が甚だしければ聖人が治めても刑戮を免れない。始めに止めるに越したことはない。牛は角で抵触するので牿で制する。角が生え始めたときに牿を加え、抵触の性を発させないようにすれば、易くて傷つけることがない。まして六四が上下の悪を未発のうちに止めれば、大善の吉である。</p>\n<p>本田の講説：四が大臣の位で、五が君主の位である。伊川の注釈は易を現実的な教訓として解釈する傾向があるが、ここは割合その冴えたところが見える。</p>\n<p><span class=\"tag\">象伝について程伝</span>天下の悪が盛んになってから止めれば、上は労し下は刑に傷つく。微小のうちに止めれば大善で吉、労せず傷つくこともない。だから喜ぶべきである。四が初を止めるのも、上が三を止めるのも同じである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>問題は芽のうちに抑えよ。早く手を打てば労せずして大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">豶豕之牙。吉。</span></summary><div class=\"body\"><div class=\"yomi\">豶豕（ふんし）の牙。吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六五之吉、有慶也。」（六五の吉なるは、慶び有るなり。）</div>\n<p>去勢された豚の牙。吉。去勢された豚は闘争心がなくなっておとなしくなる。本田によれば、古い文献では「豚」の字は使わず「豕」を使い、豕はちょうど猪と今の豚の中間くらいである。六四は牛がシンボルだったが今度は豚である。</p>\n<p><span class=\"tag\">程伝</span>六五は君位にいて、天下の邪悪を止める者である。億兆の衆が邪欲の心を発すれば、人君が力で制しようとしても、密法厳刑でも勝てない。物には総摂（一挙に束ねる要所）があり、事には機会がある。聖人はその要を握るので、億兆の心を一心のように見て、導けば行われ、止めれば止まる。だから労せずして治まる。その用は豶豕の牙のようである。豕は剛躁なもので、牙は猛利である。強いて牙を制すれば力を費やすばかりで、躁猛をやめさせられない。つないでも縛っても変えられない。もしその勢（生殖器）を去れば、牙は残っても剛躁はおのずから止む。だから吉。君子は豶豕の義にのっとって、天下の悪は力で制してはならないことを知り、その機を察し、要を持し、本原を塞ぐ。だから刑法の厳しさを借りずとも悪は自ずから止む。盗みを止める場合でも、民には欲があり利を見れば動く。教えを知らずに飢寒に迫られれば、毎日刑殺を施しても億兆の利欲の心に勝てようか。聖人は止める道を知っている。威を尚ばず政教を修め、民に農桑の業を持たせ廉恥の道を知らせれば、褒美を与えても盗まないだろう。悪を止める道は、その本を知りその要を得ることにある。刑を厳しくするのでなく政教を修める。豕の牙の鋭さを憂えるなら、牙を制するのでなく勢を去るようなものである。</p>\n<p><span class=\"tag\">象伝について程伝</span>上にいる者が悪を止める道を知らず、刑を厳しくして民の欲に敵対すれば、傷つくこと甚だしく功もない。もし本を知り制する道を得れば、労せず傷つけず、風俗は改まる。天下の福慶である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>力ずくで抑えつけるのではなく、問題の根本原因を取り除けば、自然に収まって吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">何天之衢、亨。</span></summary><div class=\"body\"><div class=\"yomi\">何ぞ天の衢（く）、亨る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「何天之衢、道大行也。」（何ぞや天の衢とは、道大いに行わるるなり。）</div>\n<p>これは何か、これは天の十字路である（衢は四方に通じる交差点）。願いごとは通る。本田によれば、伊川の先生である胡瑗は「何」は誤って入ったものとして「天の衢、亨る」と読む。</p>\n<p><span class=\"tag\">程伝</span>胡先生から「天の衢、亨る」で、誤って「何」の字を加えたのだと聞いた。事が極まれば反るのは理の常である。だから畜が極まれば亨る。小畜は畜が小さいので、極まって成る（和合する）。大畜は畜が大きいので、極まって散ずる。極まれば変ずべきであり、また陽性は上行するので、ついに散ずるのである。「天の衢」は天の路で、虚空の中を雲気や鳥が往来するので天衢という。天衢が亨るとは、広々として阻むものがないことである。畜の道にあっては極まれば変じ、変じて亨る。畜の道そのものが亨るのではない。</p>\n<p>本田の講説：胡瑗は象伝の「何」はあるべきだが、爻辞の「何」は象伝に影響されて誤って加えられたものと考えた。小畜の上九の爻辞は「既に雨ふり既に処る」で、陰陽が和合して雨となり、人は自分の居場所に静かに留まる。</p>\n<p><span class=\"tag\">象伝について程伝</span>何をもって天衢というのか。止めるものがなく、道路が大いに通行するからである。天衢は常の言葉ではないので、象伝は特に問いを設けて「何ぞや天の衢」と言い、道路が大いに通行するので虚空の状に取ったのである。象伝に「何」の字があるので、爻辞にも誤って加えたのである。</p>\n<p>本田の講説：これでも文意は通じるが、私の本にも書いてあるように、「何」は「荷」と同じ意味で用いられることがあり、この爻辞も「天の衢を何（にな）う」と読むのが正しいでしょう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>抑えられていたものが解き放たれ、道は四方に大きく開ける。願いは通る。</div></div></details><div class=\"pager\"><a href=\"#gua-25\">← 天雷无妄</a><a href=\"#gua-27\">山雷頤 →</a></div>", "gua-27": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 27 卦　第四十七講〜第四十八講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山雷頤</div><div class=\"yo\">さんらいい</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-27\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-27\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-27\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-27\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-27\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-27\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-27\" data-jump=\"yao\">六爻</a></div><h3 id=\"g27-s0\">卦の名と象</h3>\n<p>頤は「あご」、また「養う」の意味である。一番上と一番下だけが陽で、真ん中の四本の陰爻がちょうど歯のようで、卦全体で口を開けた形に見える。</p>\n<p>程伝（序卦伝を引く）：「物畜（あつ）まりて、然る後養う可し。故に之を受くるに頤を以てす」。物が集まれば、必ず養わねばならない。養わなければ存続し伸びることができない。これが頤が大畜に次ぐゆえんである（本田の例：社会集団ができれば民を養う必要がある）。</p>\n<ul class=\"sen\"><li>卦は上が艮、下が震で、上下の二陽の中に四陰を含む。上は止まり、下は動く。外が実で中が虚。人の頤（あご）の象である（物を噛む時、上顎は止まったままで下顎だけ動く）。頤は養うことで、人の口は飲食して身を養うものなので頤と名づけた。</li><li>聖人はこの卦を設けて養う義を推し広げた。大きくは天地が万物を養育し、聖人が賢を養って万民に及ぼし、さらに人が生を養い、形を養い、徳を養い、人を養うことに至るまで、みな養う道である。動息（運動と休息）・節宣（欲望の節制と発散）は生を養い、飲食・衣服は形を養い、威儀・行義は徳を養い、自分を推して物に及ぼすのは人を養うことである。</li></ul>\n<h3 id=\"g27-s1\">卦辞</h3>\n<div class=\"orig\">頤、貞吉。觀頤、自求口實。</div>\n<div class=\"yomi\">頤は、貞しければ吉。頤を観る。自ら口実を求む。</div>\n<p>この卦が出れば、正しければ吉。何が正しいかは、養い方を見る（他者の、また自分の養い方）。自分の口を満たす物を調達する手段を見なければならない。</p>\n<p>本田の講説：「口実」は飲食物、また爵位や俸禄など生活の資となるもの全般をさす。「口実」という言葉の出典はこれだが、今の「いいわけ」の意味での用例は、『書経』仲虺之誥で、殷の湯王が夏の桀王を討った時に「予は恐る、来世の台（われ）を以て口実と為さんことを」と言ったのが古い。湯王の予言どおり、後世クーデターを起こす者はみな湯王・武王を口実にした。この卦辞は「貞吉」の二字を下に持ってくるとわかりやすい。人はみずからの養い方と他人の養い方を見、自分の食べ物を調達する手段を見なければならない。それらが正しければ吉、というのがこの卦の判断である。</p>\n<p><span class=\"tag\">程伝</span>頤の道は、正しければ吉である。人が身を養い、徳を養い、人を養い、人に養われる（君主も民に養われる）のも、正道によれば吉である。天地の造化が万物を育養し、それぞれ宜しきを得させるのも、正しいからにほかならない。「頤を観る、自ら口実を求む」とは、人が養うものと、自ら口実を求める道とを観れば、善悪吉凶がわかるということである。</p>\n<h3 id=\"g27-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、頤貞吉、養正則吉也。觀頤、觀其所養也。自求口實、觀其自養也。天地養萬物、聖人養賢以及萬民。頤之時大矣哉。</div>\n<div class=\"yomi\">彖に曰く、頤は貞しければ吉とは、正を養えば則ち吉なり。頤を観るとは、其の養う所を観るなり。自ら口実を求むとは、其の自ら養うを観るなり。天地は万物を養い、聖人は賢を養いて以て万民に及ぼす。頤の時、大なるかな。</div>\n<p>養い方が正しければ吉である。何を養っているかを見、自分の身を養うものをいかに得ているかを見る。天地は万物を養い、聖人は賢人を養ってそのはたらきを万民に及ぼす。養うという時は偉大である。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「貞吉」とは、養うものが正しければ吉ということ。「養う所」とは、養う人と養う道のこと。「自ら口実を求む」とは、自ら身を養う道を求めること。みな正によれば吉である。</li><li>聖人の道を極言してその大を賛えた。天地の道は万物を養育し、その道は正にほかならない。聖人は賢才を養い、これと天位を共にし、天禄を食ませ（「天位」「天禄」は『孟子』万章下に出る）、恩沢を天下に施させる。賢を養うのは万民を養うゆえんである。天地の間の多くの物は、養わなければ生きられない。聖人は天地の道を裁成し、天地の宜しきを輔相して（泰の象伝の句）天下を養い、鳥獣草木に至るまでみな養う政がある。その道は天地に配する。だから孔子は頤の道を推して天地と聖人の功を賛え、「頤の時、大なるかな」と言った。卦によって「時義」と言い、「時用」と言い、あるいは「時」とだけ言うのは、何が大事かによる。物の生と養いには時が大事なので「時」と言った。</li></ul>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>「正」は、あらゆる生物の合目的的発達を表現している。「裁成」は布を裁ち切って着物を縫い上げるのが原義である。</li><li>聖人が天地と肩を並べ、天地が万物を育てるのに参加して万民を養うという、人間が神と同じことをやるという考えは、キリスト教では絶対にあり得ない。</li><li>六十四卦は、それぞれ特定の動作や状況にある時間を象徴している。意義が大事なら「時義」、はたらきが大事なら「時用」と言う。</li><li>受講者が「『義』と『宜』とは同じ意味か」と問うと、本田は、古典の文字解釈には同じ発音の字をよく用いる傾向があり、「仁は人なり、義は宜なり」と言われる、時義とは状況に応じて一番よろしきを得た行動だと考えられている、と答えた。</li></ul>\n<h3 id=\"g27-s3\">大象</h3>\n<div class=\"orig\">山下有雷、頤。君子以愼言語、節飲食。</div>\n<div class=\"yomi\">山の下に雷有るは頤なり。君子以て言語を慎み、飲食を節す。</div>\n<p>山の下に雷がある形。春が来て初めての雷が山の下で轟くと、山の草木が一斉に芽を吹く。だから物を養う意味が発生する。君子はこれにのっとって、言葉を慎み、飲食を節制する。</p>\n<p><span class=\"tag\">程伝</span>二体で言えば、山の下に雷がある。雷が山の下で震えば、山の生物はみな根荄（こんがい）を動かし萌芽を発する。養いの象である。上下の義で言えば、艮は止まり震は動く。上は止まり下は動く、頤頷の象である。卦の形で言えば、上下の二陽の中に四陰を含み、外が実で中が虚、頤口の象である。口は身を養うものなので、君子は象を観て身を養う。言語を慎んで徳を養い、飲食を節して体を養う。口について養う義を取るだけではない。至って身近で、しかも関係するところが至って大きいのは、言語と飲食に過ぎるものはない。身にあっては言語、天下にあっては命令・政教など、身から出るものはみなそうで、慎めば必ず当を得て失がない。身にあっては飲食、天下にあっては貨財・資用など人を養うものはみなそうで、節すれば必ず宜しきに適って傷つくことがない。身を養う道を推せば、徳を養い天下を養うのも同じである。</p>\n<p>本田の講説：体を養うと言えば口である。口のはたらきに重きを置けば、言語を慎み飲食を節することになる。三浦國雄君の本では「禍は口より出で、病は口より入る」ということわざを引いている。これは晋の傅玄の「口銘」（口についての戒め）という文章の句である。</p>\n<h3 id=\"g27-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>上の三爻と下の三爻。</b> 六四の程伝によれば、三以下（下卦）は口体（自分の体）を養う者で、四以上（上卦）は徳義を養う者である。君でありながら臣に養いを頼り、上位にいて下に養いを頼るのは、みな徳を養おうとするからである。本田は『孟子』の「人を治むる者は人に食われ、人に治めらるる者は人を食う」を引き、支配者が人民から取り立てた税で生活することを正当化したものだと言う。</li><li><b>相応ずるものが養う。</b> 六二の程伝によれば、頤の時には相応ずる（陰陽で引き合う）関係が養い養われる関係になる。卦中で人を養う力があるのは陽の初九と上九だけである。</li><li><b>伊川の境遇。</b> 六二の長い注について本田は、伊川はそれほど高い地位には昇らなかったが、天子を諫める官についていたことがあり、この判断にはさぞ思うところがあったのだろう、自分も養えないような無能力者がみだりに高い位につきたがることを当てこする気持ちがはたらいているに違いない、と言う。</li><li><b>男性本位の女性観。</b> 六二の程伝の「女は自ら処る能わず、必ず男に従う」について、本田はこの時代の人は男性本位の女性観を持っていると注意する。</li><li><b>成王と周公。</b> 六五の程伝の背景として、本田は『書経』金縢篇の話をする。武王が危篤になった時、周公は「自分の命を縮めても兄の命を助けてほしい」という願文を書いて金縢（針金でくくった箱）に収め、自分が死ぬまで開けるなと遺言した。武王の死後、周公が幼い成王の摂政になると、腹違いの弟の管叔・蔡叔が「周公は天下を奪おうとしている」と讒言して乱を起こし、周公は都を離れて東に行った（避難のためとも、討伐のためともいう）。成王は周公を多少疑っていたが、周公の死後、群臣が箱を開けて願文を見せると、成王はひどく泣いて周公を祭った。太公望は武王の参謀、召公は周公のいとこで、周公とともに天下を東西に二分して諸侯を束ねた。</li><li><b>伊尹。</b> 上九の程伝の伊尹は、料理番から殷の湯王の宰相になった人である。</li></ul>\n<h3 id=\"g27-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>養うことの正しさが問われる卦。自分が何を養い、どうやって生活の糧を得ているかを省みよ。正しければ吉。</li><li>言葉を慎み、飲食を節せよ（大象）。</li><li>自分の良さを捨てて他人の持ち物を物欲しげに見れば凶（初九）。</li><li>筋違いの相手に養ってもらおうとするのは恥をかき凶（六二）。養いの正道に背けば長く動くな（六三）。</li><li>上に立つ者が力不足なら、下位・上位の賢人に頼ってよい。威厳を保ち、施しを途切れさせなければ吉（六四）。ただし大冒険は控えよ（六五）。</li><li>天下を養う大任にある者は、常に危ぶみ慎めば吉。冒険してよい（上九）。</li></ul><h2 class=\"sec\" id=\"g27-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">舍爾靈龜、觀我朶頤。凶。</span></summary><div class=\"body\"><div class=\"yomi\">爾（なんじ）の霊亀を舎（す）てて、我を観て頤を朶（た）る。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「觀我朶頤、亦不足貴也。」（我を観て頤を朶る、亦た貴ぶに足らざるなり。）</div>\n<p>尊い亀の甲羅を持ちながら、それをわきに置いて、他人が飲食しているのを見て、物欲しそうに口をぽかんと開けて下あごを垂れ、よだれを垂らす。凶。本田によれば、亀自体に未来を知る力があると考えられたので甲羅は占いに用いられ、また亀は空気を吸うだけで餌を食べなくても死なないと言われた。</p>\n<p><span class=\"tag\">程伝</span>蒙の初六は蒙者だが、爻は発蒙する人を主として言う。頤の初も同じく外から仮に言っている。「爾」は初を指し、「我」は「爾」に対して仮に設けた辞である。初がよだれを垂らす相手は四だが、四が実際にこう言ったのではない。九は陽体で明智であり、その才は正を養うに足る。亀は気を咽（の）むだけで食べなくても生きられる。霊亀とは、明智で養いを外に求めなくてもよいことにたとえたのである。才がこのようでありながら、陽で動体（震）にいて、頤の時に養いを求めるのは、人の欲するところである。上の四に応じ、自分を守れずに上へ行こうとする。欲するところに心が動けば、必ず自分を失う。欲に迷って己を失い、陽でありながら陰に従えば、何でもしてしまう。だから凶。「頤を朶る」とは頤を垂れ動かすこと。人は食べ物を見て欲しければ頤を動かしよだれを垂らすので、これを象とした。</p>\n<p><span class=\"tag\">象伝について程伝</span>九は動体で、頤を朶るとは陰に心引かれて志が動くことをいう。欲に動かされれば、剛健明智の才があってもついには必ず自分を失う。その才ももはや貴ぶに足りない。人が剛を貴ぶのは、立って欲に屈しないからであり、明を貴ぶのは、照らして正を失わないからである。欲に迷ってその正を失えば、剛も明もどこにあろう。卑しむべきである。</p>\n<p>本田の講説：「屈」には「尽きる」の意味がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分に優れた才能や財産がありながら、それを忘れて他人の持ち物を羨む。欲に動かされて自分を失い、凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">顛頤、拂經。于丘頤、征凶。</span></summary><div class=\"body\"><div class=\"yomi\">顛（さかし）まに頤わる、経（つね）に払（もと）る。丘において頤わる、征けば凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六二征凶、行失類也。」（六二の征けば凶なるは、行きて類を失すればなり。）</div>\n<p>下の者に養われようと求めるのは常道に背いている（上の者が下を養うのが本来なのに、あべこべだから「さかしま」）。さりとて高い丘の上の人に養われようとして進んで行けば凶。</p>\n<p><span class=\"tag\">程伝</span>女は自ら処ることができず必ず男に従い、陰は独りで正しくあることができず必ず陽に従う。二は陰柔で自ら養えず、人の養いを待つ者である。天子は天下を養い、諸侯は一国を養い、臣は君上の禄を食み、民は司牧の養いに頼る。みな上が下を養うのが理の正しさである。二が自ら養えないなら陽に養いを求めるべきだが、もし反対に下の初に求めれば顛倒である。だから「顛まに頤わる」という。顛倒は常道に背き、行うべきではない。もし丘に養いを求めれば、往けば必ず凶がある。丘は外にあって高いもので、上九を指す。卦には二陽しかなく、初に顛倒して養われるべきでもなく、上九に求めて往けば凶がある。頤の時には相応ずる者が相養う者である。上は応ではないのに往って養いを求めるのは非道・妄動で、だから凶。今ある人がいて、才は自らを養うに足りず、上にいる者の勢力が人を養うに足りるのを見て、同類でもないのにみだりに往って求めれば、辱めを受け凶を得るのは必至である。ある人が「六二は中正で、他の卦では多く吉なのに、ここではなぜ凶なのか」と問うた。答え：時がそうさせるのである。陰柔で自ら養うことができず、初と上はどちらも自分の応ではないので、往って求めれば理に悖り凶を得る。</p>\n<p>本田の講説：懇切丁寧な長い注である（伊川の境遇については前述）。</p>\n<p><span class=\"tag\">象伝について程伝</span>往って上に従えば凶なのは、上が同類（応）ではないからである。往って求めて類を失えば凶を得るのは当然である。「行」は「往く」の意味である。本田によれば、こんな簡単な字に注があるのは「おこない」と読まないようにということである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力で生活できず、筋違いの相手に頼ろうとする。目下に頼るのは道に外れ、縁のない上の者にすがれば恥をかいて凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">拂頤貞。凶。十年勿用。无攸利。</span></summary><div class=\"body\"><div class=\"yomi\">頤の貞しきに払（もと）る。凶。十年用うる勿れ。利する攸无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「十年勿用、道大悖也。」（十年用うる勿れとは、道大いに悖ればなり。）</div>\n<p>人や自分を養う正道に背いている。凶。十年間動いてはならない。何の利益もない。本田によれば、これは伊川および朱子の読みで、ふつうの文法では「頤に払れり。貞しけれど凶」と二字ずつ切りたくなる（師の六五にも「貞しけれど凶」がある）。そう読めば「動機は正しいけれど結果は凶」という判断になるが、伊川や朱子はこういう倫理的でない判断を嫌った。</p>\n<p><span class=\"tag\">程伝</span>頤の道は正しければ吉である。三は陰柔の質で、位も中正でなく（下卦の真ん中でなく、陰が奇数位）、しかも動（震）の極にいる。柔邪不正で動く者である。その養い方はこのようで、頤の正道に背いている。だから凶。頤の正を得れば養うものはみな吉で、養いを求め人を養えば義に合い、自ら養えば徳を成す。三は正に背いているので「十年用うる勿れ」と戒めた。十は数の終わりで、ついに用いてはならないということ。往く所として利はない。</p>\n<p><span class=\"tag\">象伝について程伝</span>ついに用いてはならないと戒めるのは、拠っている道が大いに義理に悖るからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>生き方・稼ぎ方が正道に背いている。凶。いつまでも動いてはならず、何をしても利はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">顛頤。吉。虎視眈眈、其欲逐逐。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">顛まに頤わる。吉。虎視眈眈（たんたん）たり、其の欲逐逐（ちくちく）たり。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「顛頤之吉、上施光也。」（顛まに頤わるるの吉なるは、上の施し光（かがや）けばなり。）</div>\n<p>逆さまに下位者に養われる。吉。ただし虎が睨むような威厳を持ち、民の生活に必要な物が途切れないよう適宜取り立てよ。そうすれば咎はない。本田によれば「虎視眈眈」という熟語の出典で、具体的でおもしろい判断だが意味が難しいので、伊川の注釈に従って訳すという。</p>\n<p><span class=\"tag\">程伝</span>四は人の上にいる大臣の位である。陰で位にいて、柔で自らを養うにも足りず、まして天下を養うことはできない。初九は陽剛で下にいる在下の賢である。四と応じ、四は柔順で正しく初に応じ、初の養いに頼る。上が下を養うのが順で、今かえって下の養いを求めるのは顛倒である。だから「顛まに頤わる」。しかし、自分がその任に堪えないので下の賢を求めて順い従い、事を成せば、天下はその養いを得て自分も曠廃の咎がない。だから吉である。上位にいる者は、必ず才徳と威望があって下民に尊び畏れられれば、事が行われて衆心が服従する。もし下が上を侮れば、政令を出しても人は背き、刑を施せば怨みが起こる。陵犯を軽んずるのは乱のもとである。六四は剛陽に順従してその職を廃さないが、質はもともと陰柔で、人に頼って事を成そうとする者で、人に軽んじられやすい。だから必ず威厳を養い、虎のように眈眈と視れば、体貌を重くして下が侮らない。また人から取るには必ず常（恒常性）がなければならない。もし継続できなければ政は敗れる。「其の欲」とは用いるもので、必ず逐逐と相継いで乏しくなければ事は成る。もし取って継続できなければ困窮する。威厳があり施すところが窮まらないので、咎がない。ある人が「二の顛頤は経に払るのに、四はなぜ吉なのか」と問うた。答え：二は上にいながらかえって下に養いを求め、下は応ずる類ではないので経に払る。四は上位にいて、貴い身で賤しい者にへりくだり、在下の賢に自分を頼って道を行わせる。上下の志が応じて沢が民に施される。これ以上の吉はない。</p>\n<p>本田の講説：「人より取る者は必ず常有り」とは、後が続かないような恣意的な取り立てをしてはならないということで、続かなければ養うべき人民全部が苦しむことになる。長い注だが、言っていることはわかりやすい。</p>\n<p><span class=\"tag\">象伝について程伝</span>顛倒して養いを求めて吉なのは、剛陽の応を得て事を成し、上にいる徳を致し、光明を天下に施し被らせるからである。これ以上の吉はない。</p>\n<p>受講者との問答：受講者が「この爻辞はどうして『吉』と『咎无し』と両方出てくるのか」と問うと、本田は、こういうことは時々ある、「咎无し」より「吉」の方がめでたいが、この爻の場合、「虎視眈眈、其の欲逐逐」の部分が何か悪いことのように誤解されるのを恐れて「咎无し」と補足したのだろう、「虎のように睨め」「民から切れ目なく取り立てよ」と言うだけでは良くないことのように思われる恐れがある、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>力不足の上位者が、下の有能な人の助けを得て務めを果たす。吉。威厳を保ち、施しや供給を途切れさせなければ咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">拂經。居貞吉。不可渉大川。</span></summary><div class=\"body\"><div class=\"yomi\">経に払れり。貞に居るときは吉。大川を渉る可からず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「居貞之吉、順以從上也。」（貞に居るの吉なるは、順以て上に従えばなり。）</div>\n<p>常道に背いている。しかし正しい行き方を持続すれば吉。ただし自分の力で大河を渡るような冒険はしてはならない。</p>\n<p><span class=\"tag\">程伝</span>六五は頤の時に君位にいて、天下を養う者である。しかし陰柔の質は天下を養うに足りない。上に剛陽の賢がいるので、これに順従し、自分を養ってもらうことに頼って天下を救う。君は人を養う者なのに、かえって人の養いに頼るのは経常に背く。自分の不足を知って賢い師傅に順従する。上は師傅の位である。必ず貞固を守り、委ね信ずることが篤ければ、上九がよくその身を輔翼し、沢は天下に及ぶ。だから吉。陰柔の質には貞剛の性がないので、「貞に居れば吉」と戒めた。陰柔の才で剛賢に頼れば、平時を保つことはできても、変事の際に処することはできない。だから「大川を渉る可からず」。成王の才は甚だしく柔弱というほどではなかったが、管叔・蔡叔の乱に当たっては周公すらほとんど信じきれなかった。まして成王以下の者はなおさらである。『書経』（金縢）に「王も亦た未だ敢えて公を誚（せ）めず」とあり、太公・召公の二公の力に頼ってようやく信じられた。だから艱険の際には剛明の主でなければ頼みにならない。やむを得ず艱険を渡る君はいるが、この義を発したのは、君たる者を深く戒めるためである。上九で「大川を渉るに利あり」と言うのは、臣として身を致し忠を尽くす道によって言ったもので、立場が違うので判断も違う。</p>\n<p>本田の講説：上はすでに隠退して野に下った人に当たることが多いが、ここでは天子を指導し、名目上天子の上位にいる名誉職（師傅）として解釈している。</p>\n<p><span class=\"tag\">象伝について程伝</span>貞に居るの吉とは、堅固に上九の賢に順従して天下を養うことをいう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力不足を認め、優れた指導者に素直に従えば吉。ただし平時を守るのが精一杯で、大きな冒険は避けよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">由頤。厲吉。利渉大川。</span></summary><div class=\"body\"><div class=\"yomi\">由りて頤わる。厲（あやう）ぶめば吉。大川を渉るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「由頤厲吉、大有慶也。」（由りて頤わる、厲ぶめば吉とは、大いに慶び有るなり。）</div>\n<p>天下の民がこの上九によって養われる。自分の立場の危うさを自覚していれば吉。冒険してよい。</p>\n<p><span class=\"tag\">程伝</span>上九は剛陽の徳で師傅の任にいる。六五の君は柔順に従い、上九の養いに頼る。上九は天下の任に当たり、天下はこれによって養われる。人臣の身でこの任に当たれば、必ず常に危ぶみ畏れてこそ吉である。伊尹や周公は、いつも憂え勤めないことがなかったので、ついに吉を得た。君の才が足りないので自分に頼ってきた。天下の大任に当たっている。才力を尽くして天下の艱危を救い、天下の治安を成すべきである。だから「大川を渉るに利あり」。君にこれほど任され、責任をこれほど重く受けて、天下の艱危を救えなければ、どうして委託と賢人の名に値しよう。誠を尽くし力を尽くして身の安危を顧みないのが当然である。しかし危ぶみ畏れる心は忘れてはならない。</p>\n<p><span class=\"tag\">象伝について程伝</span>上の任に当たってこのように、危ぶみ慎むことがこのようであれば、天下はその徳沢を被る。これは大いに福慶があることである（「慶」は「福」と同じ）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大任を担い、多くの人を養う立場。常に危うさを自覚して慎めば吉。全力を尽くして困難に立ち向かってよい。</div></div></details><div class=\"pager\"><a href=\"#gua-26\">← 山天大畜</a><a href=\"#gua-28\">沢風大過 →</a></div>", "gua-28": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 28 卦　第四十八講〜第四十九講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">沢風大過</div><div class=\"yo\">たくふうたいか</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-28\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-28\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-28\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-28\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-28\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-28\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-28\" data-jump=\"yao\">六爻</a></div><h3 id=\"g28-s0\">卦の名と象</h3>\n<p>大過は「大いに度を過ぎる」の意味である。本田によれば、易の卦の配列は二つで一組で、ある卦の次にはたいてい上下を逆さまにした卦が続く（屯の次に蒙）。逆さまにしても形が変わらない場合は陰陽を反対にする。だから頤と大過がペアになる。</p>\n<p>程伝（序卦伝を引く）：「頤とは養うなり。養わざれば動く可からず。故に之を受くるに大過を以てす」。物は養われて初めて成長し、成長すれば動くことができ、動けば過ぎることがある。だから大過が頤に次ぐ。</p>\n<ul class=\"sen\"><li>卦は上が兌、下が巽で、沢が木の上にある。沢の水が増えて木を頭まで浸してしまった形である。沢は木を潤し養うものなのに、木を滅（ほろ）ぼす（沈める）に至った。大いに過ぎる義である。</li><li>大過は陽が過ぎることで、だから彖伝に「大なる者過ぐ」という（「大なる者」は陽）。過ちの大きなものという意味と、大事が過ぎるという意味がある。</li><li>聖賢の道徳・功業は大いに人に過ぎる。常を大いに過ぎる事はみなこれである。聖人は人道を尽くすのであって、理に過ぎるのではない。事を制するには天下の正理による。時の弊害を矯正するために少し中を過ぎることはある（小過の象伝の「行いは恭に過ぎ、喪は哀に過ぎ、用は倹に過ぐ」がそれ）。矯正は少し過ぎてこそ中に及ぶので、中を求める用である。いわゆる大過は、常事の大なるものであって、理に過ぎるのではない。ただ事が大きいので常には見られず、常に見るものと比べて大きいので大過というのである。堯・舜の禅譲、湯王・武王の放伐はみなこの道による。道は中でないものはなく、常でないものはないが、世人が常には見ないので、大いに常に過ぎるという。</li></ul>\n<p>本田の講説：曲がった物を元に戻すには、真っ直ぐな状態以上に反対側にそらす必要がある。</p>\n<p>受講者との問答：</p>\n<ul class=\"sen\"><li>「巽のシンボルは風のはずなのに、なぜ木になるのか」に、本田は、説卦伝に「巽を木と為し、風と為し、長女と為し」云々とある、と答えた。</li><li>「禅譲とはどういう意味か」に、本田は、「禅」も「譲」と同じく「ゆずる」意味で、堯は息子が愚かだったので一介の庶民だった舜を取り立てて位を譲り、舜も息子に譲らず洪水を治めた禹に位を譲った、と答えた。「放伐」は「ほしいままに討つ」こと。『孟子』で斉の宣王が湯王・武王について「家来でありながら君主を殺してよいのか」と問うと、孟子は返答に困ったのだろう、「桀紂のような暴君は天命を自ら放棄した一介の匹夫であり、湯王・武王は匹夫を殺したのであって君主を殺したのではない」と答えた。上田秋成は『雨月物語』の中でこれをひどく非難し、日本にはこんな議論はありえないと言っている。</li></ul>\n<h3 id=\"g28-s1\">卦辞</h3>\n<div class=\"orig\">大過、棟橈。利有攸往。亨。</div>\n<div class=\"yomi\">大過は、棟（むなぎ）橈（たわ）めり。往く攸有るに利あり。亨る。</div>\n<p>この卦が出たら、棟木がたわんで家が傾く。前進してよい。願いごとは通る。</p>\n<p><span class=\"tag\">程伝</span>小過は陰が上下に過ぎ、大過は陽が中に過ぎる。陽が中に過ぎて上下が弱いので、棟がたわむ象とした。棟は重いものに任えるという意味で取った。四陽が中に集まり、重いと言うべきである。九三・九四の爻辞にはどちらも棟が出てきて、重任に堪えるかを問題にしている。橈むとは本末（両端）が弱いことに取る。中が強く本末が弱いので橈むのである。陰が弱く陽が強く、君子が盛んで小人が衰えている。だから往く所があってよく、亨る。棟は、今の人（宋代の人）は「檁（りん）」と言う。</p>\n<p>受講者との問答：受講者が「『檁』というのは見慣れない字ですね」と言うと、本田は「日本ではほとんど使いません」と答えた。つくりの「稟」は「受ける」という意味で、「天稟」は天から受けたもの、「稟議」はたぶん命令を受けて議論する意味だろう、と説明した。</p>\n<h3 id=\"g28-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、大過、大者過也。棟橈、本末弱也。剛過而中、巽而説行。利有攸往、乃亨。大過之時大矣哉。</div>\n<div class=\"yomi\">彖に曰く、大過は大なる者の過ぐるなり。棟橈むは、本末弱きなり。剛過ぎて中なり。巽にして説（よろこ）びて行く。往く攸有るに利あり、乃ち亨る。大過の時、大なるかな。</div>\n<p>この卦は大きなもの（陽）が過度である。棟がたわむのは両端が弱いからである。陽が過度だが中を得ている。下卦は謙遜し従い、上卦は悦び進む。だから前進してよく、願いは通る。物事には大いに行き過ぎなければならない時がある。その意義は大きい。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「大なる者過ぐ」とは陽が過ぎることをいう。事においては、大事が過ぎることと、過ちの大きなことである。</li><li>「本末弱し」とは上下の二陰が衰弱していることである。陽が盛んなら陰は衰える。だから大なる者が過ぎるとする。小過では「小なる者過ぐ」と言い、陰が過ぎることである。</li><li>卦の才の善さを言う。剛が過ぎているが、二と五はどちらも中を得ていて、処し方が中道を失っていない。下は巽順、上は兌説で、巽順和説の道で行う。大過の時に中道を得て巽説で行うので、往く所があってよく、亨るのである。</li><li>大過の時、その事は甚だ大きい。だから「大なるかな」と賛えた。非常の大事を立て、不世の大功を興し、絶俗の大徳を成すのは、みな大過の事である。</li></ul>\n<p>本田の講説：「説」は古くは「悦」の字がなく代用したもので、「悦」の意味のときは「エツ」と発音する。行き過ぎは行き過ぎでも、良い方の行き過ぎである。「不世出」とは三十年に一度出るか出ないかという意味である。受講者が「『世』が三十年なのか」と問うと、本田は、「世」は「十」を三つ並べた形からできていて三十年の意味になり、一世代はだいたい三十年なので世代の意味にもなる、と答えた。</p>\n<h3 id=\"g28-s3\">大象</h3>\n<div class=\"orig\">澤滅木、大過。君子以獨立不懼、遯世无悶。</div>\n<div class=\"yomi\">沢、木を滅ぼすは大過なり。君子以て独立して懼れず、世を遯（のが）れて悶ゆる无し。</div>\n<p>沢が木を頭までどっぷり沈めてしまったのが大過である。君子はこれにのっとって、独り立ちして恐れることなく、俗世に背を向けて世捨て人になってもくよくよしない。</p>\n<p><span class=\"tag\">程伝</span>沢は木を潤し養うものなのに、木を滅没させるに至るのは過ぎることである。だから大過という。君子は大過の象を観て、大いに人に過ぎる行いを立てる。君子が大いに人に過ぎるのは、独立して懼れず、世を遯れて悶えることがないからである。天下がこれを非としても顧みないのが、独立して懼れないことである。世を挙げて知られなくても悔いないのが、世を遯れて悶えないことである。このようであってこそ自分を守ることができる。これが大いに人に過ぎるゆえんである。</p>\n<p>受講者との問答：受講者が「大過というのは実は良い卦なんですね」と言うと、本田は「そうですね」と答えた。</p>\n<h3 id=\"g28-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>大過の時は陽が陰位にいるのが良い。</b> 九二の程伝によれば、大過は陽が過ぎる卦なので、ふつうとは反対に陽が陰位（偶数位）にいる方が程よい。二と四がそれである。</li><li><b>陽が過ぎれば陰と隣り合えば合う。</b> 二と五はどちらも陰と比して（隣り合って）生ずる象がある。九二は根に稊（ひこばえ）を生じ、九五は枝先に花を生ずる。</li><li><b>九三と上六は応じないのか。</b> ある人が「九三は巽体にいて上六と応ずるので、柔を用いる象があるのではないか」と問うと、伊川は「易を語る者は勢いの重軽、時の変易を知らねばならない。三は大過の時に剛を極め、巽の終わりにいて変じようとしている。柔を用いる義はない。応とは志が相従うことで、三がこれほど剛に過ぎていては、上六がどうして志を託せよう」と答えた。</li><li><b>九二と九四の違い。</b> 「九二は初六に比して利あらざる无しなのに、九四が正応の初六に応ずるとなぜ吝なのか」という問いに、伊川は、九二は中を得て初に比し、柔によって剛を救う義があるが、九四は陽で陰位にいてすでに剛柔の宜しきを得ており、さらに陰に引かれればかえって剛を害する、と答えた。</li><li><b>老夫と老婦。</b> 受講者が「上六が『老婦』で九五は『士夫』なのですね」と確かめ、さらに「上六が老いていると言われるのは一番上だからと思うが、九二も『枯楊』『老夫』と言われるのはどう考えればよいか」と問うと、本田は、卦全体での位置よりも、陰陽で引き合う相手との関係が問題で、相手より上に位置するから老いている・枯れていると言われるのだろう、初六と九二、九五と上六で対比するとわかりやすいので、枯れヤナギや年齢差の大きい男女という同じシンボルを用いたのだ、同じ年齢差のある結婚でも子供が生まれる可能性があれば結構だが、なければいささかみっともない、なかなかユーモラスな卦だ、と答えた。</li></ul>\n<h3 id=\"g28-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>大いに度を過ぎた事をなすべき時。重荷に棟がたわむような危うさがあるが、前進してよく、願いは通る。</li><li>世の常識に過ぎた行いを恐れず、世に知られなくても気に病むな（大象）。</li><li>慎みは過ぎるくらいでよい（初六）。</li><li>強さが過ぎれば人の助けが得られず失敗する。柔らかさで強さを補えば、思いがけない事業も成る（九二・九三・九四）。</li><li>実りのない縁組や、根本を立て直さない見かけだけの回復は長続きしない（九五）。</li><li>身の程をわきまえず無謀な冒険をすれば、自ら災いを招く（上六）。</li></ul><h2 class=\"sec\" id=\"g28-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">藉用白茅。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">藉（し）くに白茅を用てす。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「藉用白茅、柔在下也。」（藉くに白茅を用てすとは、柔下に在ればなり。）</div>\n<p>供え物の器の下に白いチガヤを敷く。咎はない。本田によれば、祭の供え物の器はたいてい地面に直に置いてよいのに、敷物をした上に置く。丁寧の極みである。</p>\n<p><span class=\"tag\">程伝</span>初は陰柔・巽体で下にいる。畏れ慎むことにおいて過ぎる者である。柔が下にいるのは、茅を物の下に敷く象である。器を地に直に置かず茅を敷くのは、慎むことに過ぎている。だから咎がない。茅は粗末な物だが、その用は重んずべきで、これを用いて敬慎の道を成せるからである。慎んでこの術を守って行けば、どうして失があろう。大過の用である。繋辞伝に「苟も諸を地に錯（お）きて可なり。之に藉くに茅を用てす。何の咎か之有らん。慎みの至りなり。夫れ茅の物たる薄くして、用は重んず可きなり。斯の術を慎んで以て往けば、其れ失する所无からん」とある。敬慎の至りを言うのである。人が敬慎に過ぎることは、行うのに難しくなく、しかも安全を保って過ちがない。よくこの道を慎み、推して行えば、何事にも失はない。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰柔で卑下の道にいる。ただ敬慎に過ぎるべきである。柔が下にいるのは茅を物に敷く象で、敬慎の道である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>慎重すぎるほど慎重にすれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">枯楊生稊、老夫得其女妻。无不利。</span></summary><div class=\"body\"><div class=\"yomi\">枯楊稊（ひこばえ）を生ず。老夫、其の女妻を得たり。利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「老夫女妻、過以相與也。」（老夫女妻、過ぎて以て相与するなり。）</div>\n<p>枯れたと見えたネコヤナギの根に、ひこばえが生えてきた。年老いた男が若い女（女は若い女のこと）を妻とした。何の不利もない。</p>\n<p><span class=\"tag\">程伝</span>陽が大いに過ぎる時、陰と比すれば合う。だから二と五にはどちらも生ずる象がある。二は大過の初めにいて、中を得て柔（偶数位）にいる。初と比して親しむ。初はもともと二に接しており、二には上に応がない（五も陽）。親しむのは明らかである。過剛の人がよく中道で自らを処し、柔によって剛を救うのである。過剛では何もできない。九三がそれである。中を得て柔を用いれば大過の功を成せる。九二がそれである。楊は陽気に感じやすいもので、陽が過ぎれば枯れる。楊が枯れてまた稊を生ずるのは、陽が過ぎてもまだ極みに至っていないのである。九二は陽が過ぎているが初と親しむ。老夫が若い妻を得れば生育の功を成せる。二は中を得て柔にいて初と親しむので、枯楊が稊を生じ、陽が過ぎて枯れるという失がない。だから利あらざるなし。大過では陽が陰位にいるのが善く、二と四がそれである。二が吉と言わず利あらざるなしとだけ言うのは、急に吉に至るわけではないからである。稊は根である。劉琨の勧進表に「繁華を枯荑（こい）に生ず」とあり、枯れかけた根をいう。鄭玄の易では「荑」の字になっていて、意味は稊と同じである。</p>\n<p>本田の講説：楊は春の気配にいち早く反応して芽をふく。劉琨の勧進表は、西晋の王朝が北方の異民族に追われて東に移った際、劉琨が琅邪王に天子の位につくよう勧めた上奏文で、枯れかけた根は滅びかけた晋の王朝、美しい花を生じるとは以前の栄華を取り戻すことである。受講者が「勧進表の『勧進』は『勧進帳』と同じですね」と言うと、本田は、この場合は天子となるよう勧める意味で、王朝が新たに立つ場合、家来から勧進表を奉られてそれを受けて即位するならわしがある、自分から事を起こしておきながら一応は辞退して見せるのが礼なのだ、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>老夫が少女を悦び、少女が老夫に順う。その交わりは常の分を過ぎている。九二と初六の陰陽相与する和が常に過ぎることをいう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>衰えかけたものが、柔らかな相手と結びつくことで再生する。年の差の縁組も吉。不利はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">棟橈。凶。</span></summary><div class=\"body\"><div class=\"yomi\">棟橈む。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「棟橈之凶、不可以有輔也。」（棟橈むの凶なるは、以て輔くる有る可からざるなり。）</div>\n<p>屋根を支える棟木が、真ん中が重すぎて下にたわむ。凶。</p>\n<p><span class=\"tag\">程伝</span>大過の時にいて、大過の功を興し、大過の事を立てるには、剛柔が中を得て人に取って自らを助けなければできない。剛強が過ぎれば人と同じくすることができない。常の功すら独りでは立てられない。まして大過の事はなおさらである。聖人の才でも小事に必ず人に取る。天下の大任ならなおさらである。九三は大過の陽で、また剛に居て中を得ない。剛が過ぎて甚だしい者である。過剛で動けば中和に違い、衆心に払る。どうして大過の任に当たれよう。だからその任に勝えず、棟がたわんで室を敗るようなものである。だから凶。棟を象とするのは、輔けがなく重さに勝えないからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>剛強が過ぎれば人に取ることができず、人もこれに親しみ輔けることができない。棟が橈み折れて支え輔けることができないようなものである。棟は室の中央に当たり、手を加えて助けることはできない。だから輔けることができないという。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>強さを恃み過ぎて人の助けを得られず、重荷に耐えきれず崩れる。凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">棟隆。吉。有它吝。</span></summary><div class=\"body\"><div class=\"yomi\">棟隆（たか）し。吉。它（た）有れば吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「棟隆之吉、不橈乎下也。」（棟隆きの吉なるは、下に橈まざればなり。）</div>\n<p>棟木が高々とそびえて揺らがない。吉。しかし二心があれば恥ずべき結果となる。本田によれば、「吝」は恥ずべしの意味で、凶ほど悪くはない。</p>\n<p><span class=\"tag\">程伝</span>四は君に近い位にいて、大過の任に当たる者である。柔（偶数位）にいるのは、柔を用いて剛を救うことである。剛に過ぎなければその任に勝えるので、棟が隆起するようなもので吉である。隆起とは下に橈まない意に取る。大過の時は陽剛でなければ救えない。剛で柔にいるのは宜しきを得ている。もしさらに初六の陰と応ずれば過ぎる。すでに剛柔の宜しきを得ていて、さらに陰に応ずる志があれば、それは「它（ほか）」があることで、剛に累がある。大害には至らなくても吝である。大過の時は動けば過ぎる。「它有り」とは、ほかの志があることをいう。吝は不足の義で、恥ずべきことをいう。（九二との違いの問答は前述。）</p>\n<p><span class=\"tag\">象伝について程伝</span>棟が隆起すれば吉。橈み曲がって下に就かないのは、下の初に係らないことをいう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大任をしっかり担い、揺るがなければ吉。ただし、ほかに心を移せば恥をかく。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">枯楊生華、老婦得其士夫。无咎无譽。</span></summary><div class=\"body\"><div class=\"yomi\">枯楊華（はな）を生ず。老婦、其の士夫を得たり。咎も无く誉れも无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「枯楊生華、何可久也。老婦士夫、亦可醜也。」（枯楊華を生ず、何ぞ久しかる可けんや。老婦士夫、亦た醜ず可きなり。）</div>\n<p>枯れヤナギが花をつけた。年老いた後家が若い夫を得た形である。咎められもしないが誉められもしない。本田によれば、年老いた女は夫を迎えても子供を生めるわけではないから誉められはしない、大変皮肉な判断である。</p>\n<p><span class=\"tag\">程伝</span>九五は大過の時に当たり、中正で尊位にいるが、下に応じて助ける者がいない（二も陽）。もとより大過の功を成すことはできない。上は過極の陰と比している。その助け合いは枯楊が華を生ずるようなものである。枯楊が下に根（稊）を生ずれば再び生きられる。大過の陽が再び興って功を成すようなものである。上に華を生じても、その枯れることに何の益があろう。上六は大過の極みの陰で、老婦である。五は少壮ではないが、上に比べればまだ壮い。五にとって得るところはない。だから反って「老婦其の士夫を得たり」と上六を主にして言った。過極の陰が陽の助けを得るのは、功がないわけではない。若い夫が老婦を得るのは、罪はないが美しいことでもない。だから咎も誉れもない。象伝はさらにその恥ずべきことを言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>枯楊が根を生ぜず華を生じれば、すぐにまた枯れる。どうして久しくあろう。老婦が士夫を得て、どうして生育の功を成せよう。やはり恥ずべきである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>見かけだけの返り咲き。実りのない結びつきで長続きしない。咎はないが誉れもない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">過渉滅頂。凶。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">過ぎて渉（わた）る。頂きを滅す。凶。咎むる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「過渉之凶、不可咎也。」（過ぎて渉るの凶なる、咎む可からざるなり。）</div>\n<p>身の程をわきまえず大川を徒歩で渡り（「渉」はもともと船を使わず徒歩で渡ること）、頭の上まで水に沈む。凶。自分が招いた災いだから、誰を咎めることもできない。</p>\n<p><span class=\"tag\">程伝</span>上六は陰柔で過極にいる。小人が常を過ぎることの極まった者である。小人のいわゆる大過は、大いに人に過ぎる事をなすのではない。ただ常を過ぎ理を越え、危亡を顧みず、険を履み禍いを踏むだけである。水を渡って頂を滅没するに至るようなもので、凶は知れている。小人が狂躁で自ら禍いを招くのはもっともで、また誰を咎めよう。だから「咎むる无し」という。自らなしたことで、怨み咎める所がないということである。沢の象によって渉る義を取った。</p>\n<p><span class=\"tag\">象伝について程伝</span>過ぎて渉って溺れるに至る。自らなしたことで、咎める相手がない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>無謀な冒険で身を滅ぼす。凶。すべて自業自得で、誰も恨めない。</div></div></details><div class=\"pager\"><a href=\"#gua-27\">← 山雷頤</a><a href=\"#gua-29\">坎為水 →</a></div>", "gua-29": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 29 卦　第四十九講〜第五十講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">坎為水</div><div class=\"yo\">かんいすい</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-29\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-29\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-29\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-29\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-29\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-29\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-29\" data-jump=\"yao\">六爻</a></div><h3 id=\"g29-s0\">卦の名と象</h3>\n<p>坎は「落とし穴」、また「水」の意味である。本田によれば、易の上経は乾坤（天地）で始まり坎離（水火、月と太陽）で終わる。天地で始まり日月で終わるのは非常にシンボリックで面白い。坎は六十四卦のなかでも大変悪い卦で、ユングが自分の患者に卦を立てさせたらこの卦ばかり出てきたという。</p>\n<p>程伝（序卦伝を引く）：「物は以て終に過ぐ可からず。故に之を受くるに坎を以てす。坎とは陥るなり」。理として物は無限に過ぎることはない。過ぎることが極まれば必ず陥る。これが坎が大過に次ぐゆえんである（本田によれば「坎」と「陥」は発音も同じ）。</p>\n<ul class=\"sen\"><li>「習坎」の「習」は重なるという意味である。ほかの重卦では「習」の字を加えないのに、坎だけ加えるのは、重なる危険（危険の中にさらに危険がある）を示すためで、その義は大きい。</li><li>卦の中に一陽があり、上下に二陰がある。陽は実、陰は虚で、陽が上下に拠り所がなく二陰の中に陥っている。だから坎は陥るという意味になる。陽が陰の中にあれば陥るであり、陰が陽の中にあれば麗く（付く）である。一陽が上にあれば止まる（艮）、中にあれば陥る（坎）、下にあれば動く（震）。一陰が上にあれば説ぶ（兌）、中にあれば麗く（離）、下にあれば巽う（巽）。陥るとは険の意味で、習とは重なること（学習・温習はみな重複する意）である。卦の言うところは、険に処する道である。</li><li>坎は水である。一陽が陰の中に始まるのは、生の最も先なるもので、だから水とする。陥るのは水の体（性質）である。</li></ul>\n<p>本田の講説：坎の卦は縦に書けば「水」の字になる。</p>\n<p>受講者との問答：受講者が「バブルは必ず崩壊して不況になるということですね」と言い、笑いが起きた。</p>\n<h3 id=\"g29-s1\">卦辞</h3>\n<div class=\"orig\">習坎、有孚。維心亨。行有尚。</div>\n<div class=\"yomi\">習坎は孚（まこと）有り。維（こ）れ心亨る。行けば尚（たっと）ぶこと有り。</div>\n<p>心に誠がある。だから真心が通じる。ひたすら前進すれば、人に誉められるような手柄をあげる。</p>\n<p><span class=\"tag\">程伝</span>陽が実で中にある。中に孚信がある形である。心が誠で一途なので亨通できる。至誠は金石をも貫き、水火をも踏める。どんな険難も通れないことがあろう。「行けば尚ぶこと有り」とは、誠をもって行けば険を出て、嘉尚すべき功があるということで、行かなければ常に険中にいることになる。</p>\n<p>本田の講説：この卦は爻辞を見ると大体悪い意味だが、卦全体の判断としては、落とし穴の中に陥っていても真心さえ守っていれば通ることがある、と占われる人を励ますような意味になっている。</p>\n<h3 id=\"g29-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、習坎、重險也。水流而不盈。行險而不失其信。維心亨、乃以剛中也。行有尚、往有功也。天險不可升也。地險山川丘陵也。王公設險以守其國。險之時用大矣哉。</div>\n<p>彖に曰く、習坎は重険なり。水流れて盈たず。険に行きて其の信を失わず。維れ心亨るとは、乃ち剛中を以てなり。行けば尚ぶこと有りとは、往くときは功有るなり。天の険は升（のぼ）る可からざるなり。地の険は山川丘陵なり。王公は険を設けて以て其の国を守る。険の時用、大なるかな。</p>\n<p>習坎は重なる危険である。水は流れているがまだ満ちあふれない。危険の中を行きながら誠を失わない（本田によれば、卦辞の「孚」を彖伝は「信」に置き換えている）。真心が通じるのは、真ん中に強いものがあるからである。行けば尊ばれるのは、前進すれば手柄があるからである。天の険は昇ることができない。地上の険は山や川や丘である。王者は人為的な険を設けて国を守る。険の時宜にかなったはたらきは大きい。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>習坎とは上下がみな坎で、二つの険が重なることである。初六の「坎窞（かんたん）」（落とし穴の中のさらに深い穴）は坎中の坎で、重険である。「水流れて盈たず」とは、陽が険中に動いてまだ険を出ないこと、つまり水が流れてまだ満ちていないことで、満ちれば坎を出る。「険に行きて其の信を失わず」とは、陽剛中実が険の中にいて、険を行きながら信を失わないことである。坎の中実と、水が必ず下に就くことは、みな信の義で、「孚有り」である。</li><li>心が亨通できるのは剛中だからである。中実は孚がある象である。至誠の道はどこにでも通じる。剛中の道で行けば険難を渡って亨通できる。</li><li>剛中の才で往けば功がある。だから嘉尚すべきである。もし止まって行かなければ常に険中にいる。坎は行くことを功とする。</li><li>高くて昇れないのが天の険、山川丘陵が地の険である。王公、人に君たる者は、坎の象を観て険の凌げないことを知り、城郭・溝池の険を設けて国を守り民を保んずる。険を用いる時があり、その用は甚だ大きい。だから「大なるかな」と賛えた。山河城池は険を設けることの大端にすぎない。尊卑の弁、貴賎の分を明らかにし、等威（位に応じた権威）を明らかにし、物采（衣服などの色）を異にするなど、凌ぎ僭すことを防ぎ、上下を隔てるためのものはすべて、険の用を体したものである。</li></ul>\n<p>本田の講説：これは中国でいわゆる「礼」に当たる。孟子などは城や堀をあまり頼むべきではないと言っており、これがだいたい儒教の通説だが、『易経』はそうは言わず、時には険を設ける必要があるとはっきり謳っている。</p>\n<h3 id=\"g29-s3\">大象</h3>\n<div class=\"orig\">水洊至、習坎。君子以常德行、習教事。</div>\n<div class=\"yomi\">水洊（しき）りに至るは習坎なり。君子以て徳行を常にし、教事を習わす。</div>\n<p>水が次々に絶えることなく押し寄せてくる形が習坎である。君子はこれにのっとって、自分の徳行を常なるものにし、民に教えたことを練習させる。</p>\n<p><span class=\"tag\">程伝</span>坎は水である。水が流れて次々に至る。二つの坎が重なっているのは、水流が次々に至る象である。水は小さなしずくや流れから、尋丈（八尺・十尺）の深さに至り、江海に至る。重なり重なって急に止まないものである。地勢に因って下に就き、信で常がある。だから君子は坎水の象を観て、常あることに取ってその徳行を常久にする。人の徳行は常でなければ偽りである。水の常あるようでなければならない。重なり受け継ぐことに取って、政令・教化の事を習熟させる。政令を発し教えを行うには、必ず民の耳に十分聞き知らせてから従わせることができる。だから三令五申（三回命じ五回述べる）する。もし一度告げただけでまだ悟らないうちに急に従うことを責めれば、厳刑で駆り立てても従わせることはできない。だから水が重なり至るようにすべきである。</p>\n<p>受講者との問答：</p>\n<ul class=\"sen\"><li>「『其の従うを責む』とはどういう意味か」に、本田は「人民がまだ命令の意味を理解していないのに、どうでもこの命令に従えと強制することです」と答えた。</li><li>「水がしきりに至るという習坎は、普通に言う習慣とは」と問われ、本田は、坎と慣は違う、この習は重なるという意味だが、「練習」の「習」も「重なる」の意味を含んでいる、「習」の字は羽二つに白で、まだクチバシの白い幼い鳥が羽をばたばたと何回も振ることで、そこから「重なる・練習する」の意味になった、意味は通じるところがある、と答えた。</li><li>「『三令五申』はもともと易にある言葉か」に、本田は、易の本文にはない、『史記』孫武列伝に、孫武が呉王の宮女たちに軍事教練をさせ、三令五申した上で号令をかけたのに女たちがゲラゲラ笑い出したので、隊長格の呉王の愛姫を斬った話がある、と答えた。</li></ul>\n<h3 id=\"g29-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>君主の諫め方（六四）。</b> 六四の程伝は易のなかでも特に長い。臣下が君主を諫めるには、君主の心が覆われている所（暗い所）を攻めるのでなく、まだ覆われていない明るい所（窓）から言葉を差し入れよ、と説く。昔からうまく君主を諫めた者は、必ずその明らかな所によった。人の悪をあばき（訐）、強硬な態度を取る者は多く怒りを買い、穏やかで弁舌の明らかな者の説が多く行われた。</li><li><b>漢の高祖と商山の四老人。</b> 程伝の実例。漢の高祖は戚姫を寵愛し、その子趙王を太子にしようとして、呂后の子である太子（後の恵帝）を廃そうとした。嫡庶の別、長幼の序から言えば道理は明らかで、多くの臣下が争って諫めたが、高祖の心は覆われていて聞かない。そこで張良の計略で、高祖がかねて尊敬し、何度呼んでも出てこなかった商山の四老人が山から下りてきて太子に仕えた。驚いた高祖が会うと、四老人は「太子の徳を慕って来た」と言い、高祖は手のひらを返すように悟って太子を替えなかった。四老人の力は張良や公卿や天下の士に及ばず、言葉の切実さは周昌や叔孫通に及ばないのに、高祖が四老人に従ったのは、彼らが高祖の心の明るい所に取りついたからである。本田は後日譚として、呂后がのちに趙王を毒殺し、戚姫の手足を斬って目をつぶし豚小屋に放り込み、それを息子の恵帝に見せたので、恵帝は「これは人間のすることではない」と嘆いて毎日浴びるほど酒を呑んで命を縮めた、中国の歴史のなかで一番残酷な話とされる、と語った。</li><li><b>趙の太后と触龍。</b> 程伝のもう一つの実例。秦が趙に攻め込もうとし、趙は斉に援軍を求めたが、斉は人質を求めた。趙の太后は末子の長安君を可愛がって人質に出すことを承知せず、大臣が強く諫めても聞かない。左師の触龍は、子を長く富貴であらせたいという太后の心の明るい所によって、「人質を出さなければ斉は援軍を寄越さず、国が滅びて長安君も長生きできない」と導いたので、太后は打てば響くように従った（本田によれば紀元前三世紀半ば、秦の始皇帝の天下統一の少し前のこと）。</li><li><b>教育も同じ。</b> 程伝は、教えも必ず人の長所（心の明るい所）から入り、それから他に推し及ぼすべきで、『孟子』尽心篇の「徳を成し、財（才）を達す」がそれだと言う。</li><li><b>易で一番長く難解な爻辞。</b> 受講者が「この爻は長いですね」と言うと、本田は、この文句が易のなかで一番長く、自分の解説でも一番難解な部分で、朱子も「樽酒簋貳」のところがよくわからないと言っている、文句が難しくて説明を長く要したのだ、と答えた。</li><li><b>長い時間の表し方（上六）。</b> 程伝によれば、長い時間を十と言う場合も三と言う場合もあり、事柄による。同人の九三「三歳まで興さず」（戦争）、屯の六二「十年乃ち字す」（結婚の承諾）などがその例である。</li></ul>\n<h3 id=\"g29-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>重なる危険、落とし穴に陥る時。大変悪い卦である。</li><li>ただし真心を失わなければ通じる。誠をもって進めば、穴を出て手柄を立てられる。</li><li>徳行を変わらず続け、人に教えるには繰り返し丁寧に教えよ（大象）。</li><li>道を見失ったまま悪あがきすれば、さらに深みにはまる。進退窮まったら動くな（初六・六三）。</li><li>剛毅と中庸があれば、穴から出られないまでも少しは得るところがある（九二）。</li><li>上の人を説得するには、飾らない真心で、相手の心の開けている所から言葉を差し入れよ（六四）。</li><li>自分ひとりの力では危険を抜けられない。水が満ちるのを待て（九五）。</li><li>道を失えば、牢獄に囚われたように長く抜け出せない（上六）。</li></ul><h2 class=\"sec\" id=\"g29-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">習坎、入于坎窞。凶。</span></summary><div class=\"body\"><div class=\"yomi\">坎を習ねて坎窞（かんたん）に入る。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「習坎入坎、失道凶也。」（坎を習ねて坎に入る。道を失して凶なり。）</div>\n<p>落とし穴が重なり、しかもそのさらに深い所に落ち込んでいる（「坎窞」は落とし穴のさらに深い所）。凶。</p>\n<p><span class=\"tag\">程伝</span>初は陰柔で坎険の下にいる。柔弱で援けがなく（初と四はどちらも陰で引き合わない）、処る所も当を得ていない（陰が奇数位）。険を出られる者ではなく、ますます深い険に陥るだけである。窞は坎の中のくぼんだ所である。すでに習坎の中にいて、さらに坎窞に入る。凶は知れている。</p>\n<p><span class=\"tag\">象伝について程伝</span>習坎からさらに坎窞に入るのは、道を失ったのである。だから凶。もし険を出られるとすれば、道を失わなかったからである。</p>\n<p>受講者との問答：受講者が「これは困った時は悪あがきをするなということか」と問うと、本田は「ええ、こういう卦が出たら動いてはならない、判断としてじっとしていないといけないということです」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険の中でさらに深みにはまる。出口を見失っている。凶。悪あがきせず動くな。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">坎有險。求小得。</span></summary><div class=\"body\"><div class=\"yomi\">坎に険有り。求めて小しく得。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「求小得、未出中也。」（求めて小しく得とは、未だ中を出でざるなり。）</div>\n<p>落とし穴の中に危険がある。求めるものを少しは得られる。本田によれば、九二は陽で強い爻なので、初六よりは判断として良い。</p>\n<p><span class=\"tag\">程伝</span>二は坎険の時に当たり、上下二陰の中に陥っている。至険の地で、坎に険があるのである。しかし剛中の才があり、険中を出ることはできないが、少しは自分を救うことができ、初のようにますます深い窞に陥るには至らない。これが求めて少し得ることである。君子が艱険に処して自らを保てるのは剛中による。剛ならば才が身を守るに足り、中ならば動きが宜しきを失わない。</p>\n<p><span class=\"tag\">象伝について程伝</span>二陰に陥れられ至険の地にいるが、剛中の才で深い険に陥るには至らない。これが求めて少し得ることである。しかしまだ坎中の険を出ることはできない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険の中にいて、まだ抜け出せないが、強さと中庸を保てば少しは得るものがある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">來之坎坎。險且枕。入于坎窞。勿用。</span></summary><div class=\"body\"><div class=\"yomi\">来るも之くも坎坎たり。険にして且つ枕（よ）る。坎窞に入る。用うる勿れ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「來之坎坎、終无功也。」（来るも之くも坎坎たり。終に功无きなり。）</div>\n<p>下がるにせよ上がるにせよ、どちらを向いても落とし穴がある。危ない姿勢で穴の縁に寄りかかっている。ますます穴の深みにはまる。行動してはいけない。本田によれば、「来る」は上から下へ下がって来ること、「之く」は下から上へ上って行くことで、易の卦は下から上へ進むので下が基準になる。乾の初九「潜龍、用うる勿れ」と同様、これが出たら行動してはいけない。</p>\n<p><span class=\"tag\">程伝</span>三は坎険の時に、陰柔で中正でない位にいる。処し方が道に合わず、退くも進むも居るもみな不可である。下に来れば険の中に入り、上に行けば重険である。退くも進むも険である。だから「来るも之くも坎坎たり」。進退ともに険で、居る所もまた険である。「枕」とは寄りかかって支えることで、険にいて寄りかかって身を支えている。至って不安な状態である。処る所がこのようでは、ますます深い険に入るだけである。だから「坎窞に入る」。三の処し方は用いてはならない。だから「用うる勿れ」と戒めた。</p>\n<p><span class=\"tag\">象伝について程伝</span>進退ともに険で、居ることもまた安らかでない。この道を用いればますます険に入り、最後まで功はない。陰柔で中正でない者は、平易な地にいても悔咎を招く。まして険の中ならなおさらである。険は人が出ようと欲するものだが、必ずその道（方法）を得てこそ去ることができる。去ることを求めてその道を失えば、困窮するだけである。だから聖人は、三の処し方は用いてはならないと戒めた。</p>\n<p>受講者との問答：受講者が「進退窮まった時は静かにしておれということか」と問うと、本田は「ええ、落とし穴が下にも上にもある時には行動してはいけないということです」と答えた。「『道を求める』のはいいことなのか」には、「その道」は道徳ではなく、しかるべき方法・仕方の意味で、脱出の仕方を心得てはじめて抜け出られる、と答えた。「抜け出ること自体はいいことで、必ずしもじっとしていなくてもよいと肯定しているのか」には、しかるべき仕方が得られれば抜け出られるが、六三の場合は「去るを求めて其の道を失えり」で、その道を心得ていない、だから穴の縁に寄りかかって身を支えるという非常に危険なポーズを取っているので、下手に動けばますます深みに陥る、じっとしておれと戒めるのだ、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>前後左右すべて危険で、身の置き所も不安定。脱出の方法もわからない。下手に動けば深みにはまるので、じっとしていよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">樽酒簋貳、用缶。納約自牖。終无咎。</span></summary><div class=\"body\"><div class=\"yomi\">樽酒（そんしゅ）、簋（き）貳（ふた）つ。缶（ほとぎ）を用てす。約を納るる牖（まど）よりす。終に咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「樽酒簋貳、剛柔際也。」（樽酒、簋貳つとは、剛柔際（まじ）わるなり。）</div>\n<p>ひと樽の酒と、二つの竹の皿に盛った穀物。しかも器には飾りのない素焼きの壺を用いる。この質素倹約な品を窓から差し入れる。こういう態度でいれば、ついに咎はない。本田によれば、「簋」は竹を編んだ平たい皿、「缶」は瓦で作った素朴な素焼きの壺で、穀物を入れたり、横にして底を太鼓のようにたたく楽器にもした。「約」は倹約の約。この爻辞は一番読みにくく、朱子をはじめいろいろな学者が解釈しているが句読の切り方すら一定しない。伊川の注によれば「樽酒、簋貳」と切り、朱子は「樽酒、簋あり。貳に缶を用てす」と読む。伊川の注に従って訳した。</p>\n<p><span class=\"tag\">程伝</span>六四は陰柔で下に助けがない（初も陰）。天下の険を救える者ではない。大臣の位にいるので、人臣が険に処する道を言う。大臣は険難の時に当たり、ただ至誠で君に信じられ、交わりが固くて隔てられず、さらに君の心を開き明らかにすれば、身を保って咎がない。上の信頼を得ようとするなら、質実を尽くすだけである。礼が多く飾りを尚ぶのは燕享（宴会）の礼に及ぶものはない。だから燕享にたとえた。浮飾を尚ばず質実だけを用いよということである。用いるのは一樽の酒と二簋の食、それに瓦の缶を器とする。質素の至りである。また必ず約を納れるのに牖（まど）からすべきである。「約を納る」とは、君に進み結ぶ道をいう。牖には開き通ずる義がある。部屋が暗いので牖を設けて明かりを通す。「牖より」とは、明かりの通ずる所からということで、君の心の明らかな所にたとえる。『詩経』（大雅・板）に「天の民を牖（みちび）く、壎（けん）の如く篪（ち）の如し」とあり、毛公は牖を「導く」と訓じた。開き通ずる意味である。人臣が忠信・善道で君の心に結ぶには、必ずその明らかな所から入らなければならない。人の心には蔽われた所（暗い所）と通じた所（明るい所）がある。明るい所について告げれば、信じられるのは易しい。だから「約を納るる牖よりす」。このようであれば艱険の時でも終に咎はない。（以下、君の心の明るい所から入る理と、漢の高祖・趙の太后の例、教育の例が続く。前述。）</p>\n<p>本田の講説：宴会の礼は最も決まりがうるさく飾りが多いので、ここではそれを譬えに用いている。窓の「光」は太陽の光であると同時に知恵の光でもある。壎は土で作って穴の開いたオカリナのような楽器、篪は竹で作った楽器である。『詩経』のこの句は、天が民を導く有様は音楽が人の心を和らげるようだという意味である。君主の目がくらんで真っ暗な時はいくら諫めても入らない。君主の心に少しでも知恵の窓が開いたら、そこに諫めの言葉を差し入れるべきだということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>象伝は首句だけを挙げている。このような例は多い。「樽酒、簋貳」は質実の至りである。剛柔が相接する道がこのようであれば、終に保って咎がない。君臣の交わりが固く常であるのは、誠実にある。剛柔とは四と五を指し、君臣の交際をいう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険な時、上の人の信頼を得るには、飾らず質素に真心を尽くし、相手の心が開いている所から働きかけよ。そうすれば最後には咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">坎不盈。祗既平。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">坎、盈たず。既に平らかなるに祗（いた）る。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「坎不盈、中未大也。」（坎、盈たずとは、中未だ大ならざるなり。）</div>\n<p>まだ穴に水が満ちあふれていないが、水が満ちて穴の縁と平らになるところまで水位が上がれば、咎はない。</p>\n<p><span class=\"tag\">程伝</span>九五は坎の中にいて、まだ満ちていない。満ちれば平らになって出られる。「祗」は「抵」とすべきで、至るという意味である。復の初九に「悔いに祗る无し」とある。必ず既に平らかなるに至れば咎がない。すでに「盈たず」と言う以上、まだ平らでなく険中にいるので、まだ咎がないとは言えない。九五は剛中の才で尊位にいて、天下の険を救うべきであるが、下に助けがない。二は険中に陥ってまだ出られず、他はみな陰柔で険を救う才がない。人君の才があっても、独りで天下の険を救えようか。君位にいて天下を険から出せなければ咎がある。必ず既に平らかなるに至ってこそ咎がない。</p>\n<p>本田の講説：この卦で陽爻は二と五だけで、ほかは全部陰である。</p>\n<p><span class=\"tag\">象伝について程伝</span>九五は剛中の才で尊位を得ている。天下の険難を救うべきなのに、坎はまだ満ちず、険を平らげられない。剛中の道がまだ光大でないのである。険難の時は君臣が協力しなければ救えない。五の道がまだ大きくないのは、臣（助け）がないからである。人君の道は天下の難を救えなければ大きいとは言えず、その位にふさわしくない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>危険はまだ去っていない。ひとりの力では脱出できないので、水位が上がり平らになるまで待て。そうなれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">係用徽纆、寘于叢棘。三歳不得。凶。</span></summary><div class=\"body\"><div class=\"yomi\">係（つな）ぐに徽纆（きぼく）を用てし、叢棘（そうきょく）に寘（お）く。三歳まで得ず。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「上六失道、凶三歳也。」（上六の道を失する、凶なること三歳なり。）</div>\n<p>縄で縛られ、いばらの草むらに放置される。三年間、いばらの中から出られない。凶。本田によれば、徽は三つ撚りの縄、纆は二つ撚りの縄、叢棘はいばらの草むら（牢獄）である。最後の爻の判断は至って悪い、恐ろしく悪い。</p>\n<p><span class=\"tag\">程伝</span>上六は陰柔で険の極みにいる。陥ること最も深い者である。その深さを牢獄にたとえた。徽纆で縛り、叢棘の中に囚え置くようなものである。陰柔で深く陥れば、出ることはできない。だから三年の長きに至るまで免れられない。凶は知れている。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰柔で自ら険の極みにいる。道を失ったのである。だから凶が三年に至る。三年の長きにわたって免れられないというのは、終に凶であるという辞である。長いことを言うのに十と言う場合も三と言う場合もあり、事柄による。獄に陥って三年に至るのは長さの極みである。他の卦で年数を言うのも、それぞれその事柄によっている。「三歳まで興さず」「十年乃ち字す」がそれである。</p>\n<p>本田の講説：牢屋にぶち込まれて三年出られないのは、本人の主観としては最高に久しい時間である。戦争という事柄には三年と言い、結婚の承諾という事柄には十年と言うのは、事柄の大小や危険の度合いによる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>牢獄に囚われたように身動きが取れない。脱出の道を見失い、長く苦しむ。凶。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>ユングの患者に坎</div><div class=\"rb\">本田によれば、ユングが自分の患者に卦を立てさせたところ、落とし穴を意味するこの坎の卦ばかり出てきたという（第14卦大有の講義でも、ユングがこれで易を信じるようになった話として触れられている）。</div></div><div class=\"pager\"><a href=\"#gua-28\">← 沢風大過</a><a href=\"#gua-30\">離為火 →</a></div>", "gua-30": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 30 卦　第五十講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">離為火</div><div class=\"yo\">りいか</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-30\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-30\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-30\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-30\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-30\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-30\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-30\" data-jump=\"yao\">六爻</a></div><h3 id=\"g30-s0\">卦の名と象</h3>\n<p>離は「はなれる」ではなく「つく（麗く）」、また「明らか」の意味である。本田によれば、卦の配列はふつう上下を逆さまにした形どうしでペアになるが、坎は逆さまにしても同じなので、陰陽を逆にした離とペアになる。</p>\n<p>程伝（序卦伝を引く）：「坎とは陥るなり。陥れば必ず麗く所有り。故に之を受くるに離を以てす。離とは麗くなり」。険難の中に陥れば、必ずどこかにくっつく所がある。理の自然である。これが離が坎に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>離は麗く（附麗する）こと、また明らかなことである。一陰が上下の陽についている形に取れば附麗の義、中が虚であることに取れば明の義となる。</li><li>離は火である。火の体は虚で、物について明るくなるものである。また日（太陽）でもあり、これも中が虚であることに取る。</li></ul>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>外が陽（充実）で真ん中だけ陰（空虚）の形が「明らか」になるのは、蝋燭の火を想像すればよい。灯心のところがかえって暗く、外が明るい。古代人は太陽の黒点を、三本足のカラスが太陽の真ん中に棲んでいると考えた。</li><li>離を「つく」と読むのは反訓である。漢字には正反対の意味がつくことがある（自分の本の上巻、解説の「易の名称」のところに書いた）。「乱」には「乱れる」のほか「治める」の意味があり、『論語』の「予に乱臣十人有り」の乱臣は国を治める家来のことである。「毒」には毒のほか「治める」「育てる」の意味があり、『老子』に用例がある。「離」にも「はなれる」と「つらなる・ならぶ・かかる」の意味がある。屈原の「離騒」は「騒」に「さわぐ」と「うれう」の意味があり、「憂いにかかる」の意味である（「別れの憂い」という解釈もあるが、一般には「憂いにかかる」と解する）。</li></ul>\n<h3 id=\"g30-s1\">卦辞</h3>\n<div class=\"orig\">離、利貞。亨。畜牝牛吉。</div>\n<div class=\"yomi\">離は貞しきに利あり。亨る。牝牛を畜（やしな）う。吉なり。</div>\n<p>この卦が出たら、正しい道を持続せよ。そうすれば願いは通る。雌牛のような柔順な徳を自ら養えば吉。</p>\n<p><span class=\"tag\">程伝</span>離は麗くことである。万物はみな麗く所がある。形があれば麗くことがある。人にあっては、親しく頼る人、由る道、主とする事は、みな麗く所である。人の麗く所は正しいことがよい。正を得れば亨通する。だから「貞しきに利あり、亨る」。「牝牛を畜う、吉」とは、牛の性は柔順で、牝牛はなおさら柔順である。順の至りである。すでに正に附いた以上、必ず牝牛のように正道に順えば吉である。牝牛を畜うとは、順徳を養うことをいう。人の順徳は養うことによって成る。すでに正に麗いたなら、養い習って順徳を成すべきである。</p>\n<p>本田の講説：実際は必ずしもそうではないが、通念として牝牛は最も柔順なものとされる。</p>\n<h3 id=\"g30-s2\">彖伝</h3>\n<div class=\"orig\">彖曰、離、麗也。日月麗乎天、百穀草木麗乎土。重明以麗乎正、乃化成天下。柔麗乎中正、故亨。是以畜牝牛吉也。</div>\n<div class=\"yomi\">彖に曰く、離は麗くなり。日月は天に麗き、百穀草木は土に麗く。重明以て正に麗く。乃ち天下を化成す。柔、中正に麗く。故に亨る。是を以て牝牛を畜うときは吉なり。</div>\n<p>離は「つく」という意味である。日月は天につき、穀物や草木は土につく。重なる明るいものが正しい道につけば、天下を感化し完成させることができる。陰爻が中正の位についている。だから願いは通る。そこで雌牛のような柔順さを養えば吉。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>離は附麗をいう。日月が天に麗き、百穀草木が土に麗くように、万物はみな麗く所がある。天地の間に麗く所のない物はない。人はその麗く所を審らかにすべきで、麗くことが正しければ亨る。</li><li>卦の才で言う。上下がみな離なのは重明である。五と二が中正にいるのは正に麗くことである。君臣上下に明徳があって中正にいれば、天下を化して文明の俗を成すことができる。</li><li>二と五は柔順で中正に麗く。だから亨る。人がその至順を養って中正に麗けば吉。だから「牝牛を畜えば吉」。ある人が「二は中正だが、五は陰で陽位にいる。正と言えるのか」と問うた。答え：離は麗くことを主とする。五は中正の位で、六がその正位に麗いている。だから正となる。学者が時義を知り、重軽を失わなければ、ともに易を語ることができる。</li></ul>\n<p>本田の講説：ここの「正」は、五そのものが尊厳ある位だという意味である。伊川は要するに、陰は陰位・陽は陽位という原則にこだわっていては易は解釈できないと言っているが、随分苦しい解釈である。受講者が「適当に判断しろということですか」と言うと、本田は、ここで「正」の字を置くから具合が悪い、六五が不正であることははっきりしている、三浦君の本では六二・六五と言わず「柔が中を得て正についている」と六二だけについて書いている、と答えた。「先生の解釈でもそうなっているのか」には、自分は「六二と六五が柔で中の位につき、そのうち六二は正位にもついている」と分けて解釈している、伊川はたぶん「政は正なり」という解釈で、政治をすべき位に陰がついているから正と呼べるとしたのだろうが、随分無理で論証にはなっていない、と答えた。</p>\n<h3 id=\"g30-s3\">大象</h3>\n<div class=\"orig\">明兩作離。大人以繼明照于四方。</div>\n<div class=\"yomi\">明両（ふた）たび作（おこ）るは離なり。大人以て明を継ぎ、四方を照らす。</div>\n<p>明らかなもの（太陽）が次々に昇って離となる。偉大な人物はこれにならって、文明の徳を継承し、四方を照らす。</p>\n<p><span class=\"tag\">程伝</span>もし「両明」と言えば、二つの明があるというだけで「明を継ぐ」義が出ない。だから「明両」と言う。明が重ねて二たび相継ぐことである。「離と作る」とは、明が二たびして離となることで、「明を継ぐ」義である。震・巽の類も重なって相継ぐ義を取るが、離の義が最も重い。大人とは、徳で言えば聖人、位で言えば王者である。大人は離明が相継ぐ象を観て、世々明徳を継ぎ、四方を照臨する。明をもって相継ぐのはみな「明を継ぐ」であるが、その大なるものを挙げたので、世襲継照で言ったのである。</p>\n<p>本田の講説：「明を継ぐ」には、昨日の太陽が沈んだ後に今日の太陽が昇るという意味なども含まれる。受講者が「どうして離の卦が一番重いのか」と問うと、本田は、震や巽の卦を見ても『易経』の本文では継承ということをさほど謳っていない、世襲ということをはっきり謳っているのはこの離の卦だけだ、と答えた。</p>\n<h3 id=\"g30-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>八純卦の義。</b> 九三の程伝によれば、同じ卦を二つ重ねた八つの純卦は、みな二体であることに義がある。乾は内外みな健、坤は上下みな順、震は威震が相継ぐ、巽は上下が順随する、坎は重険が相重なる、離は二明が継いで照らす、艮は内外みな止まる、兌は彼我が相説ぶ。そのなかで離の義は人事において最も大きい。</li><li><b>象伝の脚韻。</b> 六二の象伝が「中正」と言わず「中道」と言うのを、伊川は中の方が重く、中を得れば正はその中にある、と理屈をつける。本田によれば、実はこの卦の爻の象伝はすべて脚韻を踏んでいる。初九の「辟咎也」の「咎」、六二の「得中道也」の「道」（古い発音は「チュウ」の類）、九三の「何可久也」の「久」、九四の「无所容也」の「容」、六五の「離王公也」の「公」、上九の「以正邦也」の「邦」と、下から二番目の字が同じか似た母音で通している。だから「中道」を「中正」にするわけにはいかない。伊川は韻にあまり詳しくなかったらしく、これに気づかずに苦しい議論をしている。彖伝でも「中正」と言えないのに「柔、中正に麗く」と言っている箇所で、伊川は苦しい議論をしている。</li><li><b>最もおもしろい爻辞。</b> 本田は九三の爻辞を、六十四卦三百八十四爻のなかで最もおもしろいと言い、九四の爻辞も実におもしろいと言う。</li><li><b>易の盛者必滅。</b> 九三について受講者が「易の思想にも盛者必滅とかあるのか」と問うと、本田は、あることはあるが、こういう文句はあまりなく珍しい、と答えた。「日本仏教とは違って楽天的ですね」「『平家物語』の祇園精舎の盛者必滅とはちょっと違いますね」という声に、本田は、仏教の生者必滅は無常感だが、これはそうではなく、もっと図太い、と言った。「でもこれは仏教に影響されているのでは」には、多少はあるだろう、伊川は宋の人だから仏教の教義も心得ている、と答えた。</li><li><b>伊川の創作。</b> 九三の象伝の程伝（しかるべき人を探して事業を継がせ、退いて身を休める）について、本田は、本文にはまったくない伊川が勝手に作った解説だが、大変おもしろい、と言う。</li><li><b>悪の親玉だけを討て。</b> 上九の程伝は、明と断が極まっても中で締めくくらなければ苛酷になる、悪に染まった者を残らず追及すれば誅しきれない、魁首だけを取り、従わない者だけを捕えよ、と説き、『書経』胤征の「渠魁（きょかい）を殲（ほろぼ）せ。脅従は治むる罔（な）かれ」を引く。本田によれば、夏の胤侯が悪人を征伐した時の布告の文句である。</li><li><b>上経の終わり。</b> 本田は、これで周易の上経が終わったとし、『易経』は上経が三十卦、下経が三十四卦で半々ではないが、既済・未済のように上下反対の形の二卦を一組、坎・離のように上から見ても下から見ても同じ形の卦を一卦で一組と数えれば、上経・下経ともに十八組ずつになる、と述べる。</li></ul>\n<h3 id=\"g30-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>何にくっつくか（頼る人、従う道、携わる事業）が問われる時。正しいものにつけば願いは通る。</li><li>雌牛のように柔順な徳を養えば吉。</li><li>焦って動きたくても、身の程をわきまえて慎めば咎はない（初九）。中庸を得れば大吉（六二）。</li><li>盛りを過ぎ衰えに向かう時は、理の常と悟って楽しめ。老いを嘆くばかりなら凶（九三）。</li><li>突然現れて勢いで上を凌ごうとする者は、自ら身を滅ぼし、見捨てられる（九四）。</li><li>危うい地位にあっても、涙を流すほど深く憂え恐れれば吉（六五）。</li><li>悪を討つ時は首謀者だけを罰し、巻き込まれた者まで追及するな（上九）。</li></ul><h2 class=\"sec\" id=\"g30-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">履錯然。敬之无咎。</span></summary><div class=\"body\"><div class=\"yomi\">履むこと錯然たり。之を敬（つつし）めば咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「履錯之敬、以辟咎也。」（履錯の敬みは、以て咎を辟（さ）けんとなり。）</div>\n<p>足跡が入り乱れる（地団駄を踏む）。歩き方を慎めば咎はない。</p>\n<p><span class=\"tag\">程伝</span>陽はもとより動くことを好む。また下にいて離の体である。陽が下にいれば進もうとし、離の性は炎上（上へ燃え上がる）なので、志は上に麗くことにある。躁動に近い。「履むこと錯然」とは交錯することで、まだ進まないが足跡はすでに動いている。動けば下にいる分を失って咎がある。しかし剛明の才があるので、その義を知って敬慎すれば咎には至らない。初は下にいて位のない者である。身の進退を明らかにすることが、麗く所の道である。志がすでに動いて、敬慎できなければ妄動である。これは麗く所を明らかにしないことで、咎がある。</p>\n<p>受講者との問答：受講者が「どうして初九が『履むこと錯然』になるのか」と問うと、本田は、離の性質として火は上へ燃え上がろうとし、初九はその一番下なので上がりたい欲求はあるが、一番下にいるという分際で思うように上に行けない、それで地団駄を踏み、足跡が同じ場所に交錯するのだ、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>履むこと錯然として、動こうとして敬慎を知り、あえて進まない。咎を避け免れようとするゆえんである。明に居て剛なので、知って避けることができる。剛明でなければ妄動である。</p>\n<p>本田の講説：同じところで足踏みしているが、慎みを知っているので踏み出さない。だから妄動にはならない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>はやる気持ちで地団駄を踏む。まだ身分や時が許さないので、慎んで踏み出さなければ咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">黄離。元吉。</span></summary><div class=\"body\"><div class=\"yomi\">黄離（こうり）。元いに吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「黄離元吉、得中道也。」（黄離元吉なるは、中道を得ればなり。）</div>\n<p>黄色の太陽（黄色の輝き）。大いに吉。抽象的に言えば中庸を得た文明である。</p>\n<p><span class=\"tag\">程伝</span>二は中にいて正を得ている。中正に麗くのである。黄は中の色で、文の美しいものである。文明中正は美の盛んなものなので「黄離」という。文明中正の徳で、上は文明中順の君（六五）と志を同じくする。その明がこのようで、麗く所がこのようなので、大いに善の吉である。</p>\n<p>本田の講説：彖伝の「柔、中正に麗く」はこの爻のことである。中国では白・赤・青・黒・黄の五色がそれぞれ方位に対応し、黄は中央である。黄色が最も高貴な色とされ、天子の服は必ず黄色である。受講者が「五がどうして関係するのか」と問うと、本田は、二と五は対応する位置で、この卦では陰どうしであまり引き合わず、六五の爻辞を見ると滂沱と涙を流しているが、六二の方は志として五に応じ、くっつこうとする、志を同じくするということだ、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>元吉であるのは中道を得ているからである。「正」と言わないのは、中を重しとするからである。文明を成すのは中による。正はその中にある。</p>\n<p>本田の講説：苦しい議論である（脚韻の話は前述）。受講者が「正は中のうちにあるという理屈がつくのか」と問うと、本田は、「中正」と言ってもよさそうなのに象伝は「正」の字を使わないので、伊川は中の方が大事で、中さえあれば正はその中にあると理屈をつけたのだ、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>中庸を得た正しい明るさ。正しい相手と志を同じくすれば大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">日昃之離。不鼓缶而歌、則大耋之嗟。凶。</span></summary><div class=\"body\"><div class=\"yomi\">日昃（にっそく）の離なり。缶（ほとぎ）を鼓（う）ちて歌わずば、則ち大耋（だいてつ）の嗟（なげ）きあらん。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「日昃之離、何可久也。」（日昃の離、何ぞ久しかる可けんや。）</div>\n<p>西に傾く太陽である。人間で言えば晩年の時である。人の命がだんだん死に近づくのは理の当然だから、缶を叩いて歌うがよい。そうしなければ、いたずらに老いを嘆くばかりで、凶。本田によれば、「耋」は「老」と「至」の組み合わせで、七十歳とする説と八十歳とする説がある。大耋は老いぼれること。</p>\n<p><span class=\"tag\">程伝</span>八純卦はみな二体の義がある（前述）。九三は下体の終わりにいる。前の明がまさに尽きようとし、後の明が継ぐべき時で、人の始終、時の変わり目である。だから日昃の離、日が下り傾く明とする。傾けば沈もうとする。理で言えば、盛んなものは必ず衰え、始まれば必ず終わりがある。常道である。達者（悟った人）は理に順って楽しむ。缶は常用の器で、缶を鼓って歌うのは常を楽しむことである。このようにできなければ、大耋を嗟き憂えとする。それが凶である。大耋は傾き没すること。人の終わり尽きることについて、達者はそれが常理であることを知り、天を楽しむだけである。常に遇ってみな楽しむのは、缶を鼓って歌うようなものである。達しない者は、恐れおののき（怛）、終わり尽きることを悲しむ。大耋の嗟きがその凶である。これが死生に処する道である。</p>\n<p>本田の講説：繋辞伝に「天を楽しみ命を知る（楽天知命）」という言葉がある。缶を叩いて、たぶん酔っ払ってだろうが、歌を歌うようなものである。悟った人にとっては、これは凶でもなんでもない。</p>\n<p><span class=\"tag\">象伝について程伝</span>日がすでに傾けば、明はどうして久しくあろう。明者はその理を知るので、人を求めてその事を継がせ、退いて処って身を休める。常に安んじ順に処る。どうして凶とするに足りよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>盛りを過ぎ、衰えに向かう時。それを天の常と悟って楽しみ、後進に事を譲れば凶ではない。老いや衰えを嘆くばかりなら凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">突如其來如。焚如、死如、棄如。</span></summary><div class=\"body\"><div class=\"yomi\">突如、其れ来如（らいじょ）たり。焚如たり、死如たり、棄如たり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「突如其來如、无所容也。」（突如、其れ来如たり。容るる所无きなり。）</div>\n<p>乱暴者が突然やってくる。その気炎は燃えるようだが、結局は殺され、見捨てられる。本田によれば、「突如」は「突然」と同じで今の日本語でも使う。字の下に「如」をつけて形容詞を作る「〜如」は、もともとは『易経』だけに見られた表現である。</p>\n<p><span class=\"tag\">程伝</span>四は下体を離れて上体に昇る。明を継ぐ初めである。だから継承の義を言う。上にいて君に近いのは継承の地である。陽で離体にいて四に処り、剛躁で中正でなく、しかも重剛（九三の剛に続く）である。不正で剛盛の勢いで突如として来る。よく継ぐ者ではない。よく継ぐ者は必ず巽譲の誠と順承の道があり、舜や啓のようである。今、四は突如として来て、よく継ぐ道を失っている。また上には六五の陰柔の君を承けている。その剛盛で陵しのぐ勢いは、気が焚けるようである。だから「焚如」。四の行いがこのように良くないので、必ず禍害を被る。だから「死如」。継ぐ義を失い、承ける道を失っているのは、みな逆徳で、衆が棄て絶つ。だから「棄如」。死に棄てられるに至るのは禍の極みなので、凶と言うまでもない。</p>\n<p>本田の講説：継ぐ側にも譲る側にも謙遜と素直さがあった例として、禹から啓への継承を挙げる。はじめ禹は王位を息子の啓に譲らず、家来の益に譲ろうとしたが、大衆がみな啓の方についたので、やむをえず息子に位を譲った。もともとこの時代は親子継承ではなく天下の賢人に譲るもので、堯から舜に譲った時も赤の他人に譲った。また「逆徳」の「徳」の字は悪いことにも使い、「悪徳」という熟語がある。受講者が「死如の『死』という字は爻辞に出てくることがあるのか」と問うと、本田は、死ぬという肯定形では見えないようで、「恒に死せず」（豫の六五）とある、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>上はその君を陵ぎ、承ける所に順わない。人は憎み衆は棄てる。天下の容れないところである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>招かれもしないのに突然割り込み、勢いで上を凌ごうとする者は、自ら身を滅ぼし、誰からも見捨てられる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">出涕沱若、戚嗟若。吉。</span></summary><div class=\"body\"><div class=\"yomi\">涕（なみだ）を出だすこと沱若（だじゃく）たり。戚（うれ）うること嗟若（さじゃく）たり。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六五之吉、離王公也。」（六五の吉なるは、王公に離（つ）けばなり。）</div>\n<p>涙がぽろぽろとこぼれる。憂えては「はあっ」とため息をつく。このように自ら恐れ憂えるなら吉。本田によれば、「嗟」はちぇっという舌打ちの音を表し、「若」は「如」と同じく形容詞を作る。情景は非常に悪いのに判断の最後は吉で、こういうところが易の作者の端倪できない不思議なところである。</p>\n<p><span class=\"tag\">程伝</span>六五は尊位にいて中を守り、文明の徳があって、善と言える。しかし柔で上にいて、下に助けがなく（二も陰）、独り強い者（四と上の陽）の間に附いている。危懼すべき勢いである。ただ明であるので、懼れることが深く涙を出すほどに至り、憂慮することが深く嘆息するほどに至る。だから吉を保てるのである。涙を出し嘆息するのは、憂懼の深さを極言しただけで、時としてまさにそうすべきである。尊位にいて文明で、憂いを知ることがこのようなので吉を得た。もし自ら文明の徳と中正の地位を恃んで泰然として懼れなければ、どうして吉を保てようか。</p>\n<p><span class=\"tag\">象伝について程伝</span>六五が吉なのは、王公の正位に附いているからである。上にいる勢いで事の理を明察し、畏れ憂えてこれを保つ。だから吉を得られる。そうでなければ、どうして安らかでいられよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>強い者に挟まれて危うい立場。だが涙を流し嘆息するほど深く恐れ憂えれば、地位を保って吉。傲って恐れを知らなければ吉は保てない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">王用出征。有嘉、折首、獲匪其醜。无咎。</span></summary><div class=\"body\"><div class=\"yomi\">王用（もっ）て出でて征す。嘉きこと有り。首を折く。獲ること其の醜（たぐい）に匪ざるときは、咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「王用出征、以正邦也。」（王用て出でて征すとは、以て邦を正すなり。）</div>\n<p>王がその剛気と明察をもって敵の征伐に出かける。よい手柄がある。敵の首領の首を取る。捕虜にするのは自分になつかない悪人だけにする。そうであれば咎はない。本田によれば、「醜」は「類」と同じく「たぐい」「ともがら」の意味で、「みにくい」の意味ではない。</p>\n<p><span class=\"tag\">程伝</span>九は陽で上にいて、離の終わりにいる。剛明が極まった者である。明ならよく照らし、剛ならよく断ずる。よく照らせば邪悪を察するに足り、よく断ずれば威刑を行うに足る。だから王者はこのような剛明を用いて、天下の邪悪を弁じて征伐を行うべきである。そうすれば嘉美の功がある。征伐は刑を用いることの大きなものである。明が極まればどんな微細なものも照らさないものはなく、断が極まれば容赦することがない。これを中で約さなければ厳察に傷つく。天下の悪を去ろうとして、もし染まり汚れた者（心ならずも悪に染まった者）まで窮究すれば、どれほど誅しても誅しきれず、傷つき損なわれる者も多い。だからただその魁首を折り取るべきである。捕える者がその類でなければ、残暴の咎はない。『書経』に「渠魁を殲せ。脅従は治むる罔かれ」とある。</p>\n<p><span class=\"tag\">象伝について程伝</span>王者がこの上九の徳を用い、明照・剛断で天下の悪を察し除くのは、邦国を正し治めるゆえんである。剛明は上にいる者の道である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>断固として悪を討つべき時。手柄がある。ただし罰するのは首謀者だけにし、巻き込まれた者まで追及しなければ咎はない。</div></div></details><div class=\"pager\"><a href=\"#gua-29\">← 坎為水</a><a href=\"#gua-31\">沢山咸 →</a></div>", "gua-31": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 31 卦　第五十一講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">沢山咸</div><div class=\"yo\">たくざんかん</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-31\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-31\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-31\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-31\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-31\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-31\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-31\" data-jump=\"yao\">六爻</a></div><h3 id=\"g31-s0\">卦の名と象</h3>\n<p>下経の一番初めの卦。艮下兌上、下が山で上が沢という形である。</p>\n<p>程伝（序卦伝を引く）：「天地有りて、然る後に万物有り。万物有りて、然る後に男女有り。男女有りて、然る後に夫婦有り。夫婦有りて、然る後に父子有り。父子有りて、然る後に君臣有り。君臣有りて、然る後に上下有り。上下有りて、然る後に礼義錯（お）く所有り」。「錯」は措置する、設けるという意味である。本田によれば、序卦伝のこの部分は他の卦の説明に比べてばかに長い。序卦伝の作者が見た『易経』もやはり上経と下経に分かれていて、下経の初めに咸があったので、その切れ目を丁寧に説明したのであろう。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>天地は万物の本、夫婦は人倫の始めである。だから上経は乾坤を首とし、下経は咸を首として、恒をこれに継ぐ。天地は二物なので、乾坤の二卦が分かれて天地の道となる。男女は交合して夫婦となるので、咸と恒はいずれも二体が合して夫婦の義となる。</li><li>咸は感である。説（よろこ）ぶことを主とする。恒は常で、正しいことを本とする。人を悦ばせる道はもともと正しければこそ悦ばせられ、正しい道は当然人を悦ばせることができる。</li><li>咸の卦は、上が兌（少女）、下が艮（少男）である。男女が相感ずる情の深さは、年若い者に及ぶものはない。だから二つの少（わか）い者を重ねて咸とする。</li><li>艮の体は篤実で、止まるのは誠愨（せいかく）の義である。男の志が篤実で下に交わり、女の心が説んで上に応ずる。男が先に誠をもって感ぜしめ、女は説んでこれに応ずる。</li></ul>\n<p>受講者が「誠愨」の「愨」の意味を問うと、本田は「生真面目。殻という固いものを意味する字と心の組み合わせ」と答えた。</p>\n<h3 id=\"g31-s1\">卦辞</h3>\n<div class=\"orig\">咸、亨。利貞。取女吉。</div>\n<div class=\"yomi\">咸は亨る。貞しきに利あり。女を取るときは吉。</div>\n<p>この卦が出たら願いごとは通る。ただし動機の正しいことが条件である。この卦が出た場合、女を娶れば吉である。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>咸は感である。心をつけないのは、咸に「皆」の義があるからである。本田によれば、咸と感はほぼ同じ意味だが、咸の字のほうが意味が広く、「皆」を強調するために心をつけない、というのが程伊川の解釈である。これに対して宋の王応麟は「咸は無心の感」と言う。無心に感ずるということで、非常にうまい説明である。</li><li>物が感ずるものとして、男女に及ぶものはなく、とりわけ若い者が甚だしい。およそ君臣・上下から万物に至るまで、みな相感ずる道がある。物が相感ずれば亨通の理がある。君臣がよく相感ずれば君臣の道が通じ、上下がよく相感ずれば上下の志が通じる。父子・夫婦・親戚・朋友に至るまで、情意が相感ずれば和順して亨通する。だから感には亨る理がある。</li><li>「貞しきに利あり」とは、相感ずる道は正にあるということである。正をもってしなければ悪に入る。夫婦の淫蕩なまめかしさ、君臣の媚び説ばせ合い、上下の邪僻をもってする交わりは、みな相感ずるのに正をもってしないものである。</li><li>「女を取るときは吉」とは卦の才で言う。卦は柔が上、剛が下で、二気が感応し、ともに止まって説ぶ。男が女に下る義である。この義で女を娶れば、正を得て吉である。</li></ul>\n<p>本田の講説：いかにも道学者らしい倫理観にあふれた解説である。受講者が「卦の才とは何か」と問うと、本田は、卦の才能・働きのことで、この卦なら上半分が柔で喜ぶ、下半分が剛で止まる、これが働きだと答えた。また三本の爻のうち一本だけが陰（あるいは陽）なら、その一本がその八卦の性質を支配するのはすべての場合にそうか、との問いに、すべての場合そうで、純陽・純陰の場合だけは別だと答えた。</p>\n<h3 id=\"g31-s2\">彖伝</h3>\n<div class=\"orig\">咸、感也。柔上而剛下、二氣感應以相與、止而說、男下女。是以亨利貞、取女吉也。</div>\n<div class=\"yomi\">咸は感なり。柔上にして剛下なり。二気感応して以て相与（くみ）し、止まりて説び、男、女に下る。是を以て亨る、貞しきに利あり、女を取るときは吉なり。</div>\n<p>咸は下に心をつけた感と同じで、感動する・感動させる意味である。この卦は上が柔、下が剛。男女の陰陽二つの気が感応しあって互いに絡み合う。下は止まり、上は喜ぶ。男が女にへりくだる。しかも下は若い男、上は若い女で、心が通い合う。志が正しければ利があり、女を娶れば吉である。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>咸の義は感である。卦においては、柔が上り剛が下る。坤の六三が上って乾の上九の位置に入り、上が兌となる。乾の上九が下って坤の六三の位置に入り、下が艮となる。陰陽が交わり、男女が交感する義となる。本田によれば、程伊川はすべての卦の変化が乾坤に基づくと見るので、「柔上りて剛下る」とも読めると注の中で言っている。</li><li>また別に、兌の少女が上に、艮の少男が下にいるのも柔上剛下である。陰陽の二気が相感じ、相応じて和合する。これが「相与す」である。</li><li>「止まりて説ぶ」とは、説びに止まることで、堅く慤（まこと）な態度を示す。艮が下に止まるのは誠篤をもって相下ること、兌が上に説ぶのは和説して相応ずることである。男が女に下るのは和の至りである。感ずる道がこのようであるから、亨通して正を得、このような心がけで女を娶れば吉である。卦の才はこのとおりで、おおむね感の道は正しいことに利がある。</li></ul>\n<div class=\"orig\">天地感而萬物化生、聖人感人心而天下和平。觀其所感、而天地萬物之情可見矣。</div>\n<div class=\"yomi\">天地感じて万物化生し、聖人人心を感ぜしめて天下和平なり。其の感ずる所を観て、天地万物の情見る可し。</div>\n<p>天と地が感じ合ってこそ万物が発生する。聖人が人の心を感動させてこそ天下は平和になる。何が何を感動させるかを見れば、天地万物の実情は手に取るように知れる。</p>\n<p><span class=\"tag\">程伝</span>先に男女相感の義を言い、さらに感の道を推し極めて天地の理と聖人の用を言い尽くす。天地の二気が交感して万物を化生し、聖人の至誠が億兆の心を感ぜしめて天下は和平になる。天下の心が和平になるのは聖人がこれを感ぜしめたからである。天地が交感して万物を化生する理と、聖人が人心を感ぜしめて和平を致す道を観れば、天地万物の情が見える。感通の理は、道を知る者は黙してこれを観ればよい。</p>\n<h3 id=\"g31-s3\">大象</h3>\n<div class=\"orig\">山上有澤、咸。君子以虛受人。</div>\n<div class=\"yomi\">山上に沢有るは咸なり。君子以て虚にして人を受く。</div>\n<p>山の上に沢があるのが咸である。山の上に沢があれば、沢から水が滴ってぽたりぽたりと染みとおる。それが感じ合うということである。君子はこの卦のシンボルを見て、山が上の沢の水気を虚心に受け取るのと同様に、虚心に人を受け入れる。</p>\n<p><span class=\"tag\">程伝</span>沢の性は潤下し、土の性は潤いを受ける。沢が山の上にあると、その漸潤は通徹する。二物の気が相感通するのである。君子は山沢が気を通わせる象を見て、自分の中を虚しくして人を受け入れる。人は中が虚しければよく受け入れ、中が実（先入観でいっぱい）であれば入れることができない。中を虚しくするとは無我である。中に私主がなければ、感じて通じないものはない。升目で量ってこれだけは容れ、自分に合うものを択んで受け入れるのは、聖人の「感ずれば必ず通ずる」道ではない。</p>\n<p>本田の講説：注の後半、升目で分量を決めて入れる入れないを選ぶのは駄目で、虚心坦懐でなければならないというのは、本文にない程伊川独特の面白い解釈である。受講者が「日本で『たくさん』を『沢山』と書くのは何か関係があるか」と問うと、本田は「それは考えたことがなかった。わかりません」と答えた。</p>\n<h3 id=\"g31-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>身体の部位で象を取る。</b> 咸は感動の卦なので、爻辞にはみな「咸」の字がつき、しかも自分の肉体の部分に感じるものがあるという。足の親指（初）、こむら（二）、股（三）と、感じる場所が下から上がってくる。九四だけは身体の部位を言わないが、程伊川によれば九四はちょうど心臓の位置に当たり、感ずる主体である心そのものである。九五はその反対側の背中の肉、上六は顎・頬・舌である。</li><li><b>心と心臓。</b> 「心」の字は「こころ」という抽象的な意味を持つ前に、心臓をかたどった字である。昔の人は心臓が思考を司るとした。だから九四で思慮のことを言う。</li><li><b>判断を下さない爻。</b> 初六や上六のように吉凶の判断辞をまったく下していない爻も時々ある。初六はまだ足の親指だから吉とも凶とも言えず、程伊川の言うように「未だ以て進むに足らず」、まだ動いてはいけないということである。</li><li><b>象伝の古い体裁。</b> 九三の象伝の「亦た」について、程伝は、古くは象伝が本文と並んでおらず一まとめに続けて書かれていたので、前の爻の象伝を受ける文があると説く（九三の項参照）。</li><li><b>感通の道と繋辞伝。</b> 九四の程伝は、繋辞伝の「天下何をか思い何をか慮らん」から「神を窮め化を知るは、徳の盛んなるなり」までの長い一節を引いて、私心を去れば天下に感通しないものはないことを論じる。</li><li><b>本田の旧著との違い。</b> 九五について、本田の自著の解説は朱子の説によったので、程伊川の解釈とは少し違う。</li></ul>\n<h3 id=\"g31-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>願いごとは通るが、動機が正しいことが条件。女を娶るには吉。</li><li>虚心に人を受け入れよ。先入観で選り好みしては感じ合えない。</li><li>感動が浅いうちは動くな（初六）。自分から先に動けば凶、じっとして上の求めを待てば吉（六二）。</li><li>人につられて動くのは恥ずべき結果を招く（九三）。</li><li>私心でおろおろすれば身内しか動かせない。正しく一途であれば広く通じる（九四）。</li><li>贔屓の相手にかかずらわず、無感動な相手にまで及ぼせ（九五）。</li><li>口先だけで人を動かそうとしてはならない（上六）。</li></ul><h2 class=\"sec\" id=\"g31-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">咸其拇。</span></summary><div class=\"body\"><div class=\"yomi\">其の拇（おやゆび）に咸ず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「咸其拇、志在外也。」（其の拇に咸ずとは、志、外に在るなり。）</div>\n<p>足の親指に感じるところがあってむずむずする。しかし、まだ歩み出すことはできない。ここはまだ動いてはいけない。</p>\n<p><span class=\"tag\">程伝</span>初六は下卦の下にいて、四と相感じる。微小な身で咸の初めにいるので、その感じ方はまだ深くない。どうして人を動かせよう。だから足の親指が動くようなもので、まだ進むには足りない。拇は足の大指である。人の相感ずるには浅深・軽重の違いがある。その時勢を識れば、身の処し方の宜しきを失わない。</p>\n<p><span class=\"tag\">象伝について程伝</span>初の志が動くのは四に感ずるからで、だから「志、外に在り」という。志は動くが、感ずることがまだ深くないので、拇が動く程度で、進むには足りない。</p>\n<p>本田の講説：受講者が「吉とも凶とも言わない時はどうなのか」と問うと、本田は、程伊川の言うように「未だ以て進むに足らず」、動いてはいかん、まだ動けないということだと答えた。象伝の「志外に在り」に多少の示唆はあるが、吉凶ははっきり言っていない。下から上がっていくにしたがって叙述も変わってくる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>感動の兆しはあるがまだ浅い。進むにはまだ早く、動いてはいけない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">咸其腓、凶。居吉。</span></summary><div class=\"body\"><div class=\"yomi\">其の腓（こむら）に咸ず。凶。居れば吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「雖凶居吉、順不害也。」（凶と雖も居れば吉とは、順えば害あらざるなり。）</div>\n<p>足のこむらが感じてむずむずする。この爻が出れば結果は凶。しかし、自分の居場所にじっとしていれば吉。こむらに感動するのは動き出していることで、今動いたら凶、だからじっとしておれ、じっとしていれば吉と言うのである。</p>\n<p><span class=\"tag\">程伝</span>二は陰柔で下にいて、五と応じる。だから腓に咸ずる戒めを設ける。腓は足の肚（はら）で、歩こうとすると腓が先に動き、その後で足が上がる。足は腓のように自ら動くものではない。二がもし道を守らず、上の求めを待たずに腓のように自ら動けば、躁妄で自らを失う。凶であるゆえんである。居場所に安んじて動かず、上の求めを待てば、進退の道を得て吉である。二はもともと中正の人だが、咸の時にいて五に応ずるので、この戒めを設ける。「居れば吉」とは、分に安んじて自ら動かなければ吉ということである。</p>\n<p>本田の講説：歩くという動作では、足が持ち上がるより前にこむらの筋肉が先に緊張する。こむらにはそれ自体収縮して足を持ち上げる力があるので、自分勝手に行動しがちだが、それだと凶。上の要求を待ってはじめて動けば進退の道を得る。</p>\n<p><span class=\"tag\">象伝について程伝</span>二は中にいて正を得ており、応ずる五もまた中正で、その才はもともと善い。ただ咸の時にいて、質が柔で上に応ずるので、先に動いて君を求めれば凶、居を守り正を守れば吉と戒める。象伝はさらにこれを明らかにして、感ずることを全般に戒めるのではなく、ただ理に順えば害がない、つまり道を守って先に動かない、という意味だと言う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>心が動き出しているが、自分から先に動けば凶。居場所に安んじ、上からの正当な求めを待てば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">咸其股、執其隨。往吝。</span></summary><div class=\"body\"><div class=\"yomi\">其の股に咸ず。執ること其れ随う。往けば吝（りん）。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「咸其股、亦不處也。志在隨人、所執下也。」（其の股に咸ずとは、亦た処（お）らざるなり。志、人に随うに在り、執る所下きなり。）</div>\n<p>股がむずむずする（親指・こむら・股と感じる場所がだんだん上がってきた）。主義として取る道は他者に従うこと。行動すれば恥ずべき結果が待っている。受講者が「吝とは何か、けちという意味か」と問うと、本田は、吝は恥ずべしで、自分の解題では悔と吝は凶とまではいかないが悪い、と答えた。</p>\n<p><span class=\"tag\">程伝</span>九三は陽で陽位にいて、剛陽の才があり内卦の主となり、下体の上にいる。自ら正道を得て物を感ずべきであるのに、上六に応じている。陽は上ることを好み、陰を説ぶ。上は説（兌）の極みにいるので、三は感じてこれに従う。股は身の下、足の上にあって、自ら動くことができず、身につられて動くものである。だから象とする。三は自ら主となれず、物に随って動く股のようなもので、その執り守るところは物に随うことである。剛陽の才で、説ぶ所に感じて随う。このようにして往くのは恥ずべきである。</p>\n<p><span class=\"tag\">象伝について程伝</span>「亦た」と言うのは、古くは象伝が本文と並んでおらず一まとめに続けて書かれていたので、象伝同士で意味が続いているからである。ここの「亦た」は前の爻の象伝を受ける。初六に「志、外に在り」、六二に「凶と雖も居れば吉、順えば害あらず」とあった。初と二の二陰はいずれも感じて動いたが、三は陽であるのにやはり同じなので「亦た処らず」と言う。「処らず」とは動くことである。剛陽の質を持ちながら自ら主となれず、志はかえって人に随うことにある。執るところが卑下の甚だしいものである。</p>\n<p>本田の講説：現在の『易経』では各爻の本文の後に一つ一つ「象に曰く」として象伝が割り付けてあるが、古い体裁では本文は本文、象伝は象伝でまとめてあった。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>強い才を持ちながら、好きな相手に引かれて主体性なく人に付き従う。このまま進めば恥をかく。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">貞吉悔亡。憧憧往來、朋從爾思。</span></summary><div class=\"body\"><div class=\"yomi\">貞しければ吉にして悔亡ぶ。憧憧（しょうしょう）として往来すれば、朋のみ爾（なんじ）の思いに従う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「貞吉悔亡、未感害也。憧憧往來、未光大也。」（貞しければ吉にして悔亡ぶとは、未だ感害せられざるなり。憧憧として往来するは、未だ光大ならざるなり。）</div>\n<p>占う人の動機が正しければ結果は吉で、悔はなくなる。しかし、おろおろとして行きつ戻りつすれば、仲間だけがあなたの思いに従うであろう。この爻だけは「咸」の字がないが、「朋爾の思いに従う」に感動の意味が潜んでいる。もっとも、これは広く人を感動させることはできないということで、良い意味ではない。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>感は人の動きである（「感動」と熟するように感には「うごかす」意味がある）。だから爻はみな人の身体で象を取る。拇は下にあって動きのかすかなもの、腓は先に動くもの、股は随うものとして取った。九四だけは象を取らず、直接感の道を言う。「其の心に咸ず」とは言わないが、感ずるものはすなわち心である。四は卦の中ほどにいて上体の下にあり、心の位に当たる。だから咸の主であり、感の道は貞正であれば吉で悔が亡ぶと言う。正をもって感ぜしめなければ悔がある。</li><li>四は説（兌）の体で、陰位にいて初に応ずるので、貞を戒めとする。受講者が「どうして正しくあれということになるのか」と問うと、本田は、貞は正と同じで、九四は陽が陰位、応ずる初六も陰が陽位にいて、どちらも正の位にいないからだと答えた。</li><li>感の道は通じないところがあってはならない。一つのものに係わるところがあれば感通に害があり、悔がある。聖人が天下の心を感ぜしめるのは、寒暑雨晴のように通じないところも応じないところもない。それはただ貞だからである。貞とは中を虚しくし無我であることである（本田によれば、これは易の本文に必ずしも出てこない程伊川独特の解釈）。</li><li>「憧憧として往来すれば朋のみ爾の思いに従う」とは、貞であれば感じて通じないものはないが、もし往来憧憧として私心を用いて物を感ぜしめようとすれば、思いの及ぶものは感じてくれても、及ばないものは感じさせられない。これが、その類（仲間）だけがその思いに従うということである。一隅一事に係わる私心で、どうして廓然として通じないところがないことができよう。</li><li>繋辞伝「天下何をか思い何をか慮らん。天下帰を同じうして塗を殊にし、致を一にして慮を百にす」（非常によく引かれる名文句）。孔子は咸に因んで感通の道を極論している。思慮の私心で物を感ぜしめれば感ずるところは狭い。天下の理は一つで、道筋は異なっても帰するところは同じ、慮りは百通りでも到達点は一つである。物に万殊、事に万変があっても、一をもって統べれば違うものはない。だから意を貞にすれば天下に感じないものはない。</li><li>繋辞伝「日往けば月来り、月往けば日来り、日月相推して明生ず。寒往けば暑来り、暑往けば寒来り、寒暑相推して歳成る。往くとは屈するなり、来るとは信（の）ぶるなり。屈信相感じて利生ず」。往来屈信で感通の理を明らかにする。屈すれば信び、信びれば屈する。これがいわゆる感応で、日月・寒暑の推移、万物を生む功はこれによる。受講者が「信用の信が伸びる意味になるのか」と問うと、本田は信は伸と同音で同じように使うことがあると答えた。</li><li>繋辞伝「尺蠖（せっかく）の屈するは以て信びんことを求むるなり。龍蛇の蟄するは以て身を存せんとなり。義を精しくし神に入るは以て用を致さんとなり。用を利し身を安んずるは以て徳を崇めんとなり。此を過ぎて以往は未だ之を知る或らざるなり」。程伝：尺取り虫は先に屈して後に信びる。龍蛇の冬籠もりは身を休め、のちに奮い立つため。動と息が相感ずるのも屈信である。君子が精微の義に心を潜めて神妙に入るのは積むこと、用を致すのは施すことで、積むと施すもまた屈信である。用を利して身を安処するのは徳業を崇大にするゆえんで、なすところが理に合えば事は正しく身は安らかである。人の事はここに尽きる。</li><li>繋辞伝「神を窮め化を知るは、徳の盛んなるなり」。至神の妙を窮め化育の道を知ることは徳の至盛で、これに加えるものはない。</li></ul>\n<p>本田の講説：受講者が「どうして九四で思考のことを言うのか」と問うと、他の爻は足の親指や腓や股の肉など、それ自身は主体性を持たず上半身や足につられて動くが、九四は体の部分で言えば心臓、つまり心を指し、昔の人は心臓が思考を司るとしたからだと答えた。「九四が一番良い爻か」との問いには、この卦に関しては一番良いと答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>「貞しければ吉にして悔亡ぶ」は、まだ私感に害されていないからである。私感に係われば感の道を害する。「憧憧として往来する」は私心で物を感ぜしめようとするもので、感の道が狭い。だから「未だ光大ならず」という。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>この卦で一番良い爻。動機が正しく私心がなければ吉で悔もない。私心でおろおろと立ち回れば、身内しか動かせない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">咸其脢、无悔。</span></summary><div class=\"body\"><div class=\"yomi\">其の脢（ばい）に咸ず。悔无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「咸其脢、志末也。」（其の脢に咸ずとは、志末なればなり。）</div>\n<p>背中の肉に感じるものがある。悔はない（吉とは言わない）。</p>\n<p><span class=\"tag\">程伝</span>九五は尊位にいて、至誠をもって天下を感ぜしむべきである。しかし二に応じ、上六に比している（すぐ上の小人と親しむ）。もし二に係わり上を説べば、偏私で浅く狭く、人君の道ではない。どうして天下を感ぜしめられよう。脢は背中の肉で、心と相背いて見えないところである。よく私心に背き、感ずる対象が目で見て説ぶものだけでなければ、人君が天下を感ぜしめる正しさを得て、悔がない。</p>\n<p><span class=\"tag\">象伝について程伝</span>私心に背いて脢に咸ぜよと戒めるのは、五の心の存し方が浅く末であり、二に係わり上を説んで、私欲に感じているからである。受講者が「志末なればなりというのは戒めているのか」と問うと、本田は「はい」と答えた。</p>\n<p>本田の講説：九四は爻辞で肉体のシンボルを示さないが、程伊川によれば実は心に当たる。九五は心臓とちょうど反対の背中の肉をシンボルに取る。目に見えない背中の肉にも感動するように、無感動な相手にまで感動させるようにせよ、自分の贔屓にのみかかずらわってはいけない、という意味である。本田の自著の解説は朱子の説によったので、程伊川とは少し違う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者が贔屓や身近な者にばかり心を寄せてはならない。私心に背いて目に見えぬところまで及ぼせば悔はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">咸其輔頰舌。</span></summary><div class=\"body\"><div class=\"yomi\">其の輔頬舌（ほきょうぜつ）に咸ず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「咸其輔頰舌、滕口說也。」（其の輔頬舌に咸ずとは、口説を滕（あ）ぐるなり。）</div>\n<p>輔は上顎と下顎の噛み合わさっている部分。顎の噛み合わせ、頬、舌といったところに感動がある。この爻は吉とも凶とも判断を下していない。</p>\n<p><span class=\"tag\">程伝</span>上は陰柔で説（兌）の体であり、説の主である。また咸の極みにいて、物を感ぜしめようと欲する極みである。だから至誠で物を感ぜしめることができず、口舌の間に現れる。小人・女子の常態である。どうして人を動かせよう。ただ「口」と言わずに「輔頬舌」と言うのは、今の人が口の過ちを「唇吻」「頬舌」と言うのと同じである。輔・頬・舌はみな物を言うためのものである。</p>\n<p>本田の講説：「唇吻」は宋代の俗語。この爻は吉とも凶とも言わないが、程伊川の解釈では「小人・女子の常態」、つまり言わずとも卑しむべきものということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>ただ至誠だけが人を感ぜしめる。柔説（柔らかな、人を悦ばせる態度）で口先の弁舌を高く掲げて、どうして人を感ぜしめられよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>真心ではなく口先だけで人を動かそうとしている。そのような弁舌では人は感動しない。</div></div></details><div class=\"pager\"><a href=\"#gua-30\">← 離為火</a><a href=\"#gua-32\">雷風恒 →</a></div>", "gua-32": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 32 卦　第五十一講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">雷風恒</div><div class=\"yo\">らいふうこう</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-32\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-32\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-32\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-32\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-32\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-32\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-32\" data-jump=\"yao\">六爻</a></div><h3 id=\"g32-s0\">卦の名と象</h3>\n<p>咸を上下反対にすると恒の卦になる。巽下震上、下半分が巽、上半分が震である。</p>\n<p>程伝（序卦伝を引く）：「夫婦の道は以て久しからざる可からず。故に之を受くるに恒を以てす。恒は久なり」。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>咸は夫婦の道である。夫婦は終身変わらないものである（「夫婦の道は変わる可からざる者なり」とするテキストもある）。だから咸の後を恒で受ける。</li><li>咸は少男が少女の下にいる。男が女にへりくだるので、男女交感の義となる。恒は長男が長女の上にいる。男が尊く女が卑しい、夫婦が家にいる常道である。交感の情を論ずれば若い者ほど切実であり、尊卑の序を論ずれば年長者こそ謹厳で正しくなければならない。だから兌艮（少女・少男）を咸とし、震巽（長男・長女）を恒とする。</li><li>男が女の上にいて、男は外で動き、女は内で順う。人の理の常である。だから恒という。また剛が上で柔が下、雷と風が相与（くみ）し、巽（へりくだり）にして動き、剛柔がみな相応ずる（初と四、二と五、三と上の陰陽がすべて応じる）。いずれも恒の義である。</li></ul>\n<p>本田の講説：受講者が「中国ではお妾さんを何人も持ったりするようだが、妾をいかんとはどこにも書いてない」と言うと、本田は、それにもかかわらず夫婦の道は立てなければならない、妾は子孫を絶やさないために持つべきものとされ、第一夫人は第二夫人に嫉妬してはいけないことになっている、だから正夫人の地位は絶対なのだ、と答えた。受講者が「今の中国にはまるで当てはまらない、男尊女卑ですね」「いったん結婚しちゃったらこっちのもんだということか」と言うと、本田は、そのくせ前の咸では男が女にへりくだり、そうすることで感情が疎通するとしている、咸は情を述べ、恒は道義を述べている、と答えた。</p>\n<h3 id=\"g32-s1\">卦辞</h3>\n<div class=\"orig\">恆、亨、无咎、利貞、利有攸往。</div>\n<div class=\"yomi\">恒は亨る。咎无し。貞しきに利あり。往く攸（ところ）有るに利あり。</div>\n<p>この卦が出れば願いごとは通る。咎はないであろう。動機の正しいことが条件である。前進してよろしい。元・亨・利・貞の四徳が揃うのが一番めでたいが、この判断は元がないだけで、四徳のうち三つまで揃っている。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>恒は常久である。恒の道は亨通することができる。恒があってよく亨るのは、咎がないということでもある。恒であっても亨ることができないのは、恒とすべき道ではなく、咎がある。君子が善において恒があるのは恒とすべき道であり、小人が悪において恒があるのは恒とすべき道を失っている。</li><li>恒がよく亨るゆえんは貞正にある。だから「貞しきに利あり」という。</li><li>いわゆる恒とは、一つの隅を守って変化を知らないことではない。だから「往く攸有るに利あり」という。往く攸（変化するところ）があってこそ常であることができる。一定であれば常であることはできない。また常久の道は、どこへ往っても利がある。</li></ul>\n<h3 id=\"g32-s2\">彖伝</h3>\n<div class=\"orig\">恆、久也。剛上而柔下、雷風相與、巽而動、剛柔皆應、恆。</div>\n<div class=\"yomi\">恒は久なり。剛上にして柔下なり。雷風相与し、巽にして動き、剛柔皆な応ずるは恒なり。</div>\n<p>恒とは久しいという意味である。この卦は上が剛で下が柔（「剛上りて柔下る」とも読める）。雷と風が力を合わせ、へりくだって動く。陽と陰が互いに応じ合うから、常に久しいのである。</p>\n<p><span class=\"tag\">程伝</span>恒は長久の義である。この卦には四つの要点があって恒の義を成す。</p>\n<ul class=\"sen\"><li>「剛上にして柔下」とは、乾の初九が上って坤の四の位に行き、坤の初六が下って乾の初の位に来た、剛が上り柔が下ったことを言う。二つの爻が場所を変えれば震と巽の二卦ができる。震が上で巽が下というのも剛上柔下で、剛が上にいて柔が下にいるのは恒の道である。</li><li>「雷風相与す」とは、雷が震えば風が起こり、二者が相待ってかわるがわるその勢いを助ける。これが自然の常である。</li><li>「巽にして動く」とは、下は巽順、上は震動で、順って動くことである。天地の造化が恒久にしてやまないのは順動にほかならない。動いて順でなければ、どうして常であり得よう。</li><li>「剛柔皆な応ず」とは、一卦の剛柔の爻がみな相応ずることである。剛柔が相応ずるのは理の常である。</li></ul>\n<div class=\"orig\">恆亨无咎利貞、久於其道也。天地之道、恆
