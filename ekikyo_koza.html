ず自分自身を厳しく省みよ。</div></div></details><div class=\"pager\"><a href=\"#gua-36\">← 地火明夷</a><a href=\"#gua-38\">火沢睽 →</a></div>", "gua-38": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 38 卦　第五十四講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">火沢睽</div><div class=\"yo\">かたくけい</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-38\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-38\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-38\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-38\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-38\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-38\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-38\" data-jump=\"yao\">六爻</a></div><h3 id=\"g38-s0\">卦の名と象</h3>\n<p>家人の次の卦。「睽」は目偏がついていて、目を背け合うという意味で、あまり見かけない字である。兌下離上、下半分が兌、上半分が離である。</p>\n<p>程伝（序卦伝を引く）：「家道窮まれば必ず乖（そむ）く。故に之を受くるに睽を以てす。睽とは乖くなり」。</p>\n<p><span class=\"tag\">程伝</span>家道が窮まれば睽乖離散するのは理の必然である。だから家人の後を睽で受ける。卦は上が離、下が兌である。離の火は炎上し、兌の沢は潤下する。二体の性が違う。睽の義である。また中女（離）と少女（兌）の二女は、同居していても帰する所（嫁ぎ先）がそれぞれ異なり、その志は同じく行かない。これもまた睽の義である。</p>\n<p>本田の講説：大家族制度で、嫁入っても婿が同居していると見る。二人の娘が嫁いで同居していれば、必ず仲が悪くなる。これも「背く」という意味になる。</p>\n<h3 id=\"g38-s1\">卦辞</h3>\n<div class=\"orig\">睽、小事吉。</div>\n<div class=\"yomi\">睽は小事には吉。</div>\n<p>この卦が出たら、小さいことには吉。あまり良い卦ではない。言わないけれども、大きなことには悪いということが言外にある。</p>\n<p><span class=\"tag\">程伝</span>睽は乖き離散する時で、吉の道ではない。ただ卦の才がよいので、睽の時に処していても小事には吉である（本田によれば、上半分は明らか、下半分は喜ぶという意味がある）。</p>\n<h3 id=\"g38-s2\">彖伝</h3>\n<div class=\"orig\">睽、火動而上、澤動而下。二女同居、其志不同行。</div>\n<div class=\"yomi\">睽は、火動いて上り、沢動いて下る。二女同居して、其の志同じく行かず。</div>\n<p>この卦は火が動いて上り、沢が動いて下ろうとする。二人の娘が同じ家に同居するが、その志は並んでは行かない。</p>\n<p><span class=\"tag\">程伝</span>彖伝は先に睽の義を釈し、次に卦の才を言い、終わりに睽を合わせる道を言って、その時用の大を讃える。火の性は動いて上り、沢の性は動いて下る。二物の性が違うので睽の義となる。中女と少女の二女は同居していても志は同じく行かない。これも睽の義である。女が幼い時は一緒にいるが、長ずればそれぞれその帰（嫁ぎ先）に行く。その志が異なるのである。「睽」と言うのは、もともと同じだからである。もともと同じでなければ睽ではない。</p>\n<div class=\"orig\">說而麗乎明、柔進而上行、得中而應乎剛、是以小事吉。</div>\n<div class=\"yomi\">説（よろこ）びて明に麗（つ）き、柔進みて上行し、中を得て剛に応ず。是を以て小事には吉。</div>\n<p>下半分の喜ぶという卦が、上半分の明らかという卦にくっついている。陰が進んで上に行き（六五のこと）、上半分の真ん中の中庸の位を得て、九二という強い陽と対応している。そういう対応関係があるから、小さい事を行うには吉。</p>\n<p><span class=\"tag\">程伝</span>卦の才がこのようなので小事に吉である。兌は説、離は麗であり明でもある。だから説順で明に附く。およそ離が上にあって柔が尊位にいることを示そうとするときは、「柔進みて上行す」と言う。晋・鼎がそれである。睽の時に当たり、六五は柔で尊位にいて、説順麗明の善がある。また中道を得て剛に応ずる。天下の睽を合わせ、天下の大事を成すことはできないが、少しは済うことができる。これが小事には吉ということである。ある人が問うた。「五は明で剛に応じているのに、大吉を致せないのはなぜか」。答え：五は陰柔で、剛に応じていても睽の時で、相与する道がまだ深く固くはない。だから二は必ず主を巷に遇い、五は膚を噛むようであって、初めて咎がない。天下が睽散する時には、必ず君臣ともに陽剛・中正で、至誠をもって協力して、その後に合わせることができる。</p>\n<p>本田の講説：「上り行く」は実際に爻が下から上へ上っていくのではなく、五の位にすでに上っているという意味。</p>\n<div class=\"orig\">天地睽而其事同也、男女睽而其志通也、萬物睽而其事類也。睽之時用大矣哉。</div>\n<div class=\"yomi\">天地睽きて其の事同じきなり。男女睽きて其の志通ずるなり。万物睽きて其の事類するなり。睽の時用大なるかな。</div>\n<p>天と地は反対の方向にあって背き合っているが、万物を育てる事業は同じである。男と女は性格がまったく反対だが、その志は通じ合う（それで初めて子供ができる）。万物はそれぞれ種類が違うが、その成すことはだいたい同類である。背くという時の働きは偉大である。</p>\n<p><span class=\"tag\">程伝</span>物理の同じことを推して睽の時用を明らかにする。これが聖人の睽を合わせる道である。同じものが同じであると見るのは世俗の知である。聖人は物理がもともと同じであることを明らかにし、それで天下を同じくし万類を和合させる。天地・男女・万物でこれを明らかにする。天は高く地は低く、その体は睽く。しかし陽が降り陰が昇り、相合して化育の事を成すことは同じである。男女は質を異にして睽くが、相求める志は通じる。生物の万殊なのは睽くが、天地の和を得、陰陽の気を稟けることは相類する。物は異なっても理はもともと同じである。だから天下の大、群生の衆は睽散万殊であっても、聖人はよくこれを同じくする。睽の時に処して睽の用を合わせる。その事は至って大である。だから「大なるかな」と言う。</p>\n<p>本田の講説：形は異なっても奥底の理は本来同じで、理は万物を貫いて一つあるというのが程伊川の哲学である。</p>\n<h3 id=\"g38-s3\">大象</h3>\n<div class=\"orig\">上火下澤、睽。君子以同而異。</div>\n<div class=\"yomi\">上に火あり下に沢あるは睽なり。君子以て同じくして異なる。</div>\n<p>上半分が火、下半分が沢。この卦を背くと呼ぶ。君子はこの卦にかたどって、道義においては人と同調するが、世俗の誤りにおいてはあえて異を立てる（程伊川の伝による解釈）。</p>\n<p><span class=\"tag\">程伝</span>上は火、下は沢で、二物の性が違う。睽異の象となるゆえんである。君子は睽異の象を観て、大同の中にまさに異なるべき所を知る。聖賢が世に処するには、人理の常においては大同しないことはないが、世俗の同じくするものにおいては時に独り異なる。思うに秉彝（倫理）においては同じく、世俗の失においては異なる。大同できない者は常を乱し理に払（もと）る人であり、独り異なることができない者は俗に随い非に習う人である。要は、同であってよく異なることにある。『中庸』に「和して流れず」と言うのがこれである。</p>\n<p>本田の講説：「秉彝」は倫理のことで、『詩経』烝民の詩に「民の秉彝」という文句がある。『論語』には「和して同ぜず」とあり、出典としてはこのほうが古い。『論語』の「同」は悪いほうの意味で、俗人と簡単に同調することを言い、ここの「大同」の「同」とは意味がちょっと違う。</p>\n<h3 id=\"g38-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>背くのは本が同じだから。</b> 程伝は繰り返し、もともと同じであるからこそ背くことが起こり得、もとが全く異なるものなら背くとは言わない、と説く。睽の卦では初と四だけが陽同士で応じず、あとはみな応じ合う。合致しているからこそ背くことが起こり得るのである。</li><li><b>悪人にも会え。</b> 初九の程伝は、背き合う時に小人をすべて捨て絶てば天下をことごとく君子の敵にすることになり、含弘の義を失って凶咎を招く、古の聖王が凶悪を化して善良とし仇敵を臣民としたのは捨て絶たなかったからだ、と説く。</li><li><b>正応でも詳しく求め合え。</b> 九二の程伝によれば、睽の時には陰陽相応ずる道が衰え剛柔相戻る意が勝つ。易を学ぶ者はこういう例外的なケースもあることを知れば変通を知るであろう。ただし委曲（こまやかに）求めるとは、善い道でうまくやりくりして合わせることで、己を枉げ道を屈することではない。</li><li><b>「天」の字。</b> 六三の「其の人天せられ」について受講者が問うと、本田は、「天」はもともとHEAVENの意味ではなく、『説文解字』に「天は顛なり」とあり、人の頭のことで、そこから頭の上にある大空を意味するようになった、字の形は手を広げた人の頭である、と説明した。「天せらる」は髪の毛を剃られる刑罰で、後世はこの意味ではあまり使わず「髡」の字が使われる。受講者が「今でも罰として頭を剃る」と言うと、本田は、謝る時、へまをした時に頭を剃る、一番軽い刑罰だと答えた。受講者が「この爻は何を言いたいのか」と問うと、六三が上九の所へ行こうとするのを九四と九二が邪魔することを、車を引き戻され、牛を止められ、髪を剃られ鼻を斬られると言ったもので、だいぶひどいが最後には上九と会える、と答えた。</li><li><b>周公と諸葛孔明。</b> 六五の程伝は、幼い成王が周公（姫公）の輔けで王業を興し、暗弱な劉禅が諸葛孔明の輔けで蜀を中興させる勢いがあったのは、聖賢の輔けに任じ、輔佐が深く入り込んだからだとする。</li><li><b>上九の幻想的なイメージ。</b> 上九の爻辞は非常に奇妙で幻想的な表現で、程伊川はこれをなるべく合理的に解釈しようとし、幽霊が車一杯に載っているのを上九の妄想と見る。本田は、宋の学者の合理主義なところで、易の本文を書いた人は本当に幽霊が乗っているつもりで書いたのかもしれない、と言う。受講者の問いに答えて、鬼（幽霊、死んだ人がなるもの）が具体的に出てくるのはここだけではなかったかと思う、「鬼神」という熟語は乾の文言伝に出てくる、と言った。この卦は文句が特に難しい。</li></ul>\n<h3 id=\"g38-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>人々が背き合う時。大事は成らないが、小事には吉。</li><li>大筋では人と同調しつつ、世俗の誤りには異を立てよ。</li><li>去るものを追わず、自然に戻るのを待て。気に入らない相手でも拒絶せず会っておけば咎はない（初九）。</li><li>正しい相手とも、こまやかに工夫して巡り合いを求めよ。道を曲げるのではない（九二）。</li><li>初めは邪魔されてひどい目に遭うが、最後は求める相手と結ばれる（六三）。</li><li>孤立しても、同じ志の善き人と誠をもって結べば、危うくても咎はない（九四）。</li><li>力が足りなくても、深く結束してくれる補佐役がいれば進んで喜びがある（六五）。</li><li>疑心暗鬼で相手を敵と見ていたのが、疑いが解けて和合する。雨に遇えば吉（上九）。</li></ul><h2 class=\"sec\" id=\"g38-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">悔亡。喪馬勿逐自復。見惡人无咎。</span></summary><div class=\"body\"><div class=\"yomi\">悔亡ぶ。馬を喪うも逐う勿（な）くして自ずから復る。悪人を見れば咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「見惡人、以辟咎也。」（悪人を見るは、以て咎を辟（さ）けんとなり。）</div>\n<p>後悔があるべきだが、その後悔もなくなる。馬が逃げても追いかける必要はない。自分から帰ってくる。悪人にも喜んで会うようにすれば咎がない。「見」は会う、会見する、「まみゆ」という訓もある。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>九は卦の下にいて、睽の始めである。睽の時に剛で下に動くので、悔があることは知れている。悔が亡ぶのは、九四が上にいて、これも剛陽で睽離して与する者がなく、自然に同類が相合うからである。二陽はもともと相応ずる者ではないが、睽の時に陽同士で下にいて、相応ずる位に当たるので、同徳で相合う。上下が相与するので悔を亡ぼすことができる。</li><li>睽にあっては諸爻みな応がある。合えば睽くことがある。もともと異なれば何を睽こう。ただ初と四だけは応ではないが徳を同じくする。だから相遇う。</li><li>馬は行く手段である。陽は上に行くものである。睽いて独りで与する者がなければ行けない。これが馬を喪うことである。四がすでに初と合えば行ける。これが逐わずして馬がまた得られることである。</li><li>悪人とは己と乖異する者である。「見る」とは通ずることである。睽の時に当たり、徳を同じくする者が相与しても、乖異する小人は至って多い。もしこれを棄絶すれば、天下をことごとく君子の仇にすることになりはしないか。そうすれば含弘の義を失い、凶咎の道を致す。どうして不善を化して合わせることができよう。だから必ず悪人を見れば咎がない。古の聖王が凶悪を化して善良とし、仇敵を革めて臣民としたのは、棄絶しなかったことによる。</li></ul>\n<p>本田の講説：初九は下半分の一番下で卦全体の一番下でもあり、九四も上半分の一番下にいる。陽は上り行く性質があるので馬のたとえを持ってくる。</p>\n<p><span class=\"tag\">象伝について程伝</span>睽の時は人情が乖き違う。これを和合しようとしても、なおできないことを病む。もし悪人だからと拒絶すれば、衆を率いて君子に仇をなし、禍が至る。だから必ずこれを見る。怨咎を免れ辟けるゆえんである。怨咎がなければ合わせる道がある。「辟」は「避」と同じ。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>去ったものを無理に追うな、自然に戻ってくる。気の合わない相手や悪人も拒絶せずに会っておけば、恨みを買わず咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">遇主于巷、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">主に巷（ちまた）に遇う。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「遇主于巷、未失道也。」（主に巷に遇うとは、未だ道を失わざるなり。）</div>\n<p>自分の主人を捜し求めて、狭い路地で落ち合う。咎はない。</p>\n<p><span class=\"tag\">程伝</span>二と五は正応で、相与する者である。しかし睽の時には、陰陽相応ずる道が衰え、剛柔相戻る意が勝つ。易を学ぶ者がこれを識れば変通を知るであろう。だから二と五は正応でも、委曲して相求めるべきである。二は剛中の徳で下にいて、上は六五の君に応じている。道が合えば志が行われ、睽を済う功を成す。しかし睽の時にいて、その交わりは固くない。二はこまやかに相遇うことを求め、合うことを期すべきである。だから「主に巷に遇う」という。必ずよく遇うことができて咎がない。君臣が睽離すればその咎は大きい。巷は委曲の途、遇は会逢の謂である。委曲して求め、会遇を期し、合うことを期すべきである。いわゆる委曲とは、善い道で宛転将就して合わせるだけで、己を枉げ道を屈することではない。</p>\n<p>本田の講説：陰陽はふつう引き合うものだが、睽の時にあってはこういう例外的なケースもある。皆が猜疑心を抱き合う時である。「委曲」は細かい、細いの意味。「宛転」は「うまく」、「将就」は「やりくり」という意味の俗語である。</p>\n<p><span class=\"tag\">象伝について程伝</span>睽の時に当たり、君の心はまだ合わない。賢臣は下にいて、力を竭くし誠を尽くし、君を信じさせ合わせることを期するのみである。至誠でこれを感動させ、力を尽くして扶持し、義理を明らかにしてその知を致し、蔽惑を杜（ふさ）いでその意を誠にする。このように宛転して合うことを求める。遇とは道を枉げて迎え逢うことではない。巷とは邪径によることではない。だから夫子は特に「主に巷に遇う、未だ道を失わざるなり」と言う。「未だ」とは必ずしもではないということで、必ずしも道を失うことを言うのではない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>本来の相手とも心が通いにくい時。正道を曲げずに、こまやかに工夫して巡り合いを求めれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">見輿曳、其牛掣。其人天且劓。无初有終。</span></summary><div class=\"body\"><div class=\"yomi\">輿を曳かるるを見る。其の牛掣（とど）めらる。其の人天（てん）せられ且つ劓（はなき）らる。初め无く終り有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「見輿曳、位不當也。无初有終、遇剛也。」（輿を曳かるるを見るは、位当たらざればなり。初め无く終り有るは、剛に遇えばなり。）</div>\n<p>非常に奇妙な爻辞。牛車を後ろへ引き戻され、車を引いている牛は押しとどめられる。その乗り手（六三）は髪を剃られ（天は頭の天辺の意味から、髪を剃られる意味に用いる）、鼻を斬られる（劓）。非常に残酷な内容だが、初めはひどい目に遭っても終わりは良くなる。</p>\n<p><span class=\"tag\">程伝</span>陰柔は平時においてさえ自立するに足りない。まして睽離の時に当たってはなおさらである。三は二陽の間にいて、居る所が安らかでない。侵陵されることは知れている。三は正応が上にいるので、進んで上と志を合わせようとするが、四が前に阻み、二が後ろに牽く。車と牛は行く手段である。輿曳とは後ろに牽かれること、牛掣とは前に阻まれることである。後ろにいる者は牽くだけだが、前に当たる者は、進む者が力で犯すところなので、重ねて上（四）に傷つけられる。天とは髪を剃ること、劓とは鼻を斬ることである。三は正応に従おうとして四がこれを阻む。三は陰でも剛位にいて志が上に行こうとするので、力で進んでこれを犯し、それで傷つけられる。天せられまた劓られるのは、重ねて傷つけられることを言う。三は二とも四とも合わない。まして睽の時ならなおさらである。たまたま剛位にいるのは正を守る道で、正応においては睽が極まって合う理がある。初めは二陽に困しめられる、これが初め无し。後には必ず合うことができる、これが終り有り。「掣」は制と手に従う字で、とらえ止める義である。</p>\n<p><span class=\"tag\">象伝について程伝</span>陰柔で三（陽位）にいるのは正ではない。正でなければ安らかでない。また二陽の間にいるので、このような難に遭うのは、位が当たらないことによる。「初め无く終り有る」は、終には必ず上九と合うこと、すなわち剛に遇うことである。不正で合えば久しくして離れないものはない。正道で合えば、終に睽く理はない。だから賢者は理に順って安らかに行い、智者は幾を知って固く守る。</p>\n<p>本田の講説：最後の「賢者は理に順って安行し、智者は幾を知りて固守す」の二句はこの人の創作であろうと思う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>求める相手のもとへ行こうとして前後から邪魔され、ひどい目に遭う。初めは散々でも、正しさを守れば最後は相手と結ばれる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">睽孤。遇元夫、交孚。厲无咎。</span></summary><div class=\"body\"><div class=\"yomi\">睽きて孤なり。元夫に遇う。交（こもごも）孚（まこと）あり。厲（あやう）けれど咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「交孚无咎、志行也。」（交孚ありて咎无きは、志行わるるなり。）</div>\n<p>仲間と背き離れ、孤独である。善き男に会うことがある。信じ合えれば、危ういが最後は咎はない。</p>\n<p><span class=\"tag\">程伝</span>九四は睽の時に当たり、居る所が安らかでなく（陽で陰位）、応がなく（初も陽）、二陰の間にいる。睽き離れて孤独な者である。剛陽の徳で睽離の時に当たり、孤立して与する者がない。必ず同類を求めて合う。だから元夫に遇う。夫は陽の称、元は善である。初九は睽の初めに当たり、四は遂にこれと徳を同じくして睽の悔を亡ぼすことができる。睽に処する至善の者である。だからこれを元夫と目する。善士と言うようなものである。四は中を過ぎて睽が甚だしく、初の善には及ばない。四と初はともに陽で卦の下にいて、相応ずる位にいる。睽の時に当たりそれぞれ応援がなく、自然に同徳で相親しむ。だから会遇する。同徳が相遇えば、必ず至誠で相与すべきである。交孚とはそれぞれに孚誠があることである。上下二陽が至誠で合えば、何の時でも行けないことはなく、何の危うさでも済えないことはない。だから危厲に処しても咎がない。睽離の時に二陰の間にいて、居る所が当たらず、危うくまた咎があるはずだが、元夫に遇って交孚があるので咎がないのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>初と四はともに陽剛の君子である。睽の時に当たり、上下が至誠で交わり、志を合わせ力を共にすれば、その志は行われる。ただ咎がないだけではない。卦の辞はただ「咎无し」と言うが、夫子はさらにこれを明らかにして、志を行い時の睽を済うことができると言う。思うに君子は陽剛の才で至誠をもって助け合えば、何でも済うことができる。ただ君子があればこそ、その志を行うことができるのである。</p>\n<p>本田の講説：受講者が「唯だ君子有らば」の君子は何を指すのか、六四が君子なのかと問うと、本田は、伝に「初と四とは、皆な陽剛の君子なり」とあり、陽であることから強い性格の君子という意味だ、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>周囲と背いて孤立しているが、志を同じくする善き人に出会う。誠をもって互いに信じ合えば、危うくても咎なく、志も遂げられる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">悔亡。厥宗噬膚、往何咎。</span></summary><div class=\"body\"><div class=\"yomi\">悔亡ぶ。厥（そ）の宗、膚（はだえ）を噬（か）む。往くとして何の咎あらん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「厥宗噬膚、往有慶也。」（厥の宗、膚を噬むとは、往きて慶び有るなり。）</div>\n<p>本来後悔があるはずだが、その後悔がなくなる。自分の仲間が自分の皮膚に噛み付く。この場合、噛み付くのは悪いことではなく、しっかとしがみつく意味で、仲間が肌に食い込むほど結束してくれる。こうして進めば何の咎もない。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔で睽の時に当たり尊位にいる。悔があることは知れている。しかし下に九二の剛陽の賢がいて、これと応じ、輔翼する。だから悔が亡ぶことができる。厥の宗とはその党、つまり九二の正応を言う。膚を噬むとは、深く入り込むことである。睽の時に当たり、深く入るのでなければどうして合えよう。五は陰柔の才でも、二が陽剛の道で輔け、深く入り込めば、往って慶びがあり、また何の咎があろう。成王の幼さで周の治を興し、劉禅の昏さで中興の勢いがあったのは、聖賢の輔けに任じたことによる。そして姫公（周公）・孔明は深く入り込んだのである。</p>\n<p>本田の講説：成王は武王の息子で幼くして即位した。劉禅は劉備の息子で至って弱い性格だった。周公は成王を、諸葛孔明は劉禅を輔け、深く噛み付く（結束する）ことで王業や中興を成した。</p>\n<p><span class=\"tag\">象伝について程伝</span>爻辞はただ「厥の宗、膚を噬む」と言い、往って咎がないとした。象伝はさらにその義を推して言う。人君は才が足りなくても、もしよく賢輔を信任し、その道で深く自分に入り込ませれば、大いに為すことがある。これが往いて福慶があることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力は足りないが、信頼できる補佐役がしっかりと結束してくれる。任せて進めば何の咎もなく、喜びがある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">睽孤。見豕負塗、載鬼一車。先張之弧、後說之弧。匪寇婚媾。往遇雨則吉。</span></summary><div class=\"body\"><div class=\"yomi\">睽きて孤なり。豕（いのこ）の塗（どろ）を負うを見る。鬼を載すること一車。先には之が弧（ゆみ）を張り、後には之が弧を説（はず）す。寇（あだ）するに匪ず、婚媾（こんこう）せんとす。往きて雨に遇えば則ち吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「遇雨之吉、羣疑亡也。」（雨に遇うの吉なるは、羣疑亡ぶればなり。）</div>\n<p>この文句も難しい。程伊川の読みに従うと：仲間外れで独りである。見れば豚が背中に泥を背負っている。車一杯に幽霊が載っているのを見る。幽霊を見た者は慌てて、初めは弓に弦を張るが、後にはその弦を外す。相手は仇や敵ではなく、実は自分と婚姻すべき相手であった。さらに進んで雨になれば吉であろう。非常に幻想的な表現である。「塗」は泥のこと。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>上は卦の終わりにいて、睽の極みである。陽剛で上にいるのは剛の極み、離の上にいるのは明を用いることの極みである。睽が極まれば戻って合いがたく、剛が極まれば躁暴で詳らかでなく、明が極まれば過察で疑いが多い。上九には六三の正応があり、実は孤独ではないが、その才性がこのようなので、自ずから睽いて孤独である。人が親党を持ちながら自ら疑い猜（そね）み、みだりに乖離を生じ、骨肉・親党の間にいても常に孤独であるようなものである。</li><li>上と三は正応でも、睽の極みにいて疑わないものがない。三を見ることは、豕のように汚らわしいものが背に泥塗を負っているようで、その憎むべきことの甚だしいものと見る。憎むことが甚だしければ、猜疑してその罪悪を作り上げる。鬼を載せて車一杯にあるのを見るようなものである。鬼はもともと形のないもので、それが車一杯にあるのを見るとは、ないものをあると見なすことで、妄想の極みである。</li><li>物の理は極まれば必ず反る。近い例で明らかにすれば、人が東に行き、東が極まって動けば西に行く。高い所に昇り、高さが極まって動けば下る。すでに極まれば動いて必ず反る。上の睽はすでに極まった。三のいる所は正理である。大いに道を失うことがすでに極まれば、必ず正理に反る。だから上は三に対して、初めは疑い睽くが終には必ず合う。「先には之が弧を張る」とは、初め疑い憎んで射ようとすることである。疑うのは妄想で、妄想がどうしていつまでも続こう。だから終には必ず正に復る。三は実際には悪くない。だから「後には之が弧を説す」。睽が極まって反るので、三とは寇讐ではなく、婚媾しようとするのである。</li><li>「匪寇婚媾」の語は他の卦と同じだが、義は異なる。陰陽が交わって和暢すれば雨となる。上が三に対して、初め疑って睽き、睽が極まれば疑わずに合う。陰陽が合ってますます和すれば雨となる。だから「往きて雨に遇えば則ち吉」という。往とはこれから先という意味である。既に合してますます和すれば吉ということである。</li></ul>\n<p>本田の講説：幽霊というのはここでは汚らわしいもの、悪しきものである。屯の六二にも「匪寇婚媾」の四字があったが、屯の場合は別に邪魔する相手がいて婚姻ができないという意味で、ここの場合とは意味が違う。「往」は実際に動いて行くのではなく、これから先という意味。</p>\n<p><span class=\"tag\">象伝について程伝</span>雨とは陰陽が和することである。初めは睽き、今は合ったので吉である。よく和することができるのは、群疑がことごとく亡んだからである。初め睽いていた時は疑わないものがなかったので「羣疑」という。睽が極まって合えば、疑いはみな亡ぶ。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>猜疑心が極まり、身近な相手まで汚らわしい敵のように見えて孤立している。だがそれは妄想で、疑いが解ければ相手は敵ではなく結ばれるべき相手とわかる。和合すれば吉。</div></div></details><div class=\"pager\"><a href=\"#gua-37\">← 風火家人</a><a href=\"#gua-39\">水山蹇 →</a></div>", "gua-39": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 39 卦　第五十五講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">水山蹇</div><div class=\"yo\">すいざんけん</div><div class=\"tri\">上卦 ☵ 坎　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-39\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-39\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-39\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-39\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-39\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-39\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-39\" data-jump=\"yao\">六爻</a></div><h3 id=\"g39-s0\">卦の名と象</h3>\n<p>「蹇」の字義は足萎えで、足に従う字である。阻むものがあって進めない、行き悩むという意味で、難儀を示す卦である。六二の「王臣蹇蹇」は陸奥宗光の『蹇蹇録』の語源で、二字重ねて「苦労する」という意味になる。</p>\n<p>程伝（序卦伝を引く）：「睽とは乖くなり。乖けば必ず難有り。故に之を受くるに蹇を以てす。蹇とは難なり」。目を背け合う時には必ず行き悩みが伴う。蹇が睽に次ぐゆえんである。蹇は険の義なので、蹇難（難儀）の卦とする。</p>\n<ul class=\"sen\"><li>卦の形は上が坎、下が艮。坎は険しい・落とし穴、艮は止まるという意味である。険しいものが前に立ち塞がり、そこで踏みとどまって進むことができない。</li><li>別の見方をすれば、前（上）に落とし穴（険陥）があり、後ろ（下）には険しい山坂（峻阻）がある。だから行き悩むという意味の卦になる。</li></ul>\n<h3 id=\"g39-s1\">卦辞</h3>\n<div class=\"orig\">蹇、利西南、不利東北。利見大人、貞吉。</div>\n<div class=\"yomi\">蹇は西南に利あり。東北に利あらず。大人を見るに利あり。貞なれば吉。</div>\n<p>この卦が出たら西南の方角を目指すがよい。東北はよくない。大人物に会うがよろしい。正義を持続すれば結果は吉であろう。</p>\n<p>本田の講説：坤の卦辞に「西南に朋を得、東北に朋を失う」とあったように、西南は坤の方角である。ところが蹇の卦には坤の象がない。下半分の艮は東北の卦だが、上半分は坎である。そこで朱子などは、上の坎は坤が変化したものと理解する。必ずしも卦の象にこだわらなくてよいかもしれない。艮は東北・止まるで、「東北に利あらず」は確かに卦の象から言えるので、『易』の作者は機械的に、それなら西南には利がある、と文句をつけたのかもしれない。</p>\n<p><span class=\"tag\">程伝</span>西南は坤の方角で、坤は地、その体は素直で平坦である。東北は艮の方角で、艮は山、その体はどっしりと止まって険しい。難儀の時には、素直に平らかな土地にいるのがよく、険しい所に止まるのはよくない。平易な所にいれば難儀は緩められる（「紓ぶ」は糸の結び目が緩むこと）が、険しい所に止まればますますひどくなる。難儀の時には、聖人賢人と言われるほどの人が出て初めて天下の難儀を済うことができる。だから「大人を見るに利あり」。難儀を済う者は必ず大いに正しい道をもってし、その守りを固くする。だから「貞なれば吉」。貞は「ただしい」だけでなく「正しさを持続する」意味がある。およそ難儀に処する者は、持続的な正しさを守り通すことにある。たとえ難儀が解けなくても正しい徳を失わない。だから吉である。もし難儀に遭って操を守れず邪に陥れば、たとえどうにか難儀を免れても、それは悪徳である。義命を知る者はそうしない。</p>\n<p>本田の講説：「義命」はあまり用例がなく辞書にも出ない。義は正しいの意味だから「正命」の意で、『孟子』に「其の道を尽くして死するは正命なり」とある。受講者が、安岡正篤はこの「義命」という言葉が好きで終戦の詔勅に入れたかったが、内閣で「誰もわからない」とバツにされ、死ぬまで悔やんでいた、と話した。本田は、あまり用例はないが程伊川は使っていたようだ、と答えた。</p>\n<h3 id=\"g39-s2\">彖伝</h3>\n<div class=\"orig\">蹇、難也、險在前也。見險而能止、知矣哉。蹇利西南、往得中也。不利東北、其道窮也。利見大人、往有功也。當位貞吉、以正邦也。蹇之時用大矣哉。</div>\n<p>蹇は難なり。険、前に在るなり。険を見て能く止まる。知なるかな。蹇は西南に利ありとは、往きて中を得るなり。東北に利あらずとは、其の道窮まるなり。大人を見るに利ありとは、往きて功有るなり。位に当りて貞吉なるは、以て邦を正すなり。蹇の時用、大なるかな。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>蹇は難の意味である。ただし、乾が健の意味でありながら、健の字に換えてしまえば天の働きという乾の意味を尽くせないのと同じく、蹇を難の字に換えたのでは意味が足りない。蹇には険阻の意味がある。屯も困も難儀の意味を持つが、意味が違う。屯は始めが難しく、まだ通じることができないこと（植物が芽を出そうとして土を割ろうとする字）。困は力が窮まること。蹇は険阻艱難の意味である。「険、前に在り」とは、坎の険が前にあり、下の艮が止まって進まないことで、だから蹇という。</li><li>「険を見て能く止まる」：卦の象で難儀に処する道を言う。上は険、下は止まる。険を見てよく止まる形である。険を犯して進めば悔や咎がある。だから孔子はよく止まることを誉めて「知なるかな」と言った。難儀の時には、ただよく止まるのがよい。だから六爻のうち五と二を除く他（初・三・四・上）は、みな進む（往く）ことを悪いとし、止まる（来る）ことをよいとする。</li><li>「西南に利あり、往きて中を得る」：蹇の時は平易な所にいるのがよい。西南は坤の方角で順易である。陽が上って五にいて中正の位を得た。上って平易の地を得たので西南に利ありという。五は坎の険の中にいるのに平易と言うのは、この卦はもと坤で、乾の陽が五に入って坎となったからで、上って中を得たことだけを取り、坎（落とし穴）となる意味は取らないのである。程伊川の卦変はすべて乾坤から説明する（乾の五の陽が坤の五に、三の陽が坤の三に入るとこの卦になる）。</li><li>「東北に利あらず、其の道窮まる」：蹇の時に危険の地に止まれば、難儀はますます甚だしい。だから東北に利あらず、その道が窮まる。蹇の極みを言う。</li><li>「大人を見るに利あり、往きて功有り」：難儀の時は聖賢でなければ天下の蹇を済えない。大人が位に当たれば蹇を済う功を成す。天下の蹇を済うのはただ大正の道だけである。孔子はまた卦の爻を取って言う。蹇の諸爻は初を除いてみな正位に当たる（陰が陰位、陽が陽位）。だから貞吉とする。初六は陰で陽位にいるが、陰が一番下にいるのもまた陰の正しいあり方である。このような正道でその国を正せば、蹇を済うことができる。</li><li>「蹇の時用、大なるかな」：蹇の時に処して蹇を済う道、その働きは至って大きい。天下の蹇は平らげやすいものではなく、聖賢でなければできない。時に順って身を処し、険の程度を量って行き、平易の道に従い至正の理による。これが蹇の時用である。この卦は、難儀の時と難儀を済う道の両方を示している。</li></ul>\n<p>本田の講説：受講者が「知なるかな」という賛美はほかにもあるかと問うと、本田は、ほかにあったか思い出せないと答えた。「知」には二つの発音があり、平声（初めから終わりまで同じ高さで発音）だと動詞で「知る」、去声（尻下がり）だと名詞で「知恵」である。古くは「智」の字がなく、一字で発音を変えて両方に使った。『論語』では「仁者」と「知者」をよく対照させる。</p>\n<h3 id=\"g39-s3\">大象</h3>\n<div class=\"orig\">山上有水、蹇。君子以反身脩德。</div>\n<div class=\"yomi\">山上に水有るは蹇なり。君子以て身に反り徳を脩む。</div>\n<p>山の上に水がある。水も山も前進を阻む障害物で、それが重なるのが蹇である。君子はこれを見て、難儀があれば我が身を省み、自分の徳を修める。</p>\n<p><span class=\"tag\">程伝</span>山の険しい上にさらに水がある。坎の水は険陥の象である。上下ともに険なので蹇とする。君子は蹇難の象を見て、身に反り徳を修める。君子は難儀に遭えば必ず反って原因を己に求め、ますます自らを修める。孟子は「行いて得ざる者有らば、皆な反りて諸を己に求む」（離婁篇）と言った。だから蹇難に遭えば必ず自ら省みる、自分に失があってこれを招いたのではないかと。これが身に反ることである。よくない所があれば改め、心に満足できない所があればますます努める。これが自ら徳を修めることである。君子は徳を修めて時を待つだけである。</p>\n<h3 id=\"g39-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>難儀の三つの字。</b> 屯・蹇・困はいずれも難儀の意味を含むが、屯は始めの難しさ、困は力の窮まり、蹇は前に険があって進めない難儀である（彖伝の項を参照）。</li><li><b>止まることの知恵。</b> 蹇では五と二以外の爻はみな「往けば蹇、来れば○○」という形で、進むのを悪いとし、じっとしているのをよいとする。「来る」とはじっとしていることで、往来の意味ではない。受講者が「易はじっとしていろというのがかなりありますね」と言うと、本田は「じっとしておれということをよく言う」と答えた。</li><li><b>明夷との違い。</b> 受講者が明夷とはまた違う感じだと言うと、本田は、難儀ではあるがさほどではなく、難儀の意味はすべての爻に付くが判断は必ずしも悪くない、なんとかして難儀を突き抜けようとする卦である、と答えた。明夷は自分の知恵を隠せという卦だが、蹇にはまだ一所懸命天下の難儀を済おうという意欲がある。明夷のほうが暗く、蹇のほうが明るい。</li><li><b>君臣の剛柔と功業。</b> 九五の程伝は、陰が五（君）、陽が二（臣）にいる卦（蒙・泰など）では強い家来の助けで手柄が多く、陽が五、陰が二にいる卦（屯・否など）では手柄が挙がらないことが多い、と言う。臣が君より才が優れていれば君のできないことを助けられるが、臣が君に及ばなければ賛助するだけで大功は成せない。本田は、ふつうは五が陽なら二は陰がよいとされるが、天下の難儀を済うというケースなので、例外的に二も強い陽であるほうが望ましいという観点だ、と説明した。また、程伊川はここで何か激するところがあるのか、だいぶ厳しいことを言っている、と評した。</li><li><b>徳と才。</b> 受講者が「易は徳を重んじるが、才も重要だと言っているのか」と問うと、本田は、事が成らなくても徳は守るべきだという論法のほうが多いが、ここは天下の難儀を救おうとする時なので、徳だけあって才がなければ駄目だということを強調している、と答えた。</li><li><b>春秋の筆法。</b> 九三の象伝の程伝が『春秋』で魯君の帰国を記すのを引いたことから、本田は『春秋』の話をした。魯の君が外国から帰ると、事件の有無にかかわらず必ず「どこそこより至る」と記録する。外地へ行くこと自体が危険なので、無事の帰国を喜び、先祖の廟に報告するのである。受講者が「春秋の筆法」とは弁証法のようなものかと問うと、本田は違うと言い、非常に厳しい責任追及、動機主義の倫理だと説明した。趙穿が君を殺した時、宰相の趙盾は国境近くにいて一旦隣国に逃げたが、孔子はそれを許さず「趙盾其の君を弑す」と書いた。また下手人の名を書かず「楚人其の君を弑す」と書く場合は、国中の人が君を殺したいと願っていた、殺された君の方が悪いという意味になる。事実に反しても道義的責任を追及して書く書き方である。さらに五経（易・詩・書・礼記・春秋）や春秋三伝（左伝・穀梁伝・公羊伝）、孔子の創作は『春秋』だけと言われること、「邦」の字は漢の高祖劉邦の諱なので漢代には「国」に置き換えられたこと、南宋で金との和議を結んだ秦檜が今も売国奴として銅像に小便をかけられていることなどの問答があった。</li></ul>\n<h3 id=\"g39-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>前に険があって進めない難儀の時。むやみに進まず、じっと踏みとどまって時を待て。それが知恵である。</li><li>平易な方へ向かえ（西南）。険しい所に止まり続けるな（東北）。</li><li>大人物（優れた助け手）に会うのがよく、正しさを持続すれば吉。</li><li>難儀に遭ったら原因を我が身に求め、徳を修めて時を待て。</li><li>卦全体の判断は必ずしも悪くない。難儀が極まれば突き抜けることができる（上六）。</li></ul><h2 class=\"sec\" id=\"g39-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">往蹇、來譽。</span></summary><div class=\"body\"><div class=\"yomi\">往くときは蹇あり。来るときは誉れあり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「往蹇來譽、宜待也。」（往くときは蹇あり、来るときは誉れありとは、宜しく待つべきなり。）</div>\n<p>進もうとすれば難儀に陥る。じっとしていれば誉れがやってくる。「来る」とはじっとしていること。本田は、この爻の判断も決して悪くないと言う。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔で蹇の初めにいる。進めばますます蹇に入る。陰柔で助けもなく進めば蹇むのは知れたことである。「来」は「往」に対する言葉で、上へ進むのを往くといい、進まないのを来るという。止まって進まないのは、幾（吉凶の兆し）を見て時を知る美点がある。だからじっとしていれば誉れがある。</p>\n<p><span class=\"tag\">象伝について程伝</span>蹇の初めに進めばますます蹇む。時がまだ進むべきでないからである。だから幾を見て止まり、行くべき時を待ってから行くべきである。ある人が問うた。「諸爻はみな往くを蹇とし来るを善とする。それでは蹇を出るという意味はないのか」。答え：蹇の中にいて往けば蹇む。蹇が終われば変ずる。だから上六に「碩い」という意味がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>進めば難儀に陥る。動かずに時を待てば誉れがある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">王臣蹇蹇、匪躬之故。</span></summary><div class=\"body\"><div class=\"yomi\">王臣蹇蹇たり。躬の故に匪ず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「王臣蹇蹇、終无尤也。」（王臣蹇蹇たり、終に尤（とが）无きなり。）</div>\n<p>王様の家来が重なる難儀の中で苦労する。その苦労は我が身の利益のためではない。</p>\n<p><span class=\"tag\">程伝</span>二は中正の徳で艮の体にいる。正に止まる者である。五と応じる。中正の人が中正の君に信任されるので、王臣という。上下が徳を同じくしているが、五はまさに大蹇の中にいて、二は蹇難の時に力を尽くす。その艱難は至って甚だしいので「蹇蹇」という。二は中正とはいえ陰柔の才で、容易にその任に堪えられようか。だから蹇蹇なのである。志は君を蹇難の中から救うことにあり、その蹇蹇は自分の身のためではない。たとえ堪えられなくても、その志と義は嘉すべきである。だからその忠藎（「藎」は進んでやまない意味）が身のためでないことを称えた。しかしその才は蹇を済うには足りない。少しでも済うことができれば、聖人はもっと盛んに称えて勧めたであろう。</p>\n<p>本田の講説：爻辞の後に吉とも何とも言わないのは、あまり力がないということである。受講者が陸奥宗光は易を読んだのかと問うと、本田は、読んだでしょう、よくぴったりの題を付けたと思う、と答えた。『蹇蹇録』は日清戦争後の講和で石を投げつけられたりした中で書いた回想録である。</p>\n<p><span class=\"tag\">象伝について程伝</span>蹇の時に艱難に苦しんでも、志は君の難を済うことにある。功は成せなくても、終には過ちも咎もない。聖人はその志と義を取って尤がないと言った。忠藎を勧めるゆえんである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分のためでなく、上のため・公のために苦労を重ねる。功は成らなくても咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">往蹇來反。</span></summary><div class=\"body\"><div class=\"yomi\">往くときは蹇あり。来るときは反る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「往蹇來反、内喜之也。」（往くときは蹇あり、来るときは反るとは、内之を喜ぶなり。）</div>\n<p>前進すれば行き悩む。じっとしていれば安全な場所に帰ることができる。</p>\n<p><span class=\"tag\">程伝</span>九三は剛で正位（陽が奇数位）にいて、下体の上にいる。蹇の時に下にいる初と二はみな柔で、必ず三に寄りかかる。下の者が身を寄せる者である。三は上六と正応だが、上は陰柔で位もなく、援けとするに足りない。だから上って往けば蹇む。「来」は下り来ること、「反」はしかるべき場所に帰ることである。三は下の二陰に喜ばれているので、来るとはその所に帰ることで、やや安泰な地である。</p>\n<p><span class=\"tag\">象伝について程伝</span>「内」とは下にいる二陰である。蹇の時には陰柔は自立できないので、みな九三の陽に付いて喜び愛する。九三は蹇にあってその所を得ていて、蹇に処して下の心を得ているので、身の安全を求めることができる。だから来ることを反るとする。『春秋』で魯君の帰国を言うのと同じである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>無理に上へ進めば行き悩む。今の場所にとどまれば身内が喜び迎えてくれ、安全である。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">往蹇來連。</span></summary><div class=\"body\"><div class=\"yomi\">往くときは蹇あり。来るときは連なる。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「往蹇來連、當位實也。」（往くときは蹇あり、来るときは連なるとは、位に当りて実なればなり。）</div>\n<p>進めば難儀に陥る。じっとしておれば仲間が連帯してくれる。</p>\n<p><span class=\"tag\">程伝</span>往けばますます険（上卦の坎）の深い所に入る。だから往けば蹇む。蹇の時に同じく艱難の中にいる者は、謀らずとも志が同じである。また四は上位にいて、下の者（二・三）とともに位を得た正しさがある。三とはぴったり隣り合って親しく、二と初とは同類（陰）で味方する者である。つまり四は下と志を同じくし、人々が付き従う相手である。だから来ると連なる。じっとしていれば下の者と自然に連合する。衆と合同するのは蹇に処する道を得たものである。</p>\n<p><span class=\"tag\">象伝について程伝</span>四は蹇の時に上位にいて、往かずに来て下と志を同じくする。もとより衆の心を得るに足る。また陰で陰位にいて、その実を得ている。誠実をもって下に与するので連合できる。下の二・三もそれぞれ実を得ており、初は陰で一番下にいるのもまたその実である。艱難をともにする時に、実をもって交わるのだから、合するのは知れたことである。蹇に処するに誠実でなければどうして済えよう。位に当たることを、ふつうは「正」と言うのに「実」と言うのは、上下の交わりは誠実を主とすべきだからで、文字の使い方にはそれぞれふさわしい所がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>一人で進めば難儀が深まる。じっとして誠実に仲間と連帯せよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">大蹇朋來。</span></summary><div class=\"body\"><div class=\"yomi\">大いに蹇むとき朋来る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大蹇朋來、以中節也。」（大いに蹇むとき朋来るは、中の節を以てなり。）</div>\n<p>大きな難儀の時、補佐してくれる友がやって来る。</p>\n<p><span class=\"tag\">程伝</span>五は君位にいて蹇の中にいる。君自身が難儀に陥っているのは天下の大蹇である。また坎の険の中にいるのも大蹇である。この時、六二が下にいて中正をもって応じている。その朋が助けに来るのである。天下の蹇に中正の臣の輔けを得る。その助けは小さくない。ある人が問うた。「朋が来るのに吉と言わないのはなぜか」。答え：まだ蹇を済うに足りないからである。剛陽中正の君がまさに大蹇の中にいる。剛陽中正の臣が助けるのでなければ天下の蹇は済えない。二の中正はもとより助けにはなるが、陰柔の助けで天下の難を済おうとしても、できることではない。昔から聖王が天下の蹇を済うのに、賢聖の臣の助けによらなかった例はない。湯の伊尹、武王の呂尚（太公望）がそれである。中常の君が剛明の臣を得て大難を済った例はある。劉禅の孔明、唐の粛宗の郭子儀、徳宗の李晟がそれである。賢明な君でも臣がいなければ蹇は済えない。およそ陰が五、陽が二にいる卦は多く輔けによって功がある（蒙・泰の類）。陽が五、陰が二にいる卦は功が多くは足りない（屯・否の類）。臣が君より賢ければ君のできないことを輔けられるが、臣が君に及ばなければ賛助するだけで大功は成せない。</p>\n<p>本田の講説：劉禅は劉備の息子で蜀の二代目、むしろ暗愚な君主だったが、諸葛孔明の助けで難儀を免れた。郭子儀は唐の粛宗の時に安禄山の乱を平らげた名将、李晟は晩唐の徳宗の時に朱泚の乱を平らげた人で、徳宗は「天が李晟を生んだのはわしのためではない、国家のためだ」と言ったという。</p>\n<p><span class=\"tag\">象伝について程伝</span>「朋」とは同類である。五には中正の徳があり、二もまた中正である。大蹇の時でも操を失わず、蹇蹇として五を助ける。互いに中正の節をもってするのである。上下が中正でありながら蹇が済われないのは、臣の才が足りないからである。昔から節を守り義を執りながら、才が蹇を済うに足りなかった者は少なくない。漢の李固・王允、晋の周顗・王導の類である。</p>\n<p>本田の講説：李固は後漢末に外戚の乱暴者梁冀を倒そうとして逆に殺された。王允は後漢末に董卓を倒したが李傕・郭汜に殺された。周顗は王敦の乱で殺された。王導は東晋最初の宰相で「公忠」と称された人なので、ここで名を挙げるのはちょっと酷だが、天下を回復するには至らなかったということで挙げたのだろう。</p>\n<p>本田と受講者の問答：受講者が「今年の僕の卦が蹇の九五。よくあたっている」「朋が誰か来ているはずだが、弱い朋なんだ」「行ったらいかん、じっとしていないと」と言い合った。また「上に立つ人が強い時は強い部下が要る」と言う受講者に、本田は、一般原則としては五の君主が陽なら家来の二は陰がよいとされるが、この場合はちょっと違う、と答えた。卦の主は原則として五である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大きな難儀の中、助けてくれる仲間が来る。ただし助けの力はまだ弱く、すぐには抜け出せない。中正の節を守れ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">往蹇來碩、吉。利見大人。</span></summary><div class=\"body\"><div class=\"yomi\">往くときは蹇あり。来るときは碩（おお）いなり。吉。大人を見るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「往蹇來碩、志在内也。利見大人、以從貴也。」（往くときは蹇あり、来るときは碩いなりとは、志、内に在るなり。大人を見るに利ありとは、貴に従うを以てなり。）</div>\n<p>動けば難儀に陥る。じっとしておれば難儀が緩み、ゆったりとなる。結果は吉。偉大な人物に会うのがよい。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔で蹇の極みにいる。極めて険しい所を冒して行けば蹇む。往かずに来て、五に従い三（正応）に求め、剛陽の助けを得るので、ゆったりとなる。蹇の道は縮こまり窮屈だが、碩は大きい、寛裕の意味である。来れば寛大になり、その蹇は紓（の）びる。蹇が極まれば出る道がある。上六は陰柔なので自分で蹇を出ることはできないが、剛陽の助けを得れば蹇を緩めることができる。蹇の極みの時に緩めることができれば吉である。剛陽中正の人でなければ蹇を出ることはできない。「大人を見るに利あり」とは、蹇が極まった時に大徳の人に会えば蹇を済えるということで、大人とは隣り合う五を指す。ある人が問うた。「五では蹇を済う功を言わず、上六で大人を見るに利ありと言うのはなぜか」。答え：五ではまだ険の中にいて剛陽の助けがないので、蹇を済う意味は生じない。上六では蹇が極まり、大徳の人に会えば蹇を済える。爻ごとに意味の取り方は同じでない。屯の初九は志が正しいのに、六二からは寇とされるようなものである。諸爻はみな吉と言わず、上だけ吉と言うのは、諸爻はみな正を得てそれぞれ善い所があるが、まだ蹇を出られないので吉とするに足りず、上だけは蹇の極みにいて寛裕を得たからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>上六は三に応じ五に従う。志が内に向いているのである。蹇が極まって助けがあるので碩いで吉である。六は陰柔で蹇の極みに当たり、剛陽中正の君に密着している。自然とその志は五に従って自ら救われることを求める。だから「大人を見るに利あり」。「貴に従う」と言うのは、大人が五を指すと人が気づかず三を指すと思い込むのを恐れて、身分の高い人と言ったのである。</p>\n<p>本田の講説：蹇の卦は水と山で難儀が重なるが、最後に至ると突き抜けられる。受講者が「上六まで来ないと駄目なんですね」と言うと、本田は、上六まで来ないと駄目で、それまではじっとしていよということ、諸爻にその力はないが天下の難儀を救おうという志はみなあった、と答えた。受講者が「蹇の時はじっとして時を待てば自然に上六の形になる。極まらなきゃいかんのだ」と言い、また正月に蹇が出た時に本田先生がそんなに悪い卦じゃないと言った、と話した。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>難儀が極まり、ようやく緩む時。自分から動かず、優れた人（上の大人物）に従えば、ゆったりと抜け出せて吉。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>今年の卦が蹇の九五</div><div class=\"rb\">受講者の一人が、その年の自分の卦が蹇の九五で「よくあたっている」と言った。他の受講者たちは「朋が来ているはずだが弱い朋だ」「行ったらいかん、じっとしていないと」と話し合った。別の受講者は、正月に蹇が出た時、本田がそんなに悪い卦ではないと言ったと述べている。</div></div><div class=\"pager\"><a href=\"#gua-38\">← 火沢睽</a><a href=\"#gua-40\">雷水解 →</a></div>", "gua-40": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 40 卦　第五十五講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">雷水解</div><div class=\"yo\">らいすいかい</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☵ 坎</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-40\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-40\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-40\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-40\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-40\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-40\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-40\" data-jump=\"yao\">六爻</a></div><h3 id=\"g40-s0\">卦の名と象</h3>\n<p>上が雷、下が水。前の蹇の卦を上下ひっくり返した形である。</p>\n<p>程伝（序卦伝を引く）：「蹇とは難なり。物は以て難に終る可からず。故に之を受くるに解を以てす」。物は最後まで難儀のままで終わる道理はない。難儀が極まれば必ず散ずる。解とは難儀が散ることで、だから蹇の後に解が来る。</p>\n<ul class=\"sen\"><li>卦の形は上が震、下が坎。震は動く、坎は険（危険・落とし穴）である。険の外に動く、つまり危険から出てしまう形で、患難が解散する象である。</li><li>また震は雷、坎は雨である。雷雨が起こるのは、陰陽が交わり感じ合い、和らぎ伸びて緩み散るからである。だから解という。解とは天下の患難が解け散る時である。</li></ul>\n<h3 id=\"g40-s1\">卦辞</h3>\n<div class=\"orig\">解、利西南。无所往、其來復吉。有攸往、夙吉。</div>\n<div class=\"yomi\">解は西南に利あり。往く所无ければ、其れ来り復って吉。往く攸有れば、夙（はや）くして吉。</div>\n<p>この卦が出れば、西南の方角がよろしい。前進する必要がなければ、元の道に立ち返ればよい。まだ何かせねばならぬ仕事がある時は、早くせよ。結果は吉。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>西南は坤の方角で、坤の体は広大で平易である。天下の難儀が初めて解け、人が初めて艱苦を離れる時には、もはや煩わしく厳しい政策で治めてはならない。寛大で簡易な政策で救うのが宜しきを得たもので、そうすれば人心は懐いて安んずる。だから西南に利あり。殷の湯王は夏の桀王の暴虐を除いて寛大に治め、周の武王は殷の紂王を討って殷の政治に反し、どちらも寛易に従った。</li><li>「往く所无し」とは、天下の難儀がすでに解け、もう何もすることがないこと。「往く攸有り」とは、なお解くべき事があること。天下国家は、必ず紀綱・法度が廃れ乱れてから禍患が生じる。聖人が難儀を解いて天下が安平無事になれば、それが往く所なしである。そうなれば、政治のやり方を修復し、紀綱を正し、法度を明らかにし、進んで先代明王の治に戻すべきである。これが「来り復る」で、正理に反ることである。「其」は発語の辞である。</li><li>昔から聖王が難を救い乱を定める時、初めは俄かに何かをする暇はない。安定してから、久しく続き後に受け継ぐべき治を行う。漢以後は、乱が除かれるともう何もせず、時に随って現状を維持するだけで、善い政治を成せなかった。来り復るの義を知らなかったからである。</li><li>「往く攸有れば夙くして吉」とは、なお解くべき事があれば早くすれば吉ということ。解くべきなのにまだ尽くしていないものは、早く去らなければ再び盛んになる。事が再び生じた時、早く処置しなければだんだん大きくなる。だから早くすれば吉である。</li></ul>\n<p>本田の講説：中国人はだいたい古代尊重の念が強く、夏・殷・周三代の世の方が良く、漢から唐までだんだん悪くなるという下降的な歴史観がある。そこでこういうことを言うのである。</p>\n<h3 id=\"g40-s2\">彖伝</h3>\n<div class=\"orig\">解、險以動。動而免乎險、解。解利西南、往得衆也。其來復吉、乃得中也。有攸往夙吉、往有功也。天地解而雷雨作、雷雨作而百果草木皆甲坼。解之時大矣哉。</div>\n<p>解は険にして以て動く。動いて険を免るるは解なり。解は西南に利ありとは、往きて衆を得るなり。其れ来り復って吉とは、乃ち中を得ればなり。往く攸有れば夙くして吉とは、往きて功有るなり。天地解けて雷雨作（おこ）る。雷雨作りて百果草木皆な甲坼（こうたく）す。解の時大なるかな。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>坎は険、震は動である。険にして動く。険でなければ難はなく、動かなければ難を出られない。動いて険の外に出る、これが険難を免れることで、だから解という（「以て」は「而して」と意味が通じる）。</li><li>難儀を解く道は広大平易にある。寛易をもって解をなし遂げれば、衆心が帰するであろう。</li><li>卦辞の「往く所无ければ」を言わないのは、文を省いただけである。乱を救い難を除くのは一時のことで、治道にはならない。必ず難が解けて往く所がなくなるのを待ち、それから先王の治に復する。これが中道を得たことで、宜しきにかなうということである。</li><li>往く所があれば早くすれば吉である。早ければ往って功がある。ぐずぐずしていれば悪はますます増え、害はますます深くなる。</li><li>解に処する道を明らかにした後、天地の解を言って解の時の大きさを示す。天地の気が開け散り、交わり感じ合って和らぎ伸びれば雷雨となる。雷雨が起これば万物はみな生じ発して甲坼する。天地の功は解によって成る。だから「解の時大なるかな」と称えた。王者は天道にのっとって寛宥を行い、恩恵を施し、兆民を養育し、昆虫草木にまで及ぶ。解の時に順い、天地と徳を合わせるのである（乾の文言伝に「大人なる者は天地と其の徳を合わす」）。</li></ul>\n<p>本田の講説：「甲坼」の「甲」の古い形は、丸の中に十を書いたもので、木の実などにひびが入った形。「坼」は裂けること。天地の鬱屈した気が解けて雷雨が起これば、果実も草木も殻がひび割れてぱちんと裂ける。受講者が「甲坼と似たソッタクという言葉はどう書くのか」と問うと、本田は「啐啄同時」と言い、外から親鳥がつつくのと雛が中からつつくのが同時だということだ、と答えた。</p>\n<h3 id=\"g40-s3\">大象</h3>\n<div class=\"orig\">雷雨作、解。君子以赦過宥罪。</div>\n<div class=\"yomi\">雷雨作るは解なり。君子以て過ちを赦し罪を宥（なだ）む。</div>\n<p>雷と雨が起こる形が解である。君子はこれにのっとって、過失は赦し、本当の罪人にも緩やかな刑を言い渡す。「過」と「罪」を使い分けている。</p>\n<p><span class=\"tag\">程伝</span>天地が解散して雷雨となる。だから雷雨が作って解となる。離の大象「明両つにして離を作す」と語順は同じだが意味は違う（本田：離では「作」を「なる」と読み、ここでは「おこる」と読む）。赦は釈放すること、宥は刑を寛めること。過失は赦してよいが、罪悪を赦すのは義ではないので、寛めるだけである。君子は雷雨が起こる解の象を見て、その発育の働きを体すれば恩仁を施し、その解散の働きを体すれば寛釈を行う。</p>\n<h3 id=\"g40-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>難儀が解けた後の政治。</b> 卦辞の程伝は、難儀が解けた後は寛大簡易な政治をせよ、そして無事になったら先王の治に復れ、まだ残る問題は早く片付けよ、と説く。漢以後の政治が善くなかったのは「来り復る」の意味を知らなかったからだという（本田：中国人の下降的歴史観の現れ）。</li><li><b>小人を切り離す。</b> 解の卦では、九二の三狐、九四の拇、六五の小人、上六の隼と、取り除くべき小人・害が繰り返し出てくる。受講者が「解は良い卦だと思ったけど、読み出すと難しいことが書いてあるんですね」と言うと、本田は、出だしは天地の凍った気が解けるというめでたい卦だが、親指を切り離したりと、解の字を至る所で使おうとする、と答えた。</li><li><b>小人の見分け方。</b> 受講者が「小人か君子かはなかなかわからない、主観的なものですね」と言い、別の受講者が「易では陰柔が小人の目安ですね」「正でなく、下にいる」と言い合った。</li><li><b>負乗。</b> 六三の「負いて且つ乗る」は、後世「負乗」という熟語でよく使われ、分不相応の位に就くことをいう中国の諺である。日本では使われない。</li><li><b>慢蔵は盗を誨（おし）う。</b> 六三について程伝は繋辞伝を敷衍し、財をしまうのが疎かなのは盗人に取れと教えるようなもの、女が容姿をなまめかしくするのは淫者に乱暴せよと教えるようなもの、小人が君子の器に乗るのは盗を招いて奪わせるようなもの、すべて自ら招くのだ、と言う。受講者が「宇野先生に習った『慢蔵は盗を誨え、冶容は淫を誨う』、有名な言葉ですね」と言った。</li><li><b>器と時。</b> 上六の程伝は繋辞伝を引き、器（道具・道徳）を身に蔵して時を待って動けば不利はない、器がないか、時を待たずに動けば、小さければ滞り、大きければ失敗する、昔から何かをしたがって成功しない者、転覆する者はみなこれによる、と言う。本田は「道具と時が大切だという」とまとめた。</li></ul>\n<h3 id=\"g40-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>難儀が解ける時。厳しくせず、寛大で簡易な態度で臨め（西南）。</li><li>もうすることがなければ、元の正しい道に立ち返れ。</li><li>まだ片付けるべき問題があれば、ぐずぐずせず早く処理せよ。遅れれば害が深くなる。</li><li>人の過ちは赦し、罪は寛大に扱え。</li><li>身近な小人・悪縁を切り離せば、本当の仲間が来る（九四）。</li><li>分不相応な地位や持ち物は災いを招く（六三）。</li><li>事を成すには、器（力・準備）と時の両方がそろうのを待て（上六）。</li></ul><h2 class=\"sec\" id=\"g40-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">无咎。</span></summary><div class=\"body\"><div class=\"yomi\">咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「剛柔之際、義无咎也。」（剛柔の際（まじわり）、義として咎无きなり。）</div>\n<p>この爻が出たら咎はない。吉凶の判断辞だけで、状況の描写が何もない。</p>\n<p><span class=\"tag\">程伝</span>六は解の初め、患難がすでに解けた時にいる。柔で剛の位（奇数位）にいて、陰で陽（九四）に応じる。柔でありながら剛でもありうるという意味である。患難がすでになく、自らの処し方が剛柔の宜しきを得ている。患難が解けて安寧無事の時、ただ自らの処し方が宜しきを得れば咎はない。解の初めには安静にして休息すべきである。爻辞が少ないのは、その意を示すためである。</p>\n<p>本田の講説：『易経』の本文にはまったく状況の文句がないので、伊川が勝手に付け加えている。</p>\n<p><span class=\"tag\">象伝について程伝</span>初と四は相応じる。剛と柔が交わり接するのであり、宜しきを得ている。難儀がすでに解けて、剛柔宜しく処しているので、義として咎はない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>難儀が解けた直後。咎はない。安静にして休め。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">田獲三狐、得黃矢。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">田して三狐を獲たり。黄矢を得たり。貞にして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九二貞吉、得中道也。」（九二の貞吉なるは、中道を得ればなり。）</div>\n<p>狩りをして三匹の狐を獲物として得る。黄金の矢も得る（狐の肉に黄金の鏃が刺さっていたということ）。貞しくて吉。</p>\n<p><span class=\"tag\">程伝</span>九二は陽剛で中を得た才で、上の六五の君に応じる。時に用いられる者である。天下には小人が常に多い。剛明の君が上にいれば、その明察は悪を照らし、威光は恐れさせ、剛は断罪するに足るので、小人はその私情を用いられない。それでも常に警戒するのは、隙間（間）があって正を害されるのを慮るからである。六五は陰柔で尊位にいて、その明は覆われやすく、威は犯されやすく、決断は果断でなく惑いやすい。小人がひとたび近づけば君の心を移してしまう。まして難が解けて治が始まったばかりで、変わりやすい時である。二は君に用いられるはずの者なので、必ず小人を除き去り、君の心を正して剛中の道を行うべきである。「田」は害を去ること、「狐」は邪媚の獣、「三狐」は卦の三陰（初・三・上。五は君なので除く）で、その時の小人である。「獲」はその心を変えさせ、あるいは除去すること。そうすれば中直の道を得て貞正で吉である。黄は中の色（五行で中央は黄）、矢は直なもの。黄矢とは中直のことである。群邪が去らず君の心に入り込めば、中直の道は行われない。桓彦範・敬暉が武三思を除けなかったのがこれである。</p>\n<p>本田の講説：則天武后は唐の高宗の后で、どうやら夫を殺したらしく、息子の中宗を立てたが、やめさせて自分が天子になった。中国の歴史で女性がそのまま天子の位に就いたのはこの人だけである（漢の呂后は実権を握ったが名義は息子にしていた）。武三思はその身内の悪人で、御史の桓彦範と敬暉が摘発して処罰を求めたが、則天武后の親戚なので逆に二人が殺されてしまった。受講者が「其の間有り」の「間」とは何かと問うと、本田は隙間の意味で、「脇が甘い」ということだ、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>貞吉というのは中道を得ているからである。邪悪を除去し、中直の道を行わせれば、正しくて吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>身辺の悪しき者・害を取り除けば、正しい道が得られて吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">負且乘、致寇至。貞吝。</span></summary><div class=\"body\"><div class=\"yomi\">負いて且つ乗る。寇の至るを致す。貞なれども吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「負且乘、亦可醜也。自我致戎、又誰咎也。」（負いて且つ乗る、亦た醜ず可きなり。我より戎（じゅう）を致す、又た誰をか咎めん。）</div>\n<p>荷物を背負うような卑しい身分で馬車に乗る。つまり成り上がり者で、強盗に襲われる。やろうとしていることは正しくても、恥ずべき結果になる。</p>\n<p><span class=\"tag\">程伝</span>六三は陰柔で下体の上にいる。その位にいるべきではない。小人が下にいるべきなのに、荷物を背負う身で車に乗るようなもので、その所ではない。必ず寇（強盗）が奪いに来る。たとえ為すことが正しくても、やはり卑しく恥ずべきである。小人が盛んな位を盗めば、努めて正しいことをしても、気質はもともと卑しく、高い位にいるべき者ではないので、恥ずべき結果になる。ある人が問うた。「もし大いに正しければどうか」。答え：大いに正しいことは陰柔にできることではない。もしできれば、それは化して君子となったのである。難が解けた時に小人が位を盗んでいれば、また寇を招く。</p>\n<p><span class=\"tag\">象伝について程伝</span>荷物を負う人がしかも車に乗るのは、恥ずべきことである。その位にいるべきでなく、徳がその器にかなわなければ、寇が来るのは自分で招いたもので、誰を咎められよう。孔子は繋辞伝で寇を招く道を明らかにして「易を作る者は其れ盗を知れるか」と言った。盗とは隙に乗じて来るもので、隙がなければ犯せない。負うのは小人の事、乗る車は君子の器である。小人が君子の器に乗っても安んじていられないので、盗が隙に乗じて奪う。小人が君子の位にいても堪えられないので、驕り高ぶって上を侮り下を侵す。盗はその過悪に乗じてこれを伐つ。伐つとはその罪を言い立てることである。財をしまうのが疎かなのは盗に取れと教えるようなもの、容姿をなまめかしくするのは淫者に乱暴を教えるようなもの、小人が君子の器に乗るのは盗を招いて奪わせるようなもの。みな自ら招くのである。</p>\n<p>本田の講説：「戎」は兵・軍隊の意味もあるが、ここでは強盗の意味で、「寇」を言い換えたもの。ここの程伝は繋辞伝の文章をパラフレーズして解釈している。「慢仮」は『書経』大禹謨にある言葉。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>分不相応な地位や持ち物は、自ら災いを招く。正しいことをしていても恥をかく。身の程をわきまえよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">解而拇。朋至斯孚。</span></summary><div class=\"body\"><div class=\"yomi\">而（なんじ）の拇（おやゆび）を解く。朋至って斯に孚あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「解而拇、未當位也。」（而の拇を解くとは、未だ位に当らざるなり。）</div>\n<p>お前の親指を切り離せ。そうすれば本当の友がやって来て、信じ合えるであろう。解の卦なので、残酷なことだが、親指を切り落とせということになる。</p>\n<p><span class=\"tag\">程伝</span>九四は陽剛の才で上位にいて、六五の君を承ける大臣である。しかし下で初六の陰と応じている。拇は下にあって微かなもので、初を言う。上位にいて小人に親しめば、賢人正士は遠ざかる。小人を斥け去れば君子の仲間が進んで来て、誠をもって合する。四が初六の陰柔を解き去れば、陽剛の君子の朋が来て誠が合う。小人を解き去らなければ自分の誠がまだ至らず、どうして人の孚（信）を得られよう。初六はその応なので、これを遠ざけることを「解く」という。</p>\n<p><span class=\"tag\">象伝について程伝</span>四は陽剛だが陰位にいて、正しさにおいて足りない疑いがある。もしまた小人に親しめば、正を失うのは必然である。だから必ずその拇を解いてこそ君子を来させられる、と戒める。その位が当たっていないからである。「解く」とは本来合っているものを離すことである。必ず拇を解いてこそ朋が信じてくれる。君子の交わりに小人が入り込むのは、君子に与する誠がまだ至らないからである。本田によれば、親指とは初、本当の君子（朋）とは五を指す。</p>\n<p>本田と受講者の問答：受講者が「小人の陰柔な奴と付き合っちゃいかんということですね」「正でないもの同士はあまり良い関係じゃない」と言った。「拇はいつでも初を指すのか」という問いに、本田は初とは限らない、と答えた。「親指を切り離せとは、それほど小人を切り離すのが難しいということか。残酷ですね」と言われ、本田は、残酷なたとえで、前にやった刑罰を示す噬嗑の卦でも最初は足の指を潰し、最後は鼻を潰した、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>身近にいる好ましくない相手・悪縁を思い切って切り離せ。そうすれば本当に信頼できる仲間が来る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">君子維有解、吉。有孚于小人。</span></summary><div class=\"body\"><div class=\"yomi\">君子維（こ）れ解くこと有るときは吉なり。小人に孚すこと有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「君子有解、小人退也。」（君子解くこと有るは、小人退くなり。）</div>\n<p>人君が天下を解放する。結果は吉。天下の難儀を解放し得たかどうかは、小人が去ったことによって証明される。</p>\n<p><span class=\"tag\">程伝</span>六五は尊位にいて解の主である。人君の解である。君子という言葉で人君も通じて言う。君子が親しみ近づける者は必ず君子であり、解き去る者は必ず小人である。だから君子が解くことがあれば吉。小人が去れば君子が進む。これより大きな吉はない。「孚すこと有り」とは、世に言う「験（しるし）を見る」ことである。小人によって験すことができる。小人の党が去れば、君子がよく解いたのである。小人が去れば君子は自ずから進み、正道は自ずから行われ、天下は治めるまでもない（本田：「治むるに足らず」は、治めようとしなくても自然に治まるという意味）。</p>\n<p><span class=\"tag\">象伝について程伝</span>君子の解くとは、小人を退去させることである。小人が去れば君子の道が行われる。だから吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上に立つ者が難儀を解き放つ時。周囲から小人が退いたかどうかが成功のしるし。小人を去らせれば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">公用射隼于高墉之上。獲之无不利。</span></summary><div class=\"body\"><div class=\"yomi\">公用（もっ）て隼を高墉（こうよう）の上に射る。之を獲て利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「公用射隼、以解悖也。」（公用て隼を射るは、以て悖を解くなり。）</div>\n<p>殿様がハヤブサを高い垣根の上で射落とした。ハヤブサを獲て万事うまくいく。</p>\n<p><span class=\"tag\">程伝</span>上六は尊く高い地だが君の位ではないので、公という。解の終わりについて言っただけである（本田：上が一般に公であるわけではない）。隼は鷙害（人に害をなす猛禽）で、害をなす小人にかたどる。墉は垣根で、内外の境である。害がもし内にあれば、まだ解けていない時である。垣の外に出ればもう害はなく、何も解く必要はない。だから垣の上にいるというのは、内からは離れたがまだ去っていないことを示す。「高」というのは防ぎが厳しいのに、まだ去っていないことを示す。上は解の極みで、解が極まった時にただ一つ解けないものがある。これは害のなかで最も堅く強いものである。上は解の極みにいて、解の道はすでに至り、器はすでに成っている。だから射て獲ることができる。これを獲れば天下の患いは解けて尽き、何の不利もない。孔子は繋辞伝でその義を述べて言う。「隼は禽なり。弓矢は器なり。之を射る者は人なり。君子は器を身に蔵し、時を待ちて動く。何の不利か之有らん。動いて括（くく）られず、是を以て出でて獲る有り。器を成して動く者を語るなり」。害をなすものが上にいても、器がないか、時を待たずに発すれば、どうして獲られよう。解く道は器であり、解くべき事と解く道とが至って合うのが時である。こうして動くので括結（妨げ）がなく、発して当たらないことはない。聖人はここで器を蔵し時を待つ義を明らかにした。一身のことから天下の事に至るまで、器がないか、時を見ずに動けば、小さければ滞り、大きければ失敗する。昔から事を為すのを好んで成功せず、あるいは顛覆した者は、みなこれによる。</p>\n<p><span class=\"tag\">象伝について程伝</span>解の終わりに至ってまだ解けないものは、乱の大なるものである。これを射るのは解くためで、解ければ天下は平らかになる（本田：「悖」は乱、上に背くこと）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>残った最後の大きな障害を取り除く時。力（器）が備わり時が熟していれば、一挙に射止めて万事うまくいく。</div></div></details><div class=\"pager\"><a href=\"#gua-39\">← 水山蹇</a><a href=\"#gua-41\">山沢損 →</a></div>", "gua-41": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 41 卦　第五十六講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山沢損</div><div class=\"yo\">さんたくそん</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-41\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-41\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-41\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-41\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-41\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-41\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-41\" data-jump=\"yao\">六爻</a></div><h3 id=\"g41-s0\">卦の名と象</h3>\n<p>卦の名は「損」、損をするということで、大変悪い卦のようだが、孔子の作った象伝では「欲をへらす」という割によい意味に持って行こうとする。兌には喜ぶ、艮には止まるという属性がある。</p>\n<p>程伝（序卦伝を引く）：「解とは緩むなり。緩むれば必ず失う所有り。故に之を受くるに損を以てす」。ほしいままに緩めば必ず何かを失う。失うのは損であり、だから損が解に次ぐ。</p>\n<ul class=\"sen\"><li>卦の形は上が艮（山）、下が兌（沢）。山の体は高く、沢の体は深い。下が深ければ深いほど上はますます高くなる。下を損して上を益す義である。</li><li>沢が山の下にあると、その水気が上に通じて草木百物を潤す。これも下を損して上を益すことである。</li><li>下の兌は説（よろこ）ぶで、三爻とも上に応じている（初と四、二と五、三と上が陰陽で応じる）。下が説んで上に奉ずる形で、これも下を損して上を益す義である。</li><li>卦変で言えば、下の兌は（乾の）六三が変じたもの、上の艮は（坤の）上九が変じたものである。三はもと剛で柔となり、上はもと柔で剛となった。これも下を損し上を益す義である。</li><li>上を損して下を益すのが益、下から取って上に益すのが損である。人の上にいる者が恩沢を施して下に及ぼせば益であり、下から取って自分を厚くすれば損である。土を積み重ねるのにたとえれば、上を削って基本を厚く培えば上下安固で、これが益である。下を取って上の高さを増せば危うく崩れる。これが損である。</li></ul>\n<h3 id=\"g41-s1\">卦辞</h3>\n<div class=\"orig\">損、有孚元吉、无咎、可貞、利有攸往。曷之用。二簋可用享。</div>\n<div class=\"yomi\">損は、孚有れば元吉にして咎无し。貞にす可し。往く攸有るに利あり。曷（なに）を之れ用いん。二簋（にき）用て享す可し。</div>\n<p>この卦が出たら、真心があるならば大いに吉で咎はない。常の道を守るがよい。前進して利益がある。お祭りに何を用いるべきか。二枚の竹の皿（粗末なお供え）でも神様は受け入れてくれよう。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「損」とは減損である。およそ過ちを減らし抑えて義理につくのは、みな損の道である。損の道には必ず孚誠がなければならない。至誠で理に順うことである。損して理に順えば大善で吉である。減らし方に過ちがなければ、固く常々行うべきで、往って利がある。人の損し方は、過ぎたり及ばなかったり、常であったり常でなかったりするが、みな正理に合わず、孚有りとは言えない。孚がなければ吉はなく咎がある。常に守るべき道でなければ行ってはならない。（本田：ここではすでに損を世俗の損得と区別し、倫理的な意味に用いている。）</li><li>「損」とは過ぎたるを損して中につき、浮ついた末を損して本実につくことである。聖人は「礼は其の奢らんよりは寧ろ倹なれ」（『論語』八佾篇）を礼の本とした。だから損においてその義を明らかにし、祭祀で言ったのである。祭祀の礼は飾りが最も多いが、誠敬を本とする。儀を多くし物を備えるのは、誠敬の心を養い飾るためである（「将」には率いる以外に贈る・養うの意味がある）。飾りが誠を過ぎれば偽りとなる。飾りを損するのは誠を存するためである。だから「曷を之れ用いん。二簋用て享す可し」という。二簋の倹約なお供えでも祭ることができる。誠にあるだけで、誠を本とするのである。</li><li>天下の害は、みな末が本に勝つことから生じる。高い屋根や彫刻をした壁（峻宇雕牆）は宮室に、酒池肉林は飲食に、淫酷残忍な拷問は刑罰に、兵を窮め武を汚すこと（窮兵黷武）は征討に本づく。人欲が過ぎたものはみな奉養に本づく。その流れが遠くなれば害となる。先王がその本を制したのは天理であり、後人が末に流れたのは人欲である。損の義は、人欲を損して天理に復ることにほかならない。</li></ul>\n<p>本田の講説：易の卦辞を書いたのは文王で、孔子より昔の人だから、聖人を孔子とするとここは時代錯誤になる。孔子の「寧ろ倹なれ」は易の教えを受け継いでいると見てよい。「享」は神々がお供えを受け入れてくれる意味で、「亨」と大して変わらない。天理と人欲を対立させるのは宋代の特徴で、『論語』の「克己復礼」も、古い注は「己を克（よ）くし礼に復る」と読むが、宋学では「己に克ち礼に復る」と読み、己とは人欲、礼とは天理とする。非常に禁欲的な解釈で、ここらあたりは程伊川、ひいては朱子の道学の厳しい禁欲主義的倫理である。受講者の「宮室に本づく」とは何かという問いに、本田は、雨露をしのぐに十分な宮室が本で、それが末流になると無駄に高い屋根や彫刻をした土塀になる、宮室は「飲食」「刑罰」と同じ並びで豪華なものではない、と答えた。</p>\n<h3 id=\"g41-s2\">彖伝</h3>\n<div class=\"orig\">損、損下益上、其道上行。損而有孚、元吉、无咎、可貞、利有攸往。曷之用。二簋可用享。二簋應有時、損剛益柔有時。損益盈虚、與時偕行。</div>\n<div class=\"yomi\">損は下を損して上を益す。其の道上り行く。損して孚有れば、元吉にして咎无し、貞にす可し、往く攸有るに利あり。曷を之れ用いん。二簋用て享す可し。二簋応に時有るべし。剛を損し柔に益すも時有り。損益盈虚、時と偕に行う。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>損が損であるゆえんは、下から損して上に益すからである。下から取って上に益すので「其の道上り行く」という。上を損して下に益せば益であり、下を損して上に益せば損である。土台を損して高くする者を、どうして益と言えようか。（本田：受講者の問いに答えて、「其の道上り行く」はここでは悪い意味である。）</li><li>損して至誠をもってすれば、元吉・咎无し・貞にす可し・往く攸有るに利ありの四つがある。損の道の善を尽くしたものである。</li><li>孔子は特に「曷を之れ用いん。二簋用て享す可し」を解釈した。卦辞は簡潔直截で、浮ついた飾りを損し去るべきだとして、二簋で祭ることができると言った。本を厚くし末を損するという意味である。孔子は後の人がよくわからず、飾りはすべて取り去るべきだと思うのを恐れて、詳しく言った。本があれば必ず末があり、実があれば必ず文（飾り）がある。天下の万事そうでないものはない。本がなければ立たず、文がなければ行われない。父子は恩を主とするが必ず厳しさと順う姿があり、君臣は敬を主とするが必ず承り迎える儀礼がある。礼譲は内にあっても威儀があってこそ行われる。尊卑の序があっても物（衣服の彩りなど）がなければ区別がない。文と実はあいまって行われるもので、どちらも欠けてはならない。文が勝ち末が流れて本を遠ざかり実を失うに及んで、初めて損すべき時となる。そこで孔子は「二簋応に時有るべし」と言葉を足した。用いるべきでない時に用いるのはいけない。飾りが過ぎていないのに損したり、損し方が過ぎたりするのはよくない。剛を損し柔に益すのも時がある。剛は過ぎたもの、柔は足りないものである。損益はみな過ぎたものを損し足りないものを益すことで、必ず時に順って行う。その時でないのに損益するのは非である。</li><li>損し益し、盈たし虚しくするのは、ただ時に随うだけである。過ぎたものは損し、足りないものは益し、欠けたものは満たし、満ちたものは虚しくする。時とともに行うのである。</li></ul>\n<p>本田の講説：『左伝』襄公二十五年に「言の文なき、行われて遠からず」（飾りのない言葉は時間的にも空間的にも遠くまで及ばない）とある。日本人の感覚では、真心さえあれば言葉の飾りなどなくてもよいところがあるが、それは「言わずとも通じ合う」狭い村落共同体で生活していたためだろう。中国人が礼を重んずるのは、まったく別のサークルの人間との交際があったからで、言葉に飾りがなければいくら誠意があっても通じないと考える。受講者が「バランスを取るということか」と問うと、本田は、そういうことで、しかもしかるべき時を見計らって行動せよと言っている、孔子は二度「時有り」と言っている、と答えた。</p>\n<h3 id=\"g41-s3\">大象</h3>\n<div class=\"orig\">山下有澤、損。君子以懲忿窒欲。</div>\n<div class=\"yomi\">山の下に沢有るは損なり。君子以て忿（いかり）を懲らし欲を窒（ふさ）ぐ。</div>\n<p>山の下の沢が自分の湿気を減らして山を潤し、自分の下を深く掘って山の高さを増してやる。どちらも下を損すること、己を減らす行為である。君子はこれにのっとって、自分の憤りを戒め、欲望を塞ぐ。</p>\n<p><span class=\"tag\">程伝</span>山の下に沢があり、気が上に通じて潤すこと、下を深くして高きを増すこと、どちらも下を損する象である。君子はこの損の象を見て、自分から損する。己を修める道において損すべきものは、ただ忿と欲とだけである。だから忿りを戒め懲らし、意欲を塞ぐのである。</p>\n<p>本田の講説：人欲を減らして天理にかえれというのは易の原文にはない発想で、孔子の象伝で初めて「忿を懲らし欲を窒ぐ」という言葉が出てくる。</p>\n<h3 id=\"g41-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>誠と無心。</b> 「誠」の字は程伊川が非常に好んで使った。伊川が涪州に左遷された時、揚子江を船で上る途中で大風が吹いて船がひどく揺れ、皆真っ青になったが、伊川ともう一人乗り合わせた知らない老人だけが泰然としていた。岸に着くと老人が「どういう気持ちでおりましたか」と聞くので、伊川が「ただ誠の心でおった」と答えると、老人は「誠の心は結構でしょう。しかし無心には及びません」と言い、伊川はがっくりしたという（『宋元学案』）。</li><li><b>君に阿る者への苦言。</b> 九二の程伝の「世の愚者、邪心無しと雖も、唯だ力を尽くして上に順うことを知って忠と為す者有り」について、本田は、程伊川はずけずけと君主に物を言い敢然と諫める人で、当時世に時めく大臣はお上の言うことをへいへいと聞くばかりだった、それを苦々しく思っていたのがこういう一句になって出てくるのだろう、と言う。</li><li><b>中は正より重し。</b> 九二の象伝の程伝は「大率中は正より重し。中なれば正し。正は必ずしも中ならず」と言う。本田によれば、これは程伊川独特の主張で、他の人はあまりこういうことを言わない。</li><li><b>一致の哲学。</b> 六三の「三人行けば一人を損す」を、程伊川は陰陽の対待が生生の本であり、三になれば一つ余って損すべきだという独自の哲学で解釈した（六三の項参照）。受講者が「老子の『道、一を生じ、一、二を生じ、二、三を生ず』と違いますね」と言うと、本田は、これは逆で、二が一にならなければいかん、陰と陽が必ず引き合って合体しなければいけないという考えだ、と答えた。</li><li><b>過ぎたると及ばざると。</b> 初九の程伝の「過ぎたると及ばざるとは皆な不可なり」について、受講者が徳川家康の遺訓では及ばざるがやり過ぎより良いと言っているが、と問い、また大過・小過の卦のように大きく過ぎないと事は大きくならないのでは、と問うた。本田は、大きく過ぎるべき時もあるというのが大過の卦の意味で、その時々の用（時用）だ、と答えた。</li><li><b>一本だけの爻が主。</b> 受講者の問いに、本田は、一本だけ陰、一本だけ陽の卦では、その一本の爻が卦の中心になる、と説明した。姤（下一本だけ陰）は陰気が下から侵食していく形で、あまりよくない卦。陰気が上がっていくと最後は一本だけ陽が残る剝になり、これが一番悪い卦。剝の次は一旦坤になり、坤はこれで良い卦である。夬は陽気が上ってきて君子が小人を駆逐する形で、押し切れば一番めでたい乾になる。姤の逆は復、一陽来復である。</li><li><b>損から益へ。</b> 六四までは「損」の字ばかり出てくるが、六五から「或は之に益す」となり、損が終わって益に変化する。損・益は古くからある言葉で、文字どおり損得の損だが、孔子の解説では「欲望を減らす」という倫理的な意味を加えている。</li><li><b>なぜ六と九か。</b> 受講者の問いに、本田は、七と九がどちらも陽、六と八がどちらも陰だが、筮竹の操作で九と六が変爻になるので、変ずべき爻で判断を立てるために六と九を用いる、と説明した。</li></ul>\n<h3 id=\"g41-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>減らす時。真心をもって減らせば大いに吉で咎はない。</li><li>飾りや形式より真心が大事。質素なお供えでも誠があれば通じる。ただし飾りを全部捨てよというのではなく、時を見計らえ。</li><li>自分の怒りを戒め、欲を減らせ。</li><li>下を削って上を太らせるやり方は、結局は崩れる。</li><li>減らすことにも増やすことにも、しかるべき時がある。</li></ul><h2 class=\"sec\" id=\"g41-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">已事遄往、无咎。酌損之。</span></summary><div class=\"body\"><div class=\"yomi\">事を已（や）めて遄（すみや）かに往く。咎无し。酌みて之を損す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「已事遄往、尚合志也。」（事を已めて遄かに往くは、尚（かみ）と志を合するなり。）</div>\n<p>事業が終われば速やかに立ち去り、功績に胡坐をかかない。こうすればこそ咎がない。よろしきを斟酌して、己を減らすべきである。</p>\n<p><span class=\"tag\">程伝</span>損の義は、剛を損して柔に益し、下を損して上に益すことである。初は陽剛で四に応じる。四は陰柔で上位にいて、初の益に頼る者である。下が上を益す時は、己を損して自らの功としてはならない。上を益すことは、事が済めば速やかに去り、その功に居座らなければ咎はない。成功の美名を享楽すれば、己を損して上に益すことにはならない。下たる者の道においてそれは咎である。四は陰柔で初に頼り切っていて、初の言うことに聴き従う。初は宜しきを酌んで己を損してこれに益すべきである。過ぎるのも及ばないのもどちらもいけない。</p>\n<p><span class=\"tag\">象伝について程伝</span>尚は上である。時に尊び用いられるのを尚という。初の願うのは上と志を合わせることである。四は初に頼り、初は四に益す。上と志を合わせるのである。</p>\n<p>本田と受講者の問答：受講者が「酌む」は斟酌の意味かと問うと、本田は、斟酌のこと、斟酌は漢語だ、と答えた。「事を已めて」は事が成ったらということか、という問いに、事が成れば功績に胡坐をかかずに速く立ち去れということだ、と答えた。「その功に居らず」は老子みたいだという受講者に、本田は「老子です」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人のために尽くし、事が済んだら速やかに退け。功を誇れば咎。尽くし方は過不足なく加減せよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">利貞。征凶。弗損益之。</span></summary><div class=\"body\"><div class=\"yomi\">貞しきに利あり。征けば凶。損せずして之を益す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九二利貞、中以爲志也。」（九二貞しきに利あるは、中以て志と為せばなり。）</div>\n<p>正しさを固守せよ。前進すれば悪い。自分の強さを減らさないことが、かえって相手を利することになる。</p>\n<p><span class=\"tag\">程伝</span>二は剛中で、剛を損すべき時に当たる。柔（陰位）にいて説（兌）の体にあり、上の六五の陰柔の君に応じる。柔説（相手を喜ばす態度）で上に応じれば、剛中の徳を失う。だから利するところは貞正にあると戒める。征は行くことで、中を離れれば貞正を失って凶、中を守ればそれが貞である。「損せずして之を益す」とは、自らの剛貞を損さなければ、上を益すことができる、それがすなわち益すことである。もし剛貞を失って説（へつらい）を用いれば、かえって上を損するだけで、己を損して上を益すことにはならない。世の愚者には、邪心はないが、ただ力を尽くして上に順うことを忠と心得ている者がいる。損せずして益すの義を知らないからである。</p>\n<p>本田の講説：「損せずして之を益す」が非常に難しい。程伊川の解釈は上のとおりで、程伊川自身の苦々しい思いが出ている（「程伝と本田の講説」参照）。</p>\n<p><span class=\"tag\">象伝について程伝</span>二にいるのは正ではない（陽が陰位）。説（兌）にいるのも剛ではない。しかし中を得ているのが善い点である。中の徳を守れば何の不善もない。中にして正しくない者、中にして過ちのある者があろうか。「利貞」とは中を志とすることで、志が中にあれば自ずから正しい。おおむね中は正より重い。中であれば正しいが、正は必ずしも中ではない。中を守れば上を益すことになる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>相手に迎合して自分の筋を曲げるな。進んで出しゃばれば凶。自分の正しさ・強さを保つことが、かえって相手のためになる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">三人行則損一人、一人行則得其友。</span></summary><div class=\"body\"><div class=\"yomi\">三人行けば則ち一人を損す。一人行けば則ち其の友を得。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「一人行、三則疑也。」（一人行くは、三なれば則ち疑わるればなり。）</div>\n<p>三人で旅をすれば一人は除け者になる（だいたいしょっちゅう話をするのは二人で、一人は仲間外れになる）。逆に一人で旅をすれば道連れができる。本田は、易の本文で非常に古い文句だが大変おもしろい、と言う。</p>\n<p><span class=\"tag\">程伝</span>「損」は余りあるものを減らすこと、「益」は足りないものに益すことである。「三人」とは下の三陽と上の三陰を言う（本田：この卦は地天泰から来たということで、泰の三と上が入れ替わると損になる）。三陽が同行すれば九三を損して上に益し、三陰が同行すれば上六を損して三とする。三人行けば一人を損すのである。上の陰を陽に易えたのを損というのは、ただその陰を減らすことを言うだけである。上と三はもともと応じる位だが、二爻の昇降によって、卦の爻がみな二つずつ相与するようになった。初・二の二陽、四・五の二陰は徳を同じくして親しみ、三と上は応じる。みな二つずつ相与するのは、その志がみな友を得ようとするからである。三は四と隣り合うが、体（上卦・下卦）が異なり、上に応じているので、同行する者ではない。三人なら一人を損し、一人ならその友を得る。天下は一と二（奇と偶、陽と陰）が相対するのが生生の本であり、三になれば余って損すべきである。これが損益の大義である。孔子はまた繋辞伝でその義を尽くして言う。「天地絪縕（いんうん）として万物化醇す。男女精を構せて万物化生す。易に曰く、三人行けば一人を損す、一人行けば其の友を得と。一を致すを言うなり」。絪縕とは交わりが密なさまで、天地の気が密に交われば万物が化醇する。醇とは醲厚、精一のようなものである。男女の精気が交われば万物を化生する。ただ精醇専一であるからよく生じるのである。一陰一陽を、どうして二にできよう。だから三なら損すべきで、専ら一に致ることを言う。天地の間で損益すべきもので、明らかでかつ大なるものはこれ以上のものはない。</p>\n<p>本田の講説：易の本文は諺のような文句だが、程伊川は独特の哲学を出している。「致一」は二つのものが一に致ること、一致と同じである。「醇」は酒が醸されて味が濃くなること、「精」はスピリットで、アルコール分が純粋であること。</p>\n<p><span class=\"tag\">象伝について程伝</span>一人行けばもう一人を得て友となる。もし三人行けば誰に与するかを疑う。理として一人を損し去るべきで、余ったものを損するのである。</p>\n<p>本田と受講者の問答：受講者が「三陽から一人欠いても二陽が残り、組むのは陰と陽だから、どうなのか」と問うと、本田は、伊川のここの文章は陰陽の対峙だけを言っているのではなく、初と二は陽同士、四と五は陰同士で徳を同じくして親しみ（男同士・女同士の友情）、三と上は陰陽で応じる（男女の引き合い）という。卦の形から言うとそう言わざるをえず、「二人ならいいが三人だとはみ出す」ということだけで、ここはちょっと苦しい、と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>三人では一人がはみ出す。関係は一対一で結べ。一人で進めば相手が得られる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">損其疾。使遄有喜、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の疾を損す。遄（すみや）かならしむれば喜び有りて咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「損其疾、亦可喜也。」（其の疾を損す、亦た喜ぶ可きなり。）</div>\n<p>その病気を減らす。処置を早くすれば喜びがある（病気が治る）。咎はない。「遄」はあまり使われない字で、音はセン。</p>\n<p><span class=\"tag\">程伝</span>四は陰柔で上にいて、初の剛陽と応じる。損の時に剛に応じ、自らの柔を損して陽に従う、不善を損して善に従うのである（陰は不善、陽は善）。初が四に益すのは、その柔を損して剛を益すことで、その不善を損するのである。だから「其の疾を損す」という。疾とは疾病、不善のことである。疾を損するには、速やかにすれば喜びがあって咎はない。人が過ちを損するには、速やかでないことだけを心配すべきで、速やかなら深い過ちに至らないので喜ぶべきである。</p>\n<p><span class=\"tag\">象伝について程伝</span>その疾を損するのは、もとより喜ぶべきことである。「亦た」は発語の辞で意味はない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>悪いところ・欠点は早く減らせ。手当てが早ければ喜びがあり、咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">或益之、十朋之。龜弗克違。元吉。</span></summary><div class=\"body\"><div class=\"yomi\">或は之に益す。之を十朋にす。亀も違う克わず。元吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六五元吉、自上祐也。」（六五の元吉なるは、上より祐くるなり。）</div>\n<p>時として自分を減らして相手を益してやれば、十人の友ができるであろう。亀の甲羅で占っても間違いはない。結果は大吉。朱子の注では「十朋の亀」と続けるが、程伊川は「之を十朋にす」と読む。</p>\n<p><span class=\"tag\">程伝</span>六五は損の時に中順（中庸で素直。上卦はもとの泰の坤から来ている）で尊位にいて、その中を虚しくして九二の剛陽に応じる。人君が中を虚しくし、自らを損して下の賢に順うのである。このようであれば、天下の誰が自らを損し力を尽くしてこれを益さないだろうか。だから益すべき事があれば、十朋もこれを助ける。十は多数の意味。亀は是非・吉凶を決する物である。衆人の公論は必ず正理に合い、亀卜や筮（筴）でもこれに違うことはできない。このようであれば大善の吉と言うべきである。古人は「謀、衆に従えば天心に合す」と言った。</p>\n<p>本田の講説：この「古人曰く」はどうしても出典がわからない。『左伝』成公六年に「三人占えば二人に従う。衆なるが故なり」とあり、意味は一致する。おそらくこれから思いついてできた諺であろう。</p>\n<p><span class=\"tag\">象伝について程伝</span>元吉を得るのは、衆人の見を尽くし、天地の理に合するからである。だから天から福祐が降されるのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>虚心に人の意見に従えば、多くの人が助けてくれる。衆人の公論に従えば、占っても違わず大吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">弗損益之、无咎。貞吉。利有攸往。得臣无家。</span></summary><div class=\"body\"><div class=\"yomi\">損せずして之を益す。咎无し。貞にして吉。往く攸有るに利あり。臣を得て家无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「弗損益之、大得志也。」（損せずして之を益すは、大いに志を得るなり。）</div>\n<p>下を減らすことをせず、かえって増してやる。咎はない。正しくて吉。前進して利益がある。すべての民が家来として従い、我が家を思う心がなくなる（エゴイズムがなくなる）。</p>\n<p><span class=\"tag\">程伝</span>損という言葉には三つの意味がある。己を損して人に従うこと、自らを損して人に益すこと、損の道を行って人を損すること。己を損して人に従うのは義に徙（うつ）ること、自らを損して人に益すのは利益を物に及ぼすこと、損の道を行って人を損するのは義を行うことである。それぞれその時の大きい方を取って言う。四・五の二爻は己を損して人に従う意味を取り、下体の三爻は自らを損して人に益す意味を取った。損の時の用は、損の道を行って天下の損すべきものを損することである。上九は損を行わないことに意味を取った。上九は損の終わりにいて、損が極まって変ずべき者である。剛陽で上にいて、もし剛を用いて下を損削すれば、上に立つ者の道ではなく、咎は大きい。もし損を行わず、変じて剛陽の道で下に益せば、咎がなくその正しさを得て吉である。このようであれば往く所があってよく、往けば益がある。上にいて下を損さず益せば、天下の誰が服従しないだろう。服従する者が多く、内外の限りがない。だから「臣を得て家无し」という。「臣を得る」とは人心の帰服を得ること、「家无し」とは遠近内外の隔てがないことである。</p>\n<p>本田の講説：損の卦だが、ここでは下に益を与えてやるというふうに態度が変わる。「家无し」の程伊川の解釈は独特で、非常に大きな意味がある。ここまでが自分の家、ここからが他人の家という、家と家との隔たりがなくなるという意味である。</p>\n<p><span class=\"tag\">象伝について程伝</span>上にいて下を損さず、かえって益すのは、君子が大いにその志を行うことができるのである。君子の志はただ人に益すことにある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>下から取り立てず、逆に与えてやれ。そうすれば内外の隔てなく人が心服し、正しくて吉。進んでよい。</div></div></details><div class=\"pager\"><a href=\"#gua-40\">← 雷水解</a><a href=\"#gua-42\">風雷益 →</a></div>", "gua-42": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 42 卦　第五十六講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">風雷益</div><div class=\"yo\">ふうらいえき</div><div class=\"tri\">上卦 ☴ 巽　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-42\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-42\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-42\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-42\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-42\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-42\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-42\" data-jump=\"yao\">六爻</a></div><h3 id=\"g42-s0\">卦の名と象</h3>\n<p>震が下、巽が上で益の卦となる。損の卦は下を減らして上に増す、益の卦は上を減らして下に増す。階級的に言えば、損は民を減らしてお上に増やすこと、本当の利益（益）はお上を減らして民に増してやること。本田は、古代の考え方として大変福祉精神が含まれている、と言う。</p>\n<p>程伝（序卦伝を引く）：「損して已まざれば必ず益す。故に之を受くるに益を以てす」。盛衰・損益は輪を巡るようなもので、損が極まれば必ず益すのは理の自然である。益が損に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は上が巽（風）、下が震（雷）。雷と風は互いに益し合うものである。風が激しければ雷は迅く、雷が激しければ風は怒る。両者が助け合い益し合う。これは象で言ったものである。</li><li>巽と震はどちらも乾坤の下爻が変じてできた。卦変で言えば、損は泰の上が陰から陽に、三が陽から陰に変じてできた。益は否の上卦の一番下の陽が下りて、下卦の一番下の陰と入れ替わってできた。上卦を損して下卦を益す、だから益という。これは義で言ったものである。下が厚ければ上は安らかである。だから下に益すのが益である。</li></ul>\n<h3 id=\"g42-s1\">卦辞</h3>\n<div class=\"orig\">益、利有攸往、利渉大川。</div>\n<div class=\"yomi\">益は往く攸有るに利あり。大川を渉るに利あり。</div>\n<p>この卦が出たら前進してよろしい。冒険をしてもよろしい。</p>\n<p><span class=\"tag\">程伝</span>益とは天下を益する道である。だから往く所があってよい。益の道は険難を渡ることができる。だから大川を渉るに利あり。</p>\n<h3 id=\"g42-s2\">彖伝</h3>\n<div class=\"orig\">益、損上益下、民説无疆。自上下下、其道大光。利有攸往、中正有慶。利渉大川、木道乃行。益動而巽、日進无疆。天施地生、其益无方。凡益之道、與時偕行。</div>\n<p>益は上を損して下に益す。民説（よろこ）ぶこと疆（かぎ）り无し。上より下に下る、其の道大いに光る。往く攸有るに利ありとは、中正にして慶び有ればなり。大川を渉るに利ありとは、木道乃ち行わるればなり。益は動いて巽う。日に進むこと疆り无し。天施し地生ず。其の益すこと方无し。凡そ益の道は、時と偕に行う。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦の才（ここでは働きの意味）で言う。卦が益であるのは、上を損して下を益すからである。上から損して下を益せば、民の喜びは限りがない（「疆無し」は窮極することがない意味）。上から下にへりくだれば、その道は大いに光り輝く。否の九四の陽が下りて初にいて、初の陰が上って四にいる。上から下に下るのである。</li><li>九五は剛陽・中正で尊位にいて、六二もまた中正をもってこれに応じる。中正の道で天下を益し、天下がその福を受ける。</li><li>益の道は、平常無事の時はその益はまだ小さいが、艱難危険の時にはその益は至って大きい。だから大川を渉るに利あり。険を渡る時こそ益の道が大いに行われる時である。「益道」が誤って「木道」になっている。ある人は、上が巽で木、下が震で動くので木道（丸木舟が川を渡る形）だと言うが、間違いである。</li><li>上下二体で卦の徳を言う。下は震で動き、上は巽で順う。動いて理に順うのである。人を益する道は、その動きが理に順えば、日に進んで広大限りない。動いて理に順わなければ、大益を成せようか。</li><li>天地の功で益の道の大きさを言う。聖人はこれを体して天下を益する。天道は資（と）りて始まり、地道は物を生ずる。天が施し地が生じ、万物を化育して、それぞれの性命を正す。その益すことは方無しと言うべきである。方とは方角・場所で、方所があれば限量がある。「方無し」とは広大で極まりないことである。</li><li>天地が物を益すること限りないのは、理に順うからである。聖人が天下を益する道も、時に応じ理に順い、天地と合して時とともに行われる。</li></ul>\n<p>本田の講説：「益道」に改めるべきだと言ったのは程伊川が初めてで、この人独特の解釈である。漢易から伊川の前までは、普通「木道」を丸木舟が川を渡る形と解釈していた。「天道は資りて始まる」は乾の彖伝「大なるかな乾元、万物資りて始まる」による。「性」と「命」は同じ意味で、性は本性、命は天から与えられた運命。「理」の字は程伊川においては非常に重要で、伊川の哲学の根幹を成す。朱子はそれに「気」という物質的な要素を加えた。</p>\n<h3 id=\"g42-s3\">大象</h3>\n<div class=\"orig\">風雷益。君子以見善則遷、有過則改。</div>\n<div class=\"yomi\">風雷あるは益なり。君子以て善を見れば則ち遷り、過ち有れば則ち改む。</div>\n<p>風と雷とが互いに力を増してやる、これが益の形である。君子はこれにのっとって、他人の善を見ればそれに見習ってそちらに移り、自分に過ちがあればすぐに改める。</p>\n<p><span class=\"tag\">程伝</span>風が烈しければ雷は迅く、雷が激しければ風は怒る。二物は互いに益すものである。君子は風雷が益し合う象を見て、己を益す道を求める。己を益す道は、善を見れば遷り、過ちがあれば改めるに及ぶものはない。善を見て遷ることができれば天下の善を尽くすことができ、過ちがあって改めることができれば過ちはなくなる。人を益するもので、これより大きなものはない。</p>\n<h3 id=\"g42-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>わかりにくい卦。</b> 受講者が「益の卦は何を言っているのかさっぱりわからない」「損の卦はおもしろかったけど益はわからない」と言うと、本田は、確かに損の方がわかりよく、益は卦辞・爻辞ともにもうひとつわかりにくい、と認めた。上九に至ってやっと言うことがはっきりしている。</li><li><b>易は勝れる所を以て義と為す。</b> 六三の程伝の言葉について、本田は、「本質」とは今の意味ではなく形式的な建前のこと（陰は陰位にいるべき、陰は強い行動に任じてはならない、など）で、易はその場その場で何を第一義にすべきかを重点とする、「勝れる所」とは価値の優劣だ、と説明した。程伊川は人が疑問を抱くであろうところを先回りして問答の形式にし自説を説明するが、六三が非常の際に急場を救う資格があるかは、だいぶ苦しいことは苦しい、と言う。</li><li><b>民意と政治。</b> 上九の程伝が引く繋辞伝（君子は其の身を安んじて後に動き、其の心を易くして後に語り、其の交わりを定めて後に求む）について、本田は、中国の政治は民の世論を聞くということを、実際の政治機構としては何もできていないが、心掛けとしては儒教の中で言っており、その点では非常に進んでいた、と言う。</li><li><b>公と私。</b> 「公」の字は、上の八が背中の肩甲骨の象形で、私（わたくし）に背く、エゴイズムに反するというのがもともとの意味。「違」は十字路で足が二つ反対の方向を向いている形で、人から背中を向けられる意味。</li></ul>\n<h3 id=\"g42-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>上から下へ利益を与える時。前進してよく、冒険してもよい。</li><li>人の善を見ればすぐ見習い、自分の過ちに気づけばすぐ改めよ。</li><li>虚心であれば、多くの人が助けてくれる。ただし正しさを長く守れ（六二）。</li><li>低い地位で大任を任されたら、大きな成果を挙げてこそ咎がない（初九）。</li><li>真心から人に恵めば、問うまでもなく大吉（九五）。</li><li>自分の利益ばかり求めれば、誰も助けず、かえって攻撃される（上九）。</li></ul><h2 class=\"sec\" id=\"g42-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">利用爲大作、元吉无咎。</span></summary><div class=\"body\"><div class=\"yomi\">用て大作を為すに利あり。元吉にして咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「元吉无咎、下不厚事也。」（元吉にして咎无きは、下は厚事せざればなり。）</div>\n<p>大作は大事業のこと。大事業をするのによい。成すことが大いに善くて初めて咎がない。「元吉。咎无し」と切るのではなく、「元吉にして咎无し」、つまり大いに善くて初めて咎がないと程伊川は解釈する。</p>\n<p><span class=\"tag\">程伝</span>初は震（動）の主で、剛陽の盛んなものである。益の時にいて、その才は物を益するに足る。一番下にいるが、上に六四の大臣がいて応じてくれる。四は巽の主で、上は君に巽い、下は賢に順う。下にいる者は事を為すことはできないが、上にいる者の心を得てこれに従えば、その道で上を輔け、大いに天下を益する事をなすべきである。だから大作を為すに利あり。下にいて上に用いられて志を行うのだから、為す所が大善で吉でなければならず、そうして初めて咎がない。元吉でなければ、己に咎があるだけでなく、上を煩わせ上の咎ともなる。一番下にいて大任に当たるので、小善では称えるに足りない。だから必ず元吉で初めて咎がない。</p>\n<p><span class=\"tag\">象伝について程伝</span>下にいる者は本来厚事（重大な事）に当たるべきではない。上に任じられて大事に当たったのだから、必ず事を成し遂げて元吉をもたらせば咎がない。元吉を致せば、上は人を知る明があったとされ、自分は任に堪えたとされる。そうでなければ上下ともに咎がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大事業を任される時。ただし大きな成果を挙げなければ、自分にも任せた上にも咎が及ぶ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">或益之、十朋之。龜弗克違。永貞吉。王用享于帝、吉。</span></summary><div class=\"body\"><div class=\"yomi\">或は之に益す。之を十朋にす。亀も違う克わず。永貞にして吉。王用て帝に享す。吉なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「或益之、自外來也。」（或は之に益すは、外より来るなり。）</div>\n<p>時として利益を与えてくれることがある。十人の友の助けがあり、亀の甲羅で占っても間違いはない。永く正しさを守れば吉。王様が天の神を祀るのに吉。</p>\n<p><span class=\"tag\">程伝</span>六二は中正にいて、体は柔順で中を虚しくしている（陰爻は真ん中が切れているので虚心の意味）。人が中正にいて中を虚しくし、善を求め、よく順うならば、天下の誰が告げて益そうと願わないだろうか。孟子は「夫れ苟も善を好めば、四海の内皆な将に千里を軽しとして来り、之に告ぐるに善を以てせんとす」（告子篇）と言った。満ちていれば受け入れず、虚であれば来るのは物理の自然である。自分の心が自尊心で満ちていれば人の忠告は入らない。だから益すべき事があれば、多くの友が助けて益す。十は多数の意味。衆人が是とするところは理の至当で、亀は吉凶を占い是非を明らかにする物だが、ここに至れば亀も違うことはできない。「永貞にして吉」は六二の才について言う。中正で虚心に人の益を受け入れる者だが、質はもと陰柔なので、常に永く貞固であれば吉と戒める。益を求める道は、永く貞しくなければどうして守れようか。損の六五で「之を十朋にすれば元吉」と言ったのは、尊位にいて自ら損し、下の剛に応じ、柔で剛の位（五）にいるからである。柔は虚しく受け入れること、剛は固く守ることで、益を求めることの至善なので元吉である。益の六二は中を虚しくして益を求め、剛陽の応（九五）があるが、柔で柔の位にいるので、益に従うことがまだ固くないことを疑われる。だから常永貞固なれば吉と戒める。「王用て帝に享す、吉」とは、二のように中を虚しくして永貞であることを用いて上帝を祭れば、吉を獲るべきだということである。まして人に与し物に接して通じないことがあろうか。益を人に求めて応じない者があろうか。天を祭るのは天子の事なので「王用て」という。</p>\n<p>本田の講説：長い伝だが、言わんとすることは割合はっきりしている。</p>\n<p><span class=\"tag\">象伝について程伝</span>中正で中を虚しくし、天下の善を受けて固守すれば、人が益してくれることがあり、衆人が外から来て益す。ある人が問うた。「外より来るとは五を言うのではないか」。答え：このように中正で虚心であれば、天下の誰が益そうと願わないだろう。五は正応なので、もとよりその中に含まれる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>虚心で素直であれば、外から多くの助けが来る。占っても違わない。ただし正しさを永く守ってこそ吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">益之用凶事、无咎。有孚中行、告公用圭。</span></summary><div class=\"body\"><div class=\"yomi\">之に益すに凶事を用てすれば咎无し。孚有りて中行なれば、公に告ぐるに圭を用てす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「益用凶事、固有之也。」（益すに凶事を用てするは、之を固有すればなり。）</div>\n<p>少しわかりにくい爻辞だが、程伊川の理解に従えば、民を益する人をこの非常の難儀に用いれば咎はない。真心があって中庸の道にかなえば、お上に信用される。公に告げても、まるで圭（五角形の玉）を持参したように信じられる。</p>\n<p><span class=\"tag\">程伝</span>三は下体の上にいて、民の上にいる者、つまり守令（郡守・県令）である。陽の位にいて剛（上九）に応じ、動（震）の極みにいる。民の上にいて益をなすのに果断な者である。益をなすのに果断なことを凶事に用いれば咎はない。凶事とは患難非常の事である。三は下体の上にいるが、下にいる者は上を承けるべきで、どうして自分勝手に益をなせようか。ただ患難非常の事においては、宜しきを量り急変に応じ、身を顧みず努めて民を庇うべきである。だから咎がない。下にいて自任すれば上は必ず忌み嫉む（「疾」は「嫉」と同じ）。難に当たって義としてそうすべきでも、必ずその孚誠が内から出て、行いが中道にかなえば、誠意が上に通じ、上も信じて与する。専らにしても上のため民を愛する至誠がなければもとより不可であり、誠があっても行いが中にかなわなければやはり不可である。「圭」は信を通じる物で、『礼記』郊特牲に「大夫は圭を執りて使いす」とある。祭祀や朝聘には圭玉を用いて誠を通達する。誠があって中道を得れば、上に信じてもらえる。公上に告げるのに圭玉を用いるようなものである。また三は陰で中でないので、この義を述べた。ある人が問うた。「三は陰柔なのに、どうして剛果に事に任ずることを義とできるのか」。答え：三の質はもと陰だが、陽の位にいるのは自らを剛で処そうとする志があること、上九に応じるのは志が剛に向かっていること、動（震）の極にいるのは行いが剛果であることである。これで益を行うのは剛果でなくて何か。易は勝れる所を義とするので、その本質（建前）を論じないのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>六三が益すのに凶事にだけ用いてよいのは、それを固有している（専ら固く自らその事に任じる）からである。下にいる者は上を承けるべきなのに専らその事に任ずるのは、ただ民の凶災を救い時の艱急を救う時だけはよい。急難変故の臨機の処置なので咎がないのである。平時ならば不可である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>非常の時には、立場を越えて果断に人を助けても咎はない。ただし真心と中庸があってこそ上に信じられる。平時に出しゃばってはいけない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">中行告公從。利用爲依遷國。</span></summary><div class=\"body\"><div class=\"yomi\">中行あらば公に告げて従われん。用て依ることを為し国を遷すに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「告公從、以益志也。」（公に告げて従わるるは、益さんとするの志を以てなり。）</div>\n<p>行動が中庸の道にかなっているなら、お上に報告しても承知してもらえる。さらに力ある者に頼って、国替えをするのに利がある。本田は、珍しくこれは具体的な判断だと言う。</p>\n<p><span class=\"tag\">程伝</span>四は益の時に君に近い位にいる。その位を得て（陰が陰位）、巽順で上を助け、下は初の剛陽に順応する。このようであれば上を益すことができる。ただその居場所が中を得ず、応じる初も中でない。中において足りないのである。だから「もし行いが中道を得れば、君上を益すことができ、公に告げて従われる」という。巽の体で剛特の操があるわけではないので、依ることを為し国を遷すのに利がある。「依ることを為す」とは上に依附すること、「国を遷す」とは下に順って動くことである。上は剛中の君（九五）に依ってその益を致し、下は剛陽の才（初九）に順ってその事を行う。このようにするのに利がある。昔から国邑は民がその居に安んじなければ遷った。国を遷すとは下（民意）に順って動くことである。</p>\n<p>本田の講説：昔、周が東遷した時のことが『左伝』にある。西周から東周に移行する時、都を今の陝西省から洛陽に遷したが、晋・鄭両国の助けを得て遷ることができたという。</p>\n<p><span class=\"tag\">象伝について程伝</span>爻辞はただ中行を得れば公に告げて従われると言うだけだが、象伝はさらに明らかにして、従われるのは、天下を益そうという志を告げるからだと言う。志が天下を益することにあれば、上は必ず信じて従う。君に仕える者は、上が従わないことを心配せず、自分の志が誠でないことを心配するのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>中庸を守り、天下のためという志で上に申し出れば聞き入れられる。有力者を頼りにし、民意に沿って移転・引越しをするのによい。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">有孚惠心、勿問元吉。有孚惠我德。</span></summary><div class=\"body\"><div class=\"yomi\">孚有りて恵心あり。問う勿くして元吉なり。孚有りて我が徳を恵とす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有孚惠心、勿問之矣。惠我德、大得志也。」（孚有りて恵心あり、之を問う勿し。我が徳を恵とすとは、大いに志を得るなり。）</div>\n<p>誠意があり、下々を恵む心があれば、問うまでもなく大吉。真心をもって恵めば、天下の人は我が徳を恩恵と感じるであろう。</p>\n<p><span class=\"tag\">程伝</span>五は剛陽で中正、尊位にいる。また中正の六二の応を得てその益を行う。何の不利があろう。陽が実で中にいるのは孚（誠）がある象である（陽爻は真ん中が詰まっているので実、実には誠の意味がある）。九五の徳と才と位をもって、中心から至誠で物を恵み益そうとする。その至善大吉は問わずして知れる。だから「問う勿くして元吉」という。人君は益を致せる位にいて、益をなす権力を持っている。至誠で天下を益すれば、天下はその大福を受ける。その元吉は言うまでもない。「孚有りて我が徳を恵とす」とは、人君が至誠で天下を益すれば、天下の人も至誠で愛戴し、君の徳沢を恩恵としない者はないということである。</p>\n<p><span class=\"tag\">象伝について程伝</span>人君に至誠で天下を恵み益す心があれば、元吉は言うまでもない。だから「之を問う勿し」。天下が至誠で我が徳に懐いて恵とする。それは道が大いに行われ、人君の志が遂げられることである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>真心から人に恵めば、占うまでもなく大吉。人々もその徳を恵みとして慕う。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">莫益之、或撃之。立心勿恆、凶。</span></summary><div class=\"body\"><div class=\"yomi\">之に益すこと莫し。或は之を撃つ。心を立つること恒勿し。凶。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「莫益之、偏辭也。或撃之、自外來也。」（之に益すこと莫しとは、偏れるの辞なり。或は之を撃つとは、外より来るなり。）</div>\n<p>今までの爻はみな益を与えてきたが、ここでどん詰まりになると益することがなくなる。だから恨みを買い、攻撃する者がある。心掛けに恒常性がないからで、結果は凶。</p>\n<p><span class=\"tag\">程伝</span>上は位のない地にいて、人に益を行う者ではない。剛で益の極みにいて、益を求めることの甚だしい者である。応じる六三は陰で、善を取って自ら益すような者ではない。利とは衆人がともに欲するものである。専ら己を益そうとすれば、その害は大きい。欲することが甚だしければ、目が眩んで義理を忘れ、求めることが極まれば、人の物を侵し奪って仇怨を招く。だから孔子は「利に放（よ）りて行えば怨多し」（『論語』里仁篇）と言い、孟子は「利を先にすれば奪わずんば厭かず」（梁恵王篇）と言った。聖賢の深い戒めである。九は剛で益を求めることの極みにいて、衆人がともに憎む者である。だから益す者はなく、攻撃する者さえある。「心を立つること恒勿し、凶」とは、聖人が、人の心は利を専らにしてはならないと戒めたのである。恒がないとはいつも利益に随ってふらふらしていることで、凶の道であり、速やかに改めるべきである。</p>\n<p>本田の講説：孟子が梁の恵王に初めて会った時、恵王が「先生は千里を遠しとせずに来られた。何をもって我が国を利するか」と尋ねると、孟子は「亦た仁義有るのみ。何ぞ必ずしも利を曰わん」と答えた。「之に益すこと莫し」は、「上九が人に益を与えない」とも「人が上九に益を与えない」とも読める。</p>\n<p><span class=\"tag\">象伝について程伝</span>「理」は天下の至公、「利」は衆人がともに欲するもの。心を公にして正理を失わなければ、衆と利をともにして人を侵さず、人もまた与えようとする。もし利を好むことに切で私に蔽われ、自らを益そうとして人を損せば、人もまた力を尽くして争う。だから益す者はなく、撃ち奪う者がある。「之に益すこと莫し」とは、己に偏ることを責める辞である。己に偏らず公道に合えば、人も益してくれ、撃つことなどない。益を人に求めて極まれば、人はみな憎んで攻めようとする。だから撃つ者が外から来る。人が善をなせば千里の外も応じる。六二は中正で虚心なので、益す者が外から来た。不善をなせば千里の外も背く。上九は益を求める極みで、撃つ者が外から来る。繋辞伝に「君子は其の身を安んじて而る後動き、其の心を易くして而る後語り、其の交わりを定めて而る後求む。君子は此の三者を脩む。故に全きなり。危うくして以て動けば民与せず。懼れて以て語れば民応えず。交わり無くして求むれば民与えず。之に与する莫ければ之を傷る者至る。易に曰く、之に益すこと莫し、或は之を撃つ。心を立つること恒勿し。凶と」。君子の言動・与求はみな道をもってすれば完善で、そうでなければ傷を取って凶である。</p>\n<p>本田の講説：「偏辞」が難しい。程伊川は、エゴイズムに偏り過ぎることを責める言葉が偏辞だと言う。随分無理な解釈だが、そうとしか解釈できない。ここらあたりは程伊川の伝に力が入っており、今までのところは何かぐにゃぐにゃとしていたが、上九は割にはっきりしている。益の卦の極点だから、ここまで全部益しておったのが「益すこと莫し」になる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の利益ばかり求めると、誰も助けてくれず、外から攻撃を受ける。私欲に振り回されて心が定まらなければ凶。速やかに改めよ。</div></div></details><div class=\"pager\"><a href=\"#gua-41\">← 山沢損</a><a href=\"#gua-43\">沢天夬 →</a></div>", "gua-43": "<a class=\"back\" href=\"#gua\">← 六十四卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 43 卦　第五十七講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">沢天夬</div><div class=\"yo\">たくてんかい</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-43\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-43\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-43\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-43\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-43\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-43\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-43\" data-jump=\"yao\">六爻</a></div><h3 id=\"g43-s0\">卦の名と象</h3>\n<p>「夬」の字は、「さんずい」を付ければ決（ケツ）、「りっしんべん」を付ければ快楽の快になる。「夬」だけで使うことはあまりない。夬は決断する意味である。本田によれば、『説文』に、カタカナのユの形と縦の一線を組み合わせたのがこの字だとある。昔は弓を引く時「ゆがけ」という玉で作った指抜きのようなものを右手の親指にはめて弦を引いた。これがユで、縦の一線は弓の弦だろう。弦をばっと離すところから決断の意味になった。</p>\n<p>程伝（序卦伝を引く）：「益して已まざれば必ず決す。故に之を受くるに夬を以てす。夬とは決なり」。水が増して止まなければ必ず堤が切れる（「決」は堤が切れること）。益が極まれば必ず決して止む。理として常に益し続けることはなく、益して已まなければ、已む時は決する時である。夬が益に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>二体で言えば、上の兌は沢で水の集まる所である。それが至って高い天の上に上っている。堤が切れて溢れる象がある。</li><li>爻で言えば、五つの陽が下にあって成長し、まさに極まろうとする。一陰が上にあって消え、まさに尽きようとする。衆陽が上り進んで一陰を決し去ろうとする。だから夬という。夬とは剛決の義で、君子の道が長じ、小人の道が衰えて、まさに尽きようとする時である。</li></ul>\n<p>本田の講説：上下反対にすると姤になり、夬の次に出てくる。陰陽反対にすると剝になり、陽気が消されて一本だけ残る一番悪い卦である。剝の逆が復で、陽気が一旦なくなってから下に一本だけ生じる、一陽来復の意味である。</p>\n<h3 id=\"g43-s1\">卦辞</h3>\n<div class=\"orig\">夬、揚于王庭。孚號、有厲。告自邑。不利即戎。利有攸往。</div>\n<div class=\"yomi\">夬は王庭に揚ぐ。孚あって号す、厲（あやう）きこと有りと。告ぐること邑よりす。戎（じゅう）に即くに利あらず。往く攸有るに利あり。</div>\n<p>この卦が出たら、朝廷で公然と小人の悪を言い挙げるがよい。真心から衆人に大声で「まだ危険がある」と呼びかけよ（「厲きこと有り」は叫ぶ内容）。乱を征伐するにもまず自分の領地をよく治めよ。むやみに武力に訴えてはよくない。しかし悪を排除する行動は怠ってはならない。</p>\n<p>本田の講説：「告自邑」の「自」は、漢文の読みとしては形容詞に使われないので「邑より告ぐ」としか読めないが、意味は自分の邑に告げるということ。「戎」は武力。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>小人がまさに盛んな時は、君子の道はまだ勝てない。どうして明らかに正道をもって決し去れよう。だから含みを持たせ本性を晦まして時を待ち、だんだん消していく道を図る。今はすでに小人は衰え、君子の道が盛んである。明らかに公の朝廷で行い、人々に善悪を明らかに知らせるべきである。だから「王庭に揚ぐ」という。孚とは誠が中にあること、誠意である。号とは衆に命ずる言葉である。君子の道が長じ盛んでも、敢えて備えを忘れない。だから至誠で衆に命じて「まだ危うい道がある」と知らせる。甚だ盛んな力で甚だ衰えたものを決するとはいえ、侮って備えがなければ、測らざる後悔がある。まだ危うくなる理があるのである。必ず戒め懼れる心があれば憂いはない。聖人が戒めを設ける意味は深い。</li><li>君子が小人を治める（退治する）のは、その不善のためである。必ず自分の善道で勝ち、改めさせる。だから聖王が乱を誅する時は必ずまず己を修めた。舜が文徳を敷いたのがこれである。邑は私邑で、「告ぐること邑よりす」とはまず自ら治めることである。衆陽の盛んさで一陰を決し去るのだから力はもとより余りある。しかし剛を極めて太過に至ってはならない。過ぎれば蒙の上九が寇をなすようになる。戎兵は強武の事で、「戎に即くに利あらず」とは壮武を尚んではならないということ。即とは従うで、戎に従うのは武を尚ぶことである。「往く攸有るに利あり」とは、陽は盛んでもまだ上まで極まらず、陰は衰えてもまだ去っていない、小人がなお存し君子の道がまだ至っていないということで、だから進んで往くべきである。武を尚ばないが、その剛の道はますます進む。これが夬の善である。</li></ul>\n<p>本田の講説：舜が文徳を敷いたというのは『書経』大禹謨にある。有苗という部族が反乱を起こした時、舜は文化的な徳を天下に広め、朝廷で自ら舞を舞った。七十日経って有苗が感化されて降伏したという伝説である。蒙の上九は「蒙を撃つ。寇を為すに利あらず」で、愚かな者を撃つのに勢い過度であってはならないという判断である。</p>\n<h3 id=\"g43-s2\">彖伝</h3>\n<div class=\"orig\">夬、決也、剛決柔也。健而説、決而和。揚于王庭、柔乘五剛也。孚號有厲、其危乃光也。告自邑、不利即戎、所尚乃窮也。利有攸往、剛長乃終也。</div>\n<p>夬は決なり。剛、柔を決するなり。健にして説ぶ。決して和らぐ。王庭に揚ぐとは、柔、五剛に乗ればなり。孚あって号す、厲きこと有りとは、其の危ぶむこと乃ち光（おお）いなるなり。告ぐること邑よりす、戎に即くに利あらずとは、尚ぶ所乃ち窮まるなり。往く攸有るに利ありとは、剛長じて乃ち終るなり。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>夬は決の義で、五陽が一陰を決するのである。「健にして説び、決して和らぐ」とは二体で卦の才を言う。下は健、上は説で、健であってよく説ぶ。決してよく和らぐのは、決することの至善である。兌の説を和とする。</li><li>柔は消えたとはいえ、五剛の上にいて、なお乗り陵ぐ象がある。陰が陽に乗るのは非理の甚だしいものである。君子の勢いはすでにこれを去るに足る。その罪を王朝の大庭で明らかにし、衆に善悪を知らせるべきである。</li><li>誠を尽くして衆に命じ、危懼があることを知らせれば、君子の道は危うさがなくなって光大となる。</li><li>まず自ら治めるべきで、専ら武を尚んではならない。戎に即いて尚ぶ所があれば窮まるに至る。夬の時に尚ぶ所とは武のことである。</li><li>陽が盛長しても、なお終わっておらず、一陰がある。さらに決し去れば君子の道は純一で、害する者はいなくなる（乾の卦になる）。これが剛が長ずることの終わりである。</li></ul>\n<h3 id=\"g43-s3\">大象</h3>\n<div class=\"orig\">澤上於天、夬。君子以施祿及下、居徳則忌。</div>\n<div class=\"yomi\">沢、天に上るは夬なり。君子以て禄を施し下に及ぼす。徳に居り忌を則とす。</div>\n<p>沢が天の上まで上った。堤が切れる、これが夬の形である。君子は沢の水が下に注ぐのにのっとって恵みを下々に及ぼし、堤が切れる危険に顧みて、我が身を道徳に置き、我が身に対する禁欲を日常の原則とする（忌むとは自分の欲望を抑えること）。本田は、最後の四字（居徳則忌）が読み難く難しい、と言う。</p>\n<p><span class=\"tag\">程伝</span>沢は水の集まったもので、それが天の至って高い所に上るので夬（決潰）の象とする。君子は、上で決して下に注ぐ象を見て、禄を施して下に及ぼす。その禄沢を施して下に及ぼすのである。その決潰の象を見て、徳に居り忌を則とする。「徳に居る」とはその徳に安処すること、「則」は約、「忌」は防で、防禁を立てることである。防禁があれば潰散はない。王弼は「則」を「明」としている（禁令を明らかにする意味）が、これも通じる。「沢、天上に在り」と言わず「沢、天に上る」と言うのは、天に上れば動きがあって不安で、決潰の勢いがあるからで、「天上に在り」と言えば安定した言葉になってしまうからである。</p>\n<h3 id=\"g43-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>君子と小人の決戦。</b> 夬は君子（五陽）が最後の小人（一陰）を押し切る時である。押し切れば一番めでたい乾の卦になる。ただし小人を侮って備えを怠らず、武力に頼り過ぎず、まず自分を修めよ、というのが卦全体の教えである。</li><li><b>私的な縁を断て。</b> 九三の程伝の「其の私与と雖も当に遠絶すべし」について、受講者が「最初から私好（わたくしごう）しなければいいわけですよね」と言うと、本田は、伊川の伝の中にその言葉がある、と答えた。陽は上へ上へ上がろうとし、陰陽が引き合う関係にあれば交わろうとするが、この卦のように陽が陰を押し切るべき時には陰と野合してはいけない。やはりその卦の時々による。</li><li><b>一度心惹かれたら道を離れる。</b> 九五の程伝は「人心一たび欲する所有らば道を離る」と言う。本田は、いかにも道学者らしい厳しいところで、九五は上六に心惹かれたものの最後は決断して交わりを断つ、それは行いにおいて咎なしとはいえ、一旦心惹かれたという点で広大とは言えないという、非常に厳しい解釈だ、と評する。</li><li><b>号の二つの読み。</b> 「号」の字は平声（平たく読む）では「泣き叫ぶ」、去声（尻下がり）では「号令を下す」の意味になる。程伊川は、卦辞の「孚あって号す」、九二の「惕れて号す」は去声で号令、上六の「号ぶ无し」は平声で泣き叫ぶと読む。後漢の鄭玄は上六もすべて去声で読ませる。一字を二つの音で読み分けることは昔からあり、「為」も「なす」は平声、「ために」は去声である。受講者が「上六は去声でも平声でも結果は同じだな」と言うと、本田は、結果は同じことになる、と答えた。</li><li><b>難しい字。</b> 受講者が「何千年も前に随分難しい字をつくったもんですね」と言うと、本田は、『易経』にしか出てこない字もある、と答えた。</li></ul>\n<h3 id=\"g43-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>正しい側が最後の悪を押し切る時。悪は公然と明らかにせよ。</li><li>勝ちが見えていても油断するな。「まだ危険がある」と警戒を呼びかけよ。</li><li>まず自分の足元を治めよ。武力・強硬手段に頼り過ぎるな。だが進むことはやめるな。</li><li>勝算もなく突き進めば咎（初九）。警戒を怠らなければ夜襲も恐れるに足りない（九二）。</li><li>古い馴染みでも、断つべき相手は決然と断て（九三・九五）。</li><li>小人の側にとっては、泣いても無駄で終には凶（上六）。君子にとっては良い卦。</li></ul><h2 class=\"sec\" id=\"g43-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">壯于前趾。往不勝爲咎。</span></summary><div class=\"body\"><div class=\"yomi\">趾（あし）を前むるに壮んなり。往きて勝たざるを咎と為す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不勝而往、咎也。」（勝たずして往く、咎あるなり。）</div>\n<p>前進するのに意気盛んである。前進する以上、必ず勝たねばならない。勝てなければ咎がある。</p>\n<p><span class=\"tag\">程伝</span>九は陽で乾の体にあり、上にあるべきものが下にいて、決の時にいる。前進するのに壮んな者である。「趾を前む」とは進み行くことである。人が行こうと決めた時、行って宜しければその決は正しく、行って宜しくなければ決は過ちである。だから往って勝たなければ咎である。夬の時に往くのは決することだから、勝ち負けで言うのである。九は初にいて進むのに壮んで、動くのに躁がしい者である。だから勝たないことの戒めがある。陰はまさに尽きようとしているが、自分の躁動は当然勝てない咎があるはずである。相手を計らないからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>人の行いは、必ずその事ができるかを量ってから決すれば過ちはない。理として勝てないのに往けば、咎があるのは知れたことである。およそ往って咎がある者は、みな決したことが誤っていたのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勢い込んで突き進むな。勝算をよく量ってから動け。勝てなければ咎。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九二</span><span class=\"t\">惕號。莫夜有戎、勿恤。</span></summary><div class=\"body\"><div class=\"yomi\">惕（おそ）れて号す。莫夜に戎有るも恤（うれ）うる勿れ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「有戎勿恤、得中道也。」（戎有れども恤うる勿きは、中道を得ればなり。）</div>\n<p>警戒心が強く、絶えず号令をする。そうすれば、夜に敵襲があっても心配する必要はない。「莫」は「暮」の本字で、草の中に太陽がある形。</p>\n<p><span class=\"tag\">程伝</span>夬は陽が陰を決し、君子が小人を決する時で、戒備を怠ってはならない。陽が長じてまさに極まろうとする時、二は中にいて柔の位にいるので、剛すぎない。よく戒備を知っており、夬に処する至善の者である。内に惕懼を抱き、外に戒号を厳しくすれば、夜に兵が来ても恐れることはない。</p>\n<p>本田の講説：テキストの最後に「号は去声」という注記がある。去声の時は「号令を下す」の意味になる。</p>\n<p><span class=\"tag\">象伝について程伝</span>夜に兵が来るのは甚だ恐るべきことだが、恐れなくてよいのは、自らの処し方が善いからである。すでに中道を得て、また惕れることを知り、戒備もある。何を憂えることがあろう。ある人が問うた。「九が二にいるのは中を得ているが正ではない。それを至善とするのはなぜか」。答え：陽が陰を決し、君子が小人を決する時に中を得ている。どうして不正があろうか。時を知り勢いを識ることが、易を学ぶ大きな方法である。</p>\n<p>本田の講説：中庸の徳に比べれば位の正・不正は大したことではないというのが、程伊川の持論である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>警戒を怠らず、備えと号令を厳しくしていれば、不意の襲撃も恐れることはない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">壯于頄、有凶。獨行遇雨、君子夬夬。若濡有慍、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">頄（つらぼね）に壮んなり。凶なること有り。独行して雨に遇う。君子は夬を夬とす。若し濡るれば慍（いか）らるること有らんも咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「君子夬夬、終无咎也。」（君子は夬を夬とす、終に咎无きなり。）</div>\n<p>本田の講説：程伊川はここの語順を変えるべきだと言う。爻辞の順に誤りがあり、安定の胡公（胡瑗）は「頄に壮んなり。凶なること有り。独行して雨に遇う。若し濡るれば慍らるること有らんも、君子は夬を夬として咎无し」と移したが、程伊川はそれにも不安があるとし、上のように「独行して雨に遇う」の後に「君子は夬を夬とす」を置き、「若し濡るれば慍らるること有らんも咎无し」と読むべきだとした。</p>\n<p>鼻息の意気盛んなことが頬骨に現れる。凶なることがあろう。抜け駆けをして小人と和合する（雨に遇うとは和合すること）。しかし今や君子たる者は、いやが上にも決断すべき時である。かつての仲間でも切るべきである。切り捨てられた仲間が恥をかかされて（濡れるとは恥をかくこと）怒りの色があるだろうが、こうすれば咎はない。</p>\n<p><span class=\"tag\">程伝</span>夬決の剛健を尚ぶ時に、三は下体の上にいて、また健（乾）の体の極みにいる。決するのに剛果な者である。頄は頬骨で、上にあってまだ極まらないものである。三は下体の上にいて、上にいるとはいえまだ極まっておらず、上に君（五）がいるのに、その決を自任している。頬骨に壮んな者で、凶がある道である。「独行して雨に遇う」とは、三と上六は正応で、衆陽がともに一陰を決する時に、もし三が私的な関係で上六に応じ、ことさら衆と同じくせずに独行すれば、上六と陰陽和合してしまう。だから雨に遇うという。易の中で雨と言うのは、みな陰陽の和合を言う。君子の道が長じ小人を決し去る時に、独り小人と和合する。その非は知るべきである。ただ君子がこの時に処すれば、夬を夬とすることができる。その決をいやが上にも果断にするのである。その私的な仲間であっても遠く絶つべきである。もし濡汚されれば（恥辱をこうむれば）慍みの色があるだろうが、このようであれば過ちや咎はない。三は健体で正位にいるので、必ずしもこの過ちがあるわけではないが、この義によって教えとしたのである。爻辞が交錯したのは、「雨に遇う」の字と「濡れる」の字があるので、誤って続けてしまったのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>牽かれて縛られる（牽梏）のは決断がないからである。君子は義に与する。決すべきを決するので、終に咎があるには至らない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>はやる気持ちを顔に出すな。抜け駆けして敵側と馴れ合えば凶。古い仲間でも断つべき縁は決然と断て。恨まれても咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">臀无膚、其行次且。牽羊悔亡。聞言不信。</span></summary><div class=\"body\"><div class=\"yomi\">臀（いさらい）に膚（はだえ）无し。其の行くこと次且（ししょ）たり。羊を牽けば悔い亡ぶ。言を聞くも信ぜず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「其行次且、位不當也。聞言不信、聰不明也。」（其の行くこと次且たるは、位当らざればなり。言を聞くも信ぜざるは、聡明ならざればなり。）</div>\n<p>尻の皮膚が擦りむけて痛くて座っておれない。さりとて進もうとしてもぎくしゃくして進めない。羊を無理に引っ張って行くように、自分を無理に引っ張って仲間について行けば悔はなくなる。しかしこの九四は、易の作者の忠告を聞いても信じないであろう。本田は、表現が象徴的でちょっと難しい、と言う。</p>\n<p><span class=\"tag\">程伝</span>「臀に膚无し」とは居ることが安らかでないこと、「次且」とは進もうとして進めないさまである。九四は陽で陰の位にいて、剛決が足りない。止まろうとすれば衆陽が並んで下から進んできて、勢い安らかにいられない。尻が傷ついて座っていられないようなものである。行こうとすれば、柔の位にいるので剛壮さを失い、強いて進むことができない。だからその行きはぎくしゃくする。羊は群れをなして行くもの、牽くとは無理に引っ張ることである。もしよく自ら強いて自分を引っ張り、群れの行進に従えば、悔を亡ぼすことができる。しかしすでに柔の位にいるので、必ずできないであろう。たとえこの言葉を聞いても、必ず信じ用いることはできない。過ちてよく改め、善言を聞いてよく用い、己に克って義に従うことは、ただ剛明な者だけができる。他の卦では九が四にいても、その失はこれほど甚だしくない。夬の時に柔の位にいるので、その害が大きいのである。</p>\n<p>本田の講説：他の卦で九が四にいる例を挙げると、天水訟の九四は「訟に克たず」だが態度を変えれば最後は吉、天沢履の九四は「虎の尾を履む」だが「終に吉」と続く。夬の九四は判断辞が最後まで付いておらず、訟や履の九四よりさらに悪い。</p>\n<p><span class=\"tag\">象伝について程伝</span>九は陰位にいて位が当たらない。陽で柔にいるので剛決を失い、強いて進めず、行きがぎくしゃくする。剛であって初めて明であることができる。柔にいれば心が移って正しい本性を失い、もはや明などあろうか。だから言を聞いても信じられないのは、聴くことが明らかでないからである（本田：「聡」は耳がさとい、「明」は目が明るいだが、ここでは区別していない）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>居るも進むもままならない。無理にでも仲間について行けば悔は消えるが、忠告を素直に聞き入れられない状態である。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">莧陸夬夬。中行无咎。</span></summary><div class=\"body\"><div class=\"yomi\">莧陸（けんりく）夬を夬とす。中行において咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「中行无咎、中未光也。」（中行において咎无きも、中未だ光（おお）いならざるなり。）</div>\n<p>本田は、九五がもっとも難解だと言う。「莧陸」は程伊川の伝では馬歯（莧）のこととあるが、いずれにしてもよくわからない。辞書によるとヌメリヒユという、ぬらぬらとして湿気に染まりやすい植物である。九五はそのように小人の空気に染まりやすい（すぐ上の一陰と接触しているから）。しかし決然と小人を断ち切るならば、中庸の道に照らして咎はない。</p>\n<p><span class=\"tag\">程伝</span>五は陽剛中正で尊位にいるが、上六にごく近い。上六は説（兌）の体で、卦の中でただ一つの陰であり、陽が親しもうとする相手である。五は陰を決する主でありながら、かえってこれに親しむ。その咎は大きい。だから必ずその決を果断にし、莧陸のようにすれば、中行の徳において咎がない。中行とは中道である。莧陸は今いう馬歯莧で、晒してもなかなか乾かない、陰気に感じることの多い
