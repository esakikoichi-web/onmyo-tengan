部の爻が不正になる。「いまだ済らず」である。</p>\n<p>程伝（序卦伝を引く）：「物は窮まる可からず。故に之を受くるに未済を以てして終る」。既済は物の窮まりである。物が窮まって変じなければ已むことはない。易とは変易して窮まらないものである。だから既済の後を未済で受けて終わる。未済であればまだ窮まっておらず、まだ窮まらなければ生生（万物が生んで止まない）の義がある。（本田：「終」の字の下の「焉」は「ここに」の意味で、ここに終わる。）</p>\n<ul class=\"sen\"><li>卦は離が上、坎が下で、火が水の上にある。火は炎上し水は下へ流れるので交わらず、互いに用をなさない。だから未済である。</li></ul>\n<h3 id=\"g64-s1\">卦辞</h3>\n<div class=\"orig\">未濟、亨。小狐汔濟、濡其尾。无攸利。</div>\n<div class=\"yomi\">未済は亨る。小狐汔（きつ）として済る。其の尾を濡らす。利する攸无し。</div>\n<p>この卦が出たら願いは通る。仔狐が勇敢に川を渡ろうとして、尻尾を濡らし、結局渡れない。利する所はない。「汔」は「ほとんど」という意味で井の卦に出てきて、そこでは程伊川は「ほとんど」と読ませるが、ここは「仡」（大胆に、勇ましく）に改めよと言う。</p>\n<p><span class=\"tag\">程伝</span>未済の時には亨る理があり、卦の才にも亨るを致す道がある。ただ処し方を慎むことにある。狐は水を渡れるが、尾を濡らせば渡れない。老いた狐は疑い畏れることが多いので、氷を踏んで耳を澄まして聴く。陥るのを恐れるからである。小さい狐はまだ畏れ慎むことができないので、渡ることに勇敢である。汔は仡とすべきで、壮勇の様子である。『書経』（秦誓）に「仡仡たる勇夫」とある。小狐は渡ることに果敢で、尾を濡らして渡れない。まだ済らない時に済ることを求める道は、至って慎むべきで、そうすれば亨る。小狐の果敢さのようであれば渡れず、渡れなければ利はない。</p>\n<p>本田の講説：『書経』秦誓は、秦の穆公が鄭の国を伐って失敗し、後悔して作った詔勅である。未完成だから完成に向かって努力する、未完成ゆえに進歩があるということである。</p>\n<h3 id=\"g64-s2\">彖伝</h3>\n<div class=\"orig\">未濟亨、柔得中也。小狐汔濟、未出中也。濡其尾无攸利、不續終也。雖不當位、剛柔應也。</div>\n<div class=\"yomi\">未済は亨る、柔、中を得ればなり。小狐汔として済る、未だ中を出でざるなり。其の尾を濡らす、利する攸无し、続いて終えざるなり。位に当らずと雖も、剛柔応ずるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦の才で言う。亨るゆえんは柔が中を得ているからである。五は柔で剛位にいて、剛（九二）に応じる。柔が中を得ているのである。剛柔が中を得て未済の時にいるので、亨ることができる。</li><li>二によって言う。二は陽で険の中にいて、済ろうとする者である。また上は五に応じる。険は安んずべき地ではなく、五には従うべき理がある。だから済ることに果敢で、小狐のようである。済ることに果敢なので尾を濡らす患いがあり、まだ険の中を出られない。</li><li>進むことに鋭い者は退くことも速い（『孟子』尽心上）。済ることに勇敢でも、継続してこれを終えることができず、往く所に利はない。</li><li>陰陽が位に当たらないが、みな相応じている。未済の時に当たって与（味方）がある。もしよく重く慎めば済る理がある。二は果敢に済ろうとするので尾を濡らす。卦の諸爻がみな位を得ていないので未済とする。雑卦伝に「未済は男の窮まるなり」とあるのは、三陽がみな位を失うということである。この義は成都の隠者から聞いた。</li></ul>\n<p>本田の講説：受講者が「なんでここで急に剛柔について言い出すのか」と問うと、卦の形が全爻不正で一見悪そうに見えるので、それなのになぜ亨るという良い結果が出るのかを説明している、六五は陰だが尊い君主の位にいて下の九二に対応しており、弱い身ではあるが強い地位にいて中庸を得ているから、願いが通る可能性がある、と答えた。受講者が「これは自分が退くのではなく退けられるのか」と問うと、「退けられる。この場合だと川の水から退けられるわけである」と答えた。雑卦伝の「男の窮まる」について、本田は、陰爻もそうなのだが、男性社会だから女のことはどうでもよいのだ、と言う。</p>\n<h3 id=\"g64-s3\">大象</h3>\n<div class=\"orig\">火在水上、未濟。君子以愼辨物居方。</div>\n<div class=\"yomi\">火、水の上に在るは未済なり。君子以て慎んで物を弁じ方に居く。</div>\n<p>火が水の上にあるのが未済である（火と水が交流しない）。君子はこれにかたどって、慎んで物事をわきまえ、それぞれしかるべき場所に置く。「物を弁ず」という言い方は、同人の大象に「君子以て族を類し物を弁ず」とあった。</p>\n<p><span class=\"tag\">程伝</span>水火が交わらなければ相済って用をなさない。だから未済とする。火が水の上にあるのはその所ではない。君子はその処る所が当たらない象を観て、慎んで事物に処し、その当たる所を弁え、それぞれその方に置く。その所に止まらせることをいう。</p>\n<h3 id=\"g64-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>未済で終わる妙味。</b> 受講者が「一番最後にどうして未済をもってきたのか」と問うと、本田は「未済が先に来て既済で終わってもよさそうなものである。ひっくり返ったところに易の妙味がある」と答えた。</li><li><b>全爻不正でも全爻相応。</b> 未済は全爻が位に当たらないが、すべて剛柔が応じている。だから重く慎めば済る道がある。</li><li><b>大川を渉る。</b> 受講者が「大川を渉るに利ありという文句はよく出てきますな。やはり黄河とか長江があるからか」と問うと、本田は「南の方は古代にはまだ開発されていないから、長江は意図になかったと思う」と答えた。</li><li><b>郭子儀と李晟。</b> 九二の程伝は、唐の郭子儀・李晟が危うく未だ済らない時に、恭順を極めてよく終わりの吉を保ったことを例に挙げる。本田の説明によれば、郭子儀は粛宗の時に安禄山の乱を平らげたが、宦官の魚朝恩がその功績を妬んで讒言し、一旦軍事権を取り上げられた。郭子儀は平然と素直に従い、まもなくまた戦争が起こって復帰した。李晟は徳宗の時に、朱泚という節度使が国号を大秦として反乱を起こしたのを平らげたが、その時も宰相が功績を妬んで軍事権を取り上げ文官にした。</li><li><b>義命。</b> 上九の程伝の「義命」という熟語は『大漢和辞典』にも載っていない。似た語に『孟子』尽心篇の「其の道を尽くして死する者は正命なり」の「正命」があり、「義命」はおそらく程伊川の造語であろう。</li><li><b>礼を過ぎる。</b> 受講者が「肆にして礼を過ぎとはどういうことか」と問うと、本田は、ここでは言っていないが、竹林の七賢の一人劉伶が素っ裸で客に応対したというような態度、礼を失することだ、と答えた。</li></ul>\n<h3 id=\"g64-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>未完成の時。願いは通る可能性があるが、慎重に処すること。勇んで飛び込めば途中で挫折し利はない。</li><li>物事をよく弁別し、それぞれを本来の場所に置け。</li><li>自分の力量を測らずに進めば恥をかく（初六）。</li><li>有能でも出過ぎず、上に恭順であれば吉（九二）。</li><li>独力では危険を越えられない。助けを得て進め（六三）。</li><li>正しさを固く守り、奮い立って長期戦に挑めば報われる（九四）。</li><li>徳の輝きと実績が伴い、大いに吉（六五）。</li><li>天命に安んじて楽しむのはよいが、溺れて節度を失うな（上九）。</li></ul><h2 class=\"sec\" id=\"g64-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">濡其尾。吝。</span></summary><div class=\"body\"><div class=\"yomi\">其の尾を濡らす。吝し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「濡其尾、亦不知極也。」（其の尾を濡らす、亦た不知の極みなり。）</div>\n<p>狐の尻尾が濡れた。恥ずべきである。</p>\n<p><span class=\"tag\">程伝</span>六は陰柔で下にいて、険（坎）にいて四に応じる。険にいればその居に安んぜず、応があれば志は上に行く。しかし自らは陰柔で、四も中正の才ではないので、助けて済すことはできない。獣が水を渡るときは必ず尾を掲げ、尾が濡れれば渡れない。「其の尾を濡らす」とは、結局渡れないことである。自分の力を量らずに進み、ついに済れない。恥ずべきである。</p>\n<p><span class=\"tag\">象伝について程伝</span>自分の力を量らずに進み、尾を濡らすに至る。これは知らないことの極みである。（本田：「不知」は愚かさのことである。）</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力量も測らずに飛び込み、途中で挫折する。恥をかく。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">曳其輪。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">其の輪を曳く。貞にして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「九二貞吉、中以行正也。」（九二の貞吉なるは、中以て正を行うなり。）</div>\n<p>九二は車輪を逆の方向に引き戻す、つまり前進させない。そうすることが正しくて吉。</p>\n<p><span class=\"tag\">程伝</span>他の卦では九が二にいるのは、柔位にいて中を得、剛に過ぎる義はない。未済においては、聖人は深く時を取って戒めとし、上に仕える恭順の道を明らかにする。未済は君道が艱難の時である。五は柔で君位にいて、二は剛陽の才で相応の地にいる、用いられるべき者である。剛には柔を凌ぐ義があり、水には火に勝つ象がある。艱難の時に頼るのは才臣だけで、最も恭順の道を尽くすべきである。だから「其の輪を曳けば正を得て吉」と戒める。逆にその輪を曳き、その勢いをそぎ、その進むのを緩くするのは、剛を用いることの過ぎるのを戒めるのである。剛が過ぎれば上を犯すことを好み、順が足りなくなる。唐の郭子儀・李晟は、危うく未だ済らない時に、恭順を極め、よくその終わりの吉を保った。五においてはその貞吉・光・孚を言い、君道の善を尽くすことを述べ、二においてはその恭順を戒め、臣道の正を尽くすことを述べる。上下の道を尽くしたのである。</p>\n<p>本田の講説：陽が二にいるのを良しとするのは、いつでもではなく、五の君位に柔らかい者がいる場合である。郭子儀は粛宗の時に安禄山の乱を平らげたが、宦官の魚朝恩に讒言されて一旦軍事権を取り上げられ、平然と素直に従い、まもなく戦争が起こって復帰した。李晟は徳宗の時に朱泚の反乱を平らげたが、宰相に功績を妬まれて軍事権を取り上げられ文官にされた。その態度が正しかったので、最後まで吉を保てたのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>九二が貞にして吉なのは、輪を曳いて中道を得、それが正だからである。（本田：九二は爻の位としては不正だが、程伊川の説では中の方が正に優先する。陽が奇数位・陰が偶数位にいることだけを正と言うのではなく、ここでは中庸の道を踏むことが正しい仕方だという意味である。）</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>力があっても出過ぎず、勢いを抑えて上に恭しく仕えれば、正しくて吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六三</span><span class=\"t\">未濟。征凶。利渉大川。</span></summary><div class=\"body\"><div class=\"yomi\">未だ済らず。征けば凶。大川を渉るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「未濟征凶、位不當也。」（未だ済らず、征けば凶とは、位当らざればなり。）</div>\n<p>六三はまだ危険（下卦の坎）を渡りきれない時である。そのまま一人で前進すれば凶。援助を得られれば大川を渡ることもできる。「征けば凶」と「大川を渉るに利あり」は矛盾する判断のようで、朱子は「利」の上に「不」の字が抜けているのではないかと言う。程伊川や他の注釈者は、仲間と助け合うならば、という条件を入れ、単独で行けば凶だと解する。</p>\n<p><span class=\"tag\">程伝</span>「未だ済らず、征けば凶」とは、険にいて険を出る用がないのに行けば凶ということである。必ず険を出てから行くべきである。三は陰柔不中正の才で険にいて、済るに足りない。済る道も険を出る用もなく行こうとする、凶であるゆえんである。しかし未済には済る道があり、険が終われば出る理がある。上に剛陽の応（上九）がある。もしよく険を渉って往き従えば済る。だから大川を渉るに利がある。しかし三の陰柔が、どうして独りで険を出て往けよう。時が不可なのではなく、才ができないのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>三が征けば凶なのは位が当たらないからである。陰柔で中正でなく、険を済る才がない。もしよく険を渉って応に従えば利がある。</p>\n<p>本田の講説：受講者が「大川を渉るに利ありという文句はよく出てきますな。やはり黄河とか長江があるからか」と問うと、「南の方は古代にはまだ開発されていないから、長江は意図になかったと思う」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>まだ苦境を抜けていない。独力で進めば凶。頼れる協力者に従えば難関を越えられる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">貞吉悔亡。震用伐鬼方、三年有賞于大國。</span></summary><div class=\"body\"><div class=\"yomi\">貞なるときは吉にして悔い亡ぶ。震（ふる）いて用て鬼方を伐つ。三年にして大国に賞せらるる有らん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「貞吉悔亡、志行也。」（貞なるときは吉にして悔い亡ぶ、志行わるるなり。）</div>\n<p>正しい道を固く守れば吉、あるべき後悔もなくなる。奮い立って夷の国を伐つ。三年で打ち勝って、大国（天子）から褒美を受ける。</p>\n<p><span class=\"tag\">程伝</span>九四は陽剛で大臣の位にいる。上に虚中明順の主（六五）がいる。またすでに険（坎）を出ている。未済はすでに中を過ぎ、済るべき道がある。天下の艱難を救うには剛健の才でなければできない。九は陽だが四（柔位）にいるので、貞固であれば吉で悔いが亡び、貞でなければ救えず悔いがあると戒める。「震」は動の極みである。古人が力を用いることの甚だしいのは、鬼方を伐つことだったので、これを義とした。努め勤めて遠くを伐ち、三年に至って成功し、大国の賞が行われる。必ずこのようにして初めて済る。天下を救う道は、このように貞固であるべきである。四は柔位にいるので、この戒めを設けた。</p>\n<p>本田の講説：足場が柔弱なので「貞なれば吉」という戒めを設けた。そうでないと三年の長きにわたって頑張ることができない。</p>\n<p><span class=\"tag\">象伝について程伝</span>四のような才が時と合い、さらに貞固を加えれば、その志を行い、吉で悔いが亡ぶ。鬼方を伐つことは貞の至りである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>苦境を抜けて、大事に挑む時。正しさを固く守り、奮い立って長期戦に耐えれば、成功して大いに報われる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">貞吉无悔。君子之光、有孚。吉。</span></summary><div class=\"body\"><div class=\"yomi\">貞にして吉なり。悔い无し。君子の光あり、孚有り。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「君子之光、其暉吉也。」（君子の光あり、其の暉あって吉なり。）</div>\n<p>六五は志が正しくて吉、もとより何の悔いもない。君子らしい徳の輝きがあり、それにふさわしい功績が伴う。吉。この卦の主体である。</p>\n<p><span class=\"tag\">程伝</span>五は文明（離）の主で、剛位にいて剛（九二）に応じる。処し方は中を得て、心を虚しくし、陽剛がその助けとなる。柔で尊位にいるが、処し方は至正至善で不足はない。すでに貞を得ているので、吉で悔いがない。ここの貞は固有のもので、戒めではない。これで済らせれば済らないことはない。五は文明の主なので、その光を称える。君子は徳の輝きが盛んで、功実がこれにかなう、孚があるのである。上の「吉」は貞によるもので、柔で正しい、徳の吉である。下の「吉」は功によるもので、すでに光があり孚がある。時として済ることができる。（本田：「孚有り」には信じられるという意味があるが、ここでは功績の実という意味である。）</p>\n<p><span class=\"tag\">象伝について程伝</span>光が盛んであれば暉（かがやき）がある。暉とは光が散ることである。君子の積み重ねが充実して光が盛んで、暉があるに至る。善の至りである。だから重ねて吉という。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>徳の輝きと実績がそろい、大いに吉。悔いはない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">有孚于飲酒、无咎。濡其首、有孚失是。</span></summary><div class=\"body\"><div class=\"yomi\">飲酒に孚有り、咎无し。其の首を濡らす、孚有りて是を失す。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「飲酒濡首、亦不知節也。」（酒を飲んで首を濡らす、亦た節を知らざるなり。）</div>\n<p>酒を飲みつつ天命を信じ、順う。咎はない。しかし酒を飲むことの度を過ぎて頭までずぶ濡れになれば、自信過剰で、あるべき姿を失った者である。</p>\n<p><span class=\"tag\">程伝</span>九は剛で上にいる、剛の極みである。明（離）の上にいる、明の極みである。剛が極まっても明であれば、躁がしさとならずに決断となる。明はよく理を照らし、剛はよく義を断ずる。未済の極にいて、済すことのできる地位ではなく、済すべき理もない。天を楽しみ命に順うべきである。否の終わりには傾く（否の上九「否を傾く」）が、これは時の変である。未済には極まって自ずから済る理はないので、ただ未済の極とした。至誠をもって義命に安んじ、自ら楽しめば咎はない。飲酒して自ら楽しむのである。その処る所を楽しまなければ、忿躁して険に陥り、凶咎に至るだけである。しかしもし楽しみに従ってほしいままにし、礼を過ぎて首を濡らすに至れば、その処る所に安んずる者ではない。「孚有り」とは自ら中に信ずること、「是を失す」とはその宜しさを失うことである。このようであれば、孚（自信）があることにおいて失である。人が難に処して、為すべきことがないと知り、意を放って反らない者が、どうして義命に安んずる者であろう。</p>\n<p>本田の講説：「義命」という熟語は『大漢和』にも載っていない。似た語に『孟子』尽心篇の「其の道を尽くして死する者は正命なり」の「正命」があり、「義命」はおそらく程伊川の造語であろう。受講者が「肆にして礼を過ぎ、とはどういうことか」と問うと、ここでは言っていないが、竹林の七賢の一人劉伶が素っ裸で客に応対したというような、礼を失する態度のことだ、と答えた。</p>\n<p><span class=\"tag\">象伝について程伝</span>酒を飲んで首を濡らすに至るのは、節を知らないことの甚だしいものである。こうなるのは義命に安んずることができないからで、よく安んずれば常を失わない。</p>\n<p>本田の講説：これはやけ酒のようなものである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分の力の及ばない時は、天命に安んじ、ほどほどに楽しめば咎はない。溺れて節度を失えば、自信が仇となる。</div></div></details><div class=\"pager\"><a href=\"#gua-63\">← 水火既済</a><a class=\"dis\">-</a></div>", "rei": "<h2 class=\"sec\">講座の実例</h2><p class=\"small dim\">講義の席で受講者が筮を立てた例と、講義で引かれた故事。出典の卦・総論へ移れます。</p><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#soron-2\">総論</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#ex-1\">下経について</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#ex-1\">下経について</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#ex-1\">下経について</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-1\">乾為天</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-1\">乾為天</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-1\">乾為天</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-2\">坤為地</a><div class=\"rb\">**【故</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-16\">雷地豫</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-17\">沢雷随</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-18\">山風蠱</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-18\">山風蠱</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-20\">風地観</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-22\">山火賁</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-22\">山火賁</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-22\">山火賁</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-23\">山地剝</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-29\">坎為水</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-33\">天山遯</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-33\">天山遯</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-39\">水山蹇</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-51\">震為雷</a><div class=\"rb\">**【実</div></div><div class=\"rei\"><a class=\"src\" href=\"#gua-53\">風山漸</a><div class=\"rb\">**【実</div></div>", "find": "<h2 class=\"sec\">検索</h2><input id=\"q\" class=\"search\" type=\"search\" placeholder=\"例：虎の尾、乗馬班如、王安石\" aria-label=\"検索語\"><div class=\"count\" id=\"qc\"></div><div id=\"qr\"></div>"};
(function(){
var app=document.getElementById("app");
function txt(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent;}
var IDX=Object.keys(V).filter(function(k){return /^(gua|soron)-/.test(k);}).map(function(k){
  var d=document.createElement("div");d.innerHTML=V[k];
  var t=(d.querySelector(".ghead .nm")||d.querySelector("h2"));
  return {k:k,title:t?t.textContent:k,t:d.textContent};});
function tab(v){var t=v.split("-")[0];document.querySelectorAll("nav.tabs a").forEach(function(a){a.classList.toggle("on",a.dataset.t===t);});}
function show(){
  var v=(location.hash||"#home").slice(1);if(!V[v])v="home";
  app.innerHTML=V[v];tab(v);window.scrollTo(0,0);
  try{localStorage.setItem("koza-last",v);}catch(e){}
  app.querySelectorAll("[data-jump]").forEach(function(a){a.addEventListener("click",function(e){
    e.preventDefault();var n=v.split("-")[1];var id=a.dataset.jump==="yao"?"g"+n+"-yao":"g"+n+"-"+a.dataset.jump;
    var el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});});});
  if(v==="find")initFind();
}
function initFind(){
  var q=document.getElementById("q"),qc=document.getElementById("qc"),qr=document.getElementById("qr");
  function run(){var s=q.value.trim();qr.innerHTML="";if(!s){qc.textContent="";return;}
    var hits=0,h="";IDX.forEach(function(x){var i=x.t.indexOf(s),c=0,snip=[];
      while(i>=0&&c<50){c++;if(snip.length<3){var a=Math.max(0,i-30),b=Math.min(x.t.length,i+s.length+40);
        snip.push((a>0?"…":"")+esc(x.t.slice(a,i))+"<mark>"+esc(s)+"</mark>"+esc(x.t.slice(i+s.length,b))+"…");}
        i=x.t.indexOf(s,i+s.length);}
      if(c){hits+=c;h+='<a class="hit" href="#'+x.k+'"><b>'+esc(x.title)+'</b><span class="small dim">　'+c+'件</span>'+snip.map(function(z){return'<div class="sn">'+z+'</div>';}).join("")+"</a>";}});
    qc.textContent=hits?hits+"件見つかりました":"見つかりませんでした";qr.innerHTML=h;}
  q.addEventListener("input",run);
  try{var s=sessionStorage.getItem("koza-q");if(s){q.value=s;run();}}catch(e){}
  q.addEventListener("change",function(){try{sessionStorage.setItem("koza-q",q.value);}catch(e){}});
}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
var root=document.documentElement;
try{var th=localStorage.getItem("koza-theme");if(th)root.setAttribute("data-theme",th);}catch(e){}
document.getElementById("themebtn").addEventListener("click",function(){
  var cur=root.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  var nx=cur==="dark"?"light":"dark";root.setAttribute("data-theme",nx);try{localStorage.setItem("koza-theme",nx);}catch(e){}});
window.addEventListener("hashchange",show);
if(!location.hash){try{var l=localStorage.getItem("koza-last");if(l&&V[l])location.replace("#"+l);}catch(e){}}
show();
})();
</script>
