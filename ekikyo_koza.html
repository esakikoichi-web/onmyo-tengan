時も類とともにするのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>君の命があれば咎がなく、否を救うことができる。志が行われるのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>才能があっても、手柄を自分のものにせず、すべて上の命によって行えば咎はなく、仲間とともに幸いを受ける。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">休否。大人吉。其亡其亡、繫于苞桑。</span></summary><div class=\"body\"><div class=\"yomi\">否を休む。大人の吉なり。其れ亡びなん、其れ亡びなんとて、苞桑（ほうそう）に繋る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大人之吉、位正當也。」（大人の吉なるは、位正に当たればなり。）</div>\n<p>天下のふさがりをやめさせる。大人物のめでたい時である。今に滅びるぞ、今に滅びるぞと言いながら、頑丈な桑の根にしっかりつなぎ止めるようにして、油断なく国家を保つべきである。</p>\n<p><span class=\"tag\">程伝</span>五は陽剛中正の徳で尊位にいる。だから天下の否を休息させることができる。大人の吉である。大人が位に当たれば、その道で天下の否を休息させ、泰へと導く。しかしまだ否を離れていないので、「其れ亡びなん」の戒めがある。否がやんで泰に返ろうとしても、すぐ安心してほしいままにしてはならない。深く慮り遠く戒め、常に否がまた来ることを恐れるべきである。安固の道は桑に縛りつけたようにすることで、桑は根が深く固く、苞は群がり生えることで、その固さは甚だしい。聖人の戒めは深い。漢の王允、唐の李徳裕はこの戒めを知らずに禍敗を招いた（後漢末に軍閥が対立した時、文官の王允は最も悪い将軍を他の将軍の力を借りて倒したが、自分も力を借りた相手に倒された。李徳裕は唐の武宗の宰相で、節度使の力を奪おうとして逆に倒された）。</p>\n<p><span class=\"tag\">象伝について程伝</span>大人の徳があって至尊の正位を得たので、天下の否を休めることができ、吉である。位がなければ、道があっても何ができよう。だから聖人は位を「大宝」と言う（繋辞伝「聖人の大宝を位と曰う」）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ふさがりを終わらせる力のある時。しかし油断は禁物。「今に滅びるぞ」と自らを戒め、基盤を固くせよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">傾否。先否後喜。</span></summary><div class=\"body\"><div class=\"yomi\">否を傾く。先には否がり、後には喜ぶ。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「否終則傾、何可長也。」（否終われば則ち傾く、何ぞ長かる可けんや。）</div>\n<p>ふさがりを傾けて、通じる状態に戻る。先にはふさがっていたが、最後には喜びがある。</p>\n<p><span class=\"tag\">程伝</span>上九は否の終わりである。物の理は極まれば必ず返る。泰が極まれば否になり、否が極まれば泰になる。上九は否がすでに極まったので、否の道が傾いて変わる。先に極まるのは否、後に傾くのが喜びで、否が傾けば泰になる。</p>\n<p><span class=\"tag\">象伝について程伝</span>否が終われば必ず傾く。いつまでもふさがったままの理があろうか。極まれば必ず返るのは理の常である。しかし危うきを安きに返し、乱を治に変えるには、必ず陽剛の才があってこそできる。だから否の上九は否を傾けることができるが、屯の上六は陰で力が弱く、屯を変えることができないのである（屯の上六には「乗馬班如たり。泣血漣如たり」という爻辞がついていた）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>ふさがりの極み。ここから必ず傾いて、喜びに変わる。</div>\n<p class=\"note\"><i>本書『易經講座 上（一）』はここ、第二十四講の否の卦で終わる。続く同人以下は「（上）二」に収められている。</i></p></div></details><div class=\"pager\"><a href=\"#gua-11\">← 地天泰</a><a href=\"#gua-13\">天火同人 →</a></div>", "gua-13": "<a class=\"back\" href=\"#gua\">← 30卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 13 卦　第二十五講〜第二十六講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><div class=\"nm\">天火同人</div><div class=\"yo\">てんかどうじん</div><div class=\"tri\">上卦 ☰ 乾　／　下卦 ☲ 離</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-13\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-13\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-13\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-13\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-13\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-13\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-13\" data-jump=\"yao\">六爻</a></div><h3 id=\"g13-s0\">卦の名と象</h3>\n<p>上が天、下が火で、わりあい良い卦である。人と仲良くし、人を集めるという意味を持っている。</p>\n<p>程伝（序卦伝を引く）：「物は以て終に否がる可からず。故に之を受くるに同人を以てす」。天地が交わらなければ否、上下が心を同じくすれば同人で、否と意味が反対である。また世がふさがっている時は、必ず人と力を同じくしてこそ救える。同人が否に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>二象で言えば、天はもともと上にあり、火は上へ燃えあがる。上にいようとする点で天と同じである。だから同人という。</li><li>二体で言えば、九五は正位にいて乾の主、六二は離の主で、ともに中正をもって応じあい、上下が心を同じくする。これが同人の義である。</li><li>また卦にはただ一陰（六二）しかなく、衆陽がこれと同じくしようとする。これも同人の義である。一陰の卦は他にもある（姤・小畜・大有・夬など）が、同人の時に二と五が応じ、天と火が同じくするので、その義は特に大きい。</li></ul>\n<h3 id=\"g13-s1\">卦辞</h3>\n<div class=\"orig\">同人于野、亨。利涉大川。利君子貞。</div>\n<div class=\"yomi\">人に同じくするに野に于いてす。亨る。大川を渉るに利あり。君子の貞に利あり。</div>\n<p>広い野原で人を集める。願いは通る。大川をざぶざぶ渡る冒険をしてもよい。君子の正しい道を守れば利がある。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>野とは広々とした野原で、遠いという意味と外という意味を合わせて取った。人と同じくするのに天下大同の道によれば、それは聖賢の至って公平な心である。普通の人が集まるのは私意の合うところによるもので、慣れ親しむ情にすぎない。だから必ず野においてする。身近な者への私情によらず、広い野原で人を集める。私するところにかかわらなければ至公大同の道で、どんなに遠い者も同調しないことはない。亨ることは知れたことである。</li><li>天下と大同すれば、天下がみな同調する。そうなれば、どんな険しい所も越えられ、どんな危難も通れる。だから大川を渉るに利がある。</li><li>上で「野に于いてす」と言ったのは身近な者に親しむだけではないということで、ここでさらに君子の道によるべきだと言う。君子の貞とは天下至公大同の道である。だから千里の遠くにいても、千年の後に生まれても、割符を合わせたように一致し、推し広めれば四海の広さ、億兆の多さでも同じくならないものはない。小人はただ私意だけで、親しむ者は間違っていても同調し、憎む者は正しくても背く。だから小人の同はおもねって党を作る。その心が正しくないのである。同人の道は君子の貞正にある。</li></ul>\n<p>本田の講説：程伝にくり返し出る「大同」は、『礼記』礼運篇の言葉である。礼運篇は大同の世と小康の世を対比する。大昔の大同の世には、支配者が天下を公のものとし、天子の位を世襲せず、地位も財産も自分のものとせず、盗人もいないので扉に鍵をかける必要もなかった。時代が下った小康の世には、天下を君主の私有財産と考え、城や堀で地位と財産を守るようになり、君臣・親子・夫婦といった人の道が強調され、私有財産ができ、礼や法が確立した。禹・湯・文王・武王といった儒教の聖王が作ったのは小康の世だという。大同の世がいつかは礼運でははっきりしないが、夏以前、自分の子に位を譲らず他人に譲った堯・舜の時代と考えられているはずである。こうした区別には『老子』の考え方も入っているだろう。清末に辛亥革命の大立者である康有為が『大同書』を書き、国境もない一つの共和体制の世界というユートピアを描いたのも、ここから来ている。程伝は同人を礼運の「大同の世」と同じ意味に解している。</p>\n<h3 id=\"g13-s2\">彖伝</h3>\n<div class=\"orig\">同人、柔得位得中、而應乎乾、曰同人。同人曰、同人于野亨、利涉大川、乾行也。文明以健、中正而應、君子正也。唯君子爲能通天下之志。</div>\n<div class=\"yomi\">同人は、柔、位を得、中を得て乾に応ずるを同人と曰う。同人に曰く（衍文）、人に同じくするに野に于いてす、亨る、大川を渉るに利ありとは、乾の行いなり。文明にして以て健、中正にして応ず、君子の正なり。唯だ君子のみ能く天下の志を通ずと為す。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦の成り立ちを言う。「柔、位を得」とは、二が陰で陰の位（偶数位）にいて正位を得ていること。五は中正で、二も中正で応じる。それが「中を得て乾に応ず」である。五は剛健中正、二は柔順中正で応じ、それぞれ正を得てその徳が同じなので、同人という。五は乾の主なので「乾に応ず」という。大象は天と火の象を取り、彖伝はもっぱら二で言う。</li><li>二つ目の「同人に曰く」の三字は衍文（誤って入った字）で、削るべきである。</li><li>至誠で私心がなく、険難を踏み越えられるのは、乾（天）の行いである。私心がないのは天の徳である。</li><li>また二体で義を言う。文明（下卦の離。程伊川は知恵の明るさと解する）の徳があって剛健（上卦の乾）、中正の道で応じあう。これが君子の正道である。</li><li>天下の志はさまざまだが、理は一つである。君子は理に明らかなので天下の志に通じることができる。聖人が億兆の心を自分一つの心のように見るのは、理に通じているからである。文明なら理を明らかにでき、だから大同の義を明らかにできる。剛健なら己に克てるので、大同の道を尽くせる。そうして初めて中正で乾の行いに合する。</li></ul>\n<p>本田の講説：この易伝は程伊川の哲学を示している。万物を一貫して「理」があり、宇宙を動かすのもさまざまな物を成り立たせるのもすべて理で、人の心の中にも理がある。人の本性は理である。「理性」という言葉は程伊川や朱子の哲学から出てくる。</p>\n<h3 id=\"g13-s3\">大象</h3>\n<div class=\"orig\">天與火、同人。君子以類族辨物。</div>\n<div class=\"yomi\">天と火とは同人なり。君子以て類族もて物を弁ず。</div>\n<p>上が天、下が火、これを同人と呼ぶ。君子はこれにのっとって、同類をグループにまとめることで物を区別する。</p>\n<p><span class=\"tag\">程伝</span>「火、天の下に在り」「天の下に火有り」と言わずに「天と火と」と言うのは、天は上にあり火の性は炎上して、火と天が同じだからで、そこに同人の義がある。君子は同人の象を見て、類族によって物を弁ずる。それぞれの類によって物の同異を分ける。君子と小人の党、是非の理、物の情の離合、事理の異同など、同じものと異なるものを君子はよく見分ける。だから物に処してその方法を誤らない。</p>\n<h3 id=\"g13-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>身びいきの戒め。</b> ふつう、中正を得た二と五が応じあうのは良いこととされるが、同人では恥ずべきこととされる。同人は天下大同の道なので、特定の相手とだけ親しむのは私情だからである。だから九五も、この卦では君主の意味を取らない。</li><li><b>小人の実情。</b> 九三の爻辞は小人の実情を深く明らかにしている。しかし「凶」という判断がついていないのは、兵を挙げるだけの勇気がないので、結果として凶には至らないからである。</li><li><b>相対関係で義を取る。</b> 衆陽がみな六二と同じくしようとするなかで、九三と九四だけが争奪の意味を持つのは、二と五の間にはさまっているからである。初九と上九は遠いので、意味の取り方が別になる。</li><li><b>繋辞伝の引用。</b> 九五について繋辞伝に「君子の道は、或いは出で或いは処り、或いは黙し或いは語る。二人心を同じくすれば、其の利（と）きこと金を断つ。同心の言は、其の臭（かおり）蘭の如し」とある。程伝は、心が同じなら出処語黙の違いはあっても一つで、天下にこれを裂けるものはない、「一」は割れないもので、金石を通し水火にも入る、と説く。</li><li><b>十翼。</b> 孔子が書いたとされる易の解説には、彖伝・象伝・繋辞伝・説卦伝・序卦伝・文言伝・雑卦伝がある。彖伝は卦辞の解説、象伝は卦全体を解く大象と爻辞を解く小象、繋辞伝は易全体の概論、説卦伝は八卦の象徴の解説、序卦伝は六十四卦の順序の解説、文言伝は乾坤だけの解説、雑卦伝は六十四卦をそれぞれ一句で解説したもの。『史記』によれば孔子は晩年に易を好み、竹簡を綴じた革紐が三回すり切れるほど読んだ（韋編三絶）。</li><li><b>程朱学と陽明学。</b> 程伊川は道学者のなかでも最も厳格な人で、易の本文に筋の通らないことをしても吉となる場合があっても、倫理的な原則に合うように解釈する。伊川の哲学を受け継いでさらに精緻にしたのが朱子で、合わせて程朱学という。ただ易の解釈では、伊川が倫理面に偏るのに対し、朱子は占いの面、偶然性の面を重視する点でずれがある。江戸時代の武士階級は昌平黌を本山に程朱学を学んだが、庶民はそれほど厳格に身につけず、在野には程朱学をぼろかすに言う学者もいた。韓国（李朝朝鮮）は朱子学を非常に厳しく守り、十六世紀の李退渓のように朱子以上に厳格に考える傾向が強い。朱子学に対立する陽明学は、一事一物の理を探究して最高の理に至るという朱子学に対し、人間の短い一生でそんなに多くは研究できないとして、自己の心の理を研究すればよいとする。朱子学に従う人はあまり道を踏み外さないが、陽明学は心がすべてなので極端に走る者も出る。大塩平八郎、西郷隆盛、三島由紀夫も陽明学に心酔しており、明治維新の志士には陽明学に触れた者が多い。一方、孟子から朱子学に受け継がれた王者と覇者の区別によれば、武力で天下を取った徳川幕府は覇者で、天皇こそ王者と考えるのが自然であり、水戸学はそう考えて尊王攘夷になった。朱子学的な発想が明治維新につながった例である。</li></ul>\n<h3 id=\"g13-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>身内や仲間内だけでなく、広く公平に人を集めれば、何事も通り、冒険してもよい。</li><li>特定の相手だけをひいきするのは恥ずべきこと（六二）。</li><li>道理の通らない野心を抱いて機をうかがっても、何年たっても事は起こせない（九三）。</li><li>勝てないと悟って反省し、正しい道に戻れば吉（九四）。</li><li>心を同じくする相手とは、初めは邪魔されて泣いても、最後には結ばれて笑う（九五）。</li></ul><h2 class=\"sec\" id=\"g13-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">同人于門、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">人に同じくするに門に于いてす。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「出門同人、又誰咎也。」（門を出でて人に同じくす、又誰か咎めん。）</div>\n<p>門の外で人を集める。そうすれば咎はない。</p>\n<p><span class=\"tag\">程伝</span>九は同人の初めにいて、上に応がない（初と四はともに陽で引き合わない）。私するところがなく、人と同じくすることの公なる者である。だから門を出て人と同じくするとした。門を出るとは外にいることで、外にいれば私的な偏りがない。その同じくするのは広く公平である。このようであれば過ちも咎もない。</p>\n<p><span class=\"tag\">象伝について程伝</span>門を出て外で人と同じくすれば、同じくする範囲が広く、偏りがない。人が同じくする時、厚い薄い、親しい疎いの違いがあると、そこから非難が生じる。すでに偏りがないのだから、誰が咎めよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>身内に偏らず、外に出て広く人と交われば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">六二</span><span class=\"t\">同人于宗、吝。</span></summary><div class=\"body\"><div class=\"yomi\">人に同じくするに宗に于いてす。吝。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「同人于宗、吝道也。」（人に同じくするに宗に于いてするは、吝の道なり。）</div>\n<p>自分の一族の中で人と親しむ。恥ずべきことである。</p>\n<p><span class=\"tag\">程伝</span>二と五は正応である。だから「人に同じくするに宗に于いてす」という。宗とは一族・宗党である。応じあう相手とだけ同じくするのは偏りがあり、同人の道においては私的で狭い。だから恥ずべきである。もし二が陽なら剛中の徳で、中道をもって同じくするので私とはならない。</p>\n<p><span class=\"tag\">象伝について程伝</span>諸卦では中正で応じあうのを善とするが、同人では恥ずべきこととする。だから五も君の意味を取らない。私は人君の道ではなく、私情で同じくするのは恥ずべきである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>身内やお気に入りとだけ親しむのは恥ずべきこと。視野を広く持て。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">伏戎于莽、升其高陵。三歳不興。</span></summary><div class=\"body\"><div class=\"yomi\">戎（じゅう）を莽（くさむら）に伏せ、其の高陵に升る。三歳まで興さず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「伏戎于莽、敵剛也。三歳不興、安行也。」（戎を莽に伏するは、敵剛なればなり。三歳まで興さず、安んぞ行かんや。）</div>\n<p>草むらに伏兵を隠し、高い丘に登って敵の様子をうかがう。三年たっても兵を挙げられない。あまり良くない判断である。</p>\n<p><span class=\"tag\">程伝</span>三は陽で剛の位にいて中を得ず、剛暴な人である。同人の時で、志は人と同じくすることにある。卦にはただ一陰しかなく、諸陽はみなこれと同じくしようとし、三は二に近い。しかし二は中正の道で五と応じている。三は剛強で二と五の間にいて、二を奪って同じくしようとする。しかし理は直くなく、義は勝たないので、あえてあからさまにできない。兵を草むらに伏せ、悪意を抱いて内に不正の負い目を感じている。だから恐れて、時々高い丘に登って様子をうかがう。こうして三年に至ってもついに挙兵できない。この爻は小人の実情を深く示しているが、凶と言わないのは、あえて事を起こさないので凶に至らないからである。</p>\n<p><span class=\"tag\">象伝について程伝</span>敵とするのは五で、剛でかつ正しい。奪えようか。だから恐れはばかって隠れている。三年たっても挙兵できず、ついにどうして行えよう。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>道理の通らない野心を胸に機をうかがう。何年たっても事は起こせない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">乘其墉、弗克攻、吉。</span></summary><div class=\"body\"><div class=\"yomi\">其の墉（かき）に乗る。攻むるに克たず。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「乘其墉、義弗克也。其吉、則困而反則也。」（其の墉に乗るも、義として克たざるなり。其の吉なるは、則ち困しみて則に反ればなり。）</div>\n<p>垣根にまたがって五を攻めようとするが、攻めても勝てない。結果は吉。ふつうは「攻むる克わず」と読むが、程伝はこう読んでいるらしい。</p>\n<p><span class=\"tag\">程伝</span>四は剛で中正でなく、志は二と同じくしようとする。これも五と仇をなす者である。墉は垣根で、隔てるためのもの。四は五にごく近く、垣根一つ隔てているようなものである。その垣根にまたがって攻めようとするが、義として正しくないと知るので勝てない。もし自ら義として正しくないと知って攻めなければ吉である。邪欲をほしいままにして義理を反省できず、妄りに攻めれば、その凶は甚だしい。三は剛で剛の位にいるので強さを押し通して反省できないが、四は剛で柔の位にいるので、苦しんで反省する意味がある。反省すれば吉で、義を畏れて改めるのは吉である。</p>\n<p><span class=\"tag\">象伝について程伝</span>垣根に乗っても勝てないのは、義として勝たないからである。邪で正を攻めれば勝たない。吉を得るのは、義として勝てないことによって困窮し、法則（正しい道）に立ち返るからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>無理な争いを仕掛けても勝てない。苦しんで反省し、正しい道に戻れば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i></span><span class=\"p\">九五</span><span class=\"t\">同人、先號咷而後笑。大師克相遇。</span></summary><div class=\"body\"><div class=\"yomi\">人に同じくするに、先には号咷（ごうとう）して後には笑う。大師克ちて相遇う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「同人之先、以中直也。大師相遇、言相克也。」（同人の先は、中直なるを以てなり。大師相遇うとは、相克つを言うなり。）</div>\n<p>意中の相手と同じくしようとするが、初めは思うように行かず泣き叫ぶ。しかし最後には思いを遂げて笑う。大軍で邪魔者を打ち払い、当の相手と一緒になれる。</p>\n<p><span class=\"tag\">程伝</span>九五は二と同じくしようとして、三・四の二陽に隔てられる。五は義が直く理が勝っているので、憤りに耐えず泣き叫ぶに至る。しかし邪は正に勝たない。隔てられても、ついには必ず一緒になれる。だから後に笑う。五と二は正応で、二陽が理に外れて間を裂きに来るので、必ず大軍を用いて勝ち、初めて相遇える。「大師」「克つ」と言うのは二陽の強さを示す。九五は君位だが人君の義を取らないのは、五がもっぱら私情で二に応じ、中正の徳を失っているからである。人君は天下と大同すべきなのに一人に私するのは君道ではない。また先に隔てられて泣き、後に遇って笑うのは、まさに私情で、大同の体ではない。二は下にいても宗に同じくするのを恥ずべきとされた。まして人君はなおさらである。五はすでに君道としては取るところがないので、君道を言わず、二人が心を同じくすれば隔てられないという義を明らかにしている。</p>\n<p><span class=\"tag\">象伝について程伝</span>先に泣き叫ぶのは、中が誠で理が直いので、憤りに耐えないからである。敵は強く大軍を用いるに至るが、義が直く理が勝つので、ついには勝てる。「相克つ」とは勝てることで、二陽の強さを示す。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>心を同じくする相手との間を邪魔される。初めは泣くが、正しい側が最後には勝って結ばれ、笑う。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">同人于郊、无悔。</span></summary><div class=\"body\"><div class=\"yomi\">人に同じくするに郊に于いてす。悔い无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「同人于郊、志未得也。」（人に同じくするに郊に于いてすとは、志未だ得ざるなり。）</div>\n<p>城外で人を集める。誰も来なくても悔いはない。郊は城外の野原で、天を祭る場所である。</p>\n<p><span class=\"tag\">程伝</span>郊とは外の遠い地である。同じくしようとする者は必ず親しみ仲間になる。上九は外にいて応じる者がない（上と三はともに陽で引き合わない）。なまじ初めに同じくする者がいれば、終わりに背きあって後悔することもある。遠くにいて仲間がいないので、同じくする者はいないが、悔いもない。同じくしようという志は遂げられないが、ついに悔いるところもない。</p>\n<p><span class=\"tag\">象伝について程伝</span>遠くにいて同じくする者がいないので悔いはない。しかし同人の道として同じくしたいという志は得られない。悔いはないが、善い身の処し方ではない。</p>\n<p>本田の講説：どの卦でも五が一番高い地位とされ、上は世捨て人などに当てられることが多い。上九はまさにそういう立場で、城外にいるので誰も集まって来ない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人が集まらず志は遂げられないが、背かれることもなく悔いはない。</div></div></details><div class=\"pager\"><a href=\"#gua-12\">← 天地否</a><a href=\"#gua-14\">火天大有 →</a></div>", "gua-14": "<a class=\"back\" href=\"#gua\">← 30卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 14 卦　第二十七講〜第二十八講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">火天大有</div><div class=\"yo\">かてんたいゆう</div><div class=\"tri\">上卦 ☲ 離　／　下卦 ☰ 乾</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-14\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-14\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-14\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-14\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-14\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-14\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-14\" data-jump=\"yao\">六爻</a></div><h3 id=\"g14-s0\">卦の名と象</h3>\n<p>大有は「大いなる所有」の意味である。</p>\n<p>程伝（序卦伝を引く）：「人と同じくする者は、物必ず帰す。故に之を受くるに大有を以てす」。人と協調する者には、まわりの物が慕い寄る。大有が同人に次ぐゆえんである。</p>\n<ul class=\"sen\"><li>卦の形は、火が天の上にある（太陽の形）。火が高い所にあれば、その明るさは遠くまで及び、万物がどれほど多くとも照らされないものはない。これが大有の象である。</li><li>また、一つの柔（六五）が尊位にいて、衆陽がみなこれに応じる。尊位にいて柔を執るのは、物の帰するところで、上下がこれに応じる。これが大有の義である。大有とは盛大で豊かに所有することである。</li></ul>\n<h3 id=\"g14-s1\">卦辞</h3>\n<div class=\"orig\">大有、元亨。</div>\n<div class=\"yomi\">大有は、元いに亨る。</div>\n<p>この卦が出れば、願いは大いに通る。</p>\n<p><span class=\"tag\">程伝</span>卦の才（卦の形・爻の性質）によって元いに亨るのである。卦の徳には三通りある。卦の名自体がその義を持つもの（「比は吉」「謙は亨る」。親しむ、謙遜と、名前自体が良い意味）。卦の義によって訓戒を垂れるもの（「師は貞、丈人なれば吉」「人に同じくするに野に于いてす、亨る」）。卦の才を見て言うもの（「大有は元いに亨る」）。大有は、剛健文明で、天に応じて時に行くので、元いに亨るのである。</p>\n<p>本田の講説：「卦の才」という言い方は程伊川の注に時々出てくる。二番目の陰であるべき位置に陽がいるとか、五番目が陰であるとかいう、卦の形のことである。</p>\n<h3 id=\"g14-s2\">彖伝</h3>\n<div class=\"orig\">大有、柔得尊位、大中而上下應之、曰大有。其德剛健而文明、應乎天而時行、是以元亨。</div>\n<div class=\"yomi\">大有は、柔、尊位を得、大中にして上下之に応ずるを大有と曰う。其の徳剛健にして文明、天に応じて時に行く。是を以て元いに亨る。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦が大有である理由を言う。五は陰で君位にいる、柔が尊位を得たのである。中にいるのは大中の道を得たこと。諸陽の宗とするところとなる、上下が応じるのである。尊位にいて柔を執るのは、もとより人の帰するところで、しかも虚中・文明・大中の徳がある（陰爻は真ん中が切れているので虚心、陽爻はふさがっているので実の意味になる）。だから上下が志を同じくして応じる。大有たるゆえんである。</li><li>卦の徳は、内（下卦・乾）が剛健、外（上卦・離）が文明である。六五の君は九二に応じる（二と五は対応し、ここでは二が陽、五が陰で引き合う）。五の性は柔順で明らかで、順に二に応じ、二は乾の主なので乾に応じるのである。順に乾の行いに応じるのは、天の時に順うことである。だから「天に応じて時に行く」という。その徳がこのようなので元いに亨る。</li><li>王弼は「大いに通じなければ大いに有ることはできない。大いに有れば必ず元いに亨る」と言うが、これは卦の義を知らない。離と乾が大有の義を成すのであって、大有という名そのものに元いに亨る義があるのではない。卦の才によって元いに亨るのである。大いに有っても不善な者も、通じさせることができない者もいる。</li><li>諸卦で元亨利貞を備えるもの（乾坤以外では屯・随・臨・革など）は、彖伝で「元亨」を「大亨」と言い直している。乾坤と同じ徳だと疑われるのを恐れるからである。利貞を兼ねず元亨だけのものは、元の義を尽くさせるために「元亨」をそのまま使う。元には大いに善いという意味がある。元亨だけのものは大有・蠱・升・鼎の四卦で、ただ升の彖伝だけは誤って他の卦にならって「大亨」としている。本田は、原則を立てて貫こうとする程伊川の合理主義がよく現れていると言う。</li><li>ある人が問うた。「諸卦の元が乾の元と同じでないのはなぜか」。答え：乾の元は始めの意味で、首として万物に出る義がある。他の卦にはこの義はなく、善・大の意味になるだけである。「元がなぜ善なのか」。答え：元は物の先（頭）である。物の先に不善はない。事は成ってから敗れ、興ってから衰え、得てから失う。善悪・治乱・是非と、天下の事はみな善いほうが先にある。だから文言伝に「元は善の長なり」とある。</li></ul>\n<p>本田の講説：ここの王弼注への反発はなかなか面白い。いかにも宋代の道学者らしい潔癖さで、財産に対する一種の偏見もある。王弼（三国時代魏の人で、若くして亡くなった天才。易と『老子』の注を書いた）は六朝時代の名門貴族の出で、程伊川は貧乏儒者だから、発想の仕方が違う。六朝時代は儒教の影響力が衰え、老荘思想や仏教が流行した一種の自由思想の時代で、富というものにもおおらかである。王弼は『老子』を政治的な面からではなく、もっぱら無の哲学という形而上的な面から解釈した。</p>\n<h3 id=\"g14-s3\">大象</h3>\n<div class=\"orig\">火在天上、大有。君子以遏惡揚善、順天休命。</div>\n<div class=\"yomi\">火、天上に在るは大有なり。君子以て悪を遏（とど）め善を揚げ、天の休命に順う。</div>\n<p>火が天の上で燃えている、これが大有である。君子はこれにのっとって、悪をくじき善を誉めあげ、天の善き命に従う。</p>\n<p><span class=\"tag\">程伝</span>火が高く天上にあって、万物の多さを照らし見る。だから大有である。大有は繁庶（数多いこと。庶民の庶）の義である。君子は大有の象を見て、悪を断ち善を揚げ、天の美しい命に従う。万物が多ければ善悪の違いがある。君子は大有の盛りを受け、天の工（わざ）に代わって万類を治め養うべきである（『書経』皋陶謨に「天工、人其れ之に代わる」）。衆を治める道は、悪を遏め善を揚げることにある。悪が懲らされ善が勧められるのは、天命に順い群生を安んずるゆえんである。本田によれば、「悪懲善勧」は「勧善懲悪」の動詞と名詞を逆にした形で、悪・善が主語になる。このあたりの注は、いかにも朗らかで楽天的な世界観に裏打ちされている。</p>\n<h3 id=\"g14-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>富への態度。</b> 大有の程伝には、富そのものに罪はないが、人は富によって自ら咎を招くという考えが一貫している。王弼注への反発には、宋代道学者の潔癖さと財産への一種の偏見が見える（彖伝の項を参照）。</li><li><b>地位の低い者が良い。</b> 六爻のなかで、権力の位にいない初九と上九がかえって良い判断を得る。</li><li><b>天下の土地は王のもの。</b> 九三の「普天の下、王土に非ざる莫し」に見るように、土地はすべて天子のもので、人民は貸し与えられているという観念がある。</li></ul>\n<h3 id=\"g14-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>天上に太陽が輝く、大いなる所有の時。願いは大いに通る。</li><li>悪を抑え善を揚げ、天の命に従え。</li><li>富や勢いを誇らず、独り占めせず、満ちあふれないよう慎めば、天の助けがある。</li><li>柔和に人と交わりつつ、威厳も保て（六五）。</li></ul><h2 class=\"sec\" id=\"g14-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初九</span><span class=\"t\">无交害、匪咎。艱則无咎。</span></summary><div class=\"body\"><div class=\"yomi\">害に交（わた）る无し。咎あるに匪ず。艱（なや）むときは則ち咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大有初九、无交害也。」（大有の初九は、害に交る无きなり。）</div>\n<p>まだ害にかかわらない。富そのものに罪はない。恐れ慎んでいれば咎はない。「交渉」という熟語があるように、交にも渉と同じく「わたる」の訓がある。</p>\n<p><span class=\"tag\">程伝</span>九は大有の初めにいて、まだ盛んではなく、卑しい位にいて応もない（初と四はともに陽で引き合わない）。驕り満ちる過ちはまだない。だから害に交わらない。およそ富有であれば害がないことは少ない。子貢ほどの賢者でも、すっかり免れることはできなかった。まして子貢以下の者はなおさらである。「咎あるに匪ず、艱むときは則ち咎无し」とは、富有はもともと咎があるものではなく、人が富有によって自ら咎をなすだけだということである。富有に処して艱難を知れば、自ずから咎はない。富有にいて思い悩み恐れ慎むことができなければ、驕り奢る心が生じる。咎があるゆえんである。</p>\n<p>本田の講説：子貢は孔子が諸国を流浪した時に財政を支えたと言われる、金儲けも弁舌も巧みな人である。『荘子』譲王篇に、孔子の弟子で最も貧乏な原憲の家の前を子貢が馬車で通りかかり、食うものも食えず痩せ細った原憲を哀れんで「先生、何ぞ病めるや」と言うと、原憲は「財産がないのを貧という。学んで行えないのを病という」と言い、子貢は顔を赤らめて詫びた、という話がある。</p>\n<p><span class=\"tag\">象伝について程伝</span>大有の初めにあって艱難を思えば、驕り奢る心は生じない。だから害に交わらない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>豊かさの始まり。富そのものは悪くないが、驕らず、身の処し方の難しさを思って慎めば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">大車以載、有攸往、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">大車以て載す。往く攸有り。咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大車以載、積中不敗也。」（大車以て載すとは、中に積みて敗れざるなり。）</div>\n<p>大きな車に荷を積んだ形。遠くまで行っても咎はない。</p>\n<p><span class=\"tag\">程伝</span>九は陽剛で二にいて、六五の君に寄りかかり任される（二と五は応じる）。剛健なのは才が優れていること、柔の位にいるのは謙順なこと、中を得ているのは過ちがないこと。その才がこのようなので、大有の重任に堪えられる。大きな車の材が強く盛んで重い物を載せられるようなものである。重任を負って遠くまで行ける。だから往く所があって咎がない。大有は豊かで盛んな時で、所有してまだ極まっていないので、九二の才で行けば咎はない。盛りが極まれば、もう進んではならない。</p>\n<p><span class=\"tag\">象伝について程伝</span>強く大きい車は、重く中に積んでも損なわれない。九二の才の強さが大有の任に堪えるようなものである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大きな責任を任され、それに堪える力がある。進んでも咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">公用亨于天子。小人弗克。</span></summary><div class=\"body\"><div class=\"yomi\">公、用て天子に亨（つう）ず。小人は克わず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「公用亨于天子、小人害也。」（公、用て天子に亨ずるも、小人は害あるなり。）</div>\n<p>諸侯たる者は、自分の所有を天子と通じあうものとする（公は公侯伯子男の爵位の公で、ここではおおまかに諸侯のこと）。小人物にはそれができない。朱子のテキストでは「亨」が「享」（朝見する）になっていて、朱子は両字が似ているので古い木版本では区別がはっきりしないと言う。程伝は「亨通」と熟語にしているので、亨の字のまま解していることは間違いない。</p>\n<p><span class=\"tag\">程伝</span>三は下体の上にいて、下にあって人の上にいる。諸侯の象である。公侯は上に天子を承け、天子は天下の尊位にいる。「普天の下、王土に非ざる莫し。率土の浜、王臣に非ざる莫し」（『詩経』北山。『孟子』にも引かれる）。下にいる者がどうしてその所有を独り占めできよう。土地の富、人民の多さは、みな王者の所有である。これが理の正しさである。三は大有の時に諸侯の位にいて豊かな富を持っているが、必ずそれを天子と通じさせ、自分の所有を天子の所有とする。人臣の常の義である。小人がここにいれば、富を独り占めして私とし、公にして上に奉ずる道を知らない。だから「小人は克わず」という。</p>\n<p>本田の講説：あらゆる土地は天子のもので、人民は土地を天子から貸し与えられているという観念である。中国は今でもそういう感覚だろうと思われ、土地の私有はまず考えていない。また韓非子の解釈では「公」は「私に背く」意味で、「私」はもともと「ム」だけで、自分のまわりに輪を書いて囲いこむ形、「公」の「八」は背く意味を表すという。</p>\n<p><span class=\"tag\">象伝について程伝</span>公は自分の所有を天子に通じるべきである。小人がここにいれば害をなす。昔から諸侯で臣節を守り、忠順に上に奉じる者は、その財力を蓄えて王の守りとなり、民の豊かさを上の用に備えた。小人がここにいれば、その富を自分の私とし、民が豊かになれば強さをほしいままにして不順をなす。小人が大いに所有すれば害をなすのである。 「蕃」は「繁」と同じ、「屏」は衝立、「翰」は翼の根元の大きな羽根で、王をかばい助けるもののたとえである。また豊かな所有は、小人物自身にとっても害となる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>豊かな富や地位を独り占めせず、上（公）のために役立てよ。私物化すれば害となる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九四</span><span class=\"t\">匪其彭、无咎。</span></summary><div class=\"body\"><div class=\"yomi\">其の彭（さか）んなるに匪ざれば、咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「匪其彭无咎、明辯晳也。」（其の彭んなるに匪ざれば咎无しとは、明弁晳（あき）らかなればなり。）</div>\n<p>豊かな所有があっても、勢いの盛んなことを鼻にかけなければ咎はない。</p>\n<p><span class=\"tag\">程伝</span>四は大有の時にいて、すでに中を過ぎている。大有の盛んな者である。盛りを過ぎれば凶咎が生じやすい。これに処する道は、その盛んさを誇らなければ咎がない。謙損して太盛に居座らないので咎がないのである。四は君に近い高位で、もし太盛に居座れば咎を招く。彭は盛んで多いさま。『詩経』載駆に「汶水湯湯たり、行人彭彭たり」（行進する兵士が多い）、大雅・大明に「駟騵（しげん）彭彭たり」（武王の軍馬の勢いが盛ん）とある。</p>\n<p>本田の講説：「謙損」の「損」は、『老子』の「之を損して又損す」のように欲望を減らすことである。</p>\n<p><span class=\"tag\">象伝について程伝</span>盛りに居座らずに咎を免れるのは、明らかに弁える智があるからである。晳は明智である。賢智の人は物の理を明らかに弁え、盛んな時に咎がやって来ることを知る。だから自らを抑え、満ち極まるところまで行かない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>勢いの盛りにある時。力を誇らず、控えめにしていれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">厥孚交如。威如吉。</span></summary><div class=\"body\"><div class=\"yomi\">厥（そ）の孚（まこと）交如たり。威如たるときは吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「厥孚交如、信以發志也。威如之吉、易而无備也。」（厥の孚交如たりとは、信以て志を発するなり。威如たるの吉は、易（あなど）りて備うる无ければなり。）</div>\n<p>上にも下にも真心をもってなごやかに交わる。ただし威厳がなければならない。威厳があれば吉。</p>\n<p><span class=\"tag\">程伝</span>六五は大有の時に君位にいて、中が虚である（陰爻は真ん中が切れているので虚心の意味。陽は充実、陰は空虚）。孚信の象である。人君が誠信をもって下に接すれば、下もまた誠信を尽くして上に仕え、上下が孚をもって交わる。柔で君位にいて大有の時に当たれば、人心は安んじやすいが、もっぱら柔順を尊べば侮り慢りが生じる。だから必ず威厳があってこそ吉である。威如とは威厳があることである。柔和で下に接すれば衆は喜び従うが、さらに威厳があって畏れさせる。大有に善く処する者である。</p>\n<p><span class=\"tag\">象伝について程伝</span>下の志は上に従うものである。上が孚信で下に接すれば、下も誠信を尽くして上に仕える。だから「厥の孚交如たり」。上に孚があることで下の孚の志を発する。下が上に従うのは、響きが声に応じるようなものである。威如が吉なのは、もし威厳がなければ、下は侮って戒め備えることがないからである。「備う」とは、上の求めに備えることである。</p>\n<p>本田の講説：お上は命令するもの、下々はお上の求めに応ずるべきものという、いかにも儒者らしい考え方がよく現れている。唐の韓愈の「原道」や、さらに遡れば孟子が「上に立つ者は人を治める能力があるから下々に養われる権利がある」と言ったのに通じる。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>真心をもって人と交わるのは良いが、柔らかいだけでは侮られる。威厳を併せ持てば吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">自天祐之、吉无不利。</span></summary><div class=\"body\"><div class=\"yomi\">天より之を祐（たす）く。吉にして利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「大有上吉、自天祐也。」（大有の上の吉なるは、天より祐くればなり。）</div>\n<p>天の助けがあって吉。何の不利もない。</p>\n<p>本田の講説：五が君主の位で、一番上は卦によって世捨て人だったり名誉職だったり、実権を離れた人に当たる。だから多くの卦では上爻の判断は良くないが、この卦では一番上が大変良い判断になる。</p>\n<p><span class=\"tag\">程伝</span>上は卦の終わりにいて、位のない地にいる。大有の極みでありながら、その有に居座らない者である。離（明）の上にいるのは明の極みで、至明であるがゆえに有に居座らず、過ぎることに至らない。有の極みで居座らなければ、満ちあふれる災いはない。理に順う者である。五の孚信の上に乗るのは、誠信を踏む義である。五には文明の徳があり、上は志を降してこれに応じる。賢を尊び善を崇ぶ義である。その身の処し方がこのようで、道に合うことの至りである。当然その福慶を受け、天より祐けられる。行いは天に順い、天祐を得る。だから行く所みな吉で、利あらざるはない。</p>\n<p><span class=\"tag\">象伝について程伝</span>大有の上は、有が極まって変ずべきところだが、その行いが天に順い道に合うので、天祐を受けて吉である。君子が満ちて溢れないのは天祐による。繋辞伝に「天の助くる所の者は順なり。人の助くる所の者は信なり。信を履み順を思い、又た以て賢を尚ぶ。是を以て天より之を祐く、吉にして利あらざる无し」とある。信を履むとは五（虚中の誠）の上に乗ること、順を思うとは謙退して有に居座らないこと、賢を尚ぶとは志が五の賢に従うことである。大有の世には満ちてはならず、豊かでさらに溢れるのは宜しくない。六爻はみな権力の位にいることを願うが、初と上だけはその位にいない。だから初九は咎がなく、上九は利あらざるなし。上は一番高い所にいながら信を踏み順を思うので、上にいて吉を得る。天から祐けられるのである。</p>\n<p>本田の講説：大有は他の卦と多少違い、良くなさそうな地位にいる者がかえって良い判断を得る。上九は豊かな所有の終わりで、ふつうなら悪いほうに転がりそうだが、富に奢らない謙虚な姿勢で良い結果を得る。受講者が「私が占うと遯の卦がよく出るのですが、遯も一番上が一番良いですね」と言うと、本田は、遯は隠遁を意味する卦なので位のない上爻が一番良い、と答え、ユングが患者に卦を立てさせたら落とし穴を意味する坎の卦ばかり出たので易を信じるようになった話をした。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>豊かさの極みにあっても奢らず、誠を踏み、賢者を尊べば、天の助けがあって万事吉。</div></div></details><div class=\"pager\"><a href=\"#gua-13\">← 天火同人</a><a href=\"#gua-15\">地山謙 →</a></div>", "gua-15": "<a class=\"back\" href=\"#gua\">← 30卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 15 卦　第二十八講〜第二十九講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地山謙</div><div class=\"yo\">ちざんけん</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☶ 艮</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-15\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-15\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-15\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-15\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-15\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-15\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-15\" data-jump=\"yao\">六爻</a></div><h3 id=\"g15-s0\">卦の名と象</h3>\n<p>上半分が大地、下半分が山。大地の下に山がある形の卦である。『易経』のなかでも良い卦とされ、老荘思想とも通じるところがあることからも尊ばれる。</p>\n<p>程伝（序卦伝を引く）：「大を有する者は以て盈つ可からず。故に之を受くるに謙を以てす」。所有がすでに大きければ、満ちあふれるところまで行ってはならず、必ず謙遜して欲を減らさねばならない。だから大有の後に謙が来る。卦は上が坤、下が艮で、地の中に山がある。地の体は低い。山は高くそびえるものなのに地の下にいる。謙の象である。崇高な徳を持ちながら卑しい者のさらに下にへりくだる。謙の義である。</p>\n<p>本田の講説：高い徳を持ちながら下々にへりくだるという、老子流の処世術に通じる。</p>\n<h3 id=\"g15-s1\">卦辞</h3>\n<div class=\"orig\">謙、亨。君子有終。</div>\n<div class=\"yomi\">謙は亨る。君子は終り有り。</div>\n<p>謙遜であれば願いは通る。君子としての行いがあれば有終の美を遂げる。</p>\n<p>本田の講説：『詩経』大雅・蕩に「初め有らざるは靡し、克く終わり有るは鮮し」とある。誰でも初めはきちんとやるが、終わりまで同じ態度を持続できる者は少ない。王朝を立てた最初はたいていちゃんとした政治をするが、安定すると贅沢で自堕落になって初心を忘れる。「終り有り」とは創業の初心を最後まで貫くことである。</p>\n<p><span class=\"tag\">程伝</span>謙には亨る道がある。徳があって居座らない、これを謙という。人が謙巽で身を処せば、どこへ行っても通らないことがあろう。「君子は終り有り」とは、君子は志が謙巽にあり、理に達しているので、天命を楽しんで競わず、内が充実しているので退き譲って誇らない。安んじて謙を踏み、終身変わらない。自らを低くして人はますます尊び、自らを隠して徳はますます輝く。これが君子の終わり有りである。小人は欲があれば必ず競い、徳があれば必ず誇る。勉めて謙を慕っても、安んじて行い固く守ることができず、終わりまで全うできない。</p>\n<h3 id=\"g15-s2\">彖伝</h3>\n<div class=\"orig\">謙亨、天道下濟而光明、地道卑而上行。天道虧盈而益謙、地道變盈而流謙、鬼神害盈而福謙、人道惡盈而好謙。謙尊而光、卑而不可踰。君子之終也。</div>\n<p>謙は亨る。天道は下済して光明なり。地道は卑くして上り行く。天道は盈ちたるを虧（か）きて謙に益し、地道は盈ちたるを変じて謙に流（し）き、鬼神は盈ちたるを害して謙に福し、人道は盈ちたるを悪みて謙を好む。謙は尊くして光り、卑くして踰ゆ可からず。君子の終りなり。</p>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「済」は「際（まじわる）」とすべきである（同音で仮借している）。謙で亨る義を明らかにする。天の道は気が下に交わるので万物を化育でき、その道は光明である。地の道は低い所にいるので、その気は上に行って天に交わる。いずれも卑く降ることで通じるのである。本田は、天地の気が交わって万物が生まれるというのは、動物が雌雄で生殖することからの連想で、中国では古くから言われると説明する。</li><li>天道は盈ちたるを虧く：天の運行で言う。満ちるものは欠け、謙なるものは増す。日月・陰陽がそうである。本田によれば、重点は月の満ち欠けにあり（太陽は欠けないが熟語として日月と言った）、季節も陽気が満ちれば陰気が欠けて暑くなり、陰気が満ちれば陽気が欠けて寒くなる。</li><li>地道は盈ちたるを変ず：地勢で言う。満ちたもの（高い山）はやがて傾き崩れ、低いもの（谷）にはすべての水が流れ込んでやがて滔々たる大河となる。</li><li>鬼神は盈ちたるを害す：鬼神とは造化の迹（陰陽の気が目に見える形になったもの）である。満ちたものには禍を下し、謙損する者には福を与える。過ぎれば減らし、足りなければ足す、みなそうである。本田によれば、宋代の学者は鬼神から神秘性をはぎ取って合理的に定義しようとした。程伊川と同じ北宋の張載（横渠先生）も「鬼神は二気の良能」（陰陽の気の良き働き）と述べている。</li><li>人道は盈ちたるを悪む：人情は満ちてふんぞり返る者を憎み、好んで謙遜する者に味方する。謙は人の至徳で、だから孔子は天・地・鬼神・人と並べて詳しく述べた。盈を戒め謙を勧めるためである。</li><li>謙は尊くして光る：謙は卑巽だが、その道は尊く大きく光り輝く。身の処し方は卑くても、その徳は実に高く、誰もしのげない。これが「踰ゆ可からず」である。君子が謙に至誠であれば、常に変わらず終わりがある。だから尊くして光る。</li></ul>\n<h3 id=\"g15-s3\">大象</h3>\n<div class=\"orig\">地中有山、謙。君子以裒多益寡、稱物平施。</div>\n<div class=\"yomi\">地中に山有るは謙なり。君子以て多きを裒（と）りて寡（すくな）きに益し、物を称（はか）りて施しを平らかにす。</div>\n<p>大地の下に山がある、これを謙という。君子はこれにのっとって、多すぎるものを削り取って少ないものに増やし、物それぞれにかなうように施しを公平にする。「裒」はふつう「あつめる」意味だが、それでは文意が通じないので、程伝は「裒取」として「とる」意味に解している。</p>\n<p><span class=\"tag\">程伝</span>地の体は低い。高く大きな山が地の中にある。外は低く、内に崇高なものを包んでいる。だから謙という。「山、地中に在り」と言わず「地中に山有り」と言うのは、低いものの中に高いものを包むという意味だからで、高いものが低いものの中に集まると言えば文の筋が通らない。他の大象もみなそうである。君子は謙の象を見て、高いものは低くし低いものは高くする、高きを抑え低きを挙げ、過ぎたものを減らし及ばないものを増すという義を見る。これを事に施せば、多い者から取り、少ない者に増し、物の多寡に応じて施しを公平にし、その平らかさを得させる。</p>\n<h3 id=\"g15-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>貞吉の二義。</b> 六二の程伝によれば、「貞吉」には「貞であってしかも吉」と「貞を得れば吉」の二通りがある。謙の六二は前者で、自分に貞と吉の両方が備わっている（後者の例として本田は賁の九三、晋の初六、損の上九を挙げる）。</li><li><b>大学講座での占い。</b> 本田が大阪市立大学の市民大学講座で易の概説をし、「誰か立ててみませんか」と言うと、一番前のおじいさんが手を挙げ、謙の六二が出た。「あなたはよほど謙遜なお人柄ですね」と言ったら、後で講座の世話をしていた三浦国雄が「先生、あれは違います。あのおじいさんが一番厚かましい。いつでも手を挙げる。もっと謙遜にせよという判断ですよ」と言った。</li><li><b>道学の心理分析。</b> 九三の程伝について、本田は、道学は非常に厳しい禁欲的な倫理学だが、心理的に掘り下げた細やかな分析がある、と言う。高い地位を願い人に勝つことを好むのは人の常で、謙遜の善を知って努めても、功を誇る心が残っていれば長続きしない。ただ君子だけが安らかに謙を踏み、それが常の行いになる。</li><li><b>善は結果を求めてするものではない。</b> 九三の程伝は、繋辞伝の「謙は恭を致して以て其の位を存する者なり」について、君子が謙を踏むのは常の行いであって、地位を保つためにするのではなく、恭しさを尽くした結果として地位が保たれるのだ、と説く。ことわざに「善をなせば令名（良い名）がある」と言うのも、令名は善をなした結果だという意味である（『左伝』襄公四年に「令名は徳の輿なり」、『礼記』内則に「父母没すと雖も、将に善を為さんとす。父母に令名を貽（のこ）さんと思う」）。本田は、いかにも道学者らしい厳格な考え方で、カントの『実践理性批判』が、善行は幸福を目的としてなしてはならず、内なる道徳律に命ぜられるままに行い結果を問うべきではないとするのと似たところがある、と言う。『礼記』内則は男女の別を細かく定め、洗濯物を同じ竿に干してはならない、物を受け渡す時も手が触れないよう床に置け、とまで言う。礼で最も警戒されるのは兄嫁と弟の関係で、家の中で顔を合わせても物を言ってはならない（曲礼）。</li><li><b>謙遜にも限度。</b> 謙の卦なのに六五・上六に征伐の文句があるのは、謙遜も施す所を誤れば打たれることがあるということであり、君主の謙柔は行き過ぎを防ぐべきだからである。</li><li><b>易は富を否定しない。</b> 六五の程伝は「富は衆の帰する所」と言う。本田は、道学者にしては開けた発想のようだが、『易経』はもともと富を否定していない、繋辞伝に「何を以て人を聚む、財と曰う」「富有之を大業と謂う」「崇高は富貴より大なるは莫し」とある、と説明する。</li></ul>\n<h3 id=\"g15-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>謙遜であれば願いは通り、有終の美を遂げる。</li><li>へりくだるほど人に尊ばれ、徳は輝く。</li><li>謙遜は努めて装うのではなく、心から自然に出るものであれ（六二）。</li><li>功労があっても誇らなければ、万民が服する（九三）。</li><li>上にも下にも謙を施せ（六四）。</li><li>ただし謙遜一辺倒ではなく、従わない者には威厳と武力も必要（六五・上六）。</li></ul><h2 class=\"sec\" id=\"g15-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">謙謙君子、用涉大川、吉。</span></summary><div class=\"body\"><div class=\"yomi\">謙謙たる君子、用て大川を渉る。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「謙謙君子、卑以自牧也。」（謙謙たる君子は、卑以て自ら牧（やしな）うなり。）</div>\n<p>謙遜の上にも謙遜な君子である。この態度なら大川を渡る冒険をしてもよい。吉。</p>\n<p><span class=\"tag\">程伝</span>六は柔順で謙の卦にいて、しかも一卦の一番下にいる。自らを最も低い所に置く者で、謙のうえにも謙である。だから「謙謙」という。このような者が君子である。自ら至謙にいれば、衆がともに味方する。険難を渡っても害はない。まして平易な時はなおさらで、どこへ行っても吉である。ある人が「謙に過ぎるのではないか」と問うた。答え：柔が下にいるのは常の道で、謙の至りを示すために謙謙と言ったのである。その失を見るべきではない。</p>\n<p><span class=\"tag\">象伝について程伝</span>謙謙は謙の至りで、君子が謙卑の道で自らを牧う（自らを処す）ことである。『詩経』邶風・静女に「牧より荑を帰る」とある。本田によれば、ふつうは「牧より」と読んで牧草地から芽の出たばかりのチガヤを贈ると解し、後漢の鄭玄から欧陽修・朱子まで同じだが、程伊川は「自ら牧（やしな）う」と読んでいるらしい。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>とことんへりくだれば、誰もが味方する。冒険してもよく、吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">鳴謙。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">鳴謙す。貞にして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鳴謙貞吉、中心得也。」（鳴謙の貞吉なるは、中心得ればなり。）</div>\n<p>謙遜の美徳が声や顔色にまで現れる。正しくて吉。</p>\n<p><span class=\"tag\">程伝</span>二は柔順で中にいて、謙の徳が中に積もり満ちている。だから外に発して声音・顔色に現れる。だから鳴謙という。中にいて正を得ており、中正の徳がある。だから貞吉という。</p>\n<p><span class=\"tag\">象伝について程伝</span>二の謙徳は至誠が中に積もっているので声音に発するのであって、心の中に自ずから得ているもので、努めてそうしているのではない。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>謙虚さが自然に表に現れる。正しくて吉。（ただし、図々しい人がこれを得たら「もっと謙遜にせよ」の意。）</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九三</span><span class=\"t\">勞謙君子、有終、吉。</span></summary><div class=\"body\"><div class=\"yomi\">労謙たる君子、終り有り。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「勞謙君子、萬民服也。」（労謙たる君子は、万民服するなり。）</div>\n<p>功労がありながら謙遜な君子である。有終の美を遂げる。吉。この卦では九三だけが陽である。</p>\n<p><span class=\"tag\">程伝</span>三は陽剛の徳で下体にいて、衆陰の宗とするところとなり、位を得て下体の上にいる。上は君に任じられ、下は衆に従われる。功労があって謙徳を保つ者で、だから労謙という。昔の人でこれに当たるのは周公である。身は天下の大任に当たり、上は幼弱な君を奉じ、謙恭に自らを牧い、夔夔（きき）として畏れるようであった。功労があってよく謙遜な人と言える。そのうえ君子の道で行い、終わりがあれば吉である。高きを好み勝つことを喜ぶのは人の常で、ふだんからよく謙遜する人は少ない。まして尊ぶべき功労がある場合はなおさらである。謙の善を知って努めても、功を誇る心を忘れなければ長続きせず、終わりを全うできない。ただ君子だけが安らかに謙を踏み、それが常の行いなので、久しくして変わらない。これが終わり有りで、終わりがあれば吉である。九三は陽剛で正位にいて、謙徳で終わりを全うする者で、この爻の徳が最も盛んなので、爻辞は特に重んじている。</p>\n<p>本田の講説：周王朝は武王が始めた。文王は天下の三分の二を持ちながら殷の紂王に幽閉されても背かなかった。武王が革命の旗を揚げて紂を倒し、武王の弟が周公、子が成王である。武王が早く亡くなって幼い成王が即位すると、周公が摂政となり、成王を背負って玉座に座り、周公の言葉がみことのりとされた。一族のなかに心穏やかでない者がいて反乱を起こしたが、周公は容赦なくつぶした。周公が天子になりたがっているという噂が立つと、恐れて一旦東の地（後の魯）に退いた。夔は甲骨文では一本足の怪物の象形らしく、『書経』大禹謨では二つ重ねて畏れ慎む意味を表す。</p>\n<p><span class=\"tag\">象伝について程伝</span>功労があって謙遜な君子には、万民が尊び服する。繋辞伝に「労して伐（ほこ）らず、功有りて徳とせず、厚の至りなり。其の功を以て人に下る者を語るなり。徳は盛と言い、礼は恭と言う。謙なる者は、恭を致して以て其の位を存する者なり」とある。功労があって自ら誇らず、手柄があって恩に着せない、徳の広く厚い至りである。功労がありながら自ら謙遜して人に下るのである。徳から言えば至って盛ん、礼から言えば至って恭しい。これが謙である。存とは守ることで、恭を尽くして位を守るので、高くても危うくなく、満ちても溢れず、だから終わりに吉である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>大きな功績がありながら謙虚を貫けば、万民が服し、有終の美を遂げる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六四</span><span class=\"t\">无不利、撝謙。</span></summary><div class=\"body\"><div class=\"yomi\">利あらざる无し。謙を撝（ひろ）む。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「无不利撝謙、不違則也。」（利あらざる无し謙を撝むとは、則に違わざればなり。）</div>\n<p>謙遜の徳を広く施しても何の不利もない。</p>\n<p><span class=\"tag\">程伝</span>四は上体にいて君にごく近い。六五の君は謙柔で自らを処し、九三は大きな功徳があって上に任じられ衆に尊ばれているが、四はその上にいる。だから上には恭しく畏れて謙徳の君を奉り、下には腰を低くして労謙の臣に譲るべきである。動作・行いすべて謙を撝むのがよく、そうすれば不利はない。撝とは広く施すこと、人が手を振って物をばらまくようなものである。動くも進退も必ず謙を施す。四は畏れの多い地にいて、しかも労臣の上にいるからである。</p>\n<p>本田の講説：五を君主とすれば、四はお公家さま、三は侍大将のようなものである。四は上半分の一番下で、上層に属してはいるがいつ下層に転落するかわからない位置で、乾の九四でも「或は躍りて淵に在り」と迷う位置であった。</p>\n<p><span class=\"tag\">象伝について程伝</span>およそ人の謙は施すべき所があり、宜しきを過ぎてはならない。六五に「用て侵伐するに利あり」とあるのがそれである。ただ四は君に近い地にいて労臣の上に乗っているので、動作すべて謙を広く施すのがよい。このようにしてこそ法則にかなう。だから「則に違わず」という。宜しきを得ているのである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上にも下にもへりくだり、広く謙遜を施せば不利はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">不富以其鄰。利用侵伐。无不利。</span></summary><div class=\"body\"><div class=\"yomi\">富まずして其の鄰と以にす。用て侵伐するに利あり。利あらざる无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「利用侵伐、征不服也。」（用て侵伐するに利ありとは、服せざるを征するなり。）</div>\n<p>富の力によらなくても、隣人が行動をともにしてくれる。従わない者は征伐するがよい。万事に有利。</p>\n<p><span class=\"tag\">程伝</span>富は衆の帰するところで、ただ財だけが人を集めることができる。五は君の尊さをもって順を執り下に接するので、衆が帰する。だから富を用いずに隣人を有する。隣とは近いことで、富まずして人の親しみを得るのである。人君が謙順を保つのは天下の心が帰するところである。しかし君道はもっぱら謙柔を尊んではならない。必ず威武で助けあってこそ天下を懐け服させられる。だから侵伐を行うに利がある。威と徳が並び現れて初めて君道の宜しきを尽くし、利あらざるなし。五の謙柔は過ぎることを防ぐべきなので、この義を発したのである。</p>\n<p><span class=\"tag\">象伝について程伝</span>文徳と謙遜では服させられない者を征伐するのである。文徳で服させられないのに武を用いなければ、どうして天下を平らげ治められよう。それは人君の中道ではなく、謙の行き過ぎである。</p>\n<p>本田の講説：「文徳」の出典は『論語』の「遠人服せざれば、則ち文徳を修めて以て之を来す」である。中国の歴史では異民族に征服された王朝もいくつかあるが、最後はその異民族が中国の文化に同化してしまう。文徳とは、そういう文化的な感化を及ぼす徳のことである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>富の力によらず人が集まる。謙虚だけでなく、従わない者には毅然と臨め。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">鳴謙。利用行師、征邑國。</span></summary><div class=\"body\"><div class=\"yomi\">鳴謙す。用て師を行（や）り、邑国を征するに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「鳴謙、志未得也。可用行師、征邑國也。」（鳴謙すとは、志未だ得ざればなり。用て師を行り、邑国を征す可きなり。）</div>\n<p>謙遜な人が志を遂げられない不平の気持ちが声色にまで現れる。軍を出して、言うことを聞かない自分の領地を征伐するがよい。「鳴謙」は六二にもあるが、ニュアンスが少し違う。</p>\n<p>本田の講説：中国の貴族はみな城壁に囲まれた町に住み、領地は城外の田舎にあって、ふだんは代官に支配させている。これが「邑国」である。孔子も若い頃、魯の家老の領地の代官を務めたことがある。代官は税を取り立てて主人に届けるのが職務だが、つい自分の懐に入れたくなり、しまいには領地を拠点に反乱を起こしたりもする。</p>\n<p><span class=\"tag\">程伝</span>六は柔で柔順（坤）の極みにいて、謙の極みにもいる。謙を極める者である。謙の極みでありながら一番高い所にいて、謙の志を遂げられないので、声に発するに至る。また柔で謙の極みにいるので、謙が声色に現れる。だから鳴謙という。位のない地にいて天下の事を任されているのではないが、人の身の行いは必ず剛柔が助けあうべきである。上は謙の極みで、甚だしすぎればかえって過ぎることになる。だから剛武で自らを治めるべきである。邑国とは自分の私有地、師を行るとは武を用いること、邑国を征すとは自分の私有地を自ら治めることである。</p>\n<p><span class=\"tag\">象伝について程伝</span>謙が極まって上にいて、謙であろうとしてもその志が遂げられないので、切実さにたえず声色に出る。位に当たってはいないが謙はすでに極を過ぎた。剛武で自らを治めるべきで、だから「用て師を行り、邑国を征す可し」という。</p>\n<p>本田の講説：受講者が「上はたいてい隠者で何もしないのかと思ったら、この卦では自ら軍を出すのですね」と言った。本田は、上六は九三と対応し、九三は卦のなかで最大の功労者・実力者だが、これがあまり威張りすぎると、上六が腹に据えかねて、隠者の身ながら自ら九三を討つのだ、と答えた。儒教は戦争を全否定しない。孟子は「春秋に義戦無し。彼此より善きは則ち有り」と言ったが、それは春秋以前には正義の戦争があったということで、周の武王の戦いは暴君の国を討つ正義の戦争だったので、東を攻めれば西の民が「なぜわが国を先に攻めてくれないのか」と恨み、敵兵は矛を逆さにして自分の君主に向かった。老荘は戦争を肯定せず、『老子』に「兵は不祥の器」とある。受講者が「毛沢東は老荘を尊敬したのでは。儒教のほうが戦争を否定するのかと思っていた」と言うと、本田は「儒教のほうが正義の戦争を信じているんです。老荘は戦争を全否定します」と答えた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>謙遜が過ぎて志が遂げられず、不満が表に出る。身近な所の乱れは毅然と正せ。</div></div></details><div class=\"pager\"><a href=\"#gua-14\">← 火天大有</a><a href=\"#gua-16\">雷地豫 →</a></div>", "gua-16": "<a class=\"back\" href=\"#gua\">← 30卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 16 卦　第三十講〜第三十一講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">雷地豫</div><div class=\"yo\">らいちよ</div><div class=\"tri\">上卦 ☳ 震　／　下卦 ☷ 坤</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-16\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-16\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-16\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-16\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-16\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-16\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-16\" data-jump=\"yao\">六爻</a></div><h3 id=\"g16-s0\">卦の名と象</h3>\n<p>豫は「よろこぶ」「たのしむ」の意味である。天子の病気のことを「不豫」（機嫌がすぐれない）という。『書経』に「王疾有り、豫ばず」とあり、本田が子どもの頃には新聞でもこういう書き方をしていた。また『老子』に「豫として冬に川を渉るが若く、猶として四隣を畏るるが若し」とあり、「豫」「猶」は「執行猶予」の熟語になるように、どちらもゆっくりする、ためらうというニュアンスがある。爻辞にもそういう意味で使われる例がある。</p>\n<p>程伝（序卦伝を引く）：「大を有して能く謙なれば、必ず豫ぶ。故に之を受くるに豫を以てす」。序卦伝はふつう一つ前の卦との関連で説くが、ここは大有と謙の二卦を受けて説明している。所有が大きいうえに謙遜であれば、必ずゆったりとした喜びがある。豫とは安らぎ・和らぎ・喜び・楽しみである。</p>\n<ul class=\"sen\"><li>卦は上が震（雷・動く）、下が坤（地・順う）。順って動く象で、動いて和順するから喜ぶ。</li><li>九四だけが陽で、動きの主である。上下の群陰がみな応じ、坤もまた順って受け止める。九四が動いて上下が順応するので、和らぎ喜ぶ意味になる。</li><li>二象で言えば、雷が地の上に出た形。陽気は初め地中に閉じこもって潜んでいたが、動いて地上に出ると声を奮い、伸びやかになって万物が和らぎ楽しむ。だから豫という。</li></ul>\n<h3 id=\"g16-s1\">卦辞</h3>\n<div class=\"orig\">豫、利建侯行師。</div>\n<div class=\"yomi\">豫は、侯を建て師を行るに利あり。</div>\n<p>この卦が出たら、諸侯を藩屏として立て、軍隊を動かすのによい。諸侯を「藩屏」というのは、藩はまがき、屏は屏風で、天子の身を守るものとして諸侯があるという考えによる。</p>\n<p><span class=\"tag\">程伝</span>豫は順って動くことである。豫の義として利があるのは、侯を建て師を行ることである。侯を建て屏を樹てるのは、ともに天下を安んずるためである。諸侯が和順すれば万民は喜び服する。軍が起こる時、衆心が和らぎ喜べば、順って功がある。だから悦豫の道は侯を建て師を行るに利がある。また上が動き下が順うのは、諸侯が王に従い、軍が命令に順う象である。万邦に君臨し大衆を集めるのは、和らぎ喜ばせるのでなければ服従させられない。</p>\n<h3 id=\"g16-s2\">彖伝</h3>\n<div class=\"orig\">豫、剛應而志行、順以動、豫。豫順以動、故天地如之、而況建侯行師乎。天地以順動、故日月不過、而四時不忒。聖人以順動、則刑罰清而民服。豫之時義大矣哉。</div>\n<div class=\"yomi\">豫は、剛応じて志行わる。順以て動くは豫なり。豫は順以て動く。故に天地も之の如し。而るを況んや侯を建て師を行るをや。天地は順を以て動く。故に日月過たずして四時忒（たが）わず。聖人は順を以て動く。則ち刑罰清くして民服す。豫の時義大なるかな。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>「剛応ず」とは、四が群陰に応じられること、剛が衆の応を得ること。「志行わる」とは、陽が上に進み、動いて上下が順い、その志を得ること。「順以て動く」とは、震が動き坤が順で、動いて理に順うこと。理に順って動けば、衆もまた順う。だから豫である。</li><li>理に順って動けば、天地もこのようで違わない。まして侯を建て師を行るのに、天地万物の理に順わないでよかろうか。ただ至順であることである。大人が天に先んじ天に後れても違わない（乾の文言伝）のは、理に順うからである。</li><li>天地の運行は順をもって動くので、日月の度は過たず、四時の巡りは狂わない。聖人は順をもって動くので、政治の筋道が正しく民は善に奮い立ち、刑罰は簡素でほとんど行わなくても万民が服する。</li><li>順動の道を言い尽くしたが、その味わいは深く長く、言い尽くしても余りがあるので、ふたたび「豫の時義大なるかな」とたたえた。人がその理を研究し味わい、ゆったりと泳ぐように（優柔涵泳）して悟ることを望んだのである。「時義」とは豫の時のこと。諸卦で時と義用の大きいものはみな「大なるかな」とたたえる。豫・随・遯・姤・旅は「時義」、坎・睽・蹇は「時用」、頤・大過・解・革は「時」という。それぞれ大きなものによって言う。</li></ul>\n<p>本田の講説：「優柔」は日本語では「優柔不断」のように良い意味に使わないが、中国の古典（『国語』など）では余裕があるという良い意味である。受講者に「時用とはどういうことか」と問われ、本田は、時義と時用ははっきり分けられないと思う、義は宜に通じるので時義は時宜、時機の効用で、時用は臨機にその卦が役立つこと、いつも使うものではなく特殊な時に使う効用だ、と答えた。たとえば坎は落とし穴でいつも使うものではないが、敵に攻められるような時に役立つ、それが坎の時用である。</p>\n<h3 id=\"g16-s3\">大象</h3>\n<div class=\"orig\">雷出地奮、豫。先王以作樂崇德、殷薦之上帝、以配祖考。</div>\n<div class=\"yomi\">雷、地を出でて奮うは豫なり。先王以て楽を作り徳を崇び、殷（さか）んに之を上帝に薦め、以て祖考を配す。</div>\n<p>雷が地上に出てとどろく、これが豫である。押さえつけられていた地下の陽気がいっぺんに爆発し、春になった喜びを示す。昔の聖王はこれにのっとって、音楽を作り、すぐれた君主の徳を尊び、盛大に天の神に供え、祖先と亡き父を天の神と合わせ祭った。受講者が「崇徳上皇の名はこの文句から取ったのですか」と問い、本田は「そうでしょう」と答えた。</p>\n<p><span class=\"tag\">程伝</span>雷は陽気が奮発し、陰陽が迫りあって声をなすものである。陽気は初め地中に閉じこもって潜み、動くに及んで地を出て奮い震える。初めは閉ざされふさがっていたのが、奮発すれば伸びやかに和らぎ楽しむ。だから豫である。坤は順、震は発。和順が中に積もって声に発するのは楽（音楽）の象である。先王はこの象を見て音楽を作り、功徳をほめたたえ、その盛んなあまり上帝に薦めるに至り、祖考をあわせ祭った。殷は盛んなこと。礼に「殷奠」（盛んな供え物）がある。上帝に薦め祖考を配するのは盛んさの至りである。</p>\n<p>本田の講説：「帝」という字はもともと植物のうてなの象形で、うてなから花が咲くので生命の源の象徴とした。そこに篝火のようなものがついて今の帝の字になったらしい。帝は万物の起源、天の神様で、人間の帝王の意味に使うのは春秋時代くらいからで、戦国時代には「西帝」「東帝」の例がある。秦の始皇帝は、三皇五帝のように皇も帝も高い地位を表していたので、二つを合わせて「皇帝」とした。三皇の時代の後に五帝の時代が来ると考えるが、いずれも神話的な人物である。日本の「天皇」の称については、道教の天皇・地皇・人皇の天皇を採用したという説を盛んに言う人がいて、福永光司がそう言っており、津田左右吉もそう考えていたかもしれないが、戦前のことなのであからさまには言えなかった。「祖」は祖先、「考」は亡き父（今でも「先考」という）。周王朝は后稷（農業を教えたとされる伝説上の始祖）や文王を天と合わせ祭った。</p>\n<h3 id=\"g16-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>「藩屏」の語源。</b> 第三十一講の冒頭、前回の卦辞の説明で出た「藩屏」の語源について質問があった。本田の答え：『詩経』大雅・板に「价人（かいじん）維れ藩」、一句飛ばして「大邦維れ屏」とある。价人は武装した兵士、藩は垣根、大邦は王者の周りに立てられた諸侯の国、屏は衝立である。これが典拠となって、『左伝』『史記』『漢書』などに「藩屏」という熟語として出てくる。</li><li><b>蒋介石の名。</b> 六二の爻辞「石に介たり」について、受講者が「蒋介石というのはここから取ったのですか」と問うた。本田は、そのはずで、よくこの字を見つけて来たものだ、きっと蒋介石自身がこの文句を常々心に留めていたのだろう、と答えた。「介」はもともと魚介類の介で堅い意味であり、鎧の意味にも、武装する意味にも用いる。</li><li><b>応がない方がよい場合。</b> 六二には上に応がない（二と五がともに陰）。受講者が「応がない方がかえっていいのですか」と問うと、本田は、普通は応がある方が良く、上に対応がないのは心細いことだが、この場合は、すべての人が安逸をむさぼっている時に自分の正義を守り抜く象徴になる、と答えた。</li><li><b>ぐずぐずするな。</b> 受講者が「中国ではどちらかというと慎重な行動を善しとすることが多いように思うが、ここでは反対ですね」と言うと、本田は、易でも慎重に行動せよと言う方が多いが、ここでは「日を終えず」ぱっと立ち上がれと言っている、と答えた。</li><li><b>幾を知る。</b> 六二の程伝は、繋辞伝下の「幾を知るは其れ神か。君子は上交して諂わず、下交して瀆れず……君子は幾を見て作つ。日を終うるを俟たず……君子は微を知り彰を知り、柔を知り剛を知る。万夫の望みなり」を逐一解釈する（六爻の六二を参照）。</li><li><b>爻辞に「豫」の字がない爻。</b> 初六「鳴豫」、六三「盱豫」、九四「由豫」、上六「冥豫」と、この卦の爻辞には豫の字が入ることが多いが、六二にはない。安逸の喜びに背を向けてぱっと立ち上がることのできる人だからである。</li><li><b>九四への警戒の言葉がない理由。</b> 九四は君主に近い強い大臣で、君主に取って代わると疑われやすい危険な立場だが、易の作者は九四の行動そのものを戒めず、ただ「至誠をもって疑う勿れ」とだけ言った。豫は和順の道で、九四は和順によって臣下としての正しい態度を失っていないからである。危うさは九四ではなく、六五の爻辞で「下に迫られる君主」として示される。</li><li><b>暗愚の君と時代。</b> 六五の程伝は「漢・魏末世の君」を例に挙げる。本田によれば、漢全体ではなく後漢から魏への転換期のことで、司馬光『資治通鑑』は後漢の四代目からが悪いとし、魏は曹操が後漢から無理やり位を譲らせたという成り立ちがけしからんとされる。今の目から見れば曹操は英雄だが、道学者はみな劉備に肩入れする。君主が危亡を招く道は一つではないが、安逸を貪るケースが一番多い。</li><li><b>程伊川の時代背景。</b> 上六の講説で本田は、漢の武帝の詩に「歓楽極まって哀傷多し」とあるように歓楽の極まりにはいずれ悲しみが来る、と言い、程伊川の生きた時代も外国（遼や金）を相手に軟弱外交ばかりしていたので、正義派の程伊川が政治の実情を憂え、この卦に随分と力のこもった注を書いたのもそれと関係があるかもしれない、と述べる。</li></ul>\n<h3 id=\"g16-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>豫は喜び・安らぎの時だが、喜びに溺れれば正を失う。この卦の爻の多くは正を得ていない。</li><li>引き立てを得て有頂天になり、喜びを声に出すようでは凶（初六）。</li><li>安逸の誘惑には、兆しを見て一日もたたないうちに断ち切って立ち上がれ（六二）。</li><li>上の顔色をうかがってぐずぐずしても、軽々しく動いても悔いがある。自分の身を正すしかない（六三）。</li><li>天下の重責を負う者は、至誠を尽くし、疑念を抱かなければ助けが集まる（九四）。</li><li>喜びに目が眩んでも、態度を改めれば咎はない（上六）。</li><li>占断は一律ではない。震為雷の実例のように、卦辞の全体の意味（初めは恐ろしいが後で笑い話になる）から判断する。</li></ul><h2 class=\"sec\" id=\"g16-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">初六</span><span class=\"t\">鳴豫。凶。</span></summary><div class=\"body\"><div class=\"yomi\">鳴豫す。凶なり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「初六鳴豫、志窮凶也。」（初六の鳴豫するは、志窮まりて凶なり。）</div>\n<p>声を上げて喜んでいる。しかし結果は凶となる。</p>\n<p><span class=\"tag\">程伝</span>初六は陰柔で下にいる。四は豫の主であり、これに応じる（初と四は陰と陽で引き合う）。これは中も正も得ていない小人で、豫の時にいて上に寵愛される者である。その志が満ち足りて喜びにたえず、声音に発するに至る。軽々しく浮ついた態度はこのようで、必ず凶に至る。鳴とは声に発することである。</p>\n<p>本田の講説：豫という時の主体は九四である。中というのは二と五、正というのは奇数の位に陽、偶数の位に陰があることをいう。初六は上の強い人の引き立てを受けて志が満ち足り、喜びが声にまで現れる。</p>\n<div class=\"kd\"><span class=\"kl\">象伝</span>志が行き着くところまで行って、結果が悪い。程伝：象伝でわざわざ「初六」とかぶせたのは（程伝によれば、象伝でいちいち「初六の」と言い直すことは滅多にない）、陰柔で一番下にいることを強調するためである。気持ちが高ぶって喜びを声にまで現す、驕りわがまま過ぎであり、必ず窮まって凶に至る。</div>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>引き立てを得て有頂天になり、喜びを人前で誇る。驕りが窮まって凶。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">介于石。不終日。貞吉。</span></summary><div class=\"body\"><div class=\"yomi\">石に介たり。日を終えず。貞にして吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不終日貞吉、以中正也。」（日を終えず、貞吉なるは、中正を以てなり。）</div>\n<p>この人の操は石のように堅い。危ういと見れば、一日を終えずに立ち上がる。動機は正しく、結果は吉である。</p>\n<p><span class=\"tag\">程伝</span>逸豫の道は、放置すれば正を失う。だから豫の諸爻はほとんど正を得ておらず、時と合わない（こうすべき時にこうしない）。ただ六二だけは中正で、しかも応がない（二と五がともに陰で引き合わない）。自らを守る象である。豫の時に当たって、ひとり中正をもって自らを守る、特立の操と言うべきで、その節介は石のように堅い。「石に介たり」とは、堅いことが石のようだということである（「于」はここでは「如」の意味）。凡人は楽しみ喜びの時には心がそれに浸り、ぐずぐずとしてついには耽溺してやまない。二は中正をもって自らを守り、その堅さは石のようで、豫を去る速さは一日を終えるのを待たない。だから正しくて吉である。豫にいつまでも安んじぐずぐずしていてはならない。ぐずぐずすれば溺れる。六二のような者は「幾を見て作つ」と言える。</p>\n<p>繋辞伝の解釈（程伝）：</p>\n<ul class=\"sen\"><li>「幾を知るは其れ神か。君子は上交して諂わず、下交して瀆れず」：事の兆しを見るのは神妙なことである。君子が上と交わってへつらいに至らず、下と交わって狎れ狎れしさに至らないのは、幾を知るからである。上と交わるには恭巽（巽は遜と同じ）をもってするので、過ぎればへつらいになる。下と交わるには和易をもってするので、過ぎれば狎れになる。君子は幾微を見るので、過ぎるに至らない。</li><li>「幾とは動の微、吉の先に見わるる者なり」：幾とは動き始めのかすかなものであり、吉凶の端緒で、先に見えるがまだはっきりしないものである。「吉」だけ言うのは、先に見て取れば凶に至ることはありえないからである。本田によれば、朱子は「吉」の所を「吉凶の」の誤りかと考えたが、程伊川は「凶」を言わないことに意味があると考えている。</li><li>「石に介たり……寧んぞ日を終うるを用いん。断じて識る可し」：君子は明哲で（『詩経』大雅・烝民の「既に明且つ哲、以て其の身を保つ」から「明哲保身」の語ができた。明は知恵が明らか、哲はさらに深い知恵）、事の兆しを見るので、節操を石のように堅く守れる。守りが堅ければ惑わず明らかである。幾を見て動くのだから、どうして一日を終えるのを待とうか。「断」は判別することで、その見分けがたちまちつく。</li><li>「君子は微を知り彰を知り、柔を知り剛を知る。万夫の望みなり」：微と彰、柔と剛は相対するものである。君子は微を見れば彰を知り、柔を見れば剛を知る。幾を知ることがこのようなので、衆の仰ぐところとなる。だから「万夫の望み」とたたえた。</li></ul>\n<p><span class=\"tag\">象伝について程伝</span>日を終えずに立ち上がり貞吉であるのは、中正の徳があるからである。中正であるがゆえに守りが堅く、兆しを弁えることが早く、豫を去ることが速い。この爻は六二の豫に処する道を言っており、教えとしての意味が深い。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>安逸の誘惑の中で、ひとり節操を堅く守る。兆しを見たらその日のうちにきっぱり立ち上がれ。正しくて吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">盱豫悔。遲有悔。</span></summary><div class=\"body\"><div class=\"yomi\">盱（く）豫す、悔ゆ。遅ければ悔い有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「盱豫有悔、位不當也。」（盱豫して悔い有るは、位当らざればなり。）</div>\n<p>上の者を上目づかいに見ながらぐずぐずしている。この豫は喜びよりも「猶豫」の意味が強そうである。動けば後悔する。といって、いつまでもぐずぐずして進まなければ、やはり悔いが残る。</p>\n<p><span class=\"tag\">程伝</span>六三は陰で陽の位にいる、不中不正の人である。不中正のまま豫の時にいるので、動けばみな悔いがある。盱とは上目づかいに見ることである。四を見上げるが、不中正なので四に取られず、悔いる。四は豫の主で、三とごく近い。もしぐずぐずして進まなければ、見捨てられてやはり悔いる。身の処し方が正しくないので、進んでも退いても悔吝（悔は後悔、吝は恥）がある。ではどうすべきか。身を正すだけである。君子は己を処するに道があり、礼をもって心を制する（『書経』仲虺之誥に「義を以て事を制し、礼を以て心を制す」）。豫の時にいても中正を失わなければ、悔いはない。</p>\n<p><span class=\"tag\">象伝について程伝</span>自ら処するのに位が当たらず、中正を失っている（三は本来陽の来るべき位なのに陰が来ている。弱い性格で強い地位にいる）。だから進退ともに悔いがある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上の顔色をうかがって迷っている。動いても待っても悔いが残る。まず自分の身を正せ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">由豫。大有得。勿疑。朋盍簪。</span></summary><div class=\"body\"><div class=\"yomi\">由（よ）りて豫ぶ。大いに得る有り。疑う勿れ。朋盍（なん）ぞ簪（あつ）まらざる。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「由豫大有得、志大行也。」（由豫、大いに得る有るは、志大いに行わるるなり。）</div>\n<p>この卦でただ一つの陽。この人によって万人が喜びを得る。大いに得るところがある。人の疑いを招きやすい危険な地位だが、自ら疑ってはならない。そうすれば友がみな集まってくる。君主より一段下の、この卦の中でただ一人の実力者である。本田によれば、人どうしの詩文を集めて「盍簪録」ということがある。</p>\n<p><span class=\"tag\">程伝</span>豫の豫たるゆえんは九四による。四は動の主で、動いて衆陰が悦び順うのが豫の義である。四は大臣の位で、六五の君はこれに順従し、陽剛をもって上の事を任される。豫の由るところであり、だから「由豫」という。「大いに得る有り」とは、大いにその志を行い、天下の豫びを致すことである。「疑う勿れ、朋盍ぞ簪まらざる」とは、四は大臣の位にいて柔弱な君を承け、天下の任に当たる、危疑の地である（いつかは君主に取って代わるのではと疑われる）。独り上の倚任に当たり、下に同徳の助けがない（九四のほかに陽がない）。疑われるゆえんである。ただ至誠を尽くし、疑慮をもたなければ、朋類は自ずから集まる。上下の信を得たいなら至誠しかない。至誠を尽くせば、助けのないことを患う必要はない。簪は聚めることで、かんざしを簪と名づけるのは髪を聚めるものだからである（本田：簪には「しん」の音から集める意味がある）。</p>\n<p>ある人が問うた。「卦にはただ一陽しかない。どうして同徳の助けが得られようか」。答え：上にいて至誠で助けを求めれば、理として必ず得られる。姤の九五に「天より隕つる有り」とある（本田：内に誠を積めば助けが天から降ってくる。周の文王が釣りをしていた太公望を見出して軍師に迎えた例。太公望は餌もつけずに釣り糸を垂れて妻に逃げられたが、出世すると妻が復縁を求めてきたので、盆の水を空けて「この水が盆に返ったら復縁しよう」と言った。「覆水盆に返らず」の話である）。四は陽剛で君に近く、専ら豫の主となっている。聖人が戒めを発すべきなのにしないのは、豫が和順の道だからで、四は和順の道により臣としての正しさを失っていない。天下の事を任じて時を和豫に致す者である。だからただ「至誠、疑う勿れ」とだけ戒めた。</p>\n<p><span class=\"tag\">象伝について程伝</span>己によって天下を楽豫に致す。だから「大いに得る有り」という。その志が大いに行われることを言う。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分が中心となって皆を喜ばせ、大いに得るところがある。重責に疑いの目が向けられても、至誠を尽くし自ら疑わなければ、仲間が集まる。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i></span><span class=\"p\">六五</span><span class=\"t\">貞疾。恆不死。</span></summary><div class=\"body\"><div class=\"yomi\">貞にして疾む。恒に死せず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「六五貞疾、乘剛也。恆不死、中未亡也。」（六五の貞にして疾むは、剛に乗ればなり。恒に死せざるは、中未だ亡びざればなり。）</div>\n<p>地位は正しいが、とかく病気ばかりしている。病は長引くが、死にはしない。本田は、大変危険な判断だと言う。</p>\n<p><span class=\"tag\">程伝</span>六五は陰柔で君位にいる。豫の時に当たり、豫に沈溺して自立できない者である。権の主るところ、衆の帰するところはみな四にある。四は陽剛で衆を得ており、耽惑柔弱の君が制御できる相手ではない。柔弱で自立できない君が、権を専らにする臣に制せられているのである。君位にいるのは貞、制を下に受けるのは疾苦である。六は尊位にいて、権は失っても位はまだ亡びていない。だから「貞にして疾む、恒に死せず」という。漢・魏末世の君のようである。人君が危亡を致す道は一つではないが、豫をもって多しとする。四においては正を失うと言わず、五においてその強逼を示すのは、四にはもともと失がないからである。四では大臣が天下の事に任ずる義を言い、五では柔弱な君が尊位にいて自立できず、威権が己を去る義を言う。それぞれ爻によって義を取っているので同じでない。もし五が君道を失わずに四が豫の主となれば、任ずるにその人を得て、安らかにその功を享けることになる。殷の太甲・周の成王のようである。蒙もまた陰で尊位にいて、二が陽で蒙の主となるが、彼（蒙）は吉で此（豫）は疾む。時が同じでないからである。童蒙で人に頼るのは宜しいが、豫に耽って権を人に失うのは危亡の道である。だから蒙で二と五が応じるのは倚任する者であり、豫で四が五に逼るのは権を失う者である。また上下の心が専ら四に帰している。</p>\n<p>本田の講説：太甲は殷の湯王の次の王で、即位当初は暗愚だったので宰相の伊尹が離宮に三年放逐し、過ちを改めてから迎え入れた。成王は周の武王の子で、武王が革命後まもなく亡くなり赤ん坊のまま即位し、周公が背負って玉座に即いた。これが摂政の始まりである。蒙は山から水がちょろちょろと流れ出す形で、幼い時である。</p>\n<p><span class=\"tag\">象伝について程伝</span>貞にして疾むのは、剛（九四）に乗り、それに逼られているからである。恒に死せざるのは、中の尊位がまだ亡びていないからである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>地位はあっても実権を下の実力者に握られ、安逸に溺れて自立できない。病は長引くが、すぐ滅びはしない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">冥豫成。有渝无咎。</span></summary><div class=\"body\"><div class=\"yomi\">冥豫成る。渝（かわ）ること有らば、咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「冥豫在上、何可長也。」（冥豫して上に在り。何ぞ長かる可けんや。）</div>\n<p>喜びのあまり目が眩んでしまった。生活態度を改めれば咎はない。五が君主で、上はすでに君主の位を離れている。</p>\n<p><span class=\"tag\">程伝</span>上六は陰柔で中正の徳がない。陰で上にいるのは不正であり、しかも豫の極まる時に当たる。君子でもこの時にいるなら戒め懼れるべきなのに、まして陰柔の者が豫に耽りほしいままにしている。昏迷して反省を知らない者で、豫の終わりにいるので「冥豫已に成る」とする。しかし、もし渝変することがあれば咎はない。豫の終わりにいるので変わる道がある。人の失も、よく自ら変われば咎はない。冥豫がすでに成っても、よく変われば善い。聖人がこの義を発したのは、人に善に遷ることを勧めるためである。だから冥が凶だとは言わず、専ら渝われば咎がないことを言う。</p>\n<p><span class=\"tag\">象伝について程伝</span>豫に昏冥して終わりに至った。災いはやがて及ぶ。どうして長く続こうか。速やかに渝るべきである。</p>\n<p>本田の講説：漢の武帝の詩「秋風の辞」に「歓楽極まって哀傷多し」とある。歓楽の極まりにはいずれ悲しみが来る。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>喜びに溺れて目が眩んでいる。長くは続かない。今すぐ態度を改めれば咎はない。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>震災前に出た震為雷</div><div class=\"rb\">1995年1月の震災の前、女子院生が占って震為雷を得た。本田は最初「妊娠するのと違うか」と冗談を言ったが、「地震が来るかもしれん」と言った。卦辞「震の来るとき虩虩（げきげき）たり。笑言啞啞（あくあく）たり」は、初めは恐ろしいが後で笑い話になるという意味なので、無事だろうと言った。彼女の豊中の家はめちゃくちゃになったが、本人は無事だった。</div></div><div class=\"pager\"><a href=\"#gua-15\">← 地山謙</a><a href=\"#gua-17\">沢雷随 →</a></div>", "gua-17": "<a class=\"back\" href=\"#gua\">← 30卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 17 卦　第三十二講〜第三十三講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><div class=\"nm\">沢雷随</div><div class=\"yo\">たくらいずい</div><div class=\"tri\">上卦 ☱ 兌　／　下卦 ☳ 震</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-17\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-17\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-17\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-17\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-17\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-17\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-17\" data-jump=\"yao\">六爻</a></div><h3 id=\"g17-s0\">卦の名と象</h3>\n<p>随は「したがう」の意味である。人に従う、人を従わせる、時に従う。</p>\n<p>程伝（序卦伝を引く）：「豫べば必ず随う有り。故に之を受くるに随を以てす」。悦豫の道は、物の随うところである。だから随が豫に次ぐ。</p>\n<ul class=\"sen\"><li>上下の卦で言えば、兌は説（よろこぶ）、震は動く。説んで動く、動いて説ばれる、いずれも随う形である。</li><li>人で言えば、兌は少女、震は長男で、少女が長男に従う形である。女は人に従うものである（本田：「幼くしては親に従い、嫁しては夫に従い、老いては子に従う」の三従が女の徳とされた）。</li><li>自然現象で言えば、震は雷、兌は沢で、雷が沢の中で震えば沢は震に従って動く。本田によれば、地震ではなく、陽気が地下に生じて沢の氷が溶けるというほどの意味であろう。</li><li>卦変で言えば、乾の上九が降りて坤の初に来て、坤の初六が上って乾の上に行った形である。陽が陰の下にへりくだれば、陰は必ず悦び従う。本田によれば、卦変説にはいろいろあるが、程伊川の説は一番素朴で、必ず乾と坤から説明する。</li><li>卦を成すのに、二体の義を取るもの、主爻の義を取るもの、卦変の義を取るものがあるが、随はそれらをすべて取っていて最も詳しい。</li></ul>\n<h3 id=\"g17-s1\">卦辞</h3>\n<div class=\"orig\">隨、元亨。利貞。无咎。</div>\n<div class=\"yomi\">随は、元いに亨る。貞しきに利あり。咎无し。</div>\n<p>この卦が出たら、願いごとは大いに通る。占う人の動機が正しい場合には利益がある。天の咎はない。非常にめでたい判断である。</p>\n<p><span class=\"tag\">程伝</span>随の道は大いに亨ることを致しうる。君子の道で、人に随われること、己が人に随うこと、事に臨んで随うところを択ぶこと、みな随である。随うのにその道を得れば大亨を致すことができる。人君が善に従い、臣下が命を奉じ、学者が義に従い、事に臨んで長（よいほう）に従うのは、みな随である。随の道は貞に利がある。随うのに正しさを得て初めて大いに亨り、咎がない。正しさを失えば咎があり、亨るはずがない。</p>\n<p>本田の講説：『左伝』に、この卦辞で占った魯の穆姜の話がある（後掲「講義での占いの実例」）。</p>\n<h3 id=\"g17-s2\">彖伝</h3>\n<div class=\"orig\">隨、剛來而下柔、動而說、隨。大亨貞无咎、而天下隨時。隨時之義大矣哉。</div>\n<div class=\"yomi\">随は、剛来りて柔に下る。動いて説ぶは、随なり。大いに亨る、貞にして咎无し。而うして天下時に随う。時に随うの義は、大なるかな。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦が随であるゆえんは、剛が来て柔に下り、動いて説ぶからである。乾の上九が来て坤の下にいて、坤の初六が行って乾の上にいる。陽剛をもって来て陰柔に下るのは、上をもって下に下り、貴をもって賤に下ることである。このようであれば物の説び随うところとなる。また下が動いて上が説ぶ、動いて説ぶべきなので随うのである。このようであれば大いに亨り正を得る。大いに亨り正を得れば咎はない。亨らず正を得なければ、どうして天下を随わせられよう。天下が随うのは時である。だから「天下時に随う」という。</li><li>君子の道は、時に随って動き、宜しきに従い変に適うもので、典要（固定した原則。繋辞伝の語）を立てることはできない。道に造（いた）ること深く、幾を知り権をよくする者でなければあずかれない。だから「時に随うの義は大なるかな」とたたえた。彖伝が卦をたたえるのは、読む人にその義の大きさを知らせ、玩味させるためである。ここは時に随うことの義の大きさをたたえたもので、豫などの諸卦（時と義を二つの事として並べる）とは違う。</li></ul>\n<p>本田の講説：</p>\n<ul class=\"sen\"><li>朱子はテキストの誤りとして「随の時義は大なるかな」と改めるが、このままでも意味は通じる。朱子が改めるのは他の卦に「〜の時義」という言い方が多いからで、程伊川は「この卦は他とは違う」と注で言っている。</li><li>「造道」の造は「造詣」の造で、いたる意味。「権」は孟子がうるさく言った概念で、建前には外れるが、その時においては正しいという措置のこと。「権宜」も同じ。淳于髡が孟子をからかい、「礼では兄嫁と弟は口を利いてもいけない。兄嫁が溺れかけていても手を握ってはいけないのか」と言うと、孟子は「その場合は権である。ふだん口を利かないのは経である」と答えた。経は本筋の原則、権はもとは竿秤のことで、物事を計り比べる意味になった。</li></ul>\n<h3 id=\"g17-s3\">大象</h3>\n<div class=\"orig\">澤中有雷、隨。君子以嚮晦入宴息。</div>\n<div class=\"yomi\">沢中に雷有るは、随なり。君子以て晦（くら）きに嚮（むか）って入りて宴息す。</div>\n<p>沢の下に雷が潜んでいる形が随である。君子はこれにのっとって、日暮れに向かっては家に入って安らぎ憩う。「宴」は楽しむ意味。本田によれば、冬の間は雷もじっとしているという点を、程伝ははっきり言わないが、朱子の注ではそこに重点を置いて説明している。</p>\n<p><span class=\"tag\">程伝</span>雷が沢の中で震えば、沢は震に随って動く（本田：冬が去って沢の氷が割れるようなこと）。随の象である。君子はこの象を見て、時に随って動く。時の宜しきに随えば万事みなそうである。最も明らかで近いものを取って言えば、「晦きに嚮って入りて宴息す」である。君子は昼は自ら強めてやまず（乾の大象「君子以て自彊息まず」、彊と強は同じ）、日暮れに向かえば内に入り、宴息して身を安んずる。起居が時に随い、その宜しきにかなう。礼に「君子は昼内に居らず、夜外に居らず」とあるのは、時に随う道である。</p>\n<p>本田の講説：この文句とまったく同じものは五経の中にはない。似たものとして『左伝』昭公元年に「君子に四時有り。朝は以て政を聴く。昼は以て訪問す。夕べは以て令を修む。夜は以て身を安んず」とある（訪問は賢者に道を聞くこと、令を修むは法令を修正すること）。また『礼記』檀弓に、君子は親の喪のとき以外は外で寝ず、斎戒や病気のとき以外は昼夜内にいない、という意味の文句がある（親の喪の時は家の外に小屋を建ててそこで寝起きする）。『左伝』の方が昼夜の区別がはっきりしている。</p>\n<h3 id=\"g17-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>穆姜の自省。</b> 卦辞「元いに亨る、貞しきに利あり、咎无し」で占われた魯の穆姜は、占い者のへつらいを退け、元亨利貞の四徳が自分には一つもないと見抜いた（「講義での占いの実例」参照）。本田は、この卦を得たのは「人に従え、子に従え」という戒めとして解釈すべきだったので、占い者より穆姜の方が優れた見識を持っていた、と言う。</li><li><b>親愛の情は判断を曇らせる。</b> 初九の程伝：常人の情は、愛すれば是を見、憎めば非を見る。だから妻子の言は誤っていても従い、憎む者の言は善くても悪いとする。親愛によって随えば私情であり、理に合わない。</li><li><b>随うことは専一に。</b> 六二の程伝：正に従えば邪に遠ざかり、非に従えば是を失う。両方に従う理はない。</li><li><b>重臣の身の処し方。</b> 九四の程伝は、伊尹・周公・諸葛孔明を、徳が民に及び民に随われながら君に疑われなかった人として挙げ、次に唐の郭子儀を挙げる。本田によれば、程伊川が疑われやすい地位で正しく身を処した人々をほめるのは、宋の時代に重臣が権力を専らにすることがままあったからであろう。</li><li><b>周の大王の故事。</b> 上六の「王用て西山に亨る」は、周の大王が豳を去って岐に移ると、民が老人を背負い幼子の手を引いて市に集まるように付いて来た話（『史記』周本紀）による。</li></ul>\n<h3 id=\"g17-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>願いは大いに通るが、正しいものに従う場合に限る。正を失えば咎がある。穆姜の例のように、自分に徳がなければこの吉辞は当たらず、むしろ「人に従え」という戒めになる。</li><li>時に従って動き、休むべき時には休め（大象）。</li><li>従う相手を親愛や私情で選ぶな。門を出て広く交われ（初九）。</li><li>身近な小者に引かれて本来の正しい相手を失うな（六二）。上の立派な人に従えば求めるものは得られるが、正しさを守れ（六三）。</li><li>君主に近い地位で人望が自分に集まるのは危険。誠意を積み、明哲保身を心がけよ（九四）。</li></ul><h2 class=\"sec\" id=\"g17-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">初九</span><span class=\"t\">官有渝。貞吉。出門交有功。</span></summary><div class=\"body\"><div class=\"yomi\">官、渝（かわ）ること有り。貞なれば吉。門を出でて交わるに功有り。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「官有渝、從正吉也。出門交有功、不失也。」（官渝ること有り、正に従えば吉なり。門を出でて交わるに功有りとは、失あらざるなり。）</div>\n<p>役目が変わることがある。心正しければ吉。一門の中でだけ交わるのでなく、門の外に出て広く他人と交われば良い成果が上がる。</p>\n<p><span class=\"tag\">程伝</span>九は随の時にいて震体であり、しかも動の主である（随の下半分の震の唯一の陽）。随うところがある者である。官は主守（何らかの役職）のことである。随うところがあれば、その主守に変易がある。だから「官渝ること有り」という。従うところが正しければ吉、正しくなければ過った異動である。「門を出でて交わるに功有り」とは、人心が従うのは多くは親愛する者である。常人の情は、愛すれば是を見、憎めば非を見る。だから妻孥の言は誤っていても多く従い、憎む者の言は善くても悪いとする。親愛によって随えば、私情に与することであり、どうして正理に合おうか。だから門を出て交われば功がある。「門を出づ」とは、私昵（私的ななじみ）ではない、交わるのに私をもってしないことである。だからその随うことは当を得て功がある。本田によれば、「暱」は「昵懇」の昵が本字で、なじみの意味。</p>\n<p><span class=\"tag\">象伝について程伝</span>随うことがあって変わる。従うところが正しければ吉、正しくなければ悔吝がある。門を出て交わるのは私に牽かれないことで、その交わりは必ず正しい。正しければ失はなく、功がある。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>役目や立場が変わる時。正しい相手に従えば吉。身内や馴染みに偏らず、外に出て広く交われば成果がある。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六二</span><span class=\"t\">係小子、失丈夫。</span></summary><div class=\"body\"><div class=\"yomi\">小子に係れば、丈夫を失う。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「係小子、弗兼與也。」（小子に係るとは、兼ねては与せざるなり。）</div>\n<p>若い男に心引かれれば、立派な男（本来夫たるべき男）をなくす。</p>\n<p><span class=\"tag\">程伝</span>二は五に応じながら初に比している（隣り合っている）。随うことは近い者を先にしがちで、柔は固く守ることができない。だから戒めて「もし小子に係れば丈夫を失う」と言う。初の陽が下にいるのが小子、五の正応が上にいるのが丈夫である。二がもし初に志を係ければ、九五の正応を失う。小子に係って丈夫を失い、正を捨てて不正に従えば、その咎は大きい。二は中正の徳があるので（下卦の真ん中で中、偶数位に陰で正）、必ずしもそこまでには至らないが、随の時にあっては戒めておくべきである。</p>\n<p><span class=\"tag\">象伝について程伝</span>人が随うところが正しければ邪に遠ざかり、非に従えば是を失う。両方に従う理はない。二がもし初に係れば五を失う。兼ねて与することはできない。だから人が正に従うには専一であるべきことを戒めた。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>身近な小さなものに心引かれると、本来の大切な相手・目標を失う。両天秤はできない。心を一つに定めよ。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">六三</span><span class=\"t\">係丈夫、失小子。隨有求得。利居貞。</span></summary><div class=\"body\"><div class=\"yomi\">丈夫に係り、小子を失う。随って求むる有れば得。貞に居るに利あり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「係丈夫、志舍下也。」（丈夫に係るとは、志下を舎つるなり。）</div>\n<p>立派な男に心引かれて、若い男をなくす。立派な男に従って何か求めれば、必ず与えられる。ただし動機が正しいことを条件とする。</p>\n<p><span class=\"tag\">程伝</span>丈夫は九四、小子は初である。陽で上にいるのが丈夫、下にいるのが小子である。三は初と同体（ともに下卦）だが、四に最も近い。だから四に係る。たいてい陰柔は自立できず、常に親しく近い者に係る。上は四に係り、下は初を失う。下を捨てて上に従うのは、随の宜しきを得ている。上に随うのは善である。暗が明に随い、事が善に従うのは上に随うことであり、是に背き非に従い、明を捨てて暗を追うのは下に随うことである。四も応がない（初と四はともに陽で引き合わない）ので、近くの三が随ってくれれば必ず親しむ。だから三が四に随えば、求めるものは必ず得られる。人が上に随い、上も気に入る。これが求めるところを得ることである。しかし理に違い道を曲げてまで上に随ってはならない。いい加減に愛され喜ばれることで求めを遂げるのは、小人が邪にへつらうことである。だから「貞に居るに利あり」という。正に処していれば、求めて必ず得るのも正しい事である。君子に随うからである。</p>\n<p>本田の講説：君子が不当な求めにまで応ずるわけがない。</p>\n<p><span class=\"tag\">象伝について程伝</span>上に随えば下を捨てて従わない。卑を捨てて高に従う。随においては善である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>立派な上の人に従えば、求めるものは得られる。ただし正しさを守り、へつらって無理を通してはならない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i></span><span class=\"p\">九四</span><span class=\"t\">隨有獲。貞凶。有孚在道以明、何咎。</span></summary><div class=\"body\"><div class=\"yomi\">随って獲る有り。貞なれども凶。孚有って道に在り、明を以てす。何の咎あらん。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「隨有獲、其義凶也。有孚在道、明功也。」（随って獲る有るは、其の義凶なり。孚有って道に在るは、明の功なり。）</div>\n<p>君主に従う身でありながら、大いに人望を得る。動機が正しくても結果は凶である。誠意があり、道を守り、「明哲保身」（『詩経』の語）を心がければ何の咎もない。</p>\n<p><span class=\"tag\">程伝</span>九四は陽剛の才で臣位の極にいる（五が君位なので、四は君に最も近い家来の最高位）。もし随において獲ることがあれば、正しくても凶である。「獲る有り」とは、天下の心を得て己に随わせることである。臣たる道は、恩も威もみな上から出て、人心がみな君に随うようにすべきである。もし人心が己に従えば、危疑の道である。だから凶である。この地にいる者はどうすべきか。ただ孚誠を内に積み、動作が道に合い、明哲をもって処せば、何の咎があろう。昔これを行った者がいる。伊尹・周公・孔明がそうである。みな徳が民に及び、民が随った。民の随うのを得て、君の功を成し、国を安んじた。誠が内にあるのが「孚有り」、施すところが道に当たるのが「道に在り」、明哲によってこうできるのが「明を以てす」である。だから下は信じ、上は疑わない。位が極まっても上に逼る嫌いがなく、勢いが重くても権を専らにする過ちがない。聖人大賢でなければできない。その次は唐の郭子儀である。威は主を震わせたが主は疑わなかった。内に誠孚があり、身の処し方に甚だしい失がなかったからである。明哲でなければできようか。</p>\n<p>本田の講説：伊尹は殷の宰相で、暗愚な太甲を三年押し込めて反省させ、位に戻した。周公は武王の弟で、赤ん坊の成王を背負って玉座に座った（摂政の始まり）。親戚に「後釜を狙う」と悪口を言われて自ら東に退いたが、周公の死後、武王の病気治癒を祈った願文が出てきて成王が泣いた（『書経』）。劉備は孔明に「息子に見込みがなければお前が国を取れ」と遺言したが、孔明は涙を流して二代目を助けると言い、暗愚な劉禅を補佐し続けた。郭子儀は安禄山の乱を平定し、粛宗以下三代の皇帝に仕え、軍事の責任を全部背負って大変な権力があり、家の者三千人、孫だけで数十人いて覚えきれないほどだった。</p>\n<p><span class=\"tag\">象伝について程伝</span>君に近い位にいて獲ることがあるのは、その義からして凶である。孚があって道にあれば咎がないのは、明哲の功である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>上の人を差し置いて人望が自分に集まる。正しくても危うく凶。誠を内に積み、道を守り、明哲保身に努めれば咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i></span><span class=\"p\">九五</span><span class=\"t\">孚于嘉。吉。</span></summary><div class=\"body\"><div class=\"yomi\">嘉に孚あり。吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「孚于嘉吉、位正中也。」（嘉に孚ありて吉なるは、位正中なればなり。）</div>\n<p>善き人に従うことに誠意がある。吉。</p>\n<p><span class=\"tag\">程伝</span>九五は尊位にいて正を得、中が実である（陽は真ん中が詰まっていて充実、誠の意味）。その中の誠が善に随うことにある。その吉であることは知れている。嘉は善である。人君から庶人に至るまで、随う道の吉は善に随うことにある。下の正中の六二に応ずるのが、善に随う義である。</p>\n<p><span class=\"tag\">象伝について程伝</span>正中の位にいて、正中の道による。随うところの者も正中であり、これが嘉である。孚するところの嘉とは六二のことである。随うには中を得ることがよい。随で防ぐべきは過ぎることである。心が喜んで随うときは、過ぎていても気づかないものである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>誠意をもって善い人・正しいものに従う。吉。ただし喜んで従うあまり行き過ぎないように。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i></span><span class=\"p\">上六</span><span class=\"t\">拘係之、乃從維之。王用亨于西山。</span></summary><div class=\"body\"><div class=\"yomi\">之を拘（とら）え係（くく）る。乃ち従って之を維（つな）ぐ。王用て西山に亨る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「拘係之、上窮也。」（之を拘え係るは、上窮まるなり。）</div>\n<p>捕らえてくくり、さらに追いかけて柱などに縛りつける。悪い判断のようだが、程伝によれば、国を出ようとする人を民衆が慕って、どうでも国にいてくれと捕まえて逃がさないことである。王者はこれによって西山で王業をすらすらと行う。朱子のテキストでは「亨」が「享」になっている（亨はコウで通る、享はキョウで受ける意味だが、木版本では区別がはっきりしない）。</p>\n<p><span class=\"tag\">程伝</span>上六は柔順で随の極にいる。随を極める者である。「之を拘え係る」とは、随の極みで、拘持縻係するようなことである。「乃ち従って之を維ぐ」とは、さらに従って維ぎ係ることで、随の固く結ばれることがこのようであることを言う。「王用て西山に亨る」とは、随の極みがこのようだということである。昔、大王はこの道で王業を西山に亨した。大王は狄の難を避けて豳を去り岐に来た。豳の人は老人や幼子を助け携えて、市に帰するように随った。人心の随う固さがこのようで、そのために王業を西山で盛んにできた。西山は岐山である。周の王業はここに興った。上は随の極にいて、もとより甚だ過ぎているが、民心の随うを得ることと、善に随う固さについては、このようであってこそ善い。ほかに施せば過ぎる（它は他の別の形）。</p>\n<p>本田の講説：『史記』周本紀によれば、大王は豳にいたが、異民族が侵入して金や財物を要求し、言われるままに差し出していたが、ついに土地と人民をよこせと言い出した。大王は「お前たちにとって、わしの下にいても異民族の下にいても変わりはない。わしのためにお前たちを戦死させるわけには行かない」と言って一人で岐に移った。すると豳の民が年寄りを担ぎ、幼子の手を引いて、市場に集まるように付いて来た（昔は店がふだんから並んでいるわけではなく、四日市・八日市のように決まった日に市が立った）。</p>\n<p><span class=\"tag\">象伝について程伝</span>随の固さは拘係維持するようである。随の道の窮極である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>人の心がこの上なく固く結びつき、離れようとしても引き留められるほど慕われる。善に随う決心の固さとしては善いが、他の場面に用いれば行き過ぎ。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>穆姜と随の卦辞（『左伝』）</div><div class=\"rb\">魯の成公の母・穆姜は、宣公の死後、家老の叔孫と密通し、叔孫は穆姜の権威をかさに着て季孫・孟孫の財産を奪おうとした。成公が咎めると、穆姜は成公の弟たちを指して「お前が言うことを聴かないなら、この子たちがいつでも代わりになれる」と言い、成公は母を東宮に押し籠めた。穆姜が再び宮殿を出られるかを占わせると随の卦辞が出て、占い者は「必ず出られましょう」とへつらった。穆姜は「この卦は非常にめでたいが、元は善の長、亨は善きものの集まり、利は義の和、貞は事の幹で、私にはこの四徳が一つもない。浮気をした上、我が子を廃そうとした反逆者でもある。この判断は私には当たらない」と言い、結局幽閉されたまま一生を終えた。本田は、この卦は「人に従え、子に従え」という戒めと解すべきで、占い者より穆姜の方が見識があった、と言う。</div></div><div class=\"pager\"><a href=\"#gua-16\">← 雷地豫</a><a href=\"#gua-18\">山風蠱 →</a></div>", "gua-18": "<a class=\"back\" href=\"#gua\">← 30卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 18 卦　第三十三講〜第三十四講</div><span class=\"hex big\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><div class=\"nm\">山風蠱</div><div class=\"yo\">さんぷうこ</div><div class=\"tri\">上卦 ☶ 艮　／　下卦 ☴ 巽</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-18\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-18\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-18\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-18\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-18\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-18\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-18\" data-jump=\"yao\">六爻</a></div><h3 id=\"g18-s0\">卦の名と象</h3>\n<p>随を上下ひっくり返した形の卦である。「蠱」の字は皿の上に虫が書かれていて、食べ物が腐って虫がわいた状態である。また「虫」はエラの張った毒蛇の象形なので、皿の上に毒蛇を三匹載せて人を呪う行為をも意味し、和訓で「まじもの」と訓ずることもある。前漢の武帝の長男が悪い家来に陥れられたのも、巫に蠱を行わせたという嫌疑をかけられてのことだった。字自体としてはめでたいものではない。</p>\n<p>程伝（序卦伝を引く）：「喜びを以て人に随う者は、必ず事有り。故に之を受くるに蠱を以てす」。豫と随の二卦を承けて次としたのである。喜び悦んで人に随う者には必ず事がある。事がなければ何を喜び何に随おう。蠱が随に次ぐゆえんである。蠱は事である。ただし蠱の字を事と訓ずるのではない。蠱（腐敗）があって初めて事が起こるのである。</p>\n<ul class=\"sen\"><li>卦は山の下に風がある。風が山に当たって渦を巻けば、物（木の実など）はみな乱れ落ちる。これが蠱の象である。</li><li>蠱の義は壊乱である。文字では皿に虫がいる形で、壊れる義である。『左伝』（昭公元年、晋侯の病を名医が診断した言葉）に「風、山を落とし、女、男を惑わす」とある。長女（巽）が少男（艮）に下るのは、その情を乱すことである（「蠱惑」という熟語もある）。風が山に遭って渦巻けば、みな撓み乱れる。事有るの象である。</li><li>すでに蠱であれば、これを治めることもまた事である。卦の象で言えば蠱を成すゆえん、卦の才（下の巽は従う、上の艮は止まる）で言えば蠱を治めるゆえんである。</li></ul>\n<p>本田の講説：蠱には腐敗という意味と、腐敗を立て直す事業という意味の二通りが含まれ、一つ一つの爻の文句も二つの意味を含めている。腐敗の後には必ずそれを立て直す事業が起こり、反対に、腐敗がなければ新しい発展もない。</p>\n<h3 id=\"g18-s1\">卦辞</h3>\n<div class=\"orig\">蠱、元亨。利涉大川。先甲三日、後甲三日。</div>\n<div class=\"yomi\">蠱は、元いに亨る。大川を渉るに利あり。甲に先んずること三日、甲に後るること三日。</div>\n<p>この卦が出れば、願いごとはかなう。冒険をするのによい。法令を発布する前に三日間その理由を反省し、発布した後で三日間将来のことを慮るがよい。</p>\n<p><span class=\"tag\">程伝</span>すでに蠱であれば、また治まる理がある。昔から治は必ず乱による。乱れれば治を開く。理の自然である。卦の才のように蠱を治めれば元亨を致す。蠱の大なるものは時の艱難を救うことである。だから「大川を渉るに利あり」という。</p>\n<p>甲は数の首、事の始めである。十干（辰）の甲乙のようなものである。「甲第」「甲令」はみな首（トップ）のことである（本田：漢代に第一級の邸宅を甲第と言い、甲令は先代の君主の残した最高不変の法律）。蠱を治める道は、その先三日、その後三日を思慮すべきである。前後を推しはかるのは、弊を救い久しく保つ道である。「甲に先んず」とは、甲（事の始め）に先立って、そうするゆえんを究めること。「甲に後る」とは、甲の後に、これからどうなるかを慮ることである。一日二日と考えて三日に至るのは、慮りが深く推すことが遠いことである。そうするゆえんを究めれば弊を救う道を知り、どうなるかを慮れば備える道を知る。よく救えば前の弊は改まり、よく備えれば後の利は久しい。これが古の聖王が天下を新たにし後世に垂れたゆえんである。後世の蠱を治める者は、聖人の「甲に先んじ甲に後る」の戒めを明らかにせず、慮りが浅く事が近い。だから乱を救うのに労しても乱は改まらず、功が成らないうちに弊が生じる。甲は事の首、庚（巽の九五「庚に先んずること三日、庚に後るること三日」）は変更の首である。制作政教のたぐいは甲といい、その首を挙げる。号令を発し施す事は庚という。庚は更のようなもので、変更するところがあることである。</p>\n<p>本田の講説：三日という数について学者はいろいろこじつけるが、程伊川は特別な意味づけをしていない。また三日前・三日後と解する学者もいるが、程伊川は前三日間・後三日間とする。</p>\n<h3 id=\"g18-s2\">彖伝</h3>\n<div class=\"orig\">蠱、剛上而柔下、巽而止、蠱。蠱元亨、而天下治也。利涉大川、往有事也。先甲三日、後甲三日、終則有始、天行也。</div>\n<div class=\"yomi\">蠱は、剛上りて柔下る。巽にして止まるは、蠱なり。蠱は元いに亨りて天下治まるなり。大川を渉るに利あり、往きて事有るなり。甲に先んずること三日、甲に後るること三日。終れば則ち始め有り。天行なり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>卦変と二体の義で言う。「剛上りて柔下る」とは、乾の初九が上って上九となり、坤の上六が下って初六となることである。陽は尊く上にあるべき者で、今は上に行っている。陰は卑しく下にあるべき者で、今は下に来ている。男（艮・少男）は若くても上にいて、女（巽・長女）は年長でも下にいる。尊卑が正を得て、上下が理に順うのは、蠱を治める道である。剛が上り柔が下って艮・巽となった。艮は止まる、巽は順う。巽順の道で蠱を治めるので元いに亨る（本田：巽は謙遜の遜と同じで、へりくだる意味）。</li><li>蠱を治める道が卦の才のようであれば、元いに亨って天下が治まる。乱を治めるには、まず上下の義を正しくし、下にある者は巽順に、上にある者は下を止め斉え安定させ、事がみな順に止まるようにすれば、どんな蠱も治まる。その道は大いに善く亨る。</li><li>天下が壊乱した時には、艱険を渉ってでも往ってこれを救うべきである。これが「往きて事有る」である。</li><li>始まれば必ず終わりがあり、終われば必ず始まりがある。天の道である。聖人は終始の道を知り、始めを原（たず）ねてそうするゆえんを究め、終わりを要（しめくく）ってこれからに備える。甲に先んじ甲に後れて慮りをなす。蠱を治めて元亨を致すゆえんである。</li></ul>\n<h3 id=\"g18-s3\">大象</h3>\n<div class=\"orig\">山下有風、蠱。君子以振民育德。</div>\n<div class=\"yomi\">山の下に風有るは、蠱なり。君子以て民を振（すく）い徳を育つ。</div>\n<p>山の下に風がある、これが蠱である（混乱とその後に伴う事業）。君子はこれを見て、民を救い、自分の徳を育てる。「振」は物質的に援助すること。</p>\n<p><span class=\"tag\">程伝</span>山の下に風があり、風に遇って渦を巻けば物はみな散乱する。だから事有るの象である。君子は事有るの象を観て、民を振済し、徳を養育する。己にあっては徳を養い、天下においては民を救う。君子の事とするところで、この二つより大きなものはない。</p>\n<p>本田の講説：「徳」は自分の徳とも民の徳とも解釈でき、「民を振い徳を育つ」とあれば普通は民の徳と考えそうなものだが、程伊川は自分の徳と解している。いかにも道学者らしい注釈である。</p>\n<h3 id=\"g18-s4\">程伝と本田の講説</h3>\n<ul class=\"sen\"><li><b>治乱の循環。</b> 程伝は、治は必ず乱から生じ、乱は治を開く、始まりがあれば終わりがあり終わりがあれば始まりがある、それが理の自然・天の道だと説く。</li><li><b>「父の蠱に幹たり」の三爻。</b> 初六・九三・六五の三爻に「父の蠱に幹たり」が出るが、判断は違う。初六は「厲めば終に吉」、九三は「小しく悔い有り」、六五は「用て誉れあり」。子の立場という点を最もはっきり表すのは一番下の初六なので、程伝は初六を卦の義を成す爻とする。六五も判断はよいが卦の主体ではない。卦の終わりに近く、すでに腐敗を始末した結果と見なされるからである。</li><li><b>「考」の字。</b> 「考」はもともと「耂」が老人の髪、「丂」が松葉杖で、杖をついた老人を表す。「かんがえる」意味はずっと後のもので、ふつう亡き父をいう（今でも「先考」という）。『書経』の古い用例では生きている父にも使う。「母」は生きている母親で、亡き母は「妣」という。</li><li><b>「尸」の字。</b> 音はシで「かたしろ（形代）」と訓ずる。死者の祭りの時に孫に当たる人を上座に座らせ、死者の代わりに供物を全部食べさせる。祭られる者の代役で祭の実質的な主体であるところから、物事の中心になる、つかさどる意味が派生した。</li><li><b>母への諫め方。</b> 九二の程伝：子が母に対するには、柔巽で助け導き、義に帰らせるべきである。頑強にズケズケ言って親子が断絶するのはすべて子の罪である。本田は、政治的には柔弱な君主に中庸を守らせることができれば善しとすべきで、大事業の創造を期待してはならない、周公も成王を守成の君（成王の諡にふさわしい）にできただけで、伏羲・黄帝・堯・舜の事業は期待できなかった、と説明する（伏羲は八卦を作り、家屋・船・車を発明したとされる。黄帝は全身銅でできて矢を跳ね返す怪物・蚩尤と戦って天下を初めて太平にした）。</li><li><b>隠者の諸類型。</b> 上九の程伝は、自ら高尚にする士にも、道徳を抱いて時に遇わず高潔に自ら守る者（本田：顔回を念頭に置くか）、止足の道を知って退いて自ら保つ者（『老子』四十四章「足るを知れば辱められず、止まるを知れば殆うからず」）、能を量り分を度って知られないことに安んずる者（許由・巣父か）、清介で天下の事を潔しとせず身を潔くする者（伯夷・叔斉か）がいる、と分類する。本田は許由が天子の位を譲ると言われ「汚らわしいことを聞いた」と川で耳を洗い、巣父がその水を牛に飲ませられんと牛を牽いて帰った話を紹介し、「牛にしてみれば、ひどい迷惑」と笑わせた。</li></ul>\n<h3 id=\"g18-s5\">占いの心得</h3>\n<ul class=\"sen\"><li>腐敗・混乱を表す卦だが、乱の後には治がある。腐敗を立て直す事業に取りかかれば、願いはかなう。冒険してよい。</li><li>事を始める前にはその理由を三日考え、始めた後にはその結果を三日慮れ（甲に先んじ甲に後れる）。</li><li>立て直しは、上下の秩序を正し、へりくだって従い、しかるべき所に止まるやり方で行う。</li><li>親（目上）の不始末を受け継ぐ時は、恐れ慎んで当たれば終には吉（初六）。母（柔弱な目上）には正論を押し通すな（九二）。</li><li>力のない者が寛裕のまま非常の事態に踏み出すと恥をかく（六四）。</li><li>用いられない時は、王侯に仕えず自分の志を高く保つのもよい（上九）。</li></ul><h2 class=\"sec\" id=\"g18-yao\">六爻</h2><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y mv\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">初六</span><span class=\"t\">幹父之蠱。有子、考无咎。厲終吉。</span></summary><div class=\"body\"><div class=\"yomi\">父の蠱に幹たり。子有れば、考（ちち）咎无し。厲（あやぶ）めば、終に吉。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「幹父之蠱、意承考也。」（父の蠱に幹たり、意考を承くるなり。）</div>\n<p>亡き父の残した不始末の後を取り仕切る。立派な子がいれば、亡き父の名誉に傷はつかない。卦の一番下で、身分も低く事も始まったばかりなので、常に自ら恐れていれば、最後は吉となる。</p>\n<p><span class=\"tag\">程伝</span>初六は最下にいるが、卦の義を成す主である。父の蠱に幹たる者である。子が父の蠱に幹たる道は、その事に任えることができれば「子有り」で、考は咎がない。そうでなければ父の累となる。だから必ず危ぶみ懼れれば終に吉を得る。卑い所にいて尊い事を主る（尸る）ので、自ずから懼れるべきである（『詩経』小雅・小旻「戦々兢々として、深淵に臨むが如く、薄氷を履むが如し」）。初六は陰で巽順の才はあるが、体は陰柔で、下にいて応もない（初と四はともに陰で引き合わない）のに事を主る。よく蠱に幹たるのに足る者ではない。幹するに足らない点から言えば、その義は甚だ小さい。だから専ら子が父の蠱に幹たる道を言う。必ずよく父の事に任えれば父を累わさず、よく厲めば終に吉でありうる。ここに子として蠱に幹たる大法がつぶさに示されている。</p>\n<p><span class=\"tag\">象伝について程伝</span>子が父の蠱に幹たる道は、意が父の事を承け当たることにある。だからその事を敬い、父を咎のない地に置く。常に危ぶみ懼れる心を抱けば、終にその吉を得る。誠を父の事に尽くすのは吉の道である。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>親や前任者の残した後始末を引き受ける。恐れ慎んで誠を尽くせば、親の名誉も守られ、最後は吉。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\" mv\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九二</span><span class=\"t\">幹母之蠱。不可貞。</span></summary><div class=\"body\"><div class=\"yomi\">母の蠱に幹たり。貞にす可からず。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「幹母之蠱、得中道也。」（母の蠱に幹たり、中道を得ればなり。）</div>\n<p>母が何か不始末をして、子としてその後始末をする。正しい道に固執して、厳しく母親を責め立ててはならない。</p>\n<p><span class=\"tag\">程伝</span>九二は陽剛で、六五の応ずるところである（二と五は陽と陰で引き合う）。陽剛の才で下にいて、上の陰柔の者の事を幹するので、子が母の蠱に幹たる義を取る。これは一家の中のことだが、一国で剛陽の臣が柔弱の君を助けるのとも意味が近い。二は巽体で柔の位にいる。子が母に対しては、柔巽で助け導き、義に帰らせるべきである。順わずに事が敗れるのは子の罪である。従容と将順するのに、どうして道がないことがあろう。婦人の身であるから陰柔であるのは知れている。もし己の陽剛の道を伸ばし、にわかに矯め正して払い逆らえば、恩を傷つけること大きく、そもそも聞き入れられるはずもない。己を屈し意を下し、巽順に将承して、その身が正しく事が治まるようにするだけである。だから「貞にす可からず」という。剛直の道を尽くしてはならないということである。それでもせいぜい中道であって、大いに事を有らしめることはできない。君臣の間でも、柔弱の君には誠を尽くし忠を竭くして中道にさせれば、それでよい。大いに為すことを期待できようか。周公の聖をもってしても、成王を輔けて成王たらしめ、守成の道を失わせなかっただけで、伏羲・黄帝・堯・舜の事を為させることはできなかった。二は巽体で中を得ており、よく巽順で中道を得ている。「貞にす可からず」の義に合い、母の蠱に幹たる道を得ている。</p>\n<p><span class=\"tag\">象伝について程伝</span>二は中道を得て剛に過ぎない。母の蠱に幹たるの善い者である（陽で強いが、中の位によって強すぎるのを免れている）。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>柔弱な目上（母や力の弱い上司）の失敗の後始末。正論で責め立てず、へりくだって穏やかに正していけ。高望みせず、中庸に落ち着けば十分。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\" mv\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">九三</span><span class=\"t\">幹父之蠱。小有悔、无大咎。</span></summary><div class=\"body\"><div class=\"yomi\">父の蠱に幹たり。小しく悔い有り。大なる咎无し。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「幹父之蠱、終无咎也。」（父の蠱に幹たり、終に咎无きなり。）</div>\n<p>亡き父の不始末の後を取り仕切る。少々やり過ぎて後悔するが、ひどく大きな咎はない。</p>\n<p><span class=\"tag\">程伝</span>三は陽剛の才で下卦の上にいて、幹を主る者である。子が父の蠱に幹たるのである。陽で剛の位にいて中でないので、剛が過ぎている。しかし巽体にいるので、剛が過ぎても順を欠かない。順は親に事える本である。また正を得ている（奇数位に陽）ので大きな過ちはない。陽剛の才でよくその事に幹たる。過ぎることで小さな悔いはあっても、終に大きな咎はない。しかし小さな悔いがあるのは、すでによく親に事える者とは言えない。</p>\n<p><span class=\"tag\">象伝について程伝</span>三の才で父の蠱に幹たり、小しく悔いがあっても終に大きな咎はない。剛断で幹事がよくでき、正を失わず順がある。終に咎がないゆえんである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>前の代の後始末を強い力で処理する。少し強引で悔いは残るが、正しさと素直さを失わなければ大きな咎はない。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y mv\"></i><i class=\"y\"></i><i class=\"\"></i></span><span class=\"p\">六四</span><span class=\"t\">裕父之蠱。往見吝。</span></summary><div class=\"body\"><div class=\"yomi\">父の蠱を裕（ゆたか）にす。往くときは吝を見る。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「裕父之蠱、往未得也。」（父の蠱を裕にす、往きて未だ得ざるなり。）</div>\n<p>父の不始末の後を、ゆるやかな仕方で処理する（「幹」が「裕」の字になっている。余裕綽々の裕）。その態度のまま一歩進んで非常事態を処理しようとすると、恥をかく。</p>\n<p><span class=\"tag\">程伝</span>四は陰で陰の位にいる。柔順の才で、正を得ている。だから寛裕にしてその父の事に処する者とする。柔順の才で正にいるのは、たかだか常に循い自ら守ることができるだけである。もし往って過常の事（非常の事）を幹すれば、その任に勝えず恥を見る。陰柔で下に応援がない（初も陰で引き合わない）。往って何を済せよう。</p>\n<p><span class=\"tag\">象伝について程伝</span>四の才で常を守り、寛裕の時にいるならよい。往くところがあろうとすれば得られない。任ずるところを加えれば勝えない。「任」は肩に背負うこと。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>平時のやり方を守るだけなら差し支えないが、力が足りない。非常の事態に乗り出せば恥をかく。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y mv\"></i><i class=\"\"></i></span><span class=\"p\">六五</span><span class=\"t\">幹父之蠱。用譽。</span></summary><div class=\"body\"><div class=\"yomi\">父の蠱に幹たり。用て誉れあり。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「幹父用譽、承以德也。」（父に幹たりて誉れあるは、承くるに徳を以てすればなり。）</div>\n<p>すでに高い地位にいて、亡き父の不始末の後を取り仕切る。結果として名誉が得られる。</p>\n<p><span class=\"tag\">程伝</span>五は尊位にいる。陰柔の質で君の幹に当たり、下は九二に応ずる。陽剛の才に任ずることができる者である。下の賢に応じて任せることができても、己は実に陰柔なので、創始開基の事はできない。旧業を承け継ぐならよい。だから父の蠱に幹たるとする。創業垂統の事は、剛明の才でなければできない。世を継ぐ君は、柔弱の質でも、よく剛賢の臣を信任すれば、善き継承者となって令誉を得られる。太甲・成王はみな臣によって誉れのある者である。</p>\n<p>本田の講説：太甲は幼い時暗愚で、伊尹が一時離宮に押し込めて教育し、立派な跡継ぎになった。成王も周公の補佐でどうにか武王の事業を引き継いだ。</p>\n<p><span class=\"tag\">象伝について程伝</span>父の蠱に幹たって誉れのあるのは、下にいる賢者が剛中の徳で自分を承け助けるからである。本田によれば、この「徳」は六五自身の徳とも考えられるが、程伊川は九二の徳と解している。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>自分に大事業を起こす力はなくても、優れた補佐役を信任して前代の事業を継げば、誉れを得る。</div></div></details><details class=\"yao\"><summary><span class=\"hex sm\"><i class=\"y\"></i><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\" mv\"></i></span><span class=\"p\">上九</span><span class=\"t\">不事王侯。高尚其事。</span></summary><div class=\"body\"><div class=\"yomi\">王侯に事えず。其の事を高尚にす。</div><div class=\"kd\"><span class=\"kl\">象伝</span>「不事王侯、志可則也。」（王侯に事えず、志則る可きなり。）</div>\n<p>王侯貴族に仕えず、自分の生き方を気高いものにする。「高尚」はここでは俗世間を超越していること。本田によれば、この二句はよく用いられ、『後漢書』逸民伝にも引かれている。</p>\n<p><span class=\"tag\">程伝</span>上九は蠱の終わりにいて、下に応がなく（三も陽で引き合わない）、事の外にいる。事とするところのない地である。剛明の才で応援なく、事のない地にいる。賢人君子が時に遇わず、高潔に自ら守り、世事に累わされない者である。だから「王侯に事えず、其の事を高尚にす」という。昔これを行った者がいる。伊尹・太公望の初め、曽子・子思のたぐいである。道を屈して時に徇わない。天下に施すことができなければ、自ら身を善くし、その事を尊び高尚にし、その志節を守るだけである。士が自ら高尚にするのは一つの道ではない（「程伝と本田の講説」の「隠者の諸類型」参照）。処するところに得失・大小の違いはあっても、みな自らその事を高尚にする者である。象伝に「志則る可し」とあるのは、進退が道に合う者である。</p>\n<p>本田の講説：伊尹はもと一介の農民で野を耕していた。太公望は最初、渭水で釣り糸を垂れ、餌を魚に取られても気づかずに糸を垂れ続けた（今でも釣り人を太公望という）。曽子は衛の国で三日間飯も食えずにいて、人が恵んだ飯を受け取らなかったが、そんな状況でも『詩経』を朗唱し、その声は天地に響き渡った（『荘子』譲王篇）。子思は孔子の孫で、非常に貧しく、友達が米を送ったら受け取ったが、別の友達が酒と肉を送ったら受け取らず、怒ったその人に「飢え死にして先祖の祭りができなくなるといけないから米だけは受け取ったが、それ以上の贅沢はしたくない」と答えた（『孔叢子』）。</p>\n<p><span class=\"tag\">象伝について程伝</span>上九のように事の外にいて世務に累わされず、王侯に臣事しないのは、進退が道により、用舎（用いられるか捨てられるか）が時に随うものである。賢者でなければできない。その守る志は法則とすべきである。</p>\n<div class=\"sen-box\"><span class=\"lbl\">占</span>世事の外にいて用いられない時。無理に仕えず、志を高く清く保て。その生き方は人の手本となる。</div></div></details><h2 class=\"sec\">講義での占いの実例</h2><div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>晋侯の病（『左伝』昭公元年）</div><div class=\"rb\">晋の殿様が病気にかかり、当時の名医に診断させたところ、「易で言えば蠱に当たる。何か淫らなこと、心が惑うことの結果であって、助からない」と言われ（「風、山を落とし、女、男を惑わす」）、実際に助からなかった。</div></div>\n<div class=\"rei\"><div class=\"rt\"><span class=\"tag\">実例</span>秦と晋の戦い（『左伝』僖公十五年）</div><div class=\"rb\">秦と晋が戦おうとした時、秦の王が占い者に占わせて蠱が出た。占い者は、山に風が吹きつければ木の実がバラバラと落ちるように、敵兵はバタバタと倒れるだろうと判断して「勝てる」と言い、実際その通りになった。本田は、このように蠱はあまり良い卦とは言えないのに、卦の判断は「元いに亨る、大川を渉るに利あり」であると言う。</div></div><div class=\"pager\"><a href=\"#gua-17\">← 沢雷随</a><a href=\"#gua-19\">地沢臨 →</a></div>", "gua-19": "<a class=\"back\" href=\"#gua\">← 30卦の一覧</a><div class=\"ghead\"><div class=\"no\">第 19 卦　第三十五講〜第三十六講</div><span class=\"hex big\"><i class=\"\"></i><i class=\"\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i><i class=\"y\"></i></span><div class=\"nm\">地沢臨</div><div class=\"yo\">ちたくりん</div><div class=\"tri\">上卦 ☷ 坤　／　下卦 ☱ 兌</div></div><div class=\"chips\"><a class=\"chip\" href=\"#gua-19\" data-jump=\"s0\">卦の名と象</a><a class=\"chip\" href=\"#gua-19\" data-jump=\"s1\">卦辞</a><a class=\"chip\" href=\"#gua-19\" data-jump=\"s2\">彖伝</a><a class=\"chip\" href=\"#gua-19\" data-jump=\"s3\">大象</a><a class=\"chip\" href=\"#gua-19\" data-jump=\"s4\">程伝と本田の講説</a><a class=\"chip\" href=\"#gua-19\" data-jump=\"s5\">占いの心得</a><a class=\"chip\" href=\"#gua-19\" data-jump=\"yao\">六爻</a></div><h3 id=\"g19-s0\">卦の名と象</h3>\n<p>臨は「のぞむ」の意味で、上の者が下に臨む、君主が民に臨む君臨の意味に用いる。本田によれば、『説文』では臨の字は「臥」と「品」からなり、臥は主人が寝ている側で奴隷が不寝番をしている形、品はもとは発音を表していて、ヒンの音がリンに転化したと考えられる。</p>\n<p>程伝（序卦伝を引く）：「事有りて而る後大なる可し。故に之を受くるに臨を以てす。臨とは大なり」。蠱は事である。事があって初めて大きくなりうる。だから臨が蠱に次ぐ。韓康伯（晋の人。十翼に注をつけた。魏の王弼は易の本文に注をつけただけで十翼には注をつけなかった）は「大なる可きの業は、事に由りて生ず」と言う。</p>\n<ul class=\"sen\"><li>二陽が下で伸びて大きくなろうとしているので、大の意味で臨と名づける。本田によれば、臨の字自体に大きいという意味はなく、物事が結果的に大きくなる意味を取って「大なり」と言っている。</li><li>卦は沢の上に地がある。沢の上の地は岸であり、水と接している。水に臨むので臨という。天下の物で近く密接に臨みあうものは、地と水に及ぶものはない。だから地の上に水があれば比、沢の上に地があれば臨である。</li><li>臨とは、民に臨む、事に臨むなど、およそ上から下に臨むものはみな臨である。卦では、上から下に臨む、君が民に臨む義を取る。</li></ul>\n<h3 id=\"g19-s1\">卦辞</h3>\n<div class=\"orig\">臨、元亨利貞。至于八月有凶。</div>\n<div class=\"yomi\">臨は、元いに亨る。貞しきに利あり。八月に至りて凶有り。</div>\n<p>この卦が出れば願いは大いに通る。ただし動機が正しいことを条件とする。元・亨・利・貞の四字がそろうのは一番めでたく、たいへん良い卦である。ただし八か月経つと悪いことがある。この「八月」を、朱子は一年の八番目の月と解するが、程伊川は八か月とする。</p>\n<p><span class=\"tag\">程伝</span>卦の才（下の兌は説ぶ、上の坤は順う）で言っている。臨の道が卦の才のようであれば、大いに亨って正しい。二陽が下でまさに伸び、陽の道が盛んに向かう時である。聖人はあらかじめ戒めて言う。陽はまさに盛んでも、八月に至ればその道は消える。これが凶である。だいたい聖人が戒めを発するのは、必ずまさに盛んな時である。盛んな時に衰えを慮れば、満ち極まるのを防ぎ、永久を図ることができる。衰えてから戒めても及ばない。昔から天下が安らかに治まっても、久しくして乱れないものはない。盛んな時に戒めることができなかったからである。盛んな時に戒めることを知らないので、安富に狃れれば驕侈が生じ、舒肆を楽しめば綱紀が壊れ、禍乱を忘れれば釁孽（きんげつ）が萌す。こうして次第に浸されて、乱が至るのに気づかないのである。本田によれば、釁は金属の器のひび割れ、孽はひこばえ（枯れた木から出た芽）である。</p>\n<h3 id=\"g19-s2\">彖伝</h3>\n<div class=\"orig\">臨、剛浸而長、說而順、剛中而應。大亨以正、天之道也。至于八月有凶、消不久也。</div>\n<div class=\"yomi\">臨は、剛浸（ようや）くにして長ず。説びて順い、剛中にして応あり。大いに亨るに正を以てするは、天の道なり。八月に至りて凶有り、消すること久しからざるなり。</div>\n<p><span class=\"tag\">程伝</span></p>\n<ul class=\"sen\"><li>浸は漸（ようやく）である。二陽が下で伸びて漸く進む。下は兌、上は坤で、和説して順である。剛（九二）が中道を得て応助（六五）がある。だから大いに亨って正を得、天の道に合う。剛正にして和順なのは天の道である。天地の化育の功がやまないのは、剛正和順だからにほかならない。これをもって人に臨み、事に臨み、天下に臨めば、大いに亨って正を得ないことはない。兌は説、説は和である。夬の彖伝に「決して和す」とある（本田：程伊川が「説」を「和説」と言い換えたことの補足）。</li><li>臨は二陽が生じ、陽がまさに盛んな時である。聖人は戒
