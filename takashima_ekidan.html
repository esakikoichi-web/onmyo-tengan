<script>

var G64="乾為天,乾,乾|坤為地,坤,坤|水雷屯,坎,震|山水蒙,艮,坎|水天需,坎,乾|天水訟,乾,坎|地水師,坤,坎|水地比,坎,坤|風天小畜,巽,乾|天沢履,乾,兌|地天泰,坤,乾|天地否,乾,坤|天火同人,乾,離|火天大有,離,乾|地山謙,坤,艮|雷地豫,震,坤|沢雷随,兌,震|山風蠱,艮,巽|地沢臨,坤,兌|風地観,巽,坤|火雷噬嗑,離,震|山火賁,艮,離|山地剥,艮,坤|地雷復,坤,震|天雷无妄,乾,震|山天大畜,艮,乾|山雷頤,艮,震|沢風大過,兌,巽|坎為水,坎,坎|離為火,離,離|沢山咸,兌,艮|雷風恒,震,巽|天山遯,乾,艮|雷天大壮,震,乾|火地晋,離,坤|地火明夷,坤,離|風火家人,巽,離|火沢睽,離,兌|水山蹇,坎,艮|雷水解,震,坎|山沢損,艮,兌|風雷益,巽,震|沢天夬,兌,乾|天風姤,乾,巽|沢地萃,兌,坤|地風升,坤,巽|沢水困,兌,坎|水風井,坎,巽|沢火革,兌,離|火風鼎,離,巽|震為雷,震,震|艮為山,艮,艮|風山漸,巽,艮|雷沢帰妹,震,兌|雷火豊,震,離|火山旅,離,艮|巽為風,巽,巽|兌為沢,兌,兌|風水渙,巽,坎|水沢節,坎,兌|風沢中孚,巽,兌|雷山小過,震,艮|水火既済,坎,離|火水未済,離,坎".split("|").map(function(x,i){var p=x.split(",");return{n:i+1,name:p[0],up:p[1],lo:p[2],gl:String.fromCharCode(0x4DC0+i)};});

var TYP=[["気運・運勢","気運|運気|時運|命運|国運|聖運|の運|行運|身事|社運"],["成否・可否・吉凶","成否|成敗|可否|吉凶|得失|盈虧|損益|利害|当落|勝敗|賛否|諾否|良否|真偽|有無|か否か|成就|功効|准否|虚実|駿駑|選挙|進退|解約"],["時期","の期|時期|完成の時|解停"],["結果・成り行き","結果|結局|形勢|帰結|顛末|見通し|前途|後来|将来|方向|治乱|興敗|盛衰|動静|院議|議会|施政|開戦|景況|戦況|和戦|真意|商務|財政"],["方策・処置","策|処置|方策|方法|教導|維持|処分|取立|仲裁|処理|準則|改革|家政"],["交際・人との関係","交際|援助|依頼|懇請|談判|使命|周旋|縁談|婚|娶|養子|養嗣"],["病気・出産・生死","病|大患|疾|分娩|産|腹痛|死|命の終|痞結|痔|懐妊"],["行方・失せ物・盗難","行方|失踪|出奔|失物|紛失|所在|盗|消息|帰国|遅延"],["天候・作柄","豊歉|豊凶|米作|晴雨|天候|作柄|洪水"]];
function allRei(){
  var out=[];
  TK.gua.slice().sort(function(a,b){return a.n-b.n;}).forEach(function(g){
    (g.rei||[]).forEach(function(r){out.push({src:g.name,href:"#gua/"+g.n,t:r.t,b:r.b});});
    (g.yao||[]).forEach(function(y){var yi=yIdx(y.p);(y.rei||[]).forEach(function(r){out.push({src:g.name+"・"+y.p,href:yi==null?"#gua/"+g.n:"#y/"+g.n+"/"+yi,t:r.t,b:r.b});});});
  });
  (TK.furoku||[]).forEach(function(s){(s.items||[]).forEach(function(r){out.push({src:"附録・"+s.title,href:"#furoku",t:r.t,b:r.b});});});
  return out;
}
function reiChips(cur){return'<p class="small dim">占的の型で選ぶ</p><div class="chips"><a class="chip'+(cur==="all"?" on":"")+'" href="#rei">すべて</a>'+TYP.map(function(c,i){return'<a class="chip'+(cur==="t"+i?" on":"")+'" href="#rei/t'+i+'">'+c[0]+"</a>";}).join("")+'</div><p class="small dim">分野で選ぶ</p><div class="chips">'+CAT.slice(1).map(function(c,i){return'<a class="chip'+(cur==="f"+(i+1)?" on":"")+'" href="#rei/f'+(i+1)+'">'+c[0]+"</a>";}).join("")+"</div>";}
function vRei(k){
  var A=allRei(),R=A,lbl="すべて";
  if(k&&k.charAt(0)==="t"){var c=TYP[+k.slice(1)];lbl="占的の型："+c[0];var re=new RegExp(c[1]);R=A.filter(function(r){return re.test(r.t);});}
  else if(k&&k.charAt(0)==="f"){var c2=CAT[+k.slice(1)];lbl="分野："+c2[0];var re2=new RegExp(c2[1]);R=A.filter(function(r){return re2.test(r.t+r.b+r.src);});}
  var MY=(TK.myrei||[]);var myh=MY.length&&!k?'<h2 class="sec">青龍孔一の占例</h2><div class="rl">'+MY.slice().reverse().map(function(r){var g=null;TK.gua.forEach(function(x){if(x.n===r.n)g=x;});return'<a href="#y/'+r.n+"/"+r.yi+'"><small>'+esc(r.date)+"　"+(g?esc(g.name)+"・"+esc(yname(g,r.yi)):"")+"</small>"+esc(r.t)+"</a>";}).join("")+"</div>":"";
  var h=myh+'<h2 class="sec">占例集</h2><p class="small dim">高島が実際に筮した記録。題をタップすると、その爻のページで本文が読めます。占的の型は題の言葉から機械的に分けたもので、目安です。</p>'+reiChips(k||"all")+'<div class="count">'+esc(lbl)+"　"+R.length+" 件 ／ 全 "+A.length+' 件</div><div class="rl">'+R.map(function(r){return'<a href="'+r.href+'"><small>'+esc(r.src)+"</small>"+esc(r.t)+"</a>";}).join("")+"</div>";
  app.innerHTML=h;
}
function vYao(n,yi){
  var g=null;TK.gua.forEach(function(x){if(x.n===n)g=x;});if(!g){vGuaList();return;}
  var y=null,KD=(TK.kd&&TK.kd[g.n])||{y:[]},idx=-1;(g.yao||[]).forEach(function(x,k){if(yIdx(x.p)===yi){y=x;idx=k;}});if(!y){vGua(n);return;}
  var z=zhi(g,yi);
  var h='<a class="back" href="#gua/'+g.n+'">← '+esc(g.name)+' の全体（卦辞・六爻の流れ）</a><div class="hk">'+hexb(bits(g),"sm",yi)+'<div><a class="nm" href="#gua/'+g.n+'"><span class="gl">'+(g64(g.name)?g64(g.name).gl:"")+"</span>"+esc(g.name)+"</a>　"+esc(y.p)+'<div class="small dim">之卦 '+zlink(z)+"</div></div></div>";
  h+='<div class="yl">'+["初","二","三","四","五","上"].map(function(c,k){return'<a href="#y/'+g.n+"/"+k+'"'+(k===yi?' style="background:var(--soft);font-weight:700"':"")+">"+c+"</a>";}).join("")+"</div>";
  h+='<details class="yao" open><summary><span class="p">'+esc(y.p)+'</span><span class="t">'+esc(y.t)+'</span></summary><div class="body">'+yaoBody(g,y,idx,KD)+"</div></details>";
  if(g.kaji)h+='<h3>卦辞（参考）</h3><div class="card"><div class="orig">'+esc(g.kaji.t)+"</div>"+(KD.k?kdl(KD.k,KD.rk):'<div class="yomi">'+esc(g.kaji.y)+"</div>")+pl(g.kaji.p)+"</div>";
  app.innerHTML=h;
}
function vHiku(){
  var h='<h2 class="sec">爻を引く</h2><p class="small dim">筮して得た卦の、得た爻の番号をタップすると、その爻のページ（爻辞・象伝・講説・占断・占例・之卦）が開きます。卦の並びは六十四卦の順。下の早見表で上卦と下卦から卦名を探せます。</p>';
  TK.gua.slice().sort(function(a,b){return a.n-b.n;}).forEach(function(g){h+='<div class="hk">'+hex(g)+'<a class="nm" href="#gua/'+g.n+'">'+g.n+"　"+esc(g.name)+'</a></div><div class="yl">'+["初","二","三","四","五","上"].map(function(c,k){return'<a href="#y/'+g.n+"/"+k+'">'+c+"</a>";}).join("")+"</div>";});
  h+='<h2 class="sec">早見表（上卦×下卦）</h2>'+table64();
  app.innerHTML=h;
}
function vFuroku(){
  var h='<h2 class="sec">附録</h2><p class="small dim">上巻巻末の附録（日清・日露戦争をはじめ、時局・国運・商況・豊凶などの占断）と、下巻巻末の附録（神道実用論・演説・序跋・霊魂不滅・性命道の説・清国名家の評）。</p>';
  (TK.furoku||[]).forEach(function(s){h+="<h3>"+esc(s.title)+"</h3>"+paras(s.intro)+reis(s.items);});
  app.innerHTML=h;
}
function route(){
  var hsh=(location.hash||"#home").slice(1),p=hsh.split("/");
  if(p[0]==="y"&&p[1]){setTab("hiku");vYao(+p[1],+p[2]);}
  else if(p[0]==="hiku"){setTab("hiku");vHiku();}
  else if(p[0]==="ten"){setTab("jo");vTen(p[1]);}
  else if(p[0]==="gua"&&p[1]){setTab("gua");vGua(+p[1]);}
  else if(p[0]==="gua"){setTab("gua");vGuaList();}
  else if(p[0]==="jo"){setTab("jo");vJo();}
  else if(p[0]==="rei"){setTab("rei");vRei(p[1]);}
  else if(p[0]==="furoku"){setTab("furoku");vFuroku();}
  else{setTab("home");vHome();}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
var tb=document.getElementById("themebtn");
try{var st=localStorage.getItem("tk-theme");if(st)document.documentElement.setAttribute("data-theme",st);}catch(e){}
tb.addEventListener("click",function(){var cur=document.documentElement.getAttribute("data-theme");var dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;var nx=dark?"light":"dark";document.documentElement.setAttribute("data-theme",nx);try{localStorage.setItem("tk-theme",nx);}catch(e){}});
route();
})();
</script>
