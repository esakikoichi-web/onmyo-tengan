 for(var k=0;k<8;k++){var a=(-90+45*k)*Math.PI/180;var x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);var t=order[k];var rot=45*k;

  TRI[t].b.forEach(function(v,j){var yy=-8+ (j)*8;yy=10-j*9;if(v)h+='<rect x="-18" y="'+(yy-6)+'" width="36" height="5" fill="var(--gold)"/>';else h+='<rect x="-18" y="'+(yy-6)+'" width="15" height="5" fill="var(--gold)"/><rect x="3" y="'+(yy-6)+'" width="15" height="5" fill="var(--gold)"/>';});
  h+='</g>';
  var lx=cx+(R+38)*Math.cos(a),ly=cy+(R+38)*Math.sin(a);var ix=cx+(R-44)*Math.cos(a),iy=cy+(R-44)*Math.sin(a);
  h+='<text x="'+ix.toFixed(1)+'" y="'+(iy+5).toFixed(1)+'" text-anchor="middle" font-size="14" font-weight="700" fill="var(--bright)">'+t+TRI[t].o+'</text>';
  h+='<text x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--dim)">'+dirs[k]+'</text>';}
 return h+'</svg><div class="fc">'+cap+'</div></div>';}
function posTable(){var rows=[["上","第六爻","陰位（偶）","","三と応","終わり・顧問官・隠居",0],["五","第五爻","陽位（奇）","外卦の中","二と応","君・主人・社長",1],["四","第四爻","陰位（偶）","","初と応","宰相・側近",0],["三","第三爻","陽位（奇）","","上と応","内外の境・危地",1],["二","第二爻","陰位（偶）","内卦の中","五と応","大臣・支配人・妻",0],["初","第一爻","陽位（奇）","","四と応","始まり・民・手代",1]];
 var h='<table class="pos"><tr><th>爻</th><th>本来の位</th><th>中</th><th>応</th><th>高島の配当</th></tr>';

function table64(){var O=["乾","兌","離","震","巽","坎","艮","坤"];var h='<div style="overflow-x:auto"><table class="g64"><tr><th>下＼上</th>'+O.map(function(u){return"<th>"+TRI[u].s+"<br>"+u+"</th>";}).join("")+"</tr>";
 O.forEach(function(l){h+="<tr><th>"+TRI[l].s+"<br>"+l+"</th>";O.forEach(function(u){var g=null;for(var i=0;i<64;i++)if(G64[i].up===u&&G64[i].lo===l)g=G64[i];var inb=TK.gua.some(function(x){return x.n===g.n;});h+='<td class="'+(inb?"in":"")+'">'+(inb?'<a href="#gua/'+g.n+'">':"")+'<span class="gl">'+g.gl+"</span>"+g.name+(inb?"</a>":"")+"</td>";});h+="</tr>";});
 return h+'</table></div><p class="small dim">縦が下卦、横が上卦。色付きの卦をタップすると講話へ飛ぶ（上経三十卦＝上巻、下経三十四卦＝下巻）。</p>';}

    h+=paras(y.k);
    if(y.sen)h+='<p><span class="lbl">占</span>'+esc(y.sen).replace(/\n/g,"<br>")+"</p>";

var CAT=[["すべて",""],["国家・政治","国家|政府|議会|大臣|内閣|征韓|条約|憲法|国会|貴顕|公|伯"],["戦争・外交","戦争|戦|清|露|朝鮮|韓国|艦隊|軍|講和|談判"],["商売・事業","商|会社|銀行|事業|店|相場|石炭|鉄道|開墾|株"],["家・人事","家|子|妻|婚|親族|養子|官吏|昇進|進退"],["病気・生死","病|死|産|疾|怪我|負傷"],["天候・豊凶","豊凶|作|晴雨|大漁|米"]];
var curCat=0,curQ="";
function allRei(){
  var out=[];
  TK.gua.slice().sort(function(a,b){return a.n-b.n;}).forEach(function(g){
    (g.rei||[]).forEach(function(r){out.push({src:g.name,href:"#gua/"+g.n,t:r.t,b:r.b});});
    (g.yao||[]).forEach(function(y){(y.rei||[]).forEach(function(r){out.push({src:g.name+"・"+y.p,href:"#gua/"+g.n,t:r.t,b:r.b});});});
  });
  (TK.furoku||[]).forEach(function(s){(s.items||[]).forEach(function(r){out.push({src:"附録・"+s.title,href:"#furoku",t:r.t,b:r.b});});});
  return out;
}
function vRei(){
  var h='<h2 class="sec">占例集</h2><p class="small dim">高島が実際に筮した記録。語句で絞り込めます（例：伊藤、石炭、選挙、病）。</p><input class="search" id="q" type="search" placeholder="キーワードで検索" value="'+esc(curQ)+'"><div class="chips">'+CAT.map(function(c,i){return'<button class="chip'+(i===curCat?" on":"")+'" data-i="'+i+'">'+c[0]+"</button>";}).join("")+'</div><div id="cnt" class="count"></div><div id="rl"></div>';
  app.innerHTML=h;
  var q=document.getElementById("q");
  q.addEventListener("input",function(){curQ=q.value;drawRei();});
  [].forEach.call(app.querySelectorAll(".chip"),function(b){b.addEventListener("click",function(){curCat=+b.getAttribute("data-i");[].forEach.call(app.querySelectorAll(".chip"),function(x){x.classList.toggle("on",x===b);});drawRei();});});
  drawRei();
}
function drawRei(){
  var A=allRei(),re=CAT[curCat][1]?new RegExp(CAT[curCat][1]):null,q=curQ.trim();
  var R=A.filter(function(r){var s=r.t+r.b+r.src;return(!re||re.test(s))&&(!q||s.indexOf(q)>=0);});
  document.getElementById("cnt").textContent=R.length+" 件 ／ 全 "+A.length+" 件";
  document.getElementById("rl").innerHTML=R.map(function(r){return'<div class="rei"><div class="small"><a class="tag" href="'+r.href+'">'+esc(r.src)+'</a></div><div class="rt">'+esc(r.t)+'</div><div class="rb">'+esc(r.b)+"</div></div>";}).join("");
}
function vFuroku(){
  var h='<h2 class="sec">附録</h2><p class="small dim">上巻巻末の附録（日清・日露戦争をはじめ、時局・国運・商況・豊凶などの占断）と、下巻巻末の附録（神道実用論・演説・序跋・霊魂不滅・性命道の説・清国名家の評）。</p>';
  (TK.furoku||[]).forEach(function(s){h+="<h3>"+esc(s.title)+"</h3>"+paras(s.intro)+reis(s.items);});
  app.innerHTML=h;
}
function route(){
  var hsh=(location.hash||"#home").slice(1),p=hsh.split("/");
  if(p[0]==="gua"&&p[1]){setTab("gua");vGua(+p[1]);}
  else if(p[0]==="gua"){setTab("gua");vGuaList();}
  else if(p[0]==="jo"){setTab("jo");vJo();}
  else if(p[0]==="rei"){setTab("rei");vRei();}
  else if(p[0]==="furoku"){setTab("furoku");vFuroku();}
  else{setTab("home");vHome();}
  window.scrollTo(0,0);
}
