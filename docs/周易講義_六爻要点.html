 hint:'<ul><li>結婚・所属・入社。控えめに、手順を踏む。自分から取り入るのは凶。</li><li>終わりを永くするには始めに弊害を知る。</li><li>婚約・契約が中途で破れることがある。</li></ul>',
 ks:'',
 all:'天子の妹が諸侯に嫁ぐ卦。寵を独占せず控えめであることを貴び、自ら取り入ることを戒める。'
});

H({n:55, name:'雷火豊', kana:'らいかほう', tri:'震離', theme:'盛大の極・中を過ぎるな',
 k:'豊{ほう}は亨{とお}る。王{おう}之{これ}に仮{いた}る。憂{うれ}うる勿{なか}れ。日中{にっちゅう}に宜{よろ}し。|豐。亨。王假之。勿憂。宜日中。',
 kn:'豊(豐)は充満、盛大の極。王は明君で行き届く。日中に宜し＝離＝日が中天で遍く照らす、明を翳らせるな。彖：日中すれば則ち昃き、月盈つれば則ち食く。天地の盈虚は時と消息す、況んや人に於てをや、況んや鬼神に於てをや＝盛衰は自然で、長く保つのは難しい。',
 d:'雷電{らいでん}皆{みな}至{いた}るは豊{ほう}なり。君子{くんし}以{もっ}て獄{ごく}を折{さだ}め刑{けい}を致{いた}す。|象曰。雷電皆至豐。君子以折獄致刑。',
 dn:'雷と電(稲光が先、雷鳴が後)が共に至る。安楽の時は人心が緩み、奢侈・淫佚・下が上を犯す→刑を明らかに。「勿憂」の含意：漢高祖は晩年に死後を憂えて罪なき韓信・彭越を殺し、蕭何を捕え、樊噲を捕えよと命じた(呂后と戚夫人・趙王如意を案じて)＝子孫の賢不肖は天に任せ、憂え過ぎるな。',
 y:[
  ['初九','其{そ}の配主{はいしゅ}に遇{あ}う。旬{じゅん}と雖{いえど}も咎{とが}无{な}し。往{ゆ}けば尚{たっと}ばるる有{あ}り。|遇其配主。雖旬无咎。往有尚。','九四(同徳の陽)と遇って共に安楽を保つ。旬＝十日(初九一＋六二二＋九三三＋六四四＝十)、離＝日。旬を過ぐれば災いあり。'],
  ['六二','其{そ}の蔀{しとみ}を豊{おお}いにす。日中{にっちゅう}に斗{と}を見{み}る。往{ゆ}けば疑疾{ぎしつ}を得{う}。孚{まこと}有{あ}りて発若{はつじゃく}たれば吉{きつ}。|豐其蔀。日中見斗。往得疑疾。有孚發若。吉。','蔀＝草で日を遮る覆い。小人が君の明を覆い、昼に北斗(権臣)が見える。往けば讒言で疑われる。精神で六五を感動させ動かせば吉。信以て志を発す。'],
  ['九三','其{そ}の沛{はい}を豊{おお}いにす。日中{にっちゅう}に沫{まつ}を見{み}る。其{そ}の右肱{ゆうこう}を折{お}る。咎{とが}无{な}し。|豐其沛。日中見沫。折其右肱。无咎。','沛＝幡(帳)、沫＝小星、ますます暗い。上六(最悪の権臣)が九三の豪傑を引き込もうとする→自ら右腕を折って用をなさぬと示す。大事に可ならず、終に用う可からず。'],
  ['九四','其{そ}の蔀{しとみ}を豊{おお}いにす。日中{にっちゅう}に斗{と}を見{み}る。其{そ}の夷主{いしゅ}に遇{あ}う。吉{きつ}。|豐其蔀。日中見斗。遇其夷主。吉。','君の明を晦ます大臣。夷主＝初九(下賤の賢人)に遇い、大臣の位を去れば吉(諷諫)。位当たらず、幽にして明らかならず。'],
  ['六五','章{あや}を来{きた}す。慶誉{けいよ}有{あ}り。吉{きつ}。|來章。有慶譽。吉。','章＝文明の徳ある六二を招き来たす(六二の精神が天子に貫徹)。天下の慶び。'],
  ['上六','其{そ}の屋{おく}を豊{おお}いにし、其{そ}の家{いえ}を蔀{おお}う。其{そ}の戸{と}を闚{うかが}えば、闃{げき}として其{そ}れ人{ひと}无{な}し。三歳{さんさい}覿{み}えず。凶{きょう}。|豐其屋。蔀其家。闚其戶。闃其无人。三歲不覿。凶。','権臣が富貴を極め、阿房宮のように天まで届く家を建てるが、やがて荒れ果て草に覆われ、戸から覗けば人がいない。主は滅ぶ。天際に翔るなり、自ら蔵るるなり。']
 ],
 hint:'<ul><li>最盛期。この後は傾く。中を過ぎない。</li><li>権臣・側近に明(判断)を覆われる。誠で上を動かす。</li><li>先を憂え過ぎない。子孫・後継のことは天に任せる。</li></ul>',
 ks:'',
 all:'盛大の極の卦。日中すれば昃く。権臣に明を覆われる危うさと、豪奢の果ての荒廃(上六)を説く。'
});

H({n:56, name:'火山旅', kana:'かざんりょ', tri:'離艮', theme:'旅人・身を小さく正しく',
 k:'旅{りょ}は小{すこ}しく亨{とお}る。旅{りょ}には貞{てい}なれば吉{きつ}。|旅。小亨。旅貞吉。',
 kn:'豊の顛倒。国を失った諸侯や家を失った卿大夫が外に出る。旅人は高振らず身を小さくして人に順えば小しく亨るが、正しくなければならない。彖：柔中を外に得て剛に順い(豊の二が外卦の中へ、四・上の陽に順う)、止まりて明に麗く(艮止・離明＝明徳ある人に附く、悪人に附くな)。旅の時義大いなるかな＝旅の艱難変化に機を見る。',
 d:'山上{さんじょう}に火{ひ}有{あ}るは旅{りょ}なり。君子{くんし}以{もっ}て明{あき}らかに慎{つつし}みて刑{けい}を用{もち}い、獄{ごく}を留{とど}めず。|象曰。山上有火旅。君子以明愼用刑。而不留獄。',
 dn:'火は山上に留まらず過ぎ行く、家にあるべき火が外に出る＝旅。旅人が法を知らずに犯した時、知人もなく困窮して獄中で寒暑に死ぬこともある→下賤でも人一人として明慎に裁き、獄に長く留めない。',
 y:[
  ['初六','旅{りょ}して瑣瑣{ささ}たり。斯{こ}れ其{そ}の災{わざわい}を取{と}る所{ゆえん}なり。|旅瑣瑣。斯其所取災。','豊で奢りを極め放逐された大臣。瑣瑣＝小さい(鄭玄)、一銭を争う卑劣さで恨まれ、災を自ら取る。志窮まりて災あり。'],
  ['六二','旅{りょ}して次{やど}に即{つ}き、其{そ}の資{し}を懐{いだ}き、童僕{どうぼく}の貞{てい}を得{う}。|旅即次。懷其資。得童僕貞。','次＝宿、資＝金を懐く。童(若い)僕(年取った)の忠誠を得て辛苦を共にする。晋の公子重耳の亡命：狐偃・趙衰ら五賢人が兄弟のように従い、後に覇者に。曹の僖負羈の妻は従者を見て「皆以て国に相たるに足る」と飧(夕食)に璧を隠して贈り、重耳は食を受けて璧を返した＝困窮しても正しく。終に尤无し。'],
  ['九三','旅{りょ}して其{そ}の次{やど}を焚{や}き、其{そ}の童僕{どうぼく}を喪{うしな}う。貞{てい}なれども厲{あやう}し。|旅焚其次。喪其童僕。貞厲。','艮の上＝山上に高く止まって亢ぶり、童僕を軽んじて離反される。上の離(火)に近く宿が焼ける。旅を以て下に与す、其の義喪ぶ＝旅の苦労を下に押しつける。苦楽を共にせよ。'],
  ['九四','旅{りょ}して処{お}り、其{そ}の資斧{しふ}を得{う}。我{わ}が心{こころ}快{こころよ}からず。|旅于處。得其資斧。我心不快。','六五天子の近くで旅館と禄(資)と身を衛る斧を賜るが官職がない＝孟子が斉の宣王に厚遇されても職がなく去った。未だ位を得ず。'],
  ['六五','雉{きじ}を射{い}て一矢{いっし}亡{うしな}う。終{つい}に以{もっ}て誉命{よめい}あり。|射雉一矢亡。終以譽命。','古今は文王の羑里や重耳の例とするが誤り。五は天子、天子は四海を家とし旅はない。旅の賢人が六五の明君(離の主)に仕える。雉は士の贄(周礼「士は雉を執る」)。一矢で雉を射る＝文武兼備の誉れで命ぜられて官に出る。上に逮ぶ(孟子「天下の商賈皆王の市に蔵せんと欲し、行旅皆王の塗に出でんと欲す」)。'],
  ['上九','鳥{とり}其{そ}の巣{す}を焚{や}く。旅人{りょじん}先{さき}には笑{わら}い後{のち}には号咷{ごうとう}す。牛{うし}を易{えき}に喪{うしな}う。凶{きょう}。|鳥焚其巢。旅人先笑後號咷。喪牛于易。凶。','離の極、高い所を好む鳥が巣を焼かれる＝豊の時に笑い楽しんだ者が旅人となっても驕り、財産を載せた牛を境で失う。牛を易に喪うの凶は、終に之を聞く莫し＝誰も同情しない。']
 ],
 hint:'<ul><li>旅・移動・転勤・仮住まい・よそ者の立場。</li><li>驕らず、従う者と苦楽を共にする。一銭を争わない。</li><li>明徳ある人に附けば、やがて召されて誉れを得る。</li></ul>',
 ks:'六五を文王・重耳とする古今の説は誤り。五は天子で、天子に旅はない。',
 all:'国や家を失って外に出る旅の卦。身を小さく正しく、明徳ある人に附けと説く。'
});
H({n:57, name:'巽為風', kana:'そんいふう', tri:'巽巽', theme:'重ねて命ずる・摂政の改革',
 k:'巽{そん}は小{すこ}しく亨{とお}る。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。大人{たいじん}を見{み}るに利{よろ}し。|巽。小亨。利有攸往。利見大人。',
 kn:'山風蠱と関係する。蠱は天子崩御の後に皇太子が改革するが、巽は天子の存命中に皇太子が天子に代わって改革し、重ねて命令を下す(乾文言「乾道乃ち革まる」)。堯が舜に摂政させて隠居した(遯九五「嘉遯」と照応)のは巽卦を用いたもの。四と初の陰が主で陽に順う→小しく亨る。彖：重巽以て命を申ぬ(巽＝命令、重ねて丁寧に下す)。剛中正に巽いて志行わる(九五)。柔皆剛に順う。',
 d:'随風{ずいふう}は巽{そん}なり。君子{くんし}以{もっ}て命{めい}を申{かさ}ね事{こと}を行{おこな}う。|象曰。隨風巽。君子以申命行事。',
 dn:'風が次々と吹くように、一度命令して間を置いてまた命令する、丁寧反復。',
 y:[
  ['初六','進退{しんたい}す。武人{ぶじん}の貞{てい}に利{よろ}し。|進退。利武人之貞。','巽＝進退・不果(決断できない)、柔弱で疑い深い→武人のように疑いを断って決断せよ。志疑う、志治まる。'],
  ['九二','巽{したが}いて牀下{しょうか}に在{あ}り。史巫{しふ}を用{もち}うること紛若{ふんじゃく}たれば吉{きつ}にして咎{とが}无{な}し。|巽在牀下。用史巫紛若。吉无咎。','巽＝牀(寝台)。九二は貴いのに牀の下に謙って初六(下賤)と交わる。史(神に告げる祝文を書く官)・巫(舞で神に仕える)を用いるように、飾りでなく誠で下を感ぜしめる。紛若＝文飾多く尽くす。中を得。'],
  ['九三','頻{しき}りに巽{したが}う。吝{りん}。|頻巽。吝。','巽＝風＝しばしば変わる。巽順も頻りに変われば信を失う。志窮まる。'],
  ['六四','悔{くい}亡{ほろ}ぶ。田{かり}して三品{さんぴん}を獲{う}。|悔亡。田獲三品。','大臣(陰で陰位)が九五の命を受けて下に施し、民心に深く入る(巽＝入)→狩でも民が力を尽くし三品(上＝宗廟の祭、中＝賓客、下＝天子の料理)を獲る。功有り。'],
  ['九五','貞{てい}にして吉{きつ}。悔{くい}亡{ほろ}び、利{よろ}しからざる无{な}し。初{はじ}め无{な}くして終{お}わり有{あ}り。庚{こう}に先{さき}だつこと三日{みっか}、庚{こう}に後{おく}るること三日{みっか}。吉{きつ}。|貞吉。悔亡。无不利。无初有終。先庚三日。後庚三日。吉。','互体兌＝秋＝十干の庚(金)、金＝革める→旧弊の改革。无初有終＝天子(堯)の始めた根本は改めず、弊害だけ除いて終わりを遂げる(舜は文祖に終わりを受け、皆堯に順った)。先庚三日＝丁戊己、後庚三日＝辛壬癸、甲乙(始め)がない＝无初、癸(終わり)まで＝有終。蠱の「先甲後甲、終われば則ち始め有り」と対(蠱は父が終わり子が始める)。位正中なり。'],
  ['上九','巽{したが}いて牀下{しょうか}に在{あ}り。其{そ}の資斧{しふ}を喪{うしな}う。貞{てい}なれども凶{きょう}。|巽在牀下。喪其資斧。貞凶。','欲深い大臣(巽の極)が官を辞めるべきなのに辞めたくなく、誰にでも諂って牀の下に謙る＝品格なく笑われ、却って禄(資)と威厳(斧)を失う。上窮まる、正に凶なり。']
 ],
 hint:'<ul><li>従う・入る・命令・伝達。丁寧に繰り返して浸透させる。</li><li>疑って決断できない時は、武人のように断つ。</li><li>前任者の根本は変えず、弊害だけを改める。</li></ul>',
 ks:'',
 all:'天子存命中の摂政の改革の卦。先庚三日後庚三日で「根本は改めず弊を除く」を示し、蠱と対をなす。'
});

H({n:58, name:'兌為沢', kana:'だいたく', tri:'兌兌', theme:'真の悦び',
 k:'兌{だ}は亨{とお}る。貞{ただ}しきに利{よろ}し。|兌。亨。利貞。',
 kn:'兌は悦(説)。本は兌だけで悦ぶ意、心(忄)や言(言)を付けたのは後。心なく自然に出る悦びが真で、巧言令色の作った悦びは偽(咸の無心の感と同じ)。兌が二つ＝我悦び彼も悦ぶ、内外相悦ぶ(中庸「中和を致せば天地位し万物育す」)。彖：剛中にして柔外(心は剛で正しく、交わりは温順)。天に順い人に応ず。説びて以て民に先んずれば民其の労を忘れ、説びて以て難を犯せば民其の死を忘る。説の大なる、民勧むるかな。',
 d:'麗沢{りたく}は兌{だ}なり。君子{くんし}以{もっ}て朋友{ほうゆう}講習{こうしゅう}す。|象曰。麗澤兌。君子以朋友講習。',
 dn:'麗沢＝沢が二つ連なる。沢は堤で水を貯え四方を潤し光沢を生む(国語「沢は水の鍾まるなり」)。兌＝口が二つ＝朋友が問答して講習する。',
 y:[
  ['初九','和{わ}して兌{よろこ}ぶ。吉{きつ}。|和兌。吉。','説びの始め、若く世慣れず質朴に和して悦ぶ。行い未だ疑われず。'],
  ['九二','孚{まこと}ありて兌{よろこ}ぶ。吉{きつ}。悔{くい}亡{ほろ}ぶ。|孚兌。吉。悔亡。','剛で陰位だが山沢の間で中を得る。顔回のように道を楽しみ世に出ない幽人、志が人に信じられる。志を信ず。'],
  ['六三','来{きた}りて兌{よろこ}ぶ。凶{きょう}。|來兌。凶。','兌の主＝坤から来た陰、口先の巧みさで下卦の上(貴い位)に上った佞人。位当たらず。'],
  ['九四','商{はか}りて兌{よろこ}び未{いま}だ寧{やす}からず。介{へだ}てて疾{にく}めば喜{よろこ}び有{あ}り。|商兌未寧。介疾有喜。','九五の明君を承ける大臣だが、六三の媚びに迷って商り心が定まらない。疾(六三の邪)を介(界)で隔てれば喜びあり。慶び有り＝国家の大慶。'],
  ['九五','剥{はく}に孚{まこと}あり。厲{あやう}き有{あ}り。|孚于剝。有厲。','兌は秋三か月(初＝七月、二＝八月、上＝九月＝剥の時)＝上六は君子を剥ぐ小人。九五の明君は小人を撃ち退けるのは易いが、徳の孚で感化しようとする。小人は危険なので厲。位正に当たる＝殺すのを好まず感化に目を向ける。古今の説は読めていない。'],
  ['上六','引{ひ}きて兌{よろこ}ぶ。|引兌。','大臣が六三と縄を引き合うように離れず、悪事を共にして悦ぶ(約象巽＝縄)。未だ光いならず＝天子の徳がまだ感化に至らない。史記魏其武安侯列伝「灌夫亦た魏其に倚りて縄を引きて根を批く」は引兌から出た語＝司馬遷は易を活用した。']
 ],
 hint:'<ul><li>喜び・交流・講習・話し合い。</li><li>甘言・媚びの佞人に注意し、界を立てて隔てる。</li><li>人を悦ばせて先に立てば、労も難も忘れて付いてくる。</li></ul>',
 ks:'九五「孚于剥」を古今は読めていない。剥＝上六の小人で、明君が殺さず徳で感化しようとすること。',
 all:'心なく自然に出る真の悦びの卦。佞人の作り笑い(六三・上六)を隔て、朋友と講習する。'
});

H({n:59, name:'風水渙', kana:'ふうすいかん', tri:'巽坎', theme:'凝りを散ずる・天下和合',
 k:'渙{かん}は亨{とお}る。王{おう}有廟{ゆうびょう}に仮{いた}る。大川{たいせん}を渉{わた}るに利{よろ}し。貞{ただ}しきに利{よろ}し。|渙。亨。王假有廟。利涉大川。利貞。',
 kn:'説文「流散なり」、水が四方に散る。下坎＝冬・北＝氷が固まる(陰の凝結)、互体震＝旧二月＝雷が鳴り氷が解けて散る。渙＝凝り固まった悪(邪・小人)を砕き散じて君子が盛んになる。上巽＝風が吹いて氷を砕く。天下が和合して宗廟の祭に集まる(王仮有廟)、天下が一家のようになる。彖：王仮有廟、王乃ち中に在り＝都は天下の中央に置け(周公が洛陽を建てた、偏れば遠方の諸侯が迷惑)。大川を渉るに利し、木に乗りて功有り(震＝木＝舟)。',
 d:'風{かぜ}水上{すいじょう}を行{ゆ}くは渙{かん}なり。先王{せんのう}以{もっ}て帝{てい}に享{まつ}り廟{びょう}を立{た}つ。|象曰。風行水上渙。先王以享于帝立廟。',
 dn:'二月の風が氷を解かす＝天下の難が解ける→天を祭り廟を立て、諸侯が集まる。',
 y:[
  ['初六','用{もっ}て拯{すく}うに馬{うま}壮{さか}んなれば吉{きつ}。|用拯馬壯。吉。','坎＝陥れる、六三が九二の賢人を陥れている→初六が壮んな馬で速やかに救う。順なり。'],
  ['九二','渙{かん}のとき其{そ}の机{き}に奔{はし}る。悔{くい}亡{ほろ}ぶ。|渙奔其机。悔亡。','机＝天子(朝見の時、天子は左右に机を置いて寄りかかる)＝九五。賢人が天子に奔って力を尽くす。願いを得。'],
  ['六三','其{そ}の躬{み}を渙{さん}ず。悔{くい}无{な}し。|渙其躬。无悔。','躬＝私欲。始めは九二を困めたが、六四に悪を砕かれて私を無くした。志外に在り。'],
  ['六四','其{そ}の群{ぐん}を渙{さん}ず。元吉{げんきつ}。渙{かん}のとき丘{きゅう}有{あ}り。夷{つね}の思{おも}う所{ところ}に匪{あら}ず。|渙其群。元吉。渙有丘。匪夷所思。','群＝党派の団結(説卦「風以て之を散ず」)。大臣が天下の朋党をことごとく砕く。丘＝土が聚まった高み＝団結、それも砕く。常人の思い及ぶ所でない。光大なり。'],
  ['九五','渙{かん}のとき其{そ}の大号{たいごう}を汗{あせ}にす。渙{かん}のとき王居{おうきょ}なれば咎{とが}无{な}し。|渙汗其大號。渙王居。无咎。','天下を一身とし(人民＝足、役人＝手・股)、邪に閉じられた身体から汗を出す＝大号令で天下の邪を解いて病を癒やす。王居＝天下は王の住まい、その中の悪を砕く。位を正すなり。'],
  ['上九','其{そ}の血{ち}を渙{さん}ず。去{さ}りて逖{とお}く出{い}づ。咎{とが}无{な}し。|渙其血。去逖出。无咎。','巽＝高・潔白。小人を悪み世を去って遠くに身を潔くする(論語微子の長沮・桀溺)。血(坎＝血)＝人を傷つける小人を天下の志士が砕く世だが、上九は関わらない。害に遠ざかる。']
 ],
 hint:'<ul><li>散る・解ける。凝り固まった問題・派閥を解く時。</li><li>私心・党派を捨てる。</li><li>大号令・方針転換で滞りを汗のように出す。</li></ul>',
 ks:'九五「渙汗其大号」を「出た汗は戻らない＝命令は取り消せない」と読む後世の説は誤り。天下の邪を汗のように出して病を癒やすこと。',
 all:'二月の風が氷を解くように、凝り固まった邪と朋党を砕いて天下を和合させる卦。'
});

H({n:60, name:'水沢節', kana:'すいたくせつ', tri:'坎兌', theme:'分限・竹の節',
 k:'節{せつ}は亨{とお}る。苦節{くせつ}は貞{てい}にす可{べ}からず。|節。亨。苦節不可貞。',
 kn:'節は竹の節(竹約也、約は糸で締める)。竹の中は通じるが節で止まる。上坎(通ず)下兌(止まる沢)。万物に分限がある(春夏秋冬の三か月ずつ、梅桃桜、君臣・官等・親子兄弟)。分限に止まれば亨る。苦節＝守り過ぎ(孟子滕文公下の陳仲子：兄の禄を不義として母の家を出て何も食えず、三日で倒れ、井戸端の虫食いの李を食べてやっと目が見えた＝蚯蚓でなければ仲子の操は全うできない)。彖：天地節ありて四時成る。節以て度を制すれば、財を傷らず民を害せず＝天子・皇族・大臣それぞれの経費の制限を立て、奢って重税で民を傷つけない。',
 d:'沢上{たくじょう}に水{みず}有{あ}るは節{せつ}なり。君子{くんし}以{もっ}て数度{すうど}を制{せい}し、徳行{とっこう}を議{はか}る。|象曰。澤上有水節。君子以制數度。議德行。',
 dn:'堤防の中だけ水が流れ、超えれば止まる。数度＝宮殿の広さ・高さなどの数を定める。徳行の大小を論じて地位を定める。',
 y:[
  ['初九','戸庭{こてい}を出{い}でず。咎{とが}无{な}し。|不出戶庭。无咎。','互体震で出ようとするが約象艮で止まる。陽で陽位＝動かない方が正しい。通塞を知る＝道徳の行われる時と塞がる時を知り、今は塞がりの時と見て出ない。繋辞上「君密ならざれば則ち臣を失い、臣密ならざれば則ち身を失う」。'],
  ['九二','門庭{もんてい}を出{い}でず。凶{きょう}。|不出門庭。凶。','陽で陰位＝動くべき、互体震の主＝出るべき時に出ない。時を失うこと極まる(極＝中、時に応じた中を失う)。'],
  ['六三','節若{せつじゃく}たらざれば、則{すなわ}ち嗟若{さじゃく}たり。咎{とが}无{な}し。|不節若。則嗟若。无咎。','兌の主、楽しみを節せず零落して嘆く。自分で招いたので人を恨む筋はない(又誰をか咎めん)。'],
  ['六四','節{せつ}に安{やす}んず。亨{とお}る。|安節。亨。','九五の明君に従い、大臣の分に安んずる。上の道を承く。'],
  ['九五','節{せつ}に甘{あま}んず。吉{きつ}。往{ゆ}けば尚{たっと}ばるる有{あ}り。|甘節。吉。往有尚。','節倹を甘んじて楽しむ明君＝漢の文帝は露台を作ろうとして百金かかると聞いて中止し、皇后以下の衣の裾を短くさせた。位に居りて中なり。'],
  ['上六','苦節{くせつ}す。貞{てい}なれども凶{きょう}。悔{くい}亡{ほろ}ぶ。|苦節。貞凶。悔亡。','陳仲子のような甚だしい苦節。孟子：魏の文侯が訪ねると段干木は垣を越えて逃げ、魯の繆公が訪ねると泄柳は門を閉ざした＝甚だしい。其の道窮まる。']
 ],
 hint:'<ul><li>節度・制限・予算・規則を立てる時。</li><li>出るべき時と止まるべき時を見分ける。</li><li>甘んじて節する者は吉、行き過ぎた苦節は窮まる。</li></ul>',
 ks:'',
 all:'竹の節のように分限に止まる卦。経費の制限で民を傷つけないことを政の要とする。'
});

H({n:61, name:'風沢中孚', kana:'ふうたくちゅうふ', tri:'巽兌', theme:'心中の誠',
 k:'中孚{ちゅうふ}は豚魚{とんぎょ}なれば吉{きつ}。大川{たいせん}を渉{わた}るに利{よろ}し。貞{ただ}しきに利{よろ}し。|中孚。豚魚吉。利涉大川。利貞。',
 kn:'心が虚で、その中に天より受けた孚(誠)が宿り、人が皆感ずる。卦形＝大きな離(中虚＝心)。孚の字＝爪(親鳥の足)＋子＝親鳥が卵を抱く形。上九・初九＝殻、九五・九二＝白身、六三・六四＝黄身(坤＝黄)。親の精神が夜も眠らず卵に徹して雛が生まれる(互体震＝出る)。天地も孚で万物を生ず。豚魚：程子ら諸家は豚と魚の二つとするが誤り。豚に似た魚＝江豚(イルカ)で、大風の前に必ず水面に浮かび風の来る方に口を向ける。漁師は「風信」と呼んで絶対に信ずる→人に信じられること豚魚の如くならば吉。信用あれば天も人も助ける(大川を渉る)、悪に凝った孚は害(利貞)。彖：柔内に在りて剛中を得、説びて巽い、孚乃ち邦を化す。',
 d:'沢上{たくじょう}に風{かぜ}有{あ}るは中孚{ちゅうふ}なり。君子{くんし}以{もっ}て獄{ごく}を議{はか}り死{し}を緩{ゆる}くす。|象曰。澤上有風中孚。君子以議獄緩死。',
 dn:'大離＝明で罪人の善悪を明らかにし、震＝決断・春＝恩恵深く死罪も緩める。',
 y:[
  ['初九','虞{はか}れば吉{きつ}。它{た}有{あ}れば燕{やす}からず。|虞吉。有它不燕。','虞＝葬儀後の帰宅すぐに行う最初の祭(虞＝慮る・安んずる)。親の魂が家にいると思い桑の木で木主(位牌)を作る。精神を凝らせば親の魂が安んじ留まる。他に心が移れば燕んぜず(燕は人家に巣を作り人を信じて安んずる)。志未だ変ぜず。'],
  ['九二','鳴鶴{めいかく}陰{かげ}に在{あ}り、其{そ}の子{こ}之{これ}に和{わ}す。我{われ}に好爵{こうしゃく}有{あ}り、吾{われ}爾{なんじ}と之{これ}を靡{とも}にせん。|鳴鶴在陰。其子和之。我有好爵。吾與爾靡之。','鶴は用心深く八月白露に高く鳴いて警戒する(詩「鶴九皐に鳴く」)。山(互体艮)の陰で夜、親鳥が鳴けば子が和す。好爵＝天爵＝仁義の徳(孟子)、我と汝とで共にする。中心の願い。繋辞上：言は精神の誠で、「言、身より出でて民に加わる…言行は君子の枢機」。'],
  ['六三','敵{てき}を得{う}。或{あるい}は鼓{こ}し或{あるい}は罷{や}め、或{あるい}は泣{な}き或{あるい}は歌{うた}う。|得敵。或鼓或罷。或泣或歌。','六四(正しい君子)と同じ陰＝匹敵、太鼓を打って攻めるが勝てず罷め、泣いたり歌ったり心が定まらない。位当たらず。'],
  ['六四','月{つき}望{ぼう}に幾{ちか}し。馬匹{ばひつ}亡{うしな}う。咎{とが}无{な}し。|月幾望。馬匹亡。无咎。','九五を輔ける宰相、巽の主で謙って満月にならない(十四日)。馬匹の片方＝同類の六三との党派を断つ。類を絶ちて上る(九五に従う)。'],
  ['九五','孚{まこと}有{あ}りて攣如{れんじょ}たり。咎{とが}无{な}し。|有孚攣如。无咎。','孚で天下を化す、手を攣ぐように離れない。位正に当たる。'],
  ['上九','翰音{かんおん}天{てん}に登{のぼ}る。貞{てい}なれども凶{きょう}。|翰音登于天。貞凶。','巽＝雞、翰音＝雞が羽ばたいて鳴く声は天に届くが体は飛べない＝実なき虚名が高く聞こえる(礼記「雞を翰音と曰う」)。漢書五行志：哀帝の時、朱博を丞相に任命する際に殿中に鐘のような大声＝「鼓妖」、李尋が「人君聡ならず、空名進むを得れば則ち声有りて形無し」と答えた＝朱博は虚名の人。何ぞ長かるべけんや。']
 ],
 hint:'<ul><li>誠・信用がすべて。信じられれば大事も渡れる。</li><li>心を一つに凝らす。他に心が移れば安んじない。</li><li>実のない虚名・評判先行は長くない。</li></ul>',
 ks:'豚魚は豚と魚ではなく江豚(イルカ)＝「風信」。',
 all:'心中の誠が人を感ぜしめる卦。孚の字形(親鳥が卵を抱く)をそのまま卦形に読む根本の解は印象深い。'
});

H({n:62, name:'雷山小過', kana:'らいざんしょうか', tri:'震艮', theme:'小が過ぎる・下に宜し',
 k:'小過{しょうか}は亨{とお}る。貞{ただ}しきに利{よろ}し。小事{しょうじ}に可{か}なり、大事{だいじ}に可{か}ならず。飛鳥{ひちょう}之{これ}が音{ね}を遺{のこ}す。上{のぼ}るに宜{よろ}しからず、下{くだ}るに宜{よろ}し。大吉{だいきつ}。|小過。亨。利貞。可小事。不可大事。飛鳥遺之音。不宜上。宜下。大吉。',
 kn:'全体が大きな坎の形(三・四の陽＝鳥の体、初二五上＝翼)＝鳥が飛ぶ。陰(臣)が過ぎる＝臣の勢力が君を制して束縛する。飛鳥遺之音＝雞が鷹(艮＝黒い喙)に攫われて頭上高く運ばれ、姿は見えず哀しい鳴き声だけ残る。上に宜しからず下に宜し＝君も民に下って親しめば、民が君を救い権臣を除く→大吉。彖：過ぎて以て貞に利しきは時と行うなり＝時により小(礼儀・容貌)が過ぎるのがよい時もある(質朴に過ぎた世の弊を救う)。上は逆にして下は順なり。',
 d:'山上{さんじょう}に雷{かみなり}有{あ}るは小過{しょうか}なり。君子{くんし}以{もっ}て行{おこな}いは恭{きょう}に過{す}ぎ、喪{も}は哀{あい}に過{す}ぎ、用{よう}は倹{けん}に過{す}ぐ。|象曰。山上有雷小過。君子以行過乎恭。喪過乎哀。用過乎儉。',
 dn:'雷が大きな山の上を通り越す＝小が過ぎる。恭(容貌)・哀(喪)・倹(艮＝止)は少し過ぎるくらいでよい。',
 y:[
  ['初六','飛鳥{ひちょう}以{もっ}て凶{きょう}。|飛鳥以凶。','以＝率いられる(左伝「能く之を左右するを以と曰う」)＝鷹に攫われる雞＝君が臣に勝手次第に使われる。如何ともす可からず。'],
  ['六二','其{そ}の祖{そ}を過{す}ぎ、其{そ}の妣{ひ}に遇{あ}う。其{そ}の君{きみ}に及{およ}ばず、其{そ}の臣{しん}に遇{あ}う。咎{とが}无{な}し。|過其祖。遇其妣。不及其君。遇其臣。无咎。','臣の正位、臣の道を示す。朝廷に出る前に宗廟(艮＝宗廟、初六＝祖)に拝し、妣＝六五天子(祖に配偶する)に遇う。君に並ぶことなく、まず大臣(三・四＝臣)に会ってから君に拝謁せよ。臣過ぐ可からず。'],
  ['九三','過{す}ぎずして之{これ}を防{ふせ}ぐ。従{したが}えば或{あるい}は之{これ}を戕{そこな}う。凶{きょう}。|弗過防之。從或戕之。凶。','陰の勢いが盛ん、上六に引き込まれぬよう防げ、従えば害される。凶如何。'],
  ['九四','咎{とが}无{な}し。過{す}ぎずして之{これ}に遇{あ}う。往{ゆ}けば厲{あやう}し、必{かなら}ず戒{いまし}めよ。用{もっ}て永貞{えいてい}なる勿{なか}れ。|无咎。弗過遇之。往厲必戒。勿用永貞。','初六と応ずるが程好く取り扱う、自ら往けば危うい。大臣でも権力なく手を出すな。終に長かる可からず＝小人の盛りは長くない。'],
  ['六五','密雲{みつうん}雨{あめ}ふらず、我{わ}が西郊{せいこう}よりす。公{こう}弋{よく}して彼{かれ}の穴{あな}に在{あ}るを取{と}る。|密雲不雨。自我西郊。公弋取彼在穴。','小畜と同じ(大坎＝雲、互体兌＝西)、陰ばかりで陽が応じない＝恩沢が降らない。弋＝糸付きの矢で高い所の鳥を射る＝朝廷の高所に賢人を求めるが、賢人は穴(坎)に隠れている。已に上る＝雲が上りすぎて雨にならない。'],
  ['上六','遇{あ}わずして之{これ}を過{す}ぐ。飛鳥{ひちょう}之{これ}を離{はな}る。凶{きょう}。是{これ}を災眚{さいせい}と謂{い}う。|弗遇過之。飛鳥離之。凶。是謂災眚。','上り過ぎて九三に遇わず、鷹に攫われた鳥が離れ去る＝外から来た災。已に亢る。初と上＝風切り羽(輔翼の臣)、二と五＝次羽、中が体(君)＝臣の羽に引かれて君が災いの所へ。']
 ],
 hint:'<ul><li>小事は可、大事は不可。高望みして上へ行けば凶。</li><li>恭・哀・倹は少し過ぎるくらいでよい。</li><li>下(民・現場)に降りて親しめば救われる。</li></ul>',
 ks:'',
 all:'臣が過ぎて君を束縛する卦。鳥が上るのを戒め、下に宜しと説く。'
});

H({n:63, name:'水火既済', kana:'すいかきせい', tri:'坎離', theme:'成就・六爻皆正',
 k:'既済{きせい}は亨{とお}ること小{しょう}なり。貞{ただ}しきに利{よろ}し。初{はじ}めは吉{きつ}、終{お}わりは乱{みだ}る。|既濟。亨小。利貞。初吉。終亂。',
 kn:'上坎(水)下離(火)＝水火相和し、天地の間は水火の和で万物が生育する。乾坤往来の到達点で、六爻すべて正位の理想形。亨小＝二の陰が主。初吉終乱：内卦(初)は吉、外卦(終わり)で怠れば乱れる。彖：剛柔正しくして位当たる。終に止まれば則ち乱る、其の道窮まる＝安楽になれば勉強をやめ止まって乱れる。',
 d:'水{みず}火上{かじょう}に在{あ}るは既済{きせい}なり。君子{くんし}以{もっ}て患{うれ}いを思{おも}いて予{あらかじ}め之{これ}を防{ふせ}ぐ。|象曰。水在火上既濟。君子以思患而豫防之。',
 dn:'水と火は性質が逆で、火が勝てば水が尽き、水が勝てば火が消える。和している今こそ争いの芽を予め防ぐ(親しい間柄でも)。世は火の上・水の上を渡るように危うい。',
 y:[
  ['初九','其{そ}の輪{わ}を曳{ひ}き、其{そ}の尾{お}を濡{ぬ}らす。咎{とが}无{な}し。|曳其輪。濡其尾。无咎。','険を渡り終える直前こそ気を抜くな。車輪がまだ水中にあるうちに速く陸へ曳き上げ、牛の尾が濡れているうちに手伝え。戦国策「百里を行く者は九十を半ばとす」。義として咎なし。'],
  ['六二','婦{つま}其{そ}の茀{ふつ}を喪{うしな}う。逐{お}う勿{なか}れ。七日{なのか}にして得{う}。|婦喪其茀。勿逐。七日得。','六二の賢人が九五に仕えようとするが讒言で妨げられる＝嫁入り車の覆い(茀)を盗まれて行けない。怒って追うな、七日(七日来復)で戻る＝時を待て。中道を以てなり。'],
  ['九三','高宗{こうそう}鬼方{きほう}を伐{う}ち、三年{さんねん}にして之{これ}に克{か}つ。小人{しょうじん}は用{もち}うる勿{なか}れ。|高宗伐鬼方。三年克之。小人勿用。','下卦の完成＝太平の盛りに乗じて遠方(鬼方＝北方の夷狄、上坎＝北)を伐ち、三年かかってやっと勝つ。小人が太平に退屈して事を起こしたがるので用いるな。憊るるなり＝勝っても国が疲弊する。三十年太平が続くと人が驕る。'],
  ['六四','繻{じゅ}に衣袽{いじょ}有{あ}り。終日{しゅうじつ}戒{いまし}む。|繻有衣袽。終日戒。','繻＝綾模様の美しい絹、袽＝ぼろ。一爻十年×三＝三十年(世＝三十、世の字は十が三つ)で世が一変、外は立派でも内から破れる→終日戒めよ。疑う所有り＝外が厚くなるほど内(誠)が薄くなる。'],
  ['九五','東鄰{とうりん}の牛{うし}を殺{ころ}すは、西鄰{せいりん}の禴祭{やくさい}の実{じつ}に其{そ}の福{さいわい}を受{う}くるに如{し}かず。|東鄰殺牛。不如西鄰之禴祭。實受其福。','東鄰の牛を殺す盛大な祭(冬の烝＝百物)より、西隣の禴祭(夏の祭、供物少なく野菜と音楽＝精神の気)の誠が神に享けられる。四時の祭：春祠・夏禴・秋嘗・冬烝。時なり、吉大いに来るなり。'],
  ['上六','其{そ}の首{こうべ}を濡{ぬ}らす。厲{あやう}し。|濡其首。厲。','神が祭を享けず、再び険に陥って首まで濡れる→未済へ。何ぞ久しかるべけんや。']
 ],
 hint:'<ul><li>完成・成就。しかし今こそ後の患いを予め防ぐ。</li><li>最後の十里が難所。渡り切るまで気を抜かない。</li><li>盛大な形式より誠。太平に退屈して事を起こさない。</li></ul>',
 ks:'',
 all:'乾坤往来の到達点で六爻皆正の理想形。だが「初吉終乱」、完成は崩れの始まりと戒める。'
});

H({n:64, name:'火水未済', kana:'かすいびせい', tri:'離坎', theme:'未完成・忍耐して渡る',
 k:'未済{びせい}は亨{とお}る。小狐{しょうこ}汔{ほとん}ど済{わた}らんとして、其{そ}の尾{お}を濡{ぬ}らす。利{よろ}しき攸{ところ}无{な}し。|未濟。亨。小狐汔濟。濡其尾。无攸利。',
 kn:'上離(火)下坎(水)＝水火が相和せず、万物を生ずる働きがない。しかし上にあるべき火は上、下にあるべき水は下で上下の弁は正しい→やがて火気が下り水気が上って和す本が立つ＝亨。小狐汔済濡其尾：坎＝狐(古今異説なし)、若い狐が初めて川を渡り、渡り切る一歩手前で力尽き尾を濡らして引き返す＝忍耐力の欠如(孟喜「小狐未だ済らざること一歩、其の尾を下ぐ」)。人は忍耐力ほど大切なものはない。彖：柔中を得(六五)。位に当たらずと雖も剛柔応ず(六爻皆位不当だが皆応ず)。',
 d:'火{ひ}水上{すいじょう}に在{あ}るは未済{びせい}なり。君子{くんし}以{もっ}て慎{つつし}みて物{もの}を弁{べん}じ方{ほう}に居{お}らしむ。|象曰。火在水上未濟。君子以愼辨物居方。',
 dn:'火は南、水は北で方位は乱れない。物の分(上下貴賤)を弁じ、それぞれあるべき方(置き場)に居らしめる(離＝明)。',
 y:[
  ['初六','其{そ}の尾{お}を濡{ぬ}らす。吝{りん}。|濡其尾。吝。','気力が弱く思い切って進めない。亦極を知らず＝至るべき所(極＝中)を知らない。'],
  ['九二','其{そ}の輪{わ}を曳{ひ}く。貞{てい}にして吉{きつ}。|曳其輪。貞吉。','坎の穴に陥り、既済初九とは逆に輪を曳き止めて時を待つ、暴虎馮河しない。中以て正を行う。'],
  ['六三','未{いま}だ済{わた}らず。征{ゆ}けば凶{きょう}。大川{たいせん}を渉{わた}るに利{よろ}し。|未濟。征凶。利涉大川。','渡り越したと思えばまた険(約象坎)。無理に征けば凶、しかし止めてもいられず、時を見て渡れ(離の中虚＝舟、三が変ずれば巽＝風で波荒い)。位当たらず。'],
  ['九四','貞{てい}なれば吉{きつ}にして悔{くい}亡{ほろ}ぶ。震{ふる}いて用{もっ}て鬼方{きほう}を伐{う}つ。三年{さんねん}にして大国{たいこく}に賞{しょう}せらるる有{あ}り。|貞吉悔亡。震用伐鬼方。三年有賞于大國。','渡り終えたが北の奥(初六に応ず)に服さぬ鬼方あり、三年かけて平定し大国から賞(離＝兵)。既済の鬼方は戒め、こちらは美事。志行わる。'],
  ['六五','貞{てい}にして吉{きつ}。悔{くい}无{な}し。君子{くんし}の光{ひかり}、孚{まこと}有{あ}りて吉{きつ}。|貞吉。无悔。君子之光。有孚吉。','九四の大臣に輔けられた明君の光(離＝日、孟子「日月明有り、光を容るるに必ず照らす」)が天下に輝く。其の暉吉なり。未済の六五と九四で天下の険を渡り越し太平に。'],
  ['上九','飲酒{いんしゅ}に孚{まこと}有{あ}り。咎{とが}无{な}し。其{そ}の首{こうべ}を濡{ぬ}らせば、孚{まこと}有{あ}るも是{これ}を失{うしな}う。|有孚于飲酒。无咎。濡其首。有孚失是。','険を渡った君臣が宴会で親しむのはよいが、安楽が増長して首まで濡らせば(既済の尾の逆)、孚あってもそれを失う。亦節を知らず。']
 ],
 hint:'<ul><li>未完成・これから。渡り切るまで気を抜かない。</li><li>あと一歩の所で力尽きないよう、忍耐を養う。</li><li>物の分と置き場所を正す。祝杯は程々に。</li></ul>',
 ks:'既済は憂いの卦、未済は楽しむ卦(六五・九四で天下の険を渡り越す)。',
 all:'易の最後が未済で終わるのは、成就しても気を緩めず、始めに反って新たに事を興すため(序卦)。'
});
  var appendix = [
{section:'根本易学の読み方', id:'ax-book', chNum:'序', title:'本書と著者',
 html:'<ul><li><b>著者</b>：根本通明(文学博士、東京帝国大学教授)。明治を代表する易学者。</li><li><b>成り立ち</b>：帝大教授のかたわら私塾で初学者向けに行った講義の速記。凡例は大正元年、子の根本通徳。纂修は門人の九鬼盛隆。口語で、筮竹を操りながら講じた箇所もある。</li><li><b>底本</b>：唐・李鼎祚『周易集解』(李氏易伝)。通行本(朱子『本義』系)と字句の違う所が多く、「後世本は誤り、古本が正しい」という校訂が随所にある。</li><li><b>立場</b>：易は象であり、孔子の十翼に拠って読む。邵雍の先天図・朱子の性理学は易を外れたものとして退ける。論語・孟子・史記・左伝・国語・書経・礼記を縦横に引き、神功皇后・三種の神器など日本の例も交える。</li></ul>'},
{section:'根本易学の読み方', id:'ax-pillars', chNum:'柱', title:'全体を貫く三本柱',
 html:'<ol><li><b>乾坤往来</b>：どの卦も乾と坤の爻の入れ替わりとして読む。乾の二⇄坤の五、乾の四⇄坤の初、乾の上⇄坤の三。入れ替わりが済むと水火既済(上坎下離)となり、陽位に陽・陰位に陰、万物各々宜しきを得る。</li><li><b>五爻は必ず天子、二爻は必ず臣</b>：皇統一系。乾・震(竜・長男)は皇太子。五を伯夷・周公・臣下の極とする古今の注はことごとく退ける。革命は已むを得ぬ時の戒めで、臣が君を伐つことは肯定しない(湯武にも慙徳あり)。</li><li><b>易は行いの書</b>：吉凶は天から降るのでなく人の行いの得失から生じる(吉凶は失得の象)。悔いて改めれば吉、安んじて改めなければ吝から凶。易の道は「懼れる」の一事に尽きる(懼以終始、其要无咎)。</li></ol>'},
{section:'根本易学の読み方', id:'ax-rules', chNum:'法', title:'卦をまたいで使える読法',
 html:'<div class="tbl-wrap"><table><tr><th>読法</th><th>内容</th></tr><tr><td>卦の由来を見る</td><td>どの卦も乾坤の爻の入れ替えで生じたと見る。訟は需の五が二へ、損は泰の三と上の交換、益は否の四と初の交換、咸は否の三と上、恒は泰の初と四、晋は明夷の二が五へ。どこから来たかで卦意がはっきりする。</td></tr><tr><td>互体・約象</td><td>二三四爻が互体、三四五爻が約象(京房)。本卦二卦＋互体二卦で四卦、裏(伏卦)まで見て六卦。これで存亡吉凶を推す(繋辞下「其の中爻に非ざれば備わらず」)。</td></tr><tr><td>錯・綜</td><td>錯＝陰陽反転、綜＝上下顛倒(来知徳)。噬嗑の錯は井、綜は賁。参伍以変＝一人の片言でなく三人五人に尋ねるように照合する。</td></tr><tr><td>爻位</td><td>二は誉れ多く(中、君から離れる)、四は懼れ多い(君に近い)。三は凶多く、五は功多い。初は知り難く上は知り易い。</td></tr><tr><td>応・比</td><td>陰陽相応ずれば取り合い、陽と陽なら争って悔吝。二と五は離れていても応ずれば近い。</td></tr><tr><td>陽卦・陰卦</td><td>震坎艮は一君二民＝君子の道、巽離兌は二君一民＝小人の道。少ない方の爻が主。</td></tr><tr><td>五爻が陰の卦</td><td>柔弱な天子。賢臣(二)・大臣(四)を用いれば吉、権臣に握られれば危うい構図で読む(臨・豫・大有・睽・晋など)。</td></tr><tr><td>君側の奸</td><td>兌(巧言令色・虎)や巽(近利市三倍)の主爻は欲深い大臣・佞人として出やすい(履三・夬上・益上・巽上・兌三)。</td></tr><tr><td>十二消息</td><td>復十一月・臨十二月・泰正月・大壮二月・夬三月・乾四月・姤五月・遯六月・否七月・観八月・剥九月・坤十月。</td></tr><tr><td>数の目安</td><td>七日来復＝失物・離反は追わず七日で戻る(震二・既済二)。十年は坤の数(屯二・復上)。三十年で世が一変(泰・既済四、世＝十が三つ)。</td></tr><tr><td>甲と庚</td><td>先甲三日後甲三日(蠱)＝始めを改める。先庚三日後庚三日(巽)＝根本は改めず弊だけを除く。</td></tr></table></div>'},
{section:'根本易学の読み方', id:'ax-kikkyo', chNum:'心', title:'易に向かう心得',
 html:'<ul><li><b>神而明之存乎其人</b>：易は用いる人しだい。心を洗い清め、精神に誠がなければ用をなさない。至精＝米の皮を剥いた純粋さ。</li><li><b>知幾其神乎</b>：五年十年後に来るものは今すでに微かに動いている。欲があると迷って見えない、無欲なら見える。見込みが立てば即日動く(豫六二)。</li><li><b>初筮は告ぐ、再三は瀆す</b>(蒙)：誠のない再三の問いには答えない。</li><li><b>易は常に座右に</b>：言う前・行う前に易に相談する(擬之而後言、議之而後動)。易を傍に置けば父母が付き添うに等しい。</li><li><b>易は逆数</b>：過ぎたことより、これから来ることを予め知るのが本旨(知来者逆)。</li><li><b>悔と吝</b>：悔＝憂えて改める→吉へ。吝＝安楽に安んじて改めかねる→凶へ。介＝吉凶の分かれ目で優柔不断になるな。无咎＝よく過ちを補うこと。</li><li><b>危者使平、易者使傾</b>：危うい言葉(虎の尾を履む)でも懼れ慎めば無事、易しと油断すれば傾く。</li></ul>'},

{section:'繋辞伝', id:'kj-1', chNum:'上伝 第一章', title:'天尊地卑・乾坤定まる',
 text:'天{てん}は尊{たっと}く地{ち}は卑{ひく}くして、乾坤{けんこん}定{さだ}まる。卑高{ひこう}以{もっ}て陳{つら}なりて、貴賤{きせん}位{くらい}す。…乾{けん}は大始{たいし}を知{つかさど}り、坤{こん}は物{もの}を化成{かせい}す。乾{けん}は易{い}を以{もっ}て知{つかさど}り、坤{こん}は簡{かん}を以{もっ}て能{よ}くす。|天尊地卑。乾坤定矣。卑高以陳。貴賤位矣。…乾知大始。坤化成物。乾以易知。坤以簡能。',
 note:'乾の六爻を下から積み、五は天子(貴)、二は臣(賤)。易では六十四卦残らず五爻は天子の位、二爻は臣の位。「方以類聚、物以群分」は陰が二四六に、陽が初三五に分かれること。古本は「坤化成物」で、後世本の「坤作」は改竄。易は自然で難しくなく(易)、簡は容れる(乾の通りに容れて成す)：無理をせず自然なら人が親しみ従い、事業が長く大きく続く。「天下之理得而易成位乎其中矣」は後世本で「易」の字が脱落している。'},
{section:'繋辞伝', id:'kj-2', chNum:'上伝 第二・三章', title:'吉凶悔吝は行いから',
 text:'吉凶{きっきょう}とは失得{しっとく}の象{しょう}なり。悔吝{かいりん}とは憂虞{ゆうぐ}の象{しょう}なり。…悔吝{かいりん}を憂{うれ}うるは介{かい}に存{そん}し、咎{とが}无{な}きに震{ふる}うは悔{くい}に存{そん}す。|吉凶者。失得之象也。悔吝者。憂虞之象也。…憂悔吝者存乎介。震无咎者存乎悔。',
 note:'吉凶は天から降るのでも地から湧くのでもなく、人の行いの得失から生じる。悔＝憂えて改める(吉へ)、吝＝虞(安楽)に安んじて改めかねる(凶へ)。介＝界＝吉凶の分かれ目。「聖人設卦観象」は「観象」で句を切る(伏羲が卦を掛け、象を観て吉凶を考えた)。「所居而安者易之序也」の「序」は誤り。'},
{section:'繋辞伝', id:'kj-3', chNum:'上伝 第四・五章', title:'精気は物と為り、一陰一陽之を道と謂う',
 text:'精気{せいき}物{もの}と為{な}り、遊魂{ゆうこん}変{へん}を為{な}す。…一陰一陽{いちいんいちよう}之{これ}を道{みち}と謂{い}う。之{これ}を継{つ}ぐ者{もの}は善{ぜん}なり、之{これ}を成{な}す者{もの}は性{せい}なり。|精氣爲物。遊魂爲變。…一陰一陽之謂道。繼之者善也。成之者性也。',
 note:'大極元気の純粋な所が凝って物(天地・人・万物)となり、体に宿った精神は巡って四海の外まで働く。古今の説はこの義を失う。一陰一陽の道は説卦の「天の道は陰陽、地の道は柔剛、人の道は仁義」の道で、東條一堂の「易だけの道」説は退ける。継之者善＝乾上九が坤三に来て天道を継ぐ、成之者性＝二三四の坎が性で、その中の陽は乾から来た＝性善説が易で明らか。'},
{section:'繋辞伝', id:'kj-4', chNum:'上伝 第十一章', title:'易に大極有り',
 text:'易{えき}に大極{たいきょく}有{あ}り。是{これ}両儀{りょうぎ}を生{しょう}ず。両儀{りょうぎ}は四象{ししょう}を生{しょう}じ、四象{ししょう}は八卦{はっか}を生{しょう}ず。八卦{はっか}吉凶{きっきょう}を定{さだ}む。|易有大極。是生兩儀。兩儀生四象。四象生八卦。八卦定吉凶。',
 note:'大極は老子「物有り混成し天地に先だちて生ず」、説文「極は中なり」、鄭玄「淳和未分の気」。根本は、大極＝五十策を一束に握った状態、両儀＝二つに分けること(儀＝匹、詩「実に維れ我が儀」)、四象＝四揲とする。両儀を天地・乾坤とするのは誤り。八卦定吉凶＝内卦に外卦が既に含まれる。河出図洛出書：黄河の竜馬の模様から乾、洛水の亀の模様から坤。書経顧命「天球河図」まで伝わったが失われた。宋の邵子らの河図洛書は後世の偽作。'},
{section:'繋辞伝', id:'kj-5', chNum:'上伝 第十二章', title:'書は言を尽くさず、象を立てて意を尽くす',
 text:'書{しょ}は言{げん}を尽{つ}くさず、言{げん}は意{い}を尽{つ}くさず。…聖人{せいじん}象{しょう}を立{た}てて以{もっ}て意{い}を尽{つ}くし、卦{か}を設{もう}けて以{もっ}て情偽{じょうぎ}を尽{つ}くす。…之{これ}を神{しん}にして之{これ}を明{あき}らかにするは其{そ}の人{ひと}に存{そん}す。|書不盡言。言不盡意。…聖人立象以盡意。設卦以盡情僞。…神而明之。存乎其人。',
 note:'情＝道心から直に動く(陽)、偽＝人心・悪心(陰)。鼓之舞之以尽神の鼓＝震、舞＝巽。乾坤其易之縕邪：縕＝衣の中の綿、用九用六によって六十四卦すべてに乾坤が入っている。形而上は仁義、形而下は礼。易を用いる人が心を洗い、精神の誠がなければ易は用をなさない。黙而成之、不言而信、存乎徳行。'},
{section:'繋辞伝', id:'kj-6', chNum:'下伝 第一・二章', title:'吉凶は貞に勝つ・制器尚象',
 text:'吉凶{きっきょう}は貞{てい}に勝{か}つ者{もの}なり。…天地{てんち}の大徳{たいとく}を生{せい}と曰{い}い、聖人{せいじん}の大宝{たいほう}を位{くらい}と曰{い}う。何{なに}を以{もっ}て位{くらい}を守{まも}る、人{ひと}と曰{い}う。|吉凶者。貞勝者也。…天地之大德曰生。聖人之大寶曰位。何以守位曰人。',
 note:'凶に遇っても貞で勝つ。貞＝正しく且つ石のように固い。天下之動貞夫一＝一は乾元＝大極＝中(論語「吾が道一以て之を貫く」)。「何以守位曰人」は「仁」でなく「人」が正しい(鄭玄・陸徳明・老子別本、古書は仁人通用)。制器尚象：網罟＝離、耒耜＝益(神農が肉食による病を断つため五穀を始めた)、市＝噬嗑、衣裳＝乾坤(上下一枚の衣は君臣一体、舜以後に上下が分かれたのは君臣隔絶の兆し)、舟楫＝渙、牛馬＝随、重門撃柝＝豫、杵臼＝小過、弧矢＝睽、宮室＝大壮、棺槨＝大過、書契＝夬(「天雨粟、鬼夜哭」を引き文明の弊を警告)。窮則変、変則通、通則久＝窮してからでは遅い、未だ窮せぬうちに変ぜよ。'},
{section:'繋辞伝', id:'kj-7', chNum:'下伝 第五章', title:'知幾其神乎',
 text:'幾{き}を知{し}るは其{そ}れ神{しん}か。…君子{くんし}は幾{き}を見{み}て作{た}ち、日{ひ}を終{お}うるを俟{ま}たず。|知幾其神乎。…君子見幾而作。不俟終日。',
 note:'豫六二「介于石、不終日」の解。権臣に諂わず(上交不諂、下交不瀆)、見込みが立てば即日動く。漢高祖は婁敬・張良の進言で即日関中へ遷都した(史記「即日車駕西都関中」)、秀吉の賤ヶ岳も同じ。同章で孔子は、咸九四(天下何思何慮・尺蠖の屈・竜蛇の蟄)、困六三、解上六(君子蔵器於身待時而動)、噬嗑初上(小懲大誡)、否九五(安而不忘危)、鼎九四(徳薄而位尊)、復初九(顔回)、損六三、益上九を論じる。'},
{section:'繋辞伝', id:'kj-8', chNum:'下伝 第七章', title:'三陳九徳',
 html:'<div class="tbl-wrap"><table><tr><th>卦</th><th>一陳</th><th>二陳</th><th>三陳</th></tr><tr><td>履</td><td>徳の基</td><td>和して至る</td><td>以て行いを和す</td></tr><tr><td>謙</td><td>徳の柄</td><td>尊くして光る</td><td>以て礼を制す</td></tr><tr><td>復</td><td>徳の本</td><td>小にして物を弁ず</td><td>以て自ら知る</td></tr><tr><td>恒</td><td>徳の固</td><td>雑にして厭わず</td><td>以て徳を一にす</td></tr><tr><td>損</td><td>徳の修</td><td>難きを先にし易きを後にす</td><td>以て害に遠ざかる</td></tr><tr><td>益</td><td>徳の裕</td><td>長裕にして設けず</td><td>以て利を興す</td></tr><tr><td>困</td><td>徳の弁</td><td>窮して通ず</td><td>以て怨みを寡なくす</td></tr><tr><td>井</td><td>徳の地</td><td>其の所に居りて遷る</td><td>以て義を弁ず</td></tr><tr><td>巽</td><td>徳の制</td><td>称りて隠る</td><td>以て権を行う</td></tr></table></div><p>困＝困難の時に真の徳者と道徳を被っただけの偽善者が分かれる。巽以行権＝伊尹が太甲を桐に放ったように、小さな不義を捨てて宗廟社稷を安んずる。作易者其有憂患乎：革・訟のように伏羲の世にはあり得ない事を、後世を憂えて予め設けた。</p>'},
{section:'繋辞伝', id:'kj-9', chNum:'下伝 第九〜十二章', title:'懼れて以て終始す',
 text:'其{そ}の辞{じ}危{あや}うし。危{あや}ぶむ者{もの}は平{たい}らかならしめ、易{あなど}る者{もの}は傾{かたむ}かしむ。…懼{おそ}れて以{もっ}て終始{しゅうし}すれば、其{そ}の要{よう}は咎{とが}无{な}し。此{これ}を之{これ}易{えき}の道{みち}と謂{い}うなり。|其辭危。危者使平。易者使傾。…懼以終始。其要无咎。此之謂易之道也。',
 note:'文王は殷の末世にいたので辞が危うい。易の道は「懼れる」の一事に尽きる。二与四同功而異位(二多誉、四多懼)、三与五同功而異位(三多凶、五多功)。「能研諸侯之慮」の「諸侯之」を衍文とする古今の説を退け、天子が乾坤の徳で心を研ぎ澄まし諸侯の慮まで磨く意とする。末尾の六辞は六子卦の象：叛く者の辞は慙じる(坎)、疑う者は枝分かれ(離)、吉人は寡言(艮)、躁人は多言(震)、善を誣いる者は游ぶ(兌)、守りを失う者は屈する(巽)。'},

{section:'説卦伝', id:'sk-1', chNum:'第一・二章', title:'和順於道徳而理於義',
 text:'道徳{どうとく}に和順{わじゅん}して義{ぎ}に理{おさ}め、理{り}を窮{きわ}め性{せい}を尽{つ}くして以{もっ}て命{めい}に至{いた}る。…天{てん}の道{みち}を立{た}てて陰{いん}と陽{よう}と曰{い}い、地{ち}の道{みち}を立{た}てて柔{じゅう}と剛{ごう}と曰{い}い、人{ひと}の道{みち}を立{た}てて仁{じん}と義{ぎ}と曰{い}う。|和順於道德而理於義。窮理盡性以至於命。…立天之道曰陰與陽。立地之道曰柔與剛。立人之道曰仁與義。',
 note:'説卦伝は八卦の卦徳・象義を説く易解釈の基準で、これを外して我儘に易を説いてはならない。発揮於剛柔而生爻：発＝乾二の剛が出て行く、揮＝坤五の陰が取り払われ乾へ来る。和順於道徳＝坤の陰が逆らわず乾へ来る、理於義＝陰が乾の陰位に来る(義＝我を正す、董仲舒)。義に理する所を窮め性を尽くせば天命に至る。朱子の「万物の理を窮む」＝性理学は、易を外れて別の宗門を立てたものと痛烈に批判する。'},
{section:'説卦伝', id:'sk-2', chNum:'第三〜五章', title:'天地定位・帝出乎震',
 html:'<p>天地位を定め、山沢気を通じ、雷風相薄り、水火相射わず。<b>射＝放つ</b>(矢が弦を離れる瞬間)で、水火は相離れない＝空気(鉄瓶の湯気の例)。数往者順、知来者逆、是故易逆数也＝易の本旨は将来を予め知ること。</p><div class="tbl-wrap"><table><tr><th>卦</th><th>方位・季節</th><th>根本の解き</th></tr><tr><td>震</td><td>東・春</td><td>帝出乎震。帝＝諦(つまびらか)。日の出、石のような種が割れて芽が出る</td></tr><tr><td>巽</td><td>東南・春夏の際</td><td>斉乎巽。潔斉、天地が新しく清潔になる</td></tr><tr><td>離</td><td>南・夏</td><td>相見乎離。聖人南面して治める＝既済で五爻の天子が南に向く</td></tr><tr><td>坤</td><td>西南</td><td>致役乎坤。四季すべて土の力を借りる</td></tr><tr><td>兌</td><td>西・正秋</td><td>説言乎兌。「正秋」だけ示して他を省くのは古文の法</td></tr><tr><td>乾</td><td>西北・秋冬の際</td><td>戦乎乾。陰陽相薄る</td></tr><tr><td>坎</td><td>北・十一月</td><td>労乎坎。水は日夜休まず万物を潤す＝労卦</td></tr><tr><td>艮</td><td>東北・冬春の際</td><td>成言乎艮。万物の終わりを成し始めを成す(種が固まり、また芽が出る)</td></tr></table></div><p>神也者妙万物而為言者也：帝・万物・神は一つ＝乾元の元気。妙＝未だ目に見えない微かな動き。「水火不相逮」とする後世本は誤りで「水火相逮」が正しい。</p>'},
{section:'説卦伝', id:'sk-3', chNum:'第六〜十一章', title:'八卦の象',
 html:'<div class="tbl-wrap"><table><tr><th>卦</th><th>卦徳</th><th>家族</th><th>動物</th><th>身体</th><th>主な広象</th></tr><tr><td>乾</td><td>健</td><td>父</td><td>馬(蹄が丸く一枚)</td><td>首</td><td>天・圜・君(君と言えば天子)・玉・金・寒・冰・大赤・良馬(癖なく変わらない)・駁馬(虎豹を食う)・木果</td></tr><tr><td>坤</td><td>順</td><td>母</td><td>牛(蹄が割れる)</td><td>腹</td><td>地・布・釜・吝嗇・均(善悪なく一様に養う)・子母牛(相続限りなし)・大輿・文・衆・柄・黒</td></tr><tr><td>震</td><td>動</td><td>長男</td><td>竜</td><td>足</td><td>雷・玄黄・旉(花)・大塗・長子(後継ぎ、喪は三年)・決躁・蒼筤竹・善鳴馬・反生・蕃鮮</td></tr><tr><td>巽</td><td>入</td><td>長女</td><td>雞(時に応じて鳴く)</td><td>股</td><td>木・風・縄直・工・白・長・高・進退・不果・臭・寡髪・多白眼・近利市三倍</td></tr><tr><td>坎</td><td>陥</td><td>中男</td><td>豕</td><td>耳</td><td>水・溝瀆・隠伏・矯輮・弓輪・加憂・心病・耳痛・血卦・赤・亟心・通・月・盗・堅多心</td></tr><tr><td>離</td><td>麗</td><td>中女</td><td>雉</td><td>目</td><td>火・日・電・甲冑(外堅内柔)・戈兵・大腹・乾卦・亀蟹など外皮の堅い物・科上槁</td></tr><tr><td>艮</td><td>止</td><td>少男</td><td>狗(番犬)</td><td>手</td><td>山・径路・小石・門闕(法令掲示所)・果蓏・閽寺(門番)・指・鼠・黔喙之属・堅多節</td></tr><tr><td>兌</td><td>説</td><td>少女</td><td>羊</td><td>口</td><td>沢(美之鍾)・巫・口舌・毀折・附決・剛鹵(塩の地)・妾</td></tr></table></div><p>乾坤六子の「索」は「求める」でなく「交わる」。坎に「中男」と言わないのは、男子はみな長子に帰することを示すため。</p>'},

{section:'序卦伝', id:'jk-1', chNum:'上経', title:'天地より坎離まで',
 html:'<p>天地 → 屯(盈、動き出る) → 蒙(一皮かぶって生まれる) → 需(飲食) → 訟 → 師 → <b>比(水と土が混じって離れない＝君民一体＝皇統一系の証)</b> → 小畜 → 履(「履者礼也」は古文にあり後世本に無し) → 泰 → 否(安楽は驕りと重税を生む) → 同人(世界兄弟) → 大有 → 謙(論語「富而好礼」) → 豫 → 随 → 蠱(事業) → 臨 → 観 → 噬嗑 → 賁 → 剥(梢に残る一果) → 復(地に落ちて芽) → 无妄 → 大畜 → 頤 → 大過 → 坎 → 離。</p><p>上経は天地(乾坤)に始まり、日月水火(坎離)＝最も用をなすものに終わる。出た卦の前後を見れば「どこから来て、どこへ行くか」が読める。</p>'},
{section:'序卦伝', id:'jk-2', chNum:'下経', title:'夫婦より未済まで',
 html:'<p>天地 → 万物 → 男女 → 夫婦 → 父子 → 君臣 → 上下 → 礼義。伏羲が婚姻の礼を定める以前は人は父を知らなかった。納徴＝鹿皮二枚＝結納の始まり。</p><p>咸・恒(変化の中の唯一の不変) → 遯 → 大壮(三十にして立つ) → 晋 → 明夷 → 家人 → 睽 → 蹇 → 解 → 損 → 益 → 夬(溢れる) → 姤(小人の種は尽きない) → 萃 → 升 → 困 → 井 → 革 → 鼎 → <b>震(器を主る者は長子に若くは莫し)</b> → 艮 → 漸 → 帰妹 → 豊(阿房宮) → 旅 → 巽 → 兌 → 渙 → 節 → 中孚 → 小過 → 既済 → 未済。</p><p>未済で終わるのは、成就しても気を緩めず、始めに反って新たに事を興すため。</p>'},

{section:'雑卦伝', id:'zk-1', chNum:'早見', title:'卦が出た瞬間の一語',
 html:'<p>序卦＝常(伏羲が立てた順序)、雑卦＝変(天地造化の測り知れぬ働き、時に応じた通変)。</p><div class="tbl-wrap"><table><tr><th>卦</th><th>雑卦</th><th>根本の解き</th></tr><tr><td>乾・坤</td><td>剛・柔</td><td>天地の常道</td></tr><tr><td>比・師</td><td>楽・憂</td><td>親しみ離れぬ楽しみ／勝っても憂いあり</td></tr><tr><td>臨・観</td><td>或与或求</td><td>上が恩沢を与えれば下が報い、下が徳を見て求める</td></tr><tr><td>屯・蒙</td><td>見而不失其居・雑而著</td><td>現れても止まるべき所を失わない／草茫々でも水は通じて功が現れる</td></tr><tr><td>震・艮</td><td>起・止</td><td>起つべき時に起ち、止まるべき時に止まる</td></tr><tr><td>損・益</td><td>盛衰之始</td><td>損は盛の始め、益は衰の始め</td></tr><tr><td>大畜・无妄</td><td>時・災</td><td>蓄えたら時を待て／無欲でも油断すれば災い</td></tr><tr><td>萃・升</td><td>聚・不来</td><td>集まる／昇って戻らない(内を顧みよ)</td></tr><tr><td>謙・豫</td><td>軽・怠</td><td>身を軽くへりくだる／楽しんで怠る</td></tr><tr><td>噬嗑・賁</td><td>食・无色</td><td>固い物も最後まで噛み砕け／飾りの極は色なきを貴ぶ</td></tr><tr><td>兌・巽</td><td>見・伏</td><td>顕れる／潜り込む</td></tr><tr><td>随・蠱</td><td>无故・飭</td><td>昔通りに固執しない／古く破れたものを整え直す</td></tr><tr><td>剥・復</td><td>爛・反</td><td>熟れて爛れても種から芽が出る／元に反る</td></tr><tr><td>晋・明夷</td><td>昼・誅</td><td>日が昇る／明が破れる</td></tr><tr><td>井・困</td><td>通・相遇</td><td>どこまでも通ずる／困難の時は人と相計って通ずる</td></tr><tr><td>咸・恒</td><td>速・久</td><td>誠で感ずれば事は速い／変わらない</td></tr><tr><td>渙・節</td><td>離・止</td><td>油断すれば散る／倹約の定めを越えない</td></tr><tr><td>解・蹇</td><td>緩・難</td><td>心が緩む／どこにも行けない</td></tr><tr><td>睽・家人</td><td>外・内</td><td>気が合わず疎んずる／内で親しむ</td></tr><tr><td>否・泰</td><td>反其類</td><td>泰は君子の類、否は小人の類が固まる</td></tr><tr><td>大壮・遯</td><td>止・退</td><td>勇を頼んで無理に進むな／退く</td></tr><tr><td>大有・同人</td><td>衆・親</td><td>道徳ある人が多く集まる／天下みな兄弟</td></tr><tr><td>革・鼎</td><td>去故・取新</td><td>古い垢を去る／新しきを取る</td></tr><tr><td>小過・中孚</td><td>過・信</td><td>事を成す者は人より少し過ぎる／真心が貫徹する</td></tr><tr><td>豊・旅</td><td>多故・親寡</td><td>盛んなら旧知が集まる／旅は助ける人が少ない</td></tr><tr><td>離・坎</td><td>上・下</td><td>火は昇り水は降る、一方に片寄る</td></tr><tr><td>小畜・履</td><td>寡・不処</td><td>独りでも怠らず行う／禍に遭っても止まらず努める</td></tr><tr><td>需・訟</td><td>不進・不親</td><td>進まず待つ／親しまない</td></tr><tr><td>大過・姤</td><td>顛・遇</td><td>やり過ぎれば顛倒／身を小さくして人に遇う</td></tr><tr><td>漸・頤</td><td>待男行・養正</td><td>自分から求めず待て／禄は正しい道で得よ</td></tr><tr><td>既済・帰妹・未済</td><td>定・女之終・男之窮</td><td>定まる／嫁いで身が落ち着く／窮しても奮発せよ</td></tr><tr><td>夬</td><td>剛決柔</td><td>権力ある奸臣を断然除く。君子と小人は並び立たない</td></tr></table></div>'},

{section:'筮法', id:'zp-1', chNum:'根本流', title:'三十六変筮法',
 html:'<p>繋辞上伝「大衍之数」の講義で、筮竹を操作しながら実演した法。天地の数は五十五。筮法は暦に則り、五十五本から気盈の五日分を除いて五十(大衍)、さらに一本除いて四十九本を用いる。</p><ol><li>四十九本の上下を転倒させて持つ(易は逆数)。中分して掛具(刻)の左右に置く(分二以象両)。</li><li>右から一本抜いて中央に掛ける(掛一以象三)。</li><li>左右を四本ずつ数え(揲四以象四時)、余りと中央の一本を第一の刻に置く(帰奇於扐以象閏)。</li><li>左右を合わせて再び中分し、同様に第二の刻へ。これを<b>六回</b>行い、第一〜第六の刻を得る。</li><li>第四を第一に、第五を第二に、第六を第三に合わせる(初と四、二と五、三と六が応ずる)。</li><li>合わせた本数を四ずつ数える。<b>8本＝両地(陰)、12本＝参天(陽)、16本＝四時(陰)</b>。</li><li>三組のうち<b>少ない方が主</b>となって一爻が決まる。</li><li>一爻に六変 → 内卦十八変 → 六爻で<b>三十六変</b>。</li></ol><p>朱子の十八変(一爻三変)では初と四などが応じない。毛奇齢も三十六変とは言い切れなかった。この法は日本に伝わって中国に残っていない。蒙の「初筮」と比の「原筮」は、十八変で内卦、さらに十八変で外卦を得ることを指す。</p>'},
{section:'筮法', id:'zp-2', chNum:'艮卦付記', title:'「艮之八」論 ―― 動爻の求め方',
 html:'<p>左伝襄公九年、穆姜の筮「遇艮之八」は漢魏唐宋の誰も解けなかった(三十六変の伝が失われたため)。左伝・国語の「之く」は皆「変」である(大有之乾、師之臨)。山本北山とその門人(朝川善庵ほか)の「不変の占」説は誤り。</p><p><b>連山の法(艮之八)</b>：三十六変で六爻を布いた後、さらに分掛揲扐して初爻から順に動爻を求める(九を得ればその爻が動く)。六爻すべて動かなければ卦を顛倒して震とし、上六で第七数、六五で第八数を起こす。第八数で動けば上卦が兌になって随となる(穆姜「是れを艮の随と謂う」)。艮の六爻は両山が連なるので「連山」。</p><p><b>帰蔵の法</b>(国語晋語「貞屯悔豫皆八」)：屯を布いた後に動爻を求め、動かなければ外卦坎と内卦震を入れ替えて解とし、第八数で動爻を得て豫となる。</p><p>「八」とは、動爻を求めて第八数で変を得ることである。</p>'}
  ];

  // ---- 描画 ----
  var TERM_ORDER = ['元吉','无咎','吉','凶','悔','吝','厲','亨','利','貞'];
  var TERMS = {
    '元吉':'この上なくめでたい、最大級の吉。',
    '无咎':'咎(とが)無し。よく過ちを補って、責められる落ち度がない。',
    '吉':'行いが正しく、宜しきを得た結果。',
    '凶':'行いが不正で、宜しきを失った結果。',
    '悔':'憂えて改める。根本は、悔いれば吉へ向かうとする。',
    '吝':'安楽に安んじて改めかねる。改めなければ凶へ向かう。',
    '厲':'危うい。懼れ慎めば大事に至らない。',
    '亨':'通る。暢びて滞りなく通じる。',
    '利':'宜しきを得る。長短大小それぞれに適う。',
    '貞':'正しく、かつ石のように固く動かない。'
  };
  function termTagsFor(text){
    var remaining = text, tags = [];
    TERM_ORDER.forEach(function(t){
      if(remaining.indexOf(t) !== -1){
        tags.push('<span class="term"><b>' + t + '</b>' + TERMS[t] + '</span>');
        remaining = remaining.split(t).join('');
      }
    });
    return tags.length ? '<div class="terms">' + tags.join('') + '</div>' : '';
  }
  function ruby(s){
    return s.replace(/([㐀-鿿豈-﫿々〇]+)\{([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
  }
  function splitYomi(s){
    var i = s.indexOf('|');
    if(i === -1) return '<div class="yomi">' + ruby(s) + '</div>';
    return '<div class="yomi">' + ruby(s.slice(0, i)) + '</div><div class="orig">' + s.slice(i + 1) + '</div>';
  }
  function origOf(s){ var i = s.indexOf('|'); return i === -1 ? s : s.slice(i + 1); }

  var TRI = { '乾':'SSS','兌':'SSB','離':'SBS','震':'SBB','巽':'BSS','坎':'BSB','艮':'BBS','坤':'BBB' };
  var SHORT_NAME = {
    1:'乾',2:'坤',3:'屯',4:'蒙',5:'需',6:'訟',7:'師',8:'比',9:'小畜',10:'履',11:'泰',12:'否',13:'同人',14:'大有',15:'謙',16:'豫',
    17:'随',18:'蠱',19:'臨',20:'観',21:'噬嗑',22:'賁',23:'剥',24:'復',25:'无妄',26:'大畜',27:'頤',28:'大過',29:'坎',30:'離',31:'咸',32:'恒',
    33:'遯',34:'大壮',35:'晋',36:'明夷',37:'家人',38:'睽',39:'蹇',40:'解',41:'損',42:'益',43:'夬',44:'姤',45:'萃',46:'升',47:'困',48:'井',
    49:'革',50:'鼎',51:'震',52:'艮',53:'漸',54:'帰妹',55:'豊',56:'旅',57:'巽',58:'兌',59:'渙',60:'節',61:'中孚',62:'小過',63:'既済',64:'未済'
  };

  var jumprow = document.getElementById('jumprow');
  var cards = document.getElementById('cards');

  var appendixJump = document.createElement('a');
  appendixJump.href = '#appendixTop';
  appendixJump.className = 'appendix-jump';
  appendixJump.textContent = '読法・十翼へ';
  jumprow.appendChild(appendixJump);

  data.forEach(function(h){
    var id = 'h' + h.n;
    var a = document.createElement('a');
    a.href = '#' + id;
    a.innerHTML = '<span class="num">' + h.n + '</span>' + SHORT_NAME[h.n];
    jumprow.appendChild(a);

    // 下卦(初〜三) + 上卦(四〜上)。tri は「上卦下卦」の順
    var lines = (TRI[h.tri.charAt(1)] + TRI[h.tri.charAt(0)]).split('');
    // TRI の文字列は下から上の順
    var hexgramHtml = '<div class="hexgram" aria-hidden="true">' + lines.map(function(l){
      return '<div class="ln' + (l === 'B' ? ' yin' : '') + '"></div>';
    }).join('') + '</div>';

    var head = '<div class="card-head">' + hexgramHtml +
      '<div><div class="hexnum">第' + h.n + '卦　上' + h.tri.charAt(0) + '・下' + h.tri.charAt(1) + '</div>' +
      '<div class="hexname">' + h.name + '<span class="kana">' + h.kana + '</span></div>' +
      '<div class="hextheme">' + h.theme + '</div></div></div>';

    var classical = '<div class="classical">' +
      '<div class="c-row"><span class="c-label">卦辞</span><span class="c-text">' + splitYomi(h.k) + '<div class="c-note">' + h.kn + '</div></span></div>' +
      '<div class="c-row"><span class="c-label">大象伝</span><span class="c-text">' + splitYomi(h.d) + '<div class="c-note">' + h.dn + '</div></span></div>' +
      '</div>';

    var rows = h.y.map(function(y){
      return '<tr><td class="pos">' + y[0] + '</td><td><div class="yaoji">' + splitYomi(y[1]) + '</div><div class="comment">' + y[2] + '</div>' + termTagsFor(origOf(y[1])) + '</td></tr>';
    }).join('');
    var table = '<table class="yao">' + rows + '</table>';

    var konpon = '<div class="konpon">' +
      '<div class="k-box hint"><div class="k-label">占断の目安</div><div class="k-text">' + h.hint + '</div></div>' +
      (h.ks ? '<div class="k-box theory"><div class="k-label">根本説</div><div class="k-text">' + h.ks + '</div></div>' : '') +
      '</div>';

    var overall = '<div class="overall"><b>全体:</b> ' + h.all + '</div>';

    var card = document.createElement('section');
    card.className = 'card';
    card.id = id;
    card.innerHTML = head + classical + table + konpon + overall;
    cards.appendChild(card);
  });

  var appendixWrap = document.getElementById('appendixWrap');
  var titleBlock = document.createElement('div');
  titleBlock.className = 'appendix-title';
  titleBlock.id = 'appendixTop';
  titleBlock.innerHTML = '<h2>読法・十翼・筮法</h2><div class="sub">根本易学の読み方、繋辞伝・説卦伝・序卦伝・雑卦伝の要点、根本流の三十六変筮法と「艮之八」論。</div>';
  appendixWrap.appendChild(titleBlock);

  var lastSection = '';
  appendix.forEach(function(a){
    if(a.section !== lastSection){
      var sh = document.createElement('div');
      sh.className = 'appendix-section-head';
      sh.textContent = a.section;
      appendixWrap.appendChild(sh);
      lastSection = a.section;
    }
    var ac = document.createElement('section');
    ac.className = 'appendix-card';
    ac.id = a.id;
    var acHead = '<div class="ch-num">' + a.chNum + '</div><div class="ch-title">' + a.title + '</div>';
    var acBody = a.text ? '<div class="classical"><div class="c-row"><span class="c-text">' + splitYomi(a.text) + (a.note ? '<div class="c-note">' + a.note + '</div>' : '') + '</span></div></div>' : '';
    var acHtml = a.html ? '<div class="a-html">' + a.html + '</div>' : '';
    ac.innerHTML = acHead + acBody + acHtml;
    appendixWrap.appendChild(ac);
  });
})();
</script>
