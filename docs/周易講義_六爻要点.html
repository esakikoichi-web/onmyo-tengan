  <h1>六爻要点まとめ</h1>
  <div class="sub">卦辞・大象伝・爻辞の原文(読み下し付き)と、根本通明の講義による各爻の解説。根本の読みは「乾坤往来」「五爻は天子・二爻は臣」「吉凶は行いから生ずる」の三本柱。位が低い爻から高い爻へ、下から上に読む。</div>

H({n:2, name:'坤為地', kana:'こんいち', tri:'坤坤', theme:'臣の道・妻の道',
 k:'坤{こん}は、元{おお}いに亨{とお}る、牝馬{ひんば}の貞{てい}に利{よろ}し。君子{くんし}往{ゆ}く攸{ところ}有{あ}り。先{さき}んずれば迷{まよ}い、後{おく}るれば主{しゅ}を得{う}。西南{せいなん}には朋{とも}を得{え}、東北{とうほく}には朋{とも}を喪{うしな}うに利{よろ}し。貞{てい}に安{やす}んずれば吉{きつ}。|坤。元亨。利牝馬之貞。君子有攸往。先迷後得主。利西南得朋。東北喪朋。安貞吉。',
 kn:'坤の四徳は乾から承けたもの。牝馬は牡馬(乾)に従う、すなわち臣の道。君より先に立てば私心・驕りから道に迷い、君命を承けて後に行えば得る(「主」で句を切る)。西南(陰卦の方)は在野で同門の朋と学ぶ時、東北(艮=門・朝廷)は出仕して私党を捨て、公平に賢人を挙げる時。朋は陰(同門)、友は陽。',
 d:'地勢{ちせい}は坤{こん}なり。君子{くんし}以{もっ}て徳{とく}を厚{あつ}くし物{もの}を載{の}す。|象曰。地勢坤。君子以厚德載物。',
 dn:'地が重なって厚いから物を載せる力(勢)がある。徳を厚く積めば天下の重責を担える。',
 y:[
  ['初六','霜{しも}を履{ふ}みて堅氷{けんぴょう}至{いた}る。|履霜堅冰至。','陰の始まり(五月の一陰)が九月の霜、十一月の堅氷となる。臣が仕え始めた時の小さな邪心が増長すれば逆賊に至る。悪の芽は火が原野を焼くように広がるので、芽のうちに抑えよ。天風姤と対。'],
  ['六二','直方大{ちょくほうだい}なり。習{なら}わずして利{よろ}しからざる无{な}し。|直方大。不習无不利。','陰位に陰で正しく、五と対する。直は陽の元気に従い曲がらぬこと、方は四方に行き渡ること、大は陽に従うゆえ大。三徳あれば学ばずとも不利なし(論語「雖曰未学」)。'],
  ['六三','章{しょう}を含{ふく}みて貞{てい}にす可{べ}し。或{あるい}は王事{おうじ}に従{したが}うも、成{な}す无{な}くして終{お}わり有{あ}り。|含章可貞。或從王事。无成有終。','学徳を内に含んで誇らない。王事に従い大臣となっても自ら事を定めず、君命を承けて終わりを遂げる。君が始め、臣が終える。'],
  ['六四','嚢{ふくろ}を括{くく}る。咎{とが}も无{な}く誉{ほまれ}も无{な}し。|括囊。无咎无譽。','上卦の始め。無道の世、小人が志を得る時は袋の口を括るように学徳をしまい、名誉も求めない(荘子「為善無近名」)。'],
  ['六五','黄裳{こうしょう}、元吉{げんきつ}。|黃裳。元吉。','坤の五は皇后で、乾九五の配偶。裳は腰より下の衣、黄は中の正色。陰が陽位にある文徳。舜・周公の摂政とする鄭玄説は誤り、臣が五位に即く理はない。'],
  ['上六','竜{りゅう}野{の}に戦{たたか}う。其{そ}の血{ち}玄黄{げんこう}なり。|龍戰于野。其血玄黃。','臣が竜のごとく半ば天子のように振る舞い、逆賊として戦えば必ず敗れる。玄(天)と黄(地)の混じる血は、君の真似をした臣の血。其の道窮まるなり。'],
  ['用六','永貞{えいてい}に利{よろ}し。|利永貞。','陰を乾に用いて陰陽順い正しい。君が始め、臣が大いに終える(以大終也)。']
 ],
 hint:'<ul><li>自分から先に立たず、主に従えば得る。</li><li>小さな悪の芽(不正・慢心)を早く摘む。</li><li>在野では仲間と学び、表に出たら私情を捨てる。</li></ul>',
 ks:'「陰疑於陽必戦、為其兼於陽也」は李鼎祚本の「兼」が正しく他本の「嫌」は誤り。積善之家必有余慶は坤の下に乾が伏在する象(子孫繁昌)。「天地変化草木蕃、天地閉賢人隠」は乾坤往来を知らぬ古今の注が誤解している。',
 all:'坤は乾に後れて従う臣・妻・地の道。初六の霜の兆しから上六の竜戦まで、臣が分を守れば成り、君に紛れれば敗れることを説く。文言の「積善之家必有余慶」は臣弑君・子弑父が一朝一夕に起こらぬことの戒め。'
});

H({n:3, name:'水雷屯', kana:'すいらいちゅん', tri:'坎震', theme:'開闢・君を立てる',
 k:'屯{ちゅん}は、元{おお}いに亨{とお}る、貞{ただ}しきに利{よろ}し。往{ゆ}く攸{ところ}有{あ}るに用{もち}うる勿{なか}れ。侯{きみ}を建{た}つるに利{よろ}し。|屯。元亨利貞。勿用有攸往。利建侯。',
 kn:'天地開闢の直後。下震(長男)、上坎(中男)、約象艮(少男)の三男の卦。屯は止まり悩む、また集まる意。腕力の世で険難に進めないので、元亨利貞(仁義礼智)の徳ある侯を立てよ(天降下民、作之君)。初九が震の主、侯となるべき仁徳の人。',
 d:'雲雷{うんらい}は屯{ちゅん}なり。君子{くんし}以{もっ}て経綸{けいりん}す。|象曰。雲雷屯。君子以經綸。',
 dn:'布を織るように、経(縦糸=雷が四方に敷く=民を愛撫する本)と綸(横糸=雲が集まる=諸方法)を合わせて世を治める。',
 y:[
  ['初九','磐桓{ばんかん}す。貞{てい}に居{お}るに利{よろ}し。侯{きみ}を建{た}つるに利{よろ}し。|磐桓。利居貞。利建侯。','九五は力で覇となった者(以力仮仁)で初九を招くが、初九は大石(磐)・大柱(桓)のように動かない。貴を以て賤に下り大いに民を得る、侯となるべき人。'],
  ['六二','屯如{ちゅんじょ}たり邅如{てんじょ}たり、馬{うま}に乗{の}りて班如{はんじょ}たり。寇{あだ}するに匪{あら}ず婚媾{こんこう}せんとす。女子{じょし}貞{てい}にして字{あざな}せず、十年{じゅうねん}にして乃{すなわ}ち字{あざな}す。|屯如邅如。乘馬班如。匪寇婚媾。女子貞不字。十年乃字。','九五に招かれ出かけるが引き返す。本当の侯は初九。字は妊娠・嫁ぐこと。十年(坤の数)待ち、世の形が定まってから従え。乱世は常道だけでは行けない(反常)。'],
  ['六三','鹿{しか}に即{つ}きて虞{ぐ}无{な}し、惟{た}だ林中{りんちゅう}に入{い}る。君子{くんし}幾{き}を見{み}て舎{す}つるに如{し}かず。往{ゆ}けば吝{りん}。|即鹿无虞。惟入于林中。君子幾不如舍。往吝。','鹿は天子の位(秦其の鹿を失う)。案内(虞人)もなく深山に入る暴進。君子は幾を見て止めよ。往けば吝、窮まる。'],
  ['六四','馬{うま}に乗{の}りて班如{はんじょ}たり。婚媾{こんこう}を求{もと}めて往{ゆ}けば吉{きつ}、利{よろ}しからざる无{な}し。|乘馬班如。求婚媾。往吉。无不利。','初九が求めてくるので往けば吉。明らかな判断。'],
  ['九五','其{そ}の膏{こう}を屯{なや}ます。小貞{しょうてい}は吉{きつ}、大貞{だいてい}は凶{きょう}。|屯其膏。小貞吉。大貞凶。','恩沢を施すのを惜しむ。会計役人の小事ならよいが、人の上に立つ者なら凶。項羽は印の角が欠けるまで握って渡さぬ「婦人之仁」、漢高祖は寛仁大度で天下を得た。施し未だ光いならず。'],
  ['上六','馬{うま}に乗{の}りて班如{はんじょ}たり、泣血{きゅうけつ}漣如{れんじょ}たり。|乘馬班如。泣血漣如。','行き場なく血の涙を流す。何ぞ長かるべけんや、気力を奮え。']
 ],
 hint:'<ul><li>物事の始めで難渋する。無理に従わせず、中心となる人物を立てる。</li><li>縁談・就職は世の形が定まるまで待つ。</li><li>上に立つ者は恩恵を惜しまない。</li></ul>',
 ks:'彖伝「雷雨之動満形」が正しく、後世本の「満盈」は誤り(満形=物の形が現れ満ちる)。天造草昧は草が地を覆って暗く、君臣の別がない世。宜しく侯を建てて寧んぜず、服さぬ者を無理に従わせない。',
 all:'屯は君を立て、蒙は師を作る(天降下民、作之君、作之師)。開闢の混沌で、徳ある侯(初九)を立てて秩序を築く卦。'
});

H({n:4, name:'山水蒙', kana:'さんすいもう', tri:'艮坎', theme:'師を立てる・皇太子の教育',
 k:'蒙{もう}は亨{とお}る。我{われ}童蒙{どうもう}に求{もと}むるに匪{あら}ず、童蒙{どうもう}我{われ}に求{もと}む。初筮{しょぜい}は告{つ}ぐ。再三{さいさん}すれば瀆{けが}る。瀆{けが}るれば告{つ}げず。貞{ただ}しきに利{よろ}し。|蒙亨。匪我求童蒙。童蒙求我。初筮告。再三瀆。瀆則不告。利貞。',
 kn:'蒙は草が地を覆う、冒る。天より受けた性の善が邪に包まれている。亨とは本来暢びる性を持つこと。主題は皇太子の教育で、九二(互体震=長男)が師、六五が童蒙(皇太子)。師は教えを押し売りせず、童蒙が誠をもって求める。天子も師には北面する。誠なき再三の問いには答えない。',
 d:'山下{さんか}に泉{いずみ}出{い}づるは蒙{もう}なり。君子{くんし}以{もっ}て行{おこな}いを果{は}たし徳{とく}を育{やしな}う。|象曰。山下出泉蒙。君子以果行育德。',
 dn:'山を掘って泉を取り出すように、学問によって性の美を外に出す。果行は艮、育徳は坎。',
 y:[
  ['初六','蒙{もう}を発{ひら}く。用{もっ}て人{ひと}を刑{けい}するに利{よろ}し。用{もっ}て桎梏{しっこく}を説{と}く。以{もっ}て往{ゆ}けば吝{りん}。|發蒙。利用刑人。用說桎梏。以往吝。','幼少から刑人を扱うように厳格に束縛して調える(礼楽射御書数、足運び手使い)。桎(足枷=震)と梏(手枷=艮)を解いて放任するのは吝。以て法を正すなり(坎=法)。'],
  ['九二','蒙{もう}を包{つつ}む、吉{きつ}。婦{つま}を納{い}る、吉{きつ}。子{こ}家{いえ}を克{よ}くす。|包蒙吉。納婦吉。子克家。','天下の蒙を包容し、女子も教育して吉。賢母の子は家をよく治める。婦徳・婦言・婦容・婦功。班昭は漢書を完成し宮中の師となった。'],
  ['六三','女{じょ}を取{めと}るに用{もち}うる勿{なか}れ。金夫{きんぷ}を見{み}て躬{み}を有{たも}たず。利{よろ}しき攸{ところ}无{な}し。|勿用取女。見金夫。不有躬。无攸利。','財ある男を見て節を失う女。行い順ならず。'],
  ['六四','蒙{もう}に困{くる}しむ。吝{りん}。|困蒙。吝。','師(九二・上九)に遠く、朋友も悪い。独り実に遠ざかる。'],
  ['六五','童蒙{どうもう}、吉{きつ}。|童蒙。吉。','皇太子が北面して師に学ぶ。順にして以て巽うなり。'],
  ['上九','蒙{もう}を撃{う}つ。寇{あだ}を為{な}すに利{よろ}しからず、寇{あだ}を禦{ふせ}ぐに利{よろ}し。|擊蒙。不利爲寇。利禦寇。','蒙の極、欲が石のように固まればもう撃つしかない。欲は我が身の寇、起こった初めに禦げ(山上から下の泥棒を防ぐ)。']
 ],
 hint:'<ul><li>学ぶ・教わる事は求める側の誠しだい。</li><li>同じことを何度も占うのは瀆す。</li><li>子弟の教育は幼少から厳格に。</li></ul>',
 ks:'「蒙以養正聖功也」の養は庠(学校)。天子も師には北面する。',
 all:'屯で君を立て、蒙で師を作る。童蒙の皇太子が誠をもって師に学ぶ教育の卦。'
});

H({n:5, name:'水天需', kana:'すいてんじゅ', tri:'坎乾', theme:'時を待つ',
 k:'需{じゅ}は、孚{まこと}有{あ}り。光{おお}いに亨{とお}る。貞{てい}にして吉{きつ}。大川{たいせん}を渉{わた}るに利{よろ}し。|需。有孚。光亨。貞吉。利涉大川。',
 kn:'需は須、待つこと。下乾は天徳を得た賢人三人、九五は明君、六四は悪い大臣(三四五の離=火で民を焼き、坎の穴から水が民を溺らす)。天子も賢人も互いに待つ。孚は月と水、天子の誠。剛健にして陥らず、暴虎馮河せず忍耐して待つ。',
 d:'雲{くも}天{てん}に上{のぼ}るは需{じゅ}なり。君子{くんし}以{もっ}て飲食{いんしょく}宴楽{えんらく}す。|象曰。雲上於天需。君子以飲食宴樂。',
 dn:'大事を行う者は形を見せず、酒食で身心を養い、時が至れば雷のごとく進む。',
 y:[
  ['初九','郊{こう}に需{ま}つ。恒{つね}を用{もち}うるに利{よろ}し。咎{とが}无{な}し。|需于郊。利用恒。无咎。','原野で控える。難を犯して行かず、常を失わない。'],
  ['九二','沙{すな}に需{ま}つ。小{すこ}しく言{げん}有{あ}り。終{つい}に吉{きつ}。|需于沙。小有言。終吉。','朝廷に出ているが、水辺近くで控える。小人に「なぜ進まぬ」と譏られても動かない。衍(水が両岸の間を流れる)は中に在る、まだ溢れない。'],
  ['九三','泥{どろ}に需{ま}つ。寇{あだ}の至{いた}るを致{いた}す。|需于泥。致寇至。','寇(六四)に近づきすぎて自ら招く。敬慎すれば敗れず。'],
  ['六四','血{ち}に需{ま}つ。穴{あな}より出{い}づ。|需于血。出自穴。','悪い大臣が赤心(血=誠)をもって三賢人に降伏する。順にして以て聴くなり。'],
  ['九五','酒食{しゅしょく}に需{ま}つ。貞{てい}にして吉{きつ}。|需于酒食。貞吉。','天子が賢人を酒食で厚遇する。九五が変ずれば地天泰。'],
  ['上六','穴{あな}に入{い}る。速{まね}かざるの客{きゃく}三人{さんにん}来{きた}る有{あ}り。之{これ}を敬{けい}すれば終{つい}に吉{きつ}。|入于穴。有不速之客三人來。敬之終吉。','水が穴に入り険が消える。招かずして来た三賢人(下乾)を敬え。大臣が天子に代わり亭主役で饗応する。位に当たらずといえども未だ大いに失わず。']
 ],
 hint:'<ul><li>待て。無理押しせず、忍耐して時を待つ。</li><li>大事の前は形を見せず、心身を養う。</li><li>思わぬ協力者を敬えば道が開ける。</li></ul>',
 ks:'',
 all:'剛健な賢人と明君が、間の悪臣を前に互いに時を待つ卦。待つことは弱さではなく、剛健にして陥らぬ知恵。'
});

H({n:6, name:'天水訟', kana:'てんすいしょう', tri:'乾坎', theme:'争い・訴え',
 k:'訟{しょう}は、孚{まこと}有{あ}りて窒{ふさ}がる。惕{おそ}れて中{ちゅう}すれば吉{きつ}、終{お}うれば凶{きょう}。大人{たいじん}を見{み}るに利{よろ}し。大川{たいせん}を渉{わた}るに利{よろ}しからず。|訟。有孚窒惕。中吉。終凶。利見大人。不利涉大川。',
 kn:'需(飲食)を求めれば争いが生ずる。多くは財をめぐる争い(周礼の財訟)。上乾は昇り、下坎は降りて違い行く。本は同じ天の気を受けた兄弟なのに、欲で争う。孚(坎=潮の満ち干の信)＝誰が聞いても尤もな時のみ起こせ。窒は争いの心を塞ぎ止め一旦控えること、惕は懼れること。仲裁があれば中途で止めよ、剛情に遂げれば凶。重大な訟は天子自ら裁く。',
 d:'天{てん}と水{みず}と違{たが}い行{ゆ}くは訟{しょう}なり。君子{くんし}以{もっ}て事{こと}を作{な}すに始{はじ}めを謀{はか}る。|象曰。天與水違行訟。君子以作事謀始。',
 dn:'兄弟の争いも、本(同じ親・先祖)を思えば起こらない。事の始めによく考えよ。',
 y:[
  ['初六','事{こと}とする所{ところ}を永{なが}くせず。小{すこ}しく言{げん}有{あ}り。終{つい}に吉{きつ}。|不永所事。小有言。終吉。','小言程度で止める。自分にも疚しい所がある。坎は法律、道徳が衰えると法律が貴くなり、君を訴える者まで出る。'],
  ['九二','訟{うった}うるに克{か}たず。帰{かえ}りて逋{のが}る。其{そ}の邑人{ゆうじん}三百戸{さんびゃっこ}、眚{わざわい}无{な}し。|不克訟。歸而逋。其邑人三百戶。无眚。','坎の主の危険な男が、民を煽動して自国の君を外国に訴える。臣が君を訴えるのは天地の容れざる所で勝てず、帰っても居場所なく逃亡する。煽動された邑人に罪はない。左伝の衛の元咺が成公を晋文公に訴えた例：周の襄王は「臣の訟えで君を殺すことはできない」と拒み、甯武子は獄中の君に仕え毒を薄めさせて救った(論語「其愚不可及也」)。'],
  ['六三','旧徳{きゅうとく}を食{は}む。貞{てい}なれば厲{あやう}けれども終{つい}に吉{きつ}。或{あるい}は王事{おうじ}に従{したが}うも成{な}す无{な}し。|食舊德。貞厲終吉。或從王事。无成。','一旦傾くが、先祖代々の禄を思って君を訴えない。上に従えば吉。'],
  ['九四','訟{うった}うるに克{か}たず。復{かえ}りて命{めい}に即{つ}き、渝{か}えて貞{てい}に安{やす}んずれば吉{きつ}。|不克訟。復即命。渝安貞吉。','大臣が一旦惑わされたが、改めて君命に即く。失わざるなり。'],
  ['九五','訟{うった}え元吉{げんきつ}。|訟元吉。','中正なる天子の裁き。'],
  ['上九','或{あるい}は之{これ}に鞶帯{はんたい}を錫{たま}う。終朝{しゅうちょう}三{み}たび之{これ}を褫{うば}う。|或錫之鞶帶。終朝三褫之。','訟に勝って褒美の鞶帯と服を賜り、一朝に三度着て見せびらかす。訟を以て服を受くるは亦敬するに足らず。']
 ],
 hint:'<ul><li>争いは中途で止めれば吉、押し通せば凶。</li><li>上役・国家を相手取る争いは勝てない。</li><li>事の始めによく考える。契約は最初に詰める。</li></ul>',
 ks:'上九「褫」は拕(ひく、紳を垂らす)と読むべき。伏羲は後世の法治(法律が道徳より重くなる世)を見越して戒めた。',
 all:'欲が兄弟の天の気を隔てて起こる争い。臣が君を、子が親を訴えることを最も戒める。'
});

H({n:7, name:'地水師', kana:'ちすいし', tri:'坤坎', theme:'正義の戦・皇太子の元帥',
 k:'師{し}は貞{てい}なり。丈人{じょうじん}なれば吉{きつ}にして咎{とが}无{な}し。|師。貞。丈人吉。无咎。',
 kn:'天子六軍、一軍一万二千五百人、師は二千五百人、旅は五百人。師の字は阜(高所を後ろに陣す)と帀(めぐる)で衆。貞は誰が見ても討たねばならぬ正義の戦。丈人は年長者、すなわち長子＝皇太子が元帥となる(乾九四「或躍」、師六五「長子帥師」)。彖「以此毒天下」の毒は治める(医者が薬で病を攻める)。',
 d:'地中{ちちゅう}に水{みず}有{あ}るは師{し}なり。君子{くんし}以{もっ}て民{たみ}を容{い}れ衆{しゅう}を畜{やしな}う。|象曰。地中有水師。君子以容民畜衆。',
 dn:'地中に水＝国内の民は皆兵(男子は国を守る義務)。畜は養い教えて善ならしめること、親に孝、君に忠を子供のうちから。',
 y:[
  ['初六','師{し}出{い}づるに律{りつ}を以{もっ}てす。否臧{ひぞう}なれば凶{きょう}。|師出以律。否臧凶。','律は音律。出陣の時に太師が律を吹いて軍の和・不和を聴く(周礼「同律以聴軍声」)。善を否とする者がいて不和なら凶(孟子「地の利は人の和に如かず」)。'],
  ['九二','師{し}に在{あ}りて中{ちゅう}す。吉{きつ}にして咎{とが}无{な}し。王{おう}三{み}たび命{めい}を錫{たま}う。|在師中。吉无咎。王三錫命。','皇太子が大元帥として中軍にある。天寵を承け、万邦を懐く。'],
  ['六三','師{し}或{あるい}は尸{しかばね}を輿{の}す。凶{きょう}。|師或輿尸。凶。','左右翼の将が功を焦り、元帥の命なく進んで大敗し、屍を車で運ぶ。大いに功无し。'],
  ['六四','師{し}左{しりぞ}き次{やど}る。咎{とが}无{な}し。|師左次。无咎。','六三の敗れを見て動かず陣を全うする。未だ常を失わず(左伝城濮の戦の例)。'],
  ['六五','田{た}に禽{けもの}有{あ}り。言{げん}を執{と}るに利{よろ}し。咎{とが}无{な}し。長子{ちょうし}師{し}を帥{ひき}ゆ。弟子{ていし}尸{しかばね}を輿{の}す。貞{てい}なれども凶{きょう}。|田有禽。利執言。无咎。長子帥師。弟子輿尸。貞凶。','田の禽獣＝外国が侵して来た害を除く正義の戦。言を執って彼を責めよ。長子(九二)に帥いさせよ。血気の弟子を用いれば、正しくとも敗れて尸を輿す。'],
  ['上六','大君{たいくん}命{めい}有{あ}り。国{くに}を開{ひら}き家{いえ}を承{う}けしむ。小人{しょうじん}は用{もち}うる勿{なか}れ。|大君有命。開國承家。小人勿用。','功の第一は国を開き(諸侯)、次は家を承く(大夫)。小人がたまたま功を立てても賞は与えよ、官には用いるな。必ず邦を乱すなり。']
 ],
 hint:'<ul><li>大勢を動かす事は、大義名分と人の和が先。</li><li>血気の若手に任せれば失敗する。経験ある責任者を立てる。</li><li>功ある小人には報酬で報い、地位は与えない。</li></ul>',
 ks:'丈人が正しく、子夏伝の「大人」や呉澄の改字は誤り。',
 all:'正義の戦のみを許し、皇太子を元帥とし、人の和と規律を先とする軍の卦。'
});

H({n:8, name:'水地比', kana:'すいちひ', tri:'坎坤', theme:'君民の密着',
 k:'比{ひ}は吉{きつ}なり。原{たず}ね筮{ぜい}して元永貞{げんえいてい}なれば咎{とが}无{な}し。寧{やす}からざるもの方{まさ}に来{きた}る。後{おく}るる夫{ふ}は凶{きょう}。|比。吉。原筮元永貞。无咎。不寧方來。後夫凶。',
 kn:'比は密。上坎(水)が下坤(地)に浸み込んで離れない、天子と人民の密着。原筮は再び筮すること、君が再三民に問い尋ねる(舜は問うを好む)。朝せざる諸侯も来朝するが、後れる者は凶。',
 d:'地上{ちじょう}に水{みず}有{あ}るは比{ひ}なり。先王{せんのう}以{もっ}て万国{ばんこく}を建{た}て諸侯{しょこう}を親{した}しむ。|象曰。地上有水比。先王以建萬國親諸侯。',
 dn:'君と民が一体で離れないことを示し、皇統一系の意を含む。',
 y:[
  ['初六','孚{まこと}有{あ}りて之{これ}に比{ひ}す。咎{とが}无{な}し。孚{まこと}有{あ}りて缶{ほとぎ}に盈{み}つ。終{つい}に来{きた}りて他{た}の吉{きつ}有{あ}り。|有孚比之。无咎。有孚盈缶。終來有他吉。','天子の孚(誠)が、缶(坤の土器)に水が満ちるように天下に溢れ、最下賤の者まで親しまれる。応でないのに意外の吉。'],
  ['六二','之{これ}に比{ひ}すること内{うち}よりす。貞{てい}にして吉{きつ}。|比之自內。貞吉。','中正の徳が内にあるから、天子の方から親しむ。自ら失わず。'],
  ['六三','之{これ}に比{ひ}すれども人{ひと}に匪{あら}ず。|比之匪人。','上六(後れた夫)から比して来る悪人。自ら招く不中不正、亦傷ましからずや。'],
  ['六四','外{そと}より之{これ}に比{ひ}す。貞{てい}にして吉{きつ}。|外比之。貞吉。','大臣に天子が外から親しむ。外、賢に比して以て上に従う。'],
  ['九五','比{ひ}を顕{あき}らかにす。王{おう}用{もっ}て三駆{さんく}して前禽{ぜんきん}を失{うしな}う。邑人{ゆうじん}誡{いまし}めず。吉{きつ}。|顯比。王用三驅。失前禽。邑人不誡。吉。','私なく大いに比す。服する者を求めず来たい者だけを受ける(狩で一方を開け、前に逃げる禽は追わない)。逆らう者を舎て順う者を取る。人民は兄弟のように夜も門を閉じない。'],
  ['上六','之{これ}に比{ひ}するに首{かしら}无{な}し。凶{きょう}。|比之无首。凶。','独り服さぬ者。首(君)なく、終わる所なし。']
 ],
 hint:'<ul><li>親しみ・協力・加入の時。早く加われ、遅れる者は凶。</li><li>来る者は拒まず、去る者は追わない。</li><li>誠が満ちれば思わぬ所から吉が来る。</li></ul>',
 ks:'蒙の「初筮」(坎が内卦)と比の「原筮」(坎が外卦)は、十八変で内卦、さらに十八変で外卦を得ることを指す(三十六変筮法)。',
 all:'水が地に浸みるように君民が一体となる卦。根本はこれを皇統一系の象とし、序卦でも「比は君民一体」と強調する。'
});
H({n:9, name:'風天小畜', kana:'ふうてんしょうちく', tri:'巽乾', theme:'臣が誠で君を育てる',
 k:'小畜{しょうちく}は亨{とお}る。密雲{みつうん}雨{あめ}ふらず、我{わ}が西郊{せいこう}よりす。|小畜。亨。密雲不雨。自我西郊。',
 kn:'小は陰、すなわち六四の大臣。畜は育て養って美ならしめること(孟子「畜君何尤、畜君者好君也」)。大臣が君を育てて明君にする卦で、大畜はその逆(君が臣を育てる)。亨は至誠が君に貫徹すること。諫言より誠で感ぜしめるのが正道(舜が瞽叟に誠を尽くした)。密雲不雨は陰だけで雲を作り陽が応じない形、西(陰)からの雲だけ。',
 d:'風{かぜ}天上{てんじょう}を行{ゆ}くは小畜{しょうちく}なり。君子{くんし}以{もっ}て文徳{ぶんとく}を懿{うるわ}しくす。|象曰。風行天上小畜。君子以懿文德。',
 dn:'風が雲を様々な形に吹き分ける＝文章。文徳を美しく修める。',
 y:[
  ['初九','復{かえ}ること道{みち}よりす。何{なん}ぞ其{そ}れ咎{とが}あらん。吉{きつ}。|復自道。何其咎。吉。','一陽来復(七日来復)。心で過ちに気づき、言行に出る前に立ち戻る(顔回不弐過)。'],
  ['九二','牽{ひ}かれて復{かえ}る。吉{きつ}。|牽復。吉。','初九に牽かれて共に道に戻る。中に在りて亦自ら失わず。'],
  ['九三','輿{くるま}輻{や}を説{と}く。夫妻{ふさい}目{め}を反{そむ}く。|輿說輻。夫妻反目。','剛に過ぎ出仕しようとして六四の大臣に抑えられ、車の輻を外して帰り、妻(六四、巽=白眼)と喧嘩。室を正すこと能わず、家を正せない者は天下を治められない。'],
  ['六四','孚{まこと}有{あ}り。血{ち}去{さ}り惕{おそ}れ出{い}づ。咎{とが}无{な}し。|有孚。血去惕出。无咎。','赤心(血)を尽くして君に仕え、事が成ると思えばまた惕れる。万世の忠臣の手本。上、志を合わす。'],
  ['九五','孚{まこと}有{あ}りて攣如{れんじょ}たり。富{と}むこと其{そ}の鄰{となり}を以{もっ}てす。|有孚攣如。富以其鄰。','君も感じ、大臣と手を攣いで離れない。鄰は六四。独り富まず。'],
  ['上九','既{すで}に雨{あめ}ふり既{すで}に処{お}る。徳{とく}を尚{たっと}びて載{の}す。婦{つま}貞{てい}なれども厲{あやう}し。月{つき}望{ぼう}に幾{ちか}し。君子{くんし}征{ゆ}けば凶{きょう}。|既雨既處。尚德載。婦貞厲。月幾望。君子征凶。','誠が通じて雨が降り、徳が車に載せるほど積もる。しかし大臣の力が満月に近づけば君と紛らわしくなる(陰疑於陽)、退け。周公旦も流言に遭った。']
 ],
 hint:'<ul><li>諫言より至誠で人を動かす。</li><li>事は小さく止められ、まだ雨(成果)に至らない。</li><li>力が満ちそうな時は一歩退く。</li></ul>',
 ks:'',
 all:'六四の一陰が五陽を畜める。臣が誠で君を育て、力が満ちれば身を退く忠臣の卦。'
});

H({n:10, name:'天沢履', kana:'てんたくり', tri:'乾兌', theme:'虎の尾を踏む・上下の弁',
 k:'虎{とら}の尾{お}を履{ふ}む。人{ひと}を咥{くら}わず。亨{とお}る。|履虎尾。不咥人。亨。',
 kn:'下の兌は虎(革卦の虎)＝巧言令色の佞人で、始めは柔順に天子の意に適い大臣まで出世し、欲が深まって君を咥えようとする。乾(天子)が後ろにいれば咥えられるが、天子が旋って後ろから虎の尾を踏めば咥えられない。これが亨。韓非子揚権篇「主失其神、虎随其後…以弑其母」。',
 d:'上{かみ}天{てん}下{しも}沢{たく}は履{り}なり。君子{くんし}以{もっ}て上下{しょうか}を弁{べん}じ、民{たみ}の志{こころざし}を定{さだ}む。|象曰。上天下澤履。君子以辯上下。定民志。',
 dn:'礼で上下親疎を弁ずる。皇統一系が易わらぬと民が知れば、上を犯す心は起きない。',
 y:[
  ['初九','素履{そり}して往{ゆ}く。咎{とが}无{な}し。|素履往。无咎。','素は白い生糸、飾りなき質朴。皆が大臣(六三)に靡く中、独り己の願いを行う。'],
  ['九二','道{みち}を履{ふ}むこと坦坦{たんたん}たり。幽人{ゆうじん}貞{てい}にして吉{きつ}。|履道坦坦。幽人貞吉。','大臣に付かず山沢の間に閑居する。中にして自ら乱れず。'],
  ['六三','眇{すがめ}にして能{よ}く視{み}、跛{あしなえ}にして能{よ}く履{ふ}む。虎{とら}の尾{お}を履{ふ}みて人{ひと}を咥{くら}う。凶{きょう}。武人{ぶじん}大君{たいくん}と為{な}る。|眇能視。跛能履。履虎尾。咥人凶。武人爲于大君。','卦主の悪大臣。片目片足でも見える歩けると強情。武人が大君(天子)の事を行おうとする＝乱臣賊子。位当たらず、志剛なり。'],
  ['九四','虎{とら}の尾{お}を履{ふ}む。愬愬{さくさく}たり。終{つい}に吉{きつ}。|履虎尾。愬愬終吉。','皇族が天子を輔けて大臣を撃つ。愬愬は懼れ慎むこと。志行わる。'],
  ['九五','夬{けっ}して履{ふ}む。貞{てい}なれども厲{あやう}し。|夬履。貞厲。','旋って夬(断つ)となり虎の尾を履む。臣党が朝廷に多く危うい。位正に当たる。'],
  ['上九','履{ふ}むを視{み}て祥{さち}を考{かんが}う。其{そ}れ旋{めぐ}れば元吉{げんきつ}。|視履考祥。其旋元吉。','天は人の履み行いを見て福を降す。旋れば元吉、乱賊を除き天下皆慶ぶ(大いに慶有り)。']
 ],
 hint:'<ul><li>危うい相手に背後を取られるな。こちらが後ろを取れ。</li><li>上下の分をはっきりさせる。</li><li>質朴に自分の道を行けば咎なし。</li></ul>',
 ks:'「旋る」は古今の注が誰も知らない点。上九が旋れば沢天夬となり、王庭で大臣の罪を揚げる形になる。',
 all:'巧言令色の大臣(兌)が天子(乾)を狙う。天子が旋って後ろを取れば無事という、根本独特の読み。'
});

H({n:11, name:'地天泰', kana:'ちてんたい', tri:'坤乾', theme:'上下の交わり・太平',
 k:'泰{たい}は小{しょう}往{ゆ}き大{だい}来{きた}る。吉{きつ}にして亨{とお}る。|泰。小往大來。吉亨。',
 kn:'泰は滑、流通して滞らない。泰・太・代・世は通字で、世は三十、三十年で一変する。陰(小)が往き陽(大)が来る。正月の卦(十一月復→十二月臨→正月泰→二月大壮)。天子の恩沢が下に満ち上下が交わる。彖「則是天地交而万物通也」の「則」の字が重要。',
 d:'天地{てんち}交{まじ}わるは泰{たい}なり。后{きみ}以{もっ}て天地{てんち}の道{みち}を財成{さいせい}し、天地{てんち}の宜{よろ}しきを輔相{ほしょう}し、以{もっ}て民{たみ}を左右{さゆう}す。|象曰。天地交泰。后以財成天地之道。輔相天地之宜。以左右民。',
 dn:'財は裁、植木屋が伸びすぎを伐り足りない所を補う。輔相は倒れる者を支えること。左右民は赤子を両手で支える(大学「如保赤子」)、奢侈で財を失わせない。',
 y:[
  ['初九','茅{ちがや}を抜{ぬ}くに茹{じょ}たり。其{そ}の彙{たぐい}を以{もっ}てす。征{ゆ}けば吉{きつ}。|拔茅茹。以其彙。征吉。','茅は潔白、宗廟の祭で酒を縮す草。潔白な賢人を抜擢する。茹は食う(春の茅は香気あり)。一賢人を用いれば同類が集まる。志外に在り。'],
  ['九二','荒{こう}を包{か}ね、馮河{ひょうが}を用{もち}い、遐{とお}きを遺{わす}れず、朋{とも}亡{うしな}えば、中行{ちゅうこう}に尚{たっと}ばる。|包荒。用馮河。不遐遺。朋亡。得尚于中行。','乾の中＝天の如き度量で、草莽の荒々しい者も容れる。舟なく河を渡る血気の勇者も用い方次第。遠方も遺れず朋党なし。尚は天子の娘を娶ること(孟子「舜尚見帝」)、中行は六五天子。'],
  ['九三','平{たいら}かにして陂{かたむ}かざる无{な}く、往{ゆ}きて復{かえ}らざる无{な}し。艱{なや}みて貞{てい}なれば咎{とが}无{な}し。其{そ}の孚{まこと}を恤{うれ}うる勿{なか}れ。食{しょく}に于{お}いて福{さいわい}有{あ}り。|无平不陂。无往不復。艱貞无咎。勿恤其孚。于食有福。','三十年で一変、太平は必ず傾く。艱難に正しければ咎なし、誠を尽くせば禄に不足なし。上は己を虚しくして下の賢人に下れ。天地の際なり。'],
  ['六四','翩翩{へんぺん}として富{と}めりとせず、其{そ}の鄰{となり}を以{もっ}てす。戒{いまし}めずして以{もっ}て孚{まこと}あり。|翩翩不富以其鄰。不戒以孚。','皇族が己を空しくして近くの賢人を用いる。皆実を失う(学徳を無きものとする)、中心願うなり。'],
  ['六五','帝乙{ていいつ}妹{いもうと}を帰{とつ}がしむ。以{もっ}て祉{さいわい}あり元吉{げんきつ}。|帝乙歸妹。以祉元吉。','帝乙(震=乙、帝出乎震)は紂の父。妹を九二の賢人に嫁がせる。中以て願いを行う。'],
  ['上六','城{しろ}隍{ほり}に復{かえ}る。師{いくさ}を用{もち}うる勿{なか}れ。邑{ゆう}より命{めい}を告{つ}ぐ。貞{てい}なれども吝{りん}。|城復于隍。勿用師。自邑告命。貞吝。','城は堀の土を盛ったもの、古くなれば崩れて空堀に戻る。泰が否に転ずる。民が騒いでも兵を用いず、各村邑の長が命令と徳で治めよ。其の命乱るるなり。']
 ],
 hint:'<ul><li>通じる・交わる・協力の時。上下の意思疎通がよい。</li><li>ただし太平は必ず傾く。盛りのうちに備える。</li><li>賢人を一人抜擢すれば同類が集まる。</li></ul>',
 ks:'大象を「地天交泰」に改める説は誤り。天が降り地が昇るから「天地交」。',
 all:'天子の恩沢が下に満ち、上下の志が通じる太平の卦。しかし三十年で世は一変し、城は堀に還る。'
});

H({n:12, name:'天地否', kana:'てんちひ', tri:'乾坤', theme:'塞がり・小人の世',
 k:'之{これ}を否{ふさ}ぐは人{ひと}に匪{あら}ず。君子{くんし}の貞{てい}に利{よろ}しからず。大{だい}往{ゆ}き小{しょう}来{きた}る。|否之匪人。不利君子貞。大往小來。',
 kn:'否之匪人＝天地上下を塞いだのは人でなしの悪人(履と同じ文法)。小人が権を握る時に君子が正しく行えば禍を招くので、括嚢のように慎む。内陰外陽・内柔外剛(心が弱く外を強がる)・内小人外君子。小人の道長じ君子の道消す＝金さえ取れればよい世。',
 d:'天地{てんち}交{まじ}わらざるは否{ひ}なり。君子{くんし}以{もっ}て徳{とく}を倹{つづま}やかにして難{なん}を辟{さ}く。栄{えい}するに禄{ろく}を以{もっ}てす可{べ}からず。|象曰。天地不交否。君子以儉德辟難。不可榮以祿。',
 dn:'倹は徳を内に深くしまうこと(外に出すと小人に憎まれる)。官が様々に賢人を求めても出ない。',
 y:[
  ['初六','茅{ちがや}を抜{ぬ}くに茹{じょ}たり。其{そ}の彙{たぐい}を以{もっ}てす。貞{てい}にして吉{きつ}、亨{とお}る。|拔茅茹。以其彙。貞吉亨。','乱世でも登用はあるが、登用されるのは小人の類。出る者も初めは君のためのつもり(志君に在り)。'],
  ['六二','包承{ほうしょう}す。小人{しょうじん}は吉{きつ}、大人{たいじん}は否{ふさ}がりて亨{とお}る。|包承。小人吉。大人否亨。','六三の悪大臣の下で逆らわず包容する。大人は用いられず塞がるが、それで道は亨る。群を乱さず、小人の群に入らない。'],
  ['六三','羞{はじ}を包{か}ぬ。|包羞。','恥を知らず金さえ得ればよい小人。君子と小人の別は恥の有無。位当たらず。'],
  ['九四','命{めい}有{あ}り、咎{とが}无{な}し。疇{たぐい}祉{さいわい}に離{つ}く。|有命。无咎。疇離祉。','皇族が天子の命を受け、小人を退け君子を用いる大改革。志行わる。'],
  ['九五','否{ひ}を休{や}む。大人{たいじん}は吉{きつ}。其{そ}れ亡{ほろ}びなん其{そ}れ亡{ほろ}びなんとて、苞桑{ほうそう}に繋{か}く。|休否。大人吉。其亡其亡。繫于苞桑。','堯が四凶(鯀・共工・驩兜・三苗)のいる朝廷でゆったり時を待ち、舜を挙げた。急げば乱を重ねる。今亡びるかと昼夜恐懼すれば、根深く叢生する桑に繋いだように動かない。'],
  ['上九','否{ひ}を傾{かたむ}く。先{さき}には否{ふさ}がり後{のち}には喜{よろこ}ぶ。|傾否。先否後喜。','「否が傾く」ではなく「否を傾ける」＝人の力。否終われば則ち傾く、何ぞ長かるべけんや。']
 ],
 hint:'<ul><li>塞がりの時。徳を内にしまい、禄で誘われても出ない。</li><li>小人に逆らわず、その群にも入らない。</li><li>時を待ち、最後は人の力で否を傾ける。</li></ul>',
 ks:'大象の「不可栄以禄」は古本では「不可営以禄」で、後世本の「栄」は誤り(営＝抜け目なく求める)。治乱は天運と諦めず人力で泰に引き戻すのが人道。',
 all:'天地が交わらず、小人が栄える塞がりの世。君子は徳を倹し、九五・上九で人の力をもって否を傾ける。'
});

H({n:13, name:'天火同人', kana:'てんかどうじん', tri:'乾離', theme:'四海兄弟・人と親しむ',
 k:'人{ひと}に同{おな}じくするに野{や}に于{お}いてすれば亨{とお}る。大川{たいせん}を渉{わた}るに利{よろ}し。君子{くんし}の貞{てい}に利{よろ}し。|同人于野。亨。利涉大川。利君子貞。',
 kn:'否の反対、人と親しみ吉凶を同じくする(雑卦「同人親也」)。于野は都から遠い山谷の者まで。天地の気を受けて天地を父母とする者は四海の内皆兄弟。仁は相親しむこと(論語「己欲立而立人」)。九五天子が六二賢人を信用する卦。唯君子のみ能く天下の志に通ず。',
 d:'天{てん}と火{ひ}とは同人{どうじん}なり。君子{くんし}以{もっ}て族{やから}を類{るい}し物{もの}を弁{べん}ず。|象曰。天與火同人。君子以類族辨物。',
 dn:'天の気(光・元気)が形を成したのが火で、本は同じもの。宗家(宗)に分家(族)が集まり、類で分けて席次・衣服の順序を立てる。',
 y:[
  ['初九','人{ひと}に同{おな}じくするに門{もん}に于{お}いてす。咎{とが}无{な}し。|同人于門。无咎。','家に籠らず門を出て交際する。又誰か咎めん。'],
  ['六二','人{ひと}に同{おな}じくするに宗{そう}に于{お}いてす。吝{りん}。|同人于宗。吝。','卦主の賢人。宗は乾(万物の本)。一家が賢人を外に出さず抱え込むのは狭い、吝の道。九五は用いたいが九三・九四が隔てる。'],
  ['九三','戎{つわもの}を莽{くさむら}に伏{ふ}せ、其{そ}の高陵{こうりょう}に升{のぼ}る。三歳{さんさい}興{おこ}らず。|伏戎于莽。升其高陵。三歲不興。','賢人を出すまいと兵を伏せるが、敵(九五)が剛く三年動けない。'],
  ['九四','其{そ}の墉{かき}に乗{の}る。攻{せ}むる克{あた}わず。吉{きつ}。|乘其墉。弗克攻。吉。','城の石垣まで攻め上るが、六二に道理で責められて退く。困しみて則に反る。'],
  ['九五','人{ひと}に同{おな}じくするに先{さき}には号咷{ごうとう}し後{のち}には笑{わら}う。大師{たいし}克{か}ちて相遇{あいあ}う。|同人先號咷而後笑。大師克相遇。','賢人を呼ぶが隔てる者あり、大軍で九三・九四を撃ち破ってやっと会う。君臣の会い難さ。繋辞「二人心を同じくすれば其の利きこと金を断つ」＝間を隔てる陽(金)を心の鋭利で断ち切る。'],
  ['上九','人{ひと}に同{おな}じくするに郊{こう}に于{お}いてす。悔{くい}无{な}し。|同人于郊。无悔。','都を離れて郊外に隠れた老賢人とも交わる。野(さらに遠方)までは届かず、志未だ得ず。']
 ],
 hint:'<ul><li>広く公に交われば通じる。身内だけに閉じれば吝。</li><li>間を隔てる者がいても、最後は会える。</li><li>協同・共同事業・同窓の縁。</li></ul>',
 ks:'',
 all:'天子が遠くの賢人まで同じく親しむ卦。身内で囲い込む(同人于宗)を戒め、四海兄弟を説く。'
});

H({n:14, name:'火天大有', kana:'かてんたいゆう', tri:'離乾', theme:'賢人多し・盛大',
 k:'大有{たいゆう}は元{おお}いに亨{とお}る。|大有。元亨。',
 kn:'有は無かった物が出来る、富む、多い(毛伝「有、多也」)。大有は大なる者(陽＝賢人)が多いこと。人材は得難い(論語「才難」、舜臣五人、武王乱臣十人)。柔が尊位を得て大いに中し、上下之に応ず。其の徳剛健にして文明。',
 d:'火{ひ}天上{てんじょう}に在{あ}るは大有{たいゆう}なり。君子{くんし}以{もっ}て悪{あく}を遏{とど}め善{ぜん}を揚{あ}げ、天{てん}に順{したが}い命{めい}を休{よ}くす。|象曰。火在天上大有。君子以遏惡揚善。順天休命。',
 dn:'太平の時は楽しみに流れやすい(互体兌)ので、悪を早く止め善を揚げる。九四は表面は君子の悪大臣(離の始め＝傷害)。',
 y:[
  ['初九','害{がい}に交{まじ}わる无{な}し。咎{とが}に匪{あら}ず。艱{なや}めば則{すなわ}ち咎{とが}无{な}し。|无交害。匪咎。艱則无咎。','悪大臣と交わらない。憎まれて苦しいが、艱難を覚悟すれば咎なし。'],
  ['九二','大車{たいしゃ}以{もっ}て載{の}す。往{ゆ}く攸{ところ}有{あ}り。咎{とが}无{な}し。|大車以載。有攸往。无咎。','天下の重責を一身に載せる大賢人。中に積みて敗れず。'],
  ['九三','公{こう}用{もっ}て天子{てんし}に亨{すす}む。小人{しょうじん}は克{あた}わず。|公用亨于天子。小人弗克。','九三の大臣が九二の賢人を天子に薦めようとするが、九四の小人が妨げる。小人は害あり。'],
  ['九四','其{そ}の尪{おう}に匪{あら}ず。咎{とが}无{な}し。|匪其尪。无咎。','尪は脛の曲がった不具＝行いの正しからぬこと。上下の弁を明らかにし、腰を折って賢人に下れ(明辯折也)。'],
  ['六五','厥{そ}の孚{まこと}交如{こうじょ}たり、威如{いじょ}たり。吉{きつ}。|厥孚交如。威如。吉。','天子の信義(互体兌の水が下に降る)で賢人と交わり、離の火＝威厳で狎れさせない。易にして備え无し、備えなくとも誰も犯さない。'],
  ['上九','天{てん}より之{これ}を祐{たす}く。吉{きつ}にして利{よろ}しからざる无{な}し。|自天祐之。吉无不利。','天が天子を祐ける。上九は位なき賢人で、天子が師道をもって待つ＝天に順う。繋辞「天の助くる所は順、人の助くる所は信」。']
 ],
 hint:'<ul><li>盛大・豊かな時。楽しみに流れやすいので悪を早く止める。</li><li>信と威を併せ持つ。</li><li>人材を得ることが最大の富。</li></ul>',
 ks:'九四「匪其彭」の「彭」は誤りで「尪」が正しい。象伝「明辯晢也」は「明辯折也」が正しい。',
 all:'柔順な天子のもとに多くの賢人が集まる盛大の卦。天の祐けは順と信に由る。'
});

H({n:15, name:'地山謙', kana:'ちざんけん', tri:'坤艮', theme:'へりくだり',
 k:'謙{けん}は亨{とお}る。君子{くんし}は終{お}わり有{あ}り。|謙。亨。君子有終。',
 kn:'謙は嗛(口に含む小さな物)、身を小さくして人の下に降る。下艮(山)上坤(地)＝平地の下に高山＝大功ある者が普通の人の下に身を引く。互体坎＝水は最も功労ありて最も低い。王莽の偽謙は続かず、君子は始めを変えず終わりを遂げる。天道は下済して光明、地道は卑くして上行。天道・地道・鬼神・人道すべてが盈を損して謙を益す。',
 d:'地中{ちちゅう}に山{やま}有{あ}るは謙{けん}なり。君子{くんし}以{もっ}て多{おお}きを裒{へ}らし寡{すく}なきを益{ま}し、物{もの}を称{はか}りて施{ほどこ}しを平{たい}らかにす。|象曰。地中有山謙。君子以裒多益寡。稱物平施。',
 dn:'多い所から取り、少ない所へ回し(米・材木など)、物を量って施しを公平にする。',
 y:[
  ['初六','謙謙{けんけん}たる君子{くんし}、用{もっ}て大川{たいせん}を渉{わた}る。吉{きつ}。|謙謙君子。用涉大川。吉。','山の麓、謙の上の謙。卑くして以て自ら牧う(自ら徳を養う)。'],
  ['六二','鳴謙{めいけん}す。貞{てい}にして吉{きつ}。|鳴謙。貞吉。','九三(労謙の君子)に応じて鳴く。中心より得たり、拵えた謙ではない。'],
  ['九三','労謙{ろうけん}す。君子{くんし}終{お}わり有{あ}り。吉{きつ}。|勞謙。君子有終。吉。','天下に功ありてなお謙る(坎＝労卦)。万民服す。'],
  ['六四','利{よろ}しからざる无{な}し。謙{けん}を撝{ふる}う。|无不利。撝謙。','大臣が手で招き(撝)下に降る。則に違わず(天の則＝天道下済)。'],
  ['六五','富{と}めりとせず其{そ}の鄰{となり}を以{もっ}てす。用{もっ}て侵伐{しんばつ}するに利{よろ}し。利{よろ}しからざる无{な}し。|不富以其鄰。利用侵伐。无不利。','天子が己を空しくし、九三や左右を用いる。服さぬを征す＝国内の乱を討つのであって外国侵略ではない。'],
  ['上六','鳴謙{めいけん}す。用{もっ}て師{いくさ}を行{や}り邑国{ゆうこく}を征{う}つに利{よろ}し。|鳴謙。利用行師。征邑國。','顧問の大臣がまだ足りぬと謙る。志未だ得ず、邑国の乱を征するのみ。']
 ],
 hint:'<ul><li>へりくだれば最後まで通る(君子有終)。</li><li>多い所から取って少ない所へ回す。</li><li>偽の謙遜は見抜かれて続かない。</li></ul>',
 ks:'',
 all:'六十四卦で唯一、六爻すべてが吉か无不利の卦。大功ある者が人の下に身を置く徳の卦(繋辞「謙は徳の柄」)。'
});

H({n:16, name:'雷地豫', kana:'らいちよ', tri:'震坤', theme:'予め備える・悦び',
 k:'豫{よ}は侯{きみ}を建{た}て師{いくさ}を行{や}るに利{よろ}し。|豫。利建侯行師。',
 kn:'豫は象の最大なもの(疑い深く物を害さない)。舒(ゆるやか)・序に通じ、順序を踏んで事が成り悦ぶ。また予め(繋辞「重門撃柝以待暴客」)。雷(震)が地(坤)から奮い出る旧三月、万物の芽・花＝悦び。震は帝出乎震＝君、長子帥師。天地は順を以て動く故に日月過たず四時忒わず、聖人は順を以て動けば刑罰清くして民服す。豫の時義大いなるかな＝国家無事の時こそ学問道徳を正せ。',
 d:'雷{かみなり}地{ち}より出{い}でて奮{ふる}うは豫{よ}なり。先王{せんのう}以{もっ}て楽{がく}を作{な}し徳{とく}を崇{たっと}び、殷{さか}んに之{これ}を上帝{じょうてい}に薦{すす}め、以{もっ}て祖考{そこう}を配{はい}す。|象曰。雷出地奮豫。先王以作樂崇德。殷薦之上帝。以配祖考。',
 dn:'音楽は豫卦に則って作られた。徳を歌にして奏し、上帝の祭りに祖考を配祀する。殷は盛大。',
 y:[
  ['初六','鳴豫{めいよ}す。凶{きょう}。|鳴豫。凶。','九四に応じ、自分で楽しまず人にすがって鳴く。志窮まりて凶。'],
  ['六二','介{かた}きこと石{いし}の于{ごと}し。日{ひ}を終{お}えず。貞{てい}にして吉{きつ}。|介于石。不終日。貞吉。','石のように分を守って九四に諂わず、動く時は雷のごとく即日決断する(互体艮→震)。繋辞下「幾を知るは其れ神か…君子は幾を見て作ち、日を終うるを俟たず」。中正を以てなり。'],
  ['六三','盱豫{くよ}す。悔{く}ゆ。遅{おそ}ければ悔{くい}有{あ}り。|盱豫。悔。遲有悔。','盱は目を見開き上ばかり見る＝九四に媚びる。後悔は早いほどよい。'],
  ['九四','由豫{ゆうよ}す。大{おお}いに得{う}る有{あ}り。疑{うたが}う勿{なか}れ。朋{とも}盍{あ}い簪{あつ}まる。|由豫。大有得。勿疑。朋盍簪。','天下がこの大臣に由って安楽。力が盛んで疑われる(周公旦)が、朋が自然に集まったので求めたのではない。簪は一本で多くの髪を束ねる。志大いに行わる。'],
  ['六五','貞{てい}にして疾{やまい}あり。恒{つね}にして死{し}せず。|貞疾。恆不死。','天子が九四に天下の力を握られ不快。しかし震は生々で死なない。中未だ亡びず。'],
  ['上六','冥豫{めいよ}す。成{な}るも渝{か}わる有{あ}れば咎{とが}无{な}し。|冥豫。成有渝。无咎。','豫の極、安楽に耽り酒浸り。改めれば咎なし、何ぞ長かるべけんや。']
 ],
 hint:'<ul><li>備えあれば悦び。事前準備・段取りの時。</li><li>権勢ある人に諂わず、動く時は即決する。</li><li>安楽に耽るな。耽っても改めれば咎なし。</li></ul>',
 ks:'',
 all:'雷が地から奮い出る悦びの卦。六二の「石の如く、日を終えず」は根本が繋辞下で特に力説する「知幾」の手本。'
});
H({n:17, name:'沢雷随', kana:'たくらいずい', tri:'兌震', theme:'時に随う',
 k:'随{ずい}は元{おお}いに亨{とお}る、貞{ただ}しきに利{よろ}し。咎{とが}无{な}し。|隨。元亨利貞。无咎。',
 kn:'随は前の人の後ろに付いて行く(従は左右にも付く)。初から二、三…と前(上)に随う。随うにも元亨利貞(仁義礼智)が必要で、さもなくば咎。剛来たりて柔に下り、動きて説ぶ。随時の義大いなるかな(互体艮＝時)。',
 d:'沢中{たくちゅう}に雷{かみなり}有{あ}るは随{ずい}なり。君子{くんし}以{もっ}て晦{くれ}に嚮{むか}えば入{い}りて宴息{えんそく}す。|象曰。澤中有雷隨。君子以嚮晦入宴息。',
 dn:'雷は二月に出て八月には沢に潜む＝時に随う。日が暮れれば奥座敷で休息する。',
 y:[
  ['初九','官{かん}渝{かわ}ること有{あ}り。貞{てい}にして吉{きつ}。門{もん}を出{い}でて交{まじ}われば功{こう}有{あ}り。|官有渝。貞吉。出門交有功。','震は司る＝官。職分を守りつつ時に応じて変わる。互体艮＝門、門を出て六二と交われ。'],
  ['六二','小子{しょうし}に係{かか}りて丈夫{じょうふ}を失{うしな}う。|係小子。失丈夫。','六三(小子)に係って初九(丈夫＝震の長男)を失う。兼ね与せざるなり。'],
  ['六三','丈夫{じょうふ}に係{かか}りて小子{しょうし}を失{うしな}う。随{したが}いて求{もと}むる有{あ}れば得{う}。貞{てい}に居{お}るに利{よろ}し。|係丈夫。失小子。隨有求得。利居貞。','九四の大臣に係って六二を失う。求めれば得るが、求めず貞に居れ。志、下を舎つ。'],
  ['九四','随{したが}いて獲{う}る有{あ}り。貞{てい}なれども凶{きょう}。孚{まこと}有{あ}りて道{みち}に在{あ}り、以{もっ}て明{あき}らかなれば何{なん}の咎{とが}かあらん。|隨有獲。貞凶。有孚在道以明。何咎。','天子に随う大臣が天下の人心を獲る。権力が盛んで疑われて凶。しかし孚あり、道に在って明らかにすれば咎なく、天子と共に功が顕れる。'],
  ['九五','嘉{か}に孚{まこと}あり。吉{きつ}。|孚于嘉。吉。','嘉＝美き大臣(九四)。君臣相互に孚あり。位正中なり。'],
  ['上六','之{これ}を拘係{こうけい}し、乃{すなわ}ち従{したが}いて之{これ}を維{つな}ぐ。王{おう}用{もっ}て西山{せいざん}に亨{まつ}る。|拘係之。乃從維之。王用亨于西山。','山沢に遁れたい道徳高い大臣を、天子が縄で繋ぎ四方から維ぐ。西山(兌＝西、互体艮＝山)でこの大臣に天を祀らせる。上窮まるなり。']
 ],
 hint:'<ul><li>誰に随うかを誤るな。正しい相手に随えば吉。</li><li>時に随う。日が暮れたら休む。</li><li>力をつけすぎた補佐役は疑われる。誠と明で免れる。</li></ul>',
 ks:'',
 all:'後に付いて行く道。随うにも正しさが要り、時に随うことが肝要。'
});

H({n:18, name:'山風蠱', kana:'さんぷうこ', tri:'艮巽', theme:'父の事を継ぎ改める',
 k:'蠱{こ}は元{おお}いに亨{とお}る。大川{たいせん}を渉{わた}るに利{よろ}し。甲{こう}に先{さき}だつこと三日{みっか}、甲{こう}に後{おく}るること三日{みっか}。|蠱。元亨。利涉大川。先甲三日。後甲三日。',
 kn:'先帝の晩年に政に垢がつき佞人が出て敗壊、崩御後に皇太子が即位して大改革し、天下を新たにする卦。蠱は古い米が腐って粉となり飛ぶ虫(左伝昭元「穀之飛亦為蠱」)。互体震(三〜五)は木・長子＝皇太子。甲乙は木＝震、甲は十干の始め＝新たに始める。上九は父の終わり(艮＝宗廟)、初六は子の始まり(巽＝陰の始め)。命令を甲の日に下す前後三日をよく考え調べる。武王の牧野の戦いも甲子の日。巽いて止まる(姑息に手を出さず止まる)から蠱が生じる。',
 d:'山下{さんか}に風{かぜ}有{あ}るは蠱{こ}なり。君子{くんし}以{もっ}て民{たみ}を振{ふる}い徳{とく}を育{やしな}う。|象曰。山下有風蠱。君子以振民育德。',
 dn:'旧九月、山下から風が吹いて古い葉を落とす(互体兌＝秋、震＝新芽)。民の垢を振り落とし性の徳を育てる＝大学の「民を新たにす」。',
 y:[
  ['初六','父{ちち}の蠱{こ}を幹{ただ}す。子{こ}有{あ}れば考{ちち}咎{とが}无{な}し。厲{あやう}けれども終{つい}に吉{きつ}。|幹父之蠱。有子考无咎。厲終吉。','幹は木の幹、事を身に引き受け司る。子が父の失政を改め、亡き父(考)に咎を負わせない(大戴礼「国人称願然曰、幸哉有子」)。大臣替えなど困難だが終に吉。親が生きていても改めたはずのこと(意、考を承く)。'],
  ['九二','母{はは}の蠱{こ}を幹{ただ}す。貞{てい}にす可{べ}からず。|幹母之蠱。不可貞。','皇太后の摂政の弊を改める。母は存命なので厳しくし過ぎず程好く。中道を得。'],
  ['九三','父{ちち}の蠱{こ}を幹{ただ}す。小{すこ}しく悔{くい}有{あ}り。大{おお}いなる咎{とが}无{な}し。|幹父之蠱。小有悔。无大咎。','剛で激しく改め過ぎて少し後悔、終に咎なし。'],
  ['六四','父{ちち}の蠱{こ}を裕{ゆる}やかにす。往{ゆ}けば吝{りん}を見{み}る。|裕父之蠱。往見吝。','柔弱で父の過ちを寛くし改めるに忍びない→過ちを増す。'],
  ['六五','父{ちち}の蠱{こ}を幹{ただ}す。用{もっ}て誉{ほま}れあり。|幹父之蠱。用譽。','即位した皇太子が九二の賢人を挙げて改め、誉れを得る。承くるに徳を以てす。'],
  ['上九','王侯{おうこう}に事{つか}えず。其{そ}の事{こと}を高尚{こうしょう}にす。|不事王侯。高尚其事。','官に出ず道徳を高くして風俗を振起する隠者(艮＝山・高、巽＝潔)。志則るべし。']
 ],
 hint:'<ul><li>古い弊害を改める時。姑息に止まれば腐る。</li><li>改革・新規着手は前後三日をよく考える。</li><li>親や前任者の失策を子・後任が償う。母方の弊は穏やかに。</li></ul>',
 ks:'先甲三日後甲三日は十七家の注に定説がない箇所で、上九＝父の終わり・初六＝子の始まりとして解く。大象を「新民」と読む朱子の読みは不可。',
 all:'皇統一系のもとで、父の失政を子が継いで改める卦。巽の「先庚後庚」(根本は改めず弊だけ除く)と対をなす。'
});

H({n:19, name:'地沢臨', kana:'ちたくりん', tri:'坤兌', theme:'天子が民に臨む',
 k:'臨{りん}は元{おお}いに亨{とお}る、貞{ただ}しきに利{よろ}し。八月{はちがつ}に至{いた}りて凶{きょう}有{あ}り。|臨。元亨利貞。至于八月有凶。',
 kn:'上坤(岸)下兌(沢)、高所から下の水に臨む。臨は高所から下を見る(望は遠くから見る)。天子が万民に臨み、元亨利貞(仁義礼智)で成育する。二陽が進む十二月の卦。八月に凶有りとは、臨から数えて八か月目(臨→泰→大壮→夬→乾→姤→遯→否)で天地否＝大乱に至る。盛んな時こそ戒めよ。',
 d:'沢上{たくじょう}に地{ち}有{あ}るは臨{りん}なり。君子{くんし}以{もっ}て教思{きょうし}窮{きわ}まり无{な}く、民{たみ}を容保{ようほ}すること疆{かぎ}り无{な}し。|象曰。澤上有地臨。君子以教思无窮。容保民无疆。',
 dn:'兌の水の深さのように深く考えて教え、坤の広さで民を容れて長く保つ。',
 y:[
  ['初九','咸{みな}臨{のぞ}む。貞{てい}にして吉{きつ}。|咸臨。貞吉。','陽をもって陰に臨み、その正しさに人が感ずる。志正を行う。'],
  ['九二','咸{みな}臨{のぞ}む。吉{きつ}にして利{よろ}しからざる无{な}し。|咸臨。吉无不利。','中庸の徳で臨む。未だ命に順わず＝盛衰は天命でも、人の徳で衰えさせない。'],
  ['六三','甘{あま}く臨{のぞ}む。利{よろ}しき攸{ところ}无{な}し。既{すで}に之{これ}を憂{うれ}うれば咎{とが}无{な}し。|甘臨。无攸利。既憂之。无咎。','兌の主＝巧言令色で出世した者。気づいて憂えれば咎なし。'],
  ['六四','至{いた}りて臨{のぞ}む。咎{とが}无{な}し。|至臨。无咎。','至は摯(ねんごろ)、心底親切な大臣。位当たる。'],
  ['六五','知{ち}もて臨{のぞ}む。大君{たいくん}の宜{よろ}しきなり。吉{きつ}。|知臨。大君之宜。吉。','人を知る(九二の賢人を知り用いる)のが天子第一の徳、堯舜もこれを難しとした。中を行うの謂なり。'],
  ['上六','敦{あつ}く臨{のぞ}む。吉{きつ}にして咎{とが}无{な}し。|敦臨。吉无咎。','厚の上の厚。志は内(六五天子)に在り。']
 ],
 hint:'<ul><li>上に立つ・監督・指導の時。人を知って用いる。</li><li>盛りの今こそ八か月先の衰えに備える。</li><li>甘言で臨む者は利なし。</li></ul>',
 ks:'',
 all:'天子が万民に臨む成育の卦。「八月に凶有り」で盛衰の転換を予告する。'
});

H({n:20, name:'風地観', kana:'ふうちかん', tri:'巽坤', theme:'観る・観せる',
 k:'観{かん}は盥{てあら}いて薦{すす}めず。孚{まこと}有{あ}りて顒若{ぎょうじゃく}たり。|觀。盥而不薦。有孚顒若。',
 kn:'観は高所から広く四方を見渡す(闕・観＝門の楼)。穀梁伝「常事曰視、非常曰観」。上の二陽＝明、天子の聡明が日月のように四方に及ぶ。諸侯来朝の際、手を洗い(巽＝潔)鬱鬯(香気＝誠)の酒を賜うのみで料理は出さない＝誠を尚ぶ。顒若は天子の厳然たる容儀を仰ぐこと。聖人は神道を以て教えを設け天下服す(神＝引き出すもの、説文。日本の神道のことではない)。',
 d:'風{かぜ}地上{ちじょう}を行{ゆ}くは観{かん}なり。先王{せんのう}以{もっ}て方{ほう}を省{かえり}み民{たみ}を観{み}て教{おし}えを設{もう}く。|象曰。風行地上觀。先王以省方觀民設教。',
 dn:'巡狩(春東・夏南・秋西・冬北)で、表面の飾りでなく内幕(民の辛苦、役人の適否、風俗)まで省察して教えを設ける。',
 y:[
  ['初六','童観{どうかん}す。小人{しょうじん}は咎{とが}无{な}く、君子{くんし}は吝{りん}。|童觀。小人无咎。君子吝。','全体が大きな艮＝少男、外面しか見えない子供の観方。下賤の者なら咎なし、君子なら恥。'],
  ['六二','闚{うかが}い観{み}る。女{おんな}の貞{てい}に利{よろ}し。|闚觀。利女貞。','門の隙から覗く＝女の正しい在り方、男子なら醜い。'],
  ['六三','我{わ}が生{せい}を観{み}て進退{しんたい}す。|觀我生進退。','我＝九五天子。天子の行いを観て、徳あれば出仕し、なければ退く。未だ道を失わず。'],
  ['六四','国{くに}の光{ひかり}を観{み}る。用{もっ}て王{おう}に賓{ひん}たるに利{よろ}し。|觀國之光。利用賓于王。','来朝した諸侯が文物の盛(巽＝斉う)を観て感ずる。正しい諸侯を天子が賓客として尚ぶ。'],
  ['九五','我{わ}が生{せい}を観{み}る。君子{くんし}なれば咎{とが}无{な}し。|觀我生。君子无咎。','天子が自らの行いを省みる＝民を観る(巡狩して民が悦び服しているか)。'],
  ['上九','其{そ}の生{せい}を観{み}る。君子{くんし}なれば咎{とが}无{な}し。|觀其生。君子无咎。','天子の師・顧問の賢人が天子の行いを見て輔ける。志未だ平らかならず＝まだ足りぬと安心しない忠。']
 ],
 hint:'<ul><li>よく観察せよ。表面だけでなく内情まで。</li><li>自分の行いが人にどう見えているかを省みる。</li><li>形式より誠(盥いて薦めず)。</li></ul>',
 ks:'彖伝「聖人以神道設教」の神は説文「神者引出万物者也」の神であり、日本の神道のことではない。古本には「以」の字がない。',
 all:'天子が観られ、また天下を観る卦。誠と容儀で民を化す。'
});

H({n:21, name:'火雷噬嗑', kana:'からいぜいこう', tri:'離震', theme:'噛み砕く・刑獄',
 k:'噬嗑{ぜいこう}は亨{とお}る。獄{ごく}を用{もち}うるに利{よろ}し。|噬嗑。亨。利用獄。',
 kn:'噬んで嗑う。頤(口)の中に物(九四＝硬い骨)がある＝上下の間を妨げる悪人。これを噛み砕いて初めて上下が合い亨る。雷(震)が動けば火(離＝電)が発し毒物を砕く。柔中を得て上行す、位当たらずと雖も獄を用うるに利し＝刑獄は柔順寛大な天子がよい。',
 d:'雷電{らいでん}は噬嗑{ぜいこう}なり。先王{せんのう}以{もっ}て罰{ばつ}を明{あき}らかにし法{ほう}を勅{ととの}う。|象曰。雷電噬嗑。先王以明罰勅法。',
 dn:'明罰は離、勅法は坎(互体)。',
 y:[
  ['初九','校{かせ}を屨{は}きて趾{あし}を滅{やぶ}る。咎{とが}无{な}し。|屨校滅趾。无咎。','初犯の少年(艮＝少男)。足(震)に枷(艮＝止)をはめ足が見えない→再び悪を行わない。小懲大誡は小人の福(繋辞下)。'],
  ['六二','膚{はだえ}を噬{か}みて鼻{はな}を滅{やぶ}る。咎{とが}无{な}し。|噬膚滅鼻。无咎。','取調べ役人が中正仁徳、罪人が感じて易く自白する＝柔らかい膚を噛む。剛情な悪人を柔で服す。'],
  ['六三','腊肉{せきにく}を噬{か}みて毒{どく}に遇{あ}う。小{すこ}しく吝{りん}。咎{とが}无{な}し。|噬腊肉遇毒。小吝。无咎。','何度も調べを受けた古狸の罪人(古い乾肉)に罵られる。判事長の徳が足りない。'],
  ['九四','乾胏{かんし}を噬{か}みて金矢{きんし}を得{う}。艱貞{かんてい}に利{よろ}し。吉{きつ}。|噬乾胏。得金矢。利艱貞。吉。','司法大臣。骨付きの乾肉＝難事件。金矢＝矢の根＝直、罪人が真っ直ぐ白状する。重罪は慎重に。未だ光いならず(周公・召公ほどの徳でない)。'],
  ['六五','乾肉{かんにく}を噬{か}みて黄金{おうごん}を得{う}。貞{てい}なれば厲{あやう}けれども咎{とが}无{な}し。|噬乾肉。得黃金。貞厲。无咎。','天子自ら外朝で重罪人を問う(人一人殺すのは重大、再三活路を問う)。黄は中。'],
  ['上九','校{かせ}を何{にな}いて耳{みみ}を滅{やぶ}る。凶{きょう}。|何校滅耳。凶。','累犯、首枷で耳が隠れる。獄中で教誨しても聴かない(聡明ならず)→死刑。何＝荷。']
 ],
 hint:'<ul><li>間に障害(人・物)がある。取り除けば通じる。</li><li>裁判・取調べ・懲戒。初犯は軽く、累犯は重く。</li><li>難事件は慎重に。真っ直ぐな証言を得る。</li></ul>',
 ks:'大象を「電雷」に改める朱子派の説は誤り(泰の「天地交」と同じで、雷気が本で電がそれから発する)。',
 all:'口中の骨を噛み砕いて上下を合わせる刑獄の卦。初九と上九は繋辞下で孔子が小人の懲戒として論じる。'
});

H({n:22, name:'山火賁', kana:'さんかひ', tri:'艮離', theme:'飾り・文明の節度',
 k:'賁{ひ}は亨{とお}る。小{すこ}しく往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。|賁。亨。小利有攸往。',
 kn:'賁は飾り(貝＋卉。貝は古の貨幣で美しい模様、草で包んで光を隠す)。中庸「錦を衣て絅を尚う、其の文の著わるるを悪むなり」。下離(文明)を上艮で止める＝文明が過ぎれば奢侈になるので程好く止めて亨る。柔来たりて剛を文り(坤から二に陰が来て離)、剛を分けて上りて柔を文る。天文(日月星辰)を観て時変を察し、人文(礼儀三百、威儀三千)を観て天下を化成す。',
 d:'山下{さんか}に火{ひ}有{あ}るは賁{ひ}なり。君子{くんし}以{もっ}て庶政{しょせい}を明{あき}らかにし、敢{あ}えて獄{ごく}を折{さだ}むること无{な}し。|象曰。山下有火賁。君子以明庶政。无敢折獄。',
 dn:'火が山の草木を照らす。庶政は文明に、刑獄は明らかにし過ぎず、現れた分だけを裁く。',
 y:[
  ['初九','其{そ}の趾{あし}を賁{かざ}る。車{くるま}を舎{す}てて徒{かち}す。|賁其趾。舍車而徒。','六四の大臣が車で招くが、奢侈の世を悪んで乗らず徒歩で行く＝質素を名誉とする。義として乗らず。'],
  ['六二','其{そ}の須{ひげ}を賁{かざ}る。|賁其須。','互体震と合わせて山雷頤の象、頤の須(ひげ)。上と興る＝九三と共に文明を盛んに。'],
  ['九三','賁如{ひじょ}たり濡如{じゅじょ}たり。永貞{えいてい}なれば吉{きつ}。|賁如濡如。永貞吉。','文明の極、濡れたような艶。礼儀の卦、身が尊くとも下に居れば凌ぐ者なし。'],
  ['六四','賁如{ひじょ}たり皤如{はじょ}たり。白馬{はくば}翰如{かんじょ}たり。寇{あだ}するに匪{あら}ず婚媾{こんこう}せんとす。|賁如皤如。白馬翰如。匪寇婚媾。','大臣が文明の過ぎを止めようと自ら飾りを去って白(皤)を着、白馬(翰)で初九の賢人を訪ねる。奢りの世では大臣の暮らしが天子と紛らわしくなる(位に当たりて疑わる)。終に尤无し。'],
  ['六五','丘園{きゅうえん}に賁{かざ}る。束帛{そくはく}戔戔{せんせん}たり。吝{りん}なれども終{つい}に吉{きつ}。|賁于丘園。束帛戔戔。吝終吉。','丘園に隠れた上九の大賢人に、わずかな束帛(五匹＝玄三黄二)を贈る。盛んな贈物はかえって賢人が悪む。協力して奢侈の風俗を改める。喜び有り。'],
  ['上九','白賁{はくひ}なれば咎{とが}无{な}し。|白賁。无咎。','世が錦を着る中で白布を着る賢人。上、志を得。']
 ],
 hint:'<ul><li>見た目・形式は大切だが、飾りすぎは害。</li><li>最後は白(飾りなし)に帰る。</li><li>賢人には質素な礼を。</li></ul>',
 ks:'',
 all:'文明を艮で程好く止める飾りの卦。六四・六五・上九で飾りを去って白に帰る道を示す。'
});

H({n:23, name:'山地剥', kana:'さんちはく', tri:'艮坤', theme:'小人が君子を剥ぐ',
 k:'剥{はく}は往{ゆ}く攸{ところ}有{あ}るに利{よろ}しからず。|剝。不利有攸往。',
 kn:'剥は刀で剥ぎ取る。小人が君子を段々と剥いで害す。五陰一陽の九月の卦。柔が剛を変ず(乾の五月の一陰から次第に)。順にして之に止まるは象を観るなり＝易六十四卦で「観象」と断るのはこの卦だけ。天下が小人でも天道に順って止まり動かない。君子は消息盈虚を尚ぶ、天の行なり＝陽の回復を待ち身を全うせよ。',
 d:'山{やま}地{ち}に附{つ}くは剥{はく}なり。上{かみ}以{もっ}て下{しも}を厚{あつ}くし宅{たく}を安{やす}んず。|象曰。山附於地剝。上以厚下安宅。',
 dn:'九月、草木が枯れて山が地に附く姿が見える。山は天子、地は人民。地が厚ければ山は崩れない＝民を富ませ下を厚くすれば天子の宅も安泰。',
 y:[
  ['初六','牀{しょう}を剥{は}ぐに足{あし}を以{もっ}てす。貞{てい}を蔑{ほろ}ぼす。凶{きょう}。|剝牀以足。蔑貞凶。','牀の足から剥ぐ。蔑は滅、正を滅ぼす始まり、下の民が滅びる。'],
  ['六二','牀{しょう}を剥{は}ぐに辨{べん}を以{もっ}てす。貞{てい}を蔑{ほろ}ぼす。凶{きょう}。|剝牀以辨。蔑貞凶。','辨は牀板の下の分かれ目。正しき者を助ける者がない(未だ与有らず)。'],
  ['六三','之{これ}を剥{は}ぐ。咎{とが}无{な}し。|剝之。无咎。','小人の中で唯一上九の君子に応じ、害さない。上下を失う＝上下の陰と絶つ。'],
  ['六四','牀{しょう}を剥{は}ぐに膚{はだえ}を以{もっ}てす。凶{きょう}。|剝牀以膚。凶。','牀の上の人の身に害が及ぶ。切に災に近し。'],
  ['六五','魚{うお}を貫{つらぬ}き、宮人{きゅうじん}を以{もっ}て寵{ちょう}せらる。利{よろ}しからざる无{な}し。|貫魚。以宮人寵。无不利。','魚＝陰(巽)が串刺しに連なる＝多くの小人。宮女のように寵愛するだけで政に関与させなければ害なし＝小人を御する道。終に尤无し。'],
  ['上九','碩果{せきか}食{くら}われず。君子{くんし}は輿{くるま}を得{え}、小人{しょうじん}は廬{いおり}を剥{は}ぐ。|碩果不食。君子得輿。小人剝廬。','大木の上に唯一残る大果、葉(陰)に隠れて食われない＝君子が小人の目を避け身を全うする。果は落ちて芽を出す＝道徳回復の種。天下が小人を悪み君子を車に載せて尊ぶ(民の載する所なり)。小人は自らの廬(艮＝家)を剥ぐ。小人は結局我が身も滅ぼすので、いつの世も用いてはならない。']
 ],
 hint:'<ul><li>衰運・剥落の時。進まず、止まって時を待つ。</li><li>下(民・部下・基盤)を厚くすれば上は安泰。</li><li>小人は寵しても政(実務の権限)に関わらせない。</li></ul>',
 ks:'「消息」の消は剥、息は復で、ともに陽について言う。消と息を陰陽に分ける俗説は誤り。上九は虞翻古本では「徳車」。',
 all:'小人が君子を下から剥ぐが、梢に残った一果(上九)が地に落ちて復の芽となる。'
});

H({n:24, name:'地雷復', kana:'ちらいふく', tri:'坤震', theme:'一陽来復・性善への立ち返り',
 k:'復{ふく}は亨{とお}る。出入{しゅつにゅう}疾{やまい}无{な}く、朋{とも}来{きた}りて咎{とが}无{な}し。其{そ}の道{みち}を反復{はんぷく}し、七日{なのか}にして来{き}たり復{かえ}る。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。|復。亨。出入无疾。朋來无咎。反復其道。七日來復。利有攸往。',
 kn:'剥で上に窮まった陽が地に落ちてまた芽を出す＝本の所へ反る。十一月、一陽来復の冬至。天の大徳は万物を生ずることで、その働きが立ち返った卦。初九が震(雷)の主で、雷が地中からだんだん進む。天の元気の出入(復で出て姤で入る)は天然自然で、何物も妨げられない(无疾)。陰が大勢いても撃ち払って進む＝小人がまだ多くても君子の勢いが盛んなので除き去るのに咎なし。七日来復は乾の五月に一陰が生じてから陽が一つずつ減り、七か月目にまた初爻に陽が来ること。復其見天地之心乎＝天地の心は万物を生ずる心、一陽が地底に帰った所にそれが見える。',
 d:'雷{かみなり}地中{ちちゅう}に在{あ}るは復{ふく}なり。先王{せんのう}以{もっ}て至日{しじつ}に関{せき}を閉{と}じ、商旅{しょうりょ}行{ゆ}かず、后{きみ}方{ほう}を省{かえり}みず。|象曰。雷在地中復。先王以至日閉關。商旅不行。后不省方。',
 dn:'復ったばかりの陽は、灯したての火のように弱く、騒げば消える。冬至の日は関所を閉じ、商人も旅人も足を止め、天子も北方への巡狩を罷めて、静かに陽気を育てる。',
 y:[
  ['初九','遠{とお}からずして復{かえ}る。悔{くい}に祇{いた}ること无{な}し。元吉{げんきつ}。|不遠復。无祇悔。元吉。','剥の上九の陽がすぐ初爻に反る。顔回のこと(繋辞下)：不善の考えが出たら、言葉にも行いにも出さないうちに悟って改め、再び行わない(論語「不弐過」の弐は過ちに過ちを副えること)。祇は甚だし(鄭注)。以て身を修むるなり。'],
  ['六二','休{よ}く復{かえ}る。吉{きつ}。|休復。吉。','震の木にもたれて休む象。初九(仁)に近接して良い朋友を得、共に仁に復る。以て仁に下るなり。顔回の「其の心三月仁に違わず」(天道は三か月で一つの事を成す)。'],
  ['六三','頻{しき}りに復{かえ}る。厲{あやう}けれども咎{とが}无{な}し。|頻復。厲无咎。','震の終わりで動きやすい。子路・子貢のように離れては復り、復っては離れる(日月に至るのみ)。それでも仁に復り続けるので義として咎なし。'],
  ['六四','中行{ちゅうこう}にして独{ひと}り復{かえ}る。|中行獨復。','六爻のうち初九に応ずるのは六四だけ。中庸の行い(大極の極＝中)ある初九に拠って独り道に復る。以て道に従うなり。'],
  ['六五','敦{あつ}く復{かえ}る。悔{くい}无{な}し。|敦復。无悔。','坤の上に坤が重なり至って厚く、中を得る。中以て自ら考す：考は「かんがえる」ではなく「成す」と読む。'],
  ['上六','復{かえ}るに迷{まよ}う。凶{きょう}。災眚{さいせい}有{あ}り。用{もっ}て師{いくさ}を行{や}れば終{つい}に大敗{たいはい}有{あ}り。其{そ}の国君{こっくん}に以{およ}んで凶{きょう}。十年{じゅうねん}に至{いた}るまで征{ゆ}く克{あた}わず。|迷復。凶。有災眚。用行師。終有大敗。以其國君凶。至于十年不克征。','陰の極は欲の極、欲に迷って復ることができない。最も欲深いのは兵を興して他国を奪おうとすること、大敗して国は疲弊し、十年(坤の数)経っても回復しない。君の道は民を育てることで、民を殺し国を疲弊させるのは君道に反く。']
 ],
 hint:'<ul><li>回復・再起の兆し。ただしまだ弱いので静かに育てる。</li><li>過ちはすぐ改める。言動に出る前に。</li><li>欲に迷って大きく打って出れば大敗、十年回復しない。</li></ul>',
 ks:'六五象伝「中以自考也」の考は「成す」と読む。祇は鄭注に従い「甚だし」。',
 all:'天地の心(万物を生ずる心)が見える卦。根本は「性の善への立ち返り」と読み、顔回の不弐過を初九の手本とする。'
});
H({n:25, name:'天雷无妄', kana:'てんらいむぼう', tri:'乾震', theme:'私欲なく天のままに',
 k:'无妄{むぼう}は元{おお}いに亨{とお}る、貞{ただ}しきに利{よろ}し。其{そ}れ正{せい}に匪{あら}ざれば眚{わざわい}有{あ}り。往{ゆ}く攸{ところ}有{あ}るに利{よろ}しからず。|无妄。元亨利貞。其匪正有眚。不利有攸往。',
 kn:'復で道心が立ち返れば妄(私欲)がなくなる。妄は望に通じ、願い求める心。史記春申君伝「毋望之福、毋望之禍」、戦国策は「无妄」と書く。人の心には人心と道心があり、无妄は誠の方へ凝り固まること。ただし盗賊のように悪へ凝り固まることもあるので「其れ正に匪ざれば眚有り」。彖：剛外より来たりて内に主となる(天山遯の三の陽が初へ来て震の主となる)。動きて健、剛中にして応ず。五から三の互体巽＝命令、上は天＝天命。正しさから外れて他へ往けば天命が祐けない。',
 d:'天下{てんか}に雷{かみなり}行{ゆ}き、物{もの}ごとに无妄{むぼう}を与{くみ}す。先王{せんのう}以{もっ}て茂{つと}めて時{とき}に対{たい}し万物{ばんぶつ}を育{やしな}う。|象曰。天下雷行。物與无妄。先王以茂對時。育萬物。',
 dn:'与は挙＝皆。天の元気で生ずる万物は皆无妄である(「无妄を与う」と読むな)。茂は懋める。春夏秋冬の時に応じて農事に励み万物を育てる。',
 y:[
  ['初九','无妄{むぼう}なり。往{ゆ}けば吉{きつ}。|无妄。往吉。','一点の私もなく天道天理のままに進む。志を得るなり。'],
  ['六二','耕{たがや}さずして穫{か}り、菑{し}せずして畬{よ}す。則{すなわ}ち往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。|不耕穫。不菑畬。則利有攸往。','刈入れの利を見込んで耕すのではない。新田(菑、一年目は利なし)を拓くのも君民のため。義をもって行い、富を専らにしない(未だ富まず)。'],
  ['六三','无妄{むぼう}の災{わざわい}あり。或{あるい}は之{これ}が牛{うし}を繋{つな}ぐ。行人{こうじん}の得{う}るは邑人{ゆうじん}の災{わざわい}なり。|无妄之災。或繫之牛。行人之得。邑人之災。','巽(近利市三倍)の欲深い者が牛を多く飼い、貸して利を得ようとするが、繋いだ牛を旅人に盗まれる。望まぬ災い。世の中は願い求める通りにはいかない。'],
  ['九四','貞{てい}にす可{べ}し。咎{とが}无{な}し。|可貞。无咎。','初九と徳を同じくする。固く之を有するなり：之は仁。孟子「仁義礼智は外より我を鑠かすに非ず」＝仁義礼智は外から金を溶かすように入るのではなく、我にもともと有る。'],
  ['九五','无妄{むぼう}の疾{やまい}あり。薬{くすり}すること勿{なか}れ。喜{よろこ}び有{あ}り。|无妄之疾。勿藥有喜。','元来邪なき身に外から来た病は薬を飲むな、七日来復のように自然に治る。史記：趙簡子が五日人事不省、扁鵲は「三日を出でずして治る、薬を飲ませるな」と言い、果たして快復した。後世は薬で身を誤る者が多い。試む可からず。'],
  ['上九','无妄{むぼう}なれども行{ゆ}けば眚{わざわい}有{あ}り。利{よろ}しき攸{ところ}无{な}し。|无妄。行有眚。无攸利。','无妄の所から他へ行けば災い。窮まるの災なり。']
 ],
 hint:'<ul><li>私心なく自然に任せる。計画的な欲は思い通りにならない。</li><li>外から来た病・災難は騒がず自然に治る。</li><li>无妄の所(本分)から動くな。</li></ul>',
 ks:'「物与无妄」の与は挙(皆)。妄と望の通用を史記・戦国策で証する。',
 all:'復で性の善に立ち返った後の、私欲なく天のままに動く卦。望まぬ福も災も来るのが世の常。'
});

H({n:26, name:'山天大畜', kana:'さんてんたいちく', tri:'艮乾', theme:'君が賢を養う・学校',
 k:'大畜{たいちく}は貞{ただ}しきに利{よろ}し。家食{かしょく}せずして吉{きつ}。大川{たいせん}を渉{わた}るに利{よろ}し。|大畜。利貞。不家食吉。利涉大川。',
 kn:'小畜の対、君が臣を止め養う。上艮＝人の身体、その中に天(乾)＝天徳(仁義礼智)。学校で徳を育て、早く官に就き禄を求める心を止めて十分に学ばせる。学徳成れば必ず登用され家で食うことはない。賢人が多く朝廷にあれば難も越えられる。彖：剛健篤実輝光、日に其の徳を新たにす(乾＝剛健・日新、艮＝篤実・輝光)。剛上りて賢を尚ぶ。',
 d:'天{てん}山中{さんちゅう}に在{あ}るは大畜{たいちく}なり。君子{くんし}以{もっ}て多{おお}く前言{ぜんげん}往行{おうこう}を識{しる}し、以{もっ}て其{そ}の徳{とく}を畜{たくわ}う。|象曰。天在山中大畜。君子以多識前言往行。以畜其德。',
 dn:'山中に天の元気・水火の気が満ちて万物・金銀玉石を生ず。先人の言(震＝鳴る、兌＝口)と行い(震＝行)を多く識して(艮＝止める)徳を蓄える。',
 y:[
  ['初九','厲{あやう}きこと有{あ}り。已{や}むるに利{よろ}し。|有厲。利已。','乾の初＝潜龍、学が未熟で官を求めれば六四の大臣が怒る。已めよ。災を犯さず。古の学校は早く官に就くのを戒めた。'],
  ['九二','輿{くるま}輹{とこしばり}を説{と}く。|輿說輹。','中庸の徳あり、自ら車の輹を外して止まる。中にして尤无し。'],
  ['九三','良馬{りょうば}逐{お}う。艱貞{かんてい}に利{よろ}し。日{ひび}に輿衛{よえい}を閑{なら}う。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。|良馬逐。利艱貞。日閑輿衞。利有攸往。','乾の完成＝天徳成る、良馬で進む。毎日輿衛(天子の車の右に乗って守護する武芸)を習う＝文武兼備(礼楽射御書数)。上と志を合わす。'],
  ['六四','童牛{どうぎゅう}の牿{こう}。元吉{げんきつ}。|童牛之牿。元吉。','子牛の角に横木(牿)をつけ人を突かぬように＝子供の剛な性を幼少から程好く止める(学校)。喜び有り。'],
  ['六五','豶豕{ふんし}の牙{くい}。吉{きつ}。|豶豕之牙。吉。','去勢した猪(向こう見ずの性を止める)を杙(牙)に繋ぐ。国家の福となる賢人に育つ。慶び有り。'],
  ['上九','天{てん}の衢{く}を何{にな}う。亨{とお}る。|何天之衢。亨。','衢は四方八方からの要路。何は荷う、天を背に負う(荘子「背負青天」)＝大臣として天に代わり万民を成育する。道大いに行わる。']
 ],
 hint:'<ul><li>蓄える・学ぶ・力を溜める時。焦って出ない。</li><li>若い者の剛さは幼いうちに程好く矯める。</li><li>十分に蓄えれば大事業も越えられる。</li></ul>',
 ks:'九三「曰閑輿衛」は「日閑輿衛」が正しい(虞翻「離為日」)。',
 all:'君が賢人を学校で止め養い、徳が満ちてから登用する卦。上九で天を背負って万民を養う。'
});

H({n:27, name:'山雷頤', kana:'さんらいい', tri:'艮震', theme:'養い・正しい糧',
 k:'頤{い}は貞{てい}にして吉{きつ}。頤{い}を観{み}て、自{みずか}ら口実{こうじつ}を求{もと}む。|頤。貞吉。觀頤。自求口實。',
 kn:'頤はおとがい。上艮(止＝上顎は動かない)、下震(動＝下顎が上がる)、中の四陰は歯。養うこと、飲食。正しい手段で養えば吉(禄も正しく)。頤を観る＝自分の養うものの正不正を見よ(全体に大きな離＝明)。養には身と徳の二つがある。彖：天地は万物を養い、聖人は賢を養いて以て万民に及ぼす(賢に大禄を与え、賢の力で民を養う)。論語郷党「割正しからざれば食わず」。',
 d:'山下{さんか}に雷{かみなり}有{あ}るは頤{い}なり。君子{くんし}以{もっ}て言語{げんご}を慎{つつし}み、飲食{いんしょく}を節{せっ}す。|象曰。山下有雷頤。君子以愼言語。節飲食。',
 dn:'言語を慎んで徳を養い(言う前に考え直す)、飲食を節して身を養う。',
 y:[
  ['初九','爾{なんじ}の霊亀{れいき}を舎{す}て、我{われ}を観{み}て頤{おとがい}を朶{た}る。凶{きょう}。|舍爾靈龜。觀我朶頤。凶。','上九(大臣)が初九に言う。霊亀(離＝亀、外堅中虚＝心の神霊)を捨て、我が富貴を見て顎を垂らし口を開けて食を求めるのは凶。亦貴ぶに足らず(孟子「飲食の人は則ち人之を賤しむ」)。'],
  ['六二','顛{いただき}に頤{やしな}われんとし、経{つね}に払{もと}る。丘{おか}に頤{やしな}われんとして征{ゆ}けば凶{きょう}。|顛頤。拂經。于丘頤征凶。','天子(六五)でなく上九(顛＝山頂)に養われる＝臣の常道(経)に払る。丘は土の集まる所。行いて類を失う(類＝六五)。'],
  ['六三','頤{やしない}に払{もと}る。貞{てい}なれども凶{きょう}。十年{じゅうねん}用{もち}うる勿{なか}れ。利{よろ}しき攸{ところ}无{な}し。|拂頤。貞凶。十年勿用。无攸利。','上九に応じ、大臣の専権を輔ける張本人。道大いに悖る。'],
  ['六四','顛{いただき}に頤{やしな}わる。吉{きつ}。虎視{こし}眈眈{たんたん}、其{そ}の欲{よく}逐逐{ちくちく}たり。咎{とが}无{な}し。|顛頤。吉。虎視眈眈。其欲逐逐。无咎。','同じく上九に養われるが柔順な大臣。初九の草莽の賢人を、虎が獲物を狙うように求め続ける。上の施し光いなり。'],
  ['六五','経{つね}に払{もと}る。貞{てい}に居{お}れば吉{きつ}。大川{たいせん}を渉{わた}る可{べ}からず。|拂經。居貞吉。不可涉大川。','君臣の常道に払るが、柔順に貞に居れば吉。天下の人心が上九にあるので危険は越えられない。順にして以て上に従う。'],
  ['上九','由{よ}りて頤{やしな}わる。厲{あやう}けれども吉{きつ}。大川{たいせん}を渉{わた}るに利{よろ}し。|由頤。厲吉。利涉大川。','天下が上九に由って養われる。権力大きく疑われて厲うが吉。大いに慶び有り。周公旦の如し(天下は成王あるを知らず周公に服す)。']
 ],
 hint:'<ul><li>何で自分が養われているか(収入源)の正邪を見る。</li><li>言葉を慎み、飲食を節する。</li><li>他人の富を羨んで自分の宝(心の霊)を捨てるな。</li></ul>',
 ks:'',
 all:'身と徳を養う卦。大臣(上九)が天下を養う形で、周公旦を想定する。'
});

H({n:28, name:'沢風大過', kana:'たくふうたいか', tri:'兌巽', theme:'陽の過剰・棟が撓む',
 k:'大過{たいか}は棟{むなぎ}橈{たわ}む。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。亨{とお}る。|大過。棟橈。利有攸往。亨。',
 kn:'陽(大)が四つで過ぎる。巽は陰木(楊・柳)、震は陽木。棟(大材)が重く下の支え(柱)が弱ければ棟が撓む。上が大事業・宮室・戦を好み奢れば、民(本＝農も末＝商も)が弱る。全体が大きな坎＝天下が水＝小人の世で、水を渡る橋梁(棟梁)の象。危険でも民を救うため進め。剛過ぎて中す＝柔弱に流れた世の病は、剛に過ぎるくらいで丁度中を得る。論語「我に数年を加え、五十にして以て易を学べば、以て大過无かるべし」＝孔子は剛に過ぎるのを憂えた(聖賢豪傑は皆剛)。',
 d:'沢{たく}木{き}を滅{ほろ}ぼすは大過{たいか}なり。君子{くんし}以{もっ}て独立{どくりつ}して懼{おそ}れず、世{よ}を遯{のが}れて悶{もだ}ゆること无{な}し。|象曰。澤滅木大過。君子以獨立不懼。遯世无悶。',
 dn:'水を好む楊も水に没すれば枯れる。天下小人の中で独り立って懼れず、世を遁れても悶えない＝剛に過ぎてよい所。',
 y:[
  ['初六','藉{し}くに白茅{はくぼう}を用{もち}う。咎{とが}无{な}し。|藉用白茅。无咎。','貴い物(互体乾)を地に直に置かず白茅(巽＝潔白・草)を敷く。慎み深ければ咎なし(繋辞上で孔子が「慎みの至り」と賞する)。'],
  ['九二','枯楊{こよう}稊{ひこばえ}を生{しょう}じ、老夫{ろうふ}其{そ}の女妻{じょさい}を得{う}。利{よろ}しからざる无{な}し。|枯楊生稊。老夫得其女妻。无不利。','根が水中で生きる楊は根から新芽が出る。年老いた国の重臣が若い助け(初六)を得る。過ぎて以て相与す。'],
  ['九三','棟{むなぎ}橈{たわ}む。凶{きょう}。|棟橈。凶。','巽の上＝大臣＝国家の棟、輔ける者なく傾く。以て輔け有る可からず。'],
  ['九四','棟{むなぎ}隆{たか}し。吉{きつ}。它{た}有{あ}れば吝{りん}。|棟隆。吉。有它吝。','初六(潔白な賢人)に応じて棟が高く傾かない。他に心を移せば吝。'],
  ['九五','枯楊{こよう}華{はな}を生{しょう}じ、老婦{ろうふ}其{そ}の士夫{しふ}を得{う}。咎{とが}无{な}く誉{ほまれ}无{な}し。|枯楊生華。老婦得其士夫。无咎无譽。','若い天子(九五)が年老いた小人の大臣(上六＝老婦)に籠絡される。枯れかけの楊に一時花が咲くような姑息の政。何ぞ久しかる可けん、亦醜ず可し。'],
  ['上六','過{す}ぎて渉{わた}りて頂{いただき}を滅{ぼっ}す。凶{きょう}なれども咎{とが}无{な}し。|過涉滅頂。凶。无咎。','舟を待たず水に踏み込み、国家のために命を落とす。咎む可からず＝暴虎馮河と咎めてはならない。']
 ],
 hint:'<ul><li>荷が重すぎる・過剰・無理がかかっている。支えを得よ。</li><li>独り立って懼れず、世に容れられなくても悶えない。</li><li>慎み(白茅)があれば咎なし。</li></ul>',
 ks:'',
 all:'陽が過ぎて棟が撓む非常の卦。非常の時には剛に過ぎるくらいが中を得るという、根本らしい読み。'
});

H({n:29, name:'坎為水', kana:'かんいすい', tri:'坎坎', theme:'重なる険難・精神は動かず',
 k:'習坎{しゅうかん}は孚{まこと}有{あ}り。維{こ}れ心{こころ}亨{とお}る。行{ゆ}けば尚{たっと}ばるる有{あ}り。|習坎。有孚。維心亨。行有尚。',
 kn:'習は重ねる、険難の上に険難。孚は潮の満ち干・月の満ち欠けの信。維れ心亨る＝身が危険に陥り斃れても、心(精神)だけは通じて動かない(荘子の神人が火に焼けず水に濡れないのは精神)。行けば死後も人に尚ばれる。水流れて盈たず(流れれば溢れない)、険を行きて其の信を失わず(石に砕け屈曲しても潮は時を違えない)。王公は険を設けて其の国を守る。険の時用大いなるかな＝危険な世こそ志ある者の働き所。坎は性、離は心。',
 d:'水{みず}洊{しき}りに至{いた}るは習坎{しゅうかん}なり。君子{くんし}以{もっ}て徳行{とっこう}を常{つね}にし、教事{きょうじ}を習{かさ}ぬ。|象曰。水洊至習坎。君子以常德行。習敎事。',
 dn:'洊は再、重なる。水が屈曲しても常を変えぬように徳行を常にし、教えの事を重ねて習わせる。',
 y:[
  ['初六','習坎{しゅうかん}して坎窞{かんたん}に入{い}る。凶{きょう}。|習坎。入于坎窞。凶。','水の一番底、穴に入って命を保てない。道を失いて凶。'],
  ['九二','坎{かん}に険{けん}有{あ}り。求{もと}めて小{すこ}しく得{う}。|坎有險。求小得。','賢人が険中にある。大きなことを求めず生命を全うすることだけ。未だ中を出でず。諸葛亮出師表「苟くも性命を乱世に全うし、聞達を諸侯に求めず」。'],
  ['六三','来{きた}るも之{ゆ}くも坎坎{かんかん}たり。険{けん}にして且{か}つ枕{ちん}す。坎窞{かんたん}に入{い}る。用{もち}うる勿{なか}れ。|來之坎坎。險且枕。入于坎窞。勿用。','進むも退くも険。枕(互体震＝木、艮＝止)に頼って安んじようと動けば却って深みに。終に功无し＝動くな。'],
  ['六四','樽酒{そんしゅ}簋貳{きじ}、缶{ほとぎ}を用{もち}う。約{やく}を納{い}るるに牖{まど}よりす。終{つい}に咎{とが}无{な}し。|樽酒簋貳。用缶。納約自牖。終无咎。','大臣と天子が密かに謀って天下の険を救う。天子が大臣の許に来ても樽酒と簋(飯)と缶の副え物だけの簡素さ。牖(窓)から＝君の了解しやすい所から簡約に申し上げる。正面から諫めても行われない。剛柔際わる(君臣の交わり)。'],
  ['九五','坎{かん}盈{み}たず。祇{すで}に平{たい}らかなるに既{いた}る。咎{とが}无{な}し。|坎不盈。祇既平。无咎。','険が消えて水が溢れず平らに。中未だ大ならず＝難が解けただけ。'],
  ['上六','係{つな}ぐに徽纆{きぼく}を用{もち}い、叢棘{そうきょく}に寘{お}く。三歳{さんさい}得{え}ず。凶{きょう}。|係用徽纆。寘于叢棘。三歲不得。凶。','天下を乱した悪大臣。縄で縛り叢棘(茨の垣で囲った獄)に三年、教訓しても改心せず殺す。']
 ],
 hint:'<ul><li>大難の時。大きなことを望まず身を全うする。</li><li>動けば深みにはまる。</li><li>上への進言は正面からでなく、分かりやすい所から簡約に。</li><li>身は窮しても志(精神)は曲げない。</li></ul>',
 ks:'',
 all:'険の上に険が重なる卦。身は陥っても精神は通じる(維心亨)、根本はここに易の核心を見る。'
});

H({n:30, name:'離為火', kana:'りいか', tri:'離離', theme:'麗く・明を継ぐ',
 k:'離{り}は貞{ただ}しきに利{よろ}し。亨{とお}る。牝牛{ひんぎゅう}を畜{やしな}えば吉{きつ}。|離。利貞。亨。畜牝牛吉。',
 kn:'坎の陥るに対し、離は麗く。離は心、内卦＝道心を主として正しさに附けば利しい。火は旋って亨る。牝牛を畜う＝陰爻(坤から来た柔順、牛)を養う。彖：日月は天に麗き、百穀草木は土に麗く。重明以て正に麗き、乃ち天下を化成す(天子の明徳を日々重ね正に附く)。柔中正に麗く故に亨る＝六二だけが中正。',
 d:'明{めい}両{ふた}たび作{おこ}るは離{り}なり。大人{たいじん}以{もっ}て明{めい}を継{つ}ぎて四方{しほう}を照{て}らす。|象曰。明兩作離。大人以繼明照于四方。',
 dn:'天子が毎日明徳を継いで四方を照らし、万民を成育する(日の運行)。',
 y:[
  ['初九','履{ふ}むこと錯然{さくぜん}たり。之{これ}を敬{けい}すれば咎{とが}无{な}し。|履錯然。敬之。无咎。','日が出る前の薄暗い朝、道が見えず躓く＝学問の初め、行いに迷う。敬(慎み)で咎を避ける。'],
  ['六二','黄離{こうり}なり。元吉{げんきつ}。|黃離。元吉。','黄は坤の中の色、子が親に麗く孝(武王・周公「其れ達孝なるかな」)。中道を得るなり。'],
  ['九三','日昃{ひかたむ}くの離{り}なり。缶{ほとぎ}を鼓{う}ちて歌{うた}わざれば、則{すなわ}ち大耋{たいてつ}の嗟{なげ}きあり。凶{きょう}。|日昃之離。不鼓缶而歌。則大耋之嗟。凶。','日が傾く＝天子が傾く。互体兌(悦)＝楽しみに耽り、楽の終わりを告げる缶も打たず歌い続ける→八十の老臣(太公望のような)が嘆く。紂王の長夜の飲。'],
  ['九四','突如{とつじょ}として其{そ}れ来如{らいじょ}たり。焚如{ふんじょ}たり、死如{しじょ}たり、棄如{きじょ}たり。|突如其來如。焚如。死如。棄如。','陽で陰位、親不孝。狂気のように突然出る。殺して焼き棄てる(古は火葬は重罪の親不孝者のみ)。容るる所无し：易に「无所容」は二か所のみ、もう一つは恒九三で、親不孝と信義なき者は天下に身の置き所なし。'],
  ['六五','涕{なみだ}を出{い}だすこと沱若{だじゃく}たり。戚{うれ}えて嗟若{さじゃく}たり。吉{きつ}。|出涕沱若。戚嗟若。吉。','先帝崩御。大臣が遺命で皇太子に位を伝える時、太子は涙を流し嘆くのみで言葉がない(書経顧命：成王崩じ太保奭が康王に命を伝える)。王公に離くなり。'],
  ['上九','王{おう}用{もっ}て出{い}でて征{う}つ。嘉{よみ}すべき有{あ}り。首{かしら}を折{くじ}き、獲{う}ること其{そ}の醜{たぐい}に匪{あら}ず。咎{とが}无{な}し。|王用出征。有嘉。折首。獲匪其醜。无咎。','崩御に乗じて外敵が来れば大臣が出征、首魁のみ折き衆(醜)は捕えない、惨酷をするな(離＝火＝兵)。以て邦を正す。']
 ],
 hint:'<ul><li>何に附くか(人・組織・主義)が肝心。</li><li>明を継いで四方を照らす。継承・引継ぎ。</li><li>日暮れの享楽に注意。不孝・不信は身の置き所を失う。</li></ul>',
 ks:'',
 all:'上経の終わり。天子が明徳を重ねて四方を照らす卦で、六五は代替わりの悲しみ、上九は首魁のみを討つ仁を説く。'
});

H({n:31, name:'沢山咸', kana:'たくざんかん', tri:'兌艮', theme:'無心の感応・夫婦の始め',
 k:'咸{かん}は亨{とお}る。貞{ただ}しきに利{よろ}し。女{じょ}を取{めと}るは吉{きつ}。|咸。亨。利貞。取女吉。',
 kn:'下経は人事を主とし、夫婦から始まる(序卦「有天地然後有万物…有夫婦然後有父子…」)。上兌(少女・沢)下艮(少男・山)、山上の沢の水気が山に上り陰陽相交わる。男が女の家に迎えに行き、門(艮)で待って迎え入れる＝親迎の礼。兌は秋＝婚礼の時(婚＝昏、夕暮れに行う)。咸は心のない感＝無心の感応で、私欲で感じてはならない。六礼(納采・問名・納吉・納徴・請期・親迎)を正しく踏めば取女吉。彖：天地感じて万物化生し、聖人人心を感ぜしめて天下和平す。',
 d:'山上{さんじょう}に沢{たく}有{あ}るは咸{かん}なり。君子{くんし}以{もっ}て虚{きょ}にして人{ひと}を受{う}く。|象曰。山上有澤咸。君子以虛受人。',
 dn:'山が実でありながら虚で水を受けるように、己を虚しくして人の言を容れる。',
 y:[
  ['初六','其{そ}の拇{おやゆび}に咸{かん}ず。|咸其拇。','爻は人の身体(卦全体を一身とする)。足の親指＝動こうとする志、志外に在り。艮で動かない方がよい。'],
  ['六二','其{そ}の腓{こむら}に咸{かん}ず。凶{きょう}。居{お}れば吉{きつ}。|咸其腓。凶。居吉。','ふくらはぎ。時至らず動けば凶、居れば吉。順えば害あらず。'],
  ['九三','其{そ}の股{もも}に咸{かん}ず。執{と}ること其{そ}の随{したが}うにあり。往{ゆ}けば吝{りん}。|咸其股。執其隨。往吝。','艮の主、上六に随おうとする＝男子として未練、卑しい(執る所下し)。男子は山のように高くあれ。'],
  ['九四','貞{てい}なれば吉{きつ}にして悔{くい}亡{ほろ}ぶ。憧憧{しょうしょう}として往来{おうらい}すれば、朋{とも}爾{なんじ}の思{おも}いに従{したが}う。|貞吉悔亡。憧憧往來。朋從爾思。','胸＝心の爻で、ここだけ「咸」の字がない。心が正しければ吉。欲で心が揺れ動けば同類が集まって不正に陥る。繋辞下で孔子「天下何をか思い何をか慮らん」と説く。'],
  ['九五','其{そ}の脢{せなか}に咸{かん}ず。悔{くい}无{な}し。|咸其脢。无悔。','脢は背中の肉＝欲のない所(艮卦「其の背に艮まる」)、無心の感。'],
  ['上六','其{そ}の輔頬舌{ほきょうぜつ}に咸{かん}ず。|咸其輔頰舌。','頬と舌＝口先で感ずる。儀礼では花嫁は三か月見習いをし、廟見の祭をしてから嫁として仕事をする。']
 ],
 hint:'<ul><li>縁談・感応・引き合い。正しい手順を踏めば吉。</li><li>己を虚しくして人を容れる。</li><li>口先の感応や欲の揺れは実を結ばない。</li></ul>',
 ks:'',
 all:'下経の始め、若い夫婦の無心の感応。天子が民の痛みを我が身の痛みのように感ずるのが仁(麻痺を「不仁」と言う)。'
});

H({n:32, name:'雷風恒', kana:'らいふうこう', tri:'震巽', theme:'変わらぬ夫婦の道',
 k:'恒{こう}は亨{とお}る。咎{とが}无{な}し。貞{ただ}しきに利{よろ}し。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。|恆。亨。无咎。利貞。利有攸往。',
 kn:'常と恒を区別する。常(日)は万年変わらない。恒(月)は毎日変わりながら十五日に満月となる一つの不変がある。夫婦は貧富・身上が変わっても一旦結べば終生変わらない。震(長男)は外、巽(長女)は内＝男は外で事を執り、女は室(奥)で家を養う(妻を「室」と言う)。彖：剛上りて柔下り(泰の初が四へ、四が初へ)、雷風相与し、巽いて動く。日月天を得て能く久しく照らし、四時変化して能く久しく成し、聖人其の道に久しくして天下化成す。',
 d:'雷風{らいふう}は恒{こう}なり。君子{くんし}以{もっ}て立{た}ちて方{ほう}を易{か}えず。|象曰。雷風恆。君子以立不易方。',
 dn:'雷気で万物が暢び、風で気を散じて滞らせない。自分の位置・方面(男外女内)を易えない。',
 y:[
  ['初六','恒{こう}を浚{ふか}くす。貞{てい}なれども凶{きょう}。利{よろ}しき攸{ところ}无{な}し。|浚恆。貞凶。无攸利。','嫁入りしたての長女が、すぐ家の事に深入りする(巽＝入)。言は正しくとも時を得ず凶。戦国策衛策の新婦：借りた馬を鞭打つな、竈の火に気をつけよ、臼を移せと言って笑われた。始めに深きを求むるなり。'],
  ['九二','悔{くい}亡{ほろ}ぶ。|悔亡。','陽で陰位だが中道を久しく行う。能く中に久し。'],
  ['九三','其{そ}の徳{とく}を恒{つね}にせず。或{あるい}は之{これ}に羞{はじ}を承{すす}む。貞{てい}なれども吝{りん}。|不恆其德。或承之羞。貞吝。','巽の極＝風で止まらず、利に近く市三倍＝欲深く、利のある方に交わりを変える信義なき者。容るる所无し(離九四の親不孝と並ぶ)。'],
  ['九四','田{かり}して禽{えもの}无{な}し。|田无禽。','陽で陰位、震の主で一方を堅く執り変化しない。禽のいない所で動かず待つ＝変ずべき時に変じない恒の弊害。'],
  ['六五','其{そ}の徳{とく}を恒{つね}にして貞{てい}なり。婦人{ふじん}は吉{きつ}、夫子{ふうし}は凶{きょう}。|恆其德貞。婦人吉。夫子凶。','柔順に当たり前を守るだけ＝婦人なら吉(一に従いて終う)、男子は義で事を制すべきなのに妻(九二)任せは凶。'],
  ['上六','恒{こう}を振{ふる}う。凶{きょう}。|振恆。凶。','恒を振り立てて人に示す、行き過ぎ。大いに功无し。']
 ],
 hint:'<ul><li>続けること・変えないことが吉。長期の関係。</li><li>ただし始めから深入りしすぎない。</li><li>変ずべき時に変じないのも弊害。</li></ul>',
 ks:'',
 all:'長男長女の終身不易の夫婦の卦。変化の中に一つ変わらぬものを持つのが恒。'
});
H({n:33, name:'天山遯', kana:'てんざんとん', tri:'乾艮', theme:'君子は早く遁れる',
 k:'遯{とん}は亨{とお}る。小{しょう}は貞{ただ}しきに利{よろ}し。|遯。亨。小利貞。',
 kn:'二陰が下から進み、三に至れば否となる＝子が親を、臣が君を害する勢い。君子は早く遁れて去る(遯＝豚が逃げる形)。小人に和して合わせれば君子の徳を失うので、官を棄てて遁れれば君子の道は亨る。小利貞は小人への戒め(正しくして君子を害すな)。剛位に当たりて応ず＝九五の明君に六二が応ずる、小人も初めは正しく見える(堯の時の四凶、周公以上と称された王莽)。遯の時義大いなるかな＝乱れんとする時こそ義がある。',
 d:'天下{てんか}に山{やま}有{あ}るは遯{とん}なり。君子{くんし}以{もっ}て小人{しょうじん}を遠{とお}ざけ、悪{にく}まずして厳{げん}なり。|象曰。天下有山遯。君子以遠小人。不惡而嚴。',
 dn:'下から見れば山は天に接するが登れば天は遥か＝君子は高く止まり小人から遠ざかる。悪めば禍を起こすので悪まず、犯されぬよう厳かに。',
 y:[
  ['初六','遯{のが}るるの尾{お}なり。厲{あやう}し。往{ゆ}く攸{ところ}有{あ}るに用{もち}うる勿{なか}れ。|遯尾。厲。勿用有攸往。','遁れる君子の尾を追いかけて害そうとするな(小人への戒め)。往かざれば何の災いかあらん。'],
  ['六二','之{これ}を執{と}らうるに黄牛{こうぎゅう}の革{かわ}を用{もち}う。之{これ}を説{と}くに勝{た}うる莫{な}し。|執之用黃牛之革。莫之勝說。','最も忠臣に見える小人(互体巽＝人に入り込む)を、九五の明君が黄牛の革(坤＝牛・黄)で固く縛り上に進ませない。志を固くするなり。'],
  ['九三','係{かか}りて遯{のが}る。疾{やまい}有{あ}りて厲{あやう}し。臣妾{しんしょう}を畜{やしな}えば吉{きつ}。|係遯。有疾厲。畜臣妾吉。','遁れようとして六二に纏わりつかれる(巽＝縄)。小人は召使いのように愛して置き、権力を与えるな。大事に可ならず。'],
  ['九四','好{この}みあれども遯{のが}る。君子{くんし}は吉{きつ}、小人{しょうじん}は否{しか}らず。|好遯。君子吉。小人否。','大臣が初六と応ずるが、好みを損なわず上手に遁れる。小人は富貴を捨てられないのでできない。'],
  ['九五','嘉{よみ}して遯{のが}る。貞{てい}にして吉{きつ}。|嘉遯。貞吉。','古今の注は伯夷・叔斉・呉太伯に喩えるが誤り(彼らは天子でない)。五は必ず天子＝堯が舜に政を摂らせて隠居した(書経「遜于位」、史記「避位」、孟子「堯老いて舜摂す」)。自ら四凶を処分できず舜が処分した。以て志を正す。'],
  ['上九','肥{と}びて遯{のが}る。利{よろ}しからざる无{な}し。|肥遯。无不利。','肥は飛(蜚)の略、古今の「寛裕」とする解は誤り。富貴を擲ち、馬が飛ぶように速やかに遁れる。淮南子「遯而能飛」、張衡思玄賦「飛遯以保名」。疑う所无し。']
 ],
 hint:'<ul><li>退く・身を引く時。遅れれば巻き込まれる。</li><li>小人を憎まず、しかし近づけず、厳かに。</li><li>富貴を捨てて速やかに去る者が吉。</li></ul>',
 ks:'九五を伯夷・叔斉とする説は誤りで、堯の隠居。上九「肥遯」の肥は飛。',
 all:'小人が下から進む時、君子が遁れる卦。根本は九五を「天子の隠居＝堯」と読み、五爻天子の原則を貫く。'
});

H({n:34, name:'雷天大壮', kana:'らいてんたいそう', tri:'震乾', theme:'壮んな時こそ正しく',
 k:'大壮{たいそう}は貞{ただ}しきに利{よろ}し。|大壯。利貞。',
 kn:'大は陽、壮は四陽が重なって強くなった(鄭玄「気力浸く強きの名」、人も三十で壮)。馬融・虞翻は壮＝傷とする＝剛過ぎれば傷つく。強いほど正しく固まれ。剛以て動く故に壮(乾剛・震動)。正大にして天地の情見るべし(天地の気が動いて万物を生ずる＝情)。',
 d:'雷{かみなり}天上{てんじょう}に在{あ}るは大壮{たいそう}なり。君子{くんし}以{もっ}て礼{れい}に非{あら}ざれば履{ふ}まず。|象曰。雷在天上大壯。君子以非禮弗履。',
 dn:'礼は履＝天道天理を履み行うこと(震＝足)。',
 y:[
  ['初九','趾{あし}に壮{さか}んなり。征{ゆ}けば凶{きょう}。孚{まこと}有{あ}り。|壯于趾。征凶。有孚。','趾＝踏み止まる足。四と応じない、無理に進めば凶。其の孚窮まるなり。'],
  ['九二','貞{てい}にして吉{きつ}。|貞吉。','乾の中で剛に過ぎない。中を以てなり。'],
  ['九三','小人{しょうじん}は壮{そう}を用{もち}い、君子{くんし}は罔{もう}を用{もち}う。貞{てい}なれども厲{あやう}し。羝羊{ていよう}藩{まがき}に触{ふ}れて其{そ}の角{つの}を羸{くる}しむ。|小人用壯。君子用罔。貞厲。羝羊觸藩。羸其角。','乾の極。小人は血気の勇を用い、君子は強さを忘れたように無きが如し(罔＝無)。雄羊(大きな兌＝羊)が垣(九四の陽)に突っ込んで角を毀す(兌＝毀折)。'],
  ['九四','貞{てい}なれば吉{きつ}にして悔{くい}亡{ほろ}ぶ。藩{まがき}決{ひら}けて羸{くる}しまず。大輿{たいよ}の輹{ふく}に壮{さか}んなり。|貞吉悔亡。藩決不羸。壯于大輿之輹。','震の主。前の垣(陰)が開き、雷のごとく進む大車。二月は雷の時。尚往くなり。'],
  ['六五','羊{ひつじ}を易{えき}に喪{うしな}う。悔{くい}无{な}し。|喪羊于易。无悔。','羊＝兵(突進)、易＝場(境域)で大敗。震の天子は進むのみで顧みない(暴虎馮河、死して悔いなし)。位当たらず。'],
  ['上六','羝羊{ていよう}藩{まがき}に触{ふ}れ、退{しりぞ}く能{あた}わず、遂{すす}む能{あた}わず。利{よろ}しき攸{ところ}无{な}し。艱{なや}めば則{すなわ}ち吉{きつ}。|羝羊觸藩。不能退。不能遂。无攸利。艱則吉。','進退窮まる。苦しんで考えれば吉。咎長からず。']
 ],
 hint:'<ul><li>勢いが強い時。無理押しは角を毀す。</li><li>強さを表に出さない(君子は罔を用う)。</li><li>進退窮まったら、苦しんで考え直す。</li></ul>',
 ks:'',
 all:'陽が壮んな二月の卦。強いほど礼に適い正しく固まれ、と説く。'
});

H({n:35, name:'火地晋', kana:'かちしん', tri:'離坤', theme:'日が昇る・進む',
 k:'晋{しん}は康侯{こうこう}用{もっ}て馬{うま}を錫{たま}うこと蕃庶{はんしょ}、昼日{ちゅうじつ}に三{み}たび接{せっ}す。|晉。康侯用錫馬蕃庶。晝日三接。',
 kn:'上離(日)下坤(地)＝日が地上に出て万物が進む(説文「晋、進也、日出万物進」)。康侯(民を康んずる諸侯)が天子に朝して国政を奏上する。錫は古くは上下の別なく「与える・献ずる」両方(書経「師錫帝」)、上から下のみになったのは秦始皇以後。庶＝馬十匹。儀礼覲礼：圭を執り宗廟の庭で拝して堂に昇る(一)、幣帛と馬十匹を献ずる(二)、労いの命に謝す(三)＝一日に三度の拝謁。明地上に出で、順にして大明に麗き、柔進みて上行す(明夷の二が進んで五へ)。',
 d:'明{めい}地上{ちじょう}に出{い}づるは晋{しん}なり。君子{くんし}以{もっ}て自{みずか}ら明徳{めいとく}を昭{あき}らかにす。|象曰。明出地上晉。君子以自昭明德。',
 dn:'坤＝欲に覆われた暗さ。学問で磨いて天より受けた明徳を明らかにする(大学「明明徳」)。',
 y:[
  ['初六','晋如{しんじょ}たり摧如{さいじょ}たり。貞{てい}なれば吉{きつ}。孚{まこと}とせらるる罔{な}し。裕{ゆたか}なれば咎{とが}无{な}し。|晉如摧如。貞吉。罔孚。裕无咎。','摧は崔(高い)、徳が山のように高く進む。まだ草莽で信用されないが、官に就かず責任もなく裕か(孟子「我に官守无く、言責无し…綽綽然として余裕有り」)。独り正を行う。'],
  ['六二','晋如{しんじょ}たり愁如{しゅうじょ}たり。貞{てい}なれば吉{きつ}。茲{こ}の介福{かいふく}を其{そ}の王母{おうぼ}に受{う}く。|晉如愁如。貞吉。受茲介福于其王母。','九四(艮の主＝鼠の悪大臣)に遮られて愁う。王母＝六五(離＝中女)＝若い天子に代わって政を執る母后(漢の呂后、日本の神功皇后)。六二は武内宿禰のような忠臣。中正を以てなり。'],
  ['六三','衆{しゅう}允{まこと}とす。悔{くい}亡{ほろ}ぶ。|衆允。悔亡。','坤の終わり＝厚。衆に信用され六二と共に尽くす。志上行す。'],
  ['九四','晋如{しんじょ}たる鼫鼠{せきそ}なり。貞{てい}なれども厲{あやう}し。|晉如鼫鼠。貞厲。','大臣の位にいる大鼠(互体坎＝陰険、艮＝鼠)。夜に悪戯して貪る(詩経「碩鼠」)。位当たらず。'],
  ['六五','悔{くい}亡{ほろ}ぶ。失得{しっとく}恤{うれ}うる勿{なか}れ。往{ゆ}けば吉{きつ}にして利{よろ}しからざる无{な}し。|悔亡。失得勿恤。往吉。无不利。','左右に小人(九四・上九)がいるが、文明の徳で民心を得る。往けば慶び有り。'],
  ['上九','其{そ}の角{つの}に晋{すす}む。維{こ}れ用{もっ}て邑{ゆう}を伐{う}つ。厲{あやう}けれども吉{きつ}にして咎{とが}无{な}し。貞{てい}なれども吝{りん}。|晉其角。維用伐邑。厲吉。无咎。貞吝。','離の極＝兵、角で突き当たる。九四の悪大臣の邑を伐つ。大臣を伐たねばならないのは天子の徳がまだ明らかでないから吝。道未だ光いならず。']
 ],
 hint:'<ul><li>昇進・前進・表舞台に出る時。</li><li>途中の妨げ(権臣・邪魔者)は信と徳で越える。</li><li>自ら明徳を磨く。</li></ul>',
 ks:'六五「失得勿恤」は後世本の誤りで「矢得」が正しい(矢＝誓・信、直きこと矢の如し)。',
 all:'日が地上に昇って万物が進む卦。忠臣が母后を輔け、悪大臣(鼫鼠)を越えて進む。'
});

H({n:36, name:'地火明夷', kana:'ちかめいい', tri:'坤離', theme:'明を晦ます・無道の世',
 k:'明夷{めいい}は艱貞{かんてい}に利{よろ}し。|明夷。利艱貞。',
 kn:'晋の反対、明が夷(やぶ)られる＝日が地中に入る暗夜＝無道の世。苦しくても正を失うな。彖：内文明にして外柔順、以て大難を蒙る、文王之を以てす(紂の下で明徳を秘め、順って仕え羑里に囚われた)。其の明を晦ます、内難にして能く其の志を正す、箕子之を以てす(箕子は紂の叔父、紂の庶兄の微子啓を立てようとして恨まれ、狂を装って明を晦ました)。',
 d:'明{めい}地中{ちちゅう}に入{い}るは明夷{めいい}なり。君子{くんし}以{もっ}て衆{しゅう}に莅{のぞ}むに、晦{くら}きを用{もち}いて明{あき}らかなり。|象曰。明入地中明夷。君子以蒞衆。用晦而明。',
 dn:'衆に臨んで明を晦ます。明察しすぎると苛酷になる。天子は外屏(門外の塀)を設けて細かく見ない。寛仁で治めれば却って明。',
 y:[
  ['初九','明夷{めいい}于{ここ}に飛{と}び、其{そ}の翼{つばさ}を垂{た}る。君子{くんし}于{ここ}に行{ゆ}きて三日{みっか}食{くら}わず。往{ゆ}く攸{ところ}有{あ}れば、主人{しゅじん}言{げん}有{あ}り。|明夷于飛。垂其翼。君子于行。三日不食。有攸往。主人有言。','離＝雉。既に傷ついて翼を垂れて逃げ、三日食わず、宿の主人に何か言われても留まらない。義として食わず。論語郷党「色斯に挙がり、翔りて後に集まる…山梁の雌雉、時なるかな」＝孔子は雉が害の来る前に飛び去るのを嘆賞した。傷ついてからでは遅い。'],
  ['六二','明夷{めいい}左股{さこ}を夷{やぶ}る。用{もっ}て拯{すく}うに馬{うま}壮{さか}んなれば吉{きつ}。|明夷。夷于左股。用拯馬壯。吉。','文王が羑里に囚われたが、紂を輔ける股肱の心を失わず、馬(臣)として強く、天下三分の二を有しながら殷に服従した。順にして以て則あり(坤＝順、離＝礼＝則)。'],
  ['九三','明夷{めいい}南狩{なんしゅ}して其{そ}の大首{たいしゅ}を得{う}。疾{と}く貞{ただ}す可{べ}からず。|明夷于南狩。得其大首。不可疾貞。','離の極＝兵、南＝離。武王が紂(大首)を伐つ。臣が君を伐つのだから急いではならず、耐えに耐え已むを得ずして行う。国語：天下の諸侯が武王に迫り担ぎ立てた。南狩の志、乃ち大いに得＝大いに民を得た。'],
  ['六四','左腹{さふく}に入{い}り、明夷{めいい}の心{こころ}を獲{え}て、于{ここ}に門庭{もんてい}を出{い}づ。|入于左腹。獲明夷之心。于出門庭。','微子。紂の腹中まで深く入ってその心を得て(微子を立てる謀ありと疑われている)、箕子の勧めで門庭を出て逃れた(書経微子篇)。心意を獲るなり。'],
  ['六五','箕子{きし}の明夷{めいい}なり。貞{ただ}しきに利{よろ}し。|箕子之明夷。利貞。','箕子は狂を装い明を晦ましたが、心は明で息むべからず。後に武王に洪範(天子が天下を治める大法)を授けた。'],
  ['上六','明{あき}らかならずして晦{くら}し。初{はじ}めは天{てん}に登{のぼ}り、後{のち}には地{ち}に入{い}る。|不明晦。初登于天。後入于地。','紂＝明夷の極。先祖の湯王は天に登って四国を照らしたが、末代で地に入った。則を失う(文王が臣の則を得たのと反対)。']
 ],
 hint:'<ul><li>実力を隠して耐える時。明察しすぎない。</li><li>害が来る前に去る。傷ついてからでは遅い。</li><li>上に立つ者は細かく見すぎず寛仁に。</li></ul>',
 ks:'',
 all:'殷末の文王・武王・微子・箕子・紂を六爻に配する卦。臣が君を伐つことの已むを得なさを九三で説く。'
});

H({n:37, name:'風火家人', kana:'ふうかかじん', tri:'巽離', theme:'家を正せば天下定まる',
 k:'家人{かじん}は女{おんな}の貞{ただ}しきに利{よろ}し。|家人。利女貞。',
 kn:'一家の人。家の和不和は女に係る。上巽(長女)、下離(中女)、共に主爻(四・二)が正位で、妹が姉に順う。巽は内へ入り離は上る＝相親しむ。五(天子)と二(皇后)＝皇后は内を治めて外事に関わらない。宮中が治まれば朝廷、そして天下が治まる。彖：女は位を内に正し、男は位を外に正す。家人に厳君有り、父母の謂なり＝厳君は父だけでなく母も厳しく(母が愛に溺れると子が我儘に)。家を正して天下定まる。',
 d:'風{かぜ}火{ひ}より出{い}づるは家人{かじん}なり。君子{くんし}以{もっ}て言{げん}に物{もの}有{あ}りて、行{おこな}いに恒{つね}有{あ}り。|象曰。風自火出家人。君子以言有物。而行有恆。',
 dn:'竈の火(離)に薪(巽＝木)を加えて風が上る＝竈が家の要。言葉に実あり(虚飾・戯言なし)、行いに恒あり(互体坎＝水月の信)。',
 y:[
  ['初九','家{いえ}有{たも}つを閑{ふせ}ぐ。悔{くい}亡{ほろ}ぶ。|閑有家。悔亡。','閑は防ぐ。悪の出ないうち、子の幼少時から防ぐ。志未だ変ぜず。'],
  ['六二','遂{と}ぐる攸{ところ}无{な}し。中{うち}に在{あ}りて饋{き}す。貞{てい}にして吉{きつ}。|无攸遂。在中饋。貞吉。','皇后でも自分の考えを遂げず夫に従い、飲食を調えて養う(中饋)のが職分。政に口を出すな。順にして以て巽う。'],
  ['九三','家人{かじん}嗃嗃{かくかく}たり。厲{あやう}きを悔{く}ゆれども吉{きつ}。婦子{ふし}嘻嘻{きき}たれば、終{つい}に吝{りん}。|家人嗃嗃。悔厲吉。婦子嘻嘻。終吝。','離の極＝火のように厳しく家を治める、後悔もあるが吉。嫁や子が朝から晩までふざけ笑うのは家の恥、節を失う。'],
  ['六四','家{いえ}を富{と}ます。大吉{だいきつ}。|富家。大吉。','巽＝利に近く市三倍＝財を蓄えて家を富ます妃。順にして位に在り。'],
  ['九五','王{おう}有家{ゆうか}に仮{いた}る。恤{うれ}うる勿{なか}れ。吉{きつ}。|王假有家。勿恤。吉。','天子は四海を家とし天下の民を赤子とする(書経「赤子を保んずるが若し」)。どこへ行っても客とならない。交々相愛す。'],
  ['上九','孚{まこと}有{あ}りて威如{いじょ}たり。終{つい}に吉{きつ}。|有孚威如。終吉。','互体坎＝孚、離＝威(礼儀)。身に反るの謂なり＝我が身を省み礼で治めれば、猛からずして威あり。']
 ],
 hint:'<ul><li>家庭・内部・社内の事。まず内を固める。</li><li>厳しすぎる方が甘すぎるよりよい。</li><li>言葉に実、行いに恒。竈(家計・台所)が家の要。</li></ul>',
 ks:'「家人有厳君焉、父母之謂也」＝厳君は父だけでなく母も厳しくあれ。',
 all:'家を正せば天下定まる。皇后は内を治め、天子は四海を家とする。'
});

H({n:38, name:'火沢睽', kana:'かたくけい', tri:'離兌', theme:'反目・背き合い',
 k:'睽{けい}は小事{しょうじ}に吉{きつ}なり。|睽。小事吉。',
 kn:'睽は目(離)＋癸(兌＝壬癸の陰水)、説文「目相聴かざるなり」＝反目。上下相背いて和合せず、大事は不可、小事は吉(陰が主)。火動いて上り、沢動いて下る。二女同居して其の志同行せず＝家人の反対で、兌の少女が寵愛を得て中女が遠ざけられ嫉妬し、互いに害す。君(五)が柔弱で臣(二)が剛。天地睽いて其の事同じく、男女睽いて其の志通ず。睽の時用大いなるかな＝上下不和の時こそ親密にする大仕事がある。',
 d:'上{かみ}火{ひ}下{しも}沢{たく}は睽{けい}なり。君子{くんし}以{もっ}て同{おな}じくして異{こと}なり。|象曰。上火下澤睽。君子以同而異。',
 dn:'君のために尽くす志は同じでも、武・文など各々長ずる所は異なる。',
 y:[
  ['初九','悔{くい}亡{ほろ}ぶ。馬{うま}を喪{うしな}うも逐{お}う勿{なか}れ、自{おのずか}ら復{かえ}る。悪人{あくにん}を見{み}て咎{とが}无{な}し。|悔亡。喪馬勿逐。自復。見惡人。无咎。','兌＝動かぬ水。馬(互体坎)が逃げても追えば逃げる、一陽来復のように自ら戻る。悪人(九四)が礼をもって会いに来れば拒まず会う(孔子が陽貨・南子に会った)。以て咎を辟く。'],
  ['九二','主{しゅ}に巷{ちまた}に遇{あ}う。咎{とが}无{な}し。|遇主于巷。无咎。','上下不和の時、朝廷の表向きでは親密を謀れないので、君が賢人の住む巷(顔回の陋巷のような)に自ら来て密かに会う。未だ道を失わず。'],
  ['六三','輿{くるま}の曳{ひ}かるるを見{み}る。其{そ}の牛{うし}掣{ひ}かる。其{そ}の人{ひと}天{てん}せられ且{か}つ劓{はなき}らる。初{はじ}め无{な}くして終{お}わり有{あ}り。|見輿曳。其牛掣。其人天且劓。无初有終。','国家の重荷を載せる大臣(九四)の車が進まない。牛は角が一本上一本下の不正な牛、御者は額に入れ墨・鼻切りの罪人＝大臣の用いる者は悪人ばかり。六三が大臣を正しい方へ導けば終わりあり。'],
  ['九四','睽{そむ}きて孤{こ}なり。元夫{げんぷ}に遇{あ}い、交{こもご}も孚{まこと}あり。厲{あやう}けれども咎{とが}无{な}し。|睽孤。遇元夫。交孚。厲无咎。','応なく孤立。初九(元夫＝一陽来復・乾元)と交わり孚あれば咎なし。志行わる。'],
  ['六五','悔{くい}亡{ほろ}ぶ。厥{そ}の宗{そう}膚{はだえ}を噬{か}む。往{ゆ}くも何{なん}の咎{とが}かあらん。|悔亡。厥宗噬膚。往何咎。','陰で陽位の柔弱な天子。宗＝九二の陽が膚に噛みつくように諫める。天子自ら九二の家(巷)に往けば何の咎もない。往けば慶び有り。'],
  ['上九','睽{そむ}きて孤{こ}なり。豕{いのこ}の塗{どろ}を負{お}い、鬼{き}を一車{いっしゃ}に載{の}するを見{み}る。先{さき}には之{これ}が弧{ゆみ}を張{は}り、後{のち}には之{これ}が壺{つぼ}を説{と}く。寇{あだ}するに匪{あら}ず婚媾{こんこう}せんとす。往{ゆ}きて雨{あめ}に遇{あ}えば則{すなわ}ち吉{きつ}。|睽孤。見豕負塗。載鬼一車。先張之弧。後說之壺。匪寇婚媾。往遇雨則吉。','離の怒りで六三を疑い孤立。泥を背負った豚(坎＝泥)、車一杯の鬼(坎＝車、荀子「鬼の如し」＝悪人)に見えて弓を張るが、よく考えれば寇でなく婚媾(兌の主、陰陽相和)。壺＝酒徳利の紐を解いて飲み親しむ。往けば雨(坎＝陰陽和)に遇う。群疑亡ぶ。']
 ],
 hint:'<ul><li>不和・反目。大事は不可、小事は吉。</li><li>同じ目的でも役割は違ってよい(同而異)。</li><li>疑いは多くが思い違い。解けて酒を酌み交わす。</li></ul>',
 ks:'上九「後説之弧」の俗本は誤りで「壺」が正しい。',
 all:'二女同居して志が違う反目の卦。君が自ら巷に賢人を訪ね、疑いを解いて和す道を説く。'
});

H({n:39, name:'水山蹇', kana:'すいざんけん', tri:'坎艮', theme:'足なえ・難に止まる',
 k:'蹇{けん}は西南{せいなん}に利{よろ}しく、東北{とうほく}に利{よろ}しからず。大人{たいじん}を見{み}るに利{よろ}し。貞{てい}にして吉{きつ}。|蹇。利西南。不利東北。利見大人。貞吉。',
 kn:'蹇は足が不自由で歩みが難しい(艮＝身体)。上坎(険)を前に止まる。月(坎)は三日に西南から生まれ東北で滅ぶ。西南＝坤＝草莽で学問して徳を積め、東北＝艮＝朝廷に学なく出るな(坤卦「西南得朋、東北喪朋」と同じ)。険を見て能く止まるは知なるかな。蹇の時用大いなるかな。',
 d:'山上{さんじょう}に水{みず}有{あ}るは蹇{けん}なり。君子{くんし}以{もっ}て身{み}に反{かえ}りて徳{とく}を修{おさ}む。|象曰。山上有水蹇。君子以反身修德。',
 dn:'苦労して山に登ると水で行けない。己を省みて徳を修める。初爻だけが位不当で、反せば既済(天下の難を救い正しくなる)。',
 y:[
  ['初六','往{ゆ}けば蹇{なや}み、来{きた}れば誉{ほまれ}あり。|往蹇來譽。','来て止まり時を待ち、従容と楽しむ。宜しく待つべし。'],
  ['六二','王臣{おうしん}蹇蹇{けんけん}たり。躬{み}の故{ゆえ}に匪{あら}ず。|王臣蹇蹇。匪躬之故。','五と応ずる臣。君の難を我が難とし、我が躬は王の躬、身を顧みない。終に尤无し。天子一姓の国では臣は難を避けない(曲礼「三諫して聴かれざれば逃る」は湯武以後の衰世の論)。'],
  ['九三','往{ゆ}けば蹇{なや}み、来{きた}れば反{かえ}る。|往蹇來反。','往けば険、艮＝家に反る。内之を喜ぶ。'],
  ['六四','往{ゆ}けば蹇{なや}み、来{きた}れば連{つら}なる。|往蹇來連。','連は輦＝引く(孟子「流連荒亡」の連)。大臣が草莽の同志を引き連れて共に力を尽くす(合従連衡の連)。位に当たりて実なり。'],
  ['九五','大{おお}いに蹇{なや}めども朋{とも}来{きた}る。|大蹇朋來。','大難の時、六四の大臣が引き連れた同志の朋が来て力を尽くす。中節を以てなり。'],
  ['上六','往{ゆ}けば蹇{なや}み、来{きた}れば碩{おお}いなり。吉{きつ}。大人{たいじん}を見{み}るに利{よろ}し。|往蹇來碩。吉。利見大人。','碩＝大徳の九三と志を合わせる。大人＝九五天子(貴は必ず九五)の側を離れず尽くす。志内に在り。']
 ],
 hint:'<ul><li>前に難がある。止まって己を省み、徳を修める。</li><li>学なく表に出るな。まず在野で力をつける。</li><li>同志と力を合わせれば大難も越える。</li></ul>',
 ks:'六二は天子一姓の臣道の手本で、曲礼の「三諫不聴則逃」を退ける根拠とする。',
 all:'険を前に止まる知の卦。君の難を我が難とする王臣の道を説く。'
});

H({n:40, name:'雷水解', kana:'らいすいかい', tri:'震坎', theme:'難が解ける・平常に戻る',
 k:'解{かい}は西南{せいなん}に利{よろ}し。往{ゆ}く所{ところ}无{な}ければ、其{そ}れ来{きた}り復{かえ}りて吉{きつ}。往{ゆ}く攸{ところ}有{あ}れば、夙{はや}くして吉{きつ}。|解。利西南。无所往。其來復吉。有攸往。夙吉。',
 kn:'蹇の険難が解けた後、常に戻って民を養う。西南＝坤＝地＝農業で民を養う(震＝二月・耕作)。天下の乱が止めば余計な事業をせず平常に戻る(其来復吉)。残務があれば速やかに(震)。解はもつれた糸を解き分けること。彖：険以て動き、動いて険を免る。天地解けて雷雨作り、雷雨作りて百果草木皆甲坼す(互体離＝甲＝硬い殻、梅桃の種が割れて芽)。解の時大いなるかな(小人を解き放つ)。',
 d:'雷雨{らいう}作{おこ}るは解{かい}なり。君子{くんし}以{もっ}て過{あやま}ちを赦{ゆる}し罪{つみ}を宥{なだ}む。|象曰。雷雨作解。君子以赦過宥罪。',
 dn:'春の万物発生＝仁の時、殺さない。過(悪意なき失策)は全く赦し、罪(悪意あり)は宥める＝死刑を流刑・懲役に減じる(書経「流宥五刑」)。',
 y:[
  ['初六','咎{とが}无{な}し。|无咎。','三狐の一つ(初・三・上)だが、九二に従い悔いて咎を免れる。剛柔の際、義として咎无し。'],
  ['九二','田{かり}して三狐{さんこ}を獲{え}、黄矢{こうし}を得{う}。貞{てい}にして吉{きつ}。|田獲三狐。得黃矢。貞吉。','六五を輔けて小人を放つ賢人(互体離＝狩)。三狐＝初六・六三・上六。黄矢＝中、小人を悪むのが酷すぎず程好い→小人も感服する。中道を得。'],
  ['六三','負{お}い且{か}つ乗{の}る。寇{あだ}の至{いた}るを致{いた}す。貞{てい}なれども吝{りん}。|負且乘。致寇至。貞吝。','狐の首魁(坎＝狐)。大臣になる器でない者が、荷を背負ったまま馬車(坎＝車)に乗るような不相応、叩き落とされ車を奪われる。繋辞上「慢蔵は盗を誨え、野容は淫を誨う」。自ら戎を致す、又誰をか咎めん。'],
  ['九四','而{なんじ}の拇{おやゆび}を解{と}く。朋{とも}至{いた}りて斯{ここ}に孚{まこと}あり。|解而拇。朋至斯孚。','而＝汝(九四)、拇＝足の親指(震＝足)＝纏わりつく六三を切り離せ。首魁のみ除き、同類(朋)は徳で悔い改めさせよ。未だ位に当たらず。'],
  ['六五','君子{くんし}維{こ}れ解{と}く有{あ}り。吉{きつ}。小人{しょうじん}に孚{まこと}有{あ}り。|君子維有解。吉。有孚于小人。','小人を解き放てば退く。悉く殺さず徳で服させる。小人退くなり。'],
  ['上六','公{こう}用{もっ}て隼{はやぶさ}を高墉{こうよう}の上{うえ}に射{い}る。之{これ}を獲{え}て利{よろ}しからざる无{な}し。|公用射隼于高墉之上。獲之无不利。','隼＝君側の奸臣(上六、狐は低い坎)。高墉＝天子の宮城の石垣(三丈)。公＝九四(三公、震の主)が宮中に飛び込もうとする隼を射落とす。繋辞下「君子は器を身に蔵し、時を待ちて動く」。以て悖れるを解く。']
 ],
 hint:'<ul><li>問題解決・緊張緩和。解けたら余計なことをせず平常に戻る。</li><li>過失は赦し、故意の罪は減じる。</li><li>首魁だけを除き、同類は徳で改めさせる。</li></ul>',
 ks:'',
 all:'難が解けて春の雷雨が万物を芽吹かせる卦。赦しと寛刑、首魁のみを除く仁を説く。'
});
H({n:41, name:'山沢損', kana:'さんたくそん', tri:'艮兌', theme:'下を損して上を益す',
 k:'損{そん}は孚{まこと}有{あ}れば元吉{げんきつ}にして咎{とが}无{な}し。貞{てい}にす可{べ}し。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。曷{なに}をか之{これ}用{もち}いん。二簋{にき}用{もっ}て享{まつ}る可{べ}し。|損。有孚。元吉。无咎。可貞。利有攸往。曷之用。二簋可用享。',
 kn:'有るものを失い不足するのが損。解けて心が緩むと損が生ずる。本は泰(下が富み盈ちる)で、下(三)を損して上に益す＝民が余りを貢物として献ずる(兌＝悦)。上(艮)は止めようとする。互いに孚あり。二簋可用享＝祭りに簋二つだけの倹約でも誠あれば神は享ける(天子の祭は四方の献上物で成る)。損益盈虚、時と偕に行う(豊年には益し、凶年には上から下へ)。',
 d:'山下{さんか}に沢{たく}有{あ}るは損{そん}なり。君子{くんし}以{もっ}て忿{いかり}を懲{こ}らし欲{よく}を窒{ふさ}ぐ。|象曰。山下有澤損。君子以懲忿窒欲。',
 dn:'乾の強さの上に強さ＝忿り、三が上に往き兌(悦)に変じて止む(懲＝止める)。坤＝吝嗇＝欲、上が変じて艮(止)＝欲を窒ぐ。',
 y:[
  ['初九','事{こと}を已{まつ}りて遄{すみ}やかに往{ゆ}く。咎{とが}无{な}し。酌{く}みて之{これ}を損{そん}す。|已事遄往。无咎。酌損之。','已＝祀(互体震＝春、兌＝秋の祭)。祭りは時が定まっているので速やかに献ずる。上は下を損じ過ぎないよう酌量する。上と志を合わす。'],
  ['九二','貞{てい}に利{よろ}し。征{ゆ}けば凶{きょう}。損{そん}せずして之{これ}を益{ま}す。|利貞。征凶。弗損益之。','下卦の中＝程好い暮らし(家屋・衣食)、損して献ずれば凶。中以て志と為す。'],
  ['六三','三人{さんにん}行{ゆ}けば則{すなわ}ち一人{ひとり}を損{そん}し、一人{ひとり}行{ゆ}けば則{すなわ}ち其{そ}の友{とも}を得{う}。|三人行則損一人。一人行則得其友。','本の乾の三陽＝三人連れ(互体震＝行く)では精神が凝らず一人余る。一人が上へ行けば坤(陰ばかり)に陽の友を得て互いに悦ぶ。繋辞下「天地絪縕して万物化醇し、男女精を構えて万物化生す。言は一を致すなり」＝何事も精神を一に凝らせ。三なれば則ち疑う。'],
  ['六四','其{そ}の疾{やまい}を損{そん}す。遄{すみ}やかならしむれば喜{よろこ}び有{あ}り。咎{とが}无{な}し。|損其疾。使遄有喜。无咎。','坤の中の柔弱＝大臣の決断不足という病を速やかに減らせ。柔弱は剛で、剛過は柔で救う(学問の道)。亦喜ぶべきなり。'],
  ['六五','或{あるい}は之{これ}を益{ま}す。十朋{じっぽう}の亀{き}も違{たが}う克{あた}わず。元吉{げんきつ}。|或益之。十朋之龜。弗克違。元吉。','天子の宮中が乏しい時、上九が民の献上物を受けて天子に回す。十朋の亀＝元亀(甲一尺二寸の大亀)、朋は貝二枚一双(古は貝が貨幣)。この霊亀で占っても違わぬ吉＝上下和す。上より祐くるなり。'],
  ['上九','損{そん}せずして之{これ}を益{ま}す。咎{とが}无{な}し。貞{てい}にして吉{きつ}。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。臣{しん}を得{う}るも家{いえ}无{な}し。|弗損益之。无咎。貞吉。利有攸往。得臣无家。','上九が五に往けば坤＝臣を得、艮(家)がなくなる＝臣は家を忘れて公に尽くす。大いに志を得＝民を富ます志を遂げる(祭りは二簋で足りる)。']
 ],
 hint:'<ul><li>減らす・献ずる・節約。誠があれば少なくても通じる。</li><li>怒りと欲を抑える。</li><li>三人では一人余る。二人で心を一つに。</li></ul>',
 ks:'',
 all:'下を損して上に献ずる卦。倹約と誠、忿りと欲を窒ぐことを説く。'
});

H({n:42, name:'風雷益', kana:'ふうらいえき', tri:'巽震', theme:'上を損して民を益す',
 k:'益{えき}は往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。大川{たいせん}を渉{わた}るに利{よろ}し。|益。利有攸往。利涉大川。',
 kn:'損の反対、否から来る(乾の四が坤の初へ)＝上を損して下(困窮した民、坤＝空)を益す。震＝農業、民を富ます本は農業で、一時の救済だけでなく盛んにせよ。彖：上を損して下を益し、民説ぶこと疆り无し。上より下に下る、其の道大いに光る。木道乃ち行わる(震・巽＝木＝舟)。天施し地生じ、其の益方无し(雷気で芽・花・実)。凡そ益の道は時と偕に行う：秋の収穫を見て不作なら年貢米を貸し翌秋返させる(孟子「秋は斂を省みて足らざるを助く」)。',
 d:'風雷{ふうらい}は益{えき}なり。君子{くんし}以{もっ}て善{ぜん}を見{み}れば則{すなわ}ち遷{うつ}り、過{あやま}ち有{あ}れば則{すなわ}ち改{あらた}む。|象曰。風雷益。君子以見善則遷。有過則改。',
 dn:'巽＝修飾、人の修めた善を見て遷る。震＝過ぎる(雷が昇り過ぎれば艮となって下へ落ち物を害す)、過ちは改める。',
 y:[
  ['初九','用{もっ}て大作{たいさく}を為{な}すに利{よろ}し。元吉{げんきつ}にして咎{とが}无{な}し。|利用爲大作。元吉。无咎。','作＝生＝農事(書経「東作を平秩す」)。下、事を厚くせず＝農民に他の労役を重ねるな。繋辞下：神農は耒耜を益に取った。'],
  ['六二','或{あるい}は之{これ}を益{ま}す。十朋{じっぽう}の亀{き}も違{たが}う克{あた}わず。永貞{えいてい}なれば吉{きつ}。王{おう}用{もっ}て帝{てい}に享{まつ}る。吉{きつ}。|或益之。十朋之龜。弗克違。永貞吉。王用享于帝。吉。','初九から農事の益が及ぶ。冬至一陽来復に天帝を祭り豊年を祈る(祈穀)。外より来るなり(九四から)。'],
  ['六三','之{これ}を益{ま}すに凶事{きょうじ}を用{もっ}てす。咎{とが}无{な}し。孚{まこと}有{あ}りて中行{ちゅうこう}なり。公{こう}に告{つ}ぐるに圭{けい}を用{もっ}てす。|益之用凶事。无咎。有孚中行。告公用圭。','凶年饑饉に益す。四月の麦秋に雷雨大風で麦を害せば官から救え。公(先祖)に圭を供えて告げる。固より之を有す＝官倉の米は元来民の納めたもの、九年の蓄えを持つべし。'],
  ['六四','中行{ちゅうこう}なれば公{こう}に告{つ}げて従{したが}わる。用{もっ}て依{い}を為{な}し国{くに}を遷{うつ}すに利{よろ}し。|中行。告公從。利用爲依遷國。','民の便利(海・河)のため都を遷す、私のためではない。先祖に告げて占い、吉が出れば従う。以て志を益す。'],
  ['九五','孚{まこと}有{あ}りて恵心{けいしん}あり。問{と}う勿{なか}れ。元吉{げんきつ}。孚{まこと}有{あ}りて我{わ}が徳{とく}を恵{めぐ}む。|有孚惠心。勿問元吉。有孚惠我德。','真心から民を恵む天子は占う必要なし。大いに志を得。'],
  ['上九','之{これ}を益{ま}す莫{な}し。或{あるい}は之{これ}を撃{う}つ。心{こころ}を立{た}つること恒{つね}勿{な}し。凶{きょう}。|莫益之。或擊之。立心勿恆。凶。','巽の極＝利市三倍の強欲な大臣、施さず集めるのみ、民の怨みで撃たれる。繋辞下「君子は其の身を安んじて後に動き、其の心を易くして後に語り、其の交わりを定めて後に求む」。悪い心を恒にするな。']
 ],
 hint:'<ul><li>増える・与える・投資の時。民(顧客・部下)を益せば自分も益す。</li><li>善を見れば遷り、過ちは改める。</li><li>施さずに集めるだけの強欲は撃たれる。</li></ul>',
 ks:'',
 all:'上を損して民を益す、農を本とする卦。凶年に官倉を開き、強欲な大臣は撃たれる。'
});

H({n:43, name:'沢天夬', kana:'たくてんかい', tri:'兌乾', theme:'奸臣を決し去る',
 k:'夬{かい}は王庭{おうてい}に揚{あ}ぐ。孚{まこと}あって号{さけ}ぶ。厲{あやう}き有{あ}り。告{つ}ぐること邑{ゆう}よりす。戎{じゅう}に即{つ}くに利{よろ}しからず。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。|夬。揚于王庭。孚號有厲。告自邑。不利即戎。利有攸往。',
 kn:'夬は物を割き切り離す。上六＝小人の大臣(巧言令色、兌＝虎)を天下が共に撃ち切り離す。履卦が旋って夬になる。王庭に揚ぐ＝朝廷で大臣の罪を数え上げる。誠心で同志に呼びかけるが党派が多く危険。草莽の賢人は粗暴に兵を挙げず、各自の村邑の民を諭せ(維新の時も、血気の若者が騒ぐのはよくない)。剛決柔也、健にして説び、決して和す。急ぎ過ぎれば窮する(所尚乃窮也)。',
 d:'沢{たく}天{てん}に上{のぼ}るは夬{かい}なり。君子{くんし}以{もっ}て禄{ろく}を施{ほどこ}して下{しも}に及{およ}ぼし、徳{とく}に居{お}りては則{すなわ}ち忌{い}む。|象曰。澤上於天夬。君子以施祿及下。居德則忌。',
 dn:'沢が天に上れば必ず雨として下る。禄は中以上の賢人に、恩沢は下賤まで。居＝蓄えて施さない(史記「奇貨居くべし」の居)のは君として忌む。',
 y:[
  ['初九','前趾{ぜんし}に壮{さか}んなり。往{ゆ}きて勝{か}たざれば咎{とが}と為{な}す。|壯于前趾。往不勝爲咎。','草莽の血気の若者が勝算なく飛び出す。孫子「勝兵は先ず勝ちて後に戦いを求め、敗兵は先ず戦いて後に勝ちを求む」。'],
  ['九二','惕{おそ}れて号{さけ}ぶ。莫夜{ぼや}に戎{じゅう}有{あ}れども恤{うれ}うる勿{なか}れ。|惕號。莫夜有戎。勿恤。','乾の中、血気なく懼れて同志を呼び集め用心周到、夜襲にも憂えない。中道を得。'],
  ['九三','頄{きゅう}に壮{さか}んなり。凶{きょう}有{あ}り。君子{くんし}は夬夬{かいかい}として独{ひと}り行{ゆ}き、雨{あめ}に遇{あ}いて濡{ぬ}るるが若{ごと}し。慍{いか}らるる有{あ}れども咎{とが}无{な}し。|壯于頄。有凶。君子夬夬。獨行遇雨若濡。有慍无咎。','頄＝頬骨、怒りが顔色に出れば相手も警戒して凶。君子は心で決しても顔に出さず独り行い、上六と交わるふりをして時を見る。臆病者と誹られ濡れても咎なし。'],
  ['九四','臀{しり}に膚{はだえ}无{な}し。其{そ}の行{ゆ}くこと次且{ししょ}たり。羊{ひつじ}を牽{ひ}けば悔{くい}亡{ほろ}ぶ。言{げん}を聞{き}くも信{しん}ぜず。|臀无膚。其行次且。牽羊悔亡。聞言不信。','陽で陰位、兌の部分で決断なし。座れば尻が痛く、行けば躊躇する。羊は前に立って引くと戻るので後ろから追う＝勇士を先に立て後に付けば悔亡ぶ。しかし上六に取り込まれ言を聞いても信じない。聡明ならず。'],
  ['九五','莧陸{けんりく}夬夬{かいかい}たり。中行{ちゅうこう}なれば咎{とが}无{な}し。|莧陸夬夬。中行无咎。','莧陸＝三月に生える陰の草、食えば害あり、根まで除く(夬は三月の卦)。上六と密接して内心では撃ちたいのに進まず、賢人に迫られて義で撃つ。中未だ光いならず。'],
  ['上六','号{さけ}ぶ无{な}し。終{つい}に凶{きょう}有{あ}り。|无號。終有凶。','昨日の同類も今日は一人も助けない。終に長かる可からず。']
 ],
 hint:'<ul><li>決断・切断の時。ただし勝算なく飛び出さない。</li><li>怒りを顔に出さない。勇士を先に立てて後に付く。</li><li>禄・恩恵は下まで施す。溜め込むのは忌む。</li></ul>',
 ks:'',
 all:'天下が共に奸臣を決し去る卦。粗暴に兵を挙げず、朝廷で罪を揚げ、村邑を諭すのが正道。'
});

H({n:44, name:'天風姤', kana:'てんぷうこう', tri:'乾巽', theme:'思わず遇う・一陰の萌し',
 k:'姤{こう}は女{おんな}壮{さか}んなり。女{じょ}を取{めと}るに用{もち}うる勿{なか}れ。|姤。女壯。勿用取女。',
 kn:'初六の一陰が主(陽は皆賓)。五月、坤初六「履霜」と同じ萌し。姤は思いがけず遇う(約束せずに)。女壮＝長女(巽)、陰が次第に長じて陽を消す強い女。女から男を求めるのは不正。彖：天地相遇いて品物咸章らかなり。剛中正に遇えば天下大いに行わる＝「剛、中に遇いて正す」と読む：九五(剛)が九二(中)の賢人に遇い、初六の小人を抑え正す。姤の時義大いなるかな。',
 d:'天下{てんか}に風{かぜ}有{あ}るは姤{こう}なり。后{きみ}以{もっ}て命{めい}を施{ほどこ}し四方{しほう}に誥{つ}ぐ。|象曰。天下有風姤。后以施命誥四方。',
 dn:'風が天下を巡るように命令を四方に(巽＝斉える＝命令)。五月の風が古い腐葉を吹き払う＝旧弊を除き天下を新たに。',
 y:[
  ['初六','金柅{きんじ}に繋{つな}ぐ。貞{てい}にして吉{きつ}。往{ゆ}く攸{ところ}有{あ}れば凶{きょう}を見{み}る。羸豕{るいし}孚{まこと}に蹢躅{てきちょく}す。|繫于金柅。貞吉。有攸往。見凶。羸豕孚蹢躅。','金柅＝鉄の車止め＝九二が初六を繋ぎ止めて上に出さない。羸豕＝まだ小さく弱い豚、教えても性は変わらず跳ね回る。柔道牽くなり＝小人は巧言令色で同類を牽き連ねる。'],
  ['九二','包{くりや}に魚{うお}有{あ}り。咎{とが}无{な}し。賓{ひん}に利{よろ}しからず。|包有魚。无咎。不利賓。','包＝庖(台所、包犠氏＝庖犠)。魚＝初六(巽)、臭気と毒があるので自分の台所には置くが、賓客(他の陽)には出さない。義、賓に及ばず。'],
  ['九三','臀{しり}に膚{はだえ}无{な}し。其{そ}の行{ゆ}くこと次且{ししょ}たり。厲{あやう}けれども大{おお}いなる咎{とが}无{な}し。|臀无膚。其行次且。厲无大咎。','初六を求めるが九二に抑えられて落ち着かない。幸い小人に交わらずに済む。行くこと未だ牽かれず。'],
  ['九四','包{くりや}に魚{うお}无{な}し。起{た}てば凶{きょう}。|包无魚。起凶。','応ずる初六(魚)を九二に取られた。九二を撃てば凶。民に遠ざかる＝大臣が下の民から離れている。'],
  ['九五','杞{き}を以{もっ}て瓜{うり}を包{つつ}む。章{あや}を含{ふく}む。天{てん}より隕{お}つる有{あ}り。|以杞包瓜。含章。有隕自天。','杞＝柳の大木(五月に葉が茂る)＝九二、瓜＝初六(甘く人の好む＝小人)を葉で包み世に出さない。小人は夬の上六が天から降ってきたようなもの＝治乱は天運の循環。志、命を舎てず＝天命でも放置せず、人の力で天命を引き戻す(これが易の教え)。'],
  ['上九','其{そ}の角{つの}に姤{あ}う。吝{りん}なれども咎{とが}无{な}し。|姤其角。吝。无咎。','大臣が角突き合わせて小人と争う＝小人を抑える力を失った。恥ずべきだが時の勢い。上窮まりて吝。']
 ],
 hint:'<ul><li>思わぬ出会い。ただし相手の素性に注意。</li><li>小さな悪(小人)を最初に止めて増長させない。</li><li>命令・方針を四方に行き渡らせる。</li></ul>',
 ks:'彖伝「剛遇中正」は「剛、中に遇いて正す」と読む。',
 all:'五月の一陰が萌す卦。小人は種が尽きないので、金柅で止め、杞で包み、天命でも人力で引き戻す。'
});

H({n:45, name:'沢地萃', kana:'たくちすい', tri:'兌坤', theme:'聚まる・宗廟の祭',
 k:'萃{すい}は王{おう}有廟{ゆうびょう}に仮{いた}る。大人{たいじん}を見{み}るに利{よろ}し。亨{とお}る。貞{ただ}しきに利{よろ}し。大牲{たいせい}を用{もち}うれば吉{きつ}。往{ゆ}く攸{ところ}有{あ}るに利{よろ}し。|萃。王假有廟。利見大人。亨。利貞。用大牲吉。利有攸往。',
 kn:'萃は草が叢生する＝聚まる。上兌(沢)下坤(地)＝水が地上にあって草木が茂る。宗廟の祭り＝精神が聚まる(互体艮＝鬼神)。天子の廟は天下の廟で、四海の諸侯・珍物が聚まる。大牲＝牛羊豚。彖：順にして以て説び、剛中にして応ず、故に聚まる。其の聚まる所を観て天地万物の情見るべし(恩沢・潤いのある所に聚まる)。',
 d:'沢{たく}地{ち}に上{のぼ}るは萃{すい}なり。君子{くんし}以{もっ}て戎器{じゅうき}を除{おさ}め、不虞{ふぐ}を戒{いまし}む。|象曰。澤上於地萃。君子以除戎器。戒不虞。',
 dn:'人が多く集まれば争い・不測の事態が起こる。武器を手入れして(除＝修める)備えよ。',
 y:[
  ['初六','孚{まこと}有{あ}れども終{お}えず。乃{すなわ}ち乱{みだ}れ乃{すなわ}ち萃{あつ}まる。若{も}し号{さけ}べば一握{いちあく}して笑{わら}いを為{な}す。恤{うれ}うる勿{なか}れ。往{ゆ}けば咎{とが}无{な}し。|有孚不終。乃亂乃萃。若號。一握爲笑。勿恤。往无咎。','九五天子と九四大臣(艮で坤の民を止め権力を持つ)の二つに人心が分かれる。初六は応の九四に心が乱れる。同類を呼んで天子に聚まろうとすれば皆に笑われるが気にせず往け。其の志乱るるなり。'],
  ['六二','引{ひ}けば吉{きつ}にして咎{とが}无{な}し。孚{まこと}あれば乃{すなわ}ち禴{やく}を用{もち}うるに利{よろ}し。|引吉无咎。孚乃利用禴。','中正、九五に応じ初六・六三を引き連れて天子に聚まる。禴＝夏の祭、供物少なく(夏は腐る)精神で祭る。中未だ変ぜず。'],
  ['六三','萃如{すいじょ}たり嗟如{さじょ}たり。利{よろ}しき攸{ところ}无{な}し。往{ゆ}けば咎{とが}无{な}し。小{すこ}しく吝{りん}。|萃如嗟如。无攸利。往无咎。小吝。','九四に阻まれて嘆く。大臣に付けば利なし、往けば咎なし。私の心なら吝。上巽う＝上六と力を合わせる。'],
  ['九四','大吉{だいきつ}にして咎{とが}无{な}し。|大吉。无咎。','私心なく大なれば吉。位当たらず＝人民が大臣に聚まるべきではない(戒め)。'],
  ['九五','萃{あつ}むるに位{くらい}有{あ}り。咎{とが}无{な}し。孚{まこと}とせられざるもの、元永貞{げんえいてい}なれば悔{くい}亡{ほろ}ぶ。|萃有位。无咎。匪孚。元永貞。悔亡。','位によって聚まる。九四に半ば傾いて孚ならざる者もいるが、元永貞なら悔亡ぶ。大臣と争うな。志未だ光いならず。'],
  ['上六','齎咨{せいし}涕洟{ていい}す。咎{とが}无{な}し。|齎咨涕洟。无咎。','萃の極、散ぜんとするのを嘆く(涕＝目から、洟＝鼻から)。未だ上に安んぜず＝大臣が上位に安居せず、六三に下って共に挽回する。']
 ],
 hint:'<ul><li>人や物が集まる時。不測の事態(争い・事故)に備える。</li><li>誰に集まるか(正統の主か実力者か)を見極める。</li><li>供え物は少なくても誠で。</li></ul>',
 ks:'俗本は「萃亨」とするが、古本は「萃、王仮有廟」で「亨」は後に置く。',
 all:'宗廟の祭りに天下の精神が聚まる卦。人心が天子と権臣に分かれる危うさも示す。'
});

H({n:46, name:'地風升', kana:'ちふうしょう', tri:'坤巽', theme:'昇る・皇太子の即位',
 k:'升{しょう}は元{おお}いに亨{とお}る。用{もっ}て大人{たいじん}を見{み}る。恤{うれ}うる勿{なか}れ。南征{なんせい}すれば吉{きつ}。|升。元亨。用見大人。勿恤。南征吉。',
 kn:'升は上る・進む(昇と同じ)。上坤(地)下巽(陰木)、互体震(陽木)＝地中から木が生えて天を貫くまで伸びる。蠱と同じく震＝長子＝皇太子が位に即く卦。大人＝六五、南征＝南面の位に即く(巽＝四月→離＝南→坤)。彖：柔時を以て升り、巽いて順い、剛中にして応ず。南征して吉、志行わる＝皇統一系の心を継ぐ。',
 d:'地中{ちちゅう}に木{き}を生{しょう}ずるは升{しょう}なり。君子{くんし}以{もっ}て徳{とく}に順{したが}い、小{しょう}を積{つ}みて以{もっ}て高大{こうだい}にす。|象曰。地中生木升。君子以順德。積小以高大。',
 dn:'坤＝順・小、小を積んで高大に(巽＝高)。',
 y:[
  ['初六','允{まこと}に升{のぼ}る。大吉{だいきつ}。|允升。大吉。','若い皇太子、允＝誠・信。上と志を合わす。'],
  ['九二','孚{まこと}あれば乃{すなわ}ち禴{やく}を用{もち}うるに利{よろ}し。咎{とが}无{な}し。|孚乃利用禴。无咎。','剛中、禴＝夏の祭(巽＝夏)、精神で神も感ず。喜び有り。'],
  ['九三','虚邑{きょゆう}に升{のぼ}る。|升虛邑。','虚邑(坤)＝民が逃げ去った治め難い邑に升り、巽で旧弊を除いて治める。疑う所无し＝謙順で天子と紛らわしい疑いがない。'],
  ['六四','王{おう}用{もっ}て岐山{きざん}に亨{まつ}る。吉{きつ}にして咎{とが}无{な}し。|王用亨于岐山。吉无咎。','乾九四「或躍」と同じ。天子が皇太子を用いて岐山(西、互体兌)で天を祀らせる。順事なり。'],
  ['六五','貞{てい}にして吉{きつ}。階{かい}に升{のぼ}る。|貞吉。升階。','歴代(郝敬ら、周易折中)は五を臣の極(伊尹・周公)や武王・舜の即位とするが誤り。五は必ず君位、階を升る＝皇太子の即位。書経顧命：成王が崩じ召公が遺命を伝え、康王は「眇眇たる予末小子」と再拝、諸侯は「義として徳を嗣ぐ」＝長子は義として嗣ぐ。大いに志を得＝皇統一系を汚さぬよう学徳を積んだ志を遂げる。'],
  ['上六','冥{くら}くして升{のぼ}る。息{や}まざるの貞{てい}に利{よろ}し。|冥升。利于不息之貞。','乾上九「亢龍」と同じ、暗くなるまで升り続けるな。消えて富まず＝天下の富を失う。']
 ],
 hint:'<ul><li>昇進・成長・地位が上がる時。小さなことを積み重ねて高大に。</li><li>後継者が跡を継ぐ。</li><li>暗くなるまで昇り続けない。止まる所を知る。</li></ul>',
 ks:'六五を臣の極(伊尹・周公)や武王・舜の即位とする郝敬・周易折中は誤り。五は必ず君位で、皇太子の即位。',
 all:'地中の木が天を貫くように皇太子が位に升る卦。「義として徳を嗣ぐ」長子相続の理を説く。'
});

H({n:47, name:'沢水困', kana:'たくすいこん', tri:'兌坎', theme:'窮しても志を遂げる',
 k:'困{こん}は亨{とお}る。貞{てい}なる大人{たいじん}は吉{きつ}にして咎{とが}无{な}し。言{げん}有{あ}れども信{しん}ぜられず。|困。亨。貞大人吉。无咎。有言不信。',
 kn:'困は不足して尽き苦しむ。上兌(沢)下坎(水)＝堤の底から水が漏れて尽きる。説文「故廬也」＝古い家。困難に遭って奮発すれば亨る(孟子「天将に大任を是の人に降さんとするや、必ず先ず其の心志を苦しむ」)。九二＝坎の中＝通ず。言有れども信ぜられず＝小人に陥れられた時(二陰の中の一陽)弁解しても信じられないので、争わず時を待て。荀子宥坐：孔子が陳蔡で七日絶食、子路「君子も亦窮すること有るか」→「君子固より窮す、小人窮すれば斯に濫る」。学問は通ずるためでなく、窮して困しまず、憂えて意衰えぬため。困しんで其の亨る所を失わざるは、其れ唯君子か。',
 d:'沢{たく}に水{みず}无{な}きは困{こん}なり。君子{くんし}以{もっ}て命{めい}を致{いた}し志{こころざし}を遂{と}ぐ。|象曰。澤无水困。君子以致命遂志。',
 dn:'天の命じた性(道徳)をどこまでも運び、平生の志を困難でも屈せず遂げる。',
 y:[
  ['初六','臀{しり}株木{しゅぼく}に困{くる}しむ。幽谷{ゆうこく}に入{い}りて三歳{さんさい}覿{み}えず。|臀困于株木。入于幽谷。三歲不覿。','君子を困めた小人が、後に九二が大臣になると逆に困しむ。株木＝木の根の凸凹に尻を据える痛さ。幽谷に入って三年世に出られない。幽にして明らかならず。'],
  ['九二','酒食{しゅしょく}に困{くる}しむ。朱紱{しゅふつ}方{まさ}に来{きた}らんとす。用{もっ}て亨祀{きょうし}するに利{よろ}し。征{ゆ}けば凶{きょう}なれども咎{とが}无{な}し。|困于酒食。朱紱方來。利用亨祀。征凶。无咎。','小人に挟まれ朝夕の食にも困る賢人。朱紱＝天子の朱の蔽膝＝天子自ら聘する(劉備が孔明を三顧した如し)。自分から出ようとせず誠を尽くせ(祭りのように精神で)。中にして慶び有り。'],
  ['六三','石{いし}に困{くる}しみ、蒺藜{しつり}に拠{よ}る。其{そ}の宮{いえ}に入{い}りて其{そ}の妻{つま}を見{み}ず。凶{きょう}。|困于石。據于蒺藜。入于其宮。不見其妻。凶。','困＝柳が水を好み水に没して枯れる。欲深い六三が九五に近づこうとして九四の大臣(石)に阻まれ、九二の朋友(坎＝蒺藜＝茨)にも頼れず、家に帰れば妻も去った。繋辞下で孔子：困るべからざる所で困るのは学問・徳がないから、名必ず辱められ身必ず危うし。'],
  ['九四','来{きた}ること徐徐{じょじょ}たり。金車{きんしゃ}に困{くる}しむ。吝{りん}なれども終{お}わり有{あ}り。|來徐徐。困于金車。吝有終。','応の初六(小人)が救いを求め、九四は往こうとするが用心して徐々に。金車＝九二の賢人が大臣の小人への傾きを責める→交わりを断って終わりを遂げる。志下に在り。'],
  ['九五','劓刖{ぎげつ}す。赤紱{せきふつ}に困{くる}しむ。乃{すなわ}ち徐{おもむろ}に説{よろこ}び有{あ}り。用{もっ}て祭祀{さいし}するに利{よろ}し。|劓刖。困于赤紱。乃徐有說。利用祭祀。','明君が初六の足を刖り、六三の鼻を劓る＝小人を刑して除く。赤紱＝九二の賢人を用いるのに苦労したが、急がず徐々に悦ぶ。祭祀のように誠で賢人を感ぜしめよ。'],
  ['上六','葛藟{かつるい}に困{くる}しみ、臲卼{げつごつ}に困{くる}しむ。曰{いわ}く、動{うご}けば悔{く}ゆと。悔{くい}有{あ}りて征{ゆ}けば吉{きつ}。|困于葛藟。于臲卼。曰動悔。有悔征吉。','巧言令色の小人大臣が六三と葛の蔓のように引き合う。臲卼は不安定。動けば悔あり、悔いて改め小人と交わりを断てば吉。易に「悔」の字が多いのは悔いて改めることを貴ぶから、負け惜しみで改めないのは吝。']
 ],
 hint:'<ul><li>窮乏・困難の時。争わず、弁解せず時を待つ。</li><li>志を曲げない(致命遂志)。</li><li>悔いて改めれば困から出られる。</li></ul>',
 ks:'',
 all:'水の漏れた沢の卦。君子は窮しても困しまず、小人は窮すれば濫れる。困は「徳の弁」(繋辞下)＝真の徳者と偽善者が分かれる時。'
});

H({n:48, name:'水風井', kana:'すいふうせい', tri:'坎巽', theme:'井戸・尽きぬ道徳',
 k:'井{せい}は邑{ゆう}を改{あらた}めて井{せい}を改{あらた}めず。喪{うしな}う无{な}く得{う}る无{な}し。往来{おうらい}井{せい}を井{せい}とす。汔{ほとん}ど至{いた}らんとして亦{ま}た未{いま}だ井{せい}に繘{つるべなわ}せず。其{そ}の瓶{かめ}を羸{やぶ}る。凶{きょう}。|井。改邑不改井。无喪无得。往來井井。汔至亦未繘井。羸其瓶。凶。',
 kn:'井戸は水を汲み上げて人を養う。水ほど功徳あるものはない。井＝人の道徳(開闢以来変わらず、汲んでも減らず汲まずとも溢れない)。邑は時々移しても水脈のある井戸は動かさない。汔至亦未繘井＝地を掘って泉に至っても釣瓶で汲み上げなければ役に立たない＝学問で性の善を掘り出しても、朝廷に薦め挙げる人(釣瓶)が必要。其の瓶を羸る＝賢人を薦めた者を小人が害す。彖：水に巽いて水を上ぐるは井なり(巽＝木の釣瓶)、井は養いて窮まらず。',
 d:'木上{もくじょう}に水{みず}有{あ}るは井{せい}なり。君子{くんし}以{もっ}て民{たみ}を労{ろう}し相{たす}くるを勧{すす}む。|象曰。木上有水井。君子以勞民勸相。',
 dn:'農業が最大の養い。労(坎＝労卦)＝民を勤労させ、勧＝励まし褒め、相＝凶年に官が種や人夫を配り助ける。井田法：中央の公田と八家、各屋敷に井戸。',
 y:[
  ['初六','井{せい}泥{どろ}にして食{くら}われず。旧井{きゅうせい}禽{とり}无{な}し。|井泥不食。舊井无禽。','泥の井＝掃除しない古井戸(周では四季に井戸浚えと改火をした)。人も学問しなければ物欲で性に垢が溜まる。禽も寄り付かない＝誰も交わらない。'],
  ['九二','井谷{せいこく}鮒{ふな}に射{そそ}ぐ。甕{かめ}敝{やぶ}れて漏{も}る。|井谷射鮒。甕敝漏。','水はあるが釣瓶が破れて漏れ、井戸の底の小魚を潤すだけ＝登用を妨げられ、つまらぬ者の相手。与する无し。'],
  ['九三','井{せい}渫{さら}えども食{くら}われず。我{わ}が心{こころ}の惻{いた}みと為{な}る。用{もっ}て汲{く}む可{べ}し。王{おう}明{めい}なれば並{なら}びに其{そ}の福{さいわい}を受{う}けん。|井渫不食。爲我心惻。可用汲。王明。並受其福。','浚えて清潔な井戸なのに誰も飲まない＝賢人が用いられない。通りがかる旅人も惜しむ。王が明なら挙げて天下が福を受ける。'],
  ['六四','井{せい}甃{しゅう}す。咎{とが}无{な}し。|井甃。无咎。','井戸の内側を瓦で積んで泥が入らぬようにする＝徳を磨いた後も邪を防ぐ(乾文言「閑邪存其誠」)。井を修むるなり。'],
  ['九五','井{せい}冽{きよ}くして寒泉{かんせん}食{くら}わる。|井冽寒泉食。','冽＝清く冷たい。堯舜のような明君の徳が泉のように湧き、天下が受ける。中正なり。'],
  ['上六','井{せい}収{く}みて幕{おお}う勿{なか}れ。孚{まこと}有{あ}りて元吉{げんきつ}。|井收勿幕。有孚元吉。','収＝汲み上げの完成。蓋(幕)をせず広く人に飲ませよ。元吉上に在り、大いに成るなり。']
 ],
 hint:'<ul><li>基盤・本業・動かないもの。定期的に浚って清める。</li><li>人材は推挙されて初めて生きる。推す人を得よ。</li><li>良いものは蓋をせず広く分け与える。</li></ul>',
 ks:'',
 all:'尽きぬ道徳を井戸にたとえる卦。掘り当てた賢人を汲み上げる釣瓶(推挙者)の大切さを説く。繋辞下「井は徳の地」。'
});
H({n:49, name:'沢火革', kana:'たくかかく', tri:'兌離', theme:'革める・已むを得ぬ革命',
 k:'革{かく}は已日{いじつ}にして乃{すなわ}ち孚{まこと}とせらる。元{おお}いに亨{とお}る、貞{ただ}しきに利{よろ}し。悔{くい}亡{ほろ}ぶ。|革。已日乃孚。元亨利貞。悔亡。',
 kn:'革は獣皮を改める、金を火で改める(書経「金を従革と曰う」)。火(離)で金(兌)を革める。井が古くなれば浚うように世の悪弊を改める、その最大が革命。已日乃孚：已(つちのと)＝十干の半ばを過ぎた日＝革めねばならない勢いが半ばを過ぎ、抑えても抑えきれず、天下が皆信じてから行う。彖：水火相息む(相滅ぼす、既済の逆)、二女同居して其の志相得ず。湯武命を革め、天に順い人に応ず：湯王が革命の始まり。書経湯誓「台小子敢て乱を称ぐるに非ず」＝好んでではない。湯は三千諸侯を集め玉璽を玉座に置き、三度譲って即位した。しかし君臣の名分から言えば賊に相違なく(史記儒林伝の轅固生と黄生の論争：黄生「冠は敝れても必ず頭に、履は新しくとも必ず足に」)、孔子も罪する意がある(書経「成湯…惟れ慙徳有り」、論語「武は美を尽くせり、未だ善を尽くさず」)。',
 d:'沢中{たくちゅう}に火{ひ}有{あ}るは革{かく}なり。君子{くんし}以{もっ}て暦{れき}を治{おさ}め時{とき}を明{あき}らかにす。|象曰。澤中有火革。君子以治歷明時。',
 dn:'火気で物が変化する。暦を治めて時を明らかにする(夏の寅正、殷の丑正、周の子正)。',
 y:[
  ['初九','鞏{かた}むるに黄牛{こうぎゅう}の革{かわ}を用{もち}う。|鞏用黃牛之革。','革命の論が出始めても、黄牛の革で固く繋ぎ止めて抑えよ(遯六二と同じ)。以て為す有る可からず。'],
  ['六二','已日{いじつ}にして乃{すなわ}ち之{これ}を革{あらた}む。征{ゆ}けば吉{きつ}にして咎{とが}无{な}し。|已日乃革之。征吉。无咎。','坤から来た中＝戊己の己(土)。天下が「湯・武なら私心なく我々のために」と信じ推し立てて初めて行う。行けば嘉き有り。'],
  ['九三','征{ゆ}けば凶{きょう}。貞{てい}なれども厲{あやう}し。革言{かくげん}三{み}たび就{な}りて孚{まこと}有{あ}り。|征凶。貞厲。革言三就。有孚。','革命の後は深追いするな。湯は逃げた桀を追わず師を返した。武王の時も紂の兵が逆に紂を攻め、紂は自ら焼身し、党類は伐たなかった。革言三就＝三度迫られて已むを得ず(国語「庶民忍びず、武王を欣戴す」)。又何くにか之かん。'],
  ['九四','悔{くい}亡{ほろ}ぶ。孚{まこと}有{あ}りて命{めい}を改{あらた}む。吉{きつ}。|悔亡。有孚改命。吉。','伊尹・太公望のような輔佐の臣が命を改める。志を信ずるなり＝天下が湯武の志(身を不義に陥れても民のため)を信ずる。'],
  ['九五','大人{たいじん}虎変{こへん}す。未{いま}だ占{うらな}わずして孚{まこと}有{あ}り。|大人虎變。未占有孚。','大臣(兌＝虎、履の虎)が変じて天子となる。占うまでもなく天下が信ずる。其の文炳らかなり。'],
  ['上六','君子{くんし}豹変{ひょうへん}す。小人{しょうじん}は面{おもて}を革{あらた}む。征{ゆ}けば凶{きょう}。貞{てい}に居{お}れば吉{きつ}。|君子豹變。小人革面。征凶。居貞吉。','君子(上の役人)が正朔・服色・旗・車の制度まで細かく改める＝豹変。小人は面(外面)だけ改めて心は服さない。周は殷の頑民が何度背いても罰せず諭した(書経洛誥・多士)。征けば凶、居て正しく諭せ。']
 ],
 hint:'<ul><li>改革・変更の時。ただし急がず、三度迫られてから已むを得ず行う。</li><li>改めた後は深追いしない。</li><li>外面だけ改める者(革面)に注意し、罰せず諭す。</li></ul>',
 ks:'湯武放伐も、君臣の名分からは賊に相違ない(慙徳・未尽善)。已むを得ぬ場合の順天応人としてのみ認める。',
 all:'世の悪弊を改める卦。根本は革命を肯定せず、湯武の慙徳を強調し、革命の後も皇統一系に戻るべきことを鼎で説く。'
});

H({n:50, name:'火風鼎', kana:'かふうてい', tri:'離巽', theme:'天下の宝器・調和の政',
 k:'鼎{てい}は元{おお}いに吉{きつ}にして亨{とお}る。|鼎。元吉亨。',
 kn:'鼎は天下の宝器で、日本の三種の神器にあたる。釜で煮た肉を鼎に移して五味を調和する＝誰が食べても喜ぶ＝天子の政(自分だけよいと思っても民が喜ばねば不可)。宰相の宰は肉を切り盛る料理人。古は一鼎、黄帝が三鼎(三才)、夏の禹が九鼎(九州)。革命しても一旦君となった上は再び皇統一系に戻らねばならない(序卦「器を主る者は長子に若くは莫し」)。彖：鼎は象なり＝六十四卦で「象」と言うのは鼎だけ、卦形が鼎そのもの(初＝足、二〜四＝腹の実、五＝耳、上＝鉉)。木を以て火に巽れ、亨飪するなり(文火・武火の調和)。聖人亨して以て上帝を享り、大いに亨して以て聖賢を養う。',
 d:'木上{もくじょう}に火{ひ}有{あ}るは鼎{てい}なり。君子{くんし}以{もっ}て位{くらい}を正{ただ}し命{めい}を凝{な}す。|象曰。木上有火鼎。君子以正位凝命。',
 dn:'凝＝定める・成す。天より受けた命を定めて成し遂げる。',
 y:[
  ['初六','鼎{かなえ}趾{あし}を顛{さかしま}にす。否{わる}きを出{い}だすに利{よろ}し。妾{しょう}を得{え}て其{そ}の子{こ}を以{もっ}てす。咎{とが}无{な}し。|鼎顛趾。利出否。得妾以其子。无咎。','鼎を逆さにして中の垢(否＝悪)を出す＝革命で天下の不潔を除く。本妻に子がなければ妾の子を立ててでも皇統一系に戻す。未だ悖らず、以て貴きに従う。'],
  ['九二','鼎{かなえ}に実{じつ}有{あ}り。我{わ}が仇{あだ}疾{や}む有{あ}り。我{われ}に即{つ}く能{あた}わず。吉{きつ}。|鼎有實。我仇有疾。不我能即。吉。','実＝学徳ある賢人(二三四の乾)。仇＝初六(上を犯そうとする小人)が妬むが、賢人の群に阻まれて近づけない。之く所を慎むなり。'],
  ['九三','鼎{かなえ}の耳{みみ}革{あらた}まる。其{そ}の行{ゆ}き塞{ふさ}がる。雉{きじ}の膏{あぶら}食{くら}われず。方{まさ}に雨{あめ}ふらんとして悔{くい}を虧{か}く。終{つい}に吉{きつ}。|鼎耳革。其行塞。雉膏不食。方雨虧悔。終吉。','木(巽)の上に火(離)が盛んで鼎が耳まで赤熱して持ち運べない＝革命後に旧臣が服さないからと猛烈な政を行う→雉の膏も焦げて食えない。雨(水)で冷ます＝寛めれば吉。其の義を失う。'],
  ['九四','鼎{かなえ}足{あし}を折{お}り、公{こう}の餗{そく}を覆{くつがえ}す。其{そ}の形{けい}渥{あく}たり。凶{きょう}。|鼎折足。覆公餗。其形渥。凶。','大臣が私情で任に堪えぬ小人(初六)を用い、鼎の足が折れて公餗(八珍の料理＝万民を養う政)を覆す。繋辞下「徳薄くして位尊く、知小にして謀大に、力小にして任重し」。形渥＝刑剭、高官は刑場でなく屋内で人に見せず誅す。大臣でも必ず殺す(春秋で大臣を殺したのは楚の子玉だけ)。'],
  ['六五','鼎{かなえ}黄耳{こうじ}金鉉{きんげん}あり。貞{ただ}しきに利{よろ}し。|鼎黃耳金鉉。利貞。','天子が己を空しくして賢人の言を耳に容れる(黄＝中、金鉉＝九二の陽)。中以て実と為す。'],
  ['上九','鼎{かなえ}玉鉉{ぎょくげん}あり。大吉{だいきつ}にして利{よろ}しからざる无{な}し。|鼎玉鉉。大吉。无不利。','上九の大臣も天子の耳に直言を入れる(金鉉＝九二、玉鉉＝上九、ともに乾の象)。剛柔節あり＝陽で陰位、剛柔を程好く調和。']
 ],
 hint:'<ul><li>新体制・調和・料理・人を養う事業。</li><li>任に堪えない者を用いれば覆る。人選が命。</li><li>耳を開いて直言を容れる。猛烈な政は冷ます。</li></ul>',
 ks:'「鼎象也」＝卦形がそのまま鼎。九四の形渥は刑剭。',
 all:'革の後に天下を養う新しい器を定める卦。革命の後も皇統一系に戻るべきことを初六と序卦で説く。'
});

H({n:51, name:'震為雷', kana:'しんいらい', tri:'震震', theme:'長子・恐懼して修省す',
 k:'震{しん}は亨{とお}る。震{しん}の来{きた}るとき虩虩{げきげき}たり。笑言{しょうげん}唖唖{あくあく}たり。震{しん}百里{ひゃくり}を驚{おどろ}かせども、匕鬯{ひちょう}を喪{うしな}わず。|震。亨。震來虩虩。笑言啞啞。震驚百里。不喪匕鬯。',
 kn:'鼎(神器)の後に震＝序卦「器を主る者は長子に若くは莫し、故に之を受くるに震を以てす」。革命があっても皇統一系に引き戻すのが天の道。震＝皇太子、いかなる艱難にも忍耐力で踏み止まって継ぐ。初九が一卦の主。震来虩虩＝雷が激しく鳴り恐れ慎む(論語「迅雷風烈には必ず変ず」)。恐れ慎めば福を得る(困難で忍耐力が養われる)。後に安楽となり言葉に順序あり。匕鬯＝宗廟の祭で天子自ら行う二つ(匕＝大匙で釜から肉を鼎に移す、鬯＝香気の強い鬱鬯酒を地に注いで神を降ろす)。雷が百里を驚かしても匕鬯を落とさない胆力。出でて以て宗廟社稷を守り、以て祭主と為る可し＝天子存命中でも皇太子が祭主となれる。',
 d:'洊雷{せんらい}は震{しん}なり。君子{くんし}以{もっ}て恐懼{きょうく}して修省{しゅうせい}す。|象曰。洊雷震。君子以恐懼脩省。',
 dn:'洊＝重なる雷。恐れ懼れて身を修め省みる。',
 y:[
  ['初九','震{しん}の来{きた}るとき虩虩{げきげき}たり。後{のち}に笑言{しょうげん}唖唖{あくあく}たり。吉{きつ}。|震來虩虩。後笑言啞啞。吉。','卦全体の主(陽で陽位で正、九四は位不当)＝皇太子。恐れて福を致し、後に則有り。'],
  ['六二','震{しん}の来{きた}るとき厲{あやう}し。億{ああ}貝{たから}を喪{うしな}う。九陵{きゅうりょう}に躋{のぼ}る。逐{お}う勿{なか}れ。七日{なのか}にして得{う}。|震來厲。億喪貝。躋于九陵。勿逐。七日得。','下卦＝地、二爻＝地中の雷＝地震。国語周語：幽王二年、西周三川皆震い、伯陽甫「陽伏して出づる能わず、陰迫りて烝る能わず、是に於て地震有り」＝天子無道で陰陽が乱れる。地震の時は財産を捨てて高い丘陵(互体艮＝山)に逃れよ。持ち去られた物を追うな、七日(七日来復)で戻る(親戚・隣人が預かっている)。剛に乗る＝足下の雷。'],
  ['六三','震{しん}蘇蘇{そそ}たり。震{しん}行{ゆ}きて眚{わざわい}无{な}し。|震蘇蘇。震行无眚。','蘇蘇＝尽きる、雷が衰え通り過ぎる。位当たらず＝心は安んじない。'],
  ['九四','震{しん}遂{つい}に泥{なず}む。|震遂泥。','遂＝墜。上の雷が泥(互体坎＝水、坤＝土)に墜ちて震えない＝陽で陰位、気力弱く安楽に耽る皇太子。付き人が悪いと遊び回らせる→古は第一等の人物を皇太子の付き人に選んだ。未だ光いならず。'],
  ['六五','震{しん}往来{おうらい}して厲{あやう}し。億{ああ}喪{うしな}う无{な}く事{こと}有{あ}り。|震往來厲。億无喪有事。','雷が往来して危ういが、天子(即位した皇太子)は身が裂けても執る事(祭祀・政)を失わない。臣(六二)は財を捨ててもよいが天子は位を捨てて逃げてはならぬ。億＝噫。其の事中に在り、大いに喪う无し。'],
  ['上六','震{しん}索索{さくさく}たり。視{み}ること矍矍{かくかく}たり。征{ゆ}けば凶{きょう}。震{しん}其{そ}の躬{み}に于{おい}てせず、其{そ}の鄰{となり}に于{おい}てす。咎{とが}无{な}し。婚媾{こんこう}言{げん}有{あ}り。|震索索。視矍矍。征凶。震不于其躬。于其鄰。无咎。婚媾有言。','索索＝尽きる、大臣が狼狽して見るもおぼつかない。雷が我が身に来る前、隣に来た時点で備えれば咎なし。婚媾(小人の同類)の「そんな馬鹿な」という言を信じるな。鄰を畏れて戒む。']
 ],
 hint:'<ul><li>驚き・衝撃・突発事。恐れて慎めば後に笑う。</li><li>地震・災害は財を捨てて高所へ。失った物は追わない。</li><li>隣に災いが来た時点で備える。</li></ul>',
 ks:'',
 all:'長子(皇太子)が恐懼修省して祭主となる卦。雷に驚いても匕鬯を落とさない胆力を説く。'
});

H({n:52, name:'艮為山', kana:'ごんいさん', tri:'艮艮', theme:'止まる・無欲',
 k:'其{そ}の背{せ}に艮{とど}まりて其{そ}の身{み}を獲{え}ず。其{そ}の庭{にわ}に行{ゆ}きて其{そ}の人{ひと}を見{み}ず。咎{とが}无{な}し。|艮其背。不獲其身。行其庭。不見其人。无咎。',
 kn:'艮は止(説卦)、震の逆さ。止まるべきでない所で止まる弊害もある。背中は動かず欲がない(目耳鼻口は前にある)＝世の欲に背を向ける。其の身を獲ず＝無欲で我が身がない。庭に出ても人が寄って来ない。荘子斉物論「今者吾れ我を喪う」は艮卦に拠る。無欲で求める所がなければ咎なし。彖：時止まれば則ち止まり、時行けば則ち行く、動静其の時を失わず、其の道光明なり(互体震＝行、艮＝時)。其の止まるに止まるは其の所に止まるなり(身分相当の所に止まる)。上下敵応して相与せず(初四・二五・三上がどれも応じない)。',
 d:'兼山{けんざん}は艮{ごん}なり。君子{くんし}以{もっ}て思{おも}うこと其{そ}の位{くらい}を出{い}でず。|象曰。兼山艮。君子以思不出其位。',
 dn:'二つの山が並んで対立し交わらない。自分の位の外のことを思わない(艮＝門、外へ出ない)。',
 y:[
  ['初六','其{そ}の趾{あし}に艮{とど}まる。咎{とが}无{な}し。永貞{えいてい}に利{よろ}し。|艮其趾。无咎。利永貞。','最初に動く趾を止めて世に出ない。未だ正を失わず(九三は正を失う)。'],
  ['六二','其{そ}の腓{こむら}に艮{とど}まる。拯{すく}わずして其{そ}れ随{したが}う。其{そ}の心{こころ}快{こころよ}からず。|艮其腓。不拯其隨。其心不快。','腓(ふくらはぎ)は自分では動かない。随う九三(卦主)が往くべき時に往かず過つのを救えない(九三は剛情で諫めを聴かない)。未だ退きて聴かず。'],
  ['九三','其{そ}の限{こし}に艮{とど}まる。其{そ}の夤{せじし}を列{さ}く。厲{あやう}くして心{こころ}を薫{や}く。|艮其限。列其夤。厲薰心。','限＝腰＝上下の境。夤＝背骨の中央(上下をつなぐ)。往くべき時なのに頑固に止まり、上下(君臣)の縁を裂く→身が危うく心を燻される。君臣は元首と股肱で一体。史記白起伝：秦昭王が邯鄲攻めを命じたが、白起は応侯と不仲で病と称して行かず、秦軍は大敗、何度頼まれても応じず剣を賜って自殺した＝「兵を用うること神の如し、然れども人臣の道を知らず」。'],
  ['六四','其{そ}の身{み}に艮{とど}まる。咎{とが}无{な}し。|艮其身。无咎。','身全体、背の無欲に止まる。諸を躬に止む。'],
  ['六五','其{そ}の輔{ほお}に艮{とど}まる。言{げん}に序{じょ}有{あ}り。悔{くい}亡{ほろ}ぶ。|艮其輔。言有序。悔亡。','輔＝頬骨。天子は妄りに口を利かず、言を慎めば順序あり。中正を以てなり。'],
  ['上九','敦{あつ}く艮{とど}まる。吉{きつ}。|敦艮。吉。','山の頂＝土が重なって厚い、厚く止まる。厚きを以て終わるなり。']
 ],
 hint:'<ul><li>止まる時。分(自分の立場)を越えて思わない。</li><li>無欲なら咎なし。言葉を慎む。</li><li>ただし往くべき時に頑固に止まれば、縁を裂いて身を危うくする。</li></ul>',
 ks:'曲礼「三諫して聴かれざれば逃る」は後世の誤り。天下の患は君臣の隔絶より大なるはなし(九三・白起の例)。この卦の後に「艮之八」論が付く(巻末参照)。',
 all:'止まるべき所に止まる無欲の卦。ただし九三のように往くべき時に止まるのは君臣の縁を裂く大過。'
});

H({n:53, name:'風山漸', kana:'ふうざんぜん', tri:'巽艮', theme:'順序を踏んで進む・女の帰ぐ',
 k:'漸{ぜん}は女{じょ}帰{とつ}ぐに吉{きつ}。貞{ただ}しきに利{よろ}し。|漸。女歸吉。利貞。',
 kn:'漸は進む、急がず一二三と順序立てて。上巽(木)下艮(山)＝山上の大木は目に見えずとも毎日成長し、千年で雲を貫く＝徳も少しずつ積む。鴻雁は水鳥で陰鳥だが陽に従う(秋に南へ、春に北へ)＝女が夫に従い、臣が君に仕える。婚礼に雁を用いる(奠雁)。女帰吉＝六礼を一年かけて順に行う。彖：進みて位を得、往きて功有り(九五)。進むに正を以てすれば以て邦を正す可し(先ず身を正して国を正す)。',
 d:'山上{さんじょう}に木{き}有{あ}るは漸{ぜん}なり。君子{くんし}以{もっ}て賢徳{けんとく}に居{お}りて俗{ぞく}を善{よ}くす。|象曰。山上有木漸。君子以居賢德善俗。',
 dn:'賢徳ある者を高所に据えて風俗を善くする。',
 y:[
  ['初六','鴻{こう}干{きし}に漸{すす}む。小子{しょうし}は厲{あやう}し。言{げん}有{あ}れども咎{とが}无{な}し。|鴻漸于干。小子厲。有言。无咎。','水鳥が水際(干＝岸)に出る＝下賤の者が初めて卑官に出る。若く応援もなく世間の小言があるが咎なし。義として咎なし。'],
  ['六二','鴻{こう}磐{いわ}に漸{すす}む。飲食{いんしょく}衎衎{かんかん}たり。吉{きつ}。|鴻漸于磐。飲食衎衎。吉。','大石の上＝九五天子に応じ禄を受けて安楽。衎衎＝裕か。素飽せず＝学徳・働きあっての禄で、ただ飽食するのではない(詩「素餐せず」)。'],
  ['九三','鴻{こう}陸{りく}に漸{すす}む。夫{おっと}征{ゆ}きて復{かえ}らず。婦{つま}孕{はら}みて育{そだ}てず。凶{きょう}。寇{あだ}を禦{ふせ}ぐに利{よろ}し。|鴻漸于陸。夫征不復。婦孕不育。凶。利禦寇。','陸＝山上の平地、剛で進み過ぎて戻らない。六四という不正な女(巽＝利市三倍、金ある男に付く)と配偶し、孕んでも育たない。左伝隠公八年：鄭の公子忽が陳の婦嬀を迎え、先に配してから祖廟に告げた→「是れ夫婦為らず、其の祖を誣う、礼に非ず、何を以て能く育たん」。正しくない配偶は我が身の寇、禦げ。'],
  ['六四','鴻{こう}木{き}に漸{すす}む。或{あるい}は其{そ}の桷{たるき}を得{う}。咎{とが}无{な}し。|鴻漸于木。或得其桷。无咎。','水鳥が木に止まるのは不安＝小人が利を貪って高位に。桷＝四角く平らな垂木のような枝に止まれば安し＝高振らず巽順に。順にして以て巽う。'],
  ['九五','鴻{こう}陵{おか}に漸{すす}む。婦{つま}三歳{さんさい}孕{はら}まず。終{つい}に之{これ}に勝{か}つ莫{な}し。吉{きつ}。|鴻漸于陵。婦三歲不孕。終莫之勝。吉。','陵＝山上の高所＝六二の賢人を大臣まで進める。九三・六四の小人が妨げて三年用いられないが、終に勝つ者なし。願う所を得。同人九五「二人心を同じくすれば其の利きこと金を断つ」。'],
  ['上九','鴻{こう}逵{き}に漸{すす}む。其{そ}の羽{はね}用{もっ}て儀{のり}と為{な}す可{べ}し。吉{きつ}。|鴻漸于逵。其羽可用爲儀。吉。','汚れた世を去って高く遁れた賢人。雁の列が順序正しく飛ぶ姿は礼儀の手本。乱す可からず＝禄位で誘惑しても乱せない(巽＝潔白)。']
 ],
 hint:'<ul><li>段階を踏めば成る。急がない。</li><li>結婚・就職は正式な手順で。順序を飛ばした縁は育たない。</li><li>小人に妨げられても三年待てば勝つ。</li></ul>',
 ks:'上九は「陸」ではなく「逵」(雲路＝高い空の道)の誤り。',
 all:'雁が順序正しく進むように、女が帰ぎ臣が仕える卦。手順を飛ばした配偶(九三)を戒める。'
});

H({n:54, name:'雷沢帰妹', kana:'らいたくきまい', tri:'震兌', theme:'妹を嫁がせる・控えめに',
 k:'帰妹{きまい}は征{ゆ}けば凶{きょう}。利{よろ}しき攸{ところ}无{な}し。|歸妹。征凶。无攸利。',
 kn:'上震(長男＝天子)下兌(少女＝妹)。天子が妹を諸侯に嫁がせる卦(六三＝妹、九四＝震の主＝諸侯)。征凶＝兌の主が巧言令色・笑顔で自ら男に取り入るのは凶、婚姻は男から求めるもの。彖：帰妹は天地の大義なり(孟子「男女室に居るは人の大倫なり」)。天地交わらずして万物興らず。帰妹は人の終始なり(親が終わり子が始まる)。説びて以て動く、帰ぐ所は妹なり。征けば凶、位当たらず。利しき攸无し、柔剛に乗る(三が二陽の上に乗る)。',
 d:'沢上{たくじょう}に雷{かみなり}有{あ}るは帰妹{きまい}なり。君子{くんし}以{もっ}て終{お}わりを永{なが}くし敝{やぶ}れを知{し}る。|象曰。澤上有雷歸妹。君子以永終知敝。',
 dn:'雷が動けば沢も動く(男が動き女が応ず)。終身を永くするには、始めを慎み後の弊害を知って防げ。',
 y:[
  ['初九','妹{いもうと}を帰{とつ}がしむるに娣{てい}を以{もっ}てす。跛{あしなえ}にして能{よ}く履{ふ}む。征{ゆ}けば吉{きつ}。|歸妹以娣。跛能履。征吉。','娣＝正夫人に付き添う妹(媵)。足一本のように正夫人を助けて履む、謙って。恒を以てす(終身)、吉にして相承く。'],
  ['九二','眇{すがめ}にして能{よ}く視{み}る。幽人{ゆうじん}の貞{てい}に利{よろ}し。|眇能視。利幽人之貞。','片目で見るように控えめに、奥に閉じ籠って(幽人)出しゃばらず、正夫人の命に従え。未だ常を変ぜず。'],
  ['六三','妹{いもうと}を帰{とつ}がしむるに須{す}を以{もっ}てす。反{かえ}りて帰{とつ}ぐに娣{てい}を以{もっ}てす。|歸妹以須。反歸以娣。','正夫人(兌の主)が九四の諸侯に嫁ぐ。寵愛を独占せず、娣と代わり番に夫の前に出る(娣が五度なら夫人は一度など)。自分の番でなければ早く帰って娣に代わらせる。'],
  ['九四','妹{いもうと}を帰{とつ}がしむるに期{き}を愆{あやま}つ。遅{おそ}く帰{とつ}ぐに時{とき}有{あ}り。|歸妹愆期。遲歸有時。','九四＝娶る諸侯。春の予定が遅れても秋を待つ。婚姻は秋霜から春の氷解までに行う(詩「士如し妻を帰らば、氷の未だ泮けざるに迨べ」)。待つ有りて行う＝礼を欠かさず悠々と。'],
  ['六五','帝乙{ていいつ}妹{いもうと}を帰{とつ}がしむ。其{そ}の君{くん}の袂{たもと}は其{そ}の娣{てい}の袂{たもと}の良{よ}きに如{し}かず。月{つき}望{ぼう}に幾{ちか}し。吉{きつ}。|帝乙歸妹。其君之袂。不如其娣之袂良。月幾望。吉。','天子の妹(正夫人＝君)は衣服を飾らず、娣より控えめに、寵愛を独占しない。月幾望＝十四日の月＝皇后より一等下る。其の位中に在り、貴きを以て行う。'],
  ['上六','女{おんな}筐{かご}を承{う}くるも実{じつ}无{な}し。士{し}羊{ひつじ}を刲{さ}くも血{ち}无{な}し。利{よろ}しき攸{ところ}无{な}し。|女承筐无實。士刲羊无血。无攸利。','上六は震の中の陰だが男(士)。六三(兌の主)の顔色・言葉に惹かれて一旦婚約したが嫌になる。結納の筐(竹かご)に中身がなく、宗廟に告げる羊を割いても血が出ない＝婚約が中途で破れる。虚筐を承くるなり。']
 ],
